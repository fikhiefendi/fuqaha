abstract: "ÖZETSAÜ Sosyal Bilimler Enstitüsü Yüksek Lisans Tez ÖzetiTezin Başlığı: Ebu'l-Leys es-Semerkandi Ve Mukaddimetü's-Salat simli Eserinin TahkikiTezin Yazarı: Ferit D NLER Danışman: Doç. Dr. H. Mehmet GÜNAYKabul Tarihi: 22.05.2006 Sayfa Sayısı: VI (ön kısım) + 142 (tez) + 13 (ekler)Anabilimdalı: Temel slam Bilimleri Bilimdalı: slam HukukuEbu'l-Leys es-Semerkandi'nin telif ettiği Mukaddimetü's-salat, Hanefi Mezhebi'nin fıkıhgörüşlerini yansıtır. Eser, ibadet konularının ilki olan namazı, onun ön hazırlığını oluşturantaharet ve abdest mevzularını, bazı temel akaid ve ahlak kurallarını ihtiva etmektedir. Elealdığı konular, daha çok halkın pratik ihtiyaçlarına yönelik klasik fıkıh eserlerinde pekrastlanmayan konulardır. Üslubu ve muhtevası gereği ibadet ilmihali olduğu anlaşılan kitap,ilmihal geleneğinin ilk nüvesini teşkil etmektedir.Eserde geçen bazı rivayetler, kitabın mam Muhammed'in Kitabu's-salat'ına mukaddimemaksadıyla yazıldığını göstermektedir. Ayrıca kitapta kullanılan tertibin geleneğe muhalifolması, kanaatimizce Ebu'l-Leys'in sözü edilen rivayetlere dair yorumundankaynaklanmaktadır.Eserde kullanılan sade ve kolay üslup, tasniflerdeki mükemmellik ve yoğun kaynak kullanımıdikkat çekicidir. Eserde konu ile ilgili kavramların tariflerinin yapıldığı; klasik fıkıhliteratüründe yaygın olarak kullanılan bazı kavramların farklı anlamlarda kullanıldığıgörülmektedir. Bunun yanında fıkhi meseleleri temellendirmek üzere kullanılan hadisleringenelde sahih rivayetler olduğu, buna karşılık zühd ve ahlaka dair konularda kimi zaman zayıfrivayetlere de başvurulduğu görülür.Kitabın müellif nüshasının günümüze ulaşması zayıf bir ihtimaldir. Tespit edebildiğimiz eneski nüsha Konya'da bulunan Uzluk nüshadır. Bunu, stanbul Ayasofya nüshaları takip eder.Eserin matbu bir nüshasıyla karşılaşılmamakla birlikte yazma nüshalarının fazlalığı dikkatçekicidir. Farklı metot ve üsluplarda sayısız şerhi bulunan kitabın, medrese, cami ve tekkelerdeyüzyıllarca okunduğu ve okutulduğu anlaşılmaktadır.Maveraünnehir bölgesinde h. IV. asırda telif edilen Mukaddimetü's-salat'ın, Türklerin slam'agirmeye başladıklarında karşılaştıkları ilk ilmihal olması kuvvetle muhtemeldir. Gerçekten deMüslüman Türklerin yaşadığı tüm coğrafi bölgelerde Mukaddimetü's-salat'a ait nüshalarınbulunması, esere Türkler tarafından çok önem verildiğini göstermektedir. Günümüzde HanefiMezhebi'nin Türkler arasında daha yaygın bulunmasında, bu eserin de katkısı olduğunudüşünmekteyiz."
