abstract: "Bu çalışma, 272 numaralı Derik Şer'iyye Sicil Defteri (H.1322-1327 / M.1905-1910) transkripsiyonu ve değerlendirmesidir. Çalışılan defterdeki belgeler, şehrin ailevi, sosyal ve ekonomik durumunu yansıtan konuları içermektedir. Bu konular; nikâh akdi (evlenme) ve boşanma, mehir, tereke, vesayet, kefalet gibi farklı toplumsal davaları kapsamaktadır. Ekonomik yaşamla ilgili olarak da miras paylaşım kayıtları, alışveriş, satış davaları, şehirde yapılan masraflarla ilgili bilgiler bulunmaktadır. Bölgenin yer adları ile Müslim-gayrimüslim şahıs veya ailelerin isimlerinin bu defterlerde yer alması, şehrin demografisi hakkında önemli ipuçları vermektedir. Böylece, o dönemde Diyarbekir vilayetinin bir kazası olan Derik özelinde, birinci el bir kaynağın yol göstericiliğinde şehir tarihçiliğine katkı sağlanmış olacaktır."
