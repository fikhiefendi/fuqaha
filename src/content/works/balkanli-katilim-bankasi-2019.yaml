abstract: "Türkiye'deki tarihi 1970'li yıllara uzanan ve dönemin ekonomik sorunlarına bir çözüm arayışı olarak ortaya çıkan katılım bankacılığı, Dünya üzerinde biraz daha eski bir geçmişe sahiptir. Esasen İslam inancının gereği olarak faizden sakınan kişilerin borçlanma ihtiyaçlarını karşılamak ve bir yandan da bu kişilerin birikimlerini finansal sisteme dahil ederek bir büyüme sağlamak amacıyla ortaya çıkmış olan katılım bankacılığı, bugün konvansiyonel bankacılık sistemine alternatif olabilen bir yapı haline gelmiştir. Petrol gelirleri sayesinde doğu ve körfez ülkelerinin elinde biriken sermaye ile her geçen gün daha da güçlenen katılım bankacılığı bugün finansın kalbi sayılan Londra dahil dünya geneline yayılmış bir modeldir. Kimi bankalar ana iştirak konusu olarak katılım bankacılığı yaparken kimileri de pencere sistemi denilen hem konvansiyonel hem de İslami bankacılığı bir arada sunan uygulamalar ortaya koymaktadır. Üstelik İslami finansal sistem sadece katılım bankacılığı alanında değil, sigortacılık alanında Tekafül uygulaması ve bireysel emeklilik çözümleri ile de inancı gereği konvansiyonel sistemden uzak duranlara finansal çözümler sunmaktadır. Araştırmamızın çıkış noktası, bu finansal çözümleri sunan bankaların müşterileri ile temas ettikleri noktalarda adeta müşteriye dokunan elleri olan katılım bankası çalışanlarıdır. Zira tepe yönetim tarafından alınan kararlar ne kadar sağlıklı ve denetim mekanizmaları ne kadar sağlam olursa olsun işin içinde insanın olduğu organizasyonlarda her zaman çizginin dışına çıkılma ihtimali söz konusudur. İşte bu çalışmamızda, İslami hassasiyetlerle hareket etmek üzere kurulmuş olan katılım bankası çalışanlarının İslami finans hassasiyetlerini araştırmaya çalıştık. Araştırmamızın ana kütlesi katılım bankalarında çalışan tüm personeller olmakla birlikte tüm bu kitleye ulaşmanın mümkün olmayacağı gerçeğinden hareketle, ülkemiz ekonomisinin en canlı olduğu Marmara Bölgesi'nde bulunan katılım bankalarının çalışanları örnek kitle olarak seçilmiş ve personellerle yapılan anket çalışması neticesinde elde edilen sonuçlar değerlendirilmiştir."
