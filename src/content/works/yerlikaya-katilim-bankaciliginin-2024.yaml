abstract: "Bankalar, özellikle gelişmekte olan piyasalarda finansman sağlanabilecek en önemli piyasa aktörlerinden birisidir. Bankalar, sundukları finansal enstrümanlara ve amaçlarına göre farklı şekillerde sınıflandırılmaktadır. Bankacılık türlerinden birisi olan katılım bankacılığı, İslam hukukunu temel alan bir anlayışa sahiptir. Buna göre faiz kavramını kullanmayan katılım bankaları, finansal enstrümanlara İslami bakış açısı getirerek diğer bankacılık türlerinden ayrılmaktadır. Literatürde katılım bankalarının finansal performanslarının farklı yöntem ve kriterlere göre ölçüldüğü görülmüştür. Bu çalışmada ise literatürden farklı olarak personel sayısı ve şube sayısı da dahil olmak üzere 12 kriterin TOPSİS yöntemi ile kullanılarak katılım bankalarının performansları ölçülmüştür. Bu kapsamda üç özel katılımda bankası olan Albaraka Türk, Kuveyt Türk ve Türkiye Finans ile üç kamu katılım bankası olan Ziraat Katılım, Vakıf Katılım ve Emlak Katılım olmak üzere altı katılım bankası incelemeye alınmıştır. 2019-2022 yıllarına ait veriler, Türkiye Katılım Bankaları Birliği web sitesinden temin edilmiştir. Çalışmada en yüksek performansa sahip bankanın Kuveyt Türk, en düşük performansa sahip bankanın ise Emlak Katılım bankası olduğu tespit edilmiştir. Vakıf Katılım'ın inceleme dönemi içerisinde performansını istikrarlı şekilde artırarak sıralamasını yükselttiği görülmüştür. Performansı yüksek bankaların ürün çeşitliliğini sağlayan, şube ve personel sayısı fazla olan bankalar olduğu değerlendirilmiştir."
