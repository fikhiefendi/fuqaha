abstract: "Kur'ân, haksız kazancı yalnızca ekonomik değil, ahlâkî, toplumsal ve hukukî yönleriyle ele alarak bütüncül bir çerçeve arz eder. Ribâ, rüşvet, yetim malı yemek, ölçü ve tartıda hile gibi yollarla ortaya çıkan bu olgu; bireysel çıkarın ötesinde sosyal adaletin, güvenin ve gelecek nesillerin haklarının korunmasını ilgilendirir. Bu nedenle Kur'ân hem bireysel hem kurumsal düzeyde insan onurunu ve toplumsal dengeyi korumayı hedefleyen evrensel ilkeler ortaya koyar. Haksız kazanç yalnızca dünyevî bir suç olarak değil, aynı zamanda uhrevî bir sorumluluk alanı olarak da değerlendirilir. Kur'ân, bireyleri bu tür davranışlardan sakındırırken, geçmiş toplumların ekonomik yozlaşma örneklerini kıssalarla aktarır ve böylece toplumsal hafızada kalıcı bir uyarı işlevi görür. Kaynakların adil paylaşımı ve dayanışmanın güçlendirilmesi bireylerin haklarını gözeten bir değerler sistemiyle temellendirilir. Bu yaklaşım, Kur'ân merkezli bir ekonomi anlayışının inşasını gerekli kılar. Klasik İslâm düşüncesinden beslenen bu yaklaşım, çağdaş dünyanın ekonomik ve sosyal sorunlarına evrensel ve sürdürülebilir çözüm önerileri sunar. Bireysel ahlâkî sorumlulukların yanı sıra toplumsal adaletin ve ekolojik dengenin korunmasını da esas alır."
