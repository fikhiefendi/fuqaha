abstract: "Aile, insanlık tarihinin başlangıcından beri var olagelmiş ve tarih boyu önemini ve varlığını koruyan, toplumun en temel yapı taşlarından biridir. İlkel olarak tanımlanan toplumlardan karmaşık yapılı modern toplumlara kadar ailenin olmadığı bir topluma rastlamak mümkün olmamıştır. Bu yüzden yüce kitabımız aile kurumuna çok büyük önem atfetmiştir. Aile hukuku hükümlerinin, vahye dayanma oranı diğer hukuk alanlarındaki vahye dayanma oranından daha fazladır. Belki de böyle olması, Allah (c.c.)'ın aile kurumuna verdiği büyük değerden kaynaklanmaktadır. İslam aile hukukunun gayesi; aile bireylerinden hiç kimsenin haksızlığa uğramadığı, kadın ve erkeğin fıtratı ve niteliklerinin gözetildiği, sevgi ve saygı temeline dayanan bir aile kurumu oluşturmak olmuştur. İslam'ın asli iki kaynağı Kur'an ve sünnet, Müslümanların elinde mevcuttur. Aile kurumunu bu iki kaynağa göre yaşamak ve hukukunu öğrenmek, her samimi Müslüman için bir görevdir. İşte biz de bu amaçla, esas kaynak olarak yararlandığımız müfessir ve hukukçu Elmalılı M. Hamdi Yazır'ın aile hukuku ile ilgili ayetlere getirdiği izahları ve tespitlerini ele almayı hedefliyoruz."
