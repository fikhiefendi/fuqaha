abstract: "?İslâm Hukukunda Uluslararası Uyuşmazlıkların Çözümünde Mukâbele Uygulamaları? başlıklı tezimizde, karşı önlemlerin bir çeşidini oluşturan ve ?misilleme?, ?zararla mukâbele? ve ?karşılıklılık? fiillerinden oluşan mukâbele uygulamalarını ele aldık.İslâm'ın ilk döneminden başlayarak örgütlü modern uluslararası hukuk öncesi döneme varıncaya kadar misilleme, zararla mukâbele ve karşılıklılık kavramlarının muhtevalarının neler olduğunu, nasıl uygulandıklarını ve sınırlandırıldıklarını İslâm hukuku literatürüne ve özellikle klasik kaynaklara dayanarak ortaya koymaya çalıştık. Sonuçta değişik başlıklar altında, bu üç kavramı karşılamak üzere birçok terimin kullanıldığını gördük. Dolayısıyla bu fiillerin tarihteki uygulanma biçimlerindeki benzeşme, kavramların birbiri yerine kullanılması ya da birinin diğerini ihtiva edebilecek genişlikte algılanması, kavram kargaşasına ve terminoloji sorununa yol açmıştır. Aynı zamanda mukayeseli bir inceleme olan araştırmamızda, modern uluslararası hukukta netlik kazanan mukâbele fiillerinin bu hukuk sistemindeki uygulama biçimlerine, her birinin diğerlerinden farklı yönlerine bakarak İslâm hukuku açısından kavramları bir ölçüde yerli yerine oturtmaya ve belli terimlerle karşılayarak terminoloji sorunu gidermeye çalıştık.Birinci bölümde, bir çözüm yolu ve yaptırım türü olarak mukâbele fiillerinin rolüne vurgu yapmak için, modern uluslararası hukukta uyuşmazlık kavramını ve çeşitlerini, uyuşmazlıkların çözüm yollarını ve yaptırım konusunu ele aldık.Araştırmamızın esasını teşkil eden ikinci bölümde, öncelikle, bahsi geçen mukâbele fiillerinin, ?mukâbele (karşılık verme)? ortak paydasında toplanabilme imkânından hareketle mukâbele uygulamaları kavramına bir tanım getirdik ve modern hukukçuların mukâbele uygulamalarına yaklaşımlarını ortaya koyduk. Ardından, mukâbele uygulamalarını tatbik ederken göz önünde bulundurulması gereken adalet, ahlak ve hakkaniyet ilkelerine değindik. Ve nihayet, üç ayrı mukâbele türünü tüm nitelikleriyle ortaya koyabilmek için etraflıca izah ettik.Üçüncü bölümde, Müslümanların, savaş ve barış ortamında yabancılara gösterecekleri muamele şekillerine dikkat çektikten sonra hakkın kötüye kullanılması yasağı bağlamında mukâbele uygulamalarını sınırlayan genel ilkeler tespit ettik. Modern hukukta olduğu gibi İslâm hukukunda da, uluslararası uyuşmazlıkların çözümü için başvurulan misilleme ve özellikle zararla mukâbele fiillerinin, taşıdıkları olumsuz niteliklerden ötürü tatbikinin mutlak olmadığı sonucuna vardık."
