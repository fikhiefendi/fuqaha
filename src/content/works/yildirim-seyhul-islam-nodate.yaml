abstract: "Bu çalışmada, hicrî IX. ve X. yüzyıllarda Mısır'da yaşamış; İslâmî ilimler başta olmak üzere aklî ve naklî birçok ilim dalında uzmanlaşmış, Şâfiî mezhebinin önde gelen fakîh ve kadılkudâtlarından biri olarak temayüz etmiş“Şeyhülislâm Zekeriyyâ el-Ensârî ve Fıkıhçılığı”incelenmektedir. Bu konunun seçilmesinin amacı, Ensârî'nin ilmî şahsiyetini, Şâfiî mezhebindeki saygın konumunu, ictihâd mertebesi ve fetvâdaki yerini, sonraki fukahâya etkisini ve fürû fıkha dair telif ettiği ihtisâr ve şerh türü eserlerinde öne çıkan hususları kapsamlı bir biçimde tespit etmektir. Nitel araştırma yöntemlerinden metin analiz tekniği kullanılarak hazırlanan bu çalışma, bir giriş, dört ana bölüm ve eklerden oluşmaktadır. Giriş bölümünde çalışmanın konusu, amacı, önemi, yöntemi, sınırları, kullanılan kaynakların ve konuyla ilgili daha önce yapılmış benzer çalışmalar analiz edilmektedir. Birinci bölümde, Ensârî'nin yaşadığı Memlükler döneminin siyasi, sosyal ve ilmî durumu irdelenmekte; ardından Ensârî'nin hayatı, ilmî şahsiyeti, hocaları, talebeleri ve eserleri hakkında ayrıntılı bilgiler sunulmaktadır. İkinci bölümde, Ensârî'nin Şâfiî mezhebindeki konumu ele alınarak onun ictihâd mertebesindeki yeri, mezhep içindeki fetvâ konumu, sonraki fukahâ üzerindeki etkisi ve ona atıfta bulunulurken kullanılan vasıflar detaylı olarak incelenmektedir. Üçüncü ve dördüncü bölümlerde, Ensârî'nin fürû fıkha dair ihtisâr ve şerh türü eserlerinde öne çıkan hususlar titizlikle incelenmektedir. Çalışma, araştırma neticesinde elde edilen bulguların yer aldığı sonuç bölümü, yararlanılan kaynakların listelendiği kaynakça ile İmam Şâfiî, Ensârî, onun hocalarından İbn Hacar el-Askalânî ve talebelerinden Abdülvehhâb eş-Şa'rânî'nin kabirlerinin fotoğraflarının yer aldığı eklerle sona ermektedir."
