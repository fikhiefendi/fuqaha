abstract: "ÖZET Kur'ân ve sünnette yiyecek ve içecekler geniş olarak ele alınmış; helal ve haram hükümleri konmuş, bunların bazısının illetleri açıklanmıştır. İslâm Hukuku ile ilgili eserlerde, yiyecek ve içecekler ile ilgili hükümler özel başlıklar altında ele alınmıştır. İslâm hukukçuları naslardan yiyecek ve içecekler ile ilgili hükümlerin dayandığı genel esasları ortaya koymuşlardır. İslâm Hukukunda yiyecek ve içecekler ile ilgili getirilen sınırlamaların çeşitli illetleri vardır. Temizlik, insan sağlığı, hayatın korunması, aklın korunması, insanlar arası düzenin korunması, kulluğun ifası, inanç farklılığı gibi. Naslara baktığımız zaman İslâmda yiyecek ve içecekler ile ilgili sınırların tespitine bu kadar önem verilmesinin çeşitli hikmetlerini bulabiliriz. Bunlardan biri insan fıtrat ve tabiatını korumaktır. Bir diğeri insanın bedenen ve ruhen en sağlıklı ve verimli hale ulaşmasıdır, insanın ibadetlerinde huşu ve huzur bulmasını temin etmektir. İslâm, müslümanın çeşitli alanlardaki faaliyetlerinin hükümlerini belirlerken inanç farkını dikkate aldığı gibi yiyecek ve içecekler alanındaki hükümlerde de bunu dikkate almıştır. Hatta bu konuda gayri müslimleri sahip oldukları inançlarının ve küfürlerinin niteliklerine göre farklı değerlendirmiştir. Ele alman konularda mezheplerin farklı görüşleri, mukayese yapılabilmesi için verilmiştir. Genel olarak Hanefi mezhebi esas alınmıştır. ıx"
