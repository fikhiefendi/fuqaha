abstract: "Anadolu'da örf ve Âdetlerin Oluşması ve Meşrulaşmasında Rivayetlerin Rolü (Düğün ve Nikah örneği), konulu çalışmamız dört bölümden oluşup, Anadolu kültürünün oluşması ve meşrulaştınlması aşamasında hadislerin etkisini araştırmaktadır. Toplumların örf ve âdetlerinin oluşmasında dinlerinin büyük etkisi görülmektedir. Anadolu toplumu büyük oranda müslüman nüfustan oluşmaktadır. Müslümanların dinleri hususunda müracaat ettikleri, Kur'an'dan sonra, temel kaynaklardan ikincisi Hz. Peygamber'in hadisleridir. Hadisler, müslüman toplulukların yaşam şekillerini belirleme konusunda en çok müracaat edilen kaynak olduğu için de örf ve âdetlerin temellerini oluşturmuştur. Çalışmamızın birinci bölümünde; konumuzla ilgili olan Kültür ve Medeniyet, örf ve Âdet, Meşrulaştırma, Din gibi temel kavramları işledik. İkinci bölümde; Eş seçimi ve dünür gitmeyle ilgili örf adetler ve ilgili rivayetleri inceledik. Üçüncü bölümde; Düğün ile ilgili örf adetler ve ilgili rivayetler yer alırken, Dördüncü bölümde; Nikah ile ilgili örf adetler ve onlara işaret eden rivayetler işlenmiştir. Sonuç bölümünde ise; çalışmanın genel değerlendirmesi yapılmıştır."
