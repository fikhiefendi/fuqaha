abstract: "Çalışma, Waqf projelerinin Filistinli ailenin ekonomik güçlendirilmesindeki rolünü belirlemeyi ve bu projeleri finanse etmek ve sürdürülebilirliklerini sağlamak için çağdaş İslami formülleri ve metotları sunma konusundaki önemini vurgulamayı amaçlıyordu Çalışma sorusu şu soruyu yanıtlamaktır: SQ1 Waq projelerinin Filistin ailesinin ekonomik güçlenişine katkısı ne derece? Aşağıdaki sorular bunun sonucudur: Soru 1 Waqf projelerinin finansmanı için uygun İslami formüller ve yöntemler nelerdir? S2 İsrail işgalinin hem Akfar ve hem Filistin ailesi üzerindeki etkisi nedir? İsrail yerleşimlerinde Filistinli kadın krizini çözmek için önerilen senaryo nedir? Çalışmanın amaçlarına ulaşmak için analitik nitel ve nitel yaklaşım kullanılmış, araştırmacı verileri derlemiş, analiz etmiş, ilgili literatürü gözden geçirmiş, yoğun röportajlar yürütmüş ve Filistinli kadınların çalışması için motif ve ihtiyaçlarını ölçmek için (60) maddeden oluşan bir anket hazırlamış, İsrail projelerinde istihdam edilen 55 kadından 50'si çalışma topluluğuna dağıtıldı. 48 anket, toplumun% 91'inde ve örneklemin%96'sındaalındı. Çalışmanın sonuçları Batı Şeria'da, Siyonist saldırılara çoğunlukla maruz yaklaşık (17558713) m 2 'lik bir alanda, içinde Vakıf özellikleri ve tarım sektörü segmentinde büyük olanları, ticaret ve kamu hizmetleri sektörü karşılığında yüksek yatırım yatırım olduğunu gösterdi ve sonuçlar Filistin hanelerin büyük segmenti yoksulluğu acı olduğunu gösterdi ve işsizlik İsrail işgali nedeniyle, istismar ve taciz riski koyarak, İsrail Adtarara- projelerin içine peso ve yerleşim inşasında çalışır ve Türkiye Filistin halkının ekonomik yaşamın gelişmesinde önemli bir rol. çalışmada ayrıca sonucuna varmıştır feminist sadaka kurulması Filistinli kadın ve aile işleri Sponsor ve performans ayrıntılarda Vakıf özelliklerinde kararlıdır. v"
