abstract: "İslâm Hukuku'nun medenî hukuk alanında ilk kanunlaştırma örneği Mecelle'dir. Mecelle yalnız ülkemizde değil, Tunus, Irak, İsrail, Fas gibi birçok ülkenin de medenî hukukunun oluşmasında ilham kaynağı olmuştur. Çalışmamızın konusunu“Yöneten ve Yönetilen Bağlamında Mecelle'nin 58. Maddesinin (Raiyye, Yani Teb'a Üzerine Tasarruf Maslahata Menûttur.) İncelenmesi”oluşturmaktadır. Tezimiz giriş ve iki bölümden oluşmaktadır. Devletin halk üzerindeki tasarruf hakkının sınırlarının belirlenmesi sonucunda günümüz uygulamalarının tarihi uygulamalarla bağını veya farklılıklarını görmektir. Çalışmamızın amacı İslam hukukuna göre yöneten ve yönetilen kavramlarının geçirdiği tarihsel süreci inceleyerek ilgili mecelle maddesinin günümüzde daha anlaşılır hale gelmesini sağlamak, oluşan maslahatı bir bakış açısıyla ortaya koymaktır. İslam hukukçularının bu konudaki çalışmalarına bir nebze olsun katkı sunmaktır."
