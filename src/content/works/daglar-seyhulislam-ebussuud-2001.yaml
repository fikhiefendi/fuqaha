abstract: "ÖZET Ebussuud Efendi (1490-1574), Osmanlı împaratorluğu'nun önde gelen şeyhülislâmlarından biridir. Sosyal ve siyasî alanda verdiği fetvalar yanında hukuk ve bilim alanında yaptığı düzenlemelerle de tanınan Ebussuud, din ve hukuk konularında bir çok eser vermiştir.“Şeyhülislâm Ebussuud Efendi'nin Türkçe Mektupları”isimli çalışmamızın amacı, yaptığı hizmetlerle Osmanlı kültür dünyasında etkili olmuş olan bu şeyhülislâmın duygu ve düşünce dünyasını, insanî ilişkilerini biraz daha aydınlatmaktır. Çalışmanın esası, Ebussuud'un, tespit edilebilen ve ulaşılabilen Türkçe mektuplarının biraraya getirilmesidir. Çeşitli kaynaklardan toplanan 100 mektubun metni çalışmanın“metin”bölümünde yer almaktadır."
