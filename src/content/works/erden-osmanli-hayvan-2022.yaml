abstract: "Son iki yüzyıldır olduğu gibi, hayvan hakları ve refahı konusu her geçen gün ilgi görmeye ve alanla ilgili gerek hukuki gerekse siyasi anlamda çalışmalar yapılmaya devam etmektedir. Alanla ilgili yapılan akademik çalışmalar hayvan hakları duyarlılığını en fazla iki yüzyıl öncesinden ve Amerika'dan ve/ya İngiltere'den başlatmaktadır. Bölge olarak dünyanın diğer bölgelerini, tarih olarak da daha önceki dönemleri adeta yok saymaktadırlar. Söz konusu bölgeler ve dönemlerle ilgili olarak yapılan çalışmaların azlığı onları haklı ve doğru gibi göstermektedir. Bu tezde, etkin olduğu coğrafya ve zaman diliminde birçok alanda örnek ve öncü konumunda olan Osmanlı Devleti'nin (ve toplumunun) hayvan hakları ve refahı bilinci/duyarlılığı alanında hangi seviyede ve konumda olduğu belgeler bağlamında, diğer kaynaklardan da yararlanılarak ortaya konulmaktadır. Bu işlem gerçekleştirilirken, aynı zamanda İslam Medeniyeti'nin, Türk Kültürü'nün ve Doğu toplumlarının konuya bakışı da tespit edilip değerlendirilmiş olacaktır. Çalışmanın Osmanlı döneminde hayvan hakları ve refahı bağlamında yapılanlarla ilgili olarak bir farkındalık oluşturma amacına hizmet etmesi ve ileride bu alana katkı sunmayı amaçlayan araltırmacılara ışık tutması hedeflenmektedir."
