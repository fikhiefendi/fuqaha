abstract: "İnsanlığın en önemli sorunlarından biri olarak kabul edilen yoksullukla mücadele, ekonomi politikalarının öncelikli hedefleri arasındadır. Bunun bir sonucu olarak artan gelir eşitsizliği, servet ve mülkiyetin tek bir elde toplanması, zengin ve fakir arasındaki uçurumun artması ve ekonomik istikrarsızlıklar ülkeler açısından endişe verici boyutlara ulaşmıştır. Ülke ekonomilerindeki bu problemler, özellikle yoksulluk ve fakirlikle mücadelede onu azaltacak mekanizmaların sorgulanmasına sebep olmuştur. Bugünkü ekonomik yapı ve sistemler mevcut sorunları daha da derinleştirmektedir. Dolayısıyla bu sorunları tam olarak ortadan kaldıracak ya da asgari düzeye indirecek mekanizmalara olan ihtiyaç daha da önemli hale gelmektedir. Bu noktada İslam iktisadının esasları, büyüyen mevcut sorunlara bakışı ve problemleri azaltmada kullandığı yöntemler önemli bir hale gelmiştir. Medine döneminde farz kılınan, Hz. Peygamber (S.A.V)'in önderliğinde müesseseleştirilen ve mali bir ibadet olan zekât, ekonomik işlevleriyle gelir ve nimet paylaşımında bazı dengeleri gözeten bir kurum olmuştur. Zekât, üretim boyutunda faktörlerinin verimli kullanılmasına yardımcı olurken, tüketim boyutunda ise gelir transferiyle hak sahibi bireylerin asli ihtiyaçları karşılanmasını, satın alma gücünü artırarak ekonomik eşitsizliklerin dengelenmesini ve toplumsal kalkınmayı desteklemektedir. Günümüzde bu sorunlarla mücadelede tamamlayıcı ve telafi edici bir fonksiyonu bulunan zekât, İslam ülkelerinde yoksulluğa tamamen son verecek düzeyde bir potansiyele sahip olduğu iddia edilebilir. Bu çalışmanın amacı, zekâtın tarihsel gelişimi ve ekonomik etkilerini incelemek, farklı ülke örneklerini karşılaştırarak Türkiye için vakıf temeline dayalı kurumsal bir model önerisinde bulunmaktır. Zekâtın kurumsal yapıya kavuşturulmasının gerekliliği ortaya konulurken, oluşturulması önerilen zekât kurumunun ekonomik etkileri, yapısı ve etkinleştirilmesine yönelik tedbirlere yer verilmiştir. Ayrıca zekât kurumlarının tarihsel gelişimi ve güncel uygulamaları karşılaştırmalı olarak analiz edilerek ülke örnekleri incelenmiş ve bazı politika önerilerine yer verilmiştir. Çalışmada literatür incelemesine dayalı nitel gözlem ile kavramsal analiz yöntemi kullanılmış, ayrıca zekâtın hesaplanması ve yaygınlaştırılması için kurulan dijital bir platformun içerik analizine yer verilmiştir. Tezin zekat konusunda Türkiye özelinde yapılacak saha çalışmalarına ve ampirik araştırmalara yol gösterici olması beklenmektedir."
