abstract: "IV ÖZET YÜKSEK LİSANS TEZİ İSLAM HUKUKUNDA EVLENME EHLİYETİ Veysel GÜNEŞ Danışman: Doç. Dr. H. İbrahim ACAR 2001 SAYFA: 69 Jüri: Prof. Dr. Mustafa BAKTIR Prof. Dr. Beşir GÖZÜBENLİ Bu çalışmada (tezde) ilk olarak evlenme ve evlenme şartları kısaca açıklandı. Sonra evlenme şartlarından birisi olan evlilik için ehil olma konusu incelendi. Evlenme ehliyeti genel akit ehliyetine dayandığı için, kısaca ehliyetin ne olduğu ve ehliyeti daraltan yada ortadan kaldıran arızalar işlendi. Daha sonra evlenme ehliyeti akit ehliyeti üzerine bina edildi. Bu konuya Kur' an ve sünnet açısından bakıldı ve mezheplerin görüşü de belirtildi. Son olarak günümüzde evlenme ehliyeti ile ilişkili uygulamaların nasıl olması gerektiği sunuldu."
