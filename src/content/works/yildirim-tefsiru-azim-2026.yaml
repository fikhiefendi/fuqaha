abstract: "TEFSİRU'L-KUR'ANİ'L-AZİM VE SAFVETÜ'T-TEFASİR'İN KUR'AN İLİMLERİ AÇISINDAN MUKAYESESİ Sebahattin YILDIRIM Ondokuz Mayıs Üniversitesi Lisansüstü Eğitim Enstitüsü Temel İslam Bilimleri Ana Bilim Dalı Yüksek Lisans, Aralık/2025 Danışman: Doç. Dr. Hatice ŞAHİN AYNUR Tefsîru'l-Kur'âni'l-Azîm ve Safvetü't-Tefâsîr'in Kur'ân İlimleri Açısından Mukayesesi adlı çalışma, kavramsal çerçevede Kur'ân ilimleriyle ilgili temel bilgileri sunarken, bu iki tefsirin söz konusu alanlara yönelik yaklaşımlarını tespit etmeyi amaçlayan karşılaştırmalı bir araştırmadır. Ulûmü'l-Kur'ân konularına dair kavramlar, müfessirler arasında çeşitli görüş ayrılıklarına yol açmaktadır. Bu durum bazı problemlere sebebiyet vermekte olup özellikle müfessirlerin ilmî birikimleri, mensup oldukları mezhep ve yaşadıkları dönemin ilmî atmosferi, Kur'ân ilimlerine ilişkin terimlere yaklaşımlarında farklılıkların ortaya çıkmasına zemin hazırlamaktadır. Bu sebeple farklı dönem ve metodolojik zeminde kaleme alınmış olan tefsirlerin ulûmü'l-Kur'ân terimlerine bakışlarında ihtilâf bulunup bulunmadığının tespiti önem arz etmektedir. Bu bağlamda çalışmada, İbn Kesîr'in (öl. 774/1373) rivâyet ağırlıklı Tefsîru'l-Kur'âni'l-Azîm'i ile Muhammed Ali es-Sâbûnî'nin (1930–2021) derleme ve özet mahiyetindeki Safvetü't-Tefâsîr'i; ulûmü'l-Kur'ân konularına yaklaşımları bakımından incelenmiştir. Yaptığımız araştırmanın sonunda Tefsîru'l-Kur'âni'l-Azîm ve Safvetü't-Tefâsîr'in ulûmü'l-Kur'ân konularına yaklaşımında müfessirlerin ilmî eğilimlerinin ve metodolojik tercihlerinin tefsirlerine büyük ölçüde yansıdığı anlaşılmıştır. Tefsîru'l-Kur'âni'l-Azîm'de birçok Kur'ân ilimleri konusu, rivâyetler merkeze alınarak ele alınmış; sahih kabul edilen rivâyetlere bağlı kalınmış ve zorlama te'villere gidilmediği gözlemlenmiştir. Buna mukâbil Safvetü't-Tefâsîr'de ulûmü'l-Kur'ân'a dair hususların çoğu, derleyici bir üslûpla ve farklı tefsirlerden yararlanılarak değerlendirilmiş; yer yer müellifin kendi yorumlarına da yer verildiği tespit edilmiştir. Çalışmanın temel kaynaklarını adı geçen tefsirler oluşturmuş; bunun yanında müfessirlerin diğer eserleriyle klasik ve modern tefsir literatüründen de istifade edilmiştir. Dört bölümden oluşan bu çalışmanın giriş kısmında araştırmanın konusu, amacı, yöntemi ve kaynakları ele alınmıştır. Birinci bölümde İbn Kesîr ve Muhammed Ali es-Sâbûnî'nin hayatları ve yaşadıkları sosyo-kültürel ortam incelenmiş; ikinci bölümde Tefsîru'l-Kur'âni'l-Azîm ile Safvetü't-Tefâsîr, kaynak ve yöntem açısından karşılaştırılmıştır. Üçüncü bölümde her iki tefsir, ulûmü'l-Kur'ân konuları çerçevesinde mukayese edilmiş; dördüncü bölümde ise elde edilen bulgular değerlendirilerek tefsir anlayışlarının genel bir analizi yapılmıştır. Sonuç ve değerlendirme kısmında araştırmanın neticesinde ulaşılan bulgular sunulmuştur."
