abstract: "KILINÇ, Ahmet, Osmanlı Ceza Hukukunda Yaptırım Türü Olarak Teşhir, Doktora Tezi, Ankara 2013. Tezin amacı, Osmanlı Ceza Hukukunda uzun yıllar uygulanmış olan teşhir yaptırımının nasıl ortaya çıktığı, ne gibi usullerle uygulandığı, nasıl değişikliğe uğradığı ve nasıl yürürlükten kalktığını tespit etmektir. Kanaatimizce teşhir,“bir suçun karşılığı olarak, toplumun bilgilendirilmesi amacıyla/kastıyla, işlenmiş olan bir suçun ve suçu sabit görülmüş olan failin ve/veya bu faile verilmiş olan cezanın ve/veya bu faile verilmiş olan herhangi bir cezanın infazının topluma duyurulması amacıyla gerçekleştirilen ve mahkeme tarafından verilmiş olan bir yaptırım”dır. Teşhir yaptırımı bizce iki kategoriye ayrılmalıdır: Doğrudan teşhir, Dolaylı Teşhir. Toplumun bilgilenmesi, ceza olarak uygulanıyorsa doğrudan teşhir; yapılan işlem ve/veya verilen hüküm, toplumun bilgilenmesi sonucunu doğruyorsa dolaylı teşhir söz konusudur. Mahkumu bizzat dolaştırma, fotoğraf ve veya ismin basın organında yayınlanması, ser-i maktuunun veya cesedin teşhiri ve hükmün ilanı doğrundan teşhir iken; damgalama, hükmün alenen infazı, sakal kesme dolaylı teşhir çeşitleridir. Gerek klasik dönemde gerekse Tanzimat sonrası dönemde teşhirin hukuki niteliğinin ceza olduğu konusunda çok fazla vesika mevcuttur. İslam Hukukçuları teşhirin şiddeti konusunda fikir aykırılıklarına düşmüşler. Bizce bu tartışma doğrudan teşhir dolaylı teşhir ayırımı yapılmamasından kaynaklanmaktadır. Teşhir, kural olarak tazir cezasıdır. Ancak had cezası olarak uygulandığını da ifade etmek gerekir. Ayrıca bu ceza tekmili, tebei ve nefsi ceza olarak da uygulanmıştır. Teşhir, Osmanlı Devletinde güvenlik tedbiri, disiplin cezası ve idari yaptırım türü olarak uygulanmıştır. Kural olarak kanunilik ilkesi ile bağdaşır şekilde uygulanan teşhir yaptırımı, askerî,reaya, zimmi, Müslüman, kadın erkek ayırım yapılmadan herkese uygulanmıştır. Bu konuda ifade edilebilecek tek istisna yeniçerilere teşhir yaptırımının uygulanmak istenmemesidir. Teşhir yaptırımı, caydırıcı olması, doğru bilginin halka sunulması, devletin egemenliğini göstermesi, toplumun merak hissinin giderilmesi, toplumsal otokontrola destek, infazda aşırılığın veya hafifletilmenin önüne geçmesi amaçları ile uygulanmıştır. Kuranı Kerimde Nur Suresinin 2'inci ayeti bu yaptırımın delili olarak ifade edilmektedir. Bu hüküm bizce dolaylı teşhir için bir delildir. Dört mezhep de teşhir yaptırımını ufak farklılıklarla da olsa kabul etmiştir. İslamiyet öncesi Türk Devletlerinde kızgut ifadesi teşhir yaptırımı için kullanılmıştır. Selçuklular da bu yaptırım diğer İslam devletlerinde olduğu gibi uygulanmıştır. Osmanlı'da bu yaptırım sokakta dolaştırma, kafasına zil geçirme, münadilerin nidaları ile çarşı pazarda gezdirme şeklinde olabildiği gibi cesedin kesik başın teşhiri şeklinde de olmuştur. Tespit ettiğimiz kadarıyla Osmanlı Devleti'nde on iki suç tipine teşhir yaptırımı uygulanmıştır. Bunlar pezevenklik, yalancı şahitlik ve yalancılık, yan kesicilik veya yol kesme suçu, devlete isyan, toplumsal ahlaka yönelik suçlar, dini vecibelerin yerine getirilmemesi, hırsızlık, devlet tekeline müdahale ve gümrük kurallarına uymama, müessir fiil, içki içme, askerî suçlar ve çevre temizliği ihlalidir. 1840 tarihli Ceza Kanununda teşhir yaptırımı yoktur. 1851 tarihli Ceza Kanununda ise hükmün alenen infazı şeklinde teşhir yaptırımı vardır. 1858 tarihli Ceza Kanunun da bu yaptırımın mevzuattaki yerini almıştır. Kanunun 3 ve 19 'uncu maddeli bu açıdan önemlidir. Bu yaptırımının yürürlükten kalkması şifahi bir emir ile olmuştur. Osmanlı'nın çağdaşı devletlerinde bu yaptırım sıklıkla uygulanmıştır. İngiltere'de uygulanan ducking stool cezası dikkat çeken cezalardandır. Cumhuriyet döneminde de bu yaptırım uygulanmıştır. 765 sayılı yasa hükmün ilanı şeklinde teşhiri kabul etmiştir. Anayasa Mahkemesi 2010 yılında iptal edene kadar Kamu Etik Kurulunun da bu yetkisi mevcuttu. Günümüzde bu ceza emniyet genel müdürlüğü ve bazı bakanlıklar tarafından uygulanmaktadır."
