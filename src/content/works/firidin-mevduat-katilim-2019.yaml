abstract: "Bir ülke ekonomisinde, finans alanında bankacılık sektörü en önemli kurum veya kuruluşlardan bir tanesidir. Bankaların çeşitli görev ve sorumlulukları vardır. Bu kapsamda; bankalar fonksiyonlarına göre bazı ayırımlara ve görevlere tabi tutulurlar. Bankacılık sisteminde meydana gelen bir sıkıntı veya bozulma ister istemez para ve sermaye sahiplerini de etkilemektedir. Bu durum bankanın performans, kârlılık gibi değişkenleri etkilemektedir. Geçen zamanlar içinde özellikle 2000 ve 2001 krizinde bankalar böylesi sıkıntılı bir süreçten geçmişti ve parasal darboğaz, kredi geri ödeme zorlukları ve bazı iflaslar olmuştu. Bu durum bankaların olası bir krizde ne kadar ayakta kalabileceği ve ne kadar krizden etkilenebileceği sorunsalını da beraberinde getirmişti. Bu tez çalışmasının amacı, günümüz bankacılık sisteminde oldukça önemli bir paya sahip olan mevduat bankalarının ve katılım bankalarının çeşitli açılardan çok kriterli olarak değerlendirilmesi, karşılaştırılması ve bulguların yorumlanmasıdır. Bu amaçla çalışmada çok kriterli karar verme yöntemlerinden TOPSİS kullanılmıştır. Çalışmada 2016-2019 yılları arasında faaliyet gösteren 11 mevduat bankasının ve 5 katılım bankasının performansı değerlendirilmiştir."
