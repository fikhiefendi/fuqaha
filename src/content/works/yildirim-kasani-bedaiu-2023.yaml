abstract: "Kâsânî (v.587/1191) Türkistan bölgesinde doğmuş, Konya'da bir süre bulunmuş ve Halep'te yaşamını tamamlamış, Hanefî mezhebinin önemli fakihlerindendir. Te'lif ettiği Bedâi'u's-Sanâi' fî Tertîbi'ş-Şerâi' mezhebin önemli kaynaklarındandır. Çalışmamız Kâsânî'nin bu eseri üzerinden yola çıkılarak hazırlanmıştır. 'Kâsânî ve Bedâiu's-Sanâi' Adlı Eserinin Hadis İlimleri Açısından İncelenmesi' başlıklı çalışmamızla Kâsânî'nin hadislere yaklaşımının incelenmesi, eserin hadis ilmi açısından değerinin ortaya konularak Hanefîlerin hadis anlayışıyla ilgili çalışmalara katkı sağlaması hedeflenmektedir. Araştırmamız giriş ve iki bölümden oluşmaktadır. Giriş kısmında araştırmanın amacı ve önemi, metodu ve kaynakları üzerinde durulmuştur. Çalışmamızın birinci bölümünde Kâsânî'nin hayatı ve ilmî kişiliği hakkında bilgiler verilmiştir. Burada Kâsânî'nin yaşadığı Türkistan'ın, Konya'nın ve Halep'in tarihi, sosyal durumu, ilmî ve kültürel gelişmelerine değinilmiş, Kâsânî'nin hadis ilmindeki yeri ele alınmıştır. Ayrıca onun eserinde kullandığı hadis ıstılahlarına yer verilmiş, haber-i vâhidlere bakışı incelenmiş, son olarak da Kâsânî'nin faydalandığı hadis ilimlerine değinilmiştir. İkinci bölümde ise Kâsânî'nin Bedâi'de naklettiği müteârız hadisler ve çözüm yolları incelenmiştir. Sonuç olarak Kâsânî'nin Bedâi'de naklettiği hadis sayının iki bine yaklaştığı tespit edilmiş, bu rivayetleri delil alma konusunda genel olarak Hanefî mezhebi çizgisinden ayrılmadığı görülmüştür."
