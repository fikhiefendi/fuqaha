abstract: "Hukukun var olmasının temel müsebbibi olan insanın en güvenli olduğu, huzur bulduğu ve ilk eğitimini aldığı yer ailedir. Bu nedenledir ki aile tüm hukuk sistemlerinde olduğu gibi İslam Hukukunda da önemli bir yere sahiptir. Hızla gelişen ve değişen toplumlarda insanların algıları ve hassasiyetleri, düşünce yapıları ve değer yargıları da değişmektedir. Hedonizm ve egoizmin zirve yaptığı günümüz toplumunda da buna bağlı olarak farklı nikâh şekilleri ortaya çıkmıştır. İslam hukuku, Kur'an'ın rehberliği ve Hz. Peygamberin (s.a.s.) önderliğiyle, nikâh çeşidinin fazla olduğu cahiliye dönemindeki uygulamalar üzerinde iptal, ıslah ve ibka işlemi gerçekleştirmiştir. Bu manada İslam ruhuna ve ahlakına uygun olmayan nikâhlar iptal edilmiştir. Bununla beraber kişisel hakları koruyan, sorumlulukları bildiren, aileden beklenen hedef ve gayeleri belirleyen tek bir nikâh ibka edilmiştir. Biz Müslümanlardan beklenen de buna uygun bir aile yapısı oluşturmak, bu ruha ve anlayışa uymayanların da caiz olmadığını bildirmektir. Kur'an'ın temelinde oluşan İslam hukukunun, hükümlerin konmasındaki hikmet ve gayeleri göz ardı edildiğinde bazı sıkıntılarla karşı karşıya kalmamız kaçınılmazdır. Bu çalışmamızda, bu tür sebeplere bağlı olarak ortaya çıkan nikâh çeşitleri özelinde misyar nikâhını, şu başlıklar altında inceledik. Öncelikle tarihi kökenini, ortaya çıkış sebebini ve İslam hukukuna uygun olup olmadığını, klasik akit teorisi açısından değerlendirmeleri, çağdaş İslam hukuku araştırmacılarının görüşlerini aktardık. Daha sonra edindiğimiz bilgiler ışığında, şartlar nazariyesi, maslahat, ihtiyat, itidal, tescil ve makâsıdü'ş-şerîa açısından misyar nikâhının İslam hukuku açısından caiz olup olmadığını değerlendirmeye çalıştık."
