abstract: "Sözlükte“birleştirmek”anlamına gelen telfîk, hadis ilminde iki veya daha fazla isnâdın tek siyakla nakledilmesini ifade eder. Cem'u'l-esânîd ve el-cem'u beyne'ş-şuyûh terimleriyle de açıklanan telfîk uygulaması, idrâc ve tahvilden ayrı bir yöntem olup hadis rivayetinde ve tarihi haberlerde farklı şekillerde uygulanmıştır. Tarihi bir vakıaya dair farklı rivayetlerin birleştirilip müteselsil biçimde anlatıldığı telfîkli rivayetler, tarih yazıcılığının nüvesini oluştururken telfîk yöntemi, muhaddisler tarafından pek hoş karşılanmamış görünmektedir. Ancak muhaddislerin teorik zeminde telfike karşı olumsuz yaklaşımına rağmen birçok hadis râvisinin telfîke başvurması, hatta çoğu musannifin telfîkli rivayetleri eserine alması hadisçiler nezdinde telfik yönteminin araştırılmasını önemli hale getirmektedir. Bu çalışmada da hem telfîk yönteminin mahiyeti ele alınmış hem de muhaddislerin telfîkli rivayetler konusundaki yaklaşımını ortaya koyabilmek için sıhhat iltizam etmede en titiz musannif olduğu müsellem olan Buhârî'nin el-Câmiu's-sahih'te yer verdiği telfîkli rivayetlerin tetkiki hedeflenmiştir. Bu amaçla Sahîh-i Buhârî'de yer alan telfîkli rivayetler tasnif edilerek en sık kullanılan telfîk terkipleri, metinleriyle birlikte tahlil edilmiştir. el-Câmiu's-sahîh'teki rivayetler üzerinden okunan telfîk pratiği, mahiyeti, sınırları ve uygulanış şekilleri açısından telfîkin teorik çerçevesini de açığa çıkarmıştır. Bu tetkik neticesinde telfîkin, birleştiren ve birleştirilen râviler arasında doğrudan irtibatı gerekli kılan cem usûllerinden biri olduğu, râvilerin telfîk yapmadaki amaçları ve lafızlar konusundaki titizliğine göre rivayet döneminde farklı şekillerde uygulandığı, telfîk yapan râviler ve uygulayış şekillerine göre kabul ya da reddedilen bir yöntem olduğu anlaşılmıştır."
