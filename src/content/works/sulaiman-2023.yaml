abstract: "Bu tez, Celâl el-Mahalli'nin (ö. hicrî 864) Cemʻu'l-cevâmiʻ adlı eserinin bir bölümünün edisyon kritiğini yapmayı amaçlamaktadır. Haşiyenin önemi başlıkta yer alan şerh üzerine kaleme alınmış en özgün haşiye olmasından gelmektedir. Müellif Cemʻu'l cevâmiʻ üzerine yazılan Ḥāşiyet Zekeriyyā ve'l-ʻAṭṭār, İbn Kāsım el-ʻAbbādī, Kemāl İbn Ebī Şerīf gibi birçok şerh ve haşiyeyi bir araya getirmiştir. Yazarın ifadeleri açık, karmaşıklıktan uzaklık, mesele ve ibarelerin açıklanmasında basitleştirme şeklinde karakterize edilebilir. Eserin kaynakları sahihtir ve özgündür. Usul-i fıkıh kitaplarına dayanan eser meseleleri mantıkî kurallar çerçevesinde incelemektedir. Araştırmacı, imamları (Subkî, El-Mahallî ve El- Karadâği) tercüme ederken, onların entelektüel biyografilerini anlatırken tarihi betimle yöntemini takip etmiştir. Metnin nüshalarında ise tahkik ve ta'lik yöntemini takip eden araştırmacı, modern yazım ve noktalama kurallarına göre metni düzenlemiş, sözleri kaynaklarına isnad etmiş ve nihai olarak da bir sonuç ve kaynakça ile çalışmayı tamamlamıştır. Çalışma birçok sonuca ulaşmıştır: İlk olarak müellif sadece basit bir nakledici değildir. Bilakis o aynı zamanda şerh ve metne birden çok yerde müdahalede bulunmaktadır. Müellif ayet ve hadisleri zikrederken sadece ilgili şâhidi zikretmekle yetinmekte ve pasajın bütününü zikretmekten kaçınmaktadır. Müellifin alimlerden yapmış olduğu nakillerde oldukça güvenilir olduğu gözlemlenmektedir. Önceki eserlerinde alimlerden çok fazla alıntı ve nakil yapmayan müellifin bunun aksine bolca şerh ve haşiyeye atıf yaptığı görülmektedir."
