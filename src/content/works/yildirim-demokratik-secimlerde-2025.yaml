abstract: "17. yy aydınlanmacı fikirlerin etkisiyle günümüzdeki halini almış olan demokrasi ve laiklik kavramları, Osmanlı'nın son dönemlerinde yoğun tartışılmalara sebep olmuş ve ülkemizde 1923 yılı itibariyle Cumhuriyet rejimine geçilmesiyle sonuçlanmıştır. Akabinde hilafetin kaldırılması, siyaset kurumunun din ile olan ilişkisi üzerine çeşitli tartışmalara sebep olmuştur. Müslüman halklar, yaşadıkları ülkelerde çeşitli yorum ve uygulama farklılıkları bulunan demokratik seçimlere katılımın fıkhî boyutu hakkında olumlu, olumsuz ve şartlı olmak üzere bazı görüşler üzerinde tartışmışlardır. Demokrasinin ve laikliğin kökeni itibari ile ihtiva ettikleri anlamlar, devlet başkanı seçiminin yasama yetkisini barındırması, egemenliğin-hakimiyetin İslam'a göre kaynağı, belediye seçimleri-yerel yönetimler açısından değeri ve seçmenin ehliyeti meseleleri gibi çeşitli noktalardan fıkhî bir sonuca ulaşılmaya çalışılmıştır. İslam fıkhında siyâsetu'ş-şer'iyye türü eserlerde devlet başkanının belirlenmesi ve halkın bu konudaki rolüne dair uzunca açıklamalar bulunmaktadır. İslam'da ve İslamiyet öncesi Türklerde olmayan bir yöntem olarak devlet başkanını direkt halkın seçmesi ilkesine dayanan demokrasi, J.J. Rousseau gibi düşünürlerin geliştirdiği 'toplum sözleşmesi' fikri etrafında aktüel anlamını kazanmıştır. Çalışmamızda bu kavramlar ve kurumlar tanımlanmış, tarihsel kökenlere ve etimolojik ayrıntılara yer verilerek oy verme davranışına etki eden tüm faktörlere temas edilmiştir. Demokratik seçimlerde oy kullanmayı caiz gören ve görmeyenler, delilleri ile birlikte incelenmiştir. Son olarak fıkıhta mükellefin fiilini etkilemesi açısından niyet ve cehalet gibi noktalara temas edilmiştir."
