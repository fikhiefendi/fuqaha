abstract: "?Muhammed b. Nasr el-Mervezî'nin İhtilâfu'l-Ulemâ Adlı Eseri ve Hilâfiyât Literatüründeki Yeri? adlı bu çalışma üç ana bölümden oluşmaktadır.Birinci bölümde, ?Hilâf?, ?İhtilâf?, ?İlm-i Hilâf? kavramları tanıtılmıştır. Hilaf ilminin konusu, amacı ve faydası anlatılmıştır. Hilaf ilminin ortaya çıkışı, diğer ilimlerle cedel, (diyalektik), mukayeseli hukuk, fıkıh usulü (İslam hukuk metodolojisi) ilişkisi üzerinde durulmuş, hilaf ilminin ortaya çıkışı, tarihi gelişimi ve hilafiyât literatürü fıkıh mezhepleri dikkate alınarak tanıtılmıştır. Hilaf ilminin tenkidi yapılarak fıkhi ihtilafların ortaya çıkışını hazırlayan sebeplere değinilmiştir.İkinci bölümde, Mervezî'nin hayatı ve eserleri hakkında bilgi verilmiş, Mervezî' nin yaşadığı dönemin siyasi, sosyal, kültürel ve ilmi bakımdan değerlendirilmesi yapılmış, Mervezî'nin hocaları, talebeleri tanıtılarak ilmi kişiliği hakkında bilgi verilmiştir.Üçüncü bölümde ise, Mervezî 'nin İhtilâfu'l-Ulemâ adlı eseri tanıtılmıştır. Eserin orijinal adı ve müellife aidiyeti tespite çalışılmıştır. Eserde öne çıkan özellikler ve müellifin eserinde takip ettiği yöntem irdelenerek tespite çalışılmıştır. Eserin diğer hilafiyât eserleri içindeki yeri ve değeri tespit edilerek, eser hakkında yapılan çalışmalar (tahkikler-edisyon critic) kısaca tanıtılmıştır. Sonuç ve değerlendirme bölümünde araştırmamızda ulaştığımız sonuçları özet halinde sunmaya çalıştık."
