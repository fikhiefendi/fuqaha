abstract: "Bu Çalışma Filistin'deki İslami Bankların finansal sözleşmelerin tahlili ve değerlendirilmesini, Faizsiz Finans Kuruluşları Muhasebe ve Denetim Kurumu (AAOIFI) tarafından yayınlanan Şeri Standartlarla karşılaştırılmasını ve özellikle murabaha akdi, mülkiyetin devriyle sonuçlanan İcare akdi ve İstisna akdine ilişkin Şeri Standartların uygulamalarını ve yükümlülüklerini tespit etme, bu akitlere ilişkin düşünceleri ve varsa şeriata aykırılıkları belirlemeyi amaçlamaktadır. Araştırmacı konuyu ele alırken birkaç yöntem kullanmıştır. Tanımlama yöntemiyle Araştırmacı, Filistin'deki İslami Bankların finansal işlemlerinin çeşitlerini, büyüklüklerini, uygulama şekillerini; Analiz yöntemi ile Filistin'deki İslami Bankların finansal işlemlerini Şer'i Standartlar ışığında tahlilini; Eleştirel Yöntem ile Filistin'deki İslami Bankların finansal işlemlerinin önemli kısmı eleştiriye tabi tutmuştur. Çalışmada önemli neticelere varılmıştır. Bunlardan bir kaçını zikredecek olursak; her üç bankada da söz konusu akitlerin uygulamasında belirgin farklılık bulunmaktadır. Mesela müşteri ile sözleşme imzalanmadan önceki aşamada güvence bedeli ve kaparo ayrımına gidilmemektedir. Yine bazı bankalar yaptıkları akitlerde, malın gizli ve açık ayıplardan sorumlu olmama hususundaki tutumlarını beyan etmemektedir. Hakeza bazı bankaların murabaha akitlerinde kar miktarı veya oranı beyan edilmemektedir. Özellikle mülkiyetin devri ile sonuçlanan İcare akdine ilişkin önemli tespitler bulunmaktadır. Şöyle ki, bazı İslami bankalar kira konusu malın kendisinden yararlanmayacak derecede olan ayıplarından sorumsuzluk hükmü koydukları, yine kira konusu mala ilişkin bankanın karşılaması gereken resim, masraf ve vergilerin müşteriye yüklendiği, malın kısmen veya tamamen ziyaı durumunda bankanın sorumluluğunun sözleşmelerde açıkça belirtilmediği tespit edilmiştir. İstisna akdine gelince, akdin kurulması ve uygulanmasının analizi ve değerlendirilmesiyapıldığında, İslami bankaların büyük oranda AAOIFI'nin İstisna Standardına bağlı kaldığı görülmektedir."
