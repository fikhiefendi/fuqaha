abstract: "Şeyhîzâde Abdurrahman Efendi Osmanlı döneminde yaşamış kıymetli bir İslâm hukukçusudur. Görev yaptığı zaman zarfında değişik hizmetlerde bulunmuş, ilmi ve üstün ahlakıyla tanınmıştır. Vefatından bir yıl önce tamamlamış olduğu Mecma'u'l-enhur isimli eseri, İbrâhim el-Halebi'nin Mülteḳa'l-ebḥur adlı fıkıh kitabının en muteber şerhlerindendir. Mecma'u'l-enhur aynı zamanda Mecelle'nin kaynakları arasında da yer almaktadır. Temelde bir Hanefî fıkıh metninin şerhi olan eserde Hanefî mezhebinin görüşleri aktarıldığı gibi, diğer mezheplerin görüşlerine de yer verilmiştir. Şeyhîzâde'nin Mecma'u'l-enhur isimli eserinin tahâret ve salât bölümlerinde İmam Şâfiî'ye nispet edilen görüşler, başta İmam Şâfiî'nin el-Üm isimli eseri olmak üzere Müzenî'nin el-Muhtasar, Mâverdî'nin el-Hâvi'l-kebîr, Merverrûzî'nin et-Taʿlîḳa, Şîrâzî'nin el-Müheẕẕeb, Cüveynî'nin Nihâyetü'l-maṭlab, Rûyânî'nin Baḥrü'l-meẕheb, Gazzâlî'nin el-Vasîṭ, eş-Şâşî'nin Ḥilyetü'l-ʿulemâʾ, İmrânî'nin el-Beyân, Râfiî'nin Fetḥu'l-ʿazîz, Nevevî'nin el-Mecmû', Ravżatü'ṭ-ṭâlibîn, Demîrî'nin en-Necmü'l-vehhâc ve Şirbînî'nin Muġni'l-muḥtâc isimli eserleri çerçevesinde incelenmiş, sonuç olarak 180 adet nispet tespit edilmiştir. Bunların 54 tanesi tahâret, 126 tanesi ise salât bölümünde yer almaktadır. Tahâret bölümündeki nispetlerin 50'sinin doğrudan İmam Şâfiî'ye ait olduğu görülürken, salât bölümündeki 126 nispetin 109'unun ona ait olduğu tespit edilmiştir."
