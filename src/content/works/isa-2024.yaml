abstract: "Bu tez, Burhânüddîn el-Mergînân.î'nin“et-Tecnîs ve'l-Mezîd”Adlı Eserinin Büyû (Alış-veriş) Kitabının Başlangıcından Kısmet Kitabının Sonuna Kadar kısmının Tahkik ve Değerlendirmesi. Bu tez üç bölüm ve bir sonuçtan oluşmaktadır. Birinci bölüm: ise giriş niteliğindedir, giriş ve tez konusu ve amaçları hakkında açıklama, tez konusunun önemi, seçilme nedenleri, önceki çalışmalar ve araştırma prosedürlerini ve planını içerir, İkinci bölüm: Kitabın yazarı İmam Burhânüddîn el-Mergînânî'nin tanıtılması ve“et-Tecnîs ve'l-Mezîd”Adlı Eserinin ve yazarın bu Eserenindeki yaklaşımının tanıtılmasını içermektedir. Üçüncü bölüm:“et-Tecnîs ve'l-Mezîd”Adlı Eserinin Büyü (Alış-veriş) Kitabının Başlangıcından Kısmet Kitabının Sonuna Kadar kısmının incelenmesidir ve sonuç bölümünde kaynakları ve önerileri yazdım. Bu tezde yaptığım araştırmalar sonucunda bu Eserinin seçkin alimlerin fetva ve görüşlerini içermesi nedeniyle fıkıh ve fetva alanında çalışanlar için en önemli kaynaklardan biri olarak kabul edildiği ve gelişmelere ve çağdaş sorunlara İslam hukukunu uygulamak ve çözmek konusunda en iyi modellerden biri olarak kabul edildiği sonucuna vardım."
