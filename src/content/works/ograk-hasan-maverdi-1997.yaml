abstract: "ÖZET Ebu'l Hasan el-Maverdi'nin iktisadi görüşleri isimli bu çalışmamızın amacı, Maverdi'nin eserlerinde geçen iktisadi konular ve olaylarla ilgili görüşlerini sistematik bir şekilde ortaya koymaktır; Maverdi'nin iktisadi düşünce ilgili yönünü dikkatlere sunmak ve iktisadi görüşlerinin çağdaş iktisadi hayat açısından ne anlam ifade ettiğini belirtmektir. Bu çalışmamız dört bölümden oluşmaktadır. Birinci ve ikinci bölümde, Maverdi'nin hayatı, eserleri ve yaşadığı dönemin sosyal, siyasi ve iktisadi durumu hakkında genel bilgilere yer verilmiştir. Üçüncü ve dördüncü bölümde yeralan konular, çalışmamızın asıl konusunu teşkil eder. Üçüncü bölüm, Maverdi'nin iktisadi düşünce ile ilgili konulara yaklaşımını ihtiva etmektedir. İktisadi faaliyetlerin insan hayatının devamı için bir zorunluluk olduğunu belirtir. Onun, iktisadi faaliyetlerde, iş bölümü, yardımlaşma, geniş emel ve dayanışmaya verdiği önem üzerinde durduk. Maverdi, din, ahlak, adalet ve iktisat arasındaki ilişkiyi dile getirir. İktisadi faaliyetlerin, dini ve ahlaki yönü üzerinde durur. Maverdi'nin sosyal gruplar arasındaki gelir farklılıkları üzerine görüşleri yer alır. Maverdi'nin iktisadi görüşleri içinde önemli biryere sahip hisbe konusunu bu bölümde ele aldık. Hisbe'nin tanımı, sosyal ve iktisadi hayattaki rolüne temas ettik. Ona göre hisbe; özellikle, ölçü ve tartıda yapılan hileleri kontrol etmek, malların ayıbını gizleyenlere engel olma, mal ve hizmetlerde aldatma ve hileyi önleme, ihtikarı ve faizli işlemleri yasaklama, sanat ve meslek sahiplerini denetleme, çarşı ve pazarları kontrol etmek gibi fonksiyonları vardır. Bu bölümde, Maverdi'nin işsizlik, işçi-işveren arasındaki ilişkinin niteliği hakkındaki fikirleri ve çalışma hayatı hakkındaki görüşleri yer alır. Ayrıca aynı bölümde Maverdi'nin para politikasıyla alakalı görüşleri ile devletin bu alandaki yerine dair fikirleri ortaya konmuştur. Çalışmamızın dördüncü ve son bölümü, Maverdi'nin devlet ve iktisadi hayat ilişkisine dair fikirlerine ayrılmıştır. Bu bölümde devletin gelir kaynaklan ve harcama alanlarıyla, bu harcamaların iktisadi hayat üzerindeki etkileriyle alakalı düşünürümüzün görüşleri yer almaktadır."
