abstract: "ÖZET“Roma Hukuku'nda Exercitor N av i s' in (Donatanın) Actio Exercitoria'dan Doğan Sorumluluğu”isimli bu Yüksek Lisans Tez çalışması, Giriş ve Sonuç dışında iki Bölüm'den oluşmuştur. Birinci Bölüm'de, exercitor navis'in sorumluluğunun doğmasında etkili olan Roma aile yapısı, Roma Hukuku' ndaki temsil kurumunun özelliği ve actio exercitoria'nin da içinde yer aldığı ek nitelikteki davalar (actîones adiecticiae qualitatis) incelenmiş; böylece actio exercitoria'nin ortaya çıkışı ve Roma Hukuku' ndaki yeri saptanmıştır. İkinci Bölüm'de ise, actio exercitoria'dan doğan sorumluluk, özellikle“de exercitoria actione”edictum'unu içeren Digesta metinlerinden yararlanılarak incelenmiştir. Corpus luris Civilis'in, Digesta Bölümünde ayrıntılarıyla düzenlenmiş olan actio exercitoria'ya ilişkin kuralların, Grek Hukuku kaynaklı olduğunu söylemek mümkündür. Actio exercitoria, exercitor navis'in, gemisinin başına magister navis olarak getirdiği kişinin, yaptığı sözleşmelerden doğan borçlardan in solidum sorumlu tutulmasını sağlayan bir praetor davasıdır. Actio exercitoria'nin açılabilmesi için gerekli koşullar şöyle saptanabilir: 1. Bir navis'in (geminin) varlığı, 2. Navis'in exercitor navis tarafından işletilmesi, 3. Geminin başında bir magister navis'in bulunması, 4. Magister navis ile bir sözleşme yapılması, 1375. Yapılan işlemin praepositio kapsamında olması. Deniz ticareti işletmesinin başında bulunan, gemiyi işleten ve ondan gelir elden kişiye exercitor navis ismi verilirdi. Exercitor navis geminin maliki (dominus navis) olabileceği gibi, gemiyi malikinden süreli veya süresiz olarak kiralayan kişi de olabilirdi. Magister navis ise geminin idaresiyle ilgili tüm sorumluluk kendisine bırakılmış olan kişiydi. Geminin başına getirilen magister navis'in, bir başkasını magister navis olarak geminin başına getirmesi mümkündü ve bu kişi de, Digesta'dan anlaşıldığına göre, magister navis kabul ediliyordu. Actio exercitoria'nm taraf lan, magister navis ile sözleşme yapan üçüncü kişi ve exercitor navis'ti. Actio exercitoria, ek nitelikteki davalardan biridir; ayrıca praetor tarafından tanınan bir dava olduğu için, bir praetor davasıdır (ius honoraria -actio in factum). Actio exercitoria'da, exercitor navis, magister navis'in praepositio sınırlan içinde gerçekleştirdiği sözleşmelerden doğan borcun tamamından (in solidum) sorumluydu. Principatus Dönemi'nin (yani Klâsik Hukuk Dönemi'nin) başlarında, exercitor navis'in, extraneus magister navis'in borçlarından da sorumlu olması sağlanmıştır. Actio exercitoria'nm açılabilmesi için bir süre söz konusu değildi, yani bu dava için bir zamanaşımı öngörülmemişti. Ayrıca bu dava gerek mirasçılar tarafından, gerekse mirasçılara karşı açılabilirdi. 138"
