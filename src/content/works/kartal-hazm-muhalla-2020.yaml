abstract: "Zâhirî mezhebinin ikinci imamı kabul edilen İbn Hazm 456/1064 senesinde vefat etmiştir. Birçok eserde imzası bulunan İbn Hazm'ın en önemli eserlerinden birisi el-Muhallâ'dır. İbn Hazm el-Muhallâ'da Zâhirî mezhebinin görüşlerini vermenin yanı sıra İmam Şâfiî ve diğer müçtehidlerin görüşlerini de aktarmıştır. Bu çalışmamızda İbn Hazm'ın el-Muhallâ'sında aile hukuku konularında İmam Şâfiî'ye nispet ettiği görüşlerini tespit ve tahkik etmeye çalıştık. Çalışmamız giriş, iki bölüm ve sonuçtan oluşmaktadır. Giriş bölümünde tezin önemi ve amacı, metodu ve kaynaklarından bahsedilmiştir. Birinci bölümde İbn Hazm ve Zâhirî mezhebi hakkında bilgi verilmiştir. İkinci bölümde ise el-Muhallâ'da aile hukuku konularında İmam Şâfiî'ye nispet edilen 157 görüş tespit ve tahkik edilmiştir. Görüşlerin İmam Şâfiî'ye aidiyeti araştırılırken bu mezhebin kaynakları incelenmiştir. Sonuç olarak bu görüşlerden 150 tanesinin isabetli, 7 tanesinin ise hatalı olduğu ortaya çıkmıştır."
