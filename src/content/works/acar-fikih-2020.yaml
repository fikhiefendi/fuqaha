abstract: "Ceza hukukunda alenilik, kelimenin sözlük anlamıyla kullanıldığında suçun maddi unsurunu oluşturması veya suçu nitelikli hâle getirmesi yönüyle söz konusu edilir. Cezaların infazında alenilik ise hem önleme/caydırıcılık gibi olumlu, hem de hükümlüye ve insanın saygınlığına yönelik olumsuz etkileri bakımından gündeme gelmektedir. Aleniliğin modern hukukta terim anlamıyla kullanımı, hukuk güvenliğini sağlaması yönüyle yargılamanın kamuya açık gerçekleşmesi ilkesini ifade etmektedir. Bu çalışmada tezin geneline ışık tutacağı düşüncesiyle İslâm ceza hukukuna genel bir bakış yapıldıktan sonra fıkıh teori ve uygulamasında erken dönem ve Osmanlı örneği eksene alınarak ceza yargılaması ve infazı aşamalarında aleniliğin nasıl ve ne ölçüde yer aldığı araştırılmıştır. Bu yapılırken aynı zamanda İslâm ceza hukukuna alenilik kavramı perspektifinden bütüncül bir yaklaşımın imkânı da araştırılmıştır."
