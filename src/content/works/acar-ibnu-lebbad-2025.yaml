abstract: "İmâm Şâfiî'nin görüşlerini eleştirmek için yazılıp günümüze kadar bir bütün halinde gelen tek kitap, İbnü'l-Lebbâd el-Kayrevânî'nin Kitâbü'r-Red ʿale'ş-Şâfiʻî isimli eseridir. Bu eseri incelemeyi amaçlayan çalışmamız iki bölümden oluşmaktadır. İlk bölümde reddiye kavramının ne olduğu ile ilgili bilgi verilmiştir. Ayrıca reddiye yazarlarının bu türden eser vermelerinin sebepleri incelenmiştir. İmam Şâfiî'nin ilmi kişiliği hakkında bilgi verilip İmam Mâlik'e yazdığı reddiyenin hangi aşamaları geçerek oluştuğuna değinilmiştir. Ayrıca İmam Şâfiî'nin İmam Mâlik'e reddiye yazması üzerine Mâlikî âlimlerden Şâfiî'ye reddiye yazan kişilerin hayatları, eserleri ve ilmi kişilikleri incelenmiştir. İkinci bölümde ise İbnü'l-Lebbâd el-Kayrevânî'nin Kitâbü'r-Red ʿale'ş-Şâfiʻî isimli eserinin içeriği incelenmiştir. Eserde İmâm Şâfiî'nin konu ile ilgili delilleri zikredilmediği için Şâfiî'nin konu ile ilgili delilleri tespit edilmeye çalışılmıştır. Konunun ana hatları verilmiş İmâm Mâlik'in konu hakkında görüş ve delilleri incelenmiş daha sonra İmâm Şâfiî'nin konu hakkındaki görüş ve delilleri orta konulmuştur. Her konunun sonunda kısa bir değerlendirme yapılmıştır."
