abstract: "Tanık delili, geçmişte olduğu gibi günümüzde de kendisinden vazgeçilememiş olan bir delildir. Tanıklık görgüye dayalı olabileceği gibi duyuma dayalı da olabilir. Tanığın olayı doğru bir şekilde algılayıp algılamadığının tespitine yönelik olarak uygulamada belli başlı soru kategorileri kullanılmaktadır. Bunun yanı sıra tanık beyanlarının çelişkili olduğuna kanaat edildiği durumlarda önceki beyanlarının yüzüne karşı okunması sağlanarak çelişkinin giderilmesi kendisinden istenmektedir. Mahkemece gerektiğinde sanık ile tanık yüzleştirilerek maddi gerçeğe ulaşılmaya çalışılmaktadır. Üç bölümden oluşmakta olan bu çalışmada, birinci bölümde delil kavramı üzerinde durulmuş olup, delil çeşitlerine kısaca değinildikten sonra, tanık delili ayrıntılarıyla ele alınarak İslam hukukundaki tanıklık kurumuna da yer verilmiş olup, doğrudan soru yöneltme ile çapraz sorgunun farklı olduğu noktalar üzerinde durulmak suretiyle tanığa tanınmış olan hak ve yükümlülükler incelenmiştir. İkinci bölümde tanık olarak dinlenebilecek kişiler ile tanıkların korunması kapsamında gizli tanıklık kurumu incelenmiştir. Son bölümde ise yalan tanıklık suçu üzerinde durulmuştur. Çalışmamızda tanıklık ile ilgili olarak, en başta Ceza Muhakemesi Kanunu, Tanık Koruma Kanunu ve Türk Ceza Kanunu'ndaki düzenlemelerden faydalanılmış olup, ayrıca doktrindeki görüşlere, Yargıtay, Anayasa Mahkemesi, Avrupa İnsan Hakları Mahkemesi kararlarına yer verilmiş ve karşılaştırmalı hukukla kıyaslama yapılarak inceleme yapılmıştır."
