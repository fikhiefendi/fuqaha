abstract: "Bu çalışma, tekafül sigortası sektöründe bazı ülkelerde karşılaşılan denetim sorunlarını ve bu sorunların sektördeki performans ve gelişim üzerindeki etkilerini incelemektedir. Özellikle Kuveyt ve Suriye örnekleri üzerinden karşılaştırmalı bir analiz yapılmıştır. Etkili bir denetim sistemine olan ihtiyaç, sadece teknik düzenlemelerle sınırlı kalmamakta; aynı zamanda şeriata uygunluk, kamu güveni ve sektörel sürdürülebilirlik açısından da önem taşımaktadır. Çalışmanın temel amacı, sigorta denetim otoritelerinin tekafül sigortacılığının gelişimine nasıl katkı sunduğunu değerlendirmektir. Bu bağlamda, yasal ve kurumsal çerçevelerin hizmet kalitesi, ürün çeşitliliği, yaygınlık ve şeriata uygunluk üzerindeki etkileri analiz edilmiştir. Ayrıca, farklı denetim modellerinin karşılaştığı zorluklara da yer verilmiş ve çözüm önerileri geliştirilmiştir. Araştırma kapsamında, Kuveyt'teki Sigorta Düzenleme Birimi detaylı şekilde ele alınmış, Suriye'deki mevcut durum ile kıyaslanmıştır. Sonuç olarak, Kuveyt modelinin Suriye'de uygulanabilir bir örnek olabileceği değerlendirilmiş ve Suriye için bağımsız bir denetim kurumu ile mevzuat güncellemeleri önerilmiştir."
