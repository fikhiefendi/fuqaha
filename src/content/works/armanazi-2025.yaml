title: "تقييم دور الهيئات الإشرافية على التأمين في تطوير التكافلدراسة مقارنة بين دولة الكويت وسوريا"
titleTranslation: {"tr": "Tekafül'ün gelişiminde sigorta denetim kurumlarının rolünün değerlendirilmesi: Kuveyt ve Suriye üzerine karşılaştırmalı bir çalışma"}
