abstract: "“Usul-i Fıkıhta ”Menât“ Kavramı”başlıklı bu çalışmanın amacı usul-i fıkıh literatüründe menât kavramının mahiyetini ve fürû-i fıkıhtaki yansımalarını ortaya koymak; özellikle menâtın illetle olan ilişkisini incelemektir. Zira konuyla ilgili yapılan çalışmalarda menât kavramının ya ictihâd ile ilişkisi bağlamında ya da menâtın kısımlarının makale şeklinde ele alınmasıyla incelenmeye tabi tutulduğu gözlemlenmiştir. Ancak bunlar da oldukça sınırlı olup menâtın ilk ne zaman ortaya çıktığı, illetle ilişkisinin ne olduğu ve hangi amaçla kullanıldığı yönünde bilgi vermemektedirler. Çalışmamızda ise söz konusu durumlar incelenmeye tabi tutulmuş ve bu hususta mütekellimîn ekolüne ait temel kaynaklar ile memzûc ekole göre tasnif edilmiş olan eserler esas alınmıştır. Çünkü klasik dönem Fukahâ ekolüne ait literatürde menât kavramı ve bu kavramın üçlü taksimine rastlanılmamıştır. Ancak menât kavramının geçirdiği tarihi süreci ortaya koymak amacıyla gerek Fukahâ gerekse Mütekellimîn ekolüne ait ilk ve klasik dönem usul-i fıkıh eserleri ile bunların şerh ve haşiyelerinden meşhur olanlarından istifade edilmeye çalışılmıştır. Nitekim söz konusu kaynaklarda usûlcülere ait görüşler; farklılık arz ediyorsa ayrı ayrı, örtüşüyorsa birlikte zikredilmiştir. Bunun yanı sıra kavramlar arasındaki farklılıklara değinilmiş ve ayrıldıkları noktalara da kısaca temas edilmiştir. Ayrıca doğrudan konuyla ilgili olan terimlere yer verilmiş ve bu tanımlarla yakın ilişki içinde olan diğer kavramlarla mukayese yapılıp işâret olunan anlamlar değerlendirilmeye çalışılmıştır. Son olarak; yapılan çalışmanın neticesinde ulaşılan bulgulara göre, menât kavramının usûlcüler tarafından sadece“illet”olarak dar bir anlamda değil, aksine ictihâd, sebep, hikmet ve hükmün mahallini de içine alacak şekilde geniş ve kapsamlı olarak kullanıldığı ve zaman içinde anlam genişlemesine uğradığı müşahede edilmiştir."
