abstract: "Osmanlı Devleti kuruluşundan itibaren fethettiği topraklara hukuki düzeni sağlamak için kadıları atamışlardır. Bu bakımdan klasik dönem Osmanlı hukukunun temsilcisi olan kadı, bulunduğu yerlerde o bölgenin hukuki işlerine baktığı gibi aynı zamanda beledi, idari, ekonomik ve sosyal başta olmak üzere bir çok alanda yetkisi bulunmaktaydı. Kadılar, tayin edildiği bölgede şer'iyye sicilleri denilen defterleri tutmaktaydı. Bu siciller kadıların mahkeme kayıtlarını temsil etmekle birlikte içerisinde ilgili bölgenin idarî, askerî, iktisadî, dinî ve kültürel manada bir çok bilgi barındırmaktadır. Ancak XIX. yüzyıla gelindiğinde değişen hukuk sistemi ile birlikte kadıların da yetki ve görevleri değişmiştir. Artık şer'iyye sicillerindeki bilgi çeşitliliği de azalmaya başlamıştır. 1443 numaralı şer'iyye sicili, sicillerdeki bu daralmayı göstermesi bakımından önemli bir yere sahiptir. Zira incelenilen defter kadıların görev ve yetkilerinin daralmasını ortaya koyan, içerisinde bulunan kayıtlara bakıldığında kadıların danışma meclisi haline geldiğini gösteren güzel bir örnektir. Osmanlı Devleti'nin son yıllarına denk gelen 1443 Numaralı Giresun Şer'iyye Sicili'nin çalışılmasında etkin rol oynayan bir diğer husus ise Osmanlı hukukunun merkezin aksine taşralarda nasıl işlediğini anlamaya çalışmak olmuştur. Bu bakımdan merkezde çıkartılan kanunnâme ve nizamnâmelerin taşralarda ne kadar etkili olduğu ortaya koyulmaya çalışıldı. Şer'iye sicilleri içerisinde Giresun'a ait bir sicil çalışılmasının nedeni ise hem merkezden uzak bir taşra olması hem de çevresinde bulunan Trabzon ve Samsun gibi büyük ticaret şehirlerinin arasında olduğu için içerisinde Rum ve Ermeni gibi milletleri barındırmasıdır. Zira şer'iyye sicillerindeki bilgiler ışığından bu milletlerin Müslümanlar ile olan iletişimi ve yaşam şekilleri hakkında fikir sahibi olunabilmektedir. Ancak yaklaşık iki yıllık bir süreyi kapsayan bu defterden genel bir kanıya varılmayacağından yapılan diğer çalışmalar yani defterlerle mukayese edilerek daha net bilgiler elde edilebilmektedir. Bu bakımdan şer'iyye sicilleri içerisindeki bilgilerin muhtevası bakımından transkript ve değerlendirilmesi yapılan 1443 Numaralı Giresun Şer'iyye Sicili özellikle şehir tarihi araştırmacılarına katkı sağlayacaktır."
