abstract: "“İslâm Hukukunda Yetkisiz Temsil ve Hukukî Sonuçlan”adlı çalışmamız giriş ve iki bölümden oluşmaktadır. Birinci bölümde, Yetkiye dayalı temsil ve yetkisiz temsil hakkında bilgi verilmiştir. Yetkiye dayalı temsil, temsil yetkisini aldığı kaynağa göre temsil, kendisine bağlanan sonuçlara göre temsil ve temsilin sona ermesi başlıkları altında incelenmiştir. Yetkisiz temsil ise, hukukî mahiyeti, yetkisiz temsilin çeşitleri, yetkisiz temsil ile doğrudan ilgili kavramlar ve yetkisiz temsilin tarihçesi şeklinde incelenmiştir. İkinci bölüm yetkisiz temsilin hukukî sonuçlarına ayrılmıştır. Bu bölümde, yetkisiz temsilin hukukî geçerliliği, olumlu ve olumsuz yaklaşımların delilleri verilerek değerlendirilmiş; borçlar hukuku ve aile hukukunda yetkisiz temsil incelenmiştir. Daha sonra temsil edilen, yetkisiz temsil eden ve üçüncü şahıs arasındaki ilişki, temsil edenin satımında sattığı malı icazetten önce müşteriye teslim etmesi durumunda gasp hükümleri geçerli olduğundan satılan malın tesliminden önceki ve sonraki durumu göz önünde bulundurularak değerlendirilmiştir."
