abstract: "Çalışma, bu bankalarda ele alınan Murabaha sözleşmelerinin metinlerindeki yasal boşlukları tespit etmek üzere Yemen'in önde gelen bankalarındaki KÂR BEYANI İLE SATIM (MURABAHA) sözleşmelerini analiz etmeyi ve bunlara yönelik bir mekanizma geliştirmeyi amaçlamıştır. Buna göre çalışma, Yemen hukukundaki hükümlerine değinirken, sözleşmelerin hukuki düzenlemelerinin ve emsal belgelerinin tanımı ile genel olarak sözleşmenin ve özelde Murabaha sözleşmesinin kapsadığı kuralları ele almıştır. Ardından murabaha sözleşmelerinde yasal boşlukların bulunmasından kaynaklanan en önemli risklerden bahis ederken bu boşlukların sözleşmeye etkisine değinmiştir. Araştırmanın amaçlarına ulaşmak için araştırmacı, tümevarımsal ve betimsel analitik yöntemi kullanmıştır. hedef bankaların verdiği Murabaha sözleşmelerinin modellerinin kullanılmış olup analiz edilmiştir içlerindeki yasal boşlukların reddedilerek değişiklik metninin önerilmiştir. Çalışmada, bu sözleşmelerin pratik uygulamada sorun yaratacak yasal boşluklar içerdiği ve bu boşlukların bankaları ve müşterileri hukuki risklere maruz bıraktığı, Bunun nedeni, bankaların sözleşme hazırlarken esas olarak hukukçulara dayanmadığı ya da yasayı ihlal etme pahasına da olsa paralarının geri alınmasını garanti altına alan hükümler koymayı tercih ettiği sonucuna varılmıştır. Çalışma, bankaların bu boşlukları gidermek için önerilen mekanizma ve seçenekleri benimsemelerini, yasal yetkinliğe ve hukuki uzmanlığa sahip olanlara dayanmalarını ve Murabaha sözleşmesinin kısmi ayrıntılarını tamamlayan yasama maddeleri üzerinde çalışmasını ve bu kısmi ayrıntılarının kanunlar arasında dağıtılması medeni ve ticaret hukukunda toplanmasını tavsiye etti."
