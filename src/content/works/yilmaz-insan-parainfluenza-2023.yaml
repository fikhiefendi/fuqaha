abstract: "Solunum yolu enfeksiyonları tüm dünyada mortalite ve morbiditenin ilk nedenleri arasında yer almakta olup, bunlara neden olabilen bakteriler ve diğer mikroorganizmalar bulunsa da en sık rastlanan etken virüslerdir. Enfeksiyonlar en fazla Kasım-Mart ayları arasında görülmekte ve en yaygın etkenler arasında İnfluenza A, Respiratuar sinsityal virüs (RSV) ve Parainfluenza virüsleri yer almaktadır. Dünyada alarm seviyesindeki antibiyotik direnci gibi, antiviral ajanlara direnç gelişimi de enfeksiyonların tedavi süresinin uzamasına ve ekonomik kayıplara neden olmaktadır. Bu nedenle antivirallerin yerinde ve akılcı kullanımının yanısıra alternatif tedavi stratejilerine de ihtiyaç duyulmaktadır. Çalışmamızda özellikle çocuklukta sık karşılaşılan RSV ve Parainfluenza virüsüne karşı ribavirin, favipiravir ve oseltamivirin antiviral aktiviteleri tek başlarına ve birbirleri ya da solunum yolu enfeksiyonlarında sıklıkla reçete edilen mukolitik ilaçlardan NAC ve erdostein ile kombinasyon halinde araştırılmıştır. Parainfluenza virüs için konak olarak VERO, RSV için ise HEp-2 hücreleri kullanılmış, bahsi geçen ilaçların bu hücreler üzerinde sitotoksisite testleri yapılarak CC50 değerleri hesaplanmıştır. İlaçların tek başlarına ve kombinasyon halindeki antiviral aktiviteleri MTT boyama yöntemi ile test edilerek EC50 değerleri ve kombinasyon sinerji skorları hesaplanmış, ayrıca plak oluşumu yöntemi ile de antiviral etkileri test edilmiştir. Antivirallerin sitotoksik dozları VERO ve HEp-2 hücrelerinde ribavirin için sırasıyla 147,5 ve 108,6; favipiravir için 121,6 ve 223,9; oseltamivir için ise 428,3 ve 291,6 µg/ml tespit edilmiştir. MTT ile antiviral aktivite çalışmalarında Parainfluenza virüs ve RSV'ye karşı ribavirinin EC50 değerleri sırasıyla 11,65 ve 4,45 µg/ml; favipiravirin 9,78 ve 14,1; oseltamivirin ise 13,1 ve 7,67 µg/ml bulunmuş, plak oluşumu deneyleri ile ise %50 inhibisyona neden olan konsantrasyonlar ribavirin için sırasıyla 9,21 ve 3,39; favipiravir için 7,30 ve 13,99; oseltamivir için ise 13,38 ve 9,11 µg/ml olarak belirlenmiştir. Antiviral ilaçlar birbirleri ile kullanıldıklarında, favipiravirin yer aldığı kombinasyonarla aditif etki sağlanırken, ribavirin ve oseltamivir arasında sinerjist aktivite tespit edilmiştir. Mukolitikler ise tek başlarına kullanıldıklarında belirgin bir viral inhibisyona neden olmazken, antivirallerle kombinasyon halinde etkileri aditif olarak nitelendirilmiştir. Çalışmamızda elde edilen bulguların, üzerlerinde pek çok umut verici çalışma yapılan antiviraller ve yeni yaklaşımlarla oluşturulacak alternatif tedavi rejimleri ile bulaşıcı hastalıkları kontrol altına alma ve yok etme stratejilerine katkı sağlayacağı görüş ve inancındayız."
