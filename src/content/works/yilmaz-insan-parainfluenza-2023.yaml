title: "İnsan Parainfluenza Virüs ve Respiratuvar Sinsitiyal Virüse Karşı Ribavirin ve Mukolitik İlaçların Tek Başına ve Kombinasyon Halinde Antiviral Etkinliğinin İncelenmesi"
titleTranslation: {"en": "Investigation of the antiviral effectiveness of ribavirin and mucolytic drugs against human parainfluenza virus and respirative syncitial virus, alone and in combination"}
