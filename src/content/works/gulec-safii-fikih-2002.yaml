abstract: "ÖZET İslam kültür tarihinde hadise dair farklı bakış açılarının tespit edilmesi ve bunların günümüz tartışmalarına katkısı açısından klasik hadis usûlü yegane kaynak değildir. Bu katkıyı geleneksel islamî ilimler yanısıra geç dönem bilim dallarının pek çoğu sağlayabilir. Fıkıh usûlünün hadisi ele alışı ve fıkıh usulcülerinin bakış açılarının da hadis ilmine katkıları yetirince bilinmemekle birlikte araştırmamızda bu katkının boyutları görülecektir. Bu çalışma“Şafiî Fıkıh Usûlünde Hadis Metodolojisi”başlığı ile hadislerin tespiti konusu ağırlıklı olmak üzere şâfiî fıkıh usulcülerinin hadis metodolojisini incelemiştir. Üç bölümden meydana gelen araştırmanın birinci bölümde hadislerin bilgi değeri bağlanımda, kesin doğru ve kesin yalan haberler ile ilgili değerlendirmeler ele alınmıştır. Kesin doğru haberler çerçevesinde ön plana çıkan mütevatir haberler ayrı bir başlık olarak incelenmiştir. İkinci bölümde elimizdeki hadise dair bütün rivayetleri kapsayan“haberu'l- vâhid”konusu ele alınmıştır. Haber-i vahidin bilgi değeri üzerindeki tartışmalar bağlanımda haber-i vahidin zan ifade ettiği ile karineli haber-i vâhid konusu bu tartışmaların odak noktasını oluşturmuştur. Yine Haber-i vâhid ile amel etmek gerektiği yolundaki şâfiî usûlcülerin farklı değerlendirmeleri, bu bölümün önemli bir konusudur. Haber-i vâhid ile amel etmek için fıkıh usûlünde râvî ile ilgili değerlendirmeler ile metin tenkidi bağlanımda, haber-i vâhid Kur' ân, haber-i vâhid umumî beivâ, haber-i vâhid kıyas ilişkisi üzerinde durulmuştur. Üçüncü bölümde haberin bilgi değeri dışında kalan hadis usûlünün diğer tartışmalarına yer verilmiştir. Bu çerçevede ihtilâfu'l-hadis konusunu ilgilendiren nesh ve birbiri ile çelişkili hadislerden hangisinin tercih edileceği ile ilgili kaideler üzerinde durulmuştur. eş-Şâfiî ile ilgili gündeme gelen mürsel hadisin delil kabul edilmesi hakkındaki şâfiî fıkıh usulcülerinin farklı değerlendirmeleri tartışılmıştır. Yine hadis usulünün önemli tartışma konusu olan cerh ve ta' dil kapsamında, cerh ve ta' dil edeceklerin sayısı, mutlak cerh ve ta' dil, zımnen ta' dil ve sahabenin adaleti konulan tartışılmıştır. Son olarak sahip oldukları vasıflar nedeniyle, rivayeti kabul edilen ile edilmeyen râvîlerin durumu ele alınmıştır. 341"
