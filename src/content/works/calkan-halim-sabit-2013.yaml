abstract: "Bu çalışma, Halim Sabit Şibay?ın İslâm hukukunun tarihî gelişimi ile ilgili, özellikle de içtihâd ve örf ile alâkalı yaklaşımlarını ortaya koyarak kendi zamanında yaşanan sosyal, siyasî, dinî vb. sorunlara nasıl bir bakış açısı ile çözüm bulmaya çalıştığını ve eleştirilerini tespit etmeyi amaçlamaktadır. Halim Sabit Şibay?ın İslâm Hukuku İle İlgili Görüşleri? başlığı altında yapılan bu çalışma, giriş bölümü dışında üç bölümden oluşmaktadır. Birinci bölümde, çalışmanın tarihî ve teorik arka planı ele alınmakta ve buna bağlı olarak da ana hatları ile dönemin sosyal yapısından bahsedilmektedir. Sonra Halim Sabit?in hayatından, eserlerinden, ilmî zihniyetinden ve faaliyetlerinden söz edilerek birinci bölüm tamamlanmaktadır. İkinci bölümde, Halim Sabit?in İslâm hukukunun tarihî gelişimi ile ilgili yaklaşımları ele alınmaktadır. Burada müellifimizin fıkıh tarihini bir içtihâd tarihi olarak nasıl ele aldığı anlatılmaktadır. Bu çerçevede yazarın, içtihâdı kendi örf anlayışı çerçevesinde tanımladığı ve fıkıh tarihini bir içtihâd tarihi olarak sunduğu tespit edilmektedir. Üçüncü bölüm üç ana başlık çerçevesinde ele alınmaktadır. İlk ana başlık çerçevesinde Emile Durkheim ve Ziya Gökalp?tan kısaca söz edildikten sonra Halim Sabit?in içtimâî usûl-i fıkıh anlayışından bahsedilmekte, sonra da İzmirli İsmail Hakkı?nın içtimâî usûl-i fıkıh anlayışına getirdiği eleştiri sunulmaktadır. İkinci ana başlık çerçevesinde müellifimizin örf kavramı ile ilgili olduğunu düşündüğü ma?ruf, takvâ gibi kavramlar ve İslâm?ın ilk devirlerinden itibaren teşrî? salahiyetinin nasıl ve kimler tarafından gerçekleştirildiği hususu zikredilmekte, ?velâyet-i diniye? ve ?velâyet-i hukukiye? bahisleri ele alınmaktadır. Üçüncü ana başlık çerçevesinde ise yazarın furû? konusundaki görüşleri incelenmekte ve yapılan açıklamaların çoğunlukla klasik fıkıh anlayışı çerçevesinde olduğu görülmekle beraber, örf merkezli bir çerçeve çizdiği ve bir çıkış yolu aradığı düşünülmektedir."
