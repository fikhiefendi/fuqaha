abstract: "Tezin Amacı : Büyük müçtehit Ebû Yûsuf'un borçlar hukukuna dair içtihatlarınındelilleriyle sistematik olarak tasnif edilip, bu içtihatların borçlar hukuku açısından öneminiortaya koymak.Tezin Muhtevası : Tez, giris ve iki bölümden olusuyor. Giriste, tezin hazırlanısı,konusu, önemi, kapsamı, yöntem ve kaynakları hakkında bilgi veriliyor. Ebû Yûsuf'un hayatı,ilmî sahsiyeti, eserleri ve yasadığı dönem ele alınıyor. Bu dönemdeki siyasal ve sosyal sartlarinceleniyor. ?slam Hukuk Ekolleri ve hususiyetleri özetleniyor.Birinci bölüm, ?slam Hukukunda borcun kaynakları hakkındadır. Bu bölümde, ?slamBorçlar Hukukunun kendine özgü sistematiği özetleniyor. Borç doğuran kaynaklar dört kısımhalinde; a- hukûkî islemden doğan borçlar, b- kanundan doğan borçlar, c- haksız fiilden doğanborçlar, d- haksız kazanç ve sebepsiz zenginlesmeden doğan borçlar olarak sunuluyor.Hukûkî islemler, ?tek taraflı irade beyanı? ve ?akit? olmak üzere iki kategorideisleniyor. Satım akdi model bir akit olup îcâb ve kabûl ile kurulur. Bâyî (satıcı), müsteri (alıcı),mebî (satılan) ve semen (satım bedeli) olmak üzere dört unsurdan olusur. Ebû Yûsuf, bütünakitlerde kendine özgü içtihatlara sahiptir.?kinci bölüm, ?slam Hukukunda borç kavramı, borcun hükmü, intikali, sona ermesi veödeme yolları hakkındadır. Ebû Yûsuf, borcun zamanında ödenmesini ister. Borcunu ödemeyenborçluya karsı sert tedbirler alınmasından yanadır. Borca kefil olan kimsenin bu tahhüdünüyerine getirmek zorunda olduğunu, borçlunun ölümü halinde terikeden borcun tahsil edilmesiniesas alır. Sahıs hürriyetine büyük önem veren Ebû Yûsuf, hakkın kötüye kullanılmasını (teassüf)kabul etmez.Tez, ulasılan bulguların özetlendiği bir sonuçla bitirilmektedir."
