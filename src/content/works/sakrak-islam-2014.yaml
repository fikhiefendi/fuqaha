abstract: "Günlük ibadetler, ilahi dinlerde önemli bir yere sahiptir. İnsan ile yaratıcısı arasındaki en kuvvetli bağ bu ibadetler vasıtası ile oluşur. Bütün ilahi dinlerde şekil ve içeriği farklı olmakla birlikte günün belli vakitlerinde yapılması gereken ibadetler vardır. Bununla birlikte birtakım sebeplerden dolayı günlük ibadetlerde bazı kolaylıkların sağlanması her ilahi dinde mevcut olan bir durumdur. Yahudilik, Hıristiyanlık ve İslam'da asıl olan her ibadeti vaktinde yapmaktır. Namaz ibadetinde de asıl olan onu vaktinde kılmaktır. İslam'da günlük namazların belli vakitlerde birleştirilerek kılınması bir kolaylık durumudur. Namazların birleştirilmesinin şekli ve sınırları konusunda asıl belirleyici faktör Hz. Peygamber'in bu konudaki uygulamalarıdır. İslam fıkıhçıları da Hz. Peygamber'in uygulamalarından yola çıkarak içtihatta bulunmuşlardır. Namazların birleştirilerek kılınabilmesi durumu günümüz için de büyük önem arz etmektedir. İslam'da ibadetlerde kolaylık ilkesi inananlar için Allah'ın bir rahmetidir. Günümüzde var olan bir takım zorluklar karşısında ibadetlerde kolaylık prensibinin uygulanması her inanan için önemli bir avantajdır. Günlük ibadetlerde başka bir deyişle namaz ibadetinde kolaylık sınırlarının çok sıkı bir şekilde belirlenmesi ve su istimale yola açabilecek içtihatlardan sakınılması gerekir. Aksi takdirde günlük ibadetlerin edası Şari'in rızasına uygun olmayan bir hale dönüşür."
