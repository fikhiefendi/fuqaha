abstract: "İslâm hukukunda evlenme ehliyeti, hem evlenme rüşdü hem de velayet ile ilgilidir. Erkeğin tam ehliyet sahibi olmasında bir ihtilâf yokken, kadının velisiz evlenip evlenemeyeceği tartışmalı bir konudur. Medenî Kanuna göre ise, evlenme rüşdüne ulaşmış her kadın ve erkek evlenebilir. Diğer taraftan boşanma sistemi, İslâm hukukunda üç şekilde işlemektedir: Tek taraflı boşanma, karşılıklı anlaşarak boşanma ve mahkeme yoluyla boşanma. Tek taraflı boşanmada, erkeğe tam yetki verilirken, kadına ancak belli sebeplerden dolayı erkeğin hakkını devretmesiyle yetki tanınmaktadır. Medenî kanunda ise, taraflar ancak mahkemeye başvurarak boşanabilirler. iv"
