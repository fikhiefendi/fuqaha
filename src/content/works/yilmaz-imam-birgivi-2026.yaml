abstract: "Kur'ân'ın tecvîd kaidelerine riayet edilerek tilâvet edilmesi, İslâm ilim geleneğinde üzerinde hassasiyetle durulan bir meseledir ve bu alanda kaleme alınan eserlerden biri de İmam Birgivî'nin ed-Dürrü'l-Yetîm fi't-Tecvîd adlı manzum çalışmasıdır. Eserin medreselerde ders kitabı olarak okutulması, üzerine farklı dönem ve coğrafyalarda çok sayıda şerh yazılmasını beraberinde getirmiştir. Ancak bu şerhlerin bütününü konu edinen, muhtevalarını mukayeseli biçimde ortaya koyan müstakil bir çalışma bulunmamaktadır. Bu çalışma, söz konusu boşluktan hareketle, ed-Dürrü'l-Yetîm üzerine yazılmış şerhleri mukayeseli olarak inceleyerek tecvîd ilmine dair klasik şerh geleneğinin genel karakterini ve bu geleneğin işlevini ortaya koymayı amaçlamaktadır. Bu amaç doğrultusunda öncelikle başta Türkiye Yazma Eserler Kurumu koleksiyonları olmak üzere çeşitli yazma eser katalogları taranmış ve ed-Dürrü'l-Yetîm üzerine yazılmış beş şerh tespit edilmiştir. Tespit edilen şerhler, tecvîdin tanımı, harflerin mahreçleri, harflerin sıfatları, tilâvetin keyfiyeti ve tembîhât olmak üzere beş ana başlık çerçevesinde mukayeseli yöntemle incelenmiştir. Çalışma giriş, iki bölüm ve sonuçtan oluşmaktadır. Birinci bölümde İmam Birgivî'nin hayatı, ilmî şahsiyeti ve eserleri hakkında, ardından tespit edilen şerh ve şârihler hakkında bilgi verilerek çalışmanın tarihî ve ilmî zemini ortaya konulmuştur. İkinci bölümde ise Muhammed b. Fethullâh b. Mahmûd el-Mevsılî ed-Dârendevî'nin Cevheru'l-Vesîm Şerhu'd-Dürri'l-Yetîm, Seyyid Ali b. Hüseyin Eskicizâde'nin Tercüme-i Dürr-i Yetîm, Ahmed b. Abdülkâdir el-Akhisârî el-Hanefî'nin Şerhu'd-Dürri'l-Yetîm fi't-Tecvîd, Dâvûd-i Karsî'nin Şerhu'd-Dürri'l-Yetîm ve Muhammed Fâiz b. İbrahim el-Merâmî'nin ed-Dercü's-Selîm li-Hıfzi'd-Dürri'l-Yetîm adlı eserleri, belirlenen beş başlık altında tek tek ve mukayeseli olarak değerlendirilmiştir. İnceleme neticesinde şerhlerin ortak hedefinin ana metni açıklamak olduğu, buna karşılık açıklamaların kapsamı, kullanılan üslup ve kıraat kaynaklarından yararlanma düzeyi bakımından önemli farklılıklar gösterdiği tespit edilmiştir. Bu farklılıklar, tecvîd şerh geleneğinin tek tip bir aktarım biçiminden ibaret olmadığını, şârihlerin hitap ettikleri okuyucu kitlesi ve ilmî öncelikleri doğrultusunda farklı yöntem ve seviyelerde eser verdiğini göstermektedir. Sonuç bölümünde ise bu değerlendirmeler ışığında klasik literatürdeki tecvîd şerh geleneğinin genel karakteri ortaya konulmuş ve bu eserlerin uygulama açısından taşıdığı önem vurgulanmıştır."
