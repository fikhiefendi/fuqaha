abstract: "Sahâbîler dini doğru bir şekilde öğrenme, anlama ve yaşama gayretindeydiler. Hz. Peygamber'e düşkünlükleri ve ilim öğrenme arzusundan dolayı onun yanından bir an bile olsun ayrılmamaya özen gösteriyorlardı. Hz. Peygamber'den sadır olan sözleri ezberliyor, onun yaptığı fiillere tanıklık ediyorlardı. Böylece doğrudan Hz. Peygamber'den aldıkları bu hadisleri ve bilgileri kendilerinden sonraki kuşağa aktarma imkânı buldular. Kendilerinden sonra gelen bütün İslâm bilginleri başka hiçbir yerde bulma imkânına sahip olmadıkları bu bilgileri onlardan aldılar. Bundan dolayı Kur'ân'ın, sünnetin ve İslâm'ın korunması ve doğru anlaşılması noktasında büyük bir öneme sahiptirler. Bizde bu çalışmamızda fetvâ ehliyetine sahip olan fakih sahâbîlerin hayatlarını, nasları anlama ve yorumlama biçimleriyle karşılaştıkları yeni meselelere çözüm getirirken kullandıkları yöntem ve başvurdukları kaynakları inceleme konusu yaptık. Bu bağlamda hayatlarını ele aldığımız fakih sahâbîleri verdikleri fetvâ yoğunluklarına göre çok sayıda fetvâ verenler, orta derecede fetvâ verenler ve az sayıda fetvâ verenler olarak gruplandırıp kısaca hayatlarını verip ilmi kişiliklerini inceledik. İlmi kişiliklerini incelediğimiz fakih sahâbîlerin vermiş oldukları fetvalardan tespit edebildiklerimizi kaleme aldık."
