abstract: "Fıkıh kitaplarında birçok dinî hükmün meşruiyet temelini göstermek üzere başvurulan, fıkıh usûlü eserlerinde ise kaynaklar teorisinin vazgeçilmez bir üyesi olarak yer alan ve temel şer'î deliller arasında genellikle üçüncü sıraya yerleştirilen icmâ, İslâm fıkıh ve kültürünün çok önemli kavramlarından biridir. Bu çalışmada Şâfiî mezhebinin büyük âlimlerinden, hem usûl hem de fürûda birçok eser yazan ve özellikle usûl alanında bıraktığı el-Lüm'a, Şerhu'l-Lüma', ve et-Et-Tebsıra adlı eserlerinin sahibi eş-Şîrâzî'nin icmâ anlayışı ortaya konmaya çalışılmıştır. Araştırma, bir giriş üç bölüm ve bir sonuçtan oluşmaktadır. Girişte, araştırmanın amacı, kapsamı, önemi ve metodu ele alınmıştır. Birinci bölümde Şîrâzî'nin hayatı, ilmi gelişimi, hocaları, öğrencileri ve eserleri hakkında bilgiler verilmiştir. İkinci ve üçüncü bölümde Şîrâzî'nin icmâ hakkındaki düşünceleri incelenmiştir. Son bölüm ise genel değerlendirmeler ve sonuçtan ibarettir."
