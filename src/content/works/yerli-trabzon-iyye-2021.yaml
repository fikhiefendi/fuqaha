abstract: "Bu çalışmada, kişiler arasında geçmişten günümüze değin varlığını devam ettiren meselelerden biri olan miras konusunun Trabzon mahkemesine yansıyan örnekleri incelenmiştir. Çalışmamızın ana kaynağını 1855 ve 1856 numaralı Trabzon Şeriyye Sicilleri oluşturmaktadır. Çalışma H. 1097-1100/ M. 1685/1688 yılları arasında yaşanan miras davalarını içermektedir. Bu çalışma üç ana bölümden oluşmaktadır. Birinci bölümde miras hukukunun İslam hukuku ve Osmanlı hukuku içerisindeki yeri ve önemi üzerinde durulmuştur. Bu kısımda ilk olarak hukuk kavramı üzerinde durularak İslam hukukunun oluşum aşamalarına değinilmiştir. Daha sonra miras hukukunun içeriğinden bahsedilerek Osmanlı hukukunda miras konusu incelenmiştir. İkinci bölümde miras meselelerine dair kayıtlar konularına göre tasnif edilerek ayrı başlıklar halinde incelenmiştir. Son bölümde ise dava kayıtlarında kişilerin sosyal statüsü, kadınların miras hukukundaki konumu ve gayrimüslimlerin miras hukukunda yeri gibi başlıklarla genel değerlendirmeler yapılmıştır. Yine bu bölümde davaların genel bir analizi yapılarak birtakım çıkarımlar yapılmıştır."
