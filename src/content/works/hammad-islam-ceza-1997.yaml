abstract: "ÖZET Hammad Muhammed Âlem,“İslam Ceza Hukukunda Suça İştirak”, Yüksek Lisans Tezi (Danışman; Prof. Dr. İbrahim Çalışkan 113 s. Tezimizin ilk bölümünde İslam Ceza Hukuku'nda iştirak kavramı ve iştirakin şekilleri ile suça iştirakin unsurlarını ele almaya çalşıtık. İkinci bölümde ise, İslam Ceza Hukuku'nda iştirak halinde işlenen suçlara öngörülen cezalar ele alınarak aslî ve fer'î fail ayrımı ile kasıtlı, taksirli, tahrikçi, ta'zir ve ikrah gibi suç ortaklığında ortakların İslam Ceza Hukuku açısından ne şekilde sorumlandırılması ve cezalandırılması gerektiğini belirleyen konulan ele aldık. Bu bağlamda İslam Ceza Hukuku'nu üç ana bölümde incledik. bunlar; hadd cezalan, kısas vediyet cezalan ile ta'zir cezalandır. Tezimizin sonunda ise çağdaş hukukçulara göre iştirak ve iştirakle ilgili ana konulan tekrar özetlemeye çalıştık."
