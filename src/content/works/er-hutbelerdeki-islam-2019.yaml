abstract: "Hicretten sonra Müslümanlara cuma namazı ibadetinin farz kılınmasıyla birlikte ilk olarak Hz. Peygamber tarafından başlatılan cuma hutbesi, Türkiye'de 1924 senesinden bugüne Diyanet İşleri Başkanlığı kontrolünde devam etmektedir. Ülke genelinde her cuma aynı hutbe okunmakta ve hutbeler aracılığıyla farklı toplumsal sınıflardan milyonlarca insana ulaşılmaktadır. Bu sebeple hutbe esnasında gündeme alınan her bir konu ve söylenen her bir cümle ayrı ayrı önem taşımaktadır. Literatüre bakıldığında hutbeler üzerine sınırlı sayıda çalışma yapılmış olmakla birlikte hutbelerde İslam iktisadı üzerine yapılmış bir çalışma bulunmamaktadır. Öncelikli olarak bu çalışmamızda, hutbenin kavramsal bir çerçevesi çizilerek tanımlaması yapılmış ve İslam dinindeki yeri belirtilerek tarihi süreci aktarılmıştır. Ardından ise günümüz Diyanet İşleri Başkanlığının hutbe hizmetleri üzerinde durulmuş ve son bölümde ise 2001-2018 yılları arasında İstanbul ilinde irâd edilen hutbelerde İslam iktisadına ilişkin hangi kavramların konu edildiği, ne sıklıklarla kullanıldığı ve nasıl bir içerik ile sunulduğu incelenmiştir. Ayrıca bu çalışmamız ile hutbeler üzerine alansal bir inceleme yapılmış ve hutbeler aracılığıyla günümüz Türkiye'sinde İslam iktisadı değerlerinin ele alınışı incelenmiştir. Yapılan analiz neticesinde ise ilgili dönemde İslam iktisadıyla ilişkili farklı alanlara yönelik kavramlara çok sık olmasa da hutbelerde yer verildiği görülmektedir. Bu kavramlar arasından özellikle sadaka, infak ve zekât gibi daha çok karşılıksız maddi destek vermeye ilişkin kavramların tercih edildiği ve bu kavramların da özellikle Ramazan aylarında hutbelerde konu edildiği tespit edilmiştir. Bununla birlikte kapitalist sistemin temel dinamikleri olan ve İslam dininde çok sert biçimde yasaklanan faiz gibi kavramlardan ise neredeyse hiç bahsedilmediği görülmektedir. Bu bağlamda çalışmamızın sonuç bölümünde ise ilgili hutbelerdeki eksiklikler belirtilerek çözüm önerileri sunulmuş ve ayrıca İslam iktisadının toplumda daha çok yaygınlık kazanmasının hutbeler yoluyla nasıl gerçekleştirilebileceğine değinilmiştir."
