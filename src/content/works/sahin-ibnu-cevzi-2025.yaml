abstract: "Ahkâm âyetleri, İslâm hukukunda ibâdât, muâmelat ve ukûbat bölümlerinden oluşmaktadır. Bu çalışmada, Ebu'l-Ferec İbnü'l-Cevzî'nin (ö.597/1201) oldukça zengin muhtevaya sahip Zâdü'l-Mesîr fî ʿİlmi't-Tefsîr adlı tefsirinde, ibâdât örneğinde ahkâm âyetlerine yaklaşımı ele alınmıştır. İbnü'l-Cevzî'nin ahkâm âyetlerini nasıl yorumladığı, bu yorumlarda hangi üslûp ve yöntemler kullandığı incelenmiştir. Çalışma giriş ve iki bölümden oluşmaktadır. Birinci bölümde İbnü'l-Cevzî'nin hayatı, ilmi yönü ve tefsir metodu ele alınmıştır. Her ne kadar eser, rivayet tefsiri örneği olarak kabul edilse de müellifin eserinde dirayet yöntemini de oldukça fazla kullandığı görülmektedir. Bu bölümde eserin rivayet ve dirayet yönü tanıtılmıştır. İkinci bölümünde ise İbnü'l-Cevzî'nin eserinde ibâdât (ibadetler) örneğinde ahkâm âyetlerine yaklaşımı ve bu âyetleri nasıl yorumladığı araştırılmıştır. İbnü'l-Cevzî, ahkâm âyetlerini açıklarken bu alanda tanınmış âlimlerin görüşlerini aktarmıştır. Özellikle sahabe, tâbiûn, selef âlimleri ve mezhep imamlarının görüşlerini nakletmiştir. Hanbelî mezhebine bağlı olduğu halde hüküm ifade eden âyetleri diğer mezhepleri de kapsayacak şekilde geniş çerçevede ele almıştır. Ayrıca bazen lügavî değerlendirmelerde bulunmuş bazen de soru-cevap gibi yöntemler kullanarak âyetleri yorumlamıştır. Hükümlerle ilgili rivayetleri aktardıktan sonra fasıl başlıkları açarak konuya dair değerlendirmelerde bulunmuştur."
