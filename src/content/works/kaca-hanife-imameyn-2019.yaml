abstract: "Hanefî mezhebinin teşekkülünde önemli bir paya sahip olan Ebû Yûsuf ve Muhammed eş-Şeybânî, Ebû Hanîfe'nin önde gelen talebelerindendir. Mezhep içerisinde“İmameyn”lakabı verilen bu iki müctehid, kimi zaman kendi aralarında kimi zaman da hocaları Ebû Hanîfe ile fıkhi görüş ayrılıkları yaşamışlardır. Bu İhtilaflar, mezhebin olgunlaşmasına zemin hazırlamasının yanı sıra İslam hukuk literatürünün zenginleşmesinde de rol oynamıştır. Bu ihtilafların incelenmesi; fakihlerin tartışmalarının bir arka planı olduğunu ve ulemanın fıkhî meselelerde hüküm verirken bir usule dayandığını ortaya koymak, ayrıca fıkhî meselelerde meleke kazanmak açısından önemlidir. Bu amaçlarla hazırladığımız çalışmamızda Ebû Hanîfe, Ebû Yûsuf ve Muhammed b. Hasan eş-Şeybânî arasında meydana gelen ihtilafları aile hukuku (münâkehât ve müferakât bahisleri) özelinde inceledik. İhtilafların tespitinde Mevsılî'nin el-Muhtar adlı eserini esas aldık ve altmış yedi ihtilaf tespit ettik. Söz konusu ihtilafların sebeplerini ve tarafların gerekçelerini bir takım Hanefî fıkıh eserlerinden yararlanarak ortaya koyduk. Araştırmamız neticesinde taraflar arasında ortaya çıkan ihtilaflarda ihtiyat ilkesinin, kavramlara yüklenen farklı anlamların, hadis tercih kriterleri ve nasslara yaklaşımlardaki farklılıkların ayrıca dönemin şartlarının etkili olduğu sonucuna vardık. Fıkhî tartışmaların muazzam bir arka planı olduğuna işaret eden çalışmamız; giriş, iki bölüm ve sonuç kısımlarından müteşekkildir. Giriş bölümünde mezkûr fakihlerin hayatları, eserleri ve içtihat metotlarından bahsettik. Birinci bölümde bu üç fakihin nikâh bahsindeki ihtilaflarını, ikinci bölümde ise talak bahsindeki ihtilaflarını inceledik. Sonuç kısmında ise incelenen ihtilaflar ile ilgili değerlendirmelere ve vardığımız neticelere yer verdik."
