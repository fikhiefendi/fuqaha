abstract: "Tezimiz iki bölümden oluşmaktadır. Tezin Giriş kısmında, çalışmanın içeriği ve yöntemine dair bilgiler verilmiştir. Tezin Birinci Bölümü, Hanefi mezhebinde şirketler hukukuna ayrılmıştır. Hanefi mezhebinde şirket kavramı, İslâm'da şirketin meşruiyet ve Hanefi mezhebinde şirket çeşitleri anlatılmıştır. Şirket çeşitleri, ticari olmayan şirketler ve ticari şirketler olarak iki kısımda incelenmiştir. Hanefi mezhebinde şirket akdini daha iyi kavramak amacıyla şirket akdinin diğer akitlerle ilişkisi, diğer mezheplerde ve modern dönemde şirket çeşitleri ele alınmıştır. Tezin İkinci Bölümü, Hanefi mezhebi bağlamında şirketler hukukunun tarihsel seyrine ayrılmıştır. Bu bölümde öncelikle Hanefi mezhebi literatüründe şirketler hukukunun ele alınışı ve tarihsel süreç içerisinde şirket çeşitleri aktarılmıştır. Sonrasında Hanefi mezhebinde şirket hukukunda değişen ictihad belirlenen konular çerçevesinde ele alınmıştır. Hanefi mezhebinde bu konuların ele alınışı kronolojik olarak aktarılmış, uygun yerlerde değerlendirmelere yer verilmiştir."
