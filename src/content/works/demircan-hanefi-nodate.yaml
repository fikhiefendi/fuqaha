abstract: "İslam hukukunda nasların hükme delâleti; kati ve zannî olmak üzere ikiye ayrılmaktadır. Hükme delâleti zannî olan naslar bu zannîliğin verdiği esneklik sayesinde hüküm üretiminde aklî istidlâlin kullanımını mümkün hale getirmektedir.“İstidlâl”kavramı mütekellim usulcüler tarafından çeşitli anlamlarda kullanılmıştır. İlk dönemlerde daha çok“delil talep etmek, delili araştırmak”şeklinde sözlük anlamıyla kullanılan istidlâlin; kıyas, içtihat ve istinbatla eş anlamlı kullanımlarına da rastlamak mümkündür. İmâmü'l-Harameyn el-Cüveynî (ö. 478/1085) ile birlikte ise istidlâlin kavramsal bir hüviyet kazanarak edille-i erbaâ (kitap, sünnet, icma ve kıyas) dışında beşinci şer'i bir delil kabul edildiği görülmektedir. Hanefi hukukçular ise istidlâl kavramını sözlük anlamıyla kullanmaktadırlar. Onlar mütekellim usulcüler gibi istidlâli beşinci bir delil kabul etmezler. Zira Hanefi usulünde sahih-fasit istidlâl ayırımı bulunmaktadır. Hanefilere göre lafzın delalet yolları dışında kalan istidlâller fasit istidlâl olarak kabul edilmektedir. Mütekellim usulcülerin beşinci delil kabul ederek kullandıkları istidlâl de lafzın delalet yolları dışında kaldığından Hanefî usulüne göre fasit istidlâl olarak değerlendirilmektedir. Diğer taraftan Hanefilerin ceza hukuku gibi hassas bir alanda mütekellim usulcülerin kullanımına uygun bir şekilde istidlâli kullandıkları görülmektedir. Çalışmada ceza hukuku bağlamında Hanefi hukukçuların had, öldürme ve yaralama (kısas) suçlarında kullandıkları aklî istidlâl metodu ele alınmaktadır. Bu bağlamda çalışma Hanefi ceza hukukunda aklın hüküm üretiminde nakle göre konumu; suçun sübut veya şekil şartlarında bulunan eksiklik, suç faili, mağdur, suçun işlendiği zaman, ehliyet arızaları ile suç aletinin cezai mesuliyete etkisi, öldürme ve yaralama (kısas)suçlarının cezasının infazında kullanılacak aletin belirlenmesi gibi hususlarda aklın rolünüele almaktadır.“Hanefî Ceza Hukukunda Aklî İstidlâl”başlıklı bu çalışma giriş, üç ana bölüm ve sonuç kısmından oluşmaktadır. Giriş kısmında araştırmanın amacı, kapsamı, kaynakları gibi konular yer almaktadır. Birinci bölüm konumuzun daha iyi anlaşılmasına katkı sunacağını düşündüğümüz“akıl”ve“istidlâl”kavramlarına gelenekte yüklenen anlamlar ve kavramsal çerçeveye ayrılmıştır.İkinci bölümde öldürme ve yaralama (kısas) suçlarındacezanın tespiti bağlamında verilen hükümlerin dayanağı olarak aklın etkinliği örnek hüküm ve olaylar çerçevesinde ele alınmıştır. Üçüncü bölümde isehad suçlarına verilecek cezanın tespitinde etkili olan aklî istidlâllere yer verilmiştir."
