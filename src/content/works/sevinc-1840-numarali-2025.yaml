abstract: "Şer'iyye sicilleri Osmanlı Devleti tarihinin mali, idari, askeri ve birçok alanda ayrıntılı olarak incelenmesinde temel kaynak olarak kullanılmaktadır. 1840 numaralı Şer'iyye Sicili H. Ramazan 1074-Muharrem 1075 / M. Mart-Temmuz 1664 yılları arası mahkeme kayıtlarını ihtiva etmektedir. Transkripsiyonu yapılan bu defter ışığında Doğu Karadeniz bölgesinde yer alan Trabzon'un sosyal, kültürel, idari, ekonomik birçok alanı incelenmiştir. Bu çalışmanın birinci bölümünde 1840 numaralı Şer'iyye Sicil Defteri'nin analizine yer verilirken, ikinci bölümde defterin transkripsiyonuna yer verilmiştir. Transkripsiyonu yapılan 1840 numaralı Şer'iyye sicil defterinde mülk satışları, hibe davaları, nikâh kayıtları, miras, sulh kayıtları, borç alacak, asayiş, kölelik ve merkezden gelen davalar yer almaktadır.“1840 Numaralı Trabzon Şer'iyye Sicil Defteri'nin Transkripsiyon ve Analizi”ismi ile hazırlanan bu tez çalışması, Osmanlı Devleti'nin sosyal ve idari tarihini araştıran tarihçilere yardımcı olması düşünülmektedir."
