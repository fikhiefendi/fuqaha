abstract: "Çalışmamız, İslam Miras Hukukunda miras sebepleri arasında sayılan vela kavramının incelenmesini ve bu konuda Osmanlı âlimleri tarafından kaleme alınan vela risalelerinin değerlendirilmesini kapsamaktadır. Ayrıca Osmanlı Devletinin yükseliş dönemi şeyhülislamları ve âlimleri arasında yaşanmış mezhep içi tartışmaları yansıtması bakımından da önemlidir.Vela kavramı, İslam Hukukunun Miras (Feraiz) Hukuku alt başlığında değerlendirilmiştir. Hükmi yakınlık olarak ifade edilen vela kavramının temeli kölelik müessesesine dayanmaktadır. İslam dini, bir taraftan kölelere insanca yaşama hakkı sağlarken diğer taraftan köle sahiplerini onları hürriyetlerine kavuşturmak için teşvik etmiştir. İşte bu teşviklerden birisi de köle azad etme ile elde edilen mirasçı olma hakkıdır.Vela konusunun günümüz açısından ihtiyaç duyulacak bir yönü kalmamıştır. Kölelik müessesesinin sona ermesiyle beraber vela yoluyla mirasçı olma meselesi, tarihsel bir olgu niteliği almıştır. Ancak İslam Miras Hukukunun tarihsel bir nitelik taşıyan vela konusu üzerinde değişik zaman ve şartlarda zengin değerlendirme ve tartışmalar yapılmıştır.Molla Hüsrev vela konusuyla ilgili olarak yazmış olduğu risalesinde klasik Hanefi yaklaşımının dışına çıkmış, ortaya koyduğu yeni yorumlarıyla büyük tenkitlere maruz kalmıştır. Hatta bu tenkitler müstakil risaleler şeklinde ortaya konulmuştur.Çalışmamızda; Molla Hüsrev' in hayatı, ilmi şahsiyeti ve eserleri hakkında bilgiler, vela konusunun İslam Hukuku açısından değerlendirilmesi, vela konusunda yazılan risalelerin tercüme edilmesi ve vela risalelerin Arapça metinlerinin tahkikli neşri bulunmaktadır. Ayrıca bu risalelerden elde ettiğimiz fikir ve görüşleri ortaya koyarak bunların karşılaştırılmasını ve ulaştığımız bilgiler hakkında kendi kanaatlerimizi sunmaya çalıştık."
