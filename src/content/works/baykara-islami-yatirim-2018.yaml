abstract: "Sermaye piyasalarında yatırım fonlarının geçmişine kıyasla yeni bir kavram olan islami yatırım fonları, Türkiye'de ilk kez Sermaye Piyasası Kurulu'nun III-52.1. sayılı Yatırım Fonlarına İlişkin Esaslar Tebliği'nde“Katılım Şemsiye Fonu”nun tanımlanmasıyla birlikte yasal bir zemine kavuşmuştur. Türkiye'de islami yatırım fonlarının, mevzuattaki ifadesiyle katılım fonlarının, ihraç edilmeye başladığı tarihten bu yana gelişen bir sermaye piyasası aracı olmasına karşın, katılım fonlarının yapısının, özelliklerinin ve geleneksel yatırım fonlarından farklılıklarının ortaya konulmasına ilişkin bir çalışma yapılmamış olduğu görülmüştür. Bu çalışmanın amacı; ülkemiz için yeni bir kavram olan katılım fonlarının nasıl ortaya çıktığının, temel özelliklerinin ve yönetim yapısının araştırılmasıdır. Bununla birlikte islami yatırım fonlarının geleneksel fonlara kıyasla yatırımcıya nasıl bir alternatif sunduğunun değerlendirilmesi amaçlanmaktadır. Bu amaç doğrultusunda; çalışmada, islami yatırım fonları ve bu fonların tabi olduğu temel piyasa olan islami finans piyasası, Türkiye'deki islami yatırım fonlarının yasal altyapısı ve mevcut piyasasına ilişkin bilgi verilmiş; Türkiye'de islami yatırım fonları ve geleneksel yatırım fonlarının büyüklükleri, portföy çeşitlilikleri, getirileri ve risk bazlı performansları karşılaştırmalı olarak analiz edilmiştir. Analiz sonucunda elde edilen verilere göre; katılım fonlarının Türkiye'de yeni bir araç olarak hızlı bir büyüme gösterdiği ve gelişme potansiyeline sahip olduğu, ancak geleneksel yatırım fonlarına kıyasla katılım fonlarının yatırımcıya daha az bir portföy çeşitliliği sunduğu tespit edilmiştir. Diğer taraftan, islami yatırım fonları ile geleneksel yatırım fonlarının getiri ve performansları karşılaştırmaya tabi tutulduğunda, yapılan fon gruplaştırmaları arasında getiri ve performans düzeylerinde büyük farklılıklar olmamakla birlikte geleneksel fonların getiri ve performans açısından ağırlıklı olarak islami yatırım fonlarına göre daha başarılı olduğu gözlemlenmiştir."
