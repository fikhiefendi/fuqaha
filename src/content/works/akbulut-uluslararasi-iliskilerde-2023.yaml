abstract: "Bu çalışma kapsamında, İslam dinindeki ümmet anlayışı en geniş anlamda bir değerlendirme yöntemi ile farklılıkların birlikte yaşamaları açısından incelenmiş ve bu çerçevede ümmet kavramının İslam Hukuku bağlamında bir birliktelik anlayışı oluşumuna etkisi araştırılmıştır. Günümüzde, toplumların ulusal ve uluslararası boyutta birbirleriyle iletişim ve etkileşimleri de Uluslararası İlişkiler disiplininin bir çalışma alanını oluşturmaktadır. Din olgusunun Uluslararası İlişkiler disipliniyle ilişkisi süreç içerisinde bir dönüşüm geçirmiş ve bu olgunun disiplin tarafından tamamen reddedilme durumu terk edilerek, disiplin tarafından dikkate alınması gereken bir unsur haline gelmiştir. Bu bağlamda din olgusu, Uluslararası İlişkilerde teorik boyutta bir dikkate alınmama durumuyla karşılaşmış olsa da, pratik boyutta dış siyasetin oluşumunda ve yürütülmesinde her zaman ve zeminde önemsenmiştir. İslam Hukukunda Uluslararası İlişkiler alanı, ilk dönemden itibaren hukuki bir temel üzerinden oluşturulmuştur. Bu bağlamda mütekabiliyet esasına başvurulmadan, İslami yönetimlerin tek taraflı dikkate almaları gereken düzenlemeler yapılmıştır. İslam Hukukunun bir alt unsurunu oluşturan ve İslam Hukuku kaynaklarına ve yöntemlerine tam bir bağımlılık ilişkisinde bulunan İslam Uluslararası Hukuku, değişim ve gelişim olgularına açık bir alanı oluşturmakta ve böylelikle ihtiyaç halinde içtihat çerçevesinde yeni düzenlemelere de imkan sunmaktadır. İslam Hukukunda, farklı kimliklerin varlığı onaylanmış ve tanışma odaklı bir anlayışla, farklılıklar zenginlik olarak değerlendirilmiş ve birlikte gerçekleşecek yaşamın oluşumu öngörülmüştür. Bu bağlamda, farklılıkların barışçıl bir şekilde birlikte yaşamaları için insanlar arasında eşitlik kabul edilmiştir. Ümmet kavramı, sınırlandırılması mümkün olmayan bir kapsam alanına sahip olup, bu kavram dahilinde yer almak isteyen herkese açık bir nitelik taşımaktadır. Bu bağlamda, ümmet kavramının“Ümmet-i İcabet”ve“Ümmet-i Davet”çerçevesinde tüm insanlığı kapsam alanına dahil etmesi, birleştirici etkisinin tezahürü niteliğindedir. Bu anlayışın en güzel örneğini ise, Medine şehrinde Hz. Muhammed (S.A.V.) tarafından akdedilen Medine Sözleşmesi oluşturmaktadır. Bu çalışma kapsamında, İslam Uluslararası Hukukunun bir özelliği olarak değerlendirilen“Ümmet İlkesi”kavramı toplumsal işbirliği bağlamında incelenmiştir. Bu bağlamda“Ümmet İlkesi”ile kastedilen; alınan tüm kararların ve gerçekleştirilen tüm eylemlerin (bireysel ve kurumsal; özel, sosyal ve ticari; idari ve siyasi; ulusal ve özellikle uluslararası), ilkesel olarak dikkate alınması gereken ümmetin toplamının (Ümmet-i İcabet ve Ümmet-i Davet) faydasına hareket etme prensibine uygun olması durumudur. Böylelikle, itikadi boyutta olmayan bir kavramsallaştırmayla; devletlerarası, milletlerarası ve toplumlararası bireysel ve kurumsal ilişkilerde ötekileştirmeme duygu, düşünce ve davranışı ile hareket edilmesi prensibinin ve toplumsal işbirliği açısından, ulusal ve uluslararası boyutta ortak ilkeler doğrultusunda barış içerisinde bir arada gerçekleşen bir yaşamın oluşturulması amaçlanmıştır. İslam Uluslararası Hukuku, tüm insanlığa hitap eden ve tüm insanlığın iyiliğini önceleyen düzenlemeler barındırmakta olup, bu kapsamda alınan tüm kararlarda ve gerçekleştirilen tüm eylemlerde, Ümmet-i İcabet ve Ümmet-i Davet anlayışı çerçevesinde bir değerlendirme yapılarak, ulusal ve uluslararası boyutta bir dayanışma düşüncesi ile ümmetin toplamının faydasına hareket etme prensibi ilkesel olarak benimsenmiştir. Sonuç olarak belirtmek gerekir ki; ümmet mefhumunu,“Ümmet-i İcabet”ve“Ümmet-i Davet”anlayışıyla tanımlamak, benimsemek ve takip etmek; günümüz dünyasının ortak sorunlarına“Ümmet İlkesi”çerçevesinde ortak çözümler bulabilme yolunda önemli bir yol gösterici niteliğinde olacaktır."
