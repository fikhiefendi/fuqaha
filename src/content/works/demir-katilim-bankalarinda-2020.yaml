abstract: "Son yıllarda bilimsel araştırmalara konu olan katılım bankacılığının bankacılık sektörü içindeki payı gittikçe artmaktadır. Reel ekonomiyi finanse etmek amacıyla faaliyetlerine başlayan ve bunları geliştirerek sürdüren katılım bankalarının KOBİ'lere sağlamış olduğu destekler ve bu desteklerin Türkiye ekonomisine katkılarının analiz edilmesi önemli ve gereklidir. Katılım bankaları reel ekonomiye destek olmak amacıyla resmi ticaret içerisinde olan ve faizsizlik prensibine uygun bir şeklinde çalışan bankalardır. Buradaki ana çalışma ilkesi; müşterilerine nakit para sağlamaktan ziyade yatırım, işletme kredileri, finansal kiralama projeleri ile onları desteklemektir. Bu araştırmayla, katılım bankalarının seçili ürünlerine ilişkin, firmaların algıladığı ekonomik fayda düzeyi ve milli ekonomiye sağlanan katkılar ile beraber algılanan faydanın firmaların özelliklerine göre farklılık gösterip göstermediğinin ortaya konulması amaçlanmıştır. Araştırma Ekim 2020 tarihinde yürütülmüş olup, Türkiye'de faaliyet gösteren 6 katılım bankası müşterilerini kapsamaktadır. Araştırma verilerinin toplanmasında anket yöntemi kullanılmıştır. Araştırma kapsamında geçerli 423 anket formu toplanmıştır. Araştırma sonuçlarına göre; araştırmaya katılan firmalar hem genel olarak hem de alt boyutlar bazında katılım bankalarının, çalışmada değinilen seçili ürünlerinin ekonomik faydasının çok yüksek olduğunu düşünmektedirler."
