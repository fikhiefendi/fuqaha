abstract: "Sahâbe nesli, Hz. Peygamber ile bizzat görüşmüş ve onun öğretileri doğrultusunda yetişmiş bireylerden oluşmaktadır. Bu nesil, İslâmî ilimlerin vücûd bulmasında temel dinamiklerden biri olmuştur. Sahâbîlerin sözleri ve uygulamaları, İslâmî ilimlerin pek çok alanında temel referans noktalarından birini teşkil eder. Sahâbîlere atfedilen bu değer, onların vahyin inişine tanıklık etmiş ve Hz. Peygamber'in uygulamalarını doğrudan gözlemlemiş olmalarına dayanmaktadır. Bu durum, sahâbe neslinin dini metinleri anlama ve yorumlamada daha yetkin olduğu düşüncesine vesile olmuştur. Bu yaklaşım, sahâbenin Hz. Peygamber'in öğretilerini doğrudan bir hoca-talebe ilişkisi çerçevesinde edinmiş olmalarına matuftur. Sahâbîlerin sahip olduğu bu konum ve öneme rağmen, İslâmî ilimlerin her disiplininin sahâbî anlayışı aynı olmamıştır. Bu çalışma, Hanefî usûlcülerin sahâbe anlayışını ele almayı hedeflemektedir. Bu amaca ulaşmak için belirli bir zaman sınırlamasına bağlı kalmaksızın, dönemsel olarak temsil kabiliyeti yüksek matbu temel Hanefî fıkıh usulü metinleri esas alınmıştır. Geniş bir zaman diliminin ele alınmasındaki gaye Hanefî usûlcülerinin sahâbî tasavvurlarının bütüncül bir tespiti ve mezhebin sahâbî algısının dönemsel olarak geçirdiği değişim ve dönüşümün ortaya çıkarılmasıdır. Bu hedef doğrultusunda çalışmada, literatür taraması ve mukayeseli yöntem kullanılmıştır. Böylece hem Hanefî mezhebi içindeki değişimlerin izlenmesi hem de hadis ehlinin anlayışıyla farklılaştığı noktaların tespiti mümkün olmuştur. Bu çalışma, Hanefî bakış açısıyla sahâbenin tanımı, taksimi, adâleti ve zabtı gibi konuların yanı sıra mürsel rivayetler ve Ebû Hureyre, Enes b. Mâlik gibi sahâbîlerin rivayetlerine yönelik değerlendirmeleri ele almayı amaçlamaktadır. Ayrıca sünnetin tanımı ve kapsamı sahâbenin kullandığı bazı terimler bağlamında tartışılmış; haberlerin reddine ilişkin râvî kaynaklı nedenler ve sahâbenin bazı rivayetlerle ilgili tutumları incelenmiştir. Son olarak, rivayet eserlerinde yer alan sahâbe görüşlerinin fıkhî meselelerde nasıl algılandığı ve değerlendirildiğine dair tespitler yapılmıştır. Ayrıca sahâbe kavlinin delil değeri ile onun kıyâs ve icmâyla olan ilişkisi etrafındaki meselelere değinilmiştir. Netice olarak Hanefî usûlcülerin sahâbe tasavvurlarında belli sebeplere binaen dönemsel olarak değişim ve dönüşümlerin izlerine rastlanılmış ve tek düze bir sahâbî algılarının olmadığı tespit edilmiştir."
