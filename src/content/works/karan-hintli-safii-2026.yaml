abstract: "Bu araştırmada Hint alt kıtasında hicrî onuncu yüzyılda yaşamış, yaşadığı bölge olan Malabar'ın dini, sosyal ve siyasal yapısını etkilemiş Zeynüddîn el-Melibârî (ö. 991/1583)'nin hayatı ve eserleri ve Şâfiî mezhebindeki yeri ve mezhebe katkıları ortaya konmaya çalışılmıştır. Şâfiî mezhebine mensup bir fakih olan Zeynüddîn el-Melibârî, yaklaşık on yıl boyunca Mekke'de başta İbn Hacer el-Heytemî (ö. 974/1566) olmak üzere dönemin önde gelen âlimlerinden ders alarak özellikle Şâfiî fıkhı alanında derin bir ilmî birikim edinmiştir. Arap yarımadasında tahsil ettiği bu ilmî birikimin ardından Malabar'a dönen Zeynüddîn el-Melibârî, Ponnani'deki cami ve medreselerde yürüttüğü tedris faaliyetleri aracılığıyla çok sayıda talebe yetiştirmiş ve böylece Şâfiî fıkhî geleneğinin bölgede aktarılması ve yaygınlaşmasında önemli bir rol üstlenmiştir. Zeynüddîn el-Melibârî, Portekiz'in bölgeye yönelik sömürgecilik ve işgal girişimlerine karşı gerek sosyal faaliyetlerle gerek yazdığı eserlerle mücadele etmiştir. Sömürgecilik ve işgal girişimlerine karşı dönemin yöneticileriyle iletişim halinde olmuş ve ülke liderlerine mektuplar yazmıştır. Zeynüddîn el-Melibârî'nin eserleri yaşadığı dönemden günümüze kadar çeşitli medreselerde ve eğitim kurumlarında ders kitabı olarak okutulmaktadır. Hayatı hakkında ulaşılan tüm İngilizce, Malayalamca ve Arapça kaynaklarda genelde aynı bilgiler yer almakta, fakih hakkında geniş kapsamlı bilgi bulunmamakla beraber eserleri bugün Hindistan başta olmak üzere Endonezya, Pakistan, Srilanka gibi ülkelerde bilinmekte ve eğitim kurumlarında takip edilmektedir. Çalışmada her ülkede halka mâl olmuş, tanınmış şahsiyetler gibi bir konumda olan ve hayatını içinde yaşadığı toplumun menfaatlerine, refahına ve huzuruna adamış; dinî, sosyal ve siyasi yönleriyle bu çizgide yaşam sürmüş, Şâfiî mezhebine müntesip bir fakihin Hint alt kıtasındaki temsiliyeti ortaya konmaktadır"
