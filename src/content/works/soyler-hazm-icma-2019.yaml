abstract: "Zahiri ekolün en önemli temsilcilerinden olan İbn Hazm, sahip olduğu usul anlayışıyla diğer ekollerden ayrılmaktadır. Usul konularının hemen hepsinde kendi anlayışını net bir şekilde görmekteyiz. Bunu en açık biçimde icmâ anlayışında görmekteyiz. Sahabe icmâına vurgu yapması onun icmâ anlayışının temel karakteristiğidir. Bu tez, eserlerinde ortaya koyduğu icmâ anlayışını tespit etme amacıyla yazılmıştır. Ayrıca diğer mezheplerden farklı olduğu noktalar ve kendisine ve mezhebine yöneltilen eleştiriler de incelemeye tabi tutulmuştur. Bu amaç doğrultusunda tez iki bölüme ayrılmıştır. Birinci bölümde İbn Hazm'ın Zahirilik anlayışı ve şer'i delillere yaklaşımı kısaca ele alınmıştır. İkinci bölümde icmâ anlayışı tüm yönleriyle incelemeye tabi tutulmuştur."
