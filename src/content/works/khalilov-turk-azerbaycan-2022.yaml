abstract: "Bu çalışmada, Türk ve Azerbaycan Hukukunda Taşınmaz Mülkiyetinin Tescilsiz kazanılması konusu incelenmiştir. Çalışmanın ilk bölümü taşınmaz mülkiyetinin iktisabında tescil zorunluluğu ve buna istisna getirilme ihtiyacına yöneliktir. Bu kapsamda, taşınmazların kayıt altına alınması gerekliliği, tapu sicil sistemi, tescil ve bunun istisnaları incelenmiştir. Çalışmanın ikinci ve üçüncü bölümlerinde ise taşınmaz mülkiyetinin tescilsiz kazanılması hâlleri incelenmiştir. Bu bağlamda ikinci bölümde, Türk Medeni Kanunu ve Azerbaycan Mülki Mecellesi'nde hüküm altına alınan tescilsiz kazanılma halleri üzerinde etraflıca durulmuştur. Yine bu bölümde Medeni Kanun kapsamında düzenlenmeyen tescilsiz kazanılma hâlleri izah edilmiştir. Taşınmaz mülkiyetinin zamanaşımı ile kazanılmasına hasredilen üçüncü bölümde ise olağan ve olağanüstü zamanaşımı ile taşınmaz mülkiyetinin kazanılması Medeni Kanun ve Mülki Mecelle bakımından karşılıklı olarak incelenmiş ve değerlendirilmiştir."
