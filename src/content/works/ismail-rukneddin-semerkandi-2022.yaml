abstract: "Bu çalışma, 701 H. yılında vefat eden Rükneddin Ubeydullah es-Semerkandi'nin fıkıh usulü ilminde Telhisu Camii'l-usul adlı kitabının tahkik ve tahlilidir. Emir ve nehiy, icma, kıyas ve ictihad gibi usul-i fıkhın konularını ve her bir konuda mezheplerin delillerini kısa ve öz olarak sunuyor. Bu kitapta, Rükneddin es-Semerkandi'nin çok sayıda nakil yoluyla Fahreddin er-Razi'den etkilendiği görülmektedir. Bu kitap, aynı yazarın iki cilt halinde basılan Camiu'l-usul fi beyani kavaidi'l-hanefiyye ve'ş-şafiiye fi usuli'l-fıkh adlı kitabının kısaltılmış halidir. Bu çalışma iki bölüm halinde düzenlenecektir. İlk bölümde yer alacak konular: İlk olarak Rükneddin Ubeydullah es-Semerkandi'nin adı, nesebi, hayatı ve eserleri yer alacaktır. İkinci olarak Telhisu Camii'l-usul adlı eserin muhtevası, ilmî önemi, usulü'l-fıkh kitapları arasındaki yeri, fukaha ve mütekellimin metotlarını bir araya getirmedeki metodu incelenecek, Hanefi mezhebi ve diğer mezheplerin usul-i fıkıh kitaplarıyla bir mukayese yapılacaktır. Üçüncü başlıkta ise kitaptan bazı meseleler seçilerek usul-i fıkhın esasları, referansları ve ana kaynakları ışığında detaylı olarak incelenecektir. Dördüncü başlıkta, kitabın incelenmesinde izlenen yöntem ve kitabın bilimsel katkısı hakkında tartışma yapılacaktır. İkinci bölüme gelince, (تلخيص جامع الأصول) adlı eserin tahkiki başlığı altında, kitabın elyazmalarına başvurularak metninin incelenmesi, düzeltilmesi ve aslına uygun hale getirilmesine çalışılacaktır. Tezin önemi; fıkıh usulü kurallarının mukayese edilerek incelenmesinde ve bu konuda birçok kitap yazan Maveraünnehir âlimlerinden birinin bu konularla ilgili görüşlerini ortaya koymasında yatmaktadır. Bu nedenle, bu kitap usulü-l fıkıh kurallarını ve tarihi gelişimini incelemek isteyen herkes için bir referans olacaktır. Kanaatimizce bu kitap ilim dünyasının istifadesi için ilmi kurallara uygun biçimde yayımlanmaya layıktır."
