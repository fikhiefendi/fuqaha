abstract: "Günümüz ekonomik sisteminde vazgeçilmez bir alış veriş yeri olan borsalar, modern pazar yerleridir. Borsada işlem gören çeşitli emtialar yanında her türlü ticari mal da işlem görmektedir. Dünyanın en büyük borsalarından Borsa İstanbul, tahvil, hazine bonosu, kar ve zarar paylaşım sertifikası ve hisse senedi gibi birçok değerli belgeyi işliyor. Bu belgelerin bazıları yalnızca faiz getiren borçlanma senetlerinde gelir getiren araçlardır ve bazıları ait olduğu şirkete tam bir ortaklığı temsil eden kar ve zarar ortaklığı sertifikalarıdır. İslam hukuku açısından, bu belgelerin yasal niteliği ve işlevi bir yandan ve bunları veren şirketlerin faaliyetlerinin kapsamı göz önünde bulundurulur. İslam, dini helal kazanma araçlarını kabul etti ve teşvik etti ve aldatma ve aldatmacaya dayanarak aldatma ve aldatma araçlarını yasakladı, insanlar arasındaki işbirliğini mahvetti. Klasik kaynaklarımızda, tarım, ticaret ve sanat, sırasıyla en erdemli kazanç yolları olarak adlandırılmaktadır. İnsanlar para kazanmak ve para kazanmak için bu alanlardan birinde çalışıyor. Bununla birlikte, hem finansal hem de bireysel ihtiyaçlar insanların bir araya gelmesini ve emek ve sermayelerini birleştirmelerini gerektirir. Borsa İstanbul yasal olarak anonim bir şirket olduğundan, şirketler ile ilgili İslami hukuk düzenlemelerine bakacağız ve Borsa İstanbul'u değerlendirmeye çalışacağız."
