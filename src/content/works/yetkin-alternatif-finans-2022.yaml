abstract: "Ekonomi ve finans yönetimi insanlık tarihi boyunca önemini korumuş ve özellikle küreselleşen dünyada finans sektörü son elli yılda değişimleri domine eden başat faktörlerden biri haline gelmiştir. 20. Yüzyılın ortalarından itibaren, temelde Müslümanların finansal yaşamlarını sürdürebilecekleri alan açmaya çalışan İslami Finans bir alternatif olarak oluşturmuştur. İslami finansın gelişimi için sistemin ürün ve hizmetlerini çeşitlendirerek arttırması hayati bir önem arz etmektedir. Bu çerçevede İslami finansın ana omurgasını oluşturan Katılım Bankacılığı haricindeki uygulamalara yönelik çalışmaların gerçekleştirilmesi, İslami Finansın gelişimine fayda sağlayacaktır. Araştırmada ilk olarak İslami finansın temel ilkelerine yer verilmiş ve sonrasında her iki sistem ile ilgili tanımlamalar yapılarak kavramsal çerçeve belirtilmiştir. Son olarak bir tüketicinin konut alımında her iki sistemi tercih etmesi sonucunda katlanmış olduğu reel maliyetler karşılaştırılarak maliyet analizi yapılmıştır. Sonuç olarak, Tasarruf Finans Sisteminde sisteme ilk girilen zaman ile hedeflenen tasarrufa ulaşılıncaya kadarki geçen zamana kadarki konut fiyat endeksindeki değişimlerin maliyette önemli bir etken olduğuna ulaşılmıştır. Bu sürenin uzaması nispetinde katılım bankacılığından finansman kullanmanın tüketici için daha avantajlı olduğu sonucuna varılmıştır."
