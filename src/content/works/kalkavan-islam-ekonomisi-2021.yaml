title: "İslam Ekonomisi ve Finansı Hakkında Akademik Çalışmalar Yapan Katılım Bankası Çalışanlarının Motivasyonlarını Etkileyen Unsurlar"
titleTranslation: {"en": "Factors affecting the motivation of participation bank employees who conduct academic research on the field of Islamic economy and finance"}
