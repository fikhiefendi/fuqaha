abstract: "İslami ekonomisi ve finansı gelişen sektör payıyla beraber çalışanlarının konvansiyonel banka çalışanlarına göre daha fazla akademik çalışmalara yöneldikleri tespit edilmiştir. Bu çalışma ile beraber mevduat ve katılım bankalarından alınan bilgi ve veriler doğrultusunda katılım bankası çalışanlarının kendilerini konvansiyonel banka çalışanlarından daha çok lisansüstü çalışmalara yöneldiklerini tespit etmiş bulunmaktayız. Katılım bankası çalışanlarının, İslami Finans ve çeşitli alanlarda yoğun bir şekilde lisansüstü eğitimi tercih etme sebeplerini incelemiş bulunmaktayız. Bu incelemeler doğrultusunda TBB ve TKBB gibi kurumlardan aldığımız bilgiler ışığında katılım bankası çalışanları konvansiyonel banka çalışanlarına göre 2 kat daha fazla lisansüstü eğitime yöneldiğini görmekteyiz. İslami Finans ve Katılım Bankacılığının yüksek lisans eğitim programına kayıt yaptıran bireylerin, lisansüstü eğitimi tercih etme nedenleri, beklentileri gibi değerlendirmelerin sonuçları tezimiz içerisinde sunulacaktır. Bu kapsamda Türkiye'de ve dünyada Uluslararası finans, İslami finans ve katılım bankacılığı eğitim programlarının çıkış noktalarını değerlendireceğiz. İslami finans üzerine Türkiye'de akademik çalışma yapan üniversiteler, üniversitelerdeki lisansüstü eğitim programları, eğitim programlarının içerikleri ve eğitim yılı gibi detaylar tezimizin derinlemesine incelediği mühim noktalardan biridir. İslami finans eğitimi, lisansüstü eğitim düzeyinde dünyada öncü ve ilkleri başlatan üniversiteler, program içeriklerini ve ders sayılarını inceleyerek yoğunlukları ile ilgi alanlarını farklı bir perspektifte değinilmiştir. Bu bilgilere ulaşırken ilgili üniversitelerin paylaştığı veriler ışığında incelemelerimizin bir sonucudur. İslami Finans ve Katılım Bankacılığı zorlu bir süreçten geçip günümüze ulaşırken, ülkemizde literatüre kazandırdıklarını, lisansüstü düzeyde gelişimi, akademik camia tarafından kabul gören çalışmaları inceleyip, analizlerini gerçekleştirilmiştir. İslami finans ve katılım bankacılığı üzerinde gelecek nesillere sunulan Yüksek Öğrenim Kurumu Tez Merkezi'nin kabul ettiği tezlerin, hangi yıllarda yazıldığı, bu tezlerin ilkleri ve İslami Finans'ın ülkemizde doğuşu ile geldiği sürece bakılmıştır. Bu tez çalışmalarının hangi lisansüstü bölümler veya lisansüstü enstitülerinden çıktığını incelemelerimiz arasında yer almaktadır. 1976 yılında ilk defa gerçekleşen Dünya İslam Kongresi ile dünyanın tanıyacağı“İslami finans”kavramının eğitim alanındaki çalışmalarının başlangıcı olan İslam İktisadı Kongresi'ni incelemiş bulunmaktayız. 1976'da yapılan İlim ve Teknolojide 1. Dünya Kongresi'nin İslami Finans alanının gelişimi için akademik açıdan destekleri tezimizin içerisinde incelediğimiz kısımlarındandır. Bu tez çalışmasında, bahsi geçen kongreler ve çalışmaların sonrasında İslami Finans ve Katılım Bankacılığı alanına ilim ve irfan yuvaları olan üniversitelerde nasıl akademik boyuta evirildiğini ve gelişimine katkıda bulunulduğunu göreceğiz. İslami finans ve katılım bankacılığı programında eğitim gören katılım bankası çalışanlarının diğer akademik bölümleri tercih etmeme veya İslami Finans ve Katılım Bankacılığı alanında akademik çalışma yapma sebeplerini ele alacağız. İnceleyeceğimiz diğer önemli bir husus ise başka sektörlerde çalışanların akademik çalışma veya lisansüstü eğitimi tercih ya da ilgi duymama sebepleri, katılım bankası çalışanlarının yoğun olarak akademik çalışmaları tercih etme sebeplerine değineceğiz. Katılım bankası çalışanlarının İslami finans ve katılım bankası lisansüstü alanında çalışma ya da akademik kariyer yapanların mevcut durumda yaşları, cinsiyetleri, yüksek lisans eğitimlerini hangi yılda aldıklarını, kaç yıldır lisansüstü eğitime devam ettikleri ve hangi yıl tamamladıkları veya bıraktıklarını, yüksek lisans eğitiminin anabilim dallarına göre dağılımlarını, İslami finans ve katılım bankacılığı bölümünde yüksek lisans yapma amaçlarını, çalıştıkları katılım bankalarının lisansüstü eğitimini gerekli görüp görmediklerini, çalıştıkları katılım bankalarında yüksek lisans öğrencisi veya yüksek lisans bitirmiş çalışanların bitirdikleri bölümler içerisinde İslami finans ve katılım bankacılığı bölümünün yeri ve önemi, farklı alanlarda lisansüstü eğitimi alıyorsalar başladıkları ve bitirdikleri yıl çalıştıkları işyeri veya katılım bankaları, hangi departman veya alanda çalıştıkları, İslami finans lisansüstü eğitiminde ne derece istekli eğitim aldıkları, katılım bankacılığı içerisinde hangi unvana gelmek istedikleri ve aldıkları İslami finans ve katılım bankacılığı eğitiminin kendileri için neyi ifade ettiği, bu eğitimin hedefledikleri kariyer yolunda kendilerine ne gibi kolaylıklar veya öncelikler sağlayacağı konusunda fikirleri, lisansüstü eğitimini katılım bankası çalışanlarına önerip önermedikleri, lisansüstü eğitiminin meslektaşlarına önerme nedenleri, katılım bankacılığı içerisinde unvan kazandıysalar bu kazandıkları unvanın kendilerine ne kazandırdığı, yüksek lisans eğitime devam edemeyen öğrencilerin sebepleri, lisansüstü eğitimine doktora düzeyinde devam etmek isteyip istemedikleri sorgulanmış ve sorulara cevaplar aranmıştır. Çalışmanın sonuçları bulgu ve anket olarak verilmiştir. Bu çalışmanın anket yönteminde İstanbul Sabahattin Zaim Üniversitesi ve Marmara Üniversitesi Uluslararası Finans ve Katılım Bankacılığı bölümlerinde yüksek lisans ve doktora eğitimine kayıt yapmış bireyler, Türkiye'de faaliyet gösteren katılım bankası çalışanları ve konvansiyonel banka çalışanlarından destek alınmıştır. Anket, katılımcılarına sorulan sorular arasında lisansüstü eğitimine neden kayıt yaptırdıkları, lisansüstü eğitimi tercih etme nedenleri, beklentileri ve bu doğrultudaki bazı değerlendirmelerin sonuçları sunulmaktadır. Bu kapsamda 2017-2020 yılları arasında yüksek lisans ve doktora programlarına kayıtlı 82 kişiye çevrimiçi olarak yönlendirilen 33 sorudan oluşan bir anket uygulaması yapılmıştır. Elde edilen veriler SPSS istatistiki analiz programında değerlendirilmiştir. Değerlendirmeler program yardımından sonra kişisel olarak analiz edilmiştir."
