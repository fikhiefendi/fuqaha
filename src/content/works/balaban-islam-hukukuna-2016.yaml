abstract: "Bizim araştırdığımız“Velayet”konusuna naslarla işaret edilmekle birlikte, velayet konusunun detayları İslam hukukçularının içtihatlarıyla zenginleştirilmiştir. Eşref-i mahluk olan insanın doğuştan sahip olduğu temel hak ve hürriyetlerin korunması adına velayet hükümlerinin istinbat ve icrası bir ihtiyaçtır, zorunluluktur. Araştırmamızda kavramsal çerçeveyi oluşturup, velayetin kimler için ihtiyaç olduğunu belirledik. Velilik vazifesini kimlerin yapacağını ve velinin taşıması gereken vasıfları sıraladık. Pozitif hukuk ile İslam hukukunun velayet hükümlerini yazarak iki hukuk sisteminin kaynağına dolaylı atıfta bulunup yorum farklarını göstermeye çalıştık."
