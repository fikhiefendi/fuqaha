abstract: "Toplumları derinden etkileyen salgın hastalık ve doğal âfetler, kötü sonuçları ile insanlığın karşı karşıya kaldığı en büyük olağanüstü hallerdendir. Bireylerin veya toplumların almış olduğu tüm önlemlere rağmen salgın hastalık ve doğal âfetler karşısında insanoğlu çaresiz kalmıştır. Bu tez çalışmasında tarih boyunca insanoğlunu etkisi altına alarak onun toplumsal ve kültürel olarak değişmesine sebebiyet veren salgın hastalık ve doğal âfetler hakkında bilgilendirme yapılmış, salgın hastalık ve doğal âfet çeşitlerine değinilmiştir. Ayrıca salgın hastalığın bulaşma etkisini indirgeyen veya minimum seviyeye çeken karantina uygulamasının tarihçesi, hikmeti, hükmü ve İslam tarihinde yer alan karantina örnekleri hakkında bilgilendirme yapılmıştır. Bu bağlamda nübüvvet öncesinde, nübüvvet sırasında ve nübüvvet sonrasında meydana gelen salgın hastalık ve doğal âfetler araştırılmıştır. Ayrıca hızlı gelişen ve kitlesel ölümlere sebep olan doğal âfet ve bulaşıcı hastalıkların insanoğlunda meydana getirmiş olduğu maddi ve manevi birtakım olumsuzluklar bazı ibadetlerin îfâ edilmesini etkilemiştir. Bu gibi olağanüstü durumların ibadetlere olan etkisi dini ve fıkhî yönden ele alınmış olup temel ibadetlerin nasıl, nerede, kimlerle ne şekilde yerine getirileceği incelenmiştir. Âfet ve salgın hastalık gibi olağanüstü durumların mükellef olan bireylerden ibadetlerle ilgili birtakım sorumlulukları düşürücü veya hafifletici ilkelerin olup olmadığı araştırılmıştır. Ayrıca 2020 yılında dünyayı etkisi altına alan Covid-19 türündeki salgın hastalık dönemlerinde toplu şekilde yapılması gereken birtakım ibadetlerin ne şekilde icra edileceği İslam Hukukunun genel prensipleri doğrultusunda ortaya konulmaya çalışılmıştır."
