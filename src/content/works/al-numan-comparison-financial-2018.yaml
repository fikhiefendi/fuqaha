abstract: "Katılım bankası, İslami bankacılık sistemi ile uğraşan bir banka iken, geleneksel banka, İslam'da bir günah olan tefecilik kuralına bağlı olarak krediye olan ilgiyi ele almaktadır. Günümüzde İslami bankacılık sistemi, geleneksel bankacılık sistemine alternatif olarak kabul edilmektedir, bu nedenle konvansiyonel ve katılım bankalarının finansal performanslarını karşılaştırmak önemlidir. Bu çalışmada, 3 İslami banka tarafından temsil edilen katılım bankalarının performansının, Türkiye'deki her bir bankanın birden fazla bankanın derecelendirdiği geleneksel bankaların performansı ile, bazı finansal rasyolara bağlı olan MAUT ve TOPSIS yöntemleri kullanılarak çok kriterli veri analizi kullanılarak tek başına sıralanması yoluyla karşılaştırılması amaçlanmıştır. 2011 ile 2015 yılları arasında 5 yıllık süre için yıllık mali raporlardan derlenmiştir; Her bankanın performansını, performanslarına göre en iyi yıldan en kötü yıllara sıralamak; İlk olarak, 5 yıl boyunca her banka için en yaygın beş finansal oran hesaplanmakta, daha sonra MAUT ve TOPSIS yöntemlerini bu göstergelere uygulamaktadır. Diğer bir deyişle, her bir bankanın beş oranına ilişkin olarak, yıllar, eşit ağırlıklı olarak dikkate alınarak TOPSIS ve MAUT yöntemleri kullanılarak en iyi ila en kötü arasında derecelendirilmiştir. Bu araştırmada, her yöntemin hesaplanması iki yaklaşımla gerçekleştirilmiştir; İlk yaklaşım, her banka ile tek başına hesaplanarak, ikinci yaklaşım ise tüm bankalarla birlikte hesaplanmaktır. MAUT yönteminin her bir banka yaklaşımını göz önünde bulundurarak eşit dağıtılmış ağırlık kullanımının sonucu, İslami bankalar için en iyi performansın 2011, geleneksel bankalar için en iyi performans yıllarının 2011 ve 2012 olduğunu göstermektedir. Bütün bankalar yaklaşımı, İslami bankalar için en iyi yıl 2013 iken, geleneksel bankalar için en iyi yıl 2011 ve 2012 olduğunu göstermektedir. Öte yandan, TOPSIS yönteminin, her banka yaklaşımını dikkate alarak eşit dağıtılmış bir şekilde kullanılmasının sonucu, İslami bankalar için en iyi performansın 2011, geleneksel bankalar için en iyi performansın 2011 ve 2014 olduğunu göstermektedir. Tüm bankaları bir arada ele alarak TOPSIS yöntemini kullanarak, İslami bankalar için en iyi yıl 2011 olduğunu, Geleneksel bankalar için en iyi yıl 2011 ve 2012 olduğunu göstermektedir. İki yaklaşımla MAUT ve TOPSIS yöntemlerinde, İslami bankaların en iyi yılının 2011 yılı olduğu, ancak tüm bankaların bir arada olduğu MAUT yönteminde en iyi yıl 2013'tür. Ancak, geleneksel bankalar 2011 yılının en iyi yıllarına sahipler. ve 2012 ancak her bir bankada tek başına yaklaşımla sadece TOPSIS yönteminde, 2012 yerine en iyi yıl 2014'tür. Bu araştırmanın nihai bulguları, her banka yaklaşımı ve tüm bankaların birlikte yaklaşması ile MAUT ve TOPSIS yöntemleri arasında anlamlı bir fark olmadığını göstermektedir. Ancak, bu sonuç bir dönem veya bir ülke ile ilgili olarak değişebilir. Sonuç, 2011 yılında İslam bankaları için 2011 yılında seçilen bankaların en iyi performansını gösterdi. Geleneksel bankalar için 2011 ve 2012 ve bu yöntemden çok etkilenmedi; Daha fazla sayıda banka, farklı bir dönem veya farklı yöntemler kullanarak farklı bulgular olabilir. Gelecekteki çalışmalar için daha fazla banka, farklı ülke, geniş bir süre veya başka bir yöntem kullanılarak değerlendirilebilir."
