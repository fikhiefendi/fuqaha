abstract: "Yoksulluğu azaltmak bütün toplumların en önemli hedefleri arasında bulunmaktadır. Toplumlar yoksullukla mücadelede çeşitli politikalar geliştirip uygulamaktadır. İslam dini yoksulluğu azaltıp toplumun genel refahını artırmak için bazı yükümlülükler getirmiştir. Bu tez, yoksulluk kavramını ele alarak genel bir çerçeve çizmektedir. Bu çalışmada yoksulluk türleri, nedenleri ve yoksulluğun dünya ve Türkiye'deki boyutları incelenmiştir. Bu inceleme, küreselleşme, nüfus artışı, ekonomik krizler gibi faktörleri ve ayrıca eğitim düzeyi, işsizlik ve ayrımcılık gibi sosyal etkenleri içermektedir. İkinci bölümde, İslam'da yoksulluk ve fakirlik kavramları incelenmiştir. Bu bölümde İslam'ın sosyal adalet anlayışı, insan onurunu koruma, toplumsal dayanışma ve ekonomik adalet gibi temel ilkeler ortaya konulmuştur. Ayrıca, İslam'ın zenginlik ve yoksulluğa bakışı, zengin ve yoksulların hak ve görevleri üzerinde durulmuştur. Üçüncü bölümde, İslam'ın yoksullukla mücadele stratejileri ele alınmıştır. Zekât, öşür, fitre gibi zorunlu sosyal finans araçları ve sadaka, vakıf gibi gönüllülüğe dayalı araçlar açıklanmıştır. İslami finans sisteminin yoksulluğa karşı rolü, karz-ı hasen, murabaha gibi araçlarla detaylandırılmış ve aynı zamanda İslam'ın yasaklayıcı finansal önlemleri vurgulanmıştır. Son bölümde, İslam ülkelerinin genel ekonomik durumu ve yoksulluk sorunu ele alınmıştır. Ardından, Malezya örneği üzerinden İslami önlemlerin yoksullukla mücadeledeki etkileri incelenmiştir. Malezya'nın ekonomik yapısı, İslami finans sistemi ve yoksullukla mücadeledeki çabaları sunulmuştur."
