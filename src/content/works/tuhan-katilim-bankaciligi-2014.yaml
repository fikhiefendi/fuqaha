abstract: "Gelişen küresel ekonomik yapıyla beraber finansal piyasaların da geliştiğini görmekteyiz. Her geçen gün finansal piyasalara farklı ürünler girmektedir. Son yılların önemli ürünlerinden biride faizsiz finansmandır. Faizsiz finansman dünyada uygulanan İslami bankacılığın aynısıdır. Türkiye'de de ilk başlarda özel finans kurumu adı altında faaliyet göstermiştir. Fakat karşılaşılan birçok problem sonunda Katılım bankaları adını almışlardır. Birçok çeşit sunan faizsiz finansman piyasa yapısından inançları gereği uzak duran kitlelere sunduğu alternatiflerle önemli bir konuma doğru hızlı bir şekilde ilerlemektedir. Ülke ekonomisindeki olumlu hava ekonomik piyasalara yansımış ve Türkiye piyasaları gelişmeler göstermiştir. Faizden uzak duran kesimler için iyi bir alternatif olan katılım bankacılığı sistemi, bünyesinde farklı çeşitli yatırım araçlarını barındırmaktadır. Türkiye'de Katılım Bankacılığı faaliyetleri yapan toplam dört adet banka bulunmaktadır. Ekonomik yapı içerisinde hızlı bir şekilde yükselen değere sahiptirler. Dünyada da çok hızlı bir şekilde büyüyen yapılarıyla dikkat çekmektedirler. Bu çalışmamızda Katılım Bankacılığı, tanımı, kullandırdığı ürünleri, tarihi, gelişimi gibi birçok ana başlık ve alt başlıklarla hızla gelişen bankacılık sistemi ele alınmıştır."
