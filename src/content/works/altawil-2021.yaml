abstract: "İslam dünyasında son yüzyılda büyük göçler yaşanmaktadır. İslam aile Hukukunda İslam ülkesinden yine Müslüman ülkeye ve Müslüman beldeden gayr-i müslim ülkelere yapılan hicretlerde birçok itikadî ve hukukî problemler ortaya çıkmaktadır. Özellikle Müslüman kadınları ilgilendiren göç hareketlerinde kadınların yalnız hicretleri, çocukların velayeti, kocası kaybolan kadınların nikâhları, kadının mahremi olmadan ya da mahreminin izni olmadan hicreti gibi konular sebebiyle birçok mağduriyet yaşanmaktadır. İşte bunun gibi konular mezhep görüşleri doğrultusunda hukuki alt yapısını ortaya koyup klasik dönemdeki ve güncel dönemdeki uygulama örneklerini ele alınarak işlenmeye gayret edilmiştir. İslam hukukunun daha çok füruu fıkıh konularını ilgilendiren bu konu, özellikle aile hukuku bağlamında ele alınmaya çalışılmış ve diğer talî konularla birlikte değerlendirilmeye gayret edilmiştir. Bu çalışmada hicretin mahiyeti, gönüllü ve zorunlu göç hareketleri, Hz. Yusuf'un, Hz. İbrahim'in ve Hz. Musa'nın zorunlu hicretleri ile yine Hz. Peygamberin Mekke'den Medine'ye hicretindeki uygulamaları vb. konular değerlendirilerek, yeni ortaya çıkan meseleler için delil olarak kullanılmaya çalışılmıştır. İslam hukuku dinamik bir yapıya sahip olduğundan Batılı güçlerin Müslümanların iradesi dışında başına tasallut ettikleri zorunlu hicret sebebiyle yeni ortaya çıkan itikadî ve hukuki problemlerin çözümünde bu dinamizmden faydalanılması kolaydır. Bu çalışmada klasik kaynaklarda dağınık şekilde ve diğer fıkhî meselelerle ele alınan ve hicreti ya da zorunlu durumlar için öngörülen bazı ictihadların yardımıyla konu tek kitap altında toplanmaya gayret edilmesi bakımından önem arzetmektedir. Çalışmada, öncelikle konunun ele alındığı klasik kaynaklardan mukayeseli olarak detaylı bir şekilde araştırılmış olup teknolojik imkânlardan da yararlanılarak veriler toplanmaya çalışıldı. Bu aşamadan sonra verilerin işlenmesi kısmına geçilerek hicretin ve de özellikle zorunlu hicretin anlam ve mahiyeti gibi tezimizin temel kavramlarının tahlili ile konuya giriş yapılmıştır. Bu arada \"İslam Hukukunda Zaruret Hali\" gibi konularla konumuz kıyas edilerek işlenmeye gayret edilmiştir."
