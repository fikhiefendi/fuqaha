abstract: "Taşınmaz kavramı ve dolayısıyla taşınmaz mülkiyeti hukuk sistemimiz ve sosyal hayatta önemli bir yere sahiptir. Bu çalışmada taşınmazın mülkiyet hakkının yasal kısıtlamalarına aykırı kullanılmasından meydana gelen zarar veya zarar tehlikesinden sorumluluk incelenmiştir. Tezin temel sorusu, taşınmaz malikinin sorumluluğunun düzenlendiği TMK m. 730'un koruma amacının tespit edilmesi ve bunun ışığında sorumluluğun doğup doğmadığı, doğmuşsa dava hakkı sahiplerinin ve sorumluların kimler olduğunun ortaya çıkarılmasıdır. İlk olarak taşınmaz malikinin sorumluluğunun kanunda düzenlenme biçimi, uygulama alanı ve taşınmaz kavramı ile taşınmaz mülkiyeti kavramı açıklanmış ve bu kapsamda taşkınlık kavramı izah edilmiştir. Ardından, taşınmaz malikinin sorumluluğunun doğması bakımından aranan koşullar ele alınmıştır. Bu kapsamda taşınmaz malikinin hem mülkiyet hakkının yasal kısıtlamalarına aykırı kullanılmasından hem de yerel adete uygun ve kaçınılmaz taşkınlıklardan meydana gelen zararlardan sorumluluğa yer verilmiştir. Akabinde taşınmaz malikinin sorumluluğu bakımından dava hakkı sahiplerinden davacı ve davalılar belirlenmiş ve son olarak hüküm diğer düzenlemelerle karşılaştırılmıştır."
