abstract: "İbn Kayyim el-Cevziyye, (691-751/1292-1350) hicrî yedinci asrın sonu ile hicrî sekizinci asrın ilk ortalarına kadar yaşamış bir âlimdir. İlmî şahsiyetiyle ön plana çıkan İbn Kayyim; akaid, fıkıh, tefsir, hadis, ahlâk ve tasavvuf gibi alanlarda otorite kabul edilmiştir. Aynı zamanda Hz. Peygamber'in (s.a.v.) hayatına dair kaleme almış olduğu Zâdü'l-me'âd fî hedyi hayri'l-'ibâd adlı eseri ile siyerden fıkhî hükümler istinbat etmek maksadıyla siyer eserleri içerisinde çok önemli bir boşluğu doldurmuştur. Bu açıdan Zâdü'l-me'âd, bazı ilmî çevreler tarafından bir fıkhü's-sîre örneği olarak değerlendirilmiştir. İbn Kayyim; Zâdü'l-me'âd eseri ile Hz. Peygamber'in (s.a.v.) ibadet, cihad, alım-satım, hadler vb. uygulamalarını göstermeyi amaçlamıştır. Aynı zamanda bu eseriyle yeni bir telif türü ortaya koyan İbn Kayyim; siyeri, fıkhı ve tıbb-ı nebevîyi bu eserinde birleştirmiştir. Bu ilim dalları içerisinde kendi görüşlerini ifade ederken Selef ulemâsının fikir ve görüşlerini dikkate almış, aynı zamanda hocası İbn Teymiyye'nin (ö. 728/1328) görüşlerini de sıkça dile getirmekten kaçınmamıştır. Aktardığı rivayetlerde fakih muhaddislerin yöntemine dayanarak zaman zaman rivayetlerin farklı senedlerini de eserinde zikretmiştir. Ayrıca eserinde kaynak çeşitliliği ve fazlalığı da bir hayli göze çarpmaktadır. Hadis, tefsir, siyer, fıkıh, kelâm, tarih ve tıp gibi alanlarda pek çok kaynağa başvurmuş, bu kaynaklar arasında en sahih olanlarını da tercih etmeye gayret etmiştir. Bu çalışmada İbn Kayyim el-Cevziyye'nin yaşadığı dönem, hayatı ve genel olarak ilmî yönü ele alındıktan sonra Zâdü'l-me'âd adlı eserinin içerik, yöntem ve kaynakları yönünden bir incelemesi yapılmıştır. Hadis, siyer, fıkıh ve tıbb-ı nebevî alanlarında bir hayli fazla kaynaktan istifade edilerek telif edilen Zâdü'l-me'âd'ın muhteva açısından kendisine benzeyen diğer siyer eserleriyle mukayesesi de değerlendirilmeye tabi tutulmuştur. Ayrıca Zâdü'l-me'âd'ın fıkhü's-sîre kavramı ile ilişkisi, önemi, ilmî değeri, muhtasarları, manzumları ve şerhleri de çalışmaya dahil edilmiştir."
