abstract: "Türk Borçlar Kanununda Kapora, sözleşme esnasında ön ödeme kararlaştırılmasının gayesine göre pişmanlık akçesi ve pey akçesi olarak iki farklı maddede düzenlemiştir. Sözleşme kurulurken pey akçesi olarak verilen para akdin yapıldığının kanıtıdır. Cayma parası olarak düşünülmez. Akidden dönüldüğü takdirde müşteri verdiği peşinatı geri alır. Pişmanlık akçesinde ise iki tarafa da akidden dönme yetkisi verilmektedir. Müşteri dönerse verdiği peşinat satıcı da kalmaktadır satıcı dönerse aldığının iki katını müşteriye vermek zorundadır. Bu iki işlemin hukuki nitelikleri birbirinden farklıdır. Bu tezde İslâm hukuku klasik literatüründe kaporalı akidle ilgili mezheplerin hükümleri ve modern çağdaki âlimlerin görüşleri, hangi tür kaporaya İslâm âlimlerinin izin verdiği hangi çeşit kaporada ittifak edilip hangi kaporada ihtilaf edildiği konusu araştırılmıştır. Araştırmamızda bazı İslâm ve Avrupa ülkelerinin kaporalı akidle ilgili yasal düzenlemelerine yer verilmiştir. Günümüzde kapora ile benzer işlevleri olan, depozito, opsiyon sözleşmeleri, güvence bedeli (damânü'l-ciddiyye) ve cezâî şart gibi uygulamalar da araştırma konularımız arasında yer almış ve bunların kaporaya benzeyen ve ondan farklılık arzeden yönlerine işaret edilmiştir."
