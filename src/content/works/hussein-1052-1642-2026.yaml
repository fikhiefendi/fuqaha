abstract: "Bu çalışma, (Şah Muhammed b. Ahmed b. Ebî's-Suûd es-Sâdıkî el-Manastırî'nin (ö. 1052/1642'den sonra)“Muntehâ'l-Enhur fî Şerhi Multeka'l-Ebhur”Adlı Eseri (Kitabın Başından Teyemmüm Babına Kadar): Tahkik ve İnceleme) 17. yüzyıl Osmanlı fakihlerinden Şah Muhammed b. Ahmed el-Manastırî'nin, İbrahim el-Halebî'nin (ö. 956/1549) meşhur eseri“Multeka'l-Ebhur”üzerine kaleme aldığı“Muntehâ'l-Enhur”adlı şerhini konu edinmektedir. Araştırmanın kapsamı, söz konusu yazma eserin başından“Teyemmüm Babı”nın sonuna kadar olan kısmın ilmî metodoloji çerçevesinde tahkik edilmesi ve tahlilî bir değerlendirmeye tabi tutulmasıdır.“Multeka'l-Ebhur”, Osmanlı hukuk sisteminde ve medreselerinde asırlarca temel müracaat metni kabul edilmiş, üzerine pek çok şerh yazılmıştır. Manastırî'nin şerhi ise, metni hem fıkhi derinlik hem de dilbilimsel inceliklerle açıklayan kıymetli bir çalışmadır. İki ana bölümden oluşan araştırmanın inceleme kısmında; müellifin hayatı, yaşadığı dönem, ilmî kişiliği ve eserde takip ettiği yöntem ele alınmıştır. Tahkik bölümünde ise, eserin yazma nüshaları karşılaştırılarak metin aslına uygun şekilde kurulmuş, fıkhî terimler açıklanmış ve temel kaynaklarla mukayese edilmiştir. Bu çalışma ile Osmanlı fıkıh mirasının nadide bir parçası gün yüzüne çıkarılarak araştırmacıların istifadesine sunulmuştur."
