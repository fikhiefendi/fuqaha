abstract: "Bu tez çalışmasının temel amacı, Ahzâb Sûresi'nde yer alan ahkâm âyetlerini İmam Mâtürîdî'nin fıkhî perspektifi doğrultusunda sistematik bir yaklaşımla incelemektir. Bu doğrultuda öncelikle Mâtürîdî'nin yaşadığı ilmî çevre, düşünce yapısı ve metodolojisi ele alınmış, ardından Ahzâb Suresi'nin tarihsel bağlamı, nüzûl sebepleri ve içerdiği temel fıkhî konular analiz edilmiştir. Sonraki bölümlerde evlilik hukuku, hicab, evlatlık kurumu, aile mahremiyeti, Hz. Peygamber'in konumu, aile hayatı ve kamu düzenine ilişkin ayetler, Mâtürîdî'nin tefsirindeki yorumlar ışığında değerlendirilmiş; bu suretle onun Hanefî fıkıh geleneğindeki yeri ve katkısı ortaya konulmuştur. Ahzâb Suresi'nde evlilik, hicab, evlatlık kurumu, aile mahremiyeti, kamu düzeni ve zıhar gibi fıkhî konular, Mâtürîdî'nin tefsirinde literal düzeyin ötesine taşınarak toplumsal ve hukukî bağlamlarıyla ele alınmıştır. Onun bu yaklaşımı, hem Hanefî fıkıh geleneğinin usul yapısının şekillenmesinde hem de Sünnî kelâm düşüncesinin teorik çerçevesinde belirleyici bir rol oynamıştır. Mâtürîdî'nin fikirlerinin kendi döneminde sınırlı düzeyde yankı bulmasının arka planında siyasî merkezlerden uzak oluşu, eserlerinin dili ve üslûbu, dönemin tarihçileri tarafından yeterince ilgi görmemesi ve bazı çevrelerce Mu'tezile'ye yakın görülmesi gibi faktörler bulunmaktadır. Bu çalışma, klasik tefsir literatüründe yer alan fıkhî yorumların sistematik biçimde tahlil edilmesi ve Mâtürîdî'nin Hanefî fıkıh düşüncesinin gelişimindeki konumunun daha belirgin hâle getirilmesi bakımından önemli bir katkı sunmayı hedeflemektedir."
