abstract: "Ebû Hanîfe'nin talebelerinden olan İmam Muhammed, hocasının ilim meclisinde tartışılıp karara bağlanan ve yazılan meseleleri kaydedip sonraki nesillere aktarımını sağlayan en önemli isimdir. Hanefî mezhebinin ilk dönem temel görüşlerini içeren ve zâhirü'r-rivâye olarak bilinen bu eserler ile ikinci derecede kaynak değerine sahip rivayetleri içeren nâdirü'r-rivâye eserlerini Hâkim eş-Şehîd el-Kâfî adlı eserinde ihtisar etmiştir. Bu çalışmada kitâbü'l-vekâlet bölümü çerçevesinde hâlâ yazma halinde olan el-Kâfî incelenmiştir. Bu kapsamda öncelikle Hanefî mezhebinin fukahâ ve mesâil tasnifine değinilerek Hâkim eş-Şehîd ile el-Kâfî'nin bu tasnif içerisindeki yerine açıklık getirilmeye çalışılmıştır. Müellif ve kitabının mezhep içerisindeki konumuna değinildikten sonra akabinde Hâkim eş-Şehîd'in hayatı ve el-Kâfî'nin çeşitli açılardan tanıtımına yer verilmiştir. Daha sonra vekâlet akdi ile ilgili genel bir bilgilendirmeye yer verilerek tahkiki yapılan vekâlet bölümünün eserde muhteva ve kaynak bakımından ne şekilde ele alındığı ortaya konulmuştur. Eserin büyük oranda el-Asl'ın ihtisarı olması nedeniyle el-Kâfî'nin vekâlet bölümü, el-Asl'ın vekâlet bölümü ile mukayeseye edilmiştir. Bunun yanı sıra birlikte eserin şerhi olması itibariyle Serahsî'nin el-Mebsût adlı eserindeki vekâlet bölümü ile el-Kâfî'nin vekâlet bölümü arasında da bir karşılaştırma yapılmıştır. Son olarak vekâlet bölümünün tahkikli metnine yer verilmiştir."
