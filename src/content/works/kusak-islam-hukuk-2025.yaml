abstract: "Günümüzde islami ilimlere yönelmiş olanların nezdinde fıkıh ilmi zor ve karışık bir ilim dalı konumundadır. Bu zorluğun birçok sebebi olmak ile birlikte, en temel sebeplerden birisi fürû fıkıh ile alâkalı eserlerin hacminin genişliği ile fukâhanın metodolojisinin kavranmasındaki zorluk ve meşakkattir. Bu probleme çözüm bulabilmek için usulün furuya etkisini pratik örnekler üzerinden değerlendirmemizi sağlayacak, anlaşılması basit, derli toplu bazı çalışmaların yapılması bir zorunluluk olarak görülmektedir. Bu probleme bir nebze çözüm bulma gayesiyle üzerinde çalıştığımız bu çalışmamız ile ortaya koymak istediğimiz en temel amacımız, delil ve kaynaklar özelinde fukâhanın ihtilâf etmelerine sebep teşkil eden metodolojik farklılıkların bir kısmını ortaya koymak ve bu farklılıkların fıkhî ihtilâflara etkisini tespit edip, birbirine benzer fıkhî ihtilâfları alt alta getirmek sûretiyle bir takım analiz ve çıkarımlarda bulunarak fukâhanın bakış açısınının kısmen kavranmasına yardımcı olmaktır. Zirâ bu bakış açısının kazanılmasında en önemli unsurlardan birisi metodolojinin kavranması ve bu metodolojinin fıkhî ihtilâflara nasıl etki ettiği ve fakîhin benzeri fıkhî ihtilâflara olan hakimiyetidir. Bu araştırmamız vesilesiyle hem mezheplerin delil ve kaynaklara yaklaşımları kavranmış olacak, hem bu yaklaşım farklılıklarının ihtilâflara etkisi örnekleriyle ortaya konulacak hem de benzeri sebeplere dayanan ihtilâflı meseleler alt alta getirilmek sûretiyle fukahanın bakış açısının kısmen kavranmasına katkı sağlanabilecektir Bu doğrultuda öncelikle delil ve kaynaklar özelinde dört mezhebin metodolojisine ana hatlarıyla temas edilmiştir. Her mezhebin usulcülerinin şer'i kaynaklara bakışı ortaya koyulmuştur. Ardından mezheplerin metodolojisinin fürû fıkha yansımaları bazen mukayeseli bazen mukayesesiz bir şekilde örnekler üzerinden incelenmiş ve usulün fürûya ne oranda etki ettiği ile alâkalı kısa analizlerde bulunulmuştur."
