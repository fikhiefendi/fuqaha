abstract: "ÖZET İslâm hukukunun temel kaynakları Kitap ve Sünnettir. Hz. Peygamber'in vefatından sonra Kitap ve Sünnet'te hükmü bulunmayan meselelerle karşılaşan Müslümanlar, akla dayanan ve önceleri en geniş anlamıyla rey denilen hukukî bir metotla meseleleri çözmeye çalışmışlardır. Bu hukukî faaliyet 'rey ya da ictihadü'r- rey*, kısa sürede icmâ, kıyas, istihsan, ıstıslâh...vb isimler altında çeşitli metotlarla formüle edilmişti. Başlangıcından günümüze İslâm hukuku daha ziyade nasların lafzî bağlamları çerçevesinde gelişme göstermiştir. Lafzî anlamların ötesinde gerçekleştirilmek istenen gayelere bağlı hukukî faaliyet görüldüğü kadarıyla daima ikinci planda kalmıştır. Bu, İslâm hukukçularının gayelerin feda edilmesi pahasına da olsa naslara bağlılığı savundukları anlamına gelmez. Elbette onlar rey, kıyas, istihsan, ıstıslâh veya mesâlih-i mürselc.vb delilleri kullanırlarken kanun koyucunun maksatlarını gerçekleştirmeyi hedeflemişlerdir. Burada insan yararım esas alan bir kavram olarak“maslahat”m şer'î deliller arasındaki yeri, İslâm hukukçularının bu delile verdikleri önem ve bunun şartları ile Tûfî'nin görüşleri ayrıntılı ve mukayeseli olarak incelenmiştir. Bu mukayese ve inceleme sonunda Tûfî'nin bazı ifadelerinin bir Müslüman'ın beğeniyle karşılayamayacağı türden unsurlar içerdiği kanaatine vardık. Bize göre o, bu ifadelerle makâsıda dayah içtihada vurgu yapmayı amaçlamaktadır. Tûfî'nin görüşlerinin anlaşılması, maslahat ve makâsıd konularına farklı bir boyut kazandıracaktır. Kanaatimize göre kullandığı dil ve ifade tarzı, görüşlerinin doğru olarak değerlendirilmesine engel olduğu hissini uyandırmaktadır. Modern dönemde sosyal değişimin hayatın bütününe olan etkisinin artması ve faydacı felsefenin popüler hale gelmiş obuası“maslahat”düşüncesinde değişime neden olmuştur. Değişen şartlarla mücadelede Müslümanlara yardımcı olacak en önemli prensiplerden biri de“maslahat”kavramıdır. Bu nedenle maslahatla ilgili çalışmalara nitelik ve nicelik bakımından önem verilmesi gerektiğini düşünüyoruz."
