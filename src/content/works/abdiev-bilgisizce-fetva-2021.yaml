abstract: "İslâm toplumunun geleceğini inşâ etmek için günümüzde en çok ihtiyaç duyulan konuların başında dini bilgilerin insanlara doğru bir şekilde aktarılması gelmektedir. Bu çalışmada fetvâ vermenin sorumluluğu ve ehil olmadan fetvâ vermeye kalkmanın vebâlinin büyüklüğü açıklanmaktadır. Konunun öneminin vurgulanması için Kur'ân'dan sonra İslâm'ın ikinci kaynağı olan Hz. Peygamber'in (s.a.v) hadisleri ve sahâbe sözleri ile fetvâ uygulamaları değerlendirilmektedir. Tezin birinci bölümünde Fetvâ ve Kavramsal Çerçevesi, ikinci bölümünde Tarihte ve Günümüzde Fetvâ, üçüncü bölümünde ise Bilgisizce Fetvâ Verilmesi İle İlgili Hadisler incelenmektedir."
