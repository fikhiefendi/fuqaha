abstract: "Hayatin devamlılığı, insanın çevresindeki sayısız eşyalarla ilişkisini zorunlu kılmaktadır. Bu sebeple insan devamlı olarak eşyaları elde etme çabasındadır. Eşyalara sahiplenme isteği tüm insanlarda mevcut olduğu için, bunun hukuki kurallarla düzenlenmesi gerekmektedir. Fert ve Toplum huzuru buna bağlıdır. Her hukuk sistemi gibi İslam hukuku da, insan-eşya ilişkisinde fert ve toplum hayatı için kaçınılmaz olan, kendine ait kurallar koymuştur. Zilyedlikle ilgili kurallar da bunlardan bazılarıdır. Tezin birinci bölümünde zilyedliğin tanımı, mahiyeti ve çeşitleri etraflıca işlendi. İslam hukukunda eşyadaki zilyedliğin sadece ?fiili bir durum? değil, temelinde bir haklılığa dayalı ?fiili bir hakimiyet? olduğu vurgulandı. İslam Hukuku açısından zilyedlik kapsamına giren ve girmeyen mallar üzerinde duruldu. Zilyedliğin çeşitleri ve eşya üzerinde haklı zilyedlik sağlayan şartlar açıklandı. Ferd ve toplum hayatı açısından zilyedliğin fonksiyonu işlendi. Birinci bölüm haklı zilyedliğin kazanıldığı ve kaybedildiği yerlerin neler olduğu ile sona erdi. İkinci bölümde haklı zilyedliğin korunması ve meşru korunma yolları üzerinde duruldu. Bu kapsamda meşru müdafaa ve zilyedlik davaları etraflıca ele alındı. Zilyedlik davalarında zamanaşımı ve fonksiyonuyla ilgili hükümlere yer verildi. Zilyedliğin mahkeme kararıyla iadesi durumunda ortaya çıkabilecek hususlar işlendi. Bu kapsamda iyi niyetli ve kötü niyetli haksız zilyedlerin sorumlulukları ele alındı. İslam hukukunda haklı zilyedliğin korunduğu, haksız zilyedliğin hukuken himaye edilmediği vurgulandı."
