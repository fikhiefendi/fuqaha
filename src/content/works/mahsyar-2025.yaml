abstract: "Bu çalışma, Endonezya'da Şafii mezhebinin tarihini ele alarak, bu mezhebin ülkeye giriş ve yayılma aşamalarını, yerleşmesine katkı sağlayan faktörleri ve etkilerini incelemektedir. Araştırmanın amacı, Şafii mezhebinin h.1./m.7. yüzyıldan itibaren Endonezya'ya girişini belgelendirmek, mezhebin geçirdiği altı tarihsel aşamayı incelemek ve alimler ile yönetimlerin mezhebin yayılmasındaki rolünü analiz etmektir. Ayrıca, Endonezya'daki İslami eğitim kurumlarında kullanılan Şafii mezhebine ait eserleri tanıtmayı hedeflemektedir. Araştırmacı, Endonezya'da İslam ve Şafii mezhebinin tarihini ele alan birincil kaynakları ve metinleri analiz etmek için tarihsel yöntemi; alimlerin ve kurumların mezhebin yayılması ve gelişimi üzerindeki etkisini incelemek için ise analitik yöntemi kullanmaktadır. Araştırma, Şafii mezhebinin Endonezya'ya girişinin İslam'ın bölgeye girişine paralel olarak Yemen üzerinden gerçekleştiğini ortaya koymuştur. Mezhebin tarihsel aşamaları; kuruluş, gerileme, yayılma, sömürgeleştirme, istikrar ve modern çağ olarak sıralanmaktadır. Şafii mezhebi, 1958'de Dini Mahkeme tarafından alınan karardan itibaren İslami hukuki meselelerde ana referans haline gelmiştir. Mezhebin etkisi, hukuk, fetvalar, İslami toluluklar, eğitim kurumları ve üniversitelerde gözlemlenmektedir. En çok kullanılan Şafii eserlerinden bazıları Fethu'l-Muîn, Fethu'l-Karîb, Kifâyetü'l-Ahyâr, Fethu'l-Vehhâb ve Sefînetü'n-Necât olarak sıralanabilir."
