abstract: "Bu çalışma dört bölümden oluşmaktadır. Birinci bölümde, çalışmanın omurgasını teşkil eden icâre, ecir/işçi, ücret, işveren, işyeri ve işletme gibi temel kavramlar izah edilmiştir. İkinci bölümde iş akdinin devamı esnasında işçinin hak ve borçları ele alınmıştır. Bu bölümde ve çalışmanın genelinde söz konusu olan işçinin borçları aynı zamanda işverenin haklarıdır; işçinin hakları da işverenin borçlarıdır. Üçüncü bölümde iş akdi sona erdikten sonra işçi ve işverenin hak ve borçları ele alınmıştır. Son bölümde işçinin sosyal güvenliği ele alınmıştır. Bu bölümün daha iyi bir şekilde anlaşılması için başta bir giriş mahiyetinde genel olarak sosyal güvenlik hakkında bilgi verilmiştir. Sonuç kısmında ise elde edilen neticeler ifade edilerek çalışma tamamlanmıştır."
