abstract: "?Molla Hüsrev ve Mirkâtü'l-Vusûl adlı eserindeki yöntemi? konulu tez çalışmamız giriş ve sonuç hariç üç kısımdan oluşmaktadır.Giriş kısmında araştırmamızın konusu, önemi, amacı ve kaynakları hakkında bilgi verilmiştir.Birinci bölümde ana hatlarıyla Fıkıh usûlü hakkında bilgi verilmiştir. İkinci bölümde Molla Hüsrev'in hayatı ve ilmî kişiliği ele alınmıştır. Üçüncü bölümde ise Molla Hüsrev'in Mirkâtü'l-Vusûl adlı eserindeki yöntemi tespite çalışılmıştır.Sonuç kısmında ise araştırmamızdan elde ettiğimiz neticeyi özetledik."
