abstract: "Hanefî mezhebinin günümüze ulaşan ilk Muhtasar'ının yazarı olan Tahâvî İslami ilimlerin birçok sahasında eser vermiş ender âlimlerimizden biridir. Bu çalışmada Tahâvî'nin çeşitli hükümleri delilleriyle tartıştığı ve sonunda kendince isabetli olan görüşü gerekçeleriyle birlikte ortaya koyduğu kitabı Şerhu Meânî'l-Âsâr'ın Kitâbu's-Salât bölümü mercek altına alınmıştır. Kitâbu's-Salât içerisinde Tahâvî'nin, Hanefi mezhebi imamları olarak ifade ettiğimiz Ebû Hanîfe, Ebû Yûsuf ve Muhammed b. Hasan eş-Şeybânî'den herhangi bir veya ikisine yahut da her üçüne birden muhalefet ettiği meseleler tespit edilerek, ictihad ederken nasıl bir yol izlediği anlaşılmaya çalışılmıştır. Bunu yaparken Tahâvî'nin imamlara nisbet ettiği görüşlerin onlara aidiyetini doğrulamak amacıyla imamların hakkında konuşulan konuyla ilgili hangi görüşe sahip oldukları diğer kaynaklardan da tespit edilmeye ve Tahâvî'nin görüşlerinin seyrini takip edebilmek amacıyla diğer eserlerinde ilgili meselelerle ilgili nasıl bir görüş ortaya koyduğu tespit edebilmeye çalışılmıştır."
