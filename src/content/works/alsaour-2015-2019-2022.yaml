abstract: "İşbu çalışmanın amacı, Suudi Arabistan Krallığı'ndaki bireylerin ve ailelerinin tüketim davranışlarını şekillendirmedeki bankalarda ve finansal kurumlarında islami finansın rolün türünü aşağıdaki soruları yanıtlayarak ortaya koymaktır: İslam ekonomisinin tüketim davranışına bakış açısı nedir? Tüketim davranışını etkileyen İslami finans biçimleri nelerdir? Suudi Arabistan Krallığı'nda tüketici davranışı nasıl tanımlanabilir? Bu da, Suudi Arabistan'daki bankacılık ve finans kurumları sektöründeki İslami finansın tüketici davranışlarını şekillendirmede ve onları yatırıma değil tüketime motive etmede olumsuz bir role sahip olduğu varsayıma dayanmaktadır. 2015 - 2019 yılların arasında Suudi Arabistan'daki İslami finanstan yararlanan kişiler hedef kitlesi olarak belirlemiştim. Çalışmanın, teorik tarafında tümevarım yaklaşımı, pratik tarafında ise analitik betimsel yaklaşımı izlemişimdir. Çalışma örneklemi 433 kişiden oluşmakta olup, bilgi toplamak için anket yöntemi kullanmışımdır; vardığım en önemli sonuçlar aşağıdaki gibidir: Finanstan yararlanmadan önce geliri gerekli ihtiyaçları karşılamaya yetecek düzeyde olanların çoğunluğu, finanslarını“tümü tüketime”ya da“çoğu tüketime, küçük bir kısmını yatırıma”yönlenmiştir. Finanslarını“temel ihtiyaçları karşılamaya”yönlendirenlerin çoğu, bu finansın nasıl tüketeceğini planlamamış veya bir kısmını nasıl tüketeceğini planlamıştır. Ve finanstan yararlandıktan sonra harcamalarını finansı yararlandıktan önce aynı düzeyde harcamaya devam edenlerin veya harcamalarını artanların büyük bir kısmı, Finanstan önce gelirinin gerekli ihtiyaçları karşılamaya yeterliydi, böylece Çalışma, varsayımını geçerliliğini kısmen doğruladı. Örneklem üyelerinin çoğu finansı“temel ihtiyaçları karşılamak”için yararlanırken, çoğu“orta-yüksek”gelirlidir, yani gelirlerini tüketime harcamakta ve dayanıklı tüketim malları satın almak için borçlanmaktadır."
