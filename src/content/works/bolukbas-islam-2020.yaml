abstract: "Niza, akitte söz konusu olan belirsizlikten dolayı taraflar arasında çözümü güç bir anlaşmazlık çıkması durumunu ifade etmektedir. Bu tezde, Hanefî mezhebi tarafından geliştirilen ve muâmelât konularındaki anahtar kelimelerden olan niza kavramının tüm boyutlarıyla ele alınması amaçlanmıştır. Bizi bu çalışmaya sevk eden temel saik, akitlerin sıhhatini etkileyen esas ölçütün niza olabileceği düşüncesidir. Çalışmamızda niza teorisi, mezheplerin fürû literatüründe yapılan ayrıntılı kavram taramaları ve fıkhi meselelerin tahlili neticesinde ortaya konmuştur. Çalışma neticesinde, İslâm hukukunun borçlar hukukuyla ilgili yasaklamalarının başında gelen garar ve cehâletin akdi fâsid ya da bâtıl kılmasındaki illetin bunların taraflar arasında nizaya sebep olması olduğu yönünde birçok bulguya rastlanmıştır. Bu türden bilgiler bizi, akdin fâsid oluşunu belirleyen asıl illetin niza olduğu ve bunun neticesinde de nizayla sonuçlanan her akde fâsid hükmü verildiği sonucuna götürmüştür. Bundan dolayı, İslâm hukukunda anlaşmazlıkların baştan önüne geçmek ve mahkemeye yansımasını önlemek için akdin unsurlarının nizaya sebebiyet vermeyecek şekilde belli olması şart koşulmuştur. Bu bağlamda, İslâm hukukunda akitler ve akitlerin sıhhati konusunda yapılacak çalışmalarda, niza ilkesinin belirleyici bir kural olarak göz önünde bulundurulması önem arz etmektedir."
