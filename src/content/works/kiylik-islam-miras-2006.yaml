abstract: "İslâm Miras Hukukunda Kırk Hâl ve slâm Miras Hukuku ile MedenûKanunda Mirasın Mukâyesesi? adındaki tezimiz, bir giriş ve dört bölümdenmeydana gelmektedir. Giriş bölümü, araştırmanın amacı, önemi, sınırları veyönteminden oluşmaktadır.Tez, iki hukuk sistemi arasında mukâyese yapmadan önce genel olarakgünümüze kadar gelebilmiş hukuk sistemlerinin dayandığı esasları işlemiştir. Hâlböyleyken slâm hukuku ile medenû kanunun da bu bağlamda ûzâhı kaçınılmazolmuştur. Ve şu an günlük yaşantımızda aktif olan medenû kanun ve yine aynıtopraklarda fi tarihte yer bulmuş olan slâm miras hukukunun birleşip ayrıldıklarıhususlar mukâyese edilmiştir. Daha sonra, giriş kısmı hariç tutulursa, birincibölümde genel olarak miras sistemlerini ve bununla birlikte slâm miras hukuku ilemedenû kanunda mirasın bu bağlamda değerlendirilmesine gidilmiştir.kinci bölümde, konunun anlaşılmasına engel olan zorlukları asgariyeindirmek için miras hukukunun temel kavramları bu bölümde işlenmiştir.Mirasçılığın çeşitli yönlerden tasnûfine gidilmiş; tereke, vasiyyet ve miras konularıburada detaylı işlenmiştir.Üçüncü bölümde tezin ana yapısını destekleyen slâm hukukunda ashâbu`l-ferâiz bahsi, ayetlerde yer aldığı şekliyle sunulup; bu bahsin içeriğinde yer alan onbirsınıf örnekleri ile birlikte işlenmiştir.Dördüncü ve son bölümde ise tezin asıl ana yapısını oluşturan, slâm mirashukuku ile Medenû kanunda mirasın mukâyesesi işlenmiştir."
