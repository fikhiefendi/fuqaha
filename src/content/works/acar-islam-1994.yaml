abstract: "VI ÖZET İslâm aile hukukunda, üzerinde en çdk durulan konulardan birisi de kadınlara tanınan haklardır. Biz bu konuyu kapsamı geniş olacağından mali haklar olarak sınırladık. Çalışmamızın amacı, İslâmın aile hukuku kapsamında kadınlara tanıdığı mali haklan.insanlara asıl berraklığı ile sunmak, bu konuda birikmiş yanlış kanaatler ve süregelen yanlış uygulamaların düzeltilmesine katkıda bulunmaktır. Ancak şunu da unutmamak gerekir ki kadın ve erkeklerin yaratılış hikmetleri göz önünde bulundurulmadan, bu konuda sağlıklı bir değerlendirme yapılması mümkün değildir. Tezimizi kaleme alırken İslâm hukukunun temel kaynaklarından istifade etmiş olmakla beraber, yeni yeni ortaya çıkan problemler üzerinde, İslâm hukukunun temel prensiplerini gözönüne alarak yorumlar yapan, günümüz ilim adamlarının çalışmalarından yararlanmayı da ihmal etmedik. Bu çalışmanın neticesinde İslâmın kadınlara tanıdığı mali hakların, erkeklere tanınan mali haklar ve sorumluluklara göre kadınlar ile erkekler arasında bir denge gözetilerek tanındığı ve İslâm hukukunda kadınların sınai, zirai, ticari vesaire olmak üzere ekonomik faaliyetlerinin herhangi birini sınarlayıcı bir hüküm bulunmadığı sonucuna varılmıştır."
