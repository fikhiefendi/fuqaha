abstract: "Fetâvâ-yı Tatarhâniyye hicri VIII. y ü z y ı l d a Hindistan'da yazılmıstır. Delhi Türk Sultanlıgı'nda önemli bir devlet adamı olan emir Tatarhân'ın talimat vermesi üzerine Âlim b. Alâ (v. 786/1384) tarafından geçmis Hanefî fürû-i fıkıh literatürünü bir araya getirmek üzere derlenmistir. Tasnif ve sekil açısından el-Hidâye'yi örnek alan eserin içerik bakımından birincil kaynagı el-Muhîtu'l-burhânî'dir. Hicri II-VIII. yüzyıllar arasında kaleme alınmıs 57 kaynaktan yararlanan müellif Muhammed b. Hasen es-Seybânî'nin eserlerine özel bir önem vermis, çogunlukla Imam Ebû Hanîfe, Muhammed ve Ebû Yusuf arasındaki ihtilafları zikretmis, bazen bunlara Imam Safiî ve Imam Mâlik'in görüslerini ilave etmistir. Fetva kitabı olarak isimlendirilmekle beraber klasik fıkıh kitabı sistematiginde yazılmıs bir eserdir. Müellifin bilgileri kaynak eserlerin adlarını belirterek ve aslına riayet ederek nakletmeye özen gösterdigi görülmektedir. Birden çok kaynakta aynen buldugu bilgiyi kaynakların birinin adını zikrederek, bir eserde mutlak diger birinde mukayyed olarak buldugu bilgileri ise her ikisini zikrederek nakletmistir. Tezimiz bir giris ve üç esas bölümden olusmaktadır. Giris bölümünde fetva kavramı, fetva literatürü hakkında genel bilgiler verdikten sonra Âlim b. Alâ'yı tanıtmaya çalıstık. Birinci bölümde Tatarhâniyye'yi metod ve muhteva açısından inceledikten sonra eserin yazma nüshaları ve hakkında yapılmıs çalısmalarla ilgili bilgi verdik. Ikinci bölümde Tatarhâniyye'nin nikâh bölümünü genel bilgiler ve bölgesel farklılıklar açısından incelemeye çalıstık. Üçüncü bölümde ise Tatarhâniyye'nin kendisinden sonraki fetva kitaplarına etkisini incelemeyi hedefledik. Bilhassa Osmanlı cografyasında yazılmıs fetva kitaplarının çoguna ve kanunnamelere kaynaklık teskil eden Fetâvâ-yı Tatarhâniyye'nin bu önemini ve degerini ilmi açıdan güvenilir bir derleme olmasından aldıgını söyleyebiliriz."
