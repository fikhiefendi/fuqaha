abstract: "Bu çalışma, Harput Kazâsı'nın“1658-1659”tarihli Şer'iyye Sicilinin transkripsiyon ve değerlendirmesini göstermektedir. Osmanlı Devleti'nde kadı, kazâ adı verilen yerleşim yerinde mülkü idare amiri, yerel yönetici ve emniyet müdürü görevini yapmak için merkezden gönderilen şer'i ve idari yapıdan sorumlu olan kişidir. Çalışmada önce Osmanlı Devleti'nin kadılık kurumu, Şer'iyye mahkemeleri ve Şer'iyye sicilleri hakkında bilgi verildikten sonra, sicil içindeki belgeler özetlenip bunların konularına göre tasnifi ve genel değerlendirmesi yapılmıştır. Bundan sonra ise transkripsiyon metinlerine yer verilmiştir. İncelediğimiz Harput Şer'iyye Sicilinde alım-satım, borç tahsili, mal davaları, miras taksimi, vasî tayini, hibe, nafaka, vergi, hırsızlık, cinayet gibi konuların yanı sıra Harput'taki eşkıyalık olayları ve bu olaylar için devletin aldığı tedbirler yer alır."
