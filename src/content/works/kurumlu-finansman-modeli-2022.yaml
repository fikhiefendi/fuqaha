abstract: "Çalışma da, tarih boyunca süre gelen ticari faaliyetlerin en eski dönemlerinde uygulanmaya başlanan ve günümüzde dahi devam eden muhasebe mesleğinin en eski uygarlıktan başlanarak tarihçesi verilmiştir. İlk çağlarda muhasebenin nasıl geliştiği, nasıl bir yol izlendiği ve diğer medeniyetlerde nasıl bir stratejiyle devam ettiği incelenmiştir. Tarihçesiyle birlikte muhasebe mesleğinin pozitif ve negatif yanlarından ziyade, finansal temel kavramlar ve finansal piyasalar üzerinde durulmuştur. Uluslararası ve İslami finansal sistemlerle birlikte, Müslüman halkın ihtiyaçlarını karşılayabilmek için Müslüman bilim insanları tarafından geliştirilmiş olan bir sistem kullanılmaktadır. İslami finansal sistemi, Müslümanların dini hassasiyetini göz önünde bulundurarak İslam'a ters düşmeden faiz ve finansal sisteminin dışında yer alan sermayenin finansal kaynaklara eklenerek İslam dininin hassasiyetlerini yaşayan medeniyetlerdeki finansal kaynaklara olan ihtiyaçlarını karşılamayı amaçlamıştır. Tezde sukuk kavramından bahsedilirken aynı zamanda sukukun avantaj ve dezavantajları da ele alınmıştır. Sukuk sisteminden ve bu sistemin çalıştığı piyasalarda yer alan İslami finansal kuruluşlardan bahsedilmiştir. Sukuk'un dayandığı finansal modeller de konu edilmiştir. Tezin son bölümünde ise, kira sertifikaları ve türlerinden kısaca bahsedilmiştir."
