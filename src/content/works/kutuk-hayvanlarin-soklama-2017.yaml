abstract: "Şoklama yöntemleri ile hayvan kesimi günümüzde Müslümanların karşılaştığı güncel meselelerden biridir. Bu yöntemlerin temel amacı hayvanı kesim öncesi bilinç kaybına uğratarak daha rahat ve hızlı bir kesim yapmaktır. Temel olarak üç çeşit yöntem vardır: captive bolt yöntemi, elektrikle şoklama ve gazla şoklama. Bu yöntemlerin incelenmesi hayvanın etinin helallliği noktasında fıkhi açıdan önem arz etmektedir. Bu çalışma şoklama yöntemlerini inceleyip bunlara fıkhi bir çözüm bulmaya amaçlamaktadır."
