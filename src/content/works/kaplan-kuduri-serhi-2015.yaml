abstract: "Çalışmamızda, Hanefi mezhebinde muhtasarları inceledik. Sonra el-Kudûrî ve Meydânî'nin hayatlarını ve eserlerini inceledik. Sonra konunun asıl önemli noktası olan el-Lübâb'ın kaynakları ve yazarlarını inceledik. Toplam eser olarak müellifin şerhinde 140 eser zikrettiğini ulamış bulunmaktayız. Bu şerhte müellif temele dört kitap almıştır. Bu kitaplar, ed-Dürrü'l-Muhtâr, el-Cevheretü'n-Neyyira, el-Hidâye ve et-Tercih ve't-Tashîh'dir. Bunların istatistik verilerini verdik. Son olarak da el-Kudûrî'nin ve el-Lübâb'ın metodunu inceledik ve elde ettiğimiz sonuçları zikrettik."
