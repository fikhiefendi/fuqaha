abstract: "Bu tezde, İslam hukuk usûlünün temel kavramlarından biri olan şer'î hüküm, Şâtıbî'nin düşünce sistemi çerçevesinde ele alınmış ve onun bu alana getirdiği özgün katkılar incelenmiştir. Şer'î hüküm, mükellefin fiillerine ilişkin ilahî hitabın bir tezahürü olarak, hem teorik hem de pratik açıdan İslam hukukunun merkezinde yer almaktadır. Bu çalışma, Şâtıbî'nin şer'î hüküm anlayışını klasik usûl literatürüyle mukayeseli bir şekilde değerlendirerek, onun makâsıd merkezli yaklaşımının hüküm teorisine etkilerini ortaya koymayı amaçlamaktadır. Tez üç ana bölümden oluşmaktadır. Birinci bölümde, Şâtıbî'nin hayatı, ilmî kişiliği ve usûl anlayışı ele alınmış; ardından onun genel hüküm teorisi çerçevesinde şer'î hüküm kavramı, hükümlerin kısımları ve hükümlerin ta'lîli meselesi incelenmiştir. Bu bölümde özellikle Şâtıbî'nin hükümlerin illet ve maksatları arasındaki ilişkiye verdiği önem vurgulanmıştır. İkinci bölümde, teklîfî hükümler detaylı bir şekilde ele alınmış; vücûb, nedb, ibâha, kerâhet ve tahrîm gibi hüküm türleri, Şâtıbî'nin yaklaşımı doğrultusunda analiz edilmiştir. Bu bağlamda, mükellef, fiil ve ilahî maksat arasındaki ilişki değerlendirilerek, teklîfî hükümlerin yalnızca normatif bir yapı değil, aynı zamanda insan maslahatını gözeten bir sistem olduğu ortaya konulmuştur. Üçüncü bölümde ise vaz'î hükümler incelenmiş; sebep, şart, mâni, sahihlik ve butlân gibi kavramlar üzerinden Şâtıbî'nin bu alandaki görüşleri analiz edilmiştir. Ayrıca vaz'î hükümler ile teklîfî hükümler arasındaki ilişki ele alınarak, Şâtıbî'nin bütüncül hüküm anlayışı ortaya konulmuştur. Sonuç olarak bu çalışma, Şâtıbî'nin şer'î hüküm anlayışının, klasik usûl düşüncesine kıyasla daha amaç odaklı, sistematik ve bütüncül bir yapı arz ettiğini ortaya koymuştur. Onun yaklaşımının, günümüz İslam hukuk tartışmalarında önemli açılımlar sunabilecek nitelikte olduğu değerlendirilmiştir."
