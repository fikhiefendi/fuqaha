abstract: "Maslahat, en genel tanımıyla faydalı olanı elde edip zararlı olanı defetmektir. Şâri'nin, hüküm koyarken insanların hem bu dünyadaki hem de ahiretteki maslahatını gözettiğine dair âlimler arasında fikir birliği vardır. Maslahat delili Hz. Peygamber ile birlikte kullanılmaya başlanmıştır. Peygamberimizin vefatıyla birlikte raşit halifeler döneminde ve sonrasında kullanılan bir delil haline gelmiştir. Günümüze kadar ulaşan usûl eserlerini incelediğimizde maslahatın terim olarak Gazzâl'nin el-Müstasfâ adlı eserinin ıstıslah başlığı altında ele alındığını görmekteyiz. Maslahat çeşitli açılardan sınıflandırmaya tabi tutulmuştur. Alimler arasında en çok tartışmaya sebep olan konu maslahat- mürselenin hüccet olup olmadığıdır. Bu tez, İslam hukukunun önemli delillerinden olan maslahat delilini ve bu delilin günümüz fıkıh problemlerine uygulanışını konu edinmektedir. Tezimiz giriş, iki bölüm ve sonuç kısmından oluşmaktadır. Giriş kısmında tezin amacı, konusu, yöntemi, önemi ve konuyla alakalı kaleme alınmış çalışmalara yer vermeye çalıştık. Birinci bölümde maslahat delilini genel hatlarıyla incelemeye çalıştık. İncelememizi yaparken kadim ve günümüz fıkıh eserlerinden faydalandık. İkinci bölümde ise günümüzde ortaya çıkmış güncel problemlere maslahat delilinin uygulama biçimine yer verdik. Bu bölümde günümüzde ortaya çıkan meseleleri incelerken kadim ve günümüzde ortaya çıkan meseleleri incelerken kadim ve günümüz fıkıh eserlerinden faydalandık."
