abstract: "Türk Ceza Hukukunda Suç ve Cezada Kanunilik Etkisi\" başlıklı tez çalışmasında, suçta ve cezada kanunilik ilkesinin teorik temelleri ve tarihsel gelişimi ile birlikte uluslararası hukukta görünümü ve Türk hukukundaki durumu ele alınmaktadır. Kanunilik ilkesi, ceza hukukunun temel prensiplerinden biri olup, suçların ve cezaların yalnızca kanunla belirlenmesi gerektiğini öngörür. Bu ilke, bireylerin hukuki güvenlik hakkını sağlamakta ve keyfi yargılamaların önüne geçmektedir. Çalışmada, kanunilik ilkesinin tarihsel kökenleri ve teorik altyapısı incelenmiştir. Antik dönemden modern döneme kadar olan süreçte ilkenin gelişimi, antik dönemde özellikle Roma Hukuku ve Aydınlanma Çağı'nın katkılarıyla ele alınmıştır. Ardından, Türk ve İslam hukukundaki gelişimi ve etkileri incelenmiş ve uluslararası hukuk düzenlemelerinde kanunilik ilkesinin yeri, Avrupa İnsan Hakları Sözleşmesi (AİHS) ve Uluslararası Ceza Mahkemesi (ICC) kararları bağlamında değerlendirilmiş ve uluslararası belgelerin Türk hukukundaki yeri incelenmiştir. Türkiye özelinde ise Anayasa ve Türk Ceza Kanunu'nda ilkenin yasal dayanakları analiz edilmiştir. Çalışmada, ilkenin uygulamadaki yansımaları da ele alınmış, özellikle Anayasa Mahkemesi kararları bağlamında yaşanan uyuşmazlıklara değinilmiştir. İlkenin, hukuk devleti ilkesi ve insan hakları bağlamında sağladığı güvenceler de detaylı olarak incelenerek çalışma tamamlanmıştır."
