abstract: "Çalışmamız dört bölümden oluşmaktadır. Birinci bölümde araştırmanın konusu, amacı, önemi, yöntemi ve sınırlılıklarını ele aldık. İkinci bölümde İmam Malik'in düşünce tarzını anlamaya yardımcı olması için onun kararlarına etki eden delilleri hangi sıralama ile kullandığı hakkında bilgiler derledik. Üçüncü bölümde re'y ekolü ile hadis ekolleri ile ilgili temel bilgilerle birlikte, bu iki ekolün birbirinden hangi özellikleri ile ayrıldığını açıkladık. Ardından yine aynı bölümde İmam Malik'in bu iki ekol arasındaki konumunu belirleyebilmek için onun re'ycilik ile itham ettiği en önemli isimlerden olan İmam Ebû Hanîfe'nin hadisçiliği ve re'yciliği ile İmam Malik'in re'yciliği ve hadisçiliğini karşılaştırdık. Dördüncü bölümde ise İmam Malik'in hadisler varken bunları uygulamayıp, bizce re'yine göre karar verdiği konulara örnekler sunduk."
