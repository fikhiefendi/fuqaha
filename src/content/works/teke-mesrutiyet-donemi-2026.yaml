abstract: "II. Meşrutiyet devri, Osmanlı İslâmcı düşüncesinde tecdid fikrinin tarihsel, kavramsal ve toplumsal boyutlarıyla yeniden tanımlandığı kritik bir döneme karşılık gelmektedir. Bu tezde, 1908-1924 yılları arasında II. Meşrutiyet dönemi İslâmcı aydınlarının tecdid tasavvurları; tecdid, teceddüd, ıslah, ihya, ictihâd, terakkî, tedennî ve inhitât kavramları etrafında şekillenen tartışmalar üzerinden ele alınmıştır. Tezin temel amacı, bu kavramların hangi tarihsel bağlam içinde anlam kazandığını, nasıl kavramsallaştırıldığını ve II. Meşrutiyet İslâmcıları arasında hangi müşterek zeminler ile hangi ayrışma noktalarını ortaya çıkardığını tespit etmektir. Bu çerçevede çalışmamız, İslâmcı düşünceyi kişi merkezli bir sıralama yerine kavram merkezli ve mukayeseli bir okuma ile değerlendirmektedir. Tez, II. Meşrutiyet devri İslâmcı tecdid fikrinin yalnızca dönemin siyasî şartları içinde değil, Nizâm-ı Cedîd'den Tanzimat'a, Yeni Osmanlılardan II. Abdülhamid devrine uzanan Osmanlı modernleşme tecrübesi içinde şekillendiğini göstermektedir. Toplum ve devlet düzeninin güçlü olduğu dönemlerde daha az hissedilen tecdid ihtiyacı, çözülme, gerileme ve meşruiyet krizlerinin derinleştiği safhalarda İslâm düşüncesinin en canlı ve işlevsel kavramlarından biri hâline gelmiştir. Bu bakımdan çalışmamız, tecdidin yalnızca teorik bir kavram olmadığını; Müslüman toplumların tarihsel hafızasında kriz dönemlerinde başvurulan bir toparlanma ve yeniden kuruluş çerçevesi olarak da işlediğini ortaya koymaktadır. Tezimizin ulaştığı temel sonuçlardan biri, tecdid fikrinin Osmanlı düşünce dünyasında güçlü bir meşruiyet zeminine sahip olduğudur. Tecdide dair hadis rivayeti, yenilenmenin dinin dışına çıkan bir kopuş değil, dinin aslî esaslarını muhafaza ederek bozulanı tashih etmeye yönelen meşrû bir faaliyet olarak anlaşılmasına imkân vermiştir. Bu doğrultuda tez, II. Meşrutiyet İslâmcılarının tecdid tasavvurlarını aynı tarihsel krize verilen cevaplarda öne çıkan üç baskın yönelim çerçevesinde değerlendirmektedir: hukukî ve usûlî yenilenme arayışları, ahlâkî ve manevî ıslah vurgusu ile toplumsal, siyasal ve kurumsal yeniden düzenleme çabası. Sonuç olarak bu çalışma, II. Meşrutiyet İslâmcılarının tecdid anlayışının ne durağan bir muhafaza refleksine ne de köklü bir kopuşu ifade eden bir reform düşüncesine indirgenebileceğini göstermektedir. Bu aydınlar tecdidi, dinin aslî esaslarını muhafaza etmekle birlikte, tarihsel kurumları, usulleri ve uygulama biçimlerini yeniden yorumlamaya imkân tanıyan tedricî ve meşrû bir yenilenme olarak kavramlaştırmışlardır. Bu sebeple tecdid, II. Meşrutiyet dönemi İslâmcı düşüncesinde dinî, fikrî, ahlâkî, toplumsal ve kurumsal bir yeniden inşa tasavvuru olarak belirginleşmiştir."
