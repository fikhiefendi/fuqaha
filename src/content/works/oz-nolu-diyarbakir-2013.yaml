abstract: "Maiyeti altında yaşayan kişilere adaletli davranmayı esas alan Osmanlı Devleti, halkın her türlü sorunuyla ilgilenmiştir. Bu amaçla gerek halkın kendi arasında gerekse halk ile devlet görevlileri arasında meydana gelen huzursuzlukların giderilmesi için titiz bir şekilde hukukun uygulanmasına çalışmıştır. Bu amaçla kadılar tayin edilmiş ve mahkemeler tesis edilmiştir. Kadılar, gerek bu mahkemelerde görülen davaları gerekse merkezden gelen yazıların birer kopyasını şer?iye sicili adı verilen defterlere kaydetmişlerdir. 352 numaralı Diyarbakır Şer?iye Sicili h.1136/1264, m.1724/1848 yıllarında mahkemeye intikal etmiş olan sosyal, ekonomik, idari ve dini hayat ile ilgili değişik bilgiler içeriyorlar. Bu çalışmada öncelikli olarak Osmanlı öncesi ve Osmanlı dönemi Diyarbakır?ın tarihi ana hatlarıyla ele alındı.Şer?iye mahkemelerinin özellikleri ve bu mahkemelerde görev alan kişiler hakkında bilgi verildikten sonra 352 numaralı defterin ihtiva ettiği konular ile defterde geçen mahalle, köy, kaza ve nahiyelerin adları ile Müslüman ve gayrimüslimlerin isimleri, mescit, medrese, han ve hamamlar ve başkaca ilginç bilgiler tablo halinde verilerek defterde yer alan bilgiler doğrultusunda değerlendirme yapıldı. Daha sonra defterde yer alan belgelerin transkripsiyonu yapıldı. Defterin sonuna da bir kaç belgenin orijinal kopyaları konuldu. Bu çalışmada geçen ve günümüzde anlamları çok fazla bilinmeyen bazı kelimeler için bir sözlük hazırlanarak çalışmanın sonuna ilave edildi."
