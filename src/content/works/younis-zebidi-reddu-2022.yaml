abstract: "Şeyhülislâm Ebussuûd Efendi, Sultan Selim ve Sultan Süleyman zamanlarında on yedi sene müderrislik, altı sene kadılık, sekiz sene kazaskerlik otuz küsur sene şeyhülislâmlık yapmış, dolayısıyla altmış küsur yıl Osmanlı ilim, kültür ve hukuk hayatında etkin rol oynamış bir şahsiyettir. Ebussuûdun İslâmi ilimlerle ilgili pek çok eseri vardır. İrşadü'l-akli's-selim ilâ mezâyâ'lKitâbil-kerîm adlı tefsiri bu eserler içinde önemli bir yere sahip olup geçmişte ve günümüzde pek çok araştırmalara konu olmuş ve doktora seviyesinde incelenmiştir. Bu tefsirle alakalı eski çalışmalardan birisi de Zebîdî'nin Reddu'l-İ'tiradât âlâ Tefsiri Ebissuûd adlı eseridir. Bu eserde müellif, Ebussuûd tefsirine yönelik itirazları ele almıştır. Bu çalışmamızın amacı böylesine değerli bir yazma eseri tozlu raflardan çıkarıp ilim dünyasının nazarlarına sunmaktır. Böylece İslamî eserler alanına değerli bir eser daha eklenebilecektir."
