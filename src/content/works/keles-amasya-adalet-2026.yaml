abstract: "Adaleti devletin varlık sebebi olarak gören Osmanlı Devleti tebaasının hak arama yollarını çok yönlü ve fonksiyonel olarak açık tutmaya çalışmıştır. Bu çalışma, 1800-1850 yılları arasında Amasya sancağı üzerinden Osmanlı taşrasındaki adalet arayışlarını ve şikâyet mekanizmasına erişimi incelemeyi amaçlamaktadır. Tanzimat sürecine giden dönemde merkez-taşra ilişkilerinin siyasi, sosyal ve ekonomik durumunun bölge asayişine nasıl yansıdığı ve hukuk uygulamalarının ne ölçüde hayata geçirilebildiği belirlenmeye çalışılarak Osmanlı adalet sisteminin işleyişine özgün ve yerel bir bakış açısı sunması hedeflenmiştir. Araştırmanın temel kaynaklarını on dört ahkâm defteri ve diğer arşiv belgeleri oluşturmuştur. Ayrıca, dönemin sosyal, ekonomik ve siyasi yapısını anlamak için ilgili literatür taranmıştır. Şikâyet konuları; davacı/davalıların demografik özellikleri kategorize edilerek analiz edilmiştir. Nicel verilerin sunumunda tablo ve şekillerden yararlanılmıştır. Bu sayede, Osmanlı taşrasındaki adalet arama eğilimleri ve Amasya sancağı özelindeki durumları daha anlaşılır bir şekilde ortaya konulmuştur. Çalışmanın sonucunda incelenen dönemde Osmanlı taşrasındaki şikâyet olgusunun geniş bir yelpazede tezahür ettiği görülmüştür. Amasya sancağında tımar, vakıf, borç-alacak, su, vergi, miras, mülk zaptı ve hilaf-ı rıza gibi hukuki anlaşmazlıkların kayıtlara yansıdığı tespit edilmiştir. Herhangi bir haksızlık karşısında Amasya'da yaşayan kadın erkek, yöneten yönetilen, asker-sivil çoğu kişi dini hüviyeti fark etmeksizin sorunlarının çözümü için mücadeleye girişmiştir. İncelenen vesikalarda şikâyet edenlerin ve şikâyet edilenlerin genellikle erkek olduğu, şikâyetlerin daha çok kırsal kesimde yoğunlaştığı tespit edilmiştir. Fakat bazı vakaların nihai sonuçlarına veya uygulanan cezalara dair kesin bilgilere ulaşılamamış olması, çalışmanın sınırlılıklarından birisini oluşturmuştur. Vakaların merkezi otoriteye intikal etmesi halinde, merkezdeki yöneticilerin taşra ile irtibat kurarak söz konusu sorunların giderilmesi noktasında çaba gösterdiği söylenebilir. Sonuç olarak bu çalışma, Amasya örneği üzerinden Osmanlı adalet sisteminin merkeziyetçi kontrolünü ve halkın adalet arayışındaki sürekliliğini somut arşiv kayıtlarıyla gözler önüne sererek özgün katkılar sunmayı amaçlamaktadır."
