abstract: "Bu araştırmanın temel amacı, bankalarda toplam kalite yönetimi uygulamalarının müşteri memnuniyetini sağlamasındaki etkisini ortaya koymaktır. Ayrıca bankacılık hizmetlerinin kalitesinin alt boyutları olan kolay erişebilirlik, güvenirlik, yanıt, garanti, empati ile müşteri memnuniyeti arasındaki ilişkiyi, banka müşterileri üzerinde karşılaştırmalı bir çalışma ile test etmektir. Araştırma problemi olarak; bankaların, bankacılık sektöründeki büyük rekabet ve bu alandaki hızlı teknolojik gelişmeler nedeniyle müşterilerinin sadakatini ve memnuniyetini sağlayacak müşteri hizmetlerinin kalitesini artırmak ve rekabetçi konumlarını koruma ihtiyacı belirlenmiştir. Araştırma metodolojisi olarak, araştırma verileri 2021 yılında İslami ve Arap ticari bankalarından 413 müşteriye uygulanan anketlerle toplanmıştır. Anket iki bölümden oluşmuş, birinci bölümde hedef kitle ile araştırma konusu arasındaki ilişki demografik özellikleri açısından açıklanmış, ikinci bölümde hipotezleri test etmek için sorular kullanılmıştır. Katılımcıların, bankacılık performansı ve hizmet kalitesi bulguları aralarındaki ilişkinin pozitif yönlü ve çok yüksek düzeyde anlamlı olduğu belirlenmiştir. Bu sonuç bankacılık performansında artış olduğunda hizmet kalitesi düzeylerinde yüksek seviyede bir artış olduğunu göstermektedir. Araştırma modelinde kolay erişebilirlik, güvenirlik, yanıt, garanti empati ve hizmet kalitesi bağımsız değişkenlerinin bankacılık performansı, verimli bankacılık ve etkin bankacılık performansı üzerindeki etkilerinin incelenmesinde bağımsız değişkenlerin birden fazla olması nedeniyle çoklu doğrusal regresyon modeli yapılmıştır. Hizmet kalitesi düzeylerinin bankacılık performansı düzeyleri üzerinde anlamlı bir etkisi olduğu belirlenmiştir. Regresyon eşitliği incelendiğinde hizmet kalitesinden memnuniyet düzeylerinin bankacılık performansı üzerinde pozitif yönlü bir etkisinin olduğu belirlenmiştir. Kolay erişebilirliğin, güvenirliğin, garantinin ve empatiden memnuniyet düzeylerinin etkin bankacılık performansı düzeyleri üzerinde anlamlı bir etkisi olduğu belirlenmiştir."
