abstract: "Tam adı ?Bedreddin Mahmûd b. ?srâil b. Abdülazîz? olan Seyh Bedreddin, babası tarafından fethedilen Simavna Kalesi'nde 760/1359 yılı civarında doğmustur. Seyh Bedreddin, babasının kadı olması sebebiyle ?Simavna Kadısıoğlu? ismiyle de anılmaktadır. Annesi ise, bu kalenin mağlup edilen Rum komutanının kızıdır ve müslüman olduktan sonra Melek adını almıstır. Seyh Bedreddin, Edirne, Bursa, Konya, Mekke, Kahire gibi çesitli ilim merkezlerinde birçok hocadan ders almıs ve bu tahsil süreci, onun oldukça yüksek seviyede ilmî birikime ve çok yönlü bir kimliğe sahip olmasını sağlamıstır. Farklı iddialar bulunmakla birlikte, ehl-i sünnet inancına dayanan bir tasavvuf anlayısına sahip olan Seyh Bedreddin'in mensup olduğu tarikat hakkında tam kanaate ulasılamamıstır. Kaynakların çeliskili bilgiler vermesi ve pesin kabullerden hareketle ideolojik söylemlere malzeme yapılması sebebiyle Seyh Bedreddin padisaha bilfiil isyan ettiğine ve sapkın inançlara sahip olduğuna dair iddialara süpheyle yaklasılmalıdır. Bununla birlikte isyan suçu sabit görülerek 820/1417 yılında asılarak idam edildiği bilinmektedir. Seyh Bedreddin'in Letâifü'l-isârât ve et-Teshîl adlı fıkıh eserlerinde sekil ve yöntem bakımından ?bnü's-Sâatî'nin Mecmeu'l-Bahreyn adlı eseri takip edilmistir. Câmiu'l-fusûleyn adlı fıkıh eseri ise, fasıllar seklinde farklı bir yöntemle yazılmıstır. Bu eserler dil, tür ve muhteva bakımından yazıldıkları dönemin karakteristik özelliklerini yansıtmakta ve Seyh Bedreddin'in en azından Hanefî mezhebine mensup ?ashâb-ı tercih? seviyesinde bir fakih olduğunu göstermektedir. Öte yandan, Seyh Bedreddin'in ?ictihâd? hakkındaki bazı görüsleri, mezhepte kabul edilen usûle uymadığı için elestirilmistir."
