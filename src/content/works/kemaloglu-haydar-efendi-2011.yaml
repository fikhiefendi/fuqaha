abstract: "İslâm Hukuku'nun medenî hukuk alanında ilk kanunlaştırma örneğiMecelle'dir. Mecelle yalnız ülkemizde değil, Tunus, Irak, İsrail, Fas gibi birçok ülkenin de medenî hukukunun oluşmasında ilham kaynağı olmuştur. İşte bundan dolayı anlaşılabilmesi için Mecelle üzerine birçok şerh yazılmıştır. Çalışmamızın konusunu oluşturan Ali Haydar Efendi'nin ?Dürerü'l-Hükkâm Şerhu Mecelleti'l-Ahkâm? adlı eseri de Mecelle'nin en önemli şerhlerinden birisidir.Çalışmamız ?Dürerü'l-Hükkâm? adlı eserin icâre bahsi ile alâkalı bilgileri içeren 404-457. maddelerinin kaynaklarının tespit ve tahkîkinden oluşmaktadır. Kaynakların tespit ve tahkîkini yapmadan önce ilgilenenlerin metinden faydalanmalarını kolaylaştırmak amacıyla metni latinize ettik. Bunu yaparken mümkün olduğunca metnin aslına sadık kalmaya özen gösterdik.Tezimiz bir giriş ve üç bölümden oluşmaktadır. Bölüm kısımları çalışmamızın konusunu oluşturan maddelerin latinize ve tahkîk edilmesiyle meydana getirilmiştir.Çalışmamızın amacı zikrettiğimiz bölümün latinize ve kaynaklarınıntahkîk çalışmasını yaparak İslâm Hukukçularının ve İslâm Hukukuyla ilgilenenlerin bu eserden faydalanmalarını kolaylaştırmaktır."
