abstract: "Bain talakla boşama şudur: Bir kimse, bir kadınla nikah-landıktan sonra, ister birleşme olsun, isterse olmasın kinayeli yani kapalı bir ifade ile karısını boşamışsa, bu boşama bain talakla yapılan bir boşama olur. Bir kimse, karısı ile henüz birleşmeden önce, onu bir sözle üç talakla boşasa, üç talakın üçü de verilmiş olduğundan kesin ayrılık icap eder. Fakat ayrı ayrı söylerse, ilk sözüyle bir talak meydana gelir; diğer ikinci ve üçüncü boşamalar sayılmaz. İlk boşama sözü hemen bain talaka döner ve nikah ortadan kalkar. Yukarda, kinayeli sözlerle yapılan boşamanın bain talakla boşama olduğunu söylemiştik. Talak, yani boşama kastedilme-den söylenen kinayeli, kapalı sözlerle korkutmak gibi bir düşünce varsa boşama olmaz. Ancak onunla boşamayı kaste-derse, o zaman boşama meydana gelmiş olur. Mesela: Sen bainsiz (bain talakla boşsun), haramsın, ipin boynundadır, ailene kavuş, sen salıverilmişsin, seni ailene bağışladım, seni ayırdım, işin elindedir, sen hürsün, örtün, çık, git, kalk koca ara, kocan değilim gibi sözler kapalı ifadelerdir. Eğer bir koca bu sözlerden herhangi bir kelimeyi karısına söylerse, o erkeğin niyetine bakılır: Bu sözle, karısını bir talakla boşamayı kasdetmişse, karısı bir bain talakla boş olur. iki talakla boşamayı kasdetmişse, karısı yine bir bain talakla boş olur. Eğer üç talakla boşamayı kasdetmişse, karısı üç bain talakla boş olur. Böyle bir boşamada, eğer kadın iki bain talakla boşanmış da karı-koca tekrar birleşmek istiyorlarsa, yapılacak şey şudur: Kadının iddeti çıkmış olsun olmasın, kadının rızası olmak üzere, yeniden mehir yapılıp, yeniden nikah kıyılır. Ama kadın ister ric'i talakla, isterse bain talakla boşanmış olsun, eğer üç talak varsa, artık o karı-koca birleşemezler. Onun bir tek yolu vardır. O da hulledir. Hulle de bazı din düşmanlarının ve cahillerin söylediği gibi değildir. İleriki sahi-felerde anlatılacaktır. Bir erkek karısını şu şekillerden birisi ile boşamış olursa ta-lak-ı bayin olur: 1- İbane [35] kelimesini ifade edecek harflerden teşekkül eden lafızla karısını boşarsa. Mesela karısına:“Sen mübane-sin”[36] demesi gibi.) 2- Nikahlandığı karısını gerdeğe girmeden önce boşamış ise, o talak, bayin olur. 3- Evlendiği kadın ile gerdeğe girdikten sonra, talak lafızları ile yapılmakla beraber, nas veya işaret yolu ile üç sayıyı yaklaşmış olursa, yani üç talakla boşamış olursa, yahut bain olan talaka delalet eden bir sıfatla olursa. 4- Erkek karısını bir bedele dayanarak boşamış olursa. Binaenaleyh, nikah kıyılıp henüz gerdeğe girmezden önce karısına:“Sen boş ol”derse, bu talak, bain olur. Bunun gibi, bir erkek karısına:“Seni talak-ı bayin ile boşadım”veyahut:“Seni bu kadar para karşılığında boşadım”derse, karısı da bunu ka¬bul ederse, o kadın talak-ı bayin ile kocasından boş olur. Erkeğe, talak-ı bayin ile boşadığı karısı, iddet içinde olsun iddet bittikten sonra olsun, haram olur. Çünkü talak-ı bayin ile evlilik tamamen ortadan kalkmış olur. Talak-ı bayinin hükmü budur. İster iddet içinde olsun, isterse iddet bittikten sonra ol-sun, erkek karısını tekrar almak istediğinde, kadının bu evliliğe rıza göstermesi gerektiği gibi, erkek yeniden mehir tayin ederek şahitler huzurunda nikah kıymak zorundadır. Bir erkek talak-ı bayin ile boşadığı karısı ile bir yerde otura-maz. İddeti içinde olsa bile bir arada bulunmaları ve boşanan kadının kendisine görünmesi caiz değildir. Üç talak dışındaki talak-ı bayine beynunet-i suğra“Küçük beynunet - Küçük anlaşmazlık”denir. Eğer üç talakla boşanırsa, buna beynunet-¬i kübra“Büyük beynunet - büyük ihtilaf, anlaşmazlık”denir. Küçük beynunede yeniden nikah yapmadan, büyük beynunede ise başka kocaya varıp ondan boşanmadan tekrar birleşmeleri caiz olmaz. Talak-ı bayin ile boşanan kadın, iddeti içinde iken kendisi ve¬fat ederse, kocası ona varis olamayacağı gibi, kocası vefat ederse, kendisi de kocasına varis olamaz. Çünkü aralarında nikah yoktur."
