abstract: "Araştırma, İslam hukukunda iz'ân akitlerini ele almaktadır. İz'ân akitlerinin önemi, toplumumuzda yaygınlık göstermesinde ve hayat için zorunlu muameleleri içermesiden kaynaklanmaktadır. Toplumdaki her birey, bu akitlerle sıkı sıkıya bağlı bir hâl üzere bulunmaktadır. Çünkü bu akitler, hayatımızın idâmesi için olmazsa olmaz ticari ürünlerle ve insan hayatı için zorunluluk ve önem arz eden hizmetlerle bağlantılıdır. Araştırma, giriş ve üç bölümden oluşmaktadır. Giriş: Burada, araştırma konusuna dair bir giriş, konunun önemi ve seçilme sebepleri, araştırmanın yöntemi, tezin yazımı sürecinde karşılaşılan zorluklar ve problemler, araştırma konusu hakkında yapılmış eski incelemeler ve araştırmanın özeti yer almaktadır. Giriş Kısmı: Burada, akit kavramını dil ve ıstılah açısından ele alınmış, akdin rükün ve şartları incelemiştir. Birinci Bölüm: Burada üç temel konu yer almaktadır. İlk olarak iz'ân akdi kavramı dil ve ıstılah açısından ele alınmıştır. İkinci olarak akitlerin olağan biçimini ve bunların iz'ân akitleri ile olan ilgileri işlenmiştir. Üçüncü olarak ise, iz'ân akitlerinin tarihî gelişimi ve İslam hukukçuları tarafından bu isimle adlandırılma gerekçeleri ve konuyla ilgili tartışma ve görüşler ele alınmıştır İkinci Bölüm: Burada da üç temel konu ele alınmıştır. İlk olarak İslam hukukunda ve pozitif hukukta iz'ân akitlerinin tabiatı ele alınmıştır. İkinci olarak, iz'ân akitlerinin kurulması için yapılan icab ve kabûlün İslam hukuku açısından tahlil ve değerlendirilmesi yapılmıştır. Üçüncü olarak ise, iz'ân akitlerinin hükmü ve devletin bu akitlere müdahelesini gerektiren durumlar ve devletin sorumluluları ele alınmıştır. Üçüncü Bölüm: Burada da üç temel konu ele alınmıştır. İlk olarak iz'ân akitlerinin kuruluşu ve rükünleri ele alınmıştır. İkinci olarak, iz'ân akitlerinin özellikleri, şartları ve kabul eden taraf cihetinden değiştirilme imkânı işlenmiştir. Üçüncü olarak ise, iz'an akitlerinin kısımlarından ve çağdaş görünümlerinden bahsedilmiştir. Bu çalışma ile ulaşılan neticelerin verildiği Sonuç ile çalışma tamamlanmıştır."
