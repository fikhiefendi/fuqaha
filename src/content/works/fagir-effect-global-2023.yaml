abstract: "Bu çalışma, 2007 ile 2018 yılları arasında Sudan'da global ve yerel makroekonomik faktörlerin stok piyasası üzerindeki etkisini kantil regresyon metodolojisi kullanarak incelemek amacıyla yapılmıştır. Sonuçlar, 2011 yılında Sudan'ın ayrılmasından önce VIX gibi global faktörlerin, ancak ayrılmadan sonra Murabaha oranı, döviz kuru ve enflasyon gibi yerel faktörlerin Khartoum stok piyasası getirilerini etkilediğini göstermiştir. İkinci dönemde döviz kuru stok piyasası üzerinde anlamlı pozitif bir etkiye sahip bulunurken, enflasyon oranı da anlamlı pozitif bir etkiye sahiptir. Diğer taraftan, Murabaha oranı ve OVX ikinci dönemde anlamlı bir etkiye sahip bulunurken, ilk dönemde anlamsız bulunmuştur. VIX, ikinci dönemde stok piyasası üzerinde negatif anlamlı bir etkiye sahip bulunurken, ilk dönemde anlamsız bulunmuştur. Bu bulgular, Sudan'ın 2011 yılında ayrılmasının Khartoum stok piyasasının performansını ve farklı faktörlere duyarlılığını değiştirdiğini ve yatırımcılar ve piyasa katılımcıları için sonuçları olduğunu göstermektedir."
