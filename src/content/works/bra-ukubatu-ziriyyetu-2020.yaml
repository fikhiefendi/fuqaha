abstract: "Bu araştırma, İslam Hukukunda Ta'zir cezalarını ve hakimin bu cezaları takdir yetkisini ve sınırlarını tespit etmeyi amaçlamaktadır. Çalışmamız dört bölümden oluşmaktadır: Birinci bölüm'de“Ta'zir”kavramının anlamı, meşruiyeti, ta'zir cezalarının amaçları, türleri hakkında bilgi verilmiştir. İkinci bölüm'de İslam Hukukunda Hâkimin cezaları takdir etme yetkisi ve bu yetkinin sınırları tespit edilmiştir. Üçüncü bölüm'de, Ta'zir cezasının tespitine dair genel ilkeler ortaya konmuştur. Bu bölümde, cinayeti işleyen kişi, cinayete maruz kalan kişi ve cinayetin özelliğine göre farklılık gösterebileceği üzerinde durulmuştur. Dördüncü bölüm'de ise Ta'zir cezalarının şer'i nasların amaçları açısından kayıt ve şartları ele alınmıştır. Hakimin bu cezaları tespitte şeri nassların ve icma'i hükümlerin amaçlarının dışına çıkamayacağı üzerinde durulmuştur."
