abstract: "Yapılı çevre ve insan ihtiyaçları sürekli bir değişim içerisindedir. Bu değişim günümüzün teknolojik gelişmeleri ile daha da hızlanmış ve giderek hızlanmaktadır. Kullanıcılar, değişen ve dönüşen ihtiyaçlarını, yaşadıkları çevreye yansıtmaya çalışmakta ve yapılı çevrenin değişen ihtiyaçlarını karşılamasını beklemektedir. Değişen kullanıcı ihtiyaçlarının karşılanması, yapılı çevrenin değişebilirliği ile ilişkilidir. Mimari çevre, değişebilirlik bağlamında incelendiğinde geleneksel çevrelerin değişime açık ve esnek bir yapıda olduğu gözlenmektedir. Geleneksel çevrenin fiziksel olarak kolaylıkla değiştirilmeye elverişli olduğu, kullanıcıların ihtiyaçlarına yönelik olarak yapılarda gerçekleştirdikleri değişimlerde görülmektedir. Bununla birlikte, günümüz modern çevresinde mimari yapılar tamamlanmış bir ürün olarak kabul edilmekte ve çoğunlukla değişime uyum sağlamakta yetersiz kalmaktadır. İhtiyaçlar değişirken yapıların sabit kalması, işlevsel ve fiziksel eskimeyi beraberinde getirerek mimaride, esneklik ve değişebilirlik gibi kavramların tartışılmasına yol açmıştır. Bu anlamda günümüz mimarisi, değişen ihtiyaçlara cevap verebilecek bir yöntem arayışındadır. Yapılı çevrede kullanıcı tarafından değişikliklerin gerçekleştirilebilmesi yapıların fiziksel elverişliliğinin yanında, çevrenin hukukuyla doğrudan ilişkilidir. Hukuk, çevrelerin oluşumunda, gelişiminde ve değişiminde etkili olan en önemli faktörlerden biridir. Mimari çevrenin esnekliği ve değişebilirliği hukukun çizdiği sınırların esnekliği çerçevesinde mümkündür. Çalışma kapsamında, kullanıcının mimari çevreden beklediği değişim ihtiyaçlarından biri olarak mülklerin bölünebilmesi ve birleştirilebilmesi konusunda, geleneksel ve modern yapılı çevrelerin hukuku karşılaştırılmıştır. Geleneksel yapılı çevrenin hukuku olarak, Türkiye'nin geçmişinde etkili olan İslam hukuku, modern çevrenin hukuku olarak günümüz Türkiye'sinde geçerli olan Türk hukuku karşılaştırılmıştır. Çalışmanın hukuki kapsamı, miras hukuku ve önalım hakkı çerçevesinde daraltılmıştır. Miras hukuku mülkleri bölmeye neden olan hukuki bir işlem olarak, önalım hakkı mülkleri birleştiren bir hak olarak incelenmiştir. İslam hukuku ve Türk hukuku kuralları miras ve önalım hükümleri kapsamında karşılaştırılarak mimaride bölünebilirliği nasıl etkilediği tartışmaya açılmıştır."
