abstract: "Şahıs, modern hukuk sistemlerine göre haklara ve borçlara/vücûb ehliyetinesahip olan varlıkları ifade etmektedir. Şahsiyet ise bütün ehliyet çeşitlerini, şahsî halleri (kişisel durumları, kişisel hal sicilleri) ve kişilik haklarını (hukukî anlamda değer taşıyan maddî manevî varlıkları) ihtivâ eden bir kavramdır. İnsanlar, şahıs olarak kabul edilen ve bu anlamda hak sahibi/hukuk süjesi olma özelliği gösteren varlıkların başında gelmektedir. Ayrıcamodern hukuk sistemleri mana itibariyle önceden beri var olan bir takım mal ve insan topluluklarının da hukuk ve hak süjesi olma özelliği gösterdiğini kabul etmektedir. Bu bağlamda insanlar hakikî şahıs/gerçek kişi olarak, bahsi geçen topluluklar ise hükmî şahıs/tüzel kişi olarak isimlendirilmektedir. Pozitif hukuk sistemleri tarafından şahsiyet atfedilen ve hak süjesi konumunda olduğu kabul edilen topluluklara benzer yapılanmaların İslam Hukuku'nda da var olduğu gözlenmektedir. Bu çalışmada söz konusu topluluklardan sadecebeytü'l-mâl müesesesi inceleme konusu edilmiştir. Zira beytü'l-mâlin yapısı, içeriği ve işleyişi bakımından hükmî şahsiyetin zorunlu unsurlarını barındırması ve müstakil anlamda bir zimmete sahip olması, İslam Hukuku'nda da mana itibariyle hükmî şahsiyetin var olduğunu açık bir şekilde göstermektedir. Ayrıca bu çalışmada, modern hukuk sitemlerince çerçevesi çizilmiş olan hükmî şahsiyetin, İslam Hukuku'ndaki beytü'l-mâl kurumuna hangi noktalardan değdiği tespit edilmeye çalışılmıştır. Bu noktalar tespit edilirken şahsiyet kavramının içeriğinden hareketle beytü'l-mâlin, vücûb ve edâ ehilyetleri ve yine bu ehliyetlerin kapsamındaki salâhiyetlere olan iktidârı çeşitli yönlerden somutlaştırılmak suretiyle ele alınmıştır."
