abstract: "Bu çalışma İmam Züfer'in Hanefî mezhebinde müftâ-bih olan görüşlerini ve delillerini incelemektedir. Bu görüşler tespit edilirken, konuya munhasıran yazılan Hâmevî'nin“Ukûdu'd-dürer”, Pîrîzâde'nin“el-Kavlü'l-ezher”, Abdüllâtif el-Molla'nın“Vesiletü'z-zafer”adlı eserleri ile İbn Âbidîn'in“Reddü'l-Muhtâr”adlı eserinin nafaka bahsindeki bilgiler esas alınmıştır. Araştırma sonunda İmam Züfer'in mezhepte müftâ-bih olduğu öne sürülen toplamda 30 görüşünden 19'unun kendisine ait olup mezhepte müftâ-bih sayıldığı, 7'sinin kendisine ait olmakla beraber müftâ-bih sayılmasının tartışmalı olduğu ve 4'ünün kendisine nispetinin tartışmalı olduğu tespit edilmiş ve bunlar incelenmiştir. İmam Züfer'in bu meseleler hakkındaki görüşleri, hem mezhep içindeki diğer imamların görüşleriyle hem de diğer mezhep imamlarının görüşleri ile karşılaştırılmıştır. Bu mukayese esnasında mezhebi temsil niteliğine sahip ilk el bilgilere ulaşabilmek amacıyla, her mezhebe ait temel eserlere müracaat edilmiştir."
