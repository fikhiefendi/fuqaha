abstract: "ÖZET İnsan temel hak ve özgürlüklerinin en çok konuşulduğu bir dönemde yaşıyoruz. Düşünce ve Fikir Hürriyeti, ülkemizde hâlâ aktüalitesini koruyan bir kavram olmaya devam etmektedir. Konuyu insan haklan bağlamında ele aldığımızda, bu durum, bireyin tüm davranışlarının ve manevi kişiliğinin oluşmasında temel hareket gücünü oluşturmaktadır. Hürriyetlerin, doğal sınırlar içerisinde kullanılmasına müdahale edilemez. Çünkü kadın-erkek her fert, düşünce eylem ve ifade hürriyetine sahiptir. Her insan anasından hür olarak doğmuştur. Kendisine ve başkalarına zarar vermediği sürece kimse, bu doğal hakkını kullanmasına engel olamaz. Hür olmak hem hak hem vazifedir. Fertler, serbest bir şekilde düşünebildikleri ve düşündüklerini açıklayabildikleri gibi, diledikleri şekilde inanma ve inandıklarını yaşama hakkına da haiz olmalıdır. Dünyada onurlu ve haysiyetli bir yaşam sürmek için düşünce ve fikir hürriyetinin olabildiğince geniş tutulması bir ihtiyaç olduğu gibi, dinin hükümlerini anlayarak uygulaması noktasında bu hürriyet, büyük önem arz etmektedir. İslâm'ın temel kaynaklarında bilimsel incelemeyi, fikir ve düşünmeyi engelleyen hiçbir unsur yer almamaktadır. Aksine Kur'an, aklı kullanmayı tefekkürü ve teemmülü teşvik etmekte, taklitçiliği şiddetle eleştirmekte, Hz. Peygamber ise fikir ve düşünceyi, taklidi imandan tahkiki imana ulaşmak için bîr basamak kabul etmektedir. Çünkü dinde mükellefiyetin ilk şartı, düşüncenin de kendisinden neş'et ettiği akıldır. Zaten İslam'ın aklı muhatap alan, onu işlevselleştirerek taklitten uzaklaştıran, özgür fikirlere değer veren, düşüncenin önündeki engelleri kaldırmaya çalışan bir din olduğundan şüphe yoktur. Bununla birlikte İslâm hukuk tarihinde farklı yorum ve düşünceler bazen küfürle itham edilmiş, özellikle farklı mezhep mensupları kendi ekolünü tercih etmeyen kimselerin fikirlerini Kur'an ve Sünnet kritiğine tabi tutmadan reddetme yoluna gitmişlerdir. Temel hak ve hürriyetlerin en önemlilerinden olan Düşünce ve Fikir hürriyetinin olmadığı veya kısıtlama yoluna gidildiği toplumlarda taasub, baskı, üretimsizlik, aşın gelenekçilik, ön planda olmuş; böyle toplumlarda sosyal, fikri ve iktisâdi alanlarda bir gelişme kaydedilememiş, baskı ve haksız kurallar durağanlık, kokuşma ve çürümeyi de beraberinde getirmiştir. IV"
