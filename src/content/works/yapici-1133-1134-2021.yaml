abstract: "Osmanlı Devleti'nin ve Osmanlı toplumunun idari, iktisadi ve sosyo-kültürel hayatı hakkında ilk elden bilgi veren, temel kaynaklardan birisi de şer'iyye sicilleridir. Şer'i hükümler esas olmakla birlikte örfi uygulamaların da yer aldığı bu defterler kaza adı verilen merkezlerde görevlendirilen kadılar tarafından tutulmuşlardır. Merkezden emirlerin yanı sıra mahallinde cereyan eden her türden alım –satım, anlaşmazlık, evlenme- boşanma, miras, vasi nasbı, komşuluk ilişkileri vs. konularda son derece kıymetli bilgiler aksettirmektedir. Transkripsiyonunu yapmak ve değerlendirmek üzere seçtiğimiz defter, H.1133-1134 (M.1721-1722) tarihleri arasındaki kayıtları ihtiva etmektedir. Çalışmamızda ilk olarak Ankara şehrinin tarihi ve coğrafyası yanında şer'iyye sicilleri ve kadı hakkında genel bilgiler verilmiştir. Ardından 97 Numaralı Ankara Şer'iyye sicilinin transkripsiyonu yapılmış ve son olarak da defter içindeki belgelerden hareketle, belirtilen tarihlerde Ankara'nın görünümü hakkında değerlendirmelerde bulunulmuştur."
