abstract: "Muhtelif dönemlerde hadis ilmini yeniden ihya eden, bu ilme sistematik bir yapı kazandıran muhaddisler gelmiştir. İmam Nevevî, bu muhaddislerden bir tanesidir. Döneminde olduğu gibi günümüzde de etkisi her daim hissedilen İmam Nevevî'nin hayatı ve ilmî faaliyetleri farklı yönleriyle keşfedilmeyi bekleyen geniş bir alanı oluşturmaktadır. İmam Nevevî ve Minhâc İsimli Eserinin Hadis Şerhçiliği Açısından Değerlendirilmesi isimli tez çalışmamızda, İmam Nevevî'nin hayatı, eserleri ve Nevevî'nin ilgili eserindeki şerh metodu değerlendirilmiştir. Araştırmamızda Nevevî'nin şerhini oluştururken takip ettiği metodunun belirlenmesi ve müellifin kendine has olan dil ve üslûbunun şerhe olan yansımalarının tespit edilmesi hedeflenmiştir. Bu gaye doğrultusunda müellifin hayatı, eserleri ve yaşadığı dönem şartları genel hatları ile izah edilirken, bahsi geçen eserin muhtevası ve müellifin hadis tahlilindeki yöntemi detaylı olarak ortaya konulmaya çalışılmıştır. Bu kapsamda müellifin hadisle ilgili değerlendirmelerine, yer verilmiştir. Seçilen misallerle Nevevî'nin fıkhî melekesine ve hadis yorumuna kattığı değere işaret edilirken satır aralarında müellifin sünnet algısına, ve mezheb bağlamında sergilediği duruşa temas edilmiştir. Yaptığımız okumalar neticesinde, döneminde sadır olan fikrî cereyanlar arasında sünnî düşünce yapısına sıkı sıkıya sarılan, batınî yorum karşısında zahire bakan, delilsiz ve gereksiz tevil yerine lafza bağlı kalan, sünnetin sübut bulduğu yerde gayrisine itibar etmeyen,“nakil”in öncülüğünde“akıl”ın verilerine değer veren, kelime tahlilinde bilgin, rical ilminde yetkin, fıkıhta engin, kaynak kullanımında zengin, metodunda özgün Şafiî bir Şârih ile karşılaşılmıştır."
