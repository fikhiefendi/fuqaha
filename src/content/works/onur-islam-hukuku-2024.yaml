abstract: "İlk uygulamasının orta çağa dayandırıldığı ancak asıl gelişimini Amerika'da 19. yy.'dan sonra gösteren emtia vadeli işlem sözleşmesi, organize borsalarda gerçekleştirilen ve her iki bedelin de vadeli olduğu sözleşmedir. Bu sözleşme, zikredilen pek çok faydasına rağmen esas olarak emtianın fiyatının aleyhte değişebilecek olmasından kaynaklanan riskten korunma amacıyla ortaya çıkmıştır. Emtia vadeli işlem sözleşmesi, organize borsalarda gerçekleştirildiğinden karmaşık bir yapıya sahiptir. Bu çalışmanın temel amacı emtia vadeli işlem sözleşmesini İslam hukukuna göre analiz etmektir. Bunun için sözleşmenin konusu, tarafları, amacı ve teknik işleyişi İslam hukukuna göre analiz edilmiştir. Bu bağlamda esas olarak sözleşmenin asıl mahiyetini oluşturan“her iki bedelin de vadeli olduğu sözleşmelerin”İslam hukukuna uygunluğu araştırılmıştır. Daha sonra konu; mahiyet, ma'dumiyet, mülkiyette olmama ve kabz açılarından incelenmiştir. Bununla birlikte bu sözleşmenin tarafları ve taraflar arasına dâhil olan takas merkezi ile aracıların arasındaki hukukî ilişki İslam hukukuna göre değerlendirilmiştir. Ayrıca emtia vadeli işlem sözleşmesinin gerçekleştirilme amaçları ve sonlandırılma yöntemleri İslam hukukuna göre tahlîl edilmiştir. Netice olarak organize piyasalarda gerçekleştirilen emtia vadeli işlem sözleşmesinin İslam hukukuna göre caiz olmadığı sonucuna ulaşılmıştır. Bundan dolayı tezimizin sonunda alternatif yöntemlere yer verilmiştir."
