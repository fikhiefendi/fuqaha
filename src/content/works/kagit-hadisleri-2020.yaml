abstract: "Fıkhî ictihadlardaki farklılıkların pek çok gerekçeleri vardır. Bu farklılıkların önemli bir bölümünü, Kur'ân'dan sonra en temel ikinci kaynak kabul edilen hadis merkezli ihtilaflar oluşturmaktadır. Sened ve metin çerçevesinde oluşan bu ihtilafların neticede fıkhî ictihadlara yansıyacağı da muhakkaktır. Zira Kur'ân öğretilerinin uygulanış biçimlerini gösterme ve onu tefsir etme vazifesini icrâ etmiş olan Hz. Peygamber ve onun hadisleri, müslümana pratik hayat sunan fıkhın en yoğun müraacat ettiği kaynak olarak önümüzde durmaktadır. Tezde Hanefî mezhebinin kurucusu Ebû Hanîfe ile iki öğrencisi Ebû Yûsuf ve Muhammed b. el-Hasen eş-Şeybânî arasındaki fıkhî ictihad farklılığının sebeplerinden, hadis kaynaklı olanlarını inceleyeceğiz. Bu konuda yalnızca birtakım nazarî/teorik bilgileri sunmakla yetinmeyecek, aynı zamanda bu nazarîyatı ilk dönem kaynakları çerçevesinde örnekler ve somut verilerle desteklemeye çalışacağız. Hadislerdeki ihtilaf gerekçeleri konusunda her üç imamdan gelen bilgiler sınırlı olmakla birlikte elden geldiğince ilk dönem kaynaklarında bulunanları tespit etmeye gayret ettik. Veriler sınırlı olduğu için ihtiyaç oldukça sonraki dönem Hanefî kaynaklarından konuyla alakalı bilgiler nakledilmiştir."
