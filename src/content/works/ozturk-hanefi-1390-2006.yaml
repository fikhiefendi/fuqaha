abstract: "İbn Ebi'l-İzz, 731/1331 yılında Dımaşk'ta doğmuştur. Adı Ali, lakabı iseSadruddîn'dir. İbnü'l-İzz diye meşhurdur. İbn Ebi'l-İzz, Hanefî mezhebini ve diğermezhepleri gayet iyi bilen, selefin görüşlerini benimseyen ve mezhep taassubuna karşı olanbir alimdir. Kadılık, tedris, fetva ve hatiplik gibi farklı vazifelerde bulunmuştur. On yediyaşında iken ders vermeye başlayan İbn Ebi'l-İzz, Dımaşk'ta ve Kahire'de Hanefi mezhebikadılığını üstlenmiştir. Ayrıca selefin görüşlerini benimseyen ve mezhep taassubuna karşıçıkan kıymetli eserler de vermiştir. 784/1382 yılında İbn Aybek adında bir şairin Peygamber(s.a.v.)'i medh amacıyla yazdığı bir kasidede gördüğü müşkil meselelere yaptığı itirazlarsebebiyle yargılanmış ve neticede dört ay hapse mahkûm edilmiştir. 791/1389 senesinde eskivazifelerine geri dönen İbn Ebi'l-İzz, bir sene sonra (792/1390) Zilkade/Ekim ayındaDımaşk'ta vefat etmiştir.İbn Ebi'l-İzz'in kaleme almış olduğu Esrâru'l-Hitâb, bir mukaddime ve yirmi yedibaşlıktan oluşmaktadır. Temelde, abdest ayetini konu edinen bir ayet tefsiri niteliğindedir.Ancak müellif, eserinde bu ayetin tamamını değil, sadece abdestle ilgili olan ilk bölümünü elealmıştır ve daha çok, ayette geçen ibare ve terkiplerin incelikleri üzerinde durmuştur. Neticeolarak, bir ayetin içerdiği sır ve incelikleri değişik yönleriyle ele alan Esrâru'l-Hitâb adlı buorijinal eserin İbn Ebi'l-İzz'e ait olduğu ortaya çıkmış ve bu büyük âlimin bir eseri daha ilimdünyasına kazandırılmıştır."
