abstract: "IV/X. asrın meşhur alimleri arasında bulunan İbn Hibbân ve İbn Adî, zayıf râviler hakkında eser kaleme almış iki önemli münekkittir. Onların bu konudaki kitapları; içerdikleri râvi sayısı, mütekaddim münekkitlere ait değerlendirmeleri ihtiva etmesi ve râviler hakkında hüküm verirken takip ettikleri metotlar açısından ön plana çıkmaktadır. IV/X. asır ricâl tenkidini, İbn Hibbân ve İbn Adî'nin zayıf râviler hakkındaki kitapları üzerinden ortaya koymayı amaçlayan bu çalışma, şu sonuçlara ulaşmıştır: İbn Hibbân ve İbn Adî, ricâl tenkidi yaparken, kendilerinden önceki münekkitlere ait değerlendirmelerden istifade etmiş, karşılaştığı râviler hakkında kişisel kanaatlerini esas almış ve eserlerinde yer verdikleri râvilere ait rivâyetleri inceleyerek onlar hakkında hükme varmışlardır. Bunlar arasında özellikle tenkid edilen râvilere ait hadis rivâyetlerinin araştırılması ön plana çıkmaktadır. Bu asırda gerçekleştirilen ricâl tenkidi; cerh-taʻdîl ilminin tutarlılığı ve kendisinden önceki dönemle uyumlu olduğunu gösteren benzer sonuçlar ortaya koymaktadır. Bununla birlikte İbn Hibbân ya da İbn Adî'nin ricâl tenkidinde kendi aralarında ve kendilerinden önceki münekkitler karşısında belli ölçüde farklı kanaatlere sahip oldukları da görülmektedir. Bu farklılığın aynı zamanda cerh-taʻdîl ilmindeki ictihad mekanizmasının canlılığına işaret olarak değerlendirilmesi de mümkündür. Öte yandan IV/X. asırdaki tenkit faaliyetleri, sıklıkla bir gerekçe üzerine bina edilmiştir. Bu açıdan bakıldığında, IV/X. asır önceki dönemde sarf edilen gayr-ı müfesser veya izaha muhtaç değerlendirmeleri de açıklığa kavuşturmaktadır. Ayrıca bu dönemde kullanılan değerlendirme lafızları, iki farklı eğilime sahiptir. Buna göre İbn Hibbân, net ve kısa değerlendirme lafızlarına sıklıkla yer verirken, İbn Adî, analitik bir üslup barındıran tenkit ifadeleri kullanmıştır. Bu sebeple, özellikle İbn Adî'nin herhangi bir râvi hakkında verdiği hükmün anlaşılmasında, lafzın kullanıldığı bağlam daha önemli hale gelmektedir."
