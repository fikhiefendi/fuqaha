abstract: "Hapis, Batılı ve Batılı olmayan muasır hukuk sistemlerince genel bir cezalandırma şekli olarak kabul görmektedir. İslam hukukunda da hapis bir müessese olarak bulunmakla beraber İslam fikıh litaretüründe hapisle ilgili fazlaca bilgi yoktur. Hapisle ilgili olarak 'sicn' ve 'haps' kavranılan kullanılmaktadır. Çok fazla ıstılahı ayrımlara rastlanmamaktadır. Zira İslâm hukukunda had ve tazir suçlarında ana ceza olarak bedenî cezalar ön görülmüştür. Bununla beraber, fıkıh kitaplarında yargıcın görevlerinden bahsedilirken mahpusun haklarına da açıkça değinilmiştir. Mahpusa işkence yapılamayacağı, öldürülemeyeceği ve dövülemeyeceği açıklanmıştır. Bu ve buna benzer esaslara İslâm hukuku kaynaklan tanıklık etmektedir. İslâm hukukçularının belirttiği gibi, mahpus dövülmez, zincire vurulmaz, sokaklarda teşhir edilmez ve çalışmaya zorlanmaz. İslam hukukçuları hapis cezasını bir pişmanlık ve rehabilite aracı olarak görmüşlerdir. Bunu böyle tespit ettikten sonra onların mahpus haklarına neden bu kadar yalan alaka gösterdiklerini anlamak ve hapishane şartlarının göreceli bir tarzda daha iyi olduğunu söylemek kolaylaşmaktadır. rv"
