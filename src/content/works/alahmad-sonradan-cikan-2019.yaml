abstract: "Müslüman gruplar arasındaki muasır olayların çoğunu tedavi edecek kaynak olması için iç savaş olaylarında başlarına gelen musibetle ilgili sahabe fikrinin ortaya çıkarılması İç savaş olaylarında başlarına gelen musibetlerle ilgili sahabe fıkhı ve içtihatlarından mümkün olduğunca fıkhî teori oluşturmasını özetlememiz mümkün mü? Başlarına gelen afetler her şekli kapsıyor mu? Onların içtihat ve çabaları çelişkili durumları ile birlikte tüm şekilleri içeriyor mu? Bu içtihatlar muasır olayların tedavi edilmesinde (ele alınmasında) yarıyor mu? Müslüman gruplar arasındaki iç savaşlarda içine düştükleri en tehlikeli sorunları ilk asra bağlı köklü, fıkıh için İslam ümmetinin ihtiyaçları içinde konunun ehemmiyetini simgeler. 1- Sahabe döneminde iç savaş olaylarını açıklamak, uyum sağlamak ve birini diğerinden ayırmak. 2- Sahabenin içtihatlarında olanları açıklamak ve bu içtihatları da mezhep ulemalarının bu konudaki keşif ve usule dönüştürmesi. 3- Fıkhi mezhep ve ulema görüşleri ışığında sahabenin ihtilaf ettikleri arasında tercihlerin belirlenmesi. Bu konuda birçok metot izleyecek bunlardan içtihatları, fetvaları İyice incelemek maksadıyla tümevarım metodu, metotlar arasında analitik tümdengelim ve istidlal metodu ve kıyası tüm çeşitleri elle tutulur mantıksal sonuçlara ulaşmak maksadı ile kullanmıştır. 1- Müslümanlar arasındaki iç savaşların hükümleri Müslümanların kafirlerle savaş hükümlerinden çok farklı hükümleri vardır. Müslümanların bunlarla imtihanında yerine getirmesi ve bilmesi gerekenler vardır. 2- isyancılarla savaş fitne ile savaştan farklıdır. İsyancılarla fitne arasında savaş, haricileri öldürmekten farklıdır. Bu durumlardaki hüküm; asli ve feri tafsili hükümlere bağlıdır. Aralarındaki karışım Muasır musibetler karşısında şiddetli çatışmalara sebep olmasıdır. 3-Sahabe fetvaları ve içtihatları Müslümanların başlarına gelen musibetlerle alakalı benzer olaylarda hüküm vermeye faydalı olan zengin bir kaynak sayılır."
