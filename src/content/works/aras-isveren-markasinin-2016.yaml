abstract: "Bu tezin amacı katılım bankalarında işveren markasının örgütsel bağlılık ve işten ayrılma niyeti üzerindeki etkisini tespit etmektir. İşveren markası, bir şirketin kendisini işveren olarak farklı ve çekici kılan özelliklerine ilişkin örgüt içinde ve dışında yürüttüğü çabalardır. Rekabetin artması ve yetenekli kişilerin azlığı nedeniyle bu yetenekli kişileri bulmak ve örgüte bağlı olmasını sağlayarak elde tutmak örgütlerin birinci önceliği olmuştur. Dünyanın neresinde olursa olsun en iyi yetenekleri bulmak ve elde tutmak için örgütlerin güçlü ve olumlu işveren markasına sahip olması gerekmektedir. Güçlü işveren markası ile yetenekli çalışanlar örgüte çekilebilir, mevcut çalışanların ise örgütte kalması sağlanabilir. Örgütlerdeki yetenekli insan kaynağının örgütsel bağlılık düzeyinin yüksek, işten ayrılma niyetlerinin düşük olması ile sürdürülebilir rekabet avantajı sağlanabilir. Literatür incelendiğinde konu ile ilgili yeterince araştırma yapılmadığı görülmüştür. Yapılan sınırlı sayıda araştırmanın ise Batı ülkelerinde, özellikle yüksek bireyci kültüre sahip olan Amerika ve Belçika'da yapıldığı ve bulguların benzerlik gösterdiği tespit edilmiştir. İşveren markası boyutları olan fonksiyonel ve duygusal faydaların toplulukçu kültüre sahip ülkelerde uygulandığında sonuçlarının ne olacağı henüz tam bilinmemektedir. Türkiye'de konu ile ilgili yapılan sınırlı sayıda araştırmanın ise öğrenci örneklemi üzerinde yapıldığı, mevcut çalışanların ihmal edildiği görülmüştür. Ayrıca şimdiye kadar yapılan gerek ulusal gerek uluslararası çalışmalarda ordu ve turizm işletmeleri üzerinde araştırma yapılmasına rağmen katılım bankalarında çalışanlar ile yapılmış araştırmaya rastlanmamıştır. Tezin yöntemi nicel ve nitel araştırma tasarımı üzerine kuruludur. Araştırmanın örneklemini katılım bankasında çalışan 578 kişi oluşturmaktadır. Araştırmada katılımcılardan anket yoluyla toplanan veriler AMOS ve SPSS kullanılarak analiz edilmiştir. Ayrıca sektördeki farklı katılım bankalarında çalışan 28 kişi ile mülakat yapılmıştır. Yapılan analiz sonucunda işveren markasının örgütsel bağlılık üzerinde pozitif, işten ayrılma niyeti üzerinde ise negatif etkili olduğu tespit edilmiştir."
