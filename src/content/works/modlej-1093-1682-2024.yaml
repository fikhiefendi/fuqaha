abstract: "Bu araştırma, Mustafa el-Askadari'nin“el-Muntaqā fî Şerhi'l-Multaqā”adlı el yazmasını tahkik etmeyi amaçlamaktadır. Bu eser, Hanefi fıkhının önemli kaynaklarından biri olan“el-Multaqā”metnine yapılan önemli şerhlerden biridir. Konu, Hanefi fıkhını anlamadaki ve fıkıh çalışmalarını geliştirmedeki önemi ile birlikte, tahkik edilmesi gereken birçok mesele içermesi ve ciddi bir doğruluk gerektirmesi nedeniyle seçilmiştir. Bu el yazmasının tahkikindeki zorluklardan biri, mevcut nüshalar arasındaki farklılıklar olup, doğru metinlerin belirlenmesini gerektirmektedir. Ayrıca müellifin yöntemi, açıklama biçimini ve sunduğu fıkhî kavramları anlamak için derinlemesine bir inceleme yapılmasını zorunlu kılmaktadır. Bu çalışmada, şârihin eserdeki yöntemi ve fıkıh metinlerini şerh etme üslubu analiz edilmiştir. Ayrıca metnin müellifi olan İbrahim el-Halebî'nin ve şârih Mustafa el-Askadari'nin hayatları kapsamlı bir şekilde incelenmiş, eserin müellifliğine dair deliller sunulmuştur. Araştırma, kitabın tanıtımıyla başlayıp içeriğinin analizi ve tahkik edilmesi gereken metne ulaşmak üzere çeşitli bölümlere ayrılmıştır. el-Uskudarî, şerhinde detaylı açıklamalar ile fıkhî tercihleri dengeleyen özgün bir yöntem sergilemiş ve fıkhî meseleleri açıklamak için uygulamalı örnekler sunmuştur. Ayrıca âlimlerin görüşlerini belgelemeye özen göstermiştir. Bu şerhi öne çıkaran özelliklerden biri, Hanefi mezhebine ait görüşleri ve tercihlerini“Diyorum ki,”“Dedik ki,”“Bizim görüşümüz,”ya da“Bizce”ifadeleriyle açıkça belirtmesidir. Bu görüşlerini Kur'an-ı Kerim veya hadis-i şeriflerden delillerle desteklemiş ve bazı meselelerde kendi tercihlerini ortaya koymuştur."
