abstract: "Satım Akdinde Ma'kudun Aleyhin Mütekavvim Olması Tez konumuz olan mütekavvim mal'ı üç bölüm halinde ele aldık. Çalışmamızda ma'kudun aleyhim mütekavvim olmasını ortaya koymayı amaçladık. Akdin konusunu oluşturan makudun aleyh satım akdinin rükunlarından birisidir. Bu rükun olmadan akit teşekkül etmez ve batıl olur. Ma'kudun aleyhin de bazı şartları vardır. Bu şartlar gerçekleşince akit sahih olur ve hukuki neticeleri ortaya çıkar. Bu şartlardan birisi de makudun aleyhin mütekavvim (değerli) olmasıdır. Tezimizin temelini teşkil eden mütekavvim, gayri mütekavvim kavramlarının tarifleri verilmiş mezheplerin bu kavramlar için yaptıkları farklı tanımlamalar ortaya konulmuştur. Bir malın mütekavvim Kabul edilmesi için gerekli şartlar belirtilmiş ve örneklerle açıklanmıştır. Mütekavvim malın tarifinde bulunması gereken özel şartlarla ilgili alimlerin farklı tespitleri olup iki kısma ayrılmaktadır. Hanefilerin Kabul ettiği şartlar ayn olması ve gelecekte elde edilebilir olmasıdır. Cumhur ulemanın Kabul ettiği şartlar, memluk olma (mülkiyet altına alınabilir olma), mevcut (var) olma, şer'an (hukuken) kendisinden istifade edilebilir olmadır. Bu şartlar açıklanmış ve örnekler üzerinden gerekçeleri belirtilmiştir. Mütekavvim kavramının oluşmasında siyasi, sosyal, iktisadi, dini yönler bulunmaktadır. Bunlar detaylıca ele alınmamış sadece değinilmiştir. Tezimizin son bölümünde akit yapılırken müteavvim özelliğine dikkat edilmemesinin hukuki neticesi üzerinde durulmuştur. Buna göre Mütekavvim bir mal ile yapılan akdin sahih akit olur. Bu şartı taşımayan mal üzerine yapılan akdin ise fasit veya batıl olur ki bu durumda akit hukuk tarafından geçerli olmaz ve hukukî koruma altına girmez"
