abstract: "Fıkıh usûlü konuları içerisindeki elfâz bahisleri etrafında gerçekleşen tartışmalar, fıkhın tedvin döneminden itibaren fakihlerin problem sahalarından biri olmuştur. Fıkıh usûlü ilminin oluşumuna belirli ölçüde öncülük eden bu tartışmalar, fıkıh usûlü ilmi içerisinde en önde gelen meselelerdendir. Fıkıh usûlünün ortaya çıktığı dönemde, âmm lafzın tahsisi, delâleti ve buna bağlı olarak gündeme gelen birçok mesele üzerinden gerçekleşen tartışmalar, usûlcüler arasında farklı görüşlerin ortaya çıkmasına neden olmuştur. Hanefî usûl geleneği incelendiğinde Hanefî mezhebinin görüşleri Cessâs'la (ö. 370/981) beraber Irak'ta ortaya çıkmış daha sonra Debusî (ö. 430/1039), Serahsî (ö. 483/1090) ve Pezdevî (ö. 482/1089) üzerinden, Maveraünnehir bölgesine intikal etmiştir. Bu çizgi neticesinde ortaya koyulan görüşler gelenek içerisinde Hanefî mezhebinin mutlak görüşü olarak kabul edilmiş ve aktarılmıştır. Bu görüşlere hâkim Hanefî usûl görüşleri adını vermek yerinde olacaktır. Ebu Mansur el-Mâtûrîdî (ö. 333/944) ise Hanefî mezhebine müntesip olmasının yanında Hanefî mezhebinin ana damarını oluşturan Irak bölgesinin dışında, Semerkand bölgesinde yaşamıştır. Onun öğretileri doğrultusunda, hâkim Hanefî usûl görüşlerine muhalif görüşler ortaya koyan Semerkand Hanefî ekolü vücuda gelmiştir. Bu ekolün en önemli temsilcisi ise Alâeddin es-Semerkandî (ö. 539/1144)' dir. Âmm lafzın tahsisi ve tahsis için gerekli olan şartlar ile ilgili olan, âmm lafzın delâleti, istisnası, neshi gibi meselelerde, Semerkandî'nin görüşleri, takipçisi olduğu Mâtûrîdî gibi hâkim Hanefî usûl görüşlerinden ayrılmıştır. Bu görüşlerin birçoğunda Hanefî mezhebinin karşısında duran Şâfiî mezhebine benzerliği dikkat çekse de kritik noktalarda iki görüş arasında orta bir yol tutma gayreti, hâkim Hanefî ve Şafiî görüşleri arasında eklektik bir duruşu yansıttığı için ayrıca değerlendirilmelidir. Semerkand ekolü fıkıh usûlü ile ilgili meselelerde kelamî hassasiyetlere oldukça önem vererek hareket etmiştir. Bu hassasiyetler ise Semerkandî'nin ele alacağımız meselelerdeki kabulleri üzerinde etkili olmuştur.“Alâeddin es-Semerkandî'nin Tahsis Anlayışı”başlığı altında ele alacağımız çalışmada, Semerkandî'nin âmm lafzın delâleti ile ilgili görüşleri, âmm lafzın tahsisi ve tahsisini şartlarıyla beraber nesih ve bunlara bağlı kelamî meseleler ele alınacaktır. Bu çalışmada, Semerkandî'nin hâkim Hanefî usûl anlayışına karşı çıktığı noktalar, bu karşı çıkışın gerekçeleri ve fıkıh usûlü üzerindeki etkileri analiz edilecektir."
