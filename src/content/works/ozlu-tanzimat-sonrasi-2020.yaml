abstract: "Antik Çağ'da, Platon ve Aristoteles erdem ve toplum temelli hukuk anlayışı vardır. Stoa Okulu ise doğaya uyumu vurgulamıştır. Evrensellik Stoacıların temel görüşüdür. Adalet ve erdem temelli anlayış Orta Çağ'ın hukuk anlayışını şekillendirmiştir. Semavi dinlerle hukuk anlayışı teolojik bir karaktere bürünmesine neden olmuştur. Türk-İslam filozoflarıyla erdem temelli hukuk anlayışı ortaya konulmuştur. Modern dönem Orta Çağ'dan kopukluğu temsil etmektedir. Bu dönemde yeni kavramlar ve anlayışlarla karşılaşırız. Modern hukuk bireyi temele alan ve aklı savunan hukuk anlayışıdır. Bu hukuku dönemin getirdiği ekonomik, sosyal, siyasi vb. şartlar oluşturmuştur. Bu şartlar sonucunda tarihsel öneme sahip kitlesel olaylar meydana gelmiştir. 1789 Fransız Devrimi bu olaylar içinde en önemlisidir. Yerel bir olay olmasına karşın küresel çapta etkisi olmuştur. Fransız Devrimi'nin özünü eşitlik, özgürlük ve milliyetçilik oluşturmaktadır. Bu da imparatorlukların parçalanmasına neden olmuştur. Osmanlı İmparatorluğu Avrupa'da yayılan bu fikirlerden en çok etkilenendir. Osmanlı İmparatorluğu Avrupa'ya yetişmek ve toplumdaki bozuklukları düzeltmek için reformlar yapmıştır. Bu reformlar fikirden öteye gitmemiştir. Reformlar halk tarafından benimsenmemiştir. Bundan dolayı da modern hukuk kurallarına uygun hukuk çalışmaları yapmak zorunda kalmıştır. Bu kanunlaştırma hareketleri, 1808 Sened-i İttifak, 1839 Gülhane Hatt-ı Hümayunu (Tanzimat Fermanı), 1856 Islahat Fermanı, 1876 Kanun-i Esasi ve Meşrutiyet (1876-1909) çizgisinde genel bir modernleşme bağlamını tarihsel olarak ifade eder. Osmanlı İmparatorluğu'nda kanunlaştırma hareketleri felsefi bir istekle olmamıştır. Gayrimüslim tebaa İslam Hukuku ile yönetilmeyi kabul etmemiştir. Osmanlı İmparatorluğu geleneksel hukuk anlayışını modern anlamda kanunlaştırma yoluna gitmiştir İktisadi alanda Avrupa kanunlarını tercüme edip kullanılmıştır. Medeni hukuk alanında da bu yapılmak istenmiştir. Bu durum muhafazakârlar ile yenilikçileri karşı karşı karşıya getirmiştir. Muhafazakârlar Fransız Medeni Kanunu'nu tercüme edilmesinin Osmanlı İmparatorluğu'nu pazar haline getireceğine savunmuşlardır. Buna karşı çıkarak kendi özünden bir kanun yapılması gerektiğini savunmuşlardır. Komisyon incelemeler sonucu İslam Hukuku'ndan oluşan modern tarzda bir medeni kanun yapılması kararı çıkmıştır. Mecelle-i Ahkam-ı Adliyye Osmanlı İmparatorluğu'nun ilk medeni kanunudur. Ahmet Cevdet Paşa ve dönemin ileri gelen hukukçuları tarafından İslam Hukuku'nu temele alan modern tarzda oluşturulmuştur. İçerik bakımından yerli ve milli bir kanundur. İslam hukuku temel alması ve Türk örf ve geleneğine uygun olması önemlidir. Mecelle kanunlaştırma çalışmalarında öze bağlı kalınarak kanun oluşturmanın öncüsü olmuştur. Dönem içinde birçok kanun bu yolla modern bir görünüm kazanmıştır. Osmanlı İmparatorluğu'nun medeni hukuk ihtiyacını karşılamıştır. Türk hukuk tarihine ve İslam Hukuku'na yıllarca hizmet etmiştir. Yürürlükte olduğu dönemler göz önüne alındığında birçok İslam devletinin hukuki alt yapısını oluşturmuştur. Uluslararası bir niteliğe sahiptir. Bu yönüyle dünyada Fransız medeni kanunundan sonra ikinci medeni kanundur. Hukuki boyutunun yanında Türk düşüncesi için de tarihsel öneme sahip bir metindir. Modern dönemdeki Türk paradigma değişimini göstermektedir. Aynı zamanda Türk düşüncesindeki doğu batı tartışmasının hukuktaki yansımasıdır. Bu yansımanın somut halidir."
