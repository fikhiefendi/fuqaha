abstract: "Nâtık-Bilhak, Zeydî mezhebinin en önemli simalarından biri olmasıyla birlikte usûl-i fıkıh başta olmak üzere çeşitli ilim dallarında da adından söz ettiren şahsiyetlerden biridir. Bu çalışmada onun Zeydî usûl literatüründe önemli yere sahip olan el-Müczî fî usûli'l-fıkh adlı eserinin icmâ bölümü incelenmeye çalışılmıştır. Bu çerçevede Nâtık-Bilhak'ın İslam hukukunun deliller hiyerarşisinde cumhurun kabulüne göre üçüncü sırada yer alan icmânın delil teşkil edişinin temellendirme şekli, icmânın şartları, türleri, icmâya katılabilecek kişilerin ehliyeti gibi konular hakkındaki görüşlerinin ortaya konulması hedeflenmiştir."
