abstract: "Türk siyasî tarihi içerisinde oldukça önemli ve büyük bir paya sahip olan Osmanlı Devleti tarihinin doğru analizi, birinci elden kaynakların rehberliğinde yapılabilmektedir. Bu bağlamda birinci elden kaynak konumundaki arşiv belgelerinin doğru okunması ve değerlendirilmesi oldukça önemli bir yere sahiptir. Bu arşiv kaynakları içerisinde bulunan ve şer'i mahkemelerde görülen dava kayıtları ile merkezden gönderilen belgeleri içeren şer'iyye sicilleri, Osmanlı Devleti tarihinin aydınlatılmasını sağlayacak dokümanlar içerir. Yazıldığı döneme ait siyasî, idarî, hukuki, askerî, iktisadi, mimari, demografik, sosyo-kültürel ve daha pek çok bakımdan önemli bilgiler içermektedir. Bu çalışmada 36 numaralı Ankara şer'iyye sicilinin transkripsiyonu ve değerlendirmesi yapılmış ve defterde yer alan belgeler ışığında H. 1053-1059 (M. 1643-1649) tarihleri arasındaki Ankara şehrinin idarî, sosyal, kültürel ve ekonomik durumu hakkında bilgiler elde edilmiştir."
