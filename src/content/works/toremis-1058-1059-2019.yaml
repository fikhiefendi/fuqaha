abstract: "Yerel tarih araştırmaları için önemli bir kaynak olan şer'iye sicilleri; kaydı tutulduğu bölgenin sosyo-ekonomik ve iktisadi alanlarında önemli bilgiler vermektedir. Bu bilgiler göz önünde bulundurularak yapılan bu çalışmada H. 1058-1059 ve M. 1648-1649 yıllarına ait olan 7 numaralı Amasya şer'iye sicilinin transkripsiyonu yapılmıştır. Elde edilen bilgiler çerçevesinde Amasya tarihine küçük bir katkı sağlanarak Amasya tarihine ışık tutulmaya çalışılmıştır. Osmanlı Devleti'nde idare ve mahkemenin baş unsuru olan Kâdı; padişahın temsilcisi olduğundan dolayı kazalarda tüm yetki kendisine verilmiştir. Şer'i mahkemelerde çözüme kavuşturduğu davalarda, kâdıya kale dizdarları, subaşılar ve naipler yardımcı olmuşlardır. Osmanlı Devleti'nin sonlarına doğru her kurumda olduğu gibi kâdılık kurumu da bozulmaya başlamış, görev yerine gitmeyen kadılar kendi yerine yardımcı olan naipleri göndermişlerdir. Sicilde bulunan ferman örneklerinden Osmanlı Devleti'nin bulunduğu durumun Amasya'ya ne tür bir yansıması olduğu da görülmektedir. Girit seferi sırasında Kâdıya gönderilen fermanlardan Amasya'da sefere katılacak tımarlı sipahilerin olduğu anlaşılmaktadır. Sefere katılmayan tımarlı sipahilerin tımarları ellerinden alındığı görülmektedir."
