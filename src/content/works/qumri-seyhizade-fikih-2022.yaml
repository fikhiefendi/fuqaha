abstract: "Şeyhîzâde Damad Efendi'nin Mecmaʿu'l-Enhur fî Şerhi Mülteka'l-Ebhur isimli eseri fıhkî niteliğe sahip bir eserdir. Fıkıh eseri olmasına rağmen içerisinde fıkıh usûlü ile alakalı birçok mesele barındırmaktadır. Şeyhîzâde Damad Efendi, fürû meseleleri delillendirmek için usûle başvurmuştur. Onun takip ettiği usûl diğer Hanefilerin izlediği usulle karşılaştırılınca onlarla da paralellik gösterdiği gözlenmiştir. Müellif fûrû meseleleri ele aldığı eserinde usûl kaidelerine yer vermiştir. Çalışmada ilgili kaidelere örnekler verilmiş, müellifin değindiği ancak tarif etmediği usûl kavramları tarif edilmiştir. Şeyhîzâde Damad Efendi'nin başlı başlına bir fıkıh usûlü eseri bulunmamaktadır. Ancak o, fıkıh eserinde iki müstakil telifi birleştirmiştir. Çalışma Şeyhîzâde Damad Efendi'ye ait bir fıkıh usûlü eseri mesabesindedir."
