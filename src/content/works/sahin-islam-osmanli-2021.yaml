abstract: "İslam-Osmanlı hukukunda çocuğun hukukî durumuna ilişkin konular ayrıntılı bir şekilde düzenlenmiş olmasına rağmen dağınık bir haldedir. Söz konusu dağınık hükümlerin hukukî bir sistematik altında ifade edilmesi ile çocuk kavramı, çocuk hukukunun genel esasları ve çocuk hukukunun özel hükümleri şeklinde bir şema ortaya çıkmaktadır. Genel esaslar ehliyet ve velâyet hükümlerinden oluşmaktadır. Özel hükümler ise çocuğun nesebi, evlat edinilmesi, nafakası, emzirilmesi, hidânesi (bakım ve himaye), evliliği, evliliğinin sona ermesi ve miras ilişkileri ile ceza hukuku karşısındaki durumu konularını içermektedir. İslam-Osmanlı hukukunda çocuğun korunması ilkesinin gerçekleştirilmesi için kural olarak çocuğun ehliyeti kısıtlanmış ve sorumluluk alanı sınırlandırılmıştır. Ancak söz konusu kuralın istisnaları bulunmaktadır. İslam hukukunda haksız fiil sorumluluğu bir çeşit sebep sorumluluğu olarak düzenlendiği için, çocuklar başkalarının mallarına verdikleri zararlardan kendi malvarlıkları ile sorumlulardır. Bunun yanında cezai ehliyetleri olmamasına rağmen diyet sorumluluğunun altındadırlar. Söz konusu istisnalarda çocuğun korunması ilkesi ile üçüncü kişilerin haklarının korunması ilkesinin yarışır bir hâlde olduğu görülür. Çocuğun kural olarak kısıtlanmış ve sorumsuz olması nedeniyle hukuk hayatının içinde olmayı sürdürebilmesi için bir yetişkin tarafından temsil edilmesi gerekir. Bu amaca hizmet eden çocuğun hukukî temsili velâyet hükümleri ile karşılanmaktadır. Çocuk neseb bağıyla bir aileye bağlanma hakkına sahiptir. Çünkü çocukluk dönemini de kapsayacak şekilde hayatı boyunca bahsi geçen aileyle hukukî ilişki içindedir. Çocuğun nafakası belirli derecedeki yakınları tarafından karşılanır. Çocuğun bir yakını bulunmaması halinde devletin nafaka sorumluluğu başlar. Çocuğun emzirilmesi, anne sütünün önemi gereği hukukî koruma altına alınmıştır. Ancak bu koruma, annenin emzirmeye zorlanması şeklinde değil muhakkak emzirecek bir kişi bulmak noktasındadır. Belirli bir döneme kadar çocuğun bakım ve terbiyesinden annesi veya onun yokluğunda anne tarafından yakınları sorumludur. Evlilik birliğinin devam ediyor veya sonlanmış olması söz konusu kuralda bir değişiklik yaratmaz. Hukukçuların büyük çoğunluğu çocukların velileri tarafından evlendirilebileceği kabul etmiştir. Mahkeme kayıtlarından Osmanlı döneminde de çocuk evliliklerinin geçerli olduğu tespit edilmektedir. Ancak çocuk evliliğine ilişkin kuralların sınırları hukukî olarak çizilmiş olup veli tam bir özgürlük alanında hareket edemez. Çocuk evlilikleri geçerli olmakla birlikte evliliğin sona ermesi bakımından aynı şeyi söylemek güçtür. Çocuklar evliliklerini sonlandıramadıkları gibi bu evlilikleri sonlandırmak bakımından veliler de yetki sahibi değildir. Çocuklar mirasçı veya miras bırakan konumunda olabilirler. Ancak çocukların miras ilişkilerinin yürütülmesi özel kurallar etrafından gerçekleştirilir. Çocuğun ceza sorumluluğu bulunmamaktadır. Çocuklar fiillerinin anlam ve sonuçlarının bilincinde olmadığı için kural olarak ceza hukuku bakımından sorumsuz kabul edilmişlerdir. Ancak mağdurun haklarının korunması için diyet suçları bakımından çocuk sorumluluk altındadır. Çocuğun cezalandırma gerektiren fiilleri kural olarak hata şeklinde değerlendirildiği için tazmin sorumluluğu çocuk ile akilesi arasında paylaştırırlır. Bunun yanında mümeyyiz çocukların ta'zîr sorumluluğu vardır. Mümeyyiz çocuklara eğitilmeleri amacıyla onlara özgü güvenlik tedbirlerini uygulanabilir. Söz konusu tedbirler uygulanırken çocuklarla yetişkinlerin aynı ortamı paylaşmamalarına dikkat edilir."
