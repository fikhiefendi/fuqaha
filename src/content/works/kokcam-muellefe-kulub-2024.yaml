abstract: "Fetihlerin artıp İslam topraklarının genişlemesiyle beraber fıkhî meselelere ait yeni problemler ortaya çıkmıştır. Hz. Peygamber'den sonraki dönemlerde bu problemlerin çözüme kavuşturulmasında sahâbenin uygulamalarının önemli bir yeri vardır. Özellikle Hz. Ömer, uygulamaları sayesinde problemlerin çözülmesine katkı sağlamış ayrıca İslâm hukukunun şekillenmesine de yardımcı olmuştur. Bu araştırmada, Hz. Ömer'in müellefe-i kulûbe yönelik uygulamasından hareketle günümüz zekât sistemlerinde müellefe-i kulûbün durumu ele alınmıştır. Çalışmaya konu olan ülkelerin zekât sistemlerinde müellefe-i kulûbün durumu tespit edilerek Hz. Ömer'in fıkıh anlayışı çerçevesinde değerlendirilmiştir. Tercih edilen başlıca yöntemler; araştırma, inceleme ve tahlildir. Bu yöntemler, araştırmanın konusunu tarihsel bağlamda ele alarak karşılaştırma yapma imkânı sağlamıştır. Bu sebeple meselenin daha kolay anlaşılması hedeflenmiştir."
