abstract: "Osmanlı Devleti'nin 600 yıl boyunca süren devamlılığında sahip olduğu hukuk sisteminin önemli bir yeri vardır. Osmanlılar geçmişteki Türk devletlerinden miras aldığı gelenek, görenek ve örfleri Türklerin İslamiyete geçişiyle kabul ettiği şerʻî hukukla birleştirerek kendilerine has bir hukuk sistemi kurmuşlardır. Kurulan bu hukuk sistemi ihtiyaç duyduğu zamanlarda da kendini yenileme yoluna gitmiştir. Osmanlı yöneticilerinin en önemli amaçlarından birisi var olan devlet düzen ve nizamının hiçbir kuvvet tarafından bozulmamasını sağlamaktır. Bu amaç dışarıdan gelen tehlikelere karşı korunurken içeriden bireysel ya da gruplar tarafından gelen tehlikelere karşı da müdafaa edilmeye çalışılmıştır. Bunun içindir ki devlet içerisinde insanlar arasında düzeni bozacak her türlü zararlı faaliyet önlenmeye ve suçlular gereği gibi cezalandırılmaya çalışılmıştır. Bu cezalar arasında kalebend, sürgün, cezire-bend, gibi cezalar en çok tercih edilenlerden olmuştur."
