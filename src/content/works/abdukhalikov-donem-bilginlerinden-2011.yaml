abstract: "Çalışmamız İlk Dönem Bilginlerinden Abdullâh b. el-Mübârek'in Hayatı ve Fıkhî Görüşleri ile ilgilidir. Tebeü't-tâbiîn döneminin en ileri gelenlerinden olan Abdullah b. el-Mübârek İslâm'ın Merv şehrinde yayılmasında büyük rol oynamıştır. İbnü'l-Mübârek, hadis ilmi başta olmak üzere islamî ilimlerin değişik alanlarında söz sahibi olan bir hüviyete sahiptir. el-Kütübü's-sitte râvilerinden olan adalet, sıdk ve emânetle meşhur olup, tezkiyelerine ihtiyac duyulmayacak derecede şöhret sahibi olan hadisçiler arasında yer alır. Abdullah b. el-Mübârek pekçok hocalardan ders almış ve bildiklerini o bölgelere taşımıştır. Cihad için gittiği yolculuklarda bile ilim öğrenmekten ve öğretmekten hiç geri durmamıştır. Böyle bir şahsin hayatını ve fıkhî görüşlerini bilmek çok önemlidir. Hanefî mezhebinin kurucusu olan İmam-ı Azam Ebu Hanîfe ile görüşmüş ve kendisinden rivâyette bulunmuştur. İbnü'l-Mübârek fıkhı ve fıkhî tefekkürü ondan öğrenmiştir. İmam-ı Azâm vefat edince, Medine'de İmam Mâlik'in yanında fıkha çalışmıştır. Böylelikle onun ictihad usulü, her iki yolun birleştirilmesinden meydana gelir. Abdullah b. el-Mübârek'in hakkında ilmî etüdler yapan alimlerin geneli, O'nu Hanafî mezhebine müntesip bir mutedil eserci olarak değerlendirir. Fakat bu müşterek kanaat onun usulde ve furuda Hanefî mezhebinin bütün ictihadlarını benimsediği anlamına gelmez. Çünkü O, Hanefî mezhebine uymayan görüşler de belirtmiştir. Abdullah b. el-Mübârek'in araştırmamızda geçen, ictihad ve fetvalarından da anlaşıldığı gibi, O; bazen farklı görüşleri mukayese edip, tercihler yapmış, genelinde bu tercihlerde Hanefilerin ictihadlarına uygun düşmüştür. Bazen dört mezhebin hiçbirine uymayan müstakil ictihadî sonuçlara ulaşmıştır. Şahsına özgü ictihadlarında dikkati çeken en önemli şüphesiz, vardığı ilmî sonuçları, selefin görüşlerine dayanarak, kitap ve sünnete istinad etmesidir. Bu da Abdullah b. el-Mübârek'in kendine özgü usulü olduğunu andırır."
