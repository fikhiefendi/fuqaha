abstract: "Bu çalışmamızda Ebu İshak eş-Şirâzî'nin“el-Lüma' fi Usûli'l-Fıkh”adlı eserinin icmâ bölümüne kadar Hanefi mezhebine nisbet ettiği 27 görüş ele alınmış ve söz konusu nisbetlerin doğruluk derecesi tespit edilmeye çalışılmıştır. Şirâzî dönemine kadar Hanefi mezhebi kaynaklarından tesbit ettiğimiz kadarıyla Şirâzî'nin Hanefilere yönelik görüş nisbetlerinde 21 isabetli, fakat 1 tanesi Hanefilerce tercih edilmeyen bir görüştür. Şirâzî'nin Hanefilere nisbet ettiği yukarıdaki görüşlerden başka 4 görüş ise kısmen doğru, 1 görüş ise genel olarak doğru olmakla birlikte kısmen yanlıştır. Tesbit ettiğimiz kadarıyla 1 görüş ise tamamen yanlıştır. Tezimiz üç bölümden oluşmaktadır. Birinci bölümde Şirâzî'nin yaşadığı dönem, siyasi ve dini ortam, hayatı, eserleri ele alınmıştır. İkinci bölümde Usûlü Fıkh'ın doğuşu, gelişimi ve tedvin dönemi ortaya konulmaya çalışılmıştır. Üçüncü bölümde ise Şirâzî'nin Hanefilere nisbet ettiği görüşler ve bu görüşlerin tahlili ele alınmıştır."
