abstract: "Hicaz bölgesinden dünyaya yayılan İslâm dininin fıkhî yorumları, sahâbe neslinden muallimlerin öğretileri ile farklı topraklara ulaşmış ve onların ilmi gayretleri ile de kalıcı olabilmiştir. Irak bölgesine gönderilen isimler arasında Abdullah b. Mes'ûd, Kûfe'de oluşan re'y fıkhının mimarıdır. Kendisinin öğrencileri ile Kûfe'de gelişen re'y temelli bu fıkhî yaklaşım, Ebû Hanîfe ve öğrencilerinin öncülük ettiği gayretli çalışmalarla sistemli bir görünüm kazanmıştır. Kısa sürede Irak'da gelişen bu fıkhî metodun haberini alan ilim meraklıları bu halkaya katılmak için akın akın Irak'a yönelmişler ve daha sonra Hanefî fıkhı diye isimlendirilecek olan bu fıkhî mesâili tahsil etmişlerdir. Elde ettikleri fıkhî birikim onlarla birlikte İslâm coğrafyasının değişik bölgelerine ulaşmış ve buralarda farklı medreseler oluşmasına zemin hazırlamıştır. Bu medreseler arasından Irak, Horasan ve Mâverâünnehir medreseleri daha etkili ve baskın bir konuma sahip olmuşlardır. Medreseler arasındaki farklılaşmanın arkasında ise siyasi, coğrafi, kültürel ve ilmî pek çok neden bulunmaktadır. Çünkü mezhebin fıkhî görüşlerinin medreseler tarafından farklı yorumlanışı ekolleşmede ne kadar etkili ise devletin desteğine sahip olmak, halkın ön kabullerine ve ihtiyaçlarına cevap vermek de en az onun kadar etkili olmuştur. Kaldı ki sosyal olguların tek bir nedene indirgenerek açıklanması isabetli sonuca ulaşmanın önünde duran büyük bir engeldir. İlmî nedenler ise bunlar arasında belki en çok dikkat çekenidir. Irak ve Mâverâünnehir farklılaşmasını meydana getiren konuların çoğunlukla usûl ile ilgili olduğu görülürken, bu durum Hanefî-Mu'tezilî usûl anlayışı ile Hanefî-Mâtürîdî usûl anlayışlarının ortaya çıkmasını sağlamıştır. Horasan medresesini ayrıştıran yönü ise diğerlerine nazaran umum belvâ ile örf ve âdete daha fazla alan tanıması olmuştur. Müslüman nüfusun çoğunluğunu temsil eden Sünnî kesim içerisinde en fazla müntesibi olan Hanefî mezhebi, yapılacak yeni çalışmalar ile yapısı ve farklı coğrafyalarda oluşan damarları açısından daha iyi anlaşılacaktır. Çalışma kavramsal çerçevenin verildiği giriş bölümü ile başlamaktadır. Birinci bölümde, Bağdat şehir tarihi ele alınmaktadır. İkinci bölümde ise Irak'ta kuruluşundan Mâverâünnehir bölgesinde istikrar dönemine kadar geçen süreçte Hanefî mezhebi tanıtılmaktadır. Üçüncü ve son bölümde ise mezhebin alt ekollere ayrılmasının nedenleri ile birlikte bu ayrışmanın göstergesi kabul edilecek olan ekoller arası fıkhî görüş ayrılıkları incelenmektedir. Çalışma sonuç ve değerlendirme bölümü ile sona ermektedir."
