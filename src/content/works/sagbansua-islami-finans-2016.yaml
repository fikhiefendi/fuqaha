abstract: "İslami finans büyüme potansiyeli olan bir sektördür. Dini hassasiyeti yüksek olan Müslümanlar uzun zamandır atıl kalan birikimlerini, İslam dinine uygun faaliyet gösterdiklerine inandıkları İslami bankacılığın ya da ülkemizdeki Katılım Bankacılığı aracılığıyla ekonomiye kazandırmaya başlamışlardır. İnsanlar dini değerlerine bağlılıkları gereği Katılım bankalarını konvansiyonel bankalara tercih etmektedirler. Bu sektörde kritik olan, müşterilerin güvenini kaybetmemektir. Bu sebepten dolayı müşteriler için Katılım Bankalarının dini kurallara uygun faaliyet sürdürmelerini sağlayan ve bu uygunluğu teyit eden İslami Danışma Kurullarının var olması zaruridir. Bu kurulların etkin ve bağımsız bir şekilde çalışmaları için genel çerçevenin ve standartların oluşturulması şarttır. Ayrıca Kurul kararlarının tutarlı ve denetimlerin doğru olması için bir ulusal kurulun olması sektörün güvenilirliği açısından önemlidir. Bu tezin amacı, Danışma kurullarının fonksiyon ve rollerini dünyadaki örnekleriyle beraber ele almak ve Türkiye'deki Katılım Bankalarına uygun İslami Danışma Kurul modelinin genel çerçevesine yönelik önerilerde bulunmaktır. Bu model, Türkiye'nin sosyal, ekonomik ve hukuki şartlarını göz önüne alarak dünyadaki uygulama örneklerinden hareketle oluşturulmuştur. Çalışma kapsamında, Türkiye'deki Katılım Bankacılığı alanında İDK'ların görev ve yetkilerinin net olmadığı ve kurumsal yönetimde otoritesinin sınırlı olduğu; ürün geliştirme ve denetleme süreçlerinde kendilerinden gerekli ölçüde istifade edilmediği hipotezi mercek altına alınmıştır. Bu doğrultuda, mevcut durumda Türkiye'de faaliyet gösteren Katılım Bankalarının İslami finansal ürün çeşitliliğinin yanı sıra faaliyetlerinin İslami ilkelere uyumluluğunun denetlenme süreçlerine yönelik bilgi edinme amaçlı anket soruları hazırlanmış ve bu kurumların ilgili yöneticileriyle yüzyüze görüşmeler yapılmıştır. Metot olarak kullanılan anket ve mevcut literatürün değerlendirilmesi sonucunda, ülkemizdeki katılım bankalarının İDK'larının ürün geliştirme ve diğer kurumsal süreçlerde yeterince etkili olmadığını, raporların yayınlanmadığını ve dolayısıyla sistemin şeffaf olmadığını görmekteyiz. Bu da çalışmanın başlangıcında sunulan hipotezin geçerliliğini desteklemektedir. Ancak bu konuda çeşitli çalıştayların, konferansların ve toplantıların oluşturulması gelecek adına olumlu sinyaller vermektedir. Katılım Bankalarının İslami Danışma Kurulları için hazırlanan model dokuz öneriden oluşmaktadır. Bu modele göre; danışma kurullarının en az üç üyeden oluşması, üyelerinin özellikle İslam hukuku ya da İslam ticaret hukukunda uzman olmaları, Şeriata uygunluk denetimlerinin danışma kurulu murakıpları ve faizsiz finans kuruluşunun teftiş ekipleri ile ortaklaşa yapılması, sekretarya ve iç denetimi sağlayacak ekiplerin oluşturulması ve yeni uzmanlar yetiştirilecek ortamın oluşturulması gerekmektedir. Ayrıca kurulun bağımsızlığı, kararların tutarlılığı ve standartların belirlenmesi için Ulusal Kurulun oluşturulması gerekli görülmektedir. Şeriat denetim sisteminin mevcut düzenleyici çerçevesinin iyileştirilmesi ve genişletilmesi ve uygun yasal temelin hazırlanması gerekmektedir."
