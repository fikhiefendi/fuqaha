abstract: "Şer'iyye sicilleri birinci elden kaynak olmaları bakımından Osmanlı tarihi için çok büyük bir öneme sahiptir. Son zamanlarda artan şehir tarihi çalışmalarının neredeyse vazgeçilmez bir parçası konumundadır. Kayıtların mahkemede şahitler huzurunda tutulması bu kayıtların güvenirliğini daha da arttırmaktadır. Tez konumuzun esasını teşkil eden 1863 Numaralı Trabzon Şer'iyye Sicili genelde Osmanlı tarihi özelde ise Trabzon tarihi açısından oldukça büyük bir öneme sahiptir. Nitekim sicilin yazıldığı dönem Osmanlı tarihinin kırılma noktalarından birisini ihtiva ettiği için o döneme dair oldukça önemli bilgiler içermektedir. H. 1109-1110/M. 1697-1699 tarihlerini ihtiva eden Çalışma Trabzon Şer'iyye Sicili adlı eserin çeviri yazısını ihtiva etmekle birlikte iki bölümden müteşekkildir. Birinci Bölümde Osmanlı hukûk sistemi, Osmanlı mahkemeleri, mahkeme personelleri, şer'iyye sicil defterleri ve defterde yer alan belge türleri ayrıntılı bir şekilde açıklanmıştır. İkinci Bölümde ise sicilin değerlendirilmesi yapılarak sicilde yer alan konular tasnif edilip kayıt numaralarıyla beraber yazılmıştır."
