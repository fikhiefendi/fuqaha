abstract: "Bu çalışmada, Osmanlı hukukunda Tanzimat ve sonrası dönemde yüksek dereceli mahkemelerin işleyişi hakkında bilgi verilmesi amaçlanmıştır. Verilen bilgilerin bir bütün oluşturması açısından tarihi bir inceleme yapılmış ve Tanzimat'tan öncesine hatta Osmanlı Devletinden de öncesine giderek İslam toplumlarında bu mekanizmanın işleyişinden bahsedilmeye çalışılmıştır. Çalışmanın ilk bölümünde, İslam hukukunun uygulanmaya başladığı ilk dönemlerden bahsedilmiştir. Sözü geçen zaman aralığında mahkemelerin bir kurum olarak karşılığı olmasa dahi devlet bünyesinde amaç ve yöntem bakımından benzerlik gösteren gruplar mevcuttur. İslam tarihinin erken dönemlerinde devlet başkanı olarak görev yapan ve aynı zamanda yargı erkini de elinde bulunduran Hz. Muhammed (s.a.v.) toplum nezdinde meydana gelen uyuşmazlıkları çözmek üzere muayyen bölgelere hâkim atamaktadır. Hâkimler somut olayı incelemekte ve bir uyuşmazlığın giderilmesi adına herkesi bağlayıcı olacak şekilde bir karar vermektedir. Fakat hâkimler bazı durumlarda vereceği kararın hakkaniyetli olmayacağını, adil davranamayacağını düşündüğü taktirde yargının en üstünde yer alan ve adeta bir yüksek derece mahkemesi olarak görev yapan Hz. Muhammed'e (s.a.v.) gelmekte ve olaya göre adil bir karar vermesini istemektedir. Aynı durum hâkimler tarafından verilen kararın somut olayın tarafları açısından adaletli bulunmadığı, verilen kararın tekrar gözden geçirilmesini istemeleri halinde de mümkün olmaktadır. Böyle bir talep halinde verilen ilk karar bozulmakta ve durum yeniden gözden geçirilmektedir. İlerleyen yıllarda İslam devletlerinin gösterdiği yayılmacı politikalar ve savaş vesilesi ile fethedilen yerler sayesinde topraklar genişlemiş ve nüfus artmaya devam etmiştir. Nüfus ile beraber iş yoğunluğu da artmış ve her alanda olduğu gibi yargı alanında da düzenlemeye gidilmiştir. Uyuşmazlıkların artık tek bir yetkili tarafından çözülmesi imkânsız hale geldiğinden kurumsallaşmanın temelleri atılmaya başlanmış ve özellikle klasik Osmanlı döneminde divanlar kurulmaya başlanmıştır. Haftanın belirli günlerinde devlet başkanı yahut onun vekil tayin ettiği kimseler başkanlığında toplanan divanlarda uygulanan yöntem daha profesyonel olmakla beraber belirlenen hedef ve nihai amaç aynıdır denilebilir. İkinci bölümde ise değişim ve yenilikler için kapılarını açan bir nevi buna mecbur olan yeni bir Osmanlı devleti vardır. Yavaş yavaş gerileme dönemine doğru ilerleyen fakat yapacağı basit ama kurtarıcı hamleler ile devletin ömrünü uzatmak isteyen devlet erkânı diğer alanlarda olduğu gibi yargı alanında da birçok yeniliğe gitmiş ve çağa ayak uydurmaya çalışmaktadır. Üçüncü bölümde ise artık yenilik ve reform dönemi bitmiştir. Hâlihazırda olan sistemde bir takım düzenlemeler yapılmaktadır."
