abstract: "Tezimizde 1909(1896)-1987 yılları arasında yaşamış olan Molla Muhyiddîn el-Hâvelî'nin, hayatı, ilmî kişiliği hakkında bilgiler verilecek ve fıkıhçılığı incelenecektir.20. yüzyılın önde gelen âlim, fakîh ve mutasavvıflarından biri olan el-Hâvelî, soy itibariyle Irak'ın Süleymaniye'ye bağlı Berzenc köyünden gelen ve İslamî ilimlerle meşgul olan bir aileye mensuptur. Siirt'e bağlı Bilvanîs köyünde doğmuştur. Küçük yaşlarda eğitim görmüş ve tedrisat sonrası, Baykan ve Kozluk'un çeşitli köy ve mezralarında bu hizmetlere devam etmiştir. Medrese eğitim geleneğine göre yetişen ve bu gelenek çerçevesinde ders veren el-Hâvelî, çoğu ömrünü ilim öğrenme ve öğretmeye ve insanlar arasında baş gösteren dinî ve dünyevî sorunları çözmeye adamıştır. el-Hâvelî başta Arap dili ve belâgati olmak üzere tefsir, hadis, fıkıh, kelâm gibi İslâmî ilimlerinin hemen her alanın¬da otoritedir. Klasik kaynakları çok iyi özümsemiş olan el-Hâvelî, özellikle Şafiî fıkıh kitaplarına, her satırını ezberlemişçesine vâkıftır. el-Hâvelî, Şafiî mezhebine yeni bir açılım kazandırmaktan çok genelde nakilci bir metot takip etmiştir. Bununla birlikte, farklı görüşlerin olduğu mevzularda mezhep sınırları içerisinde yer yer kendisi de tercihlerde bulunmuştur. Ayrıca kimi zaman da bizzat içtihatta da bulunmuştur.el-Hâvelî, ilmî ve davetçi kişiliği ile de bölgede ön plana çıkmıştır. Özellikle bölge halkının ve âlimlerinin çoğunluğunun itibarını kazanmış önde gelen bir İslâm âlimidir. O yüzlerce talebeye ders vermiş, çok sayıda talebeyi de mezun etmiştir. Talebeleri arasında müderrislik yapan ve önemli hizmetlerde bulunanlar yetişmiştir. Ayrıca elde ettiği ilmi birikimi ile geniş kitlelere dinî ve sosyal alanlarda çok faydalı olmuştur."
