abstract: "ÖZET İslâm Dini'nin koyduğu prensipler çerçevesinde banka işletmeciliği yapan kuruluşlara, İslâm bankası veya faizsiz banka denilmektedir. İslâmi esaslar doğrultusunda faaliyet gösteren bu tür bankacılıkta faiz haram olup, sistemde faizin yerinieşit kar ve risk paylaşımı almıştır. Faiz yasağı, İslâmi bankacılığın kurulmasının en önemli nedenlerinden biri olmuştur. Bu bankalar, faizsiz olarak çalıştıklarına göre, öncelikle, faizin ne olup ne olmadığının araştırılması gerekmektedir. Bu düşünceden hareketle, faizin kuramsal yapısı, iktisat teorisi ve İslâmiyet açısmdan incelenerek, farklılıklara değinilmiştir. Faizin haram, ticaretin helal olduğu görüşünden hareket eden İslâm bankalarının doğuşunu hazırlayan bazı sebepler vardır. Bunlar dini, ekonomik ve politik nedenlere dayandırılmaktadır. Bu bankalar, bazı temel esaslar çerçevesinde amaç ve politikalar belirleyerek faaliyetlerim sürdürmektedirler. İslâm bankalarının işleyişi, geleneksel bankalardan bazı yönleriyle farklılıklar göstermesine rağmen, diğer bankaların yaptıkları bütün işlemleri de yerine getirmektedirler. Bu bankalar, tasarruf sahiplerinden cari hesaplar ile kar ve zarara katılma esasına göre fon toplamaktadırlar. Fon kullandırma faaliyetlerinde ise, İslâmi ilkeler çerçevesinde ve kar-zarar ortaklığı anlayışına uygun olarak geliştirdikleri çeşitli finansman yöntemlerini kullanmaktadırlar. Bu finansman türleri, mudaraba, muşaraka, murabaha, icar ve iktina, selem satışı, taksitli satışlar vb şeklinde sıralanabilir. Henüz 20-30 yıllık bir geçmişe sahip olmasına rağmen, İslâm bankacılığı uluslararası sahada büyük gelişmeler göstermiştir. Bazı değerlendirmelere göre, sayılan 45'i aşan ülkede, 133'den fazla mali kurum faaliyet göstermektedir. Piyasaların geçerli yıllık sermaye tedavülünün, şimdiki durumda 70 milyar $ olduğu tahmin edilmektedir. Bu miktar, 1985 yılında sadece 5 milyar $ olup, bu yüzyılın sonunda 100 milyar $'a varacağı tahmin edilmektedir.İslâm bankacılığının ülkemizdeki uygulamasını, Özel finans kurumlarında görmekteyiz. Türkiye'de 1984 yılından itibaren faaliyet göstermeye başlayan özel finans kurumlarının, kuruluşları, faaliyet ve tasfiyeleri Bakanlar Kurulu'nun 16.12.1983 gün ve 83/7566 sayılı Karan ve bu karara ilişkin Hazine Müsteşarlığı ile T.C. Merkez Bankası'nın Tebliğleri ile düzenlenmiştir. Böylece, sözkonusu bu düzenlemeler, ülkemizde İslâm bankacılığının bir versiyonu olan özel finans kurumlarının yasal dayanağını oluşturmuştur. Özel finans kurumlan, banka dışı mali kuruluşlar olarak nitelendirildiğinden, topladıklan fonlar, mevduat olarak kabul edilmemekte ve Bankalar Kanunu'na tabi olmamaktadırlar. Kurumların organizasyon yapısında genel kurul, yönetim kurulu ve denetleme kurulu yer almaktadır. Özel finans kurumlan, diğer bankalar gibi fon toplama ve fon kullandırma işlevlerini yerine getirmektedirler. Özel cari hesaplar ve katılma hesaplanyla elde edilen fonlar, faizsiz finansman yöntemleriyle kullandınlmaktadır. Ülkemizde, halen 6 özel finans kurumu, 119 şube ile faaliyet göstermektedirler. Kurumlann kuruluşundan bu yana 13 yıl geçmiştir. Bu süre zarfında, kurumlann Türk ekonomisine katkılan ve geldikleri noktalar değerlndirmeye tabi tutulmuştur. Aynca, kurumlann bankalarla olan yasal ve işlevsel farklıhklanna değinilmiştir. Özel finans kurumlannm karşı karşıya olduklan sorunlar çözüldüğünde ve yasal çerçeveleri kanunla düzenlendiği taktirde, bu kurumlar daha verimli çalışabilir ve o oranda da Türkiye ekonomisine olan katkılarını daha da artırabilirler. İslâm ülkeleri arasında, kısa sürede benimsenen ve batı ülkelerinde de, geleneksel bankalann uzmanlaşmış İslâmi bankalar ve îslâmi pencereler açarak ilgi gösterdikleri faizsiz bankacılığın, giderek kabul gördüğü gözlemlenmektedir. Önümüzdeki yıllarda, teori ve uygulamada oluşturulacak yeni modellerin katkısıyla, bu tür bankacılık uygulamasının daha da gelişeceği söylenebilir."
