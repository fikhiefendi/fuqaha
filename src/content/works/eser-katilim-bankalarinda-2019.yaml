abstract: "Her birey, hayatını devam ettirebilmek için tüketim yapmak zorundadır. Gösterilen tüketim davranışı, finansal kararları etkilerken, aynı durum tersi içinde geçerli olabilmektedir. Doğru ve zamanında alınan finansal kararlar bireyin refah düzeyini artırıp, hatalı seçimler yapmasını engellemektedir. Bu nedenle finansal kararların yaşam kalitesi üzerindeki etkisi son derece önemlidir. 21.yy da hızla gelişen ekonomi, bireylerin değişen ihtiyaçları ve toplumun demografik yapısının değişmesi gibi birçok neden finansal okuryazarlık kavramının önemini gün yüzüne çıkarmaktadır. Bireylerin gelecek planlarında yer alan emeklilik dönemlerinin, ekonomik anlamda daha rahat geçmesi finansal okuryazarlığın gelişimine bağlı görülmektedir. Finansal okuryazarlık, bireylerin sadece gelir düzeylerini değil, aynı zamanda finansal güvenlikleri için de önem taşımaktadır. Yatırım için tercih edilen bankanın veya satın alınan hisse senedinin sahibi olan şirketin, ekonomik anlamda ne durumda olduğunu, borç-öz kaynak durumunu veya kriz yönetiminde hangi aşamada olduklarını bilmeyen bir yatırımcı, kendisini ne gibi tehditlerin beklediğini kestiremeyecektir. Son dönemlerde yaygın bir şekilde kullanılan kredi kartları, bankalardan temin edilen yüksek faizli krediler ve bireysel emeklilik sisteminin öneminden haberdar olunması, finansal hizmetlere dair bilgi eksikliğinin giderilmesi ve bireylerin finansal araçları hangi durumlarda kullanılacağı hakkında bilgilendirilmesinde yardımcı olmaktadır. Bu çalışmada katılım bankasında hesabı bulunan bireylerin, finansal okuryazarlık düzeylerinin belirlenmesi ve finansal okuryazarlık düzeyi ile demografik faktörleri arasındaki farklılığın ölçülmesi amaçlanmıştır. Ayrıca bireylerin finansal okuryazarlık düzeyinin, finansal durumlarını yönetme ve tasarruf davranışına etkisinin belirlenmesi amaçlamıştır. Erzincan ilinde ikamet eden ve finansal tüketici olan 211 kişi ile anket çalışması gerçekleştirilmiştir. Araştırmada bireylerin orta düzeyde finansal bilgiye sahip olduğu saptanmıştır. Yapılan analiz sonucunda, bireylerin finansal okuryazarlık düzeyi ile demografik faktörleri arasında farklılık olduğu ortaya çıkmıştır. Diğer taraftan finansal okuryazarlık düzeyi iyi seviyede olan bireylerin kendi finansal durumlarını yönetmede zorluk çekmediği tespit edilmiştir."
