abstract: "Küresel düzeyde özellikle Avrupa ve ABD dahil olmak üzere bir çok ülkede finansal bir enstrüman olarak kullanılan sukuk, ülkemiz finansal sisteminde“Kira Sertifikası”olarak tanımlanmış ve sermaye piyasalarında yapılan düzenlemeler ile 2010 yılından itibaren kamu ve özel sektör tarafından kullanılmaya başlanmıştır. Bu çalışmamızda öncelikle finansal sistemin temel yapısı, unsurları ve işleyişi tanıtılarak küresel finans sistemi içindeki payını gittikçe artıran İslamî finans sisteminin, mevcut sistem içindeki yeri belirlenmeye çalışılmıştır. Ayrıca İslam hukuk ilkelerinin belirleyici olduğu bu alanda temel bilgi ve görüşlere yer verilerek ayırıcı unsurlar ön plana çıkartılmıştır. Sonrasında finansal bir enstrüman olarak sukuk/kira sertifikasının, menkul kıymetleştirme ve varlığa dayalı menkul kıymet işlemleri bağlamında kavramsal çerçevesi açıklanmaya çalışılmış, benzer ürünler olan tahvil ve bonoyla arasındaki temel farklar incelenmiş ve son olarak dünyada ve ülkemizde yapılan düzenleme ve uygulamalar hakkında ayrıntılı bilgi verilmiştir. Elde edilen bilgiler ışığında ülkemizde ve dünyada sukuk/kira sertifikası işlemlerinde belirli bir standartlaşmanın sağlandığı ve sermaye piyasalarında sukuk/kira sertifikası işlemlerinin payının gün geçtikçe arttığı görülmektedir."
