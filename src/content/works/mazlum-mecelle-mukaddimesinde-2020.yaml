abstract: "İslam hukukunun bir ilim olarak teşekkül etmesinden günümüze kadar, ele aldığı konuları temelde usul ve fürû olmak üzere iki şekilde nakletmiş olmasıyla birlikte zamanla şerh, hâşiye, muhtasar, fetâvâ, eşbâh ve'n-nezâir ve kavâid gibi mevzuları, yöntemleri ve hedefleri itibariyle birbirinden farklı alt dalları olmuştur. Bu alt dallardan biri olan kavâid edebiyatı hicrî IV. asırla birlikte sistemleşmeye başlamış ve bu alanda hicrî XIII. asra kadar birçok telif ortaya çıkmıştır. Hicrî XIII. asrın sonlarına doğru ise fıkıh kaideleri kanunlaştırılarak Osmanlı mahkemelerinde uygulanmak üzere Mecelle-i Ahkâm-ı Adliyye oluşturulmaya başlanmıştır. Kavâid-i fıkhiyyeyi, bu alanda yazılmış eserlerden farklı bir sistematikle derleyen Mecelle, sonrasında telif edilen eserlere de yön vermiştir. Bu çalışmada, genel olarak Mecelle mukaddimesinde yer alan ispat vasıtalarıyla alakalı kaideler incelenerek, bir kanun metni olan Mecelle'nin bu konuyu nasıl ele aldığı hakkında bilgi verilmeye çalışılmıştır. Bu bağlamda giriş kısmında öncelikle veciz bir şekilde kavâid-i fıkhiyye ilminin kavramsal çerçevesiyle ilgili malumat verildikten sonra, bu ilim açısından oldukça önem arz etmesi ve söz konusu araştırmayla da yakından bağlantılı olması hasebiyle Mecelle'nin tarihsel gelişimi ve genel özelliklerinden kısaca bahsedilmiştir. Ardından daha sonra anlatılacakların daha iyi anlaşılması amacıyla ispat vasıtaları özet bir şekilde anlatılmıştır. İspat vasıtalarıyla ilgili Mecelle mukaddimesinde tespit edilen kaidelerde beyyine, ikrar ve yemin delillerinin bizzat lafız olarak zikredilmesi sebebiyle, bu çalışmada mevzu bahis olan üç delil üzerinde durulmuştur. İki bölümden oluşan araştırmanın birinci bölümü, genelde İslam hukukunda özelde ise Mecelle'de geniş bir şekilde ele alınması hasebiyle ispat vasıtalarından beyyine deliline ayrılmıştır. Bu bölümde beyyine delilinin muhtevası ile ilgili görüşler ve Mecelle küllî kaidelerinde beyyine delilinin hangi açılardan ele alındığı hakkında bilgi verildikten sonra beyyineler arasında teâruz ve tercih konusu izah edilmeye çalışılmıştır. İspat vasıtalarından ikrar ve yemin delillerinin beyan edildiği diğer bölümde ise Mecelle'de bu iki delille ilgili anlatılanlar incelenerek ilk olarak ikrarın mahiyeti, şartları, etkisi, bağlayıcılığı ve hükümsüzlüğü hususları açıklandıktan sonra yeminin tanımı, şartları, şekli, yemin teklif edilen taraf, yeminden nükûl gibi meselelere değinilmiştir. Mecelle küllî kaidelerinde ispat vasıtalarından beyyine, ikrar ve yemin delillerinin izah edilmeye çalışıldığı bu araştırmada ekseriyetle Mecelle ve şerhlerinden istifade edilmiş olsa da yeri geldikçe mezheplerin görüşlerine de değinildiği için klasik fürû-i fıkıh eserlerine de başvurulmuştur. Aynı zamanda gerek kavaid-i fıkhiyye ilmiyle ilgili genel bilgileri gerekse söz konusu kaidelerle alakalı bir takım ayrıntıları beyan edebilme amacıyla kavâid-i fıkhiyye alanında telif edilmiş eserlerden de faydalanılmıştır."
