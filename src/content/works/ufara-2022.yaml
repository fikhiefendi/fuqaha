abstract: "Arapça ilimler arasında sarf ilminin önemi herkesçe malumdur. Bundan dolayı eskiden beri alimlerimiz sarf ilmiyle ilgili eser yazmayı önemsemişlerdir. Sarf ilminin önemli eserlerinden biri olan ve gün yüzüne çıkarılmaya değer, fayda sağlayacak olan Mehdi Hanefi'ye ait“şerhü'l-merah”isim eserde Yazarın önemli kişiliği bu kitapta kendini göstermiş ve yazar birkaç konuya değinerek mazi, muzari, emir kiplerini, merfu, mansub, merfu ve gizli zamirleri, fiilleri ve durumlarını, Ayrı ve bitişik yazılanları gizli ve açık zamirleri incelemiştir. Hazfetme ve Ziyade çalışmalarına değinmiştir. Farsça bazı kelimeleri açıklamıştır. Şerhü'l Merah metninde geçen ibareleri açıklamak için çaba göstermiştir. Dolayısıyla bu eser, sarf kitapları arasında kendine layık bir yer edinen güzel bir şerh olmuştur . Bu eserin Bir bölümünü ( sayfa 50-110 arası ) tahkik ettiğim çalışmam üç bölümden oluşuyor . 1. Bölüm El yazmasının incelenmesi 2. Bölüm eserin metni ve 3. Bölüm eserin tahkiki. Çalışmam yaklaşık 130 sayfadan oluşmaktadır . Eserin anlaşılması güç olan ibarelerini açıkladım ve tüm dikkatimle hatalardan arınmış bir şekilde metni doğru yazmak için çabaladım. Bu çalışmamın faydalı olmasını Allah'tan dilerim, çünkü o en iyi işiten ve en yakın olandır."
