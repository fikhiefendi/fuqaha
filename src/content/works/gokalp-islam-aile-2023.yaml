abstract: "İslâm fıtrat dinidir ve bu din, insan için en kolay ve ölçülü olanı sunmuştur. Zira Allah (c.c.) her şeyi bir denge üzere yaratmıştır. Allah'ın her hükmünde büyük ve çeşitli hikmetler vardır. İslâm hukuku da Kur'ân ve Sünnet'in temsil ettiği ilahî iradeye dayalı ve insanın hem maddî hem de manevî yönlerini ele alarak bütünlük arzeden bir hukuk düzenidir. Nitekim İslâm hukukçuları İslam hukukunu, \"fıkıh içinde yalnızca karşılıklı hak ve vecibe ilişkisi kuran davranışları düzenleyen, emredici ve tecvîz edici (sebest bırakıcı) kurallar bütünü״ olarak tarif etmişlerdir. İslâm hukukunun bir diğer özelliği de etkin bir yapıya sahip olmasıdır. Dolayısıyla tezimizin konusu olan kadının evliliğini sona erdirme hakkının İslâm aile hukukuna göre hak ve yetkilerinin neler olduğu ve günümüzde kadının bu hak ve yetkilerini nasıl kullanabileceği konusu değerlendirilmiştir. Ayrıca İslâm hukukuna göre kadının boşanma konusunda atıl kaldığı ve durumunun erkeğin iki dudağının arasında olduğu gibi ilimden ve hukuktan yoksun söylemlere karşı tezimizde İslâm aile hukukunda kadınının evliliğini sona erdirme hakkının Kur'ân ve Sünnet merkezli olarak, dört mezhep imamının görüşleri, Osmanlı Devleti'nin Tanzimat döneminde, 1917 tarihli Hukuk-ı Aile Kararnâmesi (HAK) çalışması ile kadınların evlenme ve boşanma hususunda haklarını devlet kontrolü altına alınarak gün yüzüne çıkarma çabaları ve günümüz Medenî hukukun işleyişi ile İslâm aile hukuku arasında kesişen ya da benzeyen uygulamalarda kısaca incelenmiştir."
