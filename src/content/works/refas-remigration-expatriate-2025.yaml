abstract: "Bu çalışma, Batı toplumlarındaki Müslüman azınlıklar arasında ortaya çıkan geri göç olgusunu, özellikle İslam ekonomisi ve finansı çerçevesinde Fransız Müslümanlarına odaklanarak incelemektedir. Araştırma, nitelikli Müslüman nüfusların neden zengin gelişmiş ülkeleri terk ederek Müslüman çoğunluklu ülkelere veya alternatif destinasyonlara yerleşme eğiliminde olduklarını araştırarak göç literatüründeki kritik bir boşluğu ele almaktadır. Çalışma, iki nesil boyunca 60 bireyi kapsayan yarı yapılandırılmış görüşmeler ile ağırlıklı olarak dindar Müslümanlardan oluşan 198 katılımcıyla gerçekleştirilen Ayrık Seçim Deneyi'ni (ASD) birleştiren karma yöntem yaklaşımını benimser. Rastgele fayda teorisine dayanan ASD metodolojisi, dört destinasyon alternatifi arasındaki göç tercihlerini nicelleştirir: Körfez ülkeleri, Türkiye/Fas, Batılı ülkeler ve Fransa'da kalma. Çok terimli lojit modeli güçlü tahmin gücü elde eder (sözde-R² = 0,858) ve Körfez ülkelerinin en tercih edilen destinasyon olarak öne çıktığını (göç niyetlerinin %35,7'si), bunu Türkiye/Fas'ın (%27,7) takip ettiğini ve yalnızca %24,6'sının Fransa'da kalmayı tercih ettiğini ortaya koyar. Bu araştırma, ayrık seçim modellemesi kullanarak Fransa'dan Müslüman geri göç tercihlerinin ilk nicel analizini sunmakta ve kültürel kimliği ekonomik göç çerçevelerine entegre ederek İslam ekonomisi literatürüne katkıda bulunmaktadır. Bulgular, 2025-2035 döneminde Fransa için öngörülen 2,8-4,2 milyar Euro'luk toplam maliyetler ile hedef ülkelerin 1,9-3,1 milyar Euro ekonomik değer kazanacağı projeksiyonları ile önemli çıkarımlarına sahiptir."
