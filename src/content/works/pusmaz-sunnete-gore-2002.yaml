abstract: "Öz Evlilik kurulurken prensip itibariyle bir ömür boyu devam edecek bir hukukî beraberlik olarak kabul edildiği için bu birlikteliğin, ölüm dışında bir sebeple sona ermesi pek düşünülmez. Diğer taraftan bir huzur ve mutluluk ikliminde yaşansın diye kurulan evlilik bağı, bazı sebepler dolayısıyla bu ortamı oluşturmayabilir. Hatta evliliğin devamı bazan üzüntü ve sıkıntıyı da beraberinde getirebilir. Böyle bir durumda ise evliliğin sona erdirilmesinden başka çare kalmaz. Tarihin her evresinde bütün toplumlarda önemli bir yer işgal eden boşanma meselesine Kur'ân'ın, nasıl yaklaştığı bu çalışmamızda ele alınarak, özellikle Kur'ân ve Sünnete Göre Üç Talâk konusunu üzerinde durulmuştur: Kur'ân ve sünnetten deliller getirilmek suretiyle konu detaylı bir şekilde işlenmiş ve neticede bir lafızda verilen üç talâkın bir talâk sayılması gerektiği belirtilmiştir. Kur'ân' da talâkın, üç ile sınırlandırılması, üçünün bir arada verilemeyeceğini göstermektedir. Dolayısıyla toplumda pek yaygın olan“Seni üç kere boşadım”vb. ifadelerle evlilik birlikteliğinin derhal sona ermediği ortaya çıkmaktadır. ABSTRACT As a principle, as mariage is thought as a juridicial togetherness that continues life long when it is set up, it is not thought to be ended by a reason other than death. From other side, the tie of mariage that set up to be lived in the climate of of repose and happiness could not form the desired climate because of the some conditions. Even the continuation of the marriage can sometimes bring anxiety and annoyance. In that situation, there will be no remedy other than to end the marriage. In this paper, it has been focuced on how the Quran approaches to the divorce that has ben taking an important position in every society and in every period of the history, especially on the subject of the“Three Talaks”according to Quran and Sunnah. The subject has been worked up in details by presenting from Quran and Sunnah, in consequence, it has been made clear that to state“three talaks”in one time must be evaluated as one talak. That the talak is limited to three in the Quran showed that“three talaks”in one time can not mean the three talaks. Thus with the expressions which are quite widespread in the society like“I divorced you with three talaks”, that has been appeared clear that the marriage togetherness can not be lasted. n"
