abstract: "Ülke ekonomileri ve iş dünyası açısından finansal aracılar, aracıların içinde ise en önemlisi olan bankalar, ticari hayatın sürdürülebilirliğini sağlayan kan damarları gibidir. Gerek likiditenin fon fazlası ve fon açığı olanlar arasındaki akışının yanı sıra bağlantılı risklerin devredilerek yönetiminin sağlanmasında, gerekse maaş, alışveriş gibi gün içi işlemlerden kaynaklanan nakit akışının kesintisiz olarak sürdürülebilmesi gibi pek çok süreçte bankacılık sektörü tüm dünyada vazgeçilmez bir konumdadır. Bankacılık sektörü kendi içinde Konvansiyonel (Geleneksel) Bankacılık ve Katılım Bankacılığı olmak üzere ikiye ayrılmaktadır. Dünyada ve Türkiye'de katılım bankaları ile ilgili literatür incelendiğinde, söz konusu bankaların mevcudiyeti ve işlem hacimlerindeki büyümenin ülke ekonomilerine ait göstergeleri olumlu yönde etkilediğine dair görüşün ağır basmakta olduğu görülmektedir. Literatürdeki çalışmaların bulgularında, makroekonomik değişkenlerin katılım bankacılığı kurumlarının malî tabloları üzerinde etkili olduğu ve bunun sonucunda kârlılıkların pozitif yönde etkilediği gözlemlenmektedir. Bu tezde, katılım bankacılığının sektörel işlem hacmi ile seçilmiş makroekonomik değişkenler arasındaki nedensellik ilişkisini incelenmiştir. Çalışmada, 2005-2023 yılları arasına ait, eksiksiz temin edilen ikincil makroekonomik veriler (sanayi üretim endeksi (SÜE), tüketici fiyat endeksi (TÜFE), istihdam oranı (LER)) ile katılım bankacılığı sektör bilançolarından geliştirilen katılım bankacılığı toplam işlem hacmi değişkenleri arasındaki ilişki zaman serileri analizi yöntemleri ile incelenmiştir. Analizlerde durağanlığın belirlenmesi amacıyla Genişletilmiş Dickey Fuller Birim Kök Testi, uzun dönemli bir ilişkinin mevcut olup olmadığının belirlenmesi amacıyla Johansen Eşbütünleşme Testi ve nedenselliğin tespiti amacıyla VECM'ye Dayalı Granger Nedensellik Testi kullanılmıştır. Veri aralığı, veri sıklığı ve seçilen değişkenlerin niteliği yöntem seçiminde etkili olmuştur. Veriler E-Views programı ile analiz edilmiştir. Yapılan analizler sonucunda, katılım bankacılığı işlem hacmi, istihdam büyüme oranı, sanayi üretim endeksi ve tüketici fiyat endeksi arasında uzun dönemli anlamlı ilişkilerin olduğu tespit edilmiş, bu sayede katılım bankacılığının Türkiye'deki makroekonomik göstergelere etkisinin önemi ortaya konulmuştur. Bu etki, genel ekonomik politikaların yapımında ve katılım bankacılık sektörünün yönetiminde gözardı edilmemesi gereken bir konudur. Katılım bankacılık sektörünün desteklenmesi ve büyümesi, ekonomik dengenin ve istikrarın sağlanmasına yardımcı olarak Türkiye'nin ekonomik büyüme ve kalkınma hedeflerine ulaşmasına katkıda bulunabilecektir."
