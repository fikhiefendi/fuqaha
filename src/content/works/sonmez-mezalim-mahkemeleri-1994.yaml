abstract: "ÖZET Kelime olarak“tecavüz ve haksızlıklara karşı yapılacak şikayetler, zalimden istenilen haklar, zulmen alınan şeyler, kuvvete başvurularak yapılan adaletsizlik, zalimlerin mazlumlardan aldıkları şeyler”gibi anlamlara gelen mezalim, terim olarak; sıradan mahkemelerin bakamadığı davalara, mazlumların şikayeti üzerine veya bazı durumlarda şikayet olmaksızın bakan, icra ve kaza fonksiyonuna sahip yüksek mahkemeye mezalim mahkemesi denir. İslam kurumlar tarihinde çok önemli bir yere sahip olan mezalim mahkemeleri, zulmün ortadan kaldırılıp adaletin dağıtılması için çok büyük hizmette bulunmuşlardır. Faaliyet gösterdikleri asırlarda hukuk alanında büyük bir boşluğu dolduran bu mahkemelerin adalet çarkını iyi döndürdükleri görülmektedir. Hiç şüphesiz bu durum söz konusu mahkemelerde görev yapan kimselerin yetkilerinin çok geniş, şahsi niteliklerinin de çok üstün olmalarıyla doğru orantılı olmuştur. İlk olarak ortaya çıktıkları dönemde özel bir mekana sahip olmayan bu mahkemeler için Halife Muhtedi döneminde“Kubbetü'l-Mezâlim”adıyla bir bina inşa edilmiştir. Zenginler ve Eyyübiler döneminde ise bu mahkemeler için özel binalar yapılmıştır. Bu mahkemelere genellikle halife, sultan, bölge valileri veya bunların atadığı kimseler başkanlık etmiştir. Ayrıca bu mahkemelere kadınlardan da başkanlak edenler olmuştur."
