abstract: "İslâm dininin ilk yıllarından itibaren tıp biliminde kaydedilen gelişmeler, fıkhî meselelere dair düşünce ve yaklaşımları etkilemiştir. Geçmişten günümüze tıp alanında kaydedilen gelişmeler, fıkhın bazı konularını yakından ilgilendirmektedir. Tıp sahasında araştırma yapan hekimlerin ortaya koydukları çalışmalar, tedavi yöntemleri ve tedavide kullandıkları malzemelerin niteliği -haram ve necis maddeden üretilmesi gibi- fetvâ sürecinde müftünün göz önünde bulundurduğu konulardandır. İslâm'ın geldiği ilk andan itibaren fakihler, tedavinin mükellef açısından hangi yönüyle fıkhî hükmü de ilgilendirdiği meselesine eserlerinde yer vermişler ve fetvâ sürecinde tıbbî bilgiye ihtiyaç duymuşlardır. Bu çalışmada konunun bu iki yönüne dikkat çekilecektir. Öncelikle birinci bölümde fakihlerin tıbbî bilgiyi fetvâlarında ne kadar kullandıkları ele alınacak ve bununla ilgili olarak fukahânın tedaviye yaklaşımlarına yer verilecektir. Bu yaklaşımlar, tedavi olmayı uygun görenler, teşvik edenler, zorunlu görenler ve tedavi tevekkül ilişkisi bağlamında konuyu ele alan alimler başlıkları altında incelenecektir. Bu noktada özellikle tedaviyi tevekkülle ilişkili ele alan alimlerin eserleri incelendiğinde tedaviye mesafeli yaklaştıkları anlaşılmakla birlikte bu dönemdeki tedavi anlayışının çağdaş dönemden oldukça farklı ve kısıtlı olduğu dikkat çekmektedir. İkinci bölümde ise tıp ve fetvâ ile ilgili konular ele alınırken tıbbî bilginin nasıl kullanıldığına odaklanılacaktır. Bu bağlamda ele alınacak temel meseleler: İbadetlere, aile hukukuna, beyin ölümüne, bedene müdahaleye ve haram maddeyle tedaviye dair fetvâlarda tıbbî bilginin kullanımı olacaktır."
