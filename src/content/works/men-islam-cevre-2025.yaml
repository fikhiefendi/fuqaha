abstract: "Son iki asırda küresel üretim oldukça hızlı bir şekilde artmış gelişmiş ülkelerde bu üretim artışına bağlı olarak refah seviyesi yükselmiştir. Refah artışı kadar insanın yaşamını devam ettirdiği ortam ve çevrenin doğal haliyle korunması ve devamlılığının sağlanması oldukça önemlidir. Tarihsel süreç içerisinde ülkelerin refah seviyelerini yükseltmek gayesiyle uyguladıkları politikalar çevreye ciddi anlamda zarar vermiştir. Uygulanan yanlış politikaların belirlenmesi alınması gereken tedbirler açısından önem arz etmektedir. Bu çalışmanın amacı İngiltere, Fransa, Almanya ve ABD gibi gelişmiş ve dünya üretiminde büyük bir paya sahip olan Çin ile Hindistan gibi gelişmekte olan ülkelerin kalkınma süreçlerinde çevreye olan hassasiyetlerini analiz etmek ve İslam'ın çevre ile ilgili kuralları bağlamında değerlendirmektir. Çalışmanın diğer bir amacı ise çevre ile ilgili sözleşmeleri İslam'ın çevre ile ilgili hassasiyeti bağlamında değerlendirmektir. İslam dininin temel dayanağı olan Kur'ânı Kerim ayetlerinin, İslam peygamberi Hz. Muhammed'in hadis-i şeriflerinin ve aynı zamanda İslam alimlerinin çevrenin ifsadına ilişkin görüşleri bir bütün olarak düşünüldüğünde, İslam dini çevreyi yalnızca fiziksel bir varlık olarak görmekle kalmaz; aynı zamanda, doğayı Allah'ın bir işareti ve bir emanet olarak değerlendirir. İnsan, bu emaneti korumakla mükelleftir. İsraf yapmak, doğaya zarar vermek ve hayvanlara kötü muamelede bulunmak hem etik hem de dini açıdan sorumluluk taşır. İncelenen ülkelerin deneyimleri analiz edildiğinde kalkınma süreçlerinde çevreye karşı titiz olmadıkları tarihsel süreç içerisinde çevreye tamiri güç zararlar verdikleri bu bağlamda uyguladıkları politikaların İslam dininin çevre ile ilgili hassasiyetine uygun olmadığı belirlenmiştir. Çevrenin korunması ve devamlılığının sağlanması amacıyla çok sayıda ülekenin taraf oldukları anlaşmaların ise çevre hassasiyetlerinin yüksek olduğu ve İslam dinin çevre ile ilgili kaidelerine uygun olduğu tespit edilmiştir. Ancak gelişmiş ülke üreticilerinin bu anlaşmaların yaptırımlarına maruz kalmamak için üretimlerini çevre ile ilgili politikaların daha esnek olduğu ülkelere taşıdıkları belirlenmiştir. Diğer bir ifade ile çevre kirliliklerini gelişmekte olan ülkelere ithal ettikleri söylenebilir. Bunun yanında gelişmiş ülkelerin bu anlaşmaları gelişmekte olan ülkelere karşı bir dış ticaret politika aracı olarak kullandıkları göze çarpmaktadır."
