abstract: "Finansal açıdan bakıldığında okuryazarlık, para ve sermaye piyasaları hakkında bilgi sahibi olma ve yorum yapabilme, tasarruf sahibi olma ve hatta doğru yer ve zamanda yatırımlar yapabilme gibi durumlar iken ''islami finansal okuryazarlık'' kavramı da bütün bu kavramların yanısıra her şeyden önce İslami inanca sahip olma, bu inanç üzerine yaşantısını sürdürebilme ve aynı zamanda da para ve her türlü maddi iş ve işlemlerinde İslami kuralları gözetip o kurallara göre hareket etme; aynı zamanda İslami finansal kavramlara yönelik bilgi sahibi olma ve hatta bunları kullanabilme yetkinliği olarak değerlendirilebilir. İslami finans piyasaları özellikle 1980'lerin başında Türkiye'de ve daha da öncesinde dünya çapında uygulamaya konulmuş bir sistem olup, para ve sermaye piyasalarında İslami kural ve şartlara göre iş ve işlem yapmak isteyen kişi ve kurumlara altyapı sağlayan aracı kurumların barındırıldığı bir sistemdir. Gelişmeye son hızla devam eden bu sistem, özellikle İslam ülkelerince ilgi görmekte ve bu bağlamda araştırmaya değer bir konu olarak ele alınabilmektedir. Türkiye'de bir çok ilde, özellikle üniversiteler bazında yapılan birkaç çalışmada finansal ve İslami finansal okuryazarlık kavramları incelemeye alınmış ve kişilerin bilgi, tavır, tutumları finansal boyutta araştırılmıştır. Elde edilen sonuçlarda genel olarak finansal okuryazarlık düzeyi ortalama seviyelerde bulunmuş, erkek öğrenci ya da katılımcıların kadınlara görece bilgi düzeylerinin yüksek olduğu gözlemlenmiştir. Elde edilen bulgular, özellikle belirli kitleleri hedef almak isteyen kişi ve kurumlarca bilgi/veri olarak görülüp kullanılabilecek birer kaynak teşkil etmektedir. Dünya çapında finansal okuryazarlıkla alakalı çalışmalar mevcuttur, bunların arasında önem kazanmış olan bir çalışma, OECD (Ekonomik İşbirliği ve Kalkınma Örgütü) tarafından 12 ülkeden katılım yapan vatandaşlar üzerine uygulanmış, finansal bilgi, finansal davranış ve finansal tutumları gözlemlenmiştir. Bu çalışmada, Adana ili içerisinde yaşayan farklı yaş ve meslek gruplarından katılımcılardan oluşan bir anket üzerinden araştırma yapılmış ve bulgular incelenmiştir. Anket çalışmasının yapıldığı dönem, Mart 2019 – Mayıs 2019 arasındadır. Çalışma sonuçlarına göre, katılımcıların genel anlamda finansal bilgileri sıklıkla kullandıkları finansal ürünler olan kredi/banka kartı ve mevduat hesabı gibi finansal ürünler hakkında yüksek olmakla birlikte, kadın katılımcı sayısı daha fazla olmuştur, erkek katılımcıların bilgi düzeyi daha yüksek çıkmıştır. Ayrıca ankete katılan bireyler finansal bilgi konusunda önce çevresine ve banka personellerine danışmaktadır. Çalışmada ayrıca islami finansal okuryazarlık konusu da incelenmiş olup, katılımcılarda genel olarak islami finansal okuryazarlık düzeyleri son derece düşük bulunmuştur. Katılımcıların faiz konusundaki inanca yönelik algısı, faizin haram olmadığı şeklinde tespit edilmiştir. Çalışmada cinsiyet faktörü ile ankette sorulan sorular üzerinde anlamlı farklılık oluştuğu, meslek ve yaş faktörü ile anket soruları üzerinde ise anlamlı bir farklılık oluşmadığı gözlemlenmiştir."
