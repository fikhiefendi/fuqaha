abstract: "Bu çalışmada ilk olarak Osmanlı hukukundaki kavaid düşüncesinin temelleri; İslam öncesi hukuk sistemleri, İslam hukuku ve Osmanlı klasik döneminde aranmıştır. Sonrasında Tanzimat dönemi kavaid literatürü ortaya konulmuş, bu çerçevede Mecelle şerhleri, klasik kavaid eserlerinin şerh ve tercümeleri ile müstakil kavaid metinleri tanıtılmıştır. Daha sonra Tanzimat döneminde gelişen yeni hukuk sisteminde kaidelerin tezahürleri ele alınmıştır. Hukuk eğitiminin modernleşmesi sürecinde kaideler merkezi bir yer edinmiştir. Hukuki bilgi üretiminde de kaidelerin artan bir etkisi olduğu söylenebilir. İslam hukukunda değişim, modern hukuk yazım türü, yeni kaideleştirme teşebbüsleri ve siyasi-hukuki tartışmalar hukuk doktrininde kaidelerin işlevlerini görebileceğimiz alanlardır. Hukukun uygulama boyutunda eskiden beri devam eden şer'iye mahkemeleri, yeni kurulan nizamiye mahkemeleri ve bunların temyiz mahkemelerinde kaidelerin kullanımı incelenmiştir. Nihayet Osmanlı'da Türkçenin bir hukuk dili olarak gelişmesi ve hukuk kültürünün toplumun farklı katmanlarına yayılmasında kaidelerin rolü araştırılmıştır."
