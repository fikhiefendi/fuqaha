abstract: "Nübüvvet, Allah-insan arasındaki iletişimi, beşer bir elçi aracılığıyla, sağlayan bir kurumdur. Allah, nübüvvetle vahyini insanın idrak seviyesine indirgemiş, böylece hem vahyin anlaşılması hem de yaşanması sağlanmıştır. Beşer bir varlığın, Yaratıcıdan mesaj almasının keyfiyetini idrak edemeyen veya aklı kutsayarak vahyi gereksiz gören Berâhime gibi bazı ilhadî hareketler nübüvvet kurumunu reddetmişlerdir. İnkâr hareketlerine karşı nübüvvetin gerekliliğini savunan İslâm düşünürleri, nübüvveti ispat etmek amacıyla delâilü'n-nübüvve türü eserler ortaya koymuşlardır. Çalışmamızda merkeze aldığımız Mâverdî'nin A'lâmü'n-nübüvve adlı eseri, peygamberlik kurumunu savunma amacıyla yazılmış delâilü'n-nübüvve türü bir eserdir. A'lamü'n-nübüvve başta olmak üzere Mâverdî'nin diğer eserleri ve nübüvveti ispat sadedinde yazılmış klasik ve aktüel eserlerden hareketle Mâverdî'ye Göre Nübüvvetin İspatı adıyla tezimizi şekillendirdik. Öncelikle üzerinde çalıştığımız bu eser, delailü'n-nübüvve türünde yazılmış birinci el Arapça bir kaynak olduğu için eserin konumuzla ilgili bölümlerinin dilimize aktarımını yaptık. Üç bölüm halinde kategorize ettiğimiz çalışmamızın giriş bölümünde çalışmanın amacı, konusu ve metodunu ortaya koyduk. Tezin birinci bölümünde İslâm düşüncesinde nübüvvete karşı oluşmuş ilhâd akımlarını ve İslam düşünürlerinin bu akımlara karşı yaptıkları nübüvveti savunma yöntemlerini izah ettik. İkinci bölümde Mâverdî'nin üslûbu ve onun nübüvvetle ilgili kullandığı temel kavramları mütalaa ettik. Çalışmanın son bölümünde ise, Mâverdî'nin genel olarak nübüvvet kurumunu, özel olarak da Hz. Peygamber'in nübüvvetini ispatlamak amacıyla ortaya koyduğu argümanları müzakere ettik. Mâverdi'nin, nübüvvet kurumunun ispatında, akıl ağırlıklı bir metot kullandığını; Hz. Peygamber'in nübüvvetinin ispatında ise, mucize rivayetleri üzerinden nübüvvet doğrulması yaptığını tespit etik. Çalışmada Mâverdî'nin nübüvveti ispat anlayışını ortaya koyarken tasvîrî bir yöntem; nübüvveti ispat amacıyla eser vermiş diğer müellifler arasında onun konumunu tespit ederken yorumlayıcı bir yöntem tercih ettik."
