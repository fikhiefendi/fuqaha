abstract: "Çalışmanın amacı bireysel emeklilik sistemi inceleyerek 2008 sonrası uygulanmaya başlanan faizsiz bireysel emeklilik sisteminin ekonomik ve finansal açıdan işleyişinin incelenmesidir. Bu çalışma ile bilimsel kaynak sayısı oldukça sınırlı olan alanda gelecekte yapılacak olan çalışmalara kaynak teşkil etmesi amaçlanmıştır. 2/01/2008 tarihinde Resmî Gazete ile bireysel emeklilik sistemi içinde en az %30 oranında Devlet Tahvili Hazine Bonosu bulunma şartının kaldırılması ile katılım bankacılığında bireysel emeklilik sistemi doğmuştur (Kaya 2003, s.7). Faize duyarlı olan bireylerin bireysel emeklilik sistemine sisteme dahil olmak istememesi, bu bireyleri faizsiz bireysel emeklilik sistemine yönlendirmiş olup faizsiz fonlara yatırım artmıştır. 2013 yılında yürürlüğe giren katkı payı tutarına devlet katkısının bireysel emeklilik sektörüne girmesi ile birlikte faizsiz bireysel emeklilik sisteminin sektördeki payı büyümeye başlamıştır. Söz konusu büyüme eğiliminin faizsiz bankacılığın gelişmesinde etkili olacağı beklenmektedir. Faizsiz bireysel emeklilik sisteminin sektörde yeni oluşu nedeniyle konu ile ilgili sınırlı sayıda bilimsel çalışma bulunmaktadır. Bu nedenle çalışmanın literatüre katkı sağlaması beklenmektedir. Çalışmanın ilk bölümü konunun önemine ve araştırma konusuna yer verilmiştir. İkinci bölümünde, sosyal güvenlik sisteminin ortaya çıkışı ile ülkemizde ve ülkemiz dışındaki uygulamalarına yer verilerek sosyal risk ve özel sağlık sigortaları hakkında bilgiler verilmiştir. Üçüncü bölümde, bireysel emeklilik sisteminin tarihsel gelişimi, dünyada ve ülkemizdeki işleyişi, bireysel emeklilik unsurları, sistemin amaçları, bireysel emeklilik sistemine etki eden kuruluşlara yer verilmiştir. Bireysel emeklilik sisteminde devlet desteği ile ilgili açıklamalar yapılmıştır. Devlet katısının sisteme dahil edilmesinin sisteminin gelişimine etkileri belirtilmiştir. Ayrıca bu bölümde Devlet katkısının nasıl hesaplanacağı ile devlet katkısından yararlanabilecek bireylere ilişkin bilgiler yer almaktadır. Çalışmanın dördüncü bölümünde, faizsiz fonlar hakkında bilgi verilmiştir. Bireysel emeklilik sistemindeki faizsiz fonlar ve bu fonların hangi şirketler tarafından nasıl kullanıldığı belirtilmiştir. Beşinci bölümde ise, 2008 sonrası faizsiz bireysel emeklilik sisteminin etkilerine yer verilmiştir."
