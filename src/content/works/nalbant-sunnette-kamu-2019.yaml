abstract: "Bu çalışma, Sahîhayn'daki ilgili rivayetler bağlamında Hz. Peygamber'in sünnetinde kamu maliyesini konu almaktadır. Çalışmanın birinci bölümünde; Sahîhayn'da kamu maliyesi konusunun işlenişi değerlendirilmektedir. İkinci bölümde; Hz. Peygamber devrindeki kamu maliye teşkilatı ortaya konmaktadır. Üçüncü bölümde; kamu maliyesinin gelirleri olan zekât, ganimet, fey ve cizye, bu gelirlerin şartları ve ayrıntılarını beyan eden sünnet ekseninde incelenmektedir. Dördüncü bölümde; kamu maliyesinin Kur'an tarafından bildirilen harcama yerleri, sünnetin bunları beyanı ve yine sünnete dayanan maliye harcamaları tetkik edilmektedir. Beşinci ve son bölümde ise; Hz. Peygamber'in kamu maliye uygulamalarında ortaya koyduğu prensiplerden bazıları tespit edilmeye çalışılmaktadır. Sahîhayn'daki kamu maliyesiyle ilgili rivayetler alınarak; Kur'an-ı Kerîm ayetleri, tefsir, hadis, fıkıh ve tarih kaynakları ile bu konu üzerine yapılmış diğer çalışmalar yardımıyla Hz. Peygamber'in konu hakkındaki sünneti anlaşılmaya çalışılmaktadır."
