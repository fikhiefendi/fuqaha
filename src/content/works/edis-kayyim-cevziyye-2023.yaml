abstract: "İbn Kayyim el-Cevziyye (v. 751/1350) XIII. asrın fıkıh, akâid, tefsir, dil, tarih ve tasavvuf alanlarında mütehassıs, çok yönlü önemli bir İslâm âlimidir.“Zamanın harikası”adıyla anılabilecek nitelikte kendisini geliştirmiş, ibadete düşkün, yetkin bir şahsiyettir. Gazâlî'den (v. 505/1111) etkilenen İbn Kayyim, onun gibi ihyâ projesine çaba sarf ederek çağındaki bozulmalara karşı hocası ve yoldaşı İbn Teymiyye (v. 728/1328) ile mücadele etmiştir. İbn Kayyim'in ilmi ve ameli yöntemi; Allah'ın kelamına, kelamına muhatap olan Hz. Muhammed'e (s.a.v), onun ilk varisleri olan ashabına ve onları takip edenlere dayanmaktadır. İbn Kayyim, döneminde ortaya çıkan yozlaşma emarelerine karşı selef-i salihînin uygulamalarının kendi çağına aktarılması ve uyarlanması fikriyle çözüm aramaktadır. Bunu yaparken de örf, zaman ve şartların değişiminin göz önünde bulundurulması gerektiğini vurgulamaktadır. İbn Kayyim, tasavvufu İslâm'ın dışında değerlendirmeye çalışan ve tasavvufu özünden uzaklaştırarak istismar etmeye çalışanlara karşı Kur'ân ve Sünnet kaynaklı tasavvuf refleksi geliştirmektedir. Bunu yaparken fıkıhta uyguladığı temellendirme çabasını tasavvufa da teşmil ederek tasavvufa dair söz ve eylemleri Kur'ân'a, Sünnet'e ve ilk dönem zâhidleri ile sûfîlerine arz etmektedir. İbn Kayyim'in fıkıhla sıkça anılması onun tasavvufî yönünü gölgelemekte; bid'atlara karşı sert duruşu ve bazı tasavvufî meselelere eleştirisinin tasavvufun bütününe hamledilmesi de onun tasavvufu reddettiği kanısına sebebiyet vermektedir. Halbuki o; sûfî olmamasına rağmen tasavvufu olumlu ve olumsuz yönleriyle nitelikli bir şekilde açıklamakta, fıkhî yönüyle delillendirmekte, akîdevî yönüyle savunmakta, tarihçi yönüyle tasavvufun arka planını serdetmektedir. Bu çalışma, özellikle eserlerinden hareketle İbn Kayyim'in tasavvufa müspet ve menfi bakış açısını delilleriyle sunmayı hedeflemektedir. Ayrıca çalışmada; onun tasavvufa yaklaşımını şekillendiren coğrafya, siyasi-sosyal yapı, ilmi çevre, eserlerinde yer verdiği sûfîler ve tasavvufa dair kavramlar incelenmektedir. Yine çalışmada, Herevî'nin (v. 481/1089) Menâzilü's-sâirîn'e eleştirel şerhi ve başat tasavvuf eseri olan Medâricu's-sâlikîn eserinin tüm menzilleri ile seyr u sülûkun inceliklerine dair paylaştığı görüşleri değerlendirilmektedir. Onun tasavvufta eleştirilerine konu olan, vukuf ettiği, mazur gördüğü ve tevhîde aykırı bulduğu hususlar da ayrıca serdedilerek tasavvufa yaklaşımı sunulmaya çalışılmaktadır."
