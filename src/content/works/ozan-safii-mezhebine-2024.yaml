abstract: "Bağy (isyan) İslâm fıkhında siyasi suçlar kategorisinde kabul edilen bir suç çeşididir. Bağy suçu meşru devlet başkanına karşı bir başkaldırıdır. Bu fiil ile siyasi iktidarın zayıflatılması, yıkılması veyahut da değiştirilmesi amaçlanmakta ve bu doğrultuda siyasi iktidara karşı güç kullanılarak istenilen hedefe ulaşılmak istenmektedir. İslâm Fıkhında bu fiilin cezası ağır olmakla birlikte devletin düzenini değiştirmeyi hedeflemeyen, ona karşı ayaklanmaya girişmeden veya çatışmalara sebebiyet vermeden sözlü olarak devlet başkanının yanlışlarını söylemek ve eleştiride bulunmak“bağy”suçuna dâhil edilmez. Bir fiilin bağy suçuna dâhil edilebilmesi için devlete karşı güç kullanarak yönetimi değiştirmeyi veya devleti yıkmayı hedeflemesi gerekmektedir. Tez çalışmamız, Şâfiî mezhebine göre bağy ahkâmını ele almakla beraber, diğer Sünni mezheplerin bağy ile ilgili görüşlerine de yer verilmiştir. Bu bağlamda birinci bölümünde, üç mezhebin bağy hakkındaki görüşleri incelenmiştir. İkinci bölümde ise, Şâfiî Mezhebinde bağy konusu tüm detaylarıyla birlikte sunulmuştur. Bu bölüm dört temel başlık altında değerlendirilmiştir. Bunlar;“Genel Olarak Bağy”,“Bağy Mensuplarına Karşı Yapılan Savaş Ahkâmı,”“Bağy mensuplarıyla İlgili Mal ve Can Ahkâmı”ve“Bağy Mensuplarıyla İlgili Esir ve Cenaze Ahkâmı”konularıdır. Bu başlıklara bağlı olarak da bağy ile irtibatlı birçok meseleye değinilmiştir."
