abstract: "Muvatta, hadis ve fıkhı mezcetmesi ve İmam Malik gibi büyük bir âlimin eseri olması açısından kıymetli bir konuma sahiptir. Bu kıymetli eser birçok yönü ile yazıldığı günden bu zamana kadar incelenmiş ve araştırmalara konu olmuştur. Çalışmamızda bu kıymetli eserin bab başlıklarının tahlili yapılmıştır. Ale'l-ebvâb metodu ile tasnif edilmiş bir eserin bab başlıkları müellifi anlama ve yorumlamada büyük imkân sağlamaktadır. İmam Malik gibi büyük bir âlimin, eserini rastgele tasnif etmediği ve bab başlıklarını da belirli bir düzen ve amaca göre oluşturduğu açıktır. Dolayısıyla bu bab başlıklarını incelemenin İmam Malik ve eseri Muvattaı daha iyi anlamaya vesile olacağı izahtan vârestedir. Giriş ve sonuç kısımları dışında üç bölümden oluşan çalışmamızda, birinci bölümde bab başlığı geleneği ve Muvatta kitabının tanıtımı yapılmıştır. Bab başlığı geleneğinin ne zaman ve kim tarafından, hangi eserde ortaya çıktığına dair rivayetler incelenmiş ve değerlendirilmiştir. Muvatta'ın tanıtımında ise genel bilgiler verilmiş ayrıca eser hakkındaki tartışmalı konularda değerlendirmeler yapılmıştır. İkinci bölümde ise Muvatta'ın bab başlıklarının genel özellikleri ve İmam Malik'in fıkıh metodunun bab başlıklarına nasıl yansıdığı araştırılmıştır. Bab başlıkları, kullanılan lafızlar, kullanılan kaynaklar gibi yönleri ile incelenmiş ve tespit edilen durumlar örneklerle gösterilmiştir. İmam Malik'in, fıkıh metodolojisinde kaynak olarak kullandığı delillerin bab başlıklarına nasıl yansıdığı tespit edilmeye çalışılmıştır. Üçüncü bölümde ise Muvatta nüshaları arasındaki bab başlığı farklılıkları konusu işlenmiştir. Ulaşabildiğimiz bütün Muvatta nüshalarının başlıkları incelenerek farklılıklar tespit edilmeye çalışılmıştır. Elde edilen tespitler, başlıklar altında maddeler halinde gösterilmiştir. Sonuç kısmında da araştırmamız neticesinde ortaya çıkan önemli hususlara kısaca değinilmiştir"
