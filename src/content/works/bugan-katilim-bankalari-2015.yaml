abstract: "Son yıllarda çok sık yaşanılan finansal sistem krizleri nedeniyle alternatif arayışları artmaya başlamış ve bu doğrultuda İslami finans, hem Dünyada hem de Türkiye'de ilgi odağı haline gelmiştir. Türkiye'de ilk olarak özel finans kurumları adıyla kurulan ve günümüzde katılım bankaları olarak faaliyet gösteren bu kuruluşlar, faiz esası yerine kar-zarara katılım esasına göre çalışmaktadırlar. Aktif büyüklüğü bankacılık sektörünün %5,5'ini oluşturmaktadır. Çalışma, katılım bankalarının, konvansiyonel bankalara göre kaynaklarını etkin kullanıp kullanmadığını tespit etmeyi amaçlamaktadır. Bu doğrultuda, Türkiye' de faaliyet gösteren mevduat ve katılım bankalarının, 2006-2012 yılları arasındaki etkinlik performansı veri zarflama analizi ile ölçülmüştür. Etkinlik düzeylerinin yıllar itibariyle değişimini analiz etmek için Malmquist TFV Endeksi kullanılmıştır. Yapılan analiz sonucunda, katılım bankalarının konvansiyonel bankalara göre kaynaklarını daha etkin kullandığı tespit edilmiştir."
