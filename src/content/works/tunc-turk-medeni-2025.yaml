abstract: "743 sayılı Türk Kanunu Medenisi'nin yürürlüğüyle birlikte bu kanunun yürürlüğünden önce kurulan vakıflar ile sonra kurulan vakıflar ayrı hukuki düzenlemelere tabi tutulmuştur. Söz konusu kanunun yürürlüğünden sonra kurulan vakıflar yeni vakıf olarak tabir edilmiştir. Bu vakıfların hukuki esasları ilk olarak 743 sayılı Kanuna, bu kanunun ilgasından sonra ise 4721 sayılı Türk Medeni Kanunu hükümleriyle birlikte 5737 sayılı Vakıflar Kanunu hükümlerine tabi tutulmuştur. 743 sayılı kanunun yürürlüğünden önce kurulan vakıflar eski vakıf olarak ifade edilmiş ve öncelikle 2762 sayılı Vakıflar Kanunu, bu kanunun ilgasından sonra ise 5737 sayılı Vakıflar Kanunu hükümlerine tabi tutulmuştur. Eski vakıflar, İslam/Osmanlı hukuk düzeninden Türk hukuk düzenine intikal etmiş vakıflar niteliğindedir. Zürri vakıflar, bu nitelikte bir eski vakıftır. Bu vakıflar 5737 sayılı Vakıflar Kanunu'na göre mazbut ya da mülhak vakıf niteliğindedir. Zürri vakıflarda vakıf malvarlığının gallesi anlamına gelen geliri, vakfedenle kan bağı ilişkisi içinde olan birtakım kimselere şart koşulmaktadır. Bu kimselerin lehlerine şart koşulan galleden yararlanması ise Türk hukukunda dava açma şartına bağlanmıştır. Bu davaya uygulamada galleye müstehak vakıf evladiyetinin tespiti davası denmekle birlikte çalışmamızda bu dava galle üzerinde hak sahipliği davası olarak isimlendirilmiştir. Bu dava, çalışmamızda zürri vakıflar temelinde inceleme konusu yapılmıştır. Bu kapsamda çalışmamızın ilk temel araştırması zürri vakfın hukuki yapısı üzerinde olmuştur. Bu doğrultuda zürri vakıf kavramı, hukuki niteliği, kuruluşu ve unsurları bu vakıfların kaynağı olan İslam hukukuna görev incelenmiştir. Çalışmamızın ikinci ana araştırması vakfın gallesi ve Türk hukukunda bu galleden yararlanma şartları üzerinde yapılmıştır. Bu kapsamda ayrıca galleden yararlanma kapsamındaki vakfiye şartları değerlendirilmiş ve bu bağlamda vakfiyenin yorumu ele alınmıştır. Çalışmamız kapsamındaki son ana inceleme ise galle üzerinde hak sahipliği davası üzerinde yapılmıştır. Bu dava hukuki nitelik, konu, taraflar, deliller, esasa ilişkin inceleme, hüküm ve sonuçlar bakımından incelenmiştir."
