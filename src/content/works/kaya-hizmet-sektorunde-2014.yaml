abstract: "Günümüzde her alanda rekabetin var olması, işletmelere pazarda üstünlük sağlama arayışına yöneltmiş olup, bu üstünlüğü sağlamanın en temel yolu ilişkisel pazarlamadan geçmektedir. Çünkü hizmet sektöründe müşteriyle kurulan uzun dönemli, yakın ve bire-bir ilişkiler müşteri memnuniyeti ve sadakati yaratma açısından kilit öneme sahiptir. Bu çalışmada kullanılan veriler, anket yöntemi kullanılarak elde edilmiştir. Veriler, faktör analizi ile \"memnuniyet ve sadakat'' olmak üzere iki faktör altında toplanmıştır. Her bir faktör için elde edilen verilerin güvenilirliğini belirlemek amacıyla güvenirlik analizi yapılmış ve analiz sonucunda verilerin güvenilir olduğu belirlenmiştir. Müşterilerin, memnuniyeti ve sadakatinin demografik özellikleri ile ilişkileri değerlendirilmiştir. Bu değerlendirme sonucunda; müşteri memnuniyeti, cinsiyet ve gelir grupları arasında farklılık gösterirken; müşteri sadakati ise; yaş grupları, gelir grupları ve meslek grupları arasında farklı bulunmuştur."
