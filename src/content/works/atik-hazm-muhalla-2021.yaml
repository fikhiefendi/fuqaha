abstract: "Bu çalışmamızda, Zahiri Mezhebi'nin ikinci kurucusu olarak kabul edilen Endülüslü fakih İbn Hazm'ın telif etmiş olduğu Mukayeseli İslam Hukuku olarak bilinen el-Muhallâ adlı eserinde Ceza Hukukuyla ilgili konularda İmam Şâfiî'ye nispet edilen görüşlerin isabetli olup olmadıklarının araştırılması amaçlanmıştır. Eserin mukayeseli hukuk türünden yazılmış olması ve bu tür eserlerde ihtiva eden karşıt görüşlerde hataların bulunması bizi araştırmaya sevk etmiştir. Çalışmamız bir giriş ve iki bölümden oluşmaktadır. Giriş kısmını araştırmamızın konusu, amacı ve önemi, metodu ve kaynakları oluşturmaktadır. Çalışmamızın birinci bölümünde eserin müellifi olan İbn Hazm'ın hayatı, hocaları, talebeleri, ilmî hayatı, fıkhî metodu ve had cezaları ile ilgili görüşlerine yer verilmiştir. Ayrıca telif etmiş olduğu eserleri hakkında kısa bilgi ve çalışmamızın asıl konusu olan el-Muhallâ adlı eseri hakkında da detaylı bilgi verilmiştir. Çalışmamızın ikinci bölümünde ise İbn Hazm'ın el-Muhallâ adlı eserinde Ceza Hukukuyla ilgili konularda İmam Şâfiî'ye nispet etmiş olduğu görüşlerin isabetli olup olmadığı ve hatalı olarak nispet edilen görüşlerin de doğru olanı Şâfiî mezhebinin temel kaynaklarına müracaatla tespit edilmeye çalışılmıştır. Çalışmamız sadece İmam Şâfiî ve Şâfi mezhebine nispet edilen görüşlerin incelemesi üzerine olduğundan İbn Hazm'ın diğer mezhep imamlarına nispet ettiği görüşler bu çalışma dahilinde değildir. İbn Hazm'ın el-Muhallâ adlı eserinde İmam Şâfiî'ye ceza hukuku bağlamında 113 görüşün atfedildiği tespit edilmiştir. Şâfiî mezhebinin temel kaynaklarına müracaat edilerek yapılan incelemer sonucunda nispet edilen 113 görüşten 107 görüşün isabetli 6 görüşün de hatalı olduğunu görülmüştür. Hatalı olan görüşler ise kısas (1), diyet (2), diyetin çeşitleri (2) ve zina (1) bahislerinde yer almaktadır. Çalışmamızın sonuç kısmına elde edilen önemli bulgular derlenmiş, ayrıca değerlendirilmesi kolaylık olsun tespit edilen hatalar sıralanmış ve doğru olan karşılıkları da verilmiştir."
