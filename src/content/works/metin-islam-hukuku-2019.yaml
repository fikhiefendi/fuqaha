abstract: "Sporun önemli bir bölümünü oluşturan savunma ve dövüş sporları; kişiye savunma ve saldırı kabiliyet kazandıran birçok sporu kapsamaktadır. Günümüzde uygulanırlığı ve seyirci kitlesi fazla olan bu sporların İslam Hukuku açısından durumu çeşitli tartışmaları oluşturmaktadır. Bedene ve yüze vurulması, yaralanma, kalıcı hasar ve ölüm riski taşımaları, olumsuz psikolojik etkileri, insanın izzet ve onurunun zedelenmesi, müsabaka koşul ve ortamları, başka inançlara ait unsurlar barındırması ve kadınlardaki olumsuz etkileri sebebiyle caiz olmadığını yönünde görüşler belirtilmektedir. Öte yandan sağlığa katkıları, yetenek, kuvvet ve dayanıklılık kazanımı, olumlu psikolojik etkileri, sosyal kazanımlar sağlaması, gençleri kontrol ve muhafaza imkânı sunması ve tebliğdeki fonksiyonu sebebiyle de olumlu karşılanmaktadır. Yaptığımız değerlendirmede savunma ve dövüş sporlarının müsabaka ve eğitim boyutlarının ayrı değerlendirmelerinin gerektiği ortaya çıkmaktadır. İslamın genel spor kurallarına tabi olmakla beraber eğitimlerinin caiz olduğu, müsabakaların ise korumalıklı ve sertlik düzeyinin hafif olduğu türlerinde bir sakınca olmadığı, korumalıksız ve sert vuruşlu olanlarının ise caiz olmadığı neticesi ortaya çıkmaktadır."
