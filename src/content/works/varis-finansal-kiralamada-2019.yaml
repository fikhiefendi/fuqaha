abstract: "Katılım bankacılığı konvansiyonel bankacılığa göre riskinin az olmasından dolayı daha avantajlıdır. Bu çerçevede Katılım bankacılığının fon kullandırma yöntemlerinden olan leasing işlemi işletmeler açısından vergi avantajı, kiralama maliyetinin düşük olması, riskin daha sınırlı olması, yabancı kaynak gereksinimini azaltması, teknolojiyi yakından takip etme ve likiditelerini daha karlı alanlarda kullanmaları açısından çok önemlidir. Leasing, yatırıma konu olan bir malın mülkiyeti kiralama şirketinde kalarak, sözleşme de belirlenen kiralar karşılığında kullanım hakkının kiracıya verilerek, sözleşme süresi sonunda mülkiyet hakkının kiracıya geçmesini sağlayan bir finansman yöntemidir. Katılım bankacılığında finansal kiralamanın etkinliği son yıllarda daha fazla artmıştır. Finansal kiralamanın sağladığı avantajlarının verimliliği arttıkça işletmeler tarafından daha çok kullanılan bir yöntem olmuştur. Bu kapsamda çalışmamızın amacı, Finansal kiralamanın Türk katılım bankacılığındaki yerinin araştırılmasıdır. Öncelikle katılım bankacılığının dünyadaki ve Türkiye'deki gelişimi incelenmiş, daha sonra finansal kiralamanın tanımı, gelişimi, avantajları Türkiye'de finansal kiralama da kullanılan ürünler, finansal kiralamanın katılım bankacılığındaki yıllara göre gelişimi araştırılmıştır. Katılım bankacılığı sektöründe finansal kiralamanın diğer sektörlere göre daha avantajlı kaynaklar sağladığı ve etkinliğinin giderek arttığı sonucuna ulaşılmıştır."
