abstract: "Bu araştırmada, din sosyolojisi perspektifinden, katılım bankacılığı ve din ilişkisi, teorik, tarihsel ve empirik olarak ele alınmıştır. Araştırmanın teorik düzleminde, katılım bankacılığı ve din ilişkileri sosyolojik kuramlar bağlamında değerlendirilmiş; bu bağlamda en uygun açıklamaları sağlayacağı düşünülen Max Weber'in kapitalizm, Talcott Parsons ve Robert Merton'un yapısal işlevselci kuramları tercih edilmiştir. Bu kuramlar çerçevesinde, mikro düzeyde katılım bankacılığını kullanan bireylerin ekonomik pratiklerinde dinin nasıl bir rol oynadığı ve makro düzeyde katılım bankacılığının toplumsal ve dini açıdan hangi işlevleri karşıladığı sorularına cevap aranmıştır. Araştırmanın ikinci bölümünü oluşturan tarihsel perspektifte ise Dünya'da ve Türkiye'de katılım bankacılığının ortaya çıkışında etkili olan toplumsal, siyasal, ekonomik ve dini faktörler problem edinilmiştir. Araştırmanın bu bölümünde, Osmanlı Devleti'nden günümüze faizsiz finans kurumlarında meydana gelen süreklilik, değişim ve dönüşümlerin tespit edilmesi amaçlanmıştır. Araştırmanın uygulama bölümünde, katılım bankacılığına yönelik tutumların sosyo-ekonomik değişkenlere göre farklılaşma durumu temel problem olarak belirlenmiştir. Araştırmada, nicel araştırma tekniklerinden yüz yüze yapılandırılmış mülakat ve çevrimiçi anket teknikleri birlikte kullanılmıştır. Çalışmanın örneklemini, İzmir merkezde ikamet eden ve katılım bankacılığı müşterisi olan 321 kişi oluşturmuştur. Araştırma verileri, katılım bankacılığı ve din ilişkilerini çözümlemeye yönelik geliştirilen 2 ölçek ile toplanmıştır. Hazırlanan ölçeklerin yapı geçerliliği, açımlayıcı ve doğrulayıcı faktör analizi ile teste tabi tutulmuştur. Geliştirilen ölçek ile toplanan verilerin analizinde t-testi ve Anova testleri kullanılmıştır. Araştırma neticesinde, katılım bankacılığı olgusunun, salt ekonomik değerlendirmeler ile açıklanamayacağı, katılım bankacılığının kurulmasının ve gelişmesinin arkasında yatan toplumsal, siyasal ve dini bağlamların ne derece önemli olduğu anlaşılmıştır. Araştırmanın uygulama bölümünde elde edilen veriler, katılım bankacılığına yönelik tutumların sosyo-ekonomik değişkenlere göre farklılaştığını açığa çıkarmıştır. Özellikle bireylerin din algısının, katılım bankacılığına yönelik ekonomik pratiklerini etkileyen en önemli faktör olduğu bulgusuna ulaşılmıştır."
