abstract: "Ehl-i re'y ve ehl-i hadîs kavramlarının mahiyetine ve bu iki ifadeyle kimlerin kastedildiğine dair tartışma Hicri üçüncü asırdan itibaren devam etmektedir. Bu çalışmada, ehl-i hadîs ve ehli re'y kavramının Hicri ikinci asırda kaleme alınan eserlerde yer alıp almadığı, zikredilmişse hangi anlamlarda kullanıldığı ve erken dönem hüküm/fıkıh içerikli eserlerde bu ayrımın nasıl bir karşılığının olduğu konu edilecektir. Böylece erken dönem fıkıh anlayışında âlimler tarafından iki farklı üslup ve yöntemin kullanıp kullanılmadığı ve fıkhın erken dönem oluşumunda iki farklı edebiyatın ve dolayısıyla iki tür yaklaşımın olup olmadığı ortaya çıkmış olacaktır."
