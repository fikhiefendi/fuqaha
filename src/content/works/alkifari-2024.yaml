abstract: "Bu çalışma Şeyh Salman el-Avde'nin sahip olduğu bilimsel konumu ve onun ortaya koyduğu bilimsel içtihatları ele almaktadır ve bu çalışma Şeyh Selman El Avde'nin İslam ekonomisi konularındaki vizyonunu yöneten metodolojik ve temel yönü bilmeyi ve Şeyh Selman El Avde'nin İslam ekonomisi ile ilgili bilimsel yönlerde oynadığı rolleri ortaya çıkarmayı amaçlamaktadır ve bu çalışmanın amacına ulaşmak için yapılan araştırma, Şeyh Selman El Avde'nin İslam ekonomisindeki performansını izlemeye dayanan tümevarım yöntemine dayanmaktadır ve Şeyh'in makalelerini ve içtihatlarını belirlemeye dayanan betimsel yaklaşımı kullanmıştır. Bu çalışma, Şeyh Salman Al-Avde'nin özellikle İslam ekonomisi alanında birçok yenilikçi tez ve içtihada sahip olduğunu ve bu içtihatların teori ve pratiği birleştirerek İslam ekonomisi alanında yeni ufuklar açılmasına ve İslam ekonomisi ile ilgilenmenin gelişmesine yardımcı olduğunu ortaya koymuştur. Bu çalışma, araştırmacılara alimlerin ve reformcuların çabalarını incelemelerini, onları öne çıkarmalarını ve statülerini duyurmalarını ve İslam ekonomisi alanındaki pratik girişimlere ve içtihadi tezlere odaklanmalarını tavsiye etmektedir."
