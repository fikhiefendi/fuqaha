abstract: "Tashîhu'l-ukûd, genel itibariyle muâmelât akitlerinin mümkün olduğu kadar geçerli kabul edilmesini ifade eden bir kavramdır. Söz konusu kavram doktora çalışmamızda Hanefi mazhebi bağlamında ve mâlî muâmelât alanı özelinde ele alınmıştır. Tashîhu'l-ukûd'un Hanefi mezhebinde genişçe kabul gören bir yaklaşım biçimi olduğu temellendirilmiş ve bu yaklaşımın pratiğe yansıması olan tashih yöntemleri üzerinde durulmuştur. Çalışmamız bir giriş ve dört bölümden oluşmaktadır. Giriş kısmında konumuzun fıkıh ilmindeki yeri, sınırlandırılması, çalışmanın önemi ve amaçları ile araştırmanın kaynakları incelenmiştir. Birinci bölümde kavramsal çerçeve üzerinde durulmuş, Hanefi fıkıh kaynaklarında yer alan tashihle ilgili ifade kalıpları incelenmiş ve genel bir kavramsal analiz yapılmıştır. İkinci bölümde tashîhu'l-ukûd teorisinin mahiyeti, özellikleri ve genel şartları ortaya konmuş, üçüncü bölümde ise tashîh düşüncesinin tarihi arka planı incelenmiştir. Çalışmamızın son bölümünde ise fürû fıkıh örneklerinden hareketle tespit edilen dört yöntemin araştırılmasına yer verilmiştir. Ayrıca her yöntemin sonunda ilgili yöntem vasıtasıyla sıhhate yorumlanabilecek birtakım güncel problem örneklerine de kısaca yer verilmiştir. Anahtar kelimeler: tashîhu'l-ukûd, Hanefi mezhebi, malî akitler, istihsân, tarîku'l-i'tibâr, iktizâ, izâletü'l-müfsid."
