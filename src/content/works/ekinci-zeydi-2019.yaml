abstract: "Zeydî fıkhının gelişim sürecinde İmam Hâdî ve Hâdeviyye'nin ele alındığı bu çalışmada, Zeydiyye mezhebinin temel görüşleri ile Zeydî fıkhının gelişim süreci ele alınmış ve Zeydî fıkhına önemli katkıları olan İmam Hâdî ile kendisine nispet edilen Hâdeviyye fıkhı araştırılmıştır. Bu amaçla yaptığımız çalışma bir giriş, üç bölüm ve sonuçtan oluşmaktadır. Giriş bölümünde öncelikle araştırmanın önemi ile amacı üzerinde durulmuş, kapsamı belirlenmiş ve konuyla alakalı kaynaklar ile bu alanda yapılmış çalışmalara yer verilmiştir. Birinci bölümde, Zeydiyye'nin tanımı ve temel görüşleri ortaya konmaya çalışılmış, ardından Zeydî fırkaların tanıtımına, fıkıh düşüncelerine ve şer'î kaynak anlayışlarına yer verilerek Zeydî fıkhının karakteristik özellikleri tespit edilmiştir. Daha sonra Zeydî fıkhının tarihsel süreci ile İmam Hâdî'ye kadar Zeydî fıkhına katkı sağlamış olan başlıca Zeydî fakihlere ve mezhebin başlıca delillerine yer verilmiştir. Ayrıca Zeydî-Hanefî etkileşimi konusundaki tartışmalar da değerlendirilerek İmam Hâdî öncesine kadarki süreç tamamlanmıştır. İkinci bölümde, ilk olarak İmam Hâdî'nin yaşadığı ortamı yansıtmak üzere Abbâsiler döneminde siyasî ortam ve Zeydî kalkışmalar ile İmam Hâdî öncesi Yemen'de siyasî ortam ve ilmî durum hakkında bilgiler verilerek dönemin portresi çizilmiştir. Ardından İmam Hâdî'nin hayatı, ilmî kişiliği, imâmeti ve Zeydî fıkhındaki yeri ortaya konmaya çalışılmıştır. Bu bağlamda onun nesebi, doğumu çocukluğu, ilim tahsili, hocaları, öğrencileri hakkında bilgiler verilmiştir. Daha sonra İmam Hâdî'nin imâmetini ilan edişi, Taberistan ile Yemen'e gidişi ve vefatı ele alınmıştır. Son olarak İmam Hâdî sonrası Yemen hakkında kısaca bilgi verildikten sonra İmam Hâdî'nin Zeydî fıkhındaki yeri tespit edilmeye çalışılmıştır. Üçüncü bölümde ise Hâdevî fıkhının kurucusu İmam Hâdî'nin fıkıh alanında kaleme aldığı ve fıkıh konularının tamamını kapsayan aynı zamanda Hâdevî fıkhının ilk kaynağı sayılan el-Ahkâm adlı eser tanıtılarak bu eser üzerinden Zeydî-Hâdevî fıkhının delil anlayışı ve ictihad yöntemi ile mezhebin karekteristik özellikleri ortaya konmuştur. Bu bağlamda bazı örnekler üzerinden Hâdevî fıkhı ile Hanefî, Mâlikî, Şâfiî, Hanbelî ve Câ'ferî mezhepleri arasında bir karşılaştırma yapılmıştır. Ayrıca okuyucuların Hâdevî fıkhı hakkında genel bir bilgi edinmeleri için ibâdet, muâmelât ve ukûbat konularında İmam Hâdî'nin bazı görüşlerine yer verilmiştir. Araştırma sonucu elde edilen bulgular ve bu alanda yapılabilecek çalışmaların yer aldığı \"Sonuç\" bölümü ile çalışma sona erdirilmiştir. Anahtar Kelimler: Zeydiyye, Zeydî fıkıh, İmam Hâdî, Hâdeviyye, Yemen."
