abstract: "Usûl konularını ele alan ilk eser olan Şâfiî'nin (ö.204) Risale'sinden sonra ilgili alanda yaşanmış gelişmeler ile ilgili bir boşluk gözlemlenmektedir. Bu çalışmadaki amacımız \"kayıp halka\" veya \"karanlık çağ\" denilen bu döneme bir nebze olsun ışık tutmaktır. Bu dönemin karanlık veya kayıp olarak isimlendirilmesinin sebebi, döneme ait yazılmış eserlerin elimize ulaşmamış olmasıdır. Bu çalışmada, Şâfiî ve sonrasındaki yaklaşık iki asırlık zaman içinde yaşanan gelişmeleri konu olarak ele aldık. Çalışmamızda III. ve IV. asırlar arasındaki usûl ilmi ile ilgili gelişmeleri tespite çalıştık. Bunu gerçekleştirmek için üç aşmalı bir yol takip ettik: Çalışmamızın birinci aşamasında söz konusu dönemdeki usûl ile ilgili literatürü ortaya koymaya çalıştık. Çalışmamızın ikinci aşamasında, iki dönem arasındaki kavramsal gelişimlerin düzeyini tespit etmek için Şâfiî'nin Risâle'si ile Cessâs'ın (ö.370) Fusûl'ünü karşılaştırdık. Çalışmamızın ana ve son aşamasında ise iki dönemin usûlcülerinin görüşlerini, günümüz usûl eserlerindeki sistematiği esas alarak, detaylı bir şekilde inceledik. Bu bölümde özellikle Zerkeşî'nin (ö.794) kronolojik ve ansiklopedik tarzda yazılmış eseri el-Bahru'l-Muhît'i esas aldık. Anahtar Sözcükler Şâfiî, Risâle, Cessâs, Fusûl, Tedvîn, Usûl, III-IV. asırlar."
