abstract: "İslâm iktisadının, kendisini seküler iktisadî sistemlerden ayırıp kendine mahsus bir disiplin haline getiren ilkeleri bulunmakta ve adalet ilkesi bu ilkelerin en önemlilerinden birini oluşturmaktadır. Adalet olgusu, önemine binaen İslâm iktisadına dair kaleme alınan eserlerde sıklıkla vurgulanmakla birlikte ilgili kaynaklarda bu kavramın mahiyetine ve nasıl temellendirildiğine dair yeterli bilgi verilmediği görülmektedir. Tezimiz, adalet kavramını, kısmen felsefe/hukuk felsefi, daha çok kelam ve İslâm hukuku disiplinleri bağlamında ele alarak, -İslâm iktisadı özelinde- adalet ilkesinin mahiyetini ve temellendirilmesini ortaya koyabilmeyi ve böylece ilgili kavram hakkında okuyucuya bütünlüklü bir perspektif sağlayabilmeyi hedeflemektedir."
