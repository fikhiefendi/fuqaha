abstract: "Osmanlı Devleti, yüzyıllarca dünyaya hükmeden ve tarihe damgasını vuran devletlerden biridir. Bu nedenle Osmanlı Devleti, yerli ve yabancı birçok bilim adamının araştırmalarına konu olmuş bir tarih denizidir. Osmanlı Devleti araştırmalarında İstanbul, Edirne ve Bursa gibi şehirler üzerine yapılan çalışmaların yoğunlaştığı görülmektedir. Bu noktadan hareketle Osmanlı Devleti‟nin doğusundaki en eski şehirlerden biri olan Diyarbekir hakkında yapılan bu çalışmanın literatüre önemli katkıda bulunması öngörülmektedir. Bu çalışmada Diyarbekir ilinin sosyo-ekonomik yapısı 3828 numaralı Şer‟iye Sicili esas alınarak incelenmeye çalışılmıştır. Çalışma dâhilinde Osmanlı Devleti‟nde Diyarbekir yönetimi hakkında bilgi verilmiş, ayrıca şehrin idari yapısı bu sicile göre sıralanmıştır. Mahalleler, camiler, kiliseler, manastırlar, hanlar, çarşılar, hamamlar, vakıflar, okullar, medreseler gibi şehirde bulunan sosyo-kültürel eserler incelenmiştir. Bu eserler, dönemin Diyarbekir şehrinin görünümünü ortaya çıkarmıştır. Çalışmada Diyarbekir‟deki aile yapısı, kadın hakları, Müslüman ve gayrimüslimlerin sıklıkla kullandıkları isim ve lakaplar ile bunlar hakkında bilgiler sunulmaktadır. Ayrıca Diyarbekir şehrinin kültürel yapısı, Müslüman ve gayrimüslimlerin yaşamları, inançları, meslekleri ve toplumsal düzendeki yerleri hakkında bilgi verildi. Bütün bunlar için 3828 Numaralı Şer‟iyye Sicili kullanıldı. Diyarbekir ilinin nüfusu hakkında bilgi verilmiştir. Bu bilgilere ek olarak Diyarbekir şehrinin bu dönemdeki ekonomik tablosu tarım, ticaret, el sanatları, hayvancılık, su yolları, nehirler ve nehir taşımacılığı gibi alanlara da yansımıştır. İncelenen yıllarda Diyarbekir‟in ticari hayatının eskisi kadar olmasa da halen canlı olduğu gözlemlenmiştir."
