abstract: "Bu çalısmada, Ebu Bekir Razî el-Cassas'ın ?Ahkâmu'l-Kur'ân? adlı tefsiri ile Elmalılı M. Hamdi Yazır'ın ?Hak Dini Kur'an Dili? adlı tefsirinin fıkhî tefsir baglamında karsılastırmaları yapılmıstır. Kanaatimizce Ahkâmu'l-Kur'ân gibi tefsir literatüründe çok önemli bir yeri olan klasik bir eserin Hak Dini Kur'an Dili gibi bir eserle karsılastırılıp çalısılması bu tefsirlerin Hanefi tefsir gelenegi içinde tipik eserler olması bakımından önem arz etmektedir. Arastırma konumuzla ilgili eserler incelenmis, konumuzla ilgili uzman kisilerle istisare edilmis ve böylece ulasılan neticelerin tartısma yoluyla degerlendirilmesi yapılmıstır. Bu çalısmada öncelikli olarak fıkhî tefsir ekolü ve Ahkâmu'l-Kur'ân kavramlarının üzerinde durulmus, daha sonra üç bölüm halinde tezimiz sonuçlandırılmıstır. Tezimizin ana bölümleri ?Cassas ve Ahkâmu'l-Kur'ân'ı?, ?Elmalılı ve Hak Dini Kur'an Dili? ve ?Cassas ve Elmalılı Tefsirlerinin karsılastırılması? seklindedir. Tezimizin üçüncü bölümünde Cassas ve Elmalılı tefsirleri, sekil ve muhtevası, bazı ahkâma dair konular ve getirilen farklı yorumlar ve fıkhi tefsir baglamında problem arz eden, ayetlere verilen manalar esas alınarak karsılastırılmıstır. Tezimizde Cassas'ın tefsiri ile Elmalılı tefsirlerinin metotları üzerinde durulmus, müfessirlerimizin görüslerindeki farklılıkların tefsir metotlarından kaynaklandıgı tespiti yapılmıstır."
