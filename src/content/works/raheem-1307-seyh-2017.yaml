abstract: "Tezimizin ana konusu, Şeyh Sıddîk Hasan Han el-Kanûcî'nin (1307/1890) kişiliğini ortaya koymaktır. Ansiklopedik bir bilgiye sahip olan büyük fıkıh âlimi Şeyh Sıddîk, farklı alanlarda Arapça, Farsça ve Hintçe olmak üzere farklı dillerde eserler kaleme almıştır. O, imam Muhammed ibn Ali İbn Muhammed el-Yemenî eş-Şevkânî'nin (1225/1810) ed-Dürerü'l-behiyye eseri üzerine yazılmış er-Ravdetü'n-nediyye şerhinin yazarıdır. Mezkûr şerh, Şevkânî'nin ortaya koyduğu çalışmayı tamamlamaktadır. Çalışmamız, önsöz ile Şevkânî'nin anavatanı Yemen'in o zaman yaşamakta olduğu toplumsal ve siyasi durumu ortaya koyan bir girişle başlamaktadır. Tezimizin birinci bölümü, metin sahibi olan Şevkânî'nin hayatı, hocaları, öğrencileri, en önemli eserleri, telifteki yöntemi ve vefatını içermektedir. İkinci bölüm, metnin şarihi olan Şeyh Sıddîk'in hayatı, eğitimi, matbu ve mahtut eserleri, hocaları, öğrencileri, telifte izlediği ilmi yöntemi ve telifte beslendiği kaynakları ele almaktadır. Üçüncü bölüm, er-Ravdetü'n-nediyye eserinden seçilmiş fıkhi konulara değinmektedir. Bu bölüm, Şeyh Sıddîk'in mezkûr konuları hangi şekilde ele aldığını açıklamakta ve onları farklı görüşlerle karşılaştırmaktadır. Bu yöntemi takip ederek delille teyit edilen güçlü görüşe ulaşmayı hedeflemekteyiz. Sonuç kısmı ise ulaşmış olduğumuz en önemli sonuçları ihtiva etmekte ve Şeyh Sıddîk'in fıkıh hizmetindeki gayretini açıklamaktadır. Çünkü o, çağının en üstün âlimlerinden biri olduğu gibi birçok yeri gezmiş, farklı meşreplerden beslenmiş, çeşitli ilimlere sahip olmuş, farklı ilim ve sanat dallarında eserler kaleme almıştır. Gerek âlimlerin bizzat ifadeleri gerekse arkada bıraktığı ilmi miras buna tanıklık etmektedir. Aynı zamanda bu çalışmanın sonucunda onun şahsiyeti ve fıkıhçı kimliğinin daha fazla araştırmaya ihtiyaç duyduğu da ortaya çıkmaktadır. Çünkü onun fıkhı ve ilmi mirası, daha fazla çalışılmayı hak etmektedir."
