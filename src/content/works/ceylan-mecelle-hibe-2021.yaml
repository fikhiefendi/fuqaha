abstract: "Ceylan, Mücahit, Mecelle'de Hibe Akdi, Yüksek Lisans Tezi, Danışman: Doç. Dr. Belkıs Konan, 131 s. Osmanlı Devleti'nin son devrinin siyasi, hukuki ve iktisadi şartları muvacehesinde ortaya çıkan medeni kanun ihtiyacı, kanunun mehazi ile alakalı muhtelif fikirlerin öne sürülmesine sebep olmuştur. Code Civil'in (Fransız Medeni Kanunu) alınması veya fıkha dayanan bir kanun hazırlanması konusunda fikir ayrılığı oluşmuş, neticede Ahmet Cevdet Paşa'nın temsil ettiği görüş olan ikincisi tercih edilmiş ve böylece Türk hukuk tarihinin ilk medeni ve Borçlar Kanunu olan Mecelle hazırlanmıştır. 19.asırda Osmanlı hukukçularının Hanefi fıkhının içtihatlarından tedvin ettiği bir kanun çalışması olan Mecelle; bir mukaddime ve 16 kitaptan oluşmaktadır. Hibe akdi Mecelle'nin 833-880 maddeleri arasında düzenlenmiştir. Hibe akdinin amacı karşılıksız kazandırmada bulunmaktır. Tarafları bağışlayan ve bağışlanandır. Bağışlama konusu malın karşı tarafa geçmesi akdin hüküm ifade etmesi için gereklidir. Malın belirli, bilinen, meşru ve bağışlayanın mülkiyetinde olması şarttır. Kural olarak tam ehliyetliler bağışlama yapabilir. Sınırlı ehliyetliler yasal temsilcilerinin rızasıyla bağışlama yapabilirken; sınırlı ehliyetsiz ve tam ehliyetsizler bağışlamada bulunamazlar. Mecelle'ye göre hibe akdi; elden hibe, alacağın hibesi, havale, muşa'ın hibesi, meşgulün hibesi, kısa elden teslim ve şartlı hibe şeklinde yapılabilmektedir. Hibede rücu, hükümsüzlük ve fesih esas olarak sona erme sebepleridir. Hibe tek taraflı kazandırıcı bir işlem olduğu için kabz öncesi veya sonrası sona erdirilebilme ihtimali vardır. Mecelle'ye göre; kan hısımlığı, sıhriyet, vahibin yaptığı hibeye karşılık bir ivaz alması, bağışlanan malın tüketilmesi veya yok olması, bağışlanan malda ayrılmaz bir ziyade olması, vahib ya da mevhubun lehin ölümü, bağışlanan malın bağışlananın mülkiyetinden çıkması, hibenin sevap kazanma gayesiyle yapılması ve hibenin bir borcun ibrası şeklinde yapılması hibe akdinde rücu engelleri olarak görülmektedir. Tezin gayesi, Mecelle'de hibe akdini Türk Borçlar Kanunu ile mukayeseli bir şekilde incelemektir."
