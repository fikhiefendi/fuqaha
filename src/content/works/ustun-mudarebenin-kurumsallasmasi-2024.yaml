abstract: "Mudarebe emek sermaye ortaklığına dayanan ticari bir akittir. Bu akit, İslamiyet'ten önce de kullanılmış bir akittir ve İslam hukukunda da caiz kabul edilmiştir. Bu akit İslam hukuk kitaplarında ayrıntılı bir şekilde ele alınmıştır. İslam kaynaklarında helal yollarla ticaret yapmak, ortaklık kurmak, parayı dönüşüme sokmak, üretime dâhil etmek vs. övülen eylemlerden olmuştur. Faiz, kumar ve tekelleşme gibi haksız kazanca, hakların gaspına yol açacak eylemler için ciddi tedbirler almaktadır. Ticareti, ortaklığı, risk paylaşımını, dayanışmayı kapsayan Mudarebe uygulaması, adil paylaşımı sağlayacak, İslami finans için alternatif olabilecek bir uygulamadır. Osmanlı iktisat hayatında ve para vakıflarında uygulanan mudarebe, günümüzde katılım bankalarında kullanılmaktadır. Bu kurumların fon toplama kısmında çok fazla kullanılan mudarebe, fon kullandırma kısmında fazla tercih edilmemiştir. Bunun birçok nedeni bulunmaktadır fakat başlıca nedeni uygulanmasında yüksek risk barındırmasıdır ve uygulanma bakımından diğer finansal işlemlere göre daha zor bir yapıda bulunmasıdır. Mudarebe ortaklığı, yatırım amaçlı kurulan ortaklıktır. Mudarebe işletmek, yatırım yapılan işletmecinin kazancına bağlı bir kar paylaşımı veya zarar etme riski taşımaktadır. Sürecin şeffaf ve güvenilir şekilde gerçekleşmesi için işletme sahibinin özel olarak denetlenmesi gereklidir. Böyle bir denetim, riski biraz daha azaltacak yatırımcıları bu ortaklık konusunda daha çok cesaretlendirecektir. Ancak banka birçok işlem yaptığı ve müşteri ağı çok geniş olduğu için bunun uygulanması banka bünyesinde meşakkatli bir süreci oluşturur. Yatırım sadece dövize, hisse senetlerine para yatırıp bir bireysel kazanç elde etmek değil, sermaye, emek, toprak, girişimcilik unsurlarını içerinde barındıran üretimin devamlı gerçekleştiği, her kesimin fayda göreceği sürdürülebilir bir finansal süreci ifade etmektedir. Bunun için uzun vadeli fonlara ihtiyaç vardır. Kısa vadeli fonlar piyasadaki değişikliklerden daha çok etkilenmektedir ve bu durum hızlı fiyat değişikliklerine yol açmaktadır. Uzun vadeli yatırımlar daha fazla kar getirir ve büyüme potansiyeli kısa vadeli yatırımlara göre daha çoktur. Ayrıca kısa vadeli işlemlerde alım satım işlemleri daha sık gerçekleştiği için yatırım maliyetlerini arttırmakta ve yatırım faaliyetlerinin azalmasına yol açmaktadır. Bundan dolayı mudarebe esaslı yatırım faaliyetlerinin banka bünyesinde aktif şekilde kullandırılması zordur. Yatırım için uzun vadeli fonlar gereklidir ve vakıflar uzun vadeli fonlara sahip kurumlardır. Tek bir finansman aracı kullanıp, kullandırması ve yatırım faaliyetlerinin artırılması adına faaliyet yürütmeleri açısından vakıflar daha uygun ya bağımsız kuruluşlardır. Para vakıfları ve İslam bankalarının aksine, tek bir finansal işlem üzerine kurumsallaşan risk sermayesi şirketleri emek- sermaye ortaklığı sayesinde çok sayıda kişiye fon kullandırmakta ve teknolojik yeniliklere, girişim faaliyetlerine öncülük etmektedir. Mudarebenin de bu şekilde vakıf modelinde kurumsallaşması, kamunun ihtiyaçlarına karşılık veren vakıf geleneğini devam ettirmek, İslami finans alanında alternatif kurum oluşturmak, insanların İslam hukukuna uygun yöntemlerle kredi ihtiyacını gidermek ve yatırım faaliyetlerini arttırıp finansal sürdürülebilirlik ve etkin kaynak yönetimi sağlamak bakımından önem taşımaktadır. Bu çalışmada, mudarebe akdi Hanefi fıkhı çerçevesinde ele alınmış, Mudarebe esaslı kurulan, İslami finans kurumları arasında yer alan Para vakıfları ve katılım bankaları detaylıca incelenip, mudarebenin vakıf olarak kurumsallaşmasına yönelik bir şema oluşturulmuş ve uygulanma potansiyeli tartışılmıştır."
