abstract: "İnsanlık tarihi boyunca para şekil değiştirmiş, deniz taşlarından kümes hayvanlarına kadar birçok şekle bürünmüş, sonrasında altın başta olmak üzere değerli madenlerden imal edilmiştir. Altın'ın mübadele aracı olarak kullanımı dünya çapında revaç görmesine rağmen günlük yaşamda para olarak basımı ve tedavülü zamanla azalmış onun yerine insanlar ihtiyaca binaen kâğıt paralar üretmişler ve kullanmışlardır. Kâğıt formundan sonra bilgisayar ortamına giren ve elektronik cihazlarda transferi yapılan paranın, bu ortamlarda birçok türevi ortaya çıkmıştır. Bunlardan bir kısmı devletin bastığı paraların dijital ortamlardaki temsilini sağlayan kaydi paralar olarak üretilirken bir kısmı da herhangi bir otoritenin hâkimiyeti altında olmaksızın üretilmiş ve kullanıcıları arasında Kripto Para ismiyle şöhret bulmuştur. Bu çalışmada; 2009 yılında ortaya çıkan ve günümüze kadar dünya çapında milyar dolarlık ticaret hacimlerine ulaşan Kripto Para diye tabir edilen yazılımların ilki ve en meşhuru olan Bitcoin ele alınmış ve Para kavramı incelendikten sonra, Bitcoin özelinde kripto yazılımların İslam Hukuku açısından durumu değerlendirilmiştir."
