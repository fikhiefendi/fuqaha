abstract: "Cahiliye kelimesi Arapça“c-h-l”kökünden türemiş olup ilmin zıddı olan“bilgisizlik”manasındadır. Özel manada ise İslâmiyet'in gelmesinden önceki Arap Yarımadasında yaşayan insanların dinî ve sosyal hayatlarını, kişilerin veya kabilelerin yaygın olarak işledikleri insanlık ve ahlak dışı durumu ifade eder. Cahiliye kelimesinin lügat anlamında mevcut olan bilgisizlik, ciddiyetsizlik, körü körüne bağlanma, barbarlık ve taşkınlık gibi insanî davranışlardan uzak olan hal ve hareketler İslâmiyet öncesinde yaşayan insanların sosyal yaşamlarına hâkim olduğundan bu döneme“Cahiliye Dönemi”denmiştir. Bu çalışmanın amacı, cahiliye kelimesine yüklenmiş olan bu anlamlardan hareketle cahiliye dönemi kadını üzerine bir inceleme yapmak ve İslâmiyet'in gelmesiyle kadının toplum ve aile içindeki konumunun nasıl değiştiğini incelemektir. Amaç doğrultusunda tez meydana getirilirken öncelikle benzer çalışmaların literatür taraması yapılmıştır. Bu çalışma bilimsel araştırma yöntemlerinden belge inceleme ve kaynak tarama yöntemleri neticesinde hazırlanmıştır. Yapılan çalışma kapsamında cahiliye döneminin en bilinen âdeti olan kız çocuklarının diri diri gömülmesi âdetinin nasıl zuhur ettiği, hangi kabileler arasında yaygın olduğu ve arkasında yatan sosyolojik, psikolojik ve ekonomik sebeplerin neler olduğu ve aile kurumunun temelini oluşturan nikah türleri üzerinden kadının ve ailenin konumu incelenmiştir. Erkeklere tanınan sınırsız hakların yanı sıra kadının hiçbir hakkının olmaması toplumun örf-âdetlere göre yönetilmesi ve bunların kanun gibi kabul edilip belli bir hukuk sisteminin olmamasından kaynaklanmaktadır. İslâmiyet'le kadının aile ve toplum içindeki statüsü değişmiş sadece evlenme ve boşanma hususunda değil kadın-erkek ilişkileri ve miras gibi konularda kadınların haklarında gelişmeler olduğu kaydedilmiştir."
