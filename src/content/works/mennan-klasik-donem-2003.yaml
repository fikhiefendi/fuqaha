abstract: "IV ÖZET Klasik Dönem Osmanlı Toplumunda Suç Bağlanımda Osmanlı Sosyal Tarihinin Lise Ders Kitaplarında İncelenmesi Öznur MENNAN Osmanlı Devleti'nde suçu incelemek, Osmanlı toplumunu anlamak adına önemlidir. Tarihsel açıdan suçun incelenmesi günümüzdeki tarihçiliğin ilgi odağı olan sosyal tarihin kapsamına girmektedir. Türkiye'de Osmanlı tarihi incelemelerinde sosyal tarih alanında henüz uluslar arası standartlarda araştırma örnekleri verilmemiştir. Osmanlı toplumunu anlamak için önemli bir konu olan suç konusunda ise hiçbir akademik çalışma yapılmamıştır. Bunun yanında tarih öğretimindeki sorunlar üzerinde çalışan araştırmacılar tarih ders kitaplarının siyasal tarih ağırlıklı anlatışım eleştirmekte ve tarih ders kitaplarında sosyal tarihe yer verilmesi gerektiğini vurgulamaktadırlar. İncelediğimiz lise ders kitaplarındaki Osmanlı toplumu anlatısı, Osmanlı toplumunu idealleştirme ya da aşırı yerme eğilimlerine neden olmaktadır. Osmanlı toplumuna ilişkin bu yanılgıların aşılabilmesi, sosyal tarihin ders kitaplarında daha geniş boyutta ele alınması ile mümkün olacaktır. Tarih ders kitaplarında sosyal tarihe yer verilebilmesi için onlara kaynaklık edebilecek akademik düzeyde Osmanlı sosyal tarih çalışmalarının yapılmış olması gerekmektedir. Osmanlı Devleti'nde suçu araştırırken birincil kaynak olarak Afyon seriye sicillerini kullandık. Bu araştırma kapsamında, mahkeme kayıtlarında yer alan ve sadece kişiler arasında oluşmuş suç kayıtlarım inceledik. Kayıtlardan yola çıkarak suçları; mülkiyete saldırı suçları, şahıslara karşı işlenen suçlar, cinsel suçlar, yasaklanmış maddelere ilişkin suçlar şeklinde bölümlere ayırarak inceledik. İslam hukuku ve örfi hukuk kurallarına göre Osmanlı İmparatorluğu' nda bu suçları işleyenlere nasıl yaptırım uygulandığım tespit etmeye çalıştık. İslam hukukunun öngördüğü yaptırımlar için Çatalcalı Ali Efendi'nin Feteva-yı Ali Efendi adlı çalışmasından, örfi hukuk için de kanunnamelerden yararlandık. Suç konusunda yaptığımız araştırma neticesinde, Osmanlı Devleti'nde ne tür suçların görüldüğünü, kimlerin mahkemeye şikayette bulunduklarım ve İslam hukuku ve örfi hukukunun bu suçlara öngördüğü cezaları, ceza konusunda İslam hukuku ile örfi hukukunun benzeştiği ve ayrıldığı noktalan tespit etmeye çalıştık. Şikayet konusu olan bu suçları hazırlayan etmenlerin, Osmanlı Devleti'nde yaşanan sosyo-ekonomik değişiminin toplumsal bir yansıması olduğu sonucuna vardık. Anahtar Sözcükler Sosyal Tarih Osmanlı Toplumu Suç Ceza Seriye Sicilleri örfi hukuk Kanunname İslam Hukuku Fetva Tarih Ders Kitapları"
