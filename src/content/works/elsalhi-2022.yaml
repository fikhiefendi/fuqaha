abstract: "Çalışma, Libya ortamında faaliyet gösteren İslami bankaların iç Şeriat denetimine ilişkin bir anket çalışması aracılığıyla, Libya'daki İslami finans kurumlarında iç Şeriat denetimini tanıtmayı, Libya'da bu mesleği ilerletmek için karşılaşılan engelleri bilmeyi ve bu engellere çözümler önermeyi amaçlıyor. Bu amaca ulaşmak için çalışmanın hipotezi mevcut birincil ve ikincil verilere dayalı olarak test edilmiştir. Çalışmaya hizmet eden veriler bu amaçla hazırlanmış bir anket aracılığıyla toplanmış ve İslami kurumlar ve bankalardaki iç Şeriat denetçilerinden oluşan çalışma topluluğuna ve ayrıca Şerî Kurullara ve iç Şeriat Denetleme Departmanına da dağıtılmıştır. Veriler toplandıktan ve uygun istatistiksel yöntemlerle analiz edildikten sonra çalışmanın amacına uygun sonuçlara ulaşmak için buna uygun önerilerde bulunulmuştur. Araştırmanın en önemli bulguları arasında: İslami bankalardaki çalışanların çoğu daha önce geleneksel bankaların kadrolarında çalışanlardan oluşmaktadır. İslami finans kurumlarının çalışmaları üzerinde tam bir Şeriat denetimi olmaması nedeniyle birçok Şeriat ihlalinin ortaya çıkmasına ek olarak çalışanlar, Libya'daki İslami finans kurumlarında çalışmak için yeterli bilimsel yeterliliğe sahip değiller. Ayrıca, Libya'daki çoğu yetkili, Merkez Bankası da dahil olmak üzere, iç Şeriat denetiminin, mesleğin kendisine emanet edilen görevleri yerine getirmesini sağlayacak şekilde önemini anlamamaktadır. Önceki sonuçlara dayanarak çalışma, İslami finans kurumlarının çalışanlarının İslami finansal işlemlerin fıkhıyla ilgili şerî ilimlerle eğitilmesi ve vasıflandırılması konusunda çalışma ihtiyacını, mali kurumların çalışmalarının kapsamlı bir gözetime tabi olmasını, İç Şeriat denetçisinin çalışması için denetçinin metodolojisinde netlik olmasını ve bu denetçinin; gizlilik, dürüstlük ve tarafsızlık gibi yüksek niteliklere sahip olmasını tavsiye ediyor."
