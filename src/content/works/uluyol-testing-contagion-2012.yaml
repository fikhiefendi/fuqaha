abstract: "Son zamanlarda Konvansiyonel finans piyasalarında 'bulaşıcılık' ile ilgili endişeler artmıştır.Bu çalışma, Konvansiyonel hisse senedi endekslerinde görülen bulaşmanın Şeriat uyumlu hisse senedi endeksleri arasında da mevcut olup olmadığını ampirik olarak test etme arzusuyla motive edilmiştir. Bu çalışma, en son uluslararası finansal kriz olan 2007-2009 ABD subprime krizi sırasında Şeriat uyumlu hisse senedi endeksleri arasında herhangi bir bulaşma olup olmadığını test etmeye yönelik ilk girişimdir. Çalışmada, mühendislik bilimlerinden finansa çok yakın bir zamanda ithal edilen ve 'dalgacık yaklaşımı' olarak bilinen bir teknik kullanılmıştır. İslami (Malezya, Endonezya, Türkiye, GCC) ve İslami olmayan (Japonya, Çin, Kore, Tayvan ve Hong Kong) ülkelerin 18 MSCI konvansiyonel ve İslami hisse senedi endeksinin Haziran 2005-Aralık 2011 dönemini kapsayan günlük getiri verileri analiz edilmiştir. Aşağıdaki ampirik soruları inceliyoruz: (i) Konvansiyonel ve Şeriat uyumlu hisse senedi endeksleri uzun vadede ABD hisse senedi endeksi ile birlikte hareket ediyor mu? (ii) Birlikte hareket varsa, tam kısa ve uzun vadede bir öncü-gecikme ilişkisine dair herhangi bir kanıt var mıdır ve öncü-gecikme ilişkisi zaman içinde nasıl gelişmiştir? (iii) Birlikte hareket ediyorlarsa, birlikte hareket normal midir (birbirine bağlı) yoksa aşırı mıdır (bulaşıcı) (iv) Bulaşma varsa, Şeriata uygun hisse senedi endeksleri ABD merkezli yatırımcı söz konusu olduğunda çeşitlendirme faydaları elde etmeye yardımcı olur mu? Bulgularımız (i) Eşbütünleşme testlerinde de görüldüğü üzere hem MSCI Konvansiyonel hem de İslami hisse senedi endekslerinin uzun vadede ABD MSCI hisse senedi endeksi ile birlikte hareket ettiğini göstermektedir (ii) Dalgacık-çapraz korelasyon analizinin uygulanması, Konvansiyonel ve Şeriat uyumlu MSCI hisse senedi endeksleri ile ABD Konvansiyonel MSCI endeksi arasındaki öncü/gecikme ilişkisinin zaman ölçeği arttıkça daha belirgin hale geldiğini göstermektedir. Ayrıca, testler, dikkate alınan dönemden bağımsız olarak, ABD piyasasının tam zaman aralıklarında lider olduğunu göstermektedir. (iii) Bulaşıcılığı ölçek bazında tespit etmek için kriz ve kriz dışı dönemlerde maksimum örtüşme ayrık dalgacık korelasyon katsayısı uygulanmıştır. Ayrıca, iki zaman serisi arasındaki etkileşimi incelemek için, dalgacık tutarlılığı adı verilen iki değişkenli bir sürekli dalgacık çerçevesi uygulanmıştır. ABD mortgage balonunun patlak verdiği dönemde tüm MSCI konvansiyonel hisse senedi endeksleri arasında bulaşma etkisi görülmemiştir; ancak Lehman Brothers'ın çöküşü sırasında Uzak Doğu ülkelerinin konvansiyonel hisse senedi endeksleri bulaşma etkisi gösterirken, İslami hisse senedi endeksleri de dahil olmak üzere MSCI hisse senedi endekslerinin geri kalanı herhangi bir bulaşma etkisi göstermemiştir. iv) Son olarak, Dinamik Çok Değişkenli GARCH yaklaşımının uygulanması, Şeriat uyumlu hisse senedi endekslerinin ABD merkezli yatırımcılar söz konusu olduğunda Konvansiyonel endekslerine kıyasla daha fazla çeşitlendirme faydası sağlamadığını göstermektedir. Bununla birlikte, bölgesel çeşitlendirme faydaları vardır; Japonya, Suudi Arabistan hariç Körfez İşbirliği Konseyi, Endonezya, Malezya ve Tayvan'ın hem Konvansiyonel hem de İslami MSCI endeksleri, Kore, Hong Kong, Çin ve Türkiye'ninkilere kıyasla daha iyi çeşitlendirme faydaları sağlamaktadır ve uluslararası yatırımcılar için öngörülemeyen risklere karşı bir koruma olarak portföy çeşitlendirmeleri için güçlü bir politika anlamı taşımaktadır."
