abstract: "bn Receb el-Hanbelî (h.736/895), (m.1335/1393) yılları arasında yasamıs Bagdat'ta dogmus ve degisik slam beldelerinde egitim görmüstür. Pek çok hocadan ders almıs ve önemli eserler bırakmıstır. Kendisi gibi meshur talebeler yetistirmistir. Hadîs ve diger slam'ı ilimler alanında söz sahibi olmustur. Eserleri üzerinde degisik ülkelerde akademik çalısmalar yapılmıstır. Tezimizde bn Receb'in hayatını, hocalarını, talebelerini, eserlerini ve hadîs ilmindeki yeri ile onun Câmiu'l-ulûm ve'l-hikem adlı eserindeki serh anlayısını çalısmıs bulunmaktayız."
