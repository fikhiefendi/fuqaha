abstract: "Bu çalışma, Hatîb Rüstem El-Mevlevî'nin Vesîletü'l-Makâsıd ilâ Ahseni'l-Merâsıd fî Lügati'l-Fürs adlı eserinin Ankara, Milli Kütüphane Yz. A 638'de ve Ankara, TDK Kütüphanesi Yz. A 449'da yer alan nüshalarının karşılaştırmalı çeviri yazısını ve eserle ilgili incelemeleri içermektedir. 1498'de telif edilen Vesîletü'l-Makâsıd; Türkçe anlamları satır altlarına yazılmak suretiyle 9972 madde başı Farsça kelime ihtiva eden hacimli bir Farsça-Türkçe sözlüktür. Eserdeki Türkçe kelimeler Eski Anadolu Türkçesi özelliği göstermektedir. Eserde aynı zamanda, Fars gramerinin Türkçe olarak anlatıldığı 252 beyit mevcuttur. Bu özelliği ile eser, Anadolu'daki ilk manzum gramer kitaplarından biri olarak kabul edilebilmektedir. Çalışma üç ana bölümden oluşmaktadır. Birinci bölümde Araplar, Farslar ve Türklerde sözlükçülük ve gramer çalışmaları hakkında bilgi verilmiş, ikinci bölümde eserin şekil ve muhteva özellikleri incelenmiştir. Üçüncü bölümde; eserdeki tüm Farsça ve Türkçe kelimeler, tanıtlayıcı sözlükler olarak adlandırdığımız sözlüklerden kontrol edilerek ve gerekli görülen yerlerde dipnotlar verilerek eserin çeviri yazısı yapılmıştır."
