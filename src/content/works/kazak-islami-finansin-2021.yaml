abstract: "Bütün ülkelerin ekonomileri sektörlerden sektörler de firmalardan oluşur. Firmalar üretim faktörlerini (doğal kaynaklar, emek, sermaye, teknoloji, girişim vb.) kullanarak toplum için mal ve hizmet üretirler. Firma, mal ve hizmet üreten bu ekonomik birimlerin hukuki ismidir. İslâmi firmalar kuruluş dâhil bütün faaliyetlerinde İslâmi kuralları da nazara alan ekonomik işletmelerdir. İslâmi firmalar İslâmi finans kurullarını uygularlar. İslâmi finans; firmaların İslâmi kurallar çerçevesinde para ve sermayelerinin tedariki ve bunların maksimum getiri sağlamak için firma yatırımlarında helâl/haram ekseninde kullanılması demektir. İslâmi finansı; İslâm dininin belli inanç esaslarından, evren ve hayata ilişkin temel görüşlerinden, kurallarından arındırarak incelemek mümkün değildir. İslâm dini insanlığa, bütüncül bir hayat görüşü sunduğundan toplum hayatının ticari, iktisadi, hukuki, ahlaki, kültürel, dini ve siyasi yönleri birbirinden bağımsız incelenemez. İslam'da asıl olan kaynakların verimli ve etkin kullanımı suretiyle ekonomik kalkınmanın sağlanması, herkesin katkısına göre gelirin adil dağılımı, toplumun refah seviyesinin yükseltilmesi, toplumun ekonomik bakımdan yetersiz olan tabakalarının korunması için zekât, sadaka, karz ve başkaca yöntemlerle ve vakıf vb. yapılarla desteklenmesi suretiyle sosyal barışın sağlanmasıdır. Makro seviyede bakıldığında İslami finansın temel amacının toplum kaynaklarının firmalarca etkin kullanılması, ekonomik kalkınmanın sağlanması ve sosyal barışın temini olduğu söylenebilir. Ekonominin sektörlerden ve sektörlerin firmalardan oluştuğunu ifade edilmişti. Firmalar ister sanayi isterse hizmet firmaları olsun kaynaklarını ne derece etkin ve verimli kullanırlarsa o derece büyürler ve dolayısıyla sektörler ve sektörlere dayalı ekonomide o ölçüde büyür ve kalkınır. Ekonominin büyümesiyle firmaların büyümesi arasında doğrudan bir korelasyon vardır. Burada önemli nokta İslâmi finansın firmaların büyümesinde ve toplumsal refahın sağlanmasında konvansiyonel finansa göre hangi ölçüde daha fazla büyümeye ve sosyal refaha katkıda bulunduğunun ortaya konulmasıdır.“İbaha”kuralı firmaların faaliyetlerinde en son teknolojilerin, üretim, yönetim, pazarlama, ar-ge sistemlerinin vb.'nin firmalarca kullanılması konusunda kendilerini sorumlu tutmaktadır. Bu kural ayrıca firmaları toplumsal refahın ve barışın sağlanmasına da katkıda bulunması kuralını getirmektedir. Firmaların verimlilikten taviz vermeden gelirin sosyal paylaşımı, toplumun sosyal yardımlaşma kurumlarına katkıda bulunulması da istenmektedir. Çünkü İslâm toplumu bir aile gibi görmekte, gücü olan herkesin çalışarak topluma katkıda bulunulmasını şart koşmakta, tufeyliliğe-dilenciliğe imkân tanımamaktadır. İnsan yeryüzüne Allah'ın halifesi sıfatıyla gönderilmiş ve yer yüzünde diğer insanlarla ilişki kurabileceği bir sosyal yapı içerisinde kendisinden istenilen görevleri yerine getirmesi istenmiştir. İslam insanın sadece ahiret hayatını düzenlemeyi hedefleyen bu nedenle dünyadan soyutlanan bir varlık olarak hayatını sürdürmesini isteyen bir din değildir. İslam yaratılanların en şereflisi olma yolunda insanın dünyada tüm insanlığın ve daha geniş kapsamda tüm dünya hayatındaki yaşam unsurlarının denge ve huzur halinde olmasını ister ve bunun için ideal bir sistem önerir. Bu yönüyle İslam iktisadi sistemi diğer tüm sistemlerden daha adil, daha dengeli, daha kapsamlı bir sistemdir ve bu sistemin çalışmasında İslâmi finans sisteminin daha etkin olduğu düşünülmektedir. Bu çalışmada İslam iktisadi sistemi içerisinde önemli bir yer tutan İslami finans sisteminin ekonomik kalkınma ve sosyal barışın sağlanmasına katkısı açısından önemi ortaya konularak Türkiye için uygulanabilir bir model önerisi sunulmuştur."
