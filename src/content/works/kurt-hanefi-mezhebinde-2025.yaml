abstract: "Yaşadığımız asırda her alanda yaşanan hızlı değişim ve dönüşüm nedeniyle insanların dinî düşünceleri, yaşantıları ve din-hayat ikilemindeki algı ve anlayışları da değişmektedir. Bu bağlamda özellikle insanların dinî hayatlarını mantıklı, sistemli, tutarlı ve sağlıklı bir zeminde yaşamalarını temin eden mezheplerin günümüzdeki varlığı ve işlevi daha da önemli hale gelmiştir. Hızla değişen ve gelişen günümüz şartlarında yeni ortaya çıkan meselelerin fıkhî çözümünde tutarlılık ve sistematiklik açısından mezhep sistematiğine baş vurmak önemlidir. Zira yeni bir meselenin doğru tahlilinde benzer ve aynı özellikteki geçmiş örneklerine müracaat etmek, hukukun süreklilik ve güvenilirliğini, hukukçunun da niteliğini gösterir. Hanefî mezhebinde bazı temel fürû-i fıkıh eserlerinde istihsan ve kerâhiyye başlığında işlenen konuları inceleyen bu çalışma, ilgili eserlerde ele alınan konuların içerik, işleniş ve tarihsel gelişimi ile günümüz meselelerine Hanefî mezhebi perspektifinden daha derinlikli ve tutarlı bir değerlendirmede bulunma imkânı sağlamayı hedeflemektedir. Hanefî mezhebinde istihsan ve kerâhiyye başlığında ele alınan konuları inceleyen bu çalışma, bir giriş ve üç bölümden oluşmaktadır. Birinci bölümde istihsan ve kerâhiyyenin kavramsal boyutuna, ilgili kavramlarla münasebetine ve bu kavramların istihsan ve kerâhiyye konuları ile ilişkisine, haram ve mübah kavramları ile benzer ve farklı yönlerine ve ne anlama geldiklerine dair bilgilere yer verilmiştir. İkinci bölümde klasik ve sonraki dönem eserlerinde istihsan ve kerâhiyyeye dair konular incelenmiş, öncesi ve sonrası ile kıyaslamalar yapılmış, hükümlerdeki değişim ve farklılıklar gerekçeleriyle ortaya konmaya çalışılmıştır. Ayrıca meselelerin günümüzdeki boyutuyla ilgili Hanefî mezhebi perspektifinden fıkhî açıklamalara yer verilmiştir. Üçüncü bölümde ise bazı güncel fıkıh meseleleri üzerinde durulmuş, bu meselelerin öncesi ve sonrası ile ilişkisine değinilerek fıkhî hükümleri ortaya konmuştur."
