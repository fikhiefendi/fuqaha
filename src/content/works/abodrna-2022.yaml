abstract: "Bu tez Libya'da petrol ve doğalgaz araştırmalarındaki modern uygulamalar ve ona bağlı cuâle akdi şeklini içermektedir. Cuâle akdine özellikle petrol ve doğalgaz araştırmalarında İslam fıkhı kurulları, şeriat kurulları referans olmuşlardır. Bu araştırmada genel olarak Cuâle akdi diğer petrol sözleşmeleriyle kıyaslanacaktır. Aynı zamanda keşif ve üretim paylaşımı sözleşmeleriyle kıyaslanacaktır. Bu tezde endüktif yaklaşım, analitik karşılaştırmalı yaklaşım ve kütüphane verilerine dayanarak içerik analizi yaklaşımı kullanılmıştır. Teorik bölümü hukuki ve dini uyumları içermektedir. Her bir yönün olumlu ve olumsuz yönleri ele alınmıştır. Cuâle akdinin ekonomik ve muhasebe yönlerinden sonuçları ele alınmıştır. Aynı zamanda petrol üretiminin özellikleri, cuâle akdindeki aşamaları ve diğer petrol sözleşme türlerine değinilmiştir. Bu uygulamalı araştırma aynı zamanda Ulusal Petrol Şirketi ve Eni Kuzey Afrika arasındaki belirli bir yılın keşif ve üretim yaklaşımı sözleşmelerinin verileri üzerindeki petrol ve gaz araştırmalarındaki cuâle akdinin uygulamalarını içermektedir. Kıyaslama yoluyla, bu araştırmanın sorularının cevaplarına ulaşma imkanı oluşmuştur. Aynı zamanda bu araştırmada ilgili akdin avantajlarına aşağıda sunulduğu şekilde ulaşılmaya çalışmıştır: Araştırma; petrol ilişkilerinde yatırım şirketleriyle anlaşmalarında cuâle akdine dayanan petrol ülkeleri diğer sözleşmelerle paralel veya muadil olması gerektiğini savunmaktadır. Uluslararası kuruluşlarda benimsenmesi için gerekli çalışmaların yapılmasının gerektiğini düşünmektedir. Uygulamaya girmesi için gerekli kanunların ve yasaların getirilmesi gerektiğini savunmaktadır. Bilimsel açıdan ise İslam fıkhı teorik fıkıhtan uygulama fıkhına geçmeye çalışmıştır. Araştırmada İslami finans sözleşmeleriyle ilgili daha fazla araştırmaların yapılması gerektiğine ve özellikle çağdaş uygulamalar alanındaki cuâle akdi dahil bütün uygulamalarının genişletilmesinin gerektiğine varılmıştır."
