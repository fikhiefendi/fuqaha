abstract: "Zamanın sonu, tarihin başlangıcından beri insanı meşgul etmiştir. Statü ve pozitivizm dahil olmak üzere buna pek çok cevap verilmeye çalışılmıştır. Gerek olaylar ve şahıslar, gerek rivayetler ve Metinler ve gerekse kutsi inanç ve pozitif çabalar açısından çokları bu konuyla meşgul olmuştur. Dini yorumlar, gerek vahiy gerekse hayale dayalı olarak dini metinlerden yola çıkarak olacakların ne olacağına dair bir fikir sunmaya çalışmışlardır. Yahudilerin veya İsrailoğullarının da diğer kavimler gibi ahir zaman olaylarına inanmaları ve bunları anlatmaları söz konusuydu. Yahudi dini metinlerinin yorumcuları, ahir zaman olaylarını ve bunlarla ilgili kutsallaştırdıkları konuları sunmaya çalışmışlardır. Ancak İslam ve Arap halkları olarak İbrani dili ve kültürüne olan mesafemiz, onların yazdıklarıyla bizim öğrendiklerimiz arasında bir uçurum yaratmış ve bu nedenle pek azına ulaşabilmiş bulunuyoruz. Bir giriş, üç ana bölüm ve bir Sonuçtan oluşan bu tezimizde araştırmacı, yalnızca zamanın olaylarının değil, aynı zamanda ahir zamanla ilişkilendirilen en önemli şahsiyetlerden biri, yani olaylarda önemli bir rolü olan“Mesih İbn Yusuf”a dair Yahudi anlatısının bir resmini sunmaya çalışmaktadır. Araştırmacı, tez üzerinde bu karakterin yapısını oluşturmaya, sunmaya ve ardından onu ahir zaman olaylarıyla ilişkilendirmeye çalışacaktır. Araştırmacı, birinci bölümde Mesih kavramını dilsel ve deyimsel olarak tanıtmakta ve ardından birçok medeniyette kurtarıcı kişiliğin varlığını ele almakta; ardından da üç semavi dindeki varlığını aktarmaktadır. İkinci bölümde araştırmacı, çalışmanın ana konusu olan şahsiyete, onun duyurulmasından başlayarak, zuhuruna, ortaya çıktığı yerlere, Yahudi dini sembolleri ile ilişkisine ve Yahudilerin dua ve namazları ile obstetrik hayat ağacı gibi ritüellerinde ruhani hayat ve dinle olan ilişkisine değinmiştir. Üçüncü bölümde araştırmacı, bu kişiliğin ortaya çıkışından sonuna kadar ortaya çıkan kişi ve olaylar açısından bu şahsiyetleri ahir zaman olaylarıyla ilişkilendirmiş; son Yahudi öyküsünü, bu karakteri nasıl sunduğu ve ona nasıl inandığını incelemeye çalışmıştır. Araştırmacı, karşılaştırmalı çalışmalarda bu yeni araştırmayı İslam kütüphanesine katmak ümidiyle, özellikle İbranice kaynaklara hakimiyetinin ışığında, bu araştırma sırasında hakkında yazılmamış yeni bir şeyler bulmaya çalışmaktadır"
