abstract: "Günümüz Sünni İslam Dünyasındaki fıkıh mezhepleri incelendiğinde esas olarak mezheplerin dört kategoriye ayrıldığı görülmektedir. Bunlardan Hanefi mezhebi en çok yayılma imkanına sahip olan mezhep olmuştur. Bu çalışmada Sünni dünyanın fıkıh mezheplerinden olan Hanefi Mezhebi'nin en çok yayılma alanı bulmuş olmasının sebepleri inceleme konusu edilmektedir. Hanefi Mezhebi'nin İslam dünyasında bu denli geniş bir alanda tatbik edilmesi sekiz sebebe bağlanmıştır. Ebu Hanife'nin şahsi özelliklerinin etkisi, devletlerin resmi mezhep politikası, mezhebe olan bağlılık, mezhebin sosyal hayata olan yansıması, mezhebin erken dönemde kayda geçirilmiş olması, mezhep müntesipleri hakkında yapılan dedikodular, mezhep müntesiplerinin özellikle resmi kadılık görevinde bulunmaları, devlet yöneticilerinin bu mezhebe olan ilgilerinin sebepleri incelenmiştir. Bu sebeplerin mezhebin yayılmasında etkili oldukları izlenimi elde edilmiştir."
