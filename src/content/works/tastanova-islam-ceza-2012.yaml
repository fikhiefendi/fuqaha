abstract: "İslâm Ceza Hukukunda Haddu'ş-Şürb ve Haddü's-Sekr Ayırımı ve Hukukî Sonuçları ile çalışma, bir giriş ile iki bölümden ve sonuç kısmından meydana gelmektedir.Giriş kısmında içerik ve yöntem başlığı altında konunun önemi, sınırlandırılması, sunulması ve kullanılan kaynakların değerlendirilmesi hakkında bilgi verilmiştir.Konunun anlaşılmasına yönelik genel bilgileri içeren birinci bölümde konuyla ilgili olan had, hamr, müskir, ta'zîr, haddu'ş-şürb ve haddü's-sekr kavramlarının sözlük, terim ve mâhiyetleri açıklanmıştır. Daha sonra haddü'ş-şürb ve haddü's-sekr'in hukukî dayanağı, ayırım sebepleri konularına değinilmiştir. Bu çerçevede hadleri bir birinden ayıran sebepler, İslâm âlimlerinin görüş ayrılıklarına düştükleri nedenler belirtilmiştir.İkinci bölümde haddu'ş-şürb ve haddü's-sekr'in miktarları, haddi ve ta'zîri gerektiren sekr, katı ve sıvı müskirâtta hadler, haddin uygulanabilme şartları ve hadd uygulama yetkisi konuları ele alınmıştır.Sonuç bölümünde ise, genel değerlendirme yapılarak, ulaşılan netice belirtilmiştir."
