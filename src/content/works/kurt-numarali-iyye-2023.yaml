abstract: "Bu çalışmada H. 1248 (M.1831-1833) tarihine ait 100 numaralı Manastır Şe'iyye sicilindeki belgelerin özetleri ve değerlendirilmesi yapılmıştır. Çalışma üç bölümden oluşmaktadır. birinci bölümde Şer'iyye sicillerinin tanımı, muhtevası ve önemine değinilmiştir. Daha sonra 100 Numaralı Manastır Şer'iyye sicili defterinin tanıtımı, defterde yer alan belgeler ve tasnifi yapılmıştır. ikinci bölümde ilk olarak Manastır kazasının idari birimleri olan mahalleleri ve köyleri, mahkemenin görevli idari yöneticileri kadı, naib, muhzır ve kâtip hakkında bilgiler ve Manastır kazasında kullanılan eşyalara yer verilmiştir. üçüncü bölümde ise sicildeki belgelerin numarası, konusu, tarihi ve özetleri yer almaktadır."
