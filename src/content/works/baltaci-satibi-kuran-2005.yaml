abstract: "ÖZET Baltacı, Burhan, Şâtibî'nin Kur'ân'ı Yorumlama Yöntemi, Doktora Tezi, Danışman: Prof. Dr. Halis Albayrak, Ankara 2005, X+237 s.“Şâtibî'nin Kur'ân'ı Yorumlama Yöntemi”isimli araştırmamız, Kur'ân'm anlaşılması ve yorumlanmasında kendi döneminde farklı bir metodoloji önerdiği kabul edilen ve bir fıkıh usûlü alimi olan Ebû İshâk eş-Şâtıbî'nin (v. 790/1388), Kur'ân'ı anlama ve yorumlama yönteminin günümüz tefsir usûlü terminolojisi çerçevesinde ortaya konulmasına yöneliktir. Araştırmamız giriş ve iki bölümden oluşmaktadır. Girişte, araştırmanın konusu, önemi ve metodu belirtildikten sonra; Şâtibî'nin hayatı, eserleri ve yaşadığı dönem hakkında olabildiğince kısa bilgi verilmiştir. Şâtibî'nin Kur'ân'ı anlama metodolojisine doğrudan etkisi sebebiyle, yaşadığı çevre ile etkilendiği şahıs, olay veya ortamın tespiti için hayatına ve dönemine genel hatlarıyla bir bakış yapılmıştır. Birinci bölümde; Şâtibî'nin Kur'ân tarihine, tefsir usûlüne ve sorunlarına, ilmî tefsire, Ulûm'ul-Kur'ân'a ve sünnetin Kur'ân tef şirindeki yerine dair görüşlerine değinilmiştir. İkinci bölümde; Şâtibî'nin Kur'ân'ı anlama ve yorumlama yönteminin iskeletini teşkil eden temel kavramlar ele alınarak, bu kavramlara yüklediği anlamlar ve kavramların sınırları tespit edilmiş olup bunlara yüklediği anlamlara dair yöneltilen eleştirilere yer verilmiştir. Sonuç bölümünde ise genel bir değerlendirme ve ulaşılan sonuçlar yer almaktadır. 234"
