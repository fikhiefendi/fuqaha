abstract: "İslam hukukunun en temel ilkelerinden birisi, insanların birbirleri ile olan ilişkilerinde karşı tarafa zarar vermemeleridir. Karşı tarafın herhangi bir şekilde zarara uğratıldığı durumlarda ise, verilen zararın mümkün mertebe telafi edilmesi gerekir. Araştırmamızın amacı karşı tarafa verilen zararlar içerisinde sayılabilecek olan menfaatin tazmini ile ilgili İslam hukukçularının görüşünü belirlemek ve kaynaklardaki görüşler ışığında günümüzde meydana gelen bazı konuları ele almaktır. Konu ele alınırken öncelikle naslarlara müracaat edilmiş ardından da fukahânın bu husustaki görüşlerine değinilerek değerlendirmeler yapılmıştır. Araştırmada ilk olarak tazminat hukukuna dair genel bilgiler verdik. Ardından menfaat ve menfaat içerikli uygulamaları, menfaat kavramı ile ilgili Kur'ân ve sünnetteki bilgileri ve konunun fıkıh literatüründeki algılanma ve yorumlanma biçimleri ele alınmıştır. Böylelikle fıkhın bütünlüğü içerisinde menfaatin konumu belirlenmeye çalışılmıştır. Çalışmanın son bölümü ise menfaatin tazmini konusuna ayrılmıştır. Burada gasp ve itlaf durumunda genel olarak tazmin hükümlerinden bahsettikten sonra, her iki durumda menfaatin kayba uğraması ile ilgili fukahânın görüşlerine değinilmiştir. Daha sonra menfaatin tazmini ile ilgili görüşler verilerek değerlendirmeler yapılmıştır. Son olarak menfaat ve menfaatin tazmini ile ilgili elde edilen veriler ışığında modern dönemde menfaat ve tazmini ile alakalı olan bazı konulara değinilmiştir. Çalışmamızı, menfaatin tazminine dair elde ettiğimiz sonuçları ve bunların günümüzde nasıl değerlendirilmesi gerektiği ile ilgili önerilerimizi sunarak tamamladık. Sonuç olarak menfaatin mal olmadığı görüşü kabul edilmekle birlikte, menfaatin zarara uğradığı hallerde, duruma bağlı olarak (vakıf malı, yetim malı ve mu'addün li'l-istiğlâl olan mallarda) tazmini cihetine gidilmesinin uygun olacağı görüşü kanaatimizce daha isabetlidir."
