abstract: "Şer'iyye sicilleri Osmanlı Dönemi mahkemelerinin verdiği kararların kaydedildiği defterlerdir. Bu defterlere kadı sicili, kadı defterleri de denilmektedir. Mahkemelere her türlü konu, dava olarak gelmekteydi. Sicil içerisinde i'lam, hüccet, tereke gibi kadı kararı içeren belgelerin yanında merkezden gönderilen ve kadı tarafından bir örneği mahkeme defterinde de kaydedilen emirname türü belgelerde mevcuttur. Bu yüzden mahkeme kayıtları yazıldıkları dönemin sosyal, hukuki, idari ve ekonomik yapısı hakkında bize değerli bilgiler sunmaktadır. Şer'iyye sicilleri bu denli kapsamlı konuları içermesinden dolayı sadece tarihçilerin işlerine yarayan bir kaynak değil aynı zamanda hukuk, iktisat, sosyoloji, askeri gibi alanlarda da birinci elden kaynaklar olarak kullanılmaktadır. Çalışmamızın konusunu oluşturan 424 Numaralı Siirt Şer'iyye Sicili 1870 ve 1871 (H. 1286/1287/1288) yıllarını kapsamaktadır. Bu defterin içerisinde otuzdan fazla konu başlığı bulunmaktadır. Alacak, borç, mülk satışları, boşanma, yaralama, gasp, zarar, müdahale, tereke ve hırsızlık gibi davalar sicil içerisinde geçen konulardan bazılarıdır. Yaygın olarak geçen bu davalar çalışmamızda ayrı başlıklar altında ele alınmıştır. Sicillere kaydedilen bu davalardan önemli bilgiler elde edilmiştir. Bu bilgiler ışığında değerlendirmeler yapılmış ve Siirt'in 1870 ve 1871 yıllarına ait sosyal, ekonomik ve idari yapısı hakkında önemli sonuçlara ulaşılmıştır."
