abstract: "Hızla değişen dünya hayatında insanın bildiği şeylerle yetinmemesi gerekiyor. İslam hukuk ilminin de hayattaki değişmeyi yakalaması ve ortaya çıkan yeni durumlara cevaplar vermesi görevi bulunmaktadır. Bu da İslam hukuk ilminin hayatiyetini sağlayan ictihâdlar vesilesiyle olmaktadır. Bu çalışmada İslam hukukuna değişen hayat şartlarına cevap verebilme kabiliyeti sağlayan değişim olgusunun fürû-i fıkıh üzerindeki etkileri konu edilmiştir. Tezin birinci bölümünde ahkâmda değişime sebep olan etmenler, değişimi gerçekleştiren araçlar ve değişim etrafında oluşan görüşler incelenmeye çalışılmıştır. İkinci bölümde değişim olgusunu örneklemek bağlamında fürû-i fıkhın çeşitli alanlarından ictihâd örnekleri sunulmaya çalışılmıştır. Üçüncü bölümde ise çalışmanın odağında bulunan bağy konusu özelinde Hanefi fürû literatürünün incelenmesine ve konuya dair ahkâmın değişim ve gelişim sürecinin anlaşılmasına çalışılmıştır."
