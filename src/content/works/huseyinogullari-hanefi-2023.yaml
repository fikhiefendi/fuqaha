abstract: "Allah ve kul hakkı ayrımı ilk fıkıh metinlerinden günümüze kadar gelmiş ve fıkhı iki büyük kütleye bölen en yaygın ve genel kabul görmüş hukuk tasnifini ifade eder. Hakkın Allah'a ve kula nispet edildiği bu ayrımda hak ile kastedilen esasen hükmün kendisi lehine doğduğu kaynaktır. Yani bir hakkın alacaklısına göre Allah ve kul hakkı kavramlaştırması yapılmıştır. Allah ve kul hakkı ayrımı ile neyin kastedildiği ilk fıkıh metinlerinden itibaren bilinmekle birlikte bu ayrımın teşekkül edip teorik bir zemine oturması İslam/Hanefi hukukunda yaklaşık 3 asır sürmüştür. En başta mahza Allah hakkı olan hükümler ibadetler gibi sadece ulûhiyet hakkı olarak nitelenen haklardır. Ancak İslam hukukun muamelât kısımlarında da Allah hakkı ve kul hakkı ayrımı vardır. Buna göre Allah hakkı menfaati umumî olan haklar, kul hakları ise menfaati hususî olan haklar şeklinde tanımlanmıştır. Allah hakları ibadetler, eksik ve tam cezalar, kefâretler, fıtır, öşür, haraç, maden ve ganimetler olarak sekiz başlık altında ele alınmış, kul hakları ise insanlar arası alışveriş ve borç ilişkileri şeklinde tanımlanmıştır. Allah hakları yukarıdan aşağıya doğru emredici, düzenleyici hükümleri ifade eder ve dava, sulh, af, hakkın düşürülmesi gibi hususlara konu olmaz. Kul hakları ise tüm bu sayılanların mümkün olduğu, kulların karşılıklı ilişkilerini düzenleyen serbest bir alanı ifade eder. Allah hakkı sayılan emredici ve düzenleyici bazı kurallar kul haklarına da hakimdir ve bu kurallar tarafların birbirlerine haksızlık yapmalarına engel olur. Allah hakları kul haklarının düzgün bir şekilde yürütülmesini temin eder. Günümüzde Allah ve kul hakkı ayrımının kamu ve özel hukuk ayrımına denk geldiği yönünde yaygın bir kanaat vardır. Her iki ayrımın temel ölçütleri açısından bu mukayese mümkün görülebilirse de Allah ve kul hakkı ayrımının kaynağının Allah'ın hükmü olması bu iki ayrımın en temel farkını ifade eder. Allah ve kul hakkı kavramsallaştırması bir hukuk tasnifi olmanın yanı sıra İslam hukuk felsefesi açısından da önemlidir. Bugün hukuk felsefesi ve etiği açısından tartışılan ötenazi, gen teknolojileri, kürtaj ve bu konuların temelinde yatan insan hak ve özgürlüklerinin sınırları, nükleer ve biyolojik silahlar gibi pek çok konu Allah ve kul hakkı perspektifinden tartışılmalıdır. Kişilerin sadece kendilerini ilgilendiren konularda istediği gibi davranması mümkündür ve burası kul hakları alanını oluşturur. Fakat yukarıda ifade ettiğimiz konular kişilerin sadece kendilerini değil tüm insanlığı ve âlemi etkileyen sonuçlar doğurmaktadır. Dolayısıyla bu konularda tüm insanlığı ve tüm âlemi ihata eden bir perspektifle karar alınmalıdır. Bu perspektifi Allah hakları olarak tanımlanan hükümler sağlar. İnsanın kendi üzerinde bulunan müteâl bir otoriteye hesap vermeksizin aldığı kararlar ve yaptığı tasarruflar kendisi de dahil olmakla birlikte başka insanlara, yere, göğe ve tüm aleme zarar verebilmekte ve bunların geri döndürülemez şekilde fesada uğramasına sebebiyet vermektedir. Bu anlamda Allah hakları tüm insanları ve insanlığı muhafaza eden ve onların yararını gözeten her bir varlığa eşit mesafede duran objektif aşkın hükümleri ifade etmektedir. Şimdi ve gelecekte insanlığa ebedî mutluluğa erme şansı vermektedir."
