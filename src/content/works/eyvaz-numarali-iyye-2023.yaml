abstract: "Bu tez çalışmasında, (H:1267-1270/M:1850-1853) yıllarına ait“186 Numaralı Pirlepe Şer'iyye Sicili'nin”içerisindeki belgelerin özetleri hazırlanmıştır. Söz konusu dönemde Pirlepe kazasının idari ve sosyo-ekonomik yapısı üzerinde durulmuştur. Bu tez çalışması üç bölümden oluşmaktadır. Birinci bölümde“186 Numaralı Pirlepe Şer'iyye Sicili'nin”(H:1267-1270/M:1850-1853) tanıtımı ve değerlendirilmesi yapılmıştır. İkinci bölümde,“186 Numaralı Pirlepe Şer'iyye Sicili'nin”(H:1267-1270/M:1850-1853) tasnifi yapılıp, Pirlepe'de sosyo-ekonomik hayata dair bilgiler verilmiştir. Üçüncü bölümde ise,“186 Numaralı Pirlepe Şer'iyye Sicili'nin”(H:1267-1270/M:1850-1853) belge özetlerine yer verilmiştir."
