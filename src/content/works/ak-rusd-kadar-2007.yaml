abstract: "Birinci bölümde, temel kaynaklarda farz ve vacib kavramlarının kullanım biçimleri ele alınmıs, Kur'an-ı Kerim ve Sünnette yer alan ilgili kelimeler değerlendirilmistir. Sonraki bölümde farz ve vâcib kavramlarının farklı eserlerde yer alan tanımları üzerinde durulmus, mahiyeti, sınırları ve diğer kavramlarla iliskisiyle beraber, ilgili değerlendirmeler verilmis, farz-vâcib ayrımının temellerine inilerek, bu ayrımın dinamikleri tespit edilmeye çalısılmıs, kaynağına, sübûtuna, zamanına, belirli olusuna, kapsamına, doğrudanlığına ve sünnet karsısındaki konumuna göre yapılan sınıflandırmalar ve bunlara iliskin değerlendirmeler verilmistir. Son bölümde farz ve vacibin kaynakları ve nitelikleri üzerinde durulmus, varlık, mükellef, uygulama ve sonuç bakımından niteliksel açıklamalar ve değerlendirmeler yapılmıs, böylece ?bn Rüsd'e kadar geçen süreçte farz ve vâcib kavramlarının takip ettiği gelisim asamaları sunulmaya gayret edilmistir."
