abstract: "İslam ümmeti Kitab ve sünneti, dinin aslî kaynağı olarak kabul etmiştir. Bu doğrultuda müctehid imamlar da hadisleri dikkate alarak hüküm ve fetva vermişlerdir. Hadis ve sünnete bakış açısı noktasında Hanefîlerin de genel İslam düşüncesinden ve diğer mezheplerden çok farklı olmadığını söylemek en doğru yaklaşım olacaktır. Ebû Hanîfe ve talebeleri başta olmak üzere bütün Hanefî âlimlerin görüşlerine bakılacak, usul ve furû' eserleri gözden geçirilecek olursa bu husus net bir şekilde anlaşılacaktır. Böyle olmakla birlikte sahih hadislerle amel etmeyip reyleriyle hüküm verdikleri gerekçesiyle Ebû Hanîfe ve ashabı ile sonraki Hanefîlere yönelik pek çok eleştiriler yapılmıştır. Fakat onların bir hadisle amel etmemesinin kendilerince pek çok gerekçesi bulunmaktadır. Hanefîlere ait fıkıh usulü eserlerinde onların bazı hadislerle hangi gerekçelerle amel etmediklerine dair bilgilere rastlamak mümkündür. Bu minvalde araştırmamızın bir giriş, beş bölüm ve sonuç kısmından oluştuğunu belirtmek isteriz. Giriş bölümünde; araştırmanın konusu, önemi, amacı kapsamı, metodu ve kaynakları hakkında bilgiler verilmiştir. Birinci bölümde; Hanefîlerin hadislerle hangi gerekçelerle amel etmedikleri hususuna geçmeden önce konuya zemin teşkil etmesi amacıyla Hanefîlerin hadis ve sünnete yaklaşımları ile sahih hadislerle amel etmedikleri gerekçesiyle onlara yöneltilen eleştirilere ve Hanefîlerin bu eleştiriler karşısındaki tutumlarına yer verdik. İkinci bölümde Hanefîlerin sahih hadislerle amel etmemelerinin umumi mahiyetteki gerekçelerini, üçüncü bölümde ise sened ve metinle ilgili olan gerekçeleri ele aldık. Dördüncü bölümde, ilk üç bölümde tespit edilen gerekçelerin uygulamasını ve pratiğini gösterme amacıyla Hanefîlerin amel etmedikleri on örneğe yer verip onların bu konudaki hadislerle amel etmeme gerekçelerini izah ettik. Beşinci bölümde ise Hanefîlerin dışındaki mezheplerin de amel etmediği sahih hadislerin olup olmadığı sorusuna cevap aradık. Her ne kadar bu bölüm çalışmamızla doğrudan alakalı olmasa da sahih görülen bazı hadislerle amel etmeme hususunun Hanefîlere mahsus olup olmadığını tespit için bu bölümün de önemli olduğuna kanaat getirdik. Sonuç bölümünde de çalışmamızın genel bir özetini ve vardığımız neticeleri zikrettik."
