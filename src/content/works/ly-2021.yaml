abstract: "Senegal'deki Kur'an medreseleri hakkında yazılabilecek en önemli araştırmalardan biri Senegal'deki bu Kur'an medreselerinde eğitim gören çocukların hayatları üzerine yapılan araştırmalardır. Yaşamları yasal haklarla orantılı mı yoksa değil mi? Bu nedenle bu araştırma, Senegal'deki Kur'an medreselerinde çocukların nasıl eğitim aldığını ele alan İslâm Hukukuna Göre Senegal'deki Din Eğitimi Kurumlarında Kullanılan Yöntemler (Senegal'de Uygulanan Eğitim Yönteminin İslâm Fıkhı Açısından Tahlîli) başlığı altında toplanmıştır. Birinci bölümde araştırmacı Kur'an-ı Kerim'i öğrenmeye ve öğretmeye çalışarak Senegal'i, coğrafyasını, kabilelerini ve çevresini, İslâm'ın buraya giriş tarihini ve Fransız sömürgecilerinden gelen zorluklara rağmen acı çekmiş olan Müslümanların dinle olan ilişkisinin gücüne değinmiştir. İkinci bölümde, İslâm öğretilerini yaymakla ilgilenen şeyhler tarafından temsil edilen, sömürgeciliğe tüm gücüyle savaşan geleneksel Kur'an medreseleri de dahil olmak üzere Senegal'deki Kur'an medreselerinde eğitim yöntemlerinden, sahipleri geleneksel Kur'an medreseleri mezunlarından olduğu için bu geleneksel Kur'an medreselerinin uzantılarına ve entegrasyonuna dayanan model Kur'an medreselerinden bahsetmiştir. Daha sonra üçüncü bölümde, genel olarak çocukların meşru haklarına ve özellikle bu Kur'an medreselerinin duvarlarına bağlı kalmaları durumunda eğitim hakkı, güvenlik, huzur, süreklilik ve çocuğun çevredeki hakkı da dahil olmak üzere yasal haklarına değinilmiştir. Son bölümde ise çocuklar için bu yasal hakların elde edilmesinde kullanılan yol, yöntem ve uygulamalardan bahsedilmiştir. Sonuç olarak, Senegal'deki bu Kur'an medreselerinin çeşitli alanlarda gelişmesine yol açabilecek tavsiye, çözüm ve önerilerinin sunulması unutulmamıştır."
