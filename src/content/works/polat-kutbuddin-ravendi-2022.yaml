abstract: "Bu çalışmada hicrî 6. Yüzyılda yaşamış, yaklaşık altmış üç eseri bulunan, İran'ın Kâşân şehrinin Râvend köyünde doğmuş olan Şiî müfessir Kutbuddîn er-Râvendî'nin“Fıkhu'l-Kur'ân”adlı tefsiri, kırâat-yorum ilişkisi açısından ele alınmıştır. Adı geçen eserde kırâatlerin tespiti ve ahkâm ayetlerini anlama hususunda kırâatlerin nasıl bir etkisi olduğu tespit edilmeye çalışılmıştır. Çalışmamız giriş, iki bölüm ve sonuçtan oluşmaktadır. Giriş bölümünde araştırmanın konusu, amacı, yöntemi, kaynakları hakkında bilgi verilmiştir. Birinci bölümde Kutbuddîn er-Râvendî'nin hayatına, ilmi konumuna, hocalarına, öğrencilerine, eserlerine ve çalışmasını yaptığımız eserin muhtevasına değinilmiştir. İkinci bölümde kırâat açısından ele alınan ayetler ve bu kırâatlerin Kur'ân'ın anlamına ne gibi etkisi olduğu incelenmiş, her başlık altında gerekli açıklamalar yapılmıştır. Çalışmamız sonuç ve kaynakça ile bitirilmiştir."
