abstract: "İslâm ceza hukukunda çocuğun konumu, sahip olduğu haklar ve üstlendiği sorumluluklar bakımından özel bir değerlendirmeyi gerekli kılmaktadır. Bu çalışmada, çocuğun cezaî ehliyeti ve buna bağlı olarak had, kısas ve taʿzîr cezaları karşısındaki durumu incelenmiş; haklarının kapsamı ve sorumluluğunun sınırları ele alınmıştır. Araştırma, klasik fıkıh literatürü ile modern akademik kaynakların birlikte incelenmesiyle yürütülmüş; nitel araştırma yöntemlerinden tarihsel dokümantasyon tekniği ve içerik analizi kullanılmıştır. Ayrıca günümüz hukuk sistemleriyle karşılaştırmalı değerlendirmelere de yer verilmiştir. Elde edilen bulgular, İslâm ceza hukukunda çocuğun cezaî sorumluluğunun biyolojik yaştan ziyade gelişimsel olgunluk ve temyiz kudretine dayandırıldığını göstermektedir. Bu çerçevede çocukların ağır cezaî yaptırımlardan korunduğu, had ve kısas cezalarının çocuklara uygulanamayacağı hususunda mezhepler arasında görüş birliği bulunduğu tespit edilmiştir. Taʿzîr yaptırımlarının ise cezalandırmadan ziyade eğitim ve ıslah amacı taşıyan tedbirler olarak düzenlendiği anlaşılmıştır. Sonuç olarak, İslâm ceza hukukunun çocuklara yönelik koruyucu ve ıslah edici yaklaşımı, modern çocuk adalet sistemleriyle benzerlikler taşımakla birlikte çocukların gelişim düzeyini esas alan özgün bir anlayış ortaya koymaktadır. Bu yaklaşım, çocuğun ağır cezalardan korunması, adil yargılanma, mahremiyetin korunması, teʾdîb ve eğitim önceliği gibi temel haklar etrafında şekillenmektedir. Çalışma, çocuğun hak ve sorumluluklarını birlikte ele alan bütüncül bir değerlendirme sunarak literatüre katkı sağlamayı hedeflemektedir."
