abstract: "21'inci yüzyılın bilgi çağında en çok araştırılan ancak en az anlaşılan konulardan biri şüphesiz İslam'ın sağladığı insan hakları, hukukun üstünlüğü ve inanç özgürlüğüdür. Bu çalışma, tarihi belgeleri göz önüne alarak, İslam'da insan hakları ve hukukun üstünlüğünü incelemeyi ve yeniden hatırlatmayı amaçlamaktadır. Medine Vesikası ve Veda Hutbesi gibi belgeler ve antlaşmalar, Batı'nın görmezden geldiği ve bugünkü Müslümanların da unutmaya yüz tuttuğu önemli evrensel mesajlar içermektedir. Çeşitli grup, ırk ve inançları bir araya getiren Peygamberimiz (s.a.v.), birçok uluslararası anlaşma ve sözleşmelere rağmen hiç bir toplumun yakalayamadığı bir uyumu başarılı bir şekilde oluşturmuştur. Etnik ve dini gruplar arasındaki çatışmaları yumuşatmaktan uzak modern devlet sistemleri toplumdaki farklı unsurları tek bir sisteme zorunlu kılarken, Medine dönemi İslam perspektifi, toplumu oluşturan her unsura kendi hukuk sistemlerini uygulama imkânı vererek daha geniş hak ve özgürlükler tanımıştır. İslam'ın yaşanmış ideal bir pratiği olarak Medine toplumunun, ve İslam'ın hoşgörü, çoğulculuk, saygı ve özgürlük gibi öğretilerinin dünyaya hatırlatılması, Müslüman toplumlar tarafından da hatırlanması günümüz için bir ihtiyaçtır."
