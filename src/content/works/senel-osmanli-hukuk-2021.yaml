abstract: "Bu tezde, Osmanlı Hukûki Âile Kararnâmesi hükümleri ile Türk Medeni Kanununun Aile hukukuna dair hükümleri karşılaştırılmalı olarak ele alınmıştır. Her iki düzenlemenin benzer ve farklı yönlerinin tespit edilmesi amaçlanmıştır. Çalışmada, 1917 tarihli Hukûk-i Aile Kararnâmesinin eklektik metotla hazırlandığı, hukukta çoklu hukuk sistemini sonlandırmak için Yahudi ve Hristiyanlara ait hükümleri de içerdiği belirlenmiştir. Her iki düzenlemenin evlenme engellerinde benzer hükümler içerdiği, ancak Türk Medeni Kanununun süt hısımlığı ile Müslüman kadının gayri müslim bir erkekle evliliğini engel olarak görmediği tespit edilmiştir. Türk Medeni Kanununun tek eşliliği esas aldığı, Kararnâmenin ise tek eşliliği teşvik edici hükümler içerdiği görülmüştür. Türk aile hukukunun mahkeme dışında boşanmayı kabul etmediği, Kararnâmenin ise mahkeme dışı boşanma olan talâk'ı kabul ettiği saptanmıştır. Ayrıca Kararnâmenin Osmanlı İmparatorluğunun hukuku olan Hanefi mezhebinden farklı olarak kadına daha geniş boşanma hakkı tanıdığı belirlenmiştir. Kararnamenin 1919'da yürürlükten kaldırılmasına rağmen uzun yıllar Müslüman ülkelerde yürürlükte kaldığına işaret edilmiştir."
