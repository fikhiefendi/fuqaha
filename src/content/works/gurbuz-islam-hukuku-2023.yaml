abstract: "İslam hukuku birçok disiplinle ilişkili olmakla beraber toplumsal hayatın önemli bir parçası olan tıbbi bilgi ile de yakından alakalı olup tıp meselelerinin İslam hukuku çerçevesinde incelenmesi büyük bir önem arz etmektedir. Daha çok tedavinin etik yönü üzerine yoğunlaşılan bu çalışmalarda hastayı ilgilendiren her husus, üzerinde düşünülmesi gereken hassas noktalardır. Bu çalışmada ise İslam hukuku açısından hastanın tedaviyi reddetme hakkı aşı örneği üzerinden incelemektedir. Kişinin tedavi talebinin ardından hangi sebepler ile ret kararına ulaşıldığı, hastanın hiçbir şekilde tedaviye yanaşmak istememesi durumları ve bu kararını hangi sebeplere dayandırdığı sorusunun cevabı aranmaktadır. Ayrıca bu sorunun cevabının aranabileceği birçok örneğin incelenmesi mümkün olmayacağı için toplumsal açıdan öncelikli ve önemli bir konu olan aşı meselesi üzerinden bir değerlendirme yapılmasının uygun olacağı öngörülmektedir. Bu çalışmada ise öncelikli olarak hastanın tedavi hakkında bilgilendirme boyutu ve hastanın rızası ele alınmaktadır. İkincil olarak hastanın ret hakkı imkanının sorgulanması, hasta ehliyeti ve bu ehliyetin bağlı olduğu durumlar sunulmaktadır. Son olarak farklı yönlerden incelenen aşı meselesine dair başta fıkhi olmak üzere etik ve hukuki bir değerlenmeler yapılmaktadır. Tez, literatür açısından ilk olup alandaki diğer çalışmalara öncülük etmesi umulmaktadır."
