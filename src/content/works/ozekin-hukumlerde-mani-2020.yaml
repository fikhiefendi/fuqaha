abstract: "İslam Hukukunda hüküm konusu fıkıh usûlünün merkezinde yer almaktadır. Şer'î delillerden çıkarılan hükümler konusu, İslâm hukukunun kaynaklarından sonra fıkıh usûlünün en önemli ana konularından birisini teşkil etmektedir. Fıkıh usûlcüleri konunun önemine binaen hükme giden yolları tesbit etmek için büyük gayret sarfetmişlerdir. Bu sebeple hükmü daha anlaşılır kılma maksadıyla farklı tanım ve tasniflere tabi tutmuşlardır. Bu kapsamda hüküm genel olarak teklîfî ve vaz'î hüküm olmak üzere ikiye ayrılmaktadır. Vaz'î hükmün kapsamına giren mâni'in, değişik açılardan birçok kısma ayrıldığı görülmektedir. Mâni', hükümlerin tatbiki konusunda aktif rol oynamaktadır. Nitekim bir hükmün sadece mevcudiyeti, o hükmün tatbiki için yeterli gelmemektedir. Hükmün tatbiki için ayrıca mâni'in de bulunmaması gerekmektedir. Şari'in kastı, doğrudan mâni'in kendisine yönelmemekte, gerçekleşip gerçekleşmemesini hedef almamaktadır Bununla birlikte şâri'in hükümleri koymadaki kasdı hüküm konusunun anlaşılmasında önemlidir. Çünkü şâri'in mâni'deki maksadını kavramak mükellefin mâni' konusundaki tutumunu etkilemektedir. Mükellefin kastının şari'in kastı ile uyumlu olması gerekmektedir. Bu sebeple İslam Hukuk Metodolojisinde mâni'i kavramak büyük önem taşımaktadır."
