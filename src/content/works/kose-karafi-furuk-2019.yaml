abstract: "Bu tez ilk olarak furûk kavramının Arap dili ve belâgatı çerçevesindeki kapsam ve içeriğine işaret etmektedir. Bu bağlamda sözlük anlamında benzer manalar taşıyan lafızların eş anlamlı kabul edilip edilemeyeceği tartışmasını iki tarafın görüş ve delillerini vererek ortaya koymaktadır. Aynı şekilde nahiv ve belagât alanında da furûka konu olabilcek başlıkların olduğuna dikkat çekmiş ve bunların bazen müstakil birer konu başlığı olabileceği gibi harf, edevât veya ifade çeşitliliğine bağlı farklı anlam yansımaları olarak karşımıza çıkacağına işaret etmiştir. Daha sonra ise furûk kavramı üzerinden Arap dili ile fıkıh usulü arasındaki ilişkiyi ortaya koymakta ve bunu kavaid-i fıkhiyye alanında yazılmış en kapsamlı te'lif olan Karâfî'nin el-Furûk adlı eserinde yer alan dilsel kavramlar başlığı ile özel bir boyuta taşımaktadır. Çalışmamız eserde yer alan lügat, nahiv ve belâgat ile doğrudan ilişkili olan, aynı zamanda bu alanlarda birbirine benzer kabul edilen konu başlıklarının bir usulcü gözüyle nasıl değerlendirildiğini ve özellikle de nahiv (gramer) alanındaki farkların fıkıhta ne gibi pratik sonuçlar doğurduğunu ortaya koymaktadır."
