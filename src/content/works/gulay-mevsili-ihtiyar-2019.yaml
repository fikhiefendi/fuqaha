abstract: "Fıkıhta, şeklen birbirine benzeyip hükümlerin farklı olduğu meseleleri inceleyen furûk-ı fıkhiyye, fıkıh ilminin bir alt disiplini olarak ilim dünyasında yerini almıştır. Bu çalışmanın amacı el-İhtiyâr adlı eseri furûk-ı fıkhiyye bağlamında incelemektir. Bu amaçla öncelikle eser furûk-ı fıkhıyye bağlamında taranmıştır. Daha sonra furûk örneği olabilecek meseleler tesbit edilerek fıkıh konularına göre tasnif edilmiştir. Ardından meseleler tahlîl edilerek farkın sebebi izah edilmiştir. Çalışma, bir giriş ve iki bölümden oluşmaktadır. Giriş bölümünde araştırmanın amacı ve önemi hakkında bilgi verilmiştir. Birinci bölümde ise furûk-ı fıkhiyyenin mahiyeti ve fıkıh ilmindeki yeri ve öneminden bahsedilmiştir. Son olarak ikinci bölümde, tesbit edilen 94 furûk örneğinin tahlîli yer almaktadır. Tezde ulaşılan sonuçlara göre, furûk meselelerinin oluşumunda şer'î delillerin yanında Arapça dil bilgisinin de etkili olduğu görülmüştür. Tesbit edilen furûk örneklerinin furû' türü eserlerin hemen hepsinde mevcut olması furûkun, fıkhın bir alt disiplini olduğunun da göstergesidir. Ayrıca furûk ilmi ile, şeklen birbirine benzeyen ve bu nedenle dini veya hukûkî problemlere sebebiyet verebilecek muhtemel karışıklıkların önüne geçildiği gözlemlenmiştir. Furûk alanında müstakil olarak h. IV/X. asırda başlayıp V/XI. asırda zirveye ulaşan te'lif faaliyetleri, X/XVI. asırdan itibaren yok denecek kadar azalmıştır. Bunun doğal sonucu olarak furûk-ı fıkhiyye fıkıh içerisindeki konumunu kaybetmiş ve zihinlerdeki varlığını yitirmiştir."
