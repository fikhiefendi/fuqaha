abstract: "Bu çalışma, Moritanya'daki tarım sektörünün mevcut durumunu açıklayarak bu sektörün karşı karşıya bulunduğu güçlükleri ve geleceğe yönelik beklentilerini ortaya koymayı amaçlamaktadır. Ayrıca, İslami finans yöntemlerinin sahip olduğu özgün nitelikler ve avantajlar çerçevesinde, bu sektörün geliştirilmesinde İslami finansın oynadığı rol ve önemini değerlendirmeyi hedeflemektedir. Araştırma kapsamında, tarım sektörüyle ilgilenen belli bir grupla gerçekleştirilen anketler ve mülakatlar aracılığıyla, bir yandan Moritanya'daki tarım sektörüne yönelik İslami finans uygulamalarının mevcut durumu analiz edilmiş, diğer yandan bu uygulamaların geliştirilmesine yönelik araç ve yöntemler ele alınmıştır. Çalışmada elde edilen bulgular, tarım sektöründe İslami finansın rolünün henüz beklenen düzeye ulaşmadığını ortaya koymuştur. Bu doğrultuda araştırmada, anket ve mülakat sonuçlarına ek olarak sektöre uygun bazı önerilen finans modellerine de yer verilmiştir. Sonuç bölümünde ise, Moritanya'daki tarım sektörünün önemi vurgulanmış ve sektörün sürdürülebilir bir şekilde geliştirilmesi için başta adalet ve ahlaki değerlere dayalı finans imkânlarının sağlanması olmak üzere gerekli önlemler ve tavsiyeler sıralanmıştır"
