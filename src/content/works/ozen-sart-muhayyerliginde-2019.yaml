abstract: "Satım akdinde, taraflarca yapılan bir alışverişi kesinleştirmemek, satılan malı geri vermek veya geri almak şart koşulabilir ki buna İslam hukukunda 'şart muhayyerliği' denilmektedir. Tez çalışmamızda, şart muhayyerliğinde malın mülkiyeti meselesi ele alınmıştır. Çalışmamız bir giriş ve iki bölümden oluşmaktadır. Giriş kısmında konunun fıkıh ilmi içindeki yerine, sınırlandırılmasına, araştırmanın amaç ve yöntemi ile kaynaklarına dair bilgilere yer verilmiştir. Mülkiyet ve muhayyerlik kavramları ele alınmış, kısaca muhayyerlik çeşitlerine değinilmiştir. Çalışmamızın birinci bölümünde konuyla ilgili naslara yer verilmiş. Şart muhayyerliğine uygun olan ve uygun olmayan akit türleri, muhayyerlik süresi ve muhayyerliğin sona erdiği durumlar incelenmiştir. Tezimizin asıl kısmını oluşturan son bölümde ise mülkiyetin tabi sonucu olan tasarruf ve tazmin durumları ele alınmıştır."
