abstract: "Bankalar, temel fonksiyonu fon bazlı aracılık hizmeti olan finansal kuruluşlardır. Bankalar, gerçek ya da tüzel kişilerin fon fazlalıklarını toplayıp muhafaza etmekte, topladığı bu kaynakları fon talebi olan gerçek ve tüzel kişilere kullandırım hizmeti olarak sunmaktadırlar. Gerçekleştirilen hizmetin merkezinde fon bulunmakta olup, fon bu özelliği ile atıl bırakılamayacak kadar kıymetli, eksikliği gözardı edilemeyecek kadar kritik bir unsur olarak görülmektedir. Özellikle 2008 yılında yaşanan küresel likidite krizi sonrasında bankalarda fon yönetiminin ne kadar önemli olduğu bir kez daha tecrübe edilerek anlaşılmıştır. Bankaların Hazine fonksiyonu, fon toplayan ve fon kullandıran farklı birimler için merkez konumunda, diğer bir tanımla banka içinde banka gibi rol almaktadır. Bankaların kar merkezi olan, başta şube, hazine ve diğer birimler arasında gerçekleşen fon hareketlerine ait finansman maliyetlerinin, piyasa koşullarına uygun, objektif kriterler ile değerlendirilip, gelir/gider dağıtım mekanizması ile daha realist finansal performans gösterimi Fon Transfer Fiyatlama (FTF) sistemi aracılığı ile yapılabilmektedir. Bankaların temel iki ürünü olan kredi ve mevduat çerçevesinden FTF işleyişi şöyle açıklanabilir; Fon transfer fiyatı uygumasında kar merkezleri, krediler için müşterilerinden kredi oranı ve vadeye bağlı gelir elde ederken, kullandırılan fonun maliyeti kadar da fon transferini gerçekleştirdiği Hazine birimine, belirlenmiş içsel fiyatlama üzerinden, kullandırılan kredinin vadesi süresince gider ödemesi yapar. Mevduat için, müşterilere belirlenen vade ve oran üzerinden gider olarak faiz /kar payı ödemesi yapılırken, toplanan fon'un Hazine birimine devri sonrası, belirlenmiş içsel fiyatlama üzerinden toplanan mevduatın vade süresince gelir elde eder. Çalışmada, bankacılık ve katılım bankacılığı ile ilgili bilgilendirme sonrası FTF'nin tanımı ve bankalar için önemine değinilmiştir. Daha sonra FTF sistemi ve bileşenlerine ait tanımlamalar yapılmış ve örnek seçilen katılım bankası şubesindeki gerçek veriler baz alınarak model uygulama gerçekleştirilmiş, yevmiye kayıtları ile finansal tablolara yansımaları açıklanmış, sonuçların hipotezler çerçevesinde istatistiki anlamlılığı görülmüştür."
