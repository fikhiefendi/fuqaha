abstract: "Bankacılık sisteminde müşteri memnuniyetinin önemi gün geçtikçe artmaktadır. Verilen ürün ve hizmet kalitesinde, müşterilerin istek ve ihtiyaçlarına yönelik hizmetler verilmesi gerekmektedir. Bunda başarılı olabilmeleri için bankanın müşterilerini iyi tanıması çok önemlidir. Geleneksel pazarlamadan modern pazarlamaya geçişte oluşan değişimin en önemli göstergelerinden biri olan hizmet, ürün kalitesi ve müşteri memnuniyeti çağın vazgeçilmez stratejilerinden biri konumuna gelmiştir. Özellikle bankacılık sektöründe küreselleşmeden dolayı teknolojinin yönlendirdiği değişim, bu sektörde farklılaşma ve rekabetinde temelini oluşturmuştur. Bu çalışmada Kuveyt Türk Katılım Bankası üzerinden bankacılık sektöründe müşterilerin aldıkları hizmetlerden algıladıkları kalite düzeyleri ile algıladıkları ürün memnuniyet düzeylerinin müşterilerin sosyo-demografik özelliklerine göre farklılık gösterip göstermediğinin incelenmesi amaçlanmıştır. Araştırmada; hizmet ve ürün kalite memnuniyeti konusunda banka müşterilerine yönelik olarak hazırlanan bir anket, 160 kullanıcıya uygulanmıştır. Elde edilen veri, farklılık analizlerine tabi tutulmuştur. Çalışma sonucunda, demografik özelliklere göre algılanan hizmet kalitesinde çok fazla farklılıklar elde edilmemişken; yaş, eğitim, iş ve aylık gelir değişkenine göre banka müşterilerinin memnuniyet düzeylerinde farklılıklar görüldüğü anlaşılmıştır."
