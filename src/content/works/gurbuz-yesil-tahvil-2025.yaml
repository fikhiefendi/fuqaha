abstract: "Küresel ölçekte derinleşen iklim krizi, çevresel sürdürülebilirliği yalnızca bir çevre politikası meselesi olmaktan çıkararak, finansal sistemlerin temel yapı taşlarından biri hâline getirmiştir. Bu dönüşüm sürecinde, sermayenin çevresel ve sosyal kriterlere duyarlı alanlara yönlendirilmesini amaçlayan sürdürülebilir finans yaklaşımları, geleneksel yatırım pratiklerine alternatif bir paradigma olarak ön plana çıkmaktadır. Günümüzde sürdürülebilir finansal araçların, toplam küresel yatırım portföylerinin yaklaşık %7 10'unu oluşturduğu ve bu oranın artış eğiliminde olduğu görülmektedir. Özellikle yeşil tahviller, sürdürülebilir endeksler ve çevresel temalı yatırım fonları gibi finansal araçlar hem etik yatırım anlayışının hem de uzun vadeli değer yaratma stratejilerinin somut tezahürleri olarak değerlendirilmektedir. Bu doğrultuda, sürdürülebilir finans piyasalarında faaliyet gösteren yatırım araçlarının karşılıklı bağımlılık düzeylerinin anlaşılması, etkin portföy yönetimi ve risk çeşitlendirmesi açısından stratejik bir önem arz etmektedir. Ayrıca, İslami finans ilkeleri doğrultusunda geliştirilen sukuk endekslerinin sürdürülebilir finansal araçlar arasında değerlendirilmesi, çevresel ve sosyal sorumluluk odaklı yatırımların yalnızca seküler finans dünyasında değil, aynı zamanda İslami finans sistemleri içerisinde de önemli bir gündem maddesi hâline geldiğini göstermektedir. Bu durumun analiz edilmesi, İslami finans sisteminin sürdürülebilirlik eksenli yatırım trendleriyle nasıl bütünleştiğini anlamak açısından dikkat çekici bir alan oluşturmaktadır. Ancak literatürde, sürdürülebilir finansal araçlar arasındaki dinamik bağımlılık ilişkilerini özellikle bölgesel düzeyde inceleyen ampirik çalışmalar açısından önemli sınırlılıklar bulunmaktadır. Bu çalışma, ABD, Avrupa ve Asya bölgelerinde sürdürülebilir finansal araçlar arasındaki bağımlılık yapısını inceleyerek, yatırımcılar için etkin portföy stratejileri geliştirmeye yönelik bulgular sunmayı amaçlamaktadır. Çalışmada, 2016-2024 dönemine ait bölgesel yeşil tahvil ve temiz enerji endeksleri ile farklı derecelere sahip sukuk endeksleri kullanılarak çapraz kantilogram yöntemi uygulanmıştır. Analiz sonuçlarına göre, ABD ve Avrupa piyasalarında yeşil tahvil ve sukuk endekslerinin temiz enerji endeksleriyle arasında pozitif bağımlılığın olduğu, portföy çeşitlendirme açısından yatırımcılara avantaj sağlamadığı tespit edilmiştir. Buna karşın, Asya piyasasında yeşil tahvil ve temiz enerji endeksleri arasında negatif bağımlılık tespit edilmiştir. Bu durum, Asya piyasasında söz konusu araçların portföy oluşturma sürecinde risk yönetimi ve getirilerin optimize edilmesi açısından avantaj sağlayabileceğini ortaya koymaktadır. Ayrıca, Asya piyasalarında sukuk ile temiz enerji endeksleri arasındaki ilişki ise genel olarak pozitif bağımlılık biçiminde şekillendiği tespit edilmiştir. Elde edilen bulgular, sürdürülebilir finans piyasalarının bölgesel dinamiklere bağlı olarak farklılaştığını ve yatırımcıların portföy stratejilerini belirlerken bu farklılıkları göz önünde bulundurması gerektiğini ortaya koymaktadır."
