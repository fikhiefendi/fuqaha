abstract: "Bu çalışmada; Kur'ân'ın daha iyi anlaşılması, tefsir ve tevil edilmesi adına kaleme alınan tefsir külliyatının en özgün eserlerinden olan Mâtürîdî'nin Te'vîlâtü'l-Kur'ân'ı ile Zemahşerî'nin Keşşâf adlı tefsirleri, ulûmü'l-Kur'ân'ın temel başlıkları çerçevesinde ele alınıp mukayese edilmiştir. Çalışmanın başındaki“Kur'ân'ı tefsir etmek isteyen hiçbir müfessir, ulûmü'l-Kur'ân denilen ilmî verilere bigâne kalamaz”şeklindeki ön kabulümüz, çalışmanın sonunda perçinlenmiştir. Bu çalışma ile görülmüştür ki; her bir tefsir, bir taraftan müellifinin içinde bulunduğu dış dünyanın diğer taraftan ise müellifinin iç dünyasının izlerini taşımaktadır. Çalışmaya konu olan her iki tefsirde de, ulûmü'l-Kur'ân kapsamında herhangi bir tanıma, özel konu belirlemesi ve nicel tasniflere neredeyse hiç yer verilmezken, müelliflerinin kendi özgün duruşlarını yansıtan bir üslup hâkimdir. Buna göre Mâtürîdî, daha ziyade anlam ve makasıt eksenli bir bakış açısıyla meseleleri ele alırken Zemahşerî, filolojik tahlillerin yoğunlukta olduğu bir üslup tercih etmiştir. Yine de iki eserde hâkim olan bakış açısı, bir taraftan ulûmü'l-Kur'ân verilerine tamamen teslim olmamak, diğer taraftan ise söz konusu verilerden kendini müstağni saymamak şeklinde belirmektedir."
