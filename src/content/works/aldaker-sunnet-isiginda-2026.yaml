abstract: "Peygamberi Sunnet, Islam hukukunun ikinci kaynagi olarak kabul edilmekte olup, Islam ekonomik tasavvurunun insasinda, temel ilkelerinin sistemlestirilmesinde ve teorik ile pratik boyutlarinin duzenlenmesinde asli bir dayanak teskil etmektedir. Ekonomik problemlere cozum sunmanin yani sira, basta Kuran ve Sunnet olmak uzere Islam teshriinin temel kaynaklari; ilkeler, ozellikler, maksatlar, kurallar ve hukumler butunu araciligiyla bu meseleleri ele alan deger temelli ve normatif bir cerceve ortaya koymaktadir. Bu calisma, Peygamberi Sunnet'in isaret ettigi sekliyle Islam ekonomisinin temel ozelliklerini ve ilkelerini ortaya koymayi, ekonomik faaliyeti duzenleyen ve yonlendiren genel esaslarini aciklamayi amaclamaktadir. Ayrica calisma, ekonomik alandaki nebevi rehberligin ahlaki ve insani boyutuna ve bunun sosyal adaletin, toplumsal dayanismanin ve ekonomik istikrarin saglanmasindaki rolune isik tutmayi hedeflemektedir. Arastirma, tumevarimci ve analitik yontemleri benimseyerek nebevi metinleri incelemekte ve bunlarin ekonomik boyutlarini Islam hukukunun yuksek maksatlari (Makasid al Sharia) cercevesinde analiz etmektedir. Calisma, Peygamberi Sunnet'in kati ve ayrintili bir ekonomik sistem sunmaktan ziyade, kapsamli ozellikler, evrensel ilkeler ve genel duzenleyici esaslar ortaya koydugu sonucuna ulasmaktadir. Bu esaslar, farkli zaman ve mekanlarda ekonomik sorunlara cozum uretebilen, kalkinma ve istikrari gerceklestirebilen dengeli bir Islam ekonomisinin insasi icin esnek bir cerceve olusturmaktadir."
