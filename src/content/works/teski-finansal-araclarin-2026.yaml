abstract: "Küresel finansal piyasaların giderek karmaşıklaştığı günümüz dünyasında, finansal araçların işletmelerin finansal durumlarını ve performanslarını doğru ve güvenilir bir şekilde finansal raporlama standartlarına göre raporlaması, finansal tablo kullanıcıları açısından büyük bir önem arz etmektedir. Türkiye'de bu alanda, Uluslararası Finansal Raporlama Standartları (UFRS) ile uyumlu şekilde hazırlanmış olan, Türkiye Finansal Raporlama Standartları (TFRS) ve Türkiye Muhasebe Standartları (TMS) ile buna karşılık faizsiz finans prensipleri çerçevesinde özellikle katılım finans kuruluşlarına özgü muhasebe uygulamalarını düzenlemekte olan, AAOIFI (Accounting and Auditing Organization for Islamic Financial Institutions) ile uyumlu şekilde hazırlanmış Katılım Finans Muhasebe Standartları (KFMS) geliştirilmiştir. Bu farklı yaklaşımlar, finansal araçların kayda alınması, değerlemesi ve finansal tablolarda sunulmasında önemli yapısal farklar yaratmaktadır. Bu tez, Türkiye Finansal Raporlama Standartları, Türkiye Muhasebe Standartları ve Katılım Finans Muhasebe Standartları çerçevesinde finansal araçların ölçüm, raporlama ve muhasebeleştirilmesine yönelik yaklaşımları karşılaştırmalı olarak incelemektedir. Çalışmada, her üç standart setinin temel ilkeleri, finansal araçlara ilişkin tanımlamaları ve raporlama yöntemleri detaylı biçimde analiz edilmiştir. Tez bulguları, KFMS'nin katılım finans kuruluşları için önemli bir düzenleyici çerçeve sunduğunu, ancak bu standartların etkin uygulanabilmesi için sürekli güncellenmesi ve uygulayıcıların bilinçlendirilmesi gerektiğini göstermektedir. Bu araştırma nitel bir yaklaşım benimsenerek doküman incelemesi yöntemine dayandırılmıştır. İlgili standart metinleri karşılaştırmalı olarak incelenmiş; akademik yayınlar, düzenleyici kurum raporları kullanılmış ve muhasebenin evrensel ilkeleri, katılım temelli finansal işlemlerle karşılaştığında finansal raporlama, ölçüm ve muhasebe kayıtlarına nasıl yansır sorularına cevap verilerek literatüre katkı sunacak karşılaştırmalı bir analiz ortaya konmuş, bu analiz örnek muhasebe kayıtları ve finansal raporlar ile desteklenmiştir. Muhasebe ilkelerinin iki farklı sistemdeki yorumunu netleştirmek, muhasebe profesyonelleri ile denetçilere iki farklı standart setine göre kayıt tutma rehberi sunmak ve düzenleyici kurumlara standartlar arasındaki uyumsuzlukların giderilmesi için veri sağlanarak bu farklı yaklaşımların oluşturduğu etkiler konusunda farkındalık yaratmak amaçlanmıştır."
