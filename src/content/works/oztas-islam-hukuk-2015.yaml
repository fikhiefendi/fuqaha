abstract: "İslâm'dan önceki ilâhî kanunlar İslâm nazarında üç türlü muâmeleye tabi tutulur. Ya eşdeğer gibi devam eder ya tamamen ilga edilir ya da tashih edilir. Bunun Kur'ân ve sünnette ve müçtehitlerin içtihatlarında yansımalarını açıkça görmek mümkündür. Bu çalışmamızda mezheplerin kabul gören bazı usûl kitaplarını esas alarak bu konuyu incelemeye çalıştık. Bu çalışmamızda özellikle mezheplerin bazı usûl âlimlerinin şer'u men kablenâ konusundaki görüşlerini incelerken geçmişten günümüze ışık tutan ve genel kabul gören bazı delillerin incelemeye çalıştık. Bunun için öncelikle gerçek kutsal kitapların (Tevrat, İncil, Zebur ve Kur'ân) mahiyetindeki konumuzla alakalı ibadet, muamelat ve ceza hükümlerinden bazı delillerin bir araya getirilmesi ve usülcülerin bu konuyla alakalı delilleri nasıl ve hangi alanlarda kullandıkları, günümüzde bu alanların kullanılıp kullanılamayacağı konusunu değerlendirmeye çalıştık. Ayrıca önceki şeriatlerin Kur'an'da adı geçen bazı peygamber kıssalarından ve kendi dönemlerindeki uygulamalarından hareketle, şer'u men kablenânın günümüze de ışık tutup tutamayacağını irdelemeye gayret ettik. Gayret bizden, başarı Allah'tandır."
