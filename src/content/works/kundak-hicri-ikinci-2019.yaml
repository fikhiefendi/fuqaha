abstract: "Bu çalışmada, hicrî ikinci yüzyılda yazılmış ve günümüze kadar varlığını sürdürmüş bazı fıkıh ve hadis eserleri çerçevesinde sarf akdine dair birtakım tartışmalar, modern akit teorisi sistematiği esas alınarak incelenmiştir. Bu bağlamda Mâlik b. Enes'in el-Muvatta'sı, Sahnûn'un Müdevvenetü'l-Kübra'sı, Abdürrezzak b. Hemmam ile İbn Ebû Şeybe'nin el-Musannef türü eserleri, Şeybânî ve Ebû Yusuf'un eserleri ve Şafiî'nin el-Üm adlı eseri çalışmanın genel sınırlarını belirleyen kitaplardır.Günümüz İslam Hukuku literatüründe hicri ikinci yüzyılda meydana gelen tartışmaları inceleyen çalışmalar yer almaktadır. Lakin bu çalışmalarda, genel olarak zikrolunan yüzyıllarda yaşayan fakihlerin genel görüşleri ve bu fakihlerin görüşlerinden hareketle akıl yürütme yöntemlerine dair tespitler yer almaktadır. Buna mukabil, sarf akdine dair Türkçe modern literatürde kaleme alınan çalışmalar da yeterli seviyeye ulaşmamıştır. Bundan dolayı bu çalışma sarf akdinin fürû-ı fıkıh eserlerinde tüm yönleriyle incelenmesi ve geleneksel dönem dünya ticâret hayatına dair incelemeleri içermesi bakımından diğer çalışmalardan farklılık arz etmektedir. Bu çalışmada geleneksel dünyada ticâret hayatının tarihsel gelişimi ve hicrî ikinci asırda kaleme alınan eserlerde sarf akdinin konumu ele alınmış ve sarf akdine dair hicrî ikinci asırda meydana gelen tartışmalar teorik ve pratik bilgiler doğrultusunda birbirleriyle mukayeseli olarak hukuk perspektifinde incelenmiştir. Sonuç olarak, sarf akdinin Peygamber(sav)'in sünneti ile belirlenmesine rağmen hicrî ikinci yüzyılda yaşayan fakîhler arasında kullandıkları deliller ve akıl yürütme yöntemlerinin farklılıkları sebebiyle birtakım tartışmaların meydana geldiği gözlemlenmiştir. Bu tartışmalar ele alındığında ise müelliflerin birbirlerinden etkilendiği, akde konu olan bedellerle ilgili konulara ağırlık verildiği ve dinar-dirhemle altın-gümüşün farklı muamelelere tabi tutulduğu görülmektedir."
