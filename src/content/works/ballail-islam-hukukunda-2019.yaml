abstract: "“İslam hukukunda taksitli satış”konusunu ele alan bu çalışmamız dört bölümden oluşmaktadır. Birinci bölümde genel manasıyla bey'(satış) konusu ele alınmakta ve satışın tanımı, prensipleri, türleri ve şartları incelenmektedir. İkinci bölümde; taksitli satış konusu üzerinde durulmakta ve taksitli satış ve semen (fiyat) ilişkisi ele alınmaktadır. Ayrıca taksitle satışın özellikleri üzerinde durulmakta ve bunun uygulanabilir olmasının sıhhat şartları ve ele alınmaktadır. Üçüncü bölümde; taksitle satışın meşruiyeti konusu incelenmektedir. Bu konuyu da vadeli (ecel) satışın meşruluğu, hükmü ve vadeli taksitli satışı ve taksitli satış da fiyatın artırılması konularını inceleyerek yapmaktadır. Dördüncü bölümde ise; murabaha konusunu incelemektedir. Bunu da günümüzde yaygın olarak kullanılan güncel taksitli satışlardan örnekler sunmaktadır. Ayrıca bu bölümde taksitli satışın bazı problemlerine ve bunların İslam hukukuna göre meşru çözüm yollarına değinilmiştir. Faizsiz bankalarda yaygın olarak kullanılan murabaha da bir taksitli satış çeşidi olarak ele alınmıştır."
