abstract: "Arap Dil Bilimi bağlamında es-Seâlibî'nin“Fıkhü'l-Luğat”ve es-Süyûtî'nin“el-Muzhir fî-İlmi'l-Luğa”İslâm âleminde ilim ve tefekkür sahipleri tarafından Arap dili üzerinde bazen birbirine yakın bazen farklı açılardan, bilim adına takdire şayan çabalar gösterilmiş, büyük hizmetler gerçekleştirilmiştir. Bu ilmî hizmetlerin sürdürülmesi hususunda Arap dilinin yeri çok önemlidir. Arap dili; Allah(c.c.) tarafından inzal buyrulan Kur'ân-ı Kerîm'e mihmandarlık yapmış zarf hükmündedir. Zarf, mazrufun rengiyle boyanarak Kur'ân-ı Kerîm'in dili, ümmetin din ve dünya işlerinin düzen ve intizamında gereken kavramların oluşmasında, kural ve düsturların konulmasında kaynaklık etmiştir. Bu çalışmalar neticesinde, edâ, sarf, nahiv gibi ilim dallarını içinde barındıran“Arap dilbilimi”oluşturulmuştur. Bu kavram, tarihi süreç içerisinde birden fazla terkip ile ifade edilmiştir. Hepsinde de dilin disipline edilmesi, kadimliği ve otantiğini koruma yanında diğer disiplinlere de referans olma amacı olduğu görülmektedir. Arap dili etrafında gelişen bilimler, güttüğü gaye bağlamında, sadece dili değil, aynı zamanda din, kültür, tarih ve sanat gibi zengin tarihî mirasın korunmasını da hedeflemektedir. İlk başlarda bilim insanları nahiv ile sarfın yanı sıra ses bilgisinden de söz etmiş ve bunların nasıl icra edileceğini göstermişlerdir. Ayrıca çalışmamızın başlığını teşkil eden Fıkhü'l-Luğa ve İlmü'l-Luğa gibi konulara temas ettikleri görülmektedir. Böylece bu bilim dalı, sözü edilen konulara ek olarak irab ve unsurları gibi başka konuları da kapsar hale geldi. Aynı şekilde uyum, isnad ve uyuşum gibi kavramlardan da söz edildi. İşte bütün bu bilimler Fıkhü'l-Luğa ve İlmü'l-Luğa ile ilgili konular dâhilindedir. Kendi başına bir bilim dalı haline gelmesi durumu, Asrısaadetten itibaren son hak dine ev sahipliği yapmış dinin dili mihverinde, yaklaşık dört yüzyıl boyunca süren çabaların sonucudur. Bu bilimi önce Ebü'l-Feth Osmân b. Cinnî el-Mevsılî el-Bağdâdî'nin (ö. 392/1002)“el Hasais”adlı eserinde görebilmekteyiz; ancak bu bilimden isim olarak söz etmemiştir. İlk defa isim olarak Ebü'l-Hüseyn Ahmed b. Fâris b. Zekeriyyâ b. Muhammed er-Râzî el-Kazvînî el-Hemedânî (ö. 395/1004)“es-Sahibî fî Fıkhü'l-Luğat”eserinde bahsetmiştir. Bundan sonra içerik olarak benzer çalışmalar telif edilmiş, fakat isimlerde farklılık olmuştur. Söz konusu kitapların müellifleri, ele aldıkları her konuda, kendi dilsel ekollerini ya da mensup oldukları havzaların yaklaşımlarını savunmuşlardır. Bu kitaplardan biri Ebû Mansûr Abdülmelik b. Muhammed b. İsmâîl es-Seâlibî'nin (ö. 429/1038)“Fikhu'l-Luğa”adlı kitabıdır. Daha sonra Ebü'l-Fazl Celalüddin Abdurrahmân b. Ebî Bekr b. Muhammed el-Hudayrî es-Süyûtî eş-Şâfiî (ö. 911/1505) tarafından,“el-Muzhir fî-Ulûmi'l-Luğati”adlı eser kaleme alınmıştır. Her âlim kendi kitabına günümüzde belli başlı konuları bulunan bilimlerden birinin ismini vermiştir; ancak es-Seâlibîve es-Süyûtî'nin günümüzde her iki bilim dalında gerçekleşen nesnel ayrıştırmayı yapma niyetleri olup olmadığını gösteren herhangi bir kanıt bulunmamaktadır. es-Seâlibî'nin Fikhu'l-luğa'sı ile es-Suyutî'nin İlmu'l-luğası arasında fark var mı veya kendileri de bu gibi eserlerden haberdar mıydı? Yoksa kitaplarına verdikleri bu isimler her iki bilim dalına dair aynı anlamı veren bir isimlendirmeden mi ibaretti? Bu isimlendirmenin perde arkasında ne gibi gerekçeler vardı? Amacı dili tahrif ve tağyirden koruma olan dilbilimi, farklı açılardan ve felsefi bağlamda ele almanın ne gibi gayeleri mühtevi olduğu hep merak edilen hususlardan olagelmiştir. Hem es-Saalibî hem de es-Süyutî, bu kavramlarla ilgili ne demek istediklerini çağdaş filoloji ile karşılaştırmak suretiyle ele almaya çalışacağız. Ayrıca bu iki kitabın kaleme alınma nedenlerini her iki âlimden ve kitaplarından söz etmek suretiyle ayrı bir başlık altında ele alacağız."
