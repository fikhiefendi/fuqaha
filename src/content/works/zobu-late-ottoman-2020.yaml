abstract: "Bu çalışmanın amacı Geç Dönem Osmanlı Modernleşmesini 1908 ve 1915 yılları arasında sınırlı sayıdaki ulemanın fıkıh algısındaki değişimler üzerinden algılamaktır. Dolayısıyla bu tez temel olarak II. Meşrutiyet sonrasında değişen hukuk algısını, bunu doğuran sebepleri ve bu algısal değişime paralel olarak değişen fıkıh algısının ulema tarafından nasıl bir çerçevede ve hangi kavramlar kullanılarak yorumlandığını tartışacaktır. Konu ve içerik olarak sınırlı olan bu çalışma, iki boyutlu bir yaklaşımı benimseyerek ilk olarak İkinci Meşrutiyet Döneminde yaşayan sınırlı sayıda incelenen ulemanın kullandığı örf, maslahat, istihsan, istislah, gibi fıkhın temelini oluşturan kavramları değişim argümanı içerisinde nasıl bir okumaya tabi tuttuklarını göstermeye çalışacaktır. İkinci olarak, bu tez ulemanın yürüttüğü fıkıh tartışmaları ışığında aynı zamanda fıkıh ve hukuk olarak algılanan iki alanda kimin salahiyeti haiz olduğunu dair dile getirilen fikirleri de tartışacaktır. Bu eksende yürütülen tartışmaların bir boyutu da modern hukuk algısıyla birlikte fıkhın modern hukuka göre kapsayıcılığının da tartışılmasıdır. Tez çerçevesince ele alınan ulemanın tartışmalarında fıkhın muhteviyat olarak kapsayıcılığı da içtihad tartışmaları içerisinde vurgulanmıştır. Çalışma boyunca incelemeye tabii tutulan ulemanın söylemleri ışığında, modern anlamda hukukun fıkıh algısı üzerinde getirdiği değişim, fıkhı tamamen göz ardı etmekten ziyade onu yeniden yorumlamıştır. Bir başka ifadeyle, ulema fıkhın yeterliliğini kanıtlama çabası içerisinde olmuştur."
