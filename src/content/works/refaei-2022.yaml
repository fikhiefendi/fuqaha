abstract: "Çalışma, Suudi Arabistan'daki İslami bankalardaki dijital dönüşüm gerçekliğini belirlemeyi amaçladı. Çalışma ayrıca Suudi İslami bankalarındaki dijital dönüşümün müşterilerine sundukları hizmetlerdeki performans kalitesi üzerindeki etkisini ölçmeyi de amaçladı. Suudi İslami bankalarına yönelik bir anket ve Google Formlar kullanılarak, ilki çalışanlar, diğeri müşteriler için olmak üzere, dijital dönüşüm eksenini ve bankacılık hizmetlerinin kalitesinin gerçeklikten boyutlarını temsil eden 5 ekseni içeren iki anket tasarlandı. Elektronik hizmet kalitesi ölçüm modeli“e-Servqual”kapsamında, önemli bir müşteri ve çalışan örnekleminin verileri toplandı ve Sosyal Bilimler İstatistik Paketi“SPSS”aracılığıyla istatistiksel analiz yapıldıktan sonra, tepki hızı, güvenilirlik, çalışanların verimliliği, güvenilirlik ve güvenlik derecesinde temsil edilen performans kalitesinin farklı boyutları ile dijital dönüşüm arasında doğrudan istatistiksel olarak anlamlı bir ilişkinin varlığı ve müşterilerin ve çalışanların genel olarak elektronik hizmetlerin kalitesinden memnun olmaları İncelenen bankalarda dijital dönüşüm uygulamasının ardından. Çalışma, Suudi İslami bankalarının, dijital dönüşüm programlarının uygulamasını kapsamlı konseptinde genişletmek ve bankacılık sektöründeki küresel rekabeti karşılamak için sürekli olarak geliştirmek için planlar geliştirmesi ve müşterilerin elektronik bankacılık konusundaki farkındalığını artırmak için çalışması gerektiğini önerdi. müşteri verilerini güvence altına almak için bir strateji geliştirirken, ihtiyaçlarını karşılamak için bunları doğru şekilde nasıl kullanacakları. Dijital dönüşümün karşı karşıya olduğu ana zorluklardan birini ve merkez bankalarının dijital dünyadaki gelişmelere ayak uydurması, dijital dönüşümde başarıya ulaşmak için geleneksel bankaları rekabet etmeye teşvik etmesi ve desteklemesi ihtiyacını karşılamak için hesaplarını hack'ten korumak."
