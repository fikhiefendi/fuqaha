abstract: "Hazırlamış olduğum 24 Nolu Eğin Şer'iyye Sicili, H.1301-1302 (M.1868-1870) yılları arasındaki belgeleri kapsamaktadır. Erzincan'a bağlı bir ilçe olan Kemaliye, Osmanlı Devleti döneminde Eğin olarak isimlendirilmiştir. Eğin 1868-1870 tarihleri arasında, Harput vilayetine bağlı bir Kaza'dır. Milli mücadele yıllarının sonuna doğru kasaba halkının isteği üzerine 21 Ekim 1922 tarihli Bakanlar Kurulu kararıyla Eğin adı Kemaliye'ye dönüştürüldü. Cumhuriyetin başlarında önce Elaziz vilayetine bağlı bir kaza merkeziydi. 1926 yılında Malatya'ya, 11 Mayıs 1938 tarihli kanunla da Erzincan iline bağlandı. Cumhuriyet döneminin ilk nüfus sayımında nüfusu (1927) 3488 kişi olarak belirlendi. Bu çalışmamızda Kâdılık, Eğin Kazası ve Şer'iyye Sicilleri hakkında bilgi verdikten sonra belgelerin türüne göre fihristini ve transkripsiyonlarını verdik. En son kısımda ise kısaca hukuki değerlendirmesini yaptık."
