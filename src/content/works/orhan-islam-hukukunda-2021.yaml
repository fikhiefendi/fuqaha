abstract: "Dünya hayatında var olan değişim toplumları etkilemekte ve hukukî kuralların buna göre düzenlenmesini gerektirmektedir. Bu çalışmada değişimin İslâm hukuku üzerindeki etkisi konu edilmiştir. Kıyamete kadar geçerli olacak son dinin hukuku olması nedeniyle İslâm hukuku temel esaslarının korunması ve Müslüman toplumlarının hukuk güvenliğinin sağlanması bakımından istikrar ile tüm zamanların ihtiyacının karşılanması bakımından da değişim ile ilişkilidir. Çağdaş literatürde İslâm hukukunun değişim olgusu ile ilişkisine dair teorik düzeyde değerlendirmeler yapılmıştır. Bu konuda ileri sürülen görüşlerin fürû-i fıkıh alanında çeşitli örnekler üzerinden temellendirilmesi konunun teorik düzeyden çıkarılarak uygulama alanındaki gerçekliğinin anlaşılması bakımından önem arz etmektedir. Çalışmamızda konu mehir örneği üzerinden işlenmeye çalışılmıştır. İslâm hukukunun istikrarına temel oluşturan değişmeyen sabitelerin yanında asra uygunluk sağlayacak şekilde değişebileceği kanaatini esas alan tezde konu üç bölümde incelenmiştir. Birinci bölümde İslâm hukukunda değişim olgusu hakkında genel bilgi verilmiş, ikinci bölümde mehir kavramı ve hükümleri incelenmiş, üçüncü bölümde de mehirle ilgili görüşlerin değişim olgusu ile ilişkili yönleri bakımından yorumlanmasına çalışılmıştır."
