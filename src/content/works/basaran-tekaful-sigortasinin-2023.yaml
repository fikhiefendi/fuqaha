abstract: "İslam dini insan hayatının her alanında olduğu gibi ekonomik alanda da toplum yararına olan çeşitli düzenlemeler ve kurallar koymuştur. Bu kuralların getirmiş olduğu yasakların başında da özellikle faiz ve kumar gelmektedir. Günümüzde sigorta sektörünün giderek gelişmesi ve çeşitlenmesiyle birlikte sigortaya duyulan ihtiyacın da artmasına binaen sigortanın İslam dininin yasaklamış olduğu bu unsurlarla olan ilişkisi de gündeme gelmiş ve sigortanın hükmü konusundaki tartışmalar artmıştır. Bu çalışmamızda sigorta ve tekafül sigortasının tanımı yapılmış benzerlik ve farklılıkları anlatılmış ortaya çıkış şekillerine değinilmiştir. Tekafül sigortasının işleyiş modelleri incelenmiş ve dini açıdan uygunlukları da değerlendirilmiştir. Tüm bunlardaki amaç ise günümüzde sigortaya duyulan ihtiyacın artmasıyla birlikte sigorta konusundaki dini açıdan şüphelerin giderilememiş olması nedeniyle devam eden tartışmalara katkıda bulunmak, dini hassasiyete sahip kişilerin ve İslam ülkelerinin sigortanın sağlamış olduğu güvenceye olan ihtiyacını karşılamak adına meseleye çözüm önerisi sunan tekafül sigortasının bilinirliliğine katkı sağlamaktır. Diğer yandan tekafül konusunda dünyada öncü olan ülkelerden olan Malezya örneği incelenerek ülkemizdeki mevcut durum ile mukayeseli değerlendirmesi yapılmış bu bağlamda sektörün gelişmesine yönelik Malezya'da uygulanmış ve olumlu sonuç alınmış olan ya da henüz denenmemiş yeni uygulama yöntemleri ile önerilerde bulunulmuştur."
