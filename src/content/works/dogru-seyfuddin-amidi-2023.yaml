abstract: "Âmidî, hicri yedinci asırda yaşamış, özellikle; kelam, usûl-i fıkıh, mantık ve felsefe alanında eserleriyle ön planda olan büyük âlimlerden birisidir. Bu çalışmamızda, Âmidî'nin hayatını, eserlerini ve Âmidî'nin icmâ anlayışını incelemeye gayret ettik. Araştırmamızda konumuzla da paralel olduğu için bu âlimin hayatını, eserlerini, diğer âlimlerin icmâ ile ilgili görüşlerini tanıtmaya ve Âmidî'nin icmâ anlayışını ortaya koymaya, değerlendirmesini ve analizini yapmaya gayret gösterdik. Âmidî'nin icmâ ile ilgili düşüncelerini ortaya koyarken, kendisine özgü olan düşünceleri başta olmak üzere, diğer fakih olan âlimlerin icmâ konusun da ittifak ya da ihtilaf ettiği konulara, icmâ alanında gösterdiği örneklere ve belirli konularda fıkıh ve icmâ ile ilgili hususlara temas ettik. Bu çalışma, Âmidi'yi ve eserlerini daha yakından tanımak için bize bir fırsat oldu. Âmidî, geniş bir eser yelpazesiyle birlikte farklı alanlarda da önemli izler bırakmış bir âlimdir. Âmidî'nin icma anlayışını seçmemizin sebebi bu alanda herhangi bir çalışma olmayışını tespit etmemizdir. Bu boşluğu doldurmak için araştırmamıza konu olarak Âmidi'nin icmâ anlayışını seçtik; çok az da olsa bu alana bir katkı sunmaya ve çalışmaya gayret gösterdik. Bu çalışmamızda hem Âmidî'yi hem de eserlerini daha çok tanıma fırsatı bulduk. Gerçekten de Âmidî çok sayıda eserinin yanı sıra farklı branşlardan da adından söz ettirmiştir."
