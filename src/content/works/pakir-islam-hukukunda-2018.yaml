abstract: "“İslâm Hukûku'nda Akidlerin Fesad Ve Butlânı”konulu bu çalışmamızda konumuzun temelini oluşturması açısından öncelikle akid kavramının tanımı ve unsurları üzerinde durulmuştur. Akdin kuruluş, sıhhati ve nefazı konularında açıklamalar yapılmıştır. İkinci bölümde ise konumuzun gövdesini oluşturması nedeniyle fesad ve butlân kavramlarının tanımları ve fesad ve butlâna neden olan unsurlara detaylıca yer verilmiştir. Böylece akidlerdeki fesad ve butlana yönelik bakış açımızın çizilmesine katkı sağlanmıştır. Üçüncü bölümde geçerlilik bakımından akdin çeşitleri ve hukûkî sonuçları açıklanarak akidlerdeki fesad ve butlanın uygulaması izah edilmiştir. Bu çalışmamızda akidlerin sahih, fesad ve butlânına dair Kur'ân-ı Kerim'den, hadislerden, fıkhî ekollerden, Mecelle'den, ve günümüz İslâm Hukukçularının kaynaklarından deliller getirilmiştir. Özellikle fıkhî ekollerdeki farklılıklar da dile getirilerek farklı ekollere mensup olan kişilerin istifade etmesi amaçlanmıştır."
