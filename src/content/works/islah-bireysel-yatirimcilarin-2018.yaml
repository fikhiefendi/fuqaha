abstract: "Küresel anlamda varlığını kanıtlamış geleneksel finansal sistemler yaşamlarını hızla gelişerek devam ettirmektedirler. Bu sistemlerde bireylerin etkin rol oynaması hem kişisel ekonomiler hem de ülke ekonomileri açısından büyük bir önem arz etmektedir. İslam dininin ekonominin temel enstrümanlarından biri olan faizi şiddetle yasaklaması sonucunda, İslam dinine ve getirdiği kurallara bağlılığı güçlü olan pek çok bireysel yatırımcının alternatif yöntem ve uygulamaları bilmemesinden kaynaklı olarak tasarruflarını yeterince verimli ve etkin biçimde değerlendiremediği gözlenmektedir. Oysa yaşanan sorunlara çözüm olabilecek İslami yaşama uygun çok sayıda prensip, kural ve enstrümanlara dayalı İslami finansal sistemler geliştirilmiştir. Ancak çoğu ülkede bireylerin söz konusu sistemler hakkında fazla bilgiye sahip olmadıkları gözlenmektedir. Sistemin sorunsuz bir şekilde gelişerek hayatına devam edebilmesi için yatırımcıların bu konuda bilgilendirilmesi ve bilinçlendirilmesi gerektiği açıktır. Ancak bu bilinçlendirme öncesinde bireylerin konuyu ne ölçüde bildikleri ve benimsediklerinin ölçümlenmesi gerekmektedir. Böylelikle konuya ilişkin çözümlemeler daha kolaylıkla yapılabilecek, yol haritaları daha rahatlıkla çizilebilecektir. Ülkemizde de bu ölçümlemelerin yapılmasının önemi düşünülerek, çalışmamızda TR63 bölgesi olarak gruplandırılmış olan, Osmaniye, Hatay ve Kahramanmaraş illerini kapsayan bölgedeki bireysel yatırımcıların İslami finansal okuryazarlık düzeyleri ölçülmeye çalışılmış bu kapsamda bireylerin bazı demografik özellikleri, finansal davranış ve tutumları incelenmiştir. Araştırma, TR63 bölgesinde yaşayan bireysel yatırımcıları evren olarak kabul etmiştir. Araştırma kapsamında gerekli olan veriler kolayda örnekleme yöntemi ile ulaşılan 671 bireysel yatırımcıdan anket yöntemi kullanılarak elde edilmiştir. Elde edilen veriler Pearson ki-kare, t testi, anova, korelasyon gibi istatiksel yöntemler kullanılarak analiz edilmiştir. Araştırmada bireysel yatırımcıların İslami finansal okuryazarlık düzeylerini belirlemek için katılımcıların verdiği yanıtların doğruluğuna göre toplam puan yöntemi kullanılmıştır. Araştırma sonucunda TR63 bölgesi bireysel yatırımcılarının“İslami finans okuryazarlık düzeyleri”düşük çıkmıştır. Çalışma ulaşılan sonuç itibariyle alanında yapılan diğer çalışmalarla benzer sonuçlar göstermekle birlikte, İslami finans okuryazarlığı alanında güvenilir bir kaynak olmaya adaydır."
