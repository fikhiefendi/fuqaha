abstract: "Sigorta; olası zararları en aza indirme, risk paylaşımı ve diğer yollarla kurum ve işletmelere koruma sağlamasıyla ekonomik kalkınmanın en önemli unsurlarından biri olarak kabul edilir. Ancak fıkıh meclisleri, içerdiği aldatmaca ve hukuka aykırılıkları nedeniyle sigortanın caiz olmadığını beyan etmiş, ticari sigortanın yerine şeriata uygun sigorta şirketlerinin kurulmasını tavsiye etmişlerdir. Ardından ticari sigortaya İslami bir alternatif olarak“tekâfül sigorta”şirketleri ortaya çıkmıştır. Bununla birlikte ticari şirketler, muhafazakâr toplumlarda dahi tekâfül sigorta şirketlerinden daha yaygın olarak görülmektedir. Böylece bu araştırma, Batı Şeria'daki küçük ve mikro işletme sahiplerinin tekâfül sigorta hakkındaki farkındalıklarını konu alırken, yazmış olduğum tez bilhassa El-Halil şehrinde bulunan küçük ve mikro işletme sahiplerinin bu konudaki farkındalık düzeylerini ölçmeyi amaçlamaktadır. Bu çalışma, literatürü ve kurumsal çerçeveyi sunarken betimsel yaklaşımı, uygulama kısmında çalışmanın sonuçlarını sunarken de tanımlayıcı analitik yaklaşımı temel almış ve araştırmaya tabi tutulan kesime - El-Halil şehrindeki küçük ve mikro işletme sahipleri - yönelik veri toplama amacı güderek anket yöntemini kullanmıştır. Bu tez çalışması, işletme sahiplerinin büyük bir çoğunluğunun İslami sigortanın varlığından haberdar olmaması, haberi olanların ise bu sigortanın şeriata uygun olup olmadığı konusunda emin olmadıklarından çekimser kaldıklarını ve isimleri dışında bu iki sigorta arasında herhangi bir fark bulunmadığını iddia etmeleri gibi sonuçları özetlemektedir. Ayrıca halk tarafından sigorta talebi çok az düzeydedir, bu da ancak zorunlu sigortayı kapsamaktadır. Bu durum, yetkili makamlara çeşitli tavsiyelerde bulunulmasını gerektirmiştir. Bunların en önemlilerinden biri: Tekâfül sigorta şirketlerinin, uzman enstitü ve fakültelerle iş birliği içinde bir bütün olarak, topluma yönelik tekâfül sigortanın önemi ve meşruluğu hakkında bilinçlendirme programları yürütülmesidir."
