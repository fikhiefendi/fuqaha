abstract: "Bu çalışma, modern evlilik akidlerinde Makâsıdü'ş-Şerîa ve onun etkilerini ele almıştır. Çalışma giriş, iki ana bölüm ile bir sonuç bölümünden oluşmaktadır. Birinci bölümde Makâsıdü'ş-Şerîa ve modern evliliklerdeki etkisi açıklanmıştır. Bu ana başlık aşağıda belirtilen iki alt başlık altında ele alınmıştır. a) Makâsıdü'ş-Şerîa'nın tanımı ve bölümleri b) Meşru evlilik, tanımı erkânı, şartları ve maksatları. İkinci bölüm de ise çalışmanın ele aldığı moderm evlilik türleri hakkında uygulamalı örnekler verilmiştir. Ayrıca Makasıdü'ş-Şeria'nın maslahat ve mefsedet üzerindeki etkisi ele alınmıştır. Bu ana başlık, çağdaş evlilik türlerini ele alan yedi alt başlık altında incelenmiştir. a) Turistik evlilik, b) Arkadaşlık evliliği, c) Maddi ayrıcalıklar elde etmek amacıyla gerçekleştirilen formalite evlilik, d) Medeni evlilik, d) Misyar evliliği, e) Örfi evlilik f) Darü'l-harp ülkelerinde, İslami kuruluşlarda veli olmaksızın yapılan evlilik. Bu evlilik türlerinin her birinin dil ve terim anlamlarına yer verilmiş, ardından hükümleri ve konu hakkında alimlerin görüşleri aktarılmıştır. Ardından her bir konu Makasıdü'ş-Şeria'nın maslahat ve mefsedet üzerindeki etkisi ele alınarak tamamlanmıştır. Son olarak çalışma, sonuçlar ve öneriler bölümüyle sonlandırılmıştır. Ulaşılan en önemlisi sonuçlar arasında maslahat ve mefsedenin belirlenmesinin temelinde meşru maksatları yatmaktadır. Batı ülkelerinde, İslami kuruluşlarda veli olmaksızın yapılan evlilikler ve misyar evliliği Makasıdü'ş-Şeria'ya uygundur. Geri kalanlar ise Makasıdü'ş-Şeria'ya uygun değildir, bu nedenle bunların mubah sayılmasında herhangi bir maslahat bulunmamakta ve maslahat onların tam olarak bulunmasıyla tahakkuk etmektedir."
