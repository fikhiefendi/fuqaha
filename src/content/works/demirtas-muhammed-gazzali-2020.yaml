abstract: "Son dönemin önemli davetçi ve mütefekkirlerinden olan Muhammed el-Gazzâlî'nin Hadis ve Sünnet'e yaklaşımının ele alandığı bu çalışma bir giriş, iki bölüm ve sonuçtan oluşmaktadır. Giriş kısmı çalışmanın amacı, kapsamı, önemi, sınırlılığı, konu hakkında yapılan çalışmalar ve literatürün yanında, Gazzâlî'nin hayatı, hocaları ve eserlerinden oluşmaktadır. Birinci bölümde müellifin sünnet tanımı, sünnetin kaynağı, bağlayıcılığı, kitap nezdindeki konumu, Kitap ve Sünnet arasındaki nesh ilişkisi, haber anlayışı, hadislerin taksimi, sened ve metin tenkidi prensipleri, hadislerin doğru anlaşılmasında etkili olan faktörler, temel hadis kaynakları hakkındaki görüşleri, fiten, gayb ve kader konusunda rivâyet edilen hadislere yaklaşımı ile dini ve sosyal açıdan kadınlar hakkında bazı meselelere yaklaşımına değinilmiştir. Belirtilen konular ele alınırken varsa müellife yöneltilen eleştirilere ilgili yerlerde değinilmiştir. Ayrıca gerekli görülen yerlerde ulemanın konu hakkındaki görüşlerine de yer verilmiştir. İkinci bölümde ise, Gazzâlî'nin tenkit ettiği bazı rivâyetler konu edinilmiştir. Öncelikle Gazzâlî'ye Hadis ve Sünnet konusunda yöneltilen eleştirilere özetle yer verildikten sonra, konu merkezli ele alınan rivâyetlerindeğerlendirilmesine geçilmiştir. Bu bağlamda rivâyetler tefsir ile ilgili olanlar, fıkıh ile ilgili olanlar ve diğer konular olmak üzere üç başlık altında ele alınmıştır. Gazzâlî'nin tenkit ettiği rivâyetler hakkındaki değerlendirmelerine yer verildikten sonra söz konusu rivâyetler hakkında müellife yöneltilen eleştirilere yer verilmiştir. Bunun yanında söz konusu rivâyetler hakkında hem önceki ulemanın hem de rivâyetler hakkında çalışma yapmış çağdaş araştırmacıların görüşlerine de yer verilmiştir. Gazzâlî'nin rivâyetlere temelde metin eksenli yaklaşımından dolayı, senedden çok metin üzerinde durulmuştur. Sonuç kısmında ise Gazzâlî'nin Hadis ve Sünnet ile ilgili tespit edilen görüşleri ile kendisine yöneltilen eleştiriler objektif bir şekilde değerlendirilmeye tabi tutulmaya çalışılmıştır."
