abstract: "İslamî ilimler alanında önemli eserlerin verildiği Irak coğrafyası maalesef hak ettiği ilgiyi görmemiştir. Yörenin âlimleri ve eserleri ilim dünyasına tanıtılmamış birçok önemli eser, el yazma olarak raflarda beklemektedir. Bu önemli âlimlerden biri de Irak᾽ın Kürdistan bölgesinde doğan ve fıkıh alanında etkin olan Molla Nebi el-Mâvelî'dir. Toplamda iki eseri bulunan el-Mavelî᾽in“Menba'u'l-a'mal fî ma'rifeti mebâhisi't-taklîd ve tashîhi'l-ef'âl ve'l-akvâl”isimli çalışması, İslâm fıkhında yazılmış bir eserdir. Söz konusu eser küçük bir hacme sahip olup, İmam en-Nesefî᾽nin“Tuhfe”adlı eserine hâşiye olarak yazılmış, eserdeki kapalı ifadeleri açıklığa kavuşturmuş, belirsizlik taşıyan ifadelerin üzerindeki perdeyi aralamıştır. Bu çalışmada ilim dünyasının istifadesine sunulması gayesiyle bahse konu eser tahkik edilerek, mahtutât dünyasından matbuat dünyasına aktarılmıştır. Eserin tahkikinde, elimizde bulunan tek nüshanın metni incelenmiş, alanla ilgili kaynaklardan hareketle metinde geçen hadislerin ve diğer eserlerin tahrici yapılmıştır. Ayrıca eserde yer alan görüş ve metinler güvenirlilik açısından garip kelimeler ve metinde yer alan bilinmeyen isimlerin biyografisi verilmiştir. Giriş, iki bölüm ve sonuçtan oluşan çalışmanın birinci bölümünde Molla Nebî el-Malevî'nin hayatı ve yaşadığı dönem siyasî ve kültürel açısından ele alınmıştır. İkinci bölümde eserin metodu içeriği ve kaynakları hakkında bilgi verilmiş ve eserin tahkikli metni verilmiştir. Çalışma sonucu elde edilen bulgular, sonuç kısmında maddeler halinde sunulmuştur."
