abstract: "Hadis ilminin zirve şahsiyetlerinden olan İmâm Buhârî, meşhur eseri el-Câmiu's-Sahîh'te önceki hadis edebiyatında olduğu gibi sadece sahih hadisleri derlemekle kalmamış, eserinde zikrettiği âyet ve hadislerden fıkhî istinbâtlarda da bulunmuştur. Buhârî, fıkıh istinbâtlarını veciz bir şekilde oluşturduğu bâb başlıklarında ortaya koymuştur. Geniş bir fıkıh potansiyelini ihtiva eden bu bâb başlıklarına olan ilgi, kitabın yazıldığı günden günümüze eksilmeden devam etmiştir. İmâm Buhârî'nin fıkıhçılığı, akademik anlamda ülkemizde hak ettiği ilgiyi bulamamıştır. Böyle bir çalışmanın, îfâ edilmesi gereken bir hak olduğu düşüncesiyle \"İmâm Buhârî'nin Fıkıh Anlayışı\" isimli çalışmayı tez konusu olarak seçtik. Tezi, giriş ve iki bölüm şeklinde tasarladık. Giriş bölümünde İmâm Buhârî'nin Hayatı ve İlmi Kişiliğini konu edindik. Birinci bölümde İmâm Buhârî'nin İslâm Hukuku Metodolojisini tespit etmeye çalıştık. İkinci bölümde ise İmâm Buhârî'nin fıkhî ictihâdlarına yer verdik. Buhârî'nin usûl anlayışı ve ictihâdlarını özellikle dört mezhep ekolü ile mukayese ederek tespit etmeye çalıştık. İmâm Buhârî, ictihâdlarını ortaya koyarken her bir müctehid gibi belli bir metodoloji takip etmiştir. Hadis ekolünün temsilcilerinden olan İmâm Buhârî'nin takip ettiği fıkıh metodolojisi, mensûbu olduğu ekolün metodolojisi ile büyük ölçüde örtüşmektedir. Buhârî'nin bazı konularda ise bu ekolden farklı bir yaklaşım içerisinde olduğu, görüşlerinin re'y ekolünün görüşleriyle örtüştüğü görülebilmektedir. Buhârî, katı bir eserci profilinden uzak durmakta, ictihâdlarını ortaya koyarken herhangi bir müctehid imâmı referans almadan nass eksenli meseleye yaklaşmakta, hakkında açık nass bulunmayan meselelerde ise aklî istinbât metodlarına başvurmaktadır. Buhârî'nin ortaya koyduğu ictihâdlar, herhangi bir mezhep ekolü içerisinde değerlendirilemeyeceği gibi belli bir mezhep ekolüne diğerinden daha yakın olduğunu söylemek de kolay değildir. Buhârî'nin fıkıh anlayışı kendi içerisinde bir özgünlük arz etmektedir. Anahtar Kelimeler: İslâm Hukuku, el-Câmiu's-Sahîh, Buhârî, İctihâd."
