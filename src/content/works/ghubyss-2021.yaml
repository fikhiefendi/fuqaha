abstract: "Elhamdülillahi rabbi'l-âlemîn, essalâtu ve'sselâmu alâ rasûlina Muhammedin ve alâ âlihi vesahbihî ecmaîn. Bu kitap, hicrî yedinci asırda fıkıh alanında üretilmiş şaheserlerden biridir. Bu eserde müellif, İmam Muhammed b. Hasan eş-Şeybânî'nin el-Câmiʿu'l-kebîr isimli eserini özetlemiştir. O, müçtehit imamlardan sahih nakillere ve onların açıklamalarına yer vererek hicrî ikinci asrın ilimlerini öğrenme noktasında okuyucuyu teşvik etmeyi hedeflemiştir. Müellifin el-Câmiʿu'l-kebîr'i özetleme amacı benzerleri bir araya getirerek araştırmacının işini kolaylaştırmaktır. O, meseleleri daha anlaşılır kılmak için de el-Câmiʿu'l-kebîr'in bablarının tertibinde değişiklik yapmıştır. Yine o, istinbat ettiği ve hocalarından öğrendiği fikhî kaidelere yer vererek hükümlerin tespit edilip onlara kıyas edilmesini kolaylaştırmıştır. Bu eserin tahkiki ve neşri yapılmamıştır. Biz Allah'ın yardımyla bu işi yapmaya niyet ettik."
