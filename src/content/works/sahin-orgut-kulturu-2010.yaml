abstract: "Bilgi çağı olarak adlandırılan günümüz dünyasında örgütlerin hızla değişen rekabet koşulları altında hayatta kalmalarını sağlayacak yegane beceri bu değişimlere kendilerine üstünlük kazandıracak şekilde uyum sağlayabilmeleridir. Örgüt kültürü, üstünlük kazandıran bu uyum sürecini şekillendirmede önemli bir rol üstlenmektedir. Bu süreçte değişimin en önemli kaynağı olan bilgi, temel üretim faktörü haline gelmiştir. Bu şartlar altında, işletmelerin rekabet üstünlüğü sağlamaları, en önemli rekabet üstünlüğü aracı durumuna gelmiş olan bilgiyi etkili şekilde yönetebilmelerine bağlı olmaktadır.Bilgi yönetiminin temelinde insan unsurunu içeren sosyal süreçler yer almaktadır. Dolayısıyla bu süreçler örgüt kültüründen etkilenmektedir. Bu noktada, etkinliğin ötesinde örgüte rekabet üstünlüğü kazandıracak ve örgütün hayatını devam ettirmesini sağlayacak olan benzersiz bileşime sahip ve rakiplerce kopyalanması çok güç olan örtük bilginin ortaya çıkarılması ve çalışanlar arasında paylaşılmasını sağlayan temel faktörün örgüt kültürü olduğu görülmektedir.Örgüt kültürünün örgüt başarısı için önemli olan bilginin paylaşılması ile olan ilişkisini anlamak maksadıyla bu tez çalışmasında örgüt kültürü ile çalışanların bilgi paylaşma tutumları arasındaki ilişki incelenmiştir. Çalışma, Türkiye'de faaliyet gösteren katılım bankası çalışanları arasında seçilen örneklem üzerinde yürütülmüştür. Çalışma sonucunda, örgüt kültürü ile bilgi paylaşma tutumu arasında anlamlı pozitif yönlü bir ilişki olduğu, çalışanların kişilik özelliklerinin örgüt kültürü ile bilgi paylaşma tutumu arasındaki bu ilişkiyi etkilemediği tespit edilmiştir."
