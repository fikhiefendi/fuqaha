abstract: "Sicil, Osmanlı Devleti'nin son yıllarına kadar devam eden şer'î mahkemelerde, kadı ya da nâibi tarafından tutulan kayıtların toplandığı defterlerdir. Bu defterlere“Şer'iye Sicilleri veya Kadı Defterleri”de denilmektedir Kadılar tarafından tutulan bu defterlerde kadı'nın kendi vermiş olduğu hüccet ve i'lâmlar yanında devlet merkezinden gönderilen fermanlar, berâtlar, tezkereler, buyuruldular, rü'uslar ve mektûblar da yer almaktadır. Bu çalışmanın kaynağını teşkil eden 16 Numaralı Konya Şer'iye Sicili, 1672-1673 tarihlerine ait olup Konya'nın sosyal, siyasî, ekonomik ve hukûkî yapısı ile ilgili 100 çeşitten fazla dava konusunu içermektedir. Olaylar Konya Eyâleti içerisinde geçmekle birlikte çoğunlukla Konya'da yaşanan olayları konu edinmektedir. Okunuşu gerçekleştirilen belgeler içeriklerine göre sosyal, siyasî, ekonomik ve hukukî hayatla bağlantıları açısından ayrı ayrı değerlendirilmiştir. Sosyal hayatla ilgili konuları namzed, nikâh, boşanma; ekonomik hayatla ilgili konuları vakıf, mülk satışları, alacak-verecek davaları ve vergilerle ilgili kayıtlar; siyâsî ve idârî hayatla ilgili konuları ferman, berat, mürâsele, tezkere, buyuruldu, mektûb, hüccet; hukûkî hayatla ilgili konuları ise ölüm keşfi, nafaka takdiri, köleler ve câriyeler, kapıya katran sürme, rıza senedi, çeşitli suçlar vb. oluşturmaktadır. Bu bilgiler ışığında değerlendirmeler yapılmış ve dönem hakkında Konya'daki yaşam tarzı, işlenen suçlar, ekonomik yapı ve siyasi hayatla ilgili genel yargılara varılmıştır."
