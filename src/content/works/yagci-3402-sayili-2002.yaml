abstract: "öz Bu çalışma İstanbul Üniversitesi Sosyal Bilimler Enstitüsünde yüksek lisans tezi olarak hazırlandı. Bu tezin konusunu 3402 sayılı Kadastro Kanunu çerçevesinde tapuya kayıtlı taşınmazlar üzerindeki hak sahipliği (mülkiyet hakkı) teşkil etmektedir. Çalışmamızın birinci bölümünde Osmanlı Devleti Dönemindeki tapu sicil sistemi, tapu kayıtlarının durumu, kadastro çalışmaları incelenmiş ve eski hukuktan gelme bu tapu kayıtlarının hangilerinin geçerli olduğuna değinilmiştir. Cumhuriyetin kuruluşundan sonra çıkarılan Kanunlar (özel kanunlar, Medeni Kanun ve kadastro kanunları) sonucunda bugün gelinen durum belirtilmiştir. Çalışmanın ikinci bölümü tapuya kayıtlı taşınmazların 13. madde ve 15. maddeye göre kadastrosunun yapılmasıyla ilgilidir. 13. maddenin A bendine göre taşınmazın tapu sicilindeki kayıt maliki veya onun mirasçıları adına tespiti incelenmiştir. 13. maddenin B-a bendinde taşınmazda başkası zilyet ise ve hak sahipleri bu zilyetliğe muvafakat ediyorlarsa veya 13. maddenin B-b bendine göre zilyet sicil (tapu) dışı bir işleme (sözleşmeye) dayanarak taşınmazda malik sıfatıyla, aralıksız, davasız, on yıl süreyle fiili hakimiyet kurmuşsa veya 13. maddenin B-c bendine göre malikin ölmüş olması, gaip olması ya da kim olduğunun tapu sicilinden anlaşılamaması hallerinden biri gerçekleşmiş ve zilyet taşınmazda malik sıfatıyla, aralıksız, davasız, yirmi yıl süreyle fiili hakimiyet kurmuşsa; taşınmazın zilyet adına tespit edilmesi incelenmiştir. Çalışmada 15. maddenin 1. fıkrasında belirtilen taşınmazın sicil (tapu) dışı paylaştırmaya (taksime) göre taşınmazda zilyet olan kayıt maliki veya mirasçıları adına tespit edilmesi; 2. fıkra gereğince taşınmazın bir kısmının ya da belirli bir payının zilyet adına, 13. maddede belirtilen koşullar gereğince, tespit edilmesi; 3. fıkra gereğince elbirliğiyle malik olan mirasçılar arasında miras payının devri sözleşmesine bağlı olarak, taşınmaz üzerinde miras payını devralan zilyet adına tespit edilmesi, araştırılmıştır. Çalışmanın üçüncü bölümünde kadastro çalışmalarının mülkiyet hakkının kazanılmasına etkisi bakımından kazanma ve hüküm doğurma anlarına değinildikten sonra, kadastro tutanaklarının kesinleşme süreci ve hak düşürücü süre incelenmiştir. in"
