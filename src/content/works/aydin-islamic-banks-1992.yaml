abstract: "VII ÖZET Günümüzde Risk Sermaye şirketleri Avrupa'da ve özellikle Amerika Birleşik Devletleri'nde önemli bir yere sahiptir. Gelecek vadeden girişimcilere sağladıkları faizsiz finans kaynakları ile bulundukları ülkelerin ekonomisine önemli ölçüde katkı sağlamaktadırlar; böylece ekonomik hayatın vazgeçilmez bir parçası haline gelmişlerdir. Risk sermaye şirketlerinin Türkiye ve diğer islam ülkelerine getirilmesinde çok büyük faydalar vardır. Risk sermaye şirketlerinin bu ülkelerde kurulmasında en büyük katkıyı sağlayacak kurum bu ülkelerdeki mevcut islam bankalarıdır. Çünkü bu iki kurum arasında çok büyük yapısal benzerlikler vardır; daha da ötesi temelleri aynı noktaya, yani klasik islami iş ortaklığı olan“Mudaraba”ya dayanmaktadır. Hal böyle olunca, islam bankalarına Risk Sermaye şirketlerinin kurulması ve varlığını devam ettirmesi sürecinde önemli görevler düşmektedir. Ancak Risk Sermaye şirketlerinin Türkiye ve diğer islam ülkelerine islam bankaları kanalı ile getirilmesi halinde, yönetimsel ve finansal olmak üzere iki önemli problem ortaya çıkmaktadır. Yönetimsel Problem: İslam bankaları ile girişimci arasında doğrudan ilişki olmamalıdır. Çünkü islam bankalarının büyük ve bürokratik yapıları ile böyle bir ilişkiyi sürdürebilmeleri pratik olarak çok zordur. Bunun için bu ilişki Risk Ser maye şirketlerince yürütülmelidir. Finansal Problem: Kısa vadeli fonların uzun vadeli yatırımlara transfer edilmesi problemidir. İslam bankaları tarafından toplanan fonları çoğu kısa vadel idir. Buna karşın, Risk Sermayesi yatırımları uzun vadeyi gerektirmektedir. Bu durumda toplanan fonların vadeleri ile yatırımların vadeleri arasında bir uyum suzluk problemi ortaya çıkmaktadır. Bu problem ise Çizakça tarafından önerilen reform paketi ve para vakıfları modeli ile çözülebilir."
