abstract: "Bu çalışmada mehrin hikmetleri ve onunla ulaşılabilecek maslahatlar incelenmiştir. Hikmetlerin temellendirilebilmesi amacıyla öncelikle Hz. Peygamber ve sahabenin ödediği mehir miktarları tespit edilerek günümüz rakamlarına çevrilmiştir. Bu bağlamda Hz. Peygamber'in eşlerine verdiği ortalama mehir bugünün değeriyle yaklaşık 40.000-50.000 ₺ civarında olduğu tespit edilmiştir. Sahabenin ödediği mehirler çok cüz'i miktarlardan başlayıp bugün milyonlarla ifade edilebilecek meblağlara ulaşmaktadır. Ama ortak yanı, az veya çok mutlaka mehir ödenmesidir. İslam'ın her emrinin hikmetli olmasından hareketle, üzerinde bu kadar ısrar edilen mehrin de birtakım hikmetleri olduğu sonucuna ulaşılabilir. Bu bağlamda mehir; sorumluluk bilinci oluşturmaya, eşler arası muhabbeti artırmaya yardımcı olur. Sudan sebeplerle boşanmayı zorlaştırırken, haksız boşanmalarda mağdur olan tarafın lehine bir tazminat işlevi görür. Mehrin bahsi geçen hikmetlerinin açığa çıkabilmesi, miktarıyla doğrudan alakalıdır. Kur'an ve sünnette miktar konusunda bağlayıcı bir emir bulunmamaktadır. Bu nedenle bireyler kendi şahsi durumlarını dikkate alarak belirleme yapmalıdır. Erkeğin ödeme gücü varsa karşılıklı anlaşmayla yüksek miktar belirlemekte bir sıkıntı görünmemektedir. Bununla birlikte, miktarın çok ön planda tutulması, ödeme gücü olmayan erkekten yüksek rakamlar talep edilmesi ya da erkeğin ödeyemeyeceği meblağı kabul etmesi sıkıntılı görünmektedir. İki taraf da miktar belirlerken duygusal davranmaktan kaçınmalı, mantıklı karar vermelidir. Tezin son kısmında, araştırma boyunca mehrin gerekliliğine ikna edilmesi hedeflenen okuyucunun, aklına takılabilecek bazı sorular cevaplanarak çalışma nihayetlendirilmiştir."
