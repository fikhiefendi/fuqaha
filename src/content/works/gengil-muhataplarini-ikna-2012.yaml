abstract: "Yaratılan, akıl taşıyan ve vahye muhatap olanların takip ettiği bir takım fikirleri vardır. Bu fikirler kimi zaman Kur'ân'ın gösterdiği doğrultuda değildir. Kur'ân, kendisinin gösterdiği yoldan gitmeyen muhataplarını düzeltmek ister. Bunun için onların hatalı olan davranışlarının tashihine onları ikna etmek gerekmektedir. Hâliyle Kur'ân, muhataplarına onların bildiği şeyler üzerinden pek çok türde mukayeseler sunmaktadır.Bu çalışmada Kur'ân'ın muhataplarına onları ikna için sunduğu bu mukayeselerin türleri gösterilmiştir. Konu üç bölümde ele alınmıştır. Birinci bölümde konu ile alakalı kavramlar, ikinci bölümde Kur'ân'ın muhataplarına soru yoluyla, üçüncü bölümde ise dolaylı olarak sunduğu mukayese çeşitleri işlenmiştir. Araştırmanın hedefi ise Kur'ân'ın muhataplarını eğitirken onları ikna ve irşad için mukayese yöntemini nasıl kullandığının tespiti olmuştur."
