abstract: "İnsan, sosyal bir varlıktır. Bunun neticesinde diğer insanlarla etkileşimini devamlı olarak sürdürmektedir. Evlilik de bu sosyalliğin bir parçasıdır. Ancak insanların anlaşamamaları gibi durumlarda evlilik son bulmaktadır. Evliliğin sona ermesiyle birlikte çocukların ihtiyaçları, bakım ve terbiyeleri, eğitimi, hukukî olarak temsil edilmeleri, korunmaları, yapmış oldukları fiillerdeki mesuliyetleri gibi hususlarda nasıl bir yol izleneceği ve onları temsil etme yetkilerini kimlerin üstleneceği durumu konumuzu oluşturmaktadır. Hz. Peygamber döneminde tartışmalara konu olan çocuğun bakımının kimin üstleneceği meselesi, Rasaullah'a intikal etmiş ve kendisi bizzat bu soruna çözüm getirmiştir. Onun çözümü İslam hukukçularına yol göstermiş, onu esas alarak teoriler ve uygulamalar geliştirmişlerdir. Günümüzde toplumun sosyal yapısının değişimi, kadınların iş hayatına girmesi ve maddi bağımsızlığını kazanmasıyla çocuğun velâyetini kimin üstleneceği konusu, eşler arasında anlaşmazlıklara, konunun uzmanları tarafından öneri ve çözüme açık hale getirip tartışmalara yol açmıştır. Bu tezde İslam hukuku ve Medeni Kanun'un meseleye bakış açıları, benzer ve farklı yönleri ortaya konularak bu konudaki tartışmalara çözüm bulmaya katkı sağlanması hedeflenmiştir. Bu tarz çalışmaların sadece eşler ve çocuklar arasındaki sorun ve problemleri çözmek adına değil, hukukî, psikolojik ve sosyolojik açıdan hem bireylere hem de topluma faydalı katkılar sunacağı kanaatindeyiz. Konu araştırılırken nasslardan, klasik fıkıh kaynaklarından, Türk Medeni Kanunu'ndan, Yargıtay kararlarından, uluslararası sözleşmelerden, ilmi ve akademik çalışmalardan faydalanılmıştır."
