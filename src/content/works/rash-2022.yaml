abstract: "Tezimiz alışveriş ve nikah konusunda sahabe tarafından Hz. Peygambere yöneltilen fıkhi soruların tahlil ve tespitini konu edinmektedir. Tezimiz alışveriş ve nikah konusunda Hz. Peygambere tevcih edilen soruları tespit edip hem lafız hem de mana açısından şerh etmektedir. Tez, önsöz, giriş, iki bölüm ve bir sonuçtan oluşmaktadır. Önsözde konunun önemi, seçimi, amacı, yöntemi ve buna dair yapılan eski çalışmalar tanıtıldı. Giriş bölümünde genel bir şemanın takdiminin zaruretinden dolayı tezin başlığında yer alan kavramlar tek tek incelendi. Birinci bölümde alışveriş/buyû' kavramı, alışverişin hükmü, teşri' hikmeti, temel unsurları ve buna dair varid olan nebevi hadisler ve bu hadislerin ihtiva ettiği fıkhî hükümler ele alındı. İkinci bölümde ise nikah kavramı, nikahın temel unsurları, maksatları, meşruiyyet hikmeti, buna dair varid olan hadisler ve bu hadislerin ihtiva ettiği fıkhi hükümler ele alınıp incelendi. Fıkhi hükümleri açılarken konuya dair ileri sürülen görüşler arasında yer yer tercihte bulunuldu. Sonuç bölümünde ise ulaşılan neticelere ve bundan sonra konuya dair çalışma yapacaklara yönelik önerilere yer verildi."
