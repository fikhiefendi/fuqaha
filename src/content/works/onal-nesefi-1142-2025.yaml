abstract: "ÖZET Yüksek Lisans Tezi Nesefî (Ö.537/1142)'Nin Et Teysir İsimli Tefsirinde Ahkâm Ayetlerini Tefsir Yöntemi Kadir Mete ÖNAL Dokuz Eylül Üniversitesi Sosyal Bilimler Enstitüsü Temel İslam Bilimleri Anabilim Dalı Temel İslam Bilimleri Programı Bu çalışmada hicrî beşinci yüzyılda yaşamış,“Akâid”adlı risalesiyle şöhret bulmuş Mâturîdî ve Hanefî bir âlim olan Ömer en-Nesefî'nin“et-Teysîr fi't-Tefsîr”adlı eserinde ahkâm ayetlerini tefsir yöntemi incenlenmiştir. Ahkâm tefsiri, İslâm hukukunun temelini teşkil eden Kur'ânî hükümlerin doğru anlaşılması ve uygulanması açısından büyük bir ehemmiyete sahiptir. Bu tefsir türü hem bireysel hem de toplumsal hayatın İslâmî esaslara uygun şekilde tanzim edilmesine katkı sağlamaktadır. Çalışma; giriş, iki bölüm ve sonuçtan oluşmaktadır. Giriş bölümünde tezin konusu, amacı, yöntemi ve kaynakları belirtilmiştir. Birinci bölümde; Ömer en-Nesefî'nin hayatı, ilmî birikimi, eserleri ve“et-Teysîr”isimli tefsirin genel özelliklerinden bahsedilmiştir. Ayrıca fıkhî tefsirin tarihi süreci incelenmiş ve ahkâm ayetlerinin özellikleri, sayısı, kapsamı gibi konular ele alınmıştır. İkinci bölümde ise, müellifin ahkâm ayetlerini tefsiri klasik tefsir yöntemleri açısından incelenmiştir. Ayrıca Nesefî'nin ahkâm ayetlerini hüküm açısından incelemeye tabi tutması, bu ayetlere dair fıkhî yorumları ve fıkhî yorumlar bağlamında mezhepsel yaklaşımları tespit edilmeye çalışılmıştır. Sonuç kısmında çalışma içerisinde sunulan veriler ışığında Nesefî'nin tefsir yöntemi ve fıkhî yorumları, tezin sınırları doğrultusunda değerlendirilmiştir."
