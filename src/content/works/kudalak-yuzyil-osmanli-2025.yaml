abstract: "16. yüzyıl Osmanlı Hanefîliği bağlamında kadın ve erkek ilişkisinin nasıl düzenlediği ve bu düzenlemenin evlilik kurumundaki hak ve görev dağılımına nasıl yansıdığını teorik ve pratik boyutlarıyla ele alan çalışmamızın amacı, İslâm hukukunun aile yapısındaki cinsiyet rollerini belirleyiş biçimini anlamaktır. Bu bağlamda kadın erkek eşdeğerliliği, rol dağılımı ve aile içi sorumluluklar, İslâm hukukunun dağıtıcı adalet prensibini içeren eşdeğerlilik anlayışı çerçevesinde değerlendirilmiştir. Bu hedef doğrultusunda klasik Hanefî kaynakları, 16. yüzyıla ait fetvalar ve kadı sicilleri temel alınarak, normatif ilkeler ile tarihsel pratik arasındaki ilişki analiz edilmiştir. Giriş ve sonuç bölümleri dışında üç ana bölümden oluşan çalışmanın birinci bölümünde kadın-erkek eşdeğerliliği kavramı incelenirken, ikinci bölümde 16. yüzyıl Osmanlı Hanefîliği bağlamında nikâhın kuruluşu, devamı ve sona ermesi süreçlerindeki hak ve görev paylaşımı değerlendirilmiştir. Üçüncü bölümde ise bu hak ve görevler eşdeğerlilik ilkesi açısından analiz edilerek, teorik ilkelerin pratikte ne ölçüde korunduğu sorgulanmıştır."
