abstract: "Harman, Vezir, Seyfeddin Âmidî'nin Kelâm Sisteminde Usûlü'd-dîn ve Usûlü'l-fıkh İlişkisi, Doktora Tezi, Danışman: Prof. Dr. Ahmet Akbulut, 364 s.Araştırmamızda Seyfeddin Âmidî'nin Kelâm Sisteminde Usûlü'd-dîn ve Usûlü'l-fıkh İlişkisi incelenmiştir.Tez, giriş, iki bölüm ve sonuçtan meydana gelmektedir. Girişte Usûlü'd-dîn ve Usûlü'l-fıkh ilişkisi ele alınarak, Seyfeddin Âmidî'nin bu ilimlerin neresinde durduğu ve bu ilimlere nasıl bir katkıda bulunduğu tespit edilmeye çalışılmıştır.Birinci bölümde, Usûlü'd-dîn ve Usûlü'l-fıkh ilişkisinde en önemli ortak konu olan delîl konusu incelenmiştir. Delîl konusunun Seyfeddin Âmidî'nin kelâm sisteminde nasıl bir değerlendirmeye tabi tutulduğu araştırılmıştır.İkinci bölümde, Usûlü'd-dîn ve Usûlü'l-fıkh ilişkisinde önemli bir yere sahip olan delîl ile ulaşılmak istenen hüküm konusu irdelenmiştir. Ardından delîl ve hüküm arasında yer alan yorum metodolojisi iki usûl açısından ele alınmıştır.Sonuç bölümünde, tez bölümlerindeki ana fikirler özetlenmiştir. Araştırma sonucunda ulaşılan neticeler ve kanaatler ortaya konulmuştur."
