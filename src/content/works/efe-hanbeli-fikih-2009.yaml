abstract: "Fıkıh usûlü ilminin temel konularından biri de ?şer`î deliller?dir. ?Şer`î hükümlerin kaynağı veya şer`î hükümlere ulaştıran metotlar, yöntemler? anlamına gelen şer`î delillerden biri de istıshâbü'l-hâldir. İstıshâbü'l-hâl, ?aksini gösteren bir delil bulunmadığı sürece mükellefin şer`an sorumlu olmamasına (berâet-i zimmet) ve varlıklardan (eşya) yararlanma hususunda serbestliğe (ibaha-yi asliyye) yahut daha önce varlığı bilinen bir durumun devam ettiğine hükmetme yöntemi? demektir. İstıshâbü'l-hâl delili, Hanbelî fıkhında ve usûl anlayışında önemli bir yer tutar. Kur'an, Sünnet ve icmâ ile birlikte üzerinde ittifak edilen (müttefekun aleyh) deliller arasında yer alır. Berâet-i zimmet ve ibaha-yi asliye istıshâbı yanında şer`î hüküm istıshâbı ve icmâ istıshâbı da Hanbelî fıkıh usûlü eserlerinde incelenen istıshâb türleri arasındadır.İşbu tezimizde, aklî ve naklî bir karaktere sahip istıshâbü'l-hâl delilinin, Hanbelî usûlündeki yeri ve önemi yanında Hanbelî usûl eserlerinde yer verilen istıshâb türleri ve bunların delil değerleri incelenmiştir. Re'y ictihadına (re'y ile ictihada) sıcak bakmayan Hanbelî usûl anlayışı, istıshâbü'l-hâl deliline ağırlık vermiş; özellikle, temel bir prensip olarak kabul edilen berâet-i asliyye istıshabı hukukî hayatta ve muamelat sahasında Hanbelî fıkhına bir genişlik ve esneklik kazandırmıştır."
