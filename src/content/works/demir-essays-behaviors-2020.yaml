abstract: "Sadece yerli mudiler için değil, uluslararası mudiler için de iyi bir alternatif olan Türk Katılım Bankaları'nın, Ocak 2005'te payları sırasıyla %2,26 ve %3,04 olan aktif büyüklük açısından pazar payı %6,33'e ve mevduat pazar payı %8,39'a yükselmiştir. Katılım Bankaları'nın vadesiz mevduatın toplam mevduata oranı açısından geleneksel bankalardan farklılaştığı açıktır. Bankacılık Kanunu, katılım bankaları tarafından sunulan ürünler, katılım bankalarının stratejileri ve mevcut iş modelleri bu farklılığın nedenleri olarak görülebilirken, mudilerin finansal davranışları en önemli faktörlerden biridir. Uluslararası müşterilerin banka portföyünde yüksek bir paya sahip olması bu farkın daha da artmasına neden olmaktadır. Bu çalışmanın birinci bölümünde, bir katılım bankasının gerçek kişi mevduatlarına dair açıklayıcı bir analiz yapılmaktadır. İkinci bölümde ise, yabancı mudilerin hem vadesiz mevduat tutma eğilimlerini etkileyen hem de yerli para tutma eğilimlerini etkileten kişisel ve makroekonomik faktörleri analiz ediyoruz."
