abstract: "Bu çalışma İslam ve demokratik sistemler arasında şûra konusunu mukayeseli olarak konu edinmektedir. Keza çağdaş islami düşünce ekseninde her iki sistem arasındaki ilişkiyi ve ortak noktaları ortaya koymayı amaçlamaktadır. Yönetime katılma yöntemlerinden bir yöntem olarak şûra, köklerini İslam'dan almaktadır. Şûra'nın önemi yönetici ile şûra ehli arasındaki ilişkide yatmaktadır. şûra herhangi bir müessesenin başarılı olması ve ümmetin çöküşten korunması için en ideal yol ve yöntemdedir. Şûra yönetimin belli bri düzeyde zekâ, akıl ve adalet sahiplerine danışmayı gerektirmektedir. Çalışmada fukahanın konuyla ilgili görüşlerini ve Raşit Halifeler dönemi boyunca devam eden fiilî şûra örneklerini anlattık. Demokratik yönetime gelince bu sistem batı menşeli olup Greklerden günümüze ulaşan siyasi bir sistemdir. Bu sistem, vatandaşlar arasında eşitlik ve yasama faaliyetine katılma anlayışına dayanmaktadır. Şûra prensibini ve hükümlerini pratiğe aktarmak kolay bir iş değildir. Aksine bu; basiret, rüşt, teenni ve hikmete ihtiyaç duyan bir süreçle mümkündür. Keza bu iş için samimi çabaların birleştirilmesi, batıdan gelen tehlikelerin uzaklaştırılması ve şûra sisteminin bütün boyut ve sonuçlarıyla anlatılması ve özümsenmesiyle ancak gerçekleşebilir. Bu iş bilginlerin, düşünürlerin ve ıslahatçıların omuzlarında durmaktadır. Müslüman dünyanın içinde bulunduğu durum ve istibdat şûra'ya geri dönmeyi zorunlu kılan amillerden briidir. Özellikle demokrati deneyimlerin başasrıızlıkla sonuçlanması bunu daha bir zorunlu kılmaktadır. Bu gün Müslümanlar kendilerini gerilemeden ve istibdattan kurtaracak bir sisteme muhtaçtırlar. Bu da ancak şûraya dönmekle tahakkuk edebilir. Bunun için de İlim ve fikir sahibi insanları bir araya getirecek ve projeler üretecek kongrelere vs. çalışmalara şiddetle ihtiyaç duyulmaktadır."
