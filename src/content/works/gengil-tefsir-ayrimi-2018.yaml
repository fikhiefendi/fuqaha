abstract: "Ebû Mansûr el-Mâturîdî (ö. 333/944) Te'vîlâtü'l-Kur'ân adlı eserinin mukaddimesinde tefsiri te'vîlden ayırmıştır. Ona göre kesinlik taşıması nedeniyle sahâbenin Kur'ân'ı anlaması tefsir; fukahânın Kur'ân'ı yorumlamasını ise te'vîldir. Mâturîdî'nin tefsiri sahâbeye hasretme gerekçesi onların nüzule şahit olmalarıdır. Bu şartın dikkatlerden kaçması sahâbeden gelen her rivayetin tefsir kapsamına alınacağı şeklinde bir algıya neden olmuştur. Bizim hipotezimiz ise Mâturîdî'nin her sahâbenin değil, ayetin inişine şahit olan sahâbenin rivayetini tefsir olarak kabul ettiği üzerinedir. Bu hipotezin ispatı, onun, sahâbenin bazı rivayetlerini reddetmesi ya da onlara rağmen görüş bildirdiğinin ortaya koyulmasıyla sağlanmıştır. Fakat Mâturîdî, eserinde rivayetleri genellikle meçhul kalıplar ile aktarmıştır. Bu rivayet sahiplerin deşifresi için me'sûr/rivayet tefsirlerinden istifade edilmiş ve dolayısıyla çalışmada mukayeseli yöntem izlenmiştir. Sonuç olarak Mâturîdî'nin tefsir tanımının tüm sahâbeyi kapsamadığı, nüzule şahit olmayan sahâbenin ayeti anlamasıyla, nüzule şahit olmaması nedeniyle ilk nesil sonrası fakihlerin ayete yönelik te'vîlleri arasında bir fark görmediği ve tefsiri mümkün olan en dar çerçeve hapsetmeye çalıştığı anlaşılmıştır."
