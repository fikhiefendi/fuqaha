abstract: "Tam adı 'Kadına Yönelik Şiddet ve Aile İçi Şiddetin Önlenmesi' olan İstanbul Sözleşmesi, İstanbul'da Avrupa Konseyi üyelerinin imzasına açılmıştır. İstanbul'da imzalandığı için de bu şekilde isimlendirilmiştir. Türkiye, sözleşmeye imza atan ilk devletlerden biri olmuştur. Sözleşmenin etkisiyle ülkemizde birçok düzenleme yapılmış ve“6284 Sayılı Kanun”çıkarılmıştır. Sözleşme, imzalandığı günden beri büyük tartışma konusu haline gelmiştir. Tartışmalar genelde; eşcinsel birliktelikleri onaylamak, nikah akdi dışındaki birliktelikleri saymak, aile kurumunun kutsallığının tehdidi, örf-adet ve dini uygulamalara karşı tutum gibi konular üzerinden gerçekleşmiştir. Çalışmamızda, tartışmaya konu olan bu konuları İslam Hukuku çerçevesinde değerlendirdik. Sözleşme maddelerinin müspet yönleri bulunmakla birlikte bütüncül olarak değerlendirecek olursak; aile ve ahlak açısından sebep olacağı zararlar daha fazla olabilir. Sözleşme şiddeti, sadece kadına şiddet boyutuyla ele almaktadır. Şiddetin sorumlusunu da toplumsal cinsiyet kalıplarına bağlanmaktadır. Kadın-erkek eşitliğinin sağlanmasından öte; kadınlara ayrıcalıklı haklar verilmesini öngörmektedir. İslam dininde ise insana, insan olduğu için bir takım haklar vermektedir. Bu bağlamda kişinin mensup olduğu din bile önem arz etmemektedir. Kadın ve erkeğin mutlak eşitliği öngörülürken, cinsiyetler arası farklar göz ardı edilmektedir. İslam ise kadın erkek ilişkisini eşitlik üzerine değil; adalet ve hak -sorumluluk dengesi üzerine kurgular. İslam'da kutsal bir emanet olarak görülen kadın, nikah akdi ile güvence altına alınmakta ve mehir gibi bir takım özel haklar verilmektedir."
