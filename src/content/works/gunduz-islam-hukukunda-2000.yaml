abstract: "ÖZET Bu araştırmanın amacı İslâm Hukukuna göre“haberleşme hürriyeti”nin muhtevasını ve sınırlarını belirlemektir. Tezde temel kavram haberleşme hürriyeti olmakla birlikte konunun alt yapısını oluşturan haberleşme ve haberleşme araçları ile hürriyet ve hürriyetle ilgili kavramlar da incelendi. Haberleşme kavramı“iletişim”in bir alt dalı olarak belirlendi ve unsurları esas alınarak“haber, haberin kaynağı ve haberi alan”şeklinde alt başlıklara ayrıldı. Ayrıca, haberleşmede kitle haberleşme araçlarının günümüzde ulaştığı seviye dikkate alınarak haberleşme araçlarının mülkiyeti, fonksiyonları ve denetlenmesi ele alındı. Hürriyet kavramının çerçevesini belirlemek üzere de hak, hukuk, devlet, hukuk devleti kavramları incelendi ve hürriyetlerin sımrlandmlmasmın gerekçeleri ortaya kondu. Haberleşme hürriyeti kavramı, iki ana hak içermektedir: Haber alma hakkı ve haber yayma hakkı. Bu haklan doğuran ilkeler İslam hukuk doktrininde“meşru tecessüs”ve“tezkiye”başlıkları altında yer almıştır. Bu hakların sınırlan ise kamu yararını amaçlayan prensipler ve kişilik haklan ile belirlenmektedir. Bu araştırmaya göre İslâm Hukuku vahye dayalı bir hukuk sistemidir ve bütün kavramlar gibi haberleşme hürriyeti kavramı da vahyin öngördüğü esaslara göre şekillenir. İslâm Hukukunun en büyük gayesi yararın gözetilmesi ve zararın uzaklaştmlması yoluyla insanın halinin iyileştirilmesi ve toplum düzeninin sağlanmasıdır. Haberleşme hürriyeti kavramı da bu gaye doğrultusunda İslâm'ın ilkeleri ile şekillenmiştir. Haberleşme hürriyeti sadece insan varlığının vazgeçilmez bir hakkı değil, aynı zamanda İslâm dininin ferdi ve toplumu iyileştirme gayesinin gerçekleşmesi için zorunlu bir ilkedir. Bu gaye doğrultusunda, fert ve topluma zarar verecek ölçüde bir haberleşmeye izin verilemez. Haberleşme hürriyeti, kamu yararını hedefleyen Allah haklarım ve kul haklan diye bilinen kişilik haklarını ihlal etmeyi amaçlayamaz. vii IC YîteEKÖĞRETIM RU&ULtf DOKÜMANTASYON MBMffifi"
