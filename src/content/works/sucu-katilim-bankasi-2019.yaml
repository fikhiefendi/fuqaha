abstract: "Günümüz dünyasında işletmeler teknolojinin gelişmesine rağmen emek sermayesine tam olarak çözüm bulabilmiş değillerdir. İşletmeler arasında artan rekabet nedeni ile artık işletmeler minimum maliyet ile maksimum fayda elde etmeye çalışmaktadırlar. Araştırmalar içerisinde iş stresi ve iş tatmini kavramları işletmelerin karlılığını etkileyen durum olarak ortaya çıkmıştır. Buna bağlı olarak iş stresi ve iş tatmini kavramları oldukça önemli hale gelmiştir. Araştırma konusunun içerisinde yer alan X (1960-1980) ve Y (1981-2000) kuşakları farklı dönemlerde doğmalarına bağlı olarak farklı istek ve ihtiyaçları da beraberinde getirmektedir. Buna bağlı olarak farklı kuşakları bir arada barındıran işletmeler, iş gücünü devamlı hale getirerek maliyet düşürme ve verimliliği pozitif yönde etkileyecek kararlar almalıdır. Bu kararlar alınırken kuşakların istek ve ihtiyaçları göz ardı edilmemelidir. Bu çalışmada katılım bankası çalışanlarının iş stresi ve iş tatmini algılarının X ve Y kuşağı özellikleri üzerindeki etkileri araştırılmaktadır. Bu amaçla öncelikle iş stresi ve iş tatmini daha sonra X ve Y kuşağı kavramları açıklanmaktadır. Uygulama bölümünde ise, İstanbul ilinde faaliyet gösteren katılım bankası çalışanlarına iş stresi, iş tatmini, X ve Y kuşağı ölçeklerini içeren anket formu dağıtılmıştır. Elde edilen anket verilerine yüzdelik analiz, lojistik regresyon, açıklayıcı faktör analizi testleri uygulanmıştır. Sonuç olarak katılım bankası çalışanlarının iş stresi ve iş tatmini algılarının alt boyutlarında X veya Y kuşağının özellikleri üzerinde anlamlı bir etkisi olduğu tespit edilmiştir."
