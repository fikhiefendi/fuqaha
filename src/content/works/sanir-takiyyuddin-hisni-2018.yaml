abstract: "Fıkh'i kâideler, Fıkıhta ihtisas yapmak isteyenler için dikkate alınması gereken bir alandır. Bundan dolayı bu alanla ilgili eserlerin yanı sıra içinde kâide ve zâbıtların da olduğuı fıkıh müdevvenâtından da istifade edilmesi gerekir. Çalışmamıza konu olan el-Hısnî'nın Kifâyetu'l-ahyâr' adlı eseri de bünyesinde kâide ve zâbıtlar içeren fıkıh kitaplarından biridir. Araştırmamızın amacı; el-Hısnî'nin Kifâyetu'l-ahyâr' adlı eserinde geçen kâide ve zâbıtları tesbit etmek ve bunların hangi konuda ve nasıl kullanıldığını ortaya koymaktır. Yapılan araştırmada müellifin, hakkında ayet ve hadis olmayan meseleleri temellendirme ve tercih sadedinde usûlî, küllî kâide ve zâbıtlara başvurduğu görülmektedir. Klasik fıkıh müdevvenatında olduğu gibi çalışmamıza konu olan Kifâyetu'l-ahyâr'da da kâide formuna uyan kâidelerin yanı sıra bu forma uymayan kâidelerin de sayısının fazla olduğu söylenebilir. el-Hısnî, alimler tarafından ittifakla kabul edilen ve el-kavâidu'l-amme/el-kavâidu'l-hamse diye bilinen kâidelerden sadece“Asl olan, şekk ile atılmaz”kuralıyla beraber“Adet muhakkemdir”kuralını zikretmiştir. Müellif, zabıtları kemiyet bakımından fıkhî ve usûlî kâidelerden daha fazla kullanmışken fıkhî kâidelere uslüp bakımından benzeyen usûlî kâideleri, fıkhî kaidelere nazaran daha az kullanmıştır. Eserin ana bölümlerini teşkil eden ve“Kitab”diye adlandırılan bölümlerden“Kitâbu's-sayd ve's-sebak”bölümünde herhangi bir kâide veya zabıta rastlanılmamıştır. Şâfiî mezhebinin önemli metinlerinden Gâyetu'l-ihtisâr'ın şerhi olan Kifâyetu'l-ahyâr orta büyüklükte bir fıkıh eseridir. Bilhassa müellifin fıkhî meseleleri delillendirmiş olması, fıkıh taliblerinin ilgisine mazhar olmuştur."
