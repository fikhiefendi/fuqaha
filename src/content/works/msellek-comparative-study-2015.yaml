abstract: "Katılım bankacılığı ya da geleneksel bankacılıkta bir finansal sistemin amacı mali kaynakların harekete geçirilmesi ve farklı yatırım projeleri arasında kendi tahsisi olmasıdır. Böylece faizsiz bankalar subprime krizinde dirençlerini geleneksel finansa göstermiş oldular. Bu genel çalışma bankaların ilkelerini, risklerini ve performanslarını ortaya çıkarmak içindir. Bu çalışma faizsiz bankalar ile geleneksel bankaların özelliklerini karşılaştırarak analiz eder. Aynı zamanda bu iki sistemin ürünlerinin farkını da ortaya koyar. Bu araştırmanın konusu, bizi dört bölümde geliştirmeye yönlendirmektir. İlk bölüm geleneksel bankacılığın üstünde durur. Bu bölüm bize bazı kavramları tanımlamayı ve geleneksel bankacılığın yönetim ilkelerini gözden geçirmemizi sağlar. Ayrıca geleneksel bankacılık sistemindeki farklı tiplerdeki riskleri sunar ve ürünlerin tipini tanımlar. İkinci bölüm faizsiz bankacılığın üzerinde durur. İlk olarak faizsiz bankacılığın prensiplerini ve karşılaşılan çeşitli riskleri görürüz. Devamında faizsiz bankacılığın finansal ürünlerini sunarız. Bu tezin üçüncü ve dördüncü bölümü, bu iki bankacılık sisteminin Türkiye ve Fas arasında karşılaştırmasının üstünde durur. Bu bölümler iki ülkenin finansal ve ekonomik bakış açılarının genel analizleriyle başlar ve sonrasında Türkiye ve Fas'taki değişik ürünlerin detaylı analizi ile son bulur."
