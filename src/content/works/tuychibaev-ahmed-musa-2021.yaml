abstract: "Tezde, Hanefi nevâzil literatürünün önemli yazarlarından Ahmed b. Mûsâ Keşşî'nin Mecmûʻu'l-Havâdis ve'n-Nevâzil ve'l-Vâkıʻât adlı eserinin en eski üç el yazma nüshasına dayanarak hazırlanan tahkikli metni ilk kez sunulmuş, içeriği incelenmiş, Ḥanafī okulundaki yeri ve etkisi tartışılmıştır. Ayrıca çalışmada mezkur eserdeki bilgilerden hareketle IX-XII. yüzyıllarda Maveraünnehir bölgesindeki nevâzil faaliyetleri araştırılmakta, etkili olan meşâyih hakkında bilgi verilmekte ve amelî fıkıh metodolojisinin nasıl işlediği tetkik edilmektedir. Tezde ilk defa Ahmed b. Mûsâ Keşşî'nin ilgili eserinde nekledilen Fevaidür'r-Rüstüfağnî, Fetâvâ Ebi Abdillah b. Ebi Hafs el-Kebir el-Buharî, Fetâvâ Muhammed b. Fazl el-Buharî gibi en eski nevâzil kaynaklarından istifade edilmektedir. Tez, giriş ve iki bölümden oluşmaktadır. Girişte konunun önemi, sınırlandırılması, sunulması ve incelenmesinde takip edilen yöntem ve literatür hakkında bilgi verilmiştir. Birinci bölümde Ahmed b. Mûsâ Keşşî'nin hayatı ve yaşadığı dönem incelenmiş, Mecmûʻu'l-Havâdis ve'n-Nevâzil ve'l-Vâkıʻât adlı eserinin tanıtımı yapılmıştır. İkinci bölümde tahkiki yapılan eserdeki bilgilerden hareketle bölgedeki nevâzil çalışmalarına yön veren eserler ele alınmış, bölgede oluşan Belh, Semerkant ve Buhara nevâzil okullarının özellikleri incelenip önde gelen meşâyihin hayatı ve nevâzildeki yeri araştırılmış, nevâzil faaliyetleri sırasında sıkça başvurulan tercih, tahric ve içtihat gibi istidlal yöntemleri ele alınıp eserden örneklerle incelenmiştir. Tezimizin ekinde de Mecmûʻü'l-Havâdis ve'n-Nevâzil ve'l-Vakiʻât eserinin yirmi sekiz bab ve iki mülhakattan ibaret tahkikli metni sunulmuştur."
