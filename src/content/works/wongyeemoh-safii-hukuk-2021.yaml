abstract: "Suç oluşması için bulunması gereken manevî unsur ile ilgili kavramların gelişimin incelendiği“Şâfiî Hukuk Düşüncesinde Suçun Manevî Unsuru ve Kısas Cezalarına Etkisi”isimli bu araştırma, giriş ve üç bölümden oluşmaktadır. Birinci (Giriş) bölümde, araştırmanın konusu, amacı, yöntemi ve kaynaklarından söz edilmiştir. İkinci bölümde, İslâm ceza hukuku açısından suç kavramı, suçların tasnifi ve suçun oluşması için bulunması gereken suçun genel unsurları (kanunî, maddî, hukuka aykırılık ve manevî unsurları) hakkında bilgi verilmiştir. Üçüncü bölümde, İslâm ceza hukukunda, suçun manevî unsuru ile ilgili kavramın gelişimi geniş kapsamlı bir şekilde ele alınmıştır. Özellikle, manevî unsurun oluşmasında aranan cezaî ehliyet ve kusurluluk hâlleri de incelenmiştir. Son bölümde ise Şâfiî mezhebi özelinde öldürme ve müessir fiil suçlarında suç türleri ve suçlunun sorumluluğunun tespitinde, manevî unsurun rolü incelenmiştir. Ayrıca bu tür suçlarının manevî unsur ile ilgili kavramların daha iyi anlaşılması için, gerek görüldüğü takdirde diğer mezheplerin görüşleri de bahsedilmiştir. Bir fiilin suç niteliği kazanabilmesi için, genellikle kanunî, maddî, hukuka aykırılık ve manevî olmak üzere dört unsurun bulunması gerekmektedir. Bu unsurlardan birinin eksik olması durumunda, suç oluşması ve cezalandırılmasına engel olur. Özellikle manevî unsur ki, suç türlerinin ayırt edilmesinde ve suçlunun cezaî sorumluluğunun tespit edilmesi ve belirlenmesinde çok önemli rol oynamıştır."
