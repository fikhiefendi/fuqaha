abstract: "Tezimizde tahkik ve tahlilini yaptığımız el-Fetâva's-sugrâ adlı eser, Hicri VI. asrın başlarında Türkistan coğrafyasında yetişmiş Sadrüşşehîd lakaplı Ömer b. Abdülazîz b. Ömer b. Mâze tarafından kaleme alınmıştır. Ancak bize Yûsuf b. Ebû Bekr el-Hâssî'nin tertip ve düzenlemesi ile ulaşmıştır. Eser İslâm hukukunun fetvâ dalında klasik fıkıh sistematiğine göre yazılmış önemli bir mecmuadır. Tezimiz, giriş ve sonuç hariç üç bölümden oluşmaktadır. Önsöz ve girişte araştırmanın konusu, önemi, amacı, kapsamı, metodu ve kaynakları üzerinde durulmuştur. Birinci bölümde eserin müellifleri Sadrüşşehîd ve Hâssî'nin hayatları, ilmî kişilikleri, yaşadıkları dönemlerin siyasî ve ilmî durumları detaylı bir biçimde ele alınmıştır. Bıraktıkları eserlerin bulunduğu yerler tespit edilmiştir. İkinci bölümde eserin tahlili yapılmış olup eser muhteva ve üslup açısından değerlendirilmiştir. Eserde atıfta bulunulan kaynaklar tespit edilip yapılan atıfların doğruluk derecesi kontrol edilmiştir. Eserde geçen kavramlar izah edilmiştir. Müellifin metot ve tercihleri, eserin Hanefî mezhebindeki yeri üzerinde durulmuştur. Üçüncü bölümde eserin tamamı tahkik edilmiştir. Yirmiden fazla el yazma nüshası bulunan bu eser metin seçimi metodu ile üç nüshadan tahkik edilmiş ve nüsha farklılıkları dipnotta gösterilmiştir. Eser içinde geçen garip kelime ve meşhur olmayan şahıslar hakkında kısaca bilgi verilmiştir. Ayrıca eserin içinde yer alan Farsça cümleler tercüme edilmiştir."
