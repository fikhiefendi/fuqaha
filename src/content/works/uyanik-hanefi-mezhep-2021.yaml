abstract: "Mezheplerin teşekkül süreçlerini tamamlamaları ile birlikte mezhep birikiminin değerlendirilip, mezhep içerisinde tercihe şayan görüşün seçilmesi işlemi fukahânın sıklıkla başvurduğu bir hüküm aktarma yöntemi olarak karşımıza çıkmaktadır. Zaman içerisinde belli bir sistematiğe oturtulan bu yöntem esnasında kullanılan lafız ve kalıplar aynı süreçte terimleşmiş ve“alâmâtü'l-fetvâ/sıyağu't-tercih”adı altında mezhep terminolojisi içerisindeki yerini almıştır. Osmanlı âlimlerinin önde gelen isimlerinden biri olan İbrâhîm el-Halebî de (v. 956/1549) Mültekâ'l-ebhur isimli eserinde mezhepte tercih edilen hükmü öne çıkarırken muhtelif tercih lafızları kullanma yolunu seçmiştir. Mezkûr eserdeki râcih görüşlerin Hanefi mezhep içi tercih usûlüne uygunluğu bağlamında incelendiği bu çalışma, giriş, iki bölüm ve sonuç kısımlarından oluşmaktadır. Çalışmanın giriş bölümünde araştırmanın öneminden, amacından, kapsamından ve kaynaklarından bahsedilmektedir. Birinci bölümde, çalışmanın ana konusuyla direkt bağlantısı bulunan Hanefilerde mezhep içi tercih usûlü ile ilgili genel bir çerçeve sunulmaya çalışılmaktadır. Bu itibarla evvela mezhep içi tercihin tanımı ve kısımlarından bahsedilip daha sonra sarih tercih lafızları, iltizami tercih metotları ve sarih tercih lafızları arasındaki hiyerarşiye değinilmektedir. İkinci bölümde öncelikle Halebî'nin hayatı ve eserleri ile birlikte bilhassa çalışmanın konusu olan Mültekâ hakkındaki bilgilere yer verilmektedir. Daha sonra Mültekâ'nın büyû' ve icâre kitabında yer alan sarih tercih lafızları mezhep içi tercih usulü bağlamında değerlendirilmektedir. Ayrıca Halebî'nin Mültekâ'yı telifi esnasında yararlandığı eserlerin kendi aralarındaki tercih farklılıklarına ve bu eserlerde yer alan müftâ bih kalıpların müellif tarafından ne şekilde kullanıldığı hususuna temas edilmeye çalışılmaktadır. Sonuç kısmında ise çalışmamız neticesinde elde edilen veriler sıralanarak tercih lafızlarına dair bilgilerin tablo halinde sunumu yapılmaktadır."
