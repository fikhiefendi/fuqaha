abstract: "İmam Muhammed (ö. 189/804) Hanefi mezhebinin gelecek nesillere aktarılması gereken en önemli şahsiyetlerden biridir. Ona ait Hanefi mezhebi oluşum devri eserleri günümüze kadar ulaşmıştır.el-Hâkim eş-Şehîd el-Mervezî (ö.334/945), İmam Muhammed (ö.189/804)'in ?Zâhiru'r-rivâye? diye bilinen eserlerini ?el-Kâfî? adı altında bir araya toplamış ve tekrarları çıkarıp konuları fıkıh bâblarına göre yeniden tanzim ederek bu eseri meydana getirmiştir.Biz bu çalışmamızda belirlediğimiz yazma nüshalardan yararlanarak el-Kâfî'nin Buyû' bölümünün doğru ve tam metnini oluşturmaya çalıştık. Eserin tamamını yapmak yüksek lisans çalışması için yeterli olmadığından sadece bir bölümünün tahkikini yapmakla yetindik.Bu çalışmamız dört bölümden oluşmaktadır. Birinci bölümde el-Hâkim eş-Şehîd (ö.334/945)'in hayatı ve eserleri hakkında bilgi verdik. İkinci bölümde Konumuzu teşkil eden el-Kâfî kitabı ve yazma nüshaları hakkında bilgi verdik. Yine bu bölümde ayrıca el-Kâfî ile İmam Muhammed (ö.189/804)'in el-Asl kitabını Buyu' bağlamında karşılaştırmasını da yaptık. Üçüncü bölümde el-Kâfî'nin Buyû' bölümünün muhtevası hakkında bilgi verdik. Dördüncü bölümde eserin belirlediğimiz yazma nüshalara göre metin tahkiki yapılmıştır."
