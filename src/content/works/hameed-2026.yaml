abstract: "Bu çalışma, Kur'an'daki ahkâm ayetlerinin yorumunda Hanefî müfessir Cessâs ile Mâlikî müfessir Kurtubî'nin tefsirleri arasında sistematik bir mukayeseyi konu edinmektedir. Araştırmanın temel amacı, iki mezhep ekolü arasındaki metodolojik farklılıkları ortaya koymak ve fıkhî arka planın, usûlî yaklaşımların ve mezhebî eğilimlerin hüküm istinbatında nasıl etkili olduğunu göstermektir. Çalışmanın önemi, fıkhî tefsir ile karşılaştırmalı yöntem analizini bir araya getiren önceki araştırmaların eksikliği bağlamında, istidlâl araçlarının yapısal analizi, tercih yöntemleri ve maksatların sıralanması gibi unsurların her iki müfessir nezdinde incelenmesi ihtiyacından kaynaklanmaktadır. Araştırma problemi, önceki çalışmaların çoğunun yalnızca fıkhî içerikleri sunmakla yetinmesi veya yalnızca bir müfessiri ele alması, dolayısıyla mezhep ile yöntem arasındaki ilişkiyi bütüncül bir biçimde ele almamış olmasıdır. Bu bağlamda çalışma, seçilmiş tefsir örnekleri üzerinden her müfessirin Kur'an metniyle nasıl ilişki kurduğunu, usûlî araçlarını nasıl kullandığını ve mezhebî arka planının yorum tercihlerini nasıl etkilediğini analiz ederek bu boşluğu doldurmayı hedeflemektedir. Araştırma, karşılaştırmalı analitik yönteme dayanmaktadır. Cessâs ve Kurtubî'nin ahkâm ayetlerine dair görüşleri takip edilmiş, fıkhî usûlleri ışığında analiz edilmiş ve metodolojik farklar tespit edilerek temellendirilmiştir. Çalışma, muâmelât, cezalar ve hudûd ile ilgili ayetlerden seçilen örnekler üzerinden iki ekol arasındaki yöntemsel ayrışmayı ortaya koymaktadır. Araştırma sonucunda ulaşılan temel bulgulardan bazıları şunlardır: Cessâs'ın Hanefî istihsan ve kıyas ilkelerine açık bir şekilde dayandığı; Kurtubî'nin ise maksatlara, sedd-i zerâyi' ilkesine ve Medine ehlinin amelini dikkate alarak tercihlerde bulunduğu görülmüştür. Her iki müfessirin de mezheplerini yansıtan tutarlı bir metodolojik yapıya sahip oldukları ve Kur'an'daki teşrî metinlerle ilişki kurmada özgün modeller sundukları tespit edilmiştir. Bu çalışma, tefsir yönteminin Kur'an metninin anlaşılmasındaki önemini vurgulamakta ve fıkhî tefsir çalışmalarının usûlî karşılaştırma perspektifiyle geliştirilmesine katkı sunmaktadır."
