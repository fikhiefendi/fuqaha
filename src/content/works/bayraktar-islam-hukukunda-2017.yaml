abstract: "Bu çalışmamızda İslâm hukukunda finansman konusunu ele aldık. Ekonomi, geniş bir bilim dalıdır ve pek çok alt dalı vardır. Bu alt dallardan birisi de finansmandır. Finansman, ekonomik faaliyetlerin geliştirilmesi son derece önemlidir. Ekonomik faaliyetler, insan hayatı için oldukça önemlidir ve tarihi ilk çağlara kadar uzanır. Kur'ân-ı Kerîm ve Sünnet'te ekonomik hayatın önemine ilişkin işaretler bulunmaktadır. Ayrıca Kur'an-ı Kerim ve Sünnet, ekonomik hayata dair düzenlemeler ve kurallar da koymuştur. İslâm hukukçuları da eserlerinde ekonomik hayata geniş yer vermişlerdir. Bu çalışmamızda İslâm hukukunun kaynaklarındaki finansman kavramıyla ilişkili konuları tek çatı altında işledik. Çalışmamız iki bölümden oluşmaktadır. Birinci bölümde bağış amaçlı finansman yollarını inceledik. İkinci bölümde ise bir gelir elde etmek amacıyla kullanılan finansman yollarını inceledik."
