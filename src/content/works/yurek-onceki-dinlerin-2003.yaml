abstract: "ÖZET Her dinde olduğu gibi, İslâm Dini'nin de kedi bütünlüğü içinde bir hukuku ve sistematiği vardır. Kur' an ve Sünnet tartışılmaz iki temel kaynaktır. Bu iki kaynağın dışında da bazı kaynaklar vardır. Bunlardan birisi de önceki dinlere ait olan hukuki düzenlemelerdir. Önceki dinlere ait olan hukuki düzenlemelerle ilgili en önemli konu; bu ayetlerin yürürlükten kaldırılıp kaldırılmadığının tesbiti ve eğer yürürlükten kaldırılmamış ise bizler üzerindeki yaptırım gücünün keyfiyeti ve ne ölçüde bağlayıcı olduğu meselesidir. Hükmü yürürlükten kaldırılmayan hükümlerin bizler için de geçerli olduğunda dört mezhebin de ittifakı vardır. Hükmü kaldırılan v e Kur' an ve Sünnet'te geçmeyen hükümler zaten ittifakla hüccet olamazlar. Önceki ümmetlere ait bu hukuki düzenlemelerin hepsinin değeri de aynı değildir. Bunlardan bazıları hukuki düzenlemelere mesnet olurken diğer bazı hükümler de irşadi ve ahlâki hükümler içermektedir. Çalışmamızın önemli bir bölümünü de Gazâli'nin yaklaşımları oluşturmaktadır. Gazali, önceki dinlerin kanunlarım sadece dinimizin hükmünü yürürlükten kaldırmadığı esaslar olarak kabul eder. Yürürlükten hükmü kaldırılan meselelere Gazali fazla bir açıklama yapmaksızın reddeder. Sonuç olarak diyebiliriz ki; önceki dinlere ait olan hukuki düzenlemeler Kur' an Ve Sünnet ile çelişmediği ölçüde, dinin genel ruhuna uygun olduğu takdirde, mutlak olarak bağlayıcı kıldığım iddia etmek zor olsa da bunlarla amel etmekte bir beis yoktur. VI"
