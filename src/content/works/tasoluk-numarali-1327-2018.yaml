abstract: "Osmanlı mahkemelerinde verilen kararların ve devlet merkezinden gelen ferman, emir ve tebliğlerin tutulduğu defterlere şer'iyye sicili denir. Bu çalışmada H. 1327-1329 / M. 1909-1911 yıllarına ait 40 Numaralı Sivrihisar Şer'iyye Sicili incelenmiştir. Şehir tarihi araştırmalarında önemli bir konuma sahip olan ve üzerinde çalışmış olduğumuz Sivrihisar Şer'iyye Sicili'nde bulunan 14 adet kayıt transkripsiyona tabi tutularak günümüz Türkçesine çevrilmiş ve belli bir plan dahilinde değerlendirilmiştir. Sicilin çeviri ve değerlendirme işlemi tamamlandıktan sonra defterde yer alan tereke ve muhallefât kayıtları hakkında değerlendirme yapılmıştır. Bu değerlendirme sonunda tereke kayıtlarına yansıyan malların taksiminde İslâm fıkıhının aile hukuku ile ilgili kurallarına riayet edildiği; mal taksimatının gerçekleştirilmesinde ihtilâf yaşanmadığı; tereke bedellerinin yüksek meblağlara ulaşıldığı; mal çeşitliliğinin sosyo-ekonomik hayatı yansıtacak kadar zengin olduğu; mal çeşitleri içerisinde şehir hayatı ve ticaret faaliyetleri ile ilgili malların baskın olduğu görülmüştür."
