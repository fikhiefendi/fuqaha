abstract: "Araştırma Türkiye'de zekâtın hukuki, sosyal, politik ve ekonomik gerçekliğini belirginleştirmeyi amaçlamaktadır. Araştırma neticesinde elde edilen bulguların, önemli bir iktisadi kaynak olan zekâtın toplum yararına, etkili, etkin ve verimli kullanılması için geliştirilecek politika önerileri için kerteriz noktası olması beklenmektedir. İkinci bölümde zekât, yakın tarihin bir nesnesi olarak ele alınmıştır. Türkiye Cumhuriyeti'nin yüzüncü yılında zekâtın yüz yıllık serencamı yasama, yürütme ve yargı erklerinin hüküm ve tasarrufları ışığında aydınlığa kavuşturulmuş, Türkiye Cumhuriyeti devletinin zekâta dair hafıza ve tecrübesi ortaya koyulmuştur. Üçüncü bölümde zekât toplumsal bir olgu olarak incelenmiş, Türkiye zekât pratiğini fenomen olarak mümkün kılan toplumsal koşullar belirginleştirilmiştir. Türkiye toplumunun zekâta dair algıları, uygulama pratikleri ve zekâttan beklentileri geliştirilen ölçek yardımıyla anlaşılmaya çalışılmıştır. Olgusal gerçekliğinin keşfedilmesi, zekâtın tüm toplum için etkin, etkili ve verimli hale getirilmesinde izlenecek politikaların olabildiğince isabetli tespit edilmesine yardımcı olacaktır. Araştırmanın dördüncü bölümünde ise Türkiye ekonomisinde diğer tüm değişkenler veriyken, zekâtın Türkiye ekonomisindeki mevcut ve/veya olası etkileri, girdi-çıktı analiziyle, sektörler arası ilişkinin yönü ve şiddetindeki değişim üzerinden gözlemlenerek zekât için anahtar sektörler tespit edilmiştir."
