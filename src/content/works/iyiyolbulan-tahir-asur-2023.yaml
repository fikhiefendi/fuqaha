abstract: "İnsanlar toplumsal hayatın gerekliliği olarak birbirleriyle irtibatlı olmak zorundadır. Bu bağlamda insanın diğer insanlarla ilişkilerinde toplumun huzurunun bozulmaması için belli bir düzene ihtiyaç vardır. Bu ihtiyaca binaen hukuk kuralları oluşturulur. Müslümanlar birbirleriyle ilişkilerinde bazı kurallara riayet etmelidir. Bu kuralların ilmi de İslam hukukudur. Nitekim İslam hukuku insani ilişkileri düzenleyen ilkelere sahiptir. Özellikle İslam kamu hukuku ilmi, bireyin toplumsal yönü ve devlet hüviyetiyle kişilerin nasıl davranması gerektiğine dair temel ilkeleri ve kuralları haizdir. İslam'da kamu hukuku klasik dönemlerde ayrıca bir başlık altında incelenmemiş olsada kamu hukukunun ilkeleri hep var olagelmiştir. Çalışmadaki başlıklar, son dönem İslam kamu hukuku literatürlerinden esinlenerek yapılmıştır. Kamu hukukuyla ilgili ayetler, tefsire ve fıkha ilişkin özgün yaklaşımları olan ve Şâtıbî'den sonra makâsıd konusunu ele alarak müstakil çalışma ile yeniden gündeme taşıyan Tahir b. Âşûr özelinde yapılmıştır. Onun“et-Tahrîr ve't-Tenvîr”isimli tefsiri merkeze alınmıştır. Ayrıca Tahir b. Âşûr'un ayetlere yaklaşımı Hanefî ve Mâlikilerin genel görüşleriyle mukayese edilerek ortaya koymaya çalışılmıştır. Bu çerçevede Tahir b. Âşûr'un hangi görüşlerle mezheplerden ayrıldığını veya hangi görüşleriyle mezheplerle ittifak içerisinde olduğu durumları ortaya koyarak mukayeseli bir inceleme gayreti gösterilmiştir. Tahir b. Âşûr'un görüşlerini kendi coğrafyasında yaygın olan Mâlikî görüş ile Müslümanların ekseriyetle benimsedikleri Hanefî görüşle mukayese ederek ahkam ayetlerine dair hukuki çıkarımlarındaki özgün yönü daha net şekilde ortaya koymak hedeflenmiştir. Çalışmamız üç bölümden oluşmaktadır. Birinci bölümde çalışmamızın ana kaynağını oluşturan et-Tahrir ve't-Tenvîr isimli eserin yazarı olmasından dolayı ve çalışmamızın öneminin anlaşılması açısından Tahir b. Âşûr ve ilmi kişiliğinden bahsedilmiştir. Ayrıca konu kapsamı kamu hukuku olduğu için kamu hukukuna dair gerekli olan temel bilgilendirmeler yapılmıştır. Çalışmamızın ikinci bölümü kamu hukukunun alt başlığı olan Anayasa Hukuku, yasamamın yetkileri ve ilkeleri ayrıca temel hak ve hürriyetler çerçevesinde incelenmiştir. Üçüncü bölümde konu ile ilgili ayetler Devletler Genel Hukuku ve Mâli Hukuk başlığı altında uluslararası ilişkiler çerçevesinde değerlendirilmiştir. Mali hukuk kısmı ise Müslümanlardan ve gayri müslimlerden alınan vergiler başlığında incelenmiştir. Çalışmamız kapsamında Ceza hukuku başlığına neden yer vermediğimiz“Araştırmanın Konusu”başlığı altında izah edilmiştir. Araştırma neticesinde Tahir b. Âşûr'un içinde yaşadığı toplumda yaygın olan Mâliki mezhebinin görüşleriyle genellikle pararellik göstermesi özellikle yasama bölümünde ve İslam hukukunun temel ilkelerinden biri olan adalet anlayışında net olarak görülmektedir. Ayrıca kısas veya savaşla ilgili bazı durumlardaki görüşlerinin Hanefî ve Mâlikî mezhebinden tamamen ayrı olan gayeci yaklaşımları da tespit edilmiştir. Ele alınan görüşlerin nihayetinde fıkhi değerlendirmelerimiz de mevcuttur."
