abstract: "İslâm iktisadı, tüketimi yalnızca fizyolojik ihtiyaçların karşılanmasıyla sınırlı görmez; onu ahlaki, toplumsal ve ekonomik sorumluluklarla uyumlu, dengeli bir süreç olarak tanımlar. Bu çerçevede israf, sadece maddi kaynakların savurganlığı değil; aynı zamanda bireysel zaaf, toplumsal yozlaşma ve manevi bilinç kaybı olarak değerlendirilir. Kur'ân ve sünnette ölçülülük, kanaat ve sorumluluk ilkeleri sürekli vurgulanmış; nimetlerin bilinçsiz tüketimi kesin bir şekilde kınanmıştır. Buna karşın modern tüketim kültürü, ihtiyaçtan çok arzu ve statü odaklı bir yapıya bürünerek İslâm'ın öngördüğü tasarruf ve denge anlayışıyla çelişmektedir. Bu çerçevede tez, modern tüketim kültürü içinde öne çıkan İslâmi referanslı tüketim ürünlerini israf bağlamında eleştirel olarak değerlendirmektedir. Helal gıda, helal turizm ve İslâmi moda örnekleri üzerinden yürütülen incelemede, bu ürün ve hizmetlerin çoğu zaman İslâm'ın temel değerleriyle örtüşmekten çok, tüketim kültürünün değerlerini meşrulaştıran bir araç haline geldiği görülmektedir. Helal gıda sektöründe sertifikasyon süreçlerinin ticarileşmesi, helal turizmde lüks ve gösteriş odaklı anlayışın öne çıkması, İslâmi modada ise tesettürün asli anlamını yitirerek bir tüketim nesnesine dönüşmesi bu duruma örnek teşkil etmektedir. Sonuç olarak çalışma, helal kavramının yüzeysel bir pazarlama aracına indirgenmesinin, İslâm'ın tüketim ilkeleriyle çeliştiğini vurgulamaktadır. İslâmi referanslı tüketim ürünlerinin, dini hassasiyetleri gözetmekten ziyade tüketim kültürünü besleyen bir araç haline gelmemesi için israf karşıtı ilkeler etrafında yeniden anlamlandırılması gerektiği ifade edilmektedir."
