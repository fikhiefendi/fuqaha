abstract: "Toplumsal huzurun sigortası mahiyetinde olan zekât, İslâm dininin en temel vazifelerinden biri olup mal ile yapılan bir ibadettir. Nisap miktarı mala sahip olan kimselerin, belirli niteliklere sahip mallarından, verilmesi gerektiği ölçüler nispetinde, gönül hoşnutluğu ile başa kakmadan, almaya hak kazanmış kimselere vermektir. Zengin ile fakir arasındaki dengenin bozularak uçuruma dönüşmemesi, toplum varlığının sağlıklı bir şekilde devam edebilmesi için bu sosyal yardımlaşma ve dayanışma sisteminin devam etmesi hatta yeniden yapılandırılması gerekmektedir. Bu nedenle gerçek ihtiyaç sahiplerinin tespit edilip yapılan yardımları tam bir şekilde yerine ulaştırmak dinimizin önem verdiği noktalardır. Kurân-ı Kerim'de Tevbe suresi altmışıncı ayette zekâtın sarf edilmesi gerektiği yerler bildirilmiştir. Ayetten anlaşıldığı üzere zekât ancak sekiz sınıfa sarf edilebilir. Bunların dışında kalan kimselere zekât verilemez. Bu kimseler şunlardır:1. Fakirler: Nisap miktarından az malı olanlar ya da nisap miktarı geliri olsa bile bu malla sadece asli ihtiyaçlarını karşılayabilecek kimselerdir.2. Miskinler: Hiç geliri olmayan, aciz, düşkün, yiyeceği ve giyeceği için dilenmeye muhtaç olan kimselerdir.3. Amiller (zekât işlerinde çalışanlar): Zekât toplama ve dağıtma işlemleriyle ilgili tüm birimlerde vazifeli memurlardır.4. Müellefe-i Kulûb: Kalpleri İslâm'a yaklaştırılmak, zararsız hale getirilmek, kötülüklerinden emin olunmak, İslâm dininde sebat ettirilmek istenilen kimselerdir.5. Köleler: Savaş ya da benzeri sebeplerle özgürlüğünü yitirmiş, başkasının buyruğu altındaki kimselerdir.6. Borçlular: Borcu olan ve borcuna karşılık gelen malından başka nisap miktarı malı bulunmayan kimselerdir.7. Allah Yolunda Çalışanlar: Allah'ın rızasını kazanma arzusuyla çalışan, mücadele eden, savaşan kimselerdir.8. Yolda Kalmış Kimseler: Yolculuk esnasında herhangi bir sebepten dolayı mağdur duruma düşmüş kimselerdir.Belirtilen sekiz sınıfın kimler olduğu şartlara, zamana ve âlimlerin yorumlarına göre nitelik kazandığı bildirilmektedir. Bunların dışında kalan kimselere zekât verilmez. Zekât verilemeyeceği açıkça beyan edilen kimseler de şunlardır:1. Zenginler: İslam'ın belirlediği ölçüler çerçevesinde nisap miktarından fazla malı olan kimseler.2. Müslüman Olmayanlar: Müellefe-i Kulûb dışında kalan gayr-i müslim kimselerdir.3. Bakmakla Yükümlü Olunan Kimseler: Usul ve furu dediğimiz, (anne, baba, dede, nine, çocuk, torun) kişinin nafakasını temin etmekle sorumlu olduğu kimselerdir.4. Hz. Peygamberin Yakınları: Hz. Peygamber (s. a. s.)'in soyundan olanlara da zekât verilemeyeceği ifade edilmiştir."
