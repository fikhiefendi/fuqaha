abstract: "Zekât, İslam dininin emrettiği mali bir ibadet çeşididir. Bu ibadetin amacı, toplumda yer alan fakir ve zengin gruplar arasında oluşabilecek sosyo-içtimai ve sosyo-ekonomik olumsuzlukları ortadan kaldırmak ve toplum içerisindeki her bir Müslümanın temel ihtiyaçlarını gidermek, huzur ve güven içerisinde yaşamalarını sağlayabilmektir. Bu ibadet özü itibariyle malı temizleme ve ruhu arındırma gibi önemli görevleri bünyesinde barındırmaktadır. Zekât zengine farz olan bir ibadettir. Zengin Müslüman gerekli şartlar oluştuğunda malının zekâtını ayırıp Kur'an'da belirtilen yerlere, zekât kurumu aracılığıyla ulaştırmak mecburiyetindedir. Zekât ibadeti, İslam hükümlerini prensip edinmiş bir devletin eliyle düzenlenmeli, tertip edilmeli ve toplatılıp ilgili yerlere dağıtımı sağlanmalıdır. Peygamberimiz ve devam eden Raşit Halifeler dönemlerinde bu metot kullanılmış ve mevcut delillerle de zekât ibadetinin yerine getirilme görevinin İslam devletine ait olduğu belirtilmiştir. Takip eden süreçte ise bu ibadet devletin düzenlediği bir uygulama olmaktan çıkmış ve ferdi olarak yerine getirilen bir yapıya dönüşmüştür. Günümüzde Suudi Arabistan, Endonezya ve Malezya gibi ülkelerde devlet eliyle yürütülmeye çalışılan bir zekât organizasyonundan bahsedebiliriz. Ferdi olarak yürütülmeye çalışılan ve bağlamından koparılan zekât ibadeti, organize bir şekilde ve devlet eliyle yürütülmesi neticesinde hem çok daha verimli hale getirilerek güzel sonuçlar doğuracak, hem de çok daha geniş kitlelere ulaşılması sağlanmış olacaktır. Sunduğumuz bu bilgiler ışığında özetle, zekât ibadetinin devletçe yerine getirilecek ve kurumsal bir kimliğe kavuşacak bir durumundan söz edilebilir. Ülkemizin siyasi ve hukuki yapısı nazarı itibara alınarak oluşturulacak bir model ile Türkiye'de, zekât ibadetinden beklenilen hedefler gerçekleştirilmiş olacaktır."
