abstract: "Bu çalışmamızın amacı varlıkları birbirinden ayırmak ve var olanları anlamlandırmak için yaratılmış olan temel unsurların başında gelen renk, koku, tat ve sesleri incelemektir. İnceleme konusu salt olarak renk, koku, tat ve seslerin kendileri olmayıp bunların klasik veya modern dönemde var olan şer'î hükümlerde olumlu ya da olumsuz yönden meydana getirdikleri etkileri olacaktır. Kimi zaman bu unsurlar farz olan ibadetlerde olması elzem olan bir şartken, bazen de yapılan bir satışta var olan muhayyerlik hakkını elde etmeyi sağlayan bir alâmet, bazen de işlenen bir suçun ispatında delil olabilmektedir. Araştırmaya konu olan renk, koku, tat ve ses unsurlarının tümü İslâm hukukunda var olan ibâdât, muâmelât ve ukûbât ekseninde dört mezhebe göre incelenmiştir. Her bir unsur müstakil birer bölüm olarak ele alınmış olup her bölümde de söz konusu unsurların ilgili alanlardaki hükümlere tesirinin bulunup bulunmadığı, hükümlerde meydana getirmiş oldukları olumlu veya olumsuz etkilerinin olup olmadığı incelenmeye çalışılmıştır."
