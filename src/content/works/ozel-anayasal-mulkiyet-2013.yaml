abstract: "Anayasal mülkiyet hakkı, mülk olarak niteleyebileceğimiz değere yönelik müdahaleler karşısında, kişileri güvence altına alan bir özgürlük alanıdır. Devletin, kişisel mülkiyete konu taşınmazlara yönelik en yaygın müdahale biçimi kamulaştırmadır. Anayasal mülkiyet hakkı, kamulaştırma sürecinin tamamının adil yürütülmesini teminat altına alan bir çerçevedir. Kamulaştırma yetkisi, idareye tanınan anayasal bir yetki olduğundan bu yetkinin, Anayasa'nın 46 ncı ve 13 üncü maddesindeki koşullara uygun kullanılması gerekmektedir. Kamulaştırmanın kamu yararı amacına yönelik kullanılması, işlemin hukuka uygun olarak sonuçlandığını göstermez. Ayrıca kamulaştırma sürecinin sonunda, malike taşınmazının gerçek karşılığının ödenmesi sağlanmalıdır. Gerçek karşılık ilkesi, idareye yöneltilmiş bir anayasal direktif olduğu kadar, taşınmaz malikini koruyan anayasal bir haktır. Gerçek karşılığın alınması hakkı, kamulaştırma sonucunda mülkiyet hakkı sona eren malikin, kamulaştırma sürecindeki en önemli anayasal koruma kalkanıdır. Taşınmazın gerçek karşılığı olan adil bedel, bir ekonomik değere karşılık gelmektedir. Alman ve ABD hukukunda taşınmazın gerçek ve adil karşılığının, ?pazar değeri? olması yönünde bir uygulama bulunmaktadır. Pazar değerinin, uluslararası kuruluşlar nezdinde kabul edilmiş bir anlamı ve belli standartları bulunmaktadır.Yargıtay tarafından, mühendislik, ekonomi, finans ve matematik gibi bilim dallarında uzman olmayı gerektiren değerleme faaliyetinin, salt hukuksal bilgiyle yorumlandığı ve yargısal direktifler ile değerleme sürecine müdahil olunduğu gözlenmiştir. Yargıtay, kamulaştırma bedelini tespit eden bir bilirkişi raporu karşısında, bir Adli Tıp Raporu karşısındaki hukuksal tutumunun ötesine geçmemelidir. Bunun için de kamulaştırma bilirkişi kurulunun tamamının Lisanslı Gayrimenkul Değerleme Uzmanlarından oluşması, bilirkişi raporlarının denetiminin de TDUB tarafından oluşturulan bir kurulca yapılması uygun olacaktır. 2942 sayılı Kamulaştırma Kanunu'nun değerlemeye ilişkin ölçütleri, Yargıtay ve idarelerce gerçek karşılığa ulaşmayı engelleyici şekilde yorumlandığından, tüm değerlemelere ilişkin ölçütlerin pazar değeri ilkeleri baz alınarak yasal güvence altına alınması gerekmektedir."
