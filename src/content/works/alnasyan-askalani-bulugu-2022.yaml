abstract: "Bu çalışma, peygamberin sünnetinde yasaklanan mali işlemlere ışık tutmak amacıyla yapılmış olup, yedi yasak yöntemine dayanan, çağdaş mali ve ekonomik işlemlerde yasak olan mali ve ekonomik işlemlerde pratikten çıkarılarak yapılan bir fıkhî çalışmadır. Yasaklar kavramının açıklığa kavuşturulması ve araçlarının belirlenmesi yoluyla hükmün çıkarıldığı anlatıldığı ve ardından her işlemin benzer konulara eklendiği şeklinde olup ayrıca bu araştırma tümevarım, betimleme, analiz ve tümdengelim yöntemi izlemiştir. Bu çalışmada istenilen sonuçlara ulaşmakiçin çalışma yapılan her satışın her bir sayının üç şeye dayandığı sonucuna varmıştır. birincisi: mükellefin ne yaptığının bir açıklaması olan işlem, ikincisi: bu işlemin şeriattaki statüsünün bir göstergesi olan hüküm Zaruret ve makbul bakımından uygunluğu, çözüm ve caizlik, yasaklama ve zorlama üçüncüsü: hükmün gerekçesi anlamına gelen vekâlet veya hüküm bu çalışmanın özünü teşkil etmekte olup, çevresinde yedi alana bölünmüştür. Bunlar adaletsizlik ve zarar, tefecilik, kumar, aldatma, memnuniyetsizlik, para israfı, genel toplumsal ahlaka aykırılık şeklinde olup satış sözleşmesi dışında herşeyi yasaklama gibi hukuk bilimlerine dayanır. İşlemlerin hükümlerinde açıklık ve iknaya ulaşmak için bu gereklilikleri anlamak, araçlarını kontrol etmek ve önemini anlamak gerekir."
