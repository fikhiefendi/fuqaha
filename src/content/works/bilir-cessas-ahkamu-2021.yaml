abstract: "Bağlamın gözetilmesi, Kur'ân'ın doğru anlaşılıp ve yorumlanmasına katkı sağlayan en önemli ilkelerden biridir. Zira Kur'ân'da yer alan ayet ve konuların öncesi, sonrası, tarihi çerçevesi, kısacası diğer unsurlarla doğrudan ya da dolaylı olarak irtibatları vardır. Bu açıdan bağlama riayet edilmediği takdirde isabetsiz yorumların ortaya çıkması muhtemeldir. Bu çalışmada farklı disiplinler tarafından da kaynak olarak kabul edilen Ebû Bekir Ahmed b. Alî er-Râzî el-Cessâs'ın Ahkamü'l-Kur'ân'ındaki kelâm ve fıkha dair tevillerle ayetler arasındaki ilişki bağlam açısından incelenmiş ve onun ayetlerin maksat ve hedeflerine ulaşmak için hangi unsurları esas aldığı tespit edilmiştir. Ayrıca Ahkamü'l-Kur'ân'daki bazı yorumların arkasında yatan sebepler ile bu tür tevillerin tefsir ilmi açısından doğru olup olmadığı araştırılmıştır. Cessâs'ın ayetlerin delâletlerinden hareketle ulaştığı çıkarımlar ile mensup olduğu mezhebinin görüşleri arasındaki ilişki de ortaya konmuştur. Diğer taraftan, kendi mezhebinin doğru, karşı mezhebin ise batıl olduğunu kanıtlama arzusu gibi ideolojik kabullerin Kur'ân yorumlarını nasıl etkilediği dikkatlere sunulmuştur. Çalışmamızda ulaştığımız sonuca gelince; Kur'an'ı doğru anlamada metin içi ve metin dışı bağlamlara riayet edilmediği takdirde parçacı yaklaşımlar ve anakronik yorumların ortaya çıkması kaçınılmazdır. Ayrıca Kur'ân metninin salt lafzî anlamıyla okunması ilgili ayetlerde bahsedilen konunun değişmesine yol açmaktadır. Bununla birlikte metnin sahih anlamı belirlendikten sonra bağlamından kopuk bir şekilde yapılan yorumlar tartışmalı olmakla birlikte, Kur'ân'ın tefsirine zenginlik katıp fikir ve düşünce hürriyetini geliştirdiği için bir sakıncasının olmadığı kanaati hâsıl olmuştur."
