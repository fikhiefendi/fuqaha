abstract: "Horasan'da Eş'arîliğin tarihsel seyri bu araştırmanın ana konusudur. Eş'arîliğin Horasan'a nasıl intikal ettiği ve hangi aşamalardan geçtiği temel meselelerden birisi olmuştur. Bu açıdan mekân ve düşünce arasındaki bağın etkileri tespit edilmeye çalışılmıştır. Eş'arîliğin Horasan'da benimsenmesi belirli bir fikri zemin üzerinde gerçekleşmiştir. Bu bölgede temel bir yapı olan Hadis taraftarlığının gelişimi ve Şâfiî mezhebinin kabul süreci üzerinde durulmuştur. Aynı şekilde sûfîlerin toplumsal etkileri de tespit edilmeye çalışılmıştır. Eş'arîliğin bu toplumsal taban üzerinden bölgedeki yükselişi izah edilmiştir. Büveyhî, Gazneli ve Selçuklu devletlerinin Eş'arî düşüncenin gelişimine katkıları araştırılmıştır. Söz konusu devletlerin mezhep siyasetleri üzerinde durularak Eş'arîliğe dönük uygulamaları ve ardındaki nedenler irdelenmiştir. Siyaset ve mezhep bağının Horasan'da Eş'arîliğe etkisi tespit edilmeye çalışılmıştır. Eş'arî düşüncenin Selçuklular döneminde Horasan'da Nizâmiye medreselerine etkisi ayrıca önemli bir konudur. Eş'arîliğin fikri yayılmasına büyük katkılar sunan Nizâmiye medreselerinin hangi nedenlere bağlı olarak inşa edildiği ele alınmış ve mezhebi yönü tespit edilmeye çalışılmıştır. Eş'arî'den gelen dağınık gözüken kelâm düşüncesinin Horasan'da sistematik bir boyuta yükselmesi ve düşüncenin ekolleşmesi süreci üzerinde durulmuştur. Eş'arîliğin epistemolojisinin inşasının nasıl gerçekleştiği ayrıca dikkat çektiği için izah edilmeye çalışılmıştır. Özellikle de İbn Sina felsefesinin kelâma dönük eleştirileri ve Eş'arîlerin buna karşı tavırları süreç merkezli bir yolla ele alınmıştır. Gazzâlî'nin mantık ve kelâm ilişkisine dair tespitlerine dikkat çekilmiştir. Eş'arîliği sadece kelâm ekolü olarak değerlendirmemek gerekmektedir. Bu açıdan Eş'arîliğin Şâfiî fıkhına etkisi ve sûfî düşünceye katkısı dikkatle takip edilmiştir. Aynı şekilde fıkıh ve tasavvufun kelâma katkıları üzerinde durulmuştur. Böylece Eş'arîlik; Hadis taraftarlığı, Şâfiî ve sûfî geleneklerden beslenerek bütüncül bir din yorumunun çatısını oluşturmuştur. Son olarak Eş'arîliğin aidiyetten kimlik formuna dönüşümü üzerinden mezheplerin şekillenmesi sürecinin nasıl gerçekleştiği temellendirilmeye çalışılmıştır."
