abstract: "İbn Kudâme'nin el-Muğnî Adlı Eserinde İmam Şâfiî'ye Nispet Edilen Görüşlerin Tahkiki ve Tahlili (Cihad ve Cizye Bölümü) adlı bu çalışmada İbn Kudâme'nin el-Muğnî adlı eserinde İmam Şâfiî'ye nispet edilen görüşlerin doğru olup olmadığının araştırılması amaçlanmıştır. Çalışmamız bir giriş, iki bölüm ve bir sonuçtan oluşmaktadır. Giriş kısmında tezin konusu, önemi, amacı ve metodu ile araştırmada yararlanılan kaynaklarından söz edilmiştir. Birinci bölümde İbn Kudâme'nin hayatı, kişiliği ve Hanbelî mezhebindeki konumu, eserleri ve el-Muğnî adlı eserini detaylıca ele aldık. İkinci bölümde eserimizin Cihad ve Cizye bölümünde İmam Şâfiî'ye atfedilen görüşleri tespit edip doğruluğunu Şâfiî mezhebinin muteber kaynaklarından tahkik etmeye çalıştık. Sonuç bölümünde ise araştırmamızın neticesinde elde ettiğimiz bilgileri okuyucuya sunduk."
