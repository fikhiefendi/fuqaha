abstract: "Osmanlı Devleti'nde hazırlanan ilk medeni kanun olan Mecelle-i Ahkâm-ı Adliyye, XIX. yüzyılın ikinci yarısında bir heyet tarafından kaleme alınmıştır. Üzerinde çalıştığımız ve önemli Mecelle şerhlerinden biri olan Dürerü'l-Hükkâm Şerhü Mecelletü'l-Ahkâm isimli eserin müellifi, Mecelle'yi hazırlayan heyette de yer alan döneminin önemli hukukçularından biri olan Ali Haydar Efendi'dir. Dürerü'l-Hükkâm, o dönemin hukukî yaklaşımlarının anlaşılabilmesi bakımından incelenmesi gereken bir eserdir.Bir giriş ve bir ana bölümden oluşan tezin ana bölümünün başlangıcında Ali Haydar Efendi'nin hayatı ve hukukî kimliği hakkında kısa bilgi verilmiştir. Devamında ise Dürerü'l Hükkâm'ın 356-403. maddelerinde geçen kaynakların tespit ve tahkîki yer almaktadır. Belirtilen maddelerde geçen kaynaklara ulaşılıp kaynaklarda konunun kaçıncı cilt ve sayfada geçtiği dipnot olarak verilmiş ve metin latinize edilmiştir."
