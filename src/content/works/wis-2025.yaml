abstract: "Bu araştırma, üç İslami banka olan Albaraka İslami Bank, Alahly İslami Bank şubesi ve Faysal İslam Bankası tarafından sunulan murabaha sözleşmelerini incelemeyi ve analiz etmeyi amaçlamaktadır. Araştırma, bu sözleşmelerin İslam şeriatı kuralları ve İslami Finans Kurumları Muhasebe ve Denetim Organizasyonu (AAOIFI) standartlarına uygunluk düzeyini değerlendirmeyi hedeflemektedir. Araştırmalarda Albaraka İslami Bank, Faysal İslam Bankası ve Alahly İslami Bank şubesinde kullanılan murabaha sözleşmelerinin analizi sonucunda şu bulgular elde edilmiştir: Albaraka İslami Bank: Diğer bankalara göre sözleşme şartlarında daha fazla şeffaflık ve detay sunmaktadır. Ayrıca, anlaşmazlık ve gecikme durumlarında net çözüm mekanizmaları benimsemektedir.Albaraka İslami Bank'taki murabaha sözleşmesi, şeffaflığı ve şeriata uygunluğu artırarak banka ile müşteri arasındaki güveni güçlendirmektedir . Faysal İslam Bankası: Net düzenlemeler ve şeriata yüksek uyum göstermektedir. Ticari işlemlerin titiz bir şekilde düzenlenmesiyle sözleşmelerin şeriat standartlarına uygunluğunu sağlamaktadır. Bu düzenleme, şeffaflığı ve güveni artırarak ticari işlemlerde netlik sağlamaktadır. Alahly İslami Bank Şubesi: Tarafların haklarını korumak için çeşitli yasal mekanizmalar ve garantiler sunmaktadır. Detaylı yasal işlemlerle tüm tarafların haklarını korumayı hedeflemektedir. Bu sayede İslam şeriatı standartlarına uygun sözleşmelerle tarafların hakları güvence altına alınmaktadır."
