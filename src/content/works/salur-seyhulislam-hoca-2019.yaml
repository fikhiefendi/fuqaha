abstract: "Sâdeddin Efendi 1536-37 yılında Kanuni döneminde İstanbul'da dünyaya gelmiştir. Dedesi Yavuz Sultan Selim'in güvenini kazanarak“hâfız-ı mahsûs-ı sultanî”unvanını almış, babası ise Yavuz'un çok sevdiği“nedimi”olmuştur. Bu sayede iyi bir eğitim alan Sâdeddin Efendi, Şehzade Murad'ın hocalığına tayin edildikten sonra“hoca”ve“hoca efendi”olarak meşhur olmuştur. Daha sonra III. Murad'ın padişah olmasıyla“hâce-i sultanî”unvanını almıştır. Sâdeddin Efendi 1598'de şeyhülislam olup 1599'da vefat edinceye kadar bu görevi sürdürmüştür. İncelediğimiz mecmua ise Sâdeddin Efendi'nin şeyhülislamlık yaptığı dönemde verdiği fetvaların derlenmesiyle oluşturulmuştur. Mecmuanın müstensihi ve istinsah tarihi bilinmemektedir. Ayrıca mecmuanın tespit edebildiğimiz tek bir nüshası bulunmaktadır. Sâdeddin Efendi fetva verirken genel olarak tek bir görüşe dayanmış ve bu görüşün kime ait olduğunu belirtmemiştir. Bazen farklı görüşlere atıf yapmış ve bu görüşlerden birini tercih etmiştir. Bazen de herhangi bir tercihte bulunmadığı olmuştur. Birkaç meselede de cevabı hakimin tercihine bırakmıştır. Sâdeddin Efendi fetvalarında kaza usulüyle ilgili de bazı bilgiler vermiştir. Hakimin yargılama esnasında sultanın emirlerine uymak zorunda olduğunu ifade etmiştir. Bunun haricinde kendi takdir yetkisini kullanabileceğini, örfü dikkate alması gerektiğini söylemiş bazen de ihtiyatla fetva vermenin daha uygun olduğunu ifade etmiştir."
