abstract: "Ticari rekabetin yoğun olduğu modern ekonomik düzende firmalar, varlıklarını sürdürebilmek ve kârlılıklarını artırabilmek adına yeni stratejiler geliştirmektedir. Bu durum pazarlama alanında da görülmekte, geleneksel yöntemlerin tüketici kararlarını açıklamada yetersiz kaldığı tartışılmaktadır. Son yıllarda pazarlama disiplininde öne çıkan gelişmelerden biri, nörobilimsel araçların pazarlama araştırmalarına uygulanmasıdır. Nöropazarlama olarak adlandırılan bu alan gittikçe rağbet görmekte, ancak beraberinde birtakım etik sorun potansiyelleri gündeme gelmektedir. Öte yandan İslam iktisadına dayalı bir anlayış olarak gelişen İslami pazarlama da son dönemde dikkat çeken alternatif bir yaklaşım sunmaktadır. Tezde, modern ekonominin felsefi temelleri ve nöroekonominin gelişim süreci üzerinden disiplinler arası bir zemin kurulmuş; ardından nöropazarlamanın ortaya çıkışı ve etik tartışmalar ele alınmıştır. Sonrasında ise nöropazarlama tekniklerinin sunduğu imkânlarla birlikte manipülasyon potansiyeli incelenmekte ve İslami ilkeler çerçevesinde değerlendirilmektedir. Çalışma, niteliksel araştırma yaklaşımına dayalı olarak kavramsal ve karşılaştırmalı analiz yöntemlerini kullanmaktadır. Belgesel tarama yoluyla elde edilen veriler, eleştirel bir bakış açısıyla değerlendirilmiştir. Bu çerçevede elde edilen bulgular, nöropazarlamanın doğru ve şeffaf sınırlar içinde kullanıldığında pazarlama etkinliğini artırabileceğini, ancak etik sınırların ihlali halinde birey iradesini zayıflatma riski taşıdığını göstermektedir. Öte yandan değer merkezli yapısıyla İslami pazarlama, nöropazarlama yöntemlerinde manipülasyon ihtimaline karşı dengeleyici bir mekanizma sunmaktadır."
