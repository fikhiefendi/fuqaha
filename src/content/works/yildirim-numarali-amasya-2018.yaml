abstract: "Bu çalışmada 1642– 1644 yıllarına ait 4 Numaralı Amasya Şerʻiye Sicil Defteri'nin transkripsiyonu yapılmıştır. Defterdeki kayıtlar konularına göre sınıflandırılmış ve değerlendirilmiştir. Çalışma 3 bölümden oluşmaktadır. Giriş bölümünde Osmanlı'nın 17. Yüzyılın ilk yarısındaki siyasi, sosyal ve ekonomik yapısı, şehir tarihçiliği ve Amasya şer'iye sicilleri hakkında genel bilgiler verilmiştir. 1. Bölümde Osmanlı'da kadılık ve şer'iye sicilleri kısaca bilgilendirme yapılmıştır. 2. Bölümde 4 Numaralı Amasya Şer'iye Sicili defteri hakkında bilgiler yer alır. Bunun yanısıra sicildeki kayıtların tasnifi ve değerlendirilmesi yapılmıştır. 3. Bölümde ise transkripsiyon çalışması verilmiştir. Son olarak da genel değerlendirmenin yapıldığı sonuç kısmı ve kaynakça kısmı eklenmiştir. Transkripsiyon çalışmasının yapıldığı kısımda numaralandırma 1/1, 1/2, 1/3 şeklindedir. İlk rakam sayfanın numarasını ikinci rakam ise sayfada bulunan kayıt sırasının numarasını ifade etmekdir. Transkripsiyon kısmında okunamayan kelimelerinde“……”işareti konulmuştur. Transkripsiyon yapılırken emin olunamayan kelimeler“?”işareti ile defterde boşluk olan kısımlar ise“( )”işareti ile belirlenmiştir."
