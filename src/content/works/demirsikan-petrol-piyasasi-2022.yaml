abstract: "Çalışmanın amacı Körfez İşbirliği Konseyi üye ülkelerinin oluşturduğu Standard and Poor's Körfez İşbirliği Konseyi (S&P KİK) Kompozit Şeriat Endeksi ile petrol fiyatlarının birbirleri ile olan etkileşimlerini incelemektir. Araştırmada 01.09.2009-31.12.2021 zaman dilimini kapsayan günlük veriler kullanılmıştır. S&P KİK Kompozit Şeriat Endeksi ile petrol fiyatları arasındaki ilişkinin analiz edilebilmesi için öncelikle durağanlık testleri yapılmıştır. Serilerin durağanlıklarının tespitinde Genişletilmiş Dickey-Fuller (ADF) birim kök testi, Zivot-Andrews Kırılmalı Birim Kök Testi uygulanmış ve seriler I(1) seviyesinde durağan hale gelmişlerdir. Ardından Hatemi-J Asimetrik Nedensellik Analizi ile değişkenler arasındaki pozitif ve negatif şokların nedenselliği araştırılmıştır. Hatemi-J Asimetrik Nedensellik Analizi sonucunda değişkenlerin birbirlerine herhangi bir etkisinin bulunmadığı sonucuna ulaşılmıştır."
