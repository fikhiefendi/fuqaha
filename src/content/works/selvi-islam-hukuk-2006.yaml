abstract: "İslâm hukukunu doğru anlayabilmek için bu hukukunun kaynaklarıylametodolojisini yani fıkıh usÃ»lünü iyi bilmek gerekir. Fıkıh usÃ»lünün konusu, şer'ûdelillerle sabit olan şer'û hükümlerdir. Kitap, Sünnet, icma ve kıyas fıkıh usÃ»lününasli delilerindendir. Kıyas, kendine özgü unsurları ve şartları bulunan bir işlemdir.?Ta'lil? son derece önemli bir kavramdır. Böylece hem nassların yorumlanması hemde kıyas yoluyla yeni çözümlere ulaşılmış olur. slam hukukunda bu konuya bukonuya özel bir önem atfedilmiştir.Araştırmamız, bir giriş ve iki bölümden oluşmaktadır. Giriş bölümündearaştırmanın amacı, önemi ve araştırmada izlenen yöntemden bahsedilmiştir.Birinci bölümde illet kavramı ele alınmış, bu bağlamda illetin tanımı, tarihselarka planı, çeşitleri, şartları ve illetle yakınlık arzeden ıstılahlar üzerindedurulmuştur.kinci bölüm, tezin omurgasını oluşturmaktadır. Bu bölümde ta'lil problemiele alınmış, önce nasslar, gerekçeleri akılla kavranılabilen ve kavranılamayanşeklinde bir tasnife tabi tutulmuş, daha sonra illeti belirleme yöntemleri olan nass,icma ve istinbat detaylı olarak ele alınmıştır."
