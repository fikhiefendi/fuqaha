abstract: "Çalışmamızda X./XVI. asırda Mısır'da yaşayan, fıkıh çevresinde adından söz ettiren, birçok eseri bulunan, önemli bir usûl anlayışına sahip olan ancak hakkında ilmi açıdan teferruatlı bir akademik çalışma bulunmayan Şihâbuddîn er-Remlî'nin ilim dünyasına tanıtılmaya ve usulle ilgili görüşleri tespit edilmeye çalışılmıştır. Remlî, Mısır'da dünyaya gelmiş ve orada vefat etmiştir. İlkin Memlüklere bağlı, sonrasında Osmanlı hâkimiyetine giren Mısır'da yaşamıştır. Dönemin önemli âlimlerinden eğitim almış, verdiği dersler ve yazdığı eserlerle günümüze kadar adından bahsedilen bir şahsiyettir. Remlî, gerek eserleriyle gerekse öğrencileriyle hem kendi asrında hem de kendisinden sonraki asırlarda adından söz ettirmiş bir şahsiyettir. Çalışmamızda hem furu' hem de usûl alanında etkili olan bu âlimin hayatı, ilmi kişiliği ve kendi mezhebindeki konumuyla birlikte usûlu'l-fıkh sahâsındaki görüşleri ve değerlendirmeleri araştırma konusu yapılmıştır. Remlî'nin usule dair görüşlerini ortaya koyarken kendisine ait görüşler başta olmak üzere diğer usul âlimleri ile ittifak ettiği ya da ihtilaf ettiği konulara, usûlde getirdiği yeniliklere ve belirli konularda usul âlimlerine getirdiği eleştirilere değinilmiştir."
