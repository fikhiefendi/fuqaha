abstract: "Bu araştırmanın amacı gözden geçirmek ve risk yönetimi yatırım perspektifinden İslami bankalar tarafından sağlanan kapsamlı bir şekilde Bittamleek sona kiralama ürününü analiz etmektir. Odaklı araştırmalar böylece ilk görüntüler İslami bankalarda yatırım ve mekanizmalara İslami bankalar ve finansman mekanizmalarının kısa bir özetini ve ardından bir sunum, Bittamleek ve kontroller sona eren kira detaylı yorum. Ardından kira sözleşmesinin ekonomik faydaları Muntahia Bittamleek. Bu araştırma mevcut Ijara uygulamalarının ortaya çıkardığı çeşitli konularda ve zorluklarla ilgili eleştirel bir bakış açısı sağlamaktadır. Ijarah Muntahia Bittamleek hakkındaki Fiq Konseylerinin bazı kararlarının yanı sıra. Son olarak, hukuk perspektifinden amaçlarından olup olmadığı yorumu kira mevcut uygulama Bittamleek ihlal veya ilkelerini destekleyen sona erdi. Makale bir dizi sonuç ve tavsiyeyle sona eriyor."
