abstract: "Bu çalışma, 18. yüzyıl Osmanlı toplumunda kadın kölelerin haklarını, sorumluluklarını, sosyal konumlarını ve karşılaştıkları problemleri İstanbul kadı sicilleri, şeyhülislam fetvaları ve kanunnamelerden hareketle fıkhi bir bakış açısıyla incelemektedir. Araştırma, Osmanlı toplumunda önemli bir yere sahip olan kölelik ve özellikle cariyelikle ilgili uygulamaların hukuki arka planını ortaya koymak amacıyla, kadı sicillerinde yer alan kadın kölelere dair davaları tematik olarak tasnif etmekte ve bu konuları fetvalar ve kanunnamelerdeki hükümler ile Hanefi fıkıh literatüründeki teorik bilgilerle karşılaştırmalı olarak ele almaktadır. Bu çerçevede İstanbul kadı sicilleri, şehirdeki köle nüfusunun yoğunluğu, dava sayısı ve çeşitliliğinin fazlalığı ile toplumun farklı kesimlerinden örnekler içermesi bakımından büyük önem taşımaktadır. Bu çalışma, kadı sicilleri, şeyhülislam fetvaları, kanunnameler ve fıkıh literatürüne dayalı analizlerle, fıkıh kitaplarındaki teorik hükümler ile Osmanlı'daki uygulamaların ne ölçüde örtüştüğünü ortaya koymayı ve görülen farklılıkların arkasındaki toplumsal ve hukuki nedenleri açıklamayı amaçlamaktadır."
