abstract: "Takdim ettiğimiz bu usul araştırması, kültürel ve ilmî (bilgisel) durumun dikte ettiği şeylere cevap niteliğinde hazırlanmıştır. Şöyle ki; çeşitli alanlarda araştırma yapanların, içerisinde yaşamış oldukları bilgisel alandaki değişimi takip etmeleri gerekmektedir. Usul literatürünü oluşturan kaynaklar, onları yazanların içinde yaşamış oldukları telif ve tedvin döneminin verilerine göre yazılmışlardır. Çünkü geçmişte yaşayanların bize bıraktıkları bilimsel mirasla bu çağın dinamikleri haline gelen modern yöntemlerin günümüze hizmet etmek için etkileşimli bir fikri etkinlik içerisinde olmaları gerekir. Araştırmamız, usul-i fıkhın temelini oluşturan cüz'i meselelerin en önemlilerini teoriler şeklinde formüle etmeyi amaçlamıştır. Bu yapılırken bahsi geçen konulara dikkat çekerek bunların arkasındaki anlamlara ulaşmak ve cüz'i meseleleri kapsayan usul teorisine hizmet eden mânaları açığa çıkarmak amaçlanmıştır. Araştırmaya, şer'î hükümlerin ispatı için kullanılan yönteme meşruiyet kazandırmaya özen gösteren \"hücciyet\" teorisi ile başlanmış, hücciyet teorisi mucibince şer'î hükümleri ispatlayana ulaşmak anlamına gelen \"sübut\" teorisiyle devam edilmiştir. İlerleyen sayfalarda, zahir (delalet) ve mefhum (makâsıd) şeklinde iki bölüme ayrılan \"anlama\" teorisine değinilmiştir ki bu teori, muteber bir şekilde bize ulaştığı sabit olan delillerden şer'î hüküm çıkarma yöntemini temsil eder. Bu yöntemin şer'î hükümleri ispatlamak için güvenilir ve geçerli olduğu anlaşıldıktan sonra, nass olmamasına rağmen şer'î hükme ulaşmayı sağlayan \"ilhak\" teorisine ulaşılmıştır. Bu teori, usuli ilhak teorisini temsil etmektedir. Son olarak, araştırmamız önceki aşamaların pratik sonucuyla (istısmar teorisi) ve usul-i fıkhın uygulanmasıyla elde edilen sonuçların açıklamasıyla bitmektedir."
