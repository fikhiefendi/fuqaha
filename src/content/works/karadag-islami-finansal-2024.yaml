abstract: "Son 50 yıl, İslam dünyasının hem içinde hem de dışında faaliyet gösteren İslami finans kuruluşlarının ortaya çıkışına ve hızla gelişmesine tanıklık etmiştir. İslami finans kuruluşları artık sadece İslam ülkeleri ile sınırlı kalmayıp İngiltere, ABD gibi Batı ülkelerinde de faaliyet göstermekte ve İslami finansal araçlar yaygın olarak kullanılmaktadır. İslami finansal araçların verimliliğinin ve etkinliğinin sağlanabilmesi için, İslami finansal araçların dünya çapında hızlı gelişmesine destek olacak düzenlemelerin ve denetim mekanizmalarının oluşturulmasa gerekmektedir. Yapılacak düzenlemelerden biri de İslami finansal araçlara ilişkin muhasebe/finansal raporlama standartlarının oluşturulmasıdır. Bu amaçla dünya genelinde İslami Finansal Kurumlar için Muhasebe ve Denetleme Örgütü (AAOFI), Malezya Muhasebe Standartları Kurulu (MASB), İslami Finansal Hizmetler Kurulu (IFSB) ve Uluslararası İslami Finans Piyasası (IIFM) gibi kurumlar görev yapmaktadır. Malezya Muhasebe Standartları Kurulu (MASB) gibi bazı standart düzenleyicileri, İslami finansal işlemlerde İslam hukuku ile Uluslararası Finansal Raporlama Standartları (UFRS) arasında uygulamada bir karmaşa olmadığını bildirmişse de, İslami muhasebe/finansal raporlama standart düzenleyici kurumlardan en çok kabul göreni olan AAOFI, bu araçların muhasebe/finansal raporlama uygulamasında bütün UFRS yöntemlerinin uygulanamayacağını bildirmiş ve belirli işlemler için alternatif muhasebe standartlarını geliştirmişlerdir. AAOIFI, 1990 yılında İslami finans kuruluşlarının finansal raporlarını İslam hukuku gerekliliklerine uygun hale getirmek için bağımsız bir kuruluş olarak kurulmuştur. İslam hukuku, muhasebe ve kontrol etik kurulu olmak üzere 3 teknik kuruldan oluşan AAOIFI, 59 şer'i standart, 36 muhasebe standardı, 8 denetim standardı, 15 yönetişim standardı ve 1 etik standardı olmak üzere 5 alanda toplam 119 standart yayınlamıştır. Bu çalışmada, İslami finansal araçlar için AAOIFI tarafından İslami kurallara uygun olarak oluşturulan muhasebe standartları ile bu araçların UFRS'na göre muhasebeleştirme ve raporlanmasında kullanılacak UMS/UFRS karşılaştırılarak, farklılık ve benzerlikler ortaya konulacak, daha sonra UFRS kapsamında İslami kurallara uygun olarak muhasebe/raporlamayı mümkün kılacak düzenlemelere ilişkin bir öneri sunulması amaçlanmaktadır. UFRS'nda yapılacak böyle bir düzenleme bu standartların İslami finansal araçlar için de kullanılabilir olmasını mümkün kılacaktır. Bu durum, UFRS'nın oluşturulma amacına da hizmet edecektir."
