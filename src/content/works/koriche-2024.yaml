abstract: "Bu tez, Zekat Fonu'nun Cezayir'de sosyal finansmanın uygulanmasına yönelik stratejisini incelemeyi amaçlamaktadır. İslami sosyal finansman yöntemlerinden yararlanma eğiliminde olan küçük ve mikro işletmelerin finansmanında Zekat Fonu'nun rolünü incelemekte ve analiz etmektedir. Bu genellikle Riba'ya (tefecilik ve faiz) dayalı geleneksel banka finansmanından kaçınmak, yoksulluğu azaltmak ve toplumda sosyal adaleti sağlamak için yapılır. Araştırma, bu çalışmanın hedeflerine ulaşmak için, konunun teorik arka planı olarak adlandırılabilecek mevcut bilimsel materyallerden (kitaplar, hakemli araştırmalar, üniversite tezleri) çıkarım yapan tümevarımsal-tümdengelimli yaklaşım dahil olmak üzere birçok yaklaşım kullanır ve konunun unsurlarının ve özel kavramların tanımlanıp analiz edildiği betimleyici-analitik yaklaşım. Çalışma aynı zamanda Cezayir'deki Zekat Fonu'ndan elde edilen ikincil verilerin tablo ve grafiksel analizini kullanan istatistiksel bir yaklaşımı da takip ediyor. Çalışma, Cezayir'deki Zekat Fonu'nun, çok sayıda genç ve kadın için iş fırsatları yaratan ve sosyal adaletin ve ekonomik koşulların sağlanmasına katkıda bulunan ekonomik kurumların kurulmasına katkıda bulunan küçük ve mikro işletmeleri finanse etmeye yönelik bir strateji izlediği sonucuna varıyor. gelişim. Çalışma, Zekat Fonu'nun rolünü daha da etkinleştirmek ve faaliyetlerini Cezayir ulusunun her alanında genişletmek için gayretli çalışmanın sürdürülmesini tavsiye ediyor."
