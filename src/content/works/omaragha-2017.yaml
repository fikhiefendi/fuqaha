abstract: "Makasıd Kurallarının Aile Hukukunun İnşasında Rolü -Nikah ve Boşama Örneği- başlıklı bu araştırma, makasıd-ı şeria özellikle aile hukuku evlenme ve boşanma alanında konuyla ilgili birçok sonuca ve gerçekliğe ışık tutmaktadır. Bu araştırmayı üç kısma ayırdım. Birinci bölümde araştırmada kullanılan temel kavramlar, makasıd ve ilişlkili kavramlar sözlük-terim açısından ele alnımış, bundan sonra makasıdla ilgili ayrıntıları, makasıdın kısımları, önemi ve benzeri makasıda giriş mahiyetindeki konular ele alınmıştır. Bu akpsamda“makasıd kuralları”tamlaması, ahval-i şahsiye kavramı, evlenme ve boşanma gibi kavramların analizi yapılmıştır. İkinci bölümde yalnızca evlenme kavramı ele alınmış ve makasıd kurallarının evlenme konusundaki hükümlerin üretilmesindeki rolü ele alınmıştır. Bu çerçevede makasıd kuralları; ahlak kuralları türünden genel makasıd kuralları türünden çeşitli kısımlara ayrılmış, makasıd kurallarının evlenmeyi teşvik etmesi ele alınmıştır. Makasıdın zaruriyat, haciyat ve tahsiniyat kısımları ele alınmış ve evlilik sözleşmesi üzerindeki etkileri, nikah sözleşmesinde haciyat açısından veli, iki şahit, mehir ve nafaka konuları ele alınmış, bain talaktan sonra önceki kadını helal kılmak üzere sembolik nikah kıyma hilesinin geçersiz olduğu, boşama niyetiyle evlenmenin hükmü, evlilik sözleşmesinde ilan şartı açıklanmıştır. Üçüncü bölüm ise boşamaya tahsis edilmiş, makasıd kurallarının boşama üzerindeki etkileri ele alınmıştır. Bu çerçevede boşama esnasında niyet ve niyetin rolü, boşamanın hükmü, boşamada asıl olanın yasaklık veya serbestlik olduğu, boşamanın türleri olarak küçük bain boşama, büyük bain boşama, dönüşlü boşama, haram ve mekruh boşama türleri, üç talakla birden boşama konuları ve boşamayla ilgili digger hususlar ele alınmıştır."
