abstract: "Bu çalışmada erken dönem fıkıhçılardan Ebû Bekr b. Ebî Şeybe'nin (v. 235/849) fıkhî görüşleri incelenmiştir. Küfe, Basra, Rey, Bağdat ve Hicaz bölgesindeki ilim merkezlerinde tahsilini sürdüren İbn Ebî Şeybe, Abdullah b. Mübârek, Halef b. Halîfe, Cerîr b. Abdülhamîd ve Kadı Şerîk b. Abdullah gibi muhaddislerden hadis eğitimi almıştır. Dönemin seçkin âlimlerinden eğitim alan İbn Ebû Şeybe, Buhârî, Müslim, Ebû Dâvûd, İbn Mâce ve İbn Sa'd gibi seçkin talebeler yetiştirmiştir. Hadis ilminin yanı sıra fıkıhta da önemli bir yere sahip olan müellif, el-Musannef adlı hadis eserini kaleme almıştır. İbn Ebû Şeybe'nin fıkhî görüşlerinin ele alındığı bu çalışma, üç bölüm ve sonuç kısmından oluşmaktadır. Birinci bölüm İbn Ebû Şeybe'nin kısa biyografisini içermektedir. Bu çerçevede adı, nesebi, doğumu, vefatı, hocaları, öğrencileri, eserleri ve ilim camiasının onun hakkındaki düşüncelerine dair bilgilere yer verilmiştir. İkinci bölümde müellifin ibadet konularını ihtiva eden bazı fıkhî görüşlerine yer verilmiştir. Kendi içerisinde iki tali kısma ayrılan bölümün birinci kısmında yeni doğan bebeğin idrarı konusundaki görüşleri, ikinci kısımda ise sarık üstüne mesh, ezanda tercî' gibi namaz ile ilgili konular irdelenmiştir. Üçüncü bölümde ise müellifin ahvâl-i şahsiye ile ilgili görüşlerine yer verilmiştir. Bu bölümde muhallilin nikahı, kadının eşine hizmeti ve velisiz nikahın hükmü konuları ele alınmıştır. Araştırma sonucunda müellifin, sahip olduğu ilmî konumu ile hem halk hem de yöneticiler nezdinde saygın bir yer edindiği, Buhârî, Müslim ve Ahmed b. Hanbel gibi önemli öğrenciler yetiştirdiği, muhaddis olmakla beraber nakledici olmakla yetinmediği, fıkıh ve tefsirde de derin bilgiye sahip olduğu, fıkıhta aykırı ve şâz görüşlerinin bulunmadığı, fıkhî görüşleri cumhurun veya birçok âlimin görüşüyle uyuştuğu ortaya konulmuştur. Son olarak da alanda araştırma yapacaklar için öneriler kısmında klasik dönem ilim insanlarının ve görüşlerinin araştırılması ve alanda yeterli araştırma yapılmadan herhangi bir konu hakkında fetva verilmemesinin gerektiği hususları zikredilmiştir."
