abstract: "Modern dönem“İslamî Yenileşme”hareketleri, genellikle Osmanlı, Mısır ve Hint/Pakistan alt-kıtasındaki oluşumlarla bahse konu yapılır. Bu oluşumlardan büyük ölçüde etkilenmekle beraber, kendine özgü yanlarıyla da dikkat çeken İdil-Ural Bölgesi yenilikçiliği, zaman ve zemini itibari ile farklı pratiklere tanıklık etmiştir. Bu çalışmada XIX. yüzyıldaki dinî düşüncelerin yeniden gözden geçirilmesi şeklinde başlayan İdil-Ural Tatar reform hareketine değinilecek ve bu hareketi savunmakla temayüz etmiş olan aydınlardan Rızaeddin b. Fahreddin incelenecektir. Araştırmamız giriş, üç bölüm ve sonuçtan oluşmaktadır. Birinci bölümde; İdil-Ural Müslümanları ve tarihi süreç ele alınacak, Müslümanların genel ve dinî durumlarına temas edilecek, özellikle Rızaeddin b. Fahreddin'in yaşadığı dönemde entelektüel çevreyle olan ilişkisine ve dönemin bazı meşhur aydınlarına yer verilecektir. İkinci bölümde; Rızaeddin b. Fahreddin'in hayatı, bazı önemli faaliyetleri ve ilmî kişiliği, sonrasında tespit edebildiğimiz kadarıyla fıkıh, kelam, tarih, biyografi ve eğitim gibi birçok alana dair yazdığı eserlerinden bahsedilecektir. Üçüncü bölümde; Rızaeddin b. Fahreddin'in usul ve füru'a ait bazı görüşlerine yer verilecek, bununla beraber bu görüşlerin Rusya Müslümanları özelinde sahadaki fıkhî pratiklerine değinilecektir. Sonuç kısmında ise yapmış olduğumuz çalışmadan elde edilen neticeler ifade edilecektir."
