abstract: "Bu araştırma, Yahudi inancını ve Yahudi inancında var olan tartışma ve çelişkileri ele almaktadır. Araştırmamız, sav ve görüşlerini temel Yahudi kaynakları olan Tevrat ve diğer kutsal metinlerini esas alarak açıklamaya çabalamış, Yahudi inancına dair tarafımızca önemli bulunan şu dört konu hakkında değerlendirme ve saptamalar yapmıştır: Ulûhiyet, Nübüvvet, Melekler, Ahiret Günü. Araştırmamız, yukarıda bahsedilen inanç konularına ilişkin öncelikle Tevrat metinlerinden İslam açısından veya tarihi olarak doğru olarak nitelendirilebilecek kesitlere yer vermiş daha sonra yine Tevrat'tan olan ancak ilk alıntılarla çelişkili başka parçalar sunmuştur. Bahsedilenlere ek olarak Tevrat ve Yahudilerce inkârı mümkün olmayan diğer kitaplarda yer aldığı belirtilen çelişkiler hakkında Yahudi bilginler tarafından ortaya konan tutumlar, gerekçelendirmeler ve açıklamalara değinmiştir. Ayrıca ilgili her inanç konusuna dair İslami görüşleri ifade etmiştir. Böylelikle tarafımızca karşılaştırmalı bir araştırma ortaya konmaya çalışılmış, farklı temelli yönelimlerden etkilenmeden salt bilimsel bir araştırma meydana getirilmeye gayret edilmiştir. Tezimiz; ön söz, giriş, beş bağımsız bölüm ve sonuçtan oluşmaktadır. Her bağımsız bölüm kendi içinde çeşitli alt başlıklara değinmektedir. Giriş bölümü, kitabın açılım merkezi olarak Yahudilerin din ve kimliklerini özet bir şekilde anlatmaktadır.“Tarih Boyunca Yahudilerin Durumu”ve“Tevrat'ın Yahudilere Göre Değeri ve Yahudi Bilginlerin Tevrat'a Yönelik Tutumları”, giriş bölümünün ele aldığı alt başlıklardır. Birinci bölüm, kitabın başlığını sözlük ve terminolojik anlamlarıyla incelemektedir. Ayrıca başlıkla ilgili ve önemli görülen diğer kavramlar hakkında bilgi sunmaktadır. Bu bölümde dört alt başlık yer almaktadır. İkinci bölüm, Yahudilik'te ulûhiyet anlayışına ilişkin konuları ve çelişkileri işlemektedir. İkinci bölümde üç konu ele alınmaktadır:“İlahi Sıfatlar Hakkında Çelişki ve Tartışmalar”,“Teşbih ve Tecsimle İlgili Çelişki ve Tartışmalar”,“Tanrı'nın Ödül ve Cezası ve Tanrı'nın Mekânı Hakkında Çelişki ve Tartışmalar”. Üçüncü bölüm ise Yahudi inancında Peygamberlik etrafındaki çelişki ve tartışmaları ele almaktadır.“Yahudi İnancına Göre Peygamberlik Kavramı”,“Yahudi Şeriatına Göre Vahiy Alma”, Yahudi Yazılı Kaynaklarına Göre Peygamberlerin Özellikleri“ adlarını taşıyan üç farklı konuyu tartışmaktadır. Dördüncü bölüm, melek kavramı hakkında Yahudilerde mevcut olan çelişki ve tartışmaları incelemektedir. İlgili bölüm, sırasıyla Yahudi Şeriatı'nda meleklerin mahiyetini, Yahudilere göre en önemli melek isim ve gruplarını ve Yahudi kutsal metinlerinde meleklerin görevlerini başlıklar halinde araştırmaktadır. Beşinci bölümde ise tarafımızca Yahudilerin ahiret gününe ilişkin farklı yorumlarından bahsedilerek Yahudi kutsal kitaplarına göre ahiret günü konusu işlenmekte ve Yahudiliğin Cennet ve Cehennem öğelerine bakışı masaya yatırılmaktadır. Beşinci bölümü takip eden araştırmamızın sonuç kısmı, şahsımın ulaştığı kanaatlerden önemli bazı hususları dile getirmemden ve çeşitli tavsiyeleri ifade etmemden ibarettir. İlgili kesiti izleyen sayfalarda ise kaynakça ve ona ek olarak hazırlanan fihristler yer almaktadır. Araştırmada atıf yapılan Yahudi kaynakları ve İslami eserlerin sayısunn48 ulaştığı tespit edilmiştir. Araştırmamız, kaynakça ve fihristlerle birlikte 280 sayfadır Bu araştırma, ”er-Risale el-Alemiyye\" adlı yayınevi tarafından zonda Lübnan'ın başkenti Beyrut'ta bütün bir kitap olarak yayınlanmıştır."
