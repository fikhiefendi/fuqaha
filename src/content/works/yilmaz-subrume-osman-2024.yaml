abstract: "Hz. Peygamber'in vefatından sonra Kur'an ve sünneti anlama ve hayata aktarma görevini üstlenen sahâbîlerden bazıları gittikleri yerlerde insanların problemlerine hem çözüm üretmişler hem de dini kendilerinden sonraki nesillere aktarılması için öğrenci yetiştirmişlerdir. Ancak nassın anlaşılma yöntemi, rivayete ulaşma, haberin tercih kriterleri gibi gerekçeler farklı yorumlara bu durum da ekolleşmeye götürmüştür. Hicri 2. asır müçtehitleri arasında yer alan ve araştırma konumuzu oluşturan İbn Şübrüme ve Osman el-Bettî, her ne kadar dört mezhep imamı döneminde yaşasalar da isimleri kaynaklarda müntesibi olmayan mezhep imamları olarak anılıp tarih sayfaları arasında kalmışlardır. Buna rağmen ortaya çıkan bazı meselelerin çözümünde sözü edilen müçtehitler ve benzerlerinin görüşlerinden istifade etme ihtiyacı ortaya çıkmıştır. Nitekim araştırmamıza konu olan fakihlerin kimi görüşlerinin 19. yüzyılda hazırlanan Mecelle-i Ahkâm-ı Adliyye'ye alınmış olması bizi müstakil eserleri olmayan söz konusu fukahânın dağınık halde bulunan görüşlerini derlemeye ve yeri geldiğinde görüşlerinin çözüm olarak sunulabileceği düşüncesiyle araştırmaya sevk etmiştir. Bu anlamda Ebû Hanife ile aynı devirde yaşamış İbn Şübrüme ve Osman el-Bettî'nin fıkıh ilmindeki yeri tespit edilmeye çalışılmıştır.“İbn Şübrüme ve Osman el-Bettî'nin usul anlayışları ve içtihatlarının mukayesesi”adlı tezimizin ilk bölümünde İbn Şübrüme ve Osman el-Bettî'nin yaşadıkları dönem, hayatları, ilmî kişilikleri, hocaları ve öğrencileri; ikinci bölümünde İbn Şübrüme ve Osman el-Bettî'nin usul anlayışları ve üçüncü bölümde ise İbn Şübrüme ve Osman el-Bettî'nin tespit edebildiğimiz içtihatları ayrıntılı bir şekilde verildikten sonra bunların mukayesesi yapılmıştır."
