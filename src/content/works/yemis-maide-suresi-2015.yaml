abstract: "Mâide Sûresi 27-34. Âyetler Tefsiri Bağlamında Hâbil-Kâbil Kıssası, Makâsıd-ı Şerîa Ve Hirâbe Suçu\" ile ilgili bu çalışma bir giriş, dört bölüm ve sonuç kısmından meydana gelmektedir. Giriş kısmında konunun önemi, araştırmanın amacı, metodu, sınırlandırılması ve kullanılan kaynakların değerlendirilmesi hakkında genel bilgiler verilmiştir. Birinci bölümde sûrenin isimlendirilmesi, nüzûl zamanı ve yeri, âyetlerinin sayısı, mushaftaki sırası, Nisâ sûresiyle münasebeti yani Mâide sûresinin genel özellikleri hakkında bilgi verilmiştir. İkinci bölümde hâbil-kâbil ve kıssa kelimelerinin tanımları verilmiştir. Kur'ân kıssalarında tarihselcilik, hâbil-kâbil kıssasının Tevrat'ta ve tefsîr kitaplarında geçtiği versiyonu hakkında bilgi verilmiştir. Makâsıd-ı Şerîa başlığı altında ise Makâsıd-ı Şerîa ve zarûriyyat kelimelerinin tanımları verilmiştir. Beş temel zarûriyyat olan canın, dinin, aklın, neslin ve malın korunması üzerinde durulup başka zarûriyyatlarda ilave edilmiştir. Son bölümde ise hirâbe suçu ve cezası işlenmiştir."
