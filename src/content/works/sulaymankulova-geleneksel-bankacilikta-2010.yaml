abstract: "Son 10 yıldan beri ortaya çıkan siyasal ve finansal istikrarsızlıklar, Kırgızistan‟a dıĢarıdan gelen yatırımların sayısını azaltmıĢtır. Bazı finansçıların düĢüncelerine göre Ġslam ilkelerine göre finansman ve bankacılık, Kırgızistan için daha iyi alternatiftir. Ġslam ilkelerine göre çalıĢan bankalar katlandığı riske faiz almak yerine müĢteri ile ortak Ģeklinde geliri bölüĢmektedir, bu nedenle böyle bir bankacılığın çalıĢtığı Ġslam ülkeleri kapitalist sistemlerle kıyasla krizden daha az etkilenmiĢtir. Bildiğimiz gibi Ġslam ülkelerinde dinin ekonomik hayattaki rolü büyüktür, özellikle faiz ekleyerek ödünç vermek günah sayılır. Dolayısıyla bu ülkeler kendi bankacılık sistemin Ġslam‟a uygun Ģekilde keĢfedmiĢlerdir. Fakat, çeĢitli din temsilcilerinin yaĢadığı Kırgızistan‟ın dünyevi alt yapısı ve ateistlik Sovyet tarihi Ġslamı ekonomik hayatta etkin yapmamaktadır. Diğer yandan son zamanlar Orta Asya‟da Ġslam yeniden doğarak coğrafi Ġslami yatırımlara cazip görünmektedir. Bu Ģartlarda, Ġslam ilkelerine göre finansman alternatiflerinin Kırgızistan‟ın geleneksel finansal sisteminde nasıl uygulandığının araĢtırılması ilgili çalıĢmanın amacı olmuĢtur. Bu çalıĢma, giriĢ ve sonuç dıĢında üç bölümden ibarettir. Birinçi bölüm, geleneksel konvansyonel bankacılık hakkında olup, ikincisi, Ġslam bankacılık ile ilgili genel bilgileri içermektedir. Üçüncü bölüm ise Kırgızistan Ģartında Ġslam ilkelerine göre finansmanın geleneksel bankacılıkta nasıl uygulandığını açığa çıkarmakta ve kapitalist ekonomilerde Ġslami finansal organizasyonarın kurulması için önerileri ortaya koymaktadır."
