abstract: "İSLAMİ FİNANS PİYASALARINDA BİRLEŞME AMAÇLI ORTAKLIKLAR: ELEŞTİREL HUKUKİ VE FIKHİ BİR ARAŞTIRMA Merve TEMİMOĞLU Doktora, İslam İktisadı ve Hukuku Tez Danışmanı: Prof. Dr. Heytem HAZNE Aralık, 2025 – 331 + v Sayfa Bu çalışma, Özel Amaçlı Birleşme Şirketleri'nin (SPAC) çeşitli uluslararası hukuk sistemlerinde uygulanan düzenleyici çerçevelerini analiz etmeyi ve bunları İslâm hukukunun bakış açısıyla karşılaştırmayı amaçlamaktadır. Çalışmanın temel hedefi, İslâmî finans piyasalarında SPAC yapıları için özel bir düzenleyici çerçevenin geliştirilmesine duyulan ihtiyacı belirlemektir. Araştırma, Amerika Birleşik Devletleri, Hong Kong, Singapur, Malezya, Birleşik Arap Emirlikleri ve Kanada'da uygulanan mevzuatın hukukî ve fıkhî analizini bir araya getiren karşılaştırmalı bir yöntem benimsemiştir. Çalışmada SPAC'lerin ortaya çıkışı ve gelişimi, sermaye yapısı, işleyiş mekanizmaları, sulandırma (dilution) ve teşviklere ilişkin sorunlar ele alınmış; incelenen ülkelerdeki düzenleyici hükümler karşılaştırılarak bunların şeriatın temel amaçları olan malın korunması, aşırı belirsizliğin (garar) azaltılması ve adaletin sağlanması ile uyumu değerlendirilmiştir. Ayrıca SPAC işlemlerinin yapısında yer alan temel şer'î aykırılıklar tespit edilmiş ve sonuç ile karşılığın belirli olması ve sponsora masrafların yüklenmesi şartıyla sponsor-yatırımcı ilişkisinin Câ'le Akdi (Ju'ālah) çerçevesinde değerlendirilebileceği ortaya konmuştur. Bulgular, geleneksel düzenleyici çerçevelerin-usulî faydalarına rağmen-şer'î açıdan uyumlu bir SPAC oluşturmak için yeterli olmadığını göstermektedir; zira bu çerçeveler aykırılık unsurlarını düzenlemekle birlikte ortadan kaldırmamaktadır. Bu nedenle çalışma, teşvik uyumu, adil fiyatlama, sermayenin korunması, sulandırmanın tamamen bertaraf edilmesi ve bağımsız şer'î denetimi esas alan bütüncül ve şer'î uyumlu bir düzenleyici model önermektedir. Çalışma ayrıca, SPAC yapıları için özel fıkhî ve muhasebe standartlarının geliştirilmesini, İslâmî finans kurumlarının pilot İslâmî SPAC modelleri oluşturmasını, araştırmacıların piyasa uygulamalarına yönelik nicel ve fıkhî değerlendirmeler yapmasını ve yatırımcıların şer'î uyumu ve teşvik şeffaflığını titizlikle incelemesini önermektedir."
