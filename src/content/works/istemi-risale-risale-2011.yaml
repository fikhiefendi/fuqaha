abstract: "Bu çalışmada İmam Şafii'nin er-Risale adlı eseri ve bu eserde kullandığı hadis kavramları ele alındı. Bu çalışma üç bölümden meydana gelmektedir. Giriş bölümünde araştırmanın konusu, sınırları, amaç ve metotları ile ilgili genel bir bilgi verilmiştir. Birinci bölümde İmam Şafii'nin hayatı, yaşadığı dönemin genel özellikleri ve er-Risale'nin şekil ve muhteva yönünden tanıtımı yapılmıştır. ikinci ve üçüncü bölümde ise İmam Şafii'nin er-Risale'de kullandığı hadis ıstılahları ele alındı. İmam Şafii'nin er-Risale'de kullandığı hadis ıstılahları, kedisinden sonra gelen hadis alimlerinin kulllandığı ıstılahlarla mukayesesi yapılarak incelendi. Özellikle İmam Şafii'nin bu ıstılahları nasıl kullandığını, kendisinden sonraki alimlerin kullandığı ıstılahlarla hangi yönlerden farklı olduğunu tespit etmeye çalıştık."
