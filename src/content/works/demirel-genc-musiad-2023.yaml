abstract: "Türkiye'de yüksek nüfuza sahip iş insanı oluşumlarından biri kabul edilen MÜSİAD'ın ekonomik hayattaki yansımaları göz ardı edilemez. Erdem, yüksek ahlak ve güven temelinde tesis edilen ve yükselen bir iş hayatı tasavvuruna sahip olan MÜSİAD'ın bir uzantısı olan Genç MÜSİAD üyelerinin, bu tasavvuru günlük hayatlarında ve iş yaşantılarında nasıl uyguladıkları incelenmeye değer bir konudur. Bu bağlamda“Genç MÜSİAD Üyelerinin Günlük ve İş Hayatı Tasavvurları”bu çalışmaya katılan üyelerin ifadelerinden yola çıkılarak eylem ve söylemlerinde aranmıştır. Çalışma kapsamında doxa kavramları ve Bourdieu'nun alan teorisi ile kavramsal bir çerçeve sunulmaktadır. Buna dayanarak Genç MÜSİAD üyelerinin günlük ve iş hayatında benimsedikleri prensipler ve izledikleri yol belirlenmektedir. Bu çalışma sonucunda Genç MÜSİAD üyelerinin günlük ve iş hayatlarındaki benzerlik ve farklılıklara ulaşılmaktadır."
