abstract: "Bu çalışmada, İmam Şâfiî'nin aslî deliller bağlamında Irak ekolüne yönelttiği eleştirilerin usûlî temelleri konu edinilmiştir. Çalışmamız giriş, dört bölüm ve sonuçtan oluşmaktadır. Giriş bölümünde; çalışmanın konusu ve sınırlandırılması, amacı ve önemi, yöntemi, temel kaynakları ile araştırma konusu üzerine yapılmış olan çalışmalar incelenmiştir. Birinci bölümde İmam Şâfiî'nin Kitâb ve lafız-mana çerçevesinde Irak ekolüne yönelttiği eleştiriler, ikinci bölümde Sünnet, üçüncü bölümde icmâ, dördüncü bölümde ise kıyas delili bağlamında yaptığı eleştiriler incelenmiştir. Çalışmada nitel araştırma yöntemi izlenmiştir. Bu çerçevede öncelikle İmam Şâfiî'nin, ardından erken dönemde yaşamış Irak ekolüne mensup âlimlerin fıkıh usûlü ve fürû-i fıkha dair yazdıkları eserler kaynak olarak kullanılmıştır. Ayrıca konuyla ilgili güncel çalışmalardan da yararlanılmıştır. İmam Şâfiî'nin aslî deliller bağlamında Irak ekolüne yönelttiği eleştiriler, belirli noktalarda yoğunlaşmıştır. Bunlar arasında; şer'î delillerin sıralamasına yeterince riayet etmemeleri; herhangi bir delile dayanmaksızın nasların zâhirî anlamını terk edip bâtınî anlamlarına yönelmeleri; Sünnet'in sübûtu için senedin yanında başka kriterleri de zorunlu kılmaları sebebiyle birçok sahih Sünnet'i terk etmeleri; sükûtî icmâyı delil olarak kabul etmeleri; kendi bölgelerindeki âlimlerin ittifakını icmâ olarak değerlendirmeleri ve sınırları belirlenmiş bir kıyas anlayışına sahip olmamaları gibi hususlar yer almaktadır. İmam Şâfiî'nin Irak ekolüne yönelik bu eleştirilerinin temel gayesi, şer'î delilleri sağlam bir zeminde ortaya koyarak, bu delillere dayanmayan kıyas ve ictihadların önüne geçmek; böylece İslam hukukunu şahsî yorumlardan koruyarak objektif niteliğini muhafaza etmektir."
