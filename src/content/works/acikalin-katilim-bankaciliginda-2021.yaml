abstract: "Katılım bankacılığı, diğer bankacılık işlemlerine kıyasla riski en az olan bankacılık işlemlerinden biridir. Birden fazla fon toplama ve kullandırma yöntemlerine sahip olan katılım bankacılığının en dikkat çeken fon kullandırma yöntemlerinden biri finansal kiralama (leasing) yöntemidir. Katılım bankacılığının sunduğu bu fon kullanma yönteminin popülaritesi her geçen gün artmaktadır. Günümüzde bankacılık sektöründeki mevcut payı istenilen düzeyde olmamakla birlikte giderek artan eğilimli bir trend içerisindedir. Bu çalışmada İslami finansal kiralamanın avantajları ve dezavantajları incelenerek pazar payının artırılmasına yönelik öneriler sunulmaktadır. Bu kapsamda yapılan araştırmanın amacı finansal kiralamanın ne olduğu ile alakalı detaylı araştırma yapmak ve daha sonra konu ile alakalı yapılacak araştırmalar için literatüre katkı sağlamaktır."
