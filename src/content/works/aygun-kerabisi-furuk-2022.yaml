abstract: "Bu tez çalışmasının amacı Es'ad b. Muzaffer el-Kerâbîsî'nin el-Furûk adlı ese-rindeki furûk'u fıkhiyye meselelerini“Kitabu't-Tahare, Kitabu's-Salah, Kitabu'z-Zekât, Kitabu's-Savm ve Kitabu'l-Menasik”çerçevesinde tahlil etmektir. Eserin ça-lışma alanı ibadetler kısmıyla sınırlandırılmıştır. Kerâbîsî'nin el-Furûk adlı eserinde, 39 kitap ve 779 meseleyi kapsamakta olup meselelerin 100 tanesi üzerinde çalışma yapılmıştır. Meseleleri tahlil ederken titiz davranan Kerâbîsî, genelde anlaşılır bir üslup kullanmaktadır. Kerâbisî, Hanefi mez-hebinde şeklen benzer olmakla birlikte hükmen farklılık arz eden meselelerin tutarlı-lığını ve verilen hükümlerde tearuz olmadığını ortaya koymaya çalışmaktadır."
