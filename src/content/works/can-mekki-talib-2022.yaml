abstract: "Kur'ân'ı anlama ve tefsîr etmede kırâat farklılıklarının önemli bir yeri olduğu tartışılamaz bir gerçektir. Manaya etki etmesi yönüyle kırâat farklılıkları Kur'ân lafızlarının okunuş şekliyle ilgili olduğu gibi, âyetleri oluşturan kelimelerin şeklinin değişmesiyle (kelimelerin harekelerinde ortaya çıkan okuma farklılıklarıyla, kelimenin iskeletinde meydana gelen değişiklikler) ortaya çıkan bu farklılıkların birçoğu âyetin anlamına direkt etki edecektir. Dolayısıyla kırâatler bir tefsirci için bilinmesi gereken en temel Kur'ân bilgileri arasında olmalıdır. Bu bilgiler ışığında tefsîr yazan birçok âlim eserlerinde kırâat anlam ilişkisine değinmiş ve kırâatlerin anlama etkisine örnek vererek açıklamışlardır. Bu bağlamda çalışmamıza konu olan, kırâat ve tefsîr ilimlerinde öncü sayılan âlimlerden Ebû Muhammed Mekkî b. Ebî Tâlib'in, (ö. 437/1045) el-Hidâye ilâ Bulûği'n-Nihâye adlı tefsîrinin, anlama etki eden kırâat farklılıklarını aldığı görülmüştür. Mekkî'nin birçok eseri hakkında çalışmalar yapılmasına rağmen söz konusu tefsîri kırâat-anlam ilişkisi yönünden inceleyen bir çalışmaya ulaşamadık. Bu nedenle ilgili eseri kırâat-anlam ilşkisi yönünden akademik bir üslupla incelemeyi amaçladık. Bu tezde sırasıyla müellifin hayatı, kırâat ilmine dair bilgiler ve eserin içeriğinde geçen ve anlama etki ettiği düşünülen farklı kırâatler, manaya etkisi açısından incelenip açıklamalar yapılmıştır. Bir rivâyet tefsîri olan bu eserin muhtevâsında tefsîr, hadis, sahâbî sözü, nahiv, luğat kuralları, sahih kırâatler ve şâz kırâatlerden misâller bulunmaktadır. Çalışmamızda, Mekkî'nin söz konusu eseri baştan sona taranarak misâl verdiği ve yorum yaptığı farklı kırâatler tespit edilmiştir. Tespit edilen âyetlerde yer alan farklı kırâatler incelenmiş, anlama etkisinin olup olmadığı ortaya konmuştur. Farklı okuyuşlar incelenirken anlama etki eden sahih kırâatlerle sınırlı kalınmış, şâz kabul edilen kırâatlere yer verilmemiştir. Mekkî'nin eseri incelendiğinde, birçok kırâatin bu bağlamda ele alınmadığı, çok az kırâatin anlama etkisi açısından değerlendirmeye alındığı sonucuna ulaşılmıştır. Aynı zamanda müellifin diğer bazı kaynaklarda anlamı etkilediği söylenen bütün kırâat farklılıklarına bu yönüyle değinmediği tespit edilmiştir. İnceleme sonucunda anlama etki eden bazı kırâatler farklı hükümlerin çıkarılmasına vesile olmuş, bazıları ise farklı yorumlanmaya ve tefsîre ayrı bir anlam zenginliğine sebep olduğu görülmüştür. Son olarak çalışmamız sonuç bölümüyle tamamlanmaktadır."
