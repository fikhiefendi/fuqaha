abstract: "İmam Rabbânî 16-17. yüzyıl Hindistan'ına damgasını vurmuş bir ilim adamıdır. Onun bu özelliği, bozulmaya yüz tutan İslam akâidini düzeltmek, dine giren çeşitli bid'atleri ortadan kaldırmak için yaptığı dîni ve ilmî tecdîd hareketlerine dayanmaktadır. Zerdüşt, Hindu, Budist, Şîi, Sünnî ve daha çeşitli dinleri, mezhepleri ve kültürleri bünyesinde barındıran Hindistan'da, bu dinlerin hepsini aynı çatı altında toplamayı hedefleyen sultanın dinine karşı derin mücadeleler vermiştir. Bu uğurda kaleme aldığı mektupları o günün sorunlarına ışık tuttuğu gibi benzer problemlerin yaşandığı günümüz İslam coğrafyasına da ışık tutacak niteliktedir. İmam Rabbânî'nin irşad için çeşitli kişilere yazdığı mektuplarının içeriğine bakıldığı zaman; felsefeden tasavvufa, kelamdan akâide, fıkıhtan hadise ve tefsire kadar pek çok ilmî konudaki fikirlerine rastlanmaktadır. Tasavvufî eğitimin tahalluk ve tahakkuk olmak üzere iki boyutu vardır. Birinci kısım eğitime başlangıç ve bu eğitim esnasında izlenilen yolları ihtivâ ederken; ikinci kısım birinci kısımdan sonra elde edilen tecrûbî bilgileri içermektedir. İmam Rabbânî'inin mektuplarındaki tecrûbî bilgileri hakkında yeterince akademik çalışmalar mevcut olduğu için, burada ele alınacak konu toplumu ahlâkî açıdan düzeltmeyi hedefleyen çalışmalarını içeren tahalluk boyutu olacaktır. Bu çalışma giriş bölümü ile birlikte üç bölümden oluşmaktadır. Giriş bölümünü çalışmanın konusu ve kapsamı, kaynakları ve kullanılan yöntem oluşturmaktadır. Birinci bölümde İmam Rabbânî'nin hayatına, eserlerine ve yaşadığı dönemin dînî ve ictimâî durumuna kısaca değinilmiş, ikinci bölümde ise çalışmanın asıl konusu olan İmam Rabbânî'nin bazı tahalluk kavramlarına yüklediği anlam ve yaklaşımı ele alınmıştır. Bu kavramlar: istikâmet, ibâdet, ihlas, tevbe, zikir, itmi'nan, tevâzu', edep, rıza, sabır, şükür, takva, verâ, zühd, fakr'dır. Yukarıdaki kavramlar ele alınırken öncelikle Serrac, Kuşeyrî, Gazzali, Sühreverdî, Mevlânâ, Geylânî, Hucvirî, Kelâbâzî, Ebû Tâlib El-Mekkî gibi tasavvuf önderlerinin görüşlerine yer verilmiş, sonra İmam Rabbânî' nin mektuplarında ele aldığı bu kavramlara verdiği anlamlar saydığımız isimlerin görüşleriyle karşılaştırılarak özgün fikirleri ortaya çıkarılmaya çalışılmıştır. İmam Rabbânî'nin bu konudaki görüşleri hakkında müstakil olarak bir akademik çalışma bulunmadığı için bu çalışmamızın ilim dünyasına yeni bir katkı sağlayacağı ümidindeyiz."
