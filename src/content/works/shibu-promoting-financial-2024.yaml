abstract: "Bu çalışma, finansal kapsayıcılığı etkileyen ve İslami mikrofinans hizmetlerini teşvik eden faktörleri araştırmayı amaçlamıştır. Araştırmada, finansal kapsayıcılık, finansal farkındalık, bilgi, belirsizlik, finansal davranış değişikliği ve gelir düzeyine ilişkin daha iyi bir anlayış geliştirmek için Planlı Davranış Teorisi'nden yararlanıldı. 2202 anket katılımcısından toplanan geçerli bir veri kümesi SPSS Amos 22 sürüm yazılımı kullanılarak modelin iyiliğini test etmek için yapısal eşitlik modelleme (SEM) yöntemlerinden faydalanıldı. Bu araştırmada finansal tutumun, finansal açıdan farkındalık, belirsizlik, bilgi, davranış değişikliği ve gelir düzeyinden etkilendiği bulunmuştur. Finansal kapsayıcılığı ise finansal bilgi, finasal davranış değişikliği ve gelire göre belirlenmiştir. Ancak bu çalışma sonucunda, finansal farkındalık ve finansal belirsizlik ile finasal kapsayıcılık arasındaki pozitif/negatif ilişkinin, İslami mikrofinans hizmetlerini benimsemek için finansal katılımın teşvik edilmesi konusunda sınırlı faktörlerden dolayı desteklemediği anlaşılmıştır. Sonuç olarak, finansal kapsayıcılık, İslami mikrofinans ve İslami finansal sisteminin uygulayıcıları ve yararlanıcılarının finansal stratejilerini dönüştürmeleri için hayati öneme sahiptir. Bu nedenle İslami mikrofinans uygulayıcıları, Islami finansal hizmetlerinin yararına etkili finansal tutumlar geliştirmek için finansal farkındalık, finansal bilgi, finansal davranış değişikliği ve finansal kapsayıcılık oluşturmaya odaklanmalıdır."
