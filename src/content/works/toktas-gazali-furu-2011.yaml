abstract: "Gazâlî'nin Furû-ı Fıkıh eserlerinden el-Basît, el-Vasît ve el-Veciz adlı eserlerini tesbit edebildik. Bunlardan el-Basît matbu halde bulunmadığından dolayı, bizde çalışmamızı el- Vasît ve el-Vecîz adlı iki eser üzerinde yaptık. Bu iki eser diğer furû-ı fıkıh eserlerinde olduğu gibi dört bölümden oluşmaktadır. Bunlar İbadat, Nikah ve Miras, Muamelât ve Ukûbât'tır. Bizim çalışmamız da Muamelatın içinde olan Eşya ve Borçlar Hukuku üzerinde olacaktır.Bu çalışmamıza başlarken Gazâlî'nin eserlerinden el-Vasît ve el-Vecîz adlı eserlerinde eşya ve borçlar hukuku ile ilgili Hanefilere nisbet edilen görüşleri tesbit ettik. Bu tesbiti yaptıktan sonra, ilkin Gazâlî'nin görüşünü yazdıktan sonra, Hanefilere ait görüşü yazdık. Bu görüşleri bu şekilde tesbit ettikten sonra eşya ve borçlar hukuku kapsamında hazırladığımız başlıkların altına yerleştirdik."
