abstract: "ÖZET Ali Şerîatî (1933-1977) İran asıllı bir sosyolog, aktivist ve günümüz İslâm Mezhepler Tarihi açısından önemli bir fikir adamıdır. Şerîatî, çalışmalarını özellikle Sosyoloji ve Dinler Tarihi alanında yoğunlaştırmıştır. Onun fikirleri hem İran hem de Türkiye gibi diğer İslâm ülkelerindeki İslâmi çevreler üzerinde oldukça etkili olmuştur. Günümüzde İran, İmâmiyye Şîası'nın merkezi konumunda olduğu gibi aynı zamanda İran'ın resmi mezhebidir. İmâmiyye Şîası'nın merkezidir. Bu yüzden kendisine yöneltilen eleştiriler bakımından oldukça kapalıdır. Budan dolayı muhalif kişiler, fikirlerini açıkladıkları zaman tutuklanmalara ve ölümlere maruz kalabilmektedirler. Şerîatî, İranlı Şîî bir aileden gelmesine rağmen İran merkezli İmâmiyye Şîası'na sert eleştiriler yöneltmiştir. Bu yüzden Sünnîlikle itham edilmiştir. Bunun sonucunda da önce sürgün edilmiş daha sonra da hapsedilmiştir. 1977 yılında İngiltere'de kaldığı odada ölü bulunmuştur. İran istihbarat örgütü olan Savak tarafından suikaste uğradığına inanılır. Fikirleri İran dışında da ilgi görmüştür. Bundan dolayı fikirleri çağdaş İslâm akımları açısından da önemlidir. Şerîatî, Şîa İmâmet anlayışına farklı bir bakış açısı geliştirmiştir. Çalışmamızda Şerîatî'nin İmâmet ve imamlara bakış açısı ele alınmakla birlikte bu konuyla bağlantılı olan diğer dini meselelere de değinmeye çalıştık. Şerîatî, yaşadığı dönemde özellikle İran'ın için de bulunduğu sosyal ve toplumsal konuları anlaya bilmek açısından İmâmiyye Şerîatî İmâmiyye Şîası'nı da tarihi açıdan iyi bilmek gerekir. Bu yüzden İmâmiyye Şîası'na genel hatlarıyla değinmeye çalıştık. İmâmiyye Şîası'nı; Safevi Şîası ve Ali Şîası olarak isimlendirmiştir. Kendi Şîa anlayışını gerçek Şîa olarak kabul ettiği Ali Şîası olarak isimlendirmiştir. Biz de çalışmamızda isimlendirmeleri bu şekilde yapıp mukayeseli bir şekilde konuları incelemeye çalıştık. Şerîatî hakkında yazılan tezlere baktığımız zaman Şîîliğe yönelik açılım arayışları ve Şîîliğe bakış açısını ele alan tezler yazıldığını gördük. İmâmet ve İmamlar konusunda yapılan bir teze rastlamadığımız için bu konu üzerinde çalışmamızı yoğunlaştırdık"
