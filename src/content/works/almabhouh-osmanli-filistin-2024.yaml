abstract: "Bu tez, Osmanlı İmparatorluğu döneminde, miladi 16. ve 17. yüzyıllarda Filistin'de yaşamış ve müftülük görevinde bulunmuş olan Hayreddin er-Remlî'nin İslam hukuku ve Hanefi Mezhebi içindeki yerinin tespiti ve tez kapsamında tahkiki yapılan Risaleleri bağlamında fıkhi yaklaşımlarını ve düşüncesini ortaya çıkarmak amacıyla hazırlanmıştır. Tezin inceleme bölümünde Remlî'nin geniş bir tanıtımı yapılarak ismi, künyesi, lakabı ve nesebi, doğum-ölüm yeri ve tarihi, ilmî hayatı, hocaları ve talebeleri, ilmi seyahatleri, eserleri zikredilmiş, alimlerin onun hakkındaki görüşleri ve İslam hukukuna katkıları aktarılmıştır. Tahkik bölümünde ise Hayreddin er-Remlî'nin değişik fıkhi konularda kaleme aldığı on adet risâlesi ilmi kriterlere uygun olarak tahkik edilmiş, ilim dünyasına kazandırılan bu risâlelerin müellifin kaleminden çıkmış haline ulaşılmaya çalışılmış, bunun yanında inceleme kısmı ve dipnotlarda okuyucuya metni anlamada kolaylık sağlayacak gerekli açıklamalar yapılmıştır."
