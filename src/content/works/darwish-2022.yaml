abstract: "“Mütekaddimûn Dönemden Müteahhirûn Dönemine Şâfiî Fıkhının Gelişimi -Müzenî ve Nevevî'de İcâre Bölümü Örneği”olarak isimlendirdiğimiz bu çalışma, Şafiî fıkhının imam müzeni'den imam neveviye kadar nasıl bir gelişim gösterdiğini icare bahsi çerçevesinde tespit etmeyi hedeflemiştir. Şafiî fıkhının nasıl yazıya geçirildiğini, düzenlendiğini, korunduğunu ve nasıl günümüze aktarıldığını bir nebze açıklamaktadır. Aynı zamanda bu çalışma, Şafiî ekolüne mensup âlimlerin mütekaddimleriyle müteahhirlerinin görüşleri arasında çelişki olduğuna dair iddiaları, Müzenî ve Nevevî hakkında bir konuyu esas olarak yapılan detaylı bir araştırma ile ele almakta, bu iddianın haklılık payı olup olmadığını açıklamaya çalışmaktadır. Çalışmamız konunun önemini, seçilme nedenini, bu konuda yapılmış çalışmaları, araştırma yöntemini ve temel terimleri içeren giriş bölümü ile başlamaktadır. Bu kısımda“mütekaddimînin”ve“müteahhirînin”anlamı ile Müzenî ve Nevevî'nin biyografileri zikredilmiştir. Birinci bölümde Müzenî'den Nevevî'ye Şafiî fıkhının geçirdiği merhaleler, Müzenî'nin ve Nevevî'nin eserlerindeki yöntemleri, Nevevî'nin Müzenî ile olan ilişkisi incelenmiş ve Müzenî'den Nevevî'ye fıkhî metinlerin gelişiminden örnekler verilmiştir. İkinci bölümde ise icâre bahsi, Müzenî'nin Muhtasar isimli eseri ve Nevevî'nin Minhâc isimli eseri özelinde ele alınmıştır. Sonuç bölümünde de çalışmamızdan çıkan neticeler aktarılmıştır."
