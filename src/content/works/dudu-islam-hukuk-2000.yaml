abstract: "IV ÖZET YÜKSEK LİSANS TEZİ Veysel DUDU Danışman : Doç. Dr. Selahattin KIYICI Tarih : 2000; Sayfa : 171 Jüri : Doç. Dr. Selahattin KIYICI Kur'an-ı Kerim'in inişinden kıyamete kadar geçecek dönem içerisinde toplum ihtiyaçlarınm farklılık gösterecektir. Bunun bir sonucu olarak bir takım hükümlerinin baa zaman ve mekanlar açısından uygulanmamasını kabul etmemiz gerekir. Toplumların sosyal yapılarının ve ihtiyaçlarının değişmesine paralel olarak oluşturulan kanunların değiştirilmesi ve yenilerinin oluşturulması kaçınılmaz bir olaydır. Bu nedenle Yüce Allah, en hayırlı ümmet olarak nitelediği son ümmetin binasının temeli ve kıyamete kadar gelecek nesillere örnek olacak olan nesli Cahiliyye gayyasından çıkanp ideal nesil haline yükseltmek için, talimatını onların akıllarına ve kalplerine sindire sindire yerleştirerek nesih metodunu uygulamıştır. Kur'an-ı Kerim'in kendisinden evvelki kitapları nesh ettiği gibi, yenilenmeye başlayan İslâm cemaatinin inkişâf ve tekamül icabı olarak emir ve nehiyleri ihtiva eden bazı ayet ve hükümlerinin sonradan kaldırılması tabiîdir. Aynı zamanda bu tebdil, mü'minlerin dînî vecibelerini daha pratik ve daha kolay bir şekle sokmak maksadıyla gelmiştir. İlk dönemde yaşayan alimlerin; tahsis, takyid, istisna ve neshi aynı şeyler saymış olmaları ve aynca cahiliyye devrinde uygulanan uygulamaların zamanla kaldırılmış olmasını da nesih olarak kabul etmeleri Kur'an'da az sayıda bulunan nesih sayısının çoğalmasına neden olmuştur. Kur'an'da nâsih ve mensûh ayetlerin sayısını abartanlar ifrattan uzak olmadıkları gibi, Kur'an-ı Kerim'de hiç nâsih ve mensûh ayet yoktur diyenler de tefritten uzak değillerdir. Vakıa, Kur'an-ı Kerim'de nâsih ve mensûh vardır. Fakat sayılan o kadar çok değildir"
