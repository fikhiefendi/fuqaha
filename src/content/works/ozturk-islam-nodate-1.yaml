abstract: "ÖZET YÜKSEK LİSANS TEZİ Halil ÖZTÜRK İSLÂM HUKUKUNDA KUR'A Danışman: Yrd. Doç. Dr. Halil ibrahim ACAR 1998 -SAYFA: 58 Jüri: Yrd. Doç. Dr. Halil İbrahim ACAR islâm Hukukunda kur'a uygulanmasının doktriner temellerinin tespiti amacıyla yapmış olduğumuz bu çalışma bir giriş iki bölümden oluşmaktadır. Giriş bölümünde kur'a usulünün hukuk metodolojisindeki konumu birinci bölümde ise tanımı ve tarihteki yeri üzerinde durduk. Tezimizin ikinci bölümünde kur'anın naslardaki yeri ile İslâm hukuk doktrinindeki uygulanmaları incelendi Çalışmamızın neticesinde kur'a Usulünün İslâm Hukukunda da var olduğu özellikle problemli ve meçhul durumlarda hükmü Allah'a havale etme esasına dayalı hukuki bir çözüm yolu olarak kullanıldığı tespit edilmiştir."
