abstract: "Uluslararası literatürde Islamic Finance veya Islamic Banking olarak bilinen, Türkiye'de ilk olarak“Özel Finans Kurumu”, 2005 yılından itibaren ise Katılım Bankası adıyla faaliyet gösteren bu kuruluşlar, İslamî finans prensipleri çerçevesinde bankacılık hizmeti sunmaktadır. Bankacılık sistemlerinde kredi riskinin yönetimi, finansal istikrarın sağlanması açısından kritik bir öneme sahiptir. Bu kapsamda katılım bankalarının, değişen makroekonomik koşulları doğru analiz ederek kredi politikalarını sürekli güncellemeleri ve takipteki krediler (NPL) oranını kontrol altında tutacak stratejiler geliştirmeleri gerekmektedir. Bu çalışmada Katılım bankalarının NPL oranları üzerindeki belirleyiciler incelenmiştir. Bağımsız değişkenler olarak makroekonomik faktörler kapsamında Gayrisafi Yurtiçi Hasıla (GSYİH), enflasyon, politika faizi, döviz kuru ve işsizlik oranı; banka içi değişkenler kapsamında ise toplam kredilerin toplam mevduata oranı, aktif kârlılığı (ROA), özkaynak kârlılığı (ROE) ve toplam kredilerin toplam aktiflere oranı kullanılmıştır. Bağımlı değişken ise takipteki kredilerin toplam kredilere oranı olarak tanımlanmıştır. Analizde 2010 Mart – 2025 Haziran dönemine ait üçer aylık veriler kullanılmış ve katılım bankaları için panel veri analizi uygulanmıştır. Elde edilen bulgular, makroekonomik değişkenlerin katılım bankalarının NPL oranları üzerinde anlamlı etkilere sahip olduğunu göstermektedir. İşsizlik oranı ve politika faizi ile NPL oranı arasında pozitif yönlü bir ilişki tespit edilirken, döviz kuru ile NPL oranı arasında negatif yönlü bir ilişki belirlenmiştir. Banka içi değişkenler açısından ise özkaynak kârlılığındaki artışın takipteki krediler oranını azalttığı sonucuna ulaşılmıştır. Bu çalışma, katılım bankacılığı özelinde hem makroekonomik hem de banka içi faktörleri birlikte ele alması, uzun dönemli çeyreklik veri seti kullanması ve Türkiye örneği üzerinden panel veri analizi gerçekleştirmesi açısından literatüre katkı sağlamaktadır."
