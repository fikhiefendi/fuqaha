abstract: "Ahkâm ayetlerin hemen hepsi mücmeldir. Onun detaylı şekilde açıklanması ise sünnete bırakılmıştır. Örneğin Kur'an yalanı tamamen yasaklar. Sünnet ise yalanın bu genel hükmüne karşı istisnalar koyar ve yalan hakkında sünnetin hükmü uygulanır. Buna göre sünnet, mücmel olarak gelen bütün ahkâm ayetlerini ya amelin keyfiyetinin belirlenmesi ya da sebeplerini, şartlarını, mânilerini, sıhhat ve butlanını beyan eder. Bu bakımdan sünnet olmadan şeriat ahkâmının uygulanması mümkün görünmemektedir. Çünkü sünnet, mücmelin ve diğer lafızların anlaşılmasında önemli bir yer tutmaktadır. Bu çalışmamızda icmalin anlamı, sebepleri, hükmü ve kapsamını verdikten sonra sünnetin mücmeli nasıl beyan ettiği detaylı bir şekilde ele alınacaktır."
