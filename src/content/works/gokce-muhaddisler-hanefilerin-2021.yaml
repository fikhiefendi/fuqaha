abstract: "Bu çalışmada muhaddisler ile Hanefilerin hadis ıstılahlarına yükledikleri anlam karşılaştırılmıştır. Üç bölümden oluşan çalışmada birinci bölümde kavramlar haber ekseninde karşılaştırılırken, ikinci bölümde râvî ekseninde karşılaştırılmıştır. Üçüncü bölümde ise rivayet ekseninde bir karşılaştırma yapılmıştır. Kavram karşılaştırılmasında önce bölüm başlıkları altındaki Hanefilerin kullanmış oldukları hadis kavramları tespit edilmiş, sonra bu kavramlara göre muhaddislerin hadis kavramları incelenmiştir. Kavramların karşılaştırılması esnasında mümkün olduğunca kronolojiye uygun hareket edilmeye çalışılmıştır. Karşılaştırmada kavramların anlamları, geçirdikleri değişim süreçleri ve ifade ettikleri hükümler konu bütünlüğünü sağlayacak şekilde aktarılmaya çalışılmıştır. Araştırmanın hadis alanında olması ve muhaddislerin bu sahada daha geniş çalışmalar yapmalarından dolayı muhaddislerin görüşleri daha detaylı incelenmeye çalışılmıştır. Karşılaştırılması gereken durumlar konu bağlamından uzaklaşmadan bölüm içinde yapılmıştır. Ayrıca genel bir bakış sağlamak amacıyla her bölüm sonuna değerlendirme kısmı konulmuştur. Kavramların mukayesesinde muhaddislerin ve Hanefilerin ortak noktaları, görüş ayrılıkları, karşılıklı etkileşim ve tenkitleri ve sahip oldukları hususi kavramlar vurgulanarak konu daha belirginleştirilmeye çalışılmıştır."
