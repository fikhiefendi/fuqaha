abstract: "Mahtut eserlerin tahkik edilmesi oldukça önemlidir. Çünkü tahkik sayesinde kütüphane raflarındaki ölüme terk edilen eserlere ve eski alimlerimizin ilmi gayretlerine hayat verilmektedir. Bu araştırmamız da“Molla Muhammed el-Geredî'nin Yusuf b. İbrahim el-Erdebîlî'nin el-Envar İsimli Kitabına Yazdığı Haşiye”isimli eserin tahkikini konu almaktadır. Tahkikte eserin tamamı değil“İflas, Hacr, Sulh, Havale, Daman, Şirket, Vekalet, İkrar, Ariyet, Kıraz, Musakat ve İcare”konuları esas alınmıştır. Çalışmamız Bingöl Üniversitesi Sosyal Bilimler Enstitüsü İslam Hukuku bilim dalında fıkıh ve fıkıh usulü alanında yüksek lisans çalışması olarak takdim edilmiştir. Tahkik çalışmamız iki bölümden oluşmaktadır. Birinci bölüm araştırma kısmı olup iki kısma ayrılmıştır. Birinci kısımda Molla Muhammed el-Geredî'nin hayatı, mahtut eserinde kullandığı temel kaynaklar, ikinci kısımda ise Yusuf el-Erdebîlî ve el-Envar isimli kitabı ele alınmıştır. İkinci bölümde ise ismi geçen haşiyenin muamelatla ilgili on iki babı tahkik edilmiştir. Tahkik konusunda biri أ diğeri harfiyle isimlendirdiğimiz iki adet nüshadan yararlanılmıştır. Araştırma tahkikten sonra elde edilen bulgu ve tavsiyeleri içeren bir sonuçla tamamlanmıştır."
