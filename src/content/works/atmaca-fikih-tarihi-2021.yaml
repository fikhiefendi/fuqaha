abstract: "Çalışmamız, Osmanlının son dönemleri ile Cumhuriyet döneminde yaşamış olan Haydar Rıfat Yorulmaz'ın Yeni ve Mükemmel Malumat-ı Kanuniye adlı eserinin fıkıh tarihi açısından değerlendirilmesini ortaya koymayı hedeflemektedir. Avukatlık kimliğiyle üstlenmiş olduğu davalarda ön plana çıkan Haydar Rıfat Yorulmaz yazmış olduğu eserler ve çevirileriyle de ön plana çıkmıştır. Bu bağlamda, tezimizde Haydar Rıfat'ın hayatı, üstlendiği davalar, kişiliği ve kaleme almış olduğu eserleri incelenmiştir. Bununla birlikte incelemekte olduğumuz eserle ilgili bilgilendirmelere yer verilmiştir. Yazarın eseri oluştururken faydalanmış olduğu kaynaklar araştırılarak eserle karşılaştırılması yapılmıştır. Ayrıca Osmanlı Türkçesi ile yazılmış olan Malumat-ı Kanuniye adlı eser latinize edilerek çalışmamıza eklenmiştir. Bu eserle ilgili değerlendirmeler ve tespitler ise, tezin ilgili bölümlerinde ve sonuç bölümünde aktarılmaya çalışılmıştır."
