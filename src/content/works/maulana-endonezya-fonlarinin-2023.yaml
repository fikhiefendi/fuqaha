abstract: "Bu çalışma, Endonezya'da altyapı sektörünün doğrudan finansmanı için Hac fonlarının kullanımına ilişkin İslam hukuku, iktisadı ve finansmanı açısından analiz etmeyi amaçlanmıştır. Hac fonları, ülkenin altyapısının iyileştirilmesi ve geliştirilmesine yardımcı olmak için potansiyel olarak kullanılabilecek ve toplumun geniş çapında uzun süreli faydalar sağlayabilecek fon kaynağıdır. Ancak bu tür düşünce özellikle toplum arasında çeşitli tepkiler almıştır. Bu çalışma, Endenozya Hac Mali Yönetim Ajansı tarafından Hac fonlarının yönetimine ilişkin kanunlar ve tarihsel veriler gibi devlet politikalarının analiz edilmesinin yanı sıra devlet altyapı projelerinde Hac yatırımlarına ilişkin genel durum incelemiştir. Ayrıca Hac fon yönetim sistemini benzer finansal kurumlarla ve Hac finansal yönetiminin diğer ülkelerle karşılaştırmasını da araştırılmıştır. Son olarak, Endonezya'nın dini, ekonomik ve sosyal bağlamında altyapı gelişimi için Hac fonlarının kullanılmasının etkisi değerlendirilmiştir."
