abstract: "Karz akdi, temel gayesi insanların ihtiyaçlarını dünyevî bir menfaat beklemeksizin karşılamayı hedef alan, tamamen insanî erdemleri göz önünde bulunduran yardımlaşma ve dayanışma esasına dayalı bir akid sistemidir. Bu çalışma karz akdini, muâsır âlimlerin eserlerinden de yararlanarak, İslâm fıkhının temel kaynak kitaplarından konuyla ilgili bilgileri kendi alt başlıklarında inceleyerek sistematik bir bilgi sunmak, mezhep imâmlarının farklı görüşlerini ortaya koyup bu akdin işlerlik kazanması hususunda tahliller ve mukayeseler yaparak kanaatimizi ortaya koymak amacıyla yapılmıştır. İslâm fıkhında müsemmâ akidler arasında yer alan karz akdinin, her ne kadar zamanımızda işlevi zayıflasa da özellikle, İslâm'ın faiz yasağına karşı duyarlı olup, faize bulaşmadan hayatlarını devam ettirebilmek amacıyla zarûri ihtiyaçları için ödünç talep edenler açısından varlığına ihtiyaç devam etmektedir. Giriş ve üç bölümden oluşan çalışmamızın giriş bölümünde araştırma konusunun önemi, amacı, kapsamı, metodu ve konuyla ilgili daha önceden yapılmış çalışmalar ele alınmıştır. birinci bölümünde karzın manası, mahiyeti, şer'î dayanağı ve unsurlarından; ikinci bölümünde karzla ilgili çeşitli hükümlerden; üçüncü bölümünde ise, karzın bazı benzeri akidlerle ilişkisi ve karz teminine yönelik bazı hukuki işlemlerden bahsettik. Çalışmamıza kısa bir sonuç ve değerlendirme bölümüyle son verdik."
