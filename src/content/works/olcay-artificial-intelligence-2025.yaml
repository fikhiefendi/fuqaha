abstract: "Yapay zeka (YZ) ve makine öğrenimi (MÖ) tekniklerinin yaygın kullanımı, özellikle girişimsel olmayan yaşamsal belirtilerin analizinde sağlık hizmetlerinde köklü değişimlere yol açmıştır. Bu çalışma, MIMIC-III Waveform Veritabanı'ndan elde edilen kalp ritmi, nabız, solunum hızı ve kandaki oksijen doygunluğu (SpO₂) gibi fizyolojik zaman serisi verilerinin etkin bir şekilde analiz edilmesi sorununu ele almaktadır. Bu problemin önemi, erken teşhis süreçlerinin iyileştirilmesi, invaziv izleme cihazlarına olan bağımlılığın azaltılması ve yoğun bakım ünitesi (YBÜ) ile ilgili klinik kararların doğruluğunun artırılması potansiyelinden kaynaklanmaktadır. Bu tezin amacı, yaşamsal belirtiler arasındaki ilişkileri ortaya çıkarabilen, anomalileri tespit edebilen ve hastaları bulundukları YBÜ türlerine göre otomatik olarak sınıflandırabilen bir sistem geliştirmektir. Yöntem olarak, iki saatlik zaman serilerinin ön işlenmesi ve bölütlenmesi, sinyal dönüşümleri (örneğin Fourier dönüşümü ve spektral analiz), öznitelik mühendisliği ve çeşitli makine öğrenimi ve derin öğrenme modellerinin (lojistik regresyon, rastgele orman, XGBoost ve LSTM ağları) eğitilmesi süreçleri uygulanmıştır. Başlangıçtaki korelasyon ve varyans analizleri, özellikle nabız ve kalp ritmi arasında güçlü bir bağıntı olduğunu ve YBÜ türlerine özgü belirgin farklılıklar bulunduğunu ortaya koymuştur. Test edilen modeller arasında CNN-BiLSTM, sınıflandırma doğruluğu açısından en iyi performansı göstermiştir. Elde edilen sonuçlar, korelasyon bilgisi ile zaman serisi modellemenin birleştirilmesinin sınıflandırma başarımını anlamlı ölçüde artırdığını ve veri odaklı klinik karar destek sistemlerinin geliştirilmesine katkı sunduğunu göstermektedir. Tez, yaşamsal belirti bağıntılarının YZ teknikleriyle etkili biçimde kullanılabileceğini ve bu sayede sağlık analizlerinin doğruluğunun artırılabileceğini ortaya koymaktadır."
