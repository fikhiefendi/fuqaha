abstract: "Kripto paralar, dijital finansal teknolojilerin hızla gelişmesiyle birlikte küresel finansal sistemin önemli bir bileşeni hâline gelmiş; bu dönüşüm İslam ekonomileri açısından normatif, kurumsal ve düzenleyici tartışmaları da beraberinde getirmiştir. İslam İş birliği Teşkilatı'na (İİT) üye ülkelerde kripto paraların benimsenme düzeyi ve düzenleyici yaklaşımlar, ülkelerin finansal yapıları, İslami finans ekosistemlerinin kurumsal derinliği, makroekonomik koşulları ve finansal merkezleşme stratejileri doğrultusunda önemli farklılıklar göstermektedir. Bu tez, kripto paraların İslam ekonomilerindeki konumunu kuramsal ve ampirik literatür çerçevesinde ele almakta ve Türkiye, Malezya, Suudi Arabistan, Endonezya, Birleşik Arap Emirlikleri ve Katar örnekleri üzerinden karşılaştırmalı bir analiz sunmaktadır. Tablo ve grafiklerle desteklenen bulgular, kripto paraların İİT ülkelerinde homojen bir politika ve uygulama alanı oluşturmadığını; düzenleyici tercihler, piyasa derinliği, finansal merkez olma hedefleri ve kurumsal kapasiteye bağlı olarak farklı ülke modellerinin ortaya çıktığını göstermektedir. Bazı ülkelerde kripto varlıklar finansal yenilik ve yatırım aracı olarak öne çıkarken, bazı ülkelerde daha temkinli ve kontrollü yaklaşımların benimsendiği görülmektedir. Analiz sonuçları, kripto paraların İslam ekonomileri açısından ne mutlak biçimde dışlanması gereken bir unsur ne de kendiliğinden ekonomik fayda üreten bir araç olduğunu ortaya koymaktadır. Dijital finansal yeniliklerin İslami finans sistemleriyle uyumlu biçimde gelişebilmesi, etkin yönetişim mekanizmaları, düzenleyici netlik ve normatif ilkelerle uyumlu bir çerçevenin oluşturulmasına bağlıdır."
