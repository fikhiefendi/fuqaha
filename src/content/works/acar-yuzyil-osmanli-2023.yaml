abstract: "Fetva, İslâmiyet'in ilk yıllarından itibaren toplumsal bir ihtiyacın sonucu olarak ortaya çıkmıştır. Fetva mecmuaları da bu ihtiyaç doğrultusunda ortaya çıkmış önemli kaynaklardır. Bu mecmualar, yazıldığı dönemin hukuki, dini, siyasi ve sosyal hayatı hakkında bizlere önemli bilgiler sunmaktadır. Bu çalışmada 17. yüzyıldaki şeyhülislâmlara ait fetva mecmualarının“had”,“kısas”ve“diyet”bölümleri ele alınmıştır. Çalışmamızda öncelikle fetva müessesesi ve şeyhülislâmlık kurumu hakkında bilgi verilmiştir. Daha sonra 17. yüzyıl şeyhülislâmlarının hayatlarından kısaca bahsedilmiştir. Ardından İslam hukukunda had ve kısas suçları için öngörülen cezaların mahiyeti hakkında bilgi verilmiş, sonrasında ise 17. yüzyıldaki şeyhülislâmların günümüze ulaşan fetva mecmularından hareketle Osmanlı toplumundaki had ve kısas uygulamaları incelenmiştir. Bu çalışmanın, Osmanlı ceza hukuku üzerine yapılacak olan çalışmalara ışık tutucu bir kaynak olması amaçlanmıştır."
