abstract: "Çalışma konumuz, icra ve iflâs hukukunda genel olarak kredi alacaklarının tahsilidir. Konu, İcra ve İflâs Kanunu'nda iki ayrı maddede düzenlenmiştir (m. 68b, 150ı). Kredi alacaklarının tahsili, ilk olarak 3182 sayılı Bankalar Kanunu'nda düzenlenmiş (m. 90, 91), daha sonra, söz konusu hükümler, içerikleri de genişletilerek ve geliştirilerek uygulamada da eşitliğin sağlanması amacıyla İcra ve İflâs Kanunu'nun içine alınmışlardır. Borçlu cari hesap veya kısa, orta, uzun vadeli nakdi kredilerden kaynaklanan kredi alacaklarının genel haciz yoluyla takibi, İcra ve İflâs Kanunu'nda 68b maddesinde düzenlenmiştir. Kredi alacaklısı krediyi kullandıran taraf, hesap veya faiz tahakkuk dönemlerini takiben on beş gün içerisinde bir hesap özeti hazırlayıp bunu kredi borçlusu krediyi kullanan tarafın kredi sözleşmesindeki adresine göndermek zorundadır (m. 68b/l). Hesap özetinin gönderilmesi işlemi ancak noter aracılığıyla olabilir. Süresi içinde aldığı hesap özetinin içeriğine bir ay içinde itiraz etmeyen kredi borçlusu, hesap özetinin gerçeğe aykırılığını, ancak takip konusu kredi borcunu ödedikten sonra dava edebilir (m. 68b/ll). Süresinde içinde itiraza uğramayan hesap özeti, kredi sözleşmesi ve bu sözleşmeye göre hazırlanmış diğer belge ve makbuzlar ile birlikte İcra ve İflâs Kanunu'nun 68/I maddesi anlamında belgedir (m. 68b/lll). Kredi borçlusu, süresi içinde itiraz etmediği hesap özetinin dayandığı belge ve makbuzlardaki imzasını inkâr edemez (m. 68b/lll). İcra ve İflâs Kanunu'nun 68b maddesi, aynı kanunun 150a maddesinin uygulanmasını gerekli kılan durumlarda da uygulanabilir (m. 68b/lll). Kredi alacaklısının kanunda lehine öngörülen hükümlerden yararlanabilmesi, hesap özetinin süresi içinde hazırlanıp (m. 68b/l) öngörülen şekilde gönderilmesine (m. 68b/l) ve süresinde itiraza uğramamış olmasına bağlıdır (m. 68 b/l I, III). Borçlu cari hesap, kısa, orta, uzun vadeli nakdi kredi ile gayri nakdi kredi türerinden dolayı alacaklı olan krediyi kullandıran taraf, kredi ilişkisinin kesildiğinedair hesap özeti veya tazmin talebini, noter aracılığıyla göndermesi halinde, alacağının teminatı olan ipoteğin ilamlı yol ile paraya çevrilmesini talep etmek hakkına sahiptir. Böyle bir durumda icra müdürü, İcra ve İflâs Kanunu'nun 149. maddesine göre işlem yapacak ve krediyi kullanan taraf ile varsa ipotekli taşınmaz maliki üçüncü kişiye bir icra emri gönderecektir (m. 150ı). Krediyi kullanan taraf, yine noter aracılığıyla kendisine gönderilen hesap özeti veya tazmin talebine sekiz gün içerisinde itiraz etmek hakkına sahiptir (m. 150ı). Ancak bu halde kredi kullanan taraf, icra emrine karşı icranın geri bırakılması yolu yanında, icra tetkik merciine karşı şikâyette bulunabilir (m. 150ı). Takip konusu kredi borcunun esasının tartışılabildiği şikâyet yoluna sadece hesap özeti veya tazmin talebine itiraz etmiş olan krediyi kullanan taraf başvurabilir. Şikâyet yargılamasında kredi alacaklısı, takip konusu alacağını İcra ve İflâs Kanunu'nun 68b maddesine göre diğer belgelerle ispatlayabilir (m. 150ı). 111"
