abstract: "Hukuk kuralları insanların toplum halinde yaşayabilmeleri için yüzyıllar boyunca gerekli olmuş; her devlet toplum düzenini sağlayabilmek için birtakım kurallar koymuş ve uyulmasını belli yaptırımlarla desteklemiştir. İçki içme fiili İslam'ın ilk dönemlerinden itibaren tedrici bir şekilde yasaklanmış ve İslam hukuk doktrininde detaylı bir şekilde ele alınmıştır. Bu çalışmada İslam Hukuk doktrininde önemli yer tutan bu konu ele alınmış ve içki içmeye verilen cezaların uygulamada nasıl varlık bulduğu incelenmiştir. Bu amaçla Osmanlı toplumunun sosyal, kültürel ve hukukî hayatının bir bakıma aynası konumunda olan şeriyye sicilleri kullanılmıştır. Ayrıca dönemin şartlarını ve hayatını daha iyi analize edebilmek için günlük hayatın, siyasi, hukuki anlayış ve görüşlerin yansıması olan fetva mecmuaları toplumun çeşitli katmanlarıyla geçmiş ve gelecek arasında bilgi aktarımını da sağladığı için bizim başvuru kaynaklarımızdan olmuştur. Bu kaynakların yanında Osmanlı dönemi hukuk işleyişinde yarı resmi hukuk külliyatı sayılan eserlere de atıfta bulunulmuş bu sayede yıllarca kitaplarda okuduğumuz hukuk kuralarının ve cezaların toplumdaki yansımasını görme imkânımız olmuştur. Dönem dönem çıkarılan kânunnameler unutulmayarak burada verilen cezalarla uygulamada verilen cezaların karşılaştırılması yapılmıştır. Bu çalışma şeriyye sicillerinin fazlalığı sebebiyle öncelikle Üsküdar daha sonra Hasköy ve Eyüp bölgelerinden XVI, XVII, XVIII. yüzyıllardaki bazı defterler baz alınarak hazırlanmıştır. Doktrinde verilmesi gereken cezayla uygulamada verilen cezalar arasında tespit edilen farklılıkların muhtemel sebepleri araştırılmıştır. Konuyla ilgili davalara gerekli görülen yerlerde tez metninde, bazı durumlarda ise dipnotta yer verilmiştir"
