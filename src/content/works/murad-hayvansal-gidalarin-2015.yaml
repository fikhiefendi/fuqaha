abstract: "Bu tez hayvan kesimine ve hayvansal ürünlere ait yöntem ve hükümleri içerisinde barındırmaktadır. Bunun yanında bazı modern uygulama yöntemleri ile paketlenen ve dondurulan büyükbaş ve küçükbaş hayvan eti, kuş, balık, yoğurt, peynir, yağ ve hayvansal yağlar gibi gıdaları ihtiva eder. Bu modern uygulamalar fukahanın fıkıh kitaplarında belirttiği usullere dayandırılmasına ihtiyaç vardır. Bu alandaki çeşitli sorunlar ve modern uygulamalar arasında bağ kurulmaya çalışılacaktır."
