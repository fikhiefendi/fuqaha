abstract: "Bu çalışmanın amacı 26/09/2004 tarih ve 5237 sayılı Türk Ceza Kanunu'nun 154'üncü maddesinde üç fıkra hâlinde düzenlenen hakkı olmayan yere tecavüz suçlarının ceza hukuku bakımından ifade ettiği anlamları ve yöneldiği gayeyi tespit etmektir. Bu doğrultuda, ilgili hükümlerin ceza hukuku disiplini çerçevesinde incelenmesi hedeflenmektedir. Bu kapsamda, öğretide ilgili hükümler ile alâkalı yapılan yorumlar ve öne sürülen görüşler ve konu hakkında verilmiş yargı kararları incelenerek hükmün gerek zatında gerekse uygulamasındaki yerindeliği tartışmaya açılacaktır. Bu tez çalışmasında, ilgili maddede düzenlenen suç tiplerinin ceza hukuku sistematiğine göre incelenmesinin yanı sıra, suç tiplerinin temelinde yatan haksız fiillerin İslâm Fıkhı'nda nasıl düzenlendiği, cumhuriyetin kurulmasından sonra nasıl bir tarihsel seyir izlediği ve Alman hukukunda ilgili fiillerin ne şekilde cezalandırıldığı tespit edilmeye çalışılacaktır."
