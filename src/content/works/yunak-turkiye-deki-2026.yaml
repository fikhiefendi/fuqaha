abstract: "Türkiye'deki katılım bankacılığının hukuksal zeminini ve İslam hukuku prensipleriyle olan uyumunu odağına alan bu araştırma, finansal sistemlerin günümüze uzanan tarihsel gelişimini ve geleneksel bankacılığın küresel ölçekteki konumunu inceleyerek başlamaktadır. Çalışmanın temel eksenini, katılım bankacılığının anayasa, kanun ve yönetmelikler taranarak normatif dayanaklarının tespiti ile bu sistemin Türk hukukuna entegrasyon sürecinde karşılaşılan mevzuat eksikliklerinin ortaya konulması oluşturmaktadır. Araştırmada mudârebe, murâbaha ve müşâreke gibi temel finansman modelleri; TTK, TMK ve TBK gibi pozitif hukuk metinlerinin ilgili hükümleriyle kıyas metodu kullanılarak analiz edilmiş; bu doğrultuda katılım bankacılığı uygulamalarının mevcut mevzuatla uyumu ile sistemde karşılaşılan sorunları kıyas metodu kullanılarak analiz edilmiştir. Devamında katılım bankaları çerçevesinde düzenlenen sözleşmeler ve içeriğinin esasa dair uyumsuzlukları saptanarak incelenmiştir. Netice itibarıyla araştırma, katılım bankalarının pozitif hukuktaki düzenleniş şekliyle birlikte mevcut sorunların bir kısmını incelerken; bu sistemi hem pozitif hukuk hem de İslam hukuku açısından çift yönlü bir analize tabi tutmuştur. Bu sayede, katılım bankalarının hukuki zemini açısından daha sağlam bir temele oturtulmasına katkı sunulması amaçlanmıştır."
