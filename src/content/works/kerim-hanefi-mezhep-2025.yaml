abstract: "Bu çalışma, Osmanlı dönemine ait İstanbul Kadı Sicilleri'nde kayıtlı evlilik nafakası uygulamalarını, İslâm hukukunun özellikle Hanefî mezhebi çerçevesindeki kuramsal ilkeleriyle karşılaştırmalı olarak incelemeyi amaçlamaktadır. Evlilik nafakası, İslâm aile hukukunun temel müesseselerinden biri olup, evlilik birliği içinde ve sonrasında kadının ekonomik güvenliğini teminat altına almayı hedefleyen hukukî bir yükümlülük olarak değerlendirilmiştir. Bu bağlamda çalışmada, evlilik nafakasının fıkhî arka planı ile Osmanlı yargı pratiğinde ne şekilde işlevselleştiği, arşiv belgeleri ışığında somut örnekler üzerinden analiz edilmiştir."
