abstract: "Bu çalışmada, İslâm hukukunda önemli bir yer işgal eden vakıf konusu, ayrıntılı bir şekilde ele alınmıştır. Konu, İslâm hukuku mezhepleri arasında karşılaştırmalı olarak, tarafların delillerinin zikredilmesi ve yer yer tercihe gidilmesi suretiyle açığa kavuşturulmaya çalışılmıştır. Çalışmamızın amacı, İslâm dininin büyük önem atfettiği vakıf konusunun, geçmişten günümüze ortaya çıkışını, toplumsal etkilerini, mahiyetini ve hükümlerini, özellikle fıkhî boyutunu, İslâm âlimlerinin görüşleri ekseninde açıklamaktır. Vakıf müessesesinin ele alındığı bu çalışmamız, üç bölümden oluşmaktadır. Birinci bölümde, vakfın kavramsal çerçevesi başlığı altında vakfın sözlükve terim anlamlarına değinilmiş, mezhep âlimlerinin tanımlarına yer verilmiştir. İkinci bölümünde ise, vakfın genel çerçevesi ele alınmış, bu kapsamda vakfın türleri ve konusu, genel hükümleri ve vakfın tamamlanması için gereken şartlar ele alınmıştır. Son bölümde ise vakfın rükünleri olan; vakfeden, mevkûf, mevkûfu aleyh ve sıyga konuları işlenip bunlarla ilgili şartlarincelenmiştir. Böylece bu çalışmada, vakıf müessesinin fıkhi boyutunu,mezhep âlimlerinin görüşleri doğrultusunda, detaylı bir şekilde incelemeye çalıştık."
