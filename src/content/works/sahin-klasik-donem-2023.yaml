abstract: "Bu çalışma, gerektirdikleri şerʿî hükümler açısından birbirleriyle tezat teşkil eden rivâyet gruplarına yönelik Hanefî yaklaşımını konu edinir. İlgili doğrultuda söz konusu haberlerdeki teʿâruzun giderilmesi amacıyla geliştirilmiş olan nesih, tercih, teʾvîl ve tesâkut yöntemlerinin Hanefîler tarafından uygulanışını araştırmakta, incelemekte ve değerlendirmektedir. Gerçekleştirilen bu faaliyetler aracılığıyla geniş kapsamlı ve özel odaklı olmak üzere iki farklı türde hedef gözetilmektedir. Geniş kapsamlı amaç, usûl eserleri kapsamında Hanefî âlimlerin, söz konusu rivâyet malzemesine yönelik korumacı bir yaklaşıma sahip olup olmadıklarını tespit etmektir. Özel odaklı amaçlar, usûl eserleri kapsamında Hanefî âlimlerin bahsi geçen yöntemlerden öncelikli olarak hangisine başvurduğu, Ebû Hanîfe'nin hadis tenkidine ilişkin günümüze ulaşmış açıklamalarının sonraki dönem âlimlerin muʿâraza yaklaşımlarına etkisinin olup olmadığı, Hanefî usûl ve furûʿ eserlerindeki muʿârız haberlere ilişkin yaklaşımların birbirleriyle ne derece örtüştüğü hususunu ortaya koymak şeklinde özetlenebilir. Geniş kapsamlı ve özel odaklı hedeflerin klasik dönem Hanefî usûl ve furûʿ eserleri kapsamında ele alındığı bu araştırmada nitel araştırma yöntemlerinden doküman incelemesi ve içerik analizi teknikleri kullanılmaktadır. Araştırma sonucunda usûl eserleri üzerinden yapılan araştırmalar, muʿâraza durumunda Hanefî âlimlerin genel itibarıyla her iki rivâyet grubunu da“amel edilebilir”kılma eğiliminde olmadıklarını göstermiştir. Tezatlığı giderme yöntemleri arasında Hanefî âlimlerin öncelikli olarak neshe başvurduğu sonucu ortaya çıkmıştır. Söz konusu yöntemlerin uygulanma sıklığı konusunda yine Hanefî âlimler tarafından sıklıkla neshin gündeme getirildiğini söylemek mümkündür. Ebû Hanîfe'nin hadis tenkidine dair açıklamalarının sonraki dönem âlimler üzerinde önemli oranda etkisinin olduğu tespit edilmiştir. Araştırma kapsamındaki furûʿ eserleri üzerinden yapılan incelemelere göre bahse konu rivâyet gruplarının usûlde olduğundan çok daha farklı biçimlerde yorumlandığı ve değerlendirildiği görülmüştür. İhtilaflı rivâyet grupları usûlde daha ilkesel biçimde çözümlenirken furûʿ eserlerinde bu konuda daha esnek ve teʾvîle daha yakın biçimde hareket edildiği görülmüştür."
