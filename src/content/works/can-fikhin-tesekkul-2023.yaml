abstract: "Müslümanların inanmış oldukları din onların dini otorite anlayışlarını belirlemiştir. Zamanla inandıkları dinin temel verileriyle tarihsel tecrübeleri birleştirerek dini, siyasi ve hukûkî olanı iç içe geçirdiler. Fıkıh veya İslam Hukuku dediğimiz olgu müslümanların din anlayışlarıyla onların siyasi ve hukuki faaliyetlerinin birleşimidir. Fıkıh faaliyetini üstlenen fukahânın otorite olarak tarih sahnesine çıkışında dini, siyasi ve hukuki otoritelerin birleşiminin etkileri söz konusudur. Fukahâ otoritesi klasik dönemde ve günümüzde müslümanların başvurduğu en büyük otoritedir. Bu otoritenin ortaya çıkışı, tarihsel kökleri, doktrine dönüşmesi ve bugün tartışılması birbirinden kopuk ele alındığı için sıkıntılara yol açmıştır. Bu süreçlerin birlikte analiz edilip fukahâ otoritesinin oluşumunu ve bu oluşumun nasıl sonuçlandığını ortaya koyup günümüzdeki otoriteye başvurma meselesinin ne anlama geldiği ortaya konulmaya çalışılacaktır."
