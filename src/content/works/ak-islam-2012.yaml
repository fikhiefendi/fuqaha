abstract: "İslam Hukukunda Şer?îlik? konulu çalışmamız, üç bölümden oluşmaktadır. Giriş kısmında çalışmanın önemi, amacı, yöntemi ve kaynakları hakkında bilgi verilmiştir.Birinci bölümde İlâhî iradenin şer?îliği ele alınmış, şer?îlikle ilgili kavramlar tahlil edilmiş, İlâhî iradenin şer?î mahiyette tezahürü ve beşerî iradeye değer vermesi konuları tetkik edilmiştir.İkinci bölümde beşerî iradenin şer?îliği konu edinilmiş, beşer iradesinin mahiyeti ve şer?î kaynak oluşuna değinildikten sonra beşerî iradenin şer?îlik kazanmasında geçerli ölçütler tespit edilmiş; şer?îlik alanının kaynaklarına, mahiyetine ve işlevlerine ilişkin ölçütler değerlendirildikten sonra, beşerî iradenin şer?îlik kazanmasının sonuçları epistemolojik değeri ve bağlayıcılığı açısından ele alınmıştır.Üçüncü bölümde şer?îlik alanı dışında kalan beşer iradesi mahsulleri başlığı altında,ilâhî iradeyle beşerî iradenin uyuşmaması ve şer?îlik alanında parça-bütün ilişkisinin bozulması konuları üzerinde durulmuştur.Sonuç kısmında ise İslam hukukunda şer?îlik adıyla yapmış olduğumuz çalışmadan elde ettiğimiz neticeler ifade edilmiştir."
