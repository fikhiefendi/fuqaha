abstract: "Hanbelî mezhebinin diğer mezheplere nazaran daha geç bir dönemde bağımsız bir bütünlüğe kavuşmuş olmasına rağmen diğer fıkıh çevrelerine paralel bir mezhepleşme süreci geçirdiği görülmektedir. Mezhebin teşekkülünü tamamlayıp klasik döneme girmesi, mezhebin kendi dönemine kadarki fıkhî birikimini sistematik bir biçimde, gelişen fıkıh diliyle ifade eden, Ebu?l-Kasım el-Hırakî (334/946) tarafından kaleme alınan ve mezhebin ilk el kitabı olarak kabul edilen el-Muhtasar isimli eserle gerçekleşmiştir. Bu eser Ahmed b. Hanbel?den kendisine kadar daha ziyade rivayet diliyle ve klasik dönemdeki fıkıh sistematiğinden uzak bir şekilde tedvin edilen fıkhî malzemeyi klasik dönemde görmeye alıştığımız üslûp ve sistematiğe yaklaştırarak yeniden ifade etmiştir.Gerek üslûp gerekse sistematik açıdan taşımış olduğu özellikler el-Muhtasar?ın mezhep çalışmalarında merkezî bir konumda olmasına sebep olmuştur. Eserin telif edildikten çok kısa bir süre sonra şerh edilmesi, sonraki dönemlerde nazmedilmesi, esere zevâid yazılması ve benzeri birçok çalışma onun telif geleneği oluşturma noktasında etki gücünü göstermektedir. Tabakat ve tarih kaynaklarında eserin ezberlendiğine, rivayet edildiğine ve çoğaltıldığına dair kayıtlar tedris faaliyetlerinde yoğun bir şekilde kullanılmış olduğuna işaret etmektedir. Eserdeki ibare ve cümle yapılarının mezhep eserlerinde aynı şekilde veya kısmî değişikliklerle kullanılmış olması da eserin muhtasar metin telifindeki etki gücünü göstermektedir. Eserin bu kadar yaygın bir etki gücüne sahip olması ve öncesinde bu özellikleri hâvî bir eserin bulunmaması sebebiyle el-Muhtasar, Hanbelî mezhebi için teşekkül döneminin sona erip klasik devrin başlamasının sembolü olarak edilebilir."
