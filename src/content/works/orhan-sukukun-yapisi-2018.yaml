abstract: "Katılım bankacılığının fon kullandırma yöntemlerinden olan sukuk, İslami piyasaların en çok kullanılan enstrümanlarından biridir. Dünya genelinde ve ülkemizde yapısı ve işleyişi uygulama farklılıkları gösterebildiğinden bu çalışmada sukuk, öncelikle katılım bankacılığının işleyişi içerisinde ele alınmış, ardından dünya ve Türkiye uygulamaları irdelenmiş; son olarak da ülkemizdeki uygulamasında özendirici yönler ve sorunlu noktalara değinilmiştir."
