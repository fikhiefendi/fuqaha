abstract: "Bu tezde tasavvufun teşekkül süreci, şeriat-hakikat ilişkisi sorunu bağlamında ele alınmaktadır. Tasavvufun yaygınlaştığı süreçte sûfîler, sosyal ve entelektüel hayatta yer edinmelerini zorlaştıran birtakım problemlerle yüz yüze gelmişler ve dinin şeriat-hakikat alanları arasında mutlak bir ayrımın olamayacağını dile getirerek bu sorunu aşmaya çalışmışlardır. Bu bağlamda tasavvuf başlıca üç aşamada gelişim göstermiştir. Eleştiri aşamasında sûfîler, toplumsal ve dinî hayattaki bozulmalara dikkat çekmişlerdir. Bu noktada zühd literatüründen beslenen sûfîler, tasavvufun peygambere dayanan bir tavır olarak kesintisiz bir süreçte gelişim gösterdiğini savunmuşlardır. Sûfîlerin daha sistematik ve nazari görüşler öne sürmeye başladıkları kriz aşaması ise tasavvuf ile dinî ilimler arasındaki etkileşimin açıkça görüldüğü bir devredir. Üçüncü olarak uzlaşı aşamasında sûfîler, şeriat-hakikat alanları arasında bir derecelenmeden bahsederek tasavvufu dinî ilimlere bağlı fakat kendi özgün karakterini koruyan bir din ilmi olarak tesis etmişlerdir. Çalışmamızda mukayeseli bir yöntem benimsedik. Bu çerçevede, ele aldığımız konuların kelam ve fıkıh gibi dinî ilimlerdeki karşılıklarını belirtmeye özen gösterdik. Binaenaleyh çalışmamızda ulaştığımız en önemli netice şudur: lafız-mana, zahir-batın gibi kavramlar altında da tartışılan şeriat-hakikat ilişkisi sorunu, sadece tasavvufun değil bütün dinî ilimlerin bütün dönemlerdeki en mühim problemidir ve bu yönüyle tasavvufun dinî ilimlere eklenebileceği temel meseledir. Bu meyanda tasavvuf, öncelikle dinî ilimlerde ortaya çıkan kuralcı ve formel din anlayışına bir tepki olarak gelişim göstermiş, sonra kendisi bir din ilmi hüviyeti kazanmış, böylece iman ve tevhid gibi konulardaki tartışmaları ikmal eden çözümler üreterek daha dinamik bir dinî hayat anlayışını savunmuştur."
