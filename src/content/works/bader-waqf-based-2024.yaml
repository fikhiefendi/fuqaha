abstract: "Gelişmekte olan diğer birçok ülkede olduğu gibi Libya'da özel sektör, özellikle de küçük işletmeler, dış finansmanı güvence altına almakta zorlanmaktadır. Finansmana erişim eksikliği, Libya'da KOBİ'lerin gelişimini engelleyen en büyük engellerden biridir. Bu tezin amacı, Libya'daki küçük işletmelerin finansman kaynaklarındaki eksiklik sorununa, İslam hukuku ilkelerine uygun ve ek bir finansman seçeneği olacak bir finansman kaynağı sağlayarak çözüm sağlamayacak bir çerçeve geliştirmektir. Mevcut finansman kaynakları dış kaynaklar (borç şeklinde bankalardan) ve iç kaynaklar (kişisel tasarruflar, akrabalar, arkadaşlar ve ortaklar) olarak sınıflandırılabilir. Bu çalışmada betimsel yaklaşım ve tümevarımsal yaklaşım benimsenmiştir. Araştırma bir dizi ilgi çekici bulgu ortaya çıkarmıştır. Libya'daki özel sektörün yüzde 88,5'inin küçük işletmelerden oluşmaktadır. Libya'daki küçük işletmelerin sahip/yöneticileri, başlangıç ve genişleme aşamalarında işletmelerini finanse etmek için ticari kredinin yanı sıra büyük ölçüde iç kaynaklara (kendi tasarrufları, aileleri, arkadaşları, dağıtılmamış karları ve ortakları) dayanmaktadır. Libya'da bankacılık sektörü, küçük işletmeler için ana ve tek dış finansman sağlayıcısı olmaya devam etmektedir ve bu kaynağa erişimin, yüksek faiz oranları, finansman ihtiyacı gibi bir dizi zorluk ve kısıtlama nedeniyle işletmeler için oldukça zorlayıcıdır. Bankadaki karar vericilerle yakın ilişki, çok fazla bürokrasi, yüksek teminat gereklilikleri, çok fazla belge gerekliliği ve yavaş karar alma (yüksek derecede merkezileştirilmiş) işletmeleri zorlayan başlıca unsurlardır. Tüm bu engellerin yanında faizle ilgili dini hususların da gözden kaçırılmaması gerekir. Çalışma, Libya'da bağış fonu fikrinin benimsenmesinin ve uygulanmasının, Libya'nın para vakfını kabul eden en tanınmış mezheplerden biri olan Maliki mezhebine bağlı olması ve mevcut vakıf kanununun bazı önemli hususlar içermesi nedeniyle mümkün olduğunu göstermektedir. Çalışma, küçük işletme sektörü için finansman bulunamamasıyla ilgili sorunları hafifletmek ve ele almak amacıyla politika yapıcıların dikkate alması gereken bir dizi öneri sunmaktadır."
