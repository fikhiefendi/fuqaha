abstract: "Katılım bankacılığı Türkiye, MENA bölgesi ve diğer pan-İslam ülkelerindeki faizsiz bankaların oluşturduğu sistemin ortak ismidir. Bu bankacılık sistemi, İslam coğrafyasında oluşturulmuş bir tür finansal aracılıktır. Faiz, riskli ve belirsiz işlemlere, alkollü içecek ticareti, bahis, kumar gibi toplumun sosyal yapısına zarar verdiği düşünülen faaliyetlerle bağlantıya izin vermez. Bu konulara duyarlı olanların birikimlerini ve/veya malları ortaklık esasına göre sunarak bankacılık sistemine kazandırmayı amaçlar. Her İslami banka faizsiz bir banka olmasına rağmen her faizsiz banka İslami banka olmak zorunda değildir. Ancak dünyadaki hemen hemen her faizsiz banka, İslami bankacılık bakış açısıyla faaliyetlerini sürdürmektedir. Kuralları Kur-an'a dayanan bu bankacılık sisteminin işleyişi birçok yönden diğer bankalardan farklı olduğu için genel kabul görmüş muhasebe uygulamaları bu bankaların taleplerine cevap vermekte yetersiz kalmıştır. Bankalar kendi kayıt ve raporlama tekniklerini geliştirmeye çalıştıklarında karşılaştırılabilirlik ve güvenilirlik sorunları ortaya çıkmıştır. Bu nedenle, bazı ulusal ve uluslararası kuruluşlar, dünya çapında faaliyet gösteren İslami bankalar arasında tekdüzeliği sağlamak için 1990'lı yılların başından beri muhasebe standartları geliştirmeye çalışmaktadır. Bu standartlar ile hem raporların daha doğru ve kullanışlı olması hem de ilgili kurumların birbirleriyle karşılaştırmalarının daha kolay olması planlanmaktadır"
