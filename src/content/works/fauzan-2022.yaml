abstract: "Bu araştırmanın konusu, pek çok kişinin bilmediği ibadetle ilgili çağdaş musibetlerin hükümleri ile ilgili olup, araştırmayı yazarken betimsel analitik ve karşılaştırmalı yöntemi kullandım.İlk bölüm Dr.Wahba Al'ın tercümesi hakkındadır. -Zuhaili, ikinci bölüm temizlikle ilgili çağdaş hükümler hakkında, üçüncü bölüm ise namaz ve oruçla ilgili çağdaş hükümler hakkında, dördüncü bölümde ise insan vücudu ile ilgili çağdaş hükümler hakkında yaptım. Dr. Wahba Al-Zuhaili'nin fetvadaki metodolojisini, Kitap ve Sünnet'ten akıl yürütmeyle başladığı, ardından ileri hukukçuların görüşlerinden bahsettiği ve çağdaş gerçekliğe en uygun ve en kolay olduğunu düşündüğü için açıkladım ve Dr. Wahba Al-Zuhaili ve diğer çağdaşların karar verdiği gibi, insanların hayatlarını kolaylaştırmada ve bu konularda cehalet yaratmada insanların çağdaş meselelerin hükümleri hakkındaki bilgilerinin önemine işaret ettim."
