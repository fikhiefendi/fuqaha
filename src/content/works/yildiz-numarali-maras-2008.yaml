abstract: "Osmanlı Devleti'ninklâsikdönemdeki idari yapılanması 19.y.y.'da da devam etmiştir. Osmanlı ülkesi idari birim olarak beylerbeylik, sancaklar ve kazalara ayrılmıştır. Sancak ve kazaların sosyal, dini, hukuki ve idari konularla ilgili meseleleri, kadıların sorumlulukları arasında idi. Kadılar şer'i ve hükmi muamelatta, kendilerine verilen beratta gösterilen vazifeleri görüp, Hanefi mezhebi üzerine karar verirlerdi, Araştırmamızın konusu olan Mar'aş'ın 232 Nolu Şer'iye Sicili, 1879 senesini kapsamaktadır. Bu tarihte Maraş, Halep Vilayeti'ne bağlı bir sancaktır. 232 Nolu Mar'aş Şer'iye Sicili'nin 1?75 sahifeleri arasındaki kısım araştırma konumuzdur. 1879'daki Maraş şehir tarihinin dini, hukuki, idari ve demografik yapısı hakkında ayrıntılı bilgiler bulunmaktadır.Belgelerde dikkat çeken bir husus gayrimüslim halk ile müslüman teb'a ilişkilerinin içiçe geçmiş olduğudur. Bu durum Osmanlı Medeniyetinin dinî yapısındaki farklı kesimlere adaletle hükmeden ve hoşgören tutumunu bir kez daha ortaya koymaktadır. Ayrıca demografik açıdan gayrimüslim kitlenin azımsanmayacak yoğunlukta olduğunu da ifade etmek gerekmektedir."
