abstract: "Tez, basın yayın organlarındaki yatırım konseptini ele almakta ve tezin başlığında yer alan kavramları açıklamaktadır. Aynı zamanda İslam hukuku ve fıkhi deliller çerçevesinde basın yayın organlarındaki yatırımın hükmünü işlemektedir. Daha sonra basın yayın organlarındaki yatırımla ilgili İslam şeriatının belirlediği en önemli akidevi ve ahlaki esasları açıklığa kavuşturmaktadır. Bununla birlikte tezimiz, yatırımcıların söz konusu esaslara bağlı kalmaları durumunda ortaya çıkacak sonuçları gözler önüne sermektedir. Çalışmamız, yatırımın teklifî hükmü, yatırımcılar ve yatırımı denetleyen kurumlarla ilgili hükümlerle son bulmaktadır. Böylelikle tezimiz, sonuç kısmında en önemli sonuçlara ulaşmaktadır. Tezimiz, Kuran ve sünnetten birçok delili de içermektedir. Daha doğrusu düşünceleri kanıtlamaya çalışırken Kur'an ve sünnetten birçok delilin içeriğinden (medlûl) destek almaktadır. Vatandaşın dikkat etmesi gereken birçok yerde soru ve cevap şeklinde olmuştur. Daha sonra tezle ilgili ortaya çıkabilecek sorunlara değinmiştir. Anahtar Kelimeler Kur'an- karim, Kaideler, Yatırım, Şeriat, Basın ve Yayın Organları"
