abstract: "Dünyada ve Türkiye'de katılım finans sektörünün gelişimi için son yıllarda önemli adımlar atılmıştır. Katılım finans sektörünün büyümesi için atılan bu adımların başında finansal kaynak ve ürün çeşitliliğinin sağlanması ve gerekli yasal düzenlemelerin hayata geçirilmesi gelmektedir. Katılım finans sektöründe en fazla paya sahip olan katılım bankalarının hızlı büyüme göstermesinde bu faktörler etkili olmaktadır. Katılım bankalarının ülke ekonomisine daha fazla kaynak sağlayabilmeleri ve bankacılık sektöründeki paylarını arttırabilmeleri adına güçlü sermaye yapısına sahip olmaları gerekmektedir. Çalışmada, güncel yasal düzenlemeler ve yeni uygulamalar ışığında Türkiye'deki katılım bankalarının yurt içinden ve yurt dışından sağladıkları fon kaynakları incelenmiştir. Ayrıca yeni bir fon toplama ürünü olarak“Enflasyona Endeksli Vadeli Karz Hesabı”modeli önerisi sunulmuştur. Çalışmada, tasarruf sahiplerinin Türk Lirası cinsinden fonlarını enflasyona karşı korumayı amaçlayan enflasyona endeksli vadeli karz hesabının yapısı, işleyişi, diğer fon toplama ürünlerinden farkı, fıkhi dayanakları ve sektörde uygulanabilirliğini araştıran mülakat görüşmelerinin sonuçlarına yer verilmiştir. Enflasyona endeksli vadeli karz hesapları modelinin İslami kurallara ve katılım bankacılığı prensiplerine uygun bir şekilde hayata geçirilmesi sonucunda, katılım bankalarına uzun vadeli fon kaynağı sağlanması ve finansal sisteme girmeyen âtıl fonların ekonomiye kazandırılması beklenmektedir. Bu hesap ile milli paramıza karşı duyulan güven arttırılarak Türk Lirasının ve ülke ekonomimizin güçlenmesine katkı sağlanabilir. Bu çalışmanın sonuçları, sektör temsilcileri için politikalar önermekte, araştırmacılar için yol gösterici bir kaynak niteliği taşımaktadır."
