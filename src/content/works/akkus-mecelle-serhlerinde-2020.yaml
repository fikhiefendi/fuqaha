abstract: "Örf bütün hukuk sistemlerinde mühim bir yere sahiptir. İlk çağlardan itibaren insanlar arası ilişkilerin sürdürülmesinde vahiy ile birlikte örf önemli görevler üstlenmiştir. Tarihi süreçte bu iki kavram arasında farklı seviyelerde devamlı irtibat olmuştur. Şâri', sosyal bir gerçeklik olan örfe itibar etmiş, pek çok konunun detay hükmünü ona havale etmiştir. Dolayısıyla İslam hukukçuları, örfü dikkate almış fakat örfün ne tür bir delil olduğu noktasında ihtilaf etmişlerdir. Cumhura göre, örfle ancak şer'î bir delile dayanması durumunda amel edilebilir. Örfün tanımı usûl-ü fıkıh eserlerinde 8. yüzyıl gibi geç bir dönemde yer almıştır. Ancak ilk dönemlerden itibaren fürû-u fıkıhta uygulanıyor olması örfün İslam hukuku için önemli bir kaynak olduğunun göstergesidir. Örfün hukuki konumunun belirlenmesi, hukukçuya tanınan alanın sınırlarının bilinmesi bakımından önemlidir. Çünkü hukukçu, klasik metinlerde yer alan örfî hükümleri değerlendirme, yorumlama ve güncelleme hususunda örfe müracaat edecektir. Çalışmamız, İslam hukukunda örf ve âdetin delil oluşunu Mecelle'nin küllî kâideleri çerçevesinde incelemeyi hedeflemektedir. Giriş kısmında Mecelle'nin hazırlanış süreciyle birlikte kâide kelimesi ve eş anlamlılarına yer verilmiştir. Birinci bölümde, İslam hukukunda örf ve âdet, örf ve âdet kelimelerinin tanımı, örf âdetin İslam hukukunda delil oluşu, muteberliğinin şartları ve çeşitleri başlıklarıyla desteklenerek açıklanmıştır. İkinci bölümde ise, Mecelle'de yer alan küllî kâidelerin 36- 45. maddeleri üç farklı şerhten günümüz Türkçesine aktarılmış, sonuç kısmında kıyaslanarak değerlendirme yapılmıştır."
