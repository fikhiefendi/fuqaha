abstract: "Günümüzde teknolojinin gelişmesiyle birlikte ve paranın kullanmasından doğan bazı sakıncaları gidermek için kredi kartları uygulamaya konuldu ve bugünkü gelişmiş dünyanın, en önemli ödeme araçlarından biri sayılmaktadır. Kredi kartlarının ekonomik boyutlarının yansıra hukuki boyutları ve özellikle kredi kartı ilişkilerini oluşturan tarafalar açısından da önem taşımaktadır. Sunmuş olduğumuz bu çalışmada Türkiye Cumhuriyetinde ve İran İslam Cumhuriyetinde kredi kartların hukuki durumu incelenmeye ve karşılıklı bilgi aktarmaya çalışılmıştır. Bu çalışmanın amacı, Türkiye'de ve İran'da kredi kartlarını incelemek ve özellikle İran açısından iyi uygulama örneklerinden istifade edebilmektir. Kredi kartları İran'da yeni uygulamaya girdiği için henüz deneme sürecindedir. Bu süre içerisinde bazı sorunlarla karşılaşılması doğal karşılanabilir. Diğer yandan, bu sorunları gidermek için başka ülkelerin tecrübelerinden yararlanmakta fayda bulunmaktadır. Bu açıdan kültürel olarak yakın bir ülke olan Türkiye'nin İran için en uygun örneklerden birisi olması sebebiyle her iki ülke uygulamaları ele alınmıştır. Yüksek lisans olan çalışmamızda kredi kartlarla ilgili genel bilgiler, ilgili kanunlar, kredi kartların oluşturan sözleşmeler, tarafların yükümlülükleri ve haklarına değinerek kredi kartların hukuka aykırı kullanılmasının şekilleri ve aykırı kullanımından doğan sorumlulukları da açıklamaya çalışılmıştır. Ayrıca İran'da kredi kartların durumunu ve uygulamada karşılaşan sorunları ele alınarak, İran hukukunda kredi kartların uygulanması için önerilen yöntemlerin ve özelliklede son yıllarda uygulanan murabaha yönteminin üzerinde durulmuştur. Bu incelemede banka kredi kartlarını, Türk hukukunun Banka Kartları ve Kredi Kartları Kanunu ve onun Yönetmeliği, Tüketicinin Korunması Hakkında Kanun ve Türk Borçlar Kanunu ışığı altında ve İran'da yeni uygulanan murabaha akti çerçevesinde açıklamaya çalışılıp karşılıklı önerilerde bulunulmuştur."
