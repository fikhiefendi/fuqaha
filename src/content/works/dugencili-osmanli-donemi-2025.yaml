abstract: "İslam hukuk doktrininde bağy terimi,“güç sahibi müslüman bir topluluğun kendilerince bir gerekçeye dayanarak meşru devlet başkanını görevden uzaklaştırmak amacıyla haksız bir şekilde isyan etmesi”şeklinde tarif edilmektedir. Vukuu halinde devlet, isyancıların ikna edilerek içinde bulundukları isyan halini terk etmeleri için müzakere süreci işletebilecek veya isyanın bastırılması amacıyla silahlı mücadele yürütebilecektir. İkna yöntemiyle isyanın savuşturulması yönündeki hüküm, isyancıların müslüman olmaları nedeniyle canları ile mallarının muhafaza edilmesinin esas olduğu yönündeki ilkeye dayandırılmaktadır. Dolayısıyla da kendilerine zarar verilmeden sürecin sonlandırılması önceliklidir. Silahlı mücadele ise isyanın telafisi güç veya imkânsız neticelere sebebiyet vereceği yönünde bir kanaate ulaşılması halinde başvurulacak bir yöntemdir. Bağy, Osmanlı Devleti'nin egemenlik sürdüğü zaman diliminde teşebbüs edilmiş veya başarıya ulaşmış ya da devlet başkanı ve yönetim kademesi tarafından tehlike olarak görülmüş bir eylem olarak hep gündemde olmuştur. Nitekim dönemin üç hukuk kaynağında; fıkıh kitapları, şeyhülislam fetvaları ve kanunnâmelerde yer almıştır. Konunun Osmanlı döneminde oluşan yazılı fıkhi ve hukuki birikim içinde bir bütün olarak nasıl yer aldığının tespit edilmesi, anılan fıkıh ve hukuk kaynaklarını birlikte konu edinen ve bütüncül şekilde inceleyen, ayrıca birbirleriyle mukayese etmek suretiyle fıkhi açıdan değerlendirmeye tabi tutan bir araştırma oluşturma düşüncesi, bu tezin ortaya çıkmasında etken faktörlerdir. Bu çalışmada, bağy konusunun sözü edilen üç kaynak üzerinden incelenmesi, böylece meselenin hem teorik hem de pratik yönünün ele alınması amaçlanmıştır. Çalışmanın hazırlanışı esnasında nitel araştırma yöntemi kullanılmış, elde edilen veriler yorumlayıcı paradigma ile değerlendirmeye tabi tutulmuş, ayrıca tümevarımcı içerik analizi yöntemine de başvurulmuştur. Veri toplama yöntemi olarak ise doküman inceleme tekniği uygulanmıştır. İlaveten, elde edilen verilerin önemli bir kısmı mukayese edilerek işlenmiş, bu suretle çalışmada karşılaştırmalı analiz yöntemi de uygulanmıştır. Çalışma neticesinde bağy konusunun döneme ait metin ve şerh türü fıkıh kitaplarında, Osmanlı öncesinden tevarüs eden anlayışın devamı ve benzeri niteliğinde işlendiği görülmüştür. Mukayese sonucunda ise eserler arasında benzerlik bulunduğu görülmekle birlikte kısmi farklılık da tespit edilmiştir. Diğer taraftan Tanzimat dönemine kadar yürürlükte olan kanunnâmelerde doğrudan ve açıkça bağy konusuyla ilintili bir bulguya rastlanmamıştır. Ancak Fatih Kanunnâmesinde şehzade katlinin cevazıyla ilişkilendirilen bir kanun maddesinin, isyan potansiyeli taşıdığı düşüncesiyle tüm şehzadelerin katli için düzenlendiği, dolayısıyla hanedan içinden fiilen isyan edenlere evleviyetle şamil olduğu değerlendirilmiştir. Tanzimat sonrası kanunnâmelerde ise“bağy”,“devlete isyan”ve“isyan”sözcüklerinin kullanılmasıyla konuya yer verildiği saptanmıştır. Öte yandan, bağy eylemi vaki olduktan sonra ya da bu yönde bir girişim veya hazırlık bulunduğu anlaşıldığında, isyanın bastırılması veya hazırlığının savuşturulması için alınacak tedbirlerin meşruiyetini temin amacıyla hukuki bir merci olan şeyhülislamlık makamının fetvalarına müracaat edilmiştir. Bu çerçevede, fetva mecmuaları ve fetva metinlerinden elde edilen bağy konulu kırk dört fetva incelenmiş, ayrıca Osmanlı tarihinin bütüncül bir şekilde incelenmesi neticesinde kırk dört fetvanın daha bağy eylemini konu edindiği tespit edilmiştir. Dolayısıyla toplamda seksen sekiz fetva, fıkhi açıdan ele alınmıştır. Fetvaların çok önemli bir kısmının, isyancılara yönelik kıtâlin helal ve hatta vâcip olduğu yönünde hüküm içerdiği söylenebilir. Aynı zamanda bir meşruiyet kaynağı olarak isyancıların fetvaya müracaat ettiği örnekler de bulunmaktadır. Bu çerçevede ise sultanın görevinden uzaklaştırılmasının meşruiyetine odaklanılmıştır."
