abstract: "Kadı Beyzâvî'nin Envâru't-Tenzil ve Esraru't-Te'vil isimli eseri ile Nesefî'nin Medariku't-Tenzil ve Hakaiku't-Te'vil isimli eseri dirayet metoduyla yazılan temel tefsirlerdendir. Bu itibarla çalışmamızda bu eserlerdeki fikhî ayetlere yaklaşım ve yorumlar, Mâide Sûresi çerçevesinde ele alınıp incelenmiştir. Şafiî Mezhebine mensup Beyzâvî ile Hanefî Mezhebi'ne mensup Nesefî tarafından kaleme alınan tefsirler, fıkhî hüküm içeren ayetler bakımından zengin olduğu için Mâide Sûresi örnek olarak seçilmiştir. Müfessirlerin ahkâm ayetlerini tefsir ederlerken mensubu bulundukları mezhebin görüşlerine ne düzeyde bağlı kaldıkları tespit edilmeye çalışılmıştır. Müfessirlerin ayetleri tefsir ederken kendi mezheplerinin dışında diğer mezheplerin görüşlerini tercih edip etmediklerinin tespiti de amaçlanmıştır. Yine müfessirlerin ilgili âyetleri kendi görüşleri doğrultusunda yorumlarken diğer görüşleri eleştirip eleştirmedikleri, mezhebî görüşlerinin dışına çıkarak objektif bir yorum sergileyip sergilemedikleri gibi hususlar çerçevesinde iki tefsir arasında bir karşılaştırma yapılmıştır."
