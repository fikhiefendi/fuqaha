abstract: "Mehmed Tâhir Münif Paşa 1830-1910 yılları arasında yaşamış Osmanlı devlet adamıdır. Münif Paşa devlet adamlığının yanı sıra döneminin önemli eğitimci ve aydınlarındandır. Aldığı eğitimler ve yurt dışı görevleri sebebiyle Batı uygarlığını yakından tanıyan Münif Paşa Mekteb-i Hukuk-ı Şahane'de hukuk, iktisat, ahlak, felsefe ve mantık dersleri vermiştir. Hukuk alanında kaleme alınan ilk Hukuk Felsefesi kitabı olan Hikmet-i Hukuk Münif Paşa'nın verdiği hukuk felsefesi derslerinde, talebesi Sabit Efendi tarafından tutulan ders notlarının yayına hazırlanmasıyla meydana gelmiştir. Kitap giriş ve iki bölümden oluşmakta olup giriş bölümünde hukuk felsefesi, birinci bölümde genel olarak hukuk ve insan tanımlamaları ve ikinci bölümde insan hak ve hürriyetleri anlatılmaktadır. Çalışmamızda Münif Paşa'nın Hikmet-i Hukuk adlı eserinin sadeleştirilmesi ve eserin İslam Hukuk Felsefesi açısından analizi hedeflenmiştir."
