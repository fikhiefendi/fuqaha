abstract: "Çalışmamızın konusunu, kiralananın devri oluşturmaktadır. Kira sözleşmesinin kurulmasından sonraki bir dönemde, kira konusunun üçüncü bir kişiye devredilmesi halinde, kira sözleşmesi üçüncü kişiye devredilir. Kiralananın mülkiyetini iktisap eden üçüncü kişi, sözleşmenin tarafı haline gelir. Çalışmamızda öncelikle kiralananın devrine ilişkin hükmün tarihi gelişimi üzerinde durulmuştur. Bu kapsamda Mülga Borçlar Kanunu döneminde kiralananın devrinin taşınır, taşınmaz ve gayrimenkul kiraları bakımından kira sözleşmesine etkilerine yer verilerek mevcut uygulama ile farkları açıklanmıştır. Yine hükmün zaman, kişi ve yer bakımından uygulama alanı incelenerek benzer kavramlarla kıyasına yer verilmiştir. 6098 sayılı Türk Borçlar Kanunu'nun 310. maddesi hükmünün uygulanması için gerekli şartlar: geçerli bir kira sözleşmesinin varlığı, kiraya verenin malik olması ve mülkiyetin üçüncü kişiye devridir. Kural bu olmakla beraber şartların istisnaları da yer almaktadır. Çalışmamızda şartlar ve istisnalar detaylı şekilde açıklanmıştır. Kiralananın devri neticesinde kira sözleşmesi kanunen yeni malike devredilir. Devir tarihi itibariyle yeni malik, kira sözleşmesinde kiraya veren sıfatı kazanır. Dolayısıyla bir taraf değişikliği gerçekleşir. Yeni malikin konut ve çatılı işyeri kiralarında edinme nedeniyle sözleşmeyi fesih hakkı bulunmaktadır. Çalışmamızda kiralananın devrinin sonuçları ve devrin sözleşmeden doğan taraf borçları ile şerh edilmiş kira sözleşmeleri bakımından görünümü ifade edilmiştir."
