abstract: "Bu çalışma Hicri 7. yy'da Irak-Kûfe bölgesinde yaşamış Hanefi âlim Abdullah b. Mahmud el-Mevsılî'nin el-İhtiyâr li Ta'lili'l-Muhtâr adlı eserindeki maslahat düşüncesini incelemek üzere kaleme alınmıştır. Çalışma giriş ve iki bölümden oluşmaktadır. Giriş bölümünde Mevsılî'nin hayatından kısaca bahsedildikten sonra maslahat düşüncesinin mahiyeti ve Hanefi fıkhındaki yeri ele alınmıştır. Birinci bölümde el-İhtiyâr'da kulların maslahatını te'min için kullanılan şer'î deliller ve yedi küllî kâide ele alınmıştır. İkinci bölümde ise Mevsılî'nin el-İhtiyâr adlı eserinde verdiği örneklerden yola çıkarak maslahat kavramı ve türleri incelenmiştir."
