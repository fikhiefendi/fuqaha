abstract: "Tez Giriş ('Araştırmanın Konusu ve Önemi', 'Araştırmanın Amacı ve Yöntemi', 'Zemahşerî ve el-Keşşâf Adlı Eseri'), iki bölüm (Birinci Bölüm:'Arap Dilinde Fıkhu'l-Luga', İkinci Bölüm: 'El-Keşşâf'ta Fıkhu'l-Luga Uygulamaları'), Sonuç ve Bibliyografya'dan oluşmaktadır. Tezde Zemahşerî'nin el-Keşşâf isimli eseri fıkhu'l-luga bağlamında incelenmiştir. Arap dili, tefsir ve birçok alanda yetkin bir alim olan Zemahşerî'nin el-Keşşâf isimli tefsirinde fıkhu'l-luga alanına dair yaklaşımları tespit edilmiştir. Zemahşerî'nin fıkhu'l-luga anlayışını tefsir ilmi bağlamında ele aldığımızda dil ile ilgili argümanları eserinde en güzel biçimde yansıttığını görmekteyiz. Tezin Birinci Bölümü'nde Fıkhu'l-Luga'nın kısa tarihçesi verilmiştir ve tarifi yapılmıştır. Daha sonra fıkhu'l-luga'nın konuları sıralanmıştır ve gayesi ifade edilmiştir. Tezin İkinci Bölümü'nde ise, fıkhu'l-luga'nın konuları el-Keşşâf'ta incelenmiş ve dilbilim konularına göre tasnif edilmiştir. Bu yaklaşımla Zemahşerî'nin fıkhu'l-luga hakkındaki açıklamaları tespit edilmiştir."
