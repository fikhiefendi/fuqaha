abstract: "Ticari ve iktisadi hayatta önemli bir yeri olan faiz, etkisi ve uygulanması noktasında tarih boyunca başta semavi dinler olmak üzere beşeri sistem ve ideolojiler tarafından tartışılıp eleştirilmiştir. Yaşadığımız coğrafyanın dini ahlaki ve toplumsal yapısını göz önüne aldığımızda faizli bankalara alternatif faizsiz bankacılık sisteminin oluşması kaçınılmazdır. Dünyada büyük gelişim sürecine giren faizsiz bankacılık 1940-1970 yılları arasında özellikle Mısır'da kendini göstermiştir.“Faizsiz Bankacılık”adı altında yaygınlaşan katılım bankaları, başta Müslüman ülkelerde faaliyet gösterirken bugün farklı ihtiyaçların karşılanması noktasında tüm dünyada önem arz eden bir işlevsellik kazanmıştır. Faizsiz bankacılık sistemi“Özel Finans Kurumları”olarak ülkemize ilk olarak 1984 yılında girmiş, 2000'li yıllarda ilerleme katetmiş, 2005 yılında ise“Katılım Bankacılığı”adını alarak bankacılık sektöründe büyük bir gelişme göstermiştir. Bu gelişmeler katılım bankalarının faizli bankalar karşısında İslami değerleri göz önüne alarak alternatifler sunmaktadır."
