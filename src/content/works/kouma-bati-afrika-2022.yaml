abstract: "Şii İmamet nazariyesi, siyasetin dinle iç içe olduğu bir nazariyedir. Şia, teşekkül ettikten sonra kendi inanç ve düşünceleri doğrultusunda alternatif bir tarih inşa etmeyi de başarmıştır. Günümüzde söz konusu mezhebin en çok taraftar bulduğu ülke İran olup, İslam Devrimi'nden sonra kabul edilen yeni anayasada devletin resmi dini ve mezhebini belirten bir madde konulmuştur. Velayet-i Fakih anlayışı da bu dönemde ortaya çıkmış, dinî-siyasî otoritenin temel belirleyicisi bir görüş haline gelmiştir. Meseleye Afrika kıtası genelinde baktığımızda, İran yönetiminin Afrika kıtasına olan ilgisi yeni bir olgu olmayıp 1979'daki Devrimi'nden öncesine kadar varmaktadır. İran İslam Devrimden sonra İran Misyonerlik ve yatırım için Afrika'ya yönelmiş, Şiiler Afrika'daki azınlıkları arasında yer almıştır. Fakat sayılarının çok az olduğunu görülmektedir. Batı Afrika'daki toplam Müslüman Nüfusun % 5 ila %10 arasındadır. Bu çalışmada ise İran'ın Afrika kıtasına olan ilgisinin belirleyicileri ve nedenleri ele alınmaya çalışılmıştır. Bölgesel olarak da Batı Afrika'da bulunmakta olan Mali Cumhuriyeti'ndeki Şiilerin varlığına ilişkin birtakım sorular ile Şiilik durumunun özel olarak Mali Cumhuriyeti'ndeki yeri ve etkisine değinilmektedir."
