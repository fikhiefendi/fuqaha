abstract: "İslam dini inanç ve bireyin maneviyatına hitap eden kurallar yanında, hukuki, sosyal, siyasi ve ekonomik yaşantıyı da kapsayan kural ve tavsiyeleri içermektedir. Bu kurallar ve tavsiyeler birey yanında toplumu da ele alan hukuki, ekonomik ve sosyal konulardır. Bu geniş kapsam çerçevesinde İslami bankacılık ve İslami finans, İslam ekonomisi düşüncesinden doğarak çeşitli İslami finansal enstrümanlar geliştirmiştir. 20 yılı aşkın bir süredir öne çıkan önemli finansal enstrümanlardan biri de sukuktur. Bu çalışmada, bir İslami finansal enstrüman olarak sukuk uygulamasının makroekonomik performans üzerindeki etkileri araştırılmıştır. Çalışmada, 7 ülke için 2014Q1-2020Q1 döneminde çeyrek dönemlik veriler ile sukuk hacim ve yoğunluğunun büyüme üzerindeki etkileri ele alınmıştır. Analiz kapsamına Endonezya, Ürdün, Kuveyt, Malezya, Nijerya, Suudi Arabistan ve Türkiye alınmıştır. Elde edilen sonuçlara göre sukuk hacminin iktisadi büyüme üzerinde bir etkisinin mevcut olmadığı görülmüştür. Diğer yandan sukuk yoğunluğunun %3.14 seviyesine kadar iktisadi büyümeyi pozitif şekilde etkilediği tespit edilmiştir. Bu seviyenin üzerinde ise etki anlamsız hale gelmektedir."
