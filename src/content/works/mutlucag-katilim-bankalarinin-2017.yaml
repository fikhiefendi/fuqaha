abstract: "Katılım Bankacılığı; faiz yerine kâr payı prensibiyle çalışan, kâr ve zarara katılma esasına göre fon toplayıp; kar/zarar ortaklığı, kâr marjlı satış ve finansal kiralama yöntemleriyle fon kullandıran bankacılık modelidir. Katılım bankacılığı, faiz hassasiyeti sebebiyle banka sisteminden uzak tutulan atıl kaynakları bankacılık sistemine kazandırmayı amaçlamaktadır. Kârı faizden ayıran özellikler; kârın paranın üretken bir işte kullanılması sonucu ortaya çıkması, belirsizlik sebebiyle ortaya çıkmasının ya da miktarının kesin olmaması (zarar da olabilir) olarak belirtilmektedir. Katılım bankaları faaliyetlerini bu doğrultuda yaptıklarında da sonuç faiz değil kâr olarak adlandırılmaktadır. Bu çalışmada; katılım bankalarının gelişimi anlatılmış ve kâr payı oranları faiz oranları ile karşılaştırılmıştır. Bu nedenle yapılan trend ve korelasyon analizleri sonucunda oranlar arasında güçlü doğrusal ilişki bulunmuştur. Kâr payı oranlarının faiz oranlarına yakın olmasının olası nedeni; kâr payı oranlarının katılım bankalarınca en çok kullanılan murabahadan elde edilecek kâr sonucu belirlenmesi, murabahanın kâr/zarar ortaklığı esasına dayanmayan kar marjlı satış yöntemi olması ve murabaha kâr oranlarının piyasa koşulları gereği faiz oranları dikkate alınarak tespit edilmesi olarak düşünülmektedir. Dolayısıyla; katılım bankalarınca fon kullandırma faaliyetlerinde murabaha yöntemi tercih edildiği sürece mevcut piyasa koşulları içerisinde kâr payı oranlarının faiz oranlarından bağımsız olarak oluşması imkânı oldukça düşük olarak görülmektedir."
