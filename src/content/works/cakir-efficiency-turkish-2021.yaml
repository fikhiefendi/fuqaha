abstract: "Bu çalışmada Türkiye Bankacılık sektöründe 2015-2019 yılları arasında faaliyet gösteren bankaların verimlilikleri ölçülmüştür. Verimlilik ölçümlemesi için VZA metotlarından girdi odaklı CCR ve girdi odaklı BCC methodları ayrı ayrı uygulanmıştır. Analiz sonucu ayrıca ANOVA ve t-test gibi istatiksel metodlar kullanılarak test edilmiştir. Etkinlik puanları yorumlanırken bankalar, devlet bankaları, yabancı sermayeli mevduat bankaları, yabancı sermayeli katılım bankaları, özel sermayeli devlet bankaları ve devlet katılım bankaları olarak gruplara ayrılmıştır. VZA analiz sonuçlarına göre banka gruplarının etkinlikleri değerlendirilirken aynı zamanda ilgili banka gruplarına ilişkin potansiyel iyileştirme önerilerinde bulunulmuştur."
