abstract: "Çalışma, Blockchain teknolojisinin rolü ile ilgilidir ve bu teknolojinin neler getirdiği, ortaya çıkışından bugüne kadar dünya ekonomideki ve islam ekonomesinin kurumlarındaki köklü değişimlerin uygulamalarla beraber nasıl başa çıkılacağı özellikle salgın sırasında ve islami finans kurumlarının karşılaştığı zorlukları daha güvenli hizmetler bulunması gerektirir. Hizmetlerin kalitesi ve güvenlğinde sürekli gelişmesi ile işlemlerde en yüksek güvenlik ve en üst düzeyde doğrulukla hızlandırılması, ekonomik değişimler ve zorlukları fark etmek gibi her zamab hazır bir şekilde olması gerekir. Bunlarla beraber daha yüksek rekabet gücü, gelişmeye, hizmetlerin maliyetleri azaltmak, dolandırıcılığın ve sahtecilik ve intihal ile mücadele etmeye, gizlilik ve güvenliğe doğru bir nedene olacaktır. Bu çalışma, Blockchain teknolojisinin İslami finans kurumları üzerindeki etkisinin değerlendirilmesi ve bunların önemini, türleri ve niçin kullandığımız hakkında, İslami finans kurumlarının uygulamalarında karşılaştığı zorlukları ve bunları kullanmak için nasıl dönüşürüleceği, gerçek uygulama sorunları ile ilgili ve önerilen çözümleti hakkında dair bilgi vermeyi amaçlar. Bu sonuçları ulaşıldı: İslami finans kurumları modern teknolojilerle otomasyon çalışmalarını düzenleyen standartlara ihtiyacı olduğuna ve Meşruiyet standartları, yönetmelikler, sistemler, artırılmış güvenlik ve önceden kullanılan maksimum faydalanması gibi durumlar tamamlaması gerekir. Tüm taraflar arasındaki ilişkiyi düzenler ve uygulamanın fizibilitesini ve teknolojinin yeteneğine inceledikten sonra Blockchain teknolojisinin uygulamak birçok sorunları çözülebilme gücü vardır. İslami finans kurumları arasında araştırma ve geliştirmek amacıyla ittifak ve deneyim alışverişinde ihtiyaç duyulmuştur."
