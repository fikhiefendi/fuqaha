abstract: "Sosyolojik olarak dinî hayatın önemli bir unsuru olarak Ramazan, Müslümanlar üzerinde çok önemli izlenimler bırakmakta ve bireysel olarak gündelik hayatlarından başlayarak mutfaklarında, ailelerinde, işyerlerindeki sosyal ilişkilerinde, ibadethanelerindeki dostluklarında ve Müslim-gayri Müslim komşularıyla olan ilişkilerinde birçok etkileşimi de beraberinde getirmektedir (Gönger ve Polat, 2015). Dünyada milyonlarca Müslüman hicri Takvimin 9. ayı olan ramazan ayında dini bir vecibeyi yerine getirmek üzere oruç tutmaktadır. Müslümanlar için ramazan ayı çok önemlidir. Ramazan ayında günde iki kez biri güneş doğmadan önce sahur vaktinde diğeri ise güneşin batışından sonra iftar açılmaktadır. Ramazanda geleneksel olarak iftarda büyük bir öğün, sahurda ise daha hafif bir öğün yenilmektedir (Yaman ve Özgen. 2006; Yağmur ve Rakıcıoğlu, 1995). Hizmet işletmelerinin Ramazan ayında tüketicilere yönelik daha çok reklam vermesinin hizmet sektöründe yaşanan ekonomik canlılıktan kaynaklandığı söylenebilir. Çünkü Türkiye'de dini vecibelerin yoğun olarak yaşandığı Ramazan Ayı'nda insanlar sevdiklerini daha çok hatırlarlar. Bu anlamda reklamlarda tema olarak insanların yakınlarını aramaları gerektiği vurgulanmıştır. Ramazan ayı Müslümanlar tarafından sevap ayı olarak bilindiğinden dolayı bu ayda diğer zamanlara göre daha fazla hayır işler yapılmaktadır. Bu durum yardım kuruluşlarının reklam vermesini sağlamıştır (Canpolat ve Özkısaç, 2016). Ramazan ayında özellikle gıda başta olmak üzere perakendeye yönelik bir çok sektörün satış ciroları ve reklam maliyetlerinin en yüksek seviyeye ulaştığı, hem de geleneksel kültür unsurlarının toplumca en yoğun yaşandığı zaman olarak ifade edilebilir. Dolayısıyla Ramazan ayı dini ve kültürel boyutları olan ve pek çok sektör için ekonomik canlılığı arttıran son derece önemli bir zaman dilimi olarak düşünülmektedir (Korkmaz, 2008). Dolayısıyla Ramazan ayında gıda tüketimi, hem sahur ve iftarların açılması hem de konuk komşu ve güçsüzlerin doyurulması, iftar çadırlarının açılması, marketlerde gıda ürünlerinde Ramazan paketlerinin oluşturulması, TV'lerde Ramazana ayına özgü yapılan gıda tüketim reklamları Ramazan ayında gıda tüketimini etkileyen faktörler olarak ortaya konulabilir. Bu kapsamda bazı sosyal yardımlaşma vakıflarının ihtiyaç sahiplerine gıda paketleri dağıtması (Işık Erol, 2014) vb. nedenlerle hane halklarının gıda tüketim eğilimleri diğer aylara göre artış gösterdiği 2 söylenebilir. Mersin ilinde yapılan bir araştırmada, Ramazan ayında gıda harcamasının yaklaşık yüzde 10 arttığı tespit edilmiştir. Buna göre, ortalama hane halkı aylık gıda harcaması ramazan öncesinde 639 TL olarak hesaplanırken, yaklaşık yüzde 10'luk bir artışla ramazan ayında 700 TL'ye ulaşmıştır. Hem oruçlu hem oruçlu olmayan hane halklarında ortalama aylık gıda harcamasında artış yaşanmıştır. Ancak artış oranı oruçlu olan hane halklarında daha yüksek olduğu belirlenmiştir (Aktaş ve Yılmaz, 2012). Dolayısıyla ramazan aylarında hanehalkları sofralarını paylaştıkları kişi sayısı arttıkça gıda tüketim harcamalarının da arttığı söylenebilir. TUİK tarafından 2002-2017 döneminde yapılan hane halkı tipine tüketim harcamaları çalışmasında hane halkı sayısı artıkça buna paralel olarak gıda harcamalarının da arttığı ortaya konulmuştur. Buna göre, 2002 yılında tek çocuklu ailelerde toplam tüketim harcamaları içinde gıda harcamalarının payı %22,7 iken, bu oran üç çocuklu hane halkında %30,3'e yükseldiği hesaplanmıştır. 2017 yılında ise tek çocuklu bir hanehalkının gıda harcaması %17,2 iken bu oran üç çocuklu hane halkında 22,4 olarak gerçekleşmiştir. Hanehalkları yaptıkları gıda tüketim harcamalarının %95,2sini parasal olarak yaptıkları halde, geri kalan %4,8'ni ise kendi üretimlerinden tüketim yoluyla ve ayni olarak karşıladıkları belirlenmiştir (TUİK, 2017). TRB1 Bölgesi (Malatya, Elazığ, Bingöl, Tunceli)'inde ise 2003 yılında toplam tüketim harcamaları içinde gıda harcamalarının payı %30,3 iken bu oran 2015-2017 döneminde azalarak %23,3 olarak gerçekleşmiştir (TUİK, 2019). Bu çalışmanın amacı Kuranı Kerimin indirildiği ve yardımlaşmanın artığı, fakir ve fukaraya eskiye göre daha fazla el uzatıldığı Ramazan Aylarında oruç tutan Müslümanlar iftarlarda zengin bir sofra hazırlama geleneğine sahiptirler. Dolayısıyla sosyal yardımlaşma, misafir ağırlama, iftar çadırları vb. Ramazan ayı etkinliklerinden dolayı Ramazan ayı öncesine göre gıda tüketiminin etkilenip etkilenmediği konusu araştırmak ve istatistiki analizlerle bunu ortaya koymaktır. Ayrıca bu konuda ve kapsamda yazılmış ilk eser olması nedeniyle de bilimsel bir boşluğu doldurduğu söylenebilir."
