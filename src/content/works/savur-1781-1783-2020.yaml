abstract: "Kütahya, Anadolu Beylerbeyliği'nin merkezi ve şehzade sancağıdır. Bu tezde Kütahya tarihine küçük bir katkı sağlamak için XVIII. yüzyıl sonlarındaki bir kesit ele alınmıştır. Bu amaçla 1781-1783 yılları arasındaki 4 Numaralı Kütahya Şer'iyye Sicili incelenmiştir. Kütahya'nın belirtilen yıllar arasında sancak idaresi, sancağın idari birimleri, şehrin merkez ile ilişkileri, sancakta yaşayan nüfusun sosyal ve ekonomik yapısı ele alınacaktır."
