abstract: "Bu çalışma Türkiye'deki katılım bankacılığı hakkında bilgi verilmek amacıyla hazırlanmıştır. Katılım bankacılığı ve mevduat Bankacılığı genel işleyiş, yapı ve faaliyet bakımından birbirlerinin alanına girdiğinden ilk olarak mevduat bankacılığının genel yapısı, tarihçesi ve sektörel yapısı hakkında bilgi verilmiştir. Sonra faizsiz bankacılığının fikri alt yapısına gelişimine, ilgili kurum ve kuruluşlarına, işleyiş yapısına ve Türkiye'de faaliyette bulunan ve 2005 yılından sonra adı katılım bankacılığı olarak değiştirilen özel finans kuruluşları hakkında bilgi verilmiştir. Son olarak da katılım bankacılığı ve mevduat bankacılığının 2005-2010 yılları arasındaki personel yapısı, aktif büyüklükleri, fon toplama ve kullandırma oranları bakımından karşılaştırma yapılmıştır."
