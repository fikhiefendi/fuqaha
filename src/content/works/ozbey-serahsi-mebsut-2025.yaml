abstract: "Yaratılmışlar arasında insan, kendisine bazı hususiyetler verilerek faziletli bir konuma getirilmiştir. Bu konumun gereği olarak insana bazı sorumlulukların yüklenmesi beklenir. İşte bu noktada hukuk kavramı önem kazanır. İnsanlık tarihi boyunca hukuk, toplumsal düzeni sağlamak amacıyla gelişimini sürdürmüştür. İnsanların bir arada yaşamaları neticesinde birbirlerine karşı hak ve sorumluluklar meydana gelir. Bu konular genel olarak hukukun kapsamına girmektedir. Çeşitli isimlerle anılan hukuk türlerinden biri de dini bir kimlik taşıyan ve vahiy kökenli olan İslam hukukudur. İslâm hukuku muhatap aldığı insanların düzenli ve ahlaklı bir hayat sürmelerini temin etmek amacıyla bazı hükümler ve kurallar koyar. İslâm hukukunda kural koyucu Şâri', Hz. Allah'tır. Hz. Peygamber sallallahu aleyhi vesellem ise Allah'tan aldığı vahyi tebliğ eder ve açıklar. Mezkûr hukukta ayet ve hadislerden hüküm çıkarmak ya da yeni ortaya çıkan problemlere çözüm bulmak amacıyla Kur'ân ve Sünnete dayalı hüküm çıkarma yöntemleri geliştirilmiştir. Kur'ân ve Sünnetle birlikte hüküm istinbatına kaynaklık eden icma ve kıyas, İslam hukukunun temelini oluşturan delillerdir. Fakihler, bu dört temel esasta ittifak etmiştir. Bunların dışında yer alan ve fer'î deliller olarak isimlendirilen istinbat yöntemlerinin hücciyyeti hususunda ise ihtilaf vardır. İstihsan da bunlardan biridir. İstihsan, hüküm çıkarmada edille-i şer'îyye olarak kabul edilen, aslî dört temelden biri olan kıyasın içerisinde fer'î bir delil olarak da zikredilir. Usûl konularında geçmişten günümüze süregelen anlaşmazlıklar göz önünde bulundurulduğunda, delillerin mahiyetini doğru şekilde kavramak oldukça önemlidir. Bu bağlamda, Serahsî'nin usûl anlayışını ve el-Mebsût kitabında ortaya koyduğu istihsan delilinin mahiyeti ve hususiyetini anlayabilmek için, Usûlü's-Serahsî/el-Usûl isimli kaynak eser esas alınacaktır. el-Mebsût'un özellikle Kitabu'l-Büyû' bölümündeki istihsan bahisleri analiz edilerek konuyla ilgili tartışmalara çözüm getirilmeye çalışılacaktır. Akitler, İslâm hukukunun toplumsal düzeni hedefleyen muamelat sahasına girer. Sosyal yaşam ve toplu olarak bir arada yaşamanın muktezasınca, adil bir hayat sürmek ve İslâm'ın hususiyetle korunmasını istediği beş temel aslın sarsılmaması için gereklidir. Çalışmamızda İslâm hukuku'nun alışveriş akitlerinde dürüstlük, adalet, hakkaniyet, karşılıklı güven ve rıza çerçevesinde düzenlenen kuralların istihsanla ilişkisi ele alınacaktır. Bu bağlamda, Hanefî mezhebinin önemli fıkıh usulü ilkelerinden biri olan istihsan kavramı, alışveriş akitlerinde tarafların haklarını korumak, meşakkatli kuralların kolaylaştırılmasını sağlamak ve kişi ile toplum yararını gözetmek açısından, maslahat ilkesine ve istihsanın ruhuna uygun olan örneklerle birlikte değerlendirilecektir."
