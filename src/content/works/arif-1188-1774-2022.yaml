abstract: "Hâşiyetü ale'l-mukaddimâti'l-erba`i fi't-tavdîh adlı kitap havas arasında Hafîdü'nnessârî olarak meşhur olan Muhammed b. Abdullah Es-sadîkî'ye aittir. Bu kitap usûl, mantık, kelam ve dil bilimleri konusunda zengin bilgiler içeren sade bir kitaptır. Hanefi mezhebinin ve özellikle de eş`arî mezhebinin önemli fıkıh usûlü kaynaklarından biridir. Bu kitap İmam Taftâzânî'nin Şerhu'l-mukaddimât'ının bir özetidir. İmam Hafîdü'n-nessârî kitabında müellif şârih İmam Sadru'ş-şerî`ati'l-asgar'ın ifadesinin metne aktarılmasında anlaşılır ve birleşik bir yöntem benimsemiştir. Ondan sonra Taftâzânî'nin sözünü aktarmış, bu ikisinin sözünün üstüne de yorumunu yazmıştır. Müellif hüsn ve kubh konusunu yazdığı bölümde birçok kaynaktan istifade ederek bu ikisinin sıfatına ve anlamına dair çok sayıda görüş ve söylem aktarmıştır. Bu eserler: İbnü'l-hâcib'in Şerhu Muhtasar'ı, Cürcânî'nin Şerhu'l-mevâkıf'ı. Müellif konularını varlık ve yokluğun üstünlüğünün belirlenmesinden bahsederek şöyle tamamlamıştır:“Varlıkta, konuşmanın takdirine bağlı olarak zikrin tahsisi gerçekte kınanmaz. Ayrıca yokluğun tahkikte illet olduğundan ve kendisiyle illet olunduğundan şüphe edilmez. Bu El-melikü'l-mennân'ın yardımıyla yazdığım son şeydir.”Araştırmanın amacı, bu kıymetli hazineyi koruyarak, asil İslam ümmetinin mirasını ortaya çıkarmak, bu samimi alimlere vefa görevimizi yapmak ve gayretli ilim taliplerine hizmet etmektir. Böylece seçkin bir şahsiyet tanınmış, kütüphaneler onun eserleriyle zenginleşmiş olacaktır. Metnin tahkikinde, araştırma ve tahkik çalışmalarında geçerli bilimsel metod takip edildi. Tahkikte bazı konular ve başlıklar vurgulandı, Kur'an ayetleri ve hadisi şeriflerin tahrici yapıldı. Bazı alimlerin sözlerinin kaynağı tespit edildi. Araştırmacının ulaştığı en önemli sonuç şu olmuştur: İmam Muhammed Hafîdü'nnessârî meşhur hükümdarların hocalarındandı. O fıkıh usûlü, mantık, kelam ve dil ilimlerinde yetkindi. Onun eserleri de buna şahitlik etmektedir. Allah ona en geniş merhametiyle rahmet eylesin."
