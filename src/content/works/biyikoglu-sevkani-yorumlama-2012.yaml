abstract: "Bu çalışmanın amacı, son dönem müfessirlerinden çok yönlü bir âlim olan Şevkânî'nin Kur'ân'ı yorumlama yöntemini, tefsir ilmine katkısını ve şayet varsa bu alana getirdiği yenilikleri araştırmaktır.Araştırmamızın temel konularını belirlemek için öncelikle Şevkânî'nin tefsirini baştan sona taradık. Araştırmamızı derinleştirmek için Şevkânî'ye ait diğer kaynaklara başvurduk. Tefsirinde ortaya koyduğu hususları örnekleme yolu ile açıkladık. Özellikle tefsir ve Kur'ân ilimlerine ait ele aldığı konuları, bu alanda önem arz eden diğer kaynaklarla mukayese ettik.Yemen'deki siyasî, sosyal, dinî ve kültürel hayatın tefsirine nasıl yansıdığını gördükten sonra birinci bölümde: Tefsirinin kaynaklarını, tefsirine has başlıca özelliklerini, tefsir ilmine yaklaşımını, âyet ve sûreleri yorumlama yöntemini ortaya koyduk. İkinci Bölümde: Şevkânî'nin ilâhî kelâm ve ibadet kaynağı olarak Kur'ân'a bakışını ve Kur'ân ilimlerine yaklaşımını açıkladık. Üçüncü Bölümde: Şevkânî'nin tefsirini, tefsir çeşitliliği bağlamında kelâm, fıkıh, dilbilim, mezhebî ve tasavvuf ilimleri açısından analiz ettik.Bu araştırmamızdan; Şevkânî'nin tefsirinde, pek çok alana ait zengin kaynak kullandığı, rivâyet ve dirâyet metotlarını güçlü bir şekilde tefsirine taşıdığı, itikadî konularda selefî yaklaşımlarda bulunduğu, fıkıh alanında ictihâdı teşvik ve taklitten uzaklaşmayı ilke edindiği, sonucu ortaya çıkmıştır. Bunlara paralel olarak Şevkânî, taklîde dayalı bütün yaklaşımları bid`at olarak görmüş ve bazı tasavvufî anlayışlara karşıt görüşlerde bulunmuştur.Sonuç olarak bu çalışma bize; Şevkânî'nin tefsirinin şekil olarak düzenli ve sistematik olduğunu, konuları dağıtmadan muhtasar bir çalışmada bulunduğunu ve Kur'ân ilmine ait konuları ustaca ele alarak, fıkıh anlayışlara yeni kapılar açtığını göstermiştir. Şevkânî, tefsirinde alanıyla ilgili pek çok hususlara değinmekle beraber, bazı yerlerde kaynak göstermediği, zayıf rivâyetleri tefsirine dâhil ettiği, Kur'ân'ın okunuş şekillerinden apokrif kırâatleri kullandığı ve mezhep taklitçiliği ile tasavvuf konusunda aşırı karşıt söylemlerde bulunduğu için ilim dünyasında bir takım eleştirilere maruz kalmıştır."
