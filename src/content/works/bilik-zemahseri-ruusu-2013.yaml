abstract: "Alimlerin farklı görüşlerini ve bu farklılıkların sebeplerini ele alan İlm-i hilaf, fıkıh melekesi kazandırması açısından önem arz etmektedir. Ruu'su'l-Mesail ismi ise İlm-i hilaf alanında kaleme alınan farklı bir türü simgelemektedir. Aynı isim altında bir eseri bulunan Zemahşerî, İslami ilimlerde iz bırakan, mutezili bir alimdir. Farklı yönleriyle ön planda olan Zemahşerî'nin söz konusu eseri, türünün güzel bir örneği olmasının yanında kendisinin fıkıhçı özelliğini ve fıkıh düşüncesini de yansıtan nadide bir eserdir. Bizim çalışmamız bu tür hakkında bilgi vermek ve Zemahşerî'nin fıkıh düşüncesini ortaya koymak amacıyla Zemahşerî'nin Ruu'su'l-Mesail isimli eserinin incelenmesi ve eserde yer alan Kitabu'n-Nikah bölümünün mukayeseli olarak tahlil edilmesini içermektedir."
