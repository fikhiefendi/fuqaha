abstract: "Finansal ve ekonomik gelişmelerle birlikte bankacılık sektörünün performansının değerlendirilmesi, rekabet edilebilirlik açısından bir gereklilik olmuştur. Türkiye'de en önemli finansal aracılar olan ticari bankalar ile bu bankaların bir alternatifi olarak ortaya çıkan katılım bankaları fon kaynaklarının en etkili şekilde kullanılması bakımından bankacılık sisteminde önemli bir yere sahiptirler. Dolayısıyla bu çalışmanın amacı, Türk bankacılık sisteminde faaliyet gösteren ticari bankalar ile katılım bankalarının 2009-2013 dönemindeki finansal performanslarını 16 adet finansal oran yardımıyla çok kriterli karar verme yöntemlerini kullanarak değerlendirmektir. Bu bağlamda Türkiye Bankalar Birliği (TBB) ve Türkiye Katılım Bankaları Birliği (TKBB)'nin internet sitelerinden ticari bankalar ile katılım bankalarına ait finansal veriler temin edilerek, Analitik Hiyerarşi Süreci (AHP) ve Gri İlişkisel Analiz (GİA) yöntemlerinin kombinasyonu ile analiz gerçekleştirilmiştir. AHP yöntemi kriterlerin (finansal oranlar) ağırlıklarının belirlenmesi amacıyla kullanılmış ve bankaların performanslarının değerlendirilmesinde ana kriterlerden karlılık oranlarının, alt kriterlerden ise sermaye yeterliliği standart oranının en fazla öneme sahip olduğu ortaya çıkmıştır. GİA yöntemi ise bankaları finansal performanslarına göre sıralamak amacıyla kullanılmış ve kamu sermayeli bankalardan Ziraat Bankası'nın, özel sermayeli bankalardan Adabank'ın, yabancı sermayeli bankalardan JPMorgan Chase Bank'ın ve katılım bankalarından ise Türkiye Finans'ın en iyi performans sergileyen bankalar oldukları görülmüştür. Sonuç olarak, katılım bankalarının performanslarının ticari bankalara kıyasla daha iyi olduğu tespit edilmiştir."
