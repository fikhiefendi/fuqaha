abstract: "Sadece Tanrı'ya şükredin ve bundan sonra veya sonra peygamber olmayanlar için dua edin ve barış: İslam Ümmetinde Şeriat hükümleri, Müslümanların bilimsel ve pratik yaşamının tüm alanlarında mevcuttu; Bunlar arasında tıpla ilgili konular, tıbbın her bir dalı için gerekli bilim ve pratik meşruiyet hükümleri ve tıp biliminin en önemli dallarından biri Uyuşturucu Bilimi Şubesidir; Her türlü ilaçla ilgilidir, ve hızlı gelişim zamanımızda, hızlı gelişmeler için teknoloji çağı ve her insanın farklı yaşam tarzları hakkında neredeyse günlük güncellemeler olarak adlandırıldı. Sadık ve kâfir, çağdaş evlerin bolluğunu görüyoruz, her Müslümanın öğrenebileceğiniz her evin meşru hükümlerini bilmesini gerektiren tıbbi ve farmasötik evler de dahil olmak üzere, Doğal veya üretilmiş olsun, aldığı veya kullandığı ilacın farkında olmak için. Ve bu açıdan, araştırmacı B adlı bu araştırmayı seçti. (İslami hukukta ilaç tedavisi) bu aşamadaki mesajı için; meşru hükümleri farmakoloji ile ilgisi olanlarla ilişkilendirmek için. Ve bazı ilaçların ne olduğunu ve terapötik özelliklerinin ne olduğunu gösterecek, Onlara hitap etme amacına ulaşmak için kullanılıp kullanılmadıkları üzerindeki olumlu etkiler Meşru bir caydırıcılığın yokluğunda etik olmayan amaçlar için kullanılmasının olumsuz komplikasyonları nelerdir, Özellikle narkotik ilaçlar, etillik alkolün sentezlendiği ilaçlar, hormonal ilaçlar ve domuz türevlerinin jelatin olarak kullanıldığı ilaçlar; Araştırmacı, meşru yargıyı açıkça göstermek için bu bölümlerle ilgili araştırmaların çok önemli olduğunu bulmuştur; Bu araştırma, araştırmacının eczane alanındaki çalışmalarının mesleği olarak yazmasına yardımcı oldu, İslam şeriatının bilimlerinde içtihat eğitimi alma sevgisi ve tutkusunun yanı sıra, bu araştırmayı bir yerde ve Tanrı'nın arkasında önemli hale getirecektir. Bu nedenle, bu araştırmada tıbbi ilaçların tedavisi için bazı içtihatlara ve içtihatların onları nasıl etkilediğine değinmeyi amaçladım."
