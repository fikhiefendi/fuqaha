abstract: "Bu çalışmada, günümüz para sistemi içerisinde önemli bir yere sahip olan kâğıt paraların İslâm hukukundaki konumu incelenmiştir. Özellikle sarf akdi çerçevesinde kâğıt paraların hükmü ele alınarak klasik fıkıh eserlerindeki altın, gümüş ve fels gibi para türleriyle mukayese yapılmıştır. Çalışmanın temel amacı, kâğıt paraların fıkhî hükmünü ortaya koymak ve çağdaş alışveriş işlemlerinin İslâm hukuku bağlamında nasıl değerlendirilmesi gerektiğine ışık tutmaktır. Bu bağlamda çağdaş İslâm hukukçularının kâğıt paraya dair görüşleri beş temel yaklaşım etrafında tasnif edilerek analiz edilmiştir. Ayrıca sarf akdine ilişkin peşinlik, eşitlik ve akit türü gibi klasik şartların, modern para sistemine nasıl uygulanabileceği değerlendirilmiştir. Neticede, günümüzde yaygın olarak kullanılan kâğıt paraların İslâm hukukunda nasıl konumlandırılması gerektiğine dair çeşitli görüşlerin ortaya konulması ve bu konuda bir fıkhî bilinç kazandırılması hedeflenmiştir."
