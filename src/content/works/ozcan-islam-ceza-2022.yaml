abstract: "“İslam Ceza Hukukunda Suçlu Psikolojisi”başlıklı bu tezde suçlunun psikolojisi ve suç-lunun psikolojisine etki eden unsurlar ele alınmıştır. Tez, giriş, dört bölüm ve sonuçtan oluşmak-tadır. Giriş bölümünde konunun önemi, amacı, yöntemi, kaynakları ve sınırları belirtilmiştir. Birinci bölümde suçlunun suç aşamasındaki psikolojisi bağlamında suçun tanımı, suç sis-tematiği, psikolojik yönden suçun unsurları ve suçun psikolojik nedenleri ile İslam düşüncesinde suçun nedenleri ele alınarak suç ve nedenleri hakkında genel bir değerlendirme yapılmıştır. İkinci bölümde cezalandırma aşamasında suçlu psikolojisi bağlamında cezaî sorumluluk ve cezaî ehliyet kavramları açıklanmış, akıl hastalıklarının tasnifleri incelenmiştir. Akıl hasta-lıklarından şizofreni, duygudurum bozuklukları, epilepsi ve dürtü kontrol bozukluklarının cezaî sorumluluğa ve cezaî ehliyeti etkisi ele alınmıştır. Akıl hastalığı kapsamında olup olmadığı tartı-şılan uyurgezerlik, hipnoz, demans, canavarca his, haksız tahrik, tasarlamanın cezaî sorumlulu-ğa ve cezaî ehliyeti etkisi ele alınmıştır. Akıl hastalarının hukuki sorumluluğu ile akıl hastaları-nın ıslahı ele alınmıştır. Üçüncü bölümde infaz aşamasındaki suçlunun psikolojisini incelemek üzere cezanın amaçlarından caydırıcılık, ıslah ve kefaretin; cezanın özelliklerinden kanunilik, şahsilik, genellik ve denkliğin; cezalardan ölüm, celde, kısas, el kesme, sürgünün izahı yapılmıştır. Psikolojik açı-dan infazın ilkeleri on maddede ele alınmıştır. Dördüncü bölümde ise infaz sonrası suçlu psikolojisi bağlamında cezasını çekmesinin akabinde infazı sona eren suçlunun tekrar suç işlememesi, topluma yeniden kazandırılması için takip edilmesi gereken psikolojik eğitim metotları ve suçluya iade edilmesi gereken psikolojik haklar ele alınmıştır. Sonuçta ise İslam ceza hukukunda suçlunun psikolojisinin bütün aşamalarda dikkate alındığına işaret edilmiştir."
