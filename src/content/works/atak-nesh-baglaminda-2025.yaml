abstract: "Nesh meselesi İslâm'ın ilk asırlarından itibaren tartışılmış, fıkıh usûlü eserlerinde ise çoğunlukla imkânı, şartları ve kısımları üzerinde durulmuştur. Usûlcüler genellikle nesh türlerini; Hükmen Nesh, Tilâveten Nesh ve Hükmen ve Tilâveten Nesh şeklinde tasnif etmiş, zamanla en-Nâsih ve'l-mensûh literatürü teşekkül etmiştir. Tilâveti sabit olup hükmü kaldırılan âyetler üzerinde yoğunlaşılırken, tilâveti neshedilenler çoğu kez insâ (unutturulan âyetler) kapsamında değerlendirilmiştir. Bu çalışmada söz konusu rivâyetlerin, tefsir ve usûl kaynaklarındaki yansımaları, mezheplerin farklı yaklaşımları ve rivâyetlerin hadis literatüründeki değeri üzerinden ele alınarak tarihsel süreçte nasıl yorumlandıkları ortaya konulacaktır."
