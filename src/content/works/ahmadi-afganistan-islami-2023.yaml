abstract: "Afganistan'da İslami finans ve sigortacılık faaliyetleri yeni adım atan faaliyetler olarak tanımlanmaktadır. Bu ülkede İslami sigortacılık ile ilgili henüz herhangi bir uygulama bulunmamaktadır. Genel olarak Afganistan'da İslami finans üzerine yoğunlaşmış kapsamlı akademik çalışmalar yok denecek kadar azdır. Bunun yanı sıra, bu ülkede İslami sigortacılık ve İslami finans önemli bir ihtiyaç olarak görülmektedir. Bu araştırmada iki temel amacı bulunmaktadır. Birincisi, Afganistan'da İslami finans konusu incelenerek elde edilen veriler analiz edilerek uygulama ile ilgili öneriler geliştirilmiştir. Böylelikle, ülkede İslami finansın uygulanabilirliği, gelişimi, engellenen faaliyetler, halkın İslami finans uygulamalarına tepkisi ve İslami finansın uygulanamamasına ilişkin sebepler gibi birçok konu aydınlatılmaya çalışılmıştır. Çalışmada katılımcılar ile yapılan mülakatlardan elde edilen veriler analiz edilerek Afganistan'da İslami finansın uygulamasına ilişkin öneriler geliştirilmiştir. İkinci ise, Afganistan'da İslami sigortacılığın uygulanabilirliğinin irdelenmesi ve uygulanması için uygun bir çerçevenin oluşturulmasına yönelik öneriler geliştirilmesi amaçlanmıştır. Araştırmada, yarı yapılandırılmış mülakat soruları kullanılarak elde edilen verilerden durum tespiti yapılmıştır. Araştırma yöntemi olarak nitel yöntem tercih edilmiştir. Doküman incelemesi ve yarı yapılandırılmış anket soruları veri toplama aracı olarak kullanılmıştır. Bu bağlamda Afganistan'da İslami sigortacılığın uygulanabilirliğine ilişkin ilgili kurumlardan yetkili isimler ve birimler ile görüşülmüştür. Araştırmanın katılımcılarını Maliye Bakanlığı, Merkez Bankası ve sigorta şirketleri olmak üzere üç gruptan toplam 7 katılımcı oluşturmuştur. Doküman incelemesiyle incelenen diğer ülke tecrübeleri ve elde edilen mülakat verilene göre Afganistan'da İslami sigortacılığın uygulanabilmesi ve geliştirilmesine yönelik öneriler sunulmuştur."
