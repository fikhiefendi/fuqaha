abstract: "Uyuşmazlık dâvalarında taraflar menfaatleri çerçevesinde haklılıklarını savunabilmek ve iddialarını kanıtlayabilmek için ispat vasıtalarına başvururlar. Bu vasıtalarla dâvalar sonuçlandırılarak kişilerin haklarının elde edilmesi amaçlanır. Söz konusu ispat vasıtalarından biri de yeminden kaçınmadır. Kendisine yemin teklif edilen tarafın yemin etmekten kaçınması nükûl kavramı ile ifade edilir. Bu çalışmada kişilerin iddia ettikleri hakkın tespit ve teslimi amacıyla başvurdukları ispat vasıtalarına değinildikten sonra söz konusu vasıtalardan biri olan nükûl kavramı üzerinde durulmuştur. Nükûlün anlamı, uygulanışı ve görüş farklılıkları tüm yönleriyle ele alındıktan sonra Osmanlı hukukunda nükûlün yargı sürecinde uygulanışı o dönemde tutulan mahkeme kayıtlarıyla aktarılmıştır."
