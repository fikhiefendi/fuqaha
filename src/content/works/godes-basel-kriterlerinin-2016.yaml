abstract: "Basel kriterleri, dar anlamda, risklere karşı bankacılık sektörünün korunması için denetimi ve uluslararası standartları sağlayan uzlaşıdır. Süre gelen ekonomik gelişmeler ve değişen koşullar ile birlikte ihtiyaçlar ve eksiklikler görülmüş, bunların giderilmesine yönelik Basel I, II ve III olmak üzere ileri aşamalara geçilmiştir. Basel III uygulamasının, özellikle 2008 küresel krizi sonrasında, ekonominin çıkış noktasını oluşturan bankacılık sektörünün krizlere karşı daha sağlam olması bilinen temel amacıdır. Diğer yandan reel ekonomiyi finanse ederek krizlere karşı daha dirençli yapıyı oluşturan katılım bankacılığı (İslami bankacılık) modeli Türkiye'de de hızla gelişmektedir. Bu çalışmanın amacı Türkiye'de faaliyet gösteren katılım bankalarını, Basel Uzlaşısı'nın gelişimiyle birlikte Türkiye'de uygulanma dönemlerini ele almak ve katılım bankalarının Basel kriterlerini uygulamada karşılaştığı avantajları ve dezavantajları ortaya koymaktır."
