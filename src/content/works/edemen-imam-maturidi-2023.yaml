abstract: "Kur'ân-ı Kerîm indirildiği zaman diliminden ve coğrafyadan bağımsız olarak anlaşılması mümkün olmayan bir kitaptır. Sûrelerin muhtevalarına bakıldığında Câhiliye dönemi örf ve adetlerinin azımsanmayacak kadar çok olduğu görülecektir. Bu nedenle ilk dönemlerden itibaren Câhiliye dönemi ile ilgili çeşitli çalışmalar yapılmıştır. Bu çalışmamızda da Kur'ân-ı Kerîm'de Câhiliye dönemi hakkında yer alan bilgilerin İmam Matürîdî tarafından ele alınış biçimi değerlendirilmiştir. Çalışmamız Câhiliye kültürü ile ilgili verilerin Te'vilâtü'l-Kur'ân'da ne kadar kullanıldığını ortaya koymayı amaçlamaktadır. Araştırmamızda öncelikle câhiliye halkının inançları konusu ele alınmıştır. Toplumda var olan yaygın inançlar özetlenerek bunların İmam Mâtürîdî'nin tefsirinde nasıl kullanıldığı açıklanmıştır. Ardından ibadetler noktasında Câhiliye dönemi bilgisinin Te'vilâtü'l-Kur'ân'a etkisi incelenmiştir. Daha sonra ise İslâm'ın getirdiği yeniliklerle Câhiliye devri uygulamaları arasındaki farklılıkların ve benzerliklerin açıkça görüldüğü sosyal hayatla ilgili konular üzerinde durularak bu hususların tefsir yazımına etki ettiği Te'vilâtü'l-Kur'ân özelinde anlatılmaya çalışılmıştır. Tümevarım yönteminin kullanıldığı çalışmamızın neticesinde Te'vilâtü'l-Kur'ân'da özellikle inanç ve sosyal hayatla ilgili ayetlerin tefsirinde câhiliye bilgisinden çokça faydalanıldığı görülmüştür."
