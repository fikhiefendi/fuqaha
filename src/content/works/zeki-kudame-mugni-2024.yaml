abstract: "Hadis-fıkıh ilişkisi bağlamında tartışılan en önemli konulardan biri, fıkıh sahasında münekkit muhaddisler tarafından eleştirilere konu olan rivayetlerin kullanımıdır. Tezde, Hanbelî mezhebinin en meşhur fıkıh eserlerinden biri olan İbn Kudâme'nin el-Muġnî adlı eserinin, ibadetler bölümünde geçen ve Hanbelî mezhebinin delil olarak kullandığı çok zayıf rivayetlerin tespiti ve değerlendirilmesi amaçlanmaktadır. Böylece Hanbelî fıkıh eserleri arasında temsil gücü yüksek bir eser üzerinden çok zayıf rivayetlerin ne oranda hangi konularda ne amaçla kullanıldığı konusunda genel bir perspektif sunulması amaçlanmaktadır. Araştırmada öncelikle mezkûr eserin ibadetler bölümünde yer alan ve Hanbelîler tarafından kullanılan rivayetler incelenmiş çok zayıf kategorisine giren hadisler tespit edilmiştir. İsnadında en az bir münekkit tarafından hadis uydurduğu belirtilen râvilerin yer aldığı isnadlar mevzû olarak değerlendirilmiştir. Ayrıca geçmiş ve günümüz münekkit ve araştırmacılarının hadisler hakkında yaptıkları değerlendirmeler de destekleyici veriler olarak istifade edilmiştir. Bu doğrultuda el-Muġnî adlı eserin ibadetler bölümünde çok zayıf olarak kategorize edilen 53 rivayeti Hanbelîler delil olarak kullandıkları saptanmıştır. Bu rivayetlerden 30'u metrûk, 23'ü ise mevzû hükmünü almaktadır. İbn Kudâme'nin hangi konularda ve hangi hükümlerde bu rivayetleri kullandığı, çalışmanın önemli bir yönünü oluşturmaktadır. İbn Kudâme'nin çok zayıf rivayetleri başka delillerle birlikte mi yoksa konu hakkında tek delil olarak mı kullandığını ortaya koymak da bu çalışmanın amaçlarından biridir."
