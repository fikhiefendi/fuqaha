abstract: "Nehiy ?hâss? lafız türlerinden biridir. Kesin ve baglayıcı tarzda bir seyin yapılmamasını istemek demektir. Nehiy birçok yönden emirle paralellik arz ettiginden, usûl eserlerinde nehyin daha çok yasaklanan fiilin derhal ve sürekli yapılmasına delâleti ve yasaklanan fiilin fesâdını gerektirip gerektirmedigi konularıyla yer aldıgını görürüz. Biz bu çalısmamızda nehyin tanımı, mûcebi, fevr ve tekrara delâleti ve yasaklanan fiilin fesâdını gerektirip gerektirmemesi gibi konulara sistematik ve bilimsel bir tarzda açıklık getirmeye çalıstık. Eski ve yakın dönemde yazılmıs fıkıh usûlüne dair eserleri, yapılmıs doktora ve yüksek lisans çalısmalarını ve konuyla alâkalı müstakil eserleri inceledik. Bunu yaparken tarafsız kalmaya, bilimsellikten ödün vermemeye gayret ettik. Arastırmamız sonucunda, nehyin tahrîm ifade etmek için konulmus hâss bir lafız oldugu, fevr ve tekrarı gerektirdigi ve dil bakımından olmasa da ser'î açıdan yasaklanan fiilin fesâdını gerektirdigi kanaatine ulastık. Anahtar Sözcükler Tahrîm, Fevr, Sıhhat, Butlan, Fesâd"
