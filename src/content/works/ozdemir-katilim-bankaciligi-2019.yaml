abstract: "Faiz hassasiyeti olan insanlar açısından konvansiyonel bankalara alternatif kuruluşların bulunmaması, elde edilen kazançların altın, döviz ve gayrimenkul gibi banka dışı yollarda değerlendirilmesine ve tasarrufların pasif kalmasına sebep olmuştur. Bu açıdan, faizsizlik ilkesine uygun bir şekilde hizmet veren, tasarruf sahiplerinin ellerindeki tasarrufları ekonomiye kazandırılmasını sağlayarak, ülke ekonomisinin kalkınması için gerek duyulan sermayeye ilave kaynak sunan finansal kuruluşlar başta Körfez Ülkeleri olmak üzere, Türkiye gibi birçok Müslüman ülkede hizmet vermeye başlamış ve gelişerek devam etmiştir. Bu çalışmada bankacılık kavramı, nasıl oluştuğu, fonksiyonları, türleri katılım bankacılığı kavramının ortaya çıkış sebepleri, çalışma prensipleri, amacı, önemi, özellikleri anlatılmıştır. Katılım bankacılığının dünyada ki ve Türkiye'deki gelişimi ve uygulamaları katılım bankalarının mevcut durumu, Türk ekonomisine kazandırdıkları, fon toplama ve fon kullandırma faaliyetleri ve son olarak sukuk ve tahvil karşılaştırılmasına yer verilmiştir. Bu çalışma ile geleneksel bankacılık ile katılım bankacılığının özellikleri anlatılmış ve katılım bankalarının fon kullandırım faaliyetleri ayrıntılı olarak incelenmiş, geleneksel bankacılık ve katılım bankacılığın farklı uygulamalar olduğu ve katılım bankacılığın sisteminin faizsizlik prensipleri üzerine kurulduğu ve buna göre çalıştığı sonucuna varılmıştır. Bu tezin sonucunda bankacılık ve katılım bankacılığının tümüyle anlatıldığı özelliklerinin ve farklarının ortaya konduğu, geleneksel bankacılık ürünü olan tahvil ve katılım bankacılığında ürünü olan sukukun ayrıntılarının ortaya konduğu bir çalışma olmuştur. Ayrıca tahvil ve kira sertifikası ürünlerinin fon büyüklüğü ve yatırımcı sayıları 2012-2018 yılları itibariyle incelenmiş ve 2019, 2020 ve 2021 yılları için yatırımcı sayısı ve fon büyüklükleri ile ilgili tahmin verileri ortaya konmuştur."
