abstract: "Kur'ân-ı Kerîm, Müslümanların dinî, hukukî ve sosyal hayatının temel kaynağıdır. Bu kaynakta“ahkâm âyetleri”olarak bilinen hükümler, ibadetlerden aile hukukuna, ticaretten ceza hukukuna kadar geniş bir alanda düzenlemeler içermektedir. Tefsir tarihi boyunca ahkâm âyetlerini bazı müfessirler özel olarak ele almış, bazıları ise genel tefsir çalışmaları içerisinde değerlendirmiştir. Bu çalışmanın amacı, modern dönemin önemli müfessirlerinden biri olan Saîd Havvâ'nın el-Esâs fi't-tefsîr'inde ahkâm âyetlerine yaklaşımını ortaya koymaktır. Bu bağlamda müfessirin mezhepler arası ihtilaflara bakışı, kullandığı klasik ve modern kaynaklar, yorum yöntemi, Kur'ân'ın bütünlüğüne yaptığı vurgu ve yaşadığı dönemin sosyal, kültürel ve siyasal şartlarının yorumlarına yansımaları incelenmiştir. Elde edilen bulgular göstermektedir ki Saîd Havvâ, ahkâm âyetlerini yorumlarken Ehl-i Sünnet çizgisini benimsemekle birlikte farklı mezheplerin görüşlerine de yer vermiştir. Mezhepler arasındaki ihtilaflarda genellikle tarafsız bir aktarım yapmış, ancak Ehl-i Sünnet ile karşıt yaklaşımlar arasındaki ihtilaflarda Ehl-i Sünnet'i savunmuştur. Fıkhî konularda doğrudan fıkıh kaynaklarına başvurmaktan ziyade İbn Kesîr, Nesefî, Kurtubî, ve Âlûsî gibi müfessirlerin eserlerinden yararlanmış, tefsirinde rivayet ile dirayeti bir araya getirmiştir. Yorumlarında dinin kolaylık yönünü ön plana çıkarması, icmaya aykırı hüküm vermekten kaçınması, ihtilaflı konularda ihtiyatlı olan hükmü tercih ederken ruhsatları da göz ardı etmemesi; ahkâm âyetlerine yaklaşımında ön plana çıkmaktadır. Bu çalışma, ahkâm âyetlerine yaklaşımı yönüyle özgün bir değer taşıyan el-Esâs fi't-tefsîr'in bu yönünü inceleyerek literatüre katkı sunmayı; aynı zamanda günümüz Müslümanlarının dinî, siyasî ve toplumsal hayatlarına Kur'ân'ın ahkâm âyetlerinden elde edilmiş prensiplerle ışık tutmayı amaçlamaktadır."
