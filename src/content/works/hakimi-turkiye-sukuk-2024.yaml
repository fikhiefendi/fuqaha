abstract: "Bu çalışmanın amacı, ülkemizde Katılım Bankaları vasıtasıyla ihraç edilen kira sertifikaları (sukuk) İslami finans kuruluşların standart geliştiricisi olan (AAOIFI) vasıtasıyla yayınlanan ilişkili standartlarına uyumluluk düzeyini ölçmek ve Türkiye'de halihazırda kullanılan Türkiye Muhasebe Standartları (TMS) ve Türkiye Finansal Raporlama Standartları (TFRS) ile AAOIFI arasındaki uyumu araştırmaktır. Çalışmanın bilgi kaynağı 2021-2022 yıllarına ait katılım bankaların ve üzerinde sukuk ihraçlarını gerçekleştirdikleri varlık kiralama şirketlerinin faaliyet raporlarıdır. Çalışmada uyumun ölçülmesi için ağırlıksız açıklama endeksi kullanılarak, İkili Tarz (dichotomous) yönteminden yararlanılmıştır. Çalışmanın sonucunda, 2021 ve 2022'de katılım bankalarının Faizsiz Finans Muhasebe Standardı (FFMS) 33'e göre genel uyumluluk düzeyi %50 olarak gerçekleşmiştir. Varlık kiralama şirketlerinin genel uyum düzeyi ise %47 olarak tespit edilmiştir. Bu sonuca göre katılım bankalarının ve sukuk ihracında aracı rol oynayan varlık kiralama şirketlerinin raporlama konusunda daha açıklayıcı olmaları, yatırımcılarını bilgilendirmek için TMS ve TFRS yerine FFMS standartlarını benimsemeleri ve muhasebe düzenlerinin de FFMS'ye uygun olarak organize edilmesi gerekmektedir."
