abstract: "Bu çalışmada, birinci bölümde daha sonra İmam Malik bin Enes'in doğumundan taki ilim tahsil ettiği evrelere kadar, büyük hocalarından nail olduğu güzel ahlak öğretileriyle beraber hayatının kısa bir özetini de zikredeceğim. Yine İmam'ın kendilerinden hadis, fıkıh ve şeri ilimlerin diğerlerini almak için yolculuğa çıktığı hocalarını da zikredeceğim. Mezhebin tesis aşamasından son merhalesine kadar ki kısımları, dünyada bu mezhebin yayıldığına işaret eden, çeşitli ülkelerde inşa edilmiş olan medreseleri de zikredeceğim. İkinci bölümde ise Sedd-i Zerai mevzusunu derinlemesine inceleyeceğim. Bu konunun mahiyeti, delilleri, şartları, önemi ve diğer dört mezhebin alimlerinin görüşleriyle, kurallarını da zikredeceğim. Son olarak ise siyaset-i şeriyye hakkında konuşacağım. Başarı Allah'tandır ve tevekkül de yalnız onadır."
