abstract: "Hanefi Mezhebinde, mezhebin kurucu üç imamının görüşlerine yer veren eserlerden sonra hicri dördüncü yüzyılda mezhep içi diğer fukahânın da görüşlerini ve gerekçelerini derleyen yeni bir telif türü ortaya çıkmıştır. Literatüre vâkıât ya da nevâzil olarak geçen bu tür eserlerin ilki Belh bölgesi fakîhlerinden Ebü'l-Leys es-Semerkandî'nin telif etmiş olduğu Kitâbü'n-Nevâzil isimli eserdir. Bu çalışmada soyağacı/stemmatik yöntemi esas alınarak eserin bütününü hedefleyen bir proje kapsamında ilk yarısının metin tenkidi yapılmış, ayrıca eserin hukuksal önemini açığa çıkarma adına muhtevasına yönelik detaylı verilere yer verilmiş, tespitler ve değerlendirmeler yapılmıştır. Soyağacı yönteminde yurt içi ve yurt dışı ulaşabildiğimiz tüm asıl nüshaların tamamı ve bu nüshaların karşılaştırılması ile elde ettiğimiz sanal nüshalar kullanılmıştır. Bundan dolayı müellifin metnine en yakın şeklin elde edildiği sonucuna ulaşılmıştır. Klasik metin tenkidi ve diğer tahkik yöntemlerine alternatif olan bu yöntemin başarısı diğer İslamî metinlerde de aynı şekilde metin tenkidi yapmanın daha isabetli olduğunu göstermektedir. Ayrıca içeriği itibarıyla zengin bir fukahâ kitlesini, görüşlerini ve gerekçelerini barındırması sebebi ile hukuk literatürü açısından vâkıât/nevâzil türünün önemini gözler önüne sermektedir."
