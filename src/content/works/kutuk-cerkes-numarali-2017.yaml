abstract: "Kadıların tuttuğu mahkeme kayıtları, merkezden gelen ferman, emir ve beratlar şer'iyye sicillerini oluşturmaktadır. Bu çalışma Çerkeş'e ait altı numaralı defterin trankripsiyon ve değerlendirmesini içermektedir. Araştırma da kadılık müessesesi ve şer'iyye sicil defterleri hakkında kısa bilgiler verilmiştir. Çalışma, Çerkeş'in kısa tarihi anlatılarak desteklenmiştir. Altı numaralı Çerkeş şer'iyye sicili toplamda 107 pozdan oluşmaktadır. Hükümlerin içeriğinde tereke, vekâlet, hırsızlık, borç-alacak davaları ve merkezden gelen emirler vardır. Çalışmanın amacı; Çerkeş'in toplumsal ve hukuki hayatını gün yüzüne çıkararak yapılacak çalışmalara katkıda bulunmaktır."
