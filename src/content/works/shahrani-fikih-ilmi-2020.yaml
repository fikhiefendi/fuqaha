abstract: "İslâmî literatürde ibâdet kavramının genel ve özel olmak üzere iki anlamı bulunmaktadır. Genel anlamda, Allah'a saygı göstermek, onun rızası için yaşamak, onun için bütün varlığa iyi davranmak ve yasakladığı günah ve kötülüklerden uzak durmaktır. İbadet, özel anlamda ise mükellefin yaratanına karşı boyun eğmesini simgeleyen, Allah ve resulü tarafından yapılması istenen belirli eylem biçimlerdir. Allah Tealâ ile kulların arasındaki bağ, kulların yapmış oldukları ibadetlerdir. En değerli ibâdetler ihlaslı ve karşılıksız yapılanlardır. İbâdetin gerçek manada yapılma amacı yalnızca Allah'ın rızasını kazanabilmek ve karşılığını ondan talep etmek olmalıdır.“Fıkıh İlmi Açısından İbadet-Ücret İlişkisi”başlıklı bu çalışmamızda ibadetler karşılığında ücret alınmasıyla ilgili halen güncel ve tartışma konusu olan fıkhi hükümler ele alınmıştır. Tez çalışmamızda farz ve vacip ibadetler karşılığında ücret almanın hükmü ele alınmış, ayrıca dini nitelikli diğer fiiller karşılığında ücret almanın hükmüne de yer verilmiştir. Sonuç itibariyle ibâdetlerde niyetin önemi ve müslümana özel olması vurgulanmış; kişinin kendisine vacip olan veya niyabetle yapılması caiz olmayan ibadetlerin ücret karşılığı yapılmasının caiz olmayacağı neticesine ulaşılmıştır."
