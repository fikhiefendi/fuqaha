abstract: "Rükün kavramı gerek sözlük anlamı çerçevesinde gerekse şer'î bir hüküm olarak fıkıh literatüründe sıklıkla kullanılmaktadır. İbadât, muamelât ve ukûbat olmak üzere İslam hukukunun tüm alanlarında karşımıza çıkan rükün kavramı tezimizin konusunu ifade etmektedir. Araştırmamızın amacı öncelikle rükün kavramının fıkıh literatüründeki kullanımlarını tespit ederek kavramın önemini ortaya koymaktır. Bu bağlamda öncelikle fukahâ ve mütekellim usul eserlerinde rükne dair tanımlar tespit edilmiş, fukâhanın rükne dair yaklaşımları ekseninde rüknün özellikleri incelenmiştir. Yine bu bağlamda rüknün tespitinde esas alınan şer'î deliller ve hüküm istinbat yöntemleri üzerinde durulmuştur. İkinci bölümde fıkıh literatürü içerisinde rükün kavramının kullanıldığı yerler tespit edilmiş, fakihlerin gerek ibadetler gerek muamelât ve ukubât alanlarına dair meselelerde rükün olarak ifade ettikleri farklı unsurlar zikredilmiştir. Bu sayede rükne dair yaklaşım farklılıklarının rükünlerin tespitindeki somut görünümü ortaya koymaya çalışılmıştır. Tezin son bölümündeyse rükün kavramının farz, vacip, şart ve in'ikad kavramlarıyla irtibatı ele alınmıştır. Yine bu bölümde bir unsurun rükün olarak kabul edilip edilmemesinden kaynaklı ihtilaflar ve bu ihtilafların hukuki sonuçları ele alınmıştır. Araştırmanın sonucunda özellikle Hanefî Mezhebi ile diğer mezhepler arasında rüknün tespitinde kabul edilen delillerin farklılık arz ettiği, Hanefîlerin ancak mütevatir veya meşhur haber ile bu tespiti yaparken diğer mezhep alimlerinin âhad haber ile de rüknün tespitini caiz gördükleri vurgulanmıştır. Bunun yanında Hanefîlerin bir ibadet veya hukuki işlemin varlığını sıhhatinden ayrı ele aldıkları ve bunun rüknü tespitte diğer mezheplerle ihtilafa sebep olduğu ifade edilmiştir."
