abstract: "Çoğunlukla tikelden tikele geçiş anlamında kullanılan fıkhî kıyas, İslam Hukuk literatüründe, erken dönemlerden itibaren kendisine en çok atıfta bulunulan yöntemlerden biri belki de ilki olmuştur. Yüzyılların birikimi olan fıkıh külliyatındaki fıkhî çözümlerin büyük bir kısmının sıhhati bu yöntemin kaynak olma meşrûiyetine ve bilgi değerine bağlıdır. Bu, üzerinde durulması gereken önemli bir konudur.Bu tezde, Hanefî Mezhebinin önemli hukukçularından biri olan İmam Muhammed eş-Şeybânî'nin, fıkıh külliyatına içerik ve şekil yönünden kaynaklık etmiş olan, Zâhirur'r-rivâye adıyla anılan meşhur eserleri çerçevesinde kıyas anlayışı hakkında tespit, tahlil ve değerlendirmeler yapılmıştır. Özellikle kıyasın bir yöntem olarak bilgi değeri sorgulanmış, Zâhirur'r-rivâye'de kıyas yöntemiyle ulaşıldığı tespit edilen çözümler Kur'an açısından değerlendirmeye tabi tutulmuştur. Ayrıca eleştirilen hususlarda doğrudan Kur'an'dan hareketle alternatif çözüm önerileri sunulmuştur."
