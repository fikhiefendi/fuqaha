abstract: "İslâm hukuku, insanlar arasındaki ilişkileri düzenleyen toplumsal bir disiplindir. Fakihler, İslâm hukuku müstakil bir ilim olmasından sonra insanların toplumsal ihtiyaçlarını karşılamak için çeşitli yöntemler kullanılmışlardır. Bu yöntemler yeni mezhep ve ekollerin oluşmasına neden olmuştur. Mezheplerin ve ekollerin oluşmasıyla birlikte fakihlerin ihtilaflarını ve nedenlerini ele almak için eserler kaleme alınmaya başlanmıştır. İbn Rüşd'ün Bidâyetü'l-müctehid ve nihâyetü'l-muḳteṣid adlı eseri de fakihlerin ihtilaflarını, bu ihtilafların nedenlerini ve onların hüküm çıkarma yöntemlerini sistematik bir şekilde ortaya koyan mukayeseli İslâm hukuku alanında yazılmış bir eserdir. Bu konunun seçilmesinin nedeni ilk olarak, İbn Rüşd'ün mezhep fıkıhçılığı yapıp yapmadığını tespit etmek; ikinci olarak İbn Rüşd'ün içtihat anlamında otorite sayılan dört mezhep imamından farklı içtihatlarda bulunup bulunmadığını tespit ederek Bidâyetü'l-müctehid'de İbn Rüşd'ün kendi görüşlerine ne sıklıkta yer verdiğini ortaya koymaktır. Bu çalışmada öncelikle İbn Rüşd'ün Bidâyetü'l-müctehid eserinin temizlik, zekât ve oruç bölümlerindeki tercihlerinin tespiti yapılmış ve konuya dair Mâlikî mezhebinin görüşü veya görüşleri bir araya getirilmiştir. Daha sonra İbn Rüşd'ün tercihinde esas aldığı delil tespit edilmeye çalışılmıştır. İbn Rüşd, toplamda otuz altı yerde tercihte bulunmuştur. Bu tercihlerin on beşi mezhep içi, yirmi biri ise mezhep dışı olarak sayılabilecek türden tercihlerdir. Bu tercihlerinin on dördünde diğer üç mezhebin görüşlerini tercih etmiştir. Mezhep dışı tercihlerin dördünde, dört mezhebin görüşlerinin de dışına çıkarak Hasan-ı Basrî, İbn Mübarek, Ebû Sevr ve Dâvud ez-Zâhirî'in görüşlerini benimsemiştir. Bunula birlikte mezhep dışı tercihlerin üçünde ise kendine özgü görüşler ileri sürmüştür."
