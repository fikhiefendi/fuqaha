abstract: "AGHATABAI, Shahrouz,“Türkmen Mektep ve Medrese Tahsilinde Okutulan bir Eser: Revnaku'l-İslam”. YL Tezi, Danışman: Prof. Dr. F. Sema Barutcu ÖZÖNDER, XXII+537 s. İran'ın Kuzeydoğusunda yer alan Türkmensahra bölgesinde yaşayan Türkmenler, bu ülke içinde kendi millî ve dinî kimliklerini en iyi şekilde koruyan azınlıklardan sayılır. İran Türkmenlerinin konuşma dili Türkmen Türkçesidir ve Sünnî (Hanefî) mezhebine inanmaktadırlar. Onların arasında yüzden fazla dinî medrese faaliyet etmektedir. Türkmensahra dinî medreselerinin birçoğunda hâlâ ders kitabı şeklinde okutulan Revnaku'l-İslam manzûmesi, aslında Türk dili ve edebiyatının tanınmış bir eseridir. Bu didaktik manzûme 869 k./1465 yılında, demek Timurlu'lar döneminde Vefâyî mahlaslı biri tarafından Hanefî fıkhı konusunda kaleme alınmıştır. Eser 1850 yılından itibaren, ilk Kazan'da ve daha sonra Taşkent ve Buhara şehirlerinde defalarca basılmış ve bazı araştırmacıların dikkatını çekmiştir. Ders kitabı olduğu için İran Türkmenleri arasında çok sayıda basılı ve yazma nüshaları bulunmaktadır. Çalışmamız sekiz bölümden oluşmaktadır: ilk bölümde Türkmensahra ve Türkmenler genel şekilde tanıtılmıştır. İkinci bölümde, Türkmensahra'da Dinî Eğitim konusu ele alınmış ve medreselerin oluşumu ve işleyişi açıklanmaya çalışılmıştır. Bu konu şimdiye kadar çalışılmadığından dolayı, bu bölümü yazmak için genelde alan araştırmasında elde ettiğimiz bilgilere başvurduk. Üçüncü bölüm doğrudan Revnaúu'l-İslÀm eseri hakkındadır ve onun kendi metnine, rivayetlere ve tezkirelere istinaden bu ders kitabını tanıtmaya ve Türkçe Fıkıh kitapları yazma geleneği içinde onun konumunu belirlemeye yönelik bir denemedir. Dördüncü bölümün içeriği Tarihsel Karşılaştırmalı Dil İncelemesi'dir. Bu kapsamda beş nüshadan yararlanarak hazırladığımız tenkitli metin ile Türkmensahra'da 2003'te yayımlanan A. Niknahad nüshası mukayese edilmiştir. Beşinci bölüm Revnakul'-İslam'ın Tenkitli Metni ve altıncı bölüm ise Revnaku'l-İslam'ın A. Niknahad Tarafından Türkmen Türkçesine Uyarlanmış Metni'ni vermeyi hedeflemiştir. Yedinci bölümümüz Dizin'dir ve sözlük-dizin şekilde tenkitli metnin bütün sözcüklerini anlamlarıyla içermektedir. Kaynaklar bölümü, sekizinci ve son bölümü teşkil etmektedir. Çalışmamızda ilk başta İran coğrafyasındaki Türkmen mektep ve medreselerini tanıtmaya çalıştık ve sırasıyla bu öğretim merkezleri bağlamında okutulan Revnaku'l-İslam eserinin tanıtımı, tarihî karşılaştırmalı dil incelemesi ve metnini hazırlamaya özen gösterdik."
