abstract: "Anne ve babası olmayan ya da anne babası olup bakım ve gözetimden mahrum olan çocuklara sahip çıkılması ve bunların korunması Türk Medeni Hukukunda evlat edinme müessesesi yoluyla gerçekleşmektedir. Evlat edinme, evlatlık ile evlat edinen arasında kurulan, hâkimin izni ile düzenlenebilen bir aile akdidir. Evlat edinme müessesesine başvuran kişilerin genellikle hiç çocuğu olmamış ya da çocuğu olduktan sonra bir daha çocuk sahibi olup da bir daha çocuğu olamamış kişiler başvururlar. Bir tarafta başvuran kişiler bu hasretlerini gidermeye çalışmakta diğer tarafta bir aile yuvası sıcaklığından mahrum olan çocuklara destek olmaktadırlar. Bu durumda olan çocuklara sıcak bir aile ortamı sunularak bunların maddi ve manevi eksiklikleri giderilmekte, ihtiyaç duydukları sosyolojik ve psikolojik destek karşılanmış olmaktadır. Ülkemizde de bu yönde çalışmalar yapılmakta, gönüllü aileler ile birlikte çocukların bakım ve gözetimleri sağlanmaktadır. Aile, Çalışma ve Sosyal Hizmetler Bakanlığı tarafından evlat edinme ve koruyucu aile hizmetleriyle ilgili çalışmalar yürütülmektedir. Çalışmamızın amacı, evlat edinme kurumunun içeriğine açıklık getirmek ve günümüz hukuk ile İslam Hukuku arasındaki benzerlik ve farklılıkları ortaya koymaktır. Günümüz hukukunda evlat edinmenin teşvik edilmekle himayeye muhtaç çocukların korunması ve bakımının sağlanması için her türlü imkân ve hizmet sunulmaktadır. Buna mukabil İslam hukukunda evlat edinmenin yer almadığı; ancak farklı yollarla bu ihtiyacın karşılandığı belirtilmiştir. Küçük yaşta evlat edinilen çocuk buluğ çağına gelinceye kadar ailede kalabileceği belirtilmiş, süt çağında süt emzirilmişse mahremiyet oluşturduğu için dinen bir sakınca olmayacağı ifade edilmiştir. Çalışmamız iki bölümden oluşmaktadır. Birinci bölümde evlat edinme kavramı, evlat edinmenin hukuki niteliği, tarihsel gelişimi, türleri, evlat edinmenin şartları ve konusu işlenmiştir. Ayrıca koruyucu aile kavramı, koruyucu aile olma koşullarına değinilmiştir. İkinci bölümde İslam Hukukunun evlat edinme kurumuna karşı tutumu belirtilmiş, üçüncü bölümde ise İslam hukuku ile Türk Medeni hukukunda evlat edinme durumunun değerlendirilmesi konuları ele alınmıştır."
