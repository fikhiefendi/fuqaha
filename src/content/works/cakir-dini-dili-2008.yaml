abstract: "Bu çalışmada, Cumhuriyet'in ilk yıllarında Türkiye Büyük Millet Meclisi'nin talimatı üzerine Diyanet İşleri Başkanlığı kontrolünde yazdırılan ?Hak Dini Kur'an Dili? ile 2000'li yıllarda Diyanet İşleri Başkanlığı kontrolünde hazırlatılan ?Kur'an Yolu? tefsirlerinin, ahkâm ayetlerinin tefsirleri karşılaştırılmıştır.Giriş bölümünde her iki eserin de yazarlarının hayat hikâyelerine yer verilmiştir.Birinci bölümde Kur'an-ı Kerim'deki ahkâm ayetlerinin sayısı, tasnifi ve tefsiri hakkında bilgiler sunulmuştur. Bu bölümde Kur'an-ı Kerim'de yer alan ahkâm ayetleri hakkında çok farklı sayılar verildiği ancak, bu ayetlerin belli bir sayı ile sınırlandırılmasının pek de mümkün olmadığı görülmüştür.Çalışmanın ikinci bölümünde, önce iki eser ana hatlarıyla tanıtılmış, hem genel özellikleri hem de ahkâm ayetlerini tefsir etmedeki yöntemleri hakkında bilgiler verilmiştir.Üçüncü bölümde ise, her iki eserde mukayesesi yapılacak konular -ibadet hükümleri, muamelât hükümleri ve ceza hükümleri olmak üzere,- üç ana grup halinde tasnif edilerek, tespit edilen bu başlıklar mukayese edilerek ele alınmıştır.Yapılan mukayeseler sonucunda, ibadet hükümlerinde seferilik ve zekâtın verilebileceği yerler ile ona benzer birkaç konu dışında farklılık olmadığı tespit edilmiştir.Muamelat hükümlerinde, aile ve miras hukukunda komisyonun Elmalılı merhuma oranla daha geniş açılımlarda bulunduğu görülmektedir. Borçlar hukuku ile ilgili olarak tek fark, faiz konusunda ortaya çıkmakta iken, iktisadi ve mali hukuk alanında ise önemli bir farklılık göze çarpmamaktadır. Devletler hukuku alanında ise genel olarak komisyonun -gayrimüslimlerle dostluk anlamında olmasa da diyaloga- daha yatkın açıklamaları olduğu halde Elmalılı merhumun bu konuda daha sert bir tutum takındığı ortaya çıkmaktadır.Ceza hükümleri konusunda ise, temelde bir fark olmadığı, ancak komisyonun, cezaların uygulanmasında -örneğin recm cezasının uygulanmasında- daha toleranslı davranılmasından yana görüş belirttiği tespit edilmiştir.Çalışmamız, Kur'an-ı Kerim'in, statik bir ilahi kitap olmadığı ortaya koymaktadır. Temel ilkelerinde değişiklik olmayan Kur'an-ı Kerim'in, ayrıntı sayılabilecek hükümlerinde ise zamana göre, hatta kişisel özelliklere göre farklı açılımlar getirilebilmesi, onun her zaman yaşanabilen bir kitap olduğunu, -ölülere değil, dirilere indirilen bir kitap olduğunu- bir kez daha ortaya çıkarmaktadır."
