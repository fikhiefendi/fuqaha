abstract: "Bazı Modern Finansal İşlemlerin İslam Akitler Nazariyesi Açısından Tahlili -Finansal Kiralama Ve Sigorta Örneği- Bu tez giriş bölümüne ek olarak üç bölümden oluşmaktadır. Bu çalışmanın amacı, İslam'ın çağdaş finansal işlemler üzerindeki konumunu anlamaya çalışmaktır. Çünkü bu konu, temel ile modernliği bir araya getirmektedir. Bu da araştırmacıya konuyla ilgili bir takım fıkhi konularda âlimlerin sözlerini inceleyerek, ümmetin büyük fakihlerinin sözlerinin derinliklerini araştırma fırsatı verir. Giriş bölümünde; çalışmanın önemi, konunun seçilme nedeni, çalışmanın amacı, çalışma yöntemi ve daha önce bu konu ile ilgili yapılmış olan çalışmalar ele alınmıştır. Birinci bölümde, akdin (sözleşme) tanımının yanı sıra çağdaş finansal işlemlerin tanımı ve kavramı araştırılmıştır. Aynı şekilde çağdaş finansal işlemlerin sözleşmelerindeki kuralların araştırılması da ele alınmıştır. İkinci bölüm, İcâre (kiralama) sistemini ele almaktadır. Bu bölümde; İcâre Müntehiyye Bittemlik akdinin (mülkiyetle sonlanan kira sözleşmesi) tanımı ve İslâm'da kira sözleşmesinin meşruiyeti, hükmü ve bunun yanında İcâre Müntehiyye Bittemlik akdi (mülkiyetle sonlanan kira sözleşmesi) üzerine olan fıkhi görüşleri ele almaktadır. Bu bölümde ayrıca İcâre Müntehiyye Bittemlik akdinin (mülkiyetle sonlanan kira sözleşmesi) kuralları ve son olarak da bankacılık kurumlarında uygulanan durum ele alınmaktadır. Üçüncü bölüm, sigorta sistemini ele almaktadır. Bu bölümde; sigortanın hakikati, oluşumu ve türleri ele alınmaktadır. Bu bölümün ikinci kısmı ise ticari ve kooperatif sigorta hükümlerini ele almaktadır. Bu son bölümün üçüncü kısmında ise ticari ve kooperatif sigortasını birbirinden ayıran en önemli noktalar ele alınmaktadır. Anahtar kelimeler: Ukud (sözeşmeler), Muâmelâtu'l Maliyye (Finansal işlemler), çağdaş, İcâre Müntehiyye Bittemlik akdi, Sigorta sistemi, Fıkıh"
