abstract: "İslâm dini, kadın hakları konusunda çok titizlik göstermiş ve kadını, hiçbir nizam ve sistemin veremediği müstesna bir makama sahip kılmıştır. Nitekim yüce Allah Kur'ân-ı Kerim'de:“Erkeklerin kadınlar üzerinde hakları olduğu gibi, kadınların da erkekler üzerinde hakları vardır.”buyurmuştur. Hz. Peygamber de birçok hadisinde erkekleri, kadınların hak ve hukukunu gözetmeye davet etmiştir. İslâm hukukunda kadının mali hakları konumuz açısından büyük bir önem arz etmektedir. Zira ele aldığımız bu çalışma şer'i hukuka göre kadın mülkiyet hakkına ve eda ehliyeti varsa kimsenin rızasına ihtiyaç olmaksızın malları üzerinde her türlü tasarrufta bulunmaya, eşler arasında tam bir mal ayrılığının kabulüne ve kocanın şu ya da bu şekilde karışmak, engel olmak gibi bir hakkının olmadığına dair deliller getirerek söz konusu meselelere açıklık kazandırmaktadır. Öte yandan çalışmamız aslında okuyucuya gerçek ve doğru bilgiyi vererek toplumdan kötü zan ve endişeyi uzaklaştıracak etkenlere de sahiptir. Zira kadının mali yöndeki bağımsızlığına sıkça vurgu yaparak bunun toplumda yerleşebilmesi için önemli tespitler içerir. Netice olarak vardığımız bazı noktaları şöyle sıralayabiliriz: 1. Hukuk kavramının sözlük ve terim anlamını gerek mütakaddimun gerekse muâsır âlimlerin yaklaşımları doğrultusunda irdelemeye çalıştık. 2. Mal/mülk kavramı üzerinde öne sürülen açıklamalardan hareketle en uygun tanımı belirlemeye çalıştık ve malın kısımları ve önemi hususunda da bazı çıkarımlar sınmaya çalıştık. 3. İslam hukukuna göre kadının mülkiyet konusunda olması gereken mevkiyi oldukça objektif bir yaklaşımla değerlendirerek birçok kesimin dikkatlerini celp edici tespitlerde bulunduk. 4. Kadının miras alma, miras bırakma, nafaka ve mehir mevzularında tam bir bağımsızlığa sahip olduğunun altını çizmeye çalıştık. 5. İslâm'ın özel mülkiyet konusunda kadına verdiği hakları sıralamanın yanı sıra helal yollarla olması koşuluyla onu bizzat teşvik edici emirlerinin de olduğunu izah etmeye çalıştık."
