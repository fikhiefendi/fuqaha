abstract: "234 Numaralı Maraş Seriye Sicili H. 1322-1325 (M. 1904-1907) Osmanlı Devletinde islami hukuk kuralları geçerli idi insanlarla ilgili bütün hukuki olayları kadıların verdikleri karar suretlerini, hüccetleri ve yargıyı ilgilendiren çeşitli yazılı kağıtları ihtiva eden defterlere şerliye sicili denir. Bu nedenle giriş kısmında islam Hukuk sistemiyle Osmanlı Adliye teşkilatı hakkında bilgi verilmiştir. Daha sonra şer'iye sicillerini genel özelliklerini ve tarihi önemini açıkladık. Maraş sicilleri milli kütüpanede muhafaza edilip toplam 7 adettir. Tez konumuz olan 234 numaralı defter 24,5 X 39,5 ebadında olup H. 1322-1325 M. 1904-1907 yıllarındaki miras, tereke kayıtları alım satım aile hukuku vasi ve vekil tayinlerini ihtiva etmektedir. Araştırmacılara kolaylık olsun diye önce belgelerin özetleri çıkarılıp sonra metin transkripsiyonu verilmiştir. Değerlendirme kısmında ise elde ettiğimiz sonuçları eie alamk XX.yy ilk yarısında Maraş'ın idari iktisadi ve sosyal yapısı hakkında bilgi verilmiştir. Buna göre Maraş Halep vilayetine bağlı bir sancak merkezi idi. Halk tarım, hayvancılık ve ticaretle uğraşmaktadır. Müslim ve gayrimüslim halk arasında ilişkilerin iyi olduğu görülmektedir. Defterdeki yazı çeşitleri hakkında bilgi vermek amacıyla ekler bölümünde bazı belgelerin fotokopisi verilmiştir. En sonunda belgelerin anlaşılabilmesi için lügatçe eklenmiştir. T.CL"
