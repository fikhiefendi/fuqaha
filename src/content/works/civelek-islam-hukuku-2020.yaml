abstract: "İslâm ekonomi sistemi, toplumda adaletin tesis edilmesini sağlayarak sömürüyü engellemiş; paranın da az sayıda insanın elinde bulunmasını önleyici tedbirleri almıştır. Bundan dolayı faiz haram kılınmış ve konulan prensiplerle meşru yoldan elde edilmeyen kazancın veya ticaretin önüne geçilmiştir. Bu doğrultuda İslâmi finans, parayı sadece helal veya izin verilen faaliyetlere kanalize ederek hem toplumun sağlık, güvenlik ve ekonomik gelişimine destek olmayı hem de bireye yüklediği sorumlulukla toplumu kötü davranışlardan uzak tutmayı hedeflemiştir. Kripto paralar günümüzde giderek dikkat çeken para birimleri hâline gelmiştir. 2009 yılında Nakamoto ile başlayan bu serüven, kullanıcıları için vaat ettiği unsurlarla da dünya gündemine oturmuştur. Dünya piyasasında 2018 yılı itibariyle 1375 kripto para birimi tedavülde olup bunların piyasa değeri 741milyar doları bulmaktadır. Kripto para birimlerinin gündelik hayatta ve ticari faaliyetlerde, gerçek veya sanal ürün ve hizmetlerinde ödeme aracı olarak firmalarca kullanıldıkları, borsada işlem gördükleri dikkate alındığında diğer açılardan olduğu kadar dini boyutu ile de ele alınması gereken hususlardan biri olduğu açıktır. Kripto paraların tedavül aracı olması, para sayılması, mal olması, ticarette kullanılması veya yatırım için kullanılması konusu İslâm fıkhı açısından üzerinde birtakım tartışmaların olduğu aktif bir olgudur. Araştırma ile kripto paraların meşruiyeti, alım satımı, transferi ile ilgilikonular İslâm hukukçularının ortaya koydukları deliller dikkate alınarak ortaya konulmaya çalışılmıştır. Kripto para birimlerini caiz görmeyenler daha çok kripto paraların para vasfını taşımadığı, kara para aklama, değerindeki aşırı dalgalanma, belirsizliğe bağlı yüksek risk, para sahiplerinin meçhuliyeti, denetim ve kontrolünün yapılamaması, yasal dayanaktan yoksun olmaları gibi eksiklikleri delil olarak sunmuşlardır. Kripto para birimlerini caiz görenler daha çok caiz görmeyenlerin öne sürdükleri delilleri dikkate alarak hüküm vermeye çalışmışlardır. Her ne kadar kripto para birimlerinin caiz olmadığını iddia edenler olsa da kripto para birimlerinin İslâm hukukuna uyumunun sağlanması çalışmalarının yapılmaya başlandığı hatta bazı İslâmi kripto para üretiminin yapıldığı görülmektedir."
