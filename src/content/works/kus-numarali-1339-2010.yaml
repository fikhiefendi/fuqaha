abstract: "Osmanlı Tarihi'nin sosyal, siyasî, iktisadî, askerî, coğrafî, hukukî ve kültürel yönlerini ortaya koymak için yapılan bir çalışmanın, Şer'iyye Sicillerine bakılmadan hakkıyla ortaya konulamayacağı kanaatindeyiz.Tarihimize ait kaynaklar arasında şer'iyye sicilleri ön sırayı oluşturmaktadır. Sosyo-kültürel açıdan önemli bilgi ve kayıtlar içeren Osmanlı mahkeme kayıtları, geçmişi günümüze yansıtan kıymetli yazılı kaynaklardandır. Bu mahkeme kayıtları, yerel farklılıkları ve genel tespitleri ortaya koymaları bakımından önem arz eder.Şer'iyye sicilleri ait oldukları yerlerin içtimaî, idari, mali, sosyal, vb. yönleri aydınlatmada önem arz ederler. Özellikle şehir tarihinin aydınlatılmasında büyük önem taşırlar. Çalışmamızda Nevşehir'in iktisadî, içtimaî, idarî yönlerini kapsamış olduğu dönemler içinde ortaya koymaya çalıştık.Çalışmamızda Nevşehir iline ait olan 20 numaralı defterin transkripsiyonunu ve değerlendirmesini yaptık. Defterimiz Hicri 1339-1343 tarihleri arasını kapsamaktadır. Defterdeki kayıtlar vasi tayini, vekil tayini, miras ve tereke taksimi, evlenme ve boşanma, kassam ve mütevelli tayini, seferberlik, harb-i umumi gibi konuları kapsamaktadır.Nevşehir halkı ve ilgi duyan diğer insanlara bizzat eldeki defterde yer alan bilgiler ışığında yansıtarak bilgileri paylaşmak amacıyla yapılacak bir çalışma olmuştur."
