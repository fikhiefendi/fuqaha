abstract: "Hicrû 1257(1858-1859) yılında, Erzurum'un Tortum lçesinde doğanMusa Kâzım Efendi, eğitimini Osmanlı medreselerinde almış, daha sonraeğitim ve öğretimini kendi uğraşlarıyla geliştirmiş, sosyal ve siyasû faaliyetlerekatılmaktan kendini alamamış bir şeyhülislam olarak karşımıza çıkmaktadır.Müellif Osmanlının son döneminde yaşamış ama savunduğu görüş veileri sürdüğü çözüm önerileriyle âdeta günümüz sorunlarına da çözüm getirenbir slam âlimi ve şeyhülislamıdır. O hem bir din adamı olarak hem de ülkesinive milletini seven bir insan olarak görev ve sorumluluklarını yerine getirmekararlılığında olan bir insandır. Yani o sadece bir şeyhülislam veya bir slâmâlimi olarak kenara çekilmiş bir kişi değil, çağın problemlerine çözüm arayanbir aksiyon insanıdır. Bu nedenle, ülkenin ve bir anlamda slam dünyasınınkurtuluşu için hem eserler yazmış, hem de dolaşarak konferanslar vermiştir.Musa Kâzım Efendi eserlerinde kelam bilimi kitaplarının ıslah edilmesi,medreselerin ve programlarının ıslahı, bu kurumlarda yabancı dil eğitimininde sağlanması, yabancı teknik bilimlerinin de alınması, temel hak vehürriyetler, eşitlik ve adalet gibi pek çok alanda genel perspektifleri itibariylegünümüze de taşınabilecek görüş ve düşünceleriyle, Osmanlı Devletininihtiyaçlarını karşılamak ve sorunlarını çözmek için çırpınan bir kişidir.Çok yönlü bir âlim olan Musa Kâzım Efendi başta fıkıh, kelam vearapça olmak üzere pek çok alanda eser vermiştir. Kendisi hakkında yapılançalışmalar ise daha çok onun fıkhû yönüyle alâkalı olmuştur. Biz de, çeşitlialanlarda çok sayıda eser veren Musa Kâzım Efendi'nin müfessir kimliğininde ilim dünyasında tanıtılması amacıyla onun ?Safvetü'l-Beyan Fû Tefsirûl-Kur'an? adlı tefsirini inceledik.Araştırmanın birinci bölümünde, Şeyhülislamlık kurumu ve MusaKâzım Efendi'nin hayatı, ilmû şahsiyeti, hocaları, hizmetleri, şeyhülislamlığı,mutasavvıflığı, ttihat ve Terakki Cemiyetine üyeliği ve eserleri incelenmeyeçalışılmıştır. Yine bu bölümde, Musa Kâzım Efendi'nin slam düşüncesindekiyeri; Osmanlı medreselerindeki eğitim durumu ve buraların ıslahı, mezheptaassubunun giderilmesi, medeniyet görüşü ve slamcı siyaset anlayışındakigenel yaklaşımı incelenmiş ve bu konudaki görüş ve düşünceleri de ortayakonulmuştur.kinci bölümde ise, tefsirdeki yöntemi incelenmiştir. Bu bağlamda öncetefsirinin kaynakları örnekler verilerek tesbit edilmiştir ve ayrıca muhtelifayetlerin tefsiriyle ilgili olarak yaptığı yorumlar çeşitli tefsirlerlekarşılaştırılmıştır. Bundan sonra tefsirinin bazı genel özellikleri, rivâyet,dirâyet ve ulumu'l-Kur'an yönünden özelliği, çeşitli ilimler açısından tefsirininkonumu incelenmiştir. Burada konu fıkıh, kelam, kıraat gibi alt başlıklaraayrılarak değerlendirilmeye çalışılmıştır. Bilhassa müellifin bu konularagetirdiği yorum ve değerlendirmeler çeşitli ayet izahları örnek verilerek ortayakonulmaya çalışılmıştır.Sonuç bölümünde ise, çalışma boyunca yapılan inceleme vedeğerlendirmelerin bir özeti sunularak çalışma tamamlanmıştır."
