abstract: "Evliliğin herhangi bir sebeple sona ermesi durumunda kadının yeni bir evlilik yapabilmek için beklemek zorunda olduğu süreyi ifade eden 'iddet' kelimesi yalnızca İslam aile hukukuna özgü bir kavram değildir. Samî gelenek başta olmak üzere hemen hemen bütün toplumlarda ve dinlerde rastlanan bekleme süresi, bu olgunun dini olduğu kadar fıtri ve insani bir davranış olarak algılanabileceğini göstermektedir. Klasik fıkıh literatüründe 'iddet' başlığı altında ele alınan kadının bekleme süresi, Kur'an ve hadiste aile hukukunun diğer konularına nazaran daha ayrıntılı biçimde yer bulmuş, evliliğin sona eriş tarzına veya kadının durumuna göre farklı süre belirlemeleri yapılmıştır. Öngörülen bu süreler dinin taabbudi nitelikte hükümlerinden sayılmıştır. Modern hukuk sisteminde kadınlara özgü bekleme süresi ve evlenme yasağı ise ilk olarak 04.10.1926 tarihinde yürürlüğe giren 743 sayılı Türk Kanuni Medenîsi'nde“Evlenme Manileri”başlığı altında düzenlenmiştir. İsviçre Medeni Kanunundan iktibas olunan bu hüküm sayesinde iddet süresi, modern hukuk sisteminde de yer almıştır. Söz konusu düzenleme zamanla İsviçre, Alman ve Fransız hukuk sistemlerinde yürürlükten kaldırılsa da; kadınlara özgü bekleme süresi ve sınırlı evlenme yasağı TMK m. 132 kapsamında yeniden düzenlenmiştir. Buna göre“Evlilik sona ermişse, kadın, evliliğin sona ermesinden başlayarak üç yüz gün geçmedikçe evlenemez.”Kanun koyucu, bu yasağın, kadının bekleme süresi içinde doğum yapması halinde kendiliğinden ortadan kalkacağını; kadının gebe olmadığının anlaşılması ve evliliği sona eren eşlerin tekrar evlenmek istemeleri hallerinde ise mahkeme kararı ile bertaraf edilebileceğini düzenlemiştir. Üç yüz gün olarak belirlenen bu sürenin kabul ediliş nedeni, en uzun gebelik süreci olan bu dönemde kadının önceki evliliğinden hamile olup olmadığının belli olması ve sonucunda da nesebin karışmasına engel olunabilmesidir. Bu itibarla İslam hukukunda taabbudi bir hüküm olarak sınırları belirlenen 'iddet' kavramı kısmi olarak günümüz Türk medeni hukukunda yer bulmuşsa da uygulama açısından önemli farklılıklar arz etmektedir. İddetin vazolunuş amaçları her hukuk sisteminde benzerlik gösterse de İslam hukuk sisteminde taabbudilik yönüyle değişmez bir ilke olarak ele alınmıştır. Oysa medeni hukukta yer alan bazı gerekçeler hükmün uygulanmamasında etkin rol oynamıştır.“İslam Hukukunda 'İddet' ve Türk Medeni Kanununda Kadınlara Özgü Bekleme Süresinin Karşılaştırması”adlı çalışmamızda bu iki hukuk sisteminde yer alan iddetin konuluş hikmetlerinin benzerlikleri ve farklılıkları ile uygulama sahasındaki aykırılıklar ve benzer yönler ele alınıp incelenecektir."
