abstract: "ÖZET Hz. Muhammed (s.a.v.)'i müslüman olarak gören, O'nun sohbetinde bulunan ya da O'nunla gazveye katılan ve mümin olarak ölen kimselere sahâbî denilmiştir. Sahâbîler Allah tarafından övülmüş, insanlar için güzel örnekler taşıdıkları Peygamber tarafından haber verilmiştir. İslâmî ilimler için vazgeçilmez bir kaynak olan, bu seçkin topluluğun söz ve uygulamaları daha sonra gelen kuşaklar için önemli bir referanstır. İslâmî ilimler içerisinde bu kadar önemli bir yere sahip olan sahâbilerin sözlerinin hukukî değeri araştırmamızın konusunu oluşturmaktadır. Araştırmalarımız sonucunda yaptığımız tesbitleri kısaca şöyle ifade edebiliriz. Bir sahâbînin görüşünün diğer bir sahâbî için hüccet olmadığı konusunda bütün İslam alimlerinin ittifakı vardır. Sahâbîlerin icmâı olarak adlandırılan söz ve uygulamaları müminler için bir hüccettir. Hüccet olmadığı yönünde bazı aykırı görüşler kabul görmemiştir. Sahâbîlerin kendi aralarında çeşitli konularda ihtilaf etmeleri mümkündür. Bu ihtilafların ortaya çıkmış olması onların fikirlerini özgürce ortaya koyduklarının bir göstergesi olarak kabul edilmiştir. Sahâbîler Kur'an ve sünnet ışığında ictihad etmişler ve bu kurumun geliştirilmesini teşvik etmişlerdir. Sahâbîlerin yaptıkları ictihadlarla ilgili bir çok örneğe rastlamak mümkündür. Sahâbîlerin açtığı bu çığır daha sonra gelen kuşaklara cesaret vermiştir. Sahâbî sözleri önde gelen mezhep imamları tarafından hüccet olarak kabul edilmiştir. Çoğunluk usûlcüler sahâbî sözünü fer'î bir delil olarak İslam Hukuk Metodolojisinde deliller konusu içerisinde değerlendirmişlerdir."
