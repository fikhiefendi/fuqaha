abstract: "Hz. Âişe (r.anhâ), Medine'nin meşhur yedi fakihinden (fukahâ-i seb'a) biridir ve onların içindeki tek kadın sahabîdir. Hz. Ebû Bekir'in (r.a.) kızı olması, yaşının genç olması, çocuğunun olmaması, Hz. Peygamber (s.a.v.) ile evli olması ve zekası Hz. Âişe'ye ilim yolunda derinleşme imkanı sağlamıştır. Vahyin beşiğinde büyümüş, ilmî müktesebatıyla yaşadığı toplumda tek başına adeta bir istişare kurulu vazifesi görmüştür. Bu açıdan Hz. Peygamberden naklettiği rivayetlerle, İslâm aile hukuku başta olmak üzere kadının toplumdaki konumuyla ilgili konularda sonraki nesiller için önemli bir kaynak teşkil etmiştir. Hz. Âişe'nin, İslam'ın doğuş ve gelişme aşamasında uzun bir döneme şahit olması, bazı fırka ve mezheplerin ortaya çıkışını görmesi sebebiyle özellikle fıkıh alanında yorumları ayrı bir önemi hâizdir. O, mezhepler teşekkül etmeden önceki süreçte mezheplere kaynaklık etmiş ve bir kadın gözüyle mezhep imamlarına farklı bir bakış açısı kazandırmıştır. Hz. Âişe'nin her alanda fetvalarına rastlamak mümkündür. Ancak bu çalışma onun aile hukuku özelinde rivayet ve içtihadları ile sınırlandırılmıştır. Bu çalışmada aile hukuku özelinde Hz. Âişe'den gelen hadis rivayetleri ve onun ilgili alandaki çeşitli konulardaki görüşleri ve değerlendirmeleri incelenecek mezhep imamlarının bu rivayetler ve değerlendirmeler karşısındaki tutumlarının yanında günümüz âlimlerinin değişen hayat şartları çerçevesinde bu meselelerdeki yorumları ele alınacak ve değerlendirilecektir."
