abstract: "Bu tez, Selçuklu Devleti döneminde eğitim ve kültür hayatına yön veren eğitim ve öğretimin kurumsallaşmasında mihenk taşı olarak kabul edilen Nizâmiye Medreseleri'ni ve özelde Bağdat Nizâmiye Medresesi'ndeki fıkıh eğitimini kapsamlı bir şekilde incelemeyi amaçlamaktadır. Nizâmiye Medreseleri, yalnızca Selçuklu Devleti'nin değil İslâm medeniyetinin eğitim anlayışı üzerinde derin izler bırakmış, bilhassa fıkıh ilmine sunduğu katkılarla önemli bir yer edinmiştir. Şâfiî mezhebinin temel usûl, fürûʻ cedel ve hilâfiyat konularına dair eserler, İslâm kültür mirasının önemli birikimlerinden biri olan Bağdat Nizâmiye Medresesi'nde şekillenmiş; söz konusu disiplinler bu medresenin müderrisleri ve öğrencileri tarafından etkili bir şekilde geliştirilmiştir. Bağdat Medresesi Şâfiî mezhebi temelli bir eğitim-öğretim kurumu olsa da bu kurumda diğer mezheplere müntesip talebelere de yer verilmiştir. Nitekim Hanbelî ve Mâlikî mezheplerinin de önde gelen fakihlerinin bazıları Bağdat Nizâmiye Medresesi'nde yetişmiştir. Bu medresenin öğretim sistemi, söz konusu mezheplerin temel eserlerinin ortaya çıkmasında da dolaylı olarak etkili olmuştur. Osmanlı Devleti'nin son dönemine kadar eğitim kurumları hem yapısal hem de ilmî metodoloji açısından büyük ölçüde Bağdat Nizâmiye Medresesi'nin eğitim anlayışını ve müfredatını takip etmiş, bu geleneği sürdürerek dönemin fıkıh, usûl ve ilişkili alanlardaki ilmî üretimini şekillendiren temel referans noktası olmuştur. Bu tez, Bağdat Nizâmiye Medresesi'nin eğitim-öğretim süreçlerini, bu süreçlerde uygulanan metodolojileri ve medresenin İslam kültür ve medeniyeti ile İslam hukuk ilmine yaptığı katkıları kapsamlı bir şekilde incelemeyi amaçlamaktadır. Sonuç olarak bu tez, tarihsel bir perspektifle bu katkıların hem teorik hem de pratik yansımalarını analiz etmeyi hedeflemektedir."
