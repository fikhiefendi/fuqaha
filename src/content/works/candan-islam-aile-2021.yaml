abstract: "Aile içi problemlerin çözümünde İslam hukukuna uygun, aynı zamanda medeni hukukta uygulanabilir bir yöntem geliştirmeyi amaçlayan tez çalışmamız tahkim, sulh ve arabuluculuk yöntemlerini kapsayan sentez bir yapıya sahiptir. Bu kapsamla önerdiğimiz aile içi problemlerin çözümünde arabuluculuk yöntemi; İslam aile hukukunda Kur'an-ı Kerim'e dayanan tahkim uygulamasını aile birliğini korumak amacıyla üçüncü bir şahsın desteğinin alınması ve tarafların temsil edilmesi yönüyle; İslam hukukunda sulh yöntemini yapılan müzakerelerin öncelikli olarak uzlaşma odaklı barışçıl bir şekilde sonuçlanmasını öncelemesi yönüyle; medeni hukukta arabuluculuk yöntemini ise sürecin mahkeme eliyle ve uzmanlık eğitimi almış, profesyonel bir üçüncü şahsın uzlaştırma amacıyla aracılık yapması yönüyle; kapsamakta ve bu uzlaşma yöntemlerinin birleşiminden oluşmaktadır. İslam aile hukukunda arabuluculuk yöntemi aynı zamanda mahkemeye gitmeden uzlaşma sağlaması amacıyla mahkemelerin iş yükünü azaltmayı, uzman profesyonel üçüncü bir şahsın desteğiyle taraflara manevi destek ve iletişim rehberliği sunmayı, toplumsal bir sorun haline gelen boşanma olgusunu azaltma konusunda katkı sağlamayı amaçlamaktadır. Türkiye aile yapısına uygun olarak çalıştığımız arabuluculuk yöntemi İslam hukuku, medeni hukuk ve toplumsal yapının özellikleri göz önünde bulundurularak; temel klasik kaynaklar, modern güncel kaynaklar ve disiplinler arası çalışmaların ele alınmasıyla geliştirilen bir yöntemle hazırlanmıştır. Giriş bölümüyle başlayan çalışmamızın ilk bölümünde genel olarak arabuluculuk yöntemi, kavramsal çerçevesi ve tarihsel gelişimi açısından ele alınmış, ikinci bölümde İslam hukukunda arabuluculuğun meşruiyeti değerlendirilmiştir. Sonraki bölümlerde ise İslam aile hukukunda aile içinde yaşanan problemler, nafaka, mehir, boşanma ve hıdâne özelinde ele alınarak arabuluculuk yöntemi ile bu problemlerin çözümü üzerine değerlendirmeler yapılmıştır. Sonuç olarak çalışmamızda sulh temelli arabuluculuk yönteminin uygulanabilirliği ele alınmıştır."
