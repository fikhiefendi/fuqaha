abstract: "1970'li yıllardan itibaren petrol fiyatlarında yaşanan artış, Körfez ülkelerinde petrodolar birikimine yol açmış ve bu durum İslami bankacılığın ortaya çıkmasında önemli bir rol oynamıştır. Türkiye'de ise İslami bankalar 1980'li yıllarda kurulmaya başlanmıştır ve 2005 yılında“katılım bankacılığı”ismini almıştır. Bu tez, 2017-2021 yılları arasında genelde küresel finansal sistemde ve özelde Türkiye'deki İslami/katılım ve konvansiyonel bankaların finansal etkinliğini karşılaştırmalı olarak analiz etmeyi amaçlamaktadır. Çalışma, belirtilen dönemde 14 İslami banka ile 25 konvansiyonel bankanın finansal etkinliğini değerlendirmektedir. İlk olarak, Türkiye'de 5 katılım ve 16 konvansiyonel bankanın finansal etkinliği Veri Zarflama Analizi (VZA) yöntemiyle değerlendirilmiştir. İkinci olarak,“The Banker”dergisinin“Dünyanın En Büyük 1000 Bankası”raporuna göre aktif büyüklüğü bakımından ilk 10'da bulunan 9 İslami ve 9 konvansiyonel bankanın aynı dönem finansal etkinlikleri VZA kullanılarak analiz edilmiştir. Ardından, her iki analizde etkin bulunan bankalar birbirleriyle karşılaştırılmıştır. Teknik etkinliği (VRS) ölçmek için girdi odaklı (BCC-I) bir model kullanılmaktadır. Araştırmanın bulguları, Kuveyt Türk Katılım Bankası A.Ş., Vakıf Katılım Bankası A.Ş., Ziraat Katılım Bankası A.Ş.'nin tüm yıllarda etkin olduğunu, konvansiyonel bankalardan ise sadece Türkiye Vakıflar Bankası T.A.O., Fibabanka A.Ş. ve Türkiye Garanti Bankası A.Ş.'nin etkin olduğunu ortaya koymuştur. Türkiye'de İslami bankaların konvansiyonel bankalara göre daha etkin ve verimli olduğu tespit edilmiştir. İkinci olarak, Türkiye analizinde etkin bulunan 3 İslami banka, etkin bankalar analizinde de tüm yıllarda etkin olurken, dünya genelindeki İslami bankaların çoğunun sadece 2019 ve 2021 yıllarında etkin olduğu saptanmıştır. Bu sonuçlar, Türk katılım bankalarının küresel finansal sistemde diğer bankalara göre daha etkin olduğunu göstermektedir. Son olarak, etkin olmayan bankaların kaynak israfından dolayı etkin olamadığı ve sektörde daha etkin hale gelebilmek için girdilerini üretim sınırında faaliyet gösteren referans bankalara göre ayarlamaları, kaynak kullanımını azaltmaları veya kaynakları daha etkili bir şekilde kullanmaları gerektiği belirlenmiştir."
