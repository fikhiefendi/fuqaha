abstract: "Bu tezin konusu, son dönem Hanefî alim ve fakîhlerinden üstad Şemseddin el-Aynî'nin fıkıh ve usul ilmine dair yazmış olduğu önemli bir risalenin tahkik ve incelemesinden müteşekkildir. Bu değerli alim, birçok ilim dalında eserler telif etmiş ancak ilim tahsil edeceklerin kendisinden ve ilminden yeteri kadar istifade etmelerine imkan sağlayacak, hak ettiği şöhreti yakalayamamıştır. Tam ismi Şemseddin Muhammed b. Muhammed b. Bilal el-Aynî el- Hanefî olup hicrî 957 senesinde vefat etmiştir. Benim bu kıymetli alime ilgi duymamı sağlayan eseri, Hanefî mezhebini tercih ederek, tefsirinde birçok fıkhî ve usulî meselede Şafii mezhebini tercih eden Beyzâvî'ye reddiye olarak kaleme aldığı risalesidir. Söz konusu risaleyi akademik bir biçimde tahkik etmeye ve metinden elde ettiğim ilmi veriler doğrultusunda özet bir incelemeye tabi tutmaya gayret ettim. Tahkik esnasında farklı birçok kaynağa ve esere başvurdum. Mukaddime bölümünde Hanefi fıkıh kitapları ile bazı Şafii fıkıh kitaplarından, tabakat ve sözlüklerden, tefsir ve hadis eserlerinden ve karşılaştırmalı fıkıh kitaplarından yararlandım. Bu çalışmayı yürütürken karşılaştığım en büyük zorluk; elimdeki yazma nüshayı karşılaştırabileceğim,kontrolünü sağlayabileceğim ve müellifinin söylemek istediklerini tam olarak yansıttığımdan emin olmamı sağlayacak ikinci bir nüshanın elimde bulunmamasıydı. Fakat bu zorluğu da elimdeki el yazması nüshayı titizlik ve dikkatle tetkik ederek aşmayı başardım. Aynı zamanda elimdeki nüshayı, Beyzâvî tefsiri metinleriyle ve müellifin ele aldığı birçok meseleyi konu alan Hanefî kitaplarıyla mukayese ettim."
