abstract: "Bu araştırma İmam Mâlik b. Enes'in günümüze ulaşan tek eseri olan Muvatta adlı eserinde rivayet etmediği hadislerin tespit, analiz ve tasnifini konu edinmektedir. Araştırmada ulaşılabilen klasik ve modern dönem hadis, fıkıh, şerh, târih, terâcim ve etrâf türü kaynaklardan istifade edilmiştir. Muvatta hakkında klasik dönemden itibaren telif edilen yüzlerce çalışmada Mâlik'in uygulamaya koyduğu hadis ve fıkıh usulü tartışılagelmiş, ancak özellikle onun eserinde kullandığı amele delalet eden tabirlerdeki maksadı ve fetvasına muhalif hadisleri eserinde neden rivayet ettiği gibi konularda bir fikir birliği oluşmamıştır. Muvatta üzerine yazılan başka eserlerde ise onun öğrencileri vasıtasıyla geniş İslâm coğrafyalarına yayılan Muvatta rivayet nüshaları arasındaki farklılıklar ele alınmıştır. Ancak, İmam Mâlik hayatı boyunca rivayet ettiği hadislerin tamamını Muvatta'ına almadığı için bu hadislerin neden esere dahil edilmediği sorusu da güncelliğini korumuştur. Muvatta'da yer almayan bu rivayetler geniş hadis külliyatımızın çeşitli musannefatında bulunabilmektedirler. Araştırmanın ilk (giriş) bölümünde, seçilen konunun İslâmî ilimler sahasındaki öneminden; araştırmanın yöntemlerinden, sınırlarından ve literatüründen bahsedilmiştir. İkinci bölümde İmam Mâlik'in ilmî hayatı ve şahsiyeti, yaşadığı dönemin ilmî şartları, hocaları, öğrencileri, hadisçiliği ve Muvatta'ının özelliklerinden bahsedilmiştir. Daha önce bu alanda yapılan geniş çaplı araştırmalar olması sebebiyle burada, son bölümde üzerine analizler yapılacak olan Muvatta dışı hadislerin tespit ve değerlendirmesine kapı aralayacak detaylara daha fazla ağırlık verilmiştir. Böylece İmam Mâlik'in hadis ve fıkıh sahasında sahip olduğu otoritenin onun hadis rivayetindeki titiz tavrıyla olan ilişkisi ortaya konmuş, Muvatta üzerindeki tasarruflarının daha net anlaşılabilmesi adına değerlendirmelerde bulunulmuştur. Üçüncü bölümde öncelikle, İmam Mâlik'in Muvatta'da yer almayan hadislerinin nasıl ve hangi kaynaklardan tespit edildiğine dair geniş çaplı bilgilere yer verilmiştir. Sonrasında, onun eserinde uyguladığı fıkıh ve hadis usulü üzerine klasik dönemden itibaren telif edilmiş çalışmalar yanında güncel bulgulardan da istifade edilerek analizler yapılmıştır. Bu analizlerin bir kısmı İmam Mâlik'in Muvatta'da görüşlerine muhalif olan hadisleri neden ve hangi metotla rivayet ettiğini tespite yoğunlaşmıştır. Bu tespit sonucunda onun eserine dahil etmediği hadislerdeki maksadı aydınlatılmaya çalışılmıştır. Son olarak İmam Mâlik'in Muvatta'ına almadığı hadislerde genel olarak gözettiği metodun detayları tespit edilmiş, Muvatta dışı hadisler bu tespite göre kendi aralarında tasnife tabi tutulmuş ve tablolaştırılarak gösterilmiştir. Ayrıca, ekler kısmında araştırma boyunca kayıt altına alınmış ve yapılan tasnife göre gruplandırılmış Muvatta dışı Mâlik hadisleri liste halinde sunulmuştur."
