abstract: "Altın, üzerinden yatırım yapılan finansal ürünlerden birisidir. Altınla yapılan yatırımlar, günümüzde katılım bankaları ve konvansiyonel bankalarda altın hesabı uygulamasıyla gerçekleştirilmektedir. Katılım bankalarındaki yatırım türlerinden en güncel olanı ve incelenmesi gereken yöntem ise altın katılma hesaplarıdır. Altın katılma hesaplarıyla, altınların kur değeri korunurken kâr edilmesi de sağlanmaktadır. Farklı akitleri içeren komplike yapısı nedeniyle de altın katılma hesaplarının fıkhî niteliğinin açıklanması önem arz etmektedir. Bu bağlamda, bu çalışmanın temel amacı altın katılma hesabının işleyiş süreci ve elde edilen kâr payının fıkhî niteliğinin ortaya koyulmasıdır. Çalışmada öncelikle altın katılma hesabının işleyişi, vade bitimine kadar incelemeye alınmıştır. Daha sonra sürecin tamamı fıkhî açıdan analiz edilmiş, analizde Hanefî mezhebi esas alınmıştır. Ayrıca günümüz İslam hukukçularının konu hakkındaki mütealalarına dikkat çekilmiştir. Bu noktada AAOIFI (Accounting and Auditing Organization for Islamic Financial Institutions) tarafından oluşturulan standartlar, İslam İşbirliği Teşkilatına bağlı Mecmau'l-Fıkhi'l İslâmî ed-Düvelî ve TKBB Merkezi Danışma Kurulu kararları, resmi kurumlarca yayınlanan mevzuatlar, temel klasik ve güncel literatür incelenmiştir. Bu çalışmanın özgünlüğü, literatürde eksik olan, detay ve kapsam açısından ise yeterince ele alınmamış olan altın katılma hesaplarını incelemeye almasıdır. Çünkü altın cari hesaplarının araştırmalara konu edilmesine karşın altın katılma hesaplarının incelenmesi eksik bırakılmıştır. Nitekim çalışmada, temelde sarf akdine konu olan altından, katılım işleyişinde hangi nitelikte kâr elde edildiği kapsamlı bir şekilde incelenmektedir. Elde edilen sonuçlara göre altın katılma hesabının mudârebe akdi olarak kurulmasıyla birlikte, konusu itibariyle sarf akdi ve diğer farklı akit türlerini de içermektedir. Genel hatları itibariyle fıkhî olarak uygun olduğu tespit edilmekle birlikte, işleyiş sürecindeki tartışmalı konular fıkıh bilginlerinin konu hakkında ayrıştıkları hususlarla ele alınmıştır."
