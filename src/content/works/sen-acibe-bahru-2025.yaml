abstract: "Tez çalışmamıza konu ettiğimiz“el-Bahrü'l-Medîd fî Tefsîri'l-Kur'âni'l-Mecîd”adlı eser, Faslı mutasavvıf ve müfessir İbn Acîbe (ö. 1224/1809) tarafından kaleme alınmış bir işârî tefsîrdir. İbn Acîbe tefsîri Bahrü'l-Medîd'de Kur'ân'ın tamamını hem zahirî hem de batınî/işârî yöntemle tefsîr etmiştir. Çalışmamızda İbn Acîbe'nin mezkur eserindeki İslam aile hukukuna dair ayetleri işârî tefsîre nasıl konu ettiği araştırılmıştır. İslam aile hukukuyla ilgili olan ve Allah'ın açık ve kesin bir dille beyan ettiği ayetleri bir mutasavvıfın keşf ve ilham gibi farklı bakış açısıyla nasıl yorumladığı üzerinde durulmaya çalışılmıştır. Bu özel konu üzerinden ilerlediğimiz temel mesele aslında İslam'ın üçüncü yüzyılından itibaren mevcudiyetini korumaktadır. Bu meseleye Bahrü'l-Medîd'in münâkehât/aile hukuku ile ilgili ayetleri özelinde bir inceleme üzerinden bakılmıştır. Tezimiz üç bölümden oluşmaktadır. Birinci bölümde İbn Acîbe'nin hayatı ile ilgili özet bilgilere ve ilmî kişiliğine yer verilmiştir. İkinci bölümde İbn Acîbe'yi ve tefsîrini anlayabilmek için işârî tefsîr hakkında genel bilgiler verilmiş; ayrıca tezimize konu edindiğimiz Bahrü'l-Medîd adlı eser, işârî tefsîr açısından genel hatlarıyla irdelenmiştir. Üçüncü bölümde ise eserimiz hakkında daha sağlıklı yorumlar yapabilmek için özel bir başlık adı altında –İslâm aile hukuku ayetleri kapsamında- bir yol takip edilmiştir. Böylece ilgili ayetleri tek tek inceleyerek İbn Acîbe'nin ayetleri önce zâhirî sonra da işârî olarak nasıl yorumladığı tespit edilmiştir. Tespitler neticesinde ise tefsîr ve tasavvuf sahasında yazılan bir esere fıkhî bakış açısıyla yaklaşarak ilmî camiaya katkı sağlanacağı düşünülmektedir."
