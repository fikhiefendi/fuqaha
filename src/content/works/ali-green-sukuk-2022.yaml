abstract: "Araştırma, Türkiye'de bir güneş enerjisi santralinin geliştirilmesi için ana finansman yöntemi olarak yeşil sukukun kullanımını araştırıyor. Proje, minimum teklif fiyatını belirlemek için farklı elektrik fiyatları ile simüle edildi ve ardından NPV ve IRR kullanılarak değerlendirildi. Proje için risk azaltma tekniği olarak farklı enflasyon oranlarına sahip iki senaryo kullanıldı. Bulgular vaka çalışması için olumlu sonuçlar gösteriyor ve yeşil sukukun Türkiye'nin yenilenebilir enerji sektöründeki gelişmeleri teşvik edebileceğini, özellikle de hükümetin dışa bağımlılığı en aza indirmek için planlar hazırladığını kanıtlıyor. Yeşil sukuk, bu araştırmada ülke ekonomisinin tamamına fayda sağlayabilecek özelliklere sahip bir finansman aracı olarak temsil edilmektedir. Yeşil sukukun risk ve kâr paylaşımı doğası, en iyi getiriyi elde etmek için finansör ve girişimcilerin maksimum işbirliğine izin verir. Ek olarak, yatırımcıların dayanak varlığın değerini aşan fonlardan borçlanmasını önleyen varlık destekleme özelliği sayesinde müsrif para alımı en aza indirilir. Sukuk nispeten yeni bir kavram olduğu için, özellikle Türkiye'de alanın henüz geliştirilmediği sınırlı veriler bulunmaktadır. Bu nedenle, bu araştırma, yeşil sukuka finansal planlarında yer vermek isteyen yatırımcılar için yol gösterici olarak kullanılabilecek sağlam ve somut sonuçlar sağlayarak yeşil sukuk alanında bir kilometre taşı işlevi görecektir."
