abstract: "ÖZET“İslâm Hukuk Metodolojisinde Mânâya Delâletin Şekli Bakımından Lâfızlar”adlı bu çalışmanın amacı, İslâm hukukunun iki ana kaynağı oluşturan Kur' an ve sünnet lâfızlarının anlamlarını fıkıh usûlü açısından ortaya koymaktır. Mânâya delâleti bakımından lâfızlar, fukaha ve mütekellimin usûl anlayışına göre iki kısımda ele alınmıştır. Lâfzın delâlet yollarının isimlendirmesinde ve taksimatında fukaha metodunu izleyen Hanefiler ile, kelami usûlü benimseyen cumhur arasında bir takım farklar mevcutsa da aslında ciddi bir farklılık yoktur. Farklılık, fürûa dair bazı meselelerde kendini gösterir. Bu ihtilaflara abdestte niyet, namazda konuşma, hata ile orucu bozma, hayvanların zekatı gibi ibadetle ilgili konulardan, ehl-i kitapla evlilik, boşanan kadının nafakası gibi muamelatla ilgili meselelere kadar bir çok örnek zikredilmiştir. Delâlet yollarında ortaya çıkan ve fürûda tesirini gösteren bu usûl tartışmaları; delâlet yollan arasında çatışma, iktizânın umumiliği ve mefhûmu' 1-muhâlefeti delil alma şeklinde üç ana başlık altında incelenmiştir. IV"
