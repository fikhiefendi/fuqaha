abstract: "Bu çalışma, Muhammed b. Ahmed b. Ebî's-Suûd es-Sâdıkî el-Manastırlı'nın (ö. ...), İbrahim el-Halebî'nin meşhur fıkıh eseri“Mülteka'l-Ebhur”üzerine yazdığı“Müntehe'l-Enhur fî Şerhi Mülteka'l-Ebhur”adlı eserinin,“Namazın Vâcibleri”bahsinden kitabın sonuna kadar olan kısmının tahkik ve tahlilini konu edinmektedir. Osmanlı dönemi fıkıh literatürünün en yaygın kullanılan metinlerinden biri olan“Mülteka'l-Ebhur”üzerine yapılan bu şerh, müellifin özgün yaklaşımlarını ve fıkhî çıkarımlarını yansıtması bakımından büyük bir öneme sahiptir. Literatür taraması neticesinde söz konusu bölümün henüz müstakil bir ilmî çalışmaya konu edilmediği tespit edilmiştir. Bu çalışma; eserin müellifinin hayatını, ilmî kişiliğini ve metne yaklaşımını ortaya koymayı, belirlenen bölümün ilmî esaslara göre tahkikli neşrini yapmayı ve eserde yer alan fıkhî meseleleri tahlil etmeyi amaçlamaktadır. Böylece, Osmanlı fıkıh geleneğinin zenginliği ve bu geleneğin devamlılığı hususunda somut bir katkı sağlanması hedeflenmektedir."
