abstract: "Beslenme insanın en temel ihtiyaçlarından biridir. Beslenme için gerekli olan maddeler ise gıdalardır. Hayatın her alanını düzenleyen İslâm, beslenme için gerekli olan gıdanın sınırlarını çizmiştir. İslâm, gıdanın kaynağı, içeriği, insan bedenine ve ruh sağlığına yarar ve zararı, üçüncü şahısların hakları açısından değerlendirerek kurallar koymuştur, temel olarak da helâl gıdalarla beslenmeyi emretmiştir. Değişen teknolojiyle beraber beslenme alışkanlıklarının da değiştiği yadsınamaz bir gerçektir. Bu değişim ve dönüşüm işlenmiş ve ambalajlı gıdaların tüketimini artırmıştır. Artan nüfusun gıda ihtiyacının karşılanması için sanayileşmeyle beraber gıda katkı maddelerinin kullanımı bir gereklilik olmuştur. Gıda katkı maddelerinin kullanımının artmasına bağlı olarak yan etkilerinin araştırılması, sağlık açısından zararlarının araştırılması ve sonuç olarak kullanımlarının denetlenmesi bir zorunluluk olmuştur."
