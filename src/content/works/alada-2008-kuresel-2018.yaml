abstract: "Küresel Finansal Kriz, 2008 yılında Amerika Birleşik Devletleri'nde temelde mortgage kredileri ve menkul kıymetleştirmelerdeki yaşanan sorunlar ile başlayan ve çok kısa sürede tüm dünyayı etkisi altına alan, 2008 krizi olarak da tanımlanan finansal bir krizdir. Ekonomik sistemin önemli bir kısmını teşkil eden finansal sistem bu krizden şiddetle etkilenmiş, özellikle finansal sistemin dahi en önemli kısmını oluşturan bankacılık sektörü küresel finansal krizden doğrudan etkilenen sektör olmuştur. Bankacılık sektörü kendi içinde; konvansiyonel bankalar, İslami (faizsiz) bankalar, yatırım ve kalkınma bankaları olarak kategorize edilmekte ve bankacılık sektöründe en büyük payı ise konvansiyonel bankalar oluşturmaktadır. Bankacılık sektörü içinde işlevsel olarak aynı (fon toplayıp fon kullandırma esaslı çalışan) olmakla birlikte, İslam hukuku temelinde yöntem ve uyulması gereken ilkeler açısından farklılık gösteren İslami bankacılık, faizsizlik prensibiyle çalışması bakımından önemli bir yapısal farklılık sergilemektedir. İslami bankalar dünya üzerinde çeşitli ülkelerde gelişerek faaliyetlerini sürdürmekle birlikte, özellikle Körfez Ülkelerinde yoğun faaliyet ve gelişim alanına sahiptirler. Bu sebeple Körfez Ülkeleri İslami finans ile ilgili birçok araştırmaya konu edilmiş ve edilmektedirler. Bu çalışmanın amacı, teoride krizlere karşı daha dayanıklı ve krizlerden daha az etkilendiği iddia edilen İslami bankacılık sistemi ile çalışan bankaların, pratikte bu iddiayı yansıtıp yansıtmadığını görmek ve bu doğrultuda 2008 küresel finansal krizi etkisinin Körfez ülkelerinde faaliyet gösteren örnek olarak seçilmiş yirmi altı İslami ve konvansiyonel bankanın, yılsonu finansal raporlarındaki belli bilanço kalemlerinin verileri kullanılarak karşılaştırmasını ve analizini yapmaktır."
