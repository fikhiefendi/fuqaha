abstract: "İslami finans alanında yaşanan gelişmeler her geçen gün artmakta ve özellikle yatırım ve finansman konusunda çeşitli alternatifler sunmaktadır. Yatırımcılar tarafından tercih edilmeye başlanan İslami finans piyasası gerek müslüman gerekse müslüman olmayan yatırımcıların ilgisini çekmektedir. İslami finans piyasasında yer alan araçların tercih edilmesinin en önemli nedeni, yatırımcısı için daha az risk taşıması ve güven duyulan bir piyasa olmasından kaynaklanmaktadır. İslami finans piyasasının işleyişinde katılım bankaları aktif olarak yer almaktadırlar. Yapılan açıklamalar doğrultusunda, katılım bankaları tarafından ihraç edilen ve bir İslami finans araç olan sukukun (kira sertifikası) pazarlanmasında karşılaşılan sorunların belirlenmesi çalışmanın amacını oluşturmaktadır. Çalışmada dört farklı katılım bankası ile mülakat (yüzyüze görüşme) yöntemi kullanılarak veriler elde edilmiştir. Elde edilen bulgular doğrultusunda sukuk pazarlama faaliyetlerinde bulunan katılım bankaları banka, müşteri, sözleşme ve personelden kaynaklı sorunlara incelenmiştir. Çalışmanın neticesinde yaşanan bu sorunlara gerekli çözüm önerilerinde bulunulmuştur."
