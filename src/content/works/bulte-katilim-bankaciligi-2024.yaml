abstract: "Hizmet kalitesi, müşteri memnuniyeti ve sadakatini büyük ölçüde etkilediğinden, başta bankacılık sektörü olmak üzere çeşitli kuruluşlarda çok önemli bir unsur olarak yaygın şekilde kabul edilmektedir. Bu çalışmanın amacı, Türkiye'deki katılım bankalarının mevcut müşterilerini elde tutmalarında ve yenilerini çekmelerinde hizmet kalitesinin rolünü açıklamaktır. Ayrıca çalışma, müşteri memnuniyeti ve sadakatini artırmak için kullanılabilecek hizmet kalitesi kavramını ve ilişkili boyutlarını belirlemeyi ve bu boyutları iyileştirmeye yönelik yöntemleri keşfetmeyi amaçlamaktadır. Çalışmada öncelikle katılım bankalarının sunduğu hizmetlerin kalitesinin değerlendirilmesi üzerinde duruluyor. Katılım bankalarının piyasada algılanan hizmet kalitesinin yanı sıra müşteri memnuniyeti ve sadakatinin de değerlendirildiği çalışma, sonuçta katılım bankacılığı sektöründe pazar payının artırılmasını, potansiyel müşteri çekilmesini, Türkiye'de verimliliğin artırılmasını ve karlılığın artırılmasını hedefliyor. Ayrıca çalışma, hizmet kalitesinin ölçülmesi ve katılım bankacılığı hizmetlerinin etkinliğinin artırılmasına yönelik değerli öneriler sunmayı amaçlamaktadır. Sonuç olarak katılım bankalarının hizmet kalitesinin artırılmasına yönelik her türlü araştırma, bu bankacılık kurumlarına büyük katkı sağlayacak ve destek olabilecek önemli bir girişim olarak değerlendirilmelidir. Çalışmaya veri toplamak amacıyla katılım bankalarına ziyaretler yapılmış ve müşterilere anket dağıtılmış, 507 anket tamamlanarak analizleri yapılmıştır. İstatistiksel analizler SPSS programı kullanılarak yapılarak hizmet kalitesi, müşteri memnuniyeti ve sadakat arasındaki ilişki incelenmiştir. Bankacılık alanında, Türkiye'deki katılım bankalarına hizmet kalitesinin artırılması ve daha geniş müşteri kitlesine ulaşılması yönünde öneriler sunulmaktadır. Araştırma bulguları, hizmet kalitesinin müşteri sadakatini artırmada kayda değer bir etkiye sahip olduğunu ortaya koymaktadır."
