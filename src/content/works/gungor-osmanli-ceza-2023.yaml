abstract: "Şeref ve haysiyeti hedef alan söz ve davranışlar birçok hukuk sisteminde olduğu gibi Osmanlı ceza hukukunda da hukuka aykırı fiiller olarak kabul edilmiştir. Osmanlı hukukunun şer'i ve örfi hukuk olmak üzere ikili bir yapıya sahip olması sebebiyle hakaret oluşturan fiillere yönelik ceza hukuku düzenlemeleri bu iki hukuk alanı dikkate alınarak yapılmıştır. Şer'i hukuk kuralları çerçevesinde zina suçu isnadıyla işlenen hakaretler hadd-i kazf suçu, dini değerlere yönelik aşağılayıcı ifadeler ise dinden çıkma suçu kapsamında cezalandırılmıştır. Bu iki alan dışında kalan hakaret fiillerine ise ta'zir suçu kapsamında ceza verilmiştir. Ta'zir cezasını gerektiren hakaret suçları ile ilgili hükümlere hem klasik dönem kanunnamelerinde hem de 1840, 1851 ve 1858 yıllarında yürürlüğe giren Tanzimat Dönemi ceza kanunnamelerinde yer verilmiştir. Ta'zir gerektiren hakaret suçu hadd-i kazf ve irtidat suçunun yanı sıra iftira suçu ile de yakından ilgilidir. Modern ceza hukukunda hakaret suçunun işleniş şekillerinden biri olan somut fiil isnadı Osmanlı ceza hukukunda 1858 Ceza Kanunnamesine yapılan 1911 yılı değişikliklerine kadar yalnızca iftira suçu ile ilişkili olarak düzenlenmiştir. 1911 yılında yapılan değişiklikle somut fiil isnadı iftira suçundan bağımsız olarak hakaret suçunun işleniş yollarından biri olarak kabul edilmiştir. Çalışmamızda İslam ceza hukuku kuralları ve kanunname hükümleri ışığında hadd-i kazf, irtidat suçu ve ta'zir gerektiren hakaret suçunu oluşturan hakaret fiillerine ve bu suçlar arasındaki sınıra yönelik açıklamalarda bulunulmuştur. Bunun yanı sıra Tanzimat Dönemi ceza kanunlarıyla hakaret suçu düzenlemelerine dair atılan adımlardan da bahsedilmiştir. Hakaret suçunun Tanzimat Fermanı öncesi ve sonrası hukuki düzenlemelerle ve yukarıda sözü edilen diğer suçlarla ilişkili olarak incelenmesinin suça ilişkin uygulamanın anlaşılması açısından önemli olduğu düşünülmektedir."
