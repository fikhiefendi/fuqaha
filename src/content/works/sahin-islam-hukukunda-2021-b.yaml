abstract: "Aile, her ne kadar toplumun en küçük birimi olsa da üstlendiği rol dikkate alındığında toplumun en önemli yapıtaşıdır. İslâm, ailenin kuruluşundan itibaren eşlere bir takım görev ve sorumluluklar yükleyerek aile içindeki huzurun sağlanmasını hedeflemiştir. Taraflar arasında çıkan anlaşmazlıkların giderilmesini ve aile birliğini tehdit eden sorunların mümkün mertebe aile birliğini bozmadan giderilmesini amaçlamıştır. Her şeye rağmen aile içinde huzurun sağlanamaması durumunda ise son çare olarak tarafların ayrılmalarını meşru görmüştür. Ayrılık, mevcut aile ortamında huzur bulamayan taraflara yeni bir aile kurup arzulanan huzuru bulma fırsatı verir. İslâm hukukunda evlilik hayatının sona ermesi farklı şekillerde olabilir. Talâk, aile birliğini bitirme şekillerinden biri olup toplumda en yaygın olan ayrılık şeklidir. Talâk, sahih bir şekilde kurulmuş olan nikâh akdinin koca tarafından belirli lafızlarla derhal veya gelecekte ortadan kaldırılması ve izale edilmesi anlamına gelir. İslâm hukukunda talâk, Sünnet'e uygunluğuna göre ve boşanan tarafların yeniden evlilik hayatına dönmeleri için yeni bir nikâh ve mehre ihtiyaç duyulup duyulmamasına bağlı olarak farklı şekillerde ayrıma tabi tutulmuştur. Bu çalışmada talâkın ric'î veya bâin oluşu arasındaki farklar ile söz konusu talâk çeşitlerinin hukuki sonuçlarının neler olduğu karşılaştırmalı olarak ele alınmıştır. Bu doğrultuda çalışma üç bölümden oluşmaktadır. İlk bölümde boşanmaya doğrudan etkisi sebebiyle ana hatlarıyla nikâh konusu işlenmiştir. İkinci bölümde talâk konusu, çalışmanın başlığı ile uyumlu olarak ric'i talâk-bâin talâk ayrımı ele alınmış olup üçüncü bölümde ise hükmüne göre boşanmanın sonuçları üzerinde durulmuştur."
