abstract: "Günümüzde özellikle yetenekli çalışanların işletmelerde tutundurulmasını sağlayan en önemli husus doğru insan kaynakları uygulamalarıdır. İşletmeler doğru insan kaynağını bünyelerinde bulundurarak daha fazla rekabet edebilir hale gelmektedirler. Çalışanlar için önem arz eden bu uygulamaların tanıtılması ve markalaştırılması adına son yıllarda işveren markası kavramı işletmeler için daha önemli hale gelmiştir. Sadece çalışanların değil potansiyel dış adayların da dikkatini çekmeyi başaran işveren markası uygulamaları sayesinde oluşan çalışan memnuniyeti ve çalışan bağlılığı, işten ayrılma niyetinin de azalmasına neden olmuştur. Yapılan araştırma ile işveren markası uygulamalarının işten ayrılma niyetine etkilerinin araştırılması hedeflenmiştir. Tezde nicel araştırma yöntemi kullanımış olup, araştırmada kullanılan veriler katılım bankacılığı alanında faaliyet gösteren toplam 256 beyaz yakalı çalışandan anket uygulamasıyla elde edilmiştir. Toplanan veriler SPSS yöntemi ile analiz edilmiştir. Araştırma sonucunda elde edilen verilere göre işveren markası uygulamalarının işten ayrılma niyetine etkisi arasında istatistiksel olarak anlamlı bir etki gücünün olduğu tespit edilmiştir. Bu etki incelendiğinde ters orantılı bir şekilde gerçekleştiği görülmektedir. Yani işveren marka algısı arttıkça işten ayrılma niyeti azalmakta veya tam tersi şekilde işveren marka algısı azaldıkça işten ayrılma niyeti artmaktadır. Araştırma kapsamında demografik değişkenlerin, çalışanların işten ayrılma niyetine etkisinin olup olmadığına yönelik yapılan çalışmada ise eğitim değişkeninin işten ayrılma niyetinde anlamlı bir etkisi olduğu tespit edilmiştir. Bu çalışma sonucunda ulaşılan bilgiler ve bulgular genelleme yapmak için yeterli olmasa da söz konusu alan için kavramsal yapıların zenginleşmesine katkı sağlayacağı düşünülmektedir."
