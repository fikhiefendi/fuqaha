abstract: "Bu tez, İslam medeniyetinin önemli kurumlarından biri olan vakıf müessesesinin âtıl (işlevsiz) vakıf malları üzerindeki tasarruf imkanlarını İslam fıkhı açısından incelemektedir. Vakfın, toplumsal dayanışma açısından tarihî ve güncel önemi vurgulanarak, günümüzde vakıflara olan ilginin azalma sebebi ve vakıfların idamesinde karşılaşılan sorunlara dikkat çekilmektedir. Çalışma, vakıf malının korunması ve etkin kullanımının hukukçuların ve yöneticilerin temel görevlerinden biri olduğunu belirtmekte ve değişen dünya koşullarına uyum sağlayabilmek için vakıf hukukunun güncellenmesi gerektiği fikrini savunmaktadır. Tezin temel problemi, âtıl vakıfların aktif edilmesine İslam fıkhının nasıl bir çözüm ürettiği sorusu üzerine kuruludur. Bu ana soru etrafında, genel anlamda vakfın özelde âtıl vakfın tanımı, bu tür vakıflara yönelik yapılabilecek işlemlerin neler olduğu ve bu işlemlerin fıkhî açıdan farklı değerlendirmelere tabi olup olmadığı gibi alt sorular ele alınmaktadır. Araştırmanın amacı, âtıl vakıflarda yapılan tasarruf türlerini belirlemek, bu tasarrufların vakfın amacına ulaşmasındaki rolünü incelemek, farklı mezheplerin bu konudaki görüşlerini karşılaştırmak ve vakıfların âtıl hale gelmesini önlemek için fıkıh alimlerinin belirlediği şartları ve sınırları açıklamaktır. Çalışmada, farklı mezheplerin fıkhî görüşleri sunulmuş ve aralarındaki benzerlik ve farklılıklar vurgulanmıştır. Tez, vakıfların menfaati kesilen malları üzerindeki tasarruf hükümlerini kapsamlı bir şekilde ele alan özgün bir çalışma olmayı hedeflemekte ve bu alandakimevcut literatüre katkı sağlamayı amaçlamaktadır"
