abstract: "TBK m. 66 hükmü, adam çalıştıranın sorumluluğu ve organizasyon sorumluluğu olmak üzere, iki farklı ve bağlantılı sorumluluk düzenlemesini kapsamına alır. Sosyo - teknik bir organizasyon yapısı üzerine kurulu TBK m. 66/III hükmü, TBK m. 66/I-II uyarınca, eBK m. 55 anlamındaki adam çalıştıranın sorumluluğundan ayrı ve bağımsız nitelikte bir kusursuz sorumluluk hali olmak üzere organizasyon sorumluluğunu (işletme sorumluluğu) öngörür. Organizasyon sorumluluğunun tipiklik unsurunu, işletme organizasyonundaki objektif eksiklik oluşturur ve söz konusu sorumluluk, işletmesel alandaki genel sorumluluk düzenlemesi niteliğindedir. VE-OR Art. 49a hükmü, TBK m. 66/III yanında; amaç ve işlev bakımından aynı nitelikteki OR 2020 Art. 59, PETL Art. 4: 202 ve öE § 1304 hükümlerinin temel kaynağını oluşturur. Bu nedenle TBK m. 66/III hükmü, söz konusu düzenlemelerle birlikte değerlendirilir. Varlığı karine olarak kabul edilen objektif özen yükümlülüğünün ihlali esasına dayalı, kurtuluş kanıtı getirilmesi mümkün bir olağan sebep sorumluluğu teşkil eden ve sorumluluk hukukunun zararın önlenmesine yönelik öncelikli amacına da hizmet eden organizasyon sorumluluğu, hizmet ve ürün hatalarının sebep olduğu zararlara ilişkin olarak uygulanma imkânına sahip tek ve genel sorumluluk düzenlemesidir. Organizasyon sorumluluğunun ortaya çıkabilmesi için bağımlı çalıştırma ilişkisi bulunan bir işletmenin mevcut olması aranır. Zarara mutlaka çalışanın sebep olması zorunlu değildir. Sorumluluğun süjesini, kendi menfaat ve hesabına, yarar ve zararı kendisine ait olmak üzere işletme faaliyetini yürüten kişi (işleten) oluşturur. Zararın doğumuna kaynaklık eden olgu, işletme faaliyetidir. Organizasyona özene ilişkin (özel kurtuluş kanıtı) ve organizasyona özen yükümlülüğünün ihlali ile zarar arasındaki nedensellik bağına ilişkin (genel kurtuluş kanıtı) olarak işletenin kurtuluş kanıtı getirememiş olması, organizasyon sorumluluğunun olumsuz şartını teşkil eder."
