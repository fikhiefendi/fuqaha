abstract: "Bu tez 1550-1700 yılları arasında Osmanlı Devleti'nde taşra müftülüğünün gelişimini ve dönüşümünü, imparatorluğun farklı bölgelerindeki resmî vazifeli müftülerin kariyerleri üzerinden incelemektedir. Tezin genel çerçevesini 16. yüzyılın ortalarından itibaren Osmanlı ilmiye hiyerarşisinin büyüdüğü ve ulemanın merkezî bürokrasi içerisinde rolünün arttığı dönem oluşturmaktadır. Başta Şakâik zeyilleri olmak üzere ulema biyografilerinin yer aldığı tabakat kitapları ile müftü atama kayıtlarının bulunduğu ruus defterleri çalışmamızın iki temel kaynak grubunu oluşturmaktadır. Taşra müftülüğünün gelişimi ve yayılma süreci kabaca iki dönemde gerçekleşmiştir. 17. yüzyılın başlarına kadar olan ilk dönemde, merkezî pozisyonlarda görev yapan ulema taşranın belli başlı önemli şehirlerine müftü olarak atanmıştır. Taşra müftülüğünün eyalet ve sancaklara ilaveten birçok kazaya da yayıldığı 17. yüzyılın ikinci çeyreğinden sonraki dönemde ise ekseriyetle yerel ulema bu mansıplarda istihdam edilmiştir. Müftülere aynı zamanda bulundukları bölgedeki en prestijli medresenin müderrislik vazifesi de verildiği için bu süreçte birçok medrese de ilmiye hiyerarşisine dahil edilmiştir. Müftü-müderrislik, 16. yüzyılın ortalarından itibaren Osmanlı ilmiyesinde artan mansıp ihtiyacına da önemli bir katkı sunmuştur. Atanma belgelerinde Hanefî mezhebinin hâkim görüşüne göre fetva vermeleri ve muteber fıkıh kitaplarından nakil yazmaları istenen taşra müftüleri, Osmanlı Devleti'nin resmî mezhep uygulamasına geçtiği süreçte kadılarla birlikte önemli bir rol oynamıştır."
