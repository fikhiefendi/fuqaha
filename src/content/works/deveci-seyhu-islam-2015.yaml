abstract: "Osmanlı Devleti, İstanbul'un topraklarına katılmasıyla birlikte artık bir imparatorluk haline gelmiştir. İmparatorluk yapısına bürünmüş bir devletin ise temel özelliği emperyal bir ideolojiye sahip olması ve bünyesinde her yönden çeşitliliği barındırmasıdır. Fatih döneminden itibaren İmparatorluk olan Osmanlı, çok dinli, çok etnikli, çok kültürlü ve çok kimlikli bir yapıya bürünmüştür. Ancak bu yapıyı sosyal ve idari açıdan dengede tutabilmesi için sağlam bir zemine oturtması şarttı. O dönemin şartları içerisinde bunu yapabilmesinin en akılcı yolu ise“Millet Sistemi”idi. Çalışmamızda, Osmanlı Devleti'nin toplumsal organizasyonunu sağlayan Millet Sistemi'nin pratikte uygulanışını Ebu's-Suûd Efendi fetvalarından okuduk. Fetvalar her ne kadar İslâm Hukuku'nun tali kaynakları arasında yer alsa da İslâm Hukuku'nun hangi devirde nasıl anlaşıldığı ve yorumlandığını, söz konusu çağın sorun ve çözümlerini, hukukun canlılığı ve elastikiyetini yansıtması bakımından son derece önem arz etmektedir. Özellikle İslâm Hukuku'nun uygulandığı her devlette sosyal yaşamın hemen hemen her alanına ilişkin olarak fetva kurumunun yaygın bir şekilde uygulama alanı bulması da bizim fetvaları temel almamızda etkili olmuştur. Bu bağlamda çalışmamızda ilk olarak“fetva ve şeyhü'l-islâmlık”kavramları üzerinde durulmuş ve tanımlar bölümünde, çalışmamızın temelini teşkil eden fetvaların sahibi olan Şeyhü'l-islâm Ebu's-Suûd Efendi'nin hayatına değinilmiştir. Ardından Millet Sistemine dair genel bir perspektif sunulmuştur. Tezimizin esas bölümünü teşkil eden Millet Sistemi'nin pratikte uygulanışını yansıttığımız kısım ise hukuksal alan, dinsel ve gündelik yaşam ve ekonomik yapı olmak üzere üç ana bölümden oluşmaktadır. Bu bölümlerde Millet Sistemi çerçevesinde sistemin unsuru olarak kabul edilen gayrimüslimlerin toplum içindeki yaşantılarına değinilmektedir. Bu süreç bahsettiğimiz gibi Ebu's-Suûd Efendi'nin fetvalarından izlenmiştir. Ancak çalışmamız boyunca Millet Sistemi, Ebu's-Suûd'un yaşadığı dönemle sınırlı kaldığımız unutulmadan değerlendirmeye çalışılmıştır."
