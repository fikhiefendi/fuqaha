abstract: "Türklerin, bankacılık faaliyetlerine başlaması 19. Yüzyılda Osmanlı Devleti Dönemi ile gerçekleşmiştir. Daha sonrasında Türkiye Cumhuriyeti Devleti'nin kurulması ile birlikte bankacılık üzerine birçok yenilikler ortaya çıkmıştır. Dünyada 1970'li yıllarda etkisini gösteren katılım bankacılığı, Türkiye'de ilk olarak 1983 yılında çıkan Kanun hükmünde kararname ile özel finans kurumlarının kurulmasına izin verilmesi ile birlikte tanınmaya başlamıştır. 2005 yılına kadar özel finans kurumları olarak adlandırılan katılım bankaları 2005 yılında çıkarılan 5411 sayılı Kanun ile birlikte ''Katılım Bankaları'' unvanını alarak ticari bankacılık faaliyeti gösteren diğer bankalarla daha yoğun bir şekilde rekabet etmeye başlamıştır. Altın bankacılığı, toplumun yatırım/tasarruf amaçlı elinde tuttuğu altınları bankalara çekerek ekonomiye kanalize etmenin bir aracıdır. İlk olarak 1980'li yıllarda bir bankanın altın mevduatı sertifikası çıkarması ve çeyrek altın alımı/satımı ile başlamıştır. 1990'lı yıllarda ise, bir başka banka altın bankacılığı alanında kuyumculara altın kredisi sağlama çalışması yapmış, ancak başarılı olamamıştır (Öz, 2015: 44). Buna karşılık, altın mevduatı hesapları bilançolarda yer almaya başlamıştır. Bu ilk teşebbüslerin ardından, 2010'lardan sonra fiziki olarak altın toplayan bir katılım bankası, önemli bir finansal kaynağın bankaların Pasif kalemlerindeki yerini almasını sağlamıştır (Çeliktedir, Çetin, 2015: 11-32). Altının bankalar açısından önemli ve yaygın bir finansal kaynak olabileceği gerçeği keşfedilmiştir. Aslında, katılım bankaları zihinsel olarak böyle bir yeniliğe önceden hazırlıklıdırlar. Zira altın, faizsiz bankacılığın dayandığı (İslami) prensipler açısından zaten emtia değil para olarak kabul edilmektedir. Yanı sıra, faizsiz bankaların mevcut veya potansiyel müşterilerinin çoğunluğu inançları gereği tasarruflarının bir kısmını faiz içermeyen yatırım araçlarında değerlendirme eğilimindedir. Bu kapsamdaki araçların başında ise, altın gelmektedir. Katılım bankaları bu ve buna benzer saiklerin neticesinde“altın bankacılığı”na geçişte öncülük yapmakta gecikmemişler, aynı şekilde kavramın Türk bankacılık sektörüne kazandırılmasına da öncülük yapmışlardır. Bu çalışmada; katılım bankalarının fiziki altın toplama uygulamasının bireylere, ülke ekonomisine, bankacılık sektörüne olan katkıları hakkında araştırma yapılıp incelenmiştir. Bu çalışma bundan sonraki çalışmalara kaynak olması hedeflenmiştir. Anahtar Kelimeler; Bankacılık, Katılım Bankacılığı, Altın Bankacılığı"
