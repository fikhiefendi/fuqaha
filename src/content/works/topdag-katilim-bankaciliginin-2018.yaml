abstract: "Geçmişi 1960'lı yıllara dayanan faizsiz bankacılık öncelikle Mısır ve Pakistan gibi Müslümanların yoğun olduğu ülkeler başta olmak üzere birçok bölgede yerel nitelikte uygulama alanı bulmuştur. Faizsiz bankacılık modeli ilk kez“Özel Finans Kurumları”( ÖFK) ismi ile 1985 yılında hizmet vermeye başlamış olup daha sonra 2005 yılında Bankacılık Kanunu ile kâra ve zarara katılma manasında“Katılım Bankası”adını almıştır. Yaklaşık olarak otuz yılı aşkın bir geçmişe sahip olan bu kurumlar, İslam coğrafyasında ortaya çıkmasına rağmen; Avrupa, ABD ve Uzak Doğu ülkelerinde uygulama alanı bulmuşlardır. Küresel ölçekte faaliyet gösteren bu banka ve finans kurumları İslami esaslara göre hizmet verirken, aynı zamanda geleneksel sisteme yeni ürünler katmıştır. Bu çalışma kapsamında, Türkiye'de faaliyet göstermekte olan 3 faizsiz bankanın ortalama kâr payı oranları ile geleneksel bankaların faiz oranları ve enflasyon arasındaki ilişkinin varlığı ve yönü eşbütünleşme ve nedensellik analizleri ile araştırılmıştır. İlk aşamada, Johansen eşbütünleşme analizi ardından Granger ve Toda-Yamamoto (1995) nedensellik analizleri yapılmıştır. Yapılan ekonometrik analizlerde, 1, 3, 6 ve 12 ay vadeli kâr payı, faiz oranları ve enflasyon arasında uzun dönemli bir ilişki ortaya çıkmıştır. Her iki nedensellik analizi sonucunda, faiz oranlarından kâr payı oranlarına doğru tek taraflı nedensellik ilişkisi bulunmuştur. Türkiye'de bulunan katılım bankalarının getiri oranlarının, konvansiyonel bankaların faiz oranları tarafından belirlendiği tespit edilmiştir. Çalışmanın sonucunda, bulunan tek yönlü nedensellik ilişkisi ile ilgili genel değerlendirmelerde bulunulmuştur."
