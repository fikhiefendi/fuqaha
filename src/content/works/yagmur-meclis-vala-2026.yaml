abstract: "Bu çalışma, Meclis-i Vâlâ-yı Ahkâm-ı Adliyye kararları ve Tanzimat dönemi ceza kanunnameleri çerçevesinde Osmanlı ceza hukukunda meydana gelen dönüşümü İslam hukuku perspektifinden incelemektedir. Araştırmada, Osmanlı Devleti'nin klasik dönemde büyük ölçüde şer'î hukuk esaslarına dayalı bir sistemle yönetildiği, özellikle Hanefi mezhebi merkezli bir hukuk pratiğinin benimsendiği ortaya konmuş bununla birlikte ilgili meselelerde diğer mezheplerin görüşleri de mukayeseli biçimde değerlendirilmiştir. Tanzimat öncesinden başlayan reform süreci tarihsel bağlam içerisinde ele alınmış hukuki modernleşmenin kurumsal ve normatif etkileri analiz edilmiştir. Çalışmada hürriyeti bağlayıcı cezalar, had, kısas, ta'zîr ve mali ta'zîr yaptırımları İslam hukukunun temel kaynakları doğrultusunda incelenmiş, mezhepler arasındaki yaklaşım farklılıkları dikkate alınarak suç ve ceza ilişkisi sistematik biçimde değerlendirilmiştir. Özellikle 1840 Tarihli Ceza Kanunnâme-i Hümâyûnu, 1851 Tarihli Kanun-ı Cedid ve 1858 Tarihli Ceza Kanunname-i Hümâyûnu hükümleri madde bazında incelenmiş ilgili suçlara ilişkin yaptırımlar karşılaştırmalı olarak tespit edilmiştir. Bu kapsamda erken Tanzimat düzenlemelerinde şer'î hukuk anlayışının belirgin biçimde korunduğu ancak 1858 tarihli ceza kanunu ile Avrupa hukukunun etkisinin arttığı görülmüştür. Araştırmada tarihsel yöntem ve belge inceleme tekniği kullanılmış, kanun metinleri, Meclis-i Vâlâ defterleri ve arşiv belgeleri birlikte değerlendirilmiştir. Suç türlerine ilişkin arşiv kayıtları transkribe edilerek uygulama örnekleri analiz edilmiş ve normatif düzenlemelerle karşılaştırılmıştır. Elde edilen bulgular, Tanzimat sürecinde ceza hukukunda önemli bir dönüşüm yaşandığını göstermektedir. Özellikle had ve kısas temelli yaptırımların uygulama alanının daraldığı buna karşılık hapis ve mali cezaların giderek yaygınlaştığı tespit edilmiştir. Bununla birlikte modern kriminoloji çalışmalarının ortaya koyduğu kesinlik ve caydırıcılık ilkeleri dikkate alındığında, İslam hukukunda öngörülen ceza sisteminin insan davranışı ve toplumsal düzen bakımından güçlü bir teorik zemine sahip olduğu sonucuna ulaşılmıştır."
