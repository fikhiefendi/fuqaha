abstract: "Bu çalışmanın konusu, Türk hukukunda maslahata uygunluk ilkesi çerçevesinde Cumhuriyet savcısının kamu davasını açmada takdir yetkisi ile bunun uygulanmasında ortaya çıkan problemlerin incelenmesi ve çözüm yollarının araştırılmasıdır. Son zamanlara kadar Türk hukukuna yabancı olan maslahata uygunluk ilkesi, 5271 sayılı Ceza Muhakemesi Kanunu ve 5395 sayılı Çocuk Koruma Kanunu olarak anılan hukukî düzenlemelerin 2005 yılında yürürlüğe girmeleriyle birlikte hukukumuza girmiştir. Maslahata uygunluk ilkesi ve bunun kabulünün sonuçlarından biri olan Cumhuriyet savcısının kamu davasını açmada takdir yetkisi, Türk hukukunda, yukarıda zikredilen kanunlarda değişiklik öngören 5560 sayılı Kanunun 2006 yılında kabulüyle beraber güncel hâlini almışlardır. Bu çalışmada, öncelikle kamu davasının açılması hususundaki ilkeler, kovuşturma mecburiyeti ve maslahata uygunluk ilkeleri, bunların mukayeseli hukuktaki durumları izah edilmiş, ardından Cumhuriyet savcısına kamu davasını açmada takdir yetkisi verilen haller açıklanmaya çalışılmıştır. Çalışmanın hedefi, Türk hukukunda, soruşturma safhası sonunda toplanan delillerin suç işlendiğine dair yeterli şüphe oluşturmasına rağmen, kamu davasının açılmasında Cumhuriyet savcısına takdir yetkisi verilen haller olan, Cumhuriyet savcısının kamu davasını açmada takdir yetkisi ve kamu davasının açılmasının ertelenmesi kurumlarının uygulamada neredeyse hiç işletilmemesinin sebepleri ve bu problemin nasıl çözülmesi gerektiğinin açıklanmasına gayret etmektir. Veri toplama metodları olarak, literatür taraması ve yarı yapılandırılmış derinlik mülâkatları kullanılmıştır."
