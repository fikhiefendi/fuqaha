abstract: "Çalışmamızda son dönem Osmanlı ulemasından Bayezid Dersiâmı Ermenekli Süleyman Sırrı Efendi'nin (ö. 1931) ilgili Hülâsatü'l-Muhtâreyn isimli eseri ele alınmaktadır. Sırrı Efendi, başta fıkıh olmak üzere İslamî ilimlerin neredeyse bütün alanlarında eserler telif etmiş, gelenekle moderni, medreseyle mektebi bir araya getirdiğini söyleyebileceğimiz önemli bir isimdir. Hülâsatü'l-Muhtâreyn isimli eseri ise Mekteb-i Hukuk'ta Kitâbu'n-Nikah başlıklı dersi vermek üzere kaleme almıştır. Eser aynı zamanda Aile Hukuku Kararnamesi'ne kadar aile hukuku alanıyla ilgili yeni bir metotla, sistematik bir tarzda kaleme alınmış ilk teşebbüslerden biri olarak kabul edilebilir. Bu eser, Süleyman Sırrı Efendi'nin diğer eserlerinde olduğu gibi hak ettiği ilgiyi bulamamıştır. Bu eserin tanıtım ve değerlendirmesini yapıp, latinize halini sunmanın, eserin bilinmesi ve ondan istifadeyi arttırma bakımından önem taşımaktadır. Çalışmamızda Süleyman Sırrı Efendi'nin hayatı ve faaliyetleri hakkında bilgi verilip, sözkonusu eserinin değerlendirmesi yapılacak, dönemi ve günümüz bakımından önemi ortaya konulacaktır. Ayrıca çalışmanın sonunda Hülâsatü'l-Muhtâreyn'in latinize metni verilerek, günümüz ilim ve eğitim dünyasının istifadesine sunulacaktır."
