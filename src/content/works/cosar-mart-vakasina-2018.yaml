abstract: "31 Mart Vakası II.Meşrutiyet'in ilanından bir sene sonra İstanbul'daki Avcı Taburu askerlerinin ayaklanması ile başlayan bir isyan hareketidir. Ayasofya meydanında toplanan askerler ve halkın çeşitli kesimlerinden insanlar şeriat istediklerini ifade etmişler ve hükümetin istifa etmesini talep etmişlerdir. İttihat ve Terakki Cemiyeti'nin baskıcı uygulamalarına tepki olarak ortaya çıkan bu isyan hareketi özellikle İstanbul dışında meşrutiyet rejimini ortadan kaldırma amaçlı bir hareket olarak yorumlanmıştır. Selanik'ten gelen Hareket Ordusu meşrutiyetin muhafazası ileri sürülerek İstanbul'a girmiş ve isyancılar İttihat ve Terakki Cemiyeti tarafından suçlu bulunmuştur. 31 Mart Vakası sonucunda padişah Abdülhamid tahttan indirilmiş ve böylece İttihat ve Terakki Cemiyeti Osmanlı Devleti'nde daha da etkin bir konuma gelmiştir. Bu önemli olayda Osmanlı uleması da görüşlerini dile getirmiştir. 31 Mart Vakası sürecinde Cemiyet-i İlmiye-i İslamiyye yayınladığı beyanname ve gönderdiği nasihat heyeti aracılığı ile isyanın sükunete kavuşması için gayret göstermiştir. İstanbul ulemasından tanınmış şahsiyetler vaka ile ilgili olarak görüşlerini gazeteler, dergiler ve kitaplar yoluyla açıklamışlardır. İstanbul dışından ise çeşitli ilmî cemiyetler Meclis-i Mebusan'a gönderilen telgraflar ile görüşlerini ifade etmişlerdir. 31 Mart Vakası ile ilgili olarak ulemanın yorumu muhteliftir. Ulemanın çoğunluğuna göre bu vaka meşrutiyeti ortadan kaldırmaya yönelik bir hareket değil, İttihat ve Terakki Cemiyeti'nin baskıcı politikasına karşı bir tepkidir. Bununla birlikte, ulema bu vakanın İslamiyet'e aykırı bir fitne girişimi olduğunu belirtmiş ve isyan hareketini kınamıştır."
