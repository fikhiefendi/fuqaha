abstract: "Kan transfüzyonu güvenliğini tehdit eden, yüksek morbidite, kronikleşme oranına sahip, ölümcül komplikasyonlara sebep olabilen HCV enfeksiyonu önemli bir halk sağlığı problemidir. Hepatit C enfeksiyonun laboratuvar tanısında tarama amaçlı olarak kullanılan Anti-HCV testi ve doğrulama amaçlı kullanılan rekombinant immunoblot assay (RIBA) testinin yorumlanmasında zorluk oluşturan düşük Anti-HCV reaktifliği ve RIBA belirsizliği durumlarında, HCV enfeksiyonunun var olup olmadığının belirlenmesinde neopterin ve sCD14 düzeylerinin öneminin araştırılması ve neopterin ile sCD14 sonuçlarına göre, düşük Anti-HCV reaktifliği ve RIBA belirsizliği gösteren atipik olgulara dönük yeni bir tanısal bakış açısı kazandırılması amaçlanmıştır. Bu amaçla Anti-HCV testlerinde Signal/cut-off değerleri >1- 0,05), bu iki grubun neopterin düzeyi HKG (6,46±1,76) olgularına göre anlamlı derecede düşük bulunmuştur (p<0,001). sCD14 düzeyleri ise HKG olgularında (6,07±1,08), SKG olgularına göre yüksek saptanırken (p<0,001), TÇG olgularında en yüksek saptanmıştır (TÇGxHKG: p<0,05 TÇGxSKG: p< 0,001). Her iki belirtecin cinsiyet ve yaş grupları temelinde çalışma ve kontrol gruplarında dağılımı anlamlılık göstermemiştir. Sonuç olarak; Kan güvenliği için NAT'ın uygulanamadığı kan bankalarında sağlıklı kan donörü taramalarında sCD14'ün değil neopterinin paralel olarak EIA/CMIA yöntemine dayalı 4.kuşak combo testlerle birlikte kullanılmasının yararlı olabileceği kanaati bizde oluşmuştur."
