title: "Hcv Enfeksiyonlarının Tanısında Tarama ANTİ-HCV) ve Doğrulama (RIBA) Testlerinde İnvitro Sorunlar: Düşük Anti-hcv Reaktifliği ve Rıba Belirsizliği ile Neopterin ve Scd14 İlişkisi"
titleTranslation: {"en": "In vivo problems of screening (anti-HCV) and supplemental (RİBA) tests in hcv infection diagnosis: low anti-HVC reactivity and indeterminate riba relationship with neopterin and scd14"}
