abstract: "Osmanlı Devleti din, dil, etnik yapı ve kültürel bakımdan homojen olmayan geniş bir coğrafyada asırlar boyu varlığını sürdürmüştür. Altı asır ayakta kalmasında askeri, iktisadi, idari, sosyal, demografik ve kültürel özelliklerinin yanı sıra hukuk anlayışının da büyük rolü olmuştur. Osmanlı padişahları yargı ve hukukun öneminin farkında olmuş ve fethedilen bölgelerin yönetimini askeri unsurlara bırakmak yerine mahkemeler kurarak kadılara devretmiştir. Kadıların başında olduğu şer'i mahkemeler insanların bulunduğu bölgelerde ilk başvurdukları yargı organı olmuşlardır. Bu manada kadıların kaleme aldıkları şer'i siciller/kadı sicilleri içerdiği kayıtların konuları itibariyle halkı ilgilendiren ekonomik ve sosyal kayıtları barındırmaktadır. Biz de bu doğrultuda Galata'nın 1642-1643 yılları arasını kapsayan 64 numaralı Galata şer'iyye sicilini ana kaynak olarak kullanmayı tercih ettik. Kısa bir dönemi içine almasına rağmen kayıtların çeşitliliği incelenen dönemde Galata'nın birçok yönünü yansıtması açısından önemlidir. Bu çalışmada 64 numaralı Galata şer'iyye sicili ışığında Galata'nın 1642-1643 yılları arasındaki sosyal ve ekonomik hayatı incelenmeye çalışıldı. Üç ana bölümden oluşan tezin ilk başlığı olan“Galata'nın Kısa Tarihi ve Osmanlı'da Kadılık Müessesi”kısmında Galata'nın tarihi ana hatlarıyla anlatıldı ve Osmanlı'daki kadılık müessesi hakkında bilgi verildi. İkinci ana bölüm ise“Sosyal Hayat”olarak adlandırılmıştır. Bu başlık altında Osmanlı ailesinin kuruluş ve dağılma aşamaları, kadınların sosyal ve ekonomik hayata entegre olmaları, gayrimüslimler, köleler ve müstemenlerin sosyal ve iktisadi hayatta işlemleri incelenmeye çalışıldı. Son ana bölüm ise“İktisadi Hayat”başlığı altında değerlendirilmiştir. Bir önceki bölümden farklı olarak burada ticari işlemlere odaklanılmış, vakıfların gerçekleştirdiği ticari işlemler ve halkın içerisinde yer aldığı mülk satışı ve borç alışverişi gibi iktisadi faaliyetler incelenmeye çalışılmıştır."
