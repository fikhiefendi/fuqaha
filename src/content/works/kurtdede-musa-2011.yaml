abstract: "?Musa Carullah Bigiyef ve İslam Hukuku İle İlgili Görüşlerinin Değerlendirilmesi? adıyla yapmış olduğumuz bu çalışma bir giriş ve üç bölümden oluşmaktadır.Giriş bölümünde tez ile ilgili teknik bilgiler: ı. Konunun önemi, ıı. Konunun sınırlandırılması, ııı. Konunun kavramsal çerçevesi, ıv. Konunun incelenmesinde izlenen yöntem, v. Kaynakların değerlendirilmesi, vı. Konunun sunulması konuları içermektedir.Birinci bölüm, Musa Carullah'ın hayatı, ilmi şahsiyeti ve İslam Hukuku alanında yazmış olduğu eserler ile ilgili özet mahiyetinde bilgileri muhtevidir.İkinci bölüm, Carullah'ın İslam hukukunun kaynaklarını değerlendirmesi ve İslam hukukunun kaynakları ile ilgili görüşleri içermektedir.Üçüncü bölüm ise, Musa Carullah'ın ibadetler ve güncel fıkhî meseleler ile ilgili görüşleri içermektedir."
