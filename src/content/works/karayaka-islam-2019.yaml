abstract: "Bu tezin amacı İslam borçlar hukukunda akit hürriyetinin var olup olmadığını ve sınırlarının ne olduğunu ortaya koymaktır. Zira insanlık tarihi boyunca insanların ihtiyacına binaen var olan ve gelişerek zenginleşen borçlar hukuku alanına giren akitler, diğer hukuk sistemlerinde olduğu gibi İslam hukukunda da önemli bir yer işgal etmektedir. Bu sebeple biz de bu çalışmamızla İslam hukukunun, bu akitlere bakışının ne olduğunu ortaya koymayı hedefledik. Birinci bölümde konuyla ilgili kavramlar olan borç, akit, irade, hak, hürriyet ve akit hürriyeti kavramlarını ele aldık. İkinci bölümde konunun hukuki dayanaklarını, İslam hukukunun kaynaklar silsilesini dikkate alarak sırası ile ifade ettikten sonra hukukçuların bu hususta vardıkları kanaatlerini detaylı bir şekilde zikrettik. Üçüncü bölümde ise akit hürriyetinin kısımları olan akit yapma ve karşı tarafı seçme, akdin şeklini belirleme ve akdi düzenleme ve bu bağlamda akdin konusunu seçme, değiştirme ve sonlandırma hususundaki hürriyeti ve sınırlamalarını ele alıp inceledik. Yaptığımız bütün bu incelemeler neticesinde vardığımız sonuca göre İslam hukukunda akitlerde asıl olan akitlerin gönül rızasına dayalı olması ve mubah olmasıdır. Zira akitler, insanların ihtiyaçlarını gidermek için ihdas edilmiştir. Bunu tamamen yok saymak veya belli akitlerle sınırlı tutmak insanları ciddi anlamda sıkıntıya sokar. İslam hukuku insanların hayatında çok önemli bir yeri olan bu akitlerde, tarafların bir birlerini aldatmaması ve tarafları nizaya sevk etmemesi için akdin her yönü ile şeffaf olmasını istemiştir. Bu akitlerden sadece taraflardan birinin haksız kazanç elde ederek diğer tarafa zarar verecek mahiyette olanlarını yasaklamıştır."
