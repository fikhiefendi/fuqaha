abstract: "Osmanlı arşiv kaynakları arasında içerdiği çeşitli konular bakımında önemli bir yeri olan şer'iyye sicilleri Osmanlı şehir tarihi ve bu şehirlerin sosyoekonomik durumunu anlamak isteyen araştırmacılar için ana kaynaklardır. Kadı ve yardımcısı naib tarafından mahkemede görülen davaları içeren ve aynı zamanda merkezden gelen emir, ferman, berat, buyruldu ve tezkire gibi belge suretlerinden oluşan defterlere şer'iyye sicilleri denmektedir. Sicil kayıtları incelenen şehrin, idari yapısı, mahalleleri, köyleri ve nahiyeleri hakkında bilgiler vermektedir. Aynı zamanda şehrin hem sosyal ve iktisadi yapısı hem de kültürel yapısı hakkında bilgi edinmek mümkündür. Bu çalışmada; 95 No'lu Amasya Şer'iyye Sicili'nden elde edilen verilere dayanarak Amasya'nın (H. 1283-1290 / M. 1866-1874) yılları arasındaki sosyoekonomik durumu ve idari yapısı ele alınmıştır."
