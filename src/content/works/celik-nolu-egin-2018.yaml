abstract: "Osmanlı Devleti'nin hukukî, iktisâdî, dinî, askerî, idârî ve sosyal düzeni hakkındaki önemli olan bilgileri şer'i mahkemelerde kadı ve yardımcıları tarafından kayıt altına alınan şer'iyye sicillerinde bulunmaktadır. İslam Hukukuna göre teorik olarak bildiğimiz veraset, vesayet, vekâlet, aile hukuku, şahitlik, vakıf vb. konuları şer'iyye sicillerinde uygulamalı olarak görmek günümüze yansıyabilmesi açısından önem arzetmektedir. Çalıştığımız dönem H. 1286-1287 (M.1868-1870) yılları olup, bu dönemde Eğin kazasında Müslümanların yanında gayr-i müslimlerinde olduğunu görmekteyiz. Gayr-i müslimler kendi dinî kaidelerine göre yaşamalarının yanı sıra şer'i mahkemelerde de davalarının görülmesi için irade beyan etmişlerdir. İslam Hukukunun uygulamalı olarak günümüze yansıtılması amacıyla 11 Nolu Eğin Şer'iyye Sicili'nin hukukî değerlendirmesini işlemeye çalıştık. Defterimiz 40 varak olup 80 sayfadan oluşmaktadır. Defterimizde 161 belgenin transkripsiyonu yapılmıştır. Öncelikle ilk bölümde şer'iyye mahkemeleri ve şer'iyye sicilleri hakkında temel bilgiler verildikten sonra ikinci bölümde Eğin hakkında genel bir bilgi takdim edilmiştir. Üçüncü bölümde İslam Hukuku'ndaki temel kaidelere dayanarak defterin hukukî değerlendirilmesi yapılmış olup son bölümde ise defterin transkripsiyonu yapılmıştır. Ek olarak defterin orijinal metninden bazı belgelere yer verilmiştir."
