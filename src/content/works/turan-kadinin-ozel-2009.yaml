abstract: "İbadet mükellefin yaratanına karşı saygı ve boyun eğmesini simgeleyen ve yapılması Al-lah tarafından istenen belirli davranış şekilleridir. İbadet yapma konusunda kadın ve er-kek arasında fark yoktur. Mükellef olan her insan emredilen ibadetleri yerine getirmekle yükümlüdür. İslam'ın ilk beş şartı olan kelime-i şehadet, namaz, oruç, zekât ve haccın yanı sıra kurban kesme, dua etme, Kur'an okuma da birer ibadettirler.Ancak kadınlar için geçerli olan ve Hz. Peygamber'in ?o Allah'ın Âdem kızları için tak-dir ettiği bir şeydir? ifadesiyle açıkladığı, Hz. Havva'dan bu yana kadının fıtratında yer alan bazı özellikler vardır ki, bunların bir kısmı ibadete mani sayılmıştır. Erkekten farklı olarak, kadına mahsus olan bu haller, hayız, nifas halleridir. İstihaze ise ibadete mani bir durum oluşturmaz.Kur'an'da kadının bu dönemlerdeki ibadet hayatına ilişkin detaylı açıklamalar yer alma-yıp, sadece karı koca ilişkisine yönelik bazı hükümler bulunmaktadır. Konuyla ilgili di-ğer hükümler Hz. Peygamber'den gelen hadislerle belirlenmektedir.Son dönemde hadisler konusunda usule bağlı olmaksızın oluşan anlamalarla, kadının ha-yız ve nifas dönemlerindeki ibadet hayatına dair şaz açıklamalar yapılmaktadır. Bu se-beple çalışmamızda konuyla ilgili olarak ilk dönemden bu güne yapılan farklı içtihatlar ele alınıp, açıklamalar akli istidlallerle de değerlendirilmeye çalışılmıştır.Bu modern anlayışlar Konuyu anlama da sadece Kur'an ile yetinip, sünnetin teşrideki ro-lünü ihmal etmiş görünmektedirler. Bununla birlikte bu kural dışı anlamalar günümüzde zihinleri teşviş etmekte, İslamî gelenekte yer alan ve manevi icma diyebileceğimiz, ha-kim anlayışla da tabiatıyla zıtlık oluşturmakta ve birçok tartışmayı beraberinde getirmek-tedir.Kadının özel günleri olarak tanımladığımız, hayız, nifas ve istihaze dönemlerinde kadı-nın ibadet hayatıyla ilgili bütün açıklama ve görüşlerimizi İslam'ın temel kaynakları olan Kur'an'ı ve Sünneti esas alarak belirlemeye gayret gösterdik. Çünkü ibadet alanına giren konularla ilgili etraflı açıklamalar ancak Hz. Peygamber'den gelen hadislerde yer almak-tadır. Bu çerçevede konu ele alındığında, sorun gibi görünen pek çok şey de îzahını bul-maktadır."
