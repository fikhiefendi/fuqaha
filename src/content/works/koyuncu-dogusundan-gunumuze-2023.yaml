abstract: "Vehhâbîliğin temelleri 1744 yılında Muhammed b. Suûd ile Muhammed b. Abdülvehhâb arasında imzalan Dir'iye İttifakı ile atılmıştır. Günümüze gelene kadar birçok evreden geçmiş ve varlığını devam ettirmeyi başarabilmiştir. Bu minvalde ilk olarak Vehhâbîliğin zuhurunu etkileyen görüşler ve faktörleri ele alınarak incelenmiştir. Yani Selefîlik, Harîcilik, Zahirîlik, Ahmed b. Hanbel ve Hanbelîlik, İbn Teymiyye ve görüşleri incelenmiştir. Yine bu çerçevede Hicaz bölgesinin ve özelde Vehhâbîliğin temellerinin atıldığı Necid bölgesinin siyasî, coğrafî, dinî ve Sosyo-kültürel yapısına değinilmiştir. Konunun daha iyi anlaşılması ve Vehhâbîliğin düşünce yapısının idrak edilmesi adına İbn Abdülvehhâb'ın hayatı ve görüşlerine vurgu yapılmıştır. İbn Abdülvehhâb ve Muhammed b. Suûd'un Dir'iye İttifakı ile güçlerini birleştirmesi, Vehhâbîliğin ritüellerini yerine getirerek mezhepleşme sürecini oluşturmuş, Suûd ailesi için de bu hareket siyasî bir zafer elde etmesine vesile olmuştur. Bu antlaşma neticesinde Vehhâbîlerin mezhebi teşekkül etmeye ve yayılmaya fırsat bulmuş, Suûd ailesi de bölgede ilk devletleri olan Birinci Suûd Devleti'ni kurmuştur. Tabi bu devletin kurulmasının en büyük sebeplerinden birisi Osmanlı Devleti'nin o dönemlerde içinde bulunduğu durum olmuştur. Dinî fanatizmin hat safhada olduğu bu devlet yapılanmasında Vehhâbîler, Hicaz bölgesinin kontrolünü ele geçirerek mezheplerinin pratikleri olan, özellikle bid'atlarla mücadele ve insanları tevhide davet etme bağlamında birçok faaliyet yürütmüşlerdir. Bu faaliyetleri yürütürken sergiledikleri aşırı tavırların oluşturduğu yaralar neredeyse günümüzde hâlâ sarılamamıştır. Osmanlı Devleti'nin Birinci Suûd Devleti'ne son vermesi Vehhâbîleri ve Sûudîleri kısmi olarak sindirmiş olsa da akıllarında ki düşünceleri yok etmeye vakıf olamamıştır. Ardından kurulan Suûdi -Vehhâbî devleti de uzun süre varlığını devam ettiremeyerek son bulmuştur. Akabinde çıkan Ⅰ.Dünya Savaşı'ndan faydalanarak kurulan Suûdi Devletlerinin üçüncüsü olan ve günümüzde Suûdi Arabistan Krallığı olarak bilinen devlette aynı şekilde Suûdi -Vehhâbî ittifakıyla kurulmuştur. Bu çerçevede devletin kuruluşuna çok büyük katkı sağlayan İhvan teşkilatı incelenmiştir. Akabinde petrolün bulunması ve devlette olan değişikliklere değinilmiştir. Günümüze kadar Vehhâbîlik ve fanatizminde nasıl değişiklikler olmuş, Suûdi ve Cihadî Selefîlik gruplanmaları nasıl oluşmuş, bu gruplar neyi savunmuş ve neler yapmış gibi hususlara kısaca değinildikten sonra, çalışmamız Vehhâbîliğin Türkiye'ye girişi ve Türkiye'de yürüttüğü faaliyetler hakkında kısaca verilen bilgilerin nihayetinde son bulmuştur."
