abstract: "Ekonominin devletlerin güçlü ve zayıf yönleri üzerindeki etkisi göz ardı edilemez. Devletler, ekonomik kalkınma alanında en yüksek milli gelir oranına ulaşmak için yarış içerisindedir ve bu noktada en yüksek geliri sağlayacak olan“döngüsel ekonomi”temelinde adımlar atmaktadır. 18. ve 19. yüzyıldan 20. yüzyılın başlarına kadar“doğrusal ekonomi”modeli önemli bir konumdaydı. Fakat bu iktisadi model, ihtiyaç duyulan kaynakların yenilenemez olduğunun anlaşılmasıyla dünya ekonomisi üzerinde olumsuz etkiler göstermeye başlamıştır. En büyük etkisi ise iklim değişikliği ve küresel ısınmanın yanı sıra çevre üzerine olmuştur. Bunun akabinde döngüsel ekonomi, doğrusal ekonominin hedeflediği gelişimi gerçekleştirmek amacıyla -ancak çevreyi ve doğal kaynakları korumada, sürdürülebilir ekonomiyi, iş gücünü ve iktisadi refahı sağlamada daha etkili yollar kullanmak suretiyle- bu ekonomik modele alternatif olarak ortaya çıkmıştır. Bu çalışma, döngüsel ekonomiyi, onun modern teorilerini, döngüsellik ve sürdürülebilir kalkınma kavramlarını, döngüsel ekonominin fıkhi konumunu ve fakihlerin çevre konusunu ele alış biçimini incelemeyi amaçlamaktadır. Bu doğrultuda çalışmada kullanılan metot, verilerin toplandığı ve olguların incelendiği tümevarım metodudur. Böylelikle konu hakkındaki kavramlarla ilgili daha detaylı bilgiler ortaya koyulacak ve genel ilkelere ulaşılacaktır. Araştırmanın önemi ise, kendisinde birçok problem ve tehlikenin olduğu doğrusal ekonomiye karşı çıkması ile bu etkileri azaltmaya çalışan döngüsel ekonomiye geçiş noktasında ve yeryüzünün imarına ve şeriatın ruhuna uygun olan İslam iktisadının bu eğilime yaklaşımına ışık tutmada kendini göstermektedir. Bu çalışmanın, İslam hukuku ve iktisadının genel prensipleri çerçevesinde, çevre dostu bir ekonomiye geçiş için çağdaş ekonomik projelerin ve çevre uygulamalarının desteklenmesine ve İslam düşüncesinin Avrupa ve gayrimüslim ülkelerde doğru anlaşılmasına katkıda bulunması beklenmektedir."
