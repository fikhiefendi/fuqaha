abstract: "İlk Dönem Şiî Fıkıh Usûlünde akıl ve kıyas Anlayışı adlı bu tezde akıl delilinin Şiî fıkhına nasıl girdiği, kıyası kabul etmemelerindeki temel nedenler incelenmiş ve aslında akıl delili ile vardıkları sonuçların tamamının kıyasın bir ürünü olduğu, bu durumun fıtrî bir gereklilik arz ettiği detaylarıyla ifade edilmiştir. Akıl delili Şîa'nın Mu'tezile ile olan ilişkisi ile mezhebin içerisine girmiş ve imamlardan aktarılan rivayetlerin yeterli olduğu kabulü bu dönemden sonra bir kenara bırakılmıştır. İlk olarak uzun süren gaybet neticesinde inanç açısından destek kaybeden imamet anlayışı bu rasyonelleşme hareketinin başlangıcını oluşturmuş daha sonra bu çalışmalar fıkha yansımış problemlerin çözümünde başvurulan bir merci haline gelmiştir. Zaman içerisinde kaçınılmaz olarak her ne kadar açıkça ifade edilmese de kıyas anlayışı bu sistemin referans kaynağı olmuş, aklın belirleyiciliğinde temel yöntem olarak yerini almıştır. Sonuç olarak mezhepsel güdülerle şiddetle karşı çıkılan kıyas anlayışı ilerleyen dönemlerde Şiî fıkıh usulünde yerini almıştır."
