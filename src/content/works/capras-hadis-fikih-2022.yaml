abstract: "'Ahâdîs' cihetiyle daha çok hadis ilminin, 'ahkâm' cihetiyle de fıkıh ilminin kapsamına giren \"âhâdîsü'l-ahkâm\" kavramı, fıkhın ikinci kaynağı olmakla birlikte fıkhın en fazla materyale sahip kaynağı konumundadır. Paydaş oldukları ve ayrıştıkları noktaların bulunduğu fıkhü'l-hadîs, dirâyetü'l-hadîs gibi hadis ilimleri arasında müstakil bir ilim sayılmamakla birlikte bu kavram etrafında oluşan literatür, müstakil hadis ilimlerinin literatürünü aşarak adeta başlı başına bir ilim haline gelmiştir. Her ne kadar bazı son dönem eserlerde \"Ahkâm Hadisleri İlmi (ilmu ahâdîsi'l-ahkâm)\" şeklinde bir kullanım mevcutsa da hadis ilimlerinden biri olmaktan ziyade müstakil bir disiplin olarak değerlendirilmesi kanaatimizce daha isabetlidir. Hz. Peygamber (s.a.s.) döneminden itibaren az da olsa bir araya getirilen hadislerin ağırlık merkezini ahkâm hadisleri oluşturmuş, sahabe ve tabiîn dönemlerinde tüm hadislere, özellikle bu hadislerin kitabet ve tedvininde artış sağlanmış, tabiîn sonrası dönemde ise tasnif çalışmaları ön plana çıkmıştır. Bu tasnif çalışmalarının sonuçlarından biri olarak hadisler, ağırlıklı olarak ale'l-ebvâb şeklinde tasnif edilmiştir. Hadise dayalı fıkıhtan yana olan hadis ehli ise ahkâm hadislerinin tasnifinde ale'r-ricâl sistematiğini kullanmıştır. Hadislerde mündemiç olan fıkhın, ikinci asırdan itibaren iki ayrı ilme dönüşmeye başlamasıyla, hadis-fıkıh birlikteliğini sağlamaya matuf olarak ahkâm hadisleri eserleri gün yüzüne çıkmaya başlamıştır. Katkıları zamansal ve bölgesel olarak artış veya azalma gösterse de mezheplerin, bu alanda zengin bir literatürün oluşmasındaki katkıları çok fazla olmuştur. Ahkâm hadisleri, hadis ve rey ekollerinin oluşumundaki önemli faktörlerden biri olduğu için, mezheplerin şekillenmesinde de rol oynamıştır. Bu rolüyle muhaddis ve fakih arasında oluşan makas daraltılmış, konuyla ilgili eserler fıkhî tartışmalarda otorite olarak kabul edilmiştir. Temel ahkâm hadisleri kaynaklarına yönelik başlayan şerh türü eserlerle, bu hadislere yönelik çalışmalarda fıkıh ilminin ağırlığı iyice artmıştır. İslam hukukunun temel kaynaklarından biri olarak oryantalistlerin de ilgi odağına giren ahkâm hadisleri, bu yönüyle de çeşitli tartışmalara konu olmuştur. Bu hadisler, İslam tarihi boyunca değişik bölgelerde ve günümüzde fıkıh eğitimi yöntemlerinden biri olarak da kullanılagelmiştir. Anahtar Kelimeler: Fıkıh, Hadis, Ahkâm, Ahkâm Hadisleri Disiplini, Ahkâm Hadisleri Eserleri, Ahkâm Hadisleri Eğitimi."
