abstract: "Dünyada 60, Türkiye'de 30 yıllık geçmişe sahip olmasına rağmen, İslami bankacılık /katılım Bankacılığı alanında kurumsal performans analizleri ve stratejik hedefler konusunda çok az çalışma yapılmıştır. Literatürdeki bu eksikliği gidermek amacıyla bu çalışmada katılım bankalarının 30 yıllık süreçteki kurumsal performansları, sürdürülebilir rekabetleri ve Stratejik Hedefleri incelenmiştir. Bu amaç doğrultusunda, katılım bankacılığının tanımı yapılmış, nasıl ve hangi nedenlerle ortaya çıktığı irdelenmiş ve katılım bankalarının bankacılık faaliyetlerinde sıklıkla kullandığı finansal ürünler açıklanmaya çalışılmıştır. Ayrıca katılım bankalarının sektör içindeki performansları finansal tablolar yardımıyla anlatılmış, katılım bankacılığının gelişimi için yapılan çalışmalarla birlikte çözüm yollarına değinilmiştir. Bu bilgiler ışığında 2025 yılı hedeflerine ulaşabilmek için ciddi bir kamu iradesine ve mevcut performansın arttırılmasına ihtiyaç olduğu, bu şartların gerçekleşmesi durumunda İslami bankacılığın/katılım bankacılığının bankacılık sektörü içindeki payının %13-%15 civarına yükselebileceği sonucuna varılmıştır."
