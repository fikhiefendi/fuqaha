abstract: "İnsan, sosyal bir varlıktır. Bu yüzden toplum içerisinde yaşamak zorundadır.Toplumda yaşayan insanların sosyal ve ekonomik durumu farklıdır. İnsan, doğası gereği,muhtaç olanlara yardım etme eğilimindedir. Önceleri insanlar, ihtiyaç sahibi kimselerebireysel yardımda bulunmuşlardır. Uygarlık seviyesi geliştikçe, bireysel yardımlaşmakurumsal yardımlaşmaya dönüşmüştür. Bu yüzden, sosyal yardımlaşma ve dayanışmakurumları ortaya çıkmıştır. Bu kurumlardan biri de vakıftır. .Vakıflar, İslâm'ın yardımlaşmaya verdiği önem sayesinde, İslâm dünyasında önemligelişme göstermiştir. Bu kurumlar, Selçuklular zamanında sosyal hayatın her alanındafaaliyetler ûfa etmiştir. Osmanlılar döneminde daha fonksiyonel hale gelmiştir.Bu kurum, Batı'da genellikle foundation, stiftung yada trust diye anılmaktadır. OrtaÇağda, yeterince gelişme gösterememiştir. Ancak sanayi devriminden sonra gelişmeyebaşlamıştır. Günümüzde sivil toplum kuruluşlarının öneminin anlaşılmasıyla üçüncü sektöriçerisinde yer alan vakıflar, çok etkin hale gelmiş ve faaliyetlerini uluslararası düzeyetaşımıştır.İslâm dünyasında ise Osmanlı Devletinin geri kalması, çağdaşlaşmanın yanlışyorumu, Tanzimat dönemindeki uygulamalar, yersiz müdahaleler vb. sebepler sonucugerileme süreci yaşamıştır. Günümüzde ise bir kısım muafiyetler ve iyileştirmeler neticesinisbû bir gelişme trendine girmiştir."
