abstract: "Maverdi, Hukukçu, Tefsirci, Edebiyatçı, Siyasetçi bir alimdir. Hukuk sahasında Şafi mezhebini takip etmiştir. Kendisinden pek çok kimse ders almış, rivayette bulunmuştur. Eserlerinin çoğunluğu İslam Hukukunun amme (devlet) ile ilgili kısmını oluşturmuş ve bu alanda söz sahibi olmuştur. El-Ahkamü's Sultaniyye önceki fıkıh kitaplarında devlet idaresine dair yazılmış olan dağınık bilgileri bir araya getirerek idarecilere yardımcı olması bakımından sahasının en önemli eserlerindendir. Mâverdî, eserini kaleme alırken, yaşadığı dönemden önce geçmiş olan dört asırlık kamu hukuku uygulamalarını, devlet yönetimine ait örf ve âdetleri büyük ölçüde göz önünde bulundurmuştur. Öncelikle Allah'ın Resulü'nün uygulamalarını, dört meşhur halifenin devlet yönetimi ile ilgili uygulamalarını önemle dikkate almıştır. Engin siyasî ve diplomatik tecrübesiyle gerek kendisine kadar gelmiş olan meşru uygulamaları, gerek dinî kurallardan çıkardığı siyasî, idarî, kazaî hükümleri eserine yansıtmıştır. Konuları işlerken genellikle dört mezhebin fıkhî görüşlerini tarafsız olarak vermiş ihtilaflı konularda Şafi Mezhebinin görüşlerini kabul etmiştir. El-Ahkamü's Sultaniyye, Maverdi'nin halka bakışını, alanının en önemli eserlerinden ve İslam amme Hukukunun temel kaynaklarından olması sebebiyle İslam Hukuku içerisinde halkın yerini göstermesi açısından bizi bu konu üzerine çalışmaya yöneltmiştir."
