abstract: "Bu çalışma,“İslam Aile Hukukunda Evliliğin Kuruluşuna Kadar Olan Süreçlerin Tarihsel ve Toplumsal Arka Planı”başlığı altında, hukuk–toplum–aile ilişkisini kavramsal bir çerçevede ele alarak, İslam aile hukukunun doğuşunda ve gelişiminde toplumsal faktörlerin rolünü incelemektedir. Çalışmanın ilk bölümü, tezin kavramsal çerçevesini oluşturmaktadır. Toplum, hukuk ve aile kavramları tarih boyunca birbirini besleyen ve karşılıklı etkileşim içinde şekillenen temel olgulardır. Hukuk, toplumsal yapının değerlerini, inançlarını ve örfi kabullerini dikkate alarak meşruiyet kazanırken; aile, bu toplumsal yapının hem ürünü hem de sürdürücüsü olarak hukukun en somut uygulama alanını oluşturur. Dolayısıyla aile kurumu, toplumsal düzenin korunmasında olduğu kadar hukukun toplumsal temellerinin anlaşılmasında da merkezi bir rol üstlenmektedir. Aile, belirli fonksiyonları yerine getirdiği ölçüde toplumsal düzenin korunmasını sağlayabilmektedir; bu bağlamda hem toplumbilimleri hem de dinler, aileyi koruyucu normlar geliştirmişlerdir. Ailenin bu şekilde ele alınışı, sosyolojideki yapısal-işlevselci perspektifle ve İslam hukukundaki maslahat ve makâsıd anlayışıyla uyum göstermekte olup, dinî, sosyolojik ve hukuki çerçevelerde aileye verilen önemin ortak bir anlayış olarak benimsendiğini ortaya koymaktadır. Çalışmanın ikinci bölümünde, İslam öncesi Arap toplumunun sosyo-kültürel yapısı, evlilik öncesi uygulamaları ve aileye ilişkin örfi kabulleri tarihsel-sosyolojik yöntemle analiz edilmiştir. Vahyin gelişiyle birlikte bu yapıların nasıl dönüştüğü ve toplumun kabul ettiği iyi, doğru ve adil olanla vahyin ilkeleri arasındaki etkileşim değerlendirilmiştir. Sonuç olarak, İslam hukukunun adalet, insan onuru ve maslahat anlayışı çerçevesinde, toplumsal gerçekliği göz ardı etmeyen dinamik bir sistem olduğu belirlenmiş; İslam aile hukukunun da yalnızca dinî bir normlar bütünü değil, toplumsal yapıyla sürekli etkileşim hâlinde gelişen, insan merkezli, adalet odaklı ve bütüncül bir hukuk anlayışı olarak değerlendirilmiştir."
