abstract: "Tezimizin konusu zihinsel engellilerde ehliyet olduğu için ehliyet kavramını genişçe ele alıp; ehliyetin tanımı, bölümleri, ehliyet açısından insan hayatının dönemleri, ehliyeti daraltan, ortadan kaldıran sebepler ve genel olarak ehliyete etki eden durumları ayrıntıları ile yazdık. Araştırmamızın sonucunda orta ve ağır zihinsel engellilerde temyiz gücünün olmadığını, ancak hafif derece zihinsel engellilerde temyiz gücünün olduğunu gördük. Dolayısıyla vücûb ve eda ehliyeti açısından ayrıca velayet, vasiyet, ceza ehliyeti, nikâh, talak, mali duruma etki eden sebepler ve ibadetler hususunda bu iki grubu farklı değerlendirdik.Orta ve ağır derecedeki zihinsel engellilerin temyiz yani ayırt etme güçleri olmadığı için cünûn kapsamında, ancak hafif derecedeki zihinsel engellileri buluğ çağına erseler bile o akli yetiye sahip olmadıkları için mümeyyiz çocuk kapsamında değerlendirilmesini uygun gördük."
