abstract: "206 ÖZET Şahin, Muzaffer, İslam Hukukunda Sebepsiz Zenginleşme, Doktora Tezi, Danışman: Prof. Dr.İbrahim Çalışkan, XIH-205 s. Hukuki bir sebep olmaksızın her hangi bir şahsın başkası aleyhine zenginleşmesi şeklinde tanımlanabilecek sebepsiz zenginleşme, Roma hukukundan itibaren bütün hukuk sistemlerince işlenmiş,bazı farklılıklarla birlikte borç kaynağı olarak kabul edilmiş ve sürekli gelişim göstermiş bir kurumdur. Türk BK, sebepsiz zenginleşmeye 61-66. maddelerinde yer vermiştir. İslam hukuku da, diğer hukuk sistemlerinde olduğu gibi sebepsiz zenginleşmeyi genel borç doğuran kaynaklardan biri olarak kabul etmiştir. Ancak konu, kaynaklarda, bağımsız bir başlık altında sistemleştirilerek ele alınmayıp genellikle gasp, itlaf, alım- satım bölümlerinde serpiştirilmiş olarak işlenmiştir. İslam hukukunda sebepsiz zenginleşme olgusunun birinci derecedeki kaynaklan Kitap ve Sünnet, ikinci derecedeki kaynaklan ise İslam hukuk bilginlerinin bunlardan özümseyerek ortaya koyduktan genel kurallardır. Buna göre sebepsiz zenginleşme, belli bir süreç içinde gelişerek İslam hukukuna kazandınlmış bir kurum değil, İslam hukukunun doğusuyla birlikte doğal olarak ortaya çıkmış207 bir olgudur. \"Aranızda birbirinizin mallarını haksız yere yemeyin...\" (Bakara 2/188) ayeti bunu açıkça göstermektedir. Sebepsiz zenginleşmeden söz edebilmek için: a) Zenginleşenin/borçlunun malvarlığında bir artış meydana gelmiş olmalıdır. b) Zenginleşenin malvarlığındakî bu artış bir başkası aleyhine (zararına) meydana gelmiş olmalıdır. c) Zenginleşenin malvarlığında meydana gelen çoğalma ile fakirleşenin malvarlığında meydana gelen azalma arasında illiyet bağı yani sebep-sonuç ilişkisi bulunmalıdır. d) Zenginleşenin malvarlığında meydana gelen artış haklı bir sebebe dayanmamalıdır. Sebepsiz zenginleşme, hukuki bir işlem ya da hukuki bir eylem sonucu gerçekleşebileceği gibi, zenginleşenin, fakirleşenin veya üçüncü bir şahsın davranışından, yahut doğal bir olaydan da kaynaklanabilir. Sebepsiz zenginleşmeden dolayı iade borcunun doğması için koşulların gerçekleşmesiyle birlikte tarafların hak/vücub ehliyetine sahip olmaları yeterlidir, fiil/eda ehliyetine sahip olmaları gerekmez.208 Sebepsiz zenginleşme davası kişisel ve asli nitelikte bir dava olduğu için sadece borçluya ve mirasçılarına karşı açılabilir. Aynca diğer iadeyi sağlayan taleplerle de yarışabilir. Sebepsiz zenginleşme davasının amacı, zenginleşenin malvarlığında sebepsiz olarak meydana gelen artışın, fakirleşene iade edilmesidir. Bu anlamda sebepsiz zenginleşme fonksiyonel yönden zilyetliğin iadesi ve istihkak (mülkiyet) davalarına benzemektedir. Sebepsiz zenginleşme ilişkisinin borçlusu, malvarlığı başkası aleyhine zenginleşen, alacaklısı ise malvarlığı zarar gören/fakirleşendir."
