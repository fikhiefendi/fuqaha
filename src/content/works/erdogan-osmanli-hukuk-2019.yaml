abstract: "İslam hukuku toplumsal yapının temeli olan aileye ve aile ile ilgili düzenlemelere önem vermiştir. Çünkü aile sosyal ve ahlaki bir kurum niteliğindedir. Bu önemine binaen evlilik akdi ve sonuçları gibi geniş bir alan ihtiva ettiğinden dolayı aile hukuku, İslam hukuku kitaplarında müstakil bir bölüm olarak ele alınmıştır. Daha sonra müstakil eserler de kaleme alınmıştır. Ne var ki Osmanlı Devleti, tebaasının genişliğinden ve zenginliğinden dolayı aile hukukunu resmi bir zemine oturtmak istemiştir. Bunun üzerine 1917 yılında Osmanlı Hukuk-i Aile Kararnamesini bir heyet ile hazırlamıştır. Kararname'nin etkisi büyük olmuştur ama bir buçuk gibi kısa bir sürede yürürlükte kalabilmiştir. Ancak hala birçok ülkede etkisini sürdürmektedir. Kararnamenin hazırlanmasında dört mezhepten de istifade edilmiştir. Yeri gelince dört mezhebin de dışına çıkılarak farklı içtihatlardan da istifade edilmiştir. Biz de bu çalışmamızda kararnamenin hazırlanırken Müslümanlar ile ilgili maddelerin hangi mezhepten veya hangi görüşten istifade edildiğini tespit etmeye çalışacağız."
