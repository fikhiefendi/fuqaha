abstract: "Bu çalışmada örfî hukukun mahiyeti siyâset-i şer'iyye düşüncesinden istifade edilerek izah edilip örfî hukukun şeriat karşısındaki konumu belirlenmeye çalışıldı. Bunun yanında Osmanlı ceza uygulamasında şeriata aykırı olduğu iddia edilen bazı uygulamaların hukukî tahlili yapılarak teoride ulaşılan sonuçların sıhhati Osmanlı ceza uygulaması cihetinden kontrol edildi. Bu çerçevede tez çalışması giriş, iki bölüm ve sonuçtan oluştu. Giriş bölümünde tezin amacı, konusu ve önemi belirtilip, konu ile ilgili Türkçe literatürün değerlendirmesi yapıldı. Birinci bölümde örfî hukuk ile siyâset-i şer'iyye arasındaki münasebet belirlenip, yakın anlam ilişkilerine istinaden siyâset-i şer'iyyenin unsurları izah edildi. Daha sonra siyâset-i şer'iyyenin küllî amacı olan nizâm-ı âlem kavramı tarif edilerek, teorik olarak örfî hukukun mahiyeti belirlenmeye çalışıldı. İkinci bölümde kanunâmelerde yer alan ve şeriata aykırı olduğu iddia edilen bazı cezaların hukukî tahlili yapıldı. Bu bağlamda İslâm ceza hukukundaki suç tasnifi nakledildikten sonra kardeş katli, işkence uygulaması, zina ve livataya müteallik kanunnâme maddeleri ile para cezaları incelendi. Sonuç bölümünde ise örfî hukuk ile ilgili teori ve pratikte ulaşılan sonuçlar özetlenerek ifade edilmeye çalışıldı."
