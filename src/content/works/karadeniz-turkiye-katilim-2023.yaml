abstract: "Bu çalışmanın amacı BİST 30 endeksi ve İslami kurallara uygun olarak oluşturulan KATILIM 30 endeksinin performanslarını karşılaştırmaktır. Çalışmada 16 Kasım 2021 – 28 Nisan 2023 dönemi haftalık verileri kullanılmıştır. Çalışmanın uygulama aşamasında ise T testi, Sharpe oranı, Treynor endeksi ve Jensen's Alfa teknikleriyle Bist 30 ve Katılım 30 endekslerinin performanslarının karşılaştırılması Eviews programıyla yapılmış ve yorumlanmaya çalışılmıştır. T testi ile yapılan karşılaştırmada iki endeksin haftalık ortalama getirileri arasında istatistiki olarak anlamlı bir fark olmadığı ortaya çıkmıştır. Jensen's Alfa ile yapılan karşılaştırmada da Katılım 30 ve Bist 30 endekslerinin riske göre ayarlanmış performansları arasında yine istatistiki olarak anlamlı bir fark olmadığı tespit edilmiştir. Bu iki istatistiksel yönteme ilave olarak Sharpe Oranı ve Treynor Endeksi ile de Bist 30 ve Katılım 30 endekslerinin risk ayarlı performansları karşılaştırılmış ve aralarında bir fark olmadığı sonucuna varılmıştır. Sonuçlar Katılım 30 endeksinin İslami kaygılarla hareket eden bireysel ve kurumsal yatırımcılar için risk ve performans anlamında iyi bir alternatif olduğunu göstermektedir. Bununla birlikte Katılım 30 endeksine yatırım yapanların riske göre ekstra bir performans beklememeleri gerekmektedir. Çalışma dolaylı olarak Katılım endeksi kriterlerinin risk ayarlı performansa bir etkisinin olmadığına da göstermektedir."
