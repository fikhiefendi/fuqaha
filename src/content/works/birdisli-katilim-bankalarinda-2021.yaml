abstract: "Türk bankacılık sektöründe bankaların aslî fonksiyonları çerçevesinde kullandırılan krediler, 2020 yılsonu itibarıyla bilanço içerisinde %59 paya sahiptir. Bilançonun önemli bir çoğunluğunu oluşturan kredi portföyünün tahsil kabiliyetinin zayıflaması, banka bilançolarında da önemli hasarlara neden olmakta ve temel finansal göstergelerin bozulmasına yol açmaktadır. Bu noktada bankalar, finansal göstergelerin iyileştirilmesi, bilançonun durulaştırılması ve tahsilat işlemleri nedeniyle katlanılan operasyonel yükün azaltılması amacıyla, tahsil imkânının zayıfladığına veya kalmadığına kanaat getirilen kredileri varlık yönetim şirketlerine temlik etmektedir. Zira varlık yönetim şirketleri, sorunlu kredilerin tahsilini esas faaliyet konusu edinmiş ve bu konuda uzmanlaşmış kurumlardır. Ancak Türkiye'de faizsiz bankacılık prensiplerini benimseyen katılım bankalarının sorunlu kredilerini varlık yönetim şirketlerine temlik etmesi konusunda birtakım çekinceler bulunmaktadır. Zira alacağın temliki olarak nitelenen bu işlem, İslam hukukunda genel olarak kabul görmemektedir. Bu çerçevede katılım bankalarının, sorunlu kredilerin tahsilinde varlık yönetim şirketlerinden destek almalarını sağlayan bir yöntem önerisi geliştirmek, bu çalışmanın amacını oluşturmaktadır. Çalışmanın sonucunda, İslam hukukunun vekalet hükümleri çerçevesinde sorunlu kredilerin tahsilinde varlık yönetim şirketlerinin vekil tayin edilmesini ve bahsedilen şirketler tarafından tahsil edilen tutarların banka ile paylaşılmasını esas alan bir model önerilmiştir. Ayrıca önerilen yöntem, sorunlu kredilerin TFRS hükümleri çerçevesinde bilanço kayıtlarından çıkarılmasını sağlayarak finansal göstergelerde iyileşme sağlamakta ve bilançonun durulaştırılmasına imkân tanımaktadır."
