abstract: "ÖZET Bu çalışma, XX. yüzyılda İslâmî feminizm hareketinin doğuşu ve gelişimini, Türkiye ve Mısır örnekleri üzerinden karşılaştırmalı bir perspektifte incelemektedir. İslâmî feminizmin Aydınlanma sonrası modernizmin getirdiği değişimlere karşı savunmacı bir refleks olarak doğduğunu ancak zamanla kapitalist ve ulus-devlet yapılanmalarının yönlendirdiği bir alanda varlık göstermeye başlayarak dönüşüme uğradığı düşünülmektedir. Başlangıçta İslâmî feminizmin apolitik bir yaklaşımla dini referanslara atıfla kadın haklarını savunurken zamanla Müslüman feministlerin söylemlerinin evrensel insan hakları ve toplumsal cinsiyet eşitliği talepleriyle örtüşmeye başlayarak sekülerleştiği görülmektedir. Tezde iki ülkeye, Türkiye-Mısır örnekliklerine odaklanılmıştır. Zira her iki ülkede de İslâmî feminizm, kadın haklarını İslâmî referanslarla savunmayı amaçlamış ancak farklı sosyo-politik bağlamlar nedeniyle hareket farklı yönlerde evirilmiştir. İlk olarak Türkiye'de, Osmanlı'dan Cumhuriyet'e geçiş sürecinde uygulanan laikleşme reformları kadınların kamusal alana entegrasyonunu hızlandırmış, 1980'lerden itibaren başörtüsü yasağı, Müslüman kadınların kimlik mücadelesinde belirleyici olmuştur. Başörtüsü yasağının kaldırılmasıyla birlikte, Türkiye'deki Müslüman feministler, seküler feminizmle daha fazla kesişen bir söylem geliştirmiştir. Çalışmanın merkezinde yer alan diğer ülke Mısır'da ise kadın hareketleri milliyetçilik ve anti-sömürgecilik ile iç içe geçmiş, 1950'lerden itibaren devlet destekli sekülerleşme politikaları kadın hakları mücadelesini şekillendirmiştir. 1970'lerden sonra İslâmcı hareketlerin yükselişiyle İslâmî feminizm güçlenmiş ve kadın hakları, İslâmî çerçevede bağımsız bir mücadele alanı haline gelmiştir. Mısırlı Müslüman feministler, başörtüsü ve kadın haklarını İslâmî kimlikleriyle birlikte savunmuş ve toplumsal hareketlerle daha organik bir şekilde birleşerek kitlesel bir güç oluşturmuştur. Sonuç itibariyle bu çalışma İslâmî feminizmin modernleşme ve sekülerleşme bağlamında nasıl şekillendiğini analiz ederek Türkiye ve Mısır'daki kadın hareketlerinin farklı dinamiklerini ortaya koymaktadır. Türkiye'de İslâmî feminizm seküler feminist hareketle daha fazla kesişirken, Mısır'da milliyetçi ve toplumsal hareketlerle bütünleşmiştir. Bu farklılıkların, devlet politikaları, toplumsal yapı ve dini hareketlerin gücü gibi faktörlerle şekillendiği sonucuna ulaşılmıştır."
