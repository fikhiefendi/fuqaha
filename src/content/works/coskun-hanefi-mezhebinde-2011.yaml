abstract: "Bu tez, Hanefi Mezhebinde namaz ve oruç örneğinden hareketle ibadetler konusunda ortaya çıkmış içtihat farklılıklarını incelemeyi hedeflemektedir. Araştırma, altı bölümden oluşmaktadır.Birinci bölümde araştırmanın amacı, konusu ve kaynakları hakkında bilgi verilirken ikinci bölümde konu ile ilgili önceki çalışmalardan bahsedilmiştir. Üçüncü bölümde ibadet, taabbud ve ta'lil kavramları, ibadet hukukunun genel özellikleri ve Hanefi Mezhebinin içtihat usulü hakkında bilgi verilmiş, Dördüncü bölümde Hanefi Mezhebinde mezhep içi görüş farklılıklarının sebepleri ortaya konulmaya çalışılmıştır. Beşinci bölümde, namaz ve oruç ahkâmıyla ilgili Hanefi Mezhebinde var olan içtihat farklılığı örnekleri üzerinde durulmuş; Altıncı bölümde ise çalışmanın genel bir değerlendirmesi yapılmıştır."
