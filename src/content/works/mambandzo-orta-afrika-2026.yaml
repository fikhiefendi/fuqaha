abstract: "Orta Afrika'da borçlanmanın sürekliliği, özel dikkat gerektiren endişe verici bir durumdur. Bu sorun yeni değildir; söz konusu devletlerin bağımsızlıklarını kazandıkları dönemlerin hemen sonrasına kadar uzanmaktadır. Kalkınma çerçevesinde bu durumu düzeltmeye yönelik birçok girişimde bulunulmuş, ancak elde edilen sonuçlar çoğu zaman hayal kırıklığı yaratmıştır. Bu çabaların tam anlamıyla etkili olmaması ise bu sorunun halihazırda temel mesele olarak gündemde kalmasına neden olmuştur. Söz konusu soruna kalıcı çözümler önermeyi hedefleyen bu çalışmada Orta Afrika'daki borçlanmanın kaynakları ve nedenleri analiz edilmekte, bu bağlamda klasik finans sistemine özgü olan faiz uygulamasının bu ülkelerin borç yükünü ağırlaştırdığı tespit edilmektedir. Kronik borçlanma durumu kamu sektörlerinin çeşitli alanlarını derinden etkilemektedir. Buna karşılık, İslami finans sürdürülebilir ve önleyici alternatifler sunmaktadır. Şeriat ilkelerine dayanan bu finans modeli, faizsiz ve etik değerlere uygun finansal araçlar aracılığıyla borç sorununa etkin çözümler getirebilmektedir. Kamerun örneği, bu dinamiği açıkça ortaya koymaktadır ki ülke, giderek İslami finansı benimsemekte ve bölgedeki diğer ülkelere örnek olmaktadır. Gerçek ekonomik faaliyetlere dayalı, etik kurallara uygun İslami finans hizmetleri, Orta Afrika'daki artan borçlanma sorunuyla başa çıkmak için ideal bir çözüm yolunu temsil etmektedir."
