abstract: "Yargısal hakimiyetin toprağa bağlı olduğu ülkesellik sisteminin günümüzde yaygın hale gelmesi, ülkelerin kendi vatandaşlarını yabancı ülke sınırlarında savunmalarının önünde bir engele dönüşmüştür. Diğer taraftan suç faillerinin ülkelerine sığınmaları onların cezalardan kurtulmalarına zemin hazırlayan bir başka gerçekliktir. Suç olgusunun geçirdiği dönüşüm karşısında devletlerin son bir asırdır aldıkları tedbirler ise pratikteki faydayı sağlamada yetersizdir. Tüm bu durumlar neticesinde, ülkesellik sisteminin yetersiz kaldığını göstermekte, şahsilik sistemine ihtiyacın gerçekliğini göz önüne sermektedir. İslâm hukukunda coğrafi ve siyasi aidiyetin, özellikle ceza hukuku alanındaki yansımalarını çözümlemek, çağdaş hukuk sistemleriyle karşılaştırmalı şekilde geliştirmek açısından önem arz etmektedir. Fıkıh literatürde yer alan mülkîlik ile şahsilik sisteminin avantaj ve dezavantajları dikkate alındığında, İslâm'ın temel prensipleriyle şahsilik ilkesinin büyük oranda örtüştüğü anlaşılmaktadır. Adli yardımlaşma ve devletlerarası iş birliğinin bu denli artış gösterdiği günümüzde şahsilik sisteminin olabildiğince yürürlüğe koyulmaya çalışılması, İslâm'ın temel gayelerini pratiğe yansıtılması bakımından önemli bir fırsat göstergesidir. Ceza kovuşturmalarının aktarılması, suçlu iadesi uygulamaları, yargı yetkisinin devredilmesi gibi kanunlar ihtilafına yönelik çözüm yolları, şahsilik prensiplerini uygulamada kolaylık sağlayan gelişmelerdir. Bu kapsamda, dârü'l-islâmda suç işleyip kaçan faillerin İslâm devletine iadesini konu edinen uluslararası sözleşmelerin akdedilmesi gerekmektedir. Ayrıca İslâm devleti vatandaşı olup, yabancı ülkelerde şer'i yasakları çiğneyenlerin kovuşturulması ve müeyyidelerinin tatbik edilmesi konusunda karşılıklı anlaşmalar yürütülebilir. Böylelikle İslâm devletinin yargısal yetkisi toprağa bağlı olmaktan çıkmış, hukuksal sorumluluk taşıyan her bireyi sınır ötesinde de takip edebilme salahiyetine kavuşmuş olacaktır."
