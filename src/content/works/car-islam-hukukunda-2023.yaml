abstract: "İslâm, zekât ibadeti ile sosyal adaleti sağlamış; zengin ve fakir arasında köprü kurmuştur. İslâm'da zekât ibadetinin temelinde fakirlik olsa da zekât ibadetinin sarf yerleri sadece fakirler ve miskinler ile sınırlı kalmamıştır. Zekât ibadetinin amacı sadece fakirlerin ihtiyaçlarını karşılamak onların bakımlarını üstlenmek değildir. Zekât ibadeti farz kılındığı dönemden itibaren sosyal devlet anlayışının sorumlu olduğu birçok hizmeti yürütme gayesi de taşımıştır. Zekât ibadeti; Hz. Muhammet ve dört büyük halife dönemlerinde devletin en önemli gelir ve hizmet kaynağını oluşturmuştur. Zekât, Hz.Peygamber döneminde kurumsal bir nitelik kazanmış ve bizzat devlet eliyle yürütülen, toplumda sosyal adaleti tesis eden ve kamu hizmeti sunan bir kurum haline gelmiştir. Günümüzde zekât ibadetinin etkili ve verimli bir şekilde kullanılması ve toplum yararına yeniden aktif hale getirilebilmesine büyük bir ihtiyaç duyulmaktadır. Özellikle son dönemlerde ülkemizde ve dünyada yaşanan gelişmeler ışığında İslâm'ın yardımlaşma ve dayanışma mekanizmasının en önemli unsuru olan zekâtın yeniden toplum için işlevsel hale getirilmesi gerekmektedir."
