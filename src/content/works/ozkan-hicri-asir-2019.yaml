abstract: "Vergi, insan topluluklarının bir arada yaşaması sonucunda ortaya çıkmış bir uygulamadır. İnsanların topluluk halinde yaşamasıyla birlikte oluşan ortak sorumluluk ve ihtiyaç alanları, bunların karşılanmasında yine topluluğu oluşturan bireylere çeşitli sorumluluklar yüklemiştir. Toplum yaşamıyla başlayan vergi sistemleri bu yaşam alanlarının genişlemesine paralel olarak sürekli gelişmiş ve yenilenmiştir. Zaman ve anlayışlara göre farklılıklar görülse de vergilendirme uygulaması çoğu toplumda başat bir unsur olarak karşımıza çıkmaktadır. Bazı toplumlarda vergilendirme büyük yıkımlara yol açmış bazen de etkileri günümüze kadar ulaşan önemli olayların çıkış noktası olmuştur. Bu çalışmada İslam'ın ortaya çıkışıyla birlikte Müslüman toplumların kullandıkları vergi sistemleri erken dönemde telif edilen eserler üzerinden ele alınacaktır. İlk dönem İslam Tarihindeki vergi sistemi klasik kaynaklar üzerinden incelenecek aynı zamanda kaynaklar arasında kıyaslama yapılacaktır."
