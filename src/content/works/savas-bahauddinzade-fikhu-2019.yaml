abstract: "Bu çalışma, Osmanlı dönemi ulemâ ve mutasavvıflarından Bahâuddinzâde'nin el-Kavlü'l-Fasl eseri üzerinden kelâmî görüşlerini tanımayı hedeflemektedir. el-Kavlü'l-Fasl, Ehl-i Sünnet'in i'tikâdî görüşlerinin teşekkülüne katkısı bağlamında zikredilebilecek ilk isim olarak Ebû Hanîfe'nin en önemli eserlerinden el-Fıkhu'l-Ekber'in bir şerhidir. Akâidi, kişinin lehine ve aleyhine olan şeyleri bilmesi şeklinde tanımladığı fıkhın en büyük kısmı olarak gören ve bu sebeple Kelâm'ın 'el-Fıkhu'l-Ekber' olduğunu vurgulayan Ebû Hanîfe, akâidin temel meselelerini ihtivâ eden eserini el-Fıkhu'l-Ekber şeklinde isimlendirmiştir. Neticede bu eser, pek çok farklı bakış açısı ile yorumlanıp yeni eserlere konu olmak bakımından günümüze kadar güncelliğini korumuştur. Bu sürecin bir parçası olarak el-Fıkhu'l-Ekber'in derin felsefik izahatlar ile şerhedildiği el-Kavlü'l-Fasl, Bahâuddinzâde'nin, Ebû Hanîfe ve Ehl-i Sünnet'e bağlılığı etrafında şekillenmekle birlikte el-Fıkhu'l-Ekber'e yeni bir söylem kazandırmıştır. Bir metni doğru bir şekilde yorumlamak öncelikle yazarını tanımak, onun yetiştiği ilmî, fikrî, siyâsî ve sosyal ortamı tanımayı gerektirir. Bu sebeple çalışmamızın birinci bölümü gerek Ebû Hanîfe gerekse Bahâuddinzâde'nin yaşadığı dönemleri araştırarak düşünce alt yapılarını tanımaya tahsis edilmiştir. el-Kavlü'l-Fasl'ın, Osmanlı döneminde kaleme alınan bir şerh niteliğinde olması bu dönemin şerh geleneği hakkında genel bir malumata yer vermeyi gerektirmiştir. Akabinde Bahâuddinzâde'nin sûfî-kelâmcı olarak anılmasına sebebiyet veren eseri el-Kavlü'l-Fasl metin ve muhtevâ yönünden incelenerek buradan hareketle Bahâuddinzâde'nin görüşlerini tanımaya imkân verilmiştir. el-Kavlü'l-Fasl'da el-Fıkhu'l-Ekber'in özlü, kısa ve net yapısından farklı olarak yer alan kavramlar ve genişletilmiş meseleler dönemin düşünce yapısını tanımak bakımından önemlidir. Bu kavramların şerhte Bahâuddinzâde'nin aynı zamanda mutasavvıf kimliğinden izler taşıyan bakış açısı ile yorumlandığı söylenebilirse de eserin genelinde ön plana çıkan üslubun kelâmî bir üslup olduğu vurgulanmalıdır. Sonuç kısmında ise çalışma neticesinde elde edilen malumat özet bir şekilde verilmiştir."
