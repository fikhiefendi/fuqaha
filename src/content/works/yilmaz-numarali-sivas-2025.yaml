abstract: "Tarih arştırmalarında aslolan târihi olayların yazımının kendi döneminde ya da en yakın dönemde ele alınması ve kaynak îtibâriyle tarafsız bir şekilde yazılmış olması önem arz etmektedir. Bu minvalde Osmanlı şeriye sicilleri dediğimiz vesikalar Osmanlı devlet tarihinin sosyo-ekonomik ve idâri yapıları hakkında tarihe şık tutarak târihi olayların aydınlatılmasına büyük katkılar sunmaktadır. Sivas şeriye sicilleri 65 adet sicilden oluşmakta ve hâlâ çalışılmamış birçok sicil bulunmaktadır. Bizlerde Sivas şehrinin belli bir döneminin aydınlatılması için küçükte olsa katkı sunmak amacıyla 7 numaralı şeriye sicilinin transkrib ve değerlendirmesini yapmaya çalıştık İncelemiş olduğumuz 7 numaralı Sivas şeriye sicili Osmanlı devletinin 1802-1805 (H.1217-1220) yıllarını kapsamaktadır. Bu dönemde Sivas şehrinin merkez ve taşra teşkilâtı şehrin idârî ,askerî,sosyo-ekonomik yapısı hakkında geniş bilgiler elde etmekteyiz. Defterdeki vesikalar berat, ferman,, i'lam ,hüccet, tereke kayıtları,nikah,,ma'ruz,,katl davaları ,vakıf belgeleri, kassam defterleri ve rusûm gibi belgelerden oluşmaktadır. Çalışmış olduğumuz defter daha önce hiç kimse tarafından ele alınmamış ve çalışılmamıştır. Belgelerin dili büyük çoğunlukla Osmanlı yazı sanatında rika denilen hat yazısı ile yazılmıştır. Transkripsiyon yapılırken yazım ve imlâ kurallarına uyulmaya çalışılmıştır."
