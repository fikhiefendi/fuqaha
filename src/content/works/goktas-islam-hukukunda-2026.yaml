abstract: "Bu çalışmada, ölüm öncesi ve sonrası süreçte gerçekleştirilen cenaze işlemleri ele alınmıştır. Çalışma, Hanefî mezhebi merkez alınarak hazırlanmış; konular, dört sünnî mezhep arasındaki ihtilaf noktalarına temas edilerek mukayeseli bir şekilde incelenmiştir. İncelemede, vefat eden kişiyle ilgili süreçlerin kronolojik sıralaması esas alınmış; bu nedenle kaynaklardaki konu tertibinden kısmen farklı bir yol izlenmiştir. Araştırmada öncelikle ölüm hastalığı ve muhtazarla ilgili hükümler ele alınmış; ardından cenazenin yıkanması, kefenlenmesi, taşınması, cenaze namazının kılınması, defin işlemleri ve defin sonrasında gerçekleştirilen uygulamalar fıkhî açıdan değerlendirilmiştir. Ayrıca taziye, ağıt, telkin, kabir ziyareti, cenaze evinde yemek hazırlanması ve ıskat gibi toplumda yaygın şekilde uygulanan meseleler de mezheplerin yaklaşımı doğrultusunda incelenmiştir. Her bir konu ele alınırken öncelikle Hanefî mezhebine ait temel fıkıh metinleri ve şerhlerinden hareketle meselenin genel çerçevesi ortaya konulmuş, ardından diğer mezheplerin görüşleri, bizzat kendi klasik kaynaklarına müracaat edilerek tespit edilmiştir. Mezhepler arasındaki görüş ayrılıklarının çoğunlukla delil olarak kabul edilen rivayet ve uygulamalardaki farklılıklardan kaynaklandığı görülmüş; bu ihtilaflar, delil mukayesesi yapılmaksızın, temel dayanaklarıyla birlikte özetlenmiştir. Çalışmada, cenaze işlemlerine dair ayrıntıların tamamına yer verilmesinden ziyade, konunun ana esaslarını kapsayan, sistematik ve derli toplu bir çerçeve sunulması hedeflenmiştir. Bu tezin, cenaze işlemleri konusunda mezheplerin görüşlerini bütüncül bir bakışla görmek isteyen araştırmacılar için başvurulabilir bir çalışma niteliği taşıması amaçlanmıştır."
