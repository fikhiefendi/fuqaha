abstract: "İmam Muhammed Tâhir b. Âşûr, eserleri yaygın olarak tanınan, müteahhir dönem âlimleri arasında temayüz etmiş seçkin bir âlimdir. Özellikle Kur'ân-ı Kerîm'i“et-Tahrîr ve't-Tenvîr”adını verdiği eseriyle tefsir etmesi, onun tanınırlığını ve şöhretini artırmıştır. Bu eser, içerdiği yenilikler, belâgat yönü ve özgün üslubu sebebiyle sağlam ve güvenilir kaynaklar arasında kabul edilmiştir. Ne var ki, bu tefsirde müellif, bazı görüşleriyle bütün müctehid imamların ya da bir kısmının görüşlerine muhalefet etmiştir. Bu durum, özellikle ahkâm âyetlerinin tefsirine dair bazı ifadelerinde ve bazı diğer görüşleri eserinin çeşitli kısımlarında zikretmesinde görülmektedir. Bu nedenle ben, bir muhakkik olarak, onun görüşünü ve istidlâlini ortaya çıkarmaya, delil ve gerekçelerini açıklığa kavuşturmaya, bunları dört imamın görüşleriyle karşılaştırmaya yöneldim. Bütün görüşleri ve dayanaklarını zikredip değerlendirdim; doğruya en yakın olanın ortaya çıkması amacıyla tercih sürecini açıkladım. Ardından, imamın delillerini ve sözünün uygulanmasının sonuçlarını tartışarak, araştırmanın önemini ve amacını ortaya koymaya; bazı görüş ayrılıklarının sebeplerini çözümlemeye ve onun görüşünü diğer görüşlerle karşılaştırmalı olarak göstermeye gayret ettim. Bu doğrultuda, imamın yaşadığı dönemi, hayatını, ilmî birikimini, görüşlerini ve diğer imamlarla ihtilaf ettiği noktaları tespit etmek için tümevarımsal ve betimleyici yöntemi, ayrıca delil ve şahitleri ortaya koymak için istidlalci yöntemi benimsedim. Tüm bunların sonucunda, İmam Tâhir'in geniş bir ilme, güçlü bir kavrayışa, fasih bir dile ve etkili bir beyana sahip olduğu; değişken şartlara sahip bir dönemde yaşadığı ve çeşitli mertebelere yükseldiği; kimi zaman isabet ettiği, kimi zaman ise isabetsiz bir görüşe vardığı sonucuna ulaştım. Bununla birlikte, bazı görüşleriyle meşhur olan ve yerleşik kabul edilen görüşlere muhalefet ettiği, ayrıca muteber sayılmayan bazı kanaatleri dile getirdiği anlaşılmıştır. Bu tür görüşlere itibar edilmemesi ve onlara göre hüküm verilmemesi gerektiği kanaatine vardım. Hiç kuşkusuz، İmam'ın görüşlerini ortaya koymak، bunları diğer imamların VII görüşleriyle mukayese etmek، delilleri incelemek ve en güçlü görüşü belirlemek süreçleri çeşitli zorluklarla karşı karşıya kalmıştır. Bu zorlukların başında: İmam'ın genel görüşlerden ayrıldığı noktaları tespit etmek، onun belâgat yüklü ifadelerini anlamak، tefsirinde atıfta bulunduğu diğer eserlerine ulaşmak ve böylece onun görüşünü tam manasıyla kavramak yer almaktadır. Ayrıca، tefsirinde dilbilgisi، belâgat، farklı âlimlerin yorumları ve kendi fıkhî kanaatini harmanlaması، onun fıkhî görüşünü ayırt etmeyi güçleştirmiştir. Ancak azim ve gayret sayesinde bu zorlukların üstesinden gelinmiştir."
