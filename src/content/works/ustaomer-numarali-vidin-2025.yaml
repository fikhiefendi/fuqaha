abstract: "Bu çalışmada 18 Numaralı Vidin Şer'iyye Sicilinin transkripsiyonu ve değerlendirmesi yapılmıştır. Çalışmanın amacı, başta Vidin tarihi olmak üzere, XVIII. yüzyılda geçen tarih aralığında Osmanlı Tarihine ve Vidin'e ait şer'iyye sicili çalışmalarına katkı sağlamaktır. H. 1153 / M. 1740 1741 yıl aralığını kapsayan şer'iyye siciline göre Vidin'in sosyal, askeri, siyasal, ekonomik ve kültürel tarafları hakkında detaylı bilgilere ulaşmak ve bunları analiz etmek çalışmanın bir başka hedefi olarak sıralanabilir. Transkripsiyonunu ve değerlendirmesini yapmış olduğumuz kadı sicili, M. 1740-1741 yıllarında kayda alınmış bir defterdir. Defterin kayda alınmış olduğu yıl, 1735-1739 yıllarında Rusya ve Avusturya savaşlarının bitiminin hemen sonraki yıl olduğu için kayıtlar arasında savaş halinden çıkmış bir şehirde yapılması gereken tadilat vb. şehir düzenleme işlerinde de kayıtlara rastlanmıştır.“18 Numaralı Vidin Şer'iyye Sicili'nin Değerlendirilmesi ve Transkripsiyonu H. 1153 / M. 1740-1741”başlıklı bu tez giriş ve iki ana bölümden oluşmaktadır. Tezin giriş bölümünde Osmanlı Devleti'nin şer'i ve örfi hukuk yapısı, Vidin'in tarihi süreci ve Vidin kalesi son olarak dönemin padişahı olan I. Mahmud'un şahsiyeti ve döneminde vuku bulmuş olaylar incelenmiştir. İkinci kısımda ise 18 Numaralı Vidin Şer'iyye Sicilinin fiziki özellikleri, defterin içinde yer alan davalar ve bunların içerikleri, adı geçen idari birimler ve yerleşim yerleri ve defterde ismi geçen kişilerle birlikte bu kişilerin görevleri hakkında bilgiler yer almaktadır. Tezin son kısmı ekler bölümünden oluşmaktadır. Bu bölümde 18 Numaralı Vidin Şer'iyye Sicili'nin transkripsiyonu, verilerle ilgili tablo ve grafikler yer almaktadır."
