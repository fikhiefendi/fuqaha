abstract: "İnsanlığın ilk yıllarından itibaren aile kurumunun kullanılması, bu kurumun hukuksal alanda da önemli bir yer tutmasına vesile olmuştur. Bu önemli konumu itibariyle her toplumda aile hukukunun özel bir yeri bulunmaktadır. İslam hukukunda ise aile hukukunun çok daha geniş bir yeri vardır. Bu durum İslam dininin aileye verdiği önemin bir tezahürüdür. Toplumların yapısında gerçekleşen önemli değişiklikler aile hukuku alanında da bazı şekil şartlarının güncellenmesi zorunluluğunu doğurmuştur. Mesela eski toplum yapısında tamamen geçerli olan sözlü kültür bugün için eski etkisini kaybetmiştir. Sözlü kültür üzerine bina edilen aile hukuku da bu sebeple bazı değişikliklere ihtiyaç duymuştur. Bu çalışmamızda özellikle son yüzyılda ülkemizde meydana gelen sosyal değişiklikler ele alınmış devlet otoritesinin aile hukukuna yaptığı müdahalelerin İslam hukuku açısından değerlendirmesi yapılmıştır."
