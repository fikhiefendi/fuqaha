abstract: "Asr-ı saadetten itibaren Hz. Peygamberin sözleri ve uygulamaları hakkında çeşitli amaçlarla sorulan sorular, h.III/ m.IX. asırdan sonra cevaplarıyla beraber müstakil eserlerde yer almaya başlamıştır. Bu eserlerin ortak özellikleri, bize hadîs edebiyatı içerisinde“el-fetâva'l-hadîsiyye”ismiyle oluşmuş bir türden bahsetme imkânı vermektedir. Buna göre hadîslerin kaynağı, râvîleri, sıhhati ve yorumu, çelişkili gözüken hadîsler, herhangi bir konuda hadîs olup olmadığı, halk arasında şöhret bulmuş bazı rivâyetlerin değerlendirilmesi, Hz. Peygamber, ashâbı ve diğer peygamberler ile ilgili birtakım konular ve hadîs ilimlerinin teknik meseleleri hakkındaki sorulara verilen cevaplar ile çeşitli konularda hadîsler ışığında verilmiş fetvâlara“el-fetâva'l-hadîsiyye”, bunları ihtiva eden eserlere de“el-fetâva'l-hadîsiyye eserleri”denir. Tezde literatürde yapılan taramayla tespit edilen bazı eserlerin okunması, incelenmesi, ortak ve farklı özelliklerinin belirlenmesi ve değerlendirilmesi şeklinde bir yöntem takip edilmiştir. Tez, belirtilen asırlarda seçilen eserler kapsamında, müslüman toplumların hangi konulara ve hadîslere ilgi duyduklarını ortaya koyması açısından önem taşımaktadır. Birden fazla eserde tekrarlanan fetvâların ortak ve farklı yönleri ile konunun ele alınış şekli hem eserlerin müelliflerinin tanınmasına katkıda bulunmakta hem de konuyla ilgili süreç içerisinde bir gelişim olup olmadığını göstermektedir. Ayrıca tamamen veya kısmen hadîs fetvâlarından oluşan bu eserlerde yer alan bazı soruların çağımızda da zaman zaman gündeme geldiği görülmektedir. Pek çok konuda çeşitli âlimlerin görüş ve kanaatlerine dair bilgi bulabileceğimiz bu kitapların bazılarında hadîslerle ilgisini ve niçin sorulduğunu tespit edemediğimiz bazı sorular da yer almaktadır."
