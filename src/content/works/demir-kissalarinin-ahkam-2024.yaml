abstract: "Kur'ân bütün insanlığa rehberlik etmek ve onları hidayete götürmek üzere kutsal bir kitap olarak Allah tarafından gönderilmiştir. İlk muhataplar bu kutsal kitabı okumuş, yetenekleri ve yetkinlikleri doğrultusunda onu anlamaya çalışmıştır. Ulema ise onun anlaşılması adına üstün gayretler sergilemiş ve bu anlamda çok değerli tefsirler telif etmiştir. İşte çabalardan birini de Ankara İlahiyat Fakültesi'nde yıllarca hadis dersleri okutmuş ve hadis konusunda eserler yazmış olan Talat Koçyiğit gerçekleştirmiştir. Talat Koçyiğit, ilkin İsmail Cerrahoğlu ile bu çalışmaya başlamıştır. Ancak birinci ciltten sonra Cerrahoğlu'nun ayrılmasıyla Koçyiğit bu çalışmaya tek başına sürdürmüştür. Kur'ân kıssalarındaki ibadet, muamelât ve ukûbat konuları açılarından bu tefsirin değerlendirilmesi araştırmanın konusu olmuştur. Bu çalışma, giriş ve iki bölümden oluşturulmuştur. Birinci bölümde Koçyiğit'in hayatı, eserleri ve hadisçi gözüyle tefsir yazımı incelenmiştir. İkinci bölümde ise Koçyiğit'in Kur'ân kıssalarında yer alan ahkâm âyetlerine yaptığı açıklamalar, ibadet, muâmelât ve ukûbat bağlamında araştırılmıştır. Bu düzlemde incelenen âyetler, mekkî ya da medenî oluşlarına göre gruplandırılmış ve âyetler nüzul sırasına göre değerlendirilmiştir. Böylece ilgili âyetler tek tek ele alınmış, Koçyiğit'in tefsiri ve açıklamaları baz alınarak bazı tefsirlerle karşılaştırmalı bir şekilde incelenmiştir. Elde edilen verilerin yazıldığı sonuç kısmıyla araştırma tamamlanmıştır."
