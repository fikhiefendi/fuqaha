abstract: "Müteârız hadislerin çözüme kavuşturulması, hadis ilimleri içerisindeki en önemli disiplinlerden biridir. Bununla birlikte, hicrî ikinci asrın son çeyreğinden itibaren bu sahaya dair pek çok eser ortaya konmuştur. Bu bağlamda bu çalışmada da; hicrî ikinci asrın en önemli âlimlerinden Ebû Hanîfe'nin mezkûr disipline ilişkin yorumları, mukayeseli olarak değerlendirmeye tabi tutulmaktadır. Giriş ve üç bölümden oluşan çalışmanın Giriş bölümünde; kavramsallaşma sürecinde müteârız hadisler ilmi incelenmekte; Birinci bölümde, Ebû Hanîfe'nin hayatı, ilmî kişiliği ve hadisçi kimliği ele alınmakta; İkinci bölümde, Ebû Hanîfe ve Hanefî âlimlerinin teâruzu gidermede başvurdukları çözüm yolları tetkik edilmekte; Üçüncü bölümde ise bu ilme ait ilkeler, Ebû Hanîfe'nin yaklaşımı açısından örnekler eşliğinde tespite çalışılmaktadır. Ebû Hanîfe'nin yaşadığı dönemde farklı mezheplere mensup ulema tarafından görüş ve eser türünden bu ilme dair bir birikim oluşmuştur. Bu alanda otorite sayılan Ebû Hanîfe'nin tetkike konu edilmesi; Onun fikir ve tasarruflarının ilgili alandaki önemi ve etkisinin anlaşılmasına katkı sağlayacaktır."
