abstract: "Kâr malda girişimcinin faaliyeti sonrası bir artışın meydana gelmesi anlamı taşıdığından bu artışın kaynağının ne olduğu İslâm hukuku açısından önem arz eder. Hanefî mezhebine göre kârın kaynağı mal (sermaye), amel (emek) ve damân olmak üzere üçtür. Söz konusu kaynakların kabulü fukahâ arasında ihtilaflıdır. Bu çalışmanın temel amacı mezhepler tarafından kabul edilen kâr kaynaklarının neler olduğunu ve bu kaynakların akit şirketlerinin kabul, kuruluş ve ortaklar arası kâr paylaşımı hususunda nasıl bir etkiye sahip olduğunu tikel örnekler üzerinden açıklamaktır. Tez giriş, iki bölüm ve sonuç kısımlarından oluşmaktadır. Birinci bölümde kârın mahiyeti ortaya koyulmuş ve tez boyunca sıkça atıf yapılacak kavramlar izah edilmiştir. İkinci bölümde ise bey' akdinde kâra ilişkin hükümler ve akit şirketlerinde kârın kaynakları ile bağlantılı hususlar ele alınmıştır."
