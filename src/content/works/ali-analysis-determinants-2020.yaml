abstract: "Şüphesiz, sermaye yeterlilik oranı (SYO), banka sağlamlığını ölçme kabiliyeti nedeniyle düzenleyiciler için en yüksek öncelik olmaya devam etmektedir. SYR, düzenleyici sermayenin finansal sıkıntılar sırasında beklenmeyen finansal kayıpları giderme kapasitesini ölçer. Bu nedenle, bu araştırmanın amacı Özkayna karlılığı (ÖK), Aktif Karlılığı (AK), Finansman Mevduat Oranı (FMO), Faaliyet Giderleri ile Faaliyet Gelirleri (FGFG), Log Toplam Varlık (BÜYÜKLÜK), Sorunlu Finansman (SF), Gayri Safi Yurt İçi Hasıla ( GSYİH) ve Enflasyon (ENF) rasyolarının 2013'tan 2018'a kadar KİK'deki bütün İslami bankaların SYO üzerindeki etkilerini analiz etmektir. Bu çalışma analizi yürütmek için istatistiksel bir araştırma tasarımı uygulamaktadır. Tanımlayacı istatistikler, biraz zayıf işletme verimliliği dışında genel banka performanslarının olumlu olduğunu özetlemektedir. Benzer şekilde ekonomik göstergeler de olumludur. Korelasyon analizine göre sadece FMO'ın SYO ile doğrudan ilişkisi varken, ÖK, FGFG, BÜYÜKLÜK, SF, SYİH, ve ENF rasyoları SYO ile ters ilişkileri vardır. Son olarak, regresyon analizi bankaların SYO'ni FGFG ve FMO oranların tarafından güçlü ve negatif bir şekilde etkilendiğini, BÜYÜKLÜK oranın tarafından da güçlü ve negatif bir şekilde etkilendiğini göstermiştir. Tüm diğer değişkenler etkisiz bulunmuşturç. Sonuç olarak, bankalara işletme maliyetlerinin verimliliğini artırmak için mümkün olan en düşük seviyeye indirmelerini ve aşırı ve yetersiz finansmanın bankaların likidite pozisyonu üzerindeki zararlı etkisini göz önünde bulundurarak optimal finansman politikası geliştirmelerini tavsiye edilmektedir. Ayrıca, bankaların büyümeyi minimum kabul edilebilir risk ve maksimum genel performans ile takip etmeleri önerilir."
