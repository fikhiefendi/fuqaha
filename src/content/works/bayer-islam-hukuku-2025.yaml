abstract: "Tarihin derinliklerinden bu yana, savaş ve silahlı mücadelelerin sebep olduğu tahribat, toplulukların karşı karşıya kaldığı evrensel bir mesele olarak kendini göstermiştir. Ne var ki, uluslararası camianın geçmişten gerekli dersleri almadığı görülmektedir; zira günümüzde bile silahlı mücadeleler hâlâ sürmektedir. Bu mücadele sahnelerinde siviller; hastalıklara, sakatlanmalara hatta ölümlere maruz kalmaktadır. Günümüz stratejileri ve yıkım gücü yüksek silahlar, temel insan haklarının korunmasını ve devam ettirilmesini giderek zorlaştırmaktadır. Bu durum karşısında uluslararası topluluklar bir araya gelerek savaşların nasıl yürütülmesi gerektiğine dair anlaşmalar ve normatif düzenlemeler yapmışlardır. Uluslararası insani hukuk, savaş dönemlerinde hem savaşanların hem de sivillerin temel haklarını savunan bir hukuk dalı olarak belirginleşmiştir. Bu hukuk dalının temel ilkeleri doğrultusunda, koruma mekanizmaları geliştirilmiş ve imzalanan antlaşmalarla pekiştirilmiştir. İslam dini, çatışma zamanlarında insan onuruna ve temel haklara saygı göstererek, sivilleri, savaşa katılmamış bireyleri ve savaşmayı bırakmış olanları koruma altına alır. İnsani hukukla paralel bir biçimde, İslam savaş hukuku da savaş esnasında sivillere verilen zararı minimize etmeyi amaçlar. Kadınlar, çocuklar, yaşlılar ve savaş dışı kalan kişilerin korunması önceliklidir. İslam, savaşın çeşitlerini ve her birinin hukuki boyutlarını ve sonuçlarını titizlikle ele alır. Bu tez, savaşın evrilen yapısını ve modern çatışma ortamlarında sivillerin karşılaştığı tehlikeleri inceleyecek ve bu çerçevede iki hukuk sisteminin sunduğu çözümleri karşılaştırmalı olarak analiz edecektir. Son olarak, tez, sivillerin korunması konusunda uluslararası toplumun ve devletlerin üstlendikleri sorumlulukları sorgulayacak ve savaş hukukunun bu alandaki güncel zorluklarını aydınlatmaya çalışacaktır."
