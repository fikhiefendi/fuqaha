abstract: "Bu araştırmanın hedefi; islami jetonların mahiyetini tanımak ve diğer klasik finansal malzemelerden ayrıcalığını bilmek, alt yapıyı özellikleri ve ekonomik önemini tanıtmak. Üstelik; islami jetonların alt yapı projelerini finans etmekte oynadığı rolü ve bu projelere uygun formülleri bilmek, ve islami jetonları alt yapısını finans etmekte kullanan ülkelerin bazı pratik deneyimlerini incelemek ve uygulama mekanizmasını tekip etmektir. Ayrıca, altyapıya giriş, özellikleri, ekonomik önemi ve Libya'daki mevcut durumu. Araştırmada ayrıca, islami jetonları ve Libya'daki para piyasasının gerçekliği ve Libya'daki jetonlar yasasının analizi, en önemli özellikler ve dezavantajlar ile dünyadaki İslami jetonlar endüstrisi ve konularının hacmi ele alındı. Libya'da alt yapı projelerini finans etmek için islami jetonları kullanarak finansal öneri sunulmuştur. Libya ekonomiğinde uygulanmalarının mekanizmasını açıklayan iki uygulamalı örnek yapılmıştır. Uygulanmaları şu şekilde olacak; Uluslararası Tarablus Havalimanı'nı geliştirme projesini finans etmek için mülk ile biten izin jetonları, elektrik genel şebekesini iyileştirme projesini finans etmek için mülk ile biten paylaşım jetonları kullanılmıştır. Araştırmadan sonuçlanan en önemli noktalar şunlardır; İslami jetonlar kullanılarak bu projeler için uygun meşru finansal metotlarını kullanıp Libya iktisadında kalkınma projelerini geliştirme ve inşası için özellikle alt yapı projeleri için direkt hükümet harçlarına itimat etmeden alternatif meşru finansal islami jetonlara dayanarak lazım olan finansal kaynaklar sağlanabilmektedir. İslami jetonlar biriktirilen paraları kutuplaşıp bütçe sağlayarak tasarruf oranını artırabilir, üstelik; açık pazarlar sayesinde bütçe hacmini kontrol etmek ve ekonomik enfleksiyonla savaşmak için parasal siyaset vesilesi olarak kullanabilmektedir."
