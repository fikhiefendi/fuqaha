abstract: "“Şeyhülislam İbn Kemalpaşa Tefsiri'nde Muʻtezile Eleştirisi”adlı bu çalışmamızda ilk olarak tefsir, kelam, fıkıh gibi İslami ilimlerde derin bilgilere sahip olan İbn Kemal'in hayatı, eserleri ve ilmi kişiliği hakkında kısa ve özlü bilgiler verilmiştir. Onu iyi tanımak, eserlerini iyi tahlil etmek, gerek tefsirciliğini değerlendirmede gerekse diğer İslami ilimlere vukufiyetini değerlendirme konusunda İslami ilimler alanında araştırma ve çalışma yapan bizlere yardımcı olacaktır. İkinci bölümde ise çalışmamızın temel konusu olan Muʻtezile mezhebinin eleştirisi, İbn Kemalpaşa ve Tefsîr'i özelinde ele alınmıştır. Muʻtezile, İslam tarihinde iz bırakan mezheplerden biri olduğu için ekol ve görüşleri Kelam alimleri tarafından daha yoğun olmakla birlikte müfessirler tarafından da tenkide tabi tutulmuştur. Esasında Muʻtezile'nin görüşlerine tefsir kitaplarında yer verilmemesinin en önemli sebebi olarak, bu alanda aşılamamış bir zirve olan Zemahşerî'nin Mu'tezilî olması kabul edilebilir. İbn Kemal de Muʻtezile'yi tenkit eden müfessirlerden biridir. O, yer yer Muʻtezile mezhebini doğrudan eleştirirken, bazen Zemahşerî üzerinden, kimi zamanda üstü kapalı bir şekilde eleştirmektedir. İbn Kemal'in, bir müfessire tenkit yönelteceği zaman isim belirtmemekte ve kişileri hedefe koymamakta olduğu görülmektedir. O, eleştirilerini fikir ve görüşler üzerinden beyan etmiştir. Muhalif olduğu görüşü tenkit ederken uzun uzadıya izahlar yapmaktan kaçınmış, kendi görüşünü de aynı şekilde uzunca gerekçelendirmemiştir. Eleştirileri esnasında yapmış olduğu açıklamalardan, her daim Ehl-i Sünnet Matürîdî çizgiyi muhafaza etmeye çalıştığı anlaşılmakta ve bu tutumunda da başarılı olduğu müşahede edilmektedir."
