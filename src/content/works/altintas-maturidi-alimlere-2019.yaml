abstract: "Asr-ı saadette Müslümanların inancı arı ve duru idi. Ancak Hz. Peygamber'in (s.a.v.) vefatından sonra baĢta iman ve tevhid konuları olmak üzere itikadî alanlarda Müslümanlar arasında çeĢitli ihtilafların ortaya çıktığı görülmektedir. Bu ihtilafların sonucunda Ġslâm düĢünce tarihinde birbirinden farklı görüĢlerin ve mezheplerin ortaya çıktığı bilinmektedir. Ortaya çıkan bu mezheplerin en önemlilerinden biri de Ģüphesiz Mâturîdîliktir. Zira Ġslâm akaidinde özellikle de iman ve tevhid konularında en tutarlı görüĢleri ileri sürenlerin baĢında bu mektebin kurucusu Ġmam Mâturîdî'nin (333/944) geldiğini söylemek mümkündür. O Ġmam Azam Ebû Hanîfe'nin itikâdî görüĢlerini en güzel Ģekilde açıklamıĢ ve sistematik hale getirmiĢtir. Bu sebeple, onun itikâdî görüĢleri Hanefîlerin çoğu tarafından kabul görmüĢtür. Bunun yanında Mâturîdî'nin görüĢleri kendisinden sonra gelen Ebü'l-Yüsr Pezdevî (421-493/1030-1099), Ebü'l-Muîn Nesefî (438-508/1046-1114), Ömer Nesefî (461-537/1069-1142), Ali b. Osman ÛĢî (569/1173) ve Nureddîn Sâbunî (580/1184) gibi Hanefî âlimler tarafından benimsenmiĢ ve geliĢtirilerek savunulmuĢtur. Bu bağlamda söz konusu âlimler Mâturîdiliğin teĢekkül sürecinde önemli rol oynamıĢlardır. Öte yandan Hanefî-Mâturîdîlik, geçmiĢte olduğu gibi günümüzde de en çok mensubu olan mezheplerden biridir. Ancak Hanefî-Mâturîdî âlimlerin iman ve tevhid konularındaki görüĢleri Ģimdiye kadar bir bütünlük içerisinde incelenmemiĢtir. Bundan dolayı bu sahada bir boĢluk bulunduğu görülmektedir. Bu araĢtırma söz konusu boĢluğu doldurmayı amaçlamaktadır. Bu araĢtırmada Ģahıslar üzerinde derinleĢme ve fikirler üzerinde derinleĢme prensiplerinden yararlanarak tasvir yöntemi kullanılmıĢtır. Böylece Mâturîdî âlimlerin iman ve tevhid hakkındaki görüĢleri objektif olarak ortaya konulmaya çalıĢılmıĢtır. Sonuçta söz konusu âlimlerin iman ve tevhid hakkındaki görüĢlerinin temelde aynı olduğu, fakat iman kavramı noktasında imanın tanımı ve mukallidin imanı konularında; tevhid kavram konusunda ise farklı farklı deliller kullanılması noktasında Mâturîdî âlimler arasında bazı farklılıkların bulunduğu tespit edilmiĢtir."
