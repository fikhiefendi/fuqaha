abstract: "Ülke ekonomileri için tasarrufların yatırıma dönüştürülmesi çok önemlidir. Atıl halde bırakılan kaynaklar ekonomi içine çekilmelidir. Din, insanların hayat tarzlarına ve yaşama biçimlerine yön verir. Bütün dinlerde faiz yasaklanmıştır. İslam dininde de faiz ve yasaklanmış faaliyetlerle ticaret yapmak gibi nedenlerle insanlar finansal piyasalardaki işlemlerden uzak durmuşlardır. Artan tasarrufların ekonomiye yönlendirilebilmesi için son yıllarda İslami finans piyasalarında çalışmalar yapılmıştır. Klasik finansman araçlarına alternatif olarak yeni ürünler ortaya çıkmıştır. Yeni ürünlerin ortaya çıkması yeni kurumlar, yeni kurallar, yeni standartlar gibi ihtiyaçların doğmasına neden olmuştur. İslam hukuku ve prensiplerine göre faizin yasaklanmış olması ve herhangi bir risk almaksızın ve zarara ortak olmaksızın, sadece kara ortak olmanın İslami prensiplere aykırı oluşu, geleneksel bankacılık anlayışının yanında faizsiz bankacılık modelinin doğmasına ve gelişmesine yol açmıştır. Faizsiz bankacılık sisteminin büyümesi ile birlikte de, faizsiz finansal araçları talep eden kesime yönelik alternatif yatırım araçları geliştirilmeye başlanmıştır. Bu alternatif yatırım araçlarından biri de 'faizsiz bono uygulaması' olarak da nitelendirilen sukuktur. Tüm dünyada etkisini hissettiren 2008 krizinde, İslami finansal piyasaların daha az etkilendiği görülmüştür. Bu piyasaların daha az risk seven kişilere yönelik olması, krizlerden daha az etkilenmesi ve karlılık oranları dikkat çekmiştir. Bu nedenle sadece Müslümanların değil tüm gelişmiş ülkelerde de uygulama alanı bulmuştur. Dünyada ve ülkemizde uygulama alanı bulsa da oran olarak diğer finansal piyasalar ile karşılaşıldığında oldukça az bir orana sahip olduğu söylenilebilir. Bu çalışmamızda alternatif ürünlerin neler olduğu, ortaya çıkan yeni ürünler, yeni konular, yeni standartlar ve muhasebe uygulamaları hakkında araştırmalara yer verilmiştir."
