abstract: "Bu çalışma, hicrî V. yüzyılda yaşamış Şemsü'l-Eimme Serahsî'nin, (ö. 483/1090) eseri el-Mebsût'ta ele aldığı aile hukukuna ilişkin ayetlere dair yorumlarını içermektedir. Çalışmanın ilk bölümünde, müellife kadar uzanan Hanefî bakış açısı da dikkate alınarak Serahsî'nin, aile hukukunun en önemli konularından biri olan nikâh ve ahkâmına ilişkin ayetler bağlamında yapmış olduğu değerlendirmeleri serdedilmiştir. İkinci bölümde ise aynı sistematik gözetilerek müellifin, aile hukukunun diğer önemli bir alanı olan talâk konusu ile ilgili ayetlere dair yorum ve değerlendirmeleri analiz edilmeye çalışılmıştır."
