abstract: "Bu çalışmamızda Lâle Devri'nde Şeyhülislâm olan Yenişehirli Abdullah Efendi'nin“Behcetü'l-Fetâvâ”adlı kitabı aile hukuku kapsamında nikâhla ilgili fetvaların latinize edilerek gösterilen kaynakların incelenmesi yapılmıştır. Çalışmamız, bir giriş ve iki ana bölümden oluşmaktadır. Tezin giriş bölümünde amaç ve yöntem ile tezin çalışma alanı belirlenmiş, Yenişehirli Abdullah'ın hayatı, fetva kavramı ve Behcetü'l-Fetâvâ'nın hususiyetleri anlatılmıştır. Birinci bölümde; Yenişehirli'nin Şeyhülislâm olarak görev yaptığı dönemde nikâhla alakalı vermiş olduğu fetvalar Behcetü'l-Fetâvâ'nın 1266/1849 Osmanlıca baskısı esas alınarak numaralandı, latinize edildi, günümüz Türkçesine tercümesi yapıldı. Fetvalara Arapça olarak gösterilen nukûl/kaynaklar, eserlerin varsa matbu yoksa yazma nüshalarından bulunarak tercümesi yapıldı ve dipnotta yeri gösterildi. İkinci bölümde ise Behcetüʾl-Fetâvâ'nın nikâh bölümünde kullanılan kaynakların değerlendirmesi ve meselelerin tasnifi yapıldı. Toplumun birlik, beraberlik ve huzurunun menbaı olan ailenin oluşumu nikâh akdiyle gerçekleşmektedir. İslâm'da yapılan nikâhın sahih olması için; şahitlerin huzurunda, tarafların irade beyanı (icap ve kabul), ehliyet, aynı ortamda olması, evliliğin herhangi bir şartla kayıtlanmaması, evlenmeye engel bir durumun olmaması, gerekli olduğu hallerde tarafların veya velilerinin rızasının alınması yeterli görülmüştür. Başkasının huzurunda gerçekleştirilmesi, dinî bir tören yapılması gibi zorunluluğu da yoktur. Osmanlıda şeyhülislâmların verdiği fetvaların derlendiği fetva mecmuları farklı görüş ve uygulamaları ortadan kaldırmış, meselelere tercih edilen görüşlerle çözüm sunmuş, tatbik edilmesi açısından kolaylık sağlamıştır."
