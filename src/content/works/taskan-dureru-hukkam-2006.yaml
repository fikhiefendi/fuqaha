abstract: "Osmanlı Devleti'nin son yılları ve Cumhuriyet'in ilk yıllarında yaşamış olan Ali Haydar Efendi, yakın tarihimizde İslam hukuku alanında önemli eserler vermiştir. Türk hukuk tarihini daha iyi anlamlandırma çabasında bu geçiş sürecinin ürünlerinden Dürerü'l-Hükkâm Şerhi Mecelleti'l-Ahkâm Mecelle üzerine yazılmış ve Mecelle'nin değinmediği Hukuksal alanları tamamlamayı hedeflemiş olduğundan kıymete haiz bir kaynaktır. Bu tez, bu öneme binaen hazırlanmıştır. Üç bölümden oluşmakta olan tezin, birinci bölümünde müellifin hayatı ve eserleri hakkında bilgiler, ikinci bölümde ise Dürerü'l-Hükkâm'ın Kavâid-i Külliye bölümündeki 1-63 maddelerde müellifin istifade ettiği kaynaklara yönelik bilgiler yer almaktadır. Üçüncü ve son bölümde; Tezin ana konusunu oluşturan Dürerü'l- Hükkâm'ın 1-63. maddeleri üzerine hazırlanmış olan latinize çalışması yer almaktadır. Tezin hazırlanması esnasında Mecelle'nin maddeleri derli toplu olarak zikredilmişse olduğu gibi bırakılmış, zikredilmediyse [ ] ibaresi içinde kaideler ek olarak tarafımızdan yazılmıştır. Metnin aslına sadık kalınmaya özen gösterilmiş, günümüz Türkçesinde kullanılan kelimeler, bugünkü telaffuzlarıyla verilirken; kullanılmayan kelimeler dönemlerine ait oldukları şekilde muhafaza edilmeye özen gösterilmiştir."
