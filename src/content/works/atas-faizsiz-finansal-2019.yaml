abstract: "2011 yılının sonlarında, piyasamız için yeni bir ürün olan kira sertifikaları veya dünyaca bilinen ismiyle sukuk, ilk defa ihraç edildi. Hiç şüphesiz, bir piyasada farklı finansal ürün ve hizmetlerin artması piyasaların işlerliği açısından oldukça önemlidir. Sukuk piyasaları düşük korelasyon, yüksek getiri ve büyüme potansiyeli sağladığı için tüm dünyada yatırımcıların ilgisini çekmektedir. Çalışmamızda da ilk defa ihracı gerçekleştirilen bu yeni ürünün uluslararası konvansiyonel sabit getirili varlık yatırımcıları açısından bir çeşitlendirme faydası sağlayıp sağlamadığı araştırılmıştır. Çalışmada uluslararası sukuk portföyü ve uluslararası tahvil portföylerini temsilen FTSE'nin yayınlamış olduğu, uluslararası sabit getirili varlık endeksleri kullanılmıştır. Çalışmada uzun dönemli ilişkinin varlığının tespiti için hem Engle-Granger hem de Johansen eşbütünleşme teknikleri uygulanmıştır. Daha sonra ilişkinin detaylarını tespit etmek amacıyla vektör hata düzeltme modeli de test edilmiştir. Elde edilen bulgulara göre uluslararası sukuk endeksi diğer konvansiyonel sabit getirili varlık endeksleri için büyük ölçüde çeşitlendirme faydası sağlamaktadır."
