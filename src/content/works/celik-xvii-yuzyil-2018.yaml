abstract: "Fetva, ilk defa Osmanlı Devleti'nde bir müessese haline gelmiştir. Fetva müessesesinin en önemli ürünleri olan ve ortaya çıktığı çağın dini, hukuki, siyasi ve sosyal hayatına dair önemli malumatlar ihtiva eden fetva mecmualarının birçoğu günümüze ulaşmıştır. Bu çalışma, Osmanlı Devleti'nin merkez ve taşrasında iki meşhur müftünün Kitâbu's-Siyer fetvalarını kaynak, muhteva ve şekil açısından mukayese ederek bir yandan İslam uluslararası hukukuna dair meselelerin Osmanlı merkez ve taşrasında nasıl değiştiğini gösterirken diğer yandan merkez ve taşrada verilen fetvaların hukuki referanslarını, şekilsel özelliklerini, muhtevalarını ve konu farklılıklarını incelemektedir."
