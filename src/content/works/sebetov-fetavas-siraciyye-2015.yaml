abstract: "Sirâceddin Ali b. Osmân el-Ûşî 6/12. yüzyılda yaşamış Hanefî mezhebine mensup bir âlimdir. Farklı ilim dallarında eserler yazan Ûşî, Hanefî fürû-i fıkhına dair el-Fetâva's-Sirâciyye adlı bir eser kaleme almıştır. Müellif eserini 569/1173'te günümüzde Kırgızistan toprakları içerisinde bulunan Oş şehrinde tamamlamıştır. Araştırmamız Sirâceddin Ali b. Osmân el-Ûşî'nin hayatı, ilmî kişiliği, eserleri ve el-Fetâva's-Sirâciyye'deki görüşleri çerçevesinde onun fıkıh ilmindeki yerini konu edinmektedir. Çalışmamız bir giriş ve dört esas bölümden oluşmaktadır. Giriş bölümünde araştırmamızın amacı, önemi, yöntemi ve kaynakları hakkında bilgi verilmiştir. İlk bölümde Sirâceddin el-Ûşî'nin hayatı, yaşadığı mekân ve dönem, hocaları, talebeleri, ilmî kişiliği ve eserleri üzerinde durulmuştur. İkinci bölümde el-Fetâva's-Sirâciyye'nin genel tanıtımı yapılmış ve Ûşî'nin eserinde atıfta bulunduğu âlimler ve eserler tanıtılmıştır. Üçüncü bölümde ise el-Fetâva's-Sirâciyye'nin muhtevasına yönelik bir çalışma yapılmıştır. Dördüncü bölümde ise el-Fetâva's-Sirâciyye'nin Hanefî fıkıh literatüründeki yeri tespit edilmeye çalışılmış ve Sirâceddin Ali b. Osmân el-Ûşî'yi Hanefî mezhebi içinde farklı kılan görüşleri değerlendirilmiştir. Anahtar Kelimeler : ÛĢî, el-Fetâva‟s-Sirâciyye, Fıkıh, Hanefî mezhebi, Fetva, Fıkhî görüĢler."
