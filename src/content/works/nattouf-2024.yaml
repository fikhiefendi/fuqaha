abstract: "Bu çalışma, Şâfiî mezhebinin alimlerinin ahkâm âyetlerini yorumlarken dayandıkları temelleri ve kuralları açıklığa kavuşturmaya çalıştığı için, Şafii'nin fıkıh yorumuna metodolojisini ele almaktadır. Araştırma, bu alandaki en önemli Şafii eserlere odaklanarak, fıkhî yorum kavramını ve gelişimini gözden geçirmektedir. Ayrıca Şafiilerinda ortaya çıkan fıkıh yorumunda yazım usulleri ele alınıp Şafiilere göre fıkıh yorumunda nakledilene ve akla uygun olana dayalı yöntemi üzerinde durulmaktadır. Bu nedenle araştırma, fıkıh yorumunun ortaya çıkışını ve gelişimini incelemek için tarihsel ve analitik yaklaşımı benimseyerek Şafii alimlerin ahkâm âyetlerini yorumlamadaki yaklaşımlarının maâlimlerini analiz etmek için betimsel bir yaklaşım kullanmıştır. Araştırma sonuçları, Şafii metodolojisinin çoğunlukla Şafii fıkhının esaslarına dayandığını ancak bunlarla sınırlı kalmayıp, bunların ötesine geçerek diğer mezheplerdeki istidlâl ve istinbât araçlarına da uzandığını göstermektedir. Bu da onu mezhepçi önyargıların üstesinden gelme konusunda daha yetenekli kılıyor.Ayrıca, İstishâbı ve Şeriatın yargıları çıkarmadaki amaçlarını kullanmanın yanı sıra Kur'an ve Sünnete dayanma, icma, sahabe ve tabilerin sözleri ve kıyas yoluyla akıl yürütme gibi Şafii yorum metodolojisinin unsurlarına da ışık tutmaktadır. Şafii metodolojisinin maâlimleri, fıkıhçının araçlarının yanı sıra okumalar, vahiy nedenleri ve diğerleri gibi müfessirin araçlarının da kullanılmasına işaret etmektedir. Bütün bunlar, Şafii'nin fıkıh yorumuna metodolojisini Kur'an tefsiri tarihindeki önemli yaklaşımlardan biri haline getirmektedir. .Bu metodoloji, İstidlâl, argümanın gücü ve müfessirlerin yorum ile içtihadı birleştirme yeteneği ile ayırt edilmiş ve bu da fıkıh yorumunun zenginleşmesine ve gelişmesine yol açmıştır."
