abstract: "Hizmet sektörünün payının dünyada giderek artması, daha önceleri mallar üzerinde yapılan kalite ölçümü çalışmalarının hizmetlerde de yapılması ihtiyacını doğurmuştur. Böylece ortaya çıkan“hizmet kalitesi”kavramı, işletmelerin üzerinde önemle durması gereken bir konudur. Hizmet kalitesi, üretim sektörünün yanı sıra hizmet sektörü için de ölçülebilir bir kavramdır. Hizmet sektörünün içinde yer alan bankacılık sektöründe de geleneksel şube bankacılığı alanında hizmet kalitesi ölçümleri, bu kavramın çıktığı zamandan beri yapılagelmiştir. Teknolojinin gelişmesiyle birlikte internet kullanımının günlük hayata girmesi neticesinde bankalar interneti yeni bir dağıtım kanalı olarak kullanmaya başlamışlardır. 1990'larda başlayan internet bankacılığı, bu kanalın hem bankalara hem de müşterilere birçok avantaj sunması nedeniyle giderek gelişmiş ve birçok bankacılık hizmeti internet bankacılığı ile yapılır hale gelmiştir. 2010'lu yıllarda ise mobil teknolojilerin gelişmesi ile mobil bankacılık uygulamaları kullanıma sunulmuştur. Bu nedenle, bankacılık sektöründe önemli bir dağıtım kanalı haline gelen ve kullanımı giderek artan internet bankacılığı ve mobil bankacılık kanalları üzerinde de hizmet kalitesi çalışmalarının yapılması ihtiyacı doğmuştur. Böylece dünyada ve Türkiye'de internet bankacılığı konusunda hizmet kalitesi çalışmaları yapılmaya başlanmıştır. Mobil bankacılık yeni bir dağıtım kanalı olduğu için bu alandaki hizmet kalitesi çalışmaları ise oldukça yenidir. Bu çalışma ile kullanıcıların internet bankacılığı ve mobil bankacılık kanallarının e-hizmet kalitesi konusundaki düşünceleri ölçülmeye çalışılmıştır. Uygulama çalışması ise, Kuveyt Türk Katılım Bankası'nda internet bankacılığı ve mobil bankacılık kullanıcıları üzerinde yapılmıştır. Araştırma sonuçları bankanın sunduğu elektronik bankacılık hizmetinin kullanıcıları tarafından nasıl algılandığını göstermesinin yanı sıra, kullanıcıların bu hizmetlerden neler beklediğini de ortaya koymaktadır."
