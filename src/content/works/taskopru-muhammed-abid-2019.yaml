abstract: "Muhammed Âbid, net olmamakla birlikte, 1190/1776 yılında bugünkü Pakistan sınırları içerisinde kalmış bulunan Sind bölgesinde dünyaya gelmiş son dönem Osmanlı âlimlerindendir. Muhammed Âbid, hayatı boyunca farklı bölgelerde birçok âlimden ders alarak ilmini artırmıştır. Bunun yanı sıra hayatının ilk yıllarını Sind bölgesinde geçirdikten sonra ailesiyle birlikte 1194/1780 senesinde Hicaz bölgesine hicret ederek Cidde şehrine yerleşmiştir. Daha sonra dedesi ve babasının vefatı üzerine 1208/1793 yılında amcasıyla birlikte Yemen'e hicret ederek Zebid şehrine yerleşmiştir. Hayatını ilim yolculuklarıyla geçiren Muhammed Âbid, fıkıh, hadis, tefsir, Arap dili, sarf, nahiv, mantık, tıp vb. birçok ilimde eser kaleme alacak derecede bilgi sahibi bir âlimdir. Bunun yanında birçok alanda eser kaleme alan müellif, özellikle de fıkıh ve hadis alanında temayüz etmiştir. Çalışmamız giriş, iki bölüm ve sonuçtan oluşmaktadır. Giriş bölümünde araştırmanın amacı, önemi, yöntem ve kaynakları ortaya konulmuştur. Birinci bölümde, Muhammed Âbid'in hayatına değinilerek onun yaşamış olduğu bölgelerin siyasî, sosyal olaylarıyla ilgili bilgiler sunulmuştur. Ayrıca Muhammed Âbid'in ailesinin ve özellikle dedesi ve amcasının, onun hayatında bıraktıkları etkilere işaret edilmiştir. Muhamme Âbid'in yapmış olduğu yolculuklar hakkında da bilgi verilmiştir. Bu bölümün sonunda ise hocaları ve talebeleri hakkında birtakım bilgiler verilmiştir. İkinci bölümde ise Muhammed Âbid'in eserleri ve risaleleri incelenmiş, bunların içerikleri hakkında bilgiler verilmiştir. İkinci bölümden sonra ise bir sonuç kısmıyla tez tamamlanmıştır."
