abstract: "Ekonomide iktisadi istikrar ve refah, gelirin döngüsel bir akım içerisinde fon arz edenler ile fon talep edenlerin etkin bir şekilde buluşmasına bağlıdır. Bir hane halkı çalışma sektöründen elde ettiği kazancının bir kısmını vergi ve yaşam giderleri için harcar bir kısmını da finans/banka sektöründe tasarruf olarak tutar. Ekonomik döngüde tasarruf etmek için yapılan bu sızıntının tekrar ekonomiye kazandırılması gerekir. Bunun için finans sektörü kendisinde toplanan fonları geliştirdiği enstrümanlarla fon talep edenlere vererek sızıntıların ekonomiye aktif bir şekilde tekrar dönmesini de sağlar. Bu sayede ekonomik kazancın hepsi harcanır ve üretilen malların tamamı satılır. Bir sonraki dönemde iş sektörünün üretimini kısmasına ve işçi azaltmasına gerek yoktur. Fonların finans sektöründe toplanabilmesi ve talep edenlere sevk edilebilmesi için doğru ekonomik müesseselere ihtiyaç vardır. Ekonomik aktörlerin değerleri ile finansal uygulamalar arasındaki ilişkinin iyi anlaşılması yaşanacak ekonomik krizlerin önlenmesine katkı sağlayacaktır. Bu çalışmamızda kapitalist ekonominin en temel aktörü olan iktisadi özne ile İslam ekonomisinin ekonomik aktörü olan Müslüman özne karşılaştırmalı olarak incelenmektedir. Onların finans sektörüyle olan tutumları mukayese edilerek elde edilen sonuçlar tartışılmaktadır. Kapitalist ekonomiler için ''Ana akım iktisat teorisi'', İslam ekonomisi için ''Adil ekonomik düzen görüşü'' seçilmiş ve her iki aktörün bu modellere uyumları karz-ı hasen ekseninde tartışılmıştır. Elde edilen bulgulara göre iktisadi özne ''Ana akım iktisat teorisi''nde etkin olurken Müslüman özne ''Adil ekonomik düzen''de etkin olmuştur."
