abstract: "Bu çalışma;“Fethu'l-Bârî fî Şerhi Sahîhi'l-Buhârî”ismindeki hacimli eseri inceleyerek İbn Hacer el-Askalânî'nin nâsih ve mensûh metodunu usûlcülerin bakış açısı ile kıyaslayıp ortaya çıkarmayı amaçlamaktadır. Çalışma üç bölümden oluşmaktadır. Öncelikle giriş bölümünde İbn Hacer'in hayatı kısa bir şekilde ele alınmış ve nesih ilminin faziletinin yanı sıra nesih çerçevesinde tartışılan bazı temel meseleler farklı bakış açıları ile incelenmiştir. Usûlcülerin ortaya koyduğu bakış açısı ile İbn Hacer'in bakışı karşılaştırılarak birinci bölümde neshin teorik çerçevesi çizilmiştir. Bu minvalde neshin anlam açısından konumlandırılması ve câizliği hususu delilleri ile detaylı bir şekilde ele alınmıştır. İkinci bölüm neshin şartları ile neshin kısımlarının incelenmesine ayrılmış, bu çerçevede ilk etapta usûlcülerin kendi kaynaklarından tespitler yapılmış, ardından ise bu tespitlere yönelik İbn Hacer'in yaklaşımı Fethu'l-Bârî'den uygulamalı örnekler esas alınarak tahlil edilmiştir. Son bölümde ise Fethu'l-Bârî'nin çeşitli bölümlerinden tespit edilmiş neshin farklı meselelerine temas eden birtakım örnekler serdedilerek İbn Hacer'in nesih çerçevesinde tartışılan bazı meselelere yönelik bakış açısı tespit edilmiştir."
