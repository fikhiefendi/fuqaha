abstract: "Kanûn-ı Esâsî ta'dillerini konu edinen ve maddelerde yapılan değişikliklerin değerlendirilmesi amaçlanan bu çalışma bir giriş, iki bölüm ve bir sonuç bölümünden oluşmaktadır. Giriş bölümünde, çalışmanın önemi ve amacı ifade edilmiş, kullanılan yöntemden ve ilgili çalışmalardan bahsedilmiştir. Birinci bölümde, Kanûn-ı Esâsî'nin hem İslam hukuku hem de anayasa hukuku açısından niteliği üzerinde durulmuştur. Ayrıca Kanûn-ı Esâsî ta'dillerine dair tarihî veriler ve Kanûn-ı Esâsî'nin ta'dil usulü aktarılmıştır. İkinci bölümde, bu ta'dillerde değiştirilen, eklenen ve kaldırılan maddeler tek tek ele alınarak, maddenin geçirdiği değişiklik aynen verilmiş ve bu değişikliğin değerlendirilmesi yapılmıştır. Değiştirilen maddelerin özgün hali, değişik hali, kaç değişiklik geçirdiği ve hangi ta'dillerde değiştirildiği ortaya konmuştur. Ardından, Kanûn-ı Esâsî tam metninin özgün hali, üzerine tüm değişiklikler işlenerek eklenmiştir. Sonuç bölümünde ise, Kanûn-ı Esâsî ta'dillerine ve İslam devlet anlayışına dair ulaşılan neticeler sunulmuştur."
