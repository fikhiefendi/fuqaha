abstract: "İbnü'l-Esîr, Hadis ilminde seçkin ilmî bir konuma sahip âlimlerden sayılmaktadır. Bu ilimde çok fazla ilmî kıymete sahip birçok eser telif etmiştir. Yazmış olduğu bu çalışmalardan biri de Câmi'u'l-usûl fî ehâdîsi'r-Rasûl isimli kitabıdır. Bu kitap çok büyük faydaları içermesi hasebiyle hem hadis hem de diğer ilimlerdeki imamlar arasında meşhur olmuştur. İbnü'l-Esîr, bu kitaba Hadis ilimleri ve mustalahı hakkında çok faydalı bir mukaddime yazmıştır. Mukaddimede, bir ilim talebesinin hadis ilminde ve hadisleri anlamada ihtiyacı olan her şeyi, âlimlerin hadisleri tahric ederken bu usule nasıl dayandıklarını, zayıf ve sahih olarak hadislere nasıl hüküm verdiklerini zikretmiştir. Bu mukaddime daha önce söylenmemiş bir bilgiyi ya da hiç zikredilmemiş görüşleri kapsıyor olmasa da âlimlerin, Hadis ilmi ve mustalahı ile alakalı hem hadis hem usul kitaplarında bulunan dağınık bilgileri toplamaktadır. Önceki âlimlerden istifade ederken ya nakil esnasında ibareyi açıklamış ya da sadece zikredilmesi gerekenleri nakletmekle iktifa etmiştir. Dolayısıyla bu mukaddimeyi bu ilme, ilim talebesinin ilk ilmî safhalarında hadisle ilgili ilmî bir düşünceyi zihninde şekillendirmesi ve âlimlerin hadise verdikleri hükümlerdeki görüşlerini anlamasına yardımcı olması için yeterli bir mukaddime olarak ortaya koymuştur."
