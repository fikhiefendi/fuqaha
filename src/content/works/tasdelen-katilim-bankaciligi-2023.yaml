abstract: "Katılım bankacılığı, faizsiz bankacılık işlemleri ve dini hassasiyete sahip olan kişilerin tercih edebileceği birçok uygulamayı gerçekleştirmektedir. Faizsiz banka işlemlerinin yanı sıra, geleneksel bankaların yaptığı birçok işlemi, yine faiz hassasiyeti kapsamında yapabilmektedir. Katılım bankacılığı müşterilerinin bu bankaları tercih etmesinde asıl faktörün dini hassasiyet olduğu belirtilebilmektedir. Bunun yanı sıra davranışsal finans açısından katılım bankası çalışanlarının yatırım kararlarında belirli faktörlerinin etkili olabileceği ifade edilebilir. Özellikle de sosyo-demografik faktörlerin önemli bir etken olabileceği, araştırma kapsamında ve literatürde yapılmış birçok çalışma kapsamında da değerlendirilmektedir. 'Davranışsal finans' yaklaşımı, klasik finans yaklaşımında öne çıkan risk ve kazanç unsurlarının yanı sıra, psikolojik unsurların da önemli olduğu finans yaklaşımı olarak değerlendirilmektedir."
