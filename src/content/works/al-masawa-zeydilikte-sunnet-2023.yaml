abstract: "Bu çalışmada, hükümlerin delillerinden ikincisi olan sünnet deliliyle ilgili Zeydilerin görüşleri ve onların sünnet delilinin hücciyetiyle ilgili görüşleri İbnü'l- Vezîr'in el-Avâsım ve'l-kavâsım adlı eseri ekseninde ele alınmıştır. Mutemet kaynaklar incelenerek Zeydilerin görüşleri incelenmiştir. Ayrıca Zeydilerin sünnet deliline karşı tutumları özetle ortaya konmaya çalışılmıştır. Klasik kaynaklarda geçen Zeydî mezhebi ile günümüzdeki Zeydilerin durumu karşılaştırılmıştır. Örnek olarak verilen meselelerde gerek teorik gerekse uygulama yönünden Zeydî mezhebi ile dört mezhebin görüşleri karşılaştırılmıştır. Bu çalışma bir giriş ve üç bölümden oluşmaktadır. Giriş bölümünde kuramsal çerçeve üzerinde durulmuştur. Ayrıca İmâm Zeyd'in hayatı, Zeydî mezhebi, Zeydilerin fikhi ekolleri, İbnü'l-Vezîr ve diğer Zeydî alimlerin hayatı ele alınmıştır. Birinci bölümde Zeydîlerin sünnet deliline karşı tutumları ve onu delil olarak kullanma yöntemleri incelenmiştir. İki ve üçüncü bölümde ise Zeydîlerin usulü'l-fıkıh meselelerinde sünnet delilini delil olarak kullanmalarına dair örneklere yer verilmiştir. Böylece Zeydî lere göre sünnet deliliyle ilgili teorik ve uygulama yönlerinin birbirleriyle ne kadar uyumlu olduğu ortaya konmaya çalışılmıştır."
