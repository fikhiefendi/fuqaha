abstract: "Hz. Peygamberin hüküm koymada içinde yaşadığı toplumun örf ve âdetini dikkate aldığı, bireysel ve toplumsal hayatı kolaylaştıran, bütünlüğü sağlayan, muameleleri düzene koyan örfleri ikrar ettiği yahut şartlarında iyileştirmeye giderek uygulamada bıraktığı bilinmektedir. Hz. Peygamberden sonra gelen devirlerde de O'nun bu yöntemi takip edilmiş, sahabe devrinden itibaren ictihad ehli, içinde bulundukları toplumun durum ve şartlarını gözeterek ictihad etmiştir. Bu durum bazı hallerde kendilerinden öncekilere muhalefet etmelerini, bazen de kendilerinden sonra gelenlerin onlara muhalefet etmesini gerektirmiştir. Hükmün maksadını gerçekleştirmesi açısından örfe dayalı hükümlerdeki bu değişme İslâm hukukundaki dinamizmi sağlamada etkili olmuştur. Muhayyerlikler, kökeni çok eski dönemlere dayanan, kanundan doğan yahut tarafların ileri sürmesiyle ortaya çıkan haklardır. İslamiyetle beraber muhayyerliklerin kabul edilmesinde Hz. Peygamber'in, devam eden süreçte ictihad ehlinin tutumu, bu konuda toplumun örfünün gözetildiğini göstermektedir. Muhayyerlik ve örf kavramları üzerine çokça çalışma yapılmış, bu çalışmalarda kısaca örfe atıf yapılmış olsa da her iki kavramın ortak noktasının herhangi müstakil bir çalışmada yer almadığı tespit edilmiştir. Bu sebeple örfün muhayyerlikler üzerindeki etkisini derinlemesine inceleme ihtiyacı duyulmuştur. Araştırmada öncelikle örf ve muhayyerlik kavramları İslam Borçlar hukuku açısından tanıtılmış, daha sonra muhayyerliklerin şartlarının oluşumu, kullanım ve sona ermelerinde örfün etkisi tespit edilmeye çalışılmıştır."
