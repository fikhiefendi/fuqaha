abstract: "Dünya ekonomi literatürüne bundan 50 yıl önce düşünce olarak giren faizsizbankacılık sistemi 1970'li yıllarda düşünce aşamasından çıkıp uygulamaya başlanmıştır.Ülkemizde 1983 yılında Kanun hükmünde Kararname ile kurulmasına izin verilen ilkadıyla Özel Finans Kurumları yeni adıyla Katılım Bankaları Dünyada özellikle son onyıldır çok büyük bir gelişme kaydetmişlerdir.Bugün Dünya'da sadece slam ülkelerinde değil Özellikle ngiltere ve ABD gibifinans sektörünün çok ileri seviyelerde olduğu ülkelerde Faizsiz Bankacılık sistemi çokilerlemiştir. Dünyanın sayılı Bankaları bünyelerinde Faizsiz Bankacılık Departmanlarıaçarak Ortadoğu'daki atıl durumdaki petro-dolarları bünyelerine katmaktadırlar.Ülkemizde Katılım Bankaları özellikle 2001 yılından sonra büyük bir atılımiçerisine girmiş ve diğer ticari bankalar ile rekabet edebilir hale gelmişlerdir. Bunda1999 ve 2001 yıllarında yapılan değişiklik ile Katılım Bankalarının Bankalar Kanununatabi olması ve Katılım Bankalarının ticari bankalar ile eşit haklara kavuşmasının büyüketkisi bulunmaktadır.Bu çalışmamızda Katılım Bankalarının Dünyadaki ve Türkiye'deki gelişimsürecine değinilmiş, bu Bankaların fon toplama sistemleri ve bu fonları kullandırmasistemleri hakkında bilgiler verilmiş, Katılım Bankalarının son özellikle atak yaptığıyıllar olan son 5 yıllık performansları değerlendirilmiş ve analiz edilmiştir."
