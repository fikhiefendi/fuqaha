abstract: "Caferi Fıkhında Boşama Yetkisi? konulu tez çalışması ile bu mezhebin evliliği sona erdirme açısından yetki dağılımını teferruatıyla ele aldık.İslam mezhepleri içerisinde boşama yetkisi bakımdan yelpazesi en geniş olan mezhebin Caferîlik olduğu kanaatindeyiz. Buna göre kadın, dolaylı olarak ?Muhale'a? ve mahkeme yolu ile boşana bildiği gibi bazı şartların zuhuru halinde kocanın yahut mahkemenin iznine gerek kalmadan nikahı feshedebilir. Ayrıca kocanın talak hakkını vekaleten kullanma yetkisine de sahiptir.Erkeğin hür iradesi ile evliliği sona erdiren ?talak? hakkının yanında bazı hallerde akdi feshetme yetkisi bulunmaktadır.Bunun yanında karı-koca ayrılma hususunda ortak karar alırlarsa kadının tazminat ödemesi karşılığında koca, talak hakkını kullanarak onu boşayabilecektir ki, bu, Caferi fıkhına has bir uygulama olup ?Mübara'e? adı altında ?Muhale'a? ve ?Talak?tan farkları olan boşama şeklidir.Bazı hallerde mahkeme, hem müdahil olarak, hem de kadının başvurusu halinde ?tefrik? yetkisi ile evli çifti ayırır. Ayrıca hakim, kocanın kaybolması yahut nafaka temin etmemesi gibi durumlarda kocanın iznine gerek kalmaksızın kadını boşayabilir ve bu boşama neticesinde kocanın bir talak hakkı eksilir."
