abstract: "Türklerin İslâm anlayışının şekillenmesinde çok büyük etkisi olan Hanefî-Mâturîdîliğin önemli alimlerinden biri de Ebû İshâk Saffâr el-Buhârî'dir. İlmî faaliyetlerini, Büyük Selçuklular döneminde Horasan ve Mâverâünnehir'de gerçekleştiren ve Esmâü'l-Hüsnâ ile mezheplerin görüşlerini anlatma gibi farklı yöntemler uygulayan Saffâr, eserlerinde çok sayıda mezhep ve kişiye atıfta bulunarak kendi zamanına kadarki ilmî birikimi sonraki nesillere nakletmiştir. Kendisinden sonraki bilginlere de etki ettiği bilinen Saffâr el-Buhârî'nin İslam mezheplerini nasıl değerlendirdiğinin bilinmesi mezhepler tarihi açısından önem arzetmektedir. Bu çalışma ile önemli bir Hanefî-Mâturîdî alimin İslâm mezheplerine ilişkin değerlendirmelerinin incelenerek bilim dünyasına katkısı amaçlanmaktadır. Bu çalışmada öncelikle müellifin hayatı ve ilmî kişiliği“şahıslar üzerinde derinleşme”prensibi ile, İslam mezheplerine bakışı ise çeşitli eserlerinden istifade ile“fikirler üzerinde derinleşme”ilkesi gözetilerek incelenmiştir. Araştırmada elde edilen veriler imkân nispetinde diğer Mâturîdî kaynaklar ve klasik makâlât eserleri ile karşılaştırılarak analiz edilmiştir. Böylece özelde musannifin genelde ise Mâturîdîliğin İslâm mezheplerine bakışı ortaya konulmaya çalışılmıştır. Bu araştırmada, müellifin Hicri V. ve VI. asırda yaşamış ve sahasında etkili olmuş bir Hanefî-Mâturîdî âlimi olduğu, Ebû Hanife'yi imam olarak gördüğü ve görüşlerini tamamen benimsediği, hayatı boyunca da Ehl-i Sünnet'i diğer fırkalara karşı savunduğu belirlenmiştir. Ayrıca konuyu kendi çerçevesinde ele alarak, bid'at fırkalar içerisinde gösterdiği Mu'tezile ve Şîa'ya ağır tenkitler yönelttiği tespit edilmiştir."
