abstract: "Bu iktisadi çalışmanın amacı, Siret'un Nebevi'nin ekonomik bağımsızlığını (otonom) ele almaktır. Peygamber Muhammed'in (s.a.v) Peygamberlik Devleti'nde (Medine Devleti) ekonomik bağımsızlığı elde etmek için en önemli politikaları ele almak hedeflenmiştir. Özellikle, bu çalışmadaki ekonomik bağımsızlık üç aşamadan meydana meydana gelmektedir. Çalışma, devlet bazında, siyasi ve askeri statünün en belirgin özelliklerini ve sonuçları, piyasa bazında, piyasa oluşturmanın ve içinde yer alan unsurları ve bunların etkilerini kontrol etmenin ne kadar önemli olduğu ve bireysel bazda, birey için en önemli ekonomik kilometre taşlarını ve özel sektör faaliyeti için yönlendirmeleri netleştirmeyi ve mülkiyet ve dağıtım kavramlarını ele almaktadır. Ekonomik bağımsızlığın uygulanması için en önemli tümevarımsal gerekli kuralları sunulmuştur. Çalışma, Al-Sira kaynaklarındaki ekonomik göstergeleri ve özellikleri izleyerek tanımlayıcı ve tümevarımcı metodolojiyi takip ederek çalışmayı ekonomik bağımsızlığın temelleri ile sonuçlandırmıştır. Peygamber (s.a.v.)'in devlet, piyasa ve bireysel düzeylerde ekonomik bağımsızlığı elde etmek için aldığı önlemlerin eko öneriler ile sonuçlanmasıyla sona ermiştir. Araştırmacıların Siret'in ekonomik yönü hakkında daha derinlemesine araştırmalar yapmaları ve devletlerin ve para sahiplerinin kehanet ekonomik yönergelerinden ve mevcut yaşamdaki uygulamalarından yararlanmaları sağlandı."
