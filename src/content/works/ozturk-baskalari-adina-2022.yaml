fullText: "https://tez.yok.gov.tr/UlusalTezMerkezi/TezGoster?key=qVqOZFj2DwNmvdf1oGFYiCxQmtlZbbizwSnzcQOGRJMkIR35X3ByrEa_zToGhHYV"
abstract: "Başkaları adına haklı savaş kuramının tarihsel dönüşümü günümüze kadar sirayet eden bir süreçtir. Haklı savaş teorileri arasında kendisine yer bulan bu kavram, haklı savaş hallerinin içerisindeki bir istisna olarak belirmiştir. Tarih boyu bir fedakârlık olarak sunulan bu kavram, devletlerin kendi haklarından ziyade, başkalarının haklarını gözetmeleri gerektiğine dair savunmalarıyla birlikte yükselmiştir. Devletlerin kendi merkezlerinden sıyrılarak yaptıkları bu tanımlamalar, tarihi süreçte sürekli değişim yaşamıştır. Haklı savaş kavramı genel olarak bir klasik dönem tanımı olmakla birlikte, savaşın her koşulda bir vahşet ve hukuksuzluk içermediği öğretisi üzerinde yükselmektedir. Başkaları adına haklı savaş teorileri ise toplumların başkası olarak tanımladıkları öznelerin haklarını koruma zaruretlerini ifade etmeleriyle pekişmiştir. Tarih boyunca bu şuurun merkezindeki ana düşünce değişmekle beraber, bu zihniyet hala devam etmektedir. Erken Hristiyanlık dönemlerinden itibaren dile getirilen haklı savaş kuramları hemen her zaman başkaları üzerinden de bir tanımlamaya girişmiştir. İnsanlık, tarih boyunca kendisini diğer insanlardan da mesul hissetmiştir. Bununla birlikte ilk dönemlerdeki başkalarını tanımlama süreçleri inanç merkezli iken bu süreç zamanla daha seküler değerlere ve evrensel konsensusa dayanmaya başlamıştır. Haklı savaş kuramı tarihi gelişim içerisinde birçok değişim yaşamıştır. Antik uygarlıklarda bile önemle üzerinde durulan bir kavramdır. Başkaları adına yürütülen haklı savaş kuramları ise bu teorilerin üzerinde yükselmiştir. Başkalarına dair geliştirilen savunma açıklamaları pek çok defa devletlerin kendileri üzerinden geliştirdikleri savunmalardan daha kolay izah edilebilir görülmüş ve taraflarca daha ikna edilebilir bulunmuştur. Bu bakımdan modern düşüncelerle birlikte savaşın doğasına karşı yürütülen kaçınma hali bile başkaları adına savaş kuramlarında göz ardı edilmiştir. Kavramsal olarak çok daha medeni ve açıklanabilir duran bu ifade, pek çok defa devletlerin suistimallerine yahut tartışmalarına konu olmuştur. Başkalarının dile getirildiği bu tartışmalar açısından sınırların belirlenmesi ve müdahale hakkının hangi zeminden kaynaklandığı hep muğlak kalmıştır. Bu muğlaklık uluslararası hukuktaki büyük aktörler tarafından kullanılmaya müsait olmakla beraber, küçük aktörlerin hak arayışlarında ciddi bir engel oluşturabilmektedir. Özellikle başkaları kavramında tanımlamaların dahi tam oturamadığı bu olaylarda, ağırlıklı olarak tarihi gelişimdeki temellere inme ihtiyacı hissetmiş bulunmaktayız. Çalışma kapsamında üç ana başlık etrafında başkalarına dair haklı savaş teorilerinin gelişimleri incelenmiştir. Bunlar; İslam medeniyeti açısından, Klasik dönem Batı uygarlığı açısından ve modern teoriler açısından başkaları adına haklı savaş kuramının dönüşümüdür. Bunlardan ilki olan İslam medeniyeti açısından tartışmanın ortasına Ebu Hanife ve Şeybani alınmıştır. Bu düşünürler etrafında yoğun bir değerlendirme yapılmasının ana sebebi; öğretinin kuruluşunda bu düşünürlerin oynadıkları hayati rolleridir. Onların düşünceleriyle diğer İslam aydınlarının düşüncelerinin kıyaslanması sonucu bu devrin uluslararası uygulamalarını değerlendirdik. Düşünürlerin görüşlerinin Peygamber ve sonrasındaki siyer, yani İslam uluslararası hukukuna dair uygulamalardaki karşılıklarını ele alarak bu dönemi anlamaya çalıştık. Kolay anlaşılması açısından bir ana başlık anlamı taşıyan cihat kelimesini öncelikle incelemeyi doğru bulduk. Bununla birlikte zaman içerisindeki özelleşmiş anlamlarını da yansıtarak cihatı genel bir haklı savaş kuramı olarak İslam'daki ana tartışma sahası olarak belirledik. Cihat başlığı altında haklı savaşın en temel hali olan saldırı savaşlarını da inceleme fırsatı bulduk. Daha sonrasında kendisi de bir cihat türü olan ribâtı inceledik. Ribat temel olarak savunma savaşları için tercih edilen bir kavram olmakla beraber, başkaları adına savunma savaşları için de tercih edilen bir kavramdır. Ribat özelinde Endülüs'ten başlayan sonraki İslam dönemlerine uzanan örnekler üzerinden konuyu ele almaya çalıştık. Sonrasında iç siyasi çekişmelerde cihatın bir türü olarak beliren fakat cihatın en yumuşak hükümlerini ihtiva eden bağy kavramını inceledik. Bu kavram özelinde İslam'daki toplumdan dışlanma sürecini incelemeye çalıştık ve hiçbir koşulda aforoz gibi müessesenin işletilemeyeceğini fark ettik. İç savaşlar bakımından İslam'ın hükümlerindeki yorumlanabilir ve hatta tereddüt oluşabilir derecedeki yumuşak geçişi incelemeye çalıştık. Nihayetinde İslam'daki sulh halini inceleme fırsatı bulduk ve özellikle Osmanlı İmparatorluğu'nun Karlofça Antlaşması öncesinde yaşadığı tecrübelerle birlikte yakın zamanlarda yaşanmış bir olay üzerinden sulh ve İslam hukukunu ele almaya çalıştık. Bu örneklendirmeyi tercih etmemizin nedeni ise barışın en çıkarsız gözüktüğü koşullarda dahi ne denli büyük felaketlerden kurtaran bir kavram olduğunu fark etmemizden kaynaklanmıştır. İkinci başlık olarak Klasik Batı uygarlığı ele alınmıştır. Bu açıdan öncelikle Erken Hristiyanlık dönemi incelenmiştir. Bu alt başlığı ayrı bir başlık olarak açmamamızın nedeni ise hem çok kısa bir dönem dahilinde uygulanması hem de İslam ile tanışmasından sonra daha fazla gelişme imkânı bularak pratiğe dökülmesinden kaynaklanmaktadır. Aziz Augustinus ve Aziz Pavlus'un düşünceleri üzerinde yükselen Erken Dönem Hristiyanlık düşüncelerinin İslam sonrası yaşadığı değişimleri ilk olarak ele aldık. Bu noktada diğer düşünürle kıyasa tabi tutarak ilerlediğimiz çalışma açısından Haçlı Seferleri özelinde görülen etkileşimleri inceleme fırsatı yakaladık. II. Friedrich özelinde Hristiyan terminolojiye çok yabancı olan bazı kavramların İslam'dan esinlenilerek yahut karşı taraf sıfatındaki Müslümanlar ile uzlaşı yolu bulmak maksadıyla bir Hristiyan kral tarafından kabul edilişini irdeledik. Son olarak Haçlı Seferleri ile başlayan dini etkileşimlerinin dönüşümdeki rolleri üzerinde durduk. İkinci başlık etrafında Erken Hristiyanlık sonrası için ise Vitoria, Suarez ve Grotius'un merkezde olduğu bir inceleme yaptık. Doktrinde uluslararası hukukun kurucuları olduklarına dair görüşler belirtilen bu düşünürler, aslında bizi bu çalışmaya iten okumalara da sebep olmuşlardır. Grotius'un başkalarına dair haklı savaş teorisi üzerinden kurguladığı söylemlerine bulamadığımız cevaplar bizleri böylesi bir araştırmaya itmiştir. Bu düşünürler etrafında öncelikle Klasik bir Batı uygarlığının inşası ele alınmaya çalışılmıştır. Kilise'den gittikçe kopan düşüncelerin merkezinde beliren bu isimler, uluslararası hukukun kaynağını ve yargının yerini değiştirmeye başlayan fikirlere öncülük etmişlerdir. Haklı savaş kuramlarını tekrar ele alan ve devrin şartlarında yeniden yorumlayan düşünürler, kolonizasyon çağındaki başındaki Avrupa devletleri için yeni kodlar oluşturmaya çalışmışlardır. Bu açıdan İspanyol düşünürler daha çok Avrupalıların yeni keşif bölgelerindeki yerli unsurlarla münasebetlerini incelerken; Grotius Avrupalı devletlerin kendi aralarındaki bölüşümleri üzerinden araştırmalarını yapmıştır. Hem Hristiyanlar arası uluslararası hukukun hem de kavimler hukukunun dönüşümünü tetikleyen düşünürler, Batı uygarlığındaki modern teorilere kapı aralamışlardır. Bu çerçevede kavimler hukukunun değişimiyle birlikte; hasımlık nitelendirmelerinin, cezalandırma ilkelerinin, savunma hakkının ve uyruklar adına direniş savaşların incelenmesine geçilmiştir. Başkaları adına sorumlulukların ve hakların sınırlarının çizilmeye başladığı dönem dahilinde, kavramların yeniden ele alınarak devrin koşullarıyla harmanlanmasını ve günün şartlarına uygun hale getirilmesini sağlamışladır. Bütün bu düşünceleri ise Erasmus'un düşünceleriyle birlikte ele alarak onun süzgecinden bir barış kurgusu ele alınmaya çalışılmıştır. Batı uygarlığı açısından da kadim Hristiyan öğretilerin dönüşümleriyle birlikte herkes için barışın koşulları artık daha seküler ve uzlaşılabilir şekilde ele alınmaya başlanmış; teorilerin merkezindeki tanımlar daha dünyevi seçilir olmuşlardır. Üçüncü başlık olarak modern teorilerdeki başkaları kavramını ele almayı doğru bulduk. Bu çerçevede teoriler artık dünyevileşmekle birlikte yeni subjektif kriterler belirmiştir. İnsanlık, dini dogmaların kesişen alanlarından doğan savaşlardan çok daha büyüklerini bu sefer subjektif değerlerin suistimallerinden tecrübe etmeye başlamıştır. Bu kapsam ise özellikle Hardt ve Negri ile beraber Neocleous'un düşünceleri üzerinden moderniteye dair eleştiriler dile getirilmiştir. Kant ve Kelsen'den günümüze kadar gelen görüşlerin modernite başlığında bu isimlerle birlikte incelenmesinin ana nedeni ise konumuzla uygun olarak tarihi bir şekilde bugünü ele almaları olmuştur. Bu çerçevede Milletler Cemiyeti, Birleşmiş Milletler, hegemonya ve modern imparatorluklar alt başlıklarıyla günümüz incelenmiştir. Tarihteki kuramların bugünün kendi kaderini tayin hakkı ve insancıl hukuktaki etkileri irdelenmiştir. Devir genelindeki hemen her uluslararası sözleşmenin bir büyük savaş tecrübesiyle pekişmesi ise maalesef ki acı bir gerçek olarak önümüzde durmaktadır. Büyük Avrupa savaşlarından sonra Dunant'ın çabalarıyla uğraşılan ICRC süreci, Birinci Dünya Savaşı'ndan sonra kurulan Milletler Cemiyeti ve İkinci Dünya Savaşı'ndan sonra kurulan Birleşmiş Milletler yapıları; insanlığın ders çıkarmakta ne kadar geç kaldığını gözler önüne sermektedir. Bu tartışmaların yapıldığı teorilerin aktarılmasından sonra özellikle her iki uluslararası sözleşme özelinde insanlığın uzlaştığı metinleri tartışmaya açarak bu hususta modern haklı savaş teorilerini incelemeye çalıştık. Akabinde elde ettiğimiz bilgileri başkaları adına haklı savaş teorilerine yoğunlaştırarak sizlere sunduk. Bu neticede her iki örgütün insanlığa kattığı değer olarak savaşlardaki veto mekanizmasını ve devletlerin pasifize edilmesini ele aldık. Bu kapsamda hem Milletler Cemiyeti'ne kadar gelen pasifize etme çabalarını hem de sonrasında Birleşmiş Milletler'e uzanan kısmını inceledik. Modern bir uğraş olarak savaşa karşı pasifize etme çabalarının haklı savaş üzerindeki etkilerini araştırdık. Sonrasında bu modern teorilerin başkaları adına gerçekleştirilen savaşlar açısından uygulamadaki ciddiyeti belirlemeye çalıştık. Sonuç olarak çözüme götüreceğimizi düşündüğümüz alanlarda kendi tavsiyelerimizi ve tespitlerimizi sunmayı doğru bulduk. Bu noktada düşüncelerimizin dünya konjonktüründe bir karşılık oluşturmasının güçlüğünün yanı sıra, hukukun, politika ve uluslararası ilişkilerle olan münasebetlerini ciddiye alarak naçizane fikirlerimizi iletmeye çalıştık. Bu kapsamda Birleşmiş Milletler yapılanmasında ayrıcalıklı öznelerin sonlandırılması gerekmektedir. Çoğulcu çabalarla pekiştirilen bir sistemde nitelikli çoğunluklarla karar alınabilecek mekanizmalar inşa edilmelidir. Her ne kadar insanlık her daim sessiz kalınan savaşlarda daha hesap sorar bir tona bürünse de tarihten gelen veriler dikkate alınarak mümkün mertebe devletlerin pasifize edilmesine odaklanılmalı, sürekli bir cezalandırıcı felsefeyle olaylara yaklaşılmamalıdır. Nitelikli çoğunluk tarafından alınan kararların hızlı ve etkili olarak uygulanması için maddi ve fiziki şartların sağlanması gerekmektedir. Kurulan mekanizmalar en zor koşullarda dahi fail olarak beliren devletlerin de hakkını gözetmek üzere mekanizmalara izin vermeli onların da savunmalarını dünya kamuoyuna sunmalarına müsaade etmelidir. Bu açıdan cezalandırmada ölçülülüğün kaçırıldığı her durumun yeni bir mağdur doğuracağı unutulmamalıdır. Yine geçmiş tecrübelerden faydalanarak gelecekteki bir üçüncü dünya savaşı öncesinde bu hazırlıkların yoğunlaştırılması gerekmektedir. Savaşın engellenmesi, bu mümkün olmuyorsa savaşın uzun sürmesinin ve olabildiğince büyük tahribatlara neden olmasının engellenmesi, bunlar da mümkün olmuyorsa savaş sonrasındaki atmosferde dördüncü bir dünya savaşının yollarına taş döşeyen bir ortak metnin imzalanmasının engellenmesi önem arz etmektedir. Devletler artık her türlü olayda başkalarını gerekçe gösterebilme hürriyetine erişmiş ve birbirlerine verdikleri destekler çok hızlı bir şekilde ittifaklar sürecine ve silsileler halinde savaşlara neden olmaya başlamıştır. Bu bakımdan modern teorilerin dahil olduğu haklı savaş kuramlarında başkaları adına haklı savaş versiyonları istisna tutulmakla büyük bir suistimal alanı oluşmuş; subjektif her türlü tartışma yeni bir dünya savaşı korkusunun belirmesine ortam hazırlamıştır. Bu bakımdan devletlerin başkaları üzerindeki hak ve sorumlulukları da bir üst yapıya taşınmakla ifade edilebilecek, belki de uluslararası bir yargı mekanizması kurularak devletlerden daha kuvvetli olması sağlanarak bu makamdan adalet tesisi beklenebilecektir. Her türlü ihtimalde dahi aklı selim aktörlerin yapması gereken ise barış halini sürdürmek, uzatmak yahut teklif etmektir. Bu sadece kendi hakları yahut başkalarının hakları için değil, savunulan değerlerin vakti geldiğinde daha yüksek sesle savunulabilmesi için de önem arz etmektedir. Bu kapsamda çalışmamız eşliğinde sizlere haklı savaş kavramını ve başkaları adına üretilen ikincil gerekçeleri anlatmaya çalıştık. Bununla birlikte bu kuramlarında tarih süzgecinde İslam, Hristiyanlık ve Batı uygarlığıyla yaşadığı dönüşümlerin modern yansımalarını sizlere aktarmaya çalıştık."
