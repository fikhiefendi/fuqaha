abstract: "İnfertil bireyler için geliştirilen yardımcı üreme teknolojileri İslam hukuku çerçevesinde temkinle yaklaşılan bir konudur. Nitekim yardımcı üreme teknolojileri yalnızca tıbbi bir müdahale alanı olmanın ötesinde, beraberinde getirdiği sonuçlar itibarıyla etik ve fıkhî değerlendirmeleri de gerektiren çok yönlü bir araştırma konusudur. Bu çalışmada yardımcı üreme teknolojileri arasına girmesi muhtemel IVG'nin (in vitro gametogenez) fıkhî hükmü ele alınacaktır. Bunun için öncelikle IVG teknolojisinin tanımı, süreç boyunca kullanılacak insan kökenli biyolojik maddeler açıklanmakta ve olası kullanım alanlarına değinilmektedir. İkinci olarak süreç boyunca kullanılacak biyolojik maddelerin etik ve fıkhî anlamda ortaya çıkaracağı olası yarar ve zararlar incelenmektedir. Burada önce insan bedeninin deneye tabi tutulması konusu üzerinde durulmakta ardından bahsi geçen biyolojik maddelerin yarar ve zararlarına odaklanılmaktadır. Ayrıca yine bu ikinci kısımda, IVG'nin infertiliteye yönelik bir tedavi olarak mı, yoksa Tanrı rolü oynamanın bir formu olarak mı değerlendirilmesi gerektiği sorusu; fıtrata müdahale, üremenin iyileştirilmesi ve mucize kavramları ekseninde tartışılacaktır. Son olarak IVG'nin olası kullanım alanları üzerinden fıkhî bir analiz gerçekleştirilmeye çalışılacaktır. Bu analiz boyunca teknolojiyi kullanırken fıkhî anlamda dikkat edilmesi gereken kriterlere değinilmekte ve evlilik kurumu, ebeveynlik rollerinin dönüşümü, soy bağı ilişkilerinin korunması ve miras gibi konulara ilişkin fıkhın karşı karşıya kaldığı yeni durumlar tartışılmaktadır. Bu noktada aynı cins çiftlerin, tek ya da çoklu ebeveynlerin ve ölüm sonrası üremenin mümkün hale gelmesi gibi gelişmeler, İslam'ın temel aldığı nesep, nikah ve aile değerleri açısından irdelenmektedir. Çalışmanın neticesinde IVG teknolojisi hakkında genel bir fıkhî hüküm vermek yerine kullanıldığı bağlam ve şartlara binaen bir değerlendirme yapılmıştır."
