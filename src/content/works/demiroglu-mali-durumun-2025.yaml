abstract: "İslam hukukunda bireyin malî durumu, pek çok yükümlülüğün belirleyici unsurudur.“Zengin”ve“fakir”kavramlarının tanımları ve bu tanımlara bağlı olarak ortaya çıkan fıkhî hükümlerin ne ölçüde değişkenlik gösterdiği önemli bir araştırma alanı olarak karşımıza çıkmaktadır. Çalışma sürecinde, zenginlik ve fakirlik ile doğrudan bağlantılı olan malî durumlara dair meseleler dört fıkhî mezhebe ait klasik kaynakların yanı sıra güncel literatür, tez ve makaleler ışığında tespit edilmiş; bu meseleler sistematik bir yaklaşımla sınıflandırılarak incelenmiştir. Araştırmada ağırlıklı olarak dört fıkhî mezhebin görüşleri esas alınmış, ancak bazı durumlarda bu mezhepler dışındaki müçtehitlerin yaklaşımlarına da yer verilmiştir. Araştırma kapsamında İslam hukuk mezheplerinin fıkhın tüm konularında geçerli kabul edilen bir zenginlik ve fakirlik tanımlarının bulunmadığı, farklı meselelerde farklı tanımlamaların yapıldığı hatta bir konu içerisinde dahi farklı görüşlerin ortaya konduğu görülmüştür. Zenginlik tanımında ortak bir ifadeye en çok nisap konusunda yaklaşılmıştır. Çalışmada fakirlik ve zenginlik durumlarına dair yapılan tasnif denemesi, İslam hukukunda malî durumların daha sistematik bir yaklaşımla ele alınabilmesine katkı sağlayabilir. Günümüzde bu tanımların iktisadî durum, enflasyon ve devlet politikaları ile olan ilişkisi ayrıca değerlendirilmeye muhtaçtır."
