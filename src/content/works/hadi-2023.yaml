abstract: "Bu araştırma başta fıkıh, hadis vb. olmak üzere çeşitli ilimlerde eserleri olan Kâdî İyâz'ın İkmâlü'l-Mu'lim Bi-Fevâ'id (Fî Şerhi Sahihi)i Müslim adlı eserinin fıkhi açıdan ele alan bir araştırmadır. Bu eserlerin arasındaki Müslim'i şerhi Kâdî İyâz'ı hem fıkıh hem de kadılık makamı açısından seçkin bir konuma getirmiştir. Araştırmada, Maliki mezhebince önemli addedilen İkmâlü'l-Mu'lim eserinin dördüncü bölümündeki Kitabu'n-Nikah ve beşinci bölümde yer alan Kitabu't-Talak konuları ele alınmıştır. Kâdî İyâz, fıkhî hükümleri istinbat ederken izlediği yöntemi hadislere ve fıkıh usulü açısından ise icma ve kıyas gibi delillere dayandırmıştır. Araştırmada toplam 21 mesele hakkında tahliller yapılmış olup Kâdî İyâz'ın Maliki mezhebiyle hemfikir olduğu görüşler çerçevesinde hareket edilmiştir. Pekçok yerde Kâdî İyâz'ın kendi görüşleri mezhebinin hâkim görüşüyle paralellik göstermiştir. Diğer yandan Hanefî ve Şafiîlerle aynı görüşte olduğu veya bu görüşlere muhalif kaldığı konularda da, Kâdî İyâz'ın, kendi ve mezhebinin yöntemini dikkate alarak hareket ettiği tespit edilmiştir. Kâdî İyâz'ın İkmâlü'l-Mu'lim Bi-Fevâ'id (Fî Şerhi Sahihi)i Müslim adlı eserini ele aldığımız bu araştırma mukayeseli bir fıkıh çalışmasıdır. Tezde fıkıh mezheplerinin görüşleri mukayeseli bir yol izlenerek işlenmiştir. Aktarılan fıkhî görüşlerle Kâdî İyâz'ın görüşleri aynı doğrultuda ise bu görüş ilk görüş olarak ele alınmıştır. Ardından diğer mezheplerin görüşleri bu görüşlere ulaşırken fakihlerin kullandığı deliller, ilmi tartışmalar ve cevaplar yer almıştır. Her ne kadar cevaplar Kâdî İyâz tarafından karşıt fikir olarak bahsedilmese de araştırmada bu yönde bir tasarrufta bulunulmuştur. Ayrıca Sahiheynin dışındaki hadisler tahriç edilmiş olup, muhaddislerin bu konuda vardığı hükümler açıklanmıştır, Ardından delilin güçlü olmasına göre hâkim görüş zikredilmiştir, Bu araştırma giriş ve üç bölümden oluşmakta olup birinci bölümde Kâdî İyâz'ın biyografisi işlenmiştir. İkinci bölümde Kâdî İyâz'ın fıkıh anlayışı ele alınmıştır. Üçüncü bölümde ise Kitabu'n-Nikah ve Kitabu't-Talak konuları incelenmiştir,Dürüst görüşmelerden elde edilen yargı alanlarından bahseden tutarlı bir yazı yaklaşımı izledi.Tez, varılan sonuçlar, öneriler ve kaynakça ile sonlandırılmıştır."
