abstract: "Küreselleşen dünyada ülkeler arasındaki yakınlaşma, ortak duruş ve fikirler, siyaset, teknik ve sosyal bilimleri etkilemiş, böylece muhasebe bilimi her ülkede sınırları aşarak uluslararası bir kimlik kazanmıştır. Bu nedenle muhasebe sisteminin uluslararası standartlara uyması zorunlu hale gelmiştir. Uluslararası faaliyette bulunan işletmeler ekonomik kararlar alırken, dünya çapında farklılık gösteren muhasebe sistemlerine göre hazırlanan finansal tabloları incelerken zorluklarla karşılaşmaktadırlar. Çünkü muhasebe bilgi sistemi tarafından üretilen bilgilerin özellikle küresel ölçekte uluslararası yatırımcılar başta olmak üzere tüm kurumsal paydaşların karar alma süreçlerinde geçerli olması önemlidir. Aksi halde bilgilerin sadece ulusal düzeyde geçerli olması durumunda hem ulusal hem de uluslararası düzeyde ticaret hacmi, istenilen düzeylere ulaşamayacaktır. Uluslararası alanda faaliyet gösteren işletmeler, faaliyet gösterdikleri ülkelerde uygulanan muhasebe sistemi ile ilgilenmektedirler. Çünkü kullanılan muhasebe yöntemleri ve muhasebeyi düzenleyen yasalardan oluşan muhasebe sistemi bu işletmeleri doğrudan etkilemektedir. Bu çalışma ise Türkiye, Suudi Arabistan ve Birleşik Arap Emirlikleri muhasebe sistemlerinin tarihsel gelişimi, yasal çerçevesi, mevcut düzenlemeleri, vergi uygulamaları, muhasebe mesleği ve bu üç ülkede uluslararası muhasebe ve denetim standartları uygulama seviyelerinin karşılaştırılmalı olarak analiz etmek amacıyla yapılmıştır. Ayrıca bu çalışmada Türkiye, Suudi Arabistan ve Birleşik Arap Emirlikleri'nde uygulanan muhasebe sistemleri arasında benzerlikler ve farklılıklar hakkında bilgilere de yer verilmiştir. Kısacası bu çalışma, bu üç ülkede faaliyet gösteren işletmelerin finansal bilgi alışverişinde karşılaşacakları dil engelinin kaldırılmasına yardımcı olmayı amaçlamaktadır."
