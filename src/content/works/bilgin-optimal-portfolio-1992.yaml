abstract: "ÖZET Özel Finans Kurumları ve Yatırım Fonları finans sektörümüzde yeni ve az bilinen yatırım araçlarıdır. Bu tezin amacı kamuyu yatırımcılara ve yöneticileri faizsiz bankacılık hakkında aydınlatmak yatırımcılara ve risk yöneticilerine imada bulunmaktır. Bu amaçla özel finans kurumlarının fonlarının performansı yatırım onlarının performansıyla karşılaştırılarak değerlendirildi. iyi çeşitlendirilmiş portföyler oluşturmak ve verimli hududu saptamak için Markowitz'in Modern Portföy Teorisi uygulandı Çalışma bulgularının bu alanda iler iki araştırmalar için temel teşkil edeceğini umuyoruz. İİİ"
