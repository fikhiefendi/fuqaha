abstract: "Modern tüketici hakları koruma yasaları ve tedbirleri, diğer insan haklarında olduğu gibi, modern insanın ödemek zorunda kaldığı yüksek bir bedel sonucunda günümüzdeki biçimine kavuşmuştur. Bu bedelin ödenmesi, Osmanlı İmparatorluğu'nun—son Müslüman süper güç olarak—tarihsel tüketici koruma uygulamalarından ders alınarak önlenebilirdi. Modern insan tüketici haklarını tanımadan çok önce, Osmanlı tüketici bu haklardan yararlanmakta olup, söz konusu haklar yedinci yüzyılda İslam hukuku çerçevesinde güvence altına alınmıştı. Bu tezde, 17. ila 19. yüzyıllar arasındaki İstanbul kadı sicillerine ait tüketici koruma ile ilgili mahkeme kayıtları analiz edilerek Osmanlı dönemindeki tüketici sorunları ve etkili tüketici koruma uygulamaları tespit edilmektedir. Ardından, 21. yüzyıl tüketici koruma raporlarına odaklanarak modern tüketici sorunlarının temel nedenlerini ortaya koymaktadır. Son bölümde ise Osmanlı'daki başarılı tüketici koruma uygulamaları ile modern tüketici sorunlarının temel nedenleri eşleştirilerek karşılaştırmalı bir analiz yapılmaktadır. Sonuç olarak, bu tez, tüketicilerin yanı sıra tedarikçiler, devlet, toplum ve çevre dâhil olmak üzere tüm piyasa paydaşlarının refahını sağlamak amacıyla, Osmanlı tüketici koruma uygulamalarının ve dayandıkları ilke ve değerlerin yeniden benimsenmesini önermektedir. Ayrıca, bu metodolojinin diğer ekonomik alanlara da genişletilmesi gerektiğini savunarak, eski bilgeliklerin hâlâ olgunlaşma sürecinde olan yeni dünya sisteminin sorunlarını çözebileceğini ileri sürmektedir."
