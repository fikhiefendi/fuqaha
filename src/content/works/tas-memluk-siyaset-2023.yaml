abstract: "Bu çalışma Memlük dönemi siyaset düşüncesinde iktidar değişikliği olgusunu konu edinmektedir. Giriş, üç bölüm ve sonuçtan oluşan çalışmanın giriş bölümünde çalışmanın konusu, yöntemi ve çalışmaya ilişkin kaynaklar tanıtılmış, ayrıca çağdaş literatür değerlendirilmiştir. İktidar değişikliğinin teorik olarak incelendiği ilk iki bölümde devlet başkanında bulunması gereken vasıflar ve devlet başkanının görevini sona erdiren durumlar Memlük ulemasının görüşleri bağlamında ele alınmış, iktidar değişikliğine dair kavramsal bir çerçeve çizilmiştir. Bu iki bölümde ayrıca Memlük öncesi ulemanın görüşlerine de başvurularak iktidar değişikliği olgusunun kuramsal serencamı gösterilmiştir. Çalışmanın üçüncü bölümünde ise erken Memlük döneminin bir kesitinde (689-710/1290-1310) gerçekleşen iktidar değişiklikleri ele alınmış ve bu değişiklikler siyasi-hukuki açıdan değerlendirilmiştir. Böylece ilgili dönemde gerçekleşen iktidar değişikliklerindeki temel saikler araştırılmış, bir diğer ifadeyle teori ile pratik arasındaki ilişki belirlenmeye çalışılmıştır. Bununla birlikte çalışmada ulema, ümera ve halk gibi iktidar sahibi devlet başkanı dışındaki diğer aktörlerin siyasi etkinliği ve iktidarı denge-denetlemedeki rollerinin mevzubahis iktidar değişiklikleri üzerinden gösterilmesi hedeflenmiştir."
