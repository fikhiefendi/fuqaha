abstract: "Sözlükte değiştirmek anlamına gelen \"istibdâl\", vakıf hukukunda terim olarak vakfı, mülk mukabilinde değiştirmek veya vakıf yapılacak bir mülk mal satın alma gayesiyle vakfı satmak anlamında kullanılmaktadır. İstibdal, yangın, deprem ve sel gibi afetlerden ya da uzun süre kullanım vb. durumlardan ötürü, işlevini yitirmiş vakıfların yenisiyle değiştirilmesini yahut daha değerlisini temin etmek için vakfı değiştirmeyi sağlaması açısından vakıfların ebediyeti için oldukça önem arzeden bir uygulamadır. Arapça, Türkçe ve İngilizce literatürü tarama neticesinde Osmanlı vakıf hukukunda istibdali incele-yen bir çalışmanın kaleme alınmadığı anlaşılmaktadır. Kaynaklarda tarihsel süreçte oldukça suiistimal edildiği anlatılan istibdâl meselesi, tezimizde birincil kaynak olarak fetva mecmûalarından hareketle anlatılmaya çalışılacak ve istibdâl-i vakıf risâleleri içerisindeki bilgilerle fetvalar karşılaştırılacaktır. Bununla birlikte incelenen şer`iyye sicilleri, ahkâm defterleri ve vakıf tahrir belgelerinde zikredilen istibdâl uygulama örnekleri, teoriyle pratiğin uyumu yönünde bir fikir verecektir. Kavramsal çerçeve ve tarihsel sürecin incelendiği tezin birinci bölümünde, istibdal kavramı ve müradif ifadelerin kullanıldığı metinler tasnif edilip ilgili kelimelerin yer aldığı kaynakların siyak sibakı da dikkate alınarak istibdal manasının bulunduğu ve bulunmadığı metinler tespit edilmektedir. Osmanlı öncesi Hanefi vakıf hukukunda istibdalin nasıl ele alındığı ortaya konan tarihsel süreç bölümünden sonra yer verilen ikinci bölümde, Osmanlı dönemi fıkıh kaynaklarından hareketle istibdalin mahiyeti, meşruiyeti, şartları ve yapılış şekilleri gibi temel konular incelenmek suretiyle genel olarak Hanefi mezhebinin başlangıcından Osmanlının kuruluşuna kadar, özel olarak ise Osmanlının 19. yüzyılına kadar istibdal-i vakıf hakkında kaydedilen konular detaylı bir şekilde incelenmektedir. Son bölümde ise istibdalin hukuki sonuçları ve istibdalin iptal edilmesi gibi bir takım konular anlatılmaktadır."
