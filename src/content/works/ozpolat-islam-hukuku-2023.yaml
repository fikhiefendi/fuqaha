abstract: "Bu çalışmanın konusu, emtia türev sözleşmelerinin İslam hukuku açısından değerlendirilmesidir. Çalışmada dayanak varlığın emtia olduğu türev sözleşmelerden emtia forward, emtia futures ve opsiyon sözleşmelerinin İslam hukukundaki yeri incelenmiştir. Emtia swap sözleşmeleri ise çalışmanın dışında bırakılmıştır. Çalışmada her konunun öncelikle mahiyet açısından tanımlamasına yer verilmiştir. Daha sonra konuyla ilgili çağdaş İslam hukukçularının yaklaşımları ve gerekçeleri ortaya konmuştur. Son olarak konunun İslam hukuku açısından değerlendirmesi yapılmıştır. Emtia türev sözleşmelerinin araştırmaya konu yapılmasının nedeni, bu sözleşmelerin İslam hukukunun klasik akit teorisi açısından bazı sorunları barındırmasıdır. Bu sözleşmelerden emtia forward ve emtia futures sözleşmelerdeki sorunların bir kısmının akit konusu, bir kısmının akitteki vade, bir kısmının teminat sistemi, diğer bir kısmının ise akdin sonlandırılma şekli ile ilgili olduğu görülmektedir. Bu sorunları çözmek üzere çalışmada incelenen konular arasında; ma'dumun satımı, mülkiyette olmayan malın satımı, kabz edilmeyen malın satımı, borcun borca karşılık satımı, nakdi mutabakat ve ters işlem sayılabilir. Opsiyon sözleşmelerinin ise öncelikle hukuki mahiyeti tartışmalıdır. Bu sebeple öncelikle hukuki mahiyeti tespit edilerek İslam hukuku açısından değerlendirilmiştir. Bu bağlamda opsiyon işlemi; akit, vaad (önakit), şart muhayyerliği, ticari sigorta, kaparo ve hak satımı açısından incelenmiştir."
