abstract: "Şöhreti etrafta yayılan en tanınmış ilim adamları arasında İmam Şafiidir. İmam Şafii çokça Kitaplar telif etmiş ve bu kitaplar içinde hadis ve eserleri delil olarak göstermiştir. Ancak, bilinmeyen (Mubham) ravilerin; bazı hadislerden İmam'ın delilleri bulunmaktadır. Ve bazı Hadislerin Tadil ale elibham bulunmaktadır. İmam'ın yaptığı çalışma ile farklı farklı görüşlü Alimler bulunmaktadır. Alimler kendi görüşlerinde ısrarcı olmalarının sebebi'de, Hadis koşullarına vurgu yapmalarındandır. Bunun için bu tezde Eltadil ale elibhem konusu üzerinde durdum. İmam Şafiide Elum Kitabında uygulama usulü ''Eltadil ale elibham ind el İmam el Şafii dirasa Tasıliye Tatbikıye fi kitab elum'dır''. Tezimi Mukaddime ve hazırlık kısımları olarak iki bölüme ayırdım. Birinci bölüm; Usul (Dirasa Tasıliye)'ye ayırdım. Bu bölümü dört kısma ayırdım. 1.Kısım: İbham ve hükümleri. 2.Kısım: Eltadil ale elibham konusu. 3.Kısım: Um kitabında Eltadil ale elibham lafız değişiklikleri ve sebepleri. 4.Kısım: Mubham Sikaları Kitab elum'da bulmak. İkinci Bölüm: Uygulama (Dirasa Tatbikıye)'ye ayırdım. Bu bölümü'de üç kısma ayırdım. 1.Kısım: Hadiste İrsal bulunmamakta, Mubham Sikaları'nda bulmak. 2.Kısım: Hadiste İrsal bulunmakta, Mubham Sikaları'ndada bulunmaktadır. 3.Kısım: Bulunan Mubham Sikaları hakkında ''Tadil ve Carıh Alimleri'nin görüşlerinden bahs ettim. Bunun sonunda ek olarak hadisleri bulunamayan Mubham ve Sikalar içinde değindim. Sonuç konusunun içeriğinde önemli bulgular ve tavsiyeler bulunmaktadır. Çalışmamda İmam Şafii'nin Elsan'a Elhadisiye ye önem verdiğini vurguladım. Eltadil ale elibham konusun'da bir biri ile entegreli şekilde ve formüle ettim. Konu hakkındaki tüm müfredatları içermektedir ve uygulamaları ise Elum Kitabındandır. İmam Şafii'de bulunan Eltadil ale elibham konusun'daki durumları toplamaya ve onları bulmaya önem gösterdim. Eltadil ale elibham konusun'da doğru görüşleri izah ettim. İmam Şafii'nin Eltadil ale elibham konusu için kullandığı lafızların hedefini açıkladım. İmam Şafii'nin elibham sebepleri konusu'daki önemli nedenlerini açıkladım. Metin ve Senedin Mubhamını ve tadil ale elibham konusunu bulmak için tez çalışması bir kaç yolu derleyip topladım. Eltadil ale elibham konusundaki Alimlerin açıklamalarında bahs ettikleri kuralları toplamaya çalıştım. Doğruluğu her zaman yerine gelmez. Tez çalışması ayrıca; İmam Elbayhaki'nin çabaları sonucunda Elum kitabındaki Elsikat Elmubhamin-i bularak ortaya koydum. Eltadil ale elibham konusundaki Elum kitabındaki vaziyet sayısı yüz yirmi sekiz'dir. Seksen altı vaziyet İrsal bulunmamakta, kırk iki vaziyet İrsal bulunmakta; İmam Şafii tarafından İbham edilen Sikaların sayısı otuz iki'ye ulaştı.İmam Şafii'nin bazı Hocalarından ne özel nede genel Teracim kitapları bahsetmediklerini ortaya çıkardım. Sened'den düşen Elum Kitabındaki konuda,İbham vaziyeti birden fazla olabileceği ortaya çıkıyor. İmam Şafii tarafından tadil edilen her Mubham Sika'yı tercih ederek sonuçlandırdım. Hadis Hükümler'inde bulunan Eltadil ale Elibham konusun'dadoğruluk delili vardır. Tez çalışması sonucunda: Çalışmam özellikle El mubhamat ilmi'ne ve El carıh ve Eltadil İlmi'ne genelde itina ile tavsiye etti. Bu duruma İslam İlmi Araştırmacıları daha çok değer vereceklerdir. Böylece; Atalarımızın bize bıraktıklarını: gözden geçirerek ve yorumda bulunarak düzenleyip koruruz."
