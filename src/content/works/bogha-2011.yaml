title: "التعديل على الإبهام عند الإمام الشافعي دراسة تأصيلية تطبيقية في كتاب الأم"
titleTranslation: {"tr": "et-Tadil Ala el-İbham İnd el-İmam eş-Şafii Dirasa Ta'siliye Tatbikıye Fi Kitap el-Um"}
