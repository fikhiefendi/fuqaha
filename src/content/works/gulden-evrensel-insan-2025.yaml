abstract: "İnsan yaratılış itibariyle sosyal bir varlıktır ve temel ihtiyaçlarının karşılanması için de olsa başkalarına ihtiyaç duymaktadır. Bir arada yaşamanın birtakım kuralları bulunmaktadır. Bu kuralların en önemli olanı fertlerin birbirlerinin hayatına, kararına, bütün yaşam alanına saygı duymak zorunda olmasıdır. Her insan doğuştan birtakım haklara sahip olarak dünyaya gelir. Bu haklar arasında istediği yerde ve şekilde yaşamak, bir inanca sahip olarak onun gereklerini yerine getirmek, mal ve mülk sahibi olmak, eğitim almak, evlenmek, çalışmak bulunur. Bu tercihler doğrultusunda hareket ederken her ferdin özgür iradesi ile karar vermesine ve bu kararlarını hayata geçirmesine müdahale edilmemelidir. Bununla birlikte her ferdin, milliyetine, cinsiyetine, inancına, siyasi görüşüne, sahip olduğu statüye ve içinde yaşadığı topluma bakılmaksızın bu haklardan yararlanması sağlanmalıdır. İnsanın sırf insan olması sebebiyle doğal olarak sahip olduğu bu hakların varlığı zaman içerisinde aşamalardan geçmiştir. İnsan hakları konusunda Batıda ve İslam dünyasında birçok bildiri hazırlanmış, antlaşma yapılmış, çalışma ortaya konulmuştur. Bu çalışmada, Birleşmiş Milletler Genel Kurulu tarafından imzalanan İnsan Hakları Evrensel Bildirisi'nde yer alan bazı maddeleri ele alarak bunların makâsidü'ş-şerîa başlığı altında İslam Hukukunda korunması esas kabul edilen zarûriyyât-ı hamse diye bilinen beş temel esas ile mukayese yapılması hedeflenmiştir. Hazırlanan bu çalışmanın amacı, İlahi bir temele ve korumaya dayanan insan hakları ile insanlar tarafından ortaya konulan insan haklarının kıyaslanması sonucunda ortaya çıkacak olan benzer ve farklı yönlerin belirlenmesidir."
