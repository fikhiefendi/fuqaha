abstract: "Tez, bir giriş ve dört ana bölümden oluşmaktadır. Birinci bölümde,vesile ve maksad kavramlarının İslam hukukundaki terminolojik anlamlarına,vesileleri belirleme yollarına; vesilelerin kısımlarına; İslâm hukukunda vesile vemaksad ilişkisinin temellendirilmesine ve bu ilişkinin ele alınışının tarihisürecine değinilmiştir. İkinci bölümde, vesile ve maksad ilişkisi; hiyerarşikdurum, üstünlük, öncelik ve birbirlerini gerektirmeleri açılarındanincelenmiştir. Üçüncü bölüm, vesile ve maksad kavramlarına ilişkin fıkhî kâideve prensipleri içermektedir. Dördüncü bölüm, hükümlerin değişmesi açısındanvesile-maksad ilişkisine ayrılmıştır.İslam hukukunda vesile ve maksad ilişkisini belirleyen kurallarbulunmaktadır. Buna göre, vesileler genellikle götürdükleri maksadlar ışığındadeğerlendirilir ve mantıkî olarak vesileler maksadlara tâbi olduklarından,vesileler kendilerinden sonra gelen maksadlardan daha düşük mertebededirler.Maksad hükümsüz olunca vesile de hükümsüz olur. Maksad vesile ile veyavesilesiz gerçekleşince de vesile hükümsüz olur. Maksada aykırı vesilelergeçersizdir. Bu nedenle, kanun koyucunun amaçlarına aykırı davranışlaryasaklanmış, hakkın kötüye kullanılmasına izin verilmemiş, dinin maksadınaaykırı hileler yasaklanmıştır. İslam hukukuna göre amaçlar araçları mutlakolarak meşru kılmaz. Çatışma halinde maksad tercih edilir. Haram vesileihtiyaç halinde meşru olur.Günümüzde bazı araştırmacılar vesilelerin değişkenliğini savunmakta vekat`î hükümlerin de bu kapsamda olduğunu söylemektedirler. Fakat dinin kesinolarak belirlediği vesilelerde değişkenlik olmaz. Çünkü din hem maksadlardanhem de bu maksadlar için belirlenmiş vesilelerden oluşur. Ancak dince serbestbırakılan alanlarda mükellefler zaman ve duruma en uygun vesileleri seçmeklesorumludurlar."
