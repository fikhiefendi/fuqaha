abstract: "Finansal sektör ülke ekonomilerinin performansını arttırmak veya potansiyelini ortaya çıkarabilmek adına önemli yapı taşlarından birisidir. Özellikle Türkiye gibi gelişmekte olan ülkelerin fon ihtiyacını sağlama konusunda önemli görevleri bulunmaktadır. Bankacılık finansal sektörün en büyük oyuncusu olarak farklı türlere sahiptir. Bunlardan birisi katılım bankacılığıdır. Katılım bankaları diğer türlere göre çok yeni olsa da müslümanlar için önemli bir açığı kapaması nedeniyle önemlidir ve hızlı büyümektedir. Türkiye için de özellikle 2000'li yıllardan itibaren benzer durumdan bahsetmek mümkündür. İslami bankacılık başta bankacılık sektörünün en önemli enstrümanı sayılacak faizi ve diğer bazı unsurları yasaklamıştır. Bu sebeple iki banka türü arasında yapısal farklılıklar olması normaldir. Bu çalışmada bu farkların karlılık anlamında da farklara yol açıp açmadığı tespit edilmeye çalışılmıştır. Literatürde yapılan çalışmalar incelendiğinde karlılık göstergeleri olarak ROA, ROE ve NIM kullanılmaktadır. Bunların belirleyicileri olarak geniş yelpazede değişken bulunsa da bu çalışmada geçmiş dönemin verileri, sermaye, operasyonel maliyetler, takipteki krediler, net komisyon gelirleri, mevduat faizi oran farkı, market konsantrasyonu, likit aktifler, finansal derinleşme ve faiz kullanılmıştır. Her bir karlılık değişkeni için etkileri ayrı ayrı hesaplanmıştır. Genel olarak geçmiş dönem değişkenler, sermaye, net ücret komisyon, market konsatrasyonu ve finansal derinleşme genel olarak pozitif etki oluştururken operasyonel maliyetler, takipteki krediler, düşük faiz vermek karlılığı negatif etkilemektedir. İki banka türü arasında başta bu değişkenler özelinde anlamlı farklar bulunmaktadır. Özellikle faizin yasak olması nedeniyle katılım bankalara hem bazı ürünler ulaşamamakta hem de bazı ürünleri müşterilerine sunamamaktadır. Hatta bazı komisyon gelirlerini bile uygun görülmediği için alamamaktadır. Ancak faiz hassasiyeti bulunan müşteriler potansiyel müşteri olup başka tarafa gidemedikleri için bankaya önemli bir avantaj sağlayabilmektedir. İlgili çalışma Türkiye özelinde yapılmış olup bankaların çeyreklik verileri kullanılarak 2007-2017 yılları arasını kapsayacak şekilde yapılmıştır. Karlılık tespiti için ekonometrik model kullanılmış olup ilgili çalışma ve testler stata ile yapılmıştır"
