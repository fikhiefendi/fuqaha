abstract: "Türkiye'de faiz oranının yüksek olması, bu seviyelerin reel ekonomiye zarar verip vermeyeceğinin sorgulanmasına kapı açıyor. Bu sorular, reel faiz oranının yatırım üzerindeki etkilerini anlamaya çalışan bu makalenin temelini oluşturmaktadır. Bu makale aynı zamanda farklı kredi araçlarının varlığının, yatırımı olumlu yönde etkileyerek ve aynı zamanda reel faiz oranı ile yatırım arasındaki ilişkiyi yumuşatarak reel ekonomiyi iyileştirmeye yardımcı olup olmadığını keşfetmeye çalışmaktadır. Bunun için 2005Q4-2022Q4 dönemini kapsayan çeyreklik veriler kullanılarak üç hiyerarşik ARDL modeli çalıştırılarak faiz ve katılım bankalarının özel sektöre verdiği kredilerin yatırım üzerindeki etkisi test edilmiştir. Ayrıca katılım bankalarının özel sektöre verdiği kredilerin reel faiz ile yatırım arasındaki ilişkide düzenleyici bir role sahip olup olmadığı anlaşılmaya çalışıldı. Sonuçlar kısa vadede faiz oranlarının olumsuz etkisinin zayıf olduğunu gösterirken, katılım bankalarının özel sektöre verdiği kredilerin genel olarak olumlu etkileri olduğu değerlendirilmiştir. Düzenleyicilik etkisi zayıf ve çoğunlukla önemsiz bulunmuştur."
