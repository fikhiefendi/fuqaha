abstract: "Fıkıh, hadis, tefsir ve tasavvuf gibi birçok alanda kendini yetiştirmiş Zafer Ahmet el-Osman et-Tehânevî Hindistan'ın seçkin âlimlerinden biridir. Yaşadığı dönemde, XX. yüzyılın ortalarında, Ehli Hadis ismi verilen bir ekol ortaya çıkmış ve Hanefi mezhebinin hadislere dayanmadığını, kıyası hadislerin önüne geçirdiklerini iddia etmişlerdir. İmamı Azam Ebu Hanife'yi eleştirmişlerdir. Bunun üzerine Eşref Ali et- Tehânevî Ebu Hanife'nin delil olarak kullandığı hadisleri farklı kitap ve risalelerden bir araya getirmeye başlamış ve Zafer Ahmet et-Tehânevî de bu çalışmayı tamamlayarak tezimize konu olan nikâh bölümünü fıkhî açıdan incelediğimiz İ'lâü's Sünen adlı eserini te'lif etmiştir. Müellif eserini hadisleri senet ve metin açısından inceleyen bir içerikle kaleme almış olsa da pek çok meselede konu ile ilgili, şahısların veya diğer mezheplerin görüşlerine de yer vermiştir. Bu görüşlerin delillerini ve bu delillerin değerlendirmelerini de eserine dâhil eden müellifin, eserinin bir hadis çalışmasının yanı sıra fıkhî mülahazaları göz önünde bulundurulduğunda bir fıkıh eseri mahiyetine de sahip olduğu söylenebilir. Çalışmamız Eşref Ali et-Tehânevî ve Zafer Ahmet el-Osman et-Tehânevî'nin hayatının ele alındığı birinci bölüm, İlâü's Sünen'in metod olarak incelendiği ikinci bölüm ve nikâh bölümünün fıkhî olarak incelendiği üçüncü bölüm olmak üzere toplam üç bölümden oluşmaktadır."
