abstract: "Gölge bankacılık sistemi ile ilgili yapılan bütün tartışmalar özellikle 2008 Küresel finansal kriz ile birlikte ön plana çıkmış ve finansal sistemin düzenlenmesine yönelik uygulamaların merkezine yerleşmiştir. Bu tez kapsamında gölge bankacılık sistemi kavramsal olarak tartışılmış, 2008 küresel finansal krizi ile olan ilişkisine yer verilmiş, Türkiye'de ve Dünya'daki uygulamalarından söz edilmiştir. Ayrıca Katılım bankacılığının yapısı, Türkiye ve Dünya'daki uygulamaları ve gölge bankacılık sistemi ile olan ilişkisine yer verilmiştir."
