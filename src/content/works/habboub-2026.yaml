abstract: ": Bu çalışma, şirketler tarafından nitelikli, deneyimli ve yaratıcı çalışanları teşvik etmek ve kuruma kazandırmak amacıyla kullanılan modern teşvik araçlarından biri olan çalışanlara yönelik hisse senedi opsiyonlarını ele almaktadır. Bu sistem kapsamında çalışanlara, genellikle üç ila beş yıl arasında değişen belirli bir süre içinde, şirket hisselerinden belirli bir sayıyı avantajlı fiyatlarla satın alma hakkı tanınmakta; bu durum çalışanların kuruma bağlılığını güçlendirmekte ve mesleki yetkinlikleri ile yaratıcılıklarının değerlendirilmesine katkı sağlamaktadır. Çalışmanın amacı, geleneksel çalışan hisse senedi opsiyonlarının ölçüt ve düzenlemelerini nesnel bir fıkhî analiz çerçevesinde incelemek ve bunları İslam fıkhında satış akitlerine, özellikle şart muhayyerliği içeren satış (bey' bi-şartü'l-hıyâr) ilkeleriyle karşılaştırmaktır. Bu bağlamda, söz konusu sözleşmenin yapısal ve şer'î boyutları ele alınmakta; ayrıca İslam hukukuna aykırı olan bazı sözleşme hükümleri için şer'î çözüm önerileri sunularak, bu aracın İslami bankalar ve Şer'î esaslara göre faaliyet gösteren şirketlerde uygulanabilirliği değerlendirilmektedir. Çalışma sonucunda, çalışanlara yönelik hisse senedi opsiyonu sözleşmesinin iki aşamadan oluştuğu tespit edilmiştir. Birinci aşama, şirket tarafından verilen tek taraflı bağlayıcı bir katılım vaadi niteliğindedir. Çalışanın gerekli şartları yerine getirmesinin ardından ikinci aşamaya geçilmekte ve bu aşamada kararlaştırılan hisselerin satışı söz konusu olmakta; çalışana belirli bir süre içinde sözleşmeyi yürürlüğe koyma veya feshetme hakkı tanınmaktadır. Bu aşama, İslam fıkhındaki şart muhayyerliği içeren satışla örtüşmektedir. Buna göre, geçerli şer'î şartların tamamına riayet edilmesi kaydıyla, çalışanlara yönelik hisse senedi opsiyonu sözleşmelerinin İslam hukukuna göre caiz olduğu sonucuna ulaşılmıştır. Çalışma, fıkıh meclisleri ve Şer'î denetim kurullarına, çalışanlara yönelik hisse senedi opsiyonları hakkında ayrıntılı karar ve standartlar yayımlamaları yönünde tavsiyede bulunmakta; bu sayede söz konusu uygulamaların şirketler, finansal kurumlar ve akademik çevrelerce benimsenmesi hedeflenmektedir"
