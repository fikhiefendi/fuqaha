abstract: "Günümüzde değişen tarih tasavvuru devlet ve hanedanlardan daha ziyade geniş halk kitlelerinin yaşamına eğilmektedir. Bu eğilim bizi Osmanlı sosyal tarihinin ana kaynakları olan şer'iyye sicillerine götürmektedir. Sicildeki belgelerden halkın yaşam tarzı, birbirleriyle olan münasebetleri, sorunları (evlenme, boşanma, miras ve ticaret) ve devletin hukuki düzeni takip edilebilmektedir. Bu belgeler devlete bağlı resmi makamlarca kayıt altına alındığından dolayı oldukça güvenilir, sağlam ve birinci elden bilgiler içermektedir. Bu çalışmada, M. 1838-1855 yılları arasını kapsayan 244 numaralı Ankara şer'iyye sicili incelenerek bu defterin içerdiği belgeler ışığında Ankara'nın sosyal, kültürel, siyasi ve ekonomik yapısı tespit edilmeye çalışılmıştır. Bu tarihler arasında Ankara'nın bir eyalet merkezidir, fakat sadece 1850-1852 yılları arasında sancağa dönüştürülmüştür. Şehirde farklı etnik unsur ve dinlere mensup kişilerin (Müslüman, Hristiyan, Yahudi, Türk, Rum, Ermeni) farklı mahallelerde huzûr ve güven içinde yaşadığı belirlenmiştir. Sicil toplam 133 sayfa ve 187 adet belgeden oluşmaktadır. Bu belgeler alım-satım, borç, miras, nafaka, mehir, vakıf, atama ve azil gibi konuları içermektedir. Bu açıdan sicilin sosyal tarih araştırmaları için önemli bir kaynak olduğu düşünülmektedir."
