abstract: "Tarihi kaynaklarda ihmal edilmesiyle bilinen Ebû Mansûr el-Mâtürîdî ve onun düşünce ekolü, cumhuriyetle birlikte yeniden çalışmaların konusu haline gelmiştir. Bu çalışmaları tetikleyen ve ön plana çıkaran ana sebepler olarak Mâtürîdî'nin akılcılığı, din ve dünya görüşü, siyasilere karşı tavrı ve epistemoloji anlayışı belirleyici olmuştur. Yeni bir yönetim anlayışının, siyasi tavrın ve din devlet ilişkilerinin hangi zemin üzere boy vereceği, medeniyet arayışlarının temelindeki temel taşların nelerden oluşacağı konusu, tarihte Mâtürîdî'yi tekrar gündeme getirmede kaçınılmaz olmuştur. Bu sebeple Mâtürîdîliği bu yönüyle ele alan ve karşıt görüşte olan her iki çalışmaları, birincil kaynaktan Mâtürîdî okumaları yaparak kritik ettik. Mâtürîdî ekolün üzerine yüklenen bu misyonu yüklenip yüklenemeyeceği konusunu detaylı biçimde ele alarak, yeni bir medeniyet tasavvuruna ve din siyaset, din bilim ilişkileri konusunu sadece mezhepler bağlamında ele almanın büyük fotoğrafı ortaya koyma noktasında eksik kalacağını ifade ettik. Zira toplumsal problemlerin birden fazla sebebi olacağı aşikardır. Her derde deva olarak sunulan Mâtürîdîlik veya bunun karşısında erimeye mahkum edilmiş olan Eş'arîlik konusunu farklı bir zemine taşıyarak, olaylara farklı pencerelerden bakabilmenin imkanını aradık. Sonuç olarak hakikatte var olan ve tasavvur edilen Mâtürîdî farklarını ortaya koymaya çalışarak, aradığımız şeyi nerede aramamız veya aramamamız konusunda bir metodoloji geliştirmeye çalıştık. Bu metodoloji ile Mâtürîdî okumalarını daha tutarlı ve gerçekçi yapma fırsatı yakalayabiliriz."
