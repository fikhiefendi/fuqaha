abstract: "Bu tez, makâsıd-ı şerîa bağlamında manevi danışmanlık konusunu derinlemesine inceleyerek, İslam hukukunun temel amaçları çerçevesinde manevi danışmanlığın rolünü ve uygulama alanlarını kapsamlı bir şekilde ele almaktadır. Çalışma, İslam hukukunun manevi boyutlarını, özellikle makâsıd-ı şerîa (şeriatın temel amaçları) kavramını detaylı bir şekilde analiz etmiştir. Bu bağlamda, hak kavramları, zarûrât-ı hamse (temel ihtiyaçlar) ve bunların manevi danışmanlıkla ilişkisi geniş bir perspektifte incelenmiştir. Kur'ân ve Sünnet'teki manevi danışmanlık ögeleri, bu ögelerin hem teorik hem de pratik düzeyde nasıl uygulandığına dair örnekler sunarak, manevi danışmanlığın temellerini oluşturan tematik konuları ayrıntılı bir biçimde ele almıştır. Makâsid-i şerîa perspektifinden manevi danışmanlığın çeşitli uygulama alanlarının ve yaklaşımlarının kapsamlı bir şekilde değerlendirildiği ikinci bölümde ise İslam aile hukuku, ceza hukuku ve psiko-sosyal sorunlar çerçevesinde manevi danışmanlığın pratik uygulanabilirliği üzerinde durulmuştur. Bu bölümde, aile yapısına ilişkin fıkhî hükümler, evlilik ve mirasla ilgili rivayet kültürü, engelli bireyler, göçmenler ve depremzedeler gibi toplumsal grupların manevi danışmanlık ihtiyaçları detaylı bir şekilde irdelenmiştir. Ayrıca tezin ekinde, hukuksal ve yönetmelik düzenlemeleri, eğitim ve sertifikasyon standartlarına dair kapsamlı önerilerde bulunulmuştur. Tezin sözü edilen bu ekinde, Türkiye'de manevi danışmanlığın mevcut hukuksal durumu, yasal düzenlemeleri ve toplumsal farkındalık yaratma stratejileri analiz edilmiştir. Manevi danışmanlık meslek tanımı, çalışma ortamı, beceri standartları ve profesyonel gelişim konularında ayrıntılı önerilerde bulunulmuştur. Sonuç olarak, tez, İslam hukukunun manevi boyutlarıyla uyumlu, etkili ve kapsamlı bir manevi danışmanlık pratiği için önemli psiko-teolojik bilgiler ve öneriler sunarak bu alandaki mevcut eksikliklerin giderilmesine İslam hukuku perspektifinden katkıda bulunmayı ve özellikle Türkiye'deki manevi danışmanlık uygulamalarında daha iyi bir anlayış ve etkinlik sağlamayı amaçlamıştır."
