abstract: "Müftülük Kurumu, dini konulara yönelik fetva veren ve tarih boyunca bütün Türk-İslam Devletleri'nde görülebilen bir teşkilattır. Osmanlı Devleti'ne kadar farklı şekillerde varlığını göstermiş ve Osmanlılar zamanında en nihai şekline bürünmüştür. Osmanlı Devleti'nde özellikle merkeze uzak olan bölgelerde çok önemli bir rol üstlenmiş ve şer`î konulara ilişkin durumlarda tek yetkili kurum olmuştur. Bundan dolayı, Osmanlı'nın Anadolu coğrafyasında bulunan bu kurumun detaylı bir şekilde irdelenmesi çok önemlidir.Bu bakımdan bu çalışma ile Osmanlı Devleti'nin Anadolu'daki idari birimlerde bulunan müftülük kurumları ve çalışanları ele alınmıştır. Kurum çalışanları olan müftüler ile ilgili arşiv belgeleri titizlikle incelenmiş ve Anadolu müftülerine dair bilgiler ışığında Osmanlı'nın Anadolu müftülük kurumu açıklanmaya çalışılmıştır. Konuyla alakalı veriler tablo halinde de verilmiş ve bu kurumun izahı daha somut bir şekilde yapılmıştır."
