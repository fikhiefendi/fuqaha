abstract: "Bu tez çalışması, bir giriş bölümü, savaş için verilen dinî izinler, savaş fetvaları ve bir de sonuç kısmı olmak üzere dört ana bölümden oluşmaktadır. Araştırmanın genel konusu, önemi, amacı ve yöntemi tartışıldıktan sonra kaynakların tanıtılması giriş bölümünde yapılmıştır. Birinci bölümde“Savaş ve Dini İzinleri”başlığında cihad, gaza, kıtal, harb, nefîr-i 'âmm kavramları çözümlenmiş ardından fetva, kısaca fetvanın tarihî ve gelişim süreci, Osmanlı Devleti döneminde fetva ve fetva kurumları hakkında kaynaklara dayanan bilgiler sunulmuştur. Bununla beraber yine Osmanlı döneminde önemli kaynaklar olarak karşımıza çıkan Fetva Mecmuaları kaynakları ve Meşihat Dairesi kurumu çeşitli açılardan ele alınmıştır. Tezin devamında ise tüm bu tarihsel ve kuramsal temelin üzerine Osmanlı Devleti'nde savaş ilanlarının bir parçası olan“Savaş Fetvaları”başlığı altında 18. ve 19. yüzyıllarda verilen fetvalar incelenmiştir. 1768-1774'teki Osmanlı-Rus Savaşı çalışmanın kronolojik sınırları için bir başlangıç kabul edilmiş, 1914'teki Birini Dünya Savaşı'na kadar olan dönemde Osmanlı Devleti'nin iç ve dış düşmanlarına karşı girmiş olduğu savaşlar için verilmiş fetvalar, harp beyannameleri ve bunları barındıran kaynaklar çalışmanın odak noktasını oluşturmuştur. Osmanlı Devleti'nin harp ilan ederken, bu harp ilanının siyasî ve hukuki meşruiyeti nasıl göz önünde bulundurduğu, bunun kurumsal temelini nasıl oluşturduğu ve kamuoyunu ikna için dinî-kültürel alt yapıya uygun argümanları nasıl geliştirdiği bu tezin esas konusudur. Bu çalışmanın birincil tezi fetvaların Osmanlı Devleti'nin harp ilanında en başından beri meşruiyet sağlayıcı metinler olarak önemli bir rol oynadığı ve modernleşme döneminde, genel kabulün aksine önemlerini kaybetmeyerek harp meşruiyetinin öncelikli hukukî metinlerinden biri olmayı devam ettirdikleridir."
