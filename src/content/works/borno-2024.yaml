abstract: "Bu yüksek lisans tezi, İslam hukukunda“ifta”kavramını, Avrupa'daki Müslümanlar arasındaki algısını ve Avrupa Fetva ve Araştırma Konseyi aracılığıyla pratik uygulamalarını incelemektedir. Tezin ilk bölümü,“ifta”terimini dilsel ve İslam hukuku çerçevesinde tanımlayarak kapsamlı bir genel bakış sunar. Fıkıh, iftayı müstakil bir disiplinde inceler, temel prensiplerini, uygulama süreçlerini ve yayımlanması için gereken şartlar şartlar üzerinde durur. İkinci bölüm, özellikle Almanya'ya odaklanarak, Avrupa'daki Müslümanlar için iftanın önemi, rolü ve ilgisine dair bir anket aracılığıyla görüşleri ele alır. Anket, Avrupa'daki Müslümanların ifta ile olan bağlantılarının önemini ve iftaya olan ihtiyacın algılanıp algılanmadığını değerlendirir. Bulgular, ifta ve fetvanın Avrupa'daki Müslümanlar için önemli bir yer tuttuğunu göstermektedir. Tezin son bölümü, Avrupa'da tek bilinen ifta kurumu olan Avrupa Fetva ve Araştırma Konseyi'ni inceler. Kurumun benzersiz metodolojisi, özellikle azınlıkların fıkhı (Fiqh al-Aqalliyat) prensibini detaylandırır ve konsey tarafından yayımlanmış iki tanınmış fetvayı eleştirel bir şekilde inceler. Bu analiz, Avrupa'daki fetvalar için azınlık fıkhı yaklaşımının önemini vurgular ve Avrupa'daki fetva kurumlarının yeterince tanınmadığını ortaya koyar, bu kurumlar hakkında farkındalık ve eğitim ihtiyacını vurgular. Teorik bilgilerle pratik uygulamalar arasında köprü kurarak, bu tez Avrupa'daki Müslümanlar arasında iftanın rolü ve algısına dair içgörüler sağlar ve Avrupa'daki önemli bir ifta kurumunun işleyişsel nüanslarını ortaya koyar. Çalışma, ita ve fetvanın Avrupa'daki Müslümanlar için önemini gösterir ve Avrupa'daki fetva kurumları hakkında daha iyi bir anlayış ve bilgi dağıtımının gerekliliğini vurgular."
