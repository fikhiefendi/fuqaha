abstract: "Filistin toprakları Tarih boyunca farklı ülkelerin ve hukuk sistemlerinin yönetimi altında kalmıştır. Osmanlı döneminde ikinci meşrutiyete kadar uygulanan sistemde 1858 tarihli Arazi Kanunnamesi , 1882 Mecelle-i Ahkam-ı Adliye veya yabancıların mülk edinmelerin ilişkin kanunlar dikkat çekmektedir. İkinci meşrutiyetten sonra ortak taşınmazların paylaşılmasına ilişkin kanun, taşınmazların tasarrufu hakkında kanun ve taşınmazların intikal kanunu muvakatı uygulanan mevzuat arasında yer alır.İngiliz manda idaresi döneminde ilk önce askeri bir yönetim ortaya çıkmış daha sonra bu yönetim sivilleşmiştir.1948 itibaren Ürdün yönetimi altına girilmiş ancak uygulanan mevzuatta ve hukukta bir değişiklik olmamıştır.1967?den itibaren başlayan ve 1994?e kadar devam eden İsrail işgal altındaki dönemde çeşitli düzenlemeler gerçekleştirilmiştir. Bu tarihten günümüze kadarda bazı kanun tasarıları üzerindeki çalışmalar devam etmektedir. Filistin Medeni Kanununda taşınmaz mülkiyeti aslen ve devren kazanılabilmektedir , aslen kazanma yolları işgal , birleşme , zilyetlik ; devren kazanma yolları ise satış sözleşmesi , bağış ve trampa gibi sağlararası işlemler ile önalım (şufa) hakkının kullanılmasıdır. Bu kazanma yollarının yanında kazandırıcı zamanaşıma da yer verilmiştir. Filistin Hukuku? nda taşınmaz mülkiyetinin kaybı yollarından en dikkat çekici olanı kamulaştırmadır. Kamulaştırma bizzat devlet tarafından yapıldığı gibi kamulaştırma yetkisinin devredilmesi suretiyle başka kurumlarca da yapılabilmektedir. Kamulaştırma kararına karşı yargı yollarına başvurabileceği gibi kamulaştırma bedelinin miktarı, ödeme şekli , ödeme süresi ve benzeri konularda davalar açılabilmektedir. Anahtar Sözcükleri: Filistin Toprakları, Osmanlı Dönemi, Aslen Kaznma, Devren Kazanma, Kazandırıcı Zamanaşımı, Kamulaştırma."
