abstract: "Suffa Ashâbının çoğu, gece-gündüz demeden hayatlarının büyük bir kısmını Hz. Peygamber'le geçirmiş, O'na hizmet etmiş ve O'ndan dini öğrenmişlerdir. Hepsi olmasa da birçoğu ilimle temayüz etmiş ve Peygamber'in vefatından sonra da, ayrı memleketlerde ve farklı görevlerde bulunarak bilgi ve birikimlerini etrafında toplanan insanlara aktararak İslâm hukukunun oluşum sürecinde büyük katkıları olmuştur. Bu düşünceden hareketle yaptığımız çalışmamız, bir giriş ve iki bölümden oluşmaktadır.Giriş bölümünde Suffa'nın oluşum süreci ile sahâbe, Suffa Ashâbı, fıkıh ve hukuk terimlerini ele aldık.Birinci bölümde; Suffa Ashâbının hayatlarını inceledik. Bu bağlamda Suffa Ashâbının yetişme süreci, dini öğrenmek ve öğretmek için gösterdikleri çaba, Hz. Peygamber döneminde ve sonrasında üstlendikleri resmi görevlere ilişkin konular üzerinde durduk.İkinci bölümde ise; İslam hukukunun oluşmasında Suffa Ashâbının etkilerini inceledik. İslâm hukukunun oluşum ve gelişim süreçleri dikkate alındığında, ilk iki önemli dönemi, Hz. Peygamber Dönemi ile Sahâbe dönemi oluşturmaktadır. Bu bağlamda Hz. Peygamber'in yetiştirdiği Suffa Ashâbının, hüküm verirken izledikleri metodu tespit edip, bu metodun pratikteki uygulamalarından örnekler sunduk. Onların bu metot ve görüşlerinin sonraki fıkıh bilginlerine ve hukuk ekollerinin oluşmasına olan etkilerini incelemeye çalıştık."
