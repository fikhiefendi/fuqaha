abstract: "Uluslararası finansal uygulamaların etki sahası oldukça geniştir. Bu uygulamaların gerek bireysel, gerek ülke ve gerekse de dünya geneli bağlamında etkilerinin olduğu tartışma kabul etmez. Bu uygulamaların içeriğine ve çeşitliliğine bakıldığında bir ağ gibi her tarafı içine alan bir sistemin varlığı söz konusudur. Bu sistemin işleme koşulları ve felsefesi bu etkileşimin etkisinin sonuçlarının şekillenmesinde oldukça belirleyicidir. Bu sistemi hayata geçirenler insan olduğu gibi sonuçlarından da en çok etkilenen insanlardır. Uluslararası etkileri olan bu sistemin sermaye sahiplerinin lehine olduğu kadar bu sistemin etki alanına giren herkesin de lehine olması gerekmektedir. Bu etkilerin sonuçlarını belirleyecek olan temelde iki unsur vardır. Birincisi kapitalist sistem ve onun aktörleridir. İkincisi ise semavi dinler ve özelde de İslâm dininin verileridir. Ya bu sistem olduğu gibi sermayedarların yararını koruyan kapitalist sisteme bırakılmalıdır ya da dünyada her yönü ile adaleti temin edecek bir sistemle hal çaresi düşünülmelidir. İnsanın kendisi gibi şekillendirmiş olduğu sistemlerinin de belirli bir ömrü ve kullanım süresi vardır. O halde bu boşluğu doldurması gereken ve kapitalist sistem olmadan da aslında uygulanması gereken sistem de semavi kaynaklı dini düzenlemelerdir. Bu yapıyı uluslararası sistemin bütün taraflarına fayda sağlayacak sistem ise özelde İslâmî finansal sistemdir. Çünkü bütün semavi dinlerin ve gündeme getirilip de hedefi aynı olan diğer dinlerin bütün beklentilerini karşılayacak olan din İslâm dinidir. Çünkü İslâm dininin en son din olması ve evrensel bir karakter taşıması bunu netice vermektedir."
