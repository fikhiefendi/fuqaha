abstract: "İslam dini her alanda olduğu gibi finansal yatırımlarda da birtakım ilke ve kurallar belirlemiş ve bu kurallar çerçevesinde işlemlerin gerçekleştirilmesini zorunlu tutmuştur. Dolayısıyla İslam dinine mensup bir yatırımcı herhangi bir finansal yatırımda bulunurken bu yatırımını İslami çerçeveye uygun gerçekleştirmelidir. Ancak bu yatırımcılar günümüzde ticari ve finansal eylemlerde her ne kadar yukarıda zikredilen İslamî çerçeveye uygun davranmaya çalışsalar da, kendi irade ve kontrolleri dışındaki faktörler sonucu bu çerçeveye uygun olmayan gelir ve giderlere maruz kalmaktadırlar. Fıkıhta genel kabul görmüş olan anlayışa göre bu şekilde istem dışı İslam'a uygun olmayan gelire maruz kalanlar bu geliri tespit edip bunu şahsi menfaat alanından çıkarmalı ve infak etmelidir. Günümüzde fıkhen uyumlu hisse senetleri ve bu hisse senetlerini içeren yatırım fonlarına yatırım yapıldığı takdirde elde edilen mahzurlu gelirin tespit ve arındırma yöntemleri üzerinde tam bir ittifak bulunmamaktadır. Dolayısıyla çalışmada dünya genelinde yaygın olarak kullanılan arındırma yöntemleri ve Türkiye'de kullanılan arındırma yöntemi incelenmiştir. Çalışmanın temel amacı katılım hisse senedi ve/veya bu hisse senetlerini içeren yatırım fonlarına yatırım yapılması sonucu elde edilen mahzurlu gelirlerin elden çıkarılmasına yönelik hâlihazırda dünya ve Türkiye tarafından kullanılan çeşitli arındırma metotlarında eksiklik bulunup bulunmadığını tespit etmek ve eğer eksiklik varsa söz konusu eksikliğin giderilmesi için yeni arındırma modeli önerisinde bulunmaktır. Çalışmada bu temel amaca ulaşırken basamak teşkil ettiği için sermaye piyasalarının İslamileştirilmesi noktasında niçin katılım hisse senetlerinin tercih edildiği, dünyada ve Türkiye'de katılım hisse senetleri ve bu hisse senetlerini içeren yatırım fonları özelinde İslami finansın sektöre nazaran ne konumda olduğu ve arındırmaya konu olan dünyada ve Türkiye'de fıkhen uyumlu hisse senetleri ve bu hisse senetlerini içeren yatırım fonlarının aktif büyüklüklerinin ne seviyede olduğu sorularına da cevap aranmaktadır. Bu çalışma; önerdiği arındırma metoduyla, katılım endeksindeki hisse senetlerinden ve/veya katılım hisse senedi içeren yatırım fonu yatırımlarından elde edilen mahzurlu gelirlere ilişkin arındırma tutarının daha isabetli bir şekilde hesaplanması ve özellikle enflasyonist ülkelerde ilgili tutarın alım gücünün korunması bakımından önem arz etmektedir."
