abstract: "Bir Müslümanın gayri müslim devlet vatandaşlığına geçmesi/sahip olması, güncel fıkıh meselelerinden birisidir. Bu mesele, Kuzey Afrika'daki Fas, Tunus ve Cezayir gibi ülkelerin Fransızlar tarafından işgal edilmesi üzerine tartışılmaya başlanmıştır. Büyük bir Müslüman nüfusun gayri müslim ülkelerde yaşaması sebebiyle sömürge döneminden sonra da İslam hukukçularının üzerinde durduğu bir konu olmuştur. Bu tezde Müslümanlar açısından gayri müslim devlet vatandaşlığının İslam hukukundaki yeri incelenmiştir. Tez üç bölümden oluşmaktadır. Birinci bölüm, vatandaşlık kavramı, hukuki mahiyeti, tarihi ve İslam hukukunda vatandaşlık konularından oluşmaktadır. İkinci bölümde ülke, hicret, dârulharbden dârulharislâma hicretin hükmü ve gayri Müslim ülkede ikamet gibi konu ile ilgili klasik kavram ve meseleler ele alınmıştır. Üçüncü bölümde de müslüman azınlıklar hakkında genel bilgiler verildikten sonra gayri müslim devlet vatandaşlığı tartışmalarının tarihi arka planı, meselenin hükmü ile ilgili görüşler ve gerekçeleri anlatılmıştır. Anahtar Kelimler : Vatandaşlık, Ülke, Dârulislâm, Dârulharb, Hicret, Müslüman Azınlıklar"
