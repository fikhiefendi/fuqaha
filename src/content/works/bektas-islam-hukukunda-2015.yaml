abstract: "Çocukların bakımı, himayesi, maddi- manevi hert türlü ihtiyaçları büyükleri tarafından karşılanmak durumundadır. Bu hak ve aynı zamanda sorumluluk öncelikli olarak ailelerindir. Ancak her çocuk böyle bir imkana sahip olmayabilir. Bu gibi durumlarda onların bakım ve gözetimini üstlenecek ailelere ihtiyaç vardır. Günümüzde bu ihtiyacı karşılamak için koruyucu aile uygulaması ön plana çıkmıştır. Ancak Avrupa'da azınlıkta yaşayan müslüman ailelerin çocukları açısından koruyucu aile uygulaması bazı sorunlara sebep olmaktadır. Özellikle Almanya'da yaşayan, bakıma muhtaç ya da ailelerinden şiddet gören Türk kökenli müslüman çocukların koruyucu aile olarak gayrimüslim Alman ailelere verilmesi yıllardır tartışılan konulardan biridir. Nitekim bu uygulama, ailelerinden uzak yaşamak zorunda kalan çocukların kendi kültürel ve dinî değerlerine yabancılaşması sebebiyle, ileride tekrar kendi ailelerinin yanına dönmelerini zorlaştırmaktadır. Bu sebeple müslüman ailelerinin koruyucu ailelik konusunda gönüllü olmaları zaruridir. Klasik fıkıhta bugünkü anlamda koruyucu aile kavramı yer almasa da, çocuğu korumaya yönelik uygulamalara dağınık olarak rastlanmaktadır. Kur'ân ve Sünnetteki ifadelerden ve İslam hukukundaki uygulamalardan anlaşılacağı üzere korunmaya muhtaç çocukların, bakımevleri vb. yerlerden çok, bir koruyucu aile yanında himaye edilmesi teşvik edilmiştir. Tarihi süreçte beşeri hukuk sistemlerinin çocukluk devresinin varlığının kabul etmesi bile çok geç dönemlerde gerçekleşirken; çocukluk devresinin varlığı, onun korunması ve en güzel şekilde terbiye edilmesi İslam hukukunun genel prensipleri içerisinde yer almaktadır."
