abstract: "İnsanlar ilk çağlardan itibaren gereksinimlerinin bir kısmını daha kolay sağlayabildikleri için bir araya gelip ortak hareket ederek daha büyük hayvanları avlayabilmişler ve dış tehditlere daha kolay karşı koyabilmişlerdir. Batıdaki sanayi devrimi ile büyük sermayeye gereksinim artmış ve çok ortaklı şirketlere daha fazla ihtiyaç duyulmuştur. 21. yüzyılda dünya ticaretinin büyük kısmı çok ortaklı sermaye şirketleri tarafından yapılmakta ve önemli bir kısmı da anonim şirketlerce gerçekleştirilmektedir. Geçmişte İslam hukukunun uygulandığı topluluklarda 2-3 kişilik şahıs ortaklıkları ile ticaret yapılarak ihtiyaçlar gideriliyordu. Bu yüzden fıkıh âlimleri ortaklıklar konusunda çok fazla şirket çeşidi üzerinde durmamıştır. Ortaklıklar konusunda insanları detaylı şekilde aydınlatacak ve yol gösterecek fazla ayet ve hadisi şerif de bulunmamaktadır. Yasal mevzuatta anonim şirket ortaklarının sorumluluğu taahhüt ettikleri sermaye payları ile sınırlıdır. Anonim ortaklıklar küçük paylardan dolayı sermayelerini halka arz ederek büyük sermayelere ulaşabilir ve küçük yatırımcılarda büyük ve kârlı şirketlere ortak olarak âtıl birikimlerini değerlendirebilirler. Çalışmanın ana metni bir Giriş, Sonuç ve üç ana bölümden oluşmaktadır. Girişte tezin amacı, hedefleri, konusu, kapsamı, literatür değerlendirmesi, özgün değeri, yöntemi ve muhtemel etkileri ifade edilmektedir. Birinci bölümde TTK'ya göre kurulan ve faaliyet gösteren çağdaş ortaklıklar hakkında bilgi verilerek anonim şirketler detaylı olarak incelenmektedir. İkincisinde İslam iktisadında (ticari kural ve ilkelerinde) ortaklık tipleri tanıtılarak inan şirketi incelenmektedir. Üçüncü bölümde ise Türkiye'deki güncel kanunlara göre anonim şirket uygulaması değerlendirilerek tezin savı uyarınca kurulup işletilecek anonim şirket tipinin caizliği doğrulanmaya çalışılmaktadır. İslam'ın genel prensipleri ışığında anonim şirket tipinde ortaklık yapıldığında hangi hususlara dikkat edilmelidir sorusuna cevap aranacaktır. Ülkedeki yasal mevzuatın daha sağlıklı işler hale getirilmesi, küçük yatırımcının korunması ve gönül rahatlığı ile yatırım yapılarak işlem hacminin artırılması sonucu daha fazla istihdam sağlanıp ülke ekonomisinin gelişmesine yardımcı olunmaya çalışılacaktır."
