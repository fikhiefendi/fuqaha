abstract: "Bu çalışma, Türk Medeni Kanunu ve Irak Ahvali Şahsiye Kanununda evliliği Hanefi Mezhebiyle karşılaştırılmalı olarak ele alıp incelemektedir. Çalışmanın gayesi her iki kanunda bulunan evlilik hükümlerinin İslam hukuku hükümleriyle ne kadar bağdaştığı ve çeliştiğini ortaya koymaktır. Bu çalışma üç bölümden oluşmaktadır. Birinci bölümde, Medeni evliliğin ortaya çıkışı ve Türk Medeni Kanunu ile Irak Ahvali Şahsiye Kanunundaki yasal gelişimi, Medeni evliliğin makâsıdı ve Irak Ahvali Şahsiye Kanununun evlilikteki gayesini içermektedir. İkinci bölüm de evliliğin mukaddimeleri, gereksinimleri, Türk Medeni Kanunu ve Irak Ahvali Şahsiye Kanununda evlilik akdinin rükün ve şartları açıklanmaktadır. Üçüncü bölüm ise, Türk Medeni Kanunu ve Irak Ahvali Şahsiye Kanununda evlilik engelleri, evlilikte velayet, evliliğin geçerli sayılabilmesi için aranan şartlardan şahitlik ve evlilik akdinin sonuçlarından birisi olması itibariyle mehir gibi, evlilik akdinin yasal sonuçlarının ortaya çıkması için lazım olan ancak akdin kendisine herhangi bir etkisi olmayan şartlar, evlilik ve aile ile alakalı iki önemli mesele olan çok evlilik ve evlatlık edinme konularını içermektedir. Bu çalışma sayesinde Türk Medeni Kanununun, özellikle Hanefi Mezhebine olmak üzere birçok meselede İslam hukuku hükümlerine ters düştüğü sonucuna ulaşılmıştır. Bunlardan en önemlileri: evlilik akdinde siğa'ya değinilmemesi; evlilik akdinde her iki şahidin kadın olmasına veya Müslüman kadının evlilik akdine Müslüman olmayan iki şahidin şahitlik etmesine izin verilmesi; bir erkeğin süt kız kardeşiyle evlenmesine izin verilmesi; çok evliliğin yasaklanması; Müslüman bir kadının Müslüman olmayan bir erkekle evlenmesine izin verilmesi; Müslüman bir erkeğin hiçbir semavi dine inanmayan bir kadınla evlenmesine izin verilmesi; evlilik akdinde mehrin şart koşulmaması; evlatlık edinmenin evlilik engellerinden kabul edilmesi; boşanmış kadının bekleme süresinin üç yüz gün olarak belirlenmesidir. Bununla beraber Irak Ahvali Şahsiye Kanununun İslam hukuku hükümleriyle böyle bir çelişki içerisinde olmadığı; kanun maddelerinin çoğunluğunun Hanefi Mezhebi görüşleri doğrultusunda İslam hukuku hükümleriyle bağdaştığı"
