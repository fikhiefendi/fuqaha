abstract: "Fıkhî kadeler ve kurallar, İslam hukukunda benzer fer'î meseleler genel lkeler altında toplayarak hüküm çıkarma sürecn kolaylaştıran öneml br dsplndr. Bu çalışma, Şâfî mezhebnn önde gelen âlmlernden Hatîb eş-Şrbînî'nn el-İknâʿ adlı esernde yer alan fıkhî kade ve kurallar konusundak tesptlern ortaya koymayı amaçlamaktadır. Araştırma üç ana bölümden oluşmaktadır. Brnc bölümde, Hatîb eş-Şrbînî'nn hayatı ve el-İknâʿ adlı eser tanıtılmış; fıkhî kade, fıkhî kural (zâbt) ve fıkh teors kavramları arasındak farklar açıklanmıştır. İknc bölümde, müellfn esernn farklı bölümlernde açıkça formüle ettğ on sekz fıkhî kade analz edlmş; bu kadelern lafızları, anlamları ve uygulama alanları detaylı bçmde ele alınmıştır. Üçüncü bölümde se badetler, muamelât, ahval- şahsyye ve ukubat konularında geçen fıkhî kurallar tespt edlerek bu kuralların özellkler açıklanmış ve kadelerden ayırt edc yönler ortaya konmuştur. Araştırmada Hatîb eş-Şrbînî'nn fıkhî meseleler dellleryle brlkte ele alma konusundak ttzlğ, fer'î meseleler kade ve kurallarla sstematkleştrme çabasıyla bu alanda öneml br kaynak ortaya koyduğu sonucuna ulaşılmıştır."
