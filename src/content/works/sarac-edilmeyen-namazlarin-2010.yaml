abstract: "İbadetler İslam dininin temel unsurlarındandır. Her ibadetin kendine has kuralları vardır. Önemli bir ibadet olan namaz hakkında bilinmesi gereken pek çok husus bulunmaktadır. Bunlardan birisi de namazın dince belirlenmiş olan vakti içinde ifa edilmesidir. Herhangi bir sebepten dolayı bu görev vaktinde yerine getirilemediğinde bir telafisi olup olmadığı, şayet varsa bu telafilerin nasıl yapılacağı tezimizin konusunu oluşturmaktadır. Araştırmamız sonucunda kılınmayan namazın telafisinin kaza ve tövbe etmek şeklinde uygulandığı tespit edilmiştir. Ölünün namaz borçlarının telafisinde ise farklı yollara başvurulmuştur. Fidye vererek bu borçlardan kurtulmak bir çare olarak düşünülmüştür."
