abstract: "Alacağın zekâtı meselesi İslâm'ın beş temel şartından biri olan zekât ibadeti konusunda Müslümanların karşılaştığı güncel meselelerden biridir. Zekâtın farz olması için gerek zekât mükellefinin gerekse zekât verilecek malın birtakım özelliklere sahip olması gerekmektedir. Bu şartlardan biri de mal ile ilgili olup asli ihtiyaçlar dışında nisap miktarı mala sahip olmaktır. Bu mallara sahip kimsenin alacaklı olarak başkalarında malları olması durumunda alacak durumunda olan bu mallar ihtilaf konusu olmuştur. Bu çerçevede konunun etraflıca ele alınarak, özellikle klasik dönem fakihlerinin öne sürdükleri yaklaşımların tespit edilerek değerlendirilmesi ve modern dönemde ortaya çıkan değişiklerin ortaya konularak güncel yaklaşımların incelenmesi önem arz etmektedir. Bu çalışma zekât ahkâmı açısından alacak konusunu inceleyip meseleye fıkhî ve güncel bir çözüm önermeyi amaçlamaktadır."
