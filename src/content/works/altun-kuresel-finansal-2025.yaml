abstract: "Küresel finansal krizler, geleneksel bankacılık sisteminde ciddi çalkantılara yol açarak finansal istikrarı derinden sarsmıştır. Özellikle 2008 küresel finansal krizi, spekülatif işlemlerin artışı ve yüksek risk içeren finansal ürünlerin yaygınlaşması sebebiyle dünya ekonomileri üzerinde olumsuz etkiler doğurmuştur. Bu süreçte faizsiz bankacılık sistemi, alternatif işleyiş mekanizmaları ve risk paylaşımına dayalı yapısıyla dikkat çekmektedir. Faizsiz bankacılığın temel ilkeleri arasında varlık temelli finansman, spekülatif işlemlerin sınırlandırılması ve kâr-zarar ortaklığı gibi unsurlar yer almakta olup, bu özellikler kriz dönemlerinde söz konusu sistemin daha dayanıklı olmasını sağlamaktadır. Kriz sonrası dönemde faizsiz bankacılık sistemine yönelik artan ilginin sebepleri incelenmektedir. Bu bağlamda, faizsiz bankacılık sisteminin finansal krizler sırasında yatırımcılar için daha güvenilir ve sürdürülebilir bir alternatif sunduğu öne sürülmektedir. Çalışma, faizsiz bankacılık modelinin küresel ekonomik krizler karşısında nasıl bir çözüm sunduğunu ve geleneksel finansal yapılarla kıyaslandığında hangi avantajlara sahip olduğunu ortaya koymayı amaçlamaktadır. Buna ek olarak, faizsiz bankacılığın kriz dönemlerindeki performansı incelenerek gelecekte finansal sistemlerde nasıl daha yaygın bir model hâline gelebileceği incelenmiştir."
