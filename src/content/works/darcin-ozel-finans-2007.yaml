abstract: "Özel finans kurumları, ülkemizde faaliyete geçtikleri 1985 senesinden 16.12.1999 tarihinde 4389 sayılı Bankalar Kanunu'nun kapsamına alınana dek Bakanlar Kurulu Kararına dayalı olarak faaliyet göstermekteydi. Bu gelişme birçok yönden yeterli bulunsa da özel finans kurumlarının ?banka? vasfına net bir tanımlama sunmayışı tartışmaları tümüyle sonlandıramamıştır. Öte yandan ?özel finans kurumu? olarak adlandırılan kurumların bu adlandırmayla son derece yetersiz biçimde tanımlanıyor oluşu ve yanlış çağrışımlara neden olunması yeni isim arayışlarına yol açmıştır. Nihayet katılım bankacılığı kavramı ortaya atılmış ve kısa sürede kabul gören bir tanımlama haline gelmiştir. 5411 sayılı Bankacılık Kanunu ile özel finans kurumları ?katılım bankası? adını almış ve böylece bu bankalar için yeni bir dönem, katılım bankacılığı dönemi başlamıştır. Türk bankacılık sektöründe yer alan üç banka türü; mevduat bankaları, kalkınma ve yatırım bankaları ile katılım bankalarıdır. Bilanço büyüklüğü açısından katılım bankaları 2007 yılının ilk yarısı itibariyle bu üç banka türünden oluşan bankacılık sektörümüzün yüzde 3,2'sini oluşturmaktadır. Bu oranın toplam içinde büyük bir yer tutmamasına rağmen hemen her yıl istikrarlı olarak artış gösterdiği göz önünde bulundurulduğunda katılım bankacılığının ilerleyen yıllarda bankacılık sektöründe ağırlığını artırması muhtemeldir.Bu çalışma ile, özel finans kurumlarının katılım bankalarına dönüşmesini netice veren yasal düzenlemenin doğurduğu hukuki sonuçlar ve bu değişimin kamu oyunun bu kurumları algılayış şekline ne yönde etki ettiğinin ortaya konması amaçlanmıştır."
