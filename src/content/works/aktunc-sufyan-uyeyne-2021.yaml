abstract: "Süfyan b. Uyeyne hicri ikinci yüzyılın bilinen önemli ulemasından biridir. Bu çalışmada etbâu't tâbiîn döneminin önemli isimlerinden olan Süfyân b. Uyeyne el Hilalî'nin fıkhî görüşleri tespit edilerek Hanefî mezhebi ile karşılaştırılması yapılmıştır. Bu amaçla hadis kaynakları, tabakât, mezhep ve çeşitli tefsir kitapları araştırılmış, bunlar içerisinde dağınık halde bulunan bilgilerden faydalanılmıştır. Çalışmamız giriş ve iki bölümden oluşmaktadır. Girişte çalışmanın konu, sınır, yöntem ve kaynaklarına değinilmektedir. Birinci bölümde Süfyân b. Uyeyne'nin yaşadığı dönem, hayatı ve ilmî kişiliği hakkında bilgiler verilmektedir. İkinci bölümde temizlik, namaz, zekat, oruç ve hac gibi ibadetlere dair görüşleri Hanefi mezhebi ile karşılaştırılarak genel bir tahlil yapılmaktadır. Üçüncü bölümde Süfyân b. Uyeyne'nin muamelat ve ahvalu'ş şahsiyeye dair görüşlerinin Hanefi mezhebi ile karşılaştırılması yapılmıştır. Ayrıca sonuç bölümünde karşılaştırma tablolaştırılarak okuyucuya kolaylık sağlanması amaçlanmaktadır."
