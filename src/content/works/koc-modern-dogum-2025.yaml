abstract: "Aile planlaması ve doğum kontrolü uygulamaları günümüzde birçok ailenin ‎gündelik yaşamında yer almaktadır. Ancak doğum kontrolünde uygulanan bazı ‎yöntemlerin bireylerin fiziksel ve dini hayatları üzerinde etkileri bulunmaktadır. ‎Özellikle modern doğum kontrol yöntemleri, uygulama biçimleri ve tıbbi özellikleri ‎nedeniyle daha fazla etkiye sebep olabilmektedir. Bu durum söz konusu yöntemlerin ‎İslam fıkhı açısından ayrıntılı biçimde değerlendirilmesini gerekli kılmaktadır.‎ Bu çalışmada modern doğum kontrol yöntemleri esas alınarak her bir yöntemin ‎İslam hukukuna göre fıkhi değerlendirilmesi yapılmıştır. Değerlendirme sürecinde ‎‎“beden mahremiyeti, fıtrata müdahale ve ceninin yaşam hakkı”gibi temel fıkhi ilkeler ‎esas alınmıştır.‎ Çalışmanın birinci bölümünde doğum kontrolü, kavramsal, tarihi ve sosyolojik ‎boyutlarıyla ele alınmış; aynı zamanda İslam hukukundaki yerine değinilmiştir. Ayrıca ‎İslam dinine göre mahremiyetin sınırları, bedene yönelik müdahalelerin fıkhi açıdan ‎meşruiyet sınırları ve ceninin yaşam hakkının İslam dinindeki yeri incelenmiştir. İkinci ‎bölümde, modern doğum kontrol yöntemlerinin sırasıyla tıbbi yönleri açıklanmış ve ‎fıkhi meşruiyeti üzerine inceleme yapılmıştır. Değerlendirme bölümünde ise ‎yöntemlerin fıkhi meşruiyet ölçüleri toplu bir şekilde verilmiştir.‎ Sonuç olarak İslam hukukunda doğum kontrolünün direkt olarak ‎yasaklanmadığı, ancak doğum kontrolünde kullanılacak yöntemin mahiyetine göre fıkhi ‎hükümlerde değişiklikler olabileceği sonucuna ulaşılmıştır.‎"
