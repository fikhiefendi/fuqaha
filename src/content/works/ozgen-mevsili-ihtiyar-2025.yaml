abstract: "İslam hukuku, Müslümanların hem bireysel hem de toplumsal hayatlarını düzenlemeyi amaç edinmiştir. Bu hukuk sistemi içinde önemli bir yere sahip unsurlardan biri de, fer'î meseleleri genel ilkeler altında toplayan fıkıh kaideleridir. Bu kaideler, benzer meseleleri ortak mantık çerçevesinde anlamaya ve çözmeye yardımcı olur. Bu haliyle kaideler, hem teorik hem de pratik açıdan İslam hukukunun anlaşılmasında büyük katkı sağlar. Bu yönüyle söz konusu kaidelerin mahiyeti, tarihi gelişimi, kaynakları, delil değeri ve fıkıh eserlerindeki yeri üzerine yapılacak derinlemesine incelemeler büyük bir önem arz etmektedir. Çalışmamızda fıkıh kaidelerinin klasik fıkıh eserlerindeki fonksiyonu ele alınmış olup, bu amaç doğrultusunda Mevsılî'nin el-İhtiyâr li-Ta'lîl'il-Muhtâr adlı eserinin borçlar hukukuna dair bölümleri incelenmiştir. İlgili bölüme geçmeden ilk olarak kaide kavramının tanımı, tarihi gelişimi, özellikleri ve kaynakları açıklanmıştır. Ardından Mevsılî'nin, eserinde kullandığı fıkıh kaideleri tespit edilmiştir. Bu kaidelerin ne amaçla ve hangi bağlamda kullanıldığı analiz edilmiştir. Ayrıca bu kaidelerin Hanefî mezhebi literatüründeki geçmişi araştırılarak Mevsılî'nin bu kaideleri özgün biçimde mi kullandığı yoksa önceki eserlerden mi iktibas ettiği ortaya konmuş, bazı kaidelerde müellifin özgün katkısının olduğu tespit edilmiştir. Bu nedenle çalışmamızda Mevsılî'nin, kavâid literatüründe önemli bir konuma sahip olduğuna, fıkıh kaidelerinin hüküm çıkarma sürecindeki yol gösterici rolünü ortaya koymakla birlikte fıkıh kaidelerinin oluşması, anlaşılması ve uygulanmasında katkısının olduğuna dikkat çekilmiştir."
