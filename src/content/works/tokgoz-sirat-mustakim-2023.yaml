abstract: "Zamanın koşullarına göre belirli dönemlerde bazı tartışmalar öne çıkmıştır. Özellikle II. Meşrutiyet ilan edildiğinde insanlar arasında“hürriyet, müsâvât, adalet”gibi söylemler gelişmiştir. Bu söylemlerle birlikte batı tarzı düşünceler de insanlar arasında konuşulmaya başlanmıştır. 1908 ile 1925 tarihleri arasında yayın faaliyetinde bulunan Sırât-ı Müstakîm ve Sebîlürreşâd dergilerinin çıktığı dönemde İttihat ve Terakkî yönetiminin batıya yaklaşımı ile birçok tartışma meydana gelmiştir. İttihat ve Terakkî, asr-ı saadetle bağları koparmadan fakat yaşanan çağa da ayak uydurma olarak değerlendirilen bazı söylemler geliştirmişlerdir. Bu düşünceler, insanlara ulaşma aracı olarak görülen gazete ve dergilerde de tartışılmıştır. Bu tartışmalar -kadınların tesettürü, talak, teaddüd-i zevcât (çok eşlilik)- Sırât-ı Müstakîm ve Sebîlürreşâd dergilerinde de ele alınmıştır. İttihat ve Terakkî ile bağı bulunan Mansûrîzâde, teaddüd-i zevcâtı Avrupalıların kurûn-ı vusta vahşeti olarak nitelediklerini, kimsenin teaddüd-i zevcâtın İslâm'da emir olmadığını söylemediğini ifade ederek teaddüd-i zevcâtın ülü'l emr tarafından menedilmesi gerektiğini söylemiştir. Bu söyleme karşılık Babanzâde, Mansûrîzâde'yi Avrupalılara şirin gözükme gayreti içerisinde olduğunu belirterek teaddüd-i zevcâtı ülü'l emr yasaklayamaz demiştir. Babanzâde'nin karşılık vermesiyle tartışma daha çok ülü'l emrin teaddüd-i zevcâtı menetme yetkisinin olup olmadığı etrafında şekillenmiş olup verilen hükümler doğrultusunda tartışma genişlemiştir. İzmirli devreye girerek cevaz hakkında yazılar kaleme almıştır. Ayrıca Aksekili Ahmed Hamdi, teaddüd-i zevcâtın İslâm'ın bir ruhsatı olduğu ile alakalı makaleler yazmakla beraber uygulamanın doğru yapılmadığını belirtilerek yanlış uygulamalarla İslâm'ın kötülenemeyeceğini belirtmiştir. Teaddüd-i zevcâtın eski toplumlar dahil günümüzde Hristiyan bir grup olan Mormonlar gibi topluluklarda uygulandığı görülmüştür. Yine Hristiyanlar tarafından teaddüd-i zevcât meselesini İslâm'ı kötü göstermek maksadıyla misyonerlik faaliyetlerinde kullanıldığından bahsedilmiştir. Diğer taraftan bazı gayri müslim yazarlar tarafından teaddüd-i zevcât desteklenmiştir. Teaddüd-i zevcât uygulaması olmayan toplumlarda kadınların fuhşa sürüklendiği söylenmiştir. St. Beris'in savaştan dolayı Almanya'da teaddüd-i zevcâtın konuşulduğunu ifade etmiş, Mr. Stuart – Glennie teaddüd-i zevcatı savunarak faydalarından, Avrupalıların ahlâkı bozduklarından bahsetmiştir. Edward Monte İslam'ın güzelliklerinden bahsederken teaddüd-i zevcâtı da zikretmiştir."
