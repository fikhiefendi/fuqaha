abstract: "Bu çalışma,2008 ve 2018 arası Birleşik devletlerdeki, Malezya'daki, Endonezya'daki, Amerika'daki ve tüm dünyadaki geleneksel ve islami endekslerin performansını karşılaştırmaktadır. Tüm pazarlarda geleneksel ve islam endeksleri arasında güçlü bir pozitif ilişki olduğu bulunmuştur. Ayrıca, Jakarta borsası dışında, geleneksel ve Islamik endeksler arasındaki ortalama getiri arasında önemli bir fark bulunmuyor. Kriz dönemindeki ve sonrasında endekslerin performansını karşılaştıracağımız zaman, karisik sonuclar elde edilmistir. Birleşik devletlerde ve Malezya'daki geleneksel ve İslami endeksler arasında iki yönlü veya tek yönlü bir ilişki yoktur. Birleşik krallık ve Endonezya için, geleneksel ve İslami endeksler arasında çift yönlü bir ilişki vardır. Bu pazarlar için, islamik indeks grangerinin konvansiyonel endekse ve tersine yol açtığı sonucuna varabiliriz."
