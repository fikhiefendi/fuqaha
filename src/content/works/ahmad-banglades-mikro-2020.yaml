abstract: "Bu tez çalışması Bangladeş'teki mikro finans faaliyetlerini analiz etmeyi amaçlamaktadır. Ayrıca çalışma, genel çerçevede İslami mikro finansın vaka çalışması odaklı temel düzeydeki etkisini incelemektedir. Bu tez ikincil verilere dayalı nitel yöntemle analiz edilmiştir. Bangladeş'in bağımsızlığından bu yana, ülkenin ekonomik hareketliliğinde birçok iniş ve çıkış yaşandığı görülmektedir. Özellikle bu bağlamda son yıllarda ülkenin kişi başına düşen milli geliri yaklaşık iki bin ABD dolarını aşmakta olduğu gözlenmektedir. GSYH'de tüm kalkınma göstergeleri yukarı yönlüdür. Ekonomik büyüme istikrarlı biçimde yüzde 7'den fazla gerçekleşmektedir. Gelişmekte olan ülke statüsünde olan Bangladeşin ekonomik büyümesinde, mikro finansman konusu önemli yer tutar. Bangladeş'te 1980'lerden bugüne kadar mikro finans hizmetlerinin gelişmesiyle yoksulluk oranı düşmekte ve olumlu sonuçlar gözlenmektedir. 1991 yılında %57 olan toplam yoksulluk, yıllık ortalama %120 oran düşüşle 2018 yılına kadar % 21'e kadar inmiştir. Bu tezde Bangladeş'in son otuz yılda mikro finans alanında büyük bir ilerleme kaydettiği gösterilmektedir. Son yirmi yıl boyunca, İslami mikro finans birçok ülkede geleneksel mikro finansın yanı sıra sosyo-ekonomik kalkınmada önemli rol üstlenmiştir. Bu tezde İslami mikro finansın zekât, sadaka ve vakıf gibi yardım finansman araçlarıyla yoksulluğun azaltılmasındaki rolü açıklanmıştır. İslami mikro finans kurumları ayrıca karz-ı hasen, murabaha, mudarebe, tekafül, ijarah ve selem gibi İslam hukuku prensiplerine dayanarak çeşitli yöntemler vasıtasıyla mikro kredi sunmaktadır. İslami mikro finans girişimcileri finanse ederek ekonominin güçlendirilmesini desteklemekte ve muhtemel riskleri paylaşmaktadır. Bu doğrultuda 2030 Sürdürülebilir Kalkınma Hedefleri'ne ulaşmada İslam mikro finans için büyük bir potansiyel bulunmaktadır."
