abstract: "Kıraat, Kur'ân'ın daha iyi anlaşılması için mutlaka üzerinde durulması gereken önemli bir ilim dalıdır. Kur'ân-ı Kerîm'in nüzûlünden bugüne Kur'ân'ı daha iyi anlamaya çalışan bilim insanları her biri kendi alanıyla alakalı önemli çalışmalar yapmıştır. Fıkıh ilmiyle alakalı araştırmacılar kıraatin ahkâm âyetleri boyutuyla, tefsir ilmiyle uğraşanlar Kur'ân'ın tamamının daha iyi anlaşılması için çalışmalar yapmışlardır. Yapılan bu çalışmada döneminde önemli bir fakih olan Ebû Ca'fer et-Tahâvî'nin Mısır'da önemli çalışmalar yapmış olması hem de ahkâm âyetlerinin daha iyi anlaşılması için Ahkâmü'l-Kur'ân adlı bir çalışmasının bulunması bizi bu konu üzerinde çalışmaya sevk etmiştir. Çalışma yapılırken ahkâm âyetlerindeki kıraat farklılıkları verildikten sonra anlama ne gibi bir farklılık kazandırdığı, bu farklılıklarından hangisinin tercih edildiği ve bu farklılıklar sebebiyle mezheplerin görüş ayrılıkları üzerinde durulmaya gayret edilmiştir. Yukarıdan da anlaşılacağı üzere yapılan bu çalışmada temel amaç; kıraat ilminin ahkâm âyetleri üzerindeki etkisinin daha iyi anlaşılmasıdır. Çalışmada temel olarak Tahâvî'nin bu eseri kullanılmış ve ahkâm âyetleri detaylı bir şekilde incelenmiştir. Çalışma yapılırken Ahkâmü'l-Kur'ân eserine ek olarak kıraat ilminin temel kaynaklarından faydalanılmış, ayrıca bu kıraat farklılıklarının anlama etkisi verildikten sonra mezheplerin görüşlerine de yer verilmiştir. Özellikle bazı kıraat farklılıkları o ahkâm âyetini açıklarken mezhepsel olarak ciddi manada ihtilaflar meydana getirmiştir."
