abstract: "Evlilik insanlık tarihi kadar eski bir müessesedir. Nikâh, kadın-erkek arasındaki ilişkiyi meşrulaştıran bir akittir. Aile müessesesi nikâh akdine dayandığından, bu akit semavi dinler ve hukuk sistemlerinde önemli bir yere sahiptir.Araştırmamızda tüm hukuk sistemlerinde önemli bir yere sahip olan nikâh akdinin İslam Hukuku açısından dini ve hukuki boyutlarını incelemeyi amaçladık.Aile hukukuyla ilgili hükümlerde din-hukuk-ahlak kurallarının yakın ilişkisinden dolayı kesin sınırlarla hükümleri ayırmak mümkün olmasa da farz, kısmen vacip, mekruh, haram gibi kavramların dini, fesat ve butlan kavramlarının da hukuki olduğu söylenebilir. Bu bağlamda muharremat, velime verilmesi, hutbe okunması gibi konuların nikâhın dini yönüne delalet ettiği kabul edilebilir.Nikâh akdinde gerekli şartların bulunup bulunmamasına göre fesat, butlan gibi hükümlerle değerlendirilmesi ise nikâhın hukuki yönü olarak belirtilebilir. Aile hukukuyla ilgili naslarda dünyevi cezalarla birlikte uhrevi cezalarında zikredilmesi, haram-helal, günah-cünah şeklinde dini kavramların kullanılması, bu alandaki konularda dini hüküm ve hukuki hüküm olmak üzere iki değerlendirme yapılabileceğini göstermektedir."
