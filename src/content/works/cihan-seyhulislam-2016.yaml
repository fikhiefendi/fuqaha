abstract: "İslam fıkhının hem bilgi hem de yürürlük kaynağı olan fetvalar, fıkıh-toplum ilişkisine dair en mühim kaynağı teşkil etmektedir. Fetvâ-yı Şerîfe olarak tavsîf edilen şeyhülislâm fetvaları ise, sâir fetvalar arasında, değer ve bağlayıcılık açısından en üst sırada yer almaktadır. Osmanlı Devleti'nin yetmiş yedinci şeyhülislâmı olarak kayıtlara geçen Menteşizâde Abdürrahim Efendi, günümüze en fazla fetvası nakledilen şeyhülislâmdır. XVIII. yüzyılın ilk çeyreğine tekâbül eden görev süresi içerisinde kendisine yöneltilen suâllere verdiği fetvalar Fetâvâ-yı Abdürrahim olarak isimlendirilen derlemede bir araya getirilmiştir. Bu çalışmada Fetâvâ-yı Abdürrahim'den hareketle, XVIII. yüzyılın başlarında Osmanlı Devleti'nin hukukî hayatının alt dallarından arazi ve vergi düzeni ele alınmaktadır. Bu tez ile fıkhın, iktisadi ve sosyal hayat ile münâsebetini ve şeyhülislâmın dönemin meselelerinin çözümündeki rolünü araştırmak hedeflenmektedir. Anahtar Kelimeler : XVIII. yüzyıl, Fetâvâ-yı Abdürrahim,Arazi, Vergi"
