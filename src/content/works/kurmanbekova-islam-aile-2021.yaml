abstract: "Aile toplumun en önemli kurumudur. İnsanın doğup büyüdüğü ve ilk adımlarını attığı küçük bir topluluktur. Bu topluluğun en önemli ve değerli şahısları karı-kocadır. Dolayısıyla erkek ve kadının evlenmesiyle toplumdaki neslin devam edebilmesi sağlanmaktadır. Bu evliliğin neticesiyle de kadın ve erkeğe bir takım sorumluluk ve haklar yüklenmektedir. İslam'da kadın ve erkeğin kendi özel durumlarına göre hak ve sorumlulukları vardır. Ancak hukuk önünde eşittirler. Zira Allah kadın ve erkek arasında bir ayırım yapmamaktadır. Buna göre müslüman topluluğunda kadının yeri ve değeri diğer din ve kültürlerden farklıdır. Müslümanlarda kadının yeri ve önemi büyüktür. Ancak diğer din ve medeniyetlerde kadının yeri farklıdır. Örneğin, Çin, Yunan, Roma medeniyetlerinde kadın erkekten daha aşağı ve geri bir konumda düşünülmektedir. Bazen hayvanlarla eşit tutulmaktadır ve kadınların evlilikle birlikte hiç bir hakkı olmamaktadır. İslam'da ise kadının doğumundan hayatının sonuna kadar hakkı korunmaktadır. Ancak İslam dininde kadınlar her çeşit alanda haklara sahip olmalarına rağmen günümüzde bazı yanlış görüşler olmaktadır. Bu yanlış görüşlerin giderilmesi, kadının hakları ile ilgili olarak toplum arasında bilinen yanlışların düzeltilmesi açısından böyle bir konunun incelenmesi önem arz etmektedir. Çalışmanın konusu“İslam Aile Hukukumda Kadının Mali Hakları”olarak isimlendirilmektedir. İslam hukukunda kadın konusu ğüncel bir konudur. İslam'da kadın hakkı çok geniş bir konu olduğu için aile hukukunda kadınların mali hakları olarak sınırlandırılmıştır. Tez giriş ve üç bölümden oluşmaktadır. Giriş bölümünde araştırmanın amacı, konusu, kavramsal çerçeve ile ilgili bilgi verilmektedir. Birinci bölümde ise İslam'da kadının önemini göstermek için diğer din ve kültürlerde kadın haklarının neler olduğu tespit edilmeye çalışıldı. İkinci bölümde ise kadınların yaşama, eğitim ve terbiye edilme, fikir özgürlüğü, velayet hakkı, iffetini koruması, mut'a hakkı, çocuk sahibi olma gibi genel haklarından bahsedilmiştir. Üçüncü bölümde ise tezin ana konusu olan kadınların mali hakları tespit edildi ve dört mezhebe göre hükümler olarak değerlendirilmeye çalışıldı. Sonuç'ta araştırmada ulaşılan neticelere yer verildi ve bazı öneriler sunuldu ."
