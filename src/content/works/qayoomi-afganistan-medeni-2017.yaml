abstract: "Toplumun temel taşını oluşturan aile kurumunun insanlığa takdim ettiği en önemli hediyesi çocuklardır. İslam'ın ilk kaynağı olan Kur'an-ı Kerim'in vahyi ile birlikte çocuk meselesi yetişkinlikten farklı olarak ele alınmıştır. Batı'da ise, önceleri yetişkinlikten farklı olarak ele alınmayan bu mesele, 18. yüzyıla gelindiğinde ancak müstakil bir alan olarak görülmeye ve özellikle çocuk hakları konusunda çalışmalar yapılmaya başlanmıştır. Biz bu çalışmamızda Afganistan Medeni Kanunu (AMK) hakkında kısa bilgi vermenin yanı sıra çocuk, nesep, radâ, nafaka, hıdâne vb. kavramları da inceledik. Çalışmamız giriş, iki bölüm ve sonuçtan meydana gelmektedir. Birinci bölümde AMK hakkında kısa bir bilgi verilmiş ve çocuk ve ilgili kavramlar teferruatlı bir şekilde ele alınmıştır. İkinci bölümde ise AMK'da çocuğun nesep, radâ, hıdâne ve nafakasına ilişkin düzenlemelerin (217-267) İslam Hukuku açısından değerlendirilmesi yapılmıştır. 1977 yılından bu yana yürürlükte olan Afganistan Medenî Kanununun hazırlanmasında genel manada Hanefi mezhebinin görüşleri esas alınmıştır. Dolaysıyla AMK'daki çocuk hakları ve İslam hukuku açısından değerlendirilmesi başlığı altında ele alınan maddelerin hükümleri de genel manada bu mezhebin görüşüne uygun bir şekilde yapılmıştır. Ancak bazı durumlarda bu mezhebin görüşünün yanında diğer sünnî mezheplerin görüşlerinden de faydalandığı görülmektedir. Ayrıca bu konu ile ilgili düzenlemelerde diğer sünnî mezheplerin içerisinde en fazla Maliki mezhebinin görüşlerinden yararlandığı görülmektedir."
