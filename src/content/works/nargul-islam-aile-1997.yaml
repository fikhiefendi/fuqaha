abstract: "V ÖZET YÜKSEK LİSANS TEZİ İSLAM AİLE HUKUKUNA GÖRE MAL REJİMLERİ Veysel NARGÜL Danışman: Prof. Dr. Hamza AKTAN 1997-SAYFA: 157 Jüri: Prof. Dr. Hamza AKTAN Bilindiği üzere kan koca haklan, islam aile hukukunun en temel konusunu oluşturmaktadır. Biz bu haklan, sadece kan koca mallarının idaresi yani mal rejimleri açısından araştırmamıza konu edindik. Sanayi devrimi ile birlikte değişen sosyal ve ekonomik şartların zorlamasıyla kadınlar aktif çalışma hayatına girmişlerdir. Bunun sonucu olarak kadınlar, aile bütçesine katkı sağlamaya başlamışlardır. Evlilik birliğinin sona ermesi durumunda kan ve kocanın kendilerine ait ekonomik değerlerin ayırımında kadının aile ekonomisine kattığı değerlerin objektif kriterlerle tesbit edilmiş olmasının önem arzettiği görülmektedir. İslam aile hukukunda mal aynlığı esastır. Medeni kanunda kanuni rejim de mal ayrılığıdır. Ancak, mal birliği ve mal ortaklığı seçimlik rejim olarak kabul edilmiştir. Kazanç ortaklığı da bugün alternatif bir sistem olarak tartışılmaktadır. Biz bu çalışmamızda, İslam aile hukukunda mevcut olan mal ayrılığının esas kabul edilmesi gerektiğini; ancak alternatif sistemlerin de, mahzurlan giderildiği ölçüde uygulanabileceği sonucuna vardık."
