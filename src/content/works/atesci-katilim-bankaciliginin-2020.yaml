abstract: "Modern klasik iktisat teorilerinde insanoğlu, sadece çıkarını düşünen, kişisel menfaatine hizmet eden, fayda ve kârını maksimize etmeyi amaçlayan bir varlık olarak tanımlanmıştır.“Homo Economicus”“ekonomik insan”olarak tanımlanan bu insan modeli, çıkarlarını maksimize etmeyi hayatının en temel amacına koymaktadır. Bu model, insanın yatırım noktasında tamamen nefsi duygularını tatmin etmek için hareket ettiği ileri sürülmektedir. Genel olarak iktisat teorileri insanı bu şekilde tanımlamış olmasına rağmen, insanoğlunun yatırım kararlarında her zaman maddi olarak rasyonel davranmadığı gözlemlenmiştir. Bu tür yatırım kararları veren bireylerin hareketleri, klasik iktisat teorilerinde ifade edilen insan modeli ile çelişmektedir. Klasik iktisat teorileri, bireylerin yatırımlarında rasyonel olmadığı kararları açıklamakta zorlanmıştır. Bundan dolayı klasik iktisat teorilerinde boşluk ortaya çıkmıştır. Çünkü insanların yatırım kararlarında risk ve getiri dışında farklı değişkenleri de dikkate aldığı ortaya çıkmıştır. İnsanların bu tür davranışlarını açıklamak ve klasik iktisat teorilerinde oluşan boşluğu doldurmak için“davranışsal finans”kavramı ortaya çıkmıştır. Davranışsal finansa göre insanlar yatırımlarında ekonomik getiri, risk ve kar değişkenleri dışında, psikolojik, kültürel, sosyolojik değişkenlerinde etkisinde karar verebilmektedir. Bu çalışmada Erzincan ilinde bulunan bireysel yatırımcılar üzerinde anket yöntemiyle katılım bankacılığının davranışsal finans kapsamında değerlendirilmesi yapılmaya çalışılmıştır. Katılım bankacılığının tercih edilmesinde etkili olan faktörler davranışsal finans kapsamında incelenmiştir. Bu kapsamda 404 bireysel yatırımcı ile anket çalışması yapılmış olup elde edilen veriler SPSS 22.0 istatistik programı kullanılarak analiz edilmiştir. Anket içerisinde bulunan soruların tamamının betimsel istatistik bulguları elde edilip, ilk olarak demografik, sonrasında katılım bankacılığı ile bulgular ve daha sonrasında katılım bankacılığı ile davranışsal finans arasında oluşturulan hipotezlerin analizi için (One Way ANOVA testi) tek yönlü varyans analizi yapılmıştır. Bireylerin katılım bankacılığını tercih etmelerinde finansal faktörlerin dışında birçok faktörden kuvvetli bir şekilde etkilendiği tespit edilmiştir."
