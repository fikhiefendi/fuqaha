abstract: "Kıyas; Kitap, Sünnet ve icmâ ile tespit edilen hükümleri, illet birliği olan diğer meseleler için genişletmeye yarayan bir yöntemdir. Usul âlimleri arasında bu genişletme işleminin hücciyyeti ve mahiyeti hususunda birçok ihtilaf vardır. Çalışmamız hicrî 5. asırda yaşamış iki büyük Şâfi'î âlim Sem'ânî ve Gazzâlî'nin kıyas hususundaki görüşlerinin mukayesesini konu edinmektedir. Sem'ânî Ḳavâṭıʿu'l-edille adlı eserini fukahâ metoduna göre; Gazzâlî el-Müstaṣfâ adlı eserini mütekellim metoduna göre telif etmiştir. Bu çalışma aynı mezhep birikiminden hareket eden iki müellifin telif metotlarındaki farklılığın etkilerini ortaya koyması bakımından önemlidir. Bu çalışmanın temel amacı bu iki âlimin benimsemiş oldukları fukahâ ve mütekellim metodlarının kıyas anlayışlarına nasıl yansıdığını tespit etmektir. Bunun için şu soruların cevapları aranmıştır: Şâfi'î fakih Sem'anî'nin fukahâ metodunu benimsemiş olması kıyas anlayışına nasıl yansımıştır? Gazzâlî'nin kelamcı kimliği, kıyas konusundaki görüşlerine nasıl yansımıştır? Bu müelliflerin kıyas konusunda ittifak ettikleri ve ihtilafa düştükleri meseleler nelerdir? Müelliflerin üslup ve yöntem konusundaki farklılıkları kıyas konusu çerçevesinde ele alındığında, mensup oldukları Şafiî mezhebine olan bağlılıklarına ne derece etki etmiştir? Sem'ânî'nin ele aldığı hangi mevzulara Gazzâlî eserinde yer vermemiştir? Bunun sebebi telif metotlarındaki farklılık mıdır? Gazzâlî eserinde Sem'ânî tarafından işlenmeyen hangi konulara yer vermiştir? Bu durumun Gazzâlî'nin mütekellim kimliğiyle ilişkisi nedir? Bu araştırmada nitel araştırma tekniklerinden doküman analizi yöntemi kullanılmıştır. Öncelikle her iki müellifin kıyas konusundaki görüşleri tespit edilmiş daha sonra bunlar karşılaştırmalı olarak tahlil edilmiştir. Birinci bölümde kıyasın mahiyeti ve hüccet değeri ile ilgili meseleler; ikinci bölümde illetin mahiyeti ve illeti tespit yöntemleri incelenmiştir. Sonuç olarak kıyasın tanımı, kıyasın hüccet değeri, illetin tespitinde sahih kabul edilen yöntemler hususunda Gazzâlî'nin kelamcı kimliğinin ön plana çıktığı tespit edilmiştir."
