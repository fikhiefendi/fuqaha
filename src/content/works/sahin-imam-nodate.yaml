abstract: "Bu tezde İmam Züfer'in entelektüel biyografisine, ehl-i hadis ile olan münasebetlerine, onun kitaplarına ve itikadî fırkalar ile olan ilişkilerine yer verilmiştir. Ayrıca İmam Züfer'in Hanefî mezhebindeki konumu, mutlak içtihat derecesinde olup olmadığı tartışmaları ele alınmıştır. Özellikle İmam Züfer'in mezhep metinlerinde fazla önemsenmediği izlenimi üzerinde durulmuş ve bunun sebeplerinin neler olduğu tartışılmıştır. Onun kendi metodolojisini oluşturan asıllarına temas edilmiş, Debûsî'nin (ö. 430/1039) zikrettiklerinden farklı on bir asla ve ilgili örneklere yer verilmiştir. İmam Züfer'in mezhep literatürüne bölgesel etkisi ele alınmış, usul ve fürû eserlerinde bu etkinin izleri grafikler üzerinden gösterilmiştir. İmam Züfer'in etkisinin sadece ilk dönem eserlerle sınırlı olmadığı, onun; Osmanlı uleması ve Mecelle'ye kadar süren tesirinin izlerinin gösterilmesine gayret edilmiştir. Birçok âlim tarafından mutlak müçtehit kabul edilen İmam Züfer'in diğer imamlardan farklı ve kendine özgü usulü bulunmaktadır. Tezin hipotezini oluşturan bu iddia üçüncü bölümde ele alınmış ve ispatlanmasına çaba sarf edilmiştir. Fukaha metoduna göre yazılan usul eserlerindeki sistematik esas alınarak oluşturulan başlıklarda İmam Züfer'in usulî ihtilaflarına yer verilmiş ve zikri geçen iddianın ispatlanmasına çalışılmıştır. Onun usulî ayrımlarının tespit edilmesi fürû fıkıhta görülen birçok ihtilafın da temellendirilmesi anlamına gelmektedir. Böylelikle fürû fıkıhtaki pek çok ayrışmanın usulî dayanakları İmam Züfer özelinde gösterilmiş olmaktadır. İmam Züfer, Hanefî mezhebinde kıyasçı kimliğiyle ön plana çıkmış bir müçtehittir. Tezde onun kıyas yaparken en çok hangi kıyas türlerini kullandığı üzerinde ayrıca durulmuştur. Hanefî usul eserlerinde İmam Züfer adına aktarılan veriler dikkate alınmış, ilgili başlıklar altında ve nakillerin elverdiği ölçüde ihtilaflar gösterilmiştir. Böylelikle onu usul düşüncesinin temel kodlarının ve usulî yaklaşımının genel hatlarıyla ortaya konulmasına gayret edilmiştir."
