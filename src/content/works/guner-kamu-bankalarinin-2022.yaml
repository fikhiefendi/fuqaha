abstract: "Dünyada İslami finans veya faizsiz bankacılık olarak bilinen katılım bankacılığı 1985 yılında Özel Finans Kurumları adıyla Türkiye'de faaliyet göstermeye başlamıştır. 2005 yılında banka statüsü kazanan Özel Finans Kurumları 2006 yılında Katılım Bankacılığı adı altında hizmetlerini sürdürmeye devam etmiştir. Türkiye'de 2015 yılına kadar sadece özel sektörde faaliyetlerini sürdüren katılım bankalarına kamu katılım bankaları eklenince sektörde büyüme yaşanmış ve katılım bankacılığı sektörü önem kazanmıştır. Bu çalışmanın amacı kamu bankası olan Ziraat Katılım, Vakıf Katılım ve Emlak Katılım bankalarının katılım bankacılığı sektörüne girişi ve sektörde meydana getirdikleri etkinin ortaya konulmasıdır. Kamu katılım bankalarının sektöre giriş amaçları arasında faize duyarlı bireylerin piyasaya kazandırılması ve sektörün piyasadaki payının arttırılmasıdır. Çalışmada kamu bankalarının sektöre dâhil olmadan önceki ve dâhil olduktan sonraki verileri incelenmiş ve veriler tablolarla gösterilmiştir. Veriler ışığında kamu bankalarının sektörde yer almalarının sonuçları incelenmiştir."
