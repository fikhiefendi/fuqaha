abstract: "Bu çalışmada İbnü'l-Cezerî'nin (ö. 833/1429) et-Temhîd fî 'ilmi't-tecvîd ile en-Neşr fi'l-kırâ'âti'l-'aşr isimli eserlerinin belli bahislerinin mukayesesi esas alınmıştır. Çalışmanın ilk aşamasında İbnü'l-Cezerî'nin faydalandığı ve eserlerinde de yer verdiği kaynaklar taranmıştır. Yazılış dönemleri esas alınarak, kronolojik olarak çok daha önce kaleme aldığı eseri et-Temhîd fî 'ilmi't-tecvîd mümkün olduğunca detaylı bir okumaya tabi tutulmuş, elde edilen bulgular müellifin şaheseri sayılan en-Neşr fi'l-kırâ'âti'l-aşr'ının tecvîd bahisleri çerçevesinde mukayeseli bir analizle akademik manada değerlendirilmeye gayret edilmiştir. Çalışma bir giriş ve iki ana bölümden oluşmaktadır. Giriş bölümünde araştırmanın konusu, amacı, önemi, metodu ve sistematiğine yer verildikten sonra birinci bölüme geçilmiştir. Birinci bölümde; ilk aşamada her iki eserin müellifi İbnü'l-Cezerî'nin hayatı, hocaları ve eserleri üzerinde bir değerlendirme çerçevesi inşasının ardından, tezin asıl konusu olan en-Neşr fi'l-kırâ'âti'l-'aşr ile et-Temhîd fî 'ilmi't-tecvîd isimli eserlerin genel özellikleri hakkında bilgi vermeye odaklanılmıştır. İlgili iki eserin tecvîd bahisleri üzerinden karşılaştırılmalı analizini içeren ikinci bölümde ise sırasıyla; harflerin mahreçleri ve sayıları, harflerin sıfatları, tenvîn ile ilgili hükümler, med ve kasr, vakf ve ibtidâ, edatlar üzerinde vukû bulan vakf ve ibtidâ bahisleri mukayese edilmiştir. Elde edilen bulgular ve bu bulgular üzerinden öngörülen tespit ve değerlendirmeler“Sonuç”başlığı altında akademik dünya ile paylaşılmaya gayret edilmiştir."
