abstract: "Bu çalışma edisyon kritik yani tahkik diye isimlendirilen bir çeşit literatür değerlendirme çalışmasıdır. Araştırmamıza konu olan eser, Hanefî mezhebi alanında yazılmış, dört meşhur metinden birisi olarak kabul edilen el-Muhtâr isimli eserin şerhlerinden Şerhu'l-Muhtâr'dır. Osmanlı fakihlerinden Abdulganî Karabâğî Efendiye ait olan bu el yazma eserin edisyon kritiğini yaparak müellifin usülünü ve eserin muhtevasını değerlendirdik. Çalışmamız dört bölümden oluşmaktadır. Birinci bölüm giriş, araştırmanın amacı, kapsamı, yöntemi ve müellif Abdulganî Karabâğî'nin hayatı hakkındadır. İkinci bölümde eserin yazılış nedeni, ihtiva ettiği konular ve bu konuların işleniş tarzından bahsedilmiştir. Üçüncü bölümde Karabâğî'nin fıkhî tercihleri, mezhep içi tercihleri bu tercihlerde kullandığı lafızlar ve diğer mezheplere yaptığı atıflar ele alınmıştır. Son bölüm olan dördüncü bölümde ise Şerhu'l-Muhtâr'ın eldeki mevcut nüshası ve tahkikte izlenen yol anlatılmıştır."
