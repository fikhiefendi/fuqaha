abstract: "Irak'ta başlayan Hanefî mezhebi, 3/9. asırda Ebû Hanîfe'nin öğrencilerinin Mâverünne-hir'e gelişiyle birlikte bu coğrafyada tanınıp kabul görmeye başlamıştır. Ancak Ebû Hanîfe ve onun fıkıh akademisi tarafından ortaya konan hükümler, Irak kültür ve şartları ışığında şekillendiğinden, bu hükümleri yeni bir coğrafyaya entegre etmek, beraberinde bazı uyum sorunları da doğurmuştur. İşte tam da bu noktada nevâzil, vâkıât ya da fetâvâ şeklinde isimlendirilen, doktrini besleyen önemli bir kaynak haline gelmiş yeni bir litera-tür ortaya çıkmıştır. 4/10. asırda Mâverâünnehir'de oluşmaya başlayan bu zengin litera-tür, Moğol istilasına kadarki süreçte kendini geliştirip normatif bir yapı kazanmış, sonraki dönemde de içtihadın parametlerini belirleyen yönüyle Bağdat, Şam, Anadolu gibi coğ-rafyalarda kaynak olarak kullanılmış, eğitim müfradatlarında yardımcı kaynak vazifesi görmüş, hatta Osmanlı Hukuk düşüncesinin şekillenmesine katkı sağlamıştır. Nevâzil li-teratürü ile bir yandan karşılaşılan sorunlara yeni çözümler üretilirken, bir yandan da Ebû Hanîfe ve akademisi tarafından üretilen ilk fıkhî birikimi daha iyi anlama ve onu rehber edinme yoluna gidilmiştir. Bunun sonucunda, kurucu imamların görüşleri kurucu, nevâzil ise boşluk doldurucu bir işleve sahip olmuştur. Bu tez, kapsamlı bir nevâzil eseri olan ve farklı bölgelerden mesâilin derlendiği Fetâvâ-i Velvâliciyye'nin Hanefî nevâzil literatü-ründeki yerini konu almaktadır. Bir şeyin konumunu tayin etmek o şeyin bulunduğu yeri tanımakla mümkün olacağından, ilk bölümde Hanefî nevâzil literatürü hakkında genel bilgi verilmiştir. İkinci bölümde Fetâvâ-i Velvâliciyye'nin muhtevâ, yöntem, üslûp ve kaynaklık değeri gibi açılardan literatür içindeki yeri incelenmiş, son bölümde ise nevâzil literatürü hakkında somut bir örnek oluşturmak ve bir nevâzil eserinde meselelerin ele alınış tarzını göstermek amacıyla Fetâvâ-i Velvâliciyye'den örnekler sıralanmıştır."
