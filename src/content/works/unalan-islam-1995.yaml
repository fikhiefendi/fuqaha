abstract: "ÖZET Tezin Konusu,“Islam Hukuku Açısından Hak ve Hakkın Kötüye Kullanılması”dır. Çalışmamız dört bölümden oluşmaktadır. Birinci bölümde hakkın mahiyeti, ortaya çıkışı ve unsurlarını ele aldık. Hak kavramı bütün toplumlarda en önemli konulardan biridir. Hak anlayışı, hakkı bulma arayışı, insana dinamizm kazandırmaktadır. Bu kavram, bütün dillerde en çok kullanılan kelimelerdendir, islam dininin temel kaynaklarını teşkil eden Kur'an-ı Kerim ve hadis-i şeriflerde de, önemine binaen hak kelimesi çok geçmektedir. Hak kavramı; uygunluk, doğruluk, adalet emek, vecîbe gibi değişik birçok anlamda kullanılmaktadır. Gerek sözlük ve gerek terim anlamlarının özünde, mutabakat yani uygunluk manası bulunmaktadır. Bu kavram, islam Hukuku ile Modem Hukukta birbirine benzer birçok şekilde tarif edilmiştir. Bunların içinde en uygun olanı,“hak öyle bir aitliktir ki kanun onunla kişiye ya bir yetki tanır ya da başkasını o kişiye karşı yükümlü kılar”şeklindeki tariftir. Bütün haklarda“hak sahibi”,“hak konusu”ve“hakkın kendisine karşı dermeyan edilebileceği taraf1 olmak üzere üç unsur bulunmaktadır. Hak sahibi şahıslardan ibarettir. Şahıslar ise, ”hakîkî şahıslar“ ve ”hükmî şahıslar“ olmak üzere iki kısımdır. Hakikî şahıslarda haklara ehliyet insanın ana rahmine düşmesiyle başlar ve ölümle sona erer. Hükmî şahıslarda ise bu, şahsiyetin oluşması üe başlar ve şahsiyetin fesih ya infisahı ile sona erer. Zamanaşımı da, hakların düşmesine neden olan önemli bir husustur, islam hukukunda çoğunluğa göre zamanaşımı, hakların tamamen düşmesi için değil, sadece davaya bakılmaması için bir neden olmaktadır. Asıl olan, hakların yargı kanahyla korunup atmması ve ”bizzat ihkak-ı hak“ cihetine gidilmemesidir. Ancak ”diyânî hakk“a yer veren islam hukuku bazı şartlara bağlı olarak bizzat ihkak-ı hakka cevaz vermiştir. Modern hukukta ise daha dar bir çerçevede sadece istisnaî bazı durumlarda bu uygulamaya izin verilmiştir. ikinci bölümde hakkın kısımlarını inceledik : islam hukuku açısından haklan sahipleri, konuları, devredilip edilmemeleri ve yargı müeyyidesi gibi değişik açılardan birçok kısımlara ayrılmaktadır. Sahibi açısından hak, ”Allah hakkı“, ”kul hakkı“ ve ”ortak hak“ olmak üzere üç kısma ayrılmak tadır. Konusu açısından hakkın; ”malî olan hak - malî olmayan hak“, ”şahsî hak - aynî hak“, ”mutlak hak - nisbî hak“ gibi kısımları bulun maktadır. Modern hukukta olduğu gibi islam hukukunda da ”fikrî haklar“ ve ”şahsiyet hakları“ kabul edilmiştir. üçüncü bölümde hakların kaynakları üzerinde durduk : Şahsî hakkın(borçlanmanın) kaynaklan; akit, münferit irade, haksız fiil, sebepsiz kazanç şeklinde sıralanabilir. Aynî hakkın kaynaklan ise akit münferit irade, ihraz, ölü toprakları işlenir hale getirmek, av ve benzerleri, şufa, üreme, değiştirme, iare, icare, vakıf, vasiyet ibaha, ikta', miras gibi hususlardır. Çoğunluğa göre sayılı olduklan söylenen irtifak. haklarının kaynağı ise, genelde ya tek taraflı irade ya da komşu olmadır. Dördünce bölümde hakkın kötüye kullanılması ele aldık : Normal olan, hakların başkasına zarar vermeyecek şekilde ve hakkın sari' tarafından veriliş gayesine uygun olarak kullanılmasıdır. Haklar, bu şekilde kullanılmadığı takdirde kötüye kullanılmış olur. Hakların mutlak olup olmaması konusunda iki görüş vardır : Ferdiyetçi görüşe göre haklar mutlaktır. Başkasına zarar versin veya vermesin kişi, hakkını istediği şekilde kullanabilir. Bu görüşe göre, hakkın kötüye kullanılmasının hukukta yeri yoktur. Sosyal görüşe göre ise, haklar mutlak değildir. Kişi,, hakkını başkasına zarar vermeyecek şekilde kullanmalıdır, işte hakkın kötüye kullanılması yasağı da bu görüşe dayanmaktadır. Hakkın kötüye kullanılması ilkesi, eski ve yeni hukuklarda dar veya geniş, çerçevede yer almıştır, islam hukukunda, bu isim altında olmasa bile, bu kural, uygulamada en geniş anlamıyla işlemiştir. Genelde, bütün islam hukuku ekollerinde uygulanan ”zerai'“ ve ”hile“ kuralları da, aslında bu ilke kapsamına girmektedir. Hz. Peygamber (S.AVJin ”zarar vermek ve zarara zararla karşılık vermek yoktur\" anlamındaki hadisi, bu ilkenin başlıca kaynaklarından biriniteşkil etmektedir. Ayet hadis ve sahabe uygulamalarında daha bunun birçok örnekleri bulunmaktadır. Hakkın ötüye kullanılması yasağının müeyyidesi,- öncelikle meydana gelmiş bir zarar varsa bunu ortadan kaldırmaktır; bu mümkün değilse, tazminat yolu üe zararı telafi etmektir. Aynca hakim tarafından uygun görülecek bir ceza (ta'zîr) da verilebilir. islam'a göre bütün suçların, dünyevî cezaları yanında uhrevî cezaları da vardır, ki bunlar da, dünyevî cezalar gibi caydırıcı olmalan açısından büyük önem taşımaktadır. II"
