abstract: "Fransa'da başlayan medeniyet tartışmalarının toplumsal hayata yansımalarıyla beraber, toplumun kendi sosyo-mekanına bakılmaksızın tekdüze bir şekilde ele alınması, insanların Batılılaşma isteğini beraberinde getirmiştir. Osmanlı'nın Tanzimat Dönemi'ne denk gelen medeniyet tartışmaları, II. Meşrutiyet Dönemi'yle birlikte daha da artmış, hâkim olan modernizm ve eşitlik havasıyla birlikte kadının eğitimi, tesettürü, aile hayatı, sosyal yaşamı, teaddüd-i zevcat gibi konular gündeme gelmiştir. Döneme damgasını vuran özgürlükçü havada, fikir hürriyeti bağlamında ortaya çıkan akımlar içerisinde en popüler olanlardan birisi de İslâmcılıktır. Mehmed Âkif'in başmuharrirliğini üstlendiği Sırât-ı Müstakîm dergisinde, dönemin İslâmcı aydınları tarafından kadın konusu detaylı bir şekilde ele alınmıştır. Dergide, Batılılaşmanın olumsuz yönlerine karşı İslâmî kimliği koruyucu bir yaklaşım benimsenmiş; aynı zamanda kadının eğitim ve sosyal hakları desteklenerek toplumsal statüsünün güçlendirilmesi hedeflenmiştir. Bu çalışmada, Sırât-ı Müstakîm dergisinde kadınla ilgili yazılar fıkıh usulü kaynak ve kaidelerine göre incelenmiş, dönemin modernleşme talepleriyle İslâmî ilkelerin dengeli bir şekilde nasıl birleştirildiği ortaya konmuştur."
