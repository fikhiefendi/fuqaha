abstract: "Telif metotları zamana, müellife ve konusuna göre değişiklikler arz eder. Bunlar arasında karışık ve düzensiz bir metni yeniden düzenlemek anlamına gelen tertip, en etkili bir telif metodudur. Bu metot Hanefî fıkıh yazıcığında da başarı ile denenmiştir. Çalışmamız giriş ve dört bölümden oluşmaktadır. Giriş bölümünde araştırmanın mahiyet, amaç, önem, muhteva ve yönteminden bahsedilmektedir. Çalışmamızın omurgasını oluşturan birinci bölümde Hanefî Fıkıh Yazıcılığında takip edilen metotlar, telif çeşitleri, tertibin tanımı, amacı, faydası ve tertib çeşitleri detaylı bir şekilde ele alınmıştır. İkinci bölümde fıkhın furû', usûl, kavaid ve lügat bölümlerinden birer örnek gösterilmiş ve her bir örnek etraflıca incelenmiştir. Üçüncü bölümde tertib örneği olarak sunduğumuz el-İkdü'n-nazîm adlı eserin müellifi olan Mustafa b. Hayreddin'in hayatı, ilmî kişiliği, eserleri ele alınmış ve eser metodolojik yönden incelenmiştir. Çalışmamızın dördüncü bölümünde ise, eserin müellif nüshası esas alınarak diğer nüshalarla karşılaştırmak suretiyle İSAM tahkik kurallarına göre tahkiki yapılmıştır."
