abstract: "Devlet aygıtları içinde bireysel ahlaki sorumluluk, insan hayatına mal olan derin sonuçlarıyla birlikte önemli bir mesele olarak öne çıkmaktadır. Bu mesele özellikle Holokost'tan sonra dikkat çekmiş (Arendt, 1963) ve ahlaki sorumluluğun yokluğu için iki temel açıklama ortaya atılmıştır: pozitivist mazeret ve epistemik mazeret (Luban, 1992). Pozitivist mazeret, verilen emirlerin meşruiyeti ve yasallığıyla ilgilenirken; epistemik mazeret, devlet aygıtlarının nasıl yapılandırıldığına dair teknik ayrıntılara odaklanır. Siyasi teorinin yaşadığı krizi göz önünde bulundurarak (Bakshi, 1998), bu tez, bireysel ahlaki sorumluluk sorununu yeniden düşünmek için İmam el-Karâfî'den türetilen karşılaştırmalı bir İslamî model sunmaktadır. Bu yeniden düşünüm özellikle Althusser'in“baskıcı devlet aygıtları”(Althusser, 1973) olarak adlandırdığı yapılar bağlamında ele alınmaktadır. İmam el-Karâfî, insan toplumunu esas olarak bir ahlaki varlıklar topluluğu (body-moral) olarak yeniden tanımlar ve merkeze, bireyin ilahî olana karşı taşıdığı ahlaki yükümlülük olan taklîf kavramını yerleştirir. Bu, Hallaq'ın İslam yönetişimi tasvirine de uygundur (Hallaq, 2013); zira el-Karâfî'ye göre siyasal alan yalnızca yaratılışın ahlaki amacı olan el-Hakk'a hizmet etmek için vardır. Taklîf'in üstünlüğünden doğan ilahî kaynaklı bireysel yetkiler, siyasal aygıtların doğasını ve yapısını kökten dönüştürür. Bu aygıtlar, ahlaki failiyetin askıya alındığı yerler olmak yerine, doğrudan bireysel ahlaki sorumluluk üzerine inşa edilir; bu da pozitivist ve epistemik mazeretlerin doğal olarak geçersiz hale gelmesine yol açar. Bu karşılaştırmalı model, söz konusu iki mazeretin birbirinden bağımsız değil, aksine aynı yapısal sorunun iki farklı tezahürü olduğunu ortaya koyar. Her ikisinin de kökü, insan toplumunu esas olarak düzen ve istikrara yönelen bir siyasi beden (body-politic) olarak yeniden tanımlayan modern egemenlik kavramına dayanır. Oysa İmam el-Karâfî'ye göre, baskıcı devlet aygıtlarında itaat hiyerarşisi ve görev bölüşümü gibi kurumsal özellikler, bireysel ahlaki yargıyı ve sorumluluğu ortadan kaldırmaz. Ancak egemenliğe dayalı bir siyasi yapıda, bu tür özellikler, doğaları gereği değil, egemenlik anlayışının bu aygıtların özüne ve tasarımına olan etkileri nedeniyle bireysel ahlaki sorumluluğun önünde engel haline gelir."
