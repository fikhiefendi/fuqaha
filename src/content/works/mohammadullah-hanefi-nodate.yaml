abstract: "Hanefi mezhebi içinde bölgesel fıkıh ekolleri vardır. Fakihlerin vefat tarihleri dikkate alındığında Irak ekolünden sonra bu ekollerin en kadimi kuşkusuz Belh ekolüdür. Söz konusu ekol hem usul hem de füru açıdan Hanefi fıkhının gelişmesine katkıda bulunmasına rağmen birkaç spesifik makale dışında hiçbir çalışma yapılmamıştır. Çalışmada, Belh ekolünün özel örf ve ehl-i rey içindeki konumlarını ele alan makaleleri de kuşatacak şekilde Belh'te bölgesel bir ekolün oluşup oluşmadığı konusu klasik fıkıh kitaplarında geçen füru fıkıh meseleleri yardımıyla incelenmiştir. Çalışma neticesinde Belh'te Hanefi mezhebi içindeki en kadim bölgesel ekol olan Hanefi Belh ekolünün varlığı ve müstakil oluşu ortaya konulmuştur. Hanefi mezhebinin oluşumundan hemen sonra ve hatta aynı dönemde bu şekilde müstakil ekolün ortaya çıkışı, Hanefi mezhebi tarafından yadırganmadan Belh müçtehitlerine ait ihtilaflı fıkhî meseleler mezhebin fıkıh kitaplarında da zikredilmiştir. Bu da gösteriyor ki Hanefi mezhebi içindeki müçtehitler her ne kadar kendi aralarında bilimsel olarak çekişseler de aralarındaki dostane ilişkileri ve karşılıklı saygıyı bırakmamışlardır. Belh fıkıhçılarının fıkhî meseleleri ortaya koyarken başka bölgelerden özellikle Irak ve Buhara bölgesindeki fıkıh usul anlayışından farklı bir usul anlayışına dayandıkları görülmektedir. Onların bir fıkhî hükmü ortaya koyarken yaşadıkları belde ve bölgenin özel örfünü dikkate aldıkları anlaşılmaktadır. Bu ise Irak ve Buhara beldelerindeki birçok alim tarafından kabul edilmeyen bir durum olarak göze çarpmaktadır. Belh'in en etkin iki fakihi olan Nusayr b. Yahya (268/881-2) ve Muhammed b. Seleme'nin (278/891) özel örfe dayanarak birçok fıkhî meselede diğer bölge ekollerinin kabul etmedikleri şekilde hüküm değişikliğine gittikleri müşahede edilmektedir. Aslında bölgedeki değişim sadece fıkıh ile sınırlı değildir. Kelam ve tasavvuf gibi disiplinler de bölge şartlarına bağlı olarak bu değişimden nasibini almıştır."
