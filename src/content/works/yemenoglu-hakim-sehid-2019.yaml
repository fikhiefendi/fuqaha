abstract: "Hanefi mezhebinin kurusucusu Ebû Hanife'nin (ö.150) görüşlerini talebesi Şeybânî(ö.189) metne geçirmiştir. Bu eserler 'zâhirü'r-rivâye' diye isimlendirilir. Zâhirü'r-rivâye adlı eserlerin en genişi el-Asl'dır. el-Asl'ın en yaygın özeti el-Hâkim eş-Şehîd el-Mervezî (ö.334)'ye ait el-Kâfî'dir. Çalışmamızda eser Şirket bölümü çerçevesinde tahkik ve tahlil edilmiştir."
