abstract: "Bu tezin amacı, bankacılık sektöründe yönetici ve yönetici adaylarının mevcut ve potansiyel yönetsel yetkinliklerinin geliştirilmesi sürecinde e-öğrenmenin başarısını doğrudan etkileyen kritik başarı faktörlerini keşfetmektir. Bu çalışma ile öğrenme amaç ve hedeflerine ulaşma sürecinde ortaya çıkan beşeri, teknolojik, eğitsel ve kurumsal nitelikteki e-öğrenme engellerinin tespit edilmesi hedeflenmektedir. Başarılı bir e-öğrenme sürecinin tasarımını konu edinen bu çalışmanın temel sorusu;“Yönetsel yetkinliklerin geliştirilmesinde e-öğrenmenin başarısını etkileyen kritik faktörler nelerdir?”olarak belirlenmiştir. Çalışmanın kapsamı, Kuveyt Türk Katılım Bankası A.Ş. (Kuveyt Türk) ile sınırlandırılmıştır. Kuveyt Türk A.Ş., Türkiye Katılım Bankaları Birliği 2017 yılı son çeyrek verilerine göre Türkiye' de hâlihazırda altı katılım bankası içinde toplam istihdamın % 38' ini karşılamaktadır. Katılım bankalarının çeşitliliği ve sayılarının çokluğu, öngörülen çalışma süresi kısıtları altında, böyle bir sınırlandırmaya gidilmesini zorunlu kılmıştır. Araştırmanın örneklemi, Kuveyt Türk' te e-öğrenme uygulamasında yönetsel yetkinliklerin geliştirilmesi eğitimlerine katılan yöneticiler arasından ve amaçlı örneklem yöntemlerinden kritik durum örneklemesi kullanılarak seçilmiş 8 birim yöneticisinden oluşmaktadır. Birinci bölümde yetkinlik ve yönetsel yetkinlerle ilgili kavramsal çerçeve çizilmiş, yetkinlik kavramının yönetim literatüründeki evrimi, stratejik yönetim ve insan kaynakları yönetimi alanları bazında değerlendirilerek yönetsel yetkinlik modelleri, yetkinlik tür ve düzeyleri sınıflandırılmıştır. İkinci bölüme ise teknoloji ve öğrenme ortamının değişen çevresi bağlamında e-öğrenme kavramı, e-öğrenmenin değerlendirilmesinde kritik başarı faktörleri yaklaşımı ve literatürde incelenen beşeri, teknolojik, eğitsel ve kurumsal faktörler değerlendirilmiştir. Üçüncü bölümde, bütüncül tek durum çalışması deseni kullanılarak doğrudan mülakatlarla elde edilen veriler çözümlenerek e-öğrenme sürecinin etkinliğini belirleyen kritik başarı faktörleri ve sürece etkileri tespit edilmiştir. Derinlemesine görüşmelerle sağlanan verileri analiz etmek için içerik analizi yöntemi kullanılmış ve veriler MAXQDA 2018 Nitel Analiz Programı ile analiz edilmiştir. Araştırma sonuçlarına göre katılım bankacılığı sektöründe yönetsel düzeyde çalışan işgörenlerin yetkinliklerinin geliştirilmesinde kullanılan e-öğrenme sürecinin başarısını etkileyen yedi kritik başarı faktörü boyutu tespit edilmiştir. Bu faktör boyutları; devamlılık, içerik niteliği, amaç ve beklentilerle uyum, erişebilirlik ve ulaşım kalitesi, içeriklerin ilgi çekiciliği, etkileşim, kurumsal iletişim ve destek faktörleridir. E-öğrenme sürecinin başarısında öne çıkan kritik başarı faktörü“Eğitsel Faktörler”dir. Eğitsel Faktörlerden sonra ikincil ağırlıktaki kritik başarı faktörü“Teknolojik Faktörler”dir. Bu boyutları sırasıyla“Beşeri Faktörler”ve Kurumsal Faktörler\" takip etmektedir. Kritik Başarı Faktörleri boyutları ayrı ayrı değerlendirildiğinde ortam sürekliliği ve devamlılığın diğer kritik başarı faktörlerinden daha ağırlıklı olduğu görülmektedir. E-öğrenmenin başarısında en kritik rolü oynayan ortam sürekliliği ve devamlılık faktörü, yönetici ve e-öğrenme ortamı arasındaki ilişkinin hassasiyetini ortaya koymaktadır. Bununla birlikte, içeriklerdeki ilgi çekicilik, içerik kalitesi, kurumsal iletişim ve destek, ara yüz ve ekran tasarımı, bireysel öğrenme amaç ve beklentileriyle uyum, içerik amaç-beklenti uyumu, üst yönetimin tavrı, tekrarlayan ve rutin içerikler, kurumun genel eğitim politikası ve öğrenme yönetim sistemi faktör boyutları arasında e-öğrenmenin süreçsel başarısında güçlü ilişki ve etkileşimler olduğu sonucuna varılmıştır."
