abstract: "Bu tez, Fas'ta alternatif uyuşmazlık çözüm yöntemleri olarak aile içi uyuşmazlıklarda uygulanan aile arabuluculuğu ve sulh yöntemlerini kapsamlı bir şekilde incelemektedir. Araştırmanın amacı, bu yöntemlerin Fas'taki uygulamalarını olumlu ve olumsuz yönleriyle detaylı bir biçimde inceleyerek Türkiye başta olmak üzere diğer ülkelerde uygulanacak aile arabuluculuğu ve tahkim uygulamaları açısından sağlayabileceği katkıları kritik etmektir. Bu bağlamda, literatür taraması, saha araştırması ve mülakat tekniği kullanılarak gerçekleştirilen araştırmada, Fas'taki aile mahkemeleri ve sivil toplum kuruluşları ziyaret edilerek, aile içi uyuşmazlıkların çözümünde kullanılan yöntemler detaylı olarak analiz edilmiştir. Elde edilen bulgular, Fas'ta mahkeme merkezli ve mahkeme dışı alternatif uyuşmazlık çözüm yöntemlerinin uygulandığını göstermiştir. Mahkeme merkezli olarak hâkimin bizzat yönettiği yahut yönlendirdiği hakemeyn, aile meclisi, sosyal yardımcı süreçlerinin tümü sulh prosedürü altında işlemekte ve her ne kadar adında tahkim geçse de esasında hâkimin odakta olduğu bir arabuluculuk faaliyeti gerçekleştirilmektedir. Vasâta denilen aile arabuluculuğu ise mahkeme dışı ve sivil toplum kuruluşları tarafından yürütülen süreçleri ifade eder. Çalışmanın bulguları Fas Aile Kanunu'nda yer alan sulh ve tahkim prosedürlerinin pratikte uygulanmasında çeşitli zorluklarla karşılaşıldığını ortaya koymaktadır. Özellikle, mahkemelerdeki sulh oturumlarının beklenen başarıyı göstermemesi, sosyal yardımcıların ve hakemlerin yeterli donanıma sahip olmamaları gibi sorunlar tespit edilmiştir. Buna karşılık, sivil toplum kuruluşları tarafından yürütülen aile arabuluculuğu faaliyetlerinin daha etkili olmakla birlikte yerleşik bir prosedürünün olmaması, kanunen desteklenmemesi ve faaliyeti yürüten kuruluşların mali sorunları nedeniyle profesyonelleşmekte güçlük çektiği tespit edilmiştir. Tez, İslam hukukunun aile içi uyuşmazlıkların çözümünde sunduğu etkili yöntemlerin Fas özelinde tespit edilen eksiklerini gidermek için çeşitli öneriler sunmakta ve Fas'taki uygulamaların diğer Müslüman ülkeler için hangi açılardan model olup olmayacağını tartışmaktadır."
