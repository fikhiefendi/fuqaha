abstract: "Bu tez, belirsizlik, sürdürülemezlik ve muhtelif krizlerin şekillendirdiği zamanımızda Müslüman aktörlerin, özellikle belirtmek gerekirse hayır kurumlarındaki karar alıcıların, ilgili karar süreçlerinde dini inançları ile ahlak anlayışlarını nasıl ilişkilendirdiğini incelemektedir. Bu amaçla çok aşamalı bir metodolojiyle, Körfez Arap Ülkeleri İşbirliği Konseyi (KİK) ülkeleri ve Birleşik Krallık'tan 21 Müslüman yöneticiyle yapılan görüşmelerin Gömülü Kuram temelli nitel analizi yapılmış, bu ampirik bulgularla bir kuram inşa edilmiş, ardından bu kuram Büyük Dil Modeli destekli disiplinler arası (psikolojik, sosyolojik ve dini) bir analizle zenginleştirilerek yeni bütünleşik bir kuramsal çerçeve geliştirilmiştir. Çalışmanın temel kuramsal katkısı 'Dinamik İnanç Temelli Ahlaki Yönlendirme' (Dynamic Faith-Based Moral Navigation) modelidir. Bu model, karar vermeyi etkileyen belirsizliğin bir din-belirsizlik diyalektiğine dönüştüğü, çok katmanlı ve kaynağını dinden alan bir ahlaki faillik sürecini ortaya koymaktadır. Yeryüzünün halifesi gibi İslami ilkelere dayanan sistemik bir sürdürülebilirlik etiği ile desteklenen bu faillik, bireylere birbirleriyle çelişen tercihler arasında seçim yaparken genellikle denge arayışı ile rehberlik etmektedir. Modelin operasyonel mekanizmaları şu şekildedir; etik senaryolara eleştiri ve/veya çözüm üretme odaklı iki yönlü ahlaki tepki, kapsamı neslin korunması ilkesine dayanarak gelecek nesilleri de kapsayacak şekilde genişletme, kararı kurumsal ya da eğitsel uygulamalarla hayata geçirme ve nihayetinde bu karara ahlaken bağlılığı duygusal olarak canlı tutma. Ayrıca, bu bireysel failliğe dair unsurların kolektif olgulara nasıl yansıyabileceğini göstermek amacıyla, araştırmanın temel bulgularından 'tevekkül esaslı dayanıklılık' mekanizmasını basit bir toplumsal yayılım senaryosu içinde inceleyen, öngörü ya da tahmin amacı gütmekten ziyade ampirik temelli bir simülasyon örneği sergilemeyi amaçlayan bir Etmen Tabanlı Model (ABM) geliştirilmiştir. Bu araştırma, çağdaş Müslümanın ahlaki failliğine dair kapsamlı ve ayrıntılı bir model sunarak, sivil toplum kuruluşlarına, politika yapıcılara ve belirsizliğin hakim olduğu etik karar alma süreçlerinin yönetimine önemli katkılar sağlamaktadır."
