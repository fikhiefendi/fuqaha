abstract: "Bu çalışmanın odaklandığı problem, İslâm hukukundaki mücerred haklar ile kıyas yapılarak finansal opsiyon hakkının karşılıklı bedellendirmeye (muavaza akdine) göre hükmü olarak belirlenmiştir. Üç ana hedefi bulunan bu çalışmada ilk olarak finansal opsiyonların ne olduğu, bu işlemi yapanların amaçları ve bu işlemlerin nasıl yürütüldüğü betimleyici yöntem kullanılarak açıklanmıştır. İkinci olarak, şer'î açıdan bir incelemeye geçilerek öncelikle genel anlamda hak kavramı ve özel anlamda mücerred hak kavramı ele alınmıştır. Ardından İslâm hukukunda mücerred hakların hükümleri ve özellikle bu hakların tebâdül edilmesinin hükmü ortaya konulmuştur. Bu aşamada tümevarım yönteminden yararlanılmıştır. Üçüncü olarak, mücerred haklardan yola çıkarak bedel almanın kurallarının istinbat edilmesiyle opsiyon sözleşmelerinin şer'î açıdan uygunluğu değerlendirilmiştir. Ardından mücerred haklar ile finansal opsiyon hakkı arasındaki esas fark ortaya konulmuş ve bu aşamada istinbat yöntemi kullanılmıştır. Çalışma birden fazla sonuca ulaşmıştır. Bunlardan en önemlisi, fıkıh âlimlerinin mücerred haklardan hareketle bedel almanın hepsine değil bir kısmına izin verdikleri, ayrıca finansal opsiyon hakkı ile mücerred haklar arasında kıyas kabul etmeyecek şekilde temel farklar bulunduğudur. Bu sebeple, finansal opsiyonların İslâm hukuku açısından haram olduğu sonucuna ulaşılmıştır."
