abstract: "Yüzyıllardır bireyler ve kurumlar karşılaştıkları risklere karşı önlemler almak durumunda kalmışlar ve risklerin yönetilmesinde önemli bir yol olan sigorta sistemi günümüz finansal sisteminin önemli bir parçası haline gelmiştir. Müslüman kesimin inaçları gereği Konvansiyonel sigortacılığın faiz, belirsizlik vb. olgularla içermesiyle bu tür bir risk yönetimi sisteminden Müslüman toplumların uzak durmasıyla, İslami hassasiyetler göz önüne alınarak düzenlenmiş Tekafül sisteminin ortaya çıktığı düşünülmektedir. Tez çalışmasında risk yönetiminde konvansiyonel ve tekafül sigortacılığı karşılaştırılmış, tekafül sisteminin Dünya'da ve Türkiye'deki yeri incelenmiştir. Temel sorularla sektör yetkilileriyle yapılan yarı yapılandırılmış görüşmeler sesli olarak kayıt edilmiş deşifresi yapılarak metin halinde getirilmiştir. Deşifre veriler gruplandırılıp araştırmanın temaları oluşturulmuştur. Veriler nitel araştırma yöntemlerinden betimsel analiz yöntemiyle değerlendirilmiştir. Tekafül sisteminin Türkiye'de uygulanabilirliği konusunda tanımının netleşmesi, mevzuatta düzenlemeler yapılmasının gerektiği, potansiyeline rağmen halihazırda bilinirliliğiyle birlikte yeterli olmadığı, Tekafül üzerine verilen ortak bir fetvanın olmaması ve bu konuda otorite eksikliği, Tekafül şirketlerinin özellikle risk transferinde problemlerle karşılaştığı ve fon değerlendirmesinin faizsiz yürütülmesi açısından zorluklar barındırdığı tespit edilmiştir. Belirlenen temalara yönelik öneriler, yapılan görüşmeler ve literatür çalışmaları ışığında oluşturulmuştur."
