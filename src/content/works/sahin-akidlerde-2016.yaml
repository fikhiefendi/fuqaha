abstract: "Bu çalışmamızda; akidlerde/sözleşmelerde birey iradesinin sağlıklı ve özgürce gerçekleşmesinde en temel hususlardan olan muhayyerlik teorisi ele alınmıştır. Akidlerde seçme, cayma ve onama iradesinin yer aldığı her husus muhayyerlik teorisinin bir konusudur. Yani muhayyerlik, akde taraf olanların her türlü seçimlik haklarını içeren ve akdin bağlayıcılığını etkileyen bir kavramdır. Bu nedenle muhayyerlik teorisinin akid teorisi içerisinde ele alınması ve birlikte düşünülmesi gerekir. Muhayyerlikler, akidlerin oluşumundaki kanunî şartlar içerisinde yer aldığı gibi, akidlerdeki şart koşma serbestisi çerçevesinde ilave şartlar şeklinde de yer alabilmektedir. Modern kanunlardaki seçimlik haklara da kaynaklık eden muhayyerlikler, sözleşmelerde kanun tarafından bireylere onama, cayma hakkı vb. şekillerde sunulmakta ve tarafların haklarını koruyucu bir husus olarak yer almaktadır. Muhayyerlik konusu ile ilgili şimdiye kadar yapılmış olan çalışmalar sınırlı kalmış olduğundan bu tez çalışması bütün muhayyerlikleri ele alıp, kısmen yeniden bir tasnife tabi tutarak hangilerinin hukukî zorunluluktan ve hangilerinin tarafların iradeleri sonucu olduğunu tespit etmeyi amaçlamıştır. Bunu yaparken de konunun hangi hukukî zemine yerleştiği tespit edilmeye çalışılmıştır. Bu çalışmayı özel kılan husus, muhayyerlik teorisini genel manada tespit etmesi ve değişik akidlerde yer aldığı halde muhayyerlik olarak tanımlanmamış ancak şekil veya mana olarak muhayyerlik kavramının kapsamına dâhil edilebilecek hususları ortaya koymasıdır."
