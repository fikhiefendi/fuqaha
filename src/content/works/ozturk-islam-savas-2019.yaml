abstract: "Savaş ve barış devletlerarası tarihin vazgeçilmez tartışmalarından olmakla birlikte temelinde meşruiyet tartışmaları yatmaktadır. Savaşın meşruiyetini ifade eden haklı savaş kavramı her ne kadar batı merkezli bir kavram olsa da çok eski zamanlardan itibaren kaynaklarda savaşın meşruiyeti hakkında farklı yaklaşımlar bulunmaktadır. Bu yaklaşımlardaki farklılaşmanın özünde ise epistemolojik, kavramsal ve kuramsal farklılıklar yatmaktadır. Tüm din, devlet ve medeniyetlerin savaş anlayışları ve savaş hukukları olduğu gibi İslam'ın da kendine özgü bir savaş kuramı ve buna bağlı bir savaş hukuku bulunmaktadır. İslam savaş hukuku, Kur'an ve Sünnet temelinde şekillenmiştir. Bu tezde İslam savaş hukukunu teori ve pratik olmak üzere savaş kuramı ve savaş hukuku şeklinde iki başlık altında sınıflandırdım. Savaş kuramı Kur'an ve Sünnet çerçevesinde olup bunun üzerine inşa edilmiş fıkıh ve kelamı da kapsamaktadır. İslam'da savaşın düşünsel ve inançsal arka planına dair kaynaklar incelenmiştir. Savaş hukuku da Kur'an ve Sünnet'te savaşın uygulamasının nasıl olduğunu kapsamakta olup; savaşa başvurma hukuku, savaş içi hukuk ve savaş sonrası hukuk olmak üzere üç ana başlık altında kaynakları çerçevesinde analiz edilmiştir. Çalışmada Kur'an ve detaylı izahı için Nesefî Tefsiri ve Ebussuûd Efendi Tefsiri, Hadis kaynağı olarak Sahîh-i Buhârî ve Sahîh-i Müslim, Fıkıh kaynağı olarak Şerhu's-Siyeri'l-Kebir gibi ilmi değere sahip eserlere başvurulmuş olup Kur'an ve Sünnet'te savaşın kuramsal ve pratik genel bir çerçevesi çizilmesi hedeflenmiştir."
