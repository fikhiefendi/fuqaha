abstract: "Bu çalışma, Osmanlı âlimi Kutbüddîn İznikî'nin (ö. 821/1418) Telfîkâtü'l-Mesâbîh adlı yazma eserinin İman Bölümü'nden Menâkıb Bölümü'ne kadar tahkîkini hedeflemektedir. Telfîkâtü'l-Mesâbîh, Ferrâ el-Begavî'nin (ö. 516/1122) Meṣâbîḥu's-sünne adlı eserinin Arapça şerhi olup hadisler arasındaki zahirî çelişkiyi ortadan kaldırma gayesiyle kaleme alınmıştır. Çalışma, iki bölümden oluşmaktadır. Birinci Bölüm'de eser ilmî yöntemlerle incelenmiş, İkinci Bölüm'de de eserin tahkîki yapılmıştır. Birinci Bölüm'de müellifin kimliği, hayatı, ilmî kişiliği, mezhebi, fikirleri ve eserleri gibi bilgilere yer verilerek tahkiki yapılan eseri kaleme alma amacı, el-Mesâbîh adlı eseri şerh ederken kullandığı kaynaklar, hadislerdeki çelişkiyi ortadan kaldırmada izlediği yöntem araştırılmış ve şerhin özgünlüğü anlatılmıştır. Aynı zamanda eserin yazma nüshaları tanıtılmış ve eserin tahkîkinde kullanılmak üzere seçilen nüshaların özellikleri ve izlenilen yöntem de bu bölümde ele alınmıştır. İkinci Bölüm'de ise seçilen yazma nüshalar karşılaştırılarak müellifin kaleme aldığı eserin en yakın metni ortaya konmaya çalışılmıştır. Aynı zamanda eserde geçen ayet ve hadislerin kaynağı da gösterilerek okuyucuların istifadesine sunulmuştur."
