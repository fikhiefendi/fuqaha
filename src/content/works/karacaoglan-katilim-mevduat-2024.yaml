abstract: "Günümüzde bankacılık sektörü, sürekli değişen ekonomik koşullar ve tüketici beklentileri nedeniyle kendini yeniden şekillendirmekte ve müşteri memnuniyetini artırmaya yönelik yeni stratejiler geliştirmektedir. Bu bağlamda, müşteri memnuniyeti, bankaların sürdürülebilir başarısının kilit bir göstergesi olarak ön plana çıkmaktadır. Müşteri memnuniyeti, müşterilerin bir ürün veya hizmetten elde ettikleri tatminin derecesini ifade eder ve bankacılık sektöründe de müşterilerin banka hizmetlerinden aldıkları memnuniyet düzeylerini ölçmek için kullanılır. Finansal hizmetlerin kalitesi, banka müşterilerinin memnuniyetini doğrudan etkileyen ve bankacılık sektöründeki rekabeti şekillendiren önemli bir faktördür. Bu çalışma, Kayseri ilinde faaliyet gösteren katılım ve mevduat bankalarının müşteri memnuniyeti performanslarını karşılaştırmalı olarak değerlendirirken, müşteri memnuniyetinin yanı sıra müşteri sadakati ve hizmet kalitesi gibi diğer kritik faktörleri de incelemektedir. Bu tez, bankalar arası rekabetin müşteri memnuniyeti ve banka tercihleri üzerindeki etkisini anlamaya yönelik detaylı bir analiz sunmayı hedeflemektedir. Bankacılık sektörü, müşteri odaklı hizmet anlayışı gereği, müşteri memnuniyetini maksimize etmeye yönelik çeşitli yöntemler geliştirmektedir. Müşteri memnuniyeti, müşteri sadakati ve banka karlılığı arasında doğrudan bir bağlantı olduğundan, bankalar için stratejik bir öncelik haline gelmiştir. Ayrıca, bankacılık hizmetlerinin kalitesi ve müşteri memnuniyeti arasındaki ilişki, sektörün rekabetçilik düzeyini de etkilemektedir."
