abstract: "Toplumu giderek daha çok tehdit etmeye başlayan suç olgusu insanlık tarihi kadar eskidir. Günümüze gelinceye kadar tüm toplumlar suçları önlemeye çalışmış, halkın sağlıklı ve mutlu yaşayabilmesi için çeşitli kanunlar yapmıştır. Ancak insanlık ve teknoloji geliştikçe suçlar da çeşitlenerek çoğalmıştır. Devletler zaman zaman suç-ceza dengesini gözetmemiş basit suçlara ağır cezalar verdikleri gibi, toplumu tehdit eden suçlara hafif cezalar da verdikleri olmuştur. Bu çalışmamızda suç ve ceza bakımından İslâm hukukunun kendisinden önceki ve sonraki hukuklardan farklılıkları özellikle suç önleme mekanizmaları açısından genel olarak ele alındı. Özel olarak da hırsızlık suçunun İslâm hukuku ile modern hukuku karşılaştırması yapılarak, İslâm'ın koyduğu had cezalarının genel suçları ve hırsızlık suçunu engellemedeki rolü ortaya koyuldu."
