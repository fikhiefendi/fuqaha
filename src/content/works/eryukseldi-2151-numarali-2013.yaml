abstract: "Türk tarihi açısından oldukça önemli bilgiler içeren Şer'iyye Sicilleri, Osmanlı tarihinin önemli arşiv kaynaklarından biridir. 2151 numaralı Safranbolu Şer'iyye Sicilinin H.1311/M.1894 – H.1313/M.1896 yıllarını kapsayan bölümü çalışılmıştır.Giriş bölümünde Safranbolu'nun kısa bir tarihçesi, idari yapısı, nüfusu hakkında bilgilerin yanında, şer'iyye mahkemeleri ve şer'iyye sicilleri hakkında da açıklamalara yer verilmiştir. Belgelerin içerikleri özet olarak verilmiştir. Transkripsiyon basit şekilde yapılarak, çalışma, değerlendirme ve sonuç kısmı ile sonlandırılmıştır."
