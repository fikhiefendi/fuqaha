abstract: "İslam dininin temel esaslarından olan Zekât müessesesi, bir ibadetten öte sosyal ve iktisadi bir düzenleyici görevi görmektedir. Yapısı ve sahip olduğu özellikler sayesinde, zekât sosyal bağlamda da önemli görevler icra etmektedir. İktisaden toplumun farklı tabakaları arasında ekonomik eşitsizliğin minimize edilmesi için çok önemli bir araçtır. Zira Zekâtın, iktisadi yönü ile olduğu kadar sosyal yönüyle de toplumdaki bireylerin arasındaki bağları kuvvetlendireceği muhakkaktır. Bu tezin temel amacı, Türkiye için uygulanabilir bir kurumsal Zekât modeli önerisi ortaya koymak ve bu modelin gelir dağılımı üzerindeki etkilerini incelemektir.Türkiye için kurumsal bir Zekat modeli ortaya konması için ilgili literatür ile ülke deneyimleri incelenmiş ve sonrasında derinlemesine mülakat yöntemiyle modelin detayları belirlenmiştir. Sonrasında ise belirli varsayımlar altında kurumsal Zekât modelinin Türkiye'de uygulanmasının gelir dağılımı üzerindeki etkileri ekonometrik yöntemle analiz edilmiştir. Çalışmanın bulgularına göre, gelirden en yüksek payı alan G5, G4, G3 ve G2 gruplarından %2,5 oranın gelirden en az paya sahip G1 grubuna aktarıldığı kabul edilmiş olup, ortaya çıkan yeni gelir dağılımının, mevcut durumda anlamlı çıkan makroekonomik göstergelerin ilişkisinin anlamsız hale gelmesine neden olduğu sonucuna varılmıştır. Bu durum makroekonomik göstergelerin gelir dağılımıyla bağımlılığını ve kırılgan yapısının giderilmesinin mümkün olduğu sonucunu göstermektedir."
