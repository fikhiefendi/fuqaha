abstract: "Bu çalışmada, çağdaş İslam hukuku alanında önemli bir yere sahip olan Ramazan Bûtî'nin aile hukukuna dair görüşleri incelenmiş ve bu görüşlerin hem klasik fıkıh anlayışı hem de günümüz hukuki uygulamalarıyla ilişkisi değerlendirilmiştir. Bûtî, geleneksel İslam hukukunun temel prensiplerine bağlı kalmakla birlikte, modern çağın ihtiyaçlarına cevap verebilecek şekilde içtihatlarda bulunmuş bir âlimdir. Aile hukuku bağlamında nişan, nikâh, düğün, boşanma, nafaka, velayet, zina, iddet, halvet ve kadının aile içindeki yeri gibi temel konular üzerine geliştirdiği fikirler, bu çalışmanın odak noktalarını oluşturmuştur. Tezde ilk olarak Bûtî'nin hayatı hakkında genel bilgiler verilmiştir. Daha sonra Bûtî'nin metodolojik yaklaşımı ele alınarak onun fıkıh usulü anlayışı incelenmiş; ardından aile hukukuna dair görüşleri sistematik bir şekilde analiz edilmiştir. Bûtî aile ile ilgili meselelerde hem geleneksel hem de modern yaklaşımları ortaya koymuştur. Ayrıca onun görüşlerinin, günümüz İslam ülkelerinde uygulanan aile hukuku sistemleriyle ne ölçüde örtüştüğü veya farklılaştığı da karşılaştırmalı olarak değerlendirilmiştir. Sonuç olarak Bûtî'nin, İslam aile hukukunun dinamik yapısını koruyarak çağın gereklerine uygun çözümler sunma gayretinde olduğu; bu yönüyle hem akademik çevreler hem de hukuk uygulayıcıları için önemli bir referans niteliği taşıdığı tespit edilmiştir. Bu tez, Bûtî'nin görüşlerinin daha geniş bir perspektifle anlaşılmasına katkı sağlamayı ve İslam aile hukukunun güncel meselelerine ışık tutmayı amaçlamaktadır."
