abstract: "Çalışmaya konu olan el-Mevsılî'nin el-Muhtar adlı eserinin Nikâh Kitabı ile Feraiz Kitabı bölümleri arasındaki kısımlarda Mevsılî'nin rümuzlarla işaret etmiş olduğu Ebû Yusuf ve İmam Muhammed'in görüşleri tahkik edilip, bu iki büyük müctehidin görüşleri tesbit edilmeye çalışılmıştır. Bu bölümde 191 meselede Ebû Hanife ve diğer iki imam arasında ihtilaf olduğu tesbit edilmiştir. Çalışma, bir giriş ve iki bölüm halinde gerçekleştirilmiştir. Giriş bölümünde kitabın Müellifi ve görüşleri üzerine çalışma yapılan Hanefi mezhebinin Üç İmamı tanıtılmıştır. Birinci bölümde, el-Mevsılî'nin İmameyn'e atıfta bulunduğu yerlerdeki İmameyn'in görüşleri, ikinci bölümde de atıfta bulunulmayan ama aslında bu iki imamın herbirerinin veya her ikisinin muhalefetinin olduğu yerler belirtilip bu görüşler ortaya çıkarılmıştır. 191 meselenin 141 tanesine müellif işaret etmiş, geri kalan 50 mesele de, diğer kaynaklardan bulunarak rümuz konulması gereken yerleri belirlenmiştir. Ancak şu da bilinmelidir ki: bu 191 ihtilafın tamamında Ebû Yusuf ile İmam Muhammed aynı görüşte değildir. Bazen Ebû Yusuf, bazen de İmam Muhammed, Ebû Hanife ile aynı görüşte olabildiği gibi, bazen de bu üç İmamın herbireri farklı görüşte olabilmektedir. Bu yüzden çalışmada Ebû Hanife merkeze alınıp, onunla muhalefet halinde olan Ebû Yusuf veya İmam Muhammed'in, veya da her ikisinin birleşip Ebû Hanife'ye karşı aynı görüşle muhalefet ettikleri konular tesbit edilmiştir."
