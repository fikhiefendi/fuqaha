abstract: "19. yüzyıl Osmanlı tarihinde özellikle Tanzimat'ın ilanından itibaren her alanda köklü değişim ve dönüşümlerin yaşandığı bir dönemdir. Tanzimat ismi“nizam”kökünden gelmektedir. Yabancı literatürde ise Tanzimat, legislation olarak da tabir edilmektedir. Bu dönem bu isimlere uygun bir şekilde kanunlaştırma faaliyetlerinin başladığı bir dönem olmuştur. Kanunlaştırmalar ilk olarak Ticaret Hukuku alanında başlamıştır. Osmanlı'nın ilk Ticaret Kanunu 1850 yılında Fransız Ticaret Kanunu'ndan çeviri yoluyla yürürlüğe girmiştir. Yaklaşık 20 yıl sonra Medeni Hukuk ve Borçlar Hukuku alanlarında bu defa İslam hukukunun kodifikasyonu yoluyla Mecelle-i Ahkâm-ı Adliye ilan edilmiştir. Bu dönemde ayrıca kanunlaştırmalar yanında adli teşkilatta da değişiklikler yapılmış ve Osmanlı'nın mevcut yargı kurumlarının yanına ticaret mahkemeleri ve nizamiye mahkemeleri teşkil edilmiştir. Böylece yeni kanunların uygulanacağı yargı kurumları oluşturulmuştur. Bu süreçte bir taraftan birbirlerine zıt kökenlere sahip olan bu kanunlar beraber yürürlükte oldukları dönemde birbirlerinin boşluklarını doldurmuştur. Diğer taraftan faaliyet alanları birbirinden farklı olarak kurgulanan ve bu konuda gerekli düzenlemeler yapılan bu mahkemeler zaman zaman birbirlerini ikame etmiştir. Dolayısıyla Osmanlı hukuk tarihi açısından bu dönem bir yandan“hukukta ikilik”görünümündeyken, aynı zamanda mahkemeleri kullanacak ve kanunlardan yararlanacak kesimler için“hukuki çoğulculuk”ortamı izlenimi vermiştir. Çalışmada bu dönemde çeşitli ihtilaflar nedeniyle söz konusu mahkemelere başvuran taraflar arasında görülen davalardan iktisadi ve ticari olanlar seçilerek ilişki türleri ve tarafları gibi çeşitli açılardan değerlendirilmiştir. Ayrıca dava süreçleri ve sonucu, iktisadi gelişmeyi pek çok boyutu ile ele alan ve özellikle ticaret kanunlarındaki gelişim düzeyine bağlı olarak açıklayan kurumsal iktisadın kavramsal araçlarıyla analiz edilmiştir."
