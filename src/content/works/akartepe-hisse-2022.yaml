abstract: "Şer'i izleme, ana faaliyeti meşru olmakla birlikte gayrimeşru faaliyetler yürüten ve gayrimeşru gelirler elde eden karma nitelikli şirketlere yatırım yapılmasına fıkhî olarak izin verilmesi sonucunda ortaya çıkmış yeni bir olgudur. Şirketlerin gayrimeşru içeriklerle olan ilişki seviyesinin incelendiği şer'i izleme sürecine yönelik farklı uygulama örnekleri bulunmaktadır. Şirketlerin meşruluk durumunu tespit etmek iddiasıyla oluşturulan şer'i izleme standartlarının farklılaşması bu kapsamda belirlenen ilkelerin bir bütün olarak fıkhî analizini gerekli kılmaktadır. Bu nitelikte bir incelemeyi barındıran bu çalışma şer'i izleme kriterlerinin tespit süreçlerini ele almak suretiyle uygulamadaki problemli noktaları ortaya koymaktadır. Çalışmada öncelikle anonim şirket ve hisse senedi yatırımı konusunda sergilenen yaklaşımlar ele alınarak karma şirketlere verilen iznin temelinde zaruret ilkesinin bulunduğu tespit edilmektedir. Sistemin bir bütün olarak bu ilke çerçevesinde şekillenmesi gerekirken sektörel ve finansal izleme kriterlerinin belirlenmesi aşamasında faizin merkezi bir rol oynaması incelemelerde eksikliğe, eşik değerlerin tespiti hususunda takip edilen yöntemler ise metodolojik hataya yol açmaktadır. İzleme sürecinin tamamlayıcı bir unsuru niteliğinde olan arındırma işlemi ise mevcut haliyle gayrimeşru içeriğin temizlenmesi noktasında yüzeysel bir işlev görmektedir."
