abstract: "Bu çalışma, hicrî III. yüzyılda yaşamış olan İmam Mâtürîdî'nin (ö. 333/944) Te'vîlâtü'l-Kur'ân isimli eserinde ele aldığı aile hukukunun nikâh ve talâk bölümüne ilişkin ayetlere dair değerlendirmelerini içermektedir. Çalışma, giriş, iki bölüm ve sonuçtan oluşmaktadır. Giriş bölümü, müellifin hayatı, ilmi kişiliği ve eserlerini içermektedir. Çalışmanın ilk bölümünde, müellife kadar uzanan tefsir birikimi de dikkate alınarak, Mâtürîdî'nin aile hukukunun mühim konularından biri olan nikâh ve ahkâmına dair ayetlere ilişkin değerlendirmeleri ele alınmıştır. İkinci bölümde ise aynı metot uygulanarak müellifin, aile hukukunun diğer önemli bir alanı olan talâk konusuna taalluk eden ayetlere dair yorumları analiz edilmeye çalışılmıştır."
