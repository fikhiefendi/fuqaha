abstract: "Finansal hizmetler sektöründe global anlamda hızla gelişmekte olan Blockchain teknolojisi, Türkiye'de kurulan katılım bankalarının potansiyel kullanım alanlarının keşfedilip yeniden incelenmesine sebep olmaktadır. Blockchain teknolojisi, Türkiye'de bulunan katılım bankalarına hizmetlerini iyileştirme ve verimliliklerini artırma fırsatları sunar ve bu da tüm bankacılık sistemini olumlu yönde etkilemeyi amaçlamaktadır. Türk katılım bankaları, müşteri ihtiyaçlarının karşılanmasından temel ve ileri bankacılık hizmetlerinin sağlanmasına kadar ki süreçte önemli bir rol oynadığından, Türkiye'deki finansal yapının hayati bir parçası konumundadır. Modern teknolojik problemler ve tüketici davranışındaki değişiklikler karşısında Türk katılım bankaları, müşteri deneyimini iyileştirerek bankacılık faaliyetlerindeki şeffaflığı ve güvenliği artırmak için yenilikçi teknolojileri keşfetmeye çalışmaktadır. Blockchain teknolojisi bu bağlamda finansal işlemleri ve hassas bilgilerin kaydedilmesini sağlayıp, uyguladığı güvenilir sistem sayesinde bu ihtiyaçları karşılamayı amaçlamaktadır. İşlem geçmişi, katılımcı makinelerden oluşan bir ağ boyunca dağıtılır ve bu da kurcalamayı zorlaştırmaktadır. Blokchain teknolojisi ayrıca, belirli koşullar oluştuğunda alım satım işlemlerini yürütmek üzere programlanmış otomatik yazılım programları olan akıllı sözleşmelerin yürütülmesine de önayak olmaktadır. Katılım bankalarının hizmetleri Türk bankacılık sisteminin ayrılmaz bir parçası olduğundan bu araştırmanın motivasyonunu oluşturan ana neden, Türkiye'deki katılım bankalarının hizmetlerinde Blockchain teknolojisinin uygulanma olasılığını incelemektir. Çalışmada Blockchain ve katılım bankaları hakkında çok sayıda araştırmanın, telefon görüşmesinin, tartışmanın ve e-postanın incelenmesi sonrasında bir veri seti elde edilmiştir. Elde edilen verilerde, katılım bankalarının hizmetlerinde bahsi geçen teknolojinin uygulanması, kullanımına engel teşkil edip yaygınlaşmasını hızlandıramayan sebepler gibi problematikler irdelenmiştir. İncelenen bir dizi cevap, varılan fikir ve araştırılan olgu sonucunda, katılım bankalarının hizmetlerinde Blockchain teknolojisinin kullanılma olasılığını aydınlatan bir dizi sonuç elde edilmiştir."
