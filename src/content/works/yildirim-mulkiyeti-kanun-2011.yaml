abstract: "Kat mülkiyeti, büyük şehirlerin konut sıkıntısına en faydalı çare olarak görülmekte olan bu sebeple de tüm dünyada hukukçuların gözünde ilgi odağı haline gelen kökleri çok eski tarihlere uzanan bir kurumdur. Kat mülkiyeti hukuk düzenimizde medeni kanundan önce de yer almış bir kavramdır zira kat mülkiyeti Mecelle`de düzenlenmişti. 2. Dünya Savaşından sonra, bütün Avrupa ülkelerinde olduğu gibi, İsviçre ve Türkiye`de de kat mülkiyeti kurumuna yeniden ihtiyaç duyulmuştur. Bu ihtiyaç müşterek mülkiyet ve ayni tesirli müşterek mülkiyet sistemleri ile giderilmeye çalışılmış ancak bu sistemler ihtiyaçları giderememiştir. Kat mülkiyeti kurumu Türk hukukunda çeiitli aşamalardan geçmiş 1965 yılında 634 sayılı kat mülkiyeti kanunu çıkarılmıştır. Bu kanun ise günümüze dek defalarca değişime uğramıştır. Bu değişikliklerden en yenileri 2007 yılında 5711 sayılı kanunla ardından da 2009 yılında 5912 sayılı kanunlarla yapılan değişikliklerdir. Tezim 5711 ve 5912 sayılı kanunlar ile yapılan değişikliklere ilişkindir."
