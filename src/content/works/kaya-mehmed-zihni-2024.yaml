abstract: "Fıkıh edebiyatı türü olan ve fıkhî meselelerdeki şer'î hükmün gizlenerek bilmece formunda sorulması amacını taşıyan elğâz-ı fıkhiyye, fıkıh alanında bir eğitim-öğretim yöntemi olarak kullanılmıştır. Elğâz-ı fıkhiyye üzerine hatırı sayılır bir literatür oluşmuştur. Bu eserlerden birisi de Osmanlı Devleti'nin son dönem önemli şahsiyetlerinden olan müderris Mehmed Zihni Efendi'nin (ö. 1913) kaleme aldığı“Elğâz-ı Fıkhiyye”adlı eseridir. Bu çalışmada Elğâz-ı Fıkhiyye eserinin kaynaklandırılması yapılarak sadeleştirilmesi amaçlanmıştır. Tez bir giriş iki bölüm ve sonuçtan oluşmaktadır. Girişte tezin konusu, önemi, amacı ve yöntemi izah edilmiştir. Birinci bölümde kavramsal çerçeve verilmiştir. Elğâz-ı fıkhiyye ilminin doğuşu, tarihi süreci, özellikleri hakkında bilgi verilerek bu alandaki literatür aktarılmıştır. Zihni Efendi'nin hayatına yer verildikten sonra Elğâz-ı Fıkhiyye adlı eser detaylıca tanıtılmıştır. Eser üzerine yapılan mevcut çalışmalardaki tespitler izah edilmiştir. Konu kapsamımız dahilinde müellifin eserde belirttiği kaynaklara yer verilmiştir. İkinci bölümde asıl metnin sadeleştirilmesi yapılmıştır. Sadeleştirmeyi yaparken mümkün mertebe müellifin gösterdiği kaynaklardaki bilgiye ulaşıp bu bilgiler günümüz kaynaklandırma formunda verilmiştir. Müellifin açıklamalarına ilaveten gerekli görülen hususlarda izahlar yapılmıştır. Elğâz ilmi tanıtılarak fıkıh ilmindeki yeri ve önemi verilmeye çalışılmıştır. Elğâz-ı Fıkhiyye eseri sadeleştirilerek araştırmacıların istifadesine sunulmuştur."
