abstract: "Cessâs el-Hanefî'nin el-Fusûl, Gazâlî es-Sâfiî'nin el-Mustasfâ, Ebû Ya'lâ el-Hanbelî'nin el- Udde, Bâcî el-Mâlikî'nin hkâmu'l-Fusûl, bn Hazm'ın el-hkâm ve Ebû'l-Hüseyin'in el- Mu'tezîlî'nin el-Mu'temed eserlerinde ittifâk edilen Kur'ân, Sünnet ve cma' ve ihtilâf edilen Medîne Ehli'nin cma'ı, Dört Halîfe'nin cma'ı, Çogunlugun cma'ı, Kıyas, Sahâbe Kavli, stıshâbu'l-Hâl, Seru' Men Kablenâ ve Sedd-i Zerâi' delillerine dayanak olarak zikredilen merfu' hadisleri tahrîc edip sıhhat durumlarını arastırtık. Tahrîci Kütüb-i Tisa' sınırlandırmayıp ulasabildigimiz bütün klasik kaynakları taramaya çalıstık. Sıhhat arastırmasını ise klasik ve çagdas kaynakları tarayarak tespit etmeye çalıstık. Hadislerin çogunlugunun sahih ve hasen oldugunu, az da olsa zayıf hadis kullanıldıgını tespit ettik; hadis diye nakledilen bazı haberleri ise klasik kaynaklarda tespit edemedik. Hadislere genellikle ihtisâren deginilmis ve bu hadisle konuya açıklık getirilmeye çalısılmıstır. bn Hazm ise genellikle senet ve metinlerini tam olarak nakletmektedir. Hadislere fıkıh usûlü okuması yapıldıgını, fıkıh usûlü'nün sahih hadislere dayanarak kurulmaya çalısıldıgını, delillerin dayandırıldıgı hadislerin katî' olması, yani âhâd hadisler degil de mütevâtir hadisler olması gerektigi, öngörülse de âhâd hadislerin ister istemez kullanıldıgını gördük. Hadislerin genellikle maksadına uygun bir biçimde dayanak olarak getirildigini, az da olsa maksadına uygun olmayan sekilde kullanıldıgını tespit ettik. Hadisler genellikle dört sekilde kullanılmıstır: 1. Konuyu hadisle ispat için. 2. Konuyu hadisle iptal için. 3. Hadis sahih olsa da dayanak olamayacagını bildirmek için. 4. Hadis zayıf oldugundan dayanak olamayacagını bildirmek için. Bazen bn Hazm, diger fıkıh usûlü müelliflerinin bir delili ispat için getirdikleri hadislerin aksine iptal ettigini ifâde etmistir. Bu çalısma, altı mezhebin ve bu mezheplerin sistemiyle fıkıh usûlü yazan müelliflerin ittifâk veya ihtilaf edilen deliller hakkında ne düsündüklerini, delilleri ispat veya iptal ederken kullandıkları ortak veya farklı hadisleri ve bu hadislerin sıhhat durumlarını ögrenmemize yardımcı olmaktadır."
