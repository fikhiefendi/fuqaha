abstract: "Hanefî fıkıh kaynaklarında telfikin cevazından ilk bahseden kişinin Tarasüsî olduğu söylenir. Daha sonra İbnü'l-Hümâm, Tahrîr ve Fethu'l-Kadîr adlı kitaplarında, görünüşe göre ittibâu'r-ruhas'ın caiz olduğuna ve telfîkin yasaklanmadığına işaret eden birtakım mübhem ifadeler zikretmiştir. İbnü'l-Hümâm'ın yaşadığı dönemde tüm İslami ilimlerde olduğu gibi fıkıh usulü alanında da en önde gelen alimlerden biri olduğu herkes tarafından bilinmektedir. Bu sebeple onun görüşleri ve problemli konulara yaklaşımları her zaman usulcülerin dikkatini çekmiştir. İbnü'l-Hümâm'ın yanında okumuş olması hasebiyle bu ifadelerin gerçek anlamını en iyi kavrayan âlimlerden biri olan Kâsım b. Kutluboğa, birçok yerde telfîkin caiz olmadığını ifade etmiştir. Ancak İbnü'l-Hümâm'ın bu kapalı ifadeleri hakkındaki tartışma burada bitmemiş, aksine daha da kızışmıştır. Bunun açık bir örneği İbn Nüceym el-Mısrî'nin birçok yerde telfîki kullanarak fetva vermesi ve bunun caiz olduğu görüşünü İbnü'l-Hümâm'a atfetmesidir. Bir diğer örnek ise Molla Ferruh'un telfîkin bir istidlal yöntemi olduğunu ispatlamak için müstakil bir risale yazması ve bunun caiz olduğunu ispatlamaya çalışmasıdır. Nitekim İbnü'l-Hümâm'ın mücmel ifadeleri usul âlimleri tarafından günümüze kadar çokça incelenmiştir. Bu yüksek lisans çalışmasının temel amacı da, İbnü'l-Hümam'ın bu ifadelerden neyi kastettiğini ve bu ifadelerin telfikin geçerliliğine delil olup olamayacağını ortaya koymaktır."
