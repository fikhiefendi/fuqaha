abstract: "Rehin uzun ve kısa vadeli alacakların teminat altına alınmasını sağlayan yollardan biri olarak eski bir tarihe sahiptir. Gerek İslam öncesi Arap toplumunda gerekse diğer topluluklarda alacakları güvence altına almak için ticari hayatta yaygın bir biçimde uygulanmıştır. Bu toplumlarda rehin, borcun zamanında ödenmemesi durumunda alacaklının rehin konusu malı doğrudan kendi mülkiyetine geçirmesiyle sonuçlanıyordu. İslamiyet borçlunun aleyhine olan bu uygulamaya son vermiştir. Alacaklıya, borcun ödenmemesi halinde, ancak rehini paraya çevirterek, satış bedelinden alacağını tahsil etme hakkı tanıyarak onu da mağdur etmemiştir.Rehin verenin, mürtehine zarar vermeden rehinden yararlanması ondan izin alıp almamasına göre değerlendirilir. İzin almışsa rehinli maldan yararlanması - bunun keyfiyeti konusunda görüş ayrılığı olsa da - dört mezhebe göre caizdir. Ancak bunun, rehinin mürtehinin zilyetliğinden çıkmasını gerektirmesi durumunda rehin aktine ve tazmin sorumluluğuna etkisi mezheplere göre farklılık taşır. Râhinin, mürtehinden izin almadan rehinli maldan yararlanması Hanefî ve Hanbelîlere göre caiz değildir. Mâlikî ve Şâfîî mezhepleri mürtehine zarar vermemek kaydıyla bunda sakınca görmez. Ancak Mâlikîler'in, râhinin, rehinden bizzat değil mürtehin aracılığıyla ilkesi burada da geçerlidir.Rehin alan kişinin akid esnasında şart koşulmamışsa veya rehin verenin izni yoksa kural olarak rehni kullanma ve menfaatlerinden yararlanma yetkisi yoktur. Bazı fakihler merhunun, binilen, sağılan hizmetinden yararlanılan türden olması halini mürtehinin ona harcama yapıp yapmama haline göre değerlendirse de genel kanaat bu durumda râhinin izni olmadan yararlanamayacağı yönündedir. Râhinin izin vermesi durumu ise bu iznin akid esnasında şart koşulup koşulmaması ve rehinle teminat altına alınan alacağın karz ile ilişkisi dikkate alınarak geniş biçimde tartışılmıştır. Bu konuda olumsuz yaklaşım sergileyen fakihlerin temel kaygısının bu yararlanmanın riba şüphesi taşımasıyla ilgili olduğu anlaşılmaktadır."
