abstract: "İbn Salah, İslam ümmetinin fıkıh ve hadis alanlarında önemli alimlerindendir. Kendisine çok sorular sorulup ve fetva isteyenlerin ihtiyaçlarına binaen bir kitap (el-Fetavâ) yazmak zorunda kalmıştir. Bu kitap sonradan niceleri tarafından referans olarak özelikle şafilerce kabul edilmiştir. Bu kitap, fıkhın bütün konularını ihtiva etmesine rağmen çalışmamızda biz sadece evlilik ve boşanma konularını seçtik. İbn Salah çocukluktan beri ilim tahsil etmeye çalışmıştır. Hicri 577 yılında Kurtuba'da doğmuş ve 643 yılında Şehrezur 'da vefat etmiştir. İlim tahsil yolculuğundan çok değerli bilgiler toplamış ve büyük çabalar sarf ederek bu bilgileri tek kitapta toplamıştır. Bu kitabı Favaedü'r-rihle diye adlandırmıştır. Favaedü'r-rihle kitabı içerdiği bilgiler dolayısıyla çok muazzam ve nadir bir kitaptır.Bu kitap içerisinde nice ilimler ve kurallar barındıraktadır. İbn Salah nice görevler almış: Hadis kürsüsü başkanlığı, Şam Ravahiye'deki okulda müderrislik, Kudüs Nasiriye müftülüğü bunlardandır. İbn Salah'ın metodu, önce kendisine sorulan soruyu zikredip daha sonra cevabını veriyor, faydalı olması için her soruyu ayrı ayrı cevaplıyor ve ardından muhalif alimlerin fikirlerini, şafii mezhebi hariç, anıp bunlardan birini tercih ediyormuş. İbn Salahın kitaplarından ayrı olarak başka fetva kitaplarından da istifade ettim. Bu çalışmada el-Fetavâ kitabındaki bazı meseleleri seçip şafii ve diğer mezheplerle karşılaştırarak sunmaya çalıştım. Her meseleden sonra konuyu Irak aile hukuku kanunuyla karşılaştırdım. Irak aile hukuku kanunlarının çoğunun İbn Salah'ın görüşlerinden alındığını gördüm."
