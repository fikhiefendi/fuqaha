abstract: "Tezin konusunu yapı ipoteği oluşturmaktadır. Yapı ipoteği Türk Hukukunda nadiren çalışılmış bir konudur. Ancak yapı çalışanları için oldukça lehe hükümler içermektedir. Bu tez ile kurumun Türk Hukukunda ön plana çıkarılması ve çalışmanın yapı ipoteği uygulamasının artmasına hizmet etmesi amaçlanmıştır. Konu ile ilgili çalışma yapılırken ilk olarak Türk Hukukunda yer alan kaynaklar incelenmiştir. Ayrıca yapı ipoteğinin karşılaştırmalı hukuktaki yeri de dikkate alınmıştır. Yapı ipoteği ile ilgisi doğrultusunda diğer kurumlar da çalışmada incelenmiş bulunmaktadır. Yapı ipoteği tescile dayanan kanunî bir rehin hakkıdır. Bu haktan yükleniciler, alt yükleniciler, zanaatkâr ve şartların uygunluğu hâlinde diğer çalışanlar yararlanabilir. İpotek borçlusu üzerinde yapı işi gerçekleştirilen taşınmazın mâlikidir. İpoteğin konusu ise üzerinde yapı işi gerçekleştirilmiş taşınmazdır. Kamu malları, dernek ve vakıf malları ile madenler üzerinde yapı ipoteği tescil edilemez. İpoteğin tescil edilebilmesi için birtakım şartların gerçekleşmesi gerekmektedir. Tescil edilen ipotek diğer yapı ipotekleri ile aynı sırada yer alır. Ancak diğer ipoteklere karşı tescil tarihine göre sırası belirlenir. Yapı ipoteği taşınmazdaki değer artışı üzerinde öncelik hakkından yararlanabilir. Yapı ipoteği terkin ile taşınmazın yok olması ve kamulaştırılmasıyla sona erer."
