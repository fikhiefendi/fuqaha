abstract: "Kur'an-ı Kerim'de yiyecekler temiz ve pis olmak üzere ikiye ayrılmıs; temiz olanlar helal, pis olanlar haram kılınmıstır. Sadece temiz ve helal olanlardan yeme emri yalnızca Müslümanlara degil, tüm insanlıga verilmis bir emirdir. Yahudilerin kutsal kitabı olan Tevrat'ta ve Hıristiyanların kutsal kitabı olan ncil'de de bazı yiyecek yasakları bulunmaktadır. Bu tezde, slam dininin temel kaynagı olan Kur'anı Kerim ile kökleri itibariyle ilahi vahye dayanan Tevrat ve ncil'de etleri haram kılınan hayvanlar konusu mukayeseli olarak incelenmistir. Birinci bölümde Mekke müsriklerinin haram kabul ettikleri hayvanlar, ikinci bölümde Tevrat ve ncil'de haram olan hayvanlar, üçüncü bölümde ise Kur'an'da haram kılınan hayvanlar konusu ele alınmıstır."
