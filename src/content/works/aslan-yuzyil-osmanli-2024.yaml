abstract: "Bu çalışma, XVI. yüzyıl Osmanlı âlimlerinden Dede Cöngî diye bilinen Kemaleddin Dede b. Bahşî b. İbrahim'in (ö.1567) eserlerini inceleyi iktisadî görüşlerini ortaya çıkarmak ve tahlil etmeye yöneliktir. Dede Cöngi, Osmanlı Devleti'nin zirvede olduğu bir dönemde yaşamış, ülkenin farklı bölgelerinde kadı, müftü ve müderrislik yapmış, ömrünü kamu hizmetine adamış bir âlimdir. İslamî ilimlerde birçok eser yazmıştır. Eserlerinin bir kısmı yaşadığı dönemin sosyal, siyasî, iktisadî ve ahlaki sorunlarıyla ilgilidir. Özellikle“Risâle fi's-Siyâseti'ş-Şeriyye”ile“Risâle fî Esnafı Emvali Beyti'l-Mâl ve Ahkâmihâ ve Mesârifihâ”adlı iki eserinde kamu hukuku ve mâliye konularına değinmiş, kamu maslahatı; düzen ve istikrara dair devletin sorumluluklarını ele almıştır. Görüşleri, kamuda ve ilim camiasında ilgi uyandırmış, eserleri, XVI. yüzyıldan itibaren kaleme alınan laihalara; Osmanlı Devleti'nin siyasî, malî ve hukukî sorunlarına değinen ve çözüm önerileri sunan raporlara kaynaklık etmiştir. Çoğu elyazma halinde olan eserlerinin araştırılıp incelenmesi, görüşlerinin değerlendirilip tahlil edilmesi, özellikle iktisadî konularla ilgili fikirlerinin tespit ve analizi İslam İktisadı ve iktisadî düşünce tarihi açısından önemlidir."
