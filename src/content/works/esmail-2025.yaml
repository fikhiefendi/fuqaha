abstract: "Bu çalışma, küçük ve mikro ölçekli işletmeleri finanse etmek ve desteklemek için İslami kurallara uygun bir kitle fonlaması modeli geliştirmeyi amaçlamaktadır. Çalışmanın hedeflerine ulaşmak için, literatür taraması yapılarak başarılı kitle fonlama platformları örnekleri sunulmuş ve bunlar değerlendirilmiştir. Ayrıca, tüm teknik, operasyonel yönler ve taraflar arasındaki riskleri kapsayan bir anket kullanılarak veri toplanmıştır; bu taraflar arasında girişimci, potansiyel yatırımcı, platform ve çalışma mekanizması ile şeriat denetimi (yönetim) yer almaktadır. Sonuçlar, kitle fonlama platformlarının küçük işletmeleri finanse etmek için bir finansman çözümü olarak düşünülebileceğini, ancak bu platformların, özellikle platformların başlangıç aşamasında finansal kurumların tam bir alternatifi olmadığını göstermiştir. Ayrıca, herhangi bir platformun başarısı ve sürdürülebilirliği yalnızca teknolojik yönle ilgili değil, aynı zamanda platformun düzenleyici çerçevesi ve denetiminin etkinliğiyle de ilgilidir. Ayrıca, tüm tarafların çıkarlarını güvence altına alacak ve platformların işleyişini düzenleyecek açık yasalara ve düzenlemelere sahip olmanın önemi vurgulanmıştır. Çalışma, kitle fonlama platformları için uygun bir yasal sistemin oluşturulmasının, kitle fonlamasını düzenleyecek daha fazla yasa çıkarılmasının ve tüm tarafların korunmasının önemini vurgulamış, küçük işletme sahiplerinin bu finansman yöntemine ulaşımını artırmak için farkındalık seviyesinin yükseltilmesini önermiştir."
