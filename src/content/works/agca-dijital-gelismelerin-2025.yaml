abstract: "Zekât, İslam'ın belirli ön koşulları sağlayan bireylere yükümlülük olarak getirdiği, ancak doğrudan ve dolaylı etkileri itibarıyla toplumsal bir ibadettir. Küresel ölçekte artan açlık ve yoksullukla birlikte, gelir dağılımındaki adaletsizliğin giderek derinleşmesi olgusu yadsınamaz bir gerçektir. Bu bağlamda, modern dünyanın karşı karşıya olduğu ekonomik ve sosyal dengesizlikler karşısında zekât, gelir ve servet dağılımında dengeyi sağlamaya yönelik önemli bir potansiyel barındırmaktadır. Doğru motivasyonla kurumsal bir yapıya kavuşturulması halinde zekât sistemi, bireylerde sosyal farkındalık oluşturabilir ve ekonomik kaynakların daha adil bir biçimde paylaşılmasına aracılık edecek sürdürülebilir bir mekanizma işlevi görebilir. Bu çalışmada, zekât ibadetinin tarihsel süreçleri ve dönüşüm evreleri kısaca ele alınmıştır. Devamında, etkin bir zekât modelinin oluşturulabilmesi amacıyla çift yönlü yaklaşım benimsenmiştir. İlk olarak, zekât tarihinin ortaya koyduğu deneyimlerden hareketle, şeffaf, izlenebilir, etkin ve verimli bir zekât işleyişi için kamu otoritesinin yasal düzenlemelerle ve kurumsal mekanizmaları aracılığıyla sürece fiilen dâhil olmasının gerekliliği vurgulanmıştır. İkinci olarak, çağın sunduğu dijital yenilikler ve teknolojik uygulamaların, zekât yönetiminde etkinliği artıracak temel araçlar olduğu ifade edilmiştir. Ülkemizde hâlihazırda sosyal yardım faaliyetleri yürüten kurumlar incelendiğinde faaliyet alanlarının büyük ölçüde zekâtın sarf yerleriyle örtüştüğü görülmektedir. Kişi başına düşen servet verileri esas alınarak yapılan hesaplamalar, ülkenin potansiyel zekât hacminin, mevcut sosyal yardım kuruluşlarının sağladığı desteklerin çok üzerinde olduğunu göstermektedir. Bu çalışmada, zekât hacmini artırmayı, sosyal yardım kuruluşlarını kamu gözetiminde bir araya getirmeyi hedefleyen Türkiye Dijital Zekât Yönetim Şirketi modeli tasarlanmıştır. Önerilen bu model, zekât ibadetini mükellef ile sarf yerleri arasında uçtan uca izlenebilir bir biçimde yönetilmesini ve en uygun eşleşmenin hızlı ve verimli şekilde gerçekleştirilmesini amaçlamaktadır. Zekât konusunda güvenilir bir veri tabanına ulaşılması, yalnızca zekât yönetiminin etkinliği açısından değil, aynı zamanda ülkenin sosyal yardım politikalarının planlanması bakımından da önem taşımaktadır."
