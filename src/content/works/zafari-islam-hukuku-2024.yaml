abstract: "Bu çalışma, İslâm ve Afgan borçlar hukukunda borcun bir başkası üzerine naklini sağlayan havâle sözleşmesini konu edinmektedir. Bu bağlamda, öncelikle Hanefî mezhebi özelinde havâle sözleşmesinin üzerine binâ edildiği teorik altyapı incelenmiş, sözleşmenin genel özellikleri, kuruluşu, sona ermesi, hüküm ve sonuçları günümüz hukuk sistematiği kullanılarak aktarılmıştır. Çalışmamızda birçok klasik fıkıh eseri yanında modern dönemde yazılmış eserlerden de istifade ettik. Bununla birlikte Afgan Medenî Kanunu ve onun şerhlerinden yararlandık. Ayrıca Afgan ve Mısır Medenî Kanunu arasında pek çok benzerlik olduğu için Mısır Medenî Kanunu'nun önemli şerhi olan Senhûrî'nin el-Vasît isimli eserinden de faydalandık. Yapılan çalışma sonucunda İslâm hukukunda borcun naklini sağlayan havâle sözleşmesinin tutarlı bir bütün oluşturacak şekilde tesis edildiği ve Afgan borçlar hukukunda uygulamasının çok büyük ölçüde bu bütüne uygun ve riâyetkâr olduğu sonucuna varılmıştır. Anahtar kelimeler: Havâle, borcun nakli, İslâm hukuku, Afgan borçlar hukuku"
city: "Konya"
