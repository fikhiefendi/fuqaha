abstract: "“Kamu Özel Sektör İşbirliği Yatırımlarının Finansmanında İslami Finans Modeli: Sukuk”başlıklı üç bölümden oluşan bu tez çalışmasının ilk bölümünde; son yıllarda“Yeni Kamu Yönetimi”anlayışının hizmet sunum modeli olarak tezahür eden“Kamu Özel Sektör İşbirliği”modeli ele alınmış ve gelişimi incelenmiştir. Çalışmanın ikinci bölümünde; İslam Ekonomisi ve Finansı'nın özelikleri, fon kullanma ve kullandırma yöntemleri üzerinde durulmuştur. Türkiye'de ihraç edilen faizsiz sermaye piyasası araçlarına bakılmıştır. Bu bağlamda çalışmanın son bölümünde; son yıllarda gelişen İslami finans sermaye piyasası aracı olan Sukuk 'un özellikleri, avantaj ve dezavantajları incelenmiş, Kamu Özel Sektör İşbirliği modelinin ihtiyaç duyduğu sermayenin sağlanmasında alternatif bir finansman yöntemi olup olmayacağı üzerinde durulmuştur. İslami sermaye piyasası aracı olan Sukuk ve türleri ele alınarak değerlendirilmiştir. İslami sermaye piyasası araçlarının hangileri ile Kamu Özel Sektör İşbirliği modelinin ihtiyaç duyduğu sermayenin sağlanması uygun olabileceği araştırılmıştır. Küresel ölçekte yapılan Sukuk ihraçları ve Sukuk finansmanı ile yapılmış proje uygulamalarından örnekler verilmiştir."
