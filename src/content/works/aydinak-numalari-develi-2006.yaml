abstract: "Çalıştığımız dönem H. 1315-1317 / M. 1897-1899 yıllarına ait 47 numaralı DeveliŞer'iyye Sicili'dir. Çalışmamızın başında şer'iyye sicillerinin tanımı, ortaya çıkışı,Osmanlı Şer'iyye Sicilleri'nin tarihi gelişimi, şer'iyye sicillerinin önemi; konuylabağlantısı olması nedeniyle Osmanlı Devleti'nin hukukû yapısını, şer'i ve örfû hukukuana hatlarıyla ele alarak izah etmeye çalıştık.Millû Kütüphane'de Develi'ye ait 49 adet şer'iyye sicili bulunmaktadır. Bizden önceyalnızca bir tanesinin incelenmiş olduğunu görmüş olmamız üzerine biz de Develişer'iyye sicili üzerinde çalışmayı istedik. Bu belgelerden Develi'nin kapsadığı yerleşimyerlerinin tarihleri, ekonomik ve ticari faaliyetleri, memur listeleri, nüfusları vetoplumsal yapısı gibi değişik konularda bilgiye ulaşılmaktadır.Çalıştığımız dönemde Develi'de Müslümanlar, gayr-i Müslim tebadan olan Ermenilerve Rumlar bir arada yaşamışlardır. Temelde teokratik temellere oturan OsmanlıDevleti'nde slam hukukunun yanında örfi hukuk kurallarına uyularak gayr-i Müslimleriçin bir asimile politikası uygulanmamış, kendi dinlerini muhafaza etmiş ve asgarimüştereklerde uzlaşarak barış içerisinde yaşamışlardır. ncelediğimiz belgelerden 40adetinin Müslümanların birbirleriyle olan münasebetlerine ait olması, 48 adetinin gayr-iMüslimlerin kendi aralarındaki meselelerine ait olması ve 9 tanesinin ise Müslim-gayr-iMüslim arasındaki anlaşmazlık nedeniyle mahkemeye intikal etmiş olması da bununaçık bir ifadesidir.ncelediğimiz dönemde Müslüman halkın çoğunlukla ziraatla uğraştığını gayr-iMüslimlerin ise stanbul ile canlı bir ticaret ağı içerisinde olduklarını görmekteyiz.Sicilde daha çok alacak-verecek, miras, emlâk ve emvâlin fuzulen zaptı gibi konularınyanı sıra icar, nikah, boşanma, mehir, nafaka ve alım-satım konuları yer almaktadır."
