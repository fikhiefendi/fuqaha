abstract: "Türkiye'de faaliyet gösteren katılım bankaları, müşterilerine verdikleri bankacılık hizmetlerini İslam ekonomisi ve finansı ilkelerine bağlı olarak yürütmektedirler. Tasarruflarını faizsiz yatırım araçlarında değerlendirmek isteyen müşterilerin bilgi almak için ilk başvurdukları yerler genellikle katılım bankalarının şubeleri olmaktadır. Bu nedenle, katılım bankalarında özellikle müşterilere hitap eden şube çalışanlarının, İslam ekonomisi ve finansı açısından yeterli bilgi ve donanıma sahip olması gerekmektedir. Bu çalışma, şube çalışanlarına yönelik olarak verilen İslam ekonomisi ve finansı eğitimlerinin şube performansına etkisinin olup olmadığının ve kullanılan eğitim yöntemlerinden hangisinin daha verimli olduğunun tespit edilmesini amaçlamaktadır. İlk olarak katılım bankacılığı çalışan şube personeline İslam ekonomisi ve finansı eğitimleri sınıf içi yöntemle verilmiştir. İkinci olarak sanal sınıflar aracılığı ile uzaktan eğitim yöntemi kullanılmıştır. Üçüncü olarak ise VR uygulaması geliştirilerek sanal gerçeklik yöntemiyle eğitimler yapılmıştır. Üç farklı yöntemle yapılan eğitimler sonrasında, etki ve sonuç analizi yapılarak elde edilen bulgular karşılaştırılmıştır. Ortaya çıkan sonuçlar çerçevesinde, katılım bankacılığı personeline yönelik İslam ekonomisi ve finansı eğitimleri için hangi yöntemin şube performansına daha çok katkı sağladığı VIKOR araştırma yöntemi kullanılarak tespit edilmiştir. Bu araştırmadan elde edilen bulgulara göre, katılım bankaları çalışanlarına yönelik verilen İslam ekonomisi ve finansı eğitiminin şube bireysel performanslarını pozitif yönde etkilediği ve performans verimliliği açısından en iyi yöntemlerin ise sanal gerçeklik ve uzaktan eğitim ortamlarında verilen eğitim olduğu tespit edilmiştir."
