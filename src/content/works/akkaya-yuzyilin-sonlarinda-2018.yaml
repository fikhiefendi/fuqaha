abstract: "Bu çalışmanın amacı, Osmanlı vakıf sisteminde önemli bir yer tutan para vakıflarını, birincil kaynaklardan elde edilen malumatlarla gündeme taşımaktır. Para vakıfları, ellerinde bulundurdukları paraları, finansman ihtiyacı olanlara belirli ribh oranları ile borç vererek gelir elde etmektedirler. Fakat para vakıflarının gayr-i menkul malları kiraya vererek de gelir elde ettikleri olmuştur. İncelediğimiz muhasebe kayıtlarına göre para vakıfları, nakit sermayelerini işletirken üç yöntem kullanmışlardır. Bunlar; muâmele-i şeriye, istiğlâl ve ferâğ bi'l-istiğlâldir. Ayrıca para vakıflarının gayr-i menkullerini kiraya verirken icâreteyn başta olmak üzere icâre-i vahide ve mukataa yöntemlerini kullandığı da görülmüştür. Üsküdar mahkeme kayıtlarında bulunan 541 ve 573 numaralı defterlerde yer alan beş yıllık bir tarih incelemeye tabi tutulmuştur. 1212/1798 yılından 1216/1802 yılına kadar Üsküdar'da tespit edebildiğimiz 86 para vakfı vardır. Tespiti yapılan her vakfın gelir gider tabloları incelenmiştir. Elde edilen gelirlerin neler olduğu, ne kadarlık kısmının menkul mallardan ne kadarlık kısmının gayr-i menkul mallardan oluştuğu tespit edilmiş ve başlıklar halinde anlatılmıştır. Ayrıca vakıfların borç verirken hangi yöntemleri kullandıkları, ne gibi teminat aldıkları ve kiracıları hakkındaki bilgilere de yer verilmiştir. Son olarak para vakıflarının gider kalemlerinin hangi sınıflardan meydana geldiği incelenmiştir. Bu bölümde, vakıf görevlilerinin ücretleri ile sosyal hizmetlere harcanan masraflar izah edilmiştir. Araştırmanın sonucunda para vakıflarının borca ihtiyacı olanlara finansman sağlarken toplumun eğitim, bayındırlık ve dini hizmetlerini ifa ettikleri tespit edilmiştir."
