abstract: "Bir hukuki ilişki kapsamında doğan alacağın teminat altına alınması noktasında en çok başvurulan yollardan biri de rehin tesis etmektir. Bir alacağı teminat altına almak amacıyla rehne başvurulan pek çok durumda sigorta da fonksiyon göstermektedir. Zira alacaklının ve rehne konu olan eşya malikinin, rehinli eşyaya ilişkin menfaatlerin sigortalanmasında çıkarı vardır. Malik ve alacaklı, rehne konu eşyaya ilişkin menfaatlerini ayrı sigorta sözleşmeleri ile güvence altına alabilirler. Böyle hallerde aşkın sigorta söz konusu olmayacaktır. Bu noktada malik menfaatinin sigortalandığı haller ayrı bir önem arz etmektedir. Rehne konu olan eşyaya ilişkin malik menfaatinin sigortalandığı hallerde, söz konusu menfaat zarara uğramış ve malik lehine bir sigorta tazminatı doğmuşsa, rehin hakkı sigorta tazminatı üzerinde devam edecektir. Rehin hakkının sigorta tazminatı üzerinde devam ettiği durumlarda, rehin hakkının varlığını bilen ya da bilmesi gereken sigortacı, sigorta tazminatı üzerinde rehin hakları devam eden alacaklıların rızasını almaksızın malike yaptığı ödeme ile borcundan kurtulamayacaktır. Böyle hallerde malik, ek güvence göstermek ve rehne konu eşyayı eski haline getirmek şartıyla sigorta tazminatının ödenmesini talep edebilir. Fakat rizikoya maruz kalmış olmasına rağmen rehne konu eşya hala yeterli bir teminat teşkil ediyorsa, rehinli eşya malikinin sigorta tazminatının kendisine ödenmesini isteme yetkisinin olduğunun kabulü gerekir. Sigorta poliçelerinde yer alan dain-i mürtehin kaydı ise rehnin varlığını sağlayan bir hukuki belge değildir. Bu sebeple sadece sigorta poliçesindeki kayıtlara dayanarak sigorta tazminatı üzerinde rehin hakkının devamını kabul etmek doğru olmayacaktır. Sigorta tazminatı üzerinde rehin devam etse bile talep ve dava hakkı yine malikte olacaktır. Ayrıca rehinli alacaklıya riziko gerçekleşmeden önce de sigorta korumasının devamını sağlamaya dönük belirli imkanlar tanımıştır. Söz konusu imkanları sağlayan düzenlemeler ise sigorta sözleşmesinin sona ermesinden önce ve sonra olmak üzere iki ana ayrım etrafında yapılmıştır."
