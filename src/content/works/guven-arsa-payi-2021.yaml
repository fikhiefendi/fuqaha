abstract: "Arsa payı karşılığı inşaat sözleşmesinde ayıplı ifa, tezimizin konusunu oluşturmaktadır. Arsa payı karşılığı inşaat sözleşmesi, karma bir sözleşmedir. Bu sözleşmede, müteahhit sözleşmeye, kanuna ve dürüstlük kuralına uygun bir eser meydana getirmeyi garanti eder; bunun karşılığında işsahibi arsa veya arsa paylarının devrini vaat eder. Eğer müteahhit sözleşmeye, kanuna ve dürüstlük kuralına uygun olmayan, bir inşaat meydana getirirse bu durum ayıplı ifayı oluşturur. Tez çalışmamız, üç bölümden oluşmakta olup birinci bölümde genel olarak arsa payı karşılığı inşaat sözleşmesi ve özellikleri ele alınmıştır. İkinci bölümde, arsa payı karşılığı inşaat sözleşmesinde ayıplı ifa ve yüklenicinin ayıplı ifadan sorumluluğu incelenmiştir. Yüklenicinin ayıptan sorumluluğu ve bu sorumluluğun şartları üzerinde durulmuştur. Üçüncü bölümde, arsa sahibinin ayıplı ifa dolayısıyla sahip olduğu haklar incelenmiştir. İş sahibi, kanunla düzenlenmiş sözleşmeden dönme, ücretin indirilmesini, ayıbın giderilmesini talep etme ve tazminat isteme haklarını kullanabilir."
