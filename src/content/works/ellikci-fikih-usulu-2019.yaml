abstract: "İbadetler alanında gündelik hayatta en fazla muhatap olunan, muayyen vakitlerle sınırlandırılmış ve her bir mükellefin ferden yerine getirmekle yükümlü olduğu namaz ibadeti, kendisinde diğer ibadetlerden cüzler taşıyan önemli bir kulluk vecibesidir. Bu vecibenin kasten veya sehven terk edilmesi durumunda telafisi gerekmektedir. Vaktinde kılınmayan namazın telafisi, fıkıh literatüründe“kaza”kavramı ile karşılanmaktadır. Çalışmanın birinci bölümünde kazayla ilgili kelimelerin genel tasviri verildikten sonra ikinci bölümünde kaza kavramının usul-u fıkıh açısından tahlili yapılmıştır. Bununla birlikte namazların kazası temellendirilirken usûl âlimlerinin görüşlerine başvurulmuştur. Fıkıh usûlü eserlerinin emir başlığı altında incelenen kaza, asıl-vasıf ve nefsü'l-vucûb vucûbü'l-eda ilişkisi bağlamında değerlendirilmiştir."
