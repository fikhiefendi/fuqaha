abstract: "Bu çalışma, Türkiye bankacılık sektöründe etik uygulamaların mevcut durumunu değerlendirmeyi, çalışan algılarını analiz etmeyi ve etik yönetişim alanında iyileştirme gereksinimlerini ortaya koymayı amaçlamaktadır. Kuramsal çerçevesi; iş etiği, kurumsal yönetişim, etik kültür, etik kodlar ve etik liderlik kavramları etrafında şekillendirilmiş; bu kavramlar doğrultusunda etik davranışların kurumsal yapılar içerisindeki yeri bütüncül biçimde ele alınmıştır. Araştırmada, Türkiye'de faaliyet gösteren kamu ve özel sermayeli mevduat bankalarında görev yapan müdür yardımcısı ve üzeri unvanda çalışan toplam 599 yönetici ve çalışanın katılımıyla gerçekleştirilen anket çalışması temel veri kaynağı olarak kullanılmış; nicel ve nitel analiz yöntemleri bir arada uygulanmıştır. Araştırmanın birincil hedefi, etik sorun algısını, Kurumsal Sosyal Sorumluluk (KSS) ve Çevresel, Sosyal, Yönetişim (ESG) kriterlerine ilişkin farkındalık düzeylerini belirlemek ve bu değişkenlerin örgütsel güven ile iş tatmini üzerindeki etkilerini incelemektir. Bu kapsamda, etik söylemler ile kurumsal pratikler arasındaki örtüşme düzeyi saptanmış ve bankaların deklare ettikleri etik politika ve ilkelerin çalışanlar nezdinde nasıl algılandığı incelenmiştir. Ayrıca, örgütsel güvenin etik sorun algısı ile iş tatmini arasındaki ilişkide aracı rol üstlenip üstlenmediği test edilmiştir. Araştırma bulguları, çalışanların büyük çoğunluğunun etik kurallara ve etik kodlara yüksek düzeyde bağlılık gösterdiğini; ancak bu kuralların kurumsal kültüre etkin biçimde entegre edilmesi için etik eğitimlerin artırılması, iç denetim süreçlerinin güçlendirilmesi ve yönetsel şeffaflığın sağlanması gerektiğini ortaya koymaktadır. Özellikle etik liderliğin kurumsal yapılar içinde teşvik edilmesinin, çalışanların etik davranışa yönelik farkındalığını artırdığı görülmektedir. Bununla birlikte, etik değerlerin yalnızca bireysel farkındalık düzeyinde değil, aynı zamanda teknolojik dönüşüm süreçleriyle birlikte kurumsal düzeyde de yönetilmesi gerektiğine dikkat çekilmektedir. Özellikle yapay zekâ destekli karar sistemlerinin etik ilkeler doğrultusunda tasarlanması, bankacılığın gelecekteki yönetişim yapıları açısından kritik bir gereklilik olarak öne çıkmaktadır. Bu bağlamda çalışma, etik kodların etkin biçimde uygulanması, etik liderliğin kurumsal düzeyde desteklenmesi ve sürdürülebilir bir etik kültürün oluşturulması açısından önemli katkılar sunmaktadır. Elde edilen sonuçlar, etik bankacılık uygulamalarının yalnızca yasal uyumla sınırlı olmadığını, aynı zamanda toplumsal güveni ve kurumsal itibarı doğrudan etkilediğini göstermektedir."
