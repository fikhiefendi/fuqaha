abstract: "İmam Şâfiî, nebevî sünnete bağlılık, davet etme ve savunma noktasında son derece istekli birisiydi. Sünnetten hükümlerin istimbat ve akabinde amel edilebilmesi için hadisin sâbit olmasını yeterli görmesi onun metotları arasında yer almaktadır. Bunun bir göstergesi olarak, sahih hadisle amel etme konusunda ek şartlar ileri süren kimselerle çeşitli münakaşalarda bulunmuştur. Şâfiî'nin hadislerle amel etme konusunda hadisin sâbit oluşunu yeterli görmesi yaygın bir fenomen olmasına karşılık, birçok yerde hadis sâbit olduğu halde amel etmediği görülmektedir. Bu çalışmanın en temel problematiği, Şâfiî'nin mezkûr hadislerle neden amel etmediği sorusuna cevap aramaktır. Bunun için, Şâfiî'nin el-Ümm kitabının ibadet bablarındaki hadisler tümevarım yöntemiyle toplanmış ve neden bu hadislerle amel edilmediği etraflıca analiz edilmiştir. Buradan elde edilen verilerle Şâfiî'nin amel konusunda sünnete yaklaşımı, kabul şartları ve terk sebepleri yeniden tespit edilmiştir."
