abstract: "Bu tez, Hicri 10. yüzyıl alimlerinden olan ve Şerhu'l-Erbain en-Neveviyye adlı eseri kaleme alan Şeyh Ahmed b. Türki b. Ahmed el-Menşileli'nin (v. 979/1571) eserinin incelenmesi ve tahkik edilmesini amaçlamaktadır. El- Menşileli, bu eserinde Nevevî'nin Erbain Neveviyye metnine dair önemli şerhleri bir araya getirerek, şerh sahipleri olan et-Tufî, el-Fâkihânî, ed-Delcî gibi alimlerin görüşlerini aktarmış, bu görüşleri değerlendirmiş ve genelde cumhur ulemasının görüşüne daha yakın olanları tercih etmiştir. Ayrıca dil meselelerine dair açıklamalar yapmış ve anlaşılması zor olan birçok kelimeyi şerh ederek açıklığa kavuşturmuştur. Bu şerhin önemi, üzerine yüzü aşkın şerh ve açıklama yazılmış olan İmam Nevevî'nin Erbain Neveviyye adlı eserinin kıymetinden kaynaklanmaktadır. Tahkik sürecinde iki el yazması nüshadan yararlanılmıştır. Araştırmada Şeyh el-Menşileli'nin biyografisi ve ilmî kişiliği incelenirken, tarihsel ve betimsel yöntem takip edilmiştir. Tahkik kısmında ise karşılaştırmalı metin inceleme yöntemi uygulanmış; el yazması nüshalar karşılaştırılarak aralarındaki farklılıklar dipnotlarda belirtilmiştir. Ayrıca metinde yer alan ifadeler kaynaklarına atfedilmiş ve gerekli tahriç işlemleri yapılmıştır. Çalışma, şu önemli sonuçlara ulaşmıştır: Şeyh el-Menşileli, alimlerin görüşlerini titizlikle ve nadiren değişiklik yaparak aktarmış, görüşlerin kaynaklarını doğru bir şekilde göstermiştir. Erbain Neveviyye şerhlerinden sıklıkla alıntılar yapmış ve eserinde hadis kitapları, özellikle de sahihler ve şerhleri gibi geniş bir kaynak yelpazesinden faydalanmıştır. Sahih olmayan hadislerden de alıntı yapmış ve bunların isnadlarına dair sahih, hasen veya zayıf şeklinde değerlendirmelerde bulunmuştur. Şerhte dil meselelerine, şiir örneklerine ve garîbü'l-hadise özel bir önem vermiştir. Ayrıca, kelamî meselelere, özellikle de tartışmalı konulara değinmiş; örneğin Şia'daki takiyye meselesi ve Mutezile'nin mecaz ve hakikat anlayışını ele almıştır. Fıkhî meselelere de yoğun ilgi göstermiş ve özellikle Maliki mezhebi alimleri olan Davudi, el-Ebehri ve İbn Şa'ban gibi isimlerden sıklıkla alıntı yapmıştır. Eser, meseleleri sade ve açık bir üslupla ele almış, karmaşık ifadelerden ve gereksiz ayrıntılardan kaçınmıştır. Dolayısıyla, yazarın hedeflediği üzere, ilgili alanda kısa ve faydalı bir eser ortaya koyulmuştur."
