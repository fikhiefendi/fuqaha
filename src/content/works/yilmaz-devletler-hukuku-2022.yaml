abstract: "Müslümanlar, Allah Rasûlü zamanından başlayarak bugüne kadar gayri müslimlerle ilişki içerisinde olmuştur. Bu ilişkiler devletler hukuku tarafından incelenmiş ve kaydedilmiştir. Devletler hukuku, İslam uleması tarafından çeşitli fıkıh kitaplarında“Siyer”veya“Cihâd”başlığı altında ele alınmış, bu başlıkta Müslümanların gayri müslimlerle olan ilişkileri Kur'ân ve Sünnet ışığında delillendirilmiştir. Günümüzde Müslümanların gayri müslimlerle olan ilişkileri genellikle savaş üzerinden ön plana çıkarılmış, diğer ilişkileri ise göz ardı edilmiştir. Tezimizde, Allah Rasûlü'nün, devletler hukuku bağlamında gayri müslimlere yönelik hadisleri incelenecek, bu hadislerin tahrîci, sıhhat derecesi ve ricâl tenkidi yapılacaktır. Bu hadisler Hanefî fıkhında ön plana çıkmış olan, imam Meydânî'ye ait“el-Lübâb fî Şerhi'l Kitâb”adlı eserin“Siyer”bölümünde bulunmaktadır. Tezimizde ilgili hadislere binaen Allah Rasûlü'nün, gayri müslimlerle kurduğu ilişkiler tüm yönleriyle ele alınacak, bu ilişkiler hakkında Hanefî fukahâsı özelinde İslam ulemasının görüşlerine yer verilecektir. İslam ulemasının görüşleri çeşitli hadis şerhleri üzerinden, Hanefî fukahâsının görüşleri de ilk dönemden modern döneme kadar çeşitli Hanefî fukahâsı üzerinden gösterilmeye çalışılacaktır. Tezimizde“el-Lübâb fî Şerhi'l Kitâb”eserinin seçilme nedeni ise el-Lübâb'ın hem Hanefî mezhebinde muteber temel metinlerden biri olan Kudûrî'nin el-Muhtasarı'nın şerhi olması hem de telif edildiği dönemden günümüze kadar Hanefî literatüründe işgal ettiği konumdur. Tezimizin amacı, Müslümanların gayri müslimlerle olan ilişkilerinin sadece savaşa dayanmadığını gösterebilmek, aksine İslam dininin geçmişten bugüne kadar yeryüzünde adaleti, iyiliği ve beraber yaşamayı nasıl başardığını ortaya koyabilmektir. Tezin bu amacı, sahâbî, tâbiîn, İslam uleması ve Hanefî fukahâsının görüşleri çerçevesinde ispatlanmaya çalışılacaktır. Tezimizde, İslam dininin amacının keyfi bir cihan hâkimiyeti uğruna gayri müslimlere savaş açmak olmadığı, Müslümanların gayri müslimlerle olan ilişkilerinin Kur'ân ve Sünnet'e tâbi olarak belirli kriterler çerçevesinde olduğu ortaya konulmaya çalışılacaktır."
