abstract: "21. yüzyıla girildiğinde Müslüman toplumların genelinin ekonomik ve sosyal geri kalmışlıklarının devam ettiği görülmektedir. Buradan hareketle, çalışmanın şu üç temel amacı bulunmaktadır. İlki İslam toplumlarının neden geri kaldığı sorusunu yanıtlamaktır. İkinci olarak İslam inancının ve değerler sisteminin ekonomik gelişme anlayışının ne olduğunun ortaya çıkarılmasıdır. Üçüncü amaç ise İslam inancına bağlı bir gelişme anlayışından hareketle uluslararası bir gelişme endeksi oluşturmaktır. Bu çalışma İslam dininin ekonomik gelişme ile olan bağlantılarını açığa çıkararak, geri kalmışlığın, İslam inancı ve değerler sisteminden kaynaklanmadığı sonucuna ulaşmıştır. Müslüman toplumların ekonomik ve sosyal geri kalmışlıklarının içsel ve dışsal nedenleri bulunmaktadır. Yeniden ekonomik ve sosyal gelişmeyi sağlayabilmek için öncelikle gelişme sürecini frenleyen sebeplerin aşılabilmesi merkezi önemdedir. İslam dininin gelişme anlayışı maddi ve manevi gelişme kaynaklarının bütünlüğü içinde tasarlanmıştır. Gelişmenin hedefi insanın felahını ve refahını birlikte sağlamaktır. Bunun için bireyler ve toplum inanç ve sosyal değerlerin önerdiği zihniyet yapısı ile ekonomik ve sosyal davranışlarına yön verebilir. İslam inancında insan, Allah'ın yeryüzündeki halifesidir. İnsanın hem kendisine hem de toplumsal ve doğal çevreye karşı sorumlulukları vardır. Bu sorumluluk, gelişmeyi gerçekleştirme ve sürdürme anlayışına dayanır. Bu anlayış ekonomik davranışa, ahlaki bir piyasa içerisinde yön vermektedir. Bu sürecin temel motivasyonu adalet, denge, meşveret, maslahat, liyakat, marifet ve bireyin özgürlüğünü gözeten değerler bütünüdür. Bunlar İslami gelişme değerleridir. Çalışmanın uygulama kısmında bir İslami Gelişme Endeksi hazırlanmıştır. Bu endeks, İslami gelişmeyi temsil ettiğini düşündüğümüz maddi ve manevi gelişme göstergeleri belirlenerek oluşturulmuştur. Göstergeler 2018 yılı için 148 ülkenin verileri toplanarak istatistiksel standartlaştırma yöntemi ile bir endekse dönüştürülmüştür. Endeksin sonuçlarına göre Müslüman nüfusu yoğun ülkeler İslami gelişmede Birleşik Arap Emirlikleri, Katar ve Malezya gibi birkaç ülke haricinde üst sıralamalarda yer almamaktadır. İslami gelişmede birinci sırada gelen ülke İsviçre olarak bulunmuştur. Endekste Müslüman ülkeler arasında en yüksek puanla 20. sırada Birleşik Arap Emirlikleri yer almıştır."
