abstract: "Bu çalışma, III./IX. yüzyılın önemli sûfî şahsiyetlerinden Sehl b. Abdullah et-Tüsterî'nin (ö. 283/896) tefsir metodolojisini incelemektedir. İlmî kişiliği, sünnete bağlılığı ve aşırılıklardan uzak mutedil yaklaşımıyla öne çıkan Tüsterî, bu özellikleri dolayısıyla Hâris el-Muhâsibî (ö. 243/857) ekolünün bir takipçisi olarak kabul edilmektedir. Kur'an'a dair işârî yorumlarıyla meşhur olan Tüsterî'nin tefsiri, müteakip dönemlerdeki tefsir literatüründe geniş şekilde atıf görmüş; ayrıca görüşleri tasavvuf, ahlâk ve terbiye alanındaki eserlerde de nakledilmiştir. Bu tez, Tüsterî'nin tefsir metodolojisini analitik ve karşılaştırmalı bir yaklaşımla incelemeyi amaçlamaktadır. Araştırmanın bulguları, onun birden fazla tefsir yöntemini bir arada kullandığını ortaya koymaktadır. Bunlar arasında rivâyet tefsiri (Kur'an'ın Kur'an'la, sünnetle, sahâbe ve tâbiîn yorumlarıyla tefsiri) ile Arap dili ve şer'î ilimlere dayalı dirâyet tefsiri yer almaktadır. Bu yöntemlere, Tüsterî'nin şahsî tasavvufî bakış açısının yansıması olan belirgin bir işârî boyut eşlik etmektedir. Zamanla, yorumlarını bazen deliller, rivâyetler ve sâlihlerin sözleriyle desteklemiş, bazen de yalnızca nakil yoluyla yetinmiştir. Yapılan karşılaştırmalı analiz, Tüsterî'ye nispet edilen yorumların %80'inden fazlasının temelde Hz. Peygamber (s.a.v.), sahâbe, tâbiîn ve etbâʿu't-tâbiîne dayanan rivâyetlerle örtüştüğünü göstermektedir. Bununla birlikte Tüsterî, bu rivâyetleri pasif bir şekilde aktarmamış; onları yeniden formüle etmiş, farklı geleneklere ait malzemeyi sentezlemiş ve kendine özgü işârî bir yorum katmanı eklemiştir. Bu sebeple onun tefsiri, hem erken dönem tefsir mirasının bir devamı hem de zâhirî ve bâtınî anlamları bütünleştiren özgün bir katkı olarak değerlendirilebilir. Bu çalışma, Tüsterî'nin tefsir tarihindeki yerini belirlemek, kendisinden önceki müfessirlerle metodolojik ve doktriner ilişkisini netleştirmek ve işârî tefsiri rivâyet ve dil temelli tefsir yöntemlerine paralel meşru bir yorum tarzı olarak nasıl kurumsallaştırdığını göstermek suretiyle Kur'an ilimleri alanına katkı sağlamaktadır."
