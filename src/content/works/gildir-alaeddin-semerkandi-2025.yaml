abstract: "Bu çalışmada Alâeddin es-Semerkandî'nin (ö. 539/1144) Tuhfetü'l-Fukahâ adlı eserinde İmam Şâfiî'ye (ö. 204/820) nispet edilerek aktarılan görüşlerin aidiyeti incelenmektedir. Bu bağlamda öncelikle Tuhfetü'l-Fukahâ'da farklı şekillerde aktarılan görüşler tespit edilerek titizlikle tercüme edilmiş ve bu görüşlerin İmam Şâfiî'ye nispetinin sıhhatini belirlemek üzere Şâfiî fürû-i fıkıh kaynaklarına müracaat edilmiştir. Yapılan bu müracaatın neticesinde nispeti isabetli olan görüşler izah edilmiş, nispetinde hata bulunduğu tespit edilen görüşler ise gerekçelendirilerek tashih edilmiştir. Bu usul üzere kaleme aldığımız çalışmamız dört bölümden oluşmaktadır. Birinci bölümde, araştırmanın önemi, amacı, yöntemi, kaynakları ve sınırlılıklarına ilişkin bilgilerin yanında müellifimiz Alâeddîn es-Semerkandî'nin hayatı, hocaları, öğrencileri ve eserlerine dair bilgiler aktarılmıştır. Daha sonra ise Tuhfetü'l-Fukahâ'nın içerik, metot ve üslup açısından değerlendirmesi yapılarak kaynakları ve üzerine yapılan çalışmalar hakkında bilgi verilmiştir. İkinci bölümde, Tuhfetü'l-Fukahâ'nın ibadetlere ilişkin konuları ele alınmış ve bu konular içerisinde İmam Şâfiî'ye nispet edilmiş olan 246 görüş incelenmiştir. Yapılan bu inceleme neticesinde bu görüşlerin 233'ünün isabetli, 13'ünün ise hatalı olduğu tespit edilmiştir. Üçüncü bölümde, muâmelâta dair 198 görüş incelenmiş ve bunların 187'sinin isabetli, 11'inin ise hatalı olduğu kaydedilmiştir. Dördüncü ve son bölümde ise araştırmanın genel değerlendirmesi yapılmış ve elde edilen sonuçlar detaylı bir biçimde açıklanmıştır. Sonuç olarak, yapmış olduğumuz tahkik çalışması neticesinde Tuhfetü'l-Fukahâ'daki İmam Şâfiî'ye nispet edilmiş olan 444 görüşün -tekrarlar hariç- 420'sinin isabetli, 24'ünün ise hatalı olduğu tarafımızca tespit edilerek kayıt altına alınmıştır."
