abstract: "Taşıyıcı annelik günümüzde ilgi çeken bir mesele olarak gündemdeki yerini korumaktadır. Bu çalışmada taşıyıcı annelik ile ilgili genel bilgiler yanında İslam hukuku açısından değerlendirilmesi, konu ile ilgili şahıs ve kurum görüşlerinin dile getirilmesi, Türkiye?deki hukuki statüsü, dünyadaki uygulanış biçimleri, ilgili tıbbi kavramlar ve bu kavramların İslam hukuku açısından değerlendirilmesi yer almaktadır. Bu araştırmada amaç yeni bir görüş iddia etmek değil, mevcut görüşleri ortaya koymak ve konu ile ilgili detaylı bilgi vermektir. Taşıyıcı anneliğin en yaygın tanımı çocuk sahibi olmak isteyen kimselerden oluşmuş embriyonun üçüncü bir taraf olan farklı bir kadının rahmine yerleştirilmesidir. Çalışmamızda gerçekleşmesi muhtemel taşıyıcı annelik kombinasyonuna da yer verilmiştir. Taşıyıcı annelik hakkındaki görüşlerinin değerlendirilmesi açısından taşıyıcı annelik türleri önem arz etmektedir. Bu konuya İslam hukukçularının bakışı dört ana başlıkta toplanmaktadır. Bunlar taşıyıcı anneliğin bütün durumlarda haram olduğunu iddia edenler, taşıyıcı anneliğin eşlerin üreme hücrelerinden oluşmuş embriyonun taşıyıcı anneye nakli şeklindeki uygulamanın caiz olduğunu iddia edenler, taşıyıcı anneliğin yalnızca evli çiftlerden oluşan embriyonun yine koca ile nikah bağı olan ikinci eşin rahmine yerleştirilmesi durumunda caiz olabileceği iddiasında bulunanlar ve sperm bağışı veya yumurta bağışı şeklinde üreme safhasına üçüncü şahısların dahil olduğu gerçekleşmesi muhtemel embriyonun taşıyıcı anneye nakli şeklindeki uygulamayı ittifakla haram kabul edenler şeklinde işlenmiştir. Aynı zamanda ülkemizdeki ilahiyatçıların ve İslam hukukçularının konuyla ilgili görüşlerine ve taşıyıcı annelikle ilgili kurumsal fetvalara yer verilmiştir. Taşıyıcı anneliğin gerçekleşmesi neticesinde dünyaya gelen çocuk ile ilgili birçok hukuki sonuç terettüp eder. Araştırmada taşıyıcı annelikte anne ve babanın kim olduğu, çocuğun bu sürece dahil olanlar ile ilişkisi, nesep, miras, hidane ve süt akrabalığı gibi fıkhi konularla ilişkisine de değinilmiştir. İlgili tıbbi kavramlar ve bunların İslam hukuku açısından değerlendirilmesi de yer almaktadır."
