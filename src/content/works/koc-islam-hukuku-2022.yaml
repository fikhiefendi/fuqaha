abstract: "Bu çalışmamızda müsâdere cezasının mülkiyet hakkı karşısındaki yeri incelenmiştir. Mali ceza türlerinden biri olan müsâderenin, meşru bir ceza türü olup olmadığı ve mülkiyet hakkını ihlal edip etmediği İslam hukukçuları tarafından tartışılmıştır. İslam hukukçularının çoğunluk görüşü müsâdere cezasının caiz olmadığı şeklindedir. Bunun temel sebebi İslam dininin, meşru yollarla elde edilen mülkiyet hakkı ve onun dokunulmazlığına yaptığı vurgudur. Nitekim İslam, insanlara hayatları boyunca sahip olacakları üç temel ve dokunulmaz hak vermiştir. Bunlar; ismet, hürriyet ve mülkiyet haklarıdır. Mülkiyetin getirdiği haklardan faydalanmanın ve dokunulmaz kılmanın temel şartı, meşru yollarla elde edilmiş, mütekavvim mal ve kazanç olmasıdır. Böylelikle bir Müslüman, elindeki mülk ile ticaret yapabilmekte ve sahih akitler kurabilmektedir. Mâliki olduğu mala herhangi bir dış müdahale söz konusu olduğunda hakkını arayabilmekte ve zararının tazmin edilmesini talep edebilmektedir. Rüşvet, karaborsacılık, hırsızlık, gasp gibi meşru olmayan yollarla elde edilen kazançlarla birlikte kan, domuz eti, şarap gibi gayrimütekavvim maddeler ise meşru mülkiyet sebebi sayılmamıştır. Bu nedenle söz konusu kazançlar, mülkiyet dokunulmazlığının dışında tutulmuş ve dış müdahalelere açık hale gelmiştir. Söz konusu yollarla elde edilen mal ve kazançların biriktirilmesi, ticaret yapılması yasaklanmış ve kurulan akitler batıl kabul edilmiştir. Bu gerekçelerle müsâderenin meşru olmayan yollarla elde edilen mülkiyete karşı uygulanmasına ise birçok hukukçu onay vermiştir. Devletler müsâdere cezasını, başlarda sadece meşru olmayan kazançlara yönelik olarak uygulamaya başlamıştır. Fakat daha sonra müsâdere, siyasi güç elde etmek, servet biriktirmek ve insanları baskı altında tutmak gibi amaçlarla uygulanır hale gelmiştir. Hal böyle olunca kişilerin meşru yollarla elde ettikleri mülkiyetleri de müsadereye konu edilmiştir. Bu da insanların mülkiyet hakkının yok sayılmasına yol açmış ve toplumsal olaylara zemin hazırlamıştır."
