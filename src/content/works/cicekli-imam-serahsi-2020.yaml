abstract: "Maveraünnehr âlimlerinden Karahanlılar döneminde yaşamış olan Serahsi yaşadığı dönemin en önemli ilmi şahsiyetlerindendir. İlmi faaliyetlerin merkezinde olup ilmiye sınıfında etkin rol oynamıştır. Bu dönemde devlet içinde zamanla siyasi gücün temsilcisi haline gelen ilmiye sınıfı ile bu sınıfı kendisine tehdit olarak algılayan iktidar arasında gerginlik oluşmuştur. Hanedan iktidarını göstermek ve ilmiye sınıfını terbiye etmek amacıyla âlimleri cezalandırmıştır. Hanedanın bu politikları ve gerginlikten Serahsi de nasibini almıştır. Önce kuyuda sonra kaledeki bir zaviyede on beş sene hapsedilmiştir. Bu dönemde Hanefilik baskın mezhep olup eğitim öğretim müfredatı da buna göre şekillenmiştir. Bu nedenle Hanefilerin temel kaynakları olan Muhammed eş-Şeybani'ye ait“zahirü'r rivaye”eserlerine yazılan muhtasarlardan, Hâkim eş-Şehid el-Mervezi'ye ait olan el-Kâfi Maveraünnehr bölgesinde meşhurdur. Bu muhtasara pek çok şerh yazılmış olup, Serahsi'nin yazdığı aynı adlı şerh öne çıkarak günümüze kadar el-Mebsut adıyla gelmiştir. el-Mebsut bir fıkıh kitabı olmakla birlikte, hükmün delillerinin ilk ve en önemlisi olan kitabı ele alış biçimi ve ayetlerle ilgili verdiği bilgiler bakımından, tefsire dair açıklamaları içinde barındırmaktadır. Furu' fıkıh için yazılmış olan el- Mebsut, hükmün kaynağı olan ayetlerle ile ilgili açıklamaları yaparken usul-ü fıkh süzgecinden geçirdiği tefsir ilminin kendisine sunduğu malumatlara yer vermektedir. Fıkh ise edinilen bu malzemenin hükme dair sonucunu ortaya koymaktadır. Bununla birlikte Serahsi ahkâm içerikli ayetlerin tefsirini yapmaktadır. Ahkâm ayetleri ile sınırlı olması dolayısıyla Serahsi'nin el-Mebsut'unun ahkâm tefsiri olduğunu söylemek mümkündür. Tefsirinde, Kur'an'ı Kur'an ile tefsir etmiş, rivayet tefsirini öncelemiş, ayette kelime ve deyimleri tahlil ederek filolojik açıklamalar yapmış, ayeti bağlantı kurduğu başka bir ayetle ile açıklamıştır. Bu bakımdan el-Mebsut tefsir kaynağı olarak değerlendirilirken, Kur'an ilimleri teori ve uygulamasının nasıl gerçekleştiği de ortaya çıkmaktadır."
