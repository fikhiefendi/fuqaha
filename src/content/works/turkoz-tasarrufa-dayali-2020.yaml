abstract: "Tasarrufa Dayalı Finansman sistemi yurtdışında, özellikle Avrupa'da muhtelif şekillerde farklı isimler altında uzun yıllardır uygulanan ve özellikle konut finansmanı alanında oldukça başarılı görülen bir finansman yöntemidir. Sistem tasarruf, dayanışma, elbirliği gibi dayandığı temel kavramlar açısından Anadolu kültürü için yeni olmamakla birlikte taşıdığı inovatif özellikler bakımından Türkiye'de faizsiz finans alanında yeni bir finansman modeli olarak hızlı bir büyüme ivmesi yakalamıştır. 1980'lerin ortalarından itibaren kredi sisteminin kolaylaşıp yaygınlaşması etkisiyle tasarrufa sahip olmadan hızlı tüketim veya öz kaynağa sahip olmadan hızlı büyümeyi tercih eden Türkiye toplumu, kredi sisteminin sonradan anlaşılan olumsuzlukları nedeniyle son yıllarda tasarrufa ve elbirliğine dayalı sistemini cazip bulmaya başlamıştır. Artan ilgi nedeniyle bu tür firmaların sayısı hızla artış göstermiştir. Tasarrufa dayalı elbirliği sistemini icra eden özel kurumların, temelde fon transferi gerçekleştirilmesine aracılık etmelerine rağmen henüz finans sistemi kapsamında düzenleme altına alınmamış olmaları ve etkin bir risk yönetimine sahip olmamaları nedeniyle önemli ölçüde risk potansiyeline sahip olduklarını göstermektedir. Bu çalışmada ülke ekonomisinde önemli bir yere sahip olan ve İslami finansın önemli bir kurumsal ayağı olduğu iddia edilen Tasarrufa Dayalı Faizsiz Finansman sistemi ile çalışan kurumların risk potansiyeli ve İslami finans kurallarına uygun bir şekilde nasıl etkin bir risk yönetimi uygulanabileceği üzerinde durulmuştur. Bu sektörün finansal riski, sektörü temsil edebilecek düzeyde büyüklük ve tecrübeye sahip firmanın gerçek finansal verileri ve raporlarıyla ortaya konmaya çalışılmıştır. Türkiye'deki bu sektörün, uygun mevzuatın olmaması boşluğunun da etkisiyle gerek yönetilmeyen finansal risklere gerekse fıkhi mahzurlara sebep olduğu görülmektedir. Yapı ve operasyon itibarıyla finansal kurum işlevi görmelerine rağmen firmaların sadece organizasyon olarak tanımlanmış olması, onları Türk Ticaret Kanunu kapsamına almakta ve bu kurumların hesap planı oluşturma ve raporlamayı finans kurumlarına uygun biçimde yapmamasına neden olmaktadır. Çalışmanın sonucunda bu sektörün daha etkin bir risk ölçümüne ve yönetimine sahip olması için gereken kurumsal ve denetsel düzenlemeler hususunda öneriler sunulmuştur."
