abstract: "Bu çalışmada 1742-1850 tarihleri arasında Halep'ten Divân-ı Hümâyûn'a yapılan şikâyetler incelenmiştir. Osmanlı Devleti'nin üçüncü büyük kenti olan Halep, aynı zamanda uluslar arası ticaretin önemli merkezlerinden biri olma özelliğine sahiptir. Şehrin adının uluslararası ticaretle anılması, merkeze iletilen şikâyetlerin ekonomi ağırlıklı olmasına neden olmuştur. Birinci bölümde Halep'in Osmanlı idaresinde kaldığı yaklaşık 400 yıllık tarihini kısaca anlattık. İkinci bölümde aynı zamanda hukuki metinler olan Ahkâm Defterlerini anlamamızda yardımcı olacak kavramsal alt yapının hangi esaslar üzerine inşa edildiğini anlamaya çalıştık. Osmanlı hukukunun genel yapısı, Gayrimüslimlerin Osmanlı hukukundaki yeri, Osmanlı mahkemelerinin yapısı, yargı kararlarına itiraz mercii olarak Divân-ı Hümâyûn bu bölümde değerlendirilen konulardır. Üçüncü bölümde 9 adet Halep Ahkâm Defterlerini şekil açısından inceledik. Bu bölümde defterlerde yer alan belgeler konularına, şikâyetin yapıldığı şehirlere, dinlerine, kadın-erkek oranlarına ve yönetici-yönetilen olma durumlarına göre kategorilendirilmiştir. Her defter ayrı bir alt başlıkta olacak şekilde bu veriler grafikler kullanılarak yorumlanmıştır. Bu bölümde belgelerin içerik olarak değerlendirilmesi daha sınırlı kalmış, daha çok şekil ve sayısal veriler üzerinde durulmuştur. Dördüncü ve son bölümde defterlerde konulara göre ayrılan veriler içerik olarak değerlendirilmiştir. Konular kısaca izah edildikten sonra, konu ile ilgili belgeler dipnot olarak tamamen ya da ilgili kısmı alınarak kullanılmıştır. Değerlendirdiğimiz başlıca konular alacak-verecek, tımar sistemi, vakıflar, genel şikâyetler, adi suçlar, idari işler, eşkıyalık, aile hukuku, hukuksuz vergi, iskân, murabaha ve sosyal meselelerdir. Çalışma Eyâlet Ahkâm Defterleri esas alınarak hazırlanmış ilk çalışmalardandır. Bu çalışmada esas amaç taşranın temel şikâyet konularının neler olduğunu tespit etmek ve yapılan şikâyetlere devlet merkezinin ne gibi çözümler sunduğunu anlamaktır."
