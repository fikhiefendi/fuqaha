abstract: "Bu tezde Faslı düşünür ve ahlak felsefecisi olan Taha Abdurrahman'ın fıkıh ve fıkıh usûlüne dair ortaya koyduğu yeni bakışının ne olduğu ve onun bu konudaki görüşleri tespit edilip değerlendirilmiştir. Bu çalışma giriş ve üç bölümden oluşmaktadır. Giriş bölümünde araştırmanın konusu, önemi ve amacı, yöntemi, sınırı ve araştırmanın kaynakları verilmiştir. Birinci bölümde Taha Abdurrahman'ın, amacı insanın salahı olan bir ahlâk ilmi olarak makâsıd ilminin yenilenmesi çağrısında bulunduğu çıkış noktası izah edilerek, ahlâk ilmi ile usûl-ı fıkıh arasındaki birbirine girme/tedâhülü ele alınmaktadır. İkinci bölümde Taha Abdurrahman'ın fıkıh ile alakalı olan i'timânî bakışına odaklanılarak fıkhın ahlâkî yönü izah edilmeye çalışılmıştır. Üçüncü bölüm önceki iki bölümde zikredilen konuların değerlendirilmesine hasredilmiştir. Sonuç kısmında ise araştırma sürecinde elde edilen bilgiler ve tespitler özet olarak değerlendirilmiştir."
