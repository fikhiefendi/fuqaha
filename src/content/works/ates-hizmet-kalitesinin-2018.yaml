abstract: "Gerek global gerekse de ülkemiz bazında bankacılık sektöründe yaşanan yoğun rekabet, teknolojide yaşanan gelişmeler ve yaygın şubeleşme dolayısıyla bankalar faaliyetlerini devam ettirebilmek ve sürdürülebilir karlılık sağlamak adına hizmet kalitelerini artırma, bu anlamda da müşteri tatmini sağlamaya ve böylelikle hem mevcut müşterilerini koruma hem de yeni müşteriler kazanarak marka sadakati ve müşteri değeri oluşturmaya çalışmaktadırlar. Bu çalışmanın amacı hizmet kalitesinin ve hizmet kalitesini oluşturan boyutların, müşteri tatmini marka sadakati ve müşteri değerine etkisinin araştırılması olup, farklı prensipler üzerinden faaliyetlerini devam ettiren katılım bankaları ile ticari bankaların müşterilerinin tatmininin sağlanmasında hangi faktörlerin etkili olduğunun ortaya konmasıdır. Çalışmanın ilk bölümünde bankacılık, ticari ve katılım bankalarına ilişkin bilgilere yer verilmiş, sonraki bölümlerde ise tatmin, sadakat ve müşteri değeri kavramları üzerinde durulmuştur. Son bölümde ise araştırma modeli oluşturulmuş, hizmet kalitesi boyutlarının müşteri tatmini, marka sadakati ve müşteri değeri üzerindeki etkileri araştırılmıştır. 321 kişi ile yapılan bir anketle toplanan veriler istatistiksel olarak değerlendirilmiş, katılım bankaları, ticari bankalar ve her iki banka türü ile de çalışan müşterilerin tatmin düzeylerinin hizmet kalitesinin hangi unsurlarından etkilendiği, müşteri sadakatinin ve müşteri değerinde hizmet kalitesi boyutlarına ilave olarak müşteri tatmininin nasıl bir etkisinin bulunduğu ortaya konmaya çalışılmıştır."
