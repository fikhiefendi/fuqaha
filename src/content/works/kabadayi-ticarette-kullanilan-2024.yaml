abstract: "Günümüz teknolojik ve ekonomik gelişmeler ışığında uluslararası ticaretin kullanım alanı gün geçtikçe genişlemektedir. Bunun doğal bir sonucu olarak, gerçekleşen ticari işlemlerin kontrol edilebilmesi ve taraflar arasında oluşabilecek anlaşmazlıkların önüne geçilmesi gerekmektedir. Bu sebeplerden ötürü uluslararası alanda otorite sağlayan bir kurum oluşturulması ve uluslararası ticari işlemlerin yeknesak bir kural bütününe bağlanması kaçınılmazdır. Bu amaçla, gerçekleşen ticari işlemlerin kapsamına müdahil olarak ticari teslim şekilleri geliştirilmiştir. Çalışmamız, günümüz dış ticaret işlemlerinde kullanılan ve ilgili mevzuat kapsamında düzenlenen teslim şekillerinin İslam Hukuku açısından değerlendirilmesini konu edinmektedir. Çalışmamızın amacı, günümüzde gerçekleştirilen uluslararası ticari işlemlerin daha sağlıklı bir biçimde gerçekleşmesine yönelik öneriler sunmak ve bu alandaki muhtemel problemleri tespit ederek problemin giderilmesine katkı sağlamaktır. Çalışmamız üç bölümden oluşmaktadır. Bu kapsamda çalışmanın birinci bölümünde Incoterms ve teslim şekilleri hakkında bilgi verilmiştir. İkinci bölümde İslam Hukukunun kabz fiiline yönelik hükümleri incelenerek teslim şekillerinde kabzın tamamlanması durumu incelenmiştir. Çalışmanın üçüncü ve son bölümünde ise Incoterms teslim şekillerine yönelik hasar sorumluluğunun nakli, tasarruf yetkisinin intikali ve masraf sorumluluğunun geçişi huşularının İslam Hukuku bağlamında değerlendirmesi yapılmıştır. Çalışmanın bölümleri içerisinde teslim şekillerinin her biri detaylı olarak incelenmiştir. Dış ticaret işlemlerinde kullanılan 11 teslim şekli içerisinde yer alan 4 teslim şeklinin fıkhen tartışmalı olduğu değerlendirilmiştir. Çalışma neticesinde mevcut alanın geliştirilmesine veya yeni ürünlerin çıkmasına fırsat sağlanabildiği gibi bu alana yakın konularda değerlendirme yapılması gereken hususları da gün yüzüne çıkararak alanın teorik gelişimine de katkı sağlanmıştır."
