abstract: "İnsanların yaşamını devam ettirebilmesi için temel gereksinimleri bulunmaktadır. Güvenlik ihtiyacı da bu gereksinimlerin içerisinde yer almaktadır. Tarih boyunca insanlar güvenliklerini korumak için çeşitli önlemler almıştır. Zamanın ilerlemesi ve teknolojinin gelişmesi ile suçlara karşı alınan güvenlik önlemleri de farklılıklar göstermiştir. Ayrıca coğrafya ve kültürlere göre suç sayılabilecek ögelerde farklılık göstermektedir. Bu yüzden suça karşı alınan önlemlerde farklı olabilmektedir. İslam hukukunun temelini Kur'an-ı Kerim ve Sünnet oluşturmaktadır. İslam hukukunda Müslümanlar, Kur'an-ı Kerim'i bildiği için işledikleri suçların farkındadır. Hemen her Müslüman birey suç ve suç unsurları hakkında temel seviyede bir bilgiye sahiptir. Bir suç işlenirken, bunun sorumluluğunu ve sonuçlarına katlanmayı göze almaktadır. İslam Hukuku'na göre suç ve suç unsurları İslamiyet'e göre belirlenmiştir. Suç faktörleri Allah'ın günah kıldığı, dünyevi hareket ve eylemlere denilmektedir. Türk Ceza Kanunu ile mukayese edildiğinde İslam Hukuku'nda suç ve suçun unsurları konusunda birçok noktada benzerliklerin bulunduğu, bazı noktalarda ise farklılıkların olduğu görülmektedir Bu çalışmada kavramsal ögelerle birlikte İslam hukuku ve Türk Ceza Kanunu mukayeseli olarak, araştırmalar doğrultusunda açıklanmaya çalışılmıştır."
