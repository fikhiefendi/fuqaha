abstract: "Hanefî ve Şâfiîler arasındaki fıkhî ihtilafın anlaşılması ancak iki mezhebin fıkıh usulündeki görüşlerinin bilinmesiyle mümkündür. Zira her ne kadar mezhepler arasındaki ihtilaflar, özünde mezhep âlimlerinin fer'î meselelere verdikleri hükümlere dayanıyor olsa da, bu hükümler tarih süresince mezhepleri temsil eden usûl kurallarıyla tartışılmış ve bunlar vesilesiyle anlaşılmıştır. Bu usûl kuralları fürû fıkhın tamamında benimsenen metotlar haline gelmiş ve mezheplerin hareket noktalarını temsil etmiştir. Dolayısıyla tarihi arka planda fürû fıkhın ifade edilmesi ve mezhep görüşlerinin gelişimi bu usûl kurallarıyla sağlanmıştır. Klasik ve çağdaş araştırmalarda bu iki mezhebin ihtilaflarıyla ilişkili olan usûl kurallarını inceleyen eserler bulunmasına karşın, her iki mezhebin fürû fıkhın hangi alanlarında, hangi usûl kurallarına sıkça atıf yaptıkları araştırılmaya muhtaçtır. Buna bağlı olarak bu araştırmanın ana gayesi Hanefî ve Şâfiîler'in ibadet konularında ihtilaf ettikleri fıkhî hükümlere hâkim olan usûl kurallarını tespit etmek, sonrasında ise Kudûrî'nin (v. 428/1037) Tecrîd ve Gazzâlî'nin (v. 505/1111) Tahsînu'l-meâhiz adlı hilaf eserlerinde bu kurallarla ilişkili fer'î meseleleri karşılaştırmalı olarak göstermektir."
