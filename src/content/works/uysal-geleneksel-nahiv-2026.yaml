abstract: "Cahiliye dönemi olarak adlandırılan İslamiyet'ten önceki dönemde Araplar, kendi dillerini düzgün ve doğru bir şekilde, yani en fasih hâliyle kullanıyorlardı. Bu dönemde dilin gramerine dair yazılı bir eser mevcut değildi. Çünkü dilin kullanımı doğal bilgi tabanlıydı ve herhangi bir dil kitabına da ihtiyaç yoktu. Ancak Kur'an-ı Kerim'in inzali ve İslamiyet'in hızla geniş bir coğrafyaya yayılması özellikle Arap olmayan toplumların dini daha iyi kavrayabilmesi için bu dilin doğru öğrenilmesini zorunlu hâle getirmiştir. İlk defa hicri II. (8. yüzyıl) ile IV. (10. yüzyıl) yüzyıllar arasında Arapça dil bilgisi (nahiv ve sarf) alanında çalışmalar yapılmış ve bu dönem, Arap gramerinin sistematik olarak inşa edildiği bir dönem olmuştur. Bu dönemden günümüze kadar birçok çalışma yapılmış ve bu alanda eserler kaleme alınmıştır. Araştırmada çalışmanın yürütüldüğü eserlerin yüzlerce hatta binlerce kitap içinden sıyrılıp hem yazıldıkları dönemde hem de günümüzde meşhur olmalarındaki sebepler ve etkenler üzerinde durulmuştur. Bu çalışmada, farklı coğrafyalarda nahiv ilmi alanında kaleme alınmış olan ‟İbn Âcurrûm'un“el-Âcurrûmiyye”adlı eseri ile Mutarrizî'nin“el-Misbâh”isimli eserinin incelenerek mukayesesinin yapılması, farklarının ve ortak yönlerinin daha iyi görülebilmesi ve bu vesileyle de nispeten her iki coğrafyadaki nahiv eğitim öğretim anlayışına dair birtakım ipuçlarının tespiti amaçlanmıştır. Bu iki eserin daha yakından tanınabilmesi, ele aldıkları konuların karşılıklı mukayeselerinin yapılıp yazılma gerekçelerinin tespiti hakkında değerlendirme yapılmıştır."
