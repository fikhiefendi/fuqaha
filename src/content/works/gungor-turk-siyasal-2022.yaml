abstract: "Bugün sosyal, ekonomik ve siyasi hayatımızda ortaya çıkan problemleri çözüme kavuşturabilmek için bu sorunların kaynağına inerek, bunlara neden olan unsurların hassasiyetle tespit edilmesi ve bunların ortadan kaldırılmasına yönelik detaylı ve kapsamlı çalışmalar yapılması gerekmektedir. Adil Düzen'de, bu sorunların sistemi meydana getiren unsurların çeşitli özelliklerinden kaynaklandığı ve mevcut sistem içinde bu sorunlara çözüm üretilemeyeceği iddia edilmektedir. Adil Düzen, her ne kadar Millî Görüş Hareketi'nin temel tezi olarak öne sürülmüş gibi görünse de aslında bu sistemin prensipleri, Allah'ın peygamberleri aracılığıyla vahyedilen ilahi düzeninin çok eski zamanlara kadar uzanan gerçeklerine dayanmaktadır. Dolayısıyla bu düzen, insanlık tarihi kadar eski bir anlayışa sahip olup temel esasları buna göre tanzim edilmiştir. Bu nedenle Adil Düzen'de, peygamberlerin batıl ile olan mücadelesine atıfta bulunularak, yeryüzündeki çatışma ve çekişmelerin temelinde hak ve batıl mücadelesinin yattığı ileri sürülmektedir. Sistemde hem hakkın dayandığı hem de batılın dayandığı temel esaslar belirlenmiştir. Bir şeyin doğruluk ve saadet yolu olan hak yol mu, yoksa zulüm ve sömürü yolu olan batıl bir yol mu olduğu, bu esaslardan hangilerine dayandığının tespit edilmesiyle ortaya çıkarılmaktadır. Çalışmanın ilk bölümünde, Adil Düzen kavramı, tarihsel süreci ve hak ve batıl anlayışın dayandığı temel esaslar incelenmiştir. Sonraki bölümde, bugün dünya üzerinde yaşadığımız ve şahit olduğumuz toplumsal dengesizlikler, aşırı gelir eşitsizliği, ekonomik istikrarsızlıklar, fakirlik vb. konular çeşitli raporlardan elde edilen verilerle de tespit ve teyit edilmiş ve bunlara neden olan sömürü ve emperyalist anlayışın arka planında yatan zihniyetin kaynakları saptanmaya çalışılmıştır. Daha sonraki bölümlerde ise Adil Düzen'de sorunların ana kaynağına inilerek, tespit edilen mevcut problemlere karşı ne gibi çözüm yolları getirildiği üzerinde durulmuştur. Son olarak Necmettin Erbakan'ın 1992 yılında Orta Doğu Teknik Üniversitesi'nde verdiği Adil Ekonomik Düzen konulu konferans yazıya aktarılmış ve ilgili veriler MAXQDA 2020 nitel veri analiz programında analiz edilerek elde edilen çıktılar yorumlanmıştır."
