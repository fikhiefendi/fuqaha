abstract: "İslam-Osmanlı hukuku içerisinde kişiler, hukukun öngördüğü sınırlar dahilinde istedikleri gibi sözleşme yapabilme ve mülklerinde tasarrufta bulunabilme hakkına sahiptir. Tarafları hukuki işlem yapmaya sevk eden irade ve hukuki işlemi inşa eden irade beyanlarının birbirine uygun olması işlemin geçerliliği açısından büyük önem arz etmektedir. Ancak kimi zaman tarafların gerçek iradeleri ile irade beyanları arasında uygunsuzlukların meydana geldiği görülmektedir. Bu uygunsuzluk tarafların kastı olmaksızın meydana gelebileceği gibi kasıtlı olarak de uygunsuzluğun meydana getirildiği görülmektedir. Çalışmamıza konu olan muvazaa işlemi de kasıtlı olarak meydana getirilen uygunsuzluk hallerinden biridir. Muvazaa, kişilerin gerçek iradelerine aykırı olarak ve üçüncü kişileri aldatmak amacıyla sahte bir sözleşme yapmalarıdır. Kişiler vergi gibi kanuni bir yükümlülükten kaçmak, alacaklı ya da varislerinden mal kaçırmak ya da bir hukuki düzenleme ile yasaklandığı bir işlemi gerçekleştirmek gibi hukuka aykırı sebeplerle muvazaalı işlemlere başvurabilir. Bunun haricinde muvazaalı işlemin tarafları arasında sonradan ihtilaflar da yaşanabilir. Dolayısıyla hukuka aykırılıkların ve olası hak kayıplarının önüne geçebilmek için tarafların gerçek iradelerinin ortaya çıkarılması son derece önemlidir. Türk hukuk sisteminde yaygın olarak yer alan muvazaalı işlemlere İslam-Osmanlı hukuk sisteminde de rastlanılmaktadır. Genel yapısı ve unsurları açısından iki hukuk sistemi arasında benzerlikler vardır. Bununla beraber muvazaalı işlemlerin hukuki sonuçları açısından belirgin farklılıklar da mevcuttur. İslam-Osmanlı hukukunda görünürde yapılan sözleşmenin geçerliliği açısından sözleşme türleri farklılık göstermektedir. Aynı zamanda tarafların muvazaalı işlem hakkındaki tutumları da muvazaalı işlemin geçerliliği üzerinde etkili olmaktadır. Bu açıdan İslam-Osmanlı hukuk sisteminin teorik açıdan günümüz hukukundan farklı bir yapıda olduğu görülmektedir. Bu çalışmada muvazaalı işlemler, İslam ve Osmanlı hukuku kaynakları dahilinde teorik olarak incelenmiştir. Dönemin fetvalarından, İstanbul kadı sicillerinde yer alan örneklerden yararlanılmıştır."
