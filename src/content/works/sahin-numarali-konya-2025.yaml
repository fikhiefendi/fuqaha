abstract: "Osmanlı mahkemelerinde verilen kararların ve kayıtların tutulduğu defterlere şer'iye sicili denir. Kadı sicili, kadı divanı şeklinde ifade edilen bu defterler, kadı ya da naibi tarafından yazılmış ve çeşitli belgeleri içermiştir. Şer'iye sicilleri, kadıların kayda aldığı hüccet, ma'ruz, mürasele, berat, ferman gibi belgelerden oluşan ve iktisadi, sosyal, hukuki kısımları ele alarak döneme dair önemli bilgiler veren birinci elden kaynak niteliği taşımaktadır. Siciller, sadece yargılamalara dair kararları değil, aynı zamanda dönemin toplumsal yapısını ve ekonomik faaliyetlerini de yansıtan belgelerdir. Bu nedenle kısıtlı imkânların olduğu dönemde yazılı kayıtlarla olayların aydınlatılmasında önemli bir rol oynamaktadır. Şeri mahkemeler insanların haklarını aramada bir köprü görevi görmüştür. 337 sayfa ve 792 belgeden oluşan 20 Numaralı Konya Şer'iye Sicili, 1085-1086 (1674-1675) yıllarını kapsamaktadır. Bu belgelerin içeriği dönemin sosyal, iktisadi, hukuki ve idari hayatına dair çeşitli belgeleri içermektedir. Sicilde yer alan belgeler, vali, naip ve vasi tayinleri, gasp, darp, içki, hırsızlık, sahtekâlık, ölüm keşfi, talâk, namzed, muhala'â, mülk satışı, borç, vergi ve vakıf davalarını kapsamaktadır. Bu çalışmalar, sadece o dönemin hukuki süreçlerini yansıtmakla kalmamakta ve aynı zamanda toplumun gündelik yaşamı, ticaret, dini meseleler ve yönetimle ilgili detaylı bir bakış açısı da sunmaktadır. Bu bağlamda, 20 Numaralı Konya Şer'iye Sicili'nin ayrıntılı bir şekilde değerlendirilmesi ve transkripsiyonunun yapılmasıyla, dönemin sosyal yapısı, iktisadi durumu, hukuki süreçleri ve idari yönetimi hakkında derinlemesine bilgi edinilmesi amaçlanmaktadır. Bu tür siciller, Osmanlı toplumu hakkında kapsamlı bir anlayış geliştirilmesine katkı sağlamaktadır."
