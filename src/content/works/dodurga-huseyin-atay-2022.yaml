abstract: "Modern ile gelenekçi düşünceyi bünyesinde barındırıp, tefekkür perspektifinden hareket ederek, İslam düşüncesinin evrimleşmesinde en büyük katkı sahibi olan Atay, içtihatı müdafaa ettiğini kitaplarında açık bir şekilde görmemiz mümkündür. Geleneksel kültürün hakim olduğu irrasyonel karaktere sahip, düşünceyi eleştirerek akıl ve rasyoneliteyi öne çıkarmak suretiyle kendi sistemini inşa etmiştir. Fıkıh ilminin problemlerine içtihatıyla berrak cevaplar vererek, yeni ufuklar aralamayı başarmış olan alimimiz büyük bir yankı uyandırdığı aşikardır. Üç ayrı bölümden oluşan çalışmamızın ilkinde: İçtihat‟a bağlı olarak, tecdit, bid‟at, reform kavramlarını, dayandıkları gerekçeler ve sunulan örnekler doğrultusunda değerlendirerek açıklamayı hedeflemektedir. Fıkhi problemlerinin çözümüne imkan tanıyan içtihatın, tarihi seyrini ve bu bağlamda mücettit, Hz. Ömer‟in içtihatlarından örnekler verip içtihat kapısının kapandığı iddialarına ışık tutarak, yaşanan çözümsüzlük noktasında, nasları ve ilahi iradenin maksadının ne olduğunu akıldan hareketle belirleneceği, amacını taşımaktadır. İkinci bölümde ise, içtihat düzeltmeleri bağlamında, itikad, ahkam ve ibadetler şeklinde ayırıp örnekler nezdinde, mevcut ekol sistematiğinin hükümlerinden sıyrılarak naslar çerçevesinde, içtihatın çözüm zenginliğini anlatarak, araştırma yapmayı gerekli kılmıştır. Tasavvufa müstakil bir başlık açarak İslam düşüncesi bağlamında değerlendirip , örtüşmeyen hususları anlatarak çözüm önerileri sunmayı amaçlamıştır. Son başlığımızda ise günümüzün problemlerini tek tek ele alıp ana rotamız nas - akıl ışığında bir bütünlük içerisinde yeniden anlama gayretiyle yorumlamayı, göstermek hedeflenmektedir."
