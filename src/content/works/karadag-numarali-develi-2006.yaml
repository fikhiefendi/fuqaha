abstract: "Tarih ; yazılı, sözlü ve kalıntı şeklindeki kaynaklara dayanarak geçmişe ışık tutan birbilimdir. Tarihin en önemli yazılı kaynaklarından biri de Şer'iyye Sicilleridir. Şer'iyyesicilleri, Osmanlı devletinde Kadı'ların verdiği hükümleri ve yazıya geçirilen diğerkayıtları içerirdi. Bir bölgenin kadısı her olayı , bir şahitliği ,bir hibeyi , bir ikrarımüracaat üzerine kayıtlara geçirirdi.Şer'iyye Sicilleri , Osmanlı Devletinin tarihi açısından en önemli kaynaklardan biridir.Osmanlı şer'iyye mahkemelerinde tutulan bu kayıtlar, o dönemdeki hukuki, ekonomik,dini, askeri ve idari uygulamalar hakkında bize ışık tutmaktadırlar. Ayrıca Osmanlınınyıkılmasından sonra yerine kurulan devletlerin tarihini Şer'iyye Sicillerini incelemedendoğru bir şekilde anlayamayız.Develi, Akdeniz ve ç Anadolu bölgeleri arasında bir köprü olması hasebiyle stratejikbir konuma sahiptir.O dönemlerde Develide Müslüman ve gayri Müslim halkınbirlikte yaşadığı mahalleler mevcuttu.Aynı zamanda Develi tarih boyunca bir çokmedeniyete tanıklık etmiştir.Şer'i mahkemelerde müslümanlar gayri Müslimlere, gayri Müslimler de Müslümanhalka şahitlik ve vekillik yapıyorlardı. 19. yüzyılda Müslüman halk genellikle tarım vehayvancılıkla uğraşırken, gayri Müslim halk ise ticaret ve zanaatla geçimlerinisağlıyorlardı."
