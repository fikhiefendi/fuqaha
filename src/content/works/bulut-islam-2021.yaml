abstract: "Bu çalışmanın temel araştırma konusu İslam hukuku açısından \"hukuki eksikliğe ilişkin bilgisizlik\" olgusudur. Bu olgu medeni hukuktaki \"iyiniyet\" terimi ile menfaatler çatışması ve hukuki görünüşe güven gibi ilgili kavram ve kurumlar çerçevesinde analiz edilmeye çalışılmıştır. Hukuki eksikliğe ilişkin bilgisizlik, kişinin hukuk kurallarını veya başkasına ait bir hakkı ihlal etmeyi kastetmediğini gösterir. Fıkıh literatüründe pek çok meselede bu yaklaşımın izlerini görmek mümkündür. Bunun yanı sıra fıkıh âlimleri genel olarak hukuki eksikliğe ilişkin bilgisizliği, zâhire itimad edilmesi veya zilyedlik ya da karşı tarafın beyanı gibi bir takım harici işaretlere, karinelere ve alametlere güvenilmesi bağlamında ele almaktadır. Bu çalışmada iyiniyet kavramı İslam hukuku açısından temellendirilmeye ve iyiniyetin korunması meselesine dair fikrî arkaplan tespit edilmeye çalışılmıştır. Hanefi mezhebi merkezli olmak üzere İslam hukukunda iyiniyetin korunduğu temel bazı meseleler tespit edilerek bu meselelerdeki iyiniyet hükümleri nispeten detaylı bir şekilde tahlil edilmiştir. İyiniyetin korunması, genel bir ifade ile temel ilke ve kurallara nispetle istisnai bir özellik arz ettiği için belli başlı iyiniyet meselelerini ele alarak iyiniyetin korunduğu hükümleri belirlemek ve ilgili kavramsal örgü etrafında bu mesele ve hükümleri tahlil etmek İslam hukukunda iyiniyetin korunmasına dair temel yaklaşımı ortaya koymak anlamına gelmektedir."
