abstract: "Bu çalışma, temelde tahkik ve inceleme olmak üzere iki bölümden oluşmaktadır. Çalışmanın tahkik kısmında, Kınalızâde Ali Efendi'nin (ö. 979/1572) Osmanlı âlimi Molla Hüsrev'e (ö. 885/1480) ait ed-Dürer isimli eserine yazdığı hâşiyesinin tahkiki yapılmıştır. Amaç ise henüz tahkik edilmemiş olan bu eserin literatüre kazandırılması ve eser hakkında tanıtıcı gerekli malumatı sağlamaktır. Tahkikte eserim bütün nüshaları temin edilerek nitelikli üç nüsha üzerinden mukâbele yapılmış ve böylece en doğru metin tespit edilmeye çalışılmıştır. Metnin daha iyi anlaşılmasına katkı sağlamak amacıyla az bilinen kişi, yer ve kavramlar hakkında ilgili kaynaklardan gerekli bilgiler verilmiştir. Ayrıca müellifin alıntı yaptığı veya atıfta bulunduğu eserlere müracaat edilerek bu bilgiler teyit edilmiş ve bu eserlerin dipnotta cilt ve sayfa numaraları gösterilmiştir. Bunların yanı sıra eserin daha kolay incelenmesi amacıyla eser için kaynakça, içindekiler ve fihrist kısımları oluşturulmuştur. Çalışmanın birinci kısmı olan inceleme/dirâse kısmında ise öncelikle Molla Hüsrev ile Kınalızâde'nin hayatları, ilmî kişilikleri ve hocaları hakkında tabakât ve terceme kaynaklarından bilgiler verildi. İnceleme kısmının özgün taraflarından birisi, Kınalızâde'nin Molla Hüsrev karşısındaki durumunun tespitidir. Nitekim Kınalızâde birçok bağlamda ve konuda Molla Hüsrev'i teyit edip desteklemekte ve onun lehine ifadelerde bulunmaktadır. Benzer şekilde birçok konu ve meselede ise Kınalızâde'nin Molla Hüsrev'i eleştirdiği ve aleyhine gerekçeler ileri sürdüğü görülmektedir. Bu yönüyle Kınalızâde'nin hâşiyesi, salt bir takip etme ve tabi olmayı değil, ilmî kaygıları ön plana çıkaran eleştirel bir hâşiye olmayı hedeflemektedir. Ayrıca Kınalızâde'nin, dile getirilmeyen sorunları ve eksiklikleri dile getirmesi, gündeme gelmeyen meseleleri gündeme taşıması, zayıf delil ve gerekçeleri güçlendirme suretiyle metni bir bütün olarak daha ileri taşıması ve hem mesâil hem de mesele dizilimini ihtiyaçlar muvâcehesinde kısmen değiştirmesi bu hâşiyede dikkat çeken hususlardandır. Son olarak eserin nüshaları ve esere ilişkin teknik bilgiler de inceleme kısmında sunulmuştur."
