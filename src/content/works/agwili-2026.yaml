abstract: "Bu çalışma, İslami ekonomik sistemin ilkeleri doğrultusunda rant ekonomisinden üretim ekonomisine geçişin gerekliliklerini analiz etmeyi amaçlamakta ve uygulamalı bir örnek olarak Libya'ya odaklanmaktadır. Çalışma, temel araştırma sorusuna cevap aramaktadır: İslam iktisadı düşüncesine göre rant ekonomisinden üretim ekonomisine geçişin yolları nelerdir? Ayrıca İslam düşüncesinde üretim ekonomisinin özelliklerini ortaya koymak ve bu dönüşümü destekleyebilecek şer'î ve finansal araçları incelemek hedeflenmektedir. Çalışma, teorik ve uygulamalı boyutlarıyla betimleyici-analitik yöntemi benimsemiştir. Uygulamalı kısım, Libya'daki İslami finans kurumları ile kamu sektöründe çalışan 149 uzmandan oluşan bir örneklem üzerinde yürütülmüştür. Veriler; ortalamalar, standart sapmalar ve ANOVA testi gibi betimleyici ve çıkarımsal istatistiksel yöntemlerle analiz edilmiştir. Böylece İslami finansman mekanizmaları ile üretim ekonomisine geçiş arasındaki ilişki belirlenmiştir. Bulgular, petrol gelirlerine bağımlılığı nedeniyle rant ekonomisinin üretime dayalı dönüşümün önünde önemli bir engel oluşturduğunu göstermektedir. Buna karşılık İslam iktisadı, gerçek üretim ve emeğe dayanan daha dengeli ve adil bir model sunmaktadır. Ayrıca özellikle müşareke ve mudaraba gibi İslami finansman araçlarının kaynakları harekete geçirerek üretken yatırımlara yönlendirme konusunda etkili olduğu ortaya çıkmıştır. Çalışma, İslami finans kurumlarının etkinleştirilmesinin ve petrol gelirlerinin üretim projelerine yönlendirilmesinin önemini vurgulayarak sonuçlanmaktadır. Ayrıca eğitim, tarım ve yenilenebilir enerji gibi kritik sektörleri desteklemek amacıyla kalkınma sukuklarını kullanacak“İstihlaf Fonu”isimli bir egemen fonun kurulmasını önermektedir."
