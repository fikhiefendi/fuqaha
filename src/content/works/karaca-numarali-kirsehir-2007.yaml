abstract: "Ser'iyye sicilleri XV. yüzyılın ikinci yarısı ile XX. yüzyılın ilk çeyregi arasındaki döneme ait Osmanlı tarihi ve kültürünün hukukî, içtimaî ve siyasî kaynaklarıdır. Siciller, yargı yetkisine sahip olan kadıların vermis oldukları kararları, tuttukları zabıtları, idarî, siyasî ve hukukî yazısmaları içeren tarihi vesikalardır. Kırsehir ile ilgili önemli tarihi bilgilerin ortaya çıkarılmasına katkıda bulunmak ve sehrin siyasi, içtimaî ve idarî yapısını daha etraflı bir sekilde ortaya koymak için bu kayıtların incelenmesi yapılmaktadır. Çalısmamızın temel kaynagı olan Kırsehir Ser'iyye Sicillerinin mikrofilmleri Ankara Millî Kütüphanesinde bulunmaktadır. 23 Numaralı Kırsehir Ser'iyye Sicili Millî Kütüphane'den fotokopi yolu ile temin edilmistir. Bundan sonraki dönemde sicilin transkripsiyonu, tezin degerlendirilmesi ve bibliyografya taraması yapılmıstır. Söz konusu ser'iyye sicilindeki belgelerin tamamı günümüz harflerine çevrilmistir. Yine aynı sekilde bütün belgeler konularına göre tasnif edilmistir. Tezin sonunda yer alan ekler kısmında teze konu olan sicilin orijinali fotokopi yolu ile çogaltılmıs bir nüshası verilmistir. Tüm bu düsünce ve çalısmalar sonucunda, Kırsehir'in dolayısıyla Osmanlı Devleti'nin siyasî, askerî, malî, idarî ve içtimaî tarihine ısık tutabilecek bilgiler elde edilmistir."
