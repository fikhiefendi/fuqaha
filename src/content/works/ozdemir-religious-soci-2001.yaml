abstract: "oz Türkiye'de Ekonomik ve Dinsel Dönüşüm: MÜSİAD (Müstakil Sanayici ve İşadamları Derneği) Örneği. Şennur Özdemir Doktora, Sosyoloji Bölümü Tez Yöneticisi: Prof. Dr. Sencer Ayata Ekim 2001, 319 pages Bu çalışmada, Türkiye'nin sosyo-ekonomik ve dinsel dönüşümü MÜSİAD örneği bağlamında irdelenmiştir. Ekonomik ve dinsel-kültürel alanlar, bu örnek bağlamında genellikle düşünüldüğünün aksine birbiriyle alakasız veya birbirine zıt değil, birbirini tamamlayan alanlar olarak ele alınmıştır. MÜSİAD yeni bir işadamı örgütlenmesi ve İslami kimliğe sahip bir sivil oluşum olarak, diğer dinsel oluşumlardan farklı özellikleriyle -salt dinsel amaçlı olmayışıyla- Türk iktisadi ve siyasi yaşamındaki yerini almış durumdadır. MÜSİAD'ın yukarıda belirtilen özellikleri, bu çalışmayı, dini bir oluşumu politik olmayan bir perspektiften çalışıldığı Türkiye'de yapılan az sayıda,çalışma araşma sokmuştur. Çalışmada kulllanılan ana teknik, anlamacı metodolojiye -hermenetic- temel sağlayan derinlemesine görüşme tekniğidir. Bunlar, Ankara, Konya ve İstanbul'daki toplam 55 MÜSİAD 'lı işadamlarıyla yapılan derinlemesine görüşme kayıtlan ve diğer alan çalışması notlarından ibarettir. Bunlara ilave olarak, MÜSİAD yayınlarından da olabildiğince geniş biçimde yararlanılmaya çalışılmıştır. Bu çalışma, Türkiye'deki mevcut gelişmeler temelindeki dinsel ve sosyo-ekonomik süreçlerin analiz edildiği iki ana bölümden oluşmaktadır; ilkinde asıl olarak kültürel-mental süreçler olarak dinsel dönüşüm, ikinci bölümde ise modern sınıf formasyonu biçiminde ve modern/yeni iktisadi etkinlik biçimlerinin yaygınlaşması olarak deneyimlenenen bir sosyo ekonomik dönüşüm sözkonusudur. Bir oluşum olarak MÜSİAD'ın sahip olduğu 'iktisadi'lik özelliği nedeniyle her iki bölümde yapılan analizler (dinsel) dönüşümün ekonomik boyutlarıyla sınırlandırılmıştır. Bu aynı zamanda MÜSİAD'ın bir moral öncü olarak alınmak suretiyle, ilk bölümün 'Müslüman Çalışma Etiğinin Dönüşümü' olarak örgütlenmesinin de nedenidir. Böylece, bu çalışmada bir orta smıf girişimci grup temsilcisi olarak MÜSİAD'ın geniş Müslüman grupları, 'İslami Cihat'm' biçimlendirdiği sosyo-ekonomik yapılanmadan 'İktisadi Cihat' zihniyetine bağlı bir yeni sosyo-ekonomik sisteme yönlendirdiği savunulmaktadır. Bu bölümde analiz edilen temel tartışma konularından bir diğeri de devlet, demokrasi ve halk gibi temel politik kavramlar etrafında oluşturulmuştur. Bu tartışma için, MÜSIAD gibi İslami gruplar bağlamında sadece MÜSİAD'dan sağlanan bilgiler değil ama bu konuda oluşturulmuş yeni literatür de kullanılmıştır. Genelde İslam dinini özelde de İslam ülkelerini modern devlet ve demokrasi gibi kavramların dışında düşünen yaygın literatüre karşı bu çalışmada tarihsel ve sosyo ekonomik süreçlerin vurgulandığı alternatif bakış açısı benimsenmektedir. Bu bölümde yapılan üçüncü bir tartışma da, varsayıldığının aksine gerek İslamcı hareket içindeki konumlan gerekse de Türkiye'nin modernleşme süreci içindeki yerleri bakımından dinamik bir grup olarak karşımıza çıkan Müslüman kadınlar bağlanımdadır. Türk toplumunun genel dönüşümü içinde MÜSİAD'ın ve dinsel modernizasyonun rolünü analiz etmeyi amaçlayan ikinci bölüm belli başlı iki tema etrafında örülmüştür: 1) globalizasyon kavramı: Kısa ve uzun vadeler açısından MÜSİAD'ın iktisat ve toplum sahnesine çıkmasında artan iç ve dış pazarların önemi ve globalizasyon sürecinin kışkırttığı modernizasyona koşut çok kültürlülük. Böylece İslam dini ulusal ve uluslararası ortamlarda engelleyici değil olanak sağlayıcı ve daraltıcı değil genişletici bir özellik olarak karşımıza çıkmaktadır. 2) girişimcilik ve orta sınıflaşma: Bu çalışmanın temel tezine göre modernleşme sürecinde İslami grupların bu kategoriler çerçevesinde anlamlı bir analizi mümkündür. Bu gruplar vıMÜSİAD'ın küçük ve orta ölçekli işletmelere dayalı grupları içeren bir örgütlenme olması nedeniyle özellikle bu açılardan analiz edilmiştir. Son olarak, orta smıf olgusuyla modern work erik arasındaki batı bağlamındaki ilişki bu çalışma açısından bu bağlantıyı daha da önemli kılmaktadır."
