abstract: "Osmanlı devletinde, 1839 yılında olarak ilan edilen Tanzimat hattı, siyasi ve hukuki yapının modernleştirilmesi amacını taşıyan ilk reform fermanıdır. Bu ferman; sonrası gelecek süreçte, birçok hukuki düzenlemenin ve siyasi kararın muhtelif bakımdan içeriğini sinesinde barındıran, bir üst çerçeve“hukuki ana metin”olarak görülmüştür Bu modernleştirme projesinde yer alan düzenlemeler, özellikle referanslarıyla incelemeye alındığında, seküler batı hukuk düşüncesinin yoğun etkisi tespit edilmektedir. Bu tez çalışması, Tanzimat fermanındaki düzenlemeleri analiz ederek, seküler batı hukuk düşüncesinin ana etkilerinin tespitini konu edinmiştir. Bu konuda, Osmanlı devletinin klasik sisteminde Müslümanların idari şemsiyesi altında, farklı inanç gruplarının özerk hukuksal yapılarının korunduğu çoklu hukuk geleneğinden aynı/tek hukuka yönelişi amaçlayan“hukuki eşitlik”vurgusu ile, içtihat hukuku geleneğine sahip olan şer'i hukuku kanun hukukuna dönüştürecek kanunlaştırma sürecinin fitilini ateşleyen düzenlemelerin, seküler batı hukuk düşüncesinin en güçlü etkileri olduğu hususlarına özellikle dikkat çekilmiştir."
