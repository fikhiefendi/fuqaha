abstract: "Mezheplerin teşekkülü ile mezhebe müntesip olan fakihler, hüküm istinbatında nassları kullanmanın yanında oluşan“mezhep birikimini”de dikkate almışlardır. Bu birikimden faydalanma yöntemleri de tahric ve tercih başlıklarında toplanabilir. Mezhep birikiminden hareketle yeni hükümlere ulaşma manasında olan tahricin aksine tercih, bu birikimi değerlendirme ve ayıklama işlemi olarak tanıtılabilir. Hanefî mezhebi fukaha taksiminde tercih ehlinden sayılan ve VI. (XII) yüzyıl Karahanlılar devri âlimlerinden Mergînânî de (ö. 593/1197) Hidâye adlı eserinde aynı konuda aktarılan farklı rivayetler içerisinden tercihlerde bulunmuştur. Çalışmamızda Mergînânî'nin Hidâye adlı eserinde yapmış olduğu bu tercihlerin sonraki muhtasarlara etkisinin gösterilmesi hedeflenmektedir. Bunun için de Hidâye'nin Kitabü't-Tahâre bölümünde yer alan yirmisekiz lafzî tercih örneği, eserin tertip, üslup, içerik yönlerinden kendilerini etkilediği Vikâyetü'r-rivâye, Kenzü'd-dekâik, en-Nukâye, Gurerü'l-ahkâm, Mültekâ'l-ebhur ve Tenvîrü'l-ebsâr adlı muhtasarlarla mukayese edilmiştir. Sonuç olarak da muhtasarların %48 oranında Mergînânî'nin tercihlerinden etkilendiği neticesine varılmıştır."
