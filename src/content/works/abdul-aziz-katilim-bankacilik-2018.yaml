abstract: "Geçtiğimiz kırk yıllık dönem içerisinde, küresel İslami bankacılık olağanüstü bir büyüme göstermiştir. Küresel İslami bankacılık ve finans endüstrisi bu büyümenin yanı sıra bazı zorluklarla karşı karşıya kalmıştır ve bu zorluklar arasında en önemlisinin endüstride faaliyet gösteren bankaların kendi markalarını taşıyan ürünlerin yansıttığı ideallerden geleneksel bankacılığa doğru yaşanan kaymadır. Endüstride risk yönetimi tekniklerinin uygulanması ve düzenlemelere uyum açısından yaşanan operasyonel zorluklar, endüstri oyuncuları ve bu araştırma alanındaki bilim insanları tarafından öngörülen kuvvetlerdir. Türk finans sektöründe de İslami bankacılık ve finans kavramı ve yerel (özel ve kamu) ve uluslararası yatırımcıların sermaye akışı açısından teşvik edilmesi konusunda gösterilen çabalarda artış gözlemlenmektedir. Ülkede faaliyet gösteren özel finans kurumları, son on yıllık dönem içerisinde küresel islami bankacılık kanunlarında öngörüldüğü gibi faaliyet gösteren tam yetkili katılım bankalarına dönüşmüştür. Bu katılım bankaları, geleneksel bankalara alternatif olarak geniş çeşitlilikte bankacılık ürünleri ve hizmetleri sunmaktadırlar. Bu durum, katılım bankaları için rekabet ve mevzuatla ilgili çeşitli zorluklar ortaya koymaktadır. Bu çalışmada, bu evveliyata dayalı olarak bu katılım bankalarının geleneksel emsallerine oranlar ortaya koydukları teknik verim parametrik olmayan bir yaklaşımla değerlendirilmeye çalışılmaktadır: Veri Zarflama Analizi (VZA). Verimin belirlenmesi ve bu katılım bankalarının ülkedeki geleneksel bankalara oranla nasıl performans sergilediklerini belirlemek amacıyla, aracı yaklaşımına dayalı olarak girdi odaklı bir VZA uygulanmıştır. Teknik verimler ölçeğe göre değişken getiri (ÖGDG) ve ölçeğe göre sabit getiri (ÖGSG) kavramlarına dayalı olarak hesaplanmıştır. Sonuçlar hem KB'ler hem de GB'ler için oldukça yüksek seviyede verim ortaya koymuştur ancak ikincisi daha yüksek bir yüzde elde etmiştir. İki tarafın da rekabet kabiliyeti oldukça yüksek olmakla beraber tez kapsamında değerlendirilen tüm banka türleri için yapılan analizlerde mükemmel verim skorları elde edilmiştir."
