abstract: "Tarihin en kadim devletlerinden biri olan Osmanlı Devleti, fermanlarıyla, beratlarıyla ve kadılar tarafından tutulan mahkeme tutanaklarıyla adalete önem verdiğini göstermektedir. Bu çalışma 3547 Numaralı Çerkeş Şer'iyye Sicilinin transkripsiyon ve değerlendirilmesini içermektedir. Araştırmada kadılık müessesesi ve mahkeme görevlileri hakkında kısa bilgi mevcuttur. 3547 Numaralı Çerkeş Şer'iyye Sicili 55 poz içermekte olup tereke, borç, alacak, nafaka, alım-satım gibi davaları ihtiva etmektedir. Bu çalışmada ülkemizin küçük şehri olan Çankırı İlinin Çerkeş İlçesinin toplum düzeni gün yüzüne çıkarılmaya çalışılmıştır."
