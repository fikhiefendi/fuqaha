abstract: "Bu çalışmada, Merğînânî'nin Hidâye adlı eserinin hadler ve kısas bölümlerinde yer alan Ebû Yûsuf'a ait İslâm ceza hukuku ile ilgili görüşleri derlenmiştir. Tespit edilen görüşler diğer Hanefi kaynaklarından da taranıp delilleri ile birlikte verilmiştir. Ayrıca mezhep içerisindeki bunlara muhalif görüşlere de delilleriyle birlikte yer verilmiştir. Bu çalışma giriş ve iki bölümden oluşmaktadır. Giriş bölümü konunun önemi, amacı, sınırları ve metodunun yanı sıra Merğînânî'nin hayatı, eseri Hidâye ve görüşlerini derlediğimiz Ebû Yûsuf hakkındaki bilgileri içermektedir. Birinci bölümde hadler ve ta'zir konusunda Ebû Yûsuf'a ait olduğu tespit edilen görüşler belli başlıklar halinde ayrılıp aktarılmıştır. Ayrıca bu görüşler hakkındaki deliller ve varsa mezhep içerisindeki muhtelif görüşler de delilleriyle birlikte verilmiştir. İkinci bölümde kısas ve diyet bölümlerindeki Ebû Yûsuf'a ait görüşler derlenmiştir. Bu görüşler, diğer Hanefi kaynaklarından tespit edilebilen delilleri ve farklı görüşleriyle birlikte verilmiştir. Sonuç bölümünde ise çalışmanın kısa bir değerlendirmesi yapılıp elde edilen kazanımlar aktarılmıştır."
