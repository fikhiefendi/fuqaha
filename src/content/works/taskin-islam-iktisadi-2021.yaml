abstract: "İnsanlık tarihi kadar eski olan faiz mefhumu ve kâr kavramı çalışmamızın özünü oluşturmaktadır. Burada sorun teşkil eden husus İslam tarafından kârın meşru görülüp faizin yasaklanmasıdır. Bu meselenin anlaşılması amacıyla çalışmamızda birincil olarak faiz kavramına değinilmiştir. Faiz ve ilintili kavramlar açıklanarak aralarındaki ilişki açıklanmıştır. Meseleyi derinden anlamak adına İslam dininin meşruiyet kaynağı olan Kur'an-ı Kerim ve Sünnet'teki faiz kavramlarına mezheplerce açıklanan faiz eylemine değinilmiştir. Faizin ne tür bir eylem sonucunda ortaya çıktığına dikkat çekmek istenmiştir. Çalışmamızın ikinci bölümünde kâr kavramı ve ilintili diğer kavramlar açıklanmıştır. İslam tarafından meşru görülen kârın oluşum sebepleri yani bir başka deyişle kârı meşruiyet zeminine çeken olaylar silsilesi aktarılmaya gayret edilmiştir. Klasik iktisat düşüncesindeki kâr kavramına yer verilerek İslâmi bakış açısıyla karşılaştırılmasına imkân sağlanmıştır. Üçüncü bölümde kâr ve faiz mukayesesi akit, tarafların eylemleri, sözleşmelere konu olan mallar, toplumsal etkileri ve tarafların risk üstlenimleri gibi mukayeselerle faiz ve kâr kavramları arasındaki benzerlik ve ayrışım noktalarına değinilmiştir. Sonuç olarak, bu çalışma faiz ve kâr kavramlarını İslami perspektiften gözler önüne sermeyi ve mukayese etmeyi hedeflemektedir."
