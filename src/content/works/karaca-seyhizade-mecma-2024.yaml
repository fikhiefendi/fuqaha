abstract: "Genellikle ayet ve hadislere dayanan küllî kâideler, ibadet ahkâmından aile hukukuna, borçlar ve ceza hukukundan idare hukukuna kadar fıkhın tüm alanlarında yer almıştır. Nasların yanı sıra fukahanın içtihatlarından oluşan fıkhî hükümlerin ilke olarak ifade edilmesi de küllî kâidelerin oluşmasına zemin hazırlamıştır. Tarihsel süreçte ilk olarak Hz. Peygamber ve sahabe döneminde izlerine rastlanan küllî kâideler furû' fıkıh alanında yazılan erken dönem eserlerinde bazen veciz yapısıyla bazen de açıklama formatında görülmektedir. Bu kapsamda küllî kâideler hakkında meşhur fıkıh ekollerinde birçok müstakil eser yazılmıştır. Diğerlerinde olduğu gibi Hanefî mezhebinin furû' fıkıh kaynaklarında da mevcut hükümlerin açıklanması, yeni hükümlerin tespit edilmesi ve ihtilaflı meselelerde mezhebinin görüşünün savunulması gibi amaçlarla küllî kâidelere müracaat edilmiştir. Osmanlı döneminde ilmî ve hukukî yapının oluşmasında etkisi olan Hanefî mezhebinin furû' fıkıh kaynaklarından birisi de Şeyhîzâde'nin Mecmaʿu'l-enhur fî şerhi Mülteka'l-ebhur adlı eseridir. Bu çalışmamızda klasik şerh geleneğine göre ve birçok fıkhî kaynaktan istifade edilerek yazılan Mecmaʿu'l-enhur kavâid-i küllî bakımından incelenmiştir. Bu inceleme sonucunda Mecmaʿu'l-enhur'da yer alan küllî kâidelerin oluşum süreci izlenerek hangi lafızla Mecellede yer aldığı da diğer mezheplerin meşhur kavâid eserleriyle karşılaştırılarak tespit edilmiştir."
