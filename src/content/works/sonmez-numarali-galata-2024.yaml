abstract: "Osmanlı Devleti yüzyıllarca ayakta kalmış ve geniş coğrafyaya yayılmıştır. Bu coğrafya hakkında bilgi sahibi olabileceğimiz birçok kaynak vardır. Şer'iyye sicilleri sadece merkez hakkında değil, taşranın sıradan insanlarına bakmamız açısından mühimdir. Şer'iyye sicillerinde günlük yaşama dair pek çok husus hakkında bilgi sunmaktadır. İncelenen 77 Numaralı Şer'iyye sicili 1654-1655 yılları arasını kapsamaktadır. Dört ana bölümden oluşan tezin birinci kısmı“Galata Kazası ve Kadılığı”başlığı altında Galata'nın adı ve tarihi anlatılmıştır. İkinci bölüm“Galata'da Kentsel Mekan”başlığında Galata'nın iç ve dış mahallelerinin 17. yüzyıldaki durumu betimlenmiştir. Üçüncü bölüm“Sosyal Hayat”başlığında esirlerin hakları ve azat edilme yöntemleri, boşanma türleri ve Galata'da suç konuları işlenmiştir. Dördüncü bölüm“ İktisadi Hayat”başlığında borç, mülk satışı gibi maddi konular değerlendirilmiştir."
