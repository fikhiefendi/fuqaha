abstract: "Türk ve İran Hukuklarında evlenme ve boşanma hükümleri incelerken bu kurumun düzenlenmesinde önemli farklılıklar önümüze çıkmıştır; kavramsal ve tarihsel arka planın başlangıcında boşanma koşullarını ve nedenlerini tanımlamak ve gözden geçirmek için çalışılmalıdır. Ancak, hem İran hem de Türk hukuk sistemlerinde evlenme ve boşanma hükümleri iki farklı yaklaşımdan geldiği anlaşılmaktadır. Özellikle Boşanma hukukuna ilişkin hükümlerin niteliği, her iki ülkenin yasama meclisinin egemenlik yaklaşımlarından ve algılamasından etkilenmektedir. İran Hukuk sistemi esas itibariyle İslam Hukuku üzerine kuruludur ve İslam Hukukunun hareket noktası çok farklıdır. Türkiye'de 1926 yılında Hukuk sistemi İnkılabıyla başlayan, Kıta Avrupası Kanunnamelerinin bu cümleden olarak İsviçre Medeni Kanunu'nun iktibası sonucu Türk Aile Hukuku Kurallarının bu arada evlenme ve boşanma hükümleri hukuku kurallarının Roma-Cermen Hukuk Sistemine uygun olarak teşkil edildiği görülmektedir. Bu çalışmamızda birer ayrı iki hukuk sistemi olarak İran ve Türk Hukuklarında evlenme ve boşanma hükümleri ilişkin hükümler incelenmiş, üç bölümde evlilik ve boşanma kavramı ile boşanmanın etkileri ve boşanmanın hukukî sonuçları ele alınmıştır."
