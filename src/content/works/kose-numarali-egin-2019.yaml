abstract: "Osmanlı Devleti'nin hukukî, iktisâdî, dinî, askerî, idârî, sosyal düzeni ve kültürel yapısı hakkındaki bilgileri kadılar tarafından şer'i mahkemelerde kayıt altına alınan şer'iyye sicillerinde bulabilmekteyiz. İslam Hukukunda teorik olarak bildiğimiz alacak, boşanma (talâk), verâset, vesâyet, vekâlet, vakıf vb. konuları şer'iyye sicillerinde uygulamalı olarak görmek, İslam hukukunun tatbikini kavramamıza, teorik bilgilerimizi de daha iyi idrâk etmemize yardımcı olacaktır. Çalıştığımız dönem H. 1315-1318 (M.1897-1901) yılları olup, bu dönemde Eğin kazasında Müslümanların yanında Gayr-i Müslimlerin de yaşadığına tanıklık etmekteyiz. Mahkemelerde müslim ve gayr-i müslimlerin kimlik tesbiti yapılırken farklılık gösterdiğine şahit olmaktayız. Bu durumun ise Osmanlı devletinin dini hoş görüsünden ileri geldiği kanaatindeyiz. Osmanlı devletinde kendi dinî kaidelerine göre yaşayan gayr-i müslimler şer'i mahkemelere de müracaat ederek davalar açmış, davalarının görülüp çözümü için irâde beyanında bulunmuşlardır. Eğin şer'iyye sicilleri Ankara Milli Kütüphane şeriyye sicilleri bölümünde toplam 36 defterdir. Defterimiz yaptığımız Eğin şer'iyye sicilleri tablosunda 33. numarada geçmektedir ve 87 sayfadan oluşmaktadır. Defterimizde 305 belgenin transkripsiyonu yapılmıştır. Öncelikle giriş kısmında Eğin Kazası ile ilgili bilgiler verilmiş, birinci bölümde şer'iyye mahkemeleri ve görevlileri hakkında temel bilgilere değinildikten sonra ikinci bölümde şer'iyye sicilleri ve defterimiz hakkında bilgi takdim edilmiştir. Üçüncü bölümde defterimizdeki belgeler ışığında İslam Hukuku'ndaki temel kaidelere dayanarak defterin hukukî değerlendirilmesi yapılmıştır. Dördüncü bölümde ise defterin transkripsiyonu yer almaktadır. İslam Hukukunun uygulamalı olarak günümüze yansıtılması amacıyla 1 Nolu Eğin Şer'iyye Sicili incelenerek trankripsiyonu yapılmıştır."
