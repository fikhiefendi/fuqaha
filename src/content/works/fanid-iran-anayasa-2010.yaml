abstract: "İran'da Anayasalcılık hareketi esasında dönemin şartlarına uygun olarak, ulus-devlet hedeflenmiştir. Fakat Şii fıkhına dayalı eski siyasal yapılanma bu sürecin sonuçlanmasına engel oluşturdu. Dolayısıyla Meşrutiyet Anayasası'nda yer alan temel hak ve özgürlüklerin uygulanması da hukukun genel ilkeleri ötesinde Şii-İslam anlayışına dayalı dinsel bir anlayış esasında olmuştur. Pehlevi Krallığı döneminde çağdaşlaşma çabaları ve bu doğrultuda laik egemenlik esasında temel hak ve özgürlükler genişletilse de devlet yönetim sistemi bakımından, özellikle tarihsel süreç içinde mutlak monarşi yönü ağır basmaktaydı. Bu dönemde, devlet yönetimi bakımından monokratik bir yapıya sahip olmasıyla temel hak ve özgürlüklerin uygulanması arasında çelişkiler vardı. Bu ise çatışmacı toplumu ve 1979 devriminin ortaya çıkmasına neden oldu.İslam Cumhuriyeti, kendisinden önce var olan Pehlevi monarşisinin siyasal yapılanmasının kurumları üzerinde yükselmiş, fakat bütün modern devletlerden farklı olarak bu kurumların içeriğinin düşünsel ve yapısal dönüşüme uğraması sonucunda ortaya çıkmamıştır. İran'da bugün modern demokrasinin varlığından bahsetmek için, demokratik ilkelerin birer kutsal hüküm gibi anayasaya girmiş olması gerekmektedir. İran'da gerçek demokratikleşme için katılımcı, insan haklarına saygılı ve hukukun üstünlüğünü toplumun tüm kesimlerine eşit ve adil olarak uygulayacak, bir radikal değişimin yapılması gerekir. Bunun için de velayet-i Fakih'in (Liderlik Kurumu'nun) ve bu ilkeye dayalı olan şeriat devletinin ortadan kalkması gerekmektedir. İran'da yalnız demokratik bir rejimin varsayımından yola çıkarak, temel hak ve özgürlüklerin nasıl uygulanacağı sorusu üzerinde durabilmemiz mümkündür. İran, hem sosyo-ekonomik eşitsizlikler, hem de yakın tarihinde yaşadığı Krallık monarşisi ve iç savaş deneyimleriyle, etnik ayrılıkların ötesinde de derin bölünmeler yaşayan bir ülkedir."
