abstract: "Çalışmada, 2006-2015 yılları arasında Türkiye'de bankacılık sektöründe faaliyet gösteren Katılım Bankalarında (faizsiz finans sistemindeki) yabancıların payı ve bunun aktif kârlılığıüzerindeki etkisi analiz edilmiştir. Değişkenler arasındaki ilişkiyi ortaya koymak için çeşitli ekonometrik modeller uygulanmıştır. Değişkenler arasında aktif kârlılığının, yabancı paylarının, toplanan fonların, kullandırılan fonların ve öz kaynakların uzun dönemli ilişkili olmadığı belirlenmiştir. Nedensellik testine göre kullandırılan fonların ve toplanan fonların iki yönlü ilişki içinde olduğu tespit edilmiştir. Aktif kârlılığının ve yabancı payların arasında ise tek yönlü bir ilişki olduğu tespit edilmiştir."
