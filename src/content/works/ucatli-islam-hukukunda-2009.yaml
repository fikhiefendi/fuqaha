abstract: "Bu araştırma, İslam hukukunda cenine müdahalenin hükmünü içermektedir.Üç bölüm halinde sunduğumuz bu çalışmanın birinci bölümünde Kur'an, hadis ve modern tıp ilmi açısından ceninin anne rahminde geçireceği safhalar üzerinde durulmaktadır. Yine bu bölümde cenine ruh üflenme zamanı, can ile ruhun farkı ve fıkıh alimlerine göre cenin kavramı için yer verilmektedir.İkinci bölümde modern tıp bilimi açısından ceninin anne rahminde geçirmiş olduğu safhalar, kürtajın tanımı ve onun tehlikelerine dair kısaca bilgi verilmektedir.Çalışmamızın üçüncü bölümünde hamileliğin ilk safhasından itibaren doğuma kadar olan tüm evresinde, çeşitli nedenlerle anne rahmindeki cenine yapılan kürtaj'ın (müdahale) hükmü incelenmektedir.Konu bilimsel bir konu olduğu için Kur'ân ve modern tıp ışığında yapılmış özel çalışmalardan yararlanmakla birlikte, tefsir, hadis ve fıkıh kitaplarından istifade edilmiştir."
