abstract: "Araştırmanın konusu; varlıklı sahabelerin iktisat politikasıyla ilişkileri ve onların çağdaş etkilerini ele almaktadır. Vahiy döneminde iktisat politikasının nasıl olduğu, zengin sahabelerin kimler olduğunu ve kendi devirlerinde iktisat politikası üzerindeki etki boyutlarınının yanı sıra varlıklı sahabeler ile ekonomi politikası arasındaki ilişkinin çağdaş etkilerini de irdelemektedir. Araştırma; aynı zamanda Rasûlullahın devrindeki iktisat politikasının özelliklerini ve sahabelerin iktisat biyografilerini, nasıl etkilediklerini ve aralarındaki iktisadî münasebetleri ortaya koymayı amaçlamaktadır. Bu araştırma, Peygamber Efendimiz (s.a.v.)'in ekonomi politikasının gerçek resmini ve yatırımcılarla ilişkisinin doğasını ortaya koyması bakımından çağdaş hükümetler için önemlidir çünkü zengin sahabelerin ekonomik kalkınmadaki gerçek rolünü vurgulamaktadır. Aynı zamanda İslam'daki yoksulluk kavramı hakkındaki bazı yanlış anlamaların düzeltilmesi açısından toplumu, araştırmacı ve uzmanları ilgilendirmektedir. Bu çalışma; ekonomik perspektiften bakıldığında, yatırım alanlarında ve yatırımcıların devletle ilişkisinin mahiyeti konusunda önemli bir araştırma ve inceleme alanı açmaktadır. Araştırmacı; zengin sahabelerin ekonomik kalkınmadaki rolüne, bunların çağdaş gerçekliğe bağlamasına ve geçerli bir uygulama modeli olarak gerçekçiliğine değinmiştir. Araştırma sonucu: kendi dönemlerinde, ekonomik kalkınmayı teşvik eden dürüst ve erdemli yatırımcılar olan zengin sahabelerin örneğinde olduğu gibi, peygamberimizin iktisat politikaları çağdaş bir ekonomik model olmayı hak etmiştir."
