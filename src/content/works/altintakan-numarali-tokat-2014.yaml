abstract: "Bu çalışmada H.1186-1189/M.1772-1776 yıllarını kapsayan 1 Numaralı Tokat Şer'iyye Sicili'nin analizi yapılmıştır. Çalışmada belge özetleri yapıldıktan sonra, belgelerin mahiyetinden yola çıkarak, Tokat'ın söz konusu dönemdeki sosyal ve iktisadî yapısı, aile hayatı, müslim-gayrimüslim ilişkileri, cürüm-cinayet hadiseleri, eşkıyâlık hareketleri, vakıflar ve terekeler hakkında değerlendirmeler yapılmıştır. Çalışmanın ana kaynağını H.1186-1189/M.1772-1776 tarihli 1 Numaralı Şer'iyye Sicili oluşturmaktadır."
