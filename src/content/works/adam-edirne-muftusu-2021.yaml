abstract: "Bu çalışmada, Edirne Müftüsü Mehmed Fevzî Efendi'nin“et-Tevessülâtü'l-Fevziyye Fi'n-Nuûti'n-Nebeviyye”isimli eserinin Arap Dili ve Belagatı açısından incelenmesi amaçlanmıştır. Giriş ve iki müstakil bölümden oluşan bu çalışmanın giriş bölümünde Mehmed Fevzî Efendi'nin yaşadığı dönemin siyasi, sosyal ve kültürel açıdan genel durumu incelenmiştir. Birinci bölümde Hz.Peygamber'e dair yazılmış edebî türler, bu türlerden özellikle Na't'ın tarihi gelişim süreci, Mehmed Fevzî Efendi'nin hayatı ve eserlerinden bahsedilmiştir. İkinci bölümde eser; muhteva, şekil, dil ve üslûp bakımından incelenerek eserin tercümesine yer verilmiştir."
