abstract: "Molla Sadrettin Yüksel, aslen Bitlis'in Adilcevaz ilçesinden olup babası Tahir Efendi (ö.1927) annesi Hatun Hanımdır (ö.1985). Birinci Dünya Savaşı esnasında Rus ordularının ermeni çeteleriyle birlikte Adilcevaz ve çevresine tasallutu dolayısıyla Tahir Efendi, bir kısım akrabalarıyla birlikte memleketini terk ederek Konya'nın Sarayönü ilçesine yerleşir.Yüksel, 1336/1920 tarihinde Sarayönü'nde doğar. Kısa bir süre sonra, mütareke döneminin ardından aile memleketine döner. Henüz yedi yaşında iken babası hastalanarak genç yaşta vefat eder.Sadrettin Yüksel 11?12 yaşlarında Arapça tedrisata başlar. Bitlis'in Norşin Nahiyesi, Mutki'nin Ohin ve Baykan'ın Havil köyünde okuyarak tedrisatını tamamlar ve Norşin'e dönüp burada ders vermeye başlar.1951 yılında Şeyh Masum'un kızı Sarete ile evlenir. 1956 yılında, Ankara'da Müftülük imtihanını birincilikle kazanır. 1958 senesinde Siirt'in Baykan ilçesi müftülüğüne tayin edilir. Kısa bir süre sonra bu görevinden istifa edip Norşin'e döner ve ders vermeye devam eder. 1966 yılı sonunda ailesini alarak İstanbul'a yerleşir.1968 yılında İstanbul Merkez vaizliğine tayin edilir. Vaazlarında gerçekten çok önemli ve günün ihtiyaçlarını karşılayacak konuları farklı bir tarzda ele alması dikkat çeker. Özünde var olan davetçiliği vaazlarında da kendini çok bariz olarak gösterir.1975 yılında bu görevinden de istifa etme durumunda kalır. Yeniden tedrisata döner ve 1996 yılına kadar tedrisata devam eder. 7 çocuk babası olup, Kürtçe ve Türkçenin yanı sıra ileri düzeyde Arapça ve Farsça bilen Yüksel 13 Zilhicce 1425/25 Aralık 2004 tarihinde vefat eder.İtikatta Eş'arî, amelde Şafiî olan Yüksel hararetli bir ehl?i sünnet müdafii olup mümkün mertebe düşünce ve fetvalarında bu çerçeveye sadık kalmaya özen gösterir. İslam Hukuku alanında geniş araştırmalar yapar, fetvalarını dört mezhep içtihadı ile sınırlı tutar, çok nadir onların dışına çıkar. Bu çizgiyi aşanlara reddiyeler yazar ağır eleştiriler yöneltir. Engin bir ilmi vukufiyyete sahip olan Yüksel gerçek manada bir muhakkik ve müdekkik olup birkaç eseri bu veçhesinin neticesidir.İslam davetçiliği yönü dikkat çeken Yüksel, gerek vaazlarında ve derslerinde gerek eserlerinde bu hususa çok önem verir, cihad çağrısı yapar, bu konuda makaleler yayınlar. İslam devleti fikrini savunur, başka sistemlerin çözüm olmayacağını ve asrımızda dahi saadetin İslam şeriatında olduğunu her fırsatta dile getirir.İslam âleminin problemleriyle ilgilenir. İslam âlemi arasında birliği sağlayacak olan ümmet fikrini telkin eder. Fikri veya mezhebi farklılıkları bir tarafa bırakıp ümmet paydasında birliğe çağırır. Kendi çağındaki gelişmeleri yakından izler, yerel ve Arap basınını takip eder, çeşitli dergi ve gazetede yazı ve makale yayınlar.Özel bir fetva kitabı hazırlamamakla beraber eserlerinde ve müsveddelerinde farklı konularda azımsanmayacak miktarda fetvaları mevcuttur. Bir medrese âlimi olmakla beraber çağındaki gelişmeleri, takip eder. Gerekli gördüğü, itikat, ibadet, muamelat, medeni hukuk, siyaset, cihat vs. gibi asri konular hakkında fetvalar yayınlar.Tasavvufa, özellikle NakşibendÎ tarikatına ve evliyaullah'a derin bir saygı duyar. Bediüzzaman'dan etkilenir, zaman zaman onunla mektuplaşır, iltifatına ve muhabbetine mazhar olur. Risale-i Nur'u bulundurmaktan yargılanır ve mahkemede Risaleyi savunur.Türkiye'de Cuma ve bayram namazlarının Hanefi mezhebine göre günümüz şartlarında sahih olmadığını iddia eder. Bu ve benzeri çıkışlarından dolayı şimşekleri üzerine çeker.Farklı alanlarda Türkçe ve Arapça irili ufaklı 33 eser kaleme alır. Bunların bir kısmı yayınlanır bir kısmı halen müsvedde halindedir."
