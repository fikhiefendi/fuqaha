abstract: "İmam Züfer, İmam-ı Aʽzam Ebû Hanîfe'nin yetiştirdiği en önemli müçtehitlerden ve onunla birlikte Hanefi fıkhını tedvin eden on büyük fakihten biridir. Zamanın önde gelen âlimlerinden temel İslamî ilimleri tahsil ettikten sonra hadis ilminde yoğunlaşan ve bu ilimde önemli bir mesafe alan İmam Züfer, karşılaştığı fıkhî bir meseleden dolayı Ebû Hanîfe'nin ders halkasına katılmış ve kesintisiz yirmi sene ondan fıkıh ilmini öğrenmiştir. Fıkıhtaki ilk ve tek hocası Ebû Hanîfedir. Aklı, zekâsı, fıkhi meseleleri kavrama gücü ve mukayese kabiliyeti ile dikkatleri üzerine çekmiş, kısa zamanda hocasının övgü ve iltifatlarına mazhar olmuş; onun vefatından sonra da ders halkasının başına geçmiştir. Ancak kırk sekiz yaşında yani hocasından sekiz sene sonra çok erken denilebilecek bir yaşta vefat etmiştir. Belki de bu nedenle kendisinden fıkhi görüşlerini ihtiva eden bir eser intikal etmemiş; bu görüşleri Hanefi mezhebinin muhtelif kaynaklarında zikredilmiştir. \"İmam Züfer'in Hanefi Mezhebindeki Konumu ve Fıkhi Görüşleri\" isimli bu çalışmanın birinci bölümünde İmam Züfer'in hayatı ve Hanefi mezhebindeki konumu ayrıntılı bir şekilde ele alınmıştır. İkinci bölümde ise Züfer'in Hanefi mezhebinde diğer üç imamdan yani İmam Ebû Hanîfe, İmam Ebû Yûsuf ve İmam Muhammed'den farklı olarak ortaya koyduğu ve mezhepte yalnız kaldığı içtihatları ve fıkhî görüşleri tespit edilmiştir. Görüşler verilirken özellikle Züfer'in gerekçelerine, nedenlerine, delillerine, usul ve kaidelerine yer verilmiş; mezhepte müftâbih olan veya tercih edilen görüşlerine işaret edilmiştir."
