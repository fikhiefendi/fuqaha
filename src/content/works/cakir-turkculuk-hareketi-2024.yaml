abstract: "Tanzimat'la başlayan ve Cumhuriyet'le devam eden süreçte Osmanlının yaşadığı değişim ve dönüşüm bağlamı, aktörleri ve sonuçları açısından ele alınmaya değer bir konudur. Bu süreçte siyasî, askerî ve iktisadî zafiyetleri bertaraf etmek amacıyla çeşitli tartışmalar başlamış ve çözüm arayışlarına gidilmiştir. Bu arayışlar, hukuk alanına da yansımış gerek küresel modernitenin etkileri gerekse yüzyıllara yayılan sorunlardan kaynaklı yerel ihtiyaçlar, yenilik/ıslahat/terakkî tartışmalarını da beraberinde getirmiştir. Dönemin çok sesli atmosferinde Türkçü münevverler tarafından milliyetçilik, din-devlet hukuk ilişkileri, ilerleme-gelişme-değişme vb. birçok mesele hakkında bütün İslam dünyası için \"yeni\" sayılabilecek görüşler serdedilmiştir. İslam hukukunun, yorum esnekliğini ve dinamizmini sağlayan örf ve ictihâd gibi kavramlarla, ictimâiyatçı (sosyolojik) bir hüviyette yeniden yorumlanma gayretlerinin ele alındığı bu çalışmada, hareketin öncü isimleri perspektifinden, Türkçülerin fıkıh alanındaki görüşlerinin bütüncül değerlendirilmesi yapılmıştır."
