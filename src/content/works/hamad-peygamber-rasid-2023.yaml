abstract: "Akademisyenlerin bütünü, ekonominin hayatın tüm alanlarıyla ilişkisi nedeniyle ekonominin önemini fark etmişlerdir. Müslümanlar arasında piyasa ekonomilerinin yapılanmasında en önemli aşamaları göz önünde bulundurulduğunda, peygamberin (s.a.v.) hadis dönemindeki canlılığını, onun sözlerinden, eylemlerinden anlıyor ve Doğru Yol Gösteren Halifeler (Allah onlardan razı olsun) döneminde buluyoruz. Peygamber (s.a.v.) ve Doğru Yol Gösteren Halifeler zamanında ekonomik faaliyet, pastoralizm, ticaret, basit tarım ve piyasa işlerini ve içinde yayıldığı işlemleri yönetmede bazı idari, ekonomik ve finansal işlerle sınırlıydı. İslam ve İslam fetihlerinin yayılmasından sonra piyasa, hukuk bilimleri ve ekonomi bilimleri alanında araştırmacıların ve akademisyenlerin dikkatini çeken birçok değişikliği beraberinde getirmiştir. İslam ekonomisi, bireyler ve toplum üzerindeki etkilerine katkıda bulunan özelliklere sahipti ve İslam ekonomisinin kurulmasında peygamber (s.a.v.) ve Doğru Yol Gösteren Halifeler dönemi en büyük paya sahipti. Peygamberin çoban olarak çalışmasından ve Hatice Hanım'ın (Allah ondan razı olsun) parasıyla ticaret yapmasından başlayarak ve Levant'a seyahati ve emanetlerin yerine getirilmesi nedeniyle göçün gecikmesi ve mali hükümler koymaya devam etmesi ve İslam'ın bunlar üzerindeki konumunu Satışın geçerliliği, tefecilik yasağı, barışın meşruiyeti ve kiralamanın meşruluğu vb. gibi ekonomik olaylarla doluydu. Halife Ebu-Bekir El-Sıddık'ın dönemi, Allah Resûlü'nün (s.a.v.) iyilik yapmaya başladığı ekonomik yürüyüşün devamıydı. Halife Ömer El-Hatab'a gelince, günleri sadaka, bağış, piyasaları izleme, devriye gezme ve pazara büro kurmaya dayalı ekonomik ve idari çalışmalarla doluydu. Halife Osman Bin-Afan'ın devletin inşasına birçok ekonomik katkısı olsa da, Müslümanların su kaynağını güvence altına almak, mali kaynakları ve bürolardaki harcamalarını belgelemek ve Müslümanlara ve İslam cemaati içindeki diğerlerine verme sistemini desteklemek için Rumah Kuyusu'nu satın aldı. Ali Bin-Abi-Talib zamanında, halefiyet birçok ekonomik başarıya tanık oldu, kar ve zararın paylaşılmasına ilişkin anlaşma mevzuatı yapıldı, sermayenin sahibinin yanı sıra vasinin veya padişahın belirlediği makul ve meşru nedenlerle sadakayı hızlandırma olasılığı ve birçoğunun türetilmesi korkusuyla kar getirmeme ve ayrıca teklifte tekel önleme ve uzlaşma konuları ele alındı."
