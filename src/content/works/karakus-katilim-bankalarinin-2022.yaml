abstract: "Faizsiz bankacılık uygulamaları genel anlamda“İslami Bankacılık”olarak da adlandırılmaktadır. Bu uygulamaların en temel ilkesi, geleneksel bankacılık uygulamalarından farklı kılınarak faize yer vermeme durumlarıdır. Bu bankalar yaptıkları işlemler ve ellerindeki kaynaklar için faiz ödememektedirler. Katılım bankalarının kuruluş amaçlarının başında özellikle dinî duyarlılıkları nedeniyle faizden uzak kalan insanların ekonomiye katılmayan atıl tasarruflarını ekonomiye kazandırmak gelmektedir. Bu nedenle bu araştırmada, katılım bankacılığı uygulamaları ve katılım bankacılığında kullanılan fon toplama ve fon kullandırma yöntemlerinin girişimcilere olan etkileri incelenmiştir. Bu çalışmada; katılım bankasının ilgili bölüm çalışanları ile yapılan yapılandırılmış mülakata 15 katılımcı katılmıştır. 15 katılımcının her birisine 12 adet soru olmak üzere toplam 180 adet soru sorularak araştırmanın bulguları elde edilmiştir. Elde edilen bulguların analizleri sonucunda, katılım bankalarının fon kullandırma yöntemlerinin doğrudan, girişimcilerin ihtiyaç duyduğu ticari malları finanse etmeye yönelik uygulamalar olduğu görülmüştür. Sonuç ve öneriler bölümüyle tez tamamlanmıştır."
