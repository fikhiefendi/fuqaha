abstract: "Şer'iye sicilleri Osmanlı Devleti sınırları içierisindeki halkın yaşam biçimini, halkın birbirleriyle olan ilişkilerini ve sorunlarını (evlilik, boşanma, miras, ticaret, şikâyet, adam öldürme, hırsızlık) devletin hukuk düzenini günümüze bir belge olarak yansıtmaktadır. Bu belgeler, Osmanlı Devleti'ne bağlı resmi makamlarca kayıt altına alınmasından dolayı güvenilir, orijinal, birinci elden kaynak olma özelliği taşımaktadır. Bu çalışmada, M. 1858-1860 yıllarını kapsayan 9 numaralı Varna şer'iyye sicili incelenerek 19. yüzyılın ikinci yarısında Varna'nın sosyal, kültürel, siyasi ve ekonomik yapısının tespit edilmesi amaçlanmıştır. Çalışmada Varna şehrinin Rumeli Eyaletine bağlı Silistre Sancağı içinde bir kaza olduğu tespit edilmiştir. Şehirde farklı etnik kimlik ve dine mensup halkın ( Müslüman, Hristiyan, Yahudi, Türk, Çingene, Rum, Ermeni) olduğunu ve birarada ayrı mahallelerde huzûr ve güven içinde yaşadığı belirlenmiştir. Sicilde 350 tane belge olup bu belgelerin konuları ise alım-satım, borç, miras, nafaka, mehir, vakıf, atama ve görev tevcihleri, gasp, yaralama ve cinayet gibi meselelerdir. Söz konusu belgeler bölgenin sosyo-kültürel ve ekonomik yapısıyla ilgili önemli bilgiler sunmakla beraber Osmanlı Devletiʼnin idari ve adli yapısını ortaya koymaktadır. Bu açıdan sicilin pek çok araştırma sahası için önemli bir kaynak olduğu anlaşılmaktadır."
