abstract: "Faiz her zaman insanoğlunun günlük ekonomik yaşantısının bir parçası oldu. Bu yüzden faiz kavramı yoğun ilgi gördü ve düşünürler, din adamları, kanun yapıcılar, yöneticiler ve ekonomistler tarafından ekonomik, sosyal, ahlaki ve dini yönler başta olmak üzere hemen her yönden çalışıldı ve tartışıldı. Faiz almak birçok toplumda günah kabul edildi, onursuz, itibarsız, merhametsiz, adaletsiz ve birçok kötülüğün kaynağı olduğu için kınandı. Bunun sonucu olarak faiz kullanımı, her zaman, yönetimler tarafından yasal, idari ve finansal düzenlemeler, din ve etik vasıtasıyla sınırlandırıldı. İzin verildiği durumlarda kullanım usulleri yoğun şekilde düzenlendi. Bununla birlikte, bütün kaygılara ve bu kaygıların sonucu yapılan düzenlemelere rağmen faiz her zaman kullanılageldi. Faizin ekonomik hayattaki rolünün daha belirgin hale geldiği on yedinci yüzyıldan itibaren bilim adamları faiz kavramıyla daha sistematik bir şekilde ilgilenmeye başladılar ve faizin doğasına ilişkin birçok teori geliştirdiler. Başka birçok teorinin yanında, Böhm-Bawerk'in oldukça kapsamlı olan zaman tercihi teorisi faizin varlığına ilişkin, fıtri olduğu iddia edilebilecek, sebepler sundu. Öte yandan, ilgili literatürde faiz kontrolünün sonuçları hakkında bir ihtilaf ortaya çıktı. Bir çeşit fiyat kontrolü olan faizin yasaklanması ya da faiz oranının sınırlandırılmasının piyasa üzerinde arzu edilmeyen yıkıcı sonuçlarının olduğu iddia edildi. Eğer öyle ise, bu durum faiz düzenlemelerinin araç-amaç uyumluluğu yönünden yeniden değerlendirilmesini gerektirebilirdi. Bu çalışmada faiz kontrolü yapılmasını destekleyenlerin Böhm-Bawerk tarafından faizin gerekçesi olarak ileri sürülen zaman tercihi sebepleri ile faiz kontrolünün yıkıcı sonuçlarına ilişkin iddialara tepkilerinin değerlendirilmesi amaçlanmıştır. Faiz kavramı, anlamı, tarihi ve ilgili teoriler yönünden gözden geçirilmiş, zaman tercihi teorisi ile bir fiyat kontrolü çeşidi olarak faiz kontrolü kavramı tanıtılmıştır. Faiz karşısındaki en açık duruşu faizsiz ekonomik sistem destekçilerinin gösterdiği göz önüne alınarak, Müslüman ekonomistlerin çalışmaları, zaman tercihinin sebeplerine ve faiz kontrolünün sonuçlarına ilişkin yaklaşımları yönünden incelenmiştir."
