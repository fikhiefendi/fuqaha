abstract: "Hz. Ömer fakih bir sahabidir ve 10 yıl boyunca devlet başkanlığı yapmıştır. İslam Hukuku açısından devlet başkanının dini ve siyasi görevleri vardır. Dini ve dini hükümleri korumak, cihad etmek, ganimet ve zekâtla ilgili düzenlemeleri yapmak, kamu düzeninin korunması ve kamuyu ilgilendiren konuların yakından takip edilmesi, adaletin tesis edilmesi, devlet görevlilerin tayini, devlet malının idare edilmesi bu görevler arasındadır. Hz. Ömer'in halifeliği sürecinde fetihlerle İslam coğrafyası genişlemiş ve hüküm gerektiren yeni durumlar ortaya çıkmıştır. Hz. Ömer'in devlet başkanı olarak görevini yerine getirirken karşılaştığı yeni meseleler karşısında verdiği hükümler sahabe kavli niteliğindedir. Sahabe kavli İslam Hukuk usulûnde fer'i kaynaklar arasında yer almıştır. Hz. Ömer valilerine talimatlarını geliştirdiği posta teşkilatı vasıtası ile mektuplarla göndermiştir. Dolayısı ile mektupların incelenmesi sahabe uygulamasını ortaya koyacağından İslam Hukuku açısından önemlidir. Çalışmamız bize Hz. Ömer'in devlet idaresiyle ilgili kendine ulaşan her türlü sorunun bizzat takipçisi olduğunu göstermiştir. Gerekli talimatları valilerine iletmiş ve sorunlara İslam Hukuku dairesinde hızlı ve kesin çözümler üretmiştir. Çalışmamız süresince incelediğimiz tarih ve İslam Hukuku eserlerinde Hz. Ömer'e atfedilen çok sayıda mektuba ulaştık. Bu mektuplardan fıkhi incelemeye uygun olanları almaya gayret ettik. Çalışmamızın birinci bölümü Hz. Ömer'in hayatı hakkında genel bilgi içermektedir. İkinci bölümde ise mektuplar“yargılama hukuku”,“savaş hukuku”ve“idare hukuku”şeklinde üç başlık altında gruplandırılmış; İslam Hukuku açısından incelenmiştir. Bu çalışmada bana her aşamada yardımcı olan değerli hocam Dr. Öğretim üyesi Mücahit Çolak hocama ve aileme müteşekkirim."
