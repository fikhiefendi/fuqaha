abstract: "Memlûklu Devleti'nin kuruluş yıllarına tekabül eden dönemde Mısır'da yaşayan İbnu'r-Rif'a, fıkhî yönüyle temayüz ettiği için 'Fakîh' adıyla lakaplanmıştır. Yaşadığı dönemde Şâfi'î mezhebinde otorite kabul edilen şahsiyetlerden biri olan İbnu'r-Rif'a'nın eserlerinin her biri incelemeye değerdir. İbnu'r-Rif'a'nın eserlerinden dördü, yazma eser kütüphanelerinin tozlu raflarından gün yüzüne çıkarılmayı beklemektedir. Araştırmamız esnasında elde mevcut olan eserlerinin yanısıra bu yazma eserlerden de istifade etmeye çalışarak İbnu'r-Rif'a'nın hayatı, eserleri ve ilmî kişiliğini ortaya koymaya çalıştık. Araştırmamız bir giriş, iki bölüm, sonuç ve kaynakçadan meydana gelmektedir. Birinci bölümde, İbnu'r-Rif'a'nın yaşadığı dönem olan Memlûklu Devleti hakkında kısa bir bilgi verdikten sonra İbnu'r-Rif'a'nın hayatı ve eserleriyle beraber onu etkileyen şahsiyetleri, yetiştirdiği öğrencilerini ve onunla ilgili yapılan çalışmaları ele aldık. İbnu'r-Rif'a'nın ilmî kişiliğine ve bazı fetvalarına yer verdik. İkinci bölümde, İbnu'r-Rif'a'nın eserlerini ele aldık. Anahtar Kelimeler İbnu'r-Rif'a, fıkıh, Kifâyetu'n-Nebih, muhtesip, el-Matlab, ölçü, en-Nefais fî Hedmi'l-Kenais"
