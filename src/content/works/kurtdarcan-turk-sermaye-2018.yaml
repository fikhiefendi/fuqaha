abstract: "Yüksek montanlı gayrimenkul projeleri çoğu zaman bankalardan alınan krediler ve proje finansmanı yolu ile finanse edilse de, sermaye piyasalarından toplanan fonlarla bu projelerin tamamının ya da bir kısmının finanse edilmesi de tercih edilmektedir. Sermaye piyasalarında bu amaçla fon toplanabilmesi için mevcut olan araçlardan bir tanesi de İslami sermaye piyasası araçlarından sukukun ülkemizdeki uygulaması olan kira sertifikalarıdır. Kira sertifikaları hem İslami kurallara uygun araçlara yatırım yapmak isteyenler ile hem de yatırım yaptığı araçlarda riski dağıtmak isteyen yatırımcıların ellerindeki fonları değerlendirebileceği bir yatırım aracı olarak giderek önem kazanmaktadır. Ayrıca, bankalardan alınan krediler karşısında önemli bir faiz yükü ile karşılaşan proje sahipleri açısından da daha az maliyetli bir alternatif finansman aracı olduğu ifade edilmektedir. İşte bu çalışma, kira sertifikalarının hukuki niteliği ile unsurlarının ortaya konulması ve benzer özellikler gösteren gayrimenkul projelerinin finansmanında kullanılabilecek olan diğer sermaye piyasası araçları ile kıyaslanması bakımından önemli sayılabilir. Özellikle proje finansmanında alternatif bir fon toplama yöntemi olarak önem arz eden İslami esaslara dayalı bu yatırım aracının ne şekilde ihraç edilebileceği, ihraca dayanak teşkil edecek sözleşmelerin niteliği ve özellikleri ayrıntılı bir biçimde ele alınmıştır."
