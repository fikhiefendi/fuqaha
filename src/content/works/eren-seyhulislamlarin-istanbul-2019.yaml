abstract: "Bu çalışma, Osmanlı Devleti'nde görev yapmış 27 şeyhülislam tarafından kurulan vakıflara ait Vakıflar Genel Müdürlüğü Arşivi'nde bulunan vakfiyelerin imar ve inşa ilişkileri çerçevesinde analiz ve değerlendirilmesini içermektedir. Yalnızca ulemanın ve ilmiye sınıfının değil, aynı zamanda bürokrasinin de en tepe noktasında bulunan şeyhülislamlar, yüksek refah standartlarına ve dini, idari, hukuki, sosyal alanlarda saygınlık ve otoriteye sahip kişilerdi. Bu avantajları sayesinde Osmanlı toplumunun en köklü ve önemli kurumlarından olan vakıf sistemini aktif ve yoğun olarak işletmek için gerekli maddi ve manevi gerekçeye sahiplerdi. Bu sebeplerle şeyhülislamların sivil ve kamusal mimari araçlarıyla İstanbul'un yapılanmasına sağladıkları katkıları göz önüne sermek, kent çalışmaları açısından oldukça önemlidir. Bu tezde yapılan değerlendirme, yapıların işlevleri, adetleri, büyüklükleri, bugüne ulaşıp ulaşmadıkları bilgisiyle bâni şeyhülislamların İstanbul'un bugününe katkısı kadar, hangi amaç ve sebeplerle vakıf kurdukları ve/veya kurmadıklarına da ışık tutacaktır. Bu bağlamda, şeyhülislamların İstanbul'da gerçekleştirdiği imar, inşa ve ihya faaliyetleri, mülklerinin listelenmesinde birincil kaynak olarak kullanılan vakfiyeler üzerinden detaylı olarak kataloglanmış, ikincil kaynaklarda haklarında bilgi bulunan az sayıdaki yapılar da alt başlıklarda detaylandırılmıştır."
