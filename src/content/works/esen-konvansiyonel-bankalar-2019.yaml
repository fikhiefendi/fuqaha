abstract: "Finansal piyasaların büyüme ve gelişmesi ekonomik büyüme içinde değerlendirilir. Bir ekonomik büyümeden söz edebilmek için yeni işletmelerin açılmasıyla birlikte işletmelerin üretim kapasitelerini artırması beklenir. Günümüz ekonomisinde yeni işletme açılmasında ve işletmelerin kapasitelerinin artırılmasında bankalar oldukça etkilidir. Ülkemizde hem konvansiyonel bankalar hem de katılım bankaları bu süreçte etkili rol oynamaktadırlar. Ekonomilerde büyüme kadar önemli olan diğer bir unsur ise, risk denetimidir. Basel III kriterleri bankaların faaliyetleri esnasında karşılaştıkları veya karşılaşmaları muhtemel risklere karşı yeterli özkaynak bulundurmalarını sağlamaya çalışmaktadır. Bu çalışmada ülkemizde faaliyet gösteren konvansiyonel bankalar ve katılım bankalarının Basel III kriterlerine göre finansal performanslarının karşılaştırılması yapılarak Basel III kriterlerinin finansal veriler üzerindeki etkisi ölçülmeye çalışılmıştır. Yapılan çalışmada finansal sistemin büyük bir bölümüne etki eden konvansiyonel bankaların ve son dönemde daha da önem verilerek piyasadaki payının artırılmasının amaçlandığı katılım bankalarının finansal verileri Basel III kriterleri öncesi ve sonrası olarak değerlendirilmiştir. Ayrıca her iki banka grubunun finansal verileri birbirleriyle de kıyaslanmıştır. Çalışmanın sonucunda Basel III kriterlerinin hem konvansiyonel bankaların hem de katılım bankalarının finansal verilerine olumlu etkisi olduğu sonucuna ulaşılmıştır. Basel kriterleri her iki banka grubunun finansal yapısını düzenleyerek uluslararası finansal piyasalara uyumlu hale getirmiştir."
