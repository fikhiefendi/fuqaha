abstract: "Rahman ve rahîm olan Allahʼın adıyla. Bilimsel araştırmaların gereği olarak bu çalışma özet, önsöz, araştırmanın amacı, konusu, yöntemi, konu hakkındaki önemli çalışmaları kapsayan giriş dört bölüm, sonuç ve kaynakçadan oluşmaktadır. Birinci bölümde İslam fıkhı ile bağlantılı olarak göç olgusunun tanımı ile Kurʼân-ı Kerîm ve hadislerdeki kullanım şekline değinilmiştir. Daha sonra konu ile ilişkili kavramlar ve konu ile bağlantıları ele alınmıştır. Bölüm, araştırmacının tercih ettiği göç olgusunun tanımı ile sonlandırılmıştır. İkinci bölümde tarihte göçün gerçekleştiği dönemler üzerinde durulmuş ve Kurʼânʼdaki işaretleri açıklanmıştır. Ayrıca Peygamberler tarihi eksenli olarak sünnette ve siyerde yer edinen göç olayları eski kavimlerin göçleriyle harmanlanarak aktarılmıştır. Daha sonra Peygamberimizin ve sahabenin hicretlerine ve sahih bir fıkhi netice elde etme açısından her iki hicretten yararlanmanın boyutuna atıfta bulunulmuştur. Bölümün sonunda modern dönemin göçleri ile modern ve eski dönem göçleri arasındaki fark ele alınmıştır. ʻGöçün nedenleri, göç ve göçmen çeşitleriʼ isimli üçüncü bölümün başında göçün çeşitleri, nedenleri ve göç ile ilgili dini meseleler ele alınmıştır. Ayrıca göç olgusunun dini boyutunun varlığı ve göçmen grupları ile ilgili dini meselelerin netleştirilmesi adına göçmenler de gruplara bölünmüştür. Dördüncü ve son bölümde ise modern dönemin göçmenlere bakışı ve çağdaş hukuk sisteminde göçmenlerin hukuku islam fıkhı ile karşılaştırılarak işlenmiştir. Sonuç kısmında ise araştırma neticesinde varılan veriler serdedilmiştir."
