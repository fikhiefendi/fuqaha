abstract: "Kur'ân'da ve Sünnet'te zikri geçen“hamr”kelimesinin tam olarak neye isim olduğu ve kapsamı uzun yıllar İslam fıkıh ekolleri arasında ihtilaflı bir mesele olmuştur. Sarhoş etme özelliği olan hamr haram kılındığı için fazla tüketildiğinde sarhoşluk veren etil alkolün, günümüzde bazı gıda ürünlerinde aromaları çözücü bir madde olarak kullanılması Müslüman tüketiciyi rahatsız etmektedir. Söz konusu kimyasal bir madde olduğu için araştırmanın bilimsel esaslara göre değerlendirilmesi daha doğru ve tarafsız bir netice sunacağından, bu çalışmada konu, gıda kimyası kaynaklarından istifade edilerek incelenmiştir. Çalışmamız, bir giriş ve üç ana bölümden oluşmaktadır. Birinci bölümde tezimizin ana kavramları Kur'ân, Sünnet ışığında ele alınmış, bunların gelenekteki yorumlarına yer verilmiştir. Gelenekte iddia edildiğinin aksine, yasaklanışı Kur'ân-ı Kerîm ile başlamayan hamr'ın, önceki şerîatlerde de haram olduğu düşüncesi tezimizin ana muhtevasını oluşturmaktadır. Bu temelde ele alınan çalışmamız, ilgili kavramları daha önce yapılan çalışmalardan farklı bir gözle ve daha kapsamlı bir biçimde ele almaktadır. İkinci bölümde gıda bilimi açısından tahammür (alkol fermentasyonu) konusu alanın kendi kaynaklarından alıntılarla açıklanmış, laboratuar desteği alınarak deneysel sonuçlarla incelenmiştir. Bazı hadis rivayetlerinde yerini alan ve sarhoş edici özellik kazanıp kazanmadığı konusunda tartışmalı yorumlara sahne olan nebîzler bu bilgiler ışığında değerlendirilmiş, mevzu tarafsız bir yaklaşımla ele alınmıştır. Bu sayede, kimi eserlerde hatalı şerh edilmesi nedeniyle hem ihtilaflı yorumlara yol açan hem de zihinlerde önemli soru işaretleri bırakan rivayetlere net bir açıklama getirilmeye çalışılmıştır. Üçüncü bölümde fıkıh kaynaklarında yerini almış farklı isimdeki pek çok içki veya içecek niteliğinde olan sıvılara yer verilmiştir. Bunlardan hangilerinin sarhoşluk verici özelliğe sahip olduğu hangilerinin sarhoşluk vermediği tespit edilmeye çalışılmış, fakihlerin yorumları fermentasyon ilkeleri esas alınarak değerlendirilmiştir. Ayrıca günümüzde alkol katkılı ya da kendiliğinden alkol içerebilen içeceklerin ve uyuşturucu maddelerin Kur'ân ve Sünnet kriterlerine göre hükmü tespit edilmeye çalışılmıştır."
