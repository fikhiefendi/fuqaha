abstract: "İslâm hukukunda evlilik akdi, insan neslinin sahih ve şer'î niteliklere uygun bir şekilde sürdürülmesi açısından önem arz etmektedir. Evliliğe giden önemli bir adım olarak nişanlılık da ayrı bir öneme sahiptir. Müslüman bir toplum olması hasebiyle Afganistan toplumunda evlilik öncesi bir ilişki türü olan nişan ve nişanlılık süreçleri üzerinde çalışma yapmak bu yönüyle gerekli ve kıymetlidir. Nişanlılığın hukukî yönüne bakıldığında İslâm hukukçularının çoğunluğuna göre nişanlılığın bir akit değil bir vaad olarak değerlendirildiği görülmektedir. Ayrıca Afgan Medenî Kanunu'nda da nişanın evlilik için sadece bir vaad olduğu belirlenmiştir. Bununla birlikte Kânûn-i Ahvâl-i Şahsiyye-i Ehl-i Teşeyyu' ise nişanı câiz bir sözleşme olarak nitelemektedir. Söz konusu kanuna göre sözleşme, ilzâmî bir sözleşme değil gayr-i mülzim bir sözleşme olarak addedilmektedir. Buna binaen nişanın bozulması durumunda bozan taraf için tazminatın gerekip gerekmeyeceği gibi hususları değerlendiren İslâm hukukçularının farklı görüşleri bulunmaktadır. Bu tezde İslâm hukuku, Afgan Medenî Kanunu ve Kânûn-i Ahvâl-i Şahsiyye-i Ehl-i-Teşeyyu' Kânûnu çerçevesinde Afgan toplumu ve geleneklerindeki evlilik öncesi faaliyetler, nişan, nişanın şartları ve sonuçları gibi hususlar karşılaştırmalı olarak incelenmektedir."
