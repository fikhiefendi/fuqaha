abstract: "Mecelle-i Ahkâm-ı Adliyye Şerhi, Osmanlı Medenî Hukuku olarak kabul edilen Mecelle'nin ve genel hukuk çalışmalarının anlaşılması açısından büyük bir öneme sahiptir. Bu tezin amacı; Mecelle-i Ahkâm-ı Adliyye Şerhi'nin Küllî Kaideler bölümünün latinize çalışmasının yapılarak, eserin yazıldığı döneme ait hukuk çalışmalarının anlaşılmasına katkıda bulunmaktır. Çünkü gerek Mecelle gerekse onun şerhleri kendi devirlerinde büyük bir değere sahip olmakla birlikte, günümüzde de hukukî mirasımızı tanımamız açısından önemli bir yere sahiptir. Dört ana bölümden oluşmakta olan tezin birinci bölümünde, Türkzâde Mehmed Ziyâeddin'in yaşadığı ortam, hayatı ve eserleri hakkındaki bilgilere yer verilmiştir. İkinci bölüm Mecelle ve Küllî Kaideler hususunda genel bilgilere dayanmaktadır. Üçüncü bölüm Türkzâde Mehmed Ziyaeddin'in birçok fer'i konuyu içine alan ve fıkıh ilminin ruhu olarak nitelenen“Küllî Kaideler”hakkındaki görüşlerini içermektedir. Dördüncü bölümde ise müellifin Mecelle Şerhi'nin“Küllî Kaideler”bölümünün latinize edilmiş şekli verilmiştir. Çalışmada, Mecelle maddelerinin sıralanması takip edilerek, sözcüklerin kendi dönemlerine ait kullanım şekilleri günümüzde de karşılık buluyorsa bugünkü kullanımıyla; karşılığı bulunmuyorsa orijinal haliyle verilmiştir. Dördüncü bölümde yer alan Küllî Kaidelerin latinize edilmesinde sayfa numaraları orijinal metinde sayfa sonu nereye denk geliyorsa orada olacak şekilde köşeli parantez içerisinde verilmiştir."
