abstract: "Bu tezde, konvansiyonel iktisatla mukayeseli olarak İslam iktisadı açısından tasarruf konusu ele alınmıştır. Tezin amacı tasarruf kavramının mahiyetini ortaya koymak ve bireysel (mikro) bir tasarruf teorisi oluşturabilmektir. Bu çerçevede konvansiyonel iktisadın ve İslam iktisadının meseleye yaklaşımları incelenmiştir. İnceleme neticesinde konvansiyonel iktisatçıların tasarruf konusunu çoğunlukla sermaye birikimine kaynaklık etmesi açısından ele aldıkları tespit edilmiştir. İslam iktisatçıları tasarrufların kaynağının meşruiyetine, bunların atıl kalmamasına ve dinen meşru alanlarda değerlendirmesine dikkat çekmişler, bunun haricinde konvansiyonel iktisatçılar gibi bilhassa gelişmekte olan ülkelerin tasarruf oranlarını nasıl artıracaklarına, tasarrufların büyüme ve kalkınmadaki etkisine, tasarruflara yönelik ortaya çıkan kurumlara ve tasarrufları değerlendirme yöntemlerine odaklanmışlardır. Bu yaklaşım çoğunlukla tasarruf ve sermaye kavramlarını aynı kabul etmiş ve bunların değerlendirilmesinde benzer yöntemleri benimsemişlerdir. Yine bu yaklaşım tasarrufa genellikle makro açıdan yaklaşmış, tasarrufun mahiyetini tam olarak belirlemeden tasarruf oranlarını belirleyen faktörlere ve tasarruflara yönelik ortaya çıkan kurumlara değinmişlerdir. Sonuç olarak her iki alanda da tasarrufun sermaye gibi kabul edildiği ve bu açıdan ele alındığı tespit edilmiştir."
