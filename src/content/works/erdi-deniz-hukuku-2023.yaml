abstract: "Günümüzde deniz yolu taşımacılığı dünya ticaretinin vazgeçilmez bir unsurudur ve dünya çapında binlerce gemi ile gerçekleştirilmektedir. Tüm bu gemilerde çalışan gemi çalışanlarının iş ilişkilerini ve çalışma şartlarını düzenleyen Deniz İş Hukuku; Deniz Ticareti Hukuku ve İş Hukuku alanlarının iç içe geçtiği bir alan olup hem milletlerarası hem de ulusal birçok farklı düzenlemeye konu olmuştur. Bu çalışmada, Deniz İş Hukuku'nu ilgilendiren milletlerarası ve ulusal temel düzenlemeler incelenerek Deniz İş Hukuku'nda işveren sıfatı ve işverenin yükümlülükleri değerlendirilmiştir. Çalışma üç bölümden oluşmaktadır. İlk bölümde Deniz İş Hukuku'nda uygulanacak mevzuata dair temel düzenlemelerden bahsedilecektir. International Labour Organization (“ILO”) sözleşmeleri ve Maritime Labour Convention 2006 (“MLC 2006”) incelenerek, bu sözleşmelerin Türk Hukuku'ndaki yürürlüğü irdelenecektir. Bu bölümün devamında Deniz İş Hukuku hakkındaki temel Türk mevzuatı ele alınacak, 854 sayılı Deniz İş Kanunu (“DİşK”), 6098 sayılı Türk Borçlar Kanunu (“TBK”) ve 6102 sayılı Türk Ticaret Kanunu (“TTK”) genel hatları ve uygulama alanlarıyla incelenecektir. Ek olarak, uygulamada sıkça kullanılan International Transport Workers' Federation (“ITF”) toplu iş sözleşmeleri, yapısı ve uygulama alanıyla birlikte açıklanacaktır. Ardından, Deniz İş Hukuku'nda uygulanacak hukukun belirlenmesi ele alınacak, 5718 sayılı Milletlerarası Özel Hukuk ve Usul Hukuku Hakkında Kanun (“MÖHUK”) kapsamında yabancılık unsuru ve kanunlar ihtilafı kuralları değerlendirilerek gemi çalışanlarının iş sözleşmelerindeki hukuk seçimiyle ilgili sorunlar ve bunlara yönelik çözüm önerilerinden bahsedilecektir. İkinci bölümde Deniz İş Hukuku'nda işveren tanımı incelenecek ve işverenin tespiti yapılacaktır. MLC 2006'daki ve DİşK'teki işveren tanımları unsurlarıyla birlikte değerlendirildikten sonra gemi ile ilgili kişilerin işveren sıfatı üzerinde durulacaktır. Gemi maliki, donatan, donatma iştiraki, yönetici, işleten, çarterer ve kaptan genel hatlarıyla anlatılacak ve işveren olup olmadıkları irdelenecektir. Bölümün sonunda işveren sıfatının tespitinde varılan sonuç ortaya konulacaktır. Üçüncü bölümde Deniz İş Hukuku'nda işverenin yükümlülüklerinden bahsedilecektir. Mali yükümlülükleri başlığı altında ücret, kıdem tazminatı, ihbar tazminatı, ölüm tazminatı, yıllık izin ücreti, fazla çalışma ücreti genel olarak açıklanarak MLC 2006 öncesi ILO sözleşmeleri, MLC 2006 ve Türk Hukuku bakımından ana hatlarıyla değerlendirilecektir. Diğer yükümlülükler başlığı altında ise işverenin barındırma, iaşe sağlama, sosyal güvenlikten yararlandırma, gemi çalışanını koruma ve gözetim, yurda iade, işe uygun gemi çalışanı çalıştırma ve eşit davranma borcu incelenecektir. Deniz İş Hukuku'nda işverenin yükümlülükleri incelenirken TBK, 4857 sayılı İş Kanunu (“İşK”), ve 5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu'nun (“5510 sayılı Kanun”) bağlantılı hükümlerine de değinilecektir"
