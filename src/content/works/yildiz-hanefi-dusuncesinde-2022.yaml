abstract: "“Çocuk”kavramı insanda bilgisizlik, korunaksızlık, masumiyet, muhtaçlık gibi kavramları çağrıştırmaktadır. Çocuğun bu eksiklikleri tam ehliyetli yetişkinler tarafından sevgi, şefkat ve merhametle korunarak, eğitilerek ve hayata hazırlanarak giderilmelidir. İslam hukuku, çocuğa ve çocuğun haklarına büyük önem vermiş ve her konuda haklarını koruma altına almıştır. Öyle ki küçük çocukların velâyetini, kendilerine bakmaktan aciz oldukları ve ihtiyaçlarını bizzat karşılayamadıkları gerekçesiyle neseb ve din bağı bulunan şefkatli ve merhametli kimselere vermiştir. Velâyet, şefkatli ve merhametli kimseler olmalarının yanında çocuk hakkında daha isabetli görüşe sahip olmalarından dolayı babaya verilmiş şer'î bir yetkidir. Bu yetkinin kapsamı çocuğun yalnızca menfaatine olan tasarruflar olarak belirlenmiştir. İslam Hukukunda tüm çocuklar hem şahsî hem de malî olarak“velâyet”ya da“vesâyet”müessesesiyle güvence altına alınmıştır. Yetim, öksüz, buluntu (lâkit) veya ebeveynleri boşanmış olsun tüm çocukları himaye edecek, mallarını koruyacak bir veli ya da vasî görevlendirilmektedir. Bu velî ya da vasîlerin çocukla ilgili tasarrufta bulunmaya yetkili olabilmeleri için gerekli vasıfların tespiti İslam hukukçuları tarafından titizlikle yapılmıştır. Gerekli vasıfları taşıyan velî ya da vasîlerin çocuğun hem şahsına hem de malına yönelik tasarrufları noktasında da çocuğun menfaatleri gözetilerek sınırları belirlenmiştir."
