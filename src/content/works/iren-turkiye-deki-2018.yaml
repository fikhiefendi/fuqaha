abstract: "Katılım sigortacılığı, İslam Alimlerinin, geleneksel sigorta sistemine getirdiği eleştiriler nedeniyle geliştirilmiştir. Katılım sigortacılığı, geleneksel sigortacılığa alternatif olmuştur. Özellikle, Malezya ve Körfez İş Birliği Konseyi ülkelerinde katılım sigortacılığına ilişkin önemli gelişmeler yaşanmaktadır. Söz konusu ülkelerdeki katılım sigortacılığı sektörleri global anlamda katılım sigortacılığına öncülük etmektedirler. Türkiye ise katılım sigortacılığı anlamında Malezya ve Körfez İş Birliği Konseyi ülkelerine kıyasla henüz yolun başındadır. Türkiye'de katılım sigortacılığı sektörünün gelişmesi için ciddi adımlar atılmaktadır. Bu çalışmada Malezya ve Körfez İş Birliği Konseyi ülkeleri piyasa yapısı ve katılım sigortacılığına ilişkin veriler incelenmiş ve karşılaştırılmıştır. Ayrıca Türkiye'nin katılım sigortacılığına ilişkin mevcut durumu ele alınmıştır."
