abstract: "Bu kitap, İslam Hukuku'nun biçim ve konu itibariyle genel ceza usullerini ortaya çıkararak ve bunları müstakil bir çalışmada bir araya getirerek bu usullerin, Suriye Ceza Kanunu kuralları ile karşılaştırılması amaçlanmıştır. Kitap, giriş ve iki bölümden oluşmaktadır. Giriş kısmında \"Davabit\" (الضوابط kelimesinin tarifi ve fıkıh kaidesi arasındaki farka temas edilmiş, cezanın ne demek oldugu. İslam Hukuku ve beşerî yasalardaki cezaların kısımları üzerinde durulmuştur. Birinci bölümde ceza olgusunun objektif kuralları üzerinde durulmuştur ki, bunları üç madde şeklinde özetlemek mümkündür 1. Cezanın faydalı olması: Bu kurala göre, uygulanan yaptırımın, hedeflenen amaca ulaştırması gerekmektedir. 2. Ceza ile Suçlu Arasındaki Uygunluk: Burada suçluya verilecek olan cezanın, suçlunun durumuna ve kendisini suça iten şartlara uygun olması gerektigi anlatılmak istenmiştir. 3. Suç ile Cezanın Orantılı Olması: Burada ise, ceza ile suçun tehlike ve maddî büyüklüğünün birbirine eşit olması gerektiği vurgulanmıştır. Bu, işlenen suçtan dolayı ortaya çıkan zararlar ile suçlunun ciddiyet oranı ölçülmektedir. Ikinci bölümde ise, verilecek biçimsel cezanın kuralları üzerinde durulmuştur ki, bunları da dört madde ile özetlemek mümkündür: 1. Cezada Şahsîlik: Bununla yalnızca suçluya verilen ve başkasına tesiri olmayan ceza kastedilir. Dolayısıyla bu suç türünde, sadece suçu işleyen kişi sorumludur, aile fertlerine, yakınlarına veya başkalarına suçlunun alacağı cezadan bir pay düşmez. 2. Cezada Eşitlik: Burada ise, suçu işleyen herkesin alacağı cezanın eşit olduğu anlatılmak istenmiştir. Dolayısıyla fertler arasında, mevki veya sosyal konumlarına göre bir ayırıma gidilmez. 3.Cezanın Çeşitleri: İslam Hukuku'nda ceza ve yaptırımlar, çeşidi ve uygulanışı itibariyle farklılık göstermektedir ve özgürlüğün elden alınması ve idam gibi cezalarla sınırlı değildir. Aksine İslam Hukuku'nda suçluya ve işlediği suça uygun düşecek derecede çeşitli ceza metotları belirlenmiştir. 4. Ceza Verme Konusunda Yargıcın Yetkilerinin Kayda Bağlı olması: Burada ise, cezanın tayin edilip karara bağlanması için yargıca verilen yetkilerden bahsedilmiştir."
