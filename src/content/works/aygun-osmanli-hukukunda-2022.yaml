abstract: "Toplumsal bir varlık olan insanın, hukuk sistemi tarafından belirlenmiş hak ve sorumlulukları bulunmaktadır. Mülkiyet hakkı da hukuk tarafından koruma altına alınmış, insanın en temel haklarından biridir. Mülkiyet hakkının kişiye mal üzerinde sınırsız tasarruf imkânı sunduğu mutlak olarak kabul edilmiş olsa da, toplumun ihtiyacına göre söz konusu hakka bazı sınırlandırmalar getirilmiştir. Şüf'a hakkı da kadim devirlerden beri birçok hukuk sisteminde çeşitli biçimlerde var olan, mülkiyet hakkına getirilmiş sınırlandırmaların başlıcalarındandır. İslam hukuk bilginleri fıkıh eserlerinde, Hz. Peygamber'den gelen nasları ve toplumda eskiden beri mevcut olan bazı uygulamaları dikkate alarak İslam hukukunun genel ilkeleri ışığında şüf'a hakkının mahiyeti, meşruiyeti, gayesi, sebepleri, şartları ve kullanma usulünü geniş biçimde ele almıştır. İslam hukuk tarihinin altı asırdan fazla bir kısmını temsil eden Osmanlı hukuku şüf'a hakkı özelinde Hanefî mezhebinin doktrin ve uygulama bakımından geçirdiği evreleri görmek açısından oldukça önemlidir. Bu çalışmamızda ilk olarak Hanefî fıkıh eserlerinde şüf'a hakkının hangi konular bağlamında nasıl ele alındığını aktaracağız. Sonraki kısımda ise Osmanlı hukukuna genel bir bakışın ardından Osmanlı hukukunda şüf'a hakkının teori ve uygulama yönünü göstermeye çalışacağız."
