abstract: "Bu tezde Hanefî mezhebinin muteber metinlerinden Kudûrî'nin el-Muhtasar, Mevsılî'nin el-Muhtâr ve Nesefî'nin Kenzu‟d-Dekâik adlı eserlerinde kullanılan mekruh kavramları karşılaştırmalı olarak incelenmiş; onların kerâhet ifade eden sözleri ve anlamları, ittifak ettikleri ve ayrıldıkları hususlar tespit edilerek yorumlanmaya çalışılmıştır. Tezimiz toplamda dört bölümden oluşmaktadır. Birinci bölüm giriş, ikinci bölümde yazarların hayatları, hocaları, talebeleri ve eserleri ele alınmış, üçüncü bölümde mekruh kavramının üç temel kitaptaki kullanımı incelenmiştir. Sonuç bölümünde de tespit ettiğimiz veriler açıklanmıştır. Bu çalışmada Hanefî mezhebinin muteber üç farklı eserini temel alıp inceleyerek zaman içerisinde Hanefî temel metinlerinde mekruh kavramının kullanımında yaşanan gelişimi ve farklılıkları tespit edip bu konuya ışık tutma gayesi güdülmüştür. Aralarında temelde büyük farklılıklar olmamakla birlikte sadece ifade tarzlarında değişiklikler olduğu tespit edilmiştir. Temelde Mevsılî ve Nesefî'nin konu bütünlüğü hususunda Kudûrî'yi takip ettikleri, yer yer onun söylediklerine çok az ilavelerde bulundukları söylenebilir."
