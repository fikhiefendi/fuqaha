abstract: "Bu araştırma, insanlar arasındaki ortak sözleşmelerden biri olan hibe sözleşmesini, Mecelle-i Ahkâm-ı Adliye'nin hibe bölümünü inceleyerek, dört mezhep ile karşılaştırarak ele almaktadır. Araştırmanın önemi, İslam hukukunun en önemli hibe sözleşmelerinden birini ele almasıyla vurgulanmaktadır ve Osmanlı Devleti'nin sonlarına doğru yargının dayandığı Mecelle-i Ahkâm-ı Adliye'yi incelemektedir. Çünkü Mecelle-i Ahkâm-ı Adliye, çağdaş hukuk materyalleri üzerine İslam hukukunu yazan ilk dergilerden biri olarak kabul edilmektedir. Mecelle'nin Hanefi fıkhını esas aldığı bilinmektedir. Araştırma problemi çalışmanın içinde yatıyor cumhurun ve Mecelle'nin ortak aynı görüşlere sahip olup olmadığını öğrenmek için Mecelle'den hibenin maddelerini ve hükümlerini çıkartıp cumhurun görüşleri ile mukayese yaptık. Bir yandan Mecelle ile Hanefi mezhebinin, diğer yandan Mecelle ile cumhurun görüşü arasındaki görüş birliği ve ihtilaf alanlarını mukayese ettik. Ve Dergi hediye konusunda Hanefi mezhebine içtihad mı ekledi, yoksa dört mezhep arasındaki içtihat farkı aynı mı kaldı? Bu araştırmada tümevarımsal, karşılaştırmalı ve analitik yöntemlerini kullandık. Tümevarımsal yöntemi, fıkıh kitaplarında ve Mecelle'de hibe ile ilgili konuların takibinde kullandık. Karşılaştırmalı yöntemi ise Mecelle'de anlatılanları dört mezhepteki kitaplarla karşılaştırmak için kullandık. Analitik yöntemi ise görüşleri analiz etmek ve cumhurun görüşlerine ne ölçüde katıldıklarını belirlemek için kullandık. Araştırmanın ulaştığı en önemli sonuçlar arasında: Mecelle, Fukahâ'nın çoğunluğunun görüşüne aykırı olarak, anne ve babanın mülkiyetini aldıktan sonra hibeyi geri almanın caiz olduğu ve büyükbaba ile büyükannenin çocuğa bir şey hibe etmeleri halinde hibenin geri alınmasının caiz olduğu konusunda Hanefi mezhebiyle aynı görüştedir. Aynı zamanda Mecelle, eşler arasında verilen hibeyi geri almanın caiz olmadığı konusunda Hanefi, Maliki, Şafii ve Hanbeli ulemasının çoğunluğuyla aynı görüştedir. Mecelle, hibeyle ilgili bölümde üç konuda Hanefi mezhebiyle görüş birliği içindedir: Hibenin tanımı, şartları ve hibeyi sözleşme ve makbuzdan sonra geri almanın caizliği. Mecelle dört konuda dört mezheple aynı görüştedir: Hibeyi vermenin hükmünün caiz olduğu, şartları itibarıyla, eşler arasında hibeyi geri almanın caiz olmadığı ve hastalığı ölümcül olan birisine hibe vermenin hükmü ."
