abstract: "Bu çalışmada Kur'an-ı Kerim'in ilgili ayetlerinden ve Allah'ın Elçisi'nin yaptığı Veda Haccı'ndan hareket ederek Müslümanların zihninde yapılması zor bir ibadet olarak tasavvur edilen hac ibadetinin, özellikle de bu ibadetteki yasak davranışların incelenmesi hedeflenmiştir.Çalışmamız giriş, üç ana bölüm ve sonuç kısımlarından oluşmaktadır. Giriş bölümünde, konunun amacı ve kapsamı belirtilerek bu ibadetle ilgili daha önce yapılmış olan çalışmalara değinildi. Birinci bölümde, hac ibadeti ile ilgili genel bilgilere yer verilerek bu ibadetle ilgili kavramlar açıklandı. Ayrıca hac ibadetinin yapıldığı mekânlar kısaca tanıtıldı.İkinci bölümde, hac ibadeti ile ilgili ihram yasakları, Kur'an'la sabit olanlar ve Sünnetle sabit olanlar şeklinde iki kısımda incelenerek tespit edildi.Çalışmamızın üçüncü bölümünde, tavaf, sa'y, vakfeler, ihsar ve hac ihramının feshi konuları ve bunlarla ilgili yasaklar incelendi.Sonuç bölümünde ise, tezimizde tespit edilen yasaklar ve sonuçlar özet olarak verildi."
