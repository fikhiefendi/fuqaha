abstract: "Bu tezin amacı, 298 No'lu Bitlis er`iye Sicil Defteri vasıtasıyla Bitlis ehri'nin ekonomik, sosyal ve dini durumunu incelemektir. Tezimizi 298 No'lu Bitlis er`iye Sicil Defteri dıında Aratırma-inceleme eserler ile Mahalli kaynaklara dayandırdık. Tez, girile beraber be bölümden olumaktadır. Giri bölümünde, er`iye sicilleriyle Osmanlı öncesi ve Osmanlı sonrası Bitlis ehrinin tarihî durumuna deinilmitir. kinci bölümde, Bitlis ehrinin idarî durumu ve mahkeme görevlileri ile Bitlis ehrinin köyleri, mahalleleri ele alınmıtır. Üçüncü bölümde, Bitlis'in ekonomik durumu ile alakalı ticarî durum, ehirdeki esnaflar, tarım ve hayvancılık alanlarındaki faaliyetler ele alınmıtır. Dördüncü bölümde, Bitlis sosyal hayatı içerisinde kadın ve çocuk haklarının korunması, gayr-i Müslimlerin haklarının muhafazası ve Osmanlı toplumundaki yerleri ile ehir yapısı ve aile hayatı ele alınmıtır. Son bölümde ise cami-mescid ve görevlileri, eitim kurumları ve görevlileri, vakıflar hakkında kısa bilgi ve Bitlis ehrinin dini durumu ele alınmıtır."
