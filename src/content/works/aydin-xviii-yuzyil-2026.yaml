abstract: "Çalışmada XVIII. yüzyıl Osmanlı para düzeninde aynı anda çok sayıda paranın dolaşımda bulunması, ayar ve rayiç değişimleri ile bunların ticarî hayata yansımaları fetva mecmuaları üzerinden incelenmiştir. Araştırma, sarrafların ticarî hayatta kurduğu ilişkileri fetvalar üzerinden görünür kılmayı amaçlamaktadır. Bu çerçevede borç ilişkileri, alım-satım, para ve kıymetli maden mübadelesi, rehin ve teminat uygulamaları, kefalet ilişkileri, emanet ve tazmin sorumluluğu gibi başlıklar ele alınmıştır. Çalışmanın ana kaynaklarını Behcetü'l-fetâvâ, Fetâvâ-yı Abdürrahîm, Bahrü'l-fetâvâ, Fetâvâ-yı Feyziyye, Tuhfetü'l-fetâvâ ve Netîcetü'l-fetâvâ adlı altı fetva mecmuası oluşturmaktadır. XVIII. yüzyıla ait daha fazla fetva mecmuası bulunmakla birlikte, bu eserler latinize neşirlerinin mevcut olması ve metinlerin sağlıklı biçimde taranmasına imkân vermesi sebebiyle tercih edilmiştir. Araştırma nitel araştırma yaklaşımı içinde yürütülmüş, temel yöntem olarak doküman incelemesi kullanılmıştır. Mecmualar taranmış, para ve kıymetli maden işlemleriyle ilgili fetvalar tespit edilmiştir. Elde edilen 72 fetva, konu başlıklarına ve kaynak mecmualara göre tasnif edilmiştir. Fetvalar değerlendirilirken dönemin para sistemi ve darphâne uygulamalarına dair tarihsel-iktisadî arka plan da dikkate alınmıştır. Kısa fetva hükümleri, klasik fıkıh metinlerinden yapılan nakillerle açıklanmış ve gerekçeleri izlenmiştir. İnceleme sonucunda, Osmanlı hukukçularının klasik Hanefî çerçeveyi korumakla birlikte piyasa şartlarını da gözeten çözümler geliştirdikleri görülmüştür. Tağşiş ve kesâd hallerinde borcun ödenmesi ve değer tazmini tartışmalarında mislî-kıyemî ayrımı, damân sorumluluğu ve kabz şartı gibi kavramlar öne çıkmaktadır. Sarrafların yalnızca para bozan kişiler olmadığı anlaşılmaktadır. Sarraflar kredi ilişkilerinde teminat ve kefalet düzeninde rol almaktadır. Devletin para düzeniyle temas eden yarı-resmî işlevler de üstlenmektedirler. Mahkemelerde ehl-i hibre sıfatıyla bilirkişilik yaptıkları da tespit edilmiştir. Ayrıca muâmele-i şer'iyye gibi uygulamaların, faiz yasağı ile akit sıhhati arasındaki gerilimde pratik bir yol üretme amacı taşıdığı sonucuna ulaşılmıştır."
