title: "Humeynî'nin Velâyet-İ Fakih'inden Şîrâzî'nin Şûrâ el-Fukahâ'sına İmâmiyye Şiası'nda Ulemânın Otoritesi"
titleTranslation: {"en": "From Khomeini's Velayet-E Faqi̇h to Shi̇razi̇'s Shura Al-Fuqaha the authori̇ty of the ulema in the İmamiyyah Shi̇'a"}
