abstract: "Bu tez çalışmasında, Humeyni'nin ortaya koyduğu Velayet-i Fakih düşüncesi ile Şirazi hareketi tarafından geliştirilen Şura el-Fukaha düşüncesi, İmâmiyye Şia'sında ulemanın otoritesi çerçevesinde, karşılıklı olarak değerlendirilmek suretiyle incelenecektir. İki bölümden müteşekkil olan bu tez çalışmasının birinci bölümünde Safevi Devleti'nden İran Devrimine kadar olan süreçte İmâmiyye Şiîliğinin gelişim süreci içerisinde ortaya konan görüşler çerçevesinde İmâmiyye Şîası ulemasının konumu incelenmiştir. İkinci bölümde ise 1979 devriminden sonra hayata geçrilen Velayet-i Fakih düşüncesine bir eleştiri olarak ortaya çıkan ve Şirazî hareketinin ortaya koyduğu Şura el-Fukaha düşüncesinin temel yaklaşımları İmâmiyye Şiasında ulemanın yeri dikkate alınarak anlatılmıştır. Kelime anlamı olarak“fakihin tasarruf yetkisi anlamına gelen velayet-i fakih, on ikinci İmam'ın gaybet olduğu dönemde, bir İslam toplumunun hem dini hem de dünyevi işlerini yürütme yetkisini elinde bulunduran din bilginin (fakihin) önderliğini ifade etmektedir. Buna karşılık kelime anlamı olarak ”fakihlerin meclisi“ demek olan Şûrâ el-Fukahâ ise müslüman topluluğun yönetiminin tek bir yüce liderin elinde bulunması yerine, istişare ile yönetecek kıdemli din adamlarından (merciilerden) oluşan bir şûrâ tarafından yönetilmesi anlamına gelmektedir. Çalışma ile İmâmiyye Şîası'sının kurumsallaşması sürecinde ulemanın gücü, İran'da siyaset üzerindeki ”velayet-i fakih\" düşüncesinin etkileri ve bu düşünceye bir eleştiri olarak değerlendirilen ve Şirazî ailesinin ortaya koyduğu Şûrâ el-Fukahâ düşüncesinin mezhep içindeki konumu ve etkisi analiz edilmiştir. Söz konusu analiz ile İran rejiminin temelini oluşturan hakim Şiî yaklaşıma karşı farklı bir düşünce ekolünün güç ilişkileri ortaya konulmaya çalışılmıştır."
