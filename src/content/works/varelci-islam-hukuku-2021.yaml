abstract: "Bu çalışmada İslâm hukuku açısından faizle ilişkilendirilebilir bir mesele durumundaki enflasyon farkının ödenmesi problemine dair yaklaşımların tespiti amaçlanmıştır. Bu bağlamda öncelikle para ve faiz konuları ele alınmış ardından ise dört Sünnî mezhep, fetva kurulları ve bazı araştırmacıların enflasyon farkının ödenmesine dair görüşlerine yer verilmiştir. Bu noktada farklı görüş sahibi müctehidlerin varlığına karşın mezheplerin genel görüşünün enflasyon farkına itibar etmeyerek mislin ödenmesi yönünde olduğu görülmüştür. Fetva kurulları ve ilgili araştırmacıların yaklaşımları ise çeşitlilik göstermiştir. Buna göre faiz veya diğer gerekçelerle mutlak olarak enflasyon farkının ödenmemesi gerektiğini savunan yaklaşımlar olduğu gibi bunu bazı durumlarla sınırlayan yaklaşımlar da benimsenebilmiştir. Diğer taraftan mutlak olarak enflasyon farkının ödenmesini kabul eden yaklaşımlarla birlikte bunu bazı şart ve durumlarla sınırlayan yaklaşımların olduğu tespit edilmiştir. Ayrıca enflasyon farkının hesaplanması ve ödenme zorunluluğu bağlamında farklı yaklaşımlar olduğu sonucuna ulaşılmıştır."
