abstract: "Türkiye'de ve Dünya'da faiz konusunda dini inançlar sebebiyle duyarlılık gösteren belli bir müşteri grubu bulunmakta ve bu nedenle klasik bankalara gitmeyen fonlar atıl kalmaktaydı. Bu durum hem genel ekonomi, hem de tasarruf sahipleri açısından bir kayıp oluşturmaktaydı. Hem atıl kalan bu fonları ekonomiye kazandırmak, hem de Ortadoğu'dan Türkiye'ye fon transferi sağlamak için 1980'li yıllardan itibaren Türkiye'de bu amaçlara istinaden finansal hizmetler sunan kuruluşların kurulmasına yönelik ciddi adımlar atılmıştır. Bunun sonucu olarak, Türkiye'de faizsiz finans sistemi Özel Finans Kurumları (ÖFK) adı altında yer almaya başlamıştır. Bu kurumlar, Turgut Özal hükümetinin Bakanlar Kurulu kararı ile 1983 yılında faaliyet izni almışlar, 1985 yılında Albaraka Türk Özel Finans Kurumu ve Faisal Finans Kurumu'nun kurulması ile faaliyete geçmişlerdir.Bu durum faizsiz finans sisteminin Türkiye'de yer edinmesi açısından önemli bir gelişme olsa da, bu kurumların `banka' adı altında faaliyet göstermiyor olması ve `Özel Finans Kurumları' ibaresindeki `özel' kelimesinin halkta yanlış çağrışımlara neden olması sebebiyle, bu kurumlar yeni bir isim arayışına girmişlerdir. Kasım 2000 ve Şubat 2001 krizlerinden sonra faaliyetlerine devam edemeyen İhlas Finans Kurumu'nun 2001 yılında tasfiye edilmesinden sonra bu kurumlara mevzuat bakımından yeni düzenlemeler getirilmiş, 2006 yılında da, 5411 sayılı Bankacılık Kanunu ile bu kurumlar `Katılım Bankası' adını almış ve Bankacılık Düzenleme ve Denetleme Kurulu'nun (BDDK) denetimi altına girmişlerdir. Bu kanuna göre, bankanın tanımı `Banka: mevduat bankaları ve katılım bankaları ile kalkınma ve yatırım bankalarını ifade eder' şeklinde değişmiştir.Katılım bankaları, mali sektörde faaliyet gösteren ve reel ekonomiyi faizsiz sistemde finanse eden bankalardır. Çalışma prensipleri, tasarruf sahiplerinden topladıkları fonları, çeşitli faizsiz finansman metotları ile ticaret ve sanayide değerlendirerek, oluşan kar veya zarara katılmak, yani oluşan kar veya zararı tasarruf sahipleriyle paylaşmaktır. Bunun yanında, katılım bankaları mevduat bankalarının sunduğu, halkın ihtiyaç duyabileceği hemen hemen tüm bankacılık hizmetlerini de sunmaktadır. Şu an, ülkemizde faaliyet gösteren dört adet katılım bankası bulunmaktadır. Bunlar; Albaraka Türk Katılım Bankası A.Ş., Asya Katılım Bankası A.Ş. (Bank Asya), Kuveyt Türk Katılım Bankası A.Ş. ve Türkiye Finans Katılım Bankası A.Ş.'dir. Bu bankaların gerek toplanan gerekse kullandırılan fonlar bakımından Türk bankacılık sistemi içerisindeki payı her geçen yıl artmaktadır.Bu çalışma ile Katılım Bankacılığının Türkiye'deki ilk nüvelerinin, yıllar içerisindeki gelişiminin ve Türk bankacılık sektörü içerisindeki payının gerek sözel olarak, gerek temel finansal göstergelerle ortaya konması amaçlanmıştır."
