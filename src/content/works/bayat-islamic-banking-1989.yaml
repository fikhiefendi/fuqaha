abstract: "Yakın zamana kadar, hemen hemen tüm İslam ülkeleri, İslam'a yabancı unsurlar içeren ekonomik uygulamaları takip etmektedirler. İslam'a yabancı bir uygulama, Kuran'ın yasaklamasına rağmen krediye faiz uygulanması uygulamasıdır. İslami finans kurumlarının dünyanın farklı yerlerinde son zamanlardaki genişlemesi, Pakistan ve İran İslam Cumhuriyeti'ndeki İslami bankacılık sisteminde yapılan değişiklikten kaynaklanmıştır. Sonuç olarak, Dünya bankacılık sahnesinde daha önce hiç karşılaşılmamış tam bir gelişme oldu. Bu eğilim, artan sayıda Müslüman ve gayrimüslim ülkenin dikkatlerini yeni faizsiz bankacılık kavramına odakladıkça genişlemesidir. Bu çalışma, geleneksel Batı tipi bankacılık uygulamasına alternatif olarak İslami bankacılık anlayışının Müslüman ülkelerde ortaya çıkışını incelemeyi amaçlamaktadır. Bu amaç şu şekilde incelenecektir: genel olarak bankacılık, İslami bankaların amaçları ve İslami bankacılığın tarihsel gelişimi hakkında bir giriş bölümü. İkinci Bölüm, İslami ekonomi teorisini gözden geçirmektedir, çünkü İslami bankaların İslami ekonomi teorisi çerçevesinde çalışması amaçlanmaktadır. İslami bankaların örgütsel yapıları ve operasyonları bakımından farklı özellikleri Üçüncü Bölümde ele alınmaktadır. Bu bankalar faizli işlem yapmamakta, mevduatlar kâr zarar ortaklığı esasına göre yatırılmakta ve buna göre mevduat sahipleri orantılı olarak paylaşmaktadır. Dördüncü Bölümde, İslami bankaların karşılaştığı sorunlar, özellikle İran İslam Cumhuriyeti ve Pakistan'ın deneyimlerine atıfta bulunularak incelenmektedir. Beşinci Bölümün ana teması, İslami bankaların Batı tipi bankalarla karşılaştırılmasıdır. İslami bankacılık uygulamasının kısa süresi nedeniyle cevap vermek için çok erken gibi görünse de.“İslami bankaların üstün olup olmadığı”sorusu incelenmektedir. Son Bölümde, İslami bankacılığın gelecekteki beklentileri tartışılmaktadır. Son olarak, son bölümde bir özet ve sonuç kısmına yer verilmiştir."
