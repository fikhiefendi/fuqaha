abstract: "İslâm Hukuku, kaynağını Kur'an ve sünnetten almakla birlikte, müctehid alimlerin çabalarıyla birlikte nesillere ulaşmıştır. Mal veya hizmet alıverişinde belli bir ücret karılığı aracı olan kimseye simsar denmektedir. Günümüzde, simsarlığın çok geniş bir işlem alanı vardır. İslami Finans sisteminin çok geniş bir alanında simsarlığa dayalı bir hizmet ağı kurulmuştur. İslâmi Katılım bankacılığı, emlakçılık, franchising ve daha bir sürü ekonomik olgu alıcı ve satıcı arasında köprü kurmaya dayalı birer ekonomik olgudur. İslâmi finans sistemi alanında daha yeni sayılabilecek adımlar atılmaya başlanmıştır. İslâm aleminin günümüzde yaşadığı sıkıntılar her alanda kendini hissettirdiği gibi bu alanda da yetersiz kaynak ve uzman eksikliği de bu alanda kendini göstermektedir. İslâm Alemi içinde yukarıda bahsi geçen simsarlık sistemlerinin uygulanmasında motor ülkeler olarak Malezya, Katar ve Suudi Arabistanı gösterebiliriz. Bu tezde simsarlık konusu İslâm Hukuku açısından ele alınmış, daha sonra dünyada var olan simsarlık sistemleri masaya yatırılmış ve İslâm Hukuku açısından simsarlığın ne olduğu sorusuna cevap aranmıştır."
