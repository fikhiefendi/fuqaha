abstract: "XIX. yüzyıl tüm dünyada olduğu gibi Mısır'da da yeni ve modern kanun çalışmalarının hız kazandığı bir dönem olarak göze çarpmaktadır. Özellikle 1798 Fransız işgali sonrasında Fransız yaşam biçimi ve düşüncesi Mısır'da pek çok alanda etkili olmuş, bu durumdan kanun çalışmaları da etkilenmiştir. Mısır'ın hukukî alandaki eksikleri bu etkileşimi daha da arttırmış ve Mısır'da kanunlaştırma çalışmaları hız kazanmıştır. İşte böylesi bir zamanda Muhammed Kadri Paşa, Mısır'daki kanun çalışmalarında dikkat çeken bir konumda olmuştur. Birikim ve tecrübelerini hukuk alanında yaptığı çalışmalarla ortaya koyan Muhammed Kadri Paşa en önemli farkındalığını İslam hukukuna dayalı olarak hazırladığı kanun taslaklarında elde etmiştir. Çalışmamızda konunun daha iyi anlaşılması düşüncesiyle ilk olarak XIX. yüzyıl siyasi tarihi ve dönemin kanunlaştırma faaliyetleri ele alınmış ardından Kadri Paşa'nın hayatı, eserleri ve kanunlaştırma çalışmaları tanıtılmıştır. Anahtar Sözcükler Muhammed Kadri Paşa, Mısır, kanunlaştırma, ahvâl-i şahsiyye, şerʻi ahkâm"
