abstract: "Bu çalışma Malezya'da İslam aile hukukuna dair uygulama örneklerini incelemektedir. Araştırmanın amacı, Malezya'nın kanun-şeriat ilişkisini nasıl konumlandırdığını anlamaya çalışmak ve aile hukuku alanındaki evlenme-boşanmaya dair çeşitli meseleleri inceleyerek İslam hukuk pratiğine etki eden örf ve mezhep algısı gibi unsurları tespit edebilmektir. Kültürel ve toplumsal olarak Şâfiî mezhebini benimseyen çok kültürlü, çok dinli, yer yer anaerkil öğelerin yer aldığı Malezya'da aile hukukuna dair yapılan içtihatlarda ve verilen kararlarda ülkenin dini algısı ile tarihsel-toplumsal-örfi-antropolojik yapısının ilişkisini ortaya koyabilmek amaçlanmıştır. Bu doğrultuda hukuk sosyolojisi, hukuk antropolojisi içeren bir yaklaşım benimsenmiş, özellikle eyaletlerin her birinin aile hukukunu incelerken mukayeseli hukuk metodundan faydalanılmıştır. Kanun metinleri ve uygulama örnekleri dokümantasyon tekniğiyle toplanmış, belgesel gözlem ve analize tabi tutulmuştur. Çalışmada aile hukuku uygulamaları üzerinden kanun-şeriat diyalogu incelenmiş, evlenme ve boşanmaların tescili konusunda şeriatın kanunun önüne geçirildiği gözlemlenmiş, Ehl-i kitapla evlilik hususunda Şâfiî mezhebinin katı görüşü tercih edilerek Malay ulusunun homojen kalması ve dini kültürünün korunması dikkate alınmış, mehir, mut'a ve mal paylaşımı gibi konularda örfün hukuka etkisi tespit edilmiştir. Araştırma Malezya örneğinin aile hukuku pratiğinde günümüzde yüzleştiği problemlere nasıl cevaplar ürettiğini gözlemlemek ve böylelikle İslam hukukunu uygulanabilir hukuk seviyesinde incelemek açısından önem arz etmektedir."
