abstract: "İktisat bilimi, kıt kaynakların dağıtımı ile ilgili yöntemler geliştirmektedir. Günümüz ekonomi bilimi, kaynakların kıt olduğunu iddia etmekte fakat bu iddianın tekrar gözden geçirilmesi gerekmektedir. İslam ekonomisi perspektifi ile bakıldığında, Allah'ın dünyada kısıtlı olsa da insanlara yetecek kadar kaynak sağladığı ve bu kaynakların düzgün bir şekilde kullanılması durumunda birçok ekonomik sıkıntının ortadan kalkacağı belirtilmektedir. Konvansiyonel ekonomi kısıtlı kaynakları kullanırken bireysel kazancı merkeze alırken İslam ekonomisi toplumsal kalkınmayı hedefler. Konvansiyonel finans sistemi kazancı maksimize ederken faizi ana enstrüman olarak belirlemiştir, bu da borçluları zor durumda bırakabilmektedir. İslam dini ise faizli borcu yasaklamıştır. İslami finans ise kendi paradigması doğrultusunda kapital ihtiyacını giderirken ortaklığa dayalıdır ve mudarebe veya müşareke gibi enstrümanları kullanır. Günümüzde katılım bankaları bazı ortaklık faaliyetleri yapsalar da genelde kredi vermeye odaklanmaktadır. Bu da İslam ekonomisinin toplumsal kalkınma hedefine yeterince hizmet etmemektedir. Bu tezde, birey ve kurumların finansman ihtiyaçlarının giderilmesinde ortaklığa dayalı ve fintekler üzerinden çözüm önerileri sunulmaktadır. Tezin amacı, toplumsal kalkınmayı ve refahı artıracak bir finansal yöntem önermektedir. Tez kapsamında ortaklık yapılarının kullanımında bankacılık sistemi yerine finteklerin kullanılması önerilmektedir, çünkü fintekler ortaklığa dayalı finansal büyük bir alan sunmakta ve geleneksel finansal kurumlara alternatif oluşturmaktadır."
