abstract: "n ÖZET Bu Tezimde îslamjıukukunda Butlan Nazariyesini ele alıp, konunun daha iyi bir şekilde anlaşılabilmesi için Modern hukuktaki Butlan Nazariyesi ile mukayese yaptık.Tez çalışmamızda konuyu üç bölüm olarak ele aldık.Butlan'ın aslında bir müeyyide türü olmasından dolayı, birinci bölümde genel anlamda ımıeyyjdejsr konusunu, ikinci bölümde tezimizin asıl konusu olan Butlan nazariyesini hem İslam hukukunda hem de Modern hukukta olmak üzere ayrı ayrı inceleyerek, üçüncü bölümde ise mukayeseli hukuk açısından değişik yönlerden ele almaya çalıştık. Bu tez çalışmamızda Butlan nazariyesi ile ilgili tespit ettiğimiz önemli noktalar tezimizin sonuç bölümünde yer almaktadır."
