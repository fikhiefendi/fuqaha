abstract: "Bu çalışma; Kur'an-ı Kerim 'in ve sünnetin ilgi alanına giren müşterek konulardan biridir. Çalışmamın konusu“Beyân İlmi”hakkındadır. Tezimin ismi:“Bir Fıkıh Usulü Terimi Olarak Beyân”dır. Tezim Önsöz, Giriş, Birinci Bölüm, İkinci Bölüm, Üçüncü Bölüm ve Sonuç kısımlarından meydana gelmektedir. Giriş bölümünde Beyân' in sözlük anlamı, ıstılahtaki anlamı ve diğer anlamlarına yer verdim. Daha sonra Belagattaki anlamıyla Fıkıh Usulündeki anlamı arasında bir karşılaştırma yaptım. Sonra da Beyân'ın tarihçesi hakkında bilgi verdim. Birinci Bölümde Beyân ilminin çeşitlerine yer verdim. Daha sonra Beyân'ın tehir edilip edilemeyeceğini, tehir edilmesine cevaz verilen yerleri, tehir edilmesinin mümkün olmadığı yerleri açıkladım. İkinci Bölümde mezheplerden birer fıkıh usulcüsü örnek alarak bazı fıkıh usulcülerinin“Beyân İlmi”ni nasıl incelediklerine yer verdim. Üçüncü Bölümde; Hermenötik ve Beyân' ı karşılaştırdım, aralarındaki Uişki üzerinde durdum. Hermenötik' ten İslâm Fıkhında faydalanılıp faydalanılamayacağı hakkında düşüncelerimi bildirdim. Sonuç bölümünde de tez konusu hakkındaki kendime ait kanaat ve düşüncelerimi“Beyân”ettim."
