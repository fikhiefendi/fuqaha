abstract: "“İslam İktisadı ve Toplumdaki Yoksulluğu Giderme İşlevselliği”başlıklı bu çalışmamızda temel amaç yüce İslam dininin ekonomiye olan ilgi ve katkısını, iktisat düşüncesini, iktisadi işlemler ve yöntemlerle ilgili hassasiyetini, İslam iktisadının temellerini ve özelliklerini, fıkhi, felsefî ve ahlâkî yönlerini; mal, mülkiyet, para anlayışını, zekât müessesesi ve finansal varlıklar konularını ele almaktır. Ayrıca İslam'ın yoksullukla mücadelesini, yoksulluğun insanlık toplumundaki yıkıcı etkilerini gidermedeki işlevselliğiniKurân, sünnet ve fıkıh ışığında yeni bir bakışla vurgulamaktır. İslam iktisadının toplumdaki yoksulluğun ortadan kaldırılmasında önemli bir imkân olduğu fikri de bu çalışmada işlenecek konular arasındadır. Günümüzde İslam iktisadına karşı duyarsızlık söz konusu olsa da bu çalışmada İslam iktisadının günümüzde uygulanabilirliği gösterilip insanlığın ekonomik problemlerin çıkmazından kurtarılması için bir umut ışığı olduğu ele alınmıştır. Bu araştırmada İslam ümmetinin İslami iktisat düşüncesini geliştirmesi için gerekli olan konulara değinilmiş ve bu konuların iktisadi bir temelde ele alınmasının imkânı hakkında bilgiler verilmiştir. Ahkâm ayetleri ve hadis kaynaklarındaki ilgili kısımlar esas alınmış ve ekonomi temelli yazılmış fıkhi kaynaklara da başvurularak ekonomi konusundaki temel esaslar belirlenmeye ve mümkün olduğu kadar ekonomiyle ilgili çağdaş meselelere değinilerek konu tahlil edilmeye çalışılmıştır. Terimler olduğu gibi kullanılmış olup tez boyunca anlaşılabilir bir dil kullanılmaya gayret edilmiştir."
