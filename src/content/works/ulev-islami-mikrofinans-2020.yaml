abstract: "Araştırmanın iki temel amacı bulunmaktadır. Bu amaçlardan ilki 2018 yılında başlatılan İKSAR Karz-ı Hasen Programının, iki yıllık süre içerisindeki uygulama sonuçlarını ortaya koymak ve uygulamanın etkinliğinin artırılması için öneriler geliştirmektir. Bu minvalde, karz-ı hasen programının nasıl çalıştığı, kimlere karz verildiği, karz verilen kişilerin hangi özelliklere sahip olduğu, programın uygulama safhasında ne tür aksaklıkların ortaya çıktığı, bu aksaklıkların giderilmesi için neler yapıldığı gibi pek çok konu açıklığa kavuşturulmuştur. Programın iki yıllık süredeki uygulama sonuçları ortaya konulduktan sonra, bu sonuçlardan hareketle programın etkinliğinin artırılması için öneriler geliştirilmiştir. Araştırmanın ikinci amacı ise İKSAR'dan karz alan kişiler üzerinde karz-ı hasenin etkisini ölçmektir. Bu amacı gerçekleştirmek için karz verilen kişilerin karz öncesi ve karz sonrası sosyo-ekonomik durumları tespit edilerek boylamsal analize tabi tutulmuştur. Araştırmada karma yöntem yaklaşımı benimsenmiş, araştırma deseni olarak ise yakınsak paralel karma yöntem deseni tercih edilmiştir. Veri toplama aracı olarak anket, görüşme, gözlem ve doküman incelemesinden yararlanılmıştır. Araştırmanın çalışma grubunu İKSAR'dan karz alan 41 kişi oluşturmuştur. 18'i yarı yapılandırılmış olmak üzere 41 kişi ile toplamda 80 görüşme gerçekleştirilmiştir. Anketler ise karz öncesi ve karz sonrası olmak üzere iki kez uygulanmıştır. İlk anketler 41 kişiye uygulanmasına karşın ikinci anketler 30 kişiye uygulanabilmiş, bu nedenle boylamsal analize ilişkin testler 30 kişi üzerinden yapılmıştır."
