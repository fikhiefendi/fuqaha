abstract: "Bütün dinlerin kutsal kabul ettiği bir mekan vardır. Bu çalışmada İslam dininin kutsal kabul ettiği Kâbe'yi Müslümanların kıble edinmesinin ibadet ve muamelat ile ilgili konulara etkisi incelenmiştir. Kıble meselesinin başta namaz olmak üzere birçok konu ile doğrudan veya dolaylı olarak ilişkilendirmesinden dolayı çalışmamızda tümevarım yöntemi kullanılarak kıblenin ilişkili olduğu konular ayrı ayrı ele alınmış ve bir sonuca ulaşılmıştır. Bu çalışma Giriş ve Sonuç haricinde iki ayrı bölümden oluşmaktadır. Giriş bölümünde; araştırmanın amacı, konusu, yöntem ve kaynakları açıklanmıştır. Birinci bölümde; semavi dinlerin kutsal mekan ve kıble telakkileri ele alınmış ve İslamiyet'teki ilk kıble meselesi detaylıca incelenmiştir. İkinci bölümde; Müslümanların kıble olarak nereye ve nasıl yöneldiği, kıbleye yönelebilme imkanı ve kıbleye yönelmenin ibadet ve muamelata etkisi araştırılmıştır. Sonuç bölümünde ise kıble meselesinin farklı konularda nasıl tezahür ettiği izah edilmiş ve İslam dinindeki kıble anlayışının fıkhi konulara etkisi bütüncül bir şekilde ortaya koyulmaya çalışılmıştır."
