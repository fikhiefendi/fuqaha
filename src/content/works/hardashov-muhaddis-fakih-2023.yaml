abstract: "Çalışmamızın konusu, hadis ilminde hadislerin birbirleri ve diğer ilimlerle çelişkisi ile fıkıh usulündeki delillerin te'âruzu ve söz konusu iki ilmin te'âruz meselesindeki muhtelif ve benzer yaklaşımları ile etkileşimleri olarak ortaya konulmuştur. Te'âruz meselesinin hadis ve fıkıh ilmi çerçevesinde ele alandığı çalışmada amaçlanan, hadis ve fıkıh ilminin ilişkisinin ve bu arada te'âruz meselesinin mahiyetinin tespitini izâh edebilmektir. Nitekim hadis ve fıkıh usulü eserlerinde genel anlamında kullanılan ve dağınık olarak yer alan te'âruz/ihtilâf meselelerine araştırmanın delillerin te'âruzuna yönelik sınırlandırma ile gerçekleştirilmiş olması sebebiyle değinilmemiştir. Te'âruz kavramı, şartları, sebepleri konusu ve giderme yolları içerikleri ile birinci bölümde söz konusu muhtevanın hadis usulündeki yeri ikinci bölümde ise fıkıh usulünde yerleri dikkate alınmak suretiyle işlenmiştir. Araştırmanın üçüncü bölümü ise önceki bölümlerde iki ilimde ele alınan te'âruz meselesinde muhaddis ve fakih ulemânın kanaatlerinin ortaya koyulup benzer ve farklı yanların ardından söz konusu ilimlerin etkileşimlerinin te'âruz zemininde ortaya konmaya çalışıldığı bir değerlendirme bölümüdür. Çalışmada iki ilimde ele alınan muhtelif görüşlerin, genel kanaatlerin ve değerlendirmelerin ardından bahse konu iki ilmin cihet farklılıklarının yanı sıra ilişkili oldukları noktaların boyutu, iki ilim arasında bir bütünlüğün olduğu ve iki ilmin birbirinden bağımsız iki müstakil branş olarak kabul edilemeyeceği sonucuna varılmıştır."
