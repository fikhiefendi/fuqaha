abstract: "Türkiye'de Ehl-i Sünnet'e mensup Müslüman nüfusunun yanı sıra Şii gelenek içerisinde yer alan Caferi mezhebine bağlı toplulukların da yaşadığı bilinmektedir. Caferi nüfus özellikle Iğdır ve Kars gibi Doğu Anadolu vilayetlerinde yoğunlaşmakla birlikte, son yıllarda göç ve toplumsal hareketliliklerin etkisiyle İstanbul, Bursa ve Kocaeli başta olmak üzere batı bölgelerinde de dikkate değer bir varlık göstermektedir. Türkiye'deki Caferi topluluğu, çoğu zaman Sünni çoğunluğun dışındaki Alevi ve benzeri inanç gruplarıyla birlikte anılmakta ve kamuoyunda bu kategoriler içerisinde değerlendirilmektedir. Caferilerin inanç ve ibadet pratikleri Alevi geleneklerinden farklılık gösterse de tarihsel ve sosyolojik sebeplerle toplum içinde zaman zaman Alevi topluluklarıyla aynı çerçevede algılandıkları görülmektedir. Osmanlı Devleti'ni kuran Türkmen gruplarından bazılarının siyasi bir kimliğe bürünen Erdebil Tekkesi ile münasebetlerini devam ettirmelerinden dolayı bu gruplar arasında siyasi çatışmalar yaşanmıştır. Erdebil Tekkesinin Şah İsmail'le birlikte Safevi Devleti'ne dönüşmesi, söz konusu kesimin iki devlet arasında kalarak siyasi yönetimlerin hedefi haline gelmesine yol açmıştır. Anadolu'da kalanlar, Kızılbaşlar olarak varlıklarını devam ettirmiş, dönemin Safevi sınırları içerisinde kalanların önemli bir kısmı ise İmamiyye (İsnaaşeriyye) Şiiliğine geçerek fıkıhta Caferi olmuştur. Bunların bir kısmı günümüz Türkiye sınırları içerisinde yaşamaktadır. İlerleyen zamanlarda Avrupa'da yaşanan sosyal ve siyasi gelişmeler kozmopolit bir yapı arz eden Osmanlı toplumunu da etkilemiş ve 1839 yılında Osmanlı Tanzimat Fermanı'nı ilan edilmiştir. Osmanlı, Tanzimat Fermanı'yla hayata geçirdiği reformlarla birçok kurumda yenileşmeyi gerekli görmüş ve bu yönde devlet adamları tarafından ciddi adımlar atılmıştır. Caferiler de Osmanlı'nın Tanzimat ile başlattığı bu çağdaşlaşma çabasının bir parçası haline gelmişlerdir. Bundan sonra bu grup, toplum nazarında Alevi ismi içerisinde kabul görmeye başlamıştır. Aradan geçen uzun bir zamandan sonra 1979 yılında gerçekleşen İran İslam Devrimi, çeşitli nedenlerden dolayı Alevilerle Türkiye'deki Caferileri daha yakın ilişkiye V yönlendirmiştir. Aleviler, kendilerini Ca'feri olarak, Ca'feriler de Alevi olarak tanımlamaktan çekinmemişlerdir. Alevilerin özünden koparıldığını düşünen bazı Caferi topluluklar özellikle Alevilerle yakın temasa geçerek Ca'ferîliğe geçmelerini sağlamıştır. 1980-1990'lı yıllara gelindiğinde dünyada olduğu gibi ülkemizde de yaşanan birtakım siyasi ve sosyal gelişmeler neticesinde baş gösteren kimlik politikaları Alevi-Caferileri de etkilemiştir. Bazı konularda farklı kültür ve ibadet şekillerine sahip olan Caferiler, doğal olarak kendilerini merkez alan bir oluşum içerisine girmişlerdir. Bu süreçten sonra Türkiye'deki cemaat ve tarikatlar gibi Alevi-Caferi gruplar da kendilerine bağlı dernek ve vakıflar kurmuşlardır. Ayrıca kitap, gazete, dergi gibi literatür oluşturabilecek yayınlar ortaya koymuşlardır. Bu noktadan itibaren farklı şehirlere göç eden Caferiler yaptıkları bu çalışmaların neticesinde örgütlenmişlerdir. Bu çalışma Türkiye'de Şii İslam'ın İmamiyye koluna mensup Caferi topluluğun dini, kültürel ve toplumsal görünürlüğünü yazılı medya ürünleri üzerinden incelemeyi amaçlamaktadır. Türkiye'deki Ca'feri topluluğu üzerine yapılan akademik çalışmaların sınırlı oluşu ve özellikle dergiler gibi süreli yayınların mezhepsel kimliğin inşasında ve aktarımındaki rolüne yeterince dikkat çekilmemesi, bu araştırmanın ortaya çıkış gerekçesini oluşturmuştur. Bu bağlamda çalışmamız Ca'feri topluluğun düşünsel dünyasını, dini yorumlarını, toplumsal konumlanışını analiz etmeyi amaçlamaktadır. Bu amaç doğrultusunda topluluğun kurumsal yapılanmaları, kültürel faaliyetleri ve süreli yayınları (dergiler) üzerinden kendilerini ifade biçimleri incelenerek literatüre katkı sağlamayı hedeflemektedir. Süreli yayınlardan olan dergilerin mezhepsel kimliğin inşasında ve aktarımındaki rolü göz önünde bulundurularak, hususiyetle Türkiye'deki Ca'ferilerin çıkarmış oldukları dergiler ele alınmıştır. Dergilerin hangi tarihte ve kaç sayı olarak çıktığı, hangi vakıf veya kurum tarafından çıkarıldığı, hangi konulara ağırlık verildiği üzerinde durulmuştur. Ayrıca Şii dünyada hangi Şii âlimin otoritesinden bahsedildiği, dergileri yayınlayan Caferi grupların İran rehberlik makamını mı yoksa Irak'taki bazı âlimleri mi merci-i taklit olarak kabul ettikleri ele alınmıştır."
