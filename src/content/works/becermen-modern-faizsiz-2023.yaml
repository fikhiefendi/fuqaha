abstract: "20. yüzyılın ikinci yarısından sonra ilk nüveleri ortaya çıkan faizsiz bankacılık sektörü günümüzde birçok müslüman ülkenin ekonomisinde önemli bir pazar payına sahiptir. Ortaklık ve ticâret temeli üzerine kurulan bu sistem içerisindeki finansal ürünlerin birçoğu klasik fıkıh literatüründe yer alan bazı akit türlerinden hareketle geliştirilmiştir. Bu bağlamda kendisinden yararlanılan akitlerden biri de mevcut olmayan malların satımını konu alan istisnâ' akdidir. İstisnâ' akdinin modern bir türü olarak ise paralel istisnâ' isimli faizsiz finansman yöntemi geliştirilmiştir. Paralel istisna' büyük oranda istisna' akdiyle örtüşmekle beraber çok taraflı ve çok aşamalı yapısı itibarıyla bazı farklılıklar arzetmektedir. Çalışmada ilk olarak klasik kaynaklarda istisnâ' akdinin tanımı, meşruiyeti, hukukî mahiyeti, şartları ve bağlayıcılığı konuları ele alınmıştır. Böylece paralel istisnâ' yönteminin fıkhî temelleri ortaya koyulmuştur. Daha sonra paralel istisnâ' yönteminin tanımı, katılım bankacılığı içindeki yeri, türleri, aşamaları, şartları ve riskleri incelenerek pratik yönü ele alınmıştır. Yöntemin fıkhî açıdan değerlendirilebilmesi için yeterli arka plan bilgisi sağlandıktan sonra ise hangi noktalarda mahzurlu sayılabileceği tespit edilmiş ve fıkhî analizi yapılmıştır. Yapılan incelemeler neticesinde paralel istisnâ' yönteminin safkateyn yasağı, borcun borca karşılık satımı yasağı ve kabzedilmeyen malların satımı yasağı kapsamına girmediği ve şartları doğrultusunda uygulandığında fıkhî açıdan herhangi bir problem teşkil etmediği sonucuna ulaşılmıştır."
