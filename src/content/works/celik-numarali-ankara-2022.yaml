abstract: "Ankara, XVIII. yüzyılda Anadolu Eyaleti'nin bir sancağıdır. Osmanlı Devleti, XVIII. yüzyıl sonlarında Avusturya (1787-1791) ve Rusya (1787-1792) ile savaşmıştır. Bu savaşta Özi kalesi Ruslar tarafından işgal edilmiş (1788), devamında ise Kili, Akkerman, Anapa ve İsmail kalelerinin Rusya tarafından ele geçirilmiştir (1789). Aynı yıllarda Sultan I.Abdülhamid ölmüş (1789) ve yerine III. Selim tahta geçmiştir. Aynı yüzyılın sonlarında Ankara'da ayanlık olayları artmış, Ankara'da üretilen sof miktarı ülke dışından gelen baskılar sonucunda giderek azalmış, yabancı devletlere verilen kapitülasyonlar nedeniyle Osmanlı ekonomisi zayıflamaya başlamıştır. Bu ve benzeri olaylardan diğer Anadolu şehirleri gibi Ankara da olumsuz etkilenmiştir. Kadı sicilleri Osmanlı Devleti'nin taşradaki en önemli görevlisi ve padişah adına hukukun uygulayıcısı olan kadılar tarafından tutulmuşlardır. Bu siciller, Osmanlı şehir tarihine, merkez ve taşra teşkilatına, halkın sosyal ve ekonomik hayatına ışık tutacak birinci elden kaynaklar arasında yer almaktadır. 178 Numaralı Ankara Şer'ıyye Sicili 1787-1791 (H.1202-1205) yıllarını kapsamaktadır. Transkripsiyon metinden yararlanılarak Ankara'nın o yıllardaki idari, sosyo-ekonomik ve kültürel yaşamı incelenmiştir. XVIII. yüzyılın ikinci yarısında Osmanlı Devleti'nde meydana gelen olayların ve merkezi yönetimin kaza idaresine yansımaları ele alınmaya çalışılmıştır. Bu şekilde özelde Ankara şehir tarihine katkı sağlanması amaçlanmıştır."
