abstract: "İslâm dini hiçbir şekilde din, dil ve ırk gibi konularda ayrım yapmaksızın herkesin hakkının korunması gerektiğini belirtmiş ve insan haklarına son derece önem vermiştir. Sadece vuku bulan olaylara çözüm getirmemiş, aynı zamanda meydana gelebilecek olaylar içinde bir çözüm yolu bulmaya çalışmıştır. İslâm yapılan fiil sonucunda meydana gelmesi muhtemel olan olumsuz sonuçların önünü sedd-i zerâi gibi bir takım ilke veya prensipler ile engellemeye çalışmıştır. Ortaya çıkacak sonucun olumlu olması muhtemel durumda da onu feth-i zerâi ilkesi veya prensibi ile desteklemiştir. Bu çalışmada, sedd-i zerâi ilke veya prensibinin İslâm Ceza Hukuku'ndaki önemini, konumunu ve buna göre hüküm verildiğinde ne gibi hukukî sonuçların ortaya çıktığı konusu üzerinde durulmuştur. Sedd-i zerâi, Mâlikî ve Hanbelî mezhepleri tarafından delil olarak kabul edilmiş ve uygulamalarda kullanılmıştır. Hanefî mezhebi ise her ne kadar teorikte sedd-i zerâi'yi kabul etmese bile uygulamalarda istihsan kavramı adı altında kullanmıştır. Şafiî mezhebi de sedd-i zerâi'yi zayıf bir delil olarak kabul ettikleri halde onlar da bazı uygulamalarda sedd-i zerâi ile amel etmişlerdir. Zâhirî mezhebi ise sedd-i zerâi'yi reddetmektedir. Bu çalışma, giriş ve üç bölümden meydana gelmektedir. Giriş bölümünde sedd-i zerâi'nin, İslâm Hukuku'ndaki diğer deliller ile arasındaki konumu hakkında bilgi verilmeye çalışılmıştır. Birinci bölümde, sedd-i zerâi kavramı üzerinde durulmuş ve kısımları hakkında bilgi verilmiştir. Daha sonra sedd-i zerâi'nin dayandığı delillerden bahsedilip, hangi mezhepler arasında kabul edilmiş ve hangi mezheplerce reddedilmiş konusu üzerinde durulmuştur. İkinci bölümde suç ve ceza kavramı, bunlara ait prensipler, had, kısas-diyet, ta'zir suçları ve sedd-i zerâi'nin bunların içerisindeki konumu ve hukukî sonuçları üzerinden durulmuştur. Üçüncü bölümde ise cezaların amaçlarında sedd-i zerâi'nin konumu, cezaların ağırlaştırılmasında, düşürülmesinde ve ertelemesindeki rolü üzerinde durulmuştur."
