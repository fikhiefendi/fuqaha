abstract: "ÖZETKronik hepatit C (KHC) tedavisinde pegile interferonlar (PEG-İFN) klasikinterferonlara (İFN) göre yanıtta anlamlı derecede artış sağlamaktadır. Ribavarin ile kombinePEG-İFN alfa 2a veya alfa 2b tedavisi alan naive KHC'li hastalarda her iki ajanın tedavi sonuve kalıcı yanıtları karşılaştırıldı.Çalışmamıza, 2003-2006 yıllarında HCV-RNA pozitif, ALT>NÜSx1.5 olan ardışıktoplam 30 hasta alındı. Tüm hastalara tedavi öncesi karaciğer biyopsisi yapıldı ve rastgeleolarak PEG-İFN alfa 2a veya alfa 2b ve ribavirin tedavisi başlandı.Yaş ortalaması 49.4Â±10 (E/K:8/6) olan birinci gruba (n=14), PEG-İFN alfa 2a veribavirin verilirken; yaş ortalaması 49.8Â±6 (E/K:8/8) olan ikinci gruba ise (n=16) PEG-İFNalfa 2b ve ribavirin verildi. Tedavi öncesi grupların sırasıyla ortalama HAİ: 6.50Â±2.43,7.06Â±2.5 (3-15) ve evre: 2.43Â±0.9, 2.33Â±1.3 (0-3) idi. Dört hastanın tedavisi, yan etkinedeniyle 3. ayda kesildi. Tedavi sonu yanıt, 48. haftada ve kalıcı yanıt, tedavi bitiminden 6 aysonra (72. hafta) değerlendirildi. Tedavi sonu ve kalıcı yanıt grup 1 `de %85.7 iken, grup 2 `de%62.5 olarak bulundu (p>0.05). Kırksekizinci ve 72. haftanın sonunda, tüm gruptaki hastaların22'sinde HCV-RNA negatifleşirken (%73.3), 8 hastada ise HCV-RNA pozitif olarak kalmıştır(%26.7).Kronik Hepatit C tedavisinde, iki farklı pegile interferon molekülünün kalıcı viral yanıtsonuçları benzerdir.I"
