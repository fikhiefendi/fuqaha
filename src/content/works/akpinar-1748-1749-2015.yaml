abstract: "Şer'iyye Sicilleri, mahkemeye intikal eden meseleler ve kadıların verdikleri kararların kaydedildiği defterlerdir. Bu defterler, Osmanlı tarihi araştırmalarında önemli kaynakalardan biridir. Özellikle şehir tarihi çalışmalarında kıymetli bilgileri ihtiva ederler. Şer'iyye sicillerinin, şehir tarihi araştırmalarında önemli bir konuma sahip olmasından dolayı, çalışmış olduğumuz Karahisâr-ı Sâhib Şer'iyye Sicili'nde bulunan 245 adet belge transkripsiyona tabi tutularak günümüz Türkçesine çevrilmiş, ayrıca belli bir plan dâhilinde değerlendirilmiştir. Defterden, Afyonkarahisar'ın idâri ve fiziki yapısı ile ilgili olarak, belirtilen yıllarla ait, merkeze bağlı kazalar, nahiye, köy, mahalle isimleri ve dağılımı ile bazı mevki adlarını tespit etmek mümkün olmuştur. Bunun yanı sıra incelediğimiz dava kayıtlarından sosyal hayatla ilgili olarak; evlenme, boşanma, miras ve nafaka hukuku gibi toplumsal yapıya ışık tutabilecek önemli bilgilere de bir ölçüde ulaşılmıştır. Çalışma, özelde Afyonkarahisar, genelde ise Osmanlı taşra teşkilatı ve hayatına ışık tutacak, ilgili bölge ve konu ile alakalı diğer çalışmalara katkı sağlayacaktır."
