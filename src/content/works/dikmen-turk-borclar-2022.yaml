abstract: "Toplumsal yaşamın ayrılmaz bir parçası olan sözleşmeler, günümüzde sanayinin gelişmesi, ihtiyaçların artması ve üretimin serileşmesiyle birlikte daha fazla ön plana çıkmıştır. Bu gelişmelerle birlikte yeni sözleşme türleri ve bu sözleşmelerin içeriğini oluşturan yeni şartlar meydana gelmiştir. Toplumun arz talep ihtiyacını karşılamak amacıyla bireysel sözleşmeler yerini genel işlem şartlarından oluşan standart sözleşmelere bırakmıştır. Bu şartlar, birçok sözleşmede kullanılmak üzere tek taraflı olarak önceden hazırlanan ve karşı tarafla tartışılmadan oluşturulan sözleşme koşullarıdır. Bu şartların sözleşmelerde yer almasıyla birlikte sözleşmenin zayıf tarafını oluşturan tüketiciler güçsüz konuma düşürülmüştür. Bu nedenle ülkemizde TBK 20-25 maddeleri arasında genel işlem şartlarına ilişkin genel hükümler düzenlenmiştir. Sözleşmelerde yer alan bu şartlar tarafların karşılıklı rızasını ve sözleşme özgürlüğünü zedeleyerek taraflar arasında eşitlik ilkesinin bozulmasına neden olmaktadır. İslam hukuku akitlerde karşılıklı rıza ve iradeyi esas almıştır. Dolayısıyla bireyin dilediği tarzda bir akit ilişkisi kurması ve akdin muhtevasını dilediği şekilde düzenlemesi en doğal hakkıdır. Zira kimse iradesi dışında akit yapmaya zorlanamaz. Çalışmamızda hayatımızın olmazsa olmaz bir parçası haline gelen genel işlem şartlarına ilişkin düzenlemeler İslam Borçlar Hukuku ışığında değerlendirilmeye çalışılmıştır."
