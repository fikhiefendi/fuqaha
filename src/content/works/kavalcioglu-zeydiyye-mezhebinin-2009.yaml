abstract: "Zeydiyye mezhebi Zeyd b. Ali'nin Emevi halifesi Hişam'a isyanıyla başlayıp günümüze kadar devam eden bir mezheptir. Zeydiyye kelâmî mevzuların bir kısmında Mutezileye benzerken, bazı noktalarda Sünnîlere benzer. Zeydiyye Kur'ân, sünnet, icmâ ve kıyası İslam hukukunun bir kaynağı olarak kabul eder. Bu dört ana delile ek olarak cumhurun delil olarak kullandığı diğer delilleri de kullanmışlardır. İçtihad metodunu kullanarak mezheplerini geliştirmişlerdir. Fıkıh açısından cumhurdan ayrı bazı görüşleri olduğunu görüyoruz. Zeydiyye mezhebi mensupları genelde Yemen'de yaşarlar."
