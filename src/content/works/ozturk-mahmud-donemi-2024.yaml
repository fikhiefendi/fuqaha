abstract: "Osmanlı Devleti'nde, II. Mahmud'un saltanat dönemi 1808-1839 yılları arasını kapsamaktadır. Bu dönemde devletin kurumlarının çoğu eski fonksiyonunu yitirmiş, dönemin ihtiyaçlarını karşılayamaz hale gelmişti. II. Mahmud'dan önceki padişahlar döneminde, askerî alan başta olmak üzere gerekli değişiklikler yapılmak istenmiş ancak beklenen sonuç elde edilememişti. II. Mahmud şehzadeliği esnasında dönemin padişahı III. Selim tarafından yetiştirilmiş ve ıslahatların gerekliliği kendisi tarafından bizzat görülmüştü. Tahta çıktığı andan itibaren ıslahat yapmak için hazırlık yapmış ve zamanı geldiğinde gerekli ıslahatları faaliyete geçirmişti. II. Mahmud ıslahatları uygulamaya koyarken ilmiye sınıfının desteğini almak istemişti. Bu sebeple ulemânın başı olan şeyhülislâmlar ıslahatlar esnasında en büyük destekçisi olmuştu. Tezin giriş bölümünde II. Mahmud'un hayatı ve dönemindeki olaylara kısaca değinilecektir. Daha sonra şeyhülislâmlık kavramı ve kurumun tarihçesi, Osmanlı Devleti'nde şeyhülislâmlığın oluşum süreci ele alınacaktır. Şeyhülislâmların görevleri, atanmaları, azilleri gibi konulara kısaca değinilecektir. Araştırmanın birinci bölümünde II. Mahmud döneminde görev yapan şeyhülislâmlara yer verilecektir. Şeyhülislâmların hayatlarına, yaptığı görevlere ve bu görevler esnasında yaşanan önemli olaylara işaret edilecektir. İkinci bölümde ise II. Mahmud döneminde yapılan ıslahatlarda şeyhülislâmların tutumlarından bahsedilecektir. Hangi ıslahatlara fetvâlarıyla nasıl katkı sağladıkları araştırılacaktır. Sonuç itibarıyla bu çalışmada hem II. Mahmud dönemi şeyhülislâmlarının biyografileri etraflıca ele alınacak hemde onların ıslahatlara katkıları tespit edilecektir."
