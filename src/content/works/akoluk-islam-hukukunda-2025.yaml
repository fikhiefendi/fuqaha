abstract: "Bu çalışma, İslam hukukunda sağlık kavramının evlilik kurumundaki yerini, evlenmeye engel olabilecek hastalıkları ve tıbbî muayenenin dini ve hukuki çerçevede ele alınışını incelemektedir. Bu araştırma da Kur'ân-ı Kerîm, hadis, fıkıh külliyatı ve çağdaş literatür karşılaştırmalı olarak incelenmiştir. Erkekteki hastalık veya kusur sebebiyle kadının boşanma talebi hakkı (Y. Lisans Tezi/ 2017), İslam Hukuku'nda ve Medeni Hukuk'ta evlenme engelleri (Y. Lisans Tezi/ 2008), İslam Hukuku'nda hısımlık ve oluşturduğu evlenme engeli (Y. Lisans Tezi) gibi tez çalışmalarının olduğunu, yapılmış olan çalışmalarda günümüzde de var olan hastalıkların değerlendirilmediği, evlenme engeli oluşturan hastalıkların tek cins açısından ele alındığı, bulaşıcı hastalıkların ve tıbbî muayene alanında çalışmaların yapılmadığı tespit edilmiştir. Maslahat ve neslin muhafazası prensipleri öncelenerek bulaşıcı hastalığı olan kişilerin tedavi edildikten sonra evlilik akdi gerçekleştirmesi gerektiği, cinsi münasebeti engelleyecek hastalığı bulunan eşlere talak hakkı verildiği sonucuna ulaşılmıştır."
