abstract: "“İslam Hukukunda İhtisar Geleneği”adlı bu çalışma bir giriş ve iki bölümden oluşmaktadır. Giriş kısmında; araştırmanın konusu, önemi, yöntemi, amacı ve kaynaklarıyla ilgili bilgiler yer almaktadır. Birinci bölümde ihtisar ve muhtasarla ilgili tanımlar yapılmış olup bu eserlerin mahiyetine, telif edilme sebeplerine, gayelerine, özelliklerine, olumlu ve olumsuz manada tenkit edildiği yönlerine ve bu eserlerle ilgili görüşlere yer verilmiştir. Ayrıca bu bölümde fetva ve unsurları zikredilerek muhtasar eserlerden fetva vermenin hükmü tartışılıp tercih belirtilmiştir. Yine bu bölümde muhtasar eserlerin ilişkili olduğu, metin, mülehhas kavramlarına da değinilmiştir. Daha sonra muhtasar eserler üzerine yapılan çalışmalardan olan şerh, haşiye, talik, zeyl gibi kavramlar açıklanmıştır. İkinci bölümde ise Hanefi, Maliki, Şafiî ve Hanbelî mezheplerine ait muhtasar eserler müellifleriyle birlikte verilerek bahsi geçen mezheplerden birer tane eser teferruatlı bir şekilde tanıtılıp, üzerine yapılan şerh haşiye gibi çalışmalara ayrıca yer verilmiştir."
