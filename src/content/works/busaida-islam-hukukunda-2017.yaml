abstract: "Bu araştırma satın alma niyetiyle bir malı alıp kontrol eden kişinin kabz ettiği bu maldaki tazmin sorumluluğunu ele almaktadır.Mukaddime bölümünde araştırmanın konusu, ehemmiyeti, konu seçiminin sebebi, konunun sınırları, bu konuda daha önce yapılan çalışmalar, konunun proje, plan ve tanıtım bölümünü ihtiva etmektedir. Girişte çalışma ile alakalı kullanılan lafız ve önemli ıstılahları ele aldım Birinci bölümde; kabz kavramı, tesir çeşit ve manası ile ilgilidir. İkinci bölümde; pazarlıklı satışın tanımı, hikmeti ve konuyla ilgili âlimlerin görüşleri ile ilgilidir. Üçüncü bölümde; pazarlığı yapılan malın kabzedilmesiyle telef ve helak olma durumunda kabzın tazminin esası olması nedeniyle tazmin hükümleri ile ilgilidir. Sonuç bölümünde ise ulaşılan sonuçları zikrettim Pazarlığı yapılan malın kabzedilmesinin dinen caiz olması, müşterinin yanında helak olması durumunda kıymetinin tazmin edilmesi ve müşterinin helak etmesi durumunda ödemesinin tazmin edilmesi bu sonuçlardandır. Anahtar Kelime; Kabz, Sevm-i Şirâ, Tazmin, Sevm-i Nazar, Helâk."
