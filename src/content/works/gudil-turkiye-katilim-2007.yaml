abstract: "Mevduat sahiplerine sabit getiri garanti eden klasik bankaların tersine ?kâr-zarar ortaklıgı? usulü ile tasarrufları reel ekonomiye kanalize etme, faiz yerine, elde edilen getiriden pay dagıtma yöntemlerini benimseyen kalkınma bankaları, bu bankaların isleyisi, mali sitemdeki payları, yatırımcıya sagladıkları getirinin piyasa ile karsılastırılması bu tezde ele alınan konulardır. Bakanlar Kurulu tarafından 1983 yılında yayımlanan kararname ile Türk Hukuk Sisteminde yerini alan Özel Finans Kurumlarının tabi oldugu yasal statüyü üç kısımda incelemek mümkündür. Birincisi Özel Finans Kurumları 1983-1999 yılları arasındaki 15 yıllık süreçte Merkez Bankasının tebligleri ile yönetilmislerdir. Bu asamada herhangi bir yasal dayanakları yoktur. kinci asamada 1999 yılı sonunda çıkan Bankalar Yasası ile Özel Finans Kurumları gerekli yasal dayanaga kavusmuslardır. Son asamada ise 2005 yılı Kasım ayındaki düzenleme ile de Özel Finans Kurumları ?Katılım Bankaları? adını almıslardır. Bu degisikligin temelinde uluslar arası camiada tanınırlıgı artırmak yatmaktadır. Bu durum sadece isim degisikligi olup, faizden uzak durma hususu ile kâr ve zarara katılma hususlarında bir degisiklik vuku bulmamıstır. Katılım Bankaları faizden kaçındıkları için tasarruflarını faizli bankalara yatırmayan kimseler ile, faizin agır yükü dolayısıyla yatırımdan kaçınan sahısları karsılastırıp, emek ve sermayeyi bulusturan kurumlar olmuslardır. Katılım bankaları sadece faizden uzak duran kesimlere hitap etmeyip, faizli bankaların sundukları faizsiz enstrümanları da bünyelerinde barındırmaktadırlar. Cari hesaplarda ve katılma hesaplarında muhafaza ettikleri mevduatı kâr-zarara katılma hesabı adı altında reel ekonomiye enjekte eden bu kurumlar, bünyelerinde çalısmakta olan uzmanlar sayesinde, getirisi yüksek alanlara yatırım yapmakta, dolayısıyla faiz oranı seviyesinde veya faiz oranı seviyesine yakın kâr payı oranının olusmasına imkân saglamaktadırlar. Tasarruflarını iddihar biçiminde tutmak veya hazine bonosu gibi sabit getirili, reel ekonomiye katkısı olmayacak sekilde tutmak yerine, tasarrufları direkt olarak reel ekonomiye yönelten katılım bankaları sube ve personel sayısını arttırarak büyümeye devam etmektedirler. Bu yüksek lisans tezinde ülkemizde 1983 yılından beri faaliyet gösteren Özel Finans Kurumlarının (Katılım Bankalarının) kurulus asamaları, fonksiyonları, ülkemizde faaliyette bulunan katılım bankaları, katılım bankalarının diger bankalar ile karsılastırmaları incelenmis ve son bölümde kâr payı getirilerinin faiz getirileri ve MKB getirileri ile karsılastırmaları Treynor, Sharpe ve CAPM yöntemleriyle analiz edilmis ve yatırımcıların yatırımları sonucu elde edecekleri getiriler kıyaslanarak yatırımcıların getiriler hakkında bilgi sahibi olması amaçlanmıstır. Treynor, Sharpe ve CAPM yöntemleri sadece faiz, kâr payı ve MKB getirilerinin veriminin karsılastırılması amacıyla kullanılmıstır. Son üç yılda dagıtılan kâr payı oranlarını temin etmenin zorlugu karsısında finans kurumlarınca dagıtılan kâr payı oranlarının birbirine çok yakın olması gerekçe gösterilerek Türkiye Finans Kurumu verileri üzerinden islem yapılmıstır. Yapılan analizler sonucu faiz getirisinin her üç yönteme göre kâr payı getirisinden fazla oldugu tespit edilmistir. Yine her üç yönteme göre de kâr payı getirisi MKB getirisinden fazla bulunmustur. Analizlerde çesitlendirmenin az olması nedeniyle Treynor yöntemi; piyasanın etkin olmayısı (Tam Rekabet Piyasası olmayısı) sebebiyle de CAPM analizi güvenilir bulunmamıstır. Sharpe yöntemi daha az sayıda çesitlenmis portföylerde kullanıldıgı için analiz sonuçları güvenilirlik açısından daha uygun bulunmustur."
