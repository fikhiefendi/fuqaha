abstract: "Giriş ve iki ana bölümden oluşan çalışmamız İslâm hukuku açısından kadının özel günlerinin mahiyeti ve hükümleri hakkında bilgi vermektedir. Girişte konunun önemi vurgulanmış, sınırlılıkları, kaynakların sunumu ve değerlendirilmesine yer verilmiştir. Birinci bölümde âdetin başlama ve bitiş zamanı, âdet kanının renkleri, âdet dönemi gibi kadının özel günlerinin mahiyeti hakkında bilgiler verilmiştir. Hayız halinin fıkıh ve tıbbî mahiyeti ortaya konulmuş, ikisi arasındaki farklar ve benzerlikler vurgulanmıştır. İkinci bölümde namaz kılma, oruç tutma, tavaf yapma, Mushaf'a dokunma, Kur'ân Kur'ân okuma, mescide girme ve cinsel ilişki fiillerine hayızın etkisi konusundaki geçmiş ve günümüzdeki görüşler delilleriyle ele alınmıştır. Konuyla ilgili geçmişteki ve günümüzdeki görüşler belirtilmiş ve güncel değerlendirmelere yer verilmiştir. Sonuç bölümünde ise hayızın kadının dini yaşamına etki ettiği alanlar belirtilmiştir."
