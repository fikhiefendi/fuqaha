abstract: "Bu çalışma İslam hukukunun teşekkül döneminde yaşayan Ebû Hanîfe'nin İbrahim en-Nehaî'den hocası Hammad aracılığı ile aldığı bilgi birikimi ve bu birikime yaptığı katkıları araştırılması amaçlamıştır. Çalışma bir giriş, beş bölüm ve sonuç kısımlarından oluşmaktadır. Giriş bölümünde tezin amacı, metodu ve kaynakları hakkında bilgi verilmiştir. Birinci bölümde Nehaî ve Ebû Hanîfe'nin kısaca hayatları, ilmi kişilikleri ve yetiştikleri çevre araştırılmıştır. İkinci bölümde iki müctehidin fıkhını oluştururken takip ettikleri metodoloji mukayeseli olarak incelenmiştir. Tezin üçüncü, dördüncü ve beşinci bölümleri ise tezin asıl ve ağırlıklı kısmını oluşturmaktadır. Üçüncü bölümde İbadetler alanına giren; temizlik, namaz, oruç, zekât, hac, kurban, yeminlerle ilgili iki müctehidin ortaya koyduğu farklı görüşleri mukayese edilmiştir. Dördüncü bölümde ise İslam Hukuku'nun özel hukuk alanına ait; kişiler, aile, miras, borçlar ve eşya hukukuyla ilgili iki müctehidin görüşleri mukayeseli olarak ele alınmıştır. Tezin son bölümünde kamu hukuku alanına giren; ceza ve yargılama hukukuyla ilgili iki müctehidin görüşleri mukayese edilip analiz edilmiştir. Bunu yaparken mümkün olduğunca aslî kaynaklara ulaşmaya gayret edilmiştir. Ayrıca üçüncü, dördüncü ve beşinci bölümlerin başlıkları oluşturulurken birbirine yakın konular aynı yerde işleyerek klasik fıkıh kitaplarından biraz daha farklı bir yöntem takip edilmiştir. Sonuç kısmında ise tezde elde edilen genel yargılar ifade etmeye çalışılmıştır."
