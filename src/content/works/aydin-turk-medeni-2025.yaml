abstract: "TÜRK MEDENİ HUKUKU'NDA YIKIM (KÂL) İSTEMİ Mülkiyet hakkı, malikine hukuk düzeni sınırları içerisinde, eşya üzerinde istediği gibi kullanma, yararlanma ve tasarrufta bulunma yetkisi tanır. Eşya üzerindeki hâkimiyetin üçüncü kişilere karşı korunmasını sağlamak da malikin yetkileri arasındadır. Mülkiyet hakkına yönelik müdahalelere katlanma yükümlülüğü yoksa bunun önlenmesi, durdurulması varsa zararın karşılanması istenebilir. Bu kapsamda haksız yapı veya bitki ya da taşkın yapı gibi hâllerde yıkım (kâl) istemi ileri sürülebilir. Yıkım (kâl) istemi, uygulamada sıkça görüldüğü üzere elatmanın önlenmesi istemi ile birlikte ileri sürülür. Ancak yıkım (kâl) isteminde bazı şartlar aranır. Bu nedenle bu istem, ayrı bir inceleme ve değerlendirmeyi gerektirir. Buna karşın yıkım (kâl) istemi elatmanın önlenmesi isteminin yanında değinilen ikincil bir konu olmaktan öteye geçememiştir. Zengin ve çeşitli uyuşmazlıklara konu olan söz konusu istem hakkında ayrı ve bağımsız bir çalışma olmaması, bu konuda birçok sorunu da beraberinde getirmiştir. Dolayısıyla bu çalışmada doktrindeki tartışmalar ve yüksek mahkeme içtihatları birlikte ele alınarak ortaya çıkan sorunlara çözüm üretilmesi ve bilime katkı sağlanması amaçlanmıştır. Çalışma kapsamında yıkım (kâl) isteminin tanımı, amacı, tarihî gelişimi, hukukî niteliği ve benzer istemlerden farkı açıklanmıştır. Bu isteme yol açan hâller ve istemin şartları, haksız yapı, haksız bitki ve taşkın yapı yönlerinden ayrı ayrı incelenmiştir. Yıkım (kâl) isteminin hüküm ve sonuçları bölümünde ise yıkım (kâl) davası, yıkım (kâl) isteminin elatmanın önlenmesi istemiyle birlikte ileri sürülmesi hâlinde her iki istem arasında öne çıkan farklar ve hükmün icrası ele alınmıştır."
