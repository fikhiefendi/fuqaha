abstract: "Kadınlar için güzellik, asırlar boyu önem arz etmiştir. Bu sebeple kadınların bizzat kendileri ve her türlü güzellikleri fıkıh literatüründe zînet olarak nitelendirilmiştir. Kadınların güzelliklerinin meta olarak sunulduğu şu günlerde onların zînetlerine dair tüm konuların hem İslam hukukundaki durumunun hem de modern hukuktaki durumunun incelenmesi önem arz etmektedir. Fıkıh kaynaklarında zînet konusunun kapsamı ve günümüzde zînet olarak değerlendirilebilecek unsur ve uygulamaların neler olduğu ve bunların İslam hukukundaki ve modern hukuktaki durumlarının mukayese edilerek incelenmesi bu tezin konusunu oluşturmaktadır. İslam hukukunda kadınların bedeni güzellikleri, giyim-kuşamı ve güzelleşmek üzere yaptıkları her türlü uygulama, zînet olarak görülmüş ve kadınların yaratılışı itibariyle bunlara meyletmesi belirli şartlarla mubah kabul edilmiştir. Ancak insan bedenine yapılan müdahaleler Allah hakkı olan tasarruflar içerisinde görülüp tedavi gibi zaruri gerekçeler olmaksızın bu uygulamaların yapılmasının mekruh ya da haram kabul edildiği anlaşılmıştır. Modern hukukta ise fıkıhta zînet konusu içine giren her mevzunun şahıs hakları, borçlar hukuku ve tıp hukuku içerisinde ele alınıp tartışıldığı görülmüştür."
