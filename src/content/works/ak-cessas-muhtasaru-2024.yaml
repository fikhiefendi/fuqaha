abstract: "Bu çalışmada Şerḥu Muḫtaṣari'ṭ-Ṭaḥâvi ile Şerḥu Muḫtaṣari'l-Kerḫî adlı eserlerin şerh yönteminin mukayesesi amaçlanmıştır. Giriş ve sonuç kısımları dışında iki bölümden oluşan bu çalışmanın birinci bölümünde Hanefî mezhebinde müşahede edilen telif türleri ile Cessâs ve Kudûrî'nin hayatları incelenmiştir. İkinci bölümde ise söz konusu şerhler ibadetler bölümü özelinde dil ve üslup, şer'î deliller, ilim dallarıyla ilişki ve muhtevaya katkı bakımından mukayese edilmiştir. Çalışmada doküman analizi ve karşılaştırma yöntemleri kullanılmıştır. Mukayese neticesinde Cessâs'ın mezhep içi ihtilaflarda genelde Ebû Hanîfe'nin görüşünü tercih edip delillendirdiği, İmam Şafiî'nin iddia ve itirazlarına sık sık cevap verdiği, iddia ve eleştirilere fenḳâle yöntemiyle ele alıp değerlendirdiği ve şerhin cedel yönü baskın bir eser olduğu tespit edilmiştir. Kudûrî'nin ise şerhinde memzûc yöntemi benimsediği, eserini telif ederken Cessâs'ın şerhinden istifade ettiği, ibâdât bahislerinde muhtasar metne katkısının diğer kısımlara nazaran daha fazla olduğu ve şerhin mukayeseli fıkıh eseri niteliği taşıdığı tespit edilmiştir. Şerhler arasında benzer yönler bulunmakla birlikte telif amacı, temellendirme, muhtevaya katkı ve üslup bakımından özgünlük arz ettikleri sonucuna ulaşılmıştır."
