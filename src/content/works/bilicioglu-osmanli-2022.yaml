abstract: "Klasik dönemde şer'i mahkemelerin denetimi altında sürdürülen mali işlemler, Ferman'dan yaklaşık yüz yıl sonra pür laik mevzuatla işler hale geldi. İstikraz davalarının şer'i sistemden kopması müstakil borçlar hukukunun ana zeminini oluşturdu. Bu, hukuk mekanizmasının pek çok fıkhi ilkeyi terk etmesi ya da yeniden yorumlaması anlamına geliyordu. Klasik hukuk Hanefi fıkhını esas aldığı için riba yasağı mahkemelerin günlük pratiklerine titizlikle yansıtılıyordu. Akit teorisi riba yasağı merkeze alınarak kurgulanmıştı. Riba başkasının malını karşılıksız sahiplenme anlamına gelen peşin ve vadeli işlemlerin gayr-ı meşru sonucu olarak tanımlanıyordu. Modernleşme döneminde Batı'dan ithal edilen faiz teorisi hukukun her katmanına giderek yayıldı. TK net bir faiz tanımı yapmadığı halde, zamanında tahsil edilemeyen alacaklar veya mal üzerinde usulsüz yetki kullanımı gibi sebeplerle oluşan zararları tazmin için faizi önerdi, hukuk mekanizmasında radikal bir savrulmaya neden oldu. On yıl sonra TK'nın zeyli faizi parasal alacakların standart tazmin unsuru olarak ilan etti, bileşik olsa bile belirli şartları taşıyan faiz mukavelelerini onayladı. TK'dan sonra mali hukuku düzenleyen mevzuat TK ile uyumlu ve onu tamamlayıcı hükümler getirmek zorunda kaldı. Murabaha Nizamnameleri, Mecelle, usul kanunları, banka teşkilat nizamnameleri, muhtelif kredi sandıklarına ait metinler TK gölgesinde tanzim edildi. Meşihat kontrolünde teşkilatlanan Evkaf Bankası ile Eytam Sandıkları dahi faizin hukuka yerleşmesinden nasibini aldı. Devr-i şer'i geleneksel kurumlarda her zaman kredi işlemlerinin standart prosedürü olarak kaldı, fakat günün sonunda tahsilat prosedürleri standart bankalarla benzeşti. Bütün bu gelişmeler yaşanırken fâizin ribadan sayılmamasını vurgulayan yazılar basında yer almaya başladı. Bugün hala toplumun bir kesimi modern banka ve faizli uygulamaların meşruiyetine kanidir. Faiz ile ribayı birbirinden ayrıştıran günümüz söylemleriyle modernleşme dönemi yazıları aynı damardan beslenmekte. Faiz sırf bir fetva sorunu gibi algılanmasına rağmen gerçekte kanunlarla Müslüman toplumun günlük ilişkilerine yerleşen bir hukuk sorunudur. Bu çalışma faizin modernleşme dönemi öyküsünü kanun metinleri, iktisat, hukuk ders kitapları, karar meclislerine ait mazbatalar, Mecelle şerhleri ve kredi kurumlarını düzenleyen metinler üzerinden takip etmekte, Müslüman toplumun riba algısında yaşanan kırılmayı fıkhi bir bakış açısı ile, fakat bir hukuk tarihi meselesi olarak incelemektedir. Anahtar Kelimeler: Osmanlı borçlar hukuku, ticaret kanunu, borç, faiz, riba, Mecelle, banka, murabaha, Meşihat."
