abstract: "Tezde Muhammed Tâhir'in el-Avâidü's-Sünbülüyye ala'-Favâidi'ş- Şenşûriyye isimli eserinin başından dede ve kardeşler bölümüne kadar olan kısmı tahkik ve tahlil edilecektir. Tezimizin konusunu oluşturan el-Fevâidu'ş-Şensûriyye isimli mahtût eser, imam Abdullah b. Muhammed eş-Şenşûrî'nin (ö. 999) el- Manzûmatu'r-rahbiyye isimli eserinin şerhidir. Eserin kıymeti, İslâm fıkhının en önemli konularından olan ferâiz meselelerini ele almasından ileri gelmektedir. Bu eser Hanefi mezhebi merkezli, feraîz konularıyla ilgili büyük bir karşılaştırmalı fıkıh ansiklopedisi olarak tarif edilebilir. Müellif eserinde mezhep içi ve dışı garib, nadir ve ihtilaflı konuları ele almıştır. Dört mezhebin görüşleri yanında lügavî ve ıstılâhî tarif ve açıklamalara yer verilmiştir. Eser konusuyla ilgili faydalı bilgiler ihtiva etmektedir. Muhammed Tâhir Sünbül'ün biyografisi ve yaşadığı dönem ele alınırken betimleyici tarihi metot kullanılmıştır. Kitabın yazılması, harekelenmesi, nüshaların karşılaştırılması, farklılıkların tespiti, kitaptaki görüşlerin kaynaklarının gösterilmesi hususunda ise tahkik ve talik metodu kullanılmıştır. Araştırmada şu sonuçlara ulaşılmıştır: Müellif, veraset ilişkilerini her öğrencinin kolaylıkla anlayacağı basitlikte açıklamıştır. Kitab, istifadeyi kolaylaştıracak şekilde basit tarzda kısım ve bölümlere ayrılmıştır. Eser dört mezhep imamı ve diğer fakihlerin görüşleriyle istidlâl ve istişhâd hususunda da uslübunun güzelliği ile tanınır. Onun bu yaptıkları ilmi şahsiyetinin eşsizliği ve bilgisinin genişliğine delalet etmektedir. Diğer görüşleri naklederken objektif olması da eserin bir başka özelliğidir. Kendi mezhebine muhalif mezhep görüşlerini aktarırken dahi objektif bir tavır sergilemiş, kibar ve ilmi bir uslupla konuyu aktarmış, sonunda kendi mezhebinin görüşünü ifade etmiştir. Tercihlerini ise delile veya ictihadına göre yapmıştır. Müellif, miras konularıyla ilgili fıkıh, hukuk ve şeriat tabiplerinin istifade edeceği bol bir ilmi miras bırakmıştır."
