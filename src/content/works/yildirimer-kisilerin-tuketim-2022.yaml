abstract: "Bu çalışmanın amacı, bireylerin tüketim davranışlarında İslami Finansal Okuryazarlığın herhangi bir etkisinin bulunup bulunmadığının ölçülmesidir. Bunun için üniversite ayrımı yapılmaksızın lisans, yüksek lisans veya doktora sürecinde olan toplamda 403 öğrenci üzerinde online ortamda anket çalışması yapılmış ve elde edilen veriler SPSS programı ile analiz edilmiştir. Elde edilen bulgulara göre; İslami Finans alanında ders, konferans veya bir etkinliğe katılmış olan bireyler İslami Finansal Okuryazarlık açısından herhangi bir etkinliğe katılmamış olanlara kıyasla farklılaşmaktadır. Bunun yanında bireylerin okudukları bölüm ile İslami Finansal Okuryazarlık seviyeleri arasındaki ilişki analiz edildiğinde akademik çalışmalarını İslami Finans/ Katılım Bankacılığı alanında ilerleten bireylerin İslami Finansal Okuryazarlık seviyesinin diğer bölümlerde eğitim gören bireylere kıyasla oldukça yüksek olduğu görülmüştür. Son olarak bireylerin tüketim davranışları ile İslami Finansal Okuryazarlık seviyeleri arasında herhangi bir ilişki bulunup bulunmadığına dair yapılan analiz sonuçlarına göre; bireylerin İslami Finansal Okuryazarlık seviyeleri ile tüketim davranışları açısından herhangi pozitif ve anlamlı bir ilişki bulunmadığı gözlemlenmiştir."
