abstract: "Modernizm ile beraber gelişen hukuki pozitivizm akımı doğrultusunda hukuk teorilerinin içinde ahlak öncüllü ilkeler ve adalet kavramı önemini yitirmiştir. Katı hukuki pozitivizimin hukuk aleminde yarattığı bu boşluk sonucunda kanunlar ve hukuk sistemleri adaleti sağlamaktan uzaklaşmıştır. Bunun sonucunda günümüzde farklı teorilere bakıldığında, etik değeri temel alan ahlak öncüllü ilkelerin tekrar önem kazandığı görülmektedir. Söz konusu teoriler hem hukuk yapımında hem de yargılama aşamasında ilkelerin önemine vurgu yapmışlardır. Bu bağlamda ilkeler, kanunu yorumlarken ve yargılama sırasında adaletin gerçekleşmesi için araç niteliğindedir. Günümüzde AİHM'in uygulamasına ve Anglo Sakson hukuk geleneğine bakıldığında bu anlayışın hakim olduğu görülmektedir. Bu anlayış ise geleneksel Türk hukuk zihniyeti – özellikle de Osmanlı hukuk sistemi – ile paralellikler arz etmektedir. Osmanlı devleti adaletle hükmetme geleneğini yansıtırken, hukuk sistemi de adalet kavramı üzerine şekillenmiştir. Bu bağlamda hem kuralların yorumlanmasında hem de yargılama aşamasında temel değer olan adaleti sağlamak adına günümüzdeki hukuk kuramlarında ve insan haklarını koruyacak belgelerde yer alan ilkelere benzer ilkeler geleneksel Türk hukuk zihniyetinde kendine yer bulmuştur."
