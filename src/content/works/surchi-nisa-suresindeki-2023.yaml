abstract: "Bu çalışma Nisâ Sûresindeki ahkâm ayetlerini ele almaktadır. Araştırma bir giriş ve üç bölümden oluşmaktadır. Birinci bölümde surenin adı, ayetlerinin sayısı, fazileti ve nûzulü ele alınmaktadır. Ayrıca girişte genel olarak Kur'an'daki ahkam ayetlerinin sayısı, bu konudaki ihtilafların sebepleri ve ahkam âyetleri ile ilgili en önemli kitaplar tanıtılmaktadır, Birinci bölümde altı başlık ve yirmi dört alt başlıkta surenin başındaki onaltı âyet ele alınmaktadır. Her bir alt başlık şer'î bir hükmü ve tefsirlerde bu hükümle ilgili ihtilafları incelemektedir İkinci Bölüm altı başlıkta on dokuz ayeti incelemektedir. Bu bölümde eme'nin (cariyenin) evlendirilme şartları ve (zina) yapması halinde ona uygulanacak had cezası , başkasının malını yemenin ve başkasını öldürmenin haram oluşu, ayette zikredilen üç yöntemle eşler arasındaki sorunları hal etme keyfiyeti, Allah'ın iyiliğe karşı iyilikte bulunmayı emretmesi, teyemmüm, mubah kılan sebepler ve teyemmüm edilen topraktan (saîd( ne kastedilği gibi konular üzerinde durulmaktadır. Üçüncü Bölümde ise sekiz ayet altı başlıkta ele alınmaktadır. Bu bölümde Allah'a ve Resulün'e itaatin gerekli olduğu, öldürme suçu, namazın kısaltılması, bunun hükmü, kısaltabilmenin mesafesini ve kısaltmanın caiz olduğu yolculuk türü, akrabaların birbirlerine şahitlikleri, 'kelâle' (çocukları ile birlikte annesi veya babası yahut her ikisi olmadan ölen kişi) ve kelâlenin mirasının keyfiyeti ele alınmaktadır."
