abstract: "Bu çalışmada İbn Rüşd'ün Bidâyetü'l-müctehid ve nihâyetül'-muktesıd adlı eserinin aile hukuku bölümünde mezhebi olan Maliki mezhebinin görüşlerine muhalefet ettiği tercihleri ele alınmıştır. Fakihlerin görüşlerini delilleri ile birlikte aktarmak ve deliller arasında karşılaştırmalar yapıp İbn Rüşd'ün tercihini ifade etmek suretiyle karşılaştırmalı olarak çalışılmıştır. Çalışma, bir giriş, iki bölüm ve bir sonuçtan müteşekkildir. Giriş bölümünde, İbn Rüşd'ün hayatı, müslüman âlimler arasındaki yeri ve eserleri ele alınmıştır. Birinci bölümde nikâh ile alakalı konuları ele alıp İbn Rüşd'ün Maliki mezhebi dışındaki tercihlerine yer verilmiştir. İkinci bölümde talâk, li'ân ve îlâ gibi konular inceleyip, İbn Rüşd'ün Maliki mezhebine muhalefet ettiği hususlar ele alınmıştır. Sonuç bölümünde ise araştırma süresince ulaşılan en önemli sonuçlar aktarılmıştır."
