abstract: "Geçmişten günümüze İran halkları, bulundukları coğrafya için oldukça önemli bir konumda durmayı başarmışlardır. Onlar için kritik öneme sahip bazı zaman dilimleri vardır ki bu yıllar ülkenin geleceğini şekillendirmiştir. Safevî Devleti bu zaman dilimlerinin belki de en önemli eşiğini oluşturmaktadır. Çünkü Safevî Devleti'nin kuruluş aşamasında karşılaştığı sorunlar ve bu sorunlara yönelik uygulamak istediği politikaların bilinmesi bugün dahi birçok sorunun çözülmesine sebep olacaktır. Böylelikle ilk bölümde, Safevî Devleti'nin İsnaaşeri Şiîliğini kabul sürecinde kendi toprakları dışından getirip yazdıkları eserlerden ve fikirlerinden oldukça faydalandığı muhâcir ulemânın burada ne tür bir işleve sahip olduğunu incelemeye çalışmak ve özelde Kereki'nin buradaki konumu mümkün oldukça ortaya çıkarmak temel hedefimiz olmuştur. Ali el-Kereki'nin hayatı, hocaları ve eserlerini incelediğimiz ikinci bölümde, yetiştiği ortam ve ilim seyahatleri hakkında değerlendirmelerde bulunarak fikirlerinin oluşum sürecinin ipuçlarını aradık. Ayrıca gaybet düşüncesiyle bağlantılı bir şekilde durumu ele almaya çalıştık. Çünkü Şiî fıkhının oluşum süreci içerisinde mütekellimler tarafından bina edilen bu fıkhın temeline gaybet düşüncesi tüm ağırlığıyla oturmuştur. Şiî mütekellimlerin her bir fikrine neredeyse müdahele eden bu anlayış, oluşma sürecinden gelişme sürecine kadar birçok yoruma muhatap olmuştur. Ali el-Kerekî'nin fikirlerinin oluşum aşamasında Usûlî-Ahbâri ayrışmasının da incelenmesi gereken ayrı bir konu olarak ele alınması gereğini düşündük. Farklılıkları hakkında çok detaya inmeden yüzeysel bir şekilde inceleyerek durumun ayrışma yönlerine dikkat çekmeye çalıştık. Çünkü ayrışma noktalarını anlamak Kerekî ve Kerekî gibi düşünen ulemânın daha anlaşılır olmasında sağlayacaktır. Üçüncü bölümde Ali el-Kereki'nin fikirleri üzerine yoğunlaştık. Şu bir geçektir ki İsnaaşeriyye fıkhında ahbâr anlayıştan gelen gaybet anlayışı fıkhı durağanlaştırmıştı. Zamanla Usûlî ulemânın çabasıyla temel kaynaklarda akli istidlâl metodları kullanılarak bu durum aşılmaya çalışılmıştır. Safevîler döneminde Usûlî anlayışın devlet gücünüde bir şekilde yanında hissetmesi durumu dahada kolaylaştırmış gözükmektedir. Ali el-Kerekî, bu gücün farkında olarak onu kullanmayı bilmesi, geleceğin fakih-sultan ilişkilerine yeni bir boyut kazandırmıştır. Eserlerinde ve verdiği fetvalarla Şiî fakihlerine ayrıcalıklı bir konum oluşturmuştur. Özellikle Cuma namazı, haraç ve İmamın nâibliği konusunda fakihe yüklediği misyon onun konumunu her zamankinden daha çok güçlendirmiştir."
