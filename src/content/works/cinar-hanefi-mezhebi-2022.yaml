abstract: "Bu çalışma, İslâm hukukunda borcun bir başkası üzerine naklini sağlayan havâle sözleşmesini konu edinmektedir. Bu bağlamda, öncelikle Hanefî mezhebi özelinde havâle sözleşmesinin üzerine binâ edildiği teorik altyapı incelenmiş, sözleşmenin genel özellikleri, kuruluşu, sona ermesi, hüküm ve sonuçları günümüz hukuk sistematiği kullanılarak aktarılmıştır. Akabinde, bu teorik altyapının pratiğe yansıması Osmanlı uygulaması ışığında ele alınmıştır. Çalışmada temel olarak Hanefî mezhebine göre yazılmış klasik fıkıh kitaplarından, Osmanlı döneminde kaleme alınmış fetvâ mecmûalarından, İstanbul kadı sicillerinden ve Osmanlı döneminde yürürlüğe koyulmuş bazı hukukî düzenlemelerden yararlanılmıştır. Bu kaynaklardan hareketle, Hanefî fukahâsının havâle sözleşmesine ilişkin olarak ortaya koyduğu esaslar ve üzerinde ihtilâf edilen hususlar tespit edilmiş, Osmanlı uygulamasında bu esasların ne derece uygulandığı ve ihtilâflı hususlarda hangi görüşün tercih edildiği sorularına cevap aranmıştır. Yapılan çalışma sonucunda İslâm hukukunda borcun naklini sağlayan havâle sözleşmesinin tutarlı bir bütün oluşturacak şekilde tesis edildiği ve İstanbul özelinde Osmanlı uygulamasının çok büyük ölçüde bu bütüne uygun ve riâyetkâr olduğu sonucuna varılmıştır."
