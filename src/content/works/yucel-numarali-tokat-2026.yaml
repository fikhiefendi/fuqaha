abstract: "Bu tez çalışmasında, 1796 (H. 1210) tarihli 2 Numaralı Tokat Şer'iyye Sicili'nin 1–75. varakları arasında yer alan kayıtlar günümüz Türkçesine aktarılmıştır. İncelenen belgeler, dönemin Tokat şehrinin idarî, sosyal ve ekonomik yapısını ortaya koyan birincil kaynak niteliğindeki veriler olarak değerlendirilmiştir. Şer'iyye sicilleri, Osmanlı şehirlerinin toplumsal ilişkileri, idarî işleyişi, ekonomik yapısı ve hukukî uygulamalarına dair doğrudan ve güvenilir bilgiler sunan temel arşiv malzemeleri arasında yer almaktadır. Bu bağlamda çalışma, yalnızca ilgili defterin transkripsiyonunu yapmakla sınırlı olmayıp, metinlerde yer alan kayıtlar üzerinden dönemin yapısal özelliklerine ilişkin değerlendirmeleri de içermektedir. Çalışma üç bölümden oluşmaktadır. Giriş bölümde şer'iyye sicillerinin tanımı, kapsamı, içeriği ve yöntemi ele alınmıştır; bu defterlerin tarihsel önemi, günümüzde nasıl korunduğu ve araştırmacılar için erişim olanakları hakkında bilgi verilmiştir. Ayrıca mevcut literatür incelenerek daha önce yapılmış çalışmalar değerlendirilmiş ve bu tezin literatürdeki yeri ortaya konmuştur. Birinci bölümde, 2 Numaralı Tokat Şer'iye Sicili'ndeki belgeler konularına göre sınıflandırılmıştır. Belgelerin türleri (hukukî davalar, alım-satım işlemleri, vergi kayıtları, idarî atamalar, miras paylaşımı gibi) dikkate alınarak her belge tipi, içerdiği bilgilerle dönemin sosyal ve ekonomik hayatına katkısı açısından değerlendirilmiştir. Böylece hem defterin genel yapısı anlaşılmış hem de dönemin toplumsal ve idarî sorunlarına ışık tutulmuştur. Transkripsiyon metnine de birinci bölümde yer verilmiştir. İkinci bölümde, Tokat'ın coğrafi konumu çevrilen kayıtlar üzerinden 1796 yılı Tokat'ının idarî yapısına dair yorumlar yapılmıştır. Üçünce bölümde ise Tokat'ın sosyo kültürel, ekonomik ve aile yapısına yer verilmiştir. Bu bölümde ayrıca detaylı sonuç değerlendirmesi ile belgelerde geçen terim, kişi ve yer adlarının açıklandığı bir sözlük kısmı da yer almaktadır. Bu çalışma, 18. yüzyıl sonlarında Tokat şehrinin toplumsal ve ekonomik yapısına dair kapsamlı veriler sunması ve Osmanlı arşiv kaynaklarının bilimsel kullanımı açısından örnek oluşturması bakımından önem taşımaktadır. Bu yolla hem şehir tarihi hem de Osmanlı'nın sosyal ve ekonomik tarihi üzerine yapılan araştırmalara katkı sunulması hedeflenmiştir."
