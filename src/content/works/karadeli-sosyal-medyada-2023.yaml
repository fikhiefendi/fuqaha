abstract: "Çalışmamızda sosyal medyada ihlal edilen mahremiyetin boyutu ele alınarak bu ihlallerin aile içerisinde meydana getirdiği sorunlar ve bu sorunların boşanmalar üzerindeki etkisi dile getirilmeye çalışılmıştır. Evli bireylerin, bu alanlarda etkileşimde bulunurken üzerlerine düşen sorumluluklar çerçevesinde hareket etmelerine dikkat çekilmiştir. Öncelikle bu çalışmanın amacının sosyal medya karşıtlığı yapmak değil, sosyal medyanın sağladığı birçok avantajla birlikte eşler arasında meydana getirdiği anlaşmazlıklardan yola çıkarak boşanmalar üzerindeki etkisini İslâmi perspektiften değerlendirmek olduğunu belirtmek gerekir. Birinci bölümde sosyal medyanın kullanım amaçları ve toplum üzerinde etkileri üzerinde durulmuş, sosyal medya makasidüş-şeria çerçevesinde ele alınarak dinin, canın, malın, aklın ve neslin korunması temelinde değerlendirmelerde bulunulmuştur. İkinci bölümde İslâm hukukunda mahremiyetin genel çerçevesi çizilmiş sosyal medyada teşhir edilen beden görselleri, mahrem mekânların sergilenmesi ve bilgi mahremiyeti ele alınmıştır. Günümüzde sosyal ağlarda mahremiyet sınırlarının ne ölçüde aşıldığı saptanmaya çalışılmış ve bu ağlarda meydana gelen mahremiyet ihlallerine değinilmiştir. Üçüncü ve son bölümde günlük yaşamda karşılaşılan olaylardan yola çıkarak sosyal medyada meydana gelen mahremiyet ihlallerinin neden olduğu, sosyal ağların aile içi iletişime etkisi, nüşûz ve şikaka sebep olması, evlerin duvarlarını şeffaf hale getirmesi, yeni ilişki biçimlerini mümkün kılması ile sanal flörtlere zemin hazırlaması gibi başlıklarla ailede yol açtığı problemler nedeniyle boşanmalar üzerinde etkisi değerlendirilmeye çalışılmıştır."
