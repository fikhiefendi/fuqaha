abstract: "Kıraat ilmi en basit tanımıyla Kur'ân lafızlarının okunuş keyfiyetlerini hem telaffuz hem de eda yönüyle inceleyen ilim dalının adıdır. Kelimelerde meydana gelen birtakım değişiklikler, kullanılan dilin fonetik yapısından kaynaklı yalnız seslendirmede kalmamış aynı zamanda manaya da sirayet etmiştir. Hâl böyle olunca kıraatler, tefsir ve fıkıh gibi pek çok ilim dalının konusu olmuştur. Tefsirler içerisinde ise kıraatlerin en çok ahkâm tefsirleri ile bağlantısı sorgulanagelmiştir. Zira ayetlerden hüküm istinbat etmede kıraatlerin ayrı bir önemi olmuştur. Bir ayetin iki farklı vecih ile okunuyor olması, ayetten iki farklı anlamın ve hükmün çıkarılmasına yol açmıştır. Tarih içerisinde zamanın ve olayların değişmesi, kıraat-ahkâm ilişkisinde de farklılıkları meydana getirmiştir. Bir ayetten birden fazla hükmün çıkıyor olması, âlimlerin ayrışmalarını da beraberinde getirmiş, özellikle de mezhep âlimleri arasında kıraatlerden kaynaklı hüküm farklılıkları daha belirleyici olmuştur. İşte bu çalışmada ahkâm ayetlerinin yorumlanmasında kıraatlerin ne kadar etkili oldukları ortaya koyulmaya çalışılmıştır. Müfessirlerin hüküm istinbat etmede kıraatlerden ne kadar faydalandıkları, bunu yaparken nasıl bir yol izledikleri araştırılmıştır. Kıraat vecihlerinin kıraat kaynaklarından tespiti yapılmış, müfessirlerin perspektiflerinden kıraatlerin ayetlerin anlam ve ahkâmına ne şekilde yansıdığı tetkik edilmiştir. Bu çalışmada Cessâs (ö. 370/981), Herrâsî (ö. 504/1110) ve İbnü'l-Arabî'nin (ö. 543/1148) Ahkâmü'l-Kur'ânları ile Süyûrî'nin (ö. 826/1423) Fıkhü'l-Kur'ân'ı esas alınmıştır. Kıraatlerin dört farklı mezhebin Ahkâm tefsirlerinde ele alınışlarının mukayeseli bir şekilde incelenmesi, araştırmanın özgünlüğü açısından da önem arz etmektedir. Çalışma esnasında veri toplama, analiz, tümdengelim ve tümevarım yöntemleri kullanılmıştır. Araştırmanın sonucunda bazı kıraatlerin, ayetlerin ahkâmını doğrudan değiştirdiği bazı kıraatlerin ise ayetlerin ahkâmına etki etmediği hâlde manaya zenginlik kattığı ve ayetin anlam alanını genişlettiği tespit edilmiştir."
