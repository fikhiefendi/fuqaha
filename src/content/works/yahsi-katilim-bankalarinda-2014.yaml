abstract: "Bu çalışmada katılım bankacılığının dünyada ve Türkiye'deki gelişimi, bu bankaların faaliyetlerine bütünleşik olarak ortaya çıkan riskler ve bu risklerin yönetilmesi, denetimin modern yüzüne ışık tutan risk odaklı denetim anlayışı incelenmiş ve katılım bankalarının faaliyetlerinin risk odaklı denetim anlayışı yaklaşımıyla denetlenebilmesine yol gösterecek bir model önerisinde bulunulmuştur. Bu çalışma ile hedeflenen amaç, katılım bankalarının farklılıklarını dikkate alan ve denetimi klasik yaklaşımdan farklılaştıran temel konulara vurgu yapmak suretiyle modern/risk bazlı bir denetime yardımcı olacak bir model önermektir. Kurum tecrübelerinin klasik yaklaşıma daha fazla aşina olması, denetim kadrolarının yetiştirilmesine katkı sağlayan kıdemli denetçilerin klasik denetim anlayışı ile yetişmiş olması gibi nedenlerle risk odaklı iç denetimin gerektirdiği tecrübe birikiminin sağlanması zaman alabilmektedir. Bu bağlamda katılım bankalarının çalışma prensiplerinden kaynaklanan farklılıklarını dikkate almak suretiyle iç denetime kılavuzluk edecek bir modele ihtiyaç bulunmaktadır. Bu çalışma bu ihtiyacı karşılamaya yönelik olarak hazırlanmış ve dördüncü bölümünde katılım bankası denetçilerinin yararlanabileceği bir model önerisinde bulunmuştur. Önerilen model özellikle Türkiye'de faaliyet gösteren katılım bankalarını hedeflemektedir. Katılım bankalarının faaliyetlerini etkileyen dokuz risk türü üzerinde durulmuş ve bu risklerin özellikle risk değerlendirmelerinin nasıl yapılacağı hususu tartışılmıştır. Katılım bankasının riskleri analiz edilirken aynı zamanda risk yönetim kalitesi de dikkate alınmak suretiyle risk değerlendirmesi işlemi gerçekleştirilmiştir. Risk odaklı denetim anlayışına sahip olmanın ve bu yaklaşımı denetim faaliyetlerinin odağı haline getirmenin fayda ve yararlarına da bu çalışmada değinilmiştir."
