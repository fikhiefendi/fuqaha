abstract: "Çalışmamızda, vasiyetin tanımı, çeşitleri ve geçerli bir vasiyet olması için, vasiyetin tarafları ve konusu olan mûsi, mûsa leh ve mûsa bihte olması gereken şartlar üzerinde ayrıntılı durulmuştur. Bunun yanında vasiyeti ifsat eden nedenler ve vasiyetten rücû şekillerine değinilerek, mer'i hukukun hükümlerine de atıflar yapılmıştır."
