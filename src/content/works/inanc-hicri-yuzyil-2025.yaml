abstract: "Aslî deliller arasında kitap ve sünnetten sonra üçüncü sırada yer alan icmâ deliline usul âlimleri önem vermişler ve onun için birçok çalışmalar yapmışlardır. Bu denli önemi haiz olan icmâın değerlendirilmesi ve onun hakkında fikir yürütülebilmesi için icmâın tarihi seyrinin bilinmesinin zorunluluğuna binaen önce klasik icmâ anlayışı verilmiştir. Daha sonra tezin konusu olan hicrî IX. yüzyıl memzûc fıkıh usulü literatüründe icmâ anlayışı verilerek klasik icmâ anlayışıyla mukayesesi yapılmak suretiyle icmâın tarihi sürecindeki serencamı aktarılmaya çalışılmıştır. İki ana bölümden oluşmakta olan çalışmanın birinci bölümünde Hanefî mezhebi merkezinde klasik icmâ anlayışı aktarılmıştır. İkinci bölümde ise hicrî 9. yüzyılda yaşamış olan Molla Fenârî, Molla Hüsrev ve Kemâleddin İbnü'l-Hümâm'ın eserlerindeki icmâ anlayışları mukayeseli olarak aktarılmıştır. Böylelikle icmâın tarihi süreç içerisinde ele alınış biçimleri hakkında bilgi sahibi olunarak klasik dönem ile hicrî. 9. yüzyıl memzûc fıkıh usulü literatüründeki icmâ anlayışlarının benzer yönleri ile farklı yönleri tespit edilmiştir. Çalışmanın hitamında Hanefî mezhebi bağlamında incelenen ve hicrî 9. yüzyıl memzûc fıkıh usulü literatüründe zikredilen âlimler tarafından ele alınan icmâın hüccet değeri taşıdığı kanaatine varılmıştır. Ayrıca hicrî 9. yüzyılda icmâın hüccet olduğuna dair az önce isimleri zikredilen âlimler arasında herhangi bir ihtilafın olmadığı ve icmâın her dönemde oluşabileceği kanaati de hâsıl olmuştur."
