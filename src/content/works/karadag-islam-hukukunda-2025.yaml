abstract: "İnsan, tabiatı gereği sosyal bir varlıktır. İnsanlar arasındaki menfaat çatışmaları ise sosyal hayatın doğal bir parçasıdır. Bu çatışmalar sebebiyle oluşan uyuşmazlıkların, toplumsal bağları zedelemeden çözülmesi bireysel ve ticari ilişkilerin gelişimi için mühimdir. Taraflar arasındaki ilişkileri korumayı, onarmayı ve güçlendirmeyi amaçlayan alternatif uyuşmazlık çözüm yolları bu bağlamda daha müspet sonuç verir. İslam hukukunda, devlet yargısına alternatif yöntemler; bu fikir etrafında hem kurumsal olarak incelenmiş hem de uygulamada yaygın biçimde kullanılmıştır. İslam hukukunun temel kaynakları incelendiğinde, alternatif uyuşmazlık çözüm yollarının teorik ve pratik temelinin tahkim kurumu etrafında şekillendiği görülür. İslam hukukunda mahkeme bağlantılı tahkimi inceleyen bu çalışmada, İslami tahkimin niteliği, yargılama usulü ve güncel uygulamaları incelenmiştir. Klasik fıkıh eserlerinden elde edilen veriler, Türk hukukunda düzenlenen tahkim kurumunun sistematiğine göre tasnif edilmiştir. Çalışma kapsamında incelenen tahkim sistemi, Hanefî fıkıh eserlerine göre hazırlanan Mecelle-i Ahkâm-ı Adliyye ve Usûl-i Muhâkeme-i Hukûkiyye Kanûn-i Muvakkati'ndeki düzenlemelere dayanmaktadır. Bu çerçevede, hakem kararı kesin hüküm ifade etmez, ancak yetkili mahkeme tarafından icra edilebilirlik şerhi verildikten sonra ilam haline getirilir. Yetkili mahkemeye arz edilmemiş bir hakem kararının sulh sözleşmesi niteliğinde olduğu kabul edilir. Bu yaklaşımın, pozitif hukuk terminolojisindeki mahkeme dışı sulh sözleşmesine karşılık geldiği görülür. Hakem kararının, mahkeme tarafından onaylanarak icra edilebilir kılınması ise; mahkeme dışı sulh sözleşmesine, icra edilebilirlik şerhi verilmesi olarak değerlendirilebilir. Osmanlı hukuk sistemindeki tahkim sisteminin bir benzeri, Birleşik Krallık'ta yürürlükte olan 1996 Tahkim Kanunu'nda da görülmektedir. Tahkimin esasına uygulanacak hukuk bakımından dini kuralların tercih edilmesinin mümkün olduğu bu sistemde hakem kararı doğrudan icra edilebilir olmayıp, yetkili mahkemenin onayı ile cebri icraya konu olmaktadır. Bu düzenlemelere göre, uzun süredir hizmet veren İslami tahkime karşı birçok kampanya yürütülmüş; ancak İslami tahkim uygulaması günümüze kadar ulaşmıştır."
