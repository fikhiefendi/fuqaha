abstract: "Özel Finans Kurumları ile başlayan 1984 yılında Türkiye'deki faizsiz finans sistemiyapılanması bir diğer adıyla slami Bankacılık alanında, Katılım Bankacılığı ismini aldığı2005 yılına kadar genel anlamda hakkında çok fazla bilgi sahibi olunmasa da aslında yetişmişpersonel, gerekli yasal düzenlemeler, denetim boşluğunun giderilmiş olması bakımlarındanbankalara alternatif olma yönünde ciddi adımlar atılmıştır. Ancak bu gelişmelere rağmentasarrufları kendine çekme yönünden bu yıllar arasında aynı oranda bir ilerleme sergilediklerisöylenemez. Bunun en önemli sebebi bu kurumlar hakkında mevcut tanıtım ve bilgieksikliğidir.Tanıtım ihtiyacı yanında bu kurumların dağıttıkları kar oranlarıyla banka faizlerinin vesağladıkları finansman maliyetleri ile banka kredi maliyetlerinin aynı seviyelerde seyretmesi,kamuoyunda büyük bir şüphe ve kararsızlığa sebep olmaktadır. Oysa kaynak, süreç vedoğurdukları ekonomik ve sosyal sonuçlar bakımından banka faizleri ile katılım bankacılığıkarları arasında büyük farklar bulunmaktadır.Anahtar Kelimeler1- Özel Finans Kurumları2- Katılım, Katılım Bankacılığı3- slami Bankacılık4- Faizsiz Finans Sistemi5- Kar Zarar Ortaklığı6- Muhasebe Sistemi"
