abstract: "Tezimizde ilk olarak mezhep birikimi içerisinde bir istidlâl metodu olarak kullanılan tahrîc konusu ele alınacaktır. Genel olarak tahricin mahiyeti incelendikten sonra kısımlarıyla alakalı Hanefi mezhebi merkezli kısa bir anlatım ve örneklendirme yapılacaktır. Ana konu olarak ise Hanefi mezhebi içerisinde tahrîc ile alakalı muayyen bir fer'i mesele olan hurûc bi sun'ihî incelenecektir. Tez giriş, üç bölüm ve sonuçtan oluşmaktadır. Giriş bölümünde tezin içerik ve yöntemi hakkında bilgi verilmektedir. Buna binaen tez konusunun önemi, konunun sınırlandırılması ve kaynakların değerlendirilmesi, son olarak konunun sunumu hakkında malumat aktarılmaktadır. İlk bölüm tahricin ana hatları olan mahiyeti, konuyla alakalı yazılmış özel eserler, tahricin konumu ve mezhep içerisinde kullanımıyla alakalı konuları ihtiva etmektedir. İkinci bölümde Hanefi mezhebi merkezli tahricin işleyişi, tarihi olarak tezahür ettiği dönem ve bu dönemin özelliklerinden bahsedilmekte, son olarak Hanefi mezhebi merkezli tahricin kullanım nevileri ele alınmaktadır. Son bölümde ise tezin ana konusu olan hurûc bi-sun'ihi ele alınmaktadır. Bu bölümde, konunun mütekaddim ve müteahhir ulemanın eserlerinde ele alındığı babların şeması verilmekte, konunun genel anlatımı yapılmakta ve Hanefi fukahasının hangi görüşe yöneldiğinin tespiti yapılmaktadır."
