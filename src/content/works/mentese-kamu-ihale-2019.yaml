abstract: "Adi ortaklık TBK m. 620 ile m. 645 arasında düzenlenmiştir. Adi ortaklığın tanımını yapan TBK m. 620 uyarınca, bir adi ortaktan söz edebilmek için beş unsur bulunmalıdır. Öncelikle, TBK m. 620'deiki ya da daha fazla kişinin emeklerini ve mallarını ortak bir amaca erişmek üzere birleştirmeyi üstlendikleri bir sözleşme olarak tanımlanan adi ortaklık için doktrinde tanımlar yapılmıştır. Adi ortaklık hükümlerine dair olan en önemli hususlardan biri TBK m. 620/2'de düzenlenen bir ortaklığın kanunla düzenlenmiş̧ ortaklıkların ayırt edici niteliklerini taşımaması halinde adi ortaklık hükümlerine tabi olması hususudur. Adi ortaklığın kamu ihalelerindeki önemi ise sözleşmenin tarafları hususunda kendini göstermektedir. Kamu ihale sözleşmeleri idarenin ihtiyaçları çerçevesinde ortaya çıkmaktadır. İdare bazı ihtiyaçlarını kendisi üretmekte ancak bazı ihtiyaçları için özel sektör ile iş birliği yapmaktadır. İşte idarenin, bazı hizmetlerin karşılanması için özel sektörle yapacağı anlaşmalar ihale yöntemi ile yapılmaktadır ve hukuki ilişki kamu ihale sözleşmeleri ile kurulmaktadır. Hizmetin etkili bir şekilde sağlanması için ihale sürecinin de etkili bir şekilde tamamlanması gerekmektedir.Bu hizmetlerin sağlanması için yapılan kamu ihale sözleşmelerinde taraflardan biri idare diğeri ise isteklidir. İstekli olabilecekler ise Kamu İhale Kanunu'nda belirtildiği üzere gerçek veya tüzel kişi veya bunların oluşturdukları ortak girişimdir. Ortak girişim ise iş ortaklığı veya konsorsiyum şeklinde oluşabilmektedir. İş ortaklığı da adi ortaklık niteliğinde olan bir ortaklıktır. Türk hukukunda idarenin ihtiyaçlarını karşılamak için gerçek veya tüzel kişilerle yaptığı sözleşmeler 4734 sayılı Kamu İhale Kanunu ve 4735 sayılı Kamu İhale Sözleşmeleri Kanunu, ihale uygulama yönetmelikleri, ihalelere başvurular hakkında yönetmelikler ve tebliğler ile düzenlenmektedir. Bu çalışmada kamu ihale sözleşmeleri, kamu ihalelerini düzenleyen kanunlar, yönetmelikler ve tebliğler ile birlikte diğer ilgili kanun, yönetmelik ve tebliğler kapsam ve çerçevesinde, adi ortaklık bağlamında incelenmiştir. Konu, sözleşmenin bir tarafı olan isteklinin iş ortaklığı şeklinde ihaleye katılması halinde ve adi ortaklık niteliği göstermesi nedeniyle“adi ortaklık”kapsamında açıklanmıştır.Bu sebeple çalışmada, iş ortaklığının daha açıklayıcı şekilde anlatılabilmesi için adi ortaklık ve kamu ihale sözleşmeleri de anlatılmış ve bu çerçevede kamu ihale sözleşmelerinde adi ortaklık konusu işlenmiştir."
