abstract: "Hükümleri temelde Kur'an ve Sünnet'e dayanan İslam ceza hukuku, suçlular ile hakkı ihlal edilenler arasında adaleti sağlamak üzere konulmuş bir hukuk dalıdır. Şer'i maksatlar çerçevesinde beş temel değer olan“zaruriyyât-ı hamse”yi koruyarak hem Allah hem de kul haklarını gözeten İslam ceza hukuku, çok köklü bir yapıya sahiptir. Bir taraftan adaletten taviz vermemekte diğer taraftan merhameti de bünyesinde barındırmaktadır. İslam ceza hukukunun felsefesinde, cezai müeyyideyi gerektiren her fiili, pozitif hukuk kanunları tarafından göz ardı edilen fayda-zarar dengesinin yanında uhrevî maslahatları da gözetme ona uygun bir ceza belirleme anlayışı vardır. Bu bağlamda İslam ceza hukuku suçları, hadi gerektiren suçlar, kısas ve diyeti gerektiren suçlar ve ta'zîr suçları olmak üzere üç kısımda incelemiş, bunlarla ilgili cezaları koyarken de yukarıda sözü edilen canın, malın, aklın, dinin ve neslin korunmasından ibaret olan beş temel değerin muhafazasını gözetmiştir. İslam ceza hukuku, uygulandığı her zaman ve mekânda bu maslahatı gözetme başarılabilmiştir. Buna karşın pozitif hukuk kanunları suçların yayılmasını engelleme konusunda başarılarını kanıtlayamamış, aksine uygulandıkları dönemlerde hukuk ihlalleri ve suçlar yüksek oranda artmıştır."
