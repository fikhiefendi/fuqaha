abstract: "Bu çalışmada, Türkiye'de faaliyet gösteren katılım bankacılığı sektörü bütüncül bir şekilde ele alınmış; kamu ve özel sermayeli katılım bankalarının gelişim süreçleri ile birlikte belirli finansal performans göstergeleri çerçevesinde analizleri gerçekleştirilmiştir. İslami finans sisteminin önemli bir unsuru olan katılım bankacılığı, konvansiyonel sistemin dışında kalan atıl tasarrufları ekonomik sisteme kazandırarak reel sektöre fon sağlamada önemli bir rol oynamaktadır. Bu doğrultuda, 2023-2024 yıllarına ait veriler esas alınarak, Türkiye'deki kamu ve özel katılım bankalarının finansal performansları seçilmiş kriterler aracılığıyla değerlendirilmiştir. Analiz sonuçlarına göre, incelenen dönem kapsamında özel sermayeli katılım bankalarının performanslarının, kamu sermayeli muadillerine kıyasla daha yüksek olduğu tespit edilmiştir."
