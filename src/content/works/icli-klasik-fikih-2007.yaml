abstract: "Bu çalısmayla, fıkhî terminolojide bir kimseyi tehdit ederek rızası olmaksızın bir is islemek üzere haksız yere zorlamak anlamına gelen ikrahın, klasik fıkıh doktrininde usûl ve pratikte nasıl degerlendirildigini ortaya koymayı amaçladık. Arastırmamızda ilk ve son dönem dahil, usûl-ü fıkıh ve furû-u fıkıh kitaplarına basvurularak kaynak taraması yapılmıs, elde edilen bilgiler mezheplerin kendi sistematigi ve bütünlügü içerisinde degerlendirmistir. Çalısmamızı üç bölüm çerçevesinde gerçeklestirdik. Birinci bölümde ikrahın tanımı, kısımları ve gerçeklesme sartları üzerinde duruldu. kinci bölümde ise ikrahın ceza sorumluluguna etkisi ve bu baglamda öldürmeye ikrah konusu incelendi. Buna göre, bir kimseyi öldürmeye zorlanan kisiden kısas cezasının düsüp düsmeyecegi tartısıldı. Son bölümde ise ikrahın sözlü ve fiili tasarruflar ile inanç ve ibadet alanındaki etkisi üzerinde duruldu. krahın varlıgı durumunda kisinin hür irade ve rızasından bahsedilemeyecegi için, ikraha maruz kalan kisinin tasarruflarına iliskin hükümlerin degismesi de tabii bir durumdur. Buna göre, tehdit ile zorlananın haram olan bir seyi yemek veya bir sözü söylemek gibi bir kısım fiilleri yapmasına izin verilirken; öldürme ve yaralama gibi bir kısım fiilleri yapmasına izin verilmez. Haksız yere ikrah, insanın kutsal degerlerinden kabul edebilecegimiz“özgür irade”ye zarar verdigi için hattı zatında ikrahta bulunan açısından çok çirkin bir yol, hürriyete tecavüz ve kisiye zulümdür."
