abstract: "Belirli amaçları gerçekleştirmek üzere kurulan ilişkilerden biri de, hekim ile hasta arasında gerçekleşen tedavi amaçlı ilişkidir ki, bununla hedeflenen amaç hastayı eski sağlığına kavuşturmaktır. Ancak, bazen tedaviden beklenen sonuçlar alınmayabilir, hastalık daha da ağırlaşabilir ve hatta hasta yaşamını kaybedebilir. Bütün bunlar teşhis ve tedavi hatası ile ilişkilendirerek hekimler sorumlu tutulur. Uygulanan bir tedavi nedeniyle hekimlerin sorumlu tutulabilmesi için öncelikle uygulamanın, yetkili ve uzman bir hekim tarafından tedavi amacıyla uygulanması gibi unsurları taşıması ve zarar, kusur ve illiyet bağı gibi sorumluluk şartlarının bulunması durumunda söz konusu olur. Bununla birlikte hekimlerin sorumlu olmasında, bir bazı hukuk sistemleri kendi hukuk anlayışına göre hastanın mağduriyetini dikkate alarak yalnız ?sebep olma? ilkesini esas alıp zararın varlığını sorumluluk için yeterli görürken hukuk anlayışının gelişmesi ve ilerlemesi ile şekillenen modern hukuk sistemleri gibi İslam hukukunda da ?kusur? ilkesi esas alınmıştır.Hekimin kusurlu sayılması noktasında da, tıbbi uygulamanın toplumsal boyutu, kamu hizmeti sayılması, tehlikeli ve risk oranı yüksek bir eylem olması gibi nitelikler dikkate alınarak hekimler genellikle tüm şartlarda sorumlu tutulmamıştır. Sorumluluk şartları ve esasları sözleşme ve haksız fiil ilkelerine göre belirlenirken, İslâm hukukunda bedene ilişkin zararları ?âkile? tarafından üstlenilecek olması gibi gerekçeler nedeniyle hekimler, haksız fiil esaslarına göre yargılanmıştır. İşte bu çalışmada, eski zamanlardan beri tartışılmakta olan hekimin sorumluluğu İslâm hukuku açısından incelenmiştir."
