abstract: "Bu çalışmada geç dönem Osmanlı Urfa'sında özellikle Müslüman kadının yaşantısı, sosyo-ekonomik statüsü ve mahrem sınırları incelenmektedir. Tezin ana amacı Urfa kadınının toplumsal hayattaki sınırlarını anlamaya çalışmaktır. Bu sebeple şehrin kadınlara bakan yönüyle sosyal, ekonomik ve mekânsal yönü mercek altına alınmıştır. Böylece kentin imkânlar dâhilinde sunduğu verileri mekân-insan ilişkisi düzleminde kadın perspektifinden açıklamak mümkün olmuştur. Osmanlı mahkeme kayıtları olan şer'iyye sicilleri toplumun her tabakasına mensup insanların dünyasını anlamak için büyük önem taşımaktadır. Urfa şer'iyye sicilleri de zengin muhteviyatıyla yereldeki kadının dünyasını belli ölçüde sunacak önemli ipuçlarını içermektedir. Dolayısıyla çoğunlukla 1845-1915 yıl aralığını kapsayan sicillerin kullanıldığı bu çalışmada özellikle Müslüman Urfa kadını ile ilgili sorunsal çerçeve tespit edildikten sonra metne soru sorarak ve çözümleme yaparak etraflıca bir değerlendirme yapılmaya çalışılmıştır. Sicillerden, diğer bazı arşiv kaynaklarından, fetvalardan, seyyahların ve dönemin tanıklarının gözlemlerinden elde edilen veriler Urfa'da kadının geçmişini ele alırken öncesiyle veya güncelle bir devamlılığın ya da kopukluğun olup olmadığı hususunda bizi yönlendirdi. Buradan hareketle ulaştığımız sonuçlar Urfa toplum okumalarına ve Osmanlı dönemi taşra kadınının dünyasını öğrenmeye dair katkı sağlayacaktır."
