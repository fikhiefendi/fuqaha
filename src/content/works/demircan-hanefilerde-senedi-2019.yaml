abstract: "Bu araştırma, Hanefilerle özdeşleşen istihsan metoduna gerekçe olan nass, icma, kıyas, zaruret, örf, maslahat vb. konulara değinmektedir. Konu bununla birlikte senedi örf olan istihsanlar üzerinde yoğunlaşmaktadır. Konunun daha iyi anlaşılabilmesi için istihsan ile alakalı olan kıyas ve örf kavramları da ayrıca örneklerle açıklanmıştır. Çalışma; giriş, iki bölüm ve sonuç kısmından oluşmaktadır. Giriş kısmında araştırmanın konusu, yöntemi ve araştırma nedenine değinilmekte, birinci bölümde ise istihsan ve kıyas hakkında genel bilgiler, istihsanın terimleşme süreci, istihsanı kabul ve reddedenlerin görüşleri ele alınmaktadır. İkinci bölüm, tezin ana bölümünü oluşturmaktadır. Bu bölümde istihsanın senedini oluşturan örf hakkında genel bilgiler verilmekte daha sonra senedi örf olan istihsan örnekleri konularına göre tasnif edilerek sunulmaktadır. Sonuç kısmında ise, tezde işlenen konunun bir değerlendirmesi yer almaktadır."
