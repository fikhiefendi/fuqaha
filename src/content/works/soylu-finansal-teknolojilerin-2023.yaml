abstract: "Bu çalışma, İslami dünya görüşünden farklı bir metafiziksel arka plana sahip olan finansal teknolojilerin Müslüman toplumlara transfer edilmesiyle ortaya çıkan sosyal ve ekonomik eklektik yapının mahiyetini ortaya koymaya çalışmaktadır. İlk olarak, bu çalışma, İslam iktisadı araştırmacıları tarafından büyük ölçüde kabul edilen finansal teknolojilerin birçok yönden İslami ilkelere uygun olduğuna dair ön kabullerin, finansal teknolojilerin metafiziksel arka planıyla uyumlu olup olmadığını araştırmaktadır. Bu bağlamda, çalışmanın ikinci hedefi, bu düzlemsel uyumsuzluğun Müslüman toplumlarda birçok araştırmacının göz ardı ettiği şekilde nasıl eklektik ve şizofrenik bir yapıya yol açtığını incelemektir. Bu çalışmanın araştırma birimi olan finansal teknolojiler, Aydınlanma felsefesine dayalı modern Batı bilim ve tekniğinin doğrudan bir ürünüdür. Dolayısıyla, finansal teknolojilerin öncelikle bir“teknik”olarak değerlendirilmemesi gerekmektedir. Heidegger'in ifade ettiği üzere bu modern teknik, geçmişteki kullanımlarından farklı olarak, dönemin mevcut felsefi paradigmasının bir ürünüdür. Bu nedenle, Aydınlanmacı bir ontolojik zemine dayanan modern teknik, insanların dünyayı algılama biçimlerinde radikal bir dönüşüme neden olmuştur. İnsanlar, akıl merkezinde doğanın ve doğanın içerisindeki her ilişkinin kendi refahlarına uygun olacak şekilde hükmedilmesinin gerekliliğine dair bir anlayış benimsemişlerdir. Bu anlayışın bir izdüşümü olan modern teknik olarak teknoloji, ortaya çıkma işlemine aracılık eden araçların özüne işaret eden hükmedici ve meydan okuyucu bir çerçevelemeyi (ge-stell) içeren bir açığa çıkma tarzıdır. Başka bir ifade ile dönemin ontolojik kabullerine uygun olarak teknolojinin öncülük ettiği varlığın açığa çıkışı, sınırlama, müdahale etme ve meydan okuma içermektedir. İslami finansal teknolojiler de teknolojinin böylesi bir arka planından neşet eden İslami finansal teknolojiler ise Müslüman toplumların ontolojik yapısı ile uyuşmazlık ortaya çıkarmaktadır."
