abstract: "Ribâ meselesi, Fıkıh ilminin mâli muâmelât bölümlerinde üzerinde önemle durulan temel konulardan biridir. Ribânın tanımı, birden çok kısımlara ayrılması ve ribâya konu olan mallar ile ilgili ileri sürülen görüşlerin çeşitliliği ribâ mefhûmunun oldukça girift bir hal almasına sebebiyet vermiştir. Dolayısıyla konunun tüm ayrıntılarıyla incelenmesi ve buna bir açıklık getirilmesi son derece mühimdir. Çalışmada, Kur'ân ve Sünnet nassları ile İslâm âlimlerinin yorumları çerçevesinde ribânın mâhiyeti incelenmiş, kısımları üzerinde durulup aralarındaki ilişki ve farklılıklar detaylıca ele alınmış ve fazlalık ribâsının varlığına yönelik itirazlar irdelenmiştir. Bunun yanında Kur'ân'da zikredilen ribâ kavramının mücmelliği meselesi tartışılmış ve mücmel olmadığı sonucuna varılmıştır. Diğer yandan klasik literatürde 'ribânın illeti meselesi' olarak bilinen alışveriş ribâsına konu olan mallar meselesi tahlil edilmiş, alışveriş ribâsının illeti ile ilgili ortaya konulan tüm görüşlere gerekçeleri ile birlikte yer verilip değerlendirilmesi yapılmış ve sonuç olarak alışveriş ribâsının standardize edilebilen mislî mallarda gerçekleştiği kanaatine varılmıştır. Ayrıca alışveriş ribâsı ile ilgili önemli görülen bazı meseleler de ele alınmıştır. Çalışmanın sonunda ise ribevî malların mübâdelesinde işçilik, ayar ve kalite farkının değeri ve sözleşmelere etkisi incelenmiş, bu hususla ilgili görüşler ele alınıp değerlendirilmiş ve sonuç olarak ribevî mallarda bulunan işçilik, ayar ve kalite farklarının peşin mübâdelelerde dikkate alınması gerektiği kanaatine varılmıştır."
