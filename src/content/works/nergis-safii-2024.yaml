abstract: "Fıkhî bir meselenin dinî-hukukî hükmünü açıklayan cevap olarak bilinen fetvanın belirli bir disiplin içinde verilmesi gerekmektedir. Klasik fıkıh literatüründe müftünün fetva verirken takip edeceği usul ve esaslar daha ziyade edebül-fetva, âdâbü'l-müftî, resmi'l-müfti gibi kavramlarla ifade edilmiştir. Mezheplerin İslam toplumunda kök salmalarıyla birlikte her mezhebin kendine göre bir fetva usulü oluşmuş, tercih edilecek görüşler veya başvurulacak kaynaklarla ilgili hiyerarşik bir yapı oluşmuştur. Şâfiî fakîhler de fetva usulünde kendi mezheplerinin hiyerarşisini oluşturmuşlardır. Buna göre Şâfiî fıkhında \"şeyhayn\" olarak bilinen ve İmam Gazzâlî'den sonra gelen Râfi'î ve Nevevî, Şafii fetva usulünün iki kilit ismi olarak ön plana çıkmıştır. Müteahhirin dönemi Şâfiî mezhebinin fetva usulünde İbn Hacer el-Heytemî ile Şemseddin er-Remlî ve ikisi kadar olmasa da Hatîb eş-Şirbînî dikkati çekmektedir. İbn Hacer el-Heytemî'nin Tuhfetü'l-Muhtâc ile Şemseddin er-Remlî'nin Nihâyetü'l-Muhtâc şerhleri Şâfiî fakîhlerin mezhep görüşlerinde temel referans kaynağı hâline gelmişlerdir. Fetva usulü bir anlamda mezhep içi tutarlılığı (legal harmony) da ifade etmektedir. Dolayısıyla konu, tezde Şafii müftülerin fetva birliğini sağlayarak hukuk güvenliğine halel getirmemeleri, verilen fetvaların toplumsal kabulünün sağlanması, fetvaya ehil olmayan kişilerin fetva vermelerinin engellenmesi gibi hususlar çerçevesinde de ele alınmıştır. Buna göre; Tez bir giriş ve üç bölümden oluşmaktadır. Girişte, tezin amacı ve önemi üzerinde durulmuştur. Birinci bölümde, fetva ve fetva usulü ile ilgili kavramsal çerçeve çizilmiştir. İkinci bölümde, Şafii Mezhebi'nin gelişim seyri ele alınmıştır. Üçüncü bölümde ise, Şafii Mezhebi'nin fetva usulü işlenmiştir. Çalışmanın sonunda varılan bulgular sonuç kısmında ifade edilmiştir. Anahtar Kelimeler: Şâfiî Mezhebi, müftî, fetva, tercih, furu' fıkıh"
