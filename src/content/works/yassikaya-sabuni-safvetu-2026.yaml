abstract: "Bu çalışma, Kur'an'ın anlaşılmasına yönelik yöntemsel yaklaşımlar bağlamında Sâbûnî'nin katkılarını ele almaktadır. Sâbûnî'nin tefsir anlayışında, rivayet ve dirayet yöntemlerini birleştirme çabası dikkat çekmektedir. O'nun eserlerinde, hem klasik müfessirlerin, görüşlerinden yararlandığı hem de çağdaş problemlere çözüm sunan yorumlara yer verildiği görülmektedir. Özellikle dilsel çözümler ve ahlaki vurgular, tefsirinin özgün yönleri arasında sayılabilir. Araştırma süresince Sâbûnî'nin Safvetü't-Tefâsir'i başta olmak üzere müellifin fıkhî ahkâma tealluk eden ayetleri bir araya getirip değerlendirdiği diğer bir tefsir eseri olan Revâ'i'ül-Beyân'a da müracaat edilmiştir. Böylelikle müellifin zihin dünyasında ahkam ayetlerine yönelik-gerek zaman aralığı gerekse de telif tarzının farklılığı gibi nedenlerle oluşmuş olabilecek muhtemel değişimlerin izi sürülmüştür. Elde edilen bulgular, Sâbûnî'nin tefsir anlayışının hem akademik çevrelerde hem de toplum nezdinde kabul gören bir etkiye sahip olduğunu ortaya koymaktır."
