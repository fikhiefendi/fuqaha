abstract: "Yazma eser koleksiyonları, İslâm medeniyetinin ilmî, estetik ve kültürel birikimini günümüze taşıyan en önemli miraslardan biridir. Geçmişte camii, medrese ve vakıf kütüphanelerinde muhafaza edilen yazma eserler, yalnızca dinî ve ilmî bilgilerin aktarıldığı metinler olmanın ötesinde, dönemin düşünce yapısını, estetik anlayışını ve kültürel değerlerini yansıtan özgün sanat ürünleridir. Günümüzde ise söz konusu yazmalar, kütüphanelerin modern koruma ve dijitalleştirme yöntemleriyle geleceğe taşınmakta; böylece geçmişin ilmî, sanatsal ve entelektüel mirası, araştırmalar aracılığıyla yeniden değerlendirilmektedir. Bu çalışma, Erzurum İl Müftülüğü Kütüphanesinde yer alan ve daha önce kataloglanmamış 431 yazma eserin hat, tezhip ve cilt sanatları açısından değerlendirilmesini amaçlamakta; söz konusu eserleri sanat tarihi disiplini çerçevesinde teknik, estetik ve dönemsel bakımdan analiz etmektedir. Araştırma kapsamında betimleyici analiz, karşılaştırmalı değerlendirme ve dönem tespiti gibi yöntemler kullanılmış; yazı türleri, istif yapıları, harf anatomileri, motifler, renk ve teknik uygulamalar ile cilt tezyînatları detaylı biçimde incelenmiştir. İncelemeye alınan eserlerin çoğunluğunu Kur'an-ı Kerim, tefsir, hadis, fıkıh ve dilbilgisi gibi temel İslâmî ilimlere ait metinler oluşturmakla birlikte; coğrafya ve astronomi gibi bilimsel alanlara ait yazmalar da çalışmaya dâhil edilmiştir. Ayrıca tezyînatlı eserlerden seçilen bazı örnekler dikkate alınarak, bu eserlerin farklı kütüphanelerde bulunan eserlerle benzerlikleri değerlendirilmiştir. Böylece daha önce katalog dışı kalmış bir koleksiyonun sanat tarihi literatürüne kazandırılması ve kitap sanatı araştırmalarına özgün bir katkı sunulması hedeflenmiştir."
