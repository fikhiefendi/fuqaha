abstract: "Bu çalışma, Hanefî mezhebinde ibadet ahkâmına ilişkin miktarların hangi deliller ve usûlî ölçütler doğrultusunda tayin edildiğini incelemektedir. Araştırma, ibadetlerde yer alan bütün miktarları kapsayıcı biçimde ele alma iddiası taşımamakta; uygulama zemini itibarıyla tahâret, namaz ve oruç bahislerini merkeze almaktadır. Bunun yanında zekât meselesine, ölçülerin birbirinin yerine kullanılması ve ayn-kıymet dönüşümü bağlamında sınırlı biçimde temas edilmiş; fidye ve kefâret ise oruç bahsi içerisinde süre, sayı ve nicel ölçüler bakımından incelenmiştir. Çalışmada fıkhî mukadderât kavramı, bir ibadetin vücûbu, sıhhati veya ifasının kendisine bağlandığı sayı, zaman, hacim, ağırlık, mesafe, alan yahut oran türünden şer'î veya içtihadî nicel eşik ve sınırlar anlamında kullanılmaktadır. İlk bölümde miktar, takdir ve tayin kavramları açıklanmış; Kitap, Sünnet, icmâ, sahâbî kavli, kıyas, örf ve dil unsurlarının miktar tayinindeki rolleri değerlendirilmiştir. Diğer bölümlerde ise suyun azlık-çokluk ölçüsü, abdest uzuvlarının sınırları, başın meshindeki asgarî miktar, namazda kıraat, teşehhüd ve secdeye ilişkin asgarî ölçüler, seferde rekâtların kısaltılması, orucun başlangıç ve bitiş vakitleri ile fidye ve kefâret miktarları incelenmiştir. Araştırma neticesinde, Hanefî kaynaklarda müstakil bir“miktar teorisi”başlığı bulunmasa da fürû örnekleri ve usûl ilkeleri birlikte değerlendirildiğinde ortak bir yöntem örüntüsünün ortaya çıktığı görülmüştür. Buna göre bazı miktarlar açık nasla belirlenmiş ve artırma-eksiltmeye kapalı tutulmuş; bazı asgarî sınırlar ise nassın delâleti, sünnet, sahâbe uygulaması, örf, ihtiyat ve kolaylaştırma ilkeleri çerçevesinde tespit edilmiştir."
