abstract: "Bu araştırma Osmanlı ilmiye sınıfına mensup olan ve Kıbrıs'ta İngiliz sömürgesinin hâkim olduğu yıllarda eğitim, yargı ve din alanlarında hizmet vermiş bulunan Hürremzâde Mehmet Hakkı Efendi'nin hayatı, eğitimi ve Fetva Eminliği döneminde verdiği fetvalardan erişebildiklerimizin transkripsiyon ve İslam Hukuku açısından incelenmesini içermektedir. Kıbrıs'ta İngiliz idaresi tarafından atanan ilk müftü olan Hakkı Efendi bu atama ve sonrasında icra ettiği Fetva Eminliği nedeniyle Kıbrıs Türkleri nezdinde çeşitli eleştirilere maruz kalmıştır. Adada Fetva Eminliğinin öncesinde çeşitli görevleri de icra eden Hakkı Efendi'nin yalnızca Fetva Eminliği döneminden erişebildiğimiz (1929-1930-1946-1947-1948) 752 adet fetvasının ele alındığı bu çalışmada Hakkı Efendi'nin kadılık dönemine ait tutanakları ve müftülük dönemine ait fetvaları araştırma dışında bırakılmıştır. Çalışmanın ilk bölümünde Osmanlı Devleti döneminde adanın idari yapılanması ve genel durumu ile Hakkı Efendi'nin yaşadığı İngiliz dönemi Kıbrıs'ının idari yapılanması ve genel durumu ele alınmıştır. İkinci bölümde; eriştiğimiz fetvalar monografik örneklem şeklinde okura sunulmuştur. Yine bu bölümde; kullanılan fetvaların tarihleri, hangi deftere ait oldukları ve fetvalarda müracaat edilen atıfların geçtiği yerler dipnotlarda gösterilmiştir. Fetva usulü hakkında kısa bir girişle başlayan üçüncü bölümde ise Hakkı Efendi'nin fetvalarından ilgi çekici olanları İslam hukuku açısından irdelenmiştir. Ayrıca burada; müracaat ettiği kaynaklar değerlendirmeye alınmış ve atıf yapılan kaynaklar muteberlik yönünden incelenmiştir. Yine bu bölümde elimizdeki fetvalardan sosyal içerik noktasında ilgi çekenler değerlendirilmeye çalışılmıştır. Çalışmanın sonucunda Kıbrıs'ta İngiliz idaresi döneminde Fetva Eminliği gibi son derece kritik bir görevi icra eden Hakkı Efendi'nin görevinin gerektirdiği vasıfları haiz olduğu ve verdiği fetvaların İslam hukuk disiplini açısından muteber olduğu tespit edilmiştir. Anahtar Kelimeler: İslam Hukuku, Fetva, Kıbrıs, Fetva Eminliği, Hürremzâde, Hakkı Efendi."
