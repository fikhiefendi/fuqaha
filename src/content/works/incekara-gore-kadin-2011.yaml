abstract: "Evlilik ve evlilikte kadının yeri, her hukuk sisteminin en önemli konularındandır. Eski hukuk sistemlerinde, evlilikle ilgili hükümler ve evlilikte kadının konumu,birbirine büyük benzerlik göstermektedir. Bu hukuk sistemleri ve onların dayandığı felsefe, günümüzde halen etkilerini korumaktadır. Kadının evlenme yetkisini sınırlandıran ve onun, hem ailede, hem toplumdaki yerini pasifleştiren eski hukukun aksine, Kur'an'da ve Hz. Muhammed'in uygulamasında evlilik her iki tarafın hür iradesine dayalı bir işlemdir ve evlilikte her iki tarafa adil bir şekilde hak ve sorumluluklar yüklenmiştir."
