abstract: "Araştırmanın Konusu ve Önemi, Kapsamı ve Amacı, Yöntemi, Kaynakları ve Fıkhî Âyetler / Ahkâmü'l-Kur'ân'dan, hüküm-ahkâm kelimelerinin manasından, ahkâm âyetlerinin sayısından ve tasnifinden, Ahkâmü'l-Kur'ân tefsirlerinden, beşerî hukukta ve İslâm hukukunda âile hukukunun yerinden bahsettik. BİRİNCİ BÖLÜM'de: Evliliğin kurulmasına, evlilikle ilgili âyetlerin tasnifine, evlilikte ehliyete ve velâyete, evlilikte denkliğe, evlenilmesi harâm olan kadınlara, evlilik öncesi nişanlanmaya/hıtbe ve hükümlerine, evlenme akdinin tarifine ve mahiyetine, evlenme akdinin ibâdet olup olmadığına, nikâh lafzının evlilik akdiyle ve cinsel ilişkiyle bağlantısına, evlenme akdinin rükünlerine, sîga (îcâb ve kabûl) ve diğer rükünlere, sîgada geçerli olan lafızlara, sîgada geçerli olan zaman kipine değindik. İKİNCİ BÖLÜM'de: Evliliğin kişisel ve mâlî yükümlülüklerine, kadının hayız-temizlik hali ve cinsel ilişkiye, karı-kocanın iyi geçinme yükümlülüklerine, çok eşlilikte adâleti sağlama yükümlülüğüne, mehir konusuna, mehirin çeşitlerine ve miktarına, mehir-hulû'-talâk-fesih ilişkilerine, mehr-i misil-denklik ilişkisine, mehr-i misil, mehr-i müsemmâ ve müt'a'ya, cinsel ilişkiden önce boşanan kadının mehrine değindik. Sonra da kocası tarafından kadının nafaka ve mesken ihtiyaçlarının karşılanmasına, babaya nisbet edilen çocuğun bakımı (hadâne) ve süt emme (radâ') masraflarının yine baba tarafından karşılanması gerekliliğine değindik. SONUÇ'ta: Yukarıda iki bölümde zikrettiğimiz konuların Nesefî ve Îcî'ye göre farklılık arzedip etmediğine, aralarındaki ihtilaflara değinen bir kısa özet sunduk. BİBLİYOGRAFYA'da: Tezimiz boyunca yararlandığımız çoğu Arapça ve kısmen Türkçe kaynakların alfabetik bir listesini hazırladık."
