abstract: "Bu çalışmanın amacı Dünya İslam ülkeleri sukuk ihraç miktarının küresel bazda Dow Jones İslami Piyasalar Dünya endeksi, dolar endeksi, S&P 500 tahvil endeksi ve Dow Jones sukuk endeksi ile ilişkisinin incelenmesidir. Bu faktörler arasında bir ilişkinin olup olmadığı, Rals Eşbütünleşme analizi ile araştırılmaya çalışılmıştır. Araştırmanın analizinde 2012Q4-2021Q3 dönemi çeyreklik veriler kullanılmıştır. Çalışmaya Birleşik Arap Emirlikleri, Bruney, Endonezya, Kuveyt, Malezya, Nijerya, Pakistan, Sudan, Suudi Arabistan, Umman, Ürdün ve Türkiye sukuk ihraç verileri dahil edilmiştir. Yöntem olarak zaman serileri analizi yapılarak Rals Eşbütünleşme testi kullanılmıştır. Yapılan analizlerden elde edilen bulgulara göre, dolar endeksi ile Dünya İslam ülkeleri sukuk ihracı arasında ilişkinin bulunmadığı ancak Dow Jones sukuk endeksi ve S&P 500 tahvil endeksi ile Dünya İslam ülkeleri sukuk ihracı arasında ilişkinin olduğu sonucuna varılmıştır."
