abstract: "“Bazı İslam Ülkelerindeki Mevzuat Işığında Boşanmanın Hukuki Sonuçları”adlı yüksek lisans tezimiz giriş ve iki ana bölümden oluşmaktadır. Giriş kısmında İslam hukuk sistemi ve bu hukuk sisteminin genel özellikleri hakkında bilgi verilmiş, akabinde bu özelliklerden yola çıkılarak İslam ülkelerinde yapılan kanunlaştırma çalışmalarına yer verilmiştir. Birinci bölümde boşanmanın hukuki sonuçlarını doğrudan etkileyecek olan nikah akdine, şartlarına ve İslam Hukuku'nda ayrılık çeşitlerine yer verilmiştir. İkinci bölümde ise boşanmanın hukuki sonuçları öncelikle genel olarak ele alınmış daha sonra bu hukuki sonuçlardan iddet, nafaka ve hidâne bahisleri üzerinde durulmuştur. Çalışma hazırlanırken klasik İslam hukuk kaynaklarından yararlanılarak; boşanmanın hukuki sonuçlarından iddet, nafaka ve hidâne bahislerinde mezhepler arasındaki uzlaşma ve ihtilaflar tespit edilmiş, öte yandan mevcut Fas, Cezayir, Mısır, Irak ve Türk Medeni Kanun'ları incelenerek bahsedilen konuların modern mevzuattaki yeri ve uygulamaya yansıyan yönleri incelenmiştir."
