abstract: "Türk hukuk tarihinin olduğu kadar İslam hukuk tarihinin de önemli bir dönemi olan Tanzimat sonrası Osmanlı hukukunda kanunlaştırma faaliyetlerini ele alan bu çalışma, tezin amacını, kapsamını ve kaynaklarını açıklayan giriş kısmından sonra iki bölüm ihtiva etmektedir. İlk bölümde kanunlaştırmanın kavramsal çerçevesi ve tarihçesi ele alınmakta, ayrıca İslam hukuk tarihinde taknin faaliyetleri incelenmektedir. İkinci bölümde ise Tanzimat sonrası kanunlaştırma çalışmaları modern hukuk sistematiğine göre ele alınmakta, idare hukuku dışında kalan hukuk dallarındaki temel kanunların hazırlanma süreçleri, amaçları, muhtevaları, hazırlığında yer alan ulemanın katkıları değerlendirilmektedir. Sonuç kısmında ise, araştırma esnasında ulaşılan bilgi ve belgeler ışığında söz konusu dönem kanunlaştırma çalışmalarının Türk hukuk tarihi ve İslam hukuku tarihi açısından ifade ettiği anlam üzerinde bazı değerlendirmeler yapılmakta, en sonunda ise tezde kullanılan bazı belgeler ek olarak sunulmaktadır."
