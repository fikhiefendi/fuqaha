abstract: "Müslümanlar, hayatlarını dinin kurallarına uygun olarak devam ettirebilmek için her dönemde fetvâ müessesesine ihtiyaç duymuşlardır. Bu itibarla Ürdün Emirliği'nin kurulduğu ilk yıllarda fetvâ faaliyeti Osmanlı Devleti'ndeki usûl üzere devam etmiş, daha sonra merkeze, genel fetvâ politikasını belirleyecek bir başmüftü tayin edilmiştir. Ardından ülke genelinde görülen kurumsallaşma çabaları sonucunda Fetvâ Kurumu oluşturulmuştur. Müslümanların karşılaştığı güncel ve kompleks problemlere çözüm bulabilmek için Kurum bünyesinde Fetvâ Komisyonu ve Fetvâ Meclisi kurulmuştur. Bu çalışmada Ürdün Fetvâ Kurumu'nun teşkilât yapısı, görevleri ve kurumla ilgili mevzuat, ülkede fetvânın geçirdiği tarihî süreç dikkate alınarak değerlendirilmektedir. Kurumun fetvâ verirken izlediği yöntem incelendiğinde, ahvâl-i şahsiyye konusunda temel kaynak olarak Ürdün Ahvâl-i Şahsiyye Kanunu'nu kullandığı, genel itibarıyla buna aykırı fetvâ verilmediği, kanunda değişiklik olduğunda fetvânın da değiştirilerek kanuna uygun hale getirildiği tespit edilmiştir. Hakkında kanunda herhangi bir düzenleme olmayan meselelerde fetvâ verilirken, eğer varsa mahkeme kararı esas alınmaktadır. Ahvâl-i şahsiyye dışında kalan meselelerde ülkede yaygın mezhep olması dolayısıyla Şafiî mezhebinin görüşleri benimsenmekte, ancak mezhep taassubunun olmadığı, gerektiğinde diğer mezheplerin görüşlerinden de istifade edildiği görülmektedir. Güncel meselelerle ilgili problemlerin çözümünde ise kolektif çalışma esas alınmaktadır. Bu yönüyle Kurum, toplu ictihad müessesesinin somut örneğini sergilemektedir."
