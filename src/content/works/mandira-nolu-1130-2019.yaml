abstract: "Şer'iyye sicilleri ve içerisinde yer alan tereke kayıtları bir nevi bizim sosyal, kültürel ve ekonomik tarihimizin yazılı müzesidir. Biz de çalışmamızda 661 numaralı Edirne Şer'iyye Sicili'nden hareketle Edirne'nin m.1717-1718 yıllarının sosyo-kültürel tarihi hakkında elde ettiğimiz bilgiler ışığında genel hatlarıyla bir çerçeve çizmeye çalıştık. Bu çalışmada şer'iyye sicilleri, kadı mahkemeleri ve Edirne'nin kısa tarihi genel olarak aktarıldıktan sonra tezimize konu olan 661 numaralı sicil defterinin tanıtımı yapılarak içerisinde yer alan belge türlerine değinilmiştir. Belgenin diplomatik açıdan incelenmesinin ardından m.1717-1718 yıllarında Edirne'de sosyal, kültürel ve ekonomik yaşam başlıkları altında döneme ilişkin değerlendirilmelerde bulunulmuştur. Son bölümde 661 numaralı Edirne Şer'iyye sicilinin transkripsiyonlu metni verilmiştir. Edirne'nin kayıtlara geçmiş 84 mahallesinin adı, zikredilen han ve çarşı isîmleri, günlük yaşamda kullanılan eşyalar ve giysiler, mal paylaşımında İslâm hukukunun işleyişine dair izler barındıran şer'iyye sicilleri bizlere yeni ve derinlemesine araştırılması gereken bilgiler vermesi sebebiyle de önem arz etmekdir."
