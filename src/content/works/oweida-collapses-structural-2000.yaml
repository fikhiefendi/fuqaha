abstract: "İslam Ülkelerinde yapısalı çözüm politikaları ve insani gelişme üzerine etikleri Bu çalışmanın amacı, yapısal uyum programlarını köken, dayanak ve gerçek amaçları açısından tanımlamak, insani gelişme göstergeleri üzerindeki etkisinin açıklanmasıdır. Bu çerçevede tez, sağlık, eğitim, yaşam seviyesi başta olmak üzere gelişmekte olan ve az gelişmiş İslam ülkelerindeki iki gruptan oluşan çalışmanın örneklerinde yapısal uyum politikalarının insani gelişme göstergeleri üzerindeki etkisini ortaya çıkarıp, Yapısal uyum politikalarının insani gelişme göstergeleri üzerindeki etkisini yansıtan veri ve tabloları açıklamaktadır. Bu açıklamalar özellikle kişi başına düşen gayri safi yıllık hasıla (GSYİH), kişi başına düşen yılık artış hızı, eğitim ve sağlık için kamu harcama oranı, İnsani gelişme göstergelerinden oluşmaktadır. Araştırmacı, yapısal çözüm politikalarının insani gelişme göstergelere üzerinde olumsuz bir etkiye sahip olduğunu ve sefaletin ve insani sefaletin artmasına katkıda bulunduğu sonucuna varmıştır. Son olarak araştırmacı, söz konusu politikaların uygulanmasına ilişkin İslam iktisadının perspektifini sunarak bütçe açığını kapatmak için alternatif bir İslami yapısal reform yaklaşımı önermektedir."
