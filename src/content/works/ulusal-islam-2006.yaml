abstract: "Tez bir giriş, dört bölüm, sonuç ve bibliyografyadan oluşmaktadır.Uluslararası Andlaşma Kavramı, Mahiyeti ve Çeşitleri başlıklı birinci bölümdeuluslararası andlaşma kavramının geçmişte ve günümüzde müslümanlar tarafından neşekilde tanımlandığı, bugünkü uluslararası hukukta andlaşma kavramından neanlaşıldığı ve müslümanların terime yükledikleri anlamın bugün için bir geçerliliğininolup olmadığı araştırılmıştır. Ayrıca uluslararası andlaşma çeşitleri tarihsel olarak tahliledilerek bugün yapılan değişik konulu andlaşmaların slam Hukukunda sorun meydanagetirip getirmediği incelenmiştir.kinci bölümde ise andlaşmaları akdetmenin, Ku'an, Sünnet ve Sahabeuygulamaları çerçevesinde meşruiyeti incelenmiştir. Bu bölümde ayrıca bir uluslararasıandlaşmanın geçerli sayılabilmesi için bulunması gereken şartlar tahlil edilmiş;günümüz uluslararası hukukunda bu başlık altına konulmayan maslahat(müslümanların yararı) slam hukukçuları tarafından andlaşmanın geçerliliği içinolmazsa olmazlardan sayıldığı için bu bölümde ele alınmıştır.?Uluslararası aAndlaşmaların Yapılma ve Sona Erme Süreci? başlıklı üçüncübölümde andlaşmaların hazırlanması ve müzakere edilmesinden sona ermelerine kadargeçen safahat incelenmiş, andlaşmaları sona erdiren sebepler ve müslümanların birandlaşmadan çekilirken uymaları gereken hukukû ve ahlakû kurallar ele alınmıştır.Çalışmanın son bölümünde ise uluslararası andlaşmaların slam Hukuku'na görehukukun kaynakları arasına dahil edilip edilemeyeceği ve bu konudaki olumsuzyaklaşımların tahlili yapılmış, andlaşmalardaki icmâ`û ve ictihâdû boyut açığaçıkartılarak andlaşmaların hukukun kaynağı olarak değeri tespit edilmiştir. Ve nihayetyine bu bölümde uluslararası andlaşmaların meydana getirdiği hukukû sonuçlarincelenmiştir. Bu inceleme yapılırken her bir andlaşma çeşidinin taraflar için ortayaçıkardığı hak ve yükümlülükler yerine, bütün andlaşmalarda ortaya çıkan ortak etkilerbulunup inceleme altına alınmıştır."
