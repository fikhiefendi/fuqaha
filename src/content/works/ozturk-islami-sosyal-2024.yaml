abstract: "Sosyal finans, finansal sistemden faydalanamayan dezavantajlı ve sosyal olarak dışlanmış gruplara yönelik çeşitli faaliyetler yürütmektedir. Sosyal finans, geleneksel sosyal finans ve İslâmi sosyal finans olmak üzere iki önemli başlığa sahiptir. İkisi arasındaki temel fark İslâmi sosyal finans faaliyetlerinin, İslâm hukukuna uygun olarak yapılıyor olmasıdır. İslâm dininin beş şartından biri olan Zekât, aynı zamanda İslâmi sosyal finansın en önemli kurumudur. Zekâtın meşruiyetine ilişkin hükümleri İslâm dininin temel kaynakları olan Kur'an, Sünnet ve İcmâ da bulmak mümkündür. Hem dinin hem de İslâmi sosyal finansın önemli bir kurumu olan zekât, bazı Müslüman ülkelerde bireylerin kendi inisiyatifine bırakılırken, bazı Müslüman ülkelerde gönüllülük, bazılarında ise zorunluluk esasına dayalı olarak toplanmaktadır. Bu ülkelerin genelinde zekât devlet kurumu tarafından toplanmaktadır. İslâmi Araştırma ve Eğitim Enstitüsü'nün (IRTI) 2020 yılında yayınladığı“İslâmi Sosyal Finans Raporu”nda zekâtın devlet eliyle topladığı bazı ülkelerde, mükelleflerin bu kurumlara vermeyi tercih etmediklerini bunun sebebinin ise toplumun bir kesiminin zekât kurumlarına az veya hiç güvenmemesinden kaynaklandığı belirtilmektedir. Bu çalışmada, İslâm'ın temel prensiplerine uygun, toplumun bütün paydaşları tarafından güvenilen, devletin sadece düzenleyici ve denetleyici bir rol üstlendiği yönetim, koordinasyon, denetim, eğitim ve iletişim olmak üzere beş temel fonksiyona sahip Kurumsal Zekât Sistemi önerilmektedir. Ülkemizde faaliyet gösteren ve İslâmi Sosyal Finans'a çok büyük katkısı olan altısı dini grup olmak üzere on sekiz STK'nın zekât faaliyetlerine ilişkin yönetim kabiliyeti ve yöntemlerine ulaşmak amacıyla internet sayfaları ile faaliyet raporları incelenmiş ve yöneticileriyle yüz yüze görüşmeler yapılmıştır. STK'lar Zekât Gözetim Merkezi tarafından fıkhi, idari ve mali denetimine olumlu yaklaşırken, dini cemaatlerin daha temkinli oldukları gözlemlenmiştir. STK'ların genelinde dini cemaatlerin veya grupların böyle bir denetim mekanizmasına dâhil olmak istemeyecekleri görüşü hâkimdir. Bunun nedeni ise doğası gereği insan kaynağı ve organizasyonel yapılarının yüksek güven unsuruna sahip olmasına bağlamaktadırlar. Sonuç itibarıyla Türkiye'de zekât özelinde yeterince şeffaf ve hesap verebilir bir yapının olmadığı; koordinasyon şeffaflık ve denetim gibi konularda sorunların olduğu görülmektedir. Çalışmada, hem zekât kurumlarına sahip ülkelerde hem de Türkiye'de zekâtın toplanması ve dağıtılmasına yönelik tespit edilen sorunların çözümüne yönelik öneriler sunulmaya çalışılmıştır."
