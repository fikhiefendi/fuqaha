abstract: "Lafızlar, kapsamları göz önünde bulundurularak usûlcüler tarafından âm, hâs, müşterek ve müevvel olarak taksim edilmiştir. Bunun yanı sıra lafzı kayıtlayan herhangi bir kaydın bulunup bulunmamasına ya da delâlet ettiği mânanın yalın olup olmamasına göre lafızlar mutkak ve mukayyed olarak tasnif edilmiştir. Araştırmamızda bunlardan âm ve mutlak kavramları ele alınmıştır. Her iki kavram mütekellim ve fukahâ usûlcülerin yaklaşımları doğrultusunda karşılaştırmalı olarak incelenmiştir. Ancak bu iki kavramın vaz'ı ve delâleti ile ilgili önemli tartışmalar bulunduğundan birinci bölümde vaz' ve delâlet kavramlarıyla bunların her birisinin kısımları ele alınarak âm ve mutlak kavramları bu iki kavram çerçevesinde vaz' ve mantık ilimleri bağlamında incelenmiştir. İkinci bölümde, âm ve mutlak kavramları, tanım, delâlet ve her ikisine ait lafızlar ile bunlara bağlı konular açısından incelenmiştir. Özellikle mutlak kavramı hakkında meydana gelen ihtilaflar ve bu ihtilaflar sonucunda fukahâ usûlcüler tarafından hâs kapsamında ve mütekellim usûlcüler tarafından âm bağlamında incelenmesinin nedenleri tespit edilmiştir. Bu iki kavramın delâlet boyutu fıkıh usûlü açısından beyân, nesih ve tahsis gibi konularla ilişkili olduğundan bunların konuyla ilgili yönleri de ele alınmıştır."
