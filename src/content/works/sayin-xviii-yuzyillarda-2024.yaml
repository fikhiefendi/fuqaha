abstract: "Çok uluslu bir yapıya sahip olan Osmanlı Devleti, halkı etnik grup veya uyruk ayrımı yapmaksızın sadece mensup oldukları dinlere göre gruplara ayırmış, nüfusun neredeyse yarısını oluşturan gayrimüslim halkın kimliklerini kaybettirmeden ve Müslüman olmaya zorlamadan devlet sona erene kadar bir düzen içerisinde yaşamalarını sağlamıştır. Gayrimüslimler Osmanlı Devleti içerisinde ya otonom bir yapıya sahip olmuşlar ve her türlü hukuki durumda kendi dini lider ve kurumlarının hukukuna bağlı yaşamışlardır ya da Osmanlı halkının sahip olduğu hukuk sistemine bağlı yaşayarak kendilerine bir ölçüde serbestiyetlik oluşturmuşlardır. Bu çalışmada gayrimüslim halkın yaşadığı dönemin fotoğrafı sunulup o dönemde gayrimüslim halkın müftülere danıştığı aile hukuku meselelerini ele almaya çalıştık böylece gayrimüslim halkı Osmanlı Devleti'nde ayrımcılığa tâbi tutulmadığı bilakis onlara özel bir yer ve konum verildiği görülmüştür."
