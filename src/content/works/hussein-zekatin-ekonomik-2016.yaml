abstract: "Devlet bütçesi açısından önemli bir gelir kaynağı sayılan ve İslam dininin temel emirlerinden biri olan zekât bu çalışmada incelenmeye çalışılmıştır. Çalışmanın ilk bölümünde araştırmanın amacından ve yönteminden bahsedilerek Irak Devleti kapsamında vergi sistemi incelenmiştir. Verginin ne şartlar altında uygulandığı, geçmişten günümüze kadar olan dönemlerde uygulanan farklı vergi tahsil yöntemleri ile günümüzde uygulanan yöntemler incelenmiştir. İkinci bölümde devletin genel bütçesi açısından vergi konusu incelenmiş neden vergi alındığına vurgu yapılmıştır. Üçüncü bölümde ise Kuran-ı Kerim ve hadisler ışığında zekât konusu işlenmiştir. Bu çalışmanın hedefi, zekât kanunu ve vergi hukukunun birleştirilmesiyle devlet genel bütçesinin zekât ile finanse edilebileceğini ve bir kaynak olarak kullanılabileceğini ve bunun genel bütçe üzerindeki pozitif etkisini göstermektir. devlet bütçesine yapılacak katkının olumlu yönlerini araştırmaktır."
