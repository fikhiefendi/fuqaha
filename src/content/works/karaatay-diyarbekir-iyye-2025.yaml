abstract: "Bu tez, 19. yy. Osmanlı Diyarbekiri'ne ait şer'iyye sicillerindeki evliliğin sonlanması vakalarını inceleme konusu edinmekte ve İslam hukuku açısından tahlile tabi tutmaktadır. Araştırmada, Osmanlı Diyarbekiri'nde şer'î mahkemelere intikal eden ilgili vakaların neler olduğu, mahkemenin bu davaları ne şekilde çözüme kavuşturduğu, bu süreçteki İslam hukuku tatbikatının niteliğinin nasıl olduğu gibi sorulara cevap aranmıştır. Çalışmanın veri tabanını 19. yüzyıl Diyarbekir şer'iyye sicilleri oluşturmaktadır. Birinci elden tarihi ve hukuki vesikalar olan şer'iyye sicilleri, özel olarak Osmanlı Diyarbekiri genel olarak da Osmanlı toplumu ve hukuk pratiğine dair son derece kıymetli veriler sunmaktadır. Çalışmada araştırma dönemi olarak, İslam-Osmanlı hukukunun son dönemini yansıtan 19. yüzyıl; bölge olarak da birçok farklı etnik ve dinî kimliği bünyesinde barındıran, bu özelliğiyle Osmanlı Devleti'nin küçük bir nüvesi mesabesinde olan Diyarbekir şehri seçilmiştir. Tez, giriş ve iki bölümden oluşmaktadır. Giriş kısmında Diyarbekir'in genel bir tarihçesi ile 19. yüzyıldaki idarî, kazâî ve sosyal durumu kısaca ele alınmıştır. Birinci bölümde“evliliğin sona ermesi”; ikinci bölümde de“evliliğin sona ermesinin hukuki sonuçları”ile ilgili sicil kayıtları İslam hukuku açısından tahlile tabi tutulmuştur. Tezin temel kaynaklarını, 19. yüzyıla ait Diyarbekir şer'iyye sicil defterleri ile klasik ve çağdaş İslam hukuku çalışmaları oluşturmaktadır."
