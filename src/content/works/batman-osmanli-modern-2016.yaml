abstract: "Bu çalışmanın amacı, Debreli Vildan Faik Bey'in el-Multeḳaṭ fî usûlü't-tefsîr adlı eseri örneği üzerinden Osmanlı modern dönemi tefsir usulü anlayışına dair fikir sahibi olmak ve daha önce üzerinde çok fazla bir çalışma yapılmamış müellifi ve eserini gün yüzüne çıkarmaktır. Konu seçiminde Vildan Faik Bey'in Osmanlı İlmiye Teşkilatındaki konumu, sosyal yönü ve müellifin üzerinde araştırma yaptığımız eserinin görev yaptığı medresede tefsir usûlü derslerinde kaynak olarak kullanılması, etkili olmuştur. Çalışmamızın ilk kısmı eserin müellifi Debreli Vildan Faik Bey'e ayrılmıştır. Burada müellifin hayatı, eğitimi, ilmî şahsiyeti ve müfessir kimliğiyle Osmanlı İlmiye Teşkilatı içerisindeki konumu hakkında bilgi verilmektedir. Ayrıca bu bölümde kısaca müellifin sosyal ve siyasal ilişkileri de incelenmiştir. İkinci bölümde ise Vildan Faik Bey'in eseri el-Multeḳaṭ fî usûlü't-tefsîr, mercek altına alınmaktadır. el-Multeḳaṭ'ın belirlenen kaynakları zikredilmiş ve bunlar arasında müellifin kendisinden en fazla istifade ettiği ana kaynakları tespit edilmiş daha sonra el-Multeḳaṭ'ın klasik Kur'ân İlimlerine dair on dört konu başlığı incelenmiştir. Eserde var olan on dört konu başlığının incelenmesi sonucunda el-Multeḳaṭ'ın Kur'ân ilimlerine dair özgün bir eser olmadığı ve dolayısıyla Osmanlının, son dönemine kadar medrese bünyesinde yürüttüğü tefsir eğitiminde klasik usûlden vazgeçmediği belirlenmiştir."
