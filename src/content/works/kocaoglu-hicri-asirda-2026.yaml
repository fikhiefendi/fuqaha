abstract: "İslâm hukukunda hükümlerin belirlenişi, ilâhî hitabın mükellefin fiilleri hakkında yönelttiği talep, zecir ve ibâha bildiren lafızların delâletinin nasıl anlaşıldığına dayanır. Emir ve nehiy sîgaları, yalnızca ibadetlerde değil, muamelât ve toplumsal ilişkilerde de normatif düzenin temelini oluşturan talep bildiren yapılardır. Bu kiplerin bağlayıcılığı, delâlet düzeyi ve hükme dönüşme süreçleri; dilin mahiyeti, kasdın rolü, lafzın anlamla ilişkisi, hüsn–kubuh gibi köklü kelâmî meselelerle yakından irtibatlıdır. Dolayısıyla emir ve nehiy, fıkhî bir tartışma olmanın ötesinde, kelâmî varsayımlarla şekillenen teorik bir çerçevenin ürünüdür. Hicrî IV. asır Bağdat entelektüel ortamı, bu teorik inşanın en yoğun biçimde ortaya çıktığı zemindir. Hanefî, Eşʿarî ve Muʿtezilî geleneklerin aynı şehirde fikrî rekabet ve etkileşim içinde bulunması, emir-nehiy konusundaki lügavî ve kelâmî tahlillerin keskinleşmesini sağlamıştır. Bu çerçevede Cessâs, Bâkıllânî ve Kādî Abdülcebbâr'ın metinleri, ekollerin konuya nasıl yaklaştığını karşılaştırmalı biçimde izlemeye imkân vermektedir. Metin merkezli bir okuma üzerinden yapılan çözümlemeler, her bir ekolün emir ve nehiy anlayışını kendi kelâmî öncelikleri doğrultusunda temellendirdiğini göstermektedir. İlâhî iradenin tasavvuru, fiillerin değerinin aklî veya şer'î oluşu ve delâlet teorisine dair kabuller, emir ve nehiy yorumlarındaki temel ayrışmaları belirleyen ana eksenler hâline gelmiştir. Böylece emir–nehiy teorisinin, hükmün teknik oluşumunu aşarak, İslâm düşüncesinin kelâmî ve epistemolojik derinliklerinde köklenen bir yapı arz ettiği ortaya çıkmaktadır."
