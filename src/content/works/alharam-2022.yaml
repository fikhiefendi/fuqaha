abstract: "Çalışma, Körfez ülkelerinde petrol öncesi ve sonrası kalkınma gerçekliğini ele almaktadır. Çalışmanın hedefi ise petrol rantlarının kapsamlı ve sürdürülebilir kalkınma göstergeleri üzerinde yol açtığı değişiklikleri ve ekonomik ve sosyal hayatın gerçekliği ve İslam ekonomisinin araçları üzerindeki etkisinin boyutunu incelemektir. Aynı zamanda son elli yıl boyunca Körfez ülkelerinin petrol rantı ile teamül tarihi açısından sürdürülebilir kalkınmanın geleceğini anlama girişimidir. Bu araştırmada Körfez'deki kalkınma gerçekliğine ulaşmak için kısmî ve tam tümevarımda temsil edilen çeşitli bilimsel yöntemler kullanılmıştır. Bu, genel kalkınma gerçekliğini bilmeye yol açan kısmi vakalar ve petrol rantının Körfez Arap Ülkeleri İşbirliği Konseyi ülkelerine ve bu ülkelerdeki kalkınma göstergelerine etkisi incelenerek yapılmıştır. Ayrıca Arap Körfezi ülkelerindeki kalkınma sürecini tanımlama ve analiz etmede ve İslam ekonomisi teorisi aracılığıyla bu süreci çözmenin yol ve yöntemlerini bulmak adına eksikliklerinin nedenlerini araştırmak için betimleyici analitik yaklaşıma dayanılmaktadır. Aynı zamanda İslam mirası kitaplarından İslamî teorinin esaslarını istinbat etmek için tarihsel yöntem, İşbirliği Konseyi ülkelerindeki rantın kalkınma üzerindeki etkisinin boyutu hakkında bilimsel bir yargıya varmak için tümdengelim yöntemi kullanılmıştır. Çalışmada çeşitli sonuçlara ulaşılmıştır. Petrol rantı, halkların kalkınma süreçlerindeki rolünü marjinalleştirmenin yanı sıra, mutlak güçlere sahip otoritenin elinde güç ve zenginliği tekelleştiren bir toplumsal sözleşme oluşturma etkisine sahiptir. Aynı zamanda devletin özel sektör ve sivil toplum üzerindeki kontrolü, sosyal yaşam düzeyi üzerinde önemli bir etkiye, sürdürülebilir kalkınmadaki eksikliklere ve toplumların yaşamlarında İslam ekonomisinin gerçekliği üzerinde bir etkiye yol açmıştır."
