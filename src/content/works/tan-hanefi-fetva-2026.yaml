abstract: "Bu çalışma, 4.-7./10.-13. yüzyıllarda Mâverâünnehir havzasında telif edilen Hanefî fetva literatüründe Kitābu's-Seriḳa (Hırsızlık) bahsinin gelişimini incelemektedir. Araştırmanın temel amacı, naslarla sabit olması hasebiyle çağdaş literatürde çoğunlukla değişmez kabul edilen had cezalarından biri olan hırsızlık suçu ve cezasının, mezhep içi istidlâl metotları ve pratik ihtiyaçlar doğrultusunda zaman ve mekâna bağlı olarak nasıl bir gelişim sergilediğini ortaya koymaktır. Tezin zeminini oluşturmak maksadıyla 6./12. yüzyılın önde gelen furûʿ fıkıh eserlerinin tasnif ve muhtevası mezcedilerek referans niteliğinde kapsamlı bir Kitābu's-Seriḳa çerçevesi inşa edilmiştir. Ardından dönemin fetva literatürü konuyla ilgili biçim ve içerik özellikleri açısından analiz edilmiş ve uygulama örneği olarak“mağdurun hırsızı katli”meselesinin furûʿdaki dağınık yapısından sıyrılarak fetva eserlerinde müstakil bir meşru müdafaa (defʿu'ṣ-ṣāʾil) alt başlığına dönüşümü incelenmiştir. Bulgular, en azından hırsızlık meseleleri açısından fetva literatürünün furûʿ metinlerinin dönemsel bir tekrarından ibaret olmadığını, aksine meseleleri pratik ihtiyaçlara göre seçen, yeniden bağlamlandıran ve işlevselleştiren aslî bir mecra olduğunu göstermektedir. Bu tespitin somut bir örneği olarak bu araştırma, Hanefî ceza hukukunda hırsızlık suçunun cezası sabit olmakla birlikte hükmü çevreleyen zaman ve mekâna bağımlı oluşları itibariyle çalınan malın vasıfları, malı koruma yöntemleri, yargılama ve ispat usullerinin dinamik bir gelişim seyri izlediğini ortaya koymaktadır. Araştırmada karşılaştırmalı metin analizinin yanı sıra, literatürün aktarım dinamiklerini ölçmek üzere metin yeniden kullanımı (text reuse) ve sosyal ağ analizinden (SNA) yararlanılarak çok katmanlı bir metodolojiyle hem tarihsel gelişim hem doktriner teşekküllerin analiz edildiği ve benzer çalışmalarda tekrarlanabilecek bir araştırma izleği ortaya konmuştur."
