abstract: "Bu tez çalışmasında İbn Kayyım el-Cevziyye'nin (ö. 751/1350) tasavvuf anlayışı ve tasavvufî görüşleri, Herevî'nin Menâzilü's-sâirîn'e şerh niteliğinde kaleme aldığı ve tasavvufî mertebeleri içeren Medâricü's-sâlikîn'i üzerinden incelenmiştir. İbn Kayyım'ın tasavvufa bakışı, sûfîlere katıldığı ve eleştirdiği noktaları ortaya koymak, onun durduğu yeri görebilmek için önemlidir. Çünkü tasavvufun İslam'da yeri olmadığını söyleyen klasik ya da çağdaş yaklaşımların esas aldığı isimlerden birisi de İbn Kayyım'dır. Bu kapsamda İbn Kayyım'ın tasavvuf anlayışını, Gazzâlî öncesi dönemde yaşayan klasik tasavvuf yazarlarıyla mukayeseli bir şekilde ele alarak, İbn Kayyım'ın tasavvuf karşıtı olup olmadığını; hangi konularda sûfîlerle örtüştüğünü veya ayrıştığını açıklığa kavuşturmaya çalıştık. Çalışmanın birinci bölümünde“Bir Din İlmi Olarak Tasavvuf ve Bilgiye Dair Temel Kavramlar”başlığı altında ilim, marifet, hikmet, basiret, rüya, yakîn, mükaşefe ve müşahede olmak üzere sekiz konu işlenmiştir.“İbn Kayyım'a Göre Tasavvufî Haller ve Makamlar”başlığını taşıyan ikinci bölümde onun zühd, tevbe, riyazet ve mücahede gibi konulara bakışı ele alınmıştır. Üçüncü bölümde ise daha çok tasavvufun eleştiri aldığı tevhit, fena-beka, cem-fark, sekr-sahv, sema, fütüvvet konuları“İbn Kayyım ve Tasavvufun Tartışmalı Meseleleri”başlığı altında araştırılmıştır. Sonuç olarak İbn Kayyım'ın Gazzâlî öncesi sûfî müelliflerden ayrıştığı noktalar bulunmakla birlikte, İbn Kayyım üzerinden“tasavvuf karşıtlığı”türetmek mümkün görülmemektedir. İbn Kayyım'ın tasavvufu külliyen reddetmek yerine, eleştirel ve yapıcı bir dil geliştirdiği ve bu düşünceden hareketle, tasavvufu“anlama çabası”içinde olmayı tercih ettiği görülmektedir."
