abstract: "Çalışma üç bölüm halinde hazırlanmıştır. Birinci bölümde; Şahitlik kavramı, önemi, hükmü, tahammül ve edası, delilleri, gayesi açıklanmıştır. İkinci bölümde; şahitliği edanın emredilmesi ve delilleri, şahitliği gizlemenin yasak olduğu konular olan akitlerde ayıbın gizlenmesi ve kısas gerektiren suçlar açısından gizleme konusu üzerinde durulmuştur. Ayrıca şahitliği edanın hikmetleri anlatılmıştır. Üçüncü bölümde; şahitliğin gizlenmesi istenilen konular açıklanmıştır. Bu bölümde şahitliği gizleme ilkesinin delilleri, kapsamı, amaçları anlatılmıştır. Şahitliği gizlemenin meşru olduğu konular olan had ve tazir cezası gerektiren suçlarda şahitliği gizlemenin gerekliliği açıklanmıştır. Şahitliği gizleme ilkesinin sınır ve istisnaları anlatılmıştır. Sonuç bölümünde ise şahitliği gizleme konusunun önemi ve değerlendirilmesi yapılmıştır."
