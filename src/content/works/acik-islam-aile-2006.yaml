abstract: "İslam dininde evliliğin devamı esastır. Evliliğin devam etmesi içinbaşvurulacak tüm çareler tükenmedikçe boşanma bir çözüm olarak öngörülemez.Kuran'da eşlerin geçimsizliği durumunda boşanma aşamasına gelinmeden önceizlenmesi gereken belli bir prosedürün varlığına işaret edilir. Eşlerin, geçimsizliğisona erdirmek için gösterecekleri gayretin sonuçsuz kalması durumunda Kuranailenin yakınlarına da sorumluluk yükler ve aileye eşlerin arasını düzeltmek üzerehakem göndermelerini bildirir.Gönderilen bu hakemler durumu bire bir taraflardan edindikleri bilgilerdoğrultusunda incelerler. Öncelikle tarafların arasını düzeltmeye çalışırlar. Bukonudaki girişimleri sonuçsuz kaldığı ve ayrılıktan başka çözüm yolubulunamadığı takdirde tefrik söz konusu olur. Bu durum da hakemler geçimsizliğesebep olan tarafa bağlı olarak ıvazlı ya da ıvazsız şekilde bir bain talakla taraflarıayırırlar. Bundan sonra hakemlerin kararlarının hâkime arz edilmesi de kararınmahkeme kararı gibi müeyyideli bir hüküm halini alması ve tarafların itirazhaklarını kullanabilmeleri bakımından gereklidir.Tahkim usulünü bilmek ve uygulamak bu usulün güvene dayalı, hızlı vepratik bir çözüm yolu olması bakımından aile hukuku için son derece önemlidir.Böyle bir usulün uygulanması ile hem genel yargının üzerindeki yük hafifletilebilirhem de çok uzun süren boşanma davaları ya da küçük nedenlere dayanarakgerçekleştirilen boşanmalarla tarafların görebilecekleri zarar ortadan kaldırılmışolur."
