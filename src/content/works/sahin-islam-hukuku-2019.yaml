abstract: "İslâm dışında herhangi bir din mensubuna benziyor olmak veya benzemeye çalışmak, fıkhî açıdan kerih görülen bir durumdur. Çalışmada bu kerahetin hangi durum ve şartlarda, hangi konularda söz konusu olacağı konu edilmektedir. Ayrıca, nasslarda açıkça beyan edilen teşebbühten sakındırma yaklaşımının, hakkında açık bir hüküm bulunmayan konularda hükme ulaşmada bir ilke olarak esas alınabilirliği ele alınmıştır.“Teşebbüh”kavramının işlevselliği ifadesiyle, bu esas alınabilirlik kast edilmektedir. Araştırmanın amacı İslâm hukuk tarihinde“teşebbüh”kavramı ile ifade edilen“benzemekten sakınma”anlayışının, bugüne kadar hangi konularda hükme ulaşmada bir ilke kabul edildiğini tespit ederek, günümüzde hangi benzeşmelerin bu kapsamda değerlendirileceğini ortaya koymaya çalışmaktır. Çalışmanın birinci bölümünde başta teşebbüh olmak üzere kavramlar incelenmiş, ilgili nasslara değinilmiştir. Dinen sakıncalı kabul edilen teşebbühün kıstasları ayrı başlıklar halinde incelenmiştir. İkinci bölümde, kaynaklarda geniş kapsamlı bir kullanıma sahip olan teşebbüh çeşitleri ele alınmıştır. Teşvik edilen olumlu yönleri ve kadınlar-erkekler arasında teşebbüh gibi yerilen olumsuz tarafları araştırmanın kapsamına alınmıştır. Hem itikadî hem de fıkhî açıdan teşebbühün hükmü tahlil edilmiştir. İslâm hukukunda, mekasıd-ı şerîa arasında birinci sırada zikredilen“dinin korunması”gayesi ile“teşebbühten sakınma”arasında yakın bir ilişki olduğu tespit edilmiştir. İslâm'ın Müslümanlara kazandırdığı kimlik ve izzeti korumaya çalışmanın her Müslümanın görevi olduğu bilinmektedir. İslâm dışında her hangi bir dine veya inanç sistemine ait“şiâr”olma özelliği taşıyan konularda benzemeye müsade edilmediği, benzeme kastı taşımasına bakılmaksızın teşebbühün haram kabul edildiği görülmektedir. İslâm'a özgü ibadet ahkâmında da, başka dinleri çağrıştıran unsurlardan şiddetle sakındırılmıştır. Herhangi bir dinî yönü bulunmayıp insanlara bireysel veya toplumsal anlamda yarar sağlayan konularda, İslâm dışında kişi ve toplumlara benzmenin/benzer olmanın mübah kabul edildiği anlaşılmıştır. Benzemeye çalışmanın veya benzer görünümlere sahip olmanın hükmünün, kişinin niyetine ve kastına göre değişebileceği, teşebbühün hükmünün, benzemenin yol açacağı sonuçlara göre mekruh, mübah veya mendup olabileceği sonucuna ulaşmak mümkündür."
