abstract: "“Hicrî XV. Asırda Kürt Âlimlerin Fıkıh ve Fıkıh Usûlü ile İlgili Çalışmaları”isimli bu çalışma, hicrî on beşinci yüzyılda Kürt ulemasının özellikle fıkıh ve usûlu'l-fıkıh alanındaki çabalarını kapsamaktadır. Önsöz, giriş, üç bölüm ve sonuç kısımlarından oluşan bu çalışma, Kürt ulemasından bir bölümünün biyografisi ve fıkha dair görüşlerini ihtiva etmektedir. Önsözde konunun önemi ve seçilme nedeninin yanı sıra benzer çalışmalara yer verilmiştir. İki alt başlıktan oluşan giriş kısmının birinci alt başlığında konu başlığında geçen kavramlar açıklanmıştır. İkinci başlıkta Kürtler'in tarihi ve inşa ettikleri medreseler aracılığıyla islamî ilimlere katkıları ve İslam tarihinin farklı dönemlerinde yetiştirdikleri önemli şahsiyetler hakkında bilgi verilmiştir. Birinci, ikinci ve üçüncü bölümlerde ise hicrî on beşinci yüzyılda gayret ve eserleriyle sıyrılmış çağdaş Kürt simalarının tanıtılmasına gayret edilmiştir. Bu çalışmada, Kürtlerin ileri gelen şahsiyetlerine ait biyografik bilgiler, araştırmacıları aşağıda verilen sonuçlara ulaştıracaktır. -Kürt milleti İslam âlemine birçok âlim kazandırmış ve İslamî İlimlerin gelişimine güçlü bir katkı sunmuştur. Ayrıca Kürt bilginlerin özellikle fıkıh ve fıkıh usûlü alanında önemli katkıları, bilim dünyasının dikkatini çekmeye değer önemli çalışmaları ve İslamî ilimler alanında payları vardır. Çalışma, araştırma neticesinde elde edilmiş bulguların ve önerilerin sunulduğu sonuç bölümü ve yararlanılan kaynakları barındıran kaynakça ile son bulmaktadır. Umarım bu mütevazı çalışmam ile bahse konu âlimlerin çalışma ve çabalarına yakışır bir katkı sunmuş olurum. Yüce Allah'tan İslam dinine, âlimlerine ve İslamî ilimlere hizmet konusunda beni başarılı kılmasını dilerim."
