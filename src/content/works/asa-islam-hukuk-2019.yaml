abstract: "İslam hukuk metodolojisinde temel kaynaklar olması hasebiyle, naslar arasında yer alan mana ve ilişki son derece önemlidir. Kur'ân ve sünnetin hükümlerinin iyi anlaşılması ve bunların muhatabı konumunda olan insanın ondan faydalanabilmesi için, Kur'ân, Sünnet ve diğer şer'î delillerin delâletlerinin iyi anlaşılması gerekir. Deliller arasında meydana gelen teâruz ve tercih işlemleri, İslam hukukunun doktrin olarak gelişimine katkı sunmuştur. Deliller arasında meydana gelen teâruz, fıkıh usûlünün önemli konularından biridir ve birçok konu ile ilişkilendirilir. İctihâdî bir faaliyet olan teâruz ve tercih işlemlerinde temel gaye, şer'î delillerin hükümlerini doğru anlamak ve doğru yorumlamaktır. Deliller arasında meydana gelen teâruzu ortadan kaldırmaya yönelik; cem' ve te'lîf, nesih, tercih ve tesâkut gibi yöntemler uygulanmaktadır. Her bir kavram esasen bir araştırma konusu olup, çalışmamızda cem' ve te'lîf kavramı üzerinde durulacaktır. Teâruzu ortadan kaldırma ve tercih metodlarını uygulamaya yönelik kullanılan bu yöntemlerin sıralamasında, müçtehidin mezhepsel bakışı, delillere yüklediği anlam etkili olmaktadır. Bazı bilginler nesih yöntemini sıralamada önce alırken; bazı bilginler ise cem' ve te'lîf yöntemini öne almışlardır. Bu durumun sebep ve sonuçları çalışmamızda değerlendirilmektedir. Tezimiz giriş ve sonuç dışında üç bölümden oluşmaktadır; birinci bölümde İslam hukuk metodolojisinde deliller, ikinci bölümde teâruz kavramı ve üçüncü bölümde ise cem' ve te'lîf üzerinde durularak tezimiz nihayete erecektir."
