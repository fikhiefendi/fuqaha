abstract: "Bu çalışma, Türkiye'nin sosyal yardım sisteminin temel uygulayıcısı konumundaki Sosyal Yardımlaşma ve Dayanışma Vakıflarının (SYDV) kurumsal performansını kapsamlı ve sistematik bir yaklaşımla değerlendirmeyi amaçlamaktadır. Araştırma, sosyal yardımların etkin dağıtımı ve yoksullukla mücadelede kritik rol oynayan SYDV'lerin kurumsal kapasitesini güçlendirmeye yönelik stratejik bir çerçeve sunmaktadır. Araştırmada, Aile ve Sosyal Hizmetler Bakanlığı'nın 2023 yılı performans verileri kullanılarak, SYDV'lerin kurumsal performansı Balanced Scorecard (BSC)'nin dört temel perspektifi çerçevesinde analiz edilmiştir. BSC metodolojisi SYDV'lerin yapısına uyarlanarak finansal perspektif“Sosyal Yardım Perspektifi”, müşteri perspektifi“Hedef Kitle Perspektifi”, iç süreçler perspektifi“Sistematik Yardım Süreçleri Perspektifi”ve öğrenme-büyüme perspektifi“Dijital Altyapı Perspektifi”olarak yeniden yapılandırılmıştır. Her bir perspektif için SYDV'lere özgü performans göstergeleri belirlenerek, vakıfların etkinlik ve verimliliği çok boyutlu olarak değerlendirilmiştir. Analiz sonuçları, SYDV'lerin sosyal yardım programlarının etkinliği ve yararlanıcılara erişim düzeyinin yüksek olduğunu gösterirken, özellikle istihdam odaklı desteklerde hedeflerin altında kalındığı tespit edilmiştir. Bütünleşik Sosyal Yardım Bilgi Sistemi'ne 29 farklı kurumun entegrasyonu sağlanarak kurumlar arası koordinasyon güçlendirilmiş, ancak yerel düzeyde hizmet kapasitesinin geliştirilmesi ihtiyacı belirlenmiştir. Özellikle 2023 yılında yaşanan deprem sürecinde SYDV'lerin acil durum müdahale kapasitesinin önemi ortaya çıkmıştır. Bu çalışma, kâr amacı gütmeyen kuruluşlarda BSC uygulaması için özgün bir model sunarak literatüre katkı sağlamakta ve sosyal yardım sisteminin etkinliğini artırmaya yönelik politika önerileri geliştirmektedir. Araştırma sonuçları, SYDV'lerin kurumsal kapasitesinin güçlendirilmesi, istihdam odaklı desteklerin yaygınlaştırılması ve yerel düzeyde koordinasyon mekanizmalarının iyileştirilmesi gerektiğini ortaya koymaktadır. Gelecek araştırmalar için her bir SYDV'nin kendi yapısına özgü BSC uygulamalarının geliştirilmesi ve sosyal etki ölçümünün sistematikleştirilmesi önerilmektedir."
