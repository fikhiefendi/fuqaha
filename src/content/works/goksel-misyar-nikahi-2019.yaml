abstract: "İslâm'da evlilik kurumu, önemli bir değere sahiptir. Bu kurumun ilk basamağını, tarafların anlaşması doğrultusunda gerçekleştirilen nikâh akdi oluşturmaktadır. Genel itibariyle nikâh, gerekli şartları kendisinde barındıran ve eşler arasında birlikteliği meşrulaştıran bir akittir. Nikâh akdini ise şart ve rükünler oluşturmaktadır. İslâm hukukunda bir nikâhın sıhhat derecesi, şart ve rükünler açısından değerlendirilmektedir. Bundan dolayı İslâm hukukçuları nezdinde nikâhlar, genel olarak meşru ve gayr-i meşru şeklinde iki türe ayrılmaktadır. Bazı nikâhlar ise meşru ve gayr-i meşru şartları taşımasından dolayı hukukçular nezdinde ihtilaflı görülmüştür. İhtilaf edilen nikâh türlerinden birisi de misyar nikâhıdır. Misyar nikâhı özellikleri itibariyle klasik ve önceki dönemlerdeki nikâh çeşitleriyle benzerlik taşımaktadır. Fakat uygulama ve ayırt edici vasıflarıyla farklılık arz etmektedir. Yaklaşık yarım asırlık bir geçmişe sahip olması ve son dönemlerde misyar nikâhının caiz olup olmadığı hakkındaki soruların çoğalması dikkat çekmektedir. Bu yaklaşımların bir gereği olarak günümüzde şer'i bağlamda tartışılan ve gündemde tutulan konulardan birisidir. Misyar hakkında bazı çevrelerce farklı fikirler ortaya atılmaktadır. Bu gerekçelerden dolayı misyar nikâhının araştırılması uygun bulunmuştur. Söz konusu bu çalışma, misyar nikâhının sıhhat derecesini tespit etmek için yapılan bir araştırmadır. Çalışma süresince misyar hakkında farklı tespitler yapılmış, İslamiyet'ten önce ve İslamiyet'ten sonra uygulanan nikâh türleriyle mukayese edilmiştir. Ayrıca çalışma misyar nikâhının; tanımını, şart ve rükünlerini, oluşum ve gelişim sebeplerini konu edinmektedir. Bunun yanında ittifak ve ihtilaf edilen görüşler ele alınmış ve tespit edilen nükteler yansıtılmıştır."
