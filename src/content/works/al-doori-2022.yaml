abstract: "Bu araştırma, giriş ve dört bölümden oluşmaktadır. Girişte İslam hukukunda örf ile ilgili genel bilgiler verilmektedir. Birinci bölüm, örfün Irak kanunlarında evlilikle ilgili hükümlere etkisini ayrıntılı olarak ele almaktadır. İkinci bölüm ise örfün boşanmayla ilgili hükümlere etkisi hakkındadır. Üçüncü bölüm, nafaka ile ilgili hükümlere örfün etkisini ve kanuni durumunu ele almaktadır. Dördüncü bölümde ise, örfün çocuk ve bakımına ilişkin hükümlere etkisi incelenmektedir. Girişte dört alt başlık bulunmaktadır. Birinci başlıkta, örfün İslam hukundaki yerinden, ikincisinde, örfün kanundaki statüsünden, üçüncüsünde, örf ile ilgili kavramlardan, dördüncüsünde ise kanunen geçerli olabilmesi için örfün taşıması gereken şartlardan bahsedilmektedir. Birinci bölümde, ilk olarak örfün evliliğe etkisinden, ikinci olarak, örfün nafaka üzerindeki etkisinden, üçüncü olarak ise örf ve hukukun boşanmaya ilişkin hükümlere etkisinden söz edilmektedir. Üçüncü bölümde dört konu yer almaktadır: Birinci konu boşanmanın tanımından, ikinci başlıkta örf ve adetlerin boşanma hükümlerine etkisinden bahsederken, üçüncü başlıkta Irak Ahval-i Şahsiyye Kanununda tadil edilen boşanmanın yasal hükmünden bahsedilmektedir. Dördüncü olarak da boşanma türleri ve etkilerine değinilmiştir. Üçüncü bölümde, nafaka ile ilgili hükümler üzerinde örfün kanuna etkisinden ayrıntılı olarak bahsedilmiştir. Dördüncü bölüm ise çocuklar ve bakımları ile ilgili iki bölümden oluşmakta olup, birinci konu çocuğun tanımı ve örf ve hukukta çocuk hakları, ikinci konu ise örf ve kanunda çocuk bakımı haklarından ve sonuçlarından bahsedilmiş, en önemli bulgulara değinmiş, kaynak ve referans dizinleri yapılmıştır."
