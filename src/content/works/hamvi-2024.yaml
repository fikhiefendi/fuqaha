abstract: "Bu çalışma, İslami bankalardaki finansal teknoloji işlemlerini ve çağdaş uygulamaları, bu bankalardaki en önemli finansal teknoloji uygulamalarının şeri dayanağı üzerinden vurgulamayı amaçlamaktadır. Ayrıca, tüketicinin korunması ve verilerin korunması gibi finansal teknoloji uygulamalarının karşılaştığı en önemli zorlukların bir açıklamasıdır. Çalışmanın önemi, finansal teknolojinin İslam dünyasında yaygınlaşması ve dijital ekonomi ışığında finansal teknolojinin vazgeçilmez hale gelmesiyle ortaya çıkmaktadır. Araştırma söz varlığına ulaşmada izlediğim yöntemde, amaçlanan araştırmanın meşru tanımlarını öne çıkararak tümevarım yöntemini benimsedim. Yanı sıra Türk olan Al Baraka ve Kuveyt Türk bankaları için finansal teknoloji, bankacılık işlemleri ve özel verilerin toplanması ile ilgili çeşitli teorik yönleri sunmak için betimsel yönteme benimsedim. Sonuç olarak slami bankaların ve işlemlerinin, para piyasasındaki enflasyonla ilgili ortaya çıkan sorunları çözmede ve müşteriler ve tüketiciler için işlemleri kolaylaştırmada önemini ortaya çıkardı. İslam dünyasında teknolojilerin tanıtımı henüz başlangıç aşamasındadır ve İslami finansın çağdaş finansal uygulamalara yönelik kontrollerini dikkate alarak daha fazlasını benimsemek için daha fazla çaba göstermemiz gerekmektedir. Alimler tarafından helal ve haram olarak değerlendirilmeden önce ürünün bütünleşik bir algı oluşturmak ve anlayışını derinleştirmek ve İslami bankalarda bankacılık işlemleri için siber güvenlik, güvenlik politikaları ve güvenlik prosedürlerinin önemini açıklamak gerekmektedir."
