abstract: "İslam, içtimai hayatı her yönüyle düzenleyen bir dindir. Düzenin sağlanması ise belli kurallar çerçevesinde gerçekleşmektedir. İslam'ın düzeni sağlayan bu kuralları bize hukuki bir yapısının olduğunu göstermektedir. Birçok mesele hakkında Kur'an ve sünnette hayatı tanzim eden bu kurallar belirtilmiştir. Ancak bazı konular var ki zamanın şartlarına göre değişik durumlar arz edebileceğinden dolayı Şari' tarafından haklarında kesin bir hüküm konulmamıştır. Dolayısıyla bu durum hukukçulara görüş belirtebilecekleri bir ortam oluşturmuş, dönemin şartları ve ihtiyaçlarına göre -asli kaynaklardan yararlanarak- içtihat yoluyla çözümler üretilmesine imkân sağlamıştır. Bu bağlamda hakkında zaman zaman fikri tartışmalara sebep olan konulardan birisi de devletin piyasaya müdahale etmesinin hukuken uygunluğu konusudur. İslam hukukunun önemli konularından biri olan bey' akdi içerisinde tes'îr kavramı ile ifade edilen narh hakkında İslam hukukçuları farklı görüşler ortaya koymuşlardır. Çalışmamızda konu hakkında mezheplerin gerek kendi içlerinde gerek diğer mezhep alimleri ile ittifak ve ihtilaf ettiği görüşlerden ve ilgili naslardan yararlanarak devletin piyasaya müdahalede bulunmasının İslam hukukuna uygunluğu ve hangi şartlarda müdahalenin caiz olduğu meselesi gerekçeleri ile ortaya konulmaya çalışılmıştır. İki bölümden oluşan çalışmamızın birinci bölümünde akitler ve akitlerde maslahat ve rıza kavramlarının akde etkisi ile piyasa konuları anlatılmış, ikinci bölümde devletin piyasaya müdahalesi (narh/tes'îr) konusu anlatılıp mezheplerin görüşleri belirtilmiştir. İkinci bölümün sonunda ise meselenin aynı zamanda güncel bir problem olması nedeniyle modern iktisat anlayışının dayandığı ülkemizde şuan yürürlükte olan hukuk sistemi ile İslam hukuku açısından devletin piyasaya müdahalede bulunabilmesinin hukuki ortak noktaları tespit edilerek aktarılmaya çalışılmıştır."
