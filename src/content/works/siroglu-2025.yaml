abstract: "İSLAMİ FİNANS KURUMLARININ YÖNETİŞİMİNDE YAPAY ZEKANIN ROLÜ Eymen SIROĞLU Bu çalışma, Filistin'deki İslami bankalarda yapay zekâ teknolojilerinin yönetişim verimliliğini artırmadaki rolünü incelemeyi amaçlamaktadır. Çalışma, bu teknolojilerin mevcut kullanım düzeyini analiz etmekte, idari ve hizmet performansı üzerindeki etkisini değerlendirmekte ve yönetişim verimliliği ile olan ilişkisini ortaya koymakta; ayrıca uygulamayı engelleyen temel zorlukları tespit etmektedir. Araştırma, ilgili literatürün incelendiği betimsel-analitik yöntem ile birlikte SPSS programı kullanılarak yapılan istatistiksel analiz yöntemine dayanmaktadır. Veriler, Filistin'deki İslami bankalarda çalışanlardan anket yoluyla toplanmış; ayrıca uzmanlarla yapılan mülakatlarla nitel verilerle nicel veriler desteklenmiştir. Sonuçlar, yapay zekânın şeffaflık, denetim ve karar verme mekanizmalarını güçlendirerek yönetişimde umut vaat eden bir araç olduğunu ortaya koymuştur. Ancak, bu teknolojilerin kullanımı hâlâ sınırlı ve etkisiz düzeydedir. Ayrıca, yapay zekâ kullanımı ile yönetişim verimliliği arasında istatistiksel olarak anlamlı fakat zayıf bir ilişki tespit edilmiştir. Altyapı eksiklikleri, insan kaynağı yetersizliği ve uygun yasal düzenlemelerin olmayışı gibi faktörler etkin kullanımı engellemektedir. Çalışma, yapay zekâya yatırımın artırılmasını, yönetişim çerçevelerinin güncellenmesini, personelin eğitilmesini ve üniversitelerle iş birliğinin güçlendirilmesini önermektedir."
