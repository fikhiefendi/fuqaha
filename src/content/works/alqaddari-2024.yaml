abstract: "Çalışmamızda, Mâlikî mezhebi fetvalarında bulunan mutemed görüşten dönme (udûl) meselesi ele alınmıştır. Çalışmada fetva mefhumu, Mâlikî mezhebinde mutemed olan görüş kavramı tanımlanmış ve bunun muhtelif dereceleri belirlenerek nasıl öğrenileceği izah edilmiştir. Ayrıca, mezhepte mevcut olan görüşler arasında tercih yapma kaideleri ve konu hakkında uygulanan yöntem analiz edilmiştir. Yine fetvalarda mutemed görüşten dönme kavramı, bu kavramla ilişkili ıstılahlar -örneğin istihsan, mâ cerâ bihi'l-amel, mürâât-ı-hilâf- açıklanmış ve Mâlikî mezhebinin bu konudaki görüşleri tartışılarak mezhep içerisindeki râcih görüş belirlenmiştir. Öte yandan, örf, maslahat, zarûret ve meşakkatin kaldırılması (ref'u'l-harec) gibi fetvalarda mutemed görüşten sapmayı gerektiren şer'î sebeplerin temeli açıklanmış ayrıca Mâlikî fetvalarından birtakım örnekler verilmiştir. Böylece teorik kısım, mezhep içerisinde mutemed olan görüşten dönme durumunda uyulması gereken kurallar detaylandırılarak nihayete erdirilmiştir. Uygulama bölümünde ise, Libya Dârü'l-İftâ tarafından mutemed olan görüş noktasında sapılan fetvalar incelenmiş ve bu sapmalarda uyulması gereken kuralların denetlenme noktası tartışılmıştır. Çalışmamızın ulaştığı sonuçlardan bazıları şunlardır: Mâlikî mezhebindeki fetvalarda mutemed görüşten sapma, şer'î sebeplerle ve geçerli denetim kurallarına uyulduğunda uygulanabilmektedir. Öyle ki belirtilen dönme sebepleri, Mâlikî mezhebinin temel prensiplerine uygundur. Libya Dârü'l-İftâ'nın mutemed görüşten sapılarak verilen fetvaların çoğu dikkate değer bir nedene dayanmakta olup, bazı fetvalarda ise görüşten dönme ile ilgili uyulması gereken kurallar ihmal edilmiştir. Bu uyulması gereken kurallar arasında meseleye dair doğru bir kavrayış, sapılan görüşün doğruluğu ve söz sahibinden sahih bir şekilde aktarımı gibi unsurlar yer almakla beraber dönme gereksiniminin kendisine sapılan görüşte bulunmaması yer almaktadır."
