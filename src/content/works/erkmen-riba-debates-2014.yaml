abstract: "Bu tez, 19. yüzyıldan sonra Müslüman toplumlarda ribâ (yani günümüz ekonomisinde banka faizi) tartışmalarının yeniden ortaya çıkışını incelemektedir. Bu yeniden ortaya çıkışı açıklamak için bu çalışma, modernite, kapitalizm, reform ve İslamcılık bağlamında İslam hukukunun toplumsal değişimlerle kesişimine odaklanıyor. Tez iki bölümden oluşmaktadır. Tezin giriş bölümü genel olarak faiz getiren (ribavi) işlemlere yönelik, metin anlama ve yorumlama temelli yanıtların hem teorik hem de kavramsal kökenini incelemektedir. Birinci bölüm, bir reformist olarak Fazlur Rahman'ın (1919-1988) metodolojisini büyük ölçüde analiz ederken, modernitenin 19. yüzyıldan itibaren İslami metinlerin yorumlanması, kanun yapma ve fetva verme sürecini nasıl etkilediğini analiz etmektedir. Bir ihya lideri olarak Ebu'l-Aʻlā Mevdûdî'ye (1903-1979) odaklanan ikinci kısım, İslam'ın ahlakî ekonomik sistemi (el-niẓâm al-iktiṣadî al-İslâmî) olarak adlandıracağımız alternatif çözümünü ele alacaktır. Başka bir deyişle, İslam'ın reformist yorumuna ve Batı tipi bankacılık sistemine karşı Mevdûdî'nin banka faizi meselesine tepkisel anlayışını değerlendirmektedir. Bu tezin temel amacı, önde gelen iki Müslüman âlimin hızla genişleyen ekonomik sisteme karşı tutumunu analiz etmektir."
