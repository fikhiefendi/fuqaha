abstract: "Bu araştırma VI. (XII) yy'da Maverâünnehir bölgesinde yaşamış olan Kâdîhân ve onun en önemli eseri Fetâvâ Kâdîhân hakkındadır. Bu eserde yer alan örf ve âdetle ilgili hükümler tezin ana konusudur. Bu araştırma, giriş ve iki ana bölümden oluşmaktadır. Giriş bölümünde araştırmanın konusu ve kapsamı hakkında bilgi verilmiştir. Birinci bölümde, Kâdîhân'ın hayatı ayrıntılı olarak ele alınmış, hocaları, talebeleri, eserleri, ilmi şahsiyeti ve yaşadığı dönem hakkında bilgi verilmiştir. İkinci bölüm, tezimizin ana bölümünü oluşturmaktadır. Bu bölümde öncelikli olarak eserde geçen örf ve âdetle ilgili terimler hakkında bilgi verilmiştir. Daha sonra eserde örfle ilgili geçen hükümler, konusuna göre ele alınmıştır. En sonunda ise örf ve âdetle ilgili tasnifler ve değerlendirmeler bulunmaktadır"
