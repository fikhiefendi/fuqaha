abstract: "Bu çalışma, İslami sosyal finans kavramı ve önemi incelenerek ve ayrıca ekonomik yeterliliğin sağlanması kavramı analiz edilerek, Filistin'deki yoksul ve dışlanmış grupların ekonomik yeterliliklerinin sağlanmasında İslami sosyal finansın rolünü ele almıştır. Ayrıca Filistin'deki hedef grupların ekonomik yeterliliklerinin sağlanması için küçük ve mikro işletmelerin desteklenmesinde pratik uygulamalara, yerel ve uluslararası deneyimlere vurgu yapmıştır. Araştırmacı, genel olarak İslami finans ve özel olarak İslami sosyal finans ve ekonomik yeterliliğin sağlanması ile ilgili literatürü incelemek için tümevarım metoduna, ayrıca bu finansmanın etkisini bir saha anketi aracılığıyla ölçmek ve sonuçlarını çalışmanın amaçlarına hizmet edecek şekilde analiz etmek için istatistik metoduna ve İslami sosyal finans yöntemlerine ilişkin veri toplamak için tanımlayıcı analitik yaklaşıma dayanmıştır. Çalışmamız, İslami sosyal finansmanla, yoksul ailelerin yaşam standartlarını iyileştirme, iş fırsatları yaratma, Filistin toplumunda işsizliği azaltma ve hedef grupları güçlendirmeye katkıda bulunma arasında istatistiksel olarak anlamlı bir ilişki olduğunu ortaya koymuştur. Ayrıca İslami sosyal finans kurumlarının programlarının çeşitlendirilmesi ve personelinin eğitilmesi yoluyla geliştirilmesinin önemine de vurgu yapmıştır. Çalışmamız, bu programların başarısını sınırlayan engellerin en başında gelenin, İsrail işgalinin dayattığı kısıtlamalar olduğunu tespit etmiştir. Yine finansmanın sürdürülebilirliğini sağlamak, sosyal adaleti ve dayanışmayı artırmak için zekât, bağış, kredi gibi hayır amaçlı araçlar veya mütevazı kar araçlarıyla projeleri desteklemede İslami sosyal finans kurumlarının etkin rolüne işaret etmiştir."
