abstract: "Geçmişten günümüze, sorumluluk hukukunda ortaya çıkan en önemli sorun, üçüncü bir kişinin haksız fiili neticesinde bir zarar doğması halinde, meydana gelen zarardan kimin sorumlu olacağı olmuştur. Sorumluluk hukukunun temelini kusura dayanan sorumluluk halleri oluşturmuş olup herkesin meydana getirdiği fiil sebebiyle ortaya çıkan zarardan, kusuru oranında, kısmen veya tamamen sorumlu olacağı düşüncesi sorumluluk hukukuna hâkim olmuştur. Zamanla toplumsal kuralların ve teamüllerin değişmesiyle birlikte kusura dayanan sorumluluk halleri yetersiz kalmış, herkesin kusurlu hareketi neticesinde meydana gelen zarardan sorumlu olacağı ilkesine birtakım istisnalar getirilmiştir. Türk Borçlar Kanunu'nun 69'uncu maddesinde düzenlenen bina ve yapı eseri malikinin sorumluluğu da, kusur esasına dayanan sorumluluk hallerinden ayrılarak, meydana gelen zarardan ilgili kişilerin sorumlu olması için kusur şartı aramayan kusur sorumluluğu ilkesinin istisnalarından birisidir. Çalışmamızda bir kusursuz sorumluluk hali olan bina ve yapı eseri malikinin sorumluluğunun hukukî niteliği, dayandığı esaslar ve benzer sorumluluk hallerinden farkları ortaya konulduktan sonra, bina ve yapı eseri kavramları ile birlikte sorumluluğun ortaya çıkması için gerekli olan şartlar ele alınmıştır. Çalışmamızın devamında ise, Türk Borçlar Kanunu'nun 69'uncu maddesi kapsamında kimlerin zarardan sorumlu olduğu ve sorumluluğun hükümleri incelenmiştir. Doktrindeki görüşlere ve Yargıtay içtihatlarına da yer verilerek çalışmamız tamamlanmıştır."
