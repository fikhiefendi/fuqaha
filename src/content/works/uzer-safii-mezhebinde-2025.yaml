abstract: "Şâfiî fıkhının önde gelen alimlerinden biri olan İsnevî, mezhep içerisinde pek görülmeyen bir tavır sergileyerek, mezhebin ana kolunu temsil eden fakihlere muhalif görüşler ileri sürmüştür. el-Mühimmât fî şerḥi'r-Râfiʿî ve'r-Ravża ile Cevâhirü'l-Baḥreyn fî Tenâḳużi'l-Ḥıbreyn adlı eserlerinde, Râfiî ve Nevevî 'nin zaman zaman İmam Şâfiî'yi doğru anlamadıkları ve görüşlerine ulaşmada yetersiz kaldıkları yönündeki eleştirilerini dile getirmiştir. İsnevî'nin bu alimleri sert bir dille eleştirmesi mezhep fukahâsının tepkisini çekmiş, başta öğrencisi Irakî olmak üzere pek çok reddiyeye konu olmuştur. Nitekim el-Mühimmât'ın mukaddimesinde eleştiri yaptığı hususları başlıklar hâlinde zikrederek, bu eseri yazma amaçlarından birinin de mezhepteki yanlış değerlendirmeleri ortaya koymak olduğunu belirtmiştir. Bazı araştırmacılar, İsnevî'nin bu tavrını“mezhep içi öze dönüş”çabası olarak değerlendirmektedir. Bu çalışmada, Türkçe literatürde yeterince incelenmeyen İsnevî'nin Râfiî ve Nevevî 'ye yönelttiği eleştiriler ele alınacaktır. Özellikle adı geçen eserleri başta olmak üzere konuyla ilgili kaynaklardan faydalanılacaktır. Çalışmanın amacı, literatürdeki önemli bir boşluğu doldurmaktır. Ayrıca, mezhep içerisinde muhalif bir ses olmasına rağmen İsnevî'nin kabul gören bir otorite olması dikkat çekicidir. Araştırmada, İsnevî'nin eleştirileri karşılaştırmalı olarak değerlendirilecek; bu tenkitleri dile getirmekteki amacı da ortaya konacaktır. Sonuçta, onun mezhep içinde kalarak yönelttiği eleştirilerin dayanağı ve bu görüşlerin sonraki dönemde ne ölçüde dikkate alındığı tespit edilerek mezhepteki konumu belirlenmeye çalışılacaktır."
