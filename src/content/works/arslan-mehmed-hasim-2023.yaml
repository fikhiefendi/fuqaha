abstract: "Bu çalışma, Mehmed Hâşim Efendi'nin Manzûm Ferâizi adlı eserin metin ve içerik yönünden incelenmesi sonucu ortaya çıkmıştır. Eser, İslam fıkhının alt dallarından biri olan ve İslam'ın miras paylaşımında koyduğu kuralları ele alan ferâiz ilmine dair yazılmış bir manzumedir. Mehmed Hâşim Efendi'nin Manzûm Ferâizi (İnceleme – Çeviri Yazılı Metin) adını verdiğimiz bu çalışmayla, klasik Türk edebiyatında öğretici maksatla kaleme alınmış türlerin az bilinenlerinden biri olan ferâiz manzumeleri grubuna eklenecek yeni bir eserin edebiyat dünyasına tanıtılması amaçlanmıştır. Mehmed Hâşim Efendi'nin Manzûm Ferâizi adlı eser, Diyanet İşleri Başkanlığı Kütüphanesinin Yazma Eserler bölümünde 5344-II demirbaş numarasıyla kayıtlıdır. 41 varaktan oluşan eserde 1214 beyit yer almaktadır. Eser, XVII. yüzyılın sonu ile XVIII. yüzyılın başlarında yaşadığı tespit edilen ancak biyografik kaynaklarda hakkında çok fazla bilgi bulunmayan Seyyid Mehmed Haşim Efendi tarafından yazılmıştır. Yazılış yılı 1708'dir. Didaktik tarzda ve mesnevi nazım şekliyle kaleme alınmış bu eserde ferâiz ilmi ayrıntılı bir şekilde ele alınmıştır. Eser, Hanefî mezhebi fıkıh âlimlerinden Muhammed es-Secâvendî'ye ait olan ve İslam hukuku alanında en çok tanınan, en çok kabul gören el-Ferâizü's-Sirâciyye adlı eser esas alınarak yazılmıştır. Çalışmamız giriş bölümü ve onu takip eden iki ana bölümden oluşmaktadır. Giriş bölümünde konuya hazırlık bağlamında klasik Türk edebiyatı hakkında genel bilgiler verilmiştir. Ayrıca ferâiz ilmi ve kaynakları hakkında bilgiler verilmiş, ferâiz manzûmelerinin ortaya çıkış süreçlerinin yanında şimdiye kadar tespit edilen Türkçe ferâiz manzûmelerine değinilmiştir. Birinci bölümde Seyyid Mehmed Haşim Efendi'nin hayatı ve edebî kişiliği, başvurulan kaynaklar ışığında ele alınmıştır. İkinci bölümde eser şekil özellikleri ve ele aldığı içerik yönünden incelenmiştir. Devamında eserin çeviri yazılı metni verilmiştir. Son bölümde ise ek başlığı altında eserin orijinal metnine yer verilmiştir."
