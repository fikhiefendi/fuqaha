abstract: "Risk kavramı, küresel finansal krizlerin etkisiyle tüm finans sektöründe gün geçtikçe önem kazanmaya başlamıştır. İslami finans piyasaları ve araçları 2008 yılı finansal kriziyle birlikte güçlü bir ivme kazanarak dünya finans sektöründe gittikçe artan bir önemle yaygınlaşmaktadır. Riskin bu artan önemi ve İslami finansın risk yönetimi konusunda konvansiyonel finansa alternatif olma potansiyeli taşıması, İslami finans ile konvansiyonel finans arasında risk profili yönüyle kıyaslama yapma ihtiyacını ortaya çıkarmıştır. İslami finans ilkeleri doğrultusunda oluşturulmuş yerel ve küresel İslami endekslerin muadilleri olan konvansiyonel endekslere kıyasla risk seviyelerinin incelendiği bu çalışmada günümüz itibariyle finansal kurumlar tarafında yaygın olarak kullanılan Riske Maruz Değer yöntemi kullanılarak Türkiye'deki üç İslami endeks ile muadilller olan üç konvansiyonel endeksin risk seviyeleri ölçülmüş ve kıyaslanmıştır. Aynı şekilde dünyadaki küresel üç İslami ve konvansiyonel endeksin riskleri ölçülmüş ve kıyaslanmıştır. Türkiye için Katılım30-Bist30, Katılım50-Bist50 ve ZPY Katılım-Bist100 endeks çiftlerinin ile dünyadaki küresel endeksler için DJ World Islamic- DJ World, FTSE World Shariah-FTSE World ve S&P500 World Shariah- S&P500 World endekslerinin 2014-2020 yılları arasındaki günlük kapanış verileri kullanılarak RMD'leri kıyaslanmıştır. Sonuç olarak Türkiye'deki her üç endeks çifti için İslami endekslerin muadilleri olan konvansiyonel endekslerden daha az risk seviyelerine sahip oldukları tespit edilmiştir. Fakat dünyadaki üç endeks çifti için İslami endeksler ile muadilleri olan konvansiyonel endeksler arasında risk seviyeleri yönüyle anlamlı bir farkın olmadığı ampirik bulgularla tespit edilmiştir."
