abstract: "Dünya genelinde gelişme sürecine giren faizsiz bankacılık sistemi; 1975 yılında katılım bankacılığında milat olarak adlandırılmış ve dünyanın gerçek anlamda tam donanıma sahip ilk katılım bankası olarak ifade edilen Dubai İslam Bankasının kurulması olmuştur. Faizsiz bankacılık adı altında yaygınlığını arttıran Katılım bankaları ilk olarak Müslüman ülkelerde faaliyette bulunurken daha sonrasında ise tüm dünya genelinde önemini arttırmış ve faaliyete geçmiştir. Türkiye'de katılım bankaları ise özellikle 2001 yılından sonra kendilerini daha net göstermiş olup, 2005 yılında 5411 sayılı bankacılık Kanunu ile“Özel Finans Kurumu”adı“Katılım Bankası”olarak değiştirilmiş ve konvensiyonel bankalar ile rekabet edebilir bir hale gelmiştir. Çalışmanın amacı; katılım bankalarının fon toplama ve fon kullandırma yöntemlerindeki farklılıklarını ve çeşitliliklerini göstermek, faiz lobisine uzak durmak isteyen kesimin tercih sebebi olarak seçmesi arkasındaki farklılıkları belirlemek ve faiz hassasiyeti olan kesimin yastık altı fonlarının ekonomiye kazandırılması üzerinde durularak katılım bankacılığının işleyişlerini teorik olarak anlatmak ve katılım bankacılığının konvensiyonel bankacılıktan farklılıklarına yer vermektir. Çalışma sonucu olarak; katılım bankalarının göstermiş olduğu bankacılık faaliyetleri, konvensiyonel bankaların göstermiş olduğu faaliyetlere şekil olarak benzesede içerik olarak birbirlerinden ayrıştığı görülmüştür. Öte yandan katılım bankalarınında, konvensiyonel bankalarla daha iyi şartlarda rekabet edebilmesi için katılım bankacılığı alanında faaliyet gösteren bankaların, Katılım Bankaları Birliği(KBB) altında ortak bir danışma kurulu oluşturulmasının gerekliliği, literatürdeki diğer çalışma sonuçlarında da yer verildiği üzere önerilebilir. Aynı zamanda katılım bankalarının,bankacılık sektörünün gelişimine katkı sağlaması için büyüme göstermelerinin ve net kar artışlarının ülke ekonomileri için kaçınılmaz olduğu söylenebilir."
