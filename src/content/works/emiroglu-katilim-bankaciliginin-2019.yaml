abstract: "Geleneksel bankacılığa alternatif olarak bir sistem geliştirilen İslami bankacılık sistemi uygulanmaya geçtiği ilk yıllar olarak 1960'lı yıllar gösterilmektedir. Bu dönemden günümüze geldikçe önemi artmış ve değer kazanmıştır. Ülkemizde ise İslami bankacılık modelleri ilk olarak özel finans kurumları isminde faaliyetlerine başlamış ilerleyen yıllarda ise ismini katılım bankacılığı olarak faaliyetlerini yürütmüştür. Ülkemizde 1980'li yıllarda faaliyetini yürüten bu sistem günümüzde de varlığını devam ettirmektedir. Katılım bankacılığının öneminin artmasından kaynaklanarak ülkemizde bu alanda çalışma sayısında da artış gözlenmektedir. Hazırlamış olduğum bu çalışma için ülkemizde katılım bankacılığı alanında yazılmış olan makaleler ve çalışmaların içerikleri incelenmiş ve analiz edilmiştir. Yapılan çalışmalar sonucunda katılım bankacılığı konusunda Türkiye'de yerini ve işleyişini ortaya konmuştur."
