abstract: "Nebevî sünneti inceleyen bir kişi, belâgatın sanatının en güzel ve en üstün tarzda kullanıldığını fark eder. Estetik açıdan, diğerlerine kıyasla, belâgat sanatının nebevî sünnette çok daha etkileyici bir şekilde icra edildiği görülür. Sunmuş olduğumuz bu araştırma, el-Munzirî'nin“el-Erbaîn fi'l ahkâm”ile Nevevi'nin“el-Erba'ûne En-Neveviyye”adlı iki kitabı karşılaştırmalı bir şekilde inceleyerek, Nebevî sünnetteki belâgatın inceliklerine ulaşmayı amaçlamaktadır. Araştırma soruları şunlardır: Bu iki kitapta kullanılan en belirgin retorik özellikler nelerdir? Söz sanatı yöntemlerinin manaya etkisi nedir? Karşılaştırılan bu iki kitapta kullanılan söz sanatı yöntemlerinin oranı nedir? Bu çalışmada, nitel yaklaşım kullanılarak alıntı ve eleştiri yapılmıştır. Ayrıca, sayısal metod yöntemleri kullanılarak oluşturulan grafikler aracılığıyla istatistiksel yüzdeler sağlanmış ve meâni, belâgat ve bedi' ilmi ile ilgili karşılaştırmalı bir belâgat çalışması yapılmıştır. Her iki belagat kitabının incelenmesinden sonra, her birinin belâgat yöntemlerini ve genel olarak kitapların yöntemlerini karşılaştırdık. İnceleme sonunda, elli bir tane beyân ve yüz altmış tane meâni uslûpları el- Erbaîn fi'l ahkâmdan, yüz dokuz tane beyân uslûbu ve üçyüz otuz iki tane meâni uslûbu el-Erba'ûne En- Neveviyye'den, otuz tane bedî ilmindeki muhssinat uslubu el- Erbaîn fi'l ahkâmdan , altmış dört tanesi de el-Erba'ûne En- Neveviyye'den çıkarılmıştır. Anahtar Kelimler: Nebevi belagât, nebevi hadis, , el-Erbaîn El-Munzirîyye karşılaştırmalı dersler, istatistiksel dersler."
