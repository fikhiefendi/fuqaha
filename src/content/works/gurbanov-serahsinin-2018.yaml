abstract: "İslâm dini diğer dinlerden farklı olarak bir hukuk anlayışı ortaya koymuş ve zamanla, özellikle de müctehid imamlar döneminde bir hukuk sistemi olarak geliştirilmiş ve zirve noktasına ulaşmıştır. İslâm hukukundaki kavâid anlayışının dayanağı ilk önce Kitâb'ın vazettiği genel nitelikli hükümler ve Sünnet'in cevâmiü'l-kelim özelliğidir. Dolayısıyla bu kültürde yetişen fakihlerin söz konusu kaynaklarda geçen nasların istikrâsı ile, yeni çıkan meseleleri çözüme kavuşturmada sahâbenin tutumu ve onlardan aktarılan veciz ifadeler, müctehid imamların fıkhî düşünceleri, onların ictihâdları, usûl-i fıkıh ilkeleri, mantık kuralları, dil kuralları aracılığıyla ve bunların tümevarım yoluyla tetkik edilmesi sonucunda tespit ettikleri kurallar kavâid ilmi olarak ortaya çıkmıştır. Çalışmamız, üç bölümden oluşmaktadır. \"Kavâid Kavramı İle İlgili Genel Bilgiler\" olarak isimlendirilen giriş kısmında ilk önce kavâid teriminin kavramsal tahlili yapılarak benzer terimler üzerinde durulmuş, hukuk düşüncesinde genel ilke anlayışı, kavâid ilminin ortaya çıkışı ve tarihsel gelişimi, kavâid'in delil olarak kullanılması, kavâid'in tasnifi ve faydaları hakkında kısa bilgi verilmiştir. Birinci bölümde, fürû' ile ilgili kâideler el-Mebsût eserinde sıralanan konular esas alınarak tasnif edilmiştir. Ancak burada sadece ukûbât ile ilgili konular tamamen mustakil bir başlık altında verilmiş ve bu konuyla ilgili temel ilkeler bu başlık altında sıralanmıştır. İkinci bölümde ise, usûl ile ilgili kâideler modern dönemde yazılmış usûl eserlerindeki konuların tasnifi esas alınmış ve var olan kâideye uygun başlıklar atılarak örnekleriyle beraber orada verilmiştir."
