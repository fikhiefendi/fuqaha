abstract: "Çalışma, islami para politikası araçlarının ekonomi deki rolüne ışık tutmayı ve para politikası hedeflerini gerçekleştirmedeki yeterliliğini netleştirmeyi amaçlamaktadır. Bu çalışmanın amaçlarına ulaşması için, para ve para sistemi kavramı, para politikası terimi ve İslam ekonomisinde para politikasının hedefleri gibi önemli konuları ele alınarak, tüme varım analitik metot kullanılmıştır. Çalışma, kredi miktarını ve hacmini belirlemeye yönelik niceliksel araçlar ile krediyi, merkez bankası tarafından istenilen alanlara yönlendirmeye yönelik niteliksel araçlar yönünden modern iktisattaki para politikası araçlarının çeşitliliğini ortaya koymuştur. Çalışma, bu araçların büyük ölçüde İslam dini tarafından yasaklanmış faiz oranına dayandığını olduğunu göstermiştir. Bu nedenle çalışma, bu araçların yasal kuralını açıklamış ve İslam Merkez Bankası ile ticari bankalar arasındaki ortaklığa dayalı katılımcı sistemin faiz sistemine bir alternatif olduğunu ortaya koymuştur. Çalışma, bazı modern para politikası araçlarının, faiz oranından etkilenmedikleri için İslam para politikası sisteminde kullanılabilecek tarafsız araçlar, bunlardan bazılarının da katılım sistemiyle uyumlu olması için geliştirilmesi ve yeniden düzenlenmesi gereken araçlar olduğu ve pek çok para politikası aracının geliştirilmesi bakımından bazı merkez bankalarının yaptığının da bu olduğu sonucuna varmıştır. Çalışma, İslami para araçlarının, büyük siyasi irade ve kapsamlı parasal reform mevcut olmadığından uygulanması geniş olmamasına rağmen, bu parasal araçlar sermaye araçlarının yanında işlev gördüğünden, orijinal ve geliştirilmiş İslami para araçlarının para sistemini kontrol etmede yeterli ve etkin olduğunu, modern para araçlarının olumsuz etkilerini hafifletmekte görünür katkılarının bulunduğunu ortaya koymuştur. Çalışma, İslam ülkelerindeki para otoritelerini modern para sistemine güvenli bir alternatif haline getirmeye teşvik etmek için oldukça yeterli İslami para araçları oluşturma hususunda araştırmaların artırılmasını önermiştir."
