abstract: "Irak ve Semerkant Hanefî ekolleri, farklı zamanda ve farklı bölgelerde ortaya çıkan iki ekoldür. İki ekolün zamansal ve bölgesel açıdan bu farklılığı ve aynı zamanda çevresel ve mezhepsel faktörler, farklı görüşler benimsemelerine sebep olmuştur. Nitekim Irak Hanefî ekolünün Mu'tezile mezhebi ile aynı bölgede olması ve bunun sonucu olarak yakın ilişkisinin bulunması, iki tarafın kelâmî ve fıkhî düşünce itibariyle birbirinden etkilenmesine neden olmuştur. Diğer taraftan Semerkant Hanefî ekolü, kendi sistemi çerçevesinde yeni bir fıkıh usulü geliştirme iddiasındadır. Alâuddîn es-Semerkandî bu bağlamda eserinde“Kelâm ilmiyle uyumlu yeni bir fıkıh usulü inşâsı”fikrini öne sürmüştür. Semerkant Hanefî ekolünün daha çok kelâm alanında temâyüz ettiğini ve bölgesindeki Mu'tezile karşıtlığını düşündüğümüzde ve yine bu iki ilim dalının birbiriyle etkileşimini göz önünde bulundurduğumuzda, Semerkandî'nin“Kelâm ilmiyle uyumlu yeni bir fıkıh usulü geliştirme”iddiasını daha iyi anlayabiliriz. Buna binaen, her iki ekol arasındaki usul farklılığının kelâmî alt yapısının bulunduğunu belirtmekle birlikte ihtilâfların sadece kelâmî asıllara dayandığını iddia etmek de doğru bir yaklaşım tarzı değildir. Çalışmamız altı bölümden oluşmaktadır. Birinci bölümde çalışmamızın konusu, kaynakları ve yöntemi ele alınmıştır. İkinci bölümde, ekollerin tarihi gelişimi ele alınmakla birlikte Irak Hanefî ekolünün Mu'tezile ile ilişkisi incelenmiş ve akabinde Semerkant Hanefî ekolünün tarihi gelişim süreci takip edilmiştir. Üçüncü bölümde, lafızların mana üzerindeki delâleti kapsamındaki ihtilâflar; dördüncü bölümde, Sünnet kapsamındaki ihtilâflar; beşinci bölümde, kıyas ve içtihat kapsamındaki ihtilâflar ve altıncı bölümde, hüküm bahsi çerçevesindeki ihtilâflar ele alınmıştır. Bölümler içerisinde ele alınan her bir mesele, Irak ve Semerkant Hanefî ekolleri açısından değerlendirilmiş ve akabinde iki ekol arasındaki ihtilâfların mezhep içi yansımaları takip edilmiştir."
