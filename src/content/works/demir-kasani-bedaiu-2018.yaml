abstract: "Kâsânî'nin (v.587/1191) Bedâiu's-Sanâi' adlı eseri Hanefî fıkhının gelişimine yeni bir boyut kazandıran kıymetli bir eserdir. Müellifin konuları ele alırken kullandığı yöntem Hanefî mezhebinin ifade ediliş tarzı açısından çok önemli bir basamak olmuştur. Bedâiu's-Sanâi' adlı eser, üzerine şerh yapılma ihtiyacı duyulmadan günümüzde bile önemini korumaya devam etmektedir. Bu çalışmada Kâsânî'nin Bedâiu's-Sanâi' adlı eserine dayanarak“Eşlerin evlilik hukukuna aykırı davranması”başlığı bağlamında kadın ve erkeğin hak ve sorumlulukları tespit edilmeye çalışılmıştır. Ayrıca tarafların evlilik hukukuna aykırı davrandığı durumlarda başvurulabilecek çözüm yolları değerlendirilmiştir. Kâsânî'den yaklaşık yüzyıl önce vefat etmiş olan Serahsî'nin (v.483/1090) Mebsût adlı eseri ise Hanefî mezhebindeki fıkhî görüşlerin ve delillerinin en geniş şekilde ele alındığı ve sistemli bir tahlilinin yapıldığı ilk ve en hacimli çalışmadır. Bu çalışma çerçevesinde Serahsî'nin Mebsût adlı eseri de aile hukuku bağlamında incelenerek kadın ve erkeğin konumu hak ve sorumluluklar açısından değerlendirilmiştir. Ayrıca Serahsî'den Kâsânî'ye kadar geçen süreçte evlilik hukukuna bakış açısında ne tür değişimler yaşandığı değerlendirilmeye çalışılmıştır."
