abstract: "Hiyel, yasaklanmış bir sonucu elde etmek maksadıyla şekil itibariyle hukuka uygun bir işlemi vasıta kılarak yapılan muamele anlamında olan bir fıkıh terimidir. Hiyel kavramı yerine çıkış ve kurtuluş yolları anlamına gelen meharic kavramı de kullanılmıştır. Literatürde dört tasarruf türü hiyel kapsamı içinde mütalaa edilmiştir. Birincisi, nikâh, alışveriş ve ruhsatlar gibi meşrû vasıtaları kullanarak meşrû sonuçlara ulaşmak. İkincisi, namaz kılmamak için içki içip namaz vaktinde sarhoş bulunmak gibi gayri meşrû vasıtalarla gayri meşrû sonuçlara ulaşmak. Üçüncüsü, başkasının bıçağını çalmak veya gasbetmek suretiyle kendi hayvanını kesmek gibi gayri meşrû vasıtalarla meşrû sonuçlara ulaşmak. Dördüncüsü ise bey'u'l-îne ve hülle gibi meşrû vasıtaları kullanarak gayri meşrû sonuçlara ulaşmaktır. Bahsi geçen bu muamelelerden birincisinin caiz olduğu; ikinci ve üçüncüsünün ise caiz olmadığı hususunda İslam hukukçuları tarafından ittifak edilmişken dördüncüsü hakkında ise ihtilaf edilmiş ve farklı görüşler ileri sürülmüştür. Hiyelin bütünüyle câiz olmadığını ileri sürenler, cumartesi günündeki avlanma yasağını ihlâl edip taşkınlık göstermeleri sebebiyle Yahudilerin maymuna çevrildiğini anlatan ayetleri delil getirmişlerdir. Başta Hanefî âlimler olmak üzere hiyeli caiz görenler ise bütün hîle çeşitlerini caiz görmemiş, alışveriş, nikâh, talâk ve ruhsatlar gibi meşrû yollarla meşrû neticelere ve helâl olana ulaştırmanın yanı sıra günaha düşmekten kurtaran hîlelerin câiz olduğunu; bir hakkı veya şer'î bir hükmü iptal eden hîlelerin ise câiz olmadığını belirtmişlerdir. İslam hukuk literatüründe genellikle, abdest, namaz, oruç, zekât talak, nikâh, yemin, alım satım, kira ve cezalar konularında örnekler verilmektedir."
