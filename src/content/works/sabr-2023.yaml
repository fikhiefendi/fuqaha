abstract: "Bu tezin temel amacı, Hâkim en-Nîsâbûrî'nin“el-Müstedrek ale's-Sahîhayn”isimlici bölüm üç kısımdır. Birinci kısım Hâkim en-Nîsâbûrî'nin dönemi, ismi, doğuş, vefâtıdır. İkinci kısım Hâkim'in şahsiyeti, hadis tahsiliyle geçirdiği ilmî hayatı, ilim yolculuğu, şeyhleri, talebeleri ve seyahat ettiği ülkeleri ele almaktadır. Üçüncü kısımda ise İmâm Hâkim'in ilmî çabaları, Müstedrek'in tanıtımı, onu yazmasının sebepleri, kitaptaki yöntemi ve Hâkim'in hadisleri tashîhi yer almaktadır. İkinci bölümü ise üç kısma ayırdım. Her kısımda, söz konusu üç sûre ile alakalı hadisler ve birçok meseleler vardır. Üçüncü ve son bölümde ise, söz konusu üç sûredeki mevkûf hadisleri ele aldım ve bu hadislerin Kütüb-i Tis'a'dan tahrîcini yaptım. Burada bulamadıysam etrâf ve tefsir kitaplarını esas aldım ve hadislerin şâhid ve mütâbîlerini zikrettim. Hadisin ilim ehline göre derecesini açıklamak ve hadis hakkında hüküm vermek için isnadda geçen râvîler hakkında bilgi verdim. Bu konuda İbn Hacer'in“et-Takrîb ve't-Tehzîb”adlı kitabını esas aldım. Fakat İmam İbn Hacer'in ravi hakkında bir görüşünü bulamadıysam, başka bir görüşü esas alarak Cerh ve Et-Ta'dil kitaplarına müracat ettim. Sonra hadisin manasını, ayetin sebeb-i nüzulünü, bazı şerî ve fıkhî hükümleri zikrettim. Son olarak, hadisin kılavuzluk ettiği en önemli ders ve ibretlerle, ulaştığım sonuç ve önerilerle tezi bitirdim. Böylece tez, tek kaynakta toplanmış, tahkik edilmiş, kolaylıkla başvurulan, Hakim'in dönemini ve O'nun Kur'an-ı Kerim'in tefsiriyle alakalı hadisleri zikretmekteki yöntemini öğrenmek isteyenlere vakit kazandıracak bilimsel bir kaynak olmuştur. Ayrıca tez Hâkim'in söz konusu surelerin tefsiri bağlamında yer verdiği hadisler hakkında okuyucuya genel bir algı sunacak ve bu hadislerin sahih veya zayıf olup olmadıklarını açıklayacaktır."
