abstract: "Günümüzde internet üzerinden bilgi ediniminin kolaylaşması, Japonya'da Müslümanlarla yapılan evliliklerin artması, ikinci-üçüncü nesil Müslümanların sosyal hayata dâhil olup İslam'ı yaşayarak örnek teşkil etmeleri neticesinde Japonya'daki Müslüman sayısı artmaktadır. Bununla birlikte, son zamanlarda Müslüman ülkelerde yaşanan siyasi çalkantılar, Japonya'nın hızla gelişen doğu ülkeleriyle olan ilişkileri, Japonya'yı ziyaret eden Müslüman turistlerin artması, 2020 yılında Tokyo'da düzenlenecek olan olimpiyat oyunlarına birçok Müslüman ülkeden oyuncu ve ziyaretçilerin katılacak olması Japon toplumunun İslam'a olan ilgisinin artmasına ve bu alanda bilgi edinme ve gerekli tedbirleri alma yönünde çaba sarf etmesine vesile olmuştur, olmaktadır. Bu çalışmada Japonya'daki İslam tarihi ile ilgili ön bilgi verildikten sonra geçmişte ve günümüzde yapılan fıkhi çalışmalar, Japonya'da yaşayan Müslümanların eğitim ve helal gıda tüketimi konusunda karşılaşmakta oldukları fıkhi sorunlar ve eksiklikler tespit edilip ortaya çıkarılmaya çalışılmıştır. Çalışma konusu güncel meseleler ile sınırlanmıştır. Araştırmada Türkçe, İngilizce, Japonca, Malayca olmak üzere dört dilde – kitaplar, gazeteler, dergiler, raporlar, Youtube videoları, internet siteleri, akademik ve istatistik araştırmalardan yararlanılmıştır. Gerekli yerlerde bilgi sahibi şahıslarla bire bir görüşülerek veya sosyal medya aracılığıyla röportaj yapılarak elde edilen sonuçlar tez içinde değerlendirilmiştir. Her bölümün araştırma sonucunda tespit edilen problemlere çözüm önerileri sunulmuştur."
