abstract: "2019'da IŞİD'in bölgedeki toprak hakimiyetini yitirmesi üzerine, Suriye Demokratik Güçleri'nin (“SDG”), önceden IŞİD hakimiyetindeki topraklarda yaşamış olan ve çoğunluğu kadın ve çocuklardan oluşan binlerce kişi Suriye'nin kuzeydoğusunda bulunan gözaltı kamplarına yerleştirmiştir. Bu kişilerin arasında Avrupa devletlerinin vatandaşı olan çocuk ve yetişkinler de bulunmaktadır. Temel ihtiyaçların karşılanmasında dahi güçlük yaşanan bu kampların koşullarının insanlık dışı olduğu ve özellikle de çocuklar için hayati tehlike arz ettiği bilinmektedir. Gözaltı kamplarının denetiminden de facto sorumlu SDG, devletlere kamplarda bulunan vatandaşlarını ülkelerine geri götürmeleri yönünde defalarca çağrıda bulunmuştur. Bu çağrıya birçok devlet cevap vermişse de, Avrupa devletleri, çocuk vatandaşlarının, ebeveynleriyle birlikte ülkelerine geri dönüşlerini sağlamayı, çeşitli hukuki argümanların yanında, politik hassasiyetleri, ulusal güvenlik endişelerini ve lojistik sıkıntıları ileri sürerek sistematik olarak reddetmektedir. Şu ana kadar yalnızca çok az sayıda, genellikle yaşları küçük ve refakatsiz çocuklar Avrupa devletleri tarafından ülkelerine götürülmüştür. 2021 itibariyle halen kampta tutulan en az 640 Avrupa vatandaşı çocuk bulunduğu bilinmektedir. Avrupa devletlerinin vatandaşlarını geri götürmeyi sistematik biçimde reddetmesi ve bu ret nedeniyle çocuk ve yetişkinlerin kamptan çıkmalarına izin verilmemesi üzerine, söz konusu kamplar,“Avrupa'nın Guantanamo'su”olarak anılmaya başlamıştır. Bu bağlamda tezin konusu, gözaltı kamplarında tutulan çocukların, vatandaşı oldukları ülkelere kontrollü olarak geri dönüşlerinin sağlanması hususunda, Avrupa devletlerinin insan hakları hukukundan doğan sorumluluklarının AİHM içtihadı çerçevesinde değerlendirilmesine ilişkindir. Bu çalışmada Avrupa devletlerinin, kampta tutulan çocuk vatandaşları üzerinde ülke dışı yetkileri olup olmadığı, en azından AİHS madde 2, 3 ve 8, ayrıca Ek 4 no.lu Protokol madde 3 kapsamında, çocukların ebeveynleriyle birlikte ülkelerine geri getirilmeleri yönünde pozitif bir yükümlülükleri olup olmadığı analiz edilmiştir."
