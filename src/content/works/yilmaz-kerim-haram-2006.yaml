abstract: "Bir yerde düzen ve disiplin varsa orada mutlaka bazı sınırlamalar da var demektir.Çünkü düzen fikriyle basıbosluk bir arada bulunamaz.Islam tutum ve davranıslarasınırlamalar getirirken birey ve toplumun saglıgını huzr ve mutlulugunu esas almıstır. YüceAllah iyi ve temiz seyleri helâl kılmıstır.Haramlar ise gerek insan saglıgı ve gerekse toplumaçısından zararlı olan, Allah katında sevimsiz olan is ve davranıslardır. Haram kılma yetkisiAllah'a aittir. Haramlar sınırlı olup, kulları harama muhtaç etmeyecek kadar çok helâl vardır.Haram yapılmaması istenen ve faili zemmedilen fiildir. Hanefiler yapılmaması istenen fiilzanni delille sabit oldugu durumları tahrimen mekruh, Cumhur ise haram olaraknitelendirmektedir. Haram kötülük vasfının o eylemin özünden veya onu çevreleyenseylerden kaynaklanmasına göre iki çesittir. Kur'an-ı Kerim haramları bir defada ortayakoymak yerine asama asama ortaya koymustur. Böylelikle insanların Kur'an-ı Kerim'inolusturdugu düzene kolay bir sekilde geçis yapmaları saglanmıstır."
