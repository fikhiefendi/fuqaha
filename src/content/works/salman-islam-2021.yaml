abstract: "Bu araştırma, İslam yargılama hukukunun davalara ilişkin verdiği hükümlerinde önemli bir yer teşkil eden ve yardımcı ispat vasıtalarından karinelerin suçların aydınlatılmasında ve tespitinde kriminalistik olarak adlandırılan tekniğin çalışma esaslarını ortaya koyması hedeflemiştir. Araştırmamız bir giriş, üç ana bölüm ve sonuç kısımlarından meydana gelmektedir. Giriş bölümünde tezin amacına, metoduna ve kaynaklarına yer verilmiştir. Tezin birinci bölümünde genel olarak ispat hukuku, yargılama hukuku ve karine başlıklarına yer verilerek İslam hukuku bağlamında mukayeseli bir biçimde benzer ve ayırıcı yönleri araştırılmıştır. Birinci bölümde İslam ispat hukukunda kriminalistik tekniklerini andıran diğer yardımcı ispat vasıtalarına yer verilmiştir. İkinci ana bölümde kriminalistik tekniğinin tarihi gelişimi ve günümüz dünyasındaki ispat değeri yargılama hukukundaki etkileri mukayeseli bir biçimde İslam hukuku açısından değerlendirilmeye çalışılmıştır. Üçüncü bölümde ise İslam Yargılama hukukunda modern karinelerin içerisinde mütalaa edilen kriminalistik tekniklerle elde edilen fiziksel, biyolojik ve tecrübi karinelere dair verilen örnek uygulama ve davaların günümüz yargılama ve ispat hukuku açısından mukayeseli değerlendirmeleri yapılarak hukuka ve makâsıda uygun olan görüşler temellendirilmeye çalışıldı. Bu görüşler temellendirilirken tamamen aslî ve bu alanda yeni yazılan akademik ve muteber kaynaklara atıfta bulunulmaya gayret edilmiştir. Sonuç kısmında ise araştırma sonucu elde edilen genel yargılar ifade edilmeye çalışılmıştır."
