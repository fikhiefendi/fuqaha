abstract: "Mâlikî mezhebinde fetva usul ve âdâbını ilgilendiren meseleler, geç dönemlerde müstakil eserlerde ele alınmış ve bu eserler mezhebin fıkıh usulü ve fetva kitaplarından bağımsız yeni bir yazım türünün doğmasını sağlamıştır. Bu tezde, modern öncesi İslâm tarihinin son dönemlerinde yaşamış Galâvî'nin (ö. 1245/1828) Butlayhiyye adlı manzum eseri ışığında Mâlikî mezhebinde yerleşik hale gelen fetva usul ve âdâbı bahse konu edilmiştir. Galâvî'nin nazmı, Mâlikîlerin özellikle müteahhir devirde cumhur görüşü haline gelen yaklaşımlarını yansıtması sebebiyle temsil gücü yüksek bir metin olduğu için tercih edilmiştir. Muhtelif eserlerde dağınık vaziyette işlenen konuları veciz ve sistematik bir şekilde nazım haline getiren ve bu sayede müftîler için bir el kitabı hüviyeti elde eden Butlayhiyye, fetva usulü konusunun önde gelen kaynaklarındandır. Çalışma, bir giriş, üç bölüm ile sonuç kısımlarından oluşmaktadır. Giriş kısmında çalışmanın kaynakları, araştırmada takip edilen yöntem ve tez boyunca kullanılan belli başlı kavramlar sunulmuştur. Birinci Bölüm'de Galâvî'nin hayatı ve içinde yetiştiği ilmî çevre tanıtılmış, ilmî çalışmaları analiz edilerek kendisinin bu alandaki yetkinliği incelenmiş ve nazmın içeriği, yöntemi ve kaynakları araştırılarak Mâlikî mezhebi ve hususen fetva usûlü literatüründeki yeriyle ilgili tespit ve değerlendirmelere yer verilmiştir. İkinci Bölüm'de müftî ve müsteftînin sahip olması gereken özellikler, müftî-müsteftî ilişkisini düzenleyen esas ve şartlar üzerinden fetva usul ve âdâbının öne çıkan yönleri ele alınmıştır. Üçüncü Bölümde ise iftâ sürecinin işleyişi ve mezheb içinde fetvaya esas olan (müftâ-bih) görüşün belirlenme süreci ve bu süreçte riâyet edilmesi gerekli kural ve ilkeler konu edilmiştir."
