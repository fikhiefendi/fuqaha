abstract: "Türk/İslam hukukuna damgasını vuran vakıf; dini, içtimai, iktisadi özelliklerini bünyesinde barındıran ve tarihi çok eskilere dayanan hukuki bir müessesedir. Vakıf müessesesinin çok yönlü ve birçok alanla ilgili olması, çeşitli açılardan araştırmaya ve incelemeye tabi tutulmasına neden olmuştur. Gerçekten de vakıf müessesesini her alanda kapsamlı bir şekilde incelemek mümkündür. Bu çalışma Türk/İslam tarihinde önemli bir yere sahip olan vakıf müessesesini hukuki yönü ile sınırlandırmıştır. Ancak vakıf müessesesini hukuki yönü ile sınırlandırmanın da çok geniş ve ayrıntılı olacağı şüphesizdir. Hukuki açıdan vakıf müessesesini bir bütün şeklinde incelemek için geniş bir zaman dilimine ve bu alanda çok derin bir bilgi birikimine sahip olmak gerekmektedir. Bu nedenle çalışma hukuki yönden yeni vakıflardaki denetim ile sınırlandırılmıştır. Çalışma üç bölümden oluşmaktadır. İlk bölümde vakıf kavramı, vakfın tarihi ve hukuki statüsü ile eski ve yeni vakıf çeşitlerinin her birinin kendine has özellikleri incelenmiştir. İkinci bölümde genel olarak denetim kavramı, denetim gerekliliği, ilke ve standartları ile denetim çeşitleri incelenmiştir. Bu bölümün devamında ise Osmanlı İmparatorluğu'nun kuruluşundan günümüze kadar olan süreç içerisindeki vakıf denetiminin geçirdiği evre, mevzuat ve günümüzde gelinen son nokta hakkında okuyucuya bilgi verilmeye çalışılmıştır. Çalışmanın üçüncü ve son bölümünde ise yeni vakıflar üzerindeki denetim ve yasal düzenlemeler incelenmiştir."
