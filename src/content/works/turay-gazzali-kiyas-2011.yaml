abstract: "Gazzâlî, mahiyeti itibariyle ?hüküm kaynağı? vasfını haiz olan şer'î delillerin kitâb, sünnet, icma'dan ibaret olduğunu ifade etmiş; kıyası ise bir hüküm çıkarma metodu olarak değerlendirmiş ve savunmuştur. Maslahat-ı mürseleyi ise, bu şekilde bir metot olarak da ele almamış, ancak onu kıyasla ilişkilendirerek kabul etmiştir. Münâsebe kavramı ise, Gazzâlî'nin metodolojisinde kıyas ve maslahatın kesişim noktasıdır. Nitekim Gazzâlî, makasıd ve maslahatla ilgili önemli tespitlerini, illeti tespit yollarından münâsebe kavramı bağlamında ortaya koymuştur. Öte yandan son dönemdeki fıkıh usûlü çalışmalarında illetin tespit yollarının en önemlisi olarak ele alınan münâsebe kavramını, fıkıh usûlü tarihinde ilk olarak tanımlayan ve tasnife tabi tutan bilgin Gazzâlî'dir. Bununla birlikte o, bu hususta hocası Cüveynî'nin yanı sıra, Hanefî usulcü Debûsî'den etkilenmiştir. Cüveynî'nin etkisi, maslahat ve makâsıd eksenindeki tespitlerinde kendisini gösterirken; Debûsî'nin etkisi ise münâsebe kavramını bir illeti tespit metodu olarak ele alırken kullandığı te'sîr ve mülâeme kavramlarında ortaya çıkmaktadır."
