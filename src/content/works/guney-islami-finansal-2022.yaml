abstract: "Kişinin yaşamını planlamak, tercihlerini elde etmek ve gerektiğinde bu süreçte istediği an istediği müdahaleyi yapabilmesi günümüz kapitalist düzeninde çoğunlukla“para”ile mümkün kılınabilmektedir. Parayı elde etme, koruma ve daha da artırma çabası ise sağlam bir finans yönetimi gerektirmektedir. Söz konusu finans yönetiminin başarısı ise finansal okuryazarlık kavramı ile doğru orantılı ve güçlü bir ilişki içerisindedir. Tam bu noktada küresel ekonominin benimsediği ve İslam dinince yasak olan bazı finansal enstrümanların İslam dinine uyarlanması ve bu husustaki finansal kararların dinin gerektirdiği inanç ve değerlere zıt düşmemesi İslami finans kavramını ve önemini ortaya çıkarmıştır. İslami finans kavramını anlamak, günlük hayata ve İslami değerlere uygunluğunun farkındalığı ile alınacak finansal kararlara uygulayabilmek ise İslami finansal okuryazarlık düzeyinin geliştirilmesiyle mümkün olacaktır. Bu çalışmada ulusal ve uluslararası ölçekte önemi artan İslami finansal okuryazarlık düzeyi ve özelinde İslami finans ürünlerinin ne kadar bilinir olduğu, ekonomik aktörlerden biri olan Vergi Müfettişleri için ölçülmeye çalışılmıştır. Türkiye'de görev yapan 289 Vergi Müfettişine“Google Forms”ile hazırladığımız anket ulaştırılmıştır. Bu anket çalışmasının sonuçlarından elde edilen veriler de SPSS programı ile analiz edilmiştir. Yapılan analiz sonucunda İslami finans ürünlerine ilişkin bilgi düzeyinin cinsiyet, öğrenim durumu ve unvana göre anlamlı bir farklılık gösterebildiği görülmüştür. Demografik değişkenlere göre en yüksek farklılık gösteren ürünlerin Müşareke ve Müdarebe olduğu; Sukuk, Riba ve Murabaha ürünlerine ait bilgi düzeyinin ise hiçbir demografik değişkene göre farklılık göstermediği görülmüştür. Ayrıca çalışma bölgesi değişkenine göre bilgi düzeyinin farklılık göstermediği görülmüştür. Sonuç olarak vergi müfettişlerinin İslami finansal okuryazarlık düzeyinin düşük olduğu tespit edilmiştir."
