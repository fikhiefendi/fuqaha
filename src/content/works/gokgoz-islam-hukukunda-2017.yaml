abstract: "İslâm hukukunda ilk dönemlerden itibaren tartışılan, günümüz İslâm İktisadı araştırmalarında da güncelliğini koruyan konulardan biri olan, borçlu ile alacaklı arasına üçüncü bir şahıs girmeksizin vadeli edimlerde erken ödemeye karşılık yapılan indirim, fakihlerin büyük çoğunluğu tarafından haramlığı Kur'an'la sabit olan borç faizine benzediği öne sürülerek faiz yasağı kapsamında değerlendirilmiştir. Yine sahâbeden günümüze kadar bir kısım fakihlere göre ise söz konusu işlem, bir tür karşılıklı yardımlaşma veya haksız kazanç ve sebepsiz zenginleşmenin önüne geçme olarak yorumlanmıştır. Bu çalışmada klasik dönemde iskontoya olumlu ve olumsuz bakan her iki gruptan fakihler tespit edilip meseleyle ilişkili gösterdikleri deliller tahlil edilecektir. Ayrıca iskontoyla ilişkilendirilen bazı kavram ve akitler de ele alınıp konuyla ilgili tartışmalara değinilecektir."
