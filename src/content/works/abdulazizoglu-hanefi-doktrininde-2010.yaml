abstract: "Bu çalışmada usûl eserlerinde kıyas yönteminin alanı ile ilgili olarak mezhep müctehidlerinden nakledilen görüşlere yer verildikten sonra furûda bu kurallara ne derece bağlı kalındığını belirleyebilmek gayesiyle Hanefî fıkhının temel eserlerinden olan Bedâi`u's-sanâi`nin İbadet ve ceza bölümlerinde kıyas yönteminin kullanılıp kullanılmadığı araştırılmıştır.İbadet ve ceza konularında kıyası cârî görmedikleri, bununla beraber kendi usûl kurallarına furû eserlerinde bağlı kalmadıkları ve tenakuza düştükleri şeklinde özellikle Şafiîler tarafından şiddetli tenkitlere muhatap olan Hanefîlerin yaklaşımları değerlendirilmiş ve onların bu sözle asıl kasıtlarının ne olduğu ortaya konmaya çalışılmıştır.Tezimiz bir giriş ve iki bölümden oluşmaktadır. Giriş bölümünde genel olarak Kıyas yöntemi ele alınmıştır.Birinci bölümde kıyas yönteminin ibadet ve ceza konularına şâmil olup olmadığı noktasında zikredilen görüşler üzerinde durulmuştur.Çalışmamızın esas amacı olan ikinci bölümde ise Bedâi`u's-sanâi`nin ibadet ve ceza bölümlerinde kıyas yöntemi, kullanıldığı anlam açısından taksimi esas alınarak örnekler üzerinde incelenmiştir."
