abstract: "Aşiret barışı, başta Araplar olmak üzere Orta Doğu toplumlarında yaygın bir olgudur. Bu sebeple Irak kabileleri arasında da uygulanmakta ve hatta devlet yasalarının önüne geçebilmektedir. Bunun sebebi ise kabile yasalarına duyulan saygı geleneğidir. Diğer yandan, bu yasalar hızlı ve uzlaşmacı çözümler sunarak daha fazla esneklik sağlayabilmektedir. Nitekim devlet mahkemelerine intikal eden davaların uzaması, büyümesi ve hapisle sonuçlanması, sorunu daha da büyütebilir, kin ve nefreti körükleyebilir. Özellikle kamu güvenliğini ilgilendiren davalarda tarafların uzlaşması her zaman mümkün olmayabilir ve bu gibi durumlarda kanunun emrettiği cezalar uygulanacaktır. Bu sebeple, toplumda aşiret yasalarına başvurmak yaygın bir tercihtir. Bu çalışmada aşiret barışı konusu ele almıştır. Bu bağlamda öncelikle aşiret barışı (الصلح العشائري) kavramının tanımı yapılmış, şartları, unsurları, önemi, etkileri, hangi durumlarda geçerli olup olmadığı, gerçekleştirilme aşamaları, uzlaşma hakkına sahip olanlar ve uzlaştırma sürecinde rol alan kişilerin nitelikleri belirtilmiştir. Ardından tüm bu konular çerçevesinde aşiretlerin uzlaşma gelenekleri ile pozitif hukuk ve İslam hukuku arasında mukayese yapılmıştır. Yapılan bu mukayese sonucunda elde edilen bulgular, her konunun sonunda analiz edilmiştir. Çalışma kapsamında ayrıca aşiretlerin belli suçlar için belirlediği uzlaşı geleneği örneklerine yer verilmiştir. Bu bağlamda bütün suçları incelemek çalışmanın sınırlarını zorlayacağından sadece cinayet, zina, hırsızlık ve yaralama gibi suçlarla sınırlı kalınmıştır. Bu suçlar önce aşiret yasaları açısından incelenmiş ardından İslam hukuku ve pozitif hukuk ile karşılaştırılmıştır. Araştırma sonucunda elde edilen bulgular arasında aşiret uzlaşmasının önemi ve geliştirilmesi gerektiği yer almaktadır. Zira Irak toplumunda önemli bir rol oynayan aşiret uzlaşması, kabileler arasındaki anlaşmazlıklarda sıklıkla başvurulan bir yöntemdir. Son olarak, aşiret barışının temel kurallarının ve çeşitli meselelerinin ayrıntılı bir şekilde incelenmesi, aşiret barışı ile şer'i ve pozitif hukuk arasındaki bağlantının araştırılması için bu konuda daha fazla akademik çalışma yapılması önerilmektedir."
