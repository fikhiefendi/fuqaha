abstract: "Bu çalışma din-ekonomi ilişkileri çerçevesinde yaşanan ekonomik olumsuzlukların din algısı üzerindeki etkisini araştırmaktadır. Bu bağlamda ?İslâmi? holdinglere para/sermaye sağlayan insanların, holdinglerin zarar etmesiyle yaşadıkları ekonomik olumsuzluklardan sonra, dini tutum ve davranışlarında meydana gelen değişimi analiz etmeyi amaçlamaktadır. Betimleyici bir modelle alan araştırması olarak gerçekleşen çalışma iki bölümden oluşmaktadır. Birinci bölümde, tarihsel süreç içerisinde din ekonomi ilişkisi, İslâm toplumlarında ekonomik hayat ve din konularındaki teorik tartışmalara değinilmiş, holding sermayesinin oluşum ve gelişim süreci ele alınmıştır. İkinci bölümde ise uygulama kısmı tartışılmıştır. Araştırmanın uygulama bölümünde veri toplama aracı olarak anket formu kullanılmış, anket formu evreni temsil ettiği düşünülen 490 kişiden oluşan bir örneklem üzerinde uygulanmıştır. Elde edilen bulgulara göre; holding tecrübesinden sonra örneklemin dindar insanlara olan güven duygularında azalma olduğu, dini hayatın ibadet boyutunda, dini grup ve cemaatlere katılımda, dini değer, sembol ve kutsal mekanlarla ilgili tutum ve davranışlarında, iktisat ahlâkı ile ekonomik faaliyetlerdeki tutum ve davranışlarında olumsuz yönde etkilenmeler olduğu tespit edilmiştir. Araştırma sonucuna göre; din ve dindarlığın, ekonomik alanda istismar aracı olarak kullanılması, dini kişilik, değer, sembol ve yapıların güvenirliğini tartışılır kılmakta, toplumsal dokuda kısa zamanda onarılması mümkün olmayan hasarlara neden olmaktadır."
