abstract: "“İmam Serahsî'nin el-Mebsût İsimli Eserinde İbâdât ve Ukûbât Konularında İstihsân Delilinin Uygulanması”adlı tezde, Hanefî fıkıh literatürünün önde gelen başvuru kaynaklarından biri olarak kabul edilen İmam Serahsî'nin el-Mebsût isimli eserinin ibadet ve ceza bahislerinde istihsân yönteminin nerelerde ve nasıl kullanıldığı tespit ve tahlil edilmeye çalışılmıştır. Çalışmamız bir giriş ve üç bölümden oluşmaktadır. Giriş bölümünde tezin konusu ve sınırlandırılması, amacı, yöntemi, kaynakları belitilmiş ve İmam Serahsî'nin kısaca hayatından bahsedilmiştir. Birinci bölümde genel olarak istihsân yöntemi ele alınarak istihsâna başvurmanın sebepleri ve hukuki dayanakları açıklanmıştır. Diğer taraftan istihsân ibadet ve ceza bahislerinde hüküm kaynağı olması açısından incelenmiştir. İkinci bölümde el-Mebsût'un ibâdât bahislerinde istihsân delilinin uygulanmış örnekleri tek tek incelenerek bu delilin uygulanma gayeleri üzerinde durulmuştur. Üçüncü bölümde el Mebsût'ta ukûbât konularında istihsânın uygulanışı ele alınıp değerlendirilmiştir. Sonuç kısmında ise elde edilen bilgiler ışığında değerlendirmelerde bulunulmuştur."
