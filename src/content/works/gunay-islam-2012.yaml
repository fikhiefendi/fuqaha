abstract: "İslâm hukukunun oluşum sürecinde yaşayan İmam Ebû Hanîfe'nin ictihad anlayışını incelediğimiz bu çalışmada, ilk olarak Ebû Hanîfe'nin yaşadığı dönemin ve coğrafyanın sosyo-kültürel özellikleri ele alınmıştır. Bu sayede Ebû Hanîfe'nin ictihad metoduna etki eden âmillerin tespitine çalışılmıştır. Ayrıca o dönemde mevcut olan ilim anlayışı ve fıkıh metodolojisinin oluşum aşamaları hakkında bilgi verilmiştir.Birinci bölümde, Ebû Hanîfe'nin hayatı, çağdaşı olan fakîhlerle münasebetleri, ictihad metodu işlenerek Ebû Hanîfe'nin etkileşim içinde olduğu fıkıh dünyası yansıtılmıştır. Bu bölümün sonunda ictihadın tanımı, Hz. Peygamber'in (sav) ictihadları, ashâb ve tâbiîn döneminde ictihad uygulamaları ve metodları örneklerle açıklanmıştır.İkinci bölümde şer'î delillerden Kitap ve sünnet, İmam Ebû Hanîfe'nin ictihad metodu çerçevesinde ele alınmıştır. Burada kelam- usûl ilişkisi çerçevesinde kısmen Ebû Hanîfe'nin kelamî görüşlerine de yer verilmiştir. Onun benimsediği fıkıh usûlü, fürû meselelerinden örnekler verilmek sûretiyle incelenmiştir. Ebû Hanîfe'nin ictihad usûlü hakkında bilgi verirken hem diğer mezheplerin görüşleri hem de Hanefî ekolünün içindeki diğer görüşlere de atıfta bulunulmuştur.Üçüncü bölümde ise kıyas, istihsan ve icmâ delillerini Ebû Hanîfe'nin değerlendirme biçimi üzerinde durulmuştur. Bu bölümde ayrıca, şer'î delillerin sıralamasında yapılan değişikliğin gerekçelerine de yer verilmiştir."
