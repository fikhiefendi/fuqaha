abstract: "ÖZET Bizans Sonrası Kanun Yapma ve Uygulamada Bizans Hukuk Geleneği Merlino, Mark M.A., Tarih Bölümü Tez Yöneticisi: Prof. Dr. Eugenia Kermeli Haziran 2004 Bu tez zaman içindeki gelişimiyle Bizans hukuk geleneğinin ana özellik ve öğelerinin taslağını çizer ve bu hukuk geleneğinin artık Bizans İmparatorluğu yokken özellikle aile hukuku konusunda nasıl değiştiğini anlatır. Bu tez bir 17. yüzyıl Bizans sonrası kanun koleksiyonu olan Nomokritirion'u detaylı olarak tahlil eder ve Nomokritirioriun içeriğinin diğer Bizans sonrası kanun koleksiyonlarından uygulamada nasıl farklı olduğunu anlamak için bu koleksiyonu dönemin diğer hukuk kaynakları ile karşılaştırır. Bu tezin asıl savı Osmanlı'daki Nomokritirion gibi Bizans sonrası kanun koleksiyonların eski Bizans koleksiyonlarının basitleştirilmiş modifikasyonları olduğudur. Bizans sonrası kanun koleksiyonları sadece kilisenin yasal yargılama yetkisinin bulunduğu alana dair içeriği kapsıyordu ve arkaizmleri içerip genellikle toplumun İslamlaşmasına dair konuları işlemezken o döneme ait yasal gerçeklikleri de tümüyle yansıtmıyordu."
