abstract: "Bu tez 16. yy Osmanlı Şeyhülislâmlarından olan Sun'ullah Efendi'nin yaşadığı dönemin tarihsel arka planı, Sun'ullah Efendi'nin hayatı, eserleri ve fetvalarının çevrim yazısı konularını kapsamaktadır. Araştırma giriş ve iki bölümden oluşmaktadır. Giriş bölümünde dönemin tarihsel arka planından bahsedilecektir. Birinci bölümde Sun'ullah Efendi'nin hayatı, eserleri ve fıkhî görüşleri incelenecektir. İkinci bölümde Sun'ullah Efendi'nin fetva risalesinin çeviri yazısı neşredilecektir. Sonuç bölümünde ise konu hakkında genel bir değerlendirme yapılacaktır."
