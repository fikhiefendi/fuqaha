abstract: "Hiçbir insan dünyaya kendi talebi üzerine gelmemektedir. İnsanın vücûd bulmasında Yaratıcının ve ana babasının iradesi etkili olmaktadır. Yani insanın varlık bulmasında kendisi dışındaki karar vericiler rol oynamaktadır. Günümüzde insan üzerinde öyle tıbbî tasaruflar uygulanmaktadır ki, Allahın yaratmasına bile müdâhale edildiği söylenebilir. Gelinen nokta neredeyse insanın üremesi değil; üretilmesidir. İnsanın varlık sahasına çıkmasında karar vericiler etkili olduğu gibi; varlık bulmamasında da karar vericiler etkili olabilmektedir. Dışarıdan bir müdahale olmasa, varlık sahasına çıkacak olan cenînin varlığına çeşitli sebeplerle/bahanelerle son verilebilmektedir. Çalışmamız, oluşum aşamasında ve oluştuktan sonra cenîne yapılan tıbbî müdâhalelerin İslâm hukûkuna göre hükmünü ortaya koymayı amaçlamaktadır. Günümüz insanının başvurduğu çocuk sahibi olma yöntemlerini ve oluşmuş cenînden kurtulmak için ileri sürülen gerekçeleri ve bunların İslâm hukûku açısından hükümlerini ele aldık. Canlılığın başlangıcı konusunda görüş birliğine varılamadığı ve yaşamın başlangıcının, parçacı yaklaşımlarla tespit edilmeye çalışıldığı anlaşılmaktadır. Genel yaklaşım olarak tedavi edici, kolaylaştırıcı ve faydalı mahiyette olan tıbbi müdahalelerin dini açıdan da benimsendiğini; buna karşılık tabiatı bozma veya olumsuz mahiyyetteki müdahalelerin ise kabul görmediğini söyleyebiliriz."
