abstract: "İslam fıkıh literatüründe, Fukahâ tabakalarını konu edinen ilim dalının, tarihi seyri içerisinde iki ayrı fen olarak teşekkül ettiği görülmektedir. Birincisi: Fukahanın hal tercemeleri, yani; nesepleri, ne kadar ömür sürdükleri, ne zaman vefat ettikleri ve kendileri hakkında önemli kişilerden varid hüsn-ü beyanları v.b. konuları içermesi anlamında özel hayatlarını konu edinen ilim dalı. Diğeri ise; hâiz oldukları ilmî dereceler itibariyle fukahanın tabakalarını konu edinen ilim fenni. Tezimiz, bu ikinci kısım ilim dalını esas alıp bu çerçevede dört mezhep fakihlerinin dercelerini ve bu çerçevede yerine getirmekte oldukları fıkhî görevleri konu almaktadır. Bunun yanında söz konusu fıkhî mertebe ve vazifeler etrafında cereyan eden tartışmaları da ihmal etmemektedir. Fıkhî mertebe ve vazifeler müvacehesinde oluşan zihni karışıklığı mümkün mertebe ortadan kaldırmak ve neticesinde en sağlıklı olan fukaha taksimine ulaşmak da tezin en önemli hedeflerinden biridir. Bu amaca ulaşmak için; öncelikle dört mezhep fukahasının tarihi süreç içerisinde yapmış olduğu taksimler mezheplerin ortaya çıkış sırasına göre ele alınmış ve müteahhir Hanefi fukahası nezdinde genel kabul görmüş olan İbn-i Kemal Paşanın taksimine öncelik vermiştir. Sadece söz konusu taksimi zikretmekle yetinmeyip, bu taksime yöneltilen eleştirilerin de etraflıca incelenmesine azami gayret gösterilmiştir. Bunun yanında İbn-i Kemal'in taksimini yetersiz gören bazı müteahhir Hanefi alimlerinin ve birtakım muasır araştırmacıların öne sürdükleri ve daha doğru olduğunu iddia ettikleri bir takım fukaha taksimleri de etraflıca değerlendirilip ilmi kıymetleri ortaya çıkartılmaya çalışılmştır. Mezheplere göre fukaha taksimlerini zikrettikten sonra, fakihlerin temsil ettikleri mertebelere uygun olarak yerine getirdikleri“mutlak müstakil ictihad”,“mutlak müntesib ictihad”“mezhebde ictihad”,“mesâilde ictihad”,“tahric”, tercih“, ”temyiz“ ve ”taklid“ gibi fıkhî görevler etraflıca incelemeye tabi tutulmuşlardır. Öncelikle kaynaklarda zikredilen fukaha taksimleri bir araya getirilmiş, taksimlere dair ileri sürülen farklı görüşlerin asıl etkenlerine nüfûz edilmeye çalışılmış ve bunun neticesinde, fukahanın ilmi mertebelerinin ve fıkhî vazifelerinin daha net bir şekilde birbirinden ayrışmasına bir nebze olsun katkıda bulunmaya gayret edilmiştir. Fukahanın fıkhî mertebeleri ve vazifelerinin dikkatlice incelenmesi neticesinde anlaşılmıştır ki; İbn-i Salah ve İbn-i Kemal'in ortaya koydukları fukaha taksimleri, bu alanda yapılmış olan hemen hemen diğer tüm taksimlere esas teşkil etmektedirler. Önemli olan bir diğer husus da; bu çerçevede zikredilen fıkhî vazifelerden önemli bir kısmı, her ne kadar farklı isimlerle anılıyor olsalar da aslında tezin ikinci bölümünde zikredilen vazifelerle büyük ölçüde örtüştükleri anlaşılmış, aradaki farklılıkların lafzî ihtilaf ötesine geçmedikleri görülmüştür. Bu konuyu çalışmanın en önemli sonuçlarından biri –az önce de kısaca değindiğimiz gibi- bazı ihtilaflı meselelerin asıl sebeplerinin tespit edilmiş olmasıdır. Örneğin, tahriç ve tercih sahibi fakihlerin müctehid mi, yoksa mukallid mi kabul edilmesi gerektiğine dair söz konusu ihtilaf ki; bunun asıl sebebi, ictihadın bölünüp bölünmeyeceğine dair bilinen meşhur ihtilaftır. Yine bir diğeri de; bir mutlak müctehidin başka bir mutlak müctehidi taklit etmesinin caiz olup olmaması, meselesi… Bu konuda mütekaddim Hanefi imamlardan, cevaz veren ve vermeyen iki rivayet bulunmaktadır. İhtilafın tarafları olan alimlerden bir kısmı cevazına dair rivayeti, diğerlerinin de bunun karşıtı olan rivayeti esas aldıkları anlaşılmaktadır. Ebu Yusuf, Muhammed b. Hasen ve Züfer b. Hüzeyl gibi imamların ilmi dereceleri etrafında gelişen ihtilaf da bu hususta zikredilebilecek bir başka örnektir. Zira fukahanın ”usûl\" kavramına yüklenen anlam üzerindeki ihtilafı bu görüş ayrılığının nüvesini oluşturmaktadır. İhtilafların asıl sebeplerine dair elde edilen bu sonuçlar belki de bu çalışmanın en önemli sonuçlarından biridir."
