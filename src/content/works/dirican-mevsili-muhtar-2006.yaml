abstract: "el-Muhtar, el-Mevsûlû'nin Hanefi fıkhını anlattığı bir eserdir. Fıkhın bütünkonuları genel hatlarıyla anlatılmıştır. Eserde mam Şafii'nin muhalefet ettiği yerlerrumuzla gösterilmiştir. şte buradaki bir takım eksik ve yanlışlar üzerine bu çalışmayapılmıştır. Tezde mam Şafii'nin, anlatılan görüşe katılmadığı 457 meseleincelenmiştir. Üç bölümde ele alınan çalışmada, 14 yerde konulan rumuzun yanlışolduğu ortaya çıkmış, rumuzla belirtilmesi gereken 258 mesele de tespit edilmiştir.Tahkik edilen 457 fıkhû konu Şafii kaynaklarından hareketle izah edilmiştir. Fıkhınhemen hemen bütün konuları mukayese edilerek Hanefi ve Şafii mezhepleriningörüşleri hakkında bilgi verilmiştir."
