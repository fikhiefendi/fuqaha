abstract: "Tarihin seyri içerisinde birtakım şahsiyetler ilmî ve ahlakî kişilikleriyle ön plana çıkmış, bulundukları toplumu aydınlatmışlardır. Kültür mirasımızın kaynakları olan bu örnek şahsiyetlerin tanıtılması ve görüşlerinin gelecek nesillere aktarılması önem arz etmektedir. İlmî ve fıkhî kişiliği ile ön plana çıkmış olan şahsiyetlerden birisi de 1938-2002 yılları arasında, Bolu'da yaşamış olan Ekrem Doğanay Hoca Efendidir. Bu araştırmada Ekrem Doğanay Hoca Efendinin yaşamından yola çıkılarak devrinin güncel fıkhî meselelerine yaklaşımları hakkında bilgi verilmiştir. Kaleme aldığı eserleri daha çok fıkhî yönden tanıtılmaya çalışılmış, giriş ve iki bölümden oluşan çalışmanın giriş kısmında Ekrem Doğanay Hoca Efendinin yaşamış olduğu dönem ve bu dönemdeki önemli ilmî şahsiyetler tanıtılmıştır. Birinci bölümde; Doğanay'ın hayatı, eserleri, ilmî ve ahlakî kişiliği, çalışmanın omurgasını oluşturan ikinci bölümde ise; kaleme aldığı eserlerinde fıkhî meselelere nasıl yaklaştığı üzerinde durulmuştur. Fıkhî görüşleri incelenirken daha çok, yaşadığı dönemde gündemde olan ve bugün de tazeliğini koruyan meselelere yaklaşımı ele alınmıştır. Çalışmada, cuma namazı hakkındaki tartışmalar, seferîlik ve hükümleri, talak ve özellikle bir defada verilen üç talakın kaç boşama sayılacağı, zina ve tesettür hakkındaki görüşleri ele alınmıştır. İkinci bölümün sonunda Ekrem Doğanay Hoca Efendinin, Yaşar Nuri Öztürk'ün“Kur'an'daki İslam Anlayışı”isimli eserine yazdığı reddiyede ifade ettiği fıkhî görüşleri üzerinde durulmuştur. Fıkhî görüşleri, günümüz âlimlerinin ve Diyanet İşleri Başkanlığı'nın fetvaları ile birlikte değerlendirilmiştir."
