abstract: "“İslami Finans”ya da“faizsiz bankacılık”olarak adlandırılan katılım bankaları, 1985'den bu yana otuzbeş yıl içinde Türkiye ekonomisinin gelişmesinin bir parçası olmuştur. Muhafazakar toplumun faiz hassasiyeti nedeniyle bankacılık sistemine dahil olmayan atıl fonları ekonomiye kazandırmıştır. Katılım bankaları ile mevduat bankalar arasında bankacılık sistemi açısından işlevsel olarak bir farklılık bulunmasada, müşterilerinden tasarrufları toplarken ve kredi kullandırılırken mevduat bankalarından farklı modeller kullanmışlardır. Bu modellerin ortaya çıkmasında İslamdaki faiz yasağına uygun hareket etmek etkili olmuştur. Türkiye'de katılım bankacılığı 1983 yılından itibaren yer bulmaya başlasada, Bankacılık Düzenleme ve Denetleme Kurumu'na tabi olan bankacılık statüsüne ilk defa 2005 yılında dahil omuştur. Çalışmamızda katılım bankaları ile mevduat bankalarının farklılıkları, güçlü ve zayıf yönlerini anlattıktan sonra, katılım bankalarının Türkiye ekonomisine katkıları analiz edilmiştir. Bu analiz yapılırken katılım bankalarının ilk defa bankacılık sistemine dahil olduğu 2005 yılından 2020 yılına kadarki geçen süreç seçilmiştir. Katılım bankalarının bankacılık sektörü içindeki payı analiz edilirken karşılaştırmanın sağlıklı bir şekilde yapılması için bankaların hem mevduat yapıları hem de kredileri hangi sektörlere hangi oranlarda kullandırdıkları incelenmiştir. Değerlendirme sonucunda aktif yapısına göre mevduat bankalarının tüm bankacılık sistemi içindeki payının %93 olması nedeniyle sektörü domine ettiği ve son 10 yıla bakıldığında katılım bankalarının sektördeki payının %5-6 arasında kaldığı görülmüştür. Bankaların verdiği kredilere bakıldığında mevduat bankalarının hizmet, finans, imalat ve inşaat sektörüne yoğunlaşırken katılım bankalarının hizmet, imalat ve inşaat sektörüne yoğunlaşmış ve diğer sektörlerde önemli bir varlık göstermemiştir. Analiz ettiğimiz veriler katılım bankalarının hem mevduat toplama hem de kredi dağıtma sistemiyle ilgili bir kısım sorunlar yaşadığını ortaya koymaktadır. Bu çalışmada yapılan ampirik çalışmada Ocak 2005- Aralık 2020 dönemini kapsayan banka bazlı dönemlik veri seti kullanılarak, Türk bankacılık sektörü için sektörel kredi yoğunlaşma endeksi hesaplanmış ve ilgili sektörlerin endekslere katkıları ayrıştırılmıştır. Ayrıca, sektörel kredi yoğunlaşma endeksinin katılım bankalarına ve mevduat bankalarınınperformansına etkileri kârlılık göstergeleri üzerinden ayrı ayrı incelenmiştir. Bu çerçevede çalışmanın finansal istikrar kapsamında yapılan analizlere ve düzenleyici otoritelerin politika geliştirme süreçlerine katkı sağlaması hedeflenmiştir. Bu kapsamda sektörel kredi yoğunlaşma endeksinin özkaynak karlılığı üzerindeki etkileri öncelikle ARDL yöntemi kullanılarak analiz edilmiştir. Çalışmada ilk olarak katılım ve mevduat bankalarının sektörel kredi portföyü için banka bazlı verilerden yoğunlaşma endeksi hesaplanmıştır. Endeks sonuçları, küresel kriz sürecindeki oynaklıklar dışında kredilerde sektörel yoğunlaşmanın genel olarak mevduat bankalarında düşük seviyelerde, katılım bankalarında ise orta seviyelerde olduğunu göstermiştir. İkinci olarak Sektörel kredi yoğunlaşmasının bankacılık sektörü kârlılığı üzerindeki etkileri özkâynak ve aktif karlılığı üzerinden incelenmiş ve böylece ilişkinin yönü farklı kârlılık göstergeleri üzerinden araştırılmıştır. Değerlendirme Sonucunda bankaların sektörel kredi yoğunlaşma endeksi ve kârlılık oranları arasında pozitif ilişkisi olduğu ancak katılım bankalarının mevduat bankalarına göre daha az oranda etkilediği sonucuna ulaşılmıştır."
