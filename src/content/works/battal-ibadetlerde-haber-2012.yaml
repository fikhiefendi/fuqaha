abstract: "ÖZETİbadetlerde Haber-i Vâhid'in Delil Olması Bağlamında NamazEsra BATTALDokuz Eylül ÜniversitesiSosyal Bilimler EnstitüsüTemel İslam Bilimleri Anabilim Dalıİslam Hukuku ProgramıÂhâd haber genel olarak mütevâtir haberin niteliklerine sahip olmayan haber olarak tanımlanır ve İslam Hukuk Usulü'nde tartışma konusu olmuştur. Âhâd haberin bağlayıcı bir delil olup olmaması hususu, bu tartışmaların başlıca sebebidir.Âhâd haberin bir delil olma niteliği taşıdığına dair Kur'an'dan, Sünnetten ve Sahabe uygulamalarından deliller vardır. Konu ile ilgili tartışmalar ilk üç nesilden sonra başlamıştır.Âlimler, âhâd haberleri kendilerine has metotlarla değerlendirmişlerdir. Hanefîler, konuya içinde yaşadıkları ortama göre yaklaşmışlar ve âhâd haberin bir delil değeri taşıması için belirli şartlar gerektiğini ileri sürmüşlerdir. Şafiîler, genel olarak hadislerde senedi muttasıl olan âhâd haberlerle amel etmişler, ancak râvide birtakım şartlar aramışlardır.Bu çalışmada iki mezhebin namaz konusunda haber-i vâhid anlayışlarından kaynaklanan farklılıklar üzerinde durulmuştur.Giriş bölümünde İslam Hukukunun kaynaklarını teşkil eden, Kur'an, Sünnet, İcmâ ve Kıyas konularına özetle değinilmiştir.Birinci bölümde genel olarak haber, haber çeşitleri ve âhâd haberin tanımları üzerinde durulmuş, mevcut tartışmalar ve açıklamalara değinilmiştir.İkinci bölümüde namazın şartları ve rükünleri ile ilgili âhâd haber örneklerine ve Hanefî ve Şafiî mezheplerinin konu ile ilgili görüşlerine genel olarak yer verilmiştir.Üçüncü ve son bölümde, farz, vacip ve nafile namazlarla ilgili âhâd haber örnekleri ve yine konumuzun temelini oluşturan hususta mezheplerin görüşleri konu edilmiştir.Sonuç olarak âhâd haberin namaz konusunda, mezhepler arasında neden olduğu ihtilaflar, hadisler ve mezheplerin yorumları çerçevesinde tespit edilmeye çalışılmıştır."
