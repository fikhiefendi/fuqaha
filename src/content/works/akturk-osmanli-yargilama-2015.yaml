abstract: "Bu çalışmada, genel olarak İslam ve Osmanlı Yargılama Hukuku ve bu hukuk kapsamında yargılama sırasında kullanılan ispat vasıtaları incelenmiştir. Bu bağlamda İslam ve Osmanlı adliye teşkilatı, yargılamada görevli kişiler, dava ve davanın şartları, hüküm ve çeşitleri, ispat hukukunun temel kavramları, ispat vasıtaları olarak da şahitlik, ikrar, yemin, kasâme, liân, hakimin şahsi bilgisi, karine, yazılı belge, bilirkişi ve keşif konuları ele alınmıştır. Bu hukuk tarihi çalışmasının amacı, Türkiye Cumhuriyeti Devleti'nin selefi addedilen Osmanlı Devleti'nin yargılama hukukundaki ispat vasıtalarını ortaya koymaktır. Bu amaca yönelik olarak, ilgili ispat vasıtasının tanımı, dayanağı, şartları, çeşitleri ve hukukî sonuçları incelenmiştir. Modern hukuk sistematiği kullanılan bu çalışmada, İslam Hukuku kaynaklarındaki hukukî terimlerin günümüz hukukundaki karşılıkları verilmiş ve yer yer sadeleştirme yapılmıştır. Diğer çalışmalardan farklı olarak, incelenen kuralların Osmanlı Hukukunda nasıl uygulandığını göstermek amacıyla şer'iyye sicillerinden karar örnekleri eklenmiştir. Osmanlı Yargılama Hukukundaki ispat vasıtalarının günümüz hukukundaki karşılıkları, benzerlik ve farklılıkları da özgün bir şekilde ele alınarak Osmanlı ile günümüz hukuk sistemi arasında mukayese yapabilme imkanı sunulmuştur."
