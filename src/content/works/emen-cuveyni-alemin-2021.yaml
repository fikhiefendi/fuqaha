abstract: "Bu çalışmada Allah'ın varlığının delillerinden biri olan hudûs delilinin“Âlem hâdistir.”önermesi, hicri beşinci yüzyılda yaşayan ve İmâmü'l-Harameyn olarak bilinen Eş'arî mezhebine mensup Abdülmelik el-Cüveynî'nin görüşleri çerçevesinde ele alınmıştır. Çalışma yürütülürken büyük ölçüde, Cüveynî'nin bu konuya geniş bir şekilde yer verdiği eş-Şâmil fî Usûli'd-Dîn adlı eserinden yararlanılmıştır. Çalışmamızın ilk bölümünde Cüveynî'ye kadar olan dönemde Allah-âlem ilişkisine bakış ve var olan hudûs delilinin farklı formları incelenmiştir. Hudûs delilinin öncüllerine yaklaşımlar ve bu öncüllerin nasıl delillendirildiği açıklanmaya çalışılmıştır. Son olarak Cüveynî'nin hudûs delilini kendisine has bir yaklaşımla nasıl formüle ettiğine değinilmiştir. Onun yaklaşımının kendine kadar olan dönemde ve kendi mezhebi içerisinde nerede bulunduğu, kendisinden sonraki dönemi de nasıl etkilediği değerlendirilmeye çalışılmıştır. İkinci ve çalışmamızın konusunun asıl işleneceği bölümde Cüveynî'nin âlemin hudûsu hakkındaki görüşleri değerlendirilmiştir. Cüveynî'nin, âlemin hudûsunu ispatlarken kullandığı cevher-araz metodu incelenmiştir. Onun, varlıkları yalnızca hudusları bakımından değil imkanları bakımından da ele alması ve bunu delile entegre etmesi değerlendirilmiştir. Ayrıca cevher-araz metodunu işlerken ortaya koyduğu usulün, Cüveynî'nin akidesini nasıl şekilendirdiği tespit edilmeye çalışılmıştır."
