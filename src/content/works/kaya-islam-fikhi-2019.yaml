abstract: "Bu çalışmada, İslam Fıkhı açısından seferîlikte namazların kısaltılması ve birleştirilmesi ele alınmıştır. Çalışma giriş ve üç bölümden oluşmaktadır. Giriş bölümünde; seferiliğin genel tarifi yapılmıştır. Birinci bölümde; seferilikle ilgili hükümler, Kur'an-ı Kerim ve Sünnette seferiliğin nasıl geçtiği belirtilip, gerek usul ve gerek füru' yönünde seferiliğin illeti ve hikmeti ele alındı. Seferilikte namazı kısaltmanın genel mi, özel mi olduğu hususu mezhepler arası mukayeseli bir şekilde ele alınmıştır. İkinci bölümde, seferiliğin şartları ve seferiliğin hükümleri mezheplerin görüşleri ekseninde ayrı ayrı ele alınmıştır. Üçüncü bölümde ise seferilikte cem konusu ve seferîlikle ilgili muhtelif konular ele alınmıştır. Cem'in hangi durumlarda mümkün olduğu, cem'i takdim ve cem'i tehir şartlarının neler olduğu ele alındıktan sonra, seferîlik hükümlerinin kapsamına giren seferde oruç tutma mükellefiyeti, mestler üzerine mesh süresi, vasıtada namaz kılma durumu ve seferilikle ilgili diğer muhtelif konular ele alınmıştır."
