abstract: "Haber-i vâhidin Kur'ân'a arz edilmesi ve arz neticesinde Kur'ân'a aykırı olduğu tespit edilen hadisleri ele almaya çalıştığımız tezimiz giriş, üç bölüm ve sonuçtan oluşmaktadır. Giriş kısmında konunun önemi, amacı, kapsamı, yöntemi ve kaynaklarına ilişkin açıklamalar yer almaktadır. Birinci bölümde, hadislerin Kur'ân'a arzının mantığını daha iyi ortaya koyabilme adına,“Manevî Inkıtâ'”kavramı ve manevî ınkıtâ'a sebep olan durumlar, Pezdevî ve Serahsî'nin takip ettiği yol izlenerek“Muâraza”ve“Râvideki Kusur Sebebiyle Inkıtâ'”başlığı altında alınmaktadır. İkinci bölümde, çalışmamızın da asıl konusunu teşkil eden, genelde hadislerin özelde haber-i vâhidlerin Kur'ân'a arz edilme mevzusu, Hanefî usûl kaynakları çerçevesinde detaylı bir şekilde taranarak incelenmektedir. Bu bölüm de kendi içerisinde Sünnetin Kur'ân karşısındaki konumu ve hadislerin Kur'ân'a arzının gerekçeleri ve dayanakları şeklinde iki başlık altında incelenmektedir. Üçüncü bölümünde, Hanefî usûl ve fürû kaynaklarında Kur'ân'a aykırılık gerekçesiyle amel edilmeyen hadisler, ibâdât, muâmelât ve ukûbât şeklinde tasnife tabi tutularak fürûa yansımaları gösterilmeye çalışılmaktadır. Sonuç bölümünde ise araştırma neticesinde tespit edilen hususlar maddeler halinde kısaca özetlenmektedir."
