abstract: "Tezde, akdin hukuki sonuçlarından biri olan bağlayıcılık kavramı İslâm borçlar hukuku açısından ele alınmaktadır. Tez konusunun borçlar hukuku alanı ile sınırlandırılması nedeniyle nikah akdinin bağlayıcılığı incelenmemektedir. İslâm borçlar hukukunda akdin bağlayıcılığı ele alınırken Hanefî, Mâlikî, Şâfi'î ve Hanbelî mezhepleri olmak üzere dört mezhep esas alınmakta, yeri geldiğinde diğer mezheplerin görüşlerine de temas edilmektedir. Tez, Giriş ve Dört Bölüm'den oluşmaktadır. Giriş kısmında tezin içerik ve yöntemi hakkında bilgi verilmektedir. Birinci Bölüm'de İslâm borçlar hukukunda akdin bağlayıcılığı kavramı, ilişkili olan diğer kavramlarla birlikte ele alınarak tanımlanmaktadır. İkinci Bölüm'de İslâm borçlar hukukunda akdin bağlayıcılığının şer'î dayanakları incelenmektedir. Üçüncü Bölüm'de İslâm borçlar hukukunda akdin bağlayıcı olabilmesi için aranan şartlar ele alınmaktadır. Dördüncü Bölüm'de ise İslâm borçlar hukukunda akdin bağlayıcılığının hukuki sonuçları incelenmektedir."
