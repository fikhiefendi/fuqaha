abstract: "Endülüs'te yetişen İbn Hazm birçok ilim sahasında eser kaleme almıştır. Bu eserlerinden biri de el-Muhallâ'dır. El-Muhallâ füru fıkıh konularını kapsayan mukayeseli fıkıh kitabıdır. İbn Hazm, bu eserinde farklı imam ve müçtehitlerin görüşlerine yer vermiştir. Bu çalışmada el-Muhallâ eserinin ceza hukuku“Ukûbât”bölümünde Ebû Hanîfe'ye nispet edilen görüşlerin tahkik ve tahlili yapılacaktır. Çalışmanın temel hedefi, İbn Hazm'ın el-Muhallâ'da sunduğu görüşlerin, Ebu Hanîfe'nin görüşleriyle ne kadar örtüştüğünü araştırmak ve bu görüşlerin doğruluğunu veya yanlışlığını tespit etmektir."
