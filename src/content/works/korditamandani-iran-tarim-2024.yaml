abstract: "Tarım sigortası, güvence altında alan bir kurum olarak çiftçilerin faaliyetlerini genişletmeyi teşvik eder. Tarım sigortasının uzmanlaşmasıyla, tarım alanında bölgesel tarım türlerine, istenilen ürün kombinasyonlarına, modern tarım yöntemlerinin yaygınlaştırılmasına ve nihayetinde tarım sektörünün genişlemesine ve gelişmesine yönelik temel stratejiler geliştirilebilir. Bu araştırma, İran'da tarım sigortasıyla ilgili koşulları, sorunları ve kısıtlamaları incelemeyi amaçlamaktadır. Araştırmanın modeli, nitel araştırmalarda kullanılan çalışma modelidir. Araştırmanın verileri, İran'daki 22 uzman kişi ile gerçekleştirilen yüz yüze görüşmeler aracılığıyla toplanmış, veri doygunluğuna ulaşıldığında veri toplama süreci sonlandırılmıştır. Araştırma yöntemi, eleştirel bir yaklaşıma dayanmaktadır ve veriler, Grounded Theory analiz tekniği kullanılarak incelenmiştir. Derinlemesine mülakatlar aracılığıyla elde edilen sonuçlar, MaxQDA programı ile analiz edilmiştir. Bu mülakatların analizi sonucunda, toplam 987 ham veriden 692 kavram çıkarılmıştır. Bu kavramlardan 10 ana tema elde edilmiş ve iki temel olgu olan“kusurlu yönetim”ve“yapısal sorunlar”belirlenmiştir. Ayrıca,“işlevsel bozulma”seçilen temel olgu olarak tanımlanmıştır. Kusurlu yönetim ve yapısal sorunlar, İran'daki tarım sigortasını işlevsel bir çöküşle karşı karşıya bırakmıştır. Araştırma bulguları, İran'daki tarım sigortasının çeşitli yapısal ve yönetimsel sorunlarla karşı karşıya olduğunu göstermektedir. Katılımcıların ifadelerine göre, tarım sigortası fonunun yönetim yapısında uzman eksikliği, yolsuzluk, emir-komuta yönetimi ve bağımsızlık eksikliği gibi sorunlar bulunmaktadır. Ayrıca, tarım sigortası hizmetlerinin düşük seviyesi, çiftçilerin düşük eğitim seviyesi ve sigorta fonunun devlet yardımlarına bağımlılığı gibi yapısal sorunlar da tespit edilmiştir. Bu sorunlar, tarım sigortasının işlevsel bozulmasına ve çiftçilerin memnuniyetsizliğine yol açmaktadır. Araştırma sonuçları, tarım sigortasının etkinliğini artırmak için yönetim yapılarında, düzenlemelerde ve modern bilgilerin kullanımında temel değişiklikler yapılması gereğini ortaya koymaktadır. Ayrıca, çiftçilerin sigorta hizmetlerinden memnuniyetini artırmak için sigorta primlerinin adil bir şekilde belirlenmesi, hasar tespit süreçlerinin hızlandırılması ve çiftçilere yönelik eğitim ve tanıtım programlarının düzenlenmesi gerekmektedir. Devletin tarım sigortasına yönelik mali desteklerinin artırılması ve özel sektörün bu alana katılımının teşvik edilmesi de önemli öneriler arasındadır. Bu şekilde, tarım sigortası, çiftçilerin risklerini azaltarak tarım sektörünün sürdürülebilirliğine ve gelişimine katkı sağlamaktadır."
