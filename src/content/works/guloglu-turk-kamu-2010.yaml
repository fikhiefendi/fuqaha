abstract: "Topluma sağladığı doğrudan ve dolaylı birçok faydaları bulunan ormanlar yaşamsal doğal kaynaklarımız arasında yer almaktadır. Ülkemizde mülkiyet bakımından ormanlar üç gruba ayrılmaktadır. Gerçek kişiler ve özel hukuk tüzel kişilerin mülkiyeti altında bulunan özel ormanların hukuki statüsünün belirlenmesi amacıyla hazırlanmış olan çalışma ile teoride ve uygulamada pek bilinmeyen özel ormanlar konusundaki belirsizlik giderilmeye çalışılarak bu alanda çalışma yapacak olan gerçek kişilere ve özel hukuk tüzel kişilerine yol gösterici olmak ve bu alandaki eksikliği gidermeye kısmen de olsa katkıda bulunmak amacıyla bu çalışma hazırlanmıştır.Çalışmanın birinci bölümü ormanın tanımı, ormanlar ve özel ormanlar alanında Osmanlı Devleti'nde ve Cumhuriyet döneminde yapılan yasal düzenlemeler, ülkemizde mülkiyet bakımından ormanlar, özel ormanın tanımı, özel ormanların tesis şekilleri, özel orman maliki olabilecek kimseler, özel ağaçlandırma ile ilgilidir. İkinci bölümde de özel ormanların planlanması, yönetimi ve işletilmesi, özel ormanların kadastrosu ve özel ormanların korunması, devlet ormanlarının özelleşmesi ve özel ormanlardan yararlanma konuları incelenmiştir.Kamu malları arasında yer alan ve diğer kamu mallarına nazaran özel bir koruma altında bulunan ormanlar hakkında kamu hukuku kuralları caridir. Topluma sağladıklar yararları nedeniyle gerçek kişilerin ve özel hukuk tüzel kişilerin mülkiyeti altındaki diğer menkul ve gayrimenkullere kıyasla yararlanma bakımından çok sıkı denetime tabi tutulan özel ormanlar, gerek Medeni Hukuk gerekse İdare Hukuku ile yakın ilişki içindedir. Bu nedenle, çalışma özel hukuk ve kamu hukuku kaynaklarının birlikte incelenmesini zorunlu kılmaktadır.Çalışma konusu ile ilgili olarak çalışmaya kaynaklık edebilecek üniversitelerin ilgili bilim dallarındaki bilimsel araştırmalar incelenmiş, Çevre ve Orman Bakanlığının yapmış olduğu çalışmalar değerlendirilmiş, yargı organlarının konu ile ilgili kararları elde edilmeye çalışılmış, yurtdışında özel ormanlar konusunda yapılan bilimsel çalışmalar incelenmiştir.Sonuç itibariyle mevcut özel ormanların hukuki statüsü ve yeni özel orman tesis edecek kişiler açısından kısmen de olsa açıklayıcı nitelikte olan çalışma ile özel ormanların tanımı, kuruluşu, kadastrosu, işletilmesi, korunması ve özel ormanlarda yararlanma konusuna açıklık getirilmeye çalışılmıştır.Anahtar Kelimeler1- Orman mülkiyeti2- Özel ormanlar3- Özel ağaçlandırma4- Özel orman kurma yolları5- Özel ormanlardan yararlanma"
