abstract: "Bu çalışmanın hedefi; Fas Bankasındaki İslamî finansman sözleşmelerini, Mâliki mezhebi ve usulü ışığında incelemek ve mezhebin içtihat kurallarına uyma durumunu tespit etmek. Dolayısıyla bu çalışmada Mâliki mezhebinin usulü ve katılım bankalarını denetleyen kurumların belirlediği kriterler, daha sonra Fas Bankası ve Yüksek İlmi Kurumu tarafından kabul edilen finansman sözleşmeleri incelenmiştir. Sözü geçen bu sözleşmeler: murabaha, temlikle sonuçlanan kiralama, ortaklık, mudârebe ve selem sözleşmeleridir. Bu çalışmada kullanılan yöntem ve yaklaşımlar ise; tanımlama, karşılaştırma ve analiz etme yaklaşımlarıdır. Bu yaklaşımlar ile Fas Bankasının kabul ettiği sözleşmeleri ve bu sözleşmelerin kullanış ve özelliklerini tanımlamaya, Fas Bankası ve Yüksek İlmi Kurumu tarafından kabul edilen finansman sözleşmelerinin Mâliki mezhebinin caiz gördüğü sözleşmeler ile karşılaştırmaya ve uygun olup olmadığını tespit etmeye, Mâliki mezhebi ışığında Fas'taki ortaklık sözleşmeleri analiz edilmeye çalışılmıştır. Çalışmanın sonunda elde edilen sonuç ise Fas Bankasının icra ettiği İslamî finansman sözleşmeleri, bazı fıkhi meseleler dışında genel olarak Mâliki mezhebin usulü ve kurallarına uygundur. Bu meselelerde diğer fıkhi mezheplere de başvurulmuştur. Böylece sözleşmeyi imzalamadan önce müşterinin bankaya ödediği güvence bedeli ve çekilme halinde zararı karşılamak için cezanın miktarını belirleme; sadece bankanın uğradığı zarar miktarınca mı yoksa daha fazla mı olacağı meselesi, kira sözleşmesini sebepsiz iptal etme imkânı meselesi, selem sözleşmelerinde satılan malın üç gün içerisinde iade imkânından bahsedilmemesi ve menfaatlerde selemin caiz olmadığından bahsedilmemesi örnek olarak verilmiştir."
