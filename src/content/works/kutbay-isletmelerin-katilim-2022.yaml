abstract: "Katılım bankaları, kamu sermayeli katılım bankalarının kurulmasıyla bankacılık sektöründe giderek yer edinmiş ve büyük bir ivme yakalamıştır. Bu bankalar kuruluşları ve çalışma şartlarıyla dini hususlara bağlı olsa da, günümüzde katılım bankalarını tercih eden müşterilerin büyük bir kısmı dini hususlardan bağımsız bir şekilde katılım bankalarıyla çalışma sürdürmektedir. Katılım bankalarını tercih eden müşterilerin, tercih etme sebepleri üzerine birçok çalışma yapılmıştır. Bu tezin amacı da işletmelerin katılım bankalarını tercih etme sebeplerinin öğrenilmesidir. Bu bağlamda, katılım bankalarını tanıyabilmek için ilk bölümde neden kuruldukları, fon toplama ve kullandırma yöntemleri ve katılım bankalarının kavramsal çerçevesi ele alınmıştır. İkinci bölümde Dünya'da katılım bankaları gelişimi, Türkiye'de katılım bankalarının gelişimi, katılım bankalarının önemi, faaliyette bulunan katılım bankaları, finans sektörü içerisindeki yeri ve Balıkesir ilinde katılım bankalarının verileri incelenmiştir. Üçüncü bölümde ise işletmelerin katılım bankalarını hangi gerekçeler ile tercih ettiklerini inceleyebilmek adına Balıkesir ili kapsamında katılım bankalarını tercih eden 50 işletmeye anket uygulanmıştır. Anketin birinci bölümünde katılım bankalarının tanınırlığı ve memnuniyet düzeyine ilişkin sorular, ikinci bölümünde katılım bankalarını tercih eden işletmelerin katılım bankaları hakkındaki düşüncelerine ilişkin sorular ve üçüncü bölümde tercih nedenlerinin önemlilik düzeylerine ilişkin sorular bulunmaktadır. Anket sonuçları grafik yardımıyla değerlendirilmiştir."
