abstract: "Bu çalışmanın konusu, İslami Finans: Malezya ve Türkiye Karşılaştırmasıdır. İslami finans denilince akla ilk gelen ülkelerden birisi Malezya'dır. 1983 yılı hem Türkiye'de hem de Malezya'da modern anlamda İslami finans alanında ilk adımın atıldığı yıl olması dolayısıyla önemlidir. Türkiye ve Malezya aynı yıllarda İslami finans yolculuğuna başlamış olmasına rağmen Malezya İslami finansal göstergelerde Türkiye'den oldukça üstün konumdadır. Bu doğrultuda çalışmayla birlikte amaçlanan Malezya ve Türkiye'nin İslami finans alanında gelişme sağlamak için atmış olduğu adımları incelemek ve iki ülke arasındaki İslami finansal göstergeleri karşılaştırmaktır. Türkiye'de Malezya'nın İslami finans sistemi hakkında gerçekleştirilmiş kapsamlı betimleyici bir çalışmanın yer almayışı ve literatüre öncülük teşkil etmesi açısından çalışmada betimleyici bir yöntem tercih edilmiştir. Çalışmada kitap, makale, tez vb. akademik çalışmalardan yararlanılmıştır. Çalışma ile İslami finansta gelişme sağlamak için merkez bankası ve hükümetin destekleri doğrultusunda gerekli yasaları ve kuruluşları oluşturmanın önemli olduğu sonucuna ulaşılmıştır. İslami finansa ilişkin gerekli yasaları ve kuruluşları oluşturma açısından Türkiye'nin Malezya'ya göre geç olsa da yakın zamanda atmış olduğu adımlar bu alanda gelişme niyetinde olduğunu göstermektedir."
