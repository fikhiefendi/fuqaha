abstract: "“İslam'da Mülteciler Hukuku”adlı tezimiz bir giriş kısmı ile üç bölümden oluşmaktadır. Birinci bölümde göç, sığınma ve mülteci kavramları tanımlanmış ve bu kavramların İslam hukuk literatüründeki karşılığı tespit edilmeye çalışılmıştır. İkinci bölümde, sığınma ile ilgili İslam hukuku hükümlerinden diğer bir deyişle İslam hukuk literatüründe sığınma kavramı olan eman müessesesi ile ilgili hükümlerden ve düzenlemelerden bahsedilmektedir. Üçüncü bölümde ise bir gayrimüslim olarak sığınmacının temel hakları ve yükümlülükleri değerlendirilmiştir. Yaptığımız çalışmada şu sonuca ulaşılmıştır: Göç, sığınma ve mültecilik insanlık tarihi kadar eski bir olgudur. Ancak terim olarak bu kavramlar son yüzyılda ortaya çıkmıştır. Bu yüzden bu kavramların İslam hukuk literatüründe doğrudan karşılığı bulunmamaktadır. Ancak İslam hukukunun, 1951 Mültecilerin Statüsü ile İlgili Cenevre Sözleşmesi'nde tanımlanmış modern mülteci statüsüne oldukça yakın olan Kur'ân ve sünnetten elde ettiği bazı kavramları mevcuttur. Eman müessesesi, modern geri gönderilmeme ve geçici koruma kavramlarının ilk şeklidir. Bu müessese gereğince, korumaya ihtiyacı olan, göç etmeye zorlanmış herkese dini ya da ırkı dikkate alınmaksızın emân verilmelidir."
