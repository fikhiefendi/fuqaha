abstract: "Medine merkezli İslam devletinin devlet başkanı olan Hz. Muhammed (s.a.v.)'in ahirete irtihaliyle devlet başkanlığı konusu, Müslümanların karşılaştıkları ilk ciddi mesele olmuştur. Hz. Peygamberin vefatıyla daha ilk günden ümmet içinde devlet başkanlığı meselesi çerçevesinde siyasal anlaşmazlıklar ortaya çıkmış; ilerleyen zamanlarda da hilafet olarak addettiğimiz devlet başkanlığı meselesi, akidevi bir mevzuya evrilmiştir. Hakikatinde ümmetin zamanla öğrendiği idare deneyiminin göstergesi olan hilafet, geçirdiği sair aşamalardan lağvedilme zamanına kadar İslam ümmetinin en önemli siyasal kurumu olmuştur. Bu zaman zarfında farklı zaman ve zeminlerde İslam'ın devlet başkanlığı kurumu olan hilafetle ilgili bir sürü münazaralar yapılmış ve bu mevzuda farklı çalışmalar ortaya konulmuştur. Bu tezde görüşleriyle hilafet meselesinde iz bırakmış olan Reşit Rıza ve Abdüsselam Yasin'in bu konudaki fikirleri incelenip İslam fıkhı esas alınarak yorumlanmıştır. Çalışmanın nihayetinde bu iki mütefekkirin hilafet ile ilgili fikirlerinin İslam hukuku çerçevesinde değerlendirilmesinden ortaya çıkan tespitlere yer verilmiştir."
