abstract: "Geçmişte fukaha, kaynakları kendi ortamlarına uygun bir şekilde anlamış ve meseleler hakkında ona göre görüşler serdetmiştir. Onların bu görüşleri ya kendi telifleriyle ya da talebelerinin onların görüşlerini derlemesi sonucu günümüze intikal etmiştir. Bu eserlerden kimisi muayyen bir mezhebi, kimisi de mezhep görüşlerinin mukayesesini esas alarak kaleme alınmıştır. İbn Rüşd'ün fıkha dair günümüze ulaşan iki eserinden biri olan Bidâyetü'l-müctehid adlı eseri de mezheplerin mukayesesini esas alan bir eserdir.İbn Rüşd bu eserinde, kendi dönemine kadar tespit edebildiği ihtilaflı meseleleri, bu meseleler hakkındaki görüşleri, ihtilaf sebeplerini ele almış ve bazen kendisi de bu görüşler hakkında yorumda bulunmuştur. Biz de çalışma konumuz olan bu eserde onun yorumlarını esas almak suretiyle müntesibi olduğu mezhebin savunuculuğunun öne çıkıp çıkmadığını, yine kitabında zikrettiği müctehidlerin görüşlerinden farklı görüşlerde bulunup bulunmadığını göstermeyi amaçladık. Kısacası İbn Rüşd'ü kendi kitabında öne çıkarmak istedik.Çalışmamız bir giriş ve üç bölümden oluşmaktadır. İbn Rüşd'ü ve çalışma konumuz olan Bidayetü'l-müctehid adlı eseri tanıttığımız giriş bölümünden sonra birinci bölümde tercih kavramının anlamlarına, İbn Rüşd'ün kullandığı tercih kavramlarına ve bunun örneklerine yer verilmiştir. Bu örnekler, sıkça kullandığı kavramlara ve müctehidlere göre çeşitli şekillerde tasnif edilmiştir. İkinci bölümde İbn Rüşd'ün zikrettiği müctehidlerin görüşlerden farklı, kendine ait görüşleri zikredilmiştir. Üçüncü bölümde ise bu tercih ve farklı görüşlerinde esas aldığı tespit edilen ilkeler incelenmiştir.Çalışma sonunda İbn Rüşd'ün mezhep fıkhı yapmadığı, Mâlikî mezhebi dışında diğer mezheplerin görüşlerinden de tercihte bulunduğu görülmüştür. Görüşleri objektif bir şekilde değerlendiren İbn Rüşd'ün kimi zaman bu görüşler dışında farklı ictihadlarda bulunduğu müşahede edilmiştir."
