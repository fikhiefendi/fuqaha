abstract: "Aile hukuku, İslam Şeriatında özel bir öneme sahiptir. Ailenin sağlıklı bir şekilde düzen-lenmesi, toplumun sağlıklı olmasını sağlarken, ailedeki bozulma, toplumun bozulmasına yol açar. Bu araştırmada, aile Hukuku, Afganistan Medeni Kanunu ile Hanefi mezhebi-nin müfta bih görüşleri arasında karşılaştırmalı bir şekilde incelenip değerlendirilmiştir. Çünkü Afganistan'da Hanefi mezhebi hâkimdir ve oradaki halk, yasaların da Hanefi fık-hına uygun olmasını istemektedir. Medeni Kanun hakkında üniversite öğrencileri ve medrese öğrencileri arasında çelişkili görüşler bulunmaktadır. Bunlardan bazıları, Afga-nistan Medeni Kanunu'nu incelemeden, bu kanunun Şeriat'a aykırı olduğunu ifade eder-ken, bazıları ise bu kanunun tüm maddelerinin Hanefi fıkhı ile uyumlu olduğunu söyle-mektedir. Bu durumun gözlemlenmesi ve meselenin netleşmesiyle birlikte, Afganistan Medeni Kanunu'nun önemli bir bölümü olan aile haklarının, akademik bir şekilde Hanefi fıkhı ile karşılaştırılması için bir çaba sarf edilmiştir. Amaç, Medeni Kanun'un gerçekten Şeriat'a aykırı olup olmadığını ve tüm maddelerinin Hanefi fıkhından alınıp alınmadığını, yoksa diğer fıkıh mezheplerinden de alıntılar yapılıp yapılmadığını belirlemektir. Bu ko-nu akademik bir şekilde araştırılmıştır. Bu konuda Türkçe dilinde herhangi bir araştırma bulunmamaktadır. Farsça dilinde ise, bu araştırma ile ilgili bazı hocalar makaleler yazmış-lardır, ancak yapılan araştırmalar sonucunda, akademik bir çalışma bulunmamaktadır. Bu araştırmanın faydalı olması, hem Afganistan'daki öğrenciler için hem de bu konuda bilgi edinmek isteyen Türkiye'deki üniversiteler için büyük bir önem taşımaktadır"
