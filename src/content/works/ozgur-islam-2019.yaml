abstract: "İnfaz, cezalandırma sürecinin en önemli ve son merhalesidir. Özellikle Hanefi fıkıh kitaplarında yer alan“infaz yargılamanın tamamlayıcısıdır”ilkesi infazın yargılama sürecindeki yerini ifade etmesi açısından önemlidir. İnfazın bu öneminden hareket ederek ele aldığımız çalışmada, konu üç bölüm halinde ele alınmış olup birinci bölümde; ceza kavramı, cezaların tasnifi, cezalandırmanın amacı ve cezalara ait prensiplerden bahsedilmiştir. İkinci bölümde; infaz kavramı ve infaz hukukunun ayrı bir disiplin olup olmadığına değinildikten sonra İslam infaz hukuku; infazın ilkeleri, infaz aletleri, infaz mekânı, infazı isteme hakkı, infazın vakti, infazın ertelenmesi, infazı düşüren haller ve infazların birleştirilmesi başlıkları altında incelenmiştir. Üçüncü bölümde; infaz ile alakalı problemli görülen alanlar ele alınmış olup infazda hata ve kastı aşma, infazda denklik sorunu, infaz anında anestezi kullanma ve kesilen organın yerine iade edilebilmesinin imkânı gibi konular araştırılmıştır. Çalışma neticesinde, İslam ceza hukukunda cezaların belli kural ve ilkeler çerçevesinde infaz edildiği sonucuna ulaşılmıştır. Buna ilaveten mahkûmun, azılı bir katil bile olsa, hiçbir zaman insan olduğunun göz ardı edilmediği, işlediği suçtan fazlasıyla cezalandırılmaması için azami gayret gösterildiği anlaşılmıştır. İnfazda hata ve kastı aşma durumları söz konusu olduğunda mahkûmun hakları koruma altına alınmış, infazın işkenceye dönüşmesinin önüne geçilmiştir. Mahkûmun hakları konusunda hassas davranıldığı kadar mağduru tatmin etme noktasında da gayret gösterilmesi gerektiği sonucuna varılmıştır."
