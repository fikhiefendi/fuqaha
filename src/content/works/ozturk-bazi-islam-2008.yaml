abstract: "Ekonomi biliminin insanlık tarihi ile başladığı söylenebilir. Ekonominin en önemli aracı olan para henüz bulunmamışken bile insanların ekonomik faaliyetleri görülmektedir. İhtiyaçlarını karşılamak için insanlar, ellerindeki ihtiyaç fazlası mallarını başka ihtiyaçlarını karşılamak için değiş tokuş yolunu kullanmışlardır. Geçen zamanla birlikte insan ihtiyaçlarının yön ve şekil değiştirmesi ile ekonomi bilimi de değişmiş ve gelişmiştir. Bu değişiklik genel olarak farklı toplumlarda farklı şekilde, farklı isimler altında ve farklı uygulamalarla görülmektedir. Toplumun değerleri, dini ekonomi biliminin şekillenmesinde rol oynamıştır. İslam ekonomisin de temel ilkeleri Kur'an, hadis ve sünnete dayanmaktadır.Sınırsız insan ihtiyaçları ve doğadaki sınırlı kaynaklar arasındaki konu bütün ekonomik sistemlerin en temel sorunudur. Ancak doğadaki kaynakların bölüşümünde her ekonomik sistemin kendine özgü bir uygulaması vardır. Artı değer(üretilen malın ihtiyaç fazlası kısmı), kar, faiz gibi kavramlar her ekonomik sistemde farklı yorumlanmış ve farklı üretim faktörlerine verilmiştir.Artı değer kapitalizm ve sosyalizm arasında çokça tartışılan bir konudur. Kapitalistlere göre artı değer sermaye faktörüne verilmeli, sosyalistlere göre emek faktörüne verilmelidir. İslam ekonomisine göre ise eşit miktarda dağıtılmalıdır. Faiz ve kar konusunda da ortak bir görüş yoktur. Sosyalizm kar ve faizi yasaklamış kapitalizm iki geliri de meşru kılmıştır. İslam ekonomisi ise faizi kesin olarak yasaklamış, haram kılmıştır buna karşılık karı ise meşru kılmıştı. İslam'a göre kişinin kendi kazandığını yemesinden daha hayırlı bir gelir yoktur. Özel mülkiyet konusu da ekonomik sistemlerde kendine özgü kurallara tabidir. Kapitalizm bireye sonsuz özel mülkiyet hakkı tanırken sosyalizm bireye özel mülkiyet hakkı tanımaz bu sisteme göre üretim araçlarının mülkiyeti devletin olmalıdır. İslam ekonomisinde bireye özel mülkiyet hakkı sunulmuştur ancak sınırsız bir mülkiyet hakkı değil sınırlıdır.Modern ekonomik sistemler ile İslam ekonomisinde alınan vergiler arasında farklılıklar olduğu gibi ortak noktalar da vardır. İslam da alınan vergilerde üreme esas olduğu için tüketim üzerinden vergi alınmamıştır. Modern ekonomilerde ise hem üretim hem de tüketimden vergi alınmaktadır. İslam ekonomisinde esas vergi zekâttır ve bugün alınan vergilerle benzer noktaları bulunmaktadır.Modern ekonomik sistemlerde zabıta, sağlıkçı, hâkim ve maliye bakanlığı gibi görevlilerin işlerini İslam ekonomisinde Hisbe işiyle görevli olan muhtesipler yürütmekte idi. Hisbe, insanlara İslam'ın güzel gördüğü şeyleri emredip yasakladığı şeylerden men etmek görevini üstlenmiş bir teşkilattır."
