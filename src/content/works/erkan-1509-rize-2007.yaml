abstract: "Yapılan bu tez çalısmasının amacı 1509 no'lu Rize Ser'iyye Sicilinin degerlendirmesini yapıp, bu belgeler ısıgında Rize'nin o döneme ait sosyo-ekonomik, idarî, kültürel ve adlî yapısının incelenerek bölgenin tarihinin arastırılmasına katkıda bulunmaktır. 1509 no'lu defterin sayfalarının tamamı okunarak degerlendirmesi yapılmıstır. 1911- 1913 yılları arasını kapsayan belgeler toplam 608 adettir. Belgelerin deftere kaydında kronolojik sıralama esasına uyulmamıstır. Bu belgelere dayanılarak Rize'nin XX. y.y. baslarındaki sosyo-ekonomik, idarî, adlî ve kültürel durumu hakkında tahliller yapılmaya çalısılmıstır. Ser'iyye mahkemeleri Osmanlı Kurulus-Tanzimat Dönemi arası tek kadılı yargılama usulüne dayalı, halka ait her türlü yargılamanın yapıldıgı mahkemelerdir. Tanzimat sonrasında yapılan degisiklerle Ser'iyye mahkemelerinin yargılama yetkilerinin çogu yeni açılan Ticaret ve Nizamiye mahkemelerine devredilmesiyle Ser'iyye mahkemelerinin en önemli unsuru olan kadıların da önemi azalmıstır. Ser'iyye Sicilleri (Kadı sicilleri) incelendiginde, belgelerin halkın hayat sartlarını, toplumsal iliskilerini, kullanılan her türlü esyayı, geçim kaynaklarını, nüfus yapısını, devlet hizmetlerini ve benzeri birçok önemli hususu ortaya koydugundan dolayı zengin bir kaynak olusturdugu görülmektedir. Defterdeki toplam 608 adet kaydın içeriginde tereke, vasî tayini, vekâletnâme, vakfiye, rehin senedi, borç-alacak davaları, talak ilâmları, nafaka talepleri, Ramazan ayının ilanı, Ramazan ve Kurban bayramlarının ilanı, vakıflara görevli tayini gibi konular bulunmaktadır."
