abstract: "Bu çalışma, İslâm hukukunda ribâ yasağını ve ribevî malların tespitinde esas alınan illet anlayışını Hanefî ve Şâfiî mezhepleri çerçevesinde karşılaştırmalı olarak incelemektedir. Ribâ, borç ve alışveriş ilişkileri bağlamında ortaya çıkmakta olup, alışverişlerdeki ribâ türü Hz. Peygamber'in“altı mal hadisi”olarak bilinen rivayeti ile sınırlandırılmıştır. Söz konusu hadis, ribevî malların belirlenmesi ve akitlerde ribâ yasağının uygulanacağı durumların tespiti hususunda mezhepler tarafından farklı şekillerde yorumlanmıştır. Çalışmanın birinci bölümünde ribâ ile ilişkili“mal”,“deyn”,“menfaat”,“beyʿ”,“illet”ve“karz”gibi kavramlar açıklanmıştır. İkinci bölümde ise altı mal hadisi çerçevesinde Hanefî ve Şâfiî mezheplerinin illet tespitine dair yaklaşımları ve bunların sonuçları ayrıntılı olarak ele alınmıştır. Hanefîler, ribevî mallarda illet olarak cins birliği ile birlikte ölçü veya tartı birliğini esas alırken; Şâfiîler“gıda”ve“semen”olmak üzere iki temel illete vurgu yapmaktadır. Çalışmanın amacı, Türkiye'de yaygın olarak benimsenen Hanefî ve Şâfiî mezheplerinin ribevî mallara ilişkin yaklaşımlarını karşılaştırmalı olarak ortaya koymak ve aralarındaki farklılıkların fıkhî temellerini incelemektir. Ulaşılan bulgular, ribânın yalnızca Kur'ân'da yer alan borç ilişkileriyle sınırlı olmadığını; alışveriş ve akitler gibi konuların Hz. Peygamber'in hadisleriyle ayrıntılandırıldığını ortaya koymaktadır. Hanefî ve Şâfiî mezhepleri ilgili nasları farklı illet anlayışlarıyla yorumlamakta olup, bu durum ribânın kapsamını doğrudan etkilemektedir. Hanefîler ölçü ve tartıya konu olan her malda ribâ oluşabileceğini ileri sürerken; Şâfiîler yalnızca yenilen veya para yerine geçen mallarda ribânın söz konusu olabileceğini kabul etmektedir. 2025, xi + 84 Sayfa"
