abstract: "Ceza Usul Hukukunda Uzlaşma Kurumu ? başlıklı tezim üç bölüm ve sonuçkısmından oluşmaktadır.Birinci bölümde, uzlaşma ihtiyacının doğuş sebepleri incelenmiş, bireyler ve toplumiçin faydaları belirtilmiştir. Bu çerçevede cezalandırmanın taraflara yarardan çok zararverdiği, çözüm sağlayıcı bir yol olmadığı vurgulanmıştır.Uzlaşmanın, anlaşmazlık ve uyuşmazlık hallerinde ortaya çıktığı ele alınmıştır.Devamla uzlaşmanın terim olarak açıklaması, kavram olarak nitelendirmesiyapılmıştır. Uzlaşmanın amacına değinilmiş, temel ilkeleri kapsamlı olarak açıklanmıştır.Yine bu bölümün üçüncü kısmında uzlaşmanın tarihsel gelişimi İslâm Hukukuna geniş olarakdeğinilmek suretiyle anlatılmıştır.Tezimizin ikinci bölümünde, karşılaştırmalı hukukta uzlaşma inceleme konusuyapılmıştır. Bu kapsamda Birleşmiş Milletler ve Avrupa Konseyi nezdinde cezai konulardauzlaşma konusu araştırılmıştır. Bazı ülkelerdeki durum ve uzlaşma uygulaması bildirilmiştir.Bu bölümün üçüncü kısmında ise, 5560 sayılı kanun öncesinde ve sonrasında TürkHukukunda Uzlaşma Kurumu maddi, usuli koşullara değinilmek suretiyle açıklanmıştır.Üçüncü bölümde ise, uzlaşmanın benzer kavram ve kurumlarla ilişkisi karşılaştırmayapmak suretiyle irdelenmiştir.Tez, uzlaşma kurumu hakkında kanaatimizi açıklayan ve çalışmanın toplu birdeğerlendirmesini içeren sonuç kısmıyla neticelendirilmiştir"
