abstract: "Akla zarar veren maddeler, insanlık tarihi boyunca bireyi ve toplumu etkilemiş ve bütün hukuk sistemlerine konu olmuştur. Bu tezde İslam hukuku ile mer'i Türk hukukunun hükümleri aklı koruma bakımından mukayese temelli olarak çalışılmıştır. Çalışmanın mukayese kısmına geçmeden önce, ele alınan maddelerin kısa bir tarihçesine ve tanıtımına yer verilmiştir. Daha sonra mukayesenin ilk ayağı olan İslam hukuku kısmında konu,“aklı koruma”hikmeti perspektifinden işlenmiş ve aklî melekeleri bozan katı ve sıvı maddeler, mezhepler arasındaki bazı farklılıkları ortaya koyacak şekilde ele alınmıştır. Çalışmada İslam hukukunda alkol ve uyuşturucuya karşı tutum, önce usûl, ardından dört mezhep ve Zâhirîler esas alınarak furû' boyutuyla incelenmiştir. Günümüzde İslam hukukunun konuyla ilgili hükümlerini ortaya koyan fetva kuruluşları vb. kurumların düzenleme ve fetvalarına da yer verilmiştir. Mukayesenin ikinci ayağı olan mer'i hukuk kısmında öncelik, uyuşturucu maddelere verilmiş, ardından sarhoş edici maddeler ele alınmıştır. Bu alt bölümlerde, söz konusu maddelerle ilgili cezalandırıcı veya kısıtlayıcı yaptırımlar Türkiye'deki hukuk mevzuatı odağında değerlendirilmiştir. Literatürde iki hukuk sistemi arasında bu çalışmanın gerçekleştirmeye çabaladığı mukayeseyi yapan ve konuya aklı koruma ilkesini esas alarak bakan bir çalışmaya rastlanmamıştır. Esas alınan bu önemli ilke ve gaye odağında gerçekleştirilmiş olan çalışma sonucunda, iki hukuk arasında önemli bazı benzerliklere ve kayda değer farklara ulaşılmıştır."
