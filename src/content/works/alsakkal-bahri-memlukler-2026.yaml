abstract: "Bahri Memlükler dönemi (648-784/1250-1382), İslam medeniyet tarihinde an-siklopedik çalışmaların ve disiplinlerarası etkileşimin zirveye ulaştığı, özgün bir ilmi hareketliliğe sahne olmuştur. Bu dönemde Bilâdü'ş-Şâm, İslam dünyasının en önemli ilim merkezi ve ulemanın buluşma noktası haline gelmiştir. Bu çalışmanın temel prob-lemi, söz konusu dönemde Şam bölgesindeki fakihlerin, fıkıh ve dil ilimleri arasındaki organik bağı nasıl kurduklarını ve bu bağı istinbat sürecine nasıl yansıttıklarını incele-mektir. Zira bu âlimler sadece fıkıhçı olmakla kalmamış; aynı zamanda nahiv, sarf ve belâgat gibi Arap dili ilimlerinde de derinleşerek bu birikimlerini şer'î nasların anlaşıl-masında asli birer araç olarak kullanmışlardır. Bu çalışma; Şamlı fakihlerin Arap dilini koruma ve geliştirme konusundaki ön-cü rollerini ortaya koymayı, o dönemin ilmi açıdan bir durgunluk dönemi olduğu var-sayımının aksine barındırdığı yüksek canlılığı ve üretkenliği göstermeyi ve fıkıh ile dil arasındaki karşılıklı etkileşimi gözler önüne sermeyi amaçlamaktadır. Bu hedeflere ulaşmak için araştırmada; fakihlerin biyografilerini ve eserlerini inceleyen tümevarım (istikrâî) yöntemi ile seçilen fıkhi metinler üzerindeki lügavî etkiyi çözümleyen analitik (tahlilî) yöntem kullanılmıştır. Araştırmanın sınırları zaman bakımından Bahri Memlükler dönemi, mekân ba-kımından ise Bilâdü'ş-Şâm bölgesi ile sınırlandırılmıştır.“Tez; fakihlerin biyografilerini inceleyerek, onların fıkhî ve dilbilimsel metinlerini uygulamalı ve karşılaştırmalı bir analiz yöntemiyle ele alıp fıkıh ile Arap dili ilimleri arasındaki ilişkinin temellendirilme-sine odaklanmıştır.”Çalışma neticesinde; dil ilimlerinin fıkhi hüküm inşasında tali bir unsur değil asli bir kurucu rükün olduğu ve Memlük dönemi ulemasının bu iki disiplini“ilimlerin bütünlüğü”ilkesi çerçevesinde başarıyla mezhettikleri tespit edilmiştir."
