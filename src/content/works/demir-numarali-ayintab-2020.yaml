abstract: "Şer'îyye sicilleri, Osmanlı tarihini doğru okuyabilmek ve geleceğe aktarmak için başvurulması gereken en önemli kaynaklardan biridir. Kadı Sicilleri de denilen bu defterlere yerel mahkemelerde alınan kararlar, merkezden gelen emir ve fermanlar, buyruldu, berat vs. gibi önemli bilgiler kaydedilmektedir. Belli yerlere ait ayrı ayrı tutulan bu belgeler, özellikle yerel tarih çalışmalarının vazgeçilmez kaynaklarından olup bunların transkriptleri yapılmaya çalışılmaktadır. Osmanlı tarihinin derinlemesine incelenmesi ve araştırılması açısından önemli bir kaynaktır. Maraş Vilayeti'ne bağlı bir sancak olan Ayıntâb'a ait 174 adet Şer'îyye Sicili bulunmaktadır. Buna göre; Gaziantep'e ait ilk defter H.938 / M.1531–1532 tarihlidir. En son defter ise H. 1327 / M. 1909–1910 tarihlidir. Hicri 1129-1130 (M. 1717-1718) tarihli, 68 Numaralı Ayıntâb Şer'îyye Sicili toplam 537 sayfadan oluşmaktadır. Bu çalışmamızda XVIII. yüzyılın ilk çeyreğinde genelde Osmanlı özelde ise Ayıntâb'ın içerisinde bulunduğu sosyal, iktisadi, siyasi, fiziki ve kültürel ahval bir nebzede olsa aydınlatılmaya çalışılmıştır."
