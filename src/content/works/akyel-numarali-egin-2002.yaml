abstract: "ÖZET Yüksek Lisans Tezi 5 Numaralı Eğin Şer'iyye Sicili Salih Akyel Fırat Üniversitesi Sosyal Bilimler Enstitüsü Tarih Bölümü 2002, Sayfa:275 Osmanlı Tarihi'nin en önemli arşiv kaynaklarından bir tanesi de Şer'iyye Sicilleridir. Şer'iyye Sicilleri ihtiva ettikleri idari, siyasi, askeri ve sosyal nitelikli belgelerden dolayı Osmanlı Tarihine ışık tutan kaynaklardır. Ait oldukları dönem ve yer hakkında oldukça önemli bilgiler veren Şer'iyye Sicillerinden faydalanma konusu, bu gün için başlı başına bir problem olmaktadır. Bu durum ise sicillerden faydalanma konusunu belirli bir metoda bağlı kılmayı zaruri hale getirmektedir. Bizde bu önemli kaynaklardan biri olan 5 Numaralı Eğin Şer'iyye Sicilini çalışmamıza konu edindik. Bu metinlerden yola çıkarak yaptığımız değerlendirmelerde de Harput Eyaletine bağlı 3 nahiyeden müteşekkil bir kaza olan Eğin' in bu dönemde idari, siyasi, askeri, iktisadi ve sosyal yapıları üzerinde durduk."
