abstract: "Bu çalışma, Türkiye, Kazakistan, Malezya ve Katar'daki orta sınıfı temsil eden lise öğretmenlerinin motorlu taşıt sahibi olma imkanlarını karşılaştırmalı olarak incelemektedir. Araştırmada öncelikle söz konusu ülkelerdeki İslami finans sisteminin gelişimi ve İslami bankaların uyguladığı araç finansman yöntemleri analiz edilmiştir. Ardından lise öğretmenlerinin gelir düzeyi, örnek araç olarak seçilen Toyota Corolla'nın fiyatları ve İslami bankaların sunduğu finansman modelleri ve onların detayları değerlendirilerek ülkeler arası karşılaştırma yapılmıştır. Bulgular, araç finansmanı için ayrılabilir maaş oranlarının Türkiye'de %200 olduğunu göstermektedir. Bu sonuçlara göre Türkiye'de bir lise öğretmeninin araç finansmanı için maaşının iki katını ayırması gerektiği ortaya çıkmış. Bu durum, orta sınıf bireyler için araç edinimini önemli ölçüde zorlaştıran bir ekonomik kısıt olarak ortaya çıkmaktadır. Çalışmanın çözüm önerisi olarak, orta sınıfın araç sahibi olma imkanlarını artırmaya yönelik bir yöntemi olan Uygun Fiyatlı Motorlu Taşıt Finansmanı İçin Yeni Bir Yaklaşım Bisuhulat Amtilak Sayyara (BAS) Modeli sunulmuştur."
