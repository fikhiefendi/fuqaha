abstract: "İslam'ın temel maksatlarından biri, nikâh akdinin teşrîi ve devamlılığının sağlanması yoluyla ailenin korunması ve insan neslinin devamının temin edilmesidir. Bu bağlamda, sözlü boşama ve buna şahit tutulması meselesi, ilgili ayetin boşamanın geçerliliği için şahitliği bir şart olarak mı öngördüğü, yoksa hakların korunması ve ihtilafların önlenmesine yönelik düzenleyici bir işlem mi olduğu konusunda fıkhî ve tefsirî bir tartışma alanı oluşturmaktadır. Bu durum, klasik ve çağdaş müfessirlerin ve fakihlerin görüşleri arasında karşılaştırmalı bir incelemeyi ve sosyal ile siyasal bağlamların bu görüşlerin şekillenmesindeki etkisinin ortaya konulmasını gerekli kılmaktadır. Bu araştırma, aile meselelerini ilahî murada uygun şekilde anlamayı amaçlayarak boşamada şahitlik konusunu farklı boyutlarıyla ele almaktadır. Bu çerçevede boşama kavramı ve onun klasik dilde kullanılan eş anlamlıları incelenmiş, ayrıca tarihsel bir mukayese ile Tevrat ve İncil'deki boşama anlayışı ve İslam öncesi Mekke toplumundaki uygulamalar değerlendirilmiştir. Çalışma ayrıca Kur'an'da boşama kavramı ve onunla ilişkili lafızlar için kavramsal bir ağ oluşturmayı ve semantik analiz yöntemiyle Kur'an'ın kelime yapısını ortaya koymayı hedeflemektedir. İlgili ayetler ile hadisler ve bunların bağlantılı olduğu olaylar birlikte ele alınarak Kur'an'ın bu meseleye ilişkin bütüncül yaklaşımı açıklanmıştır .Araştırmada istikrâî, istinbatî ve dilsel analiz yöntemleri kullanılarak kavramın Arap dilindeki anlamı ile Kur'an bağlamında kazandığı anlam arasındaki fark ortaya konulmuştur. Ayrıca boşamada şahitliğin bazı durumlarda teşrî edilmesinin makasıdî yönü incelenmiş; bunun aileyi koruma ve toplumsal zararı azaltmadaki rolü vurgulanmıştır. Çalışma, boşama türleri ve hükümlerine kısaca değinerek şahitlik meselesine zemin hazırlamış, klasik ve çağdaş müfessirlerin görüşlerini analiz ederek ihtilafın kaynaklarını ortaya koymuştur. Son olarak, Kur'an'ın aileyi koruma ve toplumu muhafaza etme yönündeki şer'î maksatları doğrultusunda mesele değerlendirilmiş, farklı mezheplerin görüşleri ışığında doğru anlayışın geliştirilmesi hedeflenmiştir."
