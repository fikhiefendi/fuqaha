abstract: "Bu çalışma, faizli bankaların İslami ürünler ve hizmetler sunmak için açtığı İslami pencerelere odaklanmaktadır. Alimlerin İslami pencerelerin akreditasyonu ve faaliyetleri hakkındaki görüşleri, ticari bankaların bankacılık faaliyetlerinin doğası gereği farklılıklar göstermektedir. Bu sebeple bu çalışma, İslami pencerelerin şer'i kurallara göre incelenmesini amaçlamaktadır. Öncelikle İslami pencerelerin ortaya çıkış sebepleri, özellikleri ve amaçları incelenecektir. Daha sonra buna ilişkin fetvalar veren ve analiz yapan bilim insanlarının tartışmaları ve alimlerin bu İslami pencerelere ilişkin çalışmalar ele alınacaktır. Bununla birlikte İslami pencerelerin, gerek Müslüman olmayan ülkelerde gerekse İslami bankaları olmayan Müslüman ülkelerde İslami finansı nasıl yansıttığı görülecektir. Bu çalışma, Kamerun ve Orta Afrika'daki ilk İslami pencere olan Afriland First Bank gibi bazı İslami pencerelerin ve diğer bazı örneklerin incelenmesiyle sona ermektedir."
