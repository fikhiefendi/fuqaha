abstract: "Ebussuûd Efendi, Osmanlı devletinin her alanda zirveyi yaşadığı bir dönemde ilmî olarak en önde gelen isimlerden olmuş, şeyhülislamlık gibi mühim bir görevi ifa etmiştir. Şeyhülislamlık ve şeyhülislamlıktan önceki görevleri boyunca birçok olayla karşılaşan Ebussuûd, gerek fetvaları gerek fıkhî görüşleri ile ulemaya, halka ve devlet erkanına yol göstermiştir. Bu araştırmada Mahmud b. Süleyman el-Kefevî'nin, Ketâib adlı eseri kapsamında Ebussuûd'un biyografisinin, eserde geçen fetvalarının ve onun görüşlerine yapılan atıfların, ulema ve devlet erkanı ilişkilerinin değerlendirilmesi amaçlanmıştır. Öncelikli olarak Ebussuûd ile ilgili eserdeki bilgiler ve fetvalar tespit edilmiştir. İkinci adım olarak bu bilgilerin ve fetvaların önceki çalışmalarda yer alıp almadığı araştırılarak, Ketâib'deki Ebussuûd ile ilgili nakillerin değeri incelenmiştir."
