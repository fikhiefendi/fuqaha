abstract: "Bu çalışmada, iktisat tarihi çalışmalarına kaynaklık eden şerʻîyye sicillerinden faydalanılmıştır. 3078 numaralı Bursa Kadı Defteri günümüz Türkçesine aktarımı yapılarak değerlendirilmiştir. Çalışmanın ana konusunu oluşturan 3078 numaralı defter H.1268- 1269/M.1852-1853 yıllarını kapsamaktadır. Defterin transkripsiyon işlemi gerçekleştirilirken kelimelerin doğru okunup yazılmasına dikkat gösterilmiştir. Sicil, 19.yüzyıl ortasında Bursa'nın sosyal, ekonomik ve hukuki yapısı hakkında geniş bilgiler içermektedir.“3078 Numaralı Bursa Şerʻîyye Siciline Göre Bursa'da Sosyal ve Ekonomik Hayat (1852-1853)”adlı çalışma üç bölümden oluşmaktadır. Giriş bölümünde Bursa'nın ekonomik yapısının ekonomik gelişimi kısa anlatılmaya çalışılmıştır. Birinci bölümde Bursa Şerʻîyye Sicillerinin önemi ve sicillerin kaynak oluşturduğu çalışmalar belirtilmiştir. İkinci bölümde defterde yer alan çeşitli konular tasniflenip başlıkları adı altında incelenmiştir. Ayrıca sicilde yer alan sancak, kaza, mahalle gibi idari bölge isimleri ve meslekler hakkında bilgi verilmiştir. Üçüncü bölümde sonuç olarak değerlendirmeler yer almaktadır. Çalışmanın son bölümü olan ekler kısmında 3078 numaralı Bursa Şerʻîyye Sicilinin transkribe edilmiş metni bulunmaktadır. Bu çalışma ile Bursa'nın ve Osmanlı Devleti'nin sosyal, kültürel, ekonomik, hukuki ve idari yapısı üzerine çalışma yapacak olan araştırmacılara katkı sağlaması amaçlanmaktadır."
