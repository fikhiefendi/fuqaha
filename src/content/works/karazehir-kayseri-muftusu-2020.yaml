abstract: "Osmanlı Devleti'nin son döneminde hazırlanmış olan Mecelle-i Ahkâm-ı Adliye, İslam hukuk tarihinde önemli bir mevkiye haizdir. Mecelle-i Ahkâm-ı Adliye hakkında birçok çalışma yapılmıştır. Biz de bu çalışmamızda Mecelle-i Ahkâm-ı Adliye'nin kaynaklarını tespite çalışan Kayseri Müftüsü Mesud Efendi'nin Mir'ât-ı Mecelle isimli eserinin“Kitabü'd- Da'vâ”kısmında zikrettiği kaynakların ilgili kısımlarının cilt ve sayfa numaralarını tespit etmeğe çalıştık. Tezimiz üç ana bölümden müteşekkildir. Çalışmamızın giriş kısmında Müftü Mesud Efendi'nin emeğinin ve eserinin daha iyi anlaşılması adına İslam Hukukunda Mecelle-i Ahkâm-ı Adliye'nin yeri ve hususiyetlerine değinilmiş, Mecelle-i Ahkâm-ı Adliye hakkında malumat verilmiştir. İlk bölümde Müftü Mesud Efendi'nin Hayatı ve Mir'ât-ı Mecelle tanıtılmaya çalışılmış, Mecelle-i Ahkâm-ı Adliye'de geçen“Kitabü'd- Da'vâ”bölümündeki fıkhî terimler tanımlanmıştır. İkinci bölüm ise, Hanefi tabakat kitaplarından ve Diyanet İslam Ansiklopedisi'nden istifade edilerek Müftü Mesud Efendi'nin“Kitabü'd- Da'vâ”kısmında kaynak olarak zikrettiği eserler ve müellifleri hakkındaki açıklamalardan meydana gelmektedir. Tezimizin üçüncü kısmında Mecelle-i Ahkâm-ı Adliye'nin“Kitabü'd- Da'vâ”kısmı Osmanlı Türkçesi olarak, Mir'ât-ı Mecelle“Kitabü'd- Da'vâ”kısmı da Arabça olarak aktarılmış, kaynak olarak gösterilmiş eserlerin cilt ve sayfa numaraları tespit edilmeye çalışılmıştır."
