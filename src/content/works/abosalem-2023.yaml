abstract: "Şer'i ölçüler üzerine bina edilmiş siyasi sulh, Müslümanlar arasında oluşan çatışma ve anlaşmazlıkların önlenmesine veya çözüme kavuşturulmasına katkı sağlayan önemli vesilelerden biridir. Bu çalışma, siyasi sulh kavramından maksadın ne olduğunu açıklamayı, İslamiyet'in teşvik ettiği ve âlimlerin sulh çeşitlerinden biri olarak ele aldığı siyasi sulhun meşruiyetini ispat etmeyi hedeflemektedir. Ayrıca bu çalışma, siyasi sulhun akit türlerinden bir akit olmasından ötürü bu akdin rükünlerinin olduğunu ve söz konusu sulhun adil ve sürdürülebilir bir uzlaşma meydana getirebilmesi için şer'i ölçüler çerçevesinde kendine özgü ölçülerinin olduğunu kanıtlamayı hedeflemektedir. Araştırmacının araştırmak istediği araştırma problemi işte budur. Araştırmacı, tümevarım metodunu kullanarak siyasi sulhun sulh türlerinden biri olduğu, siyasi meselelere özgü olduğu, bu sulhu ikame ederken yetkinliğin gerekliliği hakkında hususi nasların bulunduğu, âlimlerin bunun ölçülerini tartıştığı ve fıkıh kitaplarında bunun meselelerine yer verdiği sonucuna varmıştır. Yine bu sulh çeşidinin, sulh elçisi, taraflar, sulh yeri ve sulh biçiminden oluşan dört rüknünün bulunduğunu, bu rükünlerin belli kurallarının bulunduğunu ve bu sulh, şartları ve rükünleriyle doğru bir şekilde ikame edildiğinde taraflara akde uyma yükümlülüğü getireceği ve çalışmada belirlenen haller dışında taraflardan birinin bu akdi feshetmesinin caiz olmadığı sonucuna varmıştır."
