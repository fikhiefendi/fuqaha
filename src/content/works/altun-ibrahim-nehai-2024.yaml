abstract: "Bu çalışmada tabiûn döneminde farklı coğrafyalarda yaşamış ve farklı mezheplere kaynaklık etmiş, özellikle ictihâd ve fetvalarıyla çağdaşları arasında temayüz etmiş iki meşhûr fakihin, İbrahim en-Nehaî ve Süleyman b. Yesâr'ın fıkhî görüşleri mukayeseli olarak ele alınmıştır. Çalışmada öncelikle İbrahim en-Nehaî ve Süleyman b. Yesâr'ın hayatları, ilmî, ahlâkî ve siyasî kişilikleri ele alınmıştır. Daha sonra iki müçtehidin usûldeki yöntemleri mukayeseli olarak incelenmiştir. Son olarak adı geçen müctehidlerin fetvaları karşılaştırılarak vermiş oldukları farklı fetvaların sebepleri ortaya konulmaya ve değerlendirilmeye çalışılmıştır. Her iki fakihin hüküm istinbâtındaki dayandıkları kaynakların genel olarak aynı, yöntemlerinin ise kısmen farklı olduğu görülmüştür. Bu farklılıkların sebeplerinin farklı sosyo-kültürel çevre, delillerin farklı yorumlanması ve deliller arasındaki tercihler ile ilgili olduğu sonucuna varılmıştır."
