abstract: "Oturma hakkı, TMK m. 823-825 hükümleri arasında düzenlenmiş, devredilemeyen ve miras yoluyla geçmeyen, düzenli kişisel irtifak haklarından biridir. Kanunda özellikle Miras Hukuku ve Aile Hukuku alanlarında oturma hakkıyla ilgili düzenleme bulunması nedeniyle oturma hakkının yakın kişiler arasında kurulması ve genellikle bakım amacına hizmet etmesi olağandır. Hak devredilemeyen ve miras yoluyla geçemeyen nitelikte olduğu için, hakkın haczedilmesi de mümkün değildir. Sahibine taşınmazın tamamı veya bir bölümünde konut olarak kullanma yetkisi verdiğinden başka türlü bir yararlanma şekli mümkün değildir. Ancak malikin rızasıyla hakkın kullanımının devredilmesi mümkündür. Bu yönde bir anlaşma hakkın ayni içeriğine dahil olmaz, nispi etkili olacak şekilde sonuç doğurur. Yine hakkın niteliği gereği, oturma hakkı sahibinin bir tüzel kişi olması mümkün değildir. Hakkın kurulmasıyla birlikte, oturma hakkı sahibi ile hakkı kuran malik arasında bir hukuki ilişki oluşur. Oturma hakkı ilişkisi olarak ifade edebileceğimiz bu ilişki, öncelikle ayni hakkın sağladığı yetkilerle oluşan temel ilişkiyi kapsar. Bu ilişki, oturma hakkının ayni hak olmasından kaynaklanır ve oturma hakkı sahibine eşya üzerinde doğrudan, aracısız bir hakimiyet sağlar. Bunun yanında, kanundan veya sözleşmeden kaynaklanan eşyaya bağlı borç ilişkisi oluşur. Kanundan doğan eşyaya bağlı borç ilişkisi özellikle TMK m. 823/III'te intifa hakkına ilişkin düzenlemelere yapılan atıf nedeniyle intifa hakkı hükümlerinden kaynaklanır. Sözleşmeden kaynaklanan eşyaya bağlı borç ilişkisi ise, kanunun izin verdiği ölçüde ve tapuya tescil edilmek suretiyle sonraki malikler bakımından görünür kılınarak oluşturulur. Ayni hakkın temel özellikleri ve buradan doğan yetkiler ile eşyaya bağlı borç ilişkisi, ayni etkili ilişkiyi oluşturur. Oturma hakkı ilişkisinin ilk parçası bu ayni etkili ilişkidir. Oturma hakkı ilişkisinin ikinci parçasını nispi etkili ilişki oluşturur. Bu ilişki, tarafların eşyaya bağlı borç etkisi sağlayamadıkları konularda, kanunda bu yönde bir sınır bulunmasından ötürü gerçekleşebilir. Taraflar sadece nispi etki doğurmasını istedikleri hükümler getirdikleri için de nispi etkili bir ilişki oluşabilir. Bu özellikteki hükümler, tüm sözleşmelerde aranan geçerlilik şartlarını taşıyor olmalıdır. Tarafların sözleşmeye nispi etkili hükümler koyması durumunda, malik değişmediği sürece bu hükümler taraflar açısından sonuç doğurmaya devam eder. Malik değiştiğinde ise nispi etkili hükümler yeni malike karşı doğrudan ileri sürülemez, onun bu yönde ayrıca bir irade beyanında bulunması gereklidir. Oturma hakkı sahibinin kanundan doğan borçlarından biri, TMK m. 825'te düzenlenen olağan bakım ve koruma masraflarına katlanmaktır. Oturma hakkı sahibinin bu borcu ancak binanın tamamını veya bir bölümünü tek başına kullanıyorsa mevcuttur. Bunun dışında hak sahibi, taşınmazı özenli bir şekilde kullanmalı, kullanım sırasında malike en az zarar verecek şekilde hareket etmelidir. Bunun dışında oturma hakkı sahibi, kendi yükümlülüğüne dahil olmayan bakım ve korumaya ilişkin hususları malike bildirmekle yükümlüdür. Malik gerekli işleri yaparken ona izin vermeli ve işin tamamlanmasına katlanmalıdır. Resmi defter tutma yükümlülüğü ise hem oturma hakkı sahibine hem de malike aittir. Taşınmazın sigorta ettirilmesi ve primlerin ödenmesi, intifa hakkı sahibinin yükümlülüğü olmakla birlikte oturma hakkı sahibinin bu yönde bir yükümlülüğü bulunmaz. Yine aynı şekilde oturma hakkı sahibi faiz, vergi ve harç ödemekle yükümlü değildir. Hak herhangi bir sebeple sona erdiğinde oturma hakkı sahibi, taşınmazı malike iade etmekle yükümlüdür. İade taşınmazı ve onunla birlikte kendisine tahsis edilen eklentileri de kapsar. Oturma hakkı sahibinin gereği gibi yerine getirdiği iade yükümlülüğünden bahsedilebilmek için taşınmazın fiili hakimiyetini malike iade etmesi ve kural olarak tapuda terkin talebinde bulunması gerekir. Oturma hakkı sahibinin ayni kapsamda yer almayan en önemli borcu, ivaz borcudur. İvaz borcuna birçok farklı edim konu edilebilir ancak genellikle bir miktar para ödenmesi kararlaştırılır. Bu para tek seferde veya dönemsel olarak ödenebilir. Oturma hakkının tesis edilmesi karşılığında bedel borcunun yerine getirileceği kararlaştırılmakla oturma hakkı sözleşmesi, iki tarafa borç yükleyen bir sözleşme hâline gelir. Bunun sonucu olarak, iki tarafa borç yükleyen sözleşmelerde borca aykırılığa ilişkin hükümlerin uygulanması söz konusu olur. Hak kurulmadan önce, oturma hakkı sözleşmesinden doğan temel bir borç, malikin oturma hakkının tescilini talep etme borcudur. Hakkın kurulmasıyla malik açısından kendiliğinden doğan borçlar ise sınırlıdır. Bu anlamda sayabileceğimiz ilk borç resmi defter tutulmasına ilişkin yükümlülüktür. Bunun dışında taşınmazın sigortasının yapılması ve primlerinin ödenmesi malike düşer. Vergi ödeme yükümlülüğü için de aynı durum geçerlidir. Bu borçlar malikin oturma hakkı sahibine ifa etmesi gereken borçlar değildir. TMK m. 825/II'ye göre oturma hakkı sahibi binayı veya bir bölümünü malikle birlikte kullanıyorsa hem olağan hem de olağanüstü, oturma hakkı sahibi taşınmazı tek başına kullanıyorsa olağanüstü bakım ve koruma masraflarını malik karşılamalıdır. Ancak burada bir borçtan ziyade yetkiden bahsedilir. Oturma hakkı sahibi, malikin bu masrafları karşılamasını cebren sağlayamaz. Bu durumun en temel sonucu, oturma hakkı ilişkisinde malikin, kira ilişkisinden farklı olarak taşınmazı sözleşmeye uygun bir şekilde kullanıma sunmak ve sözleşme devam ettiği sürece o şekilde tutmak zorunda olmamasıdır. Hatta malik, taşınmazın harap olması hâlinde onu yeniden eski hâline getirmekle de yükümlü değildir. Ancak eski hâle getirirse oturma hakkı yeniden bu taşınmaz üzerinde varlığını sürdürür. Malik bakımından bu yükümlülüklerin bilinen anlamda bir borç değil, ödev teşkil etmesinin temelinde irtifak haklarında olumlu edim yükümlülüklerinin ancak sınırlı bir şekilde mevcut olabilmesi bulunur. Olumlu edim yükümlülüğünün ancak yan borç olarak irtifaka bağlanabilmesi, TMK m. 779/II'de düzenlenmektedir ve bu hüküm oturma hakkı bakımından da geçerlidir. Dolayısıyla oturma hakkı sahibi ve malik, yapacakları anlaşma ile malike yapma borcunu yan borç olarak yükleyebilirler. Oturma hakkı sahibinin veya malikin borca aykırı davranışı karşısında diğer tarafın çeşitli hakları gündeme gelir. Özellikle ayni hakkın ihlâli niteliğindeki borca aykırı davranışlar hem oturma hakkı sahibine hem de malike, karşı tarafa yönelen istihkak ve elatmanın önlenmesi davalarını açma imkânı verir. Yine zilyetlikten doğan koruyucu imkânlardan kuvvet kullanma, saldırıya son verme ve iade davalarının açılması mümkündür. Şartlarının bulunması hâlinde tapu sicilinin düzeltilmesi davası veya tespit davası açılabilir. Yine tarafların birbirlerine karşı komşuluk hukukuna dayanan sorumluluğunun da gündeme gelebileceği söylenmelidir. Öte yandan borca aykırılık, Borçlar Kanunu'ndan doğan imkânların kullanılmasını da gerektirir. Tarafların sözleşmeden veya kanundan doğan borçlara aykırılık teşkil eden tutum ve davranışları karşısında diğer tarafın TBK m. 112 vd.na dayanması mümkündür. Sözleşme karşılıklı borç yükleyen hâle büründürülmüşse, TBK m. 123 vd.na göre hareket etme imkânı doğar. Oturma hakkı sözleşmesi, sürekli edimli bir sözleşme olduğundan sözleşmenin feshi gündeme gelebilir. Hakkın dayanağı olan sözleşmenin feshedilmesi, oturma hakkı ilişkisinin tasfiye ilişkisine dönüşmesine neden olur. Bu nedenle oturma hakkı sahibinin hakkın terkinini isteme borcu gündeme gelir. Yani hak, sözleşmenin feshedilmesiyle birlikte kendiliğinden sona ermez. Öte yandan, sözleşmenin yapıldığı zamanda öngörülemeyen olgular sonradan ortaya çıkarak borcun ifasını ilgili taraf bakımından aşırı derecede güçleştirirse, sözleşmenin uyarlanması da gündeme gelebilir. Elbette sözleşme ile ilgili bu sonuçlar, ayni ilişkinin tarafları değişmediği sürece geçerlidir. Ayrıca, şartları gerçekleştiyse haksız fiil ve sebepsiz zenginleşme hükümlerine de başvurmak mümkündür. Oturma hakkı sözleşmesi sui generis bir sözleşme olduğundan kanunda kendisine özel düzenlemeler bulunmaz. Tarafların yaptığı düzenlemeler ilişkiyi şekillendirebilir. Ayrıca Borçlar Kanunu'nun yukarıda andığımız gibi genel hükümlerinin yanında Özel Borç İlişkileri bölümündeki hükümlerin de uygun düştüğü ölçüde uygulanması gündeme gelir. Özellikle satış sözleşmesi, bağışlama sözleşmesi, kira sözleşmesi ve ödünç sözleşmesi ile ilgili düzenlemelerden yararlanılabilir. Kıyasen uygulanacak hükümlerin tespitinde, bedelin bulunup bulunmaması ve bedelin tek seferde veya dönemsel bir şekilde yerine getiriliyor olması önem taşır. Oturma hakkı sahibinin kanundan doğan borçlarına aykırılık hâlinde Medeni Kanun'da malike tanınan birtakım haklar bulunur. Malik öncelikle gözetim yetkisini kullanarak oturma hakkı sahibinin yükümlülüklerine uyarak taşınmazı kullanıp kullanmadığını kontrol edebilir. Hukuka aykırı bir kullanım tespit ederse itiraz hakkını kullanabilir. Haklarının tehlikeye düşmesi durumunda malik güvence isteyebilir. Güvence göstermeyen veya hukuka aykırı kullanımını itiraza rağmen sürdüren oturma hakkı sahibinin zilyetliğinin elinden alınması ve taşınmaza kayyım atanmasını talep edebilir. Malik, hakkın devamıyla sağlanan yarar ile kendisinin katlandığı yük arasında açık bir oransızlık bulunması hâlinde TMK m. 785 uyarınca hakkın bedel karşılığında kısmen veya tamamen terkinini isteyebilir. Oturma hakkı sahibinin taşınmazı gereği gibi iade etmemesi hâlinde, yani taşınmazın oturma hakkı sahibinin kusuruyla yok olması veya değerinin azalması durumunda malik zararlarının giderilmesini isteyebilir. Malikin oturma hakkı sözleşmesinde taahhüt ettiği taşınmazın tescilini isteme borcunu yerine getirmemesi hâlinde oturma hakkı sahibi, TMK m. 716'ya dayanarak tescili isteme hakkına sahiptir. Ayrıca bu nedenle uğradığı zararları da genel hükümlere göre talep edebilir. Bunun gibi, malikin ayni kapsamda yer almayan diğer sorumlulukları zapttan ve ayıptan sorumluluktur. Oturma hakkı sahibinin hakkını gereği gibi kullanmasını engelleyen durumlar, diğer şartların da bulunması hâlinde malikin tam veya kısmi zapttan sorumlu tutulmasına neden olabilir. Bu noktada kira sözleşmesine konu edilmiş bir taşınmazda oturma hakkı tesis edilmesi önem arz eder. Öte yandan, malikin olumlu bir edim yüklenmesi de oturma hakkı sahibinin kişisel bir talep ileri sürerek sadece bu yönde taahhütte bulunan malike karşı bazı imkânlara sahip olması sonucunu doğurur. Malikin ayıptan sorumluluğu ancak bu şekilde, ayrıca üstlenmesi hâlinde gündeme gelir. Sorumluluğun kapsamı yerine göre satış, bağış, ödünç veya kira sözleşmesine dayanabilir. Son olarak, oturma hakkı sahibinin yükümlü olmadığı hâlde yaptığı giderleri hak sona erdiğinde vekaletsiz iş görme hükümlerine dayanarak talep etmesi mümkündür. Talepleri karşılanana kadar taşınmazla birlikte kendisine bırakılan taşınırlar üzerinde hapis hakkını ileri sürebileceği gibi hakkının terkininden kaçınması da mümkündür."
