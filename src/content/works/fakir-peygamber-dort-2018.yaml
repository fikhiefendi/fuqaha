abstract: "Bu çalışmamızda Hz. Peygamber Döneminden Dört Halife Dönemi Sonuna Kadar Zekât Uygulamalarını kaynakların izin verdiği bilgiler ölçüsünde çalıştık. Tezimiz zekâtın hukuki boyutunu değil, tarihsel yönünü ele almaktadır. Zekâtın bahsettiğimiz dönemlerde ifâde ettiği anlam ve zihinlerdeki algısına yoğunlaştık. Tezimiz giriş, iki bölüm ve sonuçtan oluşmaktadır. Giriş kısmında zekâtın farz olmasına giden süreçte Müslümanların Mekke ve Medîne'deki iktisâdî durumlarını ele aldık. Birinci bölümde Hz. Peygamber dönemi zekât uygulamalarını üç kısımda inceledik. Hz. Peygamberin zekât ve diğer vergiler karşısındaki durumu, zekâtların toplanması, zekât memurları ve zekâtın dağıtılması şeklinde bir başlıklandırma yaptık. İkinci bölümde Dört Halîfe döneminde zekât uygulamalarının gelişimini izlemeye devam ettik. Birinci bölümde olduğu gibi aynı başlıklar altında konuyu incelemeye ettik. Her halifenin dönemini ayrı başlıklara böldük. Sonuçta Hz. Peygamber döneminde başlayan zekât ibadeti Dört Halîfe döneminde gelişimini ve kurumsallaşmasını aktif bir şekilde sürdürmüştür ve zekâtın belli yapılara ve sistemlere kavuşmuş, vergi niteliği taşıyan bir yönü olduğu ortaya konulmuştur."
