abstract: "Bu tez çalışmasının konusu; Kethüda Canfeda Hatun'un hayatı, tesis ettiği vakıfları ve İstanbul Vakfı'nın XVII. yüzyıla ait muhasebe bilançolarının analizidir. Sultan III. Murad'ın harem kethüdası Canfeda Hatun resmi belgelerde bu unvanı kullandığı görülen ilk kadındır. Kendisi saltanat ailesine evlilik veya akrabalık yoluyla bağlı değildir. Tarihçi Gelibolulu Mustafa Âli, Nurbanu Sultan'ın güvenini kazandığını, Valide Sultan'ın ölmeden oğluna Canfeda Hatun'u yanında bulundurmasını vasiyet ettiğini bildirir. Böylece Sultan III. Murad nazarında itibarı artıp, nüfuzu genişlemiştir. O zamana kadar görülmedik şekilde“kethüda kadın”unvanıyla şöhret bulan Canfeda Hatun, gelirleri ve servetini çok sayıda hayır eseri tesis ederek Osmanlı toplumuna geri döndürür. Başbakanlık Osmanlı Arşivi'nde kayıtlı vakıf muhasebe defterlerine göre; İstanbul'da Karagümrük, Saraçhane ve Gedikpaşa semtlerinde ve Beykoz'un Akbaba köyünde, ayrıca İzmit'te çok sayıda hayır eseri yaptırmıştır. Hacca gidip dönen yolcuların ihtiyaçlarının giderilmesi için kurduğu bir de Haremeyn Vakfı vardır. Mısır'daki bazı gayrimenkullerinin gelirlerini bu vakfa tahsis etmiştir. Canfeda Hatun'un günümüze gelememiş hayır eserlerini ortaya çıkarmanın bir yolu muhasebe defterlerindeki bakım ve onarım kayıtlarıdır. Bilançolardaki gelir kaynaklarıysa serveti açısından ele alınmıştır. Zira İslam hukukunda vâkıf ancak mülkiyetindeki malları vakıf yapabilir. Çalışmada ele alınan diğer konu, İstanbul Vakfı'nın XVII. yüzyıl bilançoları üzerinden analizidir. Osmanlı Devleti'nde klasik dönemin tamamlandığı, taht mücadeleleri, yeniçeri isyanları, Celali isyanları gibi karmaşaların görüldüğü, ayrıca 1660 İstanbul Yangını gibi o zamana dek görülmüş en geniş çaplı yangınla karşılaşılan bir dönem Canfeda Hatun'un İstanbul Vakfı'nın özelinde değerlendirilecektir. Vakfın gelirlerinin ve giderlerinin karşılaştırılmasıyla mali dengesi, karşılaştığı krizler ve bunların çözüm yolları ve vakıf idaresinin etkinliği ele alınacaktır."
