abstract: "İnsanlar arasında hukuki açıdan meydana gelen ilişkilerin en büyük bölümü borçlar hukukuyla ilgilidir. Bu kapsamda kişinin birtakım haksız fiilleri sonucu diğer insanların mallarına zarar vermesi sebebiyle kendi aleyhine bazı borç ve yükümlülükler doğar. Hukuki münasebet çerçevesinde ve özellikle akit işlemlerinde akde konu olan malın zarar görmesi, zarara neden olan tarafa tazmin sorumluluğu yükler. Bu araştırma, akit konusunun teslim öncesi ve sonrası kısmen veya tamamen telef olması sonucu doğan sorumluluğun kime ait olduğunu, telefin kaynağını dikkate alarak incelemektedir. Tez giriş dışında üç bölümden oluşmaktadır. Birinci bölümde akit kavramı, akde konu olabilcek malın özellikleri ve hukuki sonuç doğurabilme bağlamında akdin çeşitleri ele alınmıştır. İkinci bölümde İslam borçlar hukukunda sorumluluk düşüncesi, çeşitleri, kaynakları ve ehliyetinin yanısıra bu sorumluluğun kabzla olan ilişkisi üzerinde durulmuştur. Üçüncü bölümde ise telef olan malın hangi durumlarda kim tarafından, ne şekilde tazmin edileceği, İslam fakihlerinin tazmin yükümlülüğünü pratikte nasıl işlettikleri ve meydana gelen zararın akitlerin feshine veya devam ettirilmesine olan etkisi; klasik fıkıh eserlerinde birer model akit kabul edilen satım, kira ve âriyet akitleri özelinde incelenmiştir."
