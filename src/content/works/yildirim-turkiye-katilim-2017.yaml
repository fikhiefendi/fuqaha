abstract: "Faiz, tarihin çeşitli aşamalarında sürekli tartışma konusu olmuştur. İslam dininde faizin yasak olması, faizin ekonomik ve sosyal zararlarından dolayı insanların bir kısmı tasarruflarını finans sektörüne aktarmamışlardır. Özellikle Müslüman nüfusun yoğun olduğu ülkelerde finans sektörüne dahil edilemeyen atıl tasarrufların fazlalığı o ülkeler için önemli bir sorun haline gelmiştir. Bu sorunu çözmek amacıyla geliştirilen,“Faizsiz Bankacılık”sistemi ilk kez 1964 yılında Mısır'da uygulanmaya başlanmış, Türkiye'ye gelişi 1984 yılında olmuştur. Bu çalışmada katılım bankaları ile reel sektör arasındaki ilişki üzerine yoğunlaşılmıştır. Çünkü özellikle Türkiye gibi gelişmekte olan ülkelerde ekonomik büyüme için reel sektördeki büyüme önemli olmaktadır. Bu noktada yatırımları finanse edecek tasarrufların yeterli düzeyde olmaması birçok gelişmekte olan ülkenin önemli sorunları arasındadır. Türkiye gibi Müslüman nüfus yoğunluğuna sahip ülkelerde insanların inançları gereği tasarruflarını finansal sisteme aktarmamaları var olan kaynağın kullanılamaması sonucunu beraberinde getirmektedir. Tasarruf yetersizliği veya var olan tasarrufların finansal sisteme çekilememesinin birçok sebebi olmakla birlikte dini sebebin ortadan kaldırılması adına katılım bankalarının önemi açıktır. Türkiye açısından 2005-2015 dönemi incelendiğinde katılım bankaları vasıtasıyla finansal sektöre çekilen ve reel sektöre aktarılan fonlar bu önemi açıkça ortaya koymaktadır. Bu dönemde faaliyet gösteren katılım bankaları, 404,5 Milyar TL fon toplamışlardır. Yine bu dönemde katılım bankalarının toplam risklerinin sektörel dağılımı incelenerek, nakdi krediler alanında toplam riskin %80'den fazlası, gayri nakdi krediler alanında ise toplam riskin %90'ından fazlasını reel sektöre sunduğu sonucuna ulaşılmıştır. Bu sonuçlar, katılım bankalarının ticari bankalara nazaran reel sektöre daha fazla ağırlık verdiğini ve reel sektörün gelişimi adına önemli roller üstlendiğini ortaya koymaktadır."
