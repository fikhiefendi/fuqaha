abstract: "Bu çalışmada hadislerin maksat eksenli anlaşılması bakımından bir örnek olarak İbn Hibbân'ın Sahîh adlı eseri incelenmiştir. Makâsıdü'ş-şerîa anlayışının tarihi, fikrî temelleri ve temel konuları özetle verilmiş, hadislerin anlaşılmasında makâsıd anlayışının önemi üzerinde durulmuştur. Maksat eksenli bir tasnif çalışması olarak örnek alınan İbn Hibbân'ın Sahîh adlı eserinin bu konuda temsil kabiliyeti irdelenmiştir. Musannifin tasnif usulü, kullandığı başlıkları ve ek olarak yaptığı açıklamalarıyla maksat eksenli yorumları incelenmiştir. Sonuçta bu eserin tam olarak makâsıd anlayışı için olmasa da hadislerde mevcut cüz'î şer'î maksatları ortaya çıkarma ve maksat eksenli hadis anlayışı için yöntem ve içerik bakımından iyi bir kaynak olduğu kanaatine ulaşılmıştır."
