abstract: "Şer'iyye Sicilleri Osmanlı Devleti içinde mevcud olan sosyo-kültürel, ve ekonomik yaşamı zamanımıza değin nakleden ve bizlere çok mühim malumât veren ve bu cihetiyle de maziye ışık tutan çok kıymetli yazılı olan kaynaklardan birisidir. Osmanlı'daki davalarda zabıt altına alınan bu pek değerli dökümanlar, kaleme alındığı zamandaki devir ve o yöre ile ilgili çokça ehemmiyetli bilgiler barındırmaktadır. Bu çalışma, Türk tarih ve kültürü yönünden de büyük bir ehemmiyete sahip olan şer'iye sicillerinden H.1267-1271/M.1851-1855 tarihleri arasında Gaziantep'te kayıt altına alınmış olan Şer'î mahkeme vesikalarını içerisinde barındırmaktadır. Toplamda 215 sahifeden müteşekkil olan bu sicil defterinin 1-108 sayfa aralıklarını bu çalışmamıza konu edindik. Bu evrakların 126 tanesi hukuksal nitelikte, 6 tanesi ise idârî muhtevadaki dökümanlardan meydana gelmekte olup toplam 132 adet evrak barındırmaktadır. Defter iki sayfa yan yana getirilip mikrofilmleri o şekilde çekilmek suretiyle tek sayfa haline dönüştürülmüştür. Defterde, merkez teşkilattan gelen arzuhâller (dilekçe), fermânlar, buyruldular ve nişân-ı şerifler gibi idari içerikteki dökümanlar ile nafaka, miras, vâsi tayin etme, boşanma, alacak-verecek gibi hukûksal içerikte belgeler sınıflandırarak değil de, rastgele kayıt altına alınmıştır. Bu deftere içerik olarak baktığımızda o dönemdeki Gaziantep'in idari, sosyal, kültürel, ekonomik durumu hakkında nisbeten bilgi sahibi olduğumuzu görmekteyiz. Transkripsiyonunu yapmaya çalıştığımız belgelerin konuları, içeriği, diplomatiksel hususiyetleri, hicri-miladi tarih ve kısa evrak telhisleri bütün evraklar için farklı bir tablo içinde sunulmak suretiyle okuyucuya kolaylık olması sağlanılmaya çalışılmıştır."
