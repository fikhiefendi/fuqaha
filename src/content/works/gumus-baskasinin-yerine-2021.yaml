abstract: "İslam dinine göre ibadetlerde asıl olan mükellefin, ibadeti bizzat kendisinin eda etmesidir. Ancak kimi zaman hastalık yaşlılık vb. hayat şartları buna izin vermeyebilir. Bu sebeple İslam dini, insanlara bazı durumlarda başkasının yerine ibadet etme ruhsatı tanımıştır. Bu çalışmada Hanefi, Maliki, Şafii ve Hanbeli mezhepleri esas kabul edilerek başkasının yerine ibadet etmenin hangi durumlarda mümkün olup olmayacağı konusu ele alınmıştır. Konu kavramsal çerçeve ve meselenin temel dayanağı ele alındıktan sonra sırf bedenen yapılan ibadetlerde, sırf mali olarak yapılan ibadetlerde, adak ve kefaretlerin ifasında niyabet olarak dört başlık altında incelenmiştir. Bedeni ibadetlerde başkasının yerine ibadetin ifası mümkün değilken, mali ibadetlerde genel olarak geçerli, hem mal hem de beden ile yapılan ibadetlerde ise belirli şartlarda mümkün gözükmektedir."
