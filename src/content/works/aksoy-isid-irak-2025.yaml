abstract: "Araştırmanın konusu, çağdaş dönemde İslâmî referansları istismar ederek küresel ölçekte olumsuz bir imaj oluşturan IŞİD örgütüdür. IŞİD, İslâm coğrafyasının farklı bölgelerinde süregelen siyasi istikrarsızlıklar ve iç çatışmaların bir ürünü olarak ortaya çıkmış; Irak ve Suriye'de ele geçirdiği topraklarda bir“İslâm Devleti”tesis ettiğini iddia etmiştir. Örgüt, İslâm'ın temel kaynakları olan Kur'ân ve Sünnet'i mezhebi usullerden bağımsız biçimde, kendi ideolojik amaçlarına uygun olarak yorumlamış; böylelikle dini metinleri selefî-cihadî anlayışla yeniden anlamlandırmıştır. İnanç sistemi bakımından Selefî–Hanbelî çizgiye dayanan IŞİD, tevhîd ilkesini merkezi konuma yerleştirerek bu ilkeye muhalif gördüğü tüm anlayış ve uygulamaları“şirk”ve“irtidat”olarak nitelemiştir.“El-Velâ ve'l-Berâ”prensibini, mü'minlere mutlak dostluk ve kâfirlerle kesin ayrışma şeklinde yorumlayarak hem gayrimüslimleri hem de kendi yorumuna uymayan Müslümanları hedef haline getirmiştir. Fıkhî alanda, şer'î hükümleri harfiyen uyguladığını ileri süren örgüt, klasik İslâm hukukunu tarihsel bağlamından kopararak aşırı biçimde yorumlamış; intihar eylemlerini“istişhâd operasyonu”adıyla yüceltmiş, kölelik ve cariyelik kurumlarını ihya etmeye kalkışmış, had cezalarını ise propaganda unsuru olarak kullanmıştır. Nübüvvet anlayışında kendisini“peygamberi yöntemi ihya eden tek yapı”olarak tanımlayan IŞİD, kıyamet hadislerine dayanarak bir kurtuluş mitolojisi inşa etmiş; İstanbul ve Roma'nın fethini ilâhî vaadin gerçekleşmesi olarak yorumlamıştır. Siyasi açıdan ise örgüt, modern ulus-devlet sistemini, demokrasiyi ve laikliği reddederek 2014'te ilan ettiği hilâfetle Sykes – Picot düzenini geçersiz saymış; ümmetin tek bir devlet çatısı altında birleşmesini ilâhî kaderin tecellisi şeklinde yorumlamıştır. IŞİD, Selefî düşüncenin aşırı uç bir yorumuna dayanarak tevhid, cihad, hilâfet ve hâkimiyet kavramlarını ideolojik bir zeminde yeniden tanımlamış; bu yönüyle Batıyla beraber kendilerinin dışındaki Müslüman topluluk ve yorumlara da cephe alarak eşi görülmemiş ölçüde dışlayıcı ve yıkıcı bir örnek teşkil etmiştir."
