abstract: "Bu tezin amacı, klasik ve modern dönemde rizikolu akitler ile ilgili olarak ileri sürülen yaklaşımları delilleriyle birlikte ortaya koyarak değerlendirmeye tabi tutmaktır. Bu bağlamda klasik dönemde rizikolu akitler başlığı altında gararlı akitler, kefalet, kumar ve bahis, umrâ ve rukbâ akitleri ele alınmış ayrıca bunların nassa bağlı olarak değerlendirmeleri ve mezheplerdeki yansımaları ortaya konulmaya çalışılmıştır. Yine modern dönemde risk ve rizikolu akitlerle ilgili yaklaşımlar ele alınmış ve bunların gerekçeleri zikredilmeye çalışılmıştır. Hz. Peygamber'in (sav) döneminde ve klasik fıkıh ekolleri devrinde rizikolu akitlerin mevcut olup olmadığı incelenmiş ve risk kavramı üzerinde durulmuştur. Ayrıca risk kavramı İslam iktisadı ve finansı açısından incelenmeye çalışılmış sukûk ve foreks konuları ele alınmış ayrıcabu akitlerle ilgili temel ilke ve kavramlar tespit edilmiştir. Metodolojik açıdan da risk kavramının garar ve daman ile olan ilişkisi ele alınmıştır. Daha sonra günümüzde rizikolu akitler başlığı altında sigorta, ölünceye kadar bakma akdi, kaydı hayat ile irat ve teminat mektubu akitleri incelenmiş; bunların modern hukuk açısından değerlendirmeleri yapılmış İslam hukuku açısından yansımaları ortaya konulmuştur. Ulaştığımız sonuç ise, bütün rizikolu akitlerin özelliklerinin ve rizikolu yönlerinin teker teker ortaya konularak incelenmesi gerektiği yönündedir. Naslarda net olarak tespiti yapılmış olan bir kısım rizikolu akitlerin cevazı için illetlendirme yoluna gidildiğinde makasıdü'ş-şeria bağlamında yeni çıkan akitlerin kıyas yoluyla değerlendirilmesi gerekmektedir. Bu nedenle bütün rizikolu akitlerin aynı kefeye konulmak suretiyle değerlendirilmemesi gerektiği, her birinin ayrı ayrı değerlendirilerek, İslam'ın koymuş olduğu teşri ve gayeler göz önünde bulundurularak bir netice elde edilmesi gerektiği kanaatindeyiz."
