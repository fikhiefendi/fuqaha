abstract: "Bu çalışmada necisle tedavi bağlamında domuz örneği incelenmekte, necisle tedavinin zaruret olup olmayacağı yönündeki görüşlere yer verilmektedir. Giriş ve iki bölümden oluşan bu çalışmanın giriş bölümünde araştırmanın konusu, amacı, önemi, yöntemi, kapsamı ve sınırlılıkları ele alınmaktadır. Birinci bölümde konumuzun temelini oluşturan necis, haram ve zaruret kavramlarına değinilmiştir. Ardından domuzun ilahi dinlerdeki yerine kronolojik olarak yer verilmiştir. İkinci Bölümde İslam Hukukunda tedavinin hükmü ele alınmış, necis madde ile tedavi konusunda mezheplerin görüşlerine yer verilmiştir. Necisle tedavinin bir örneği olarak domuzun tedavide kullanılması incelenmiştir. Domuzun tedavide kullanımının ilk örneği olarak öncelikle ilaçlarda kullanılan domuz içerikli maddelere değinilmiştir. Ardından domuzdan insana organ nakli ele alınmıştır. Bu başlık altında domuzdan insana kalp kapakçığı nakli, böbrek nakli ve kalp nakline tıbbi açıdan değinilmiştir. Çalışma necis maddenin tedavide kullanımının bir örneği olan domuzun tedavide kullanımının zaruret olup olmayacağı yönünde değerlendirme ile sonuçlandırılmıştır. Çalışmada dinen necis olarak nitelendirilen domuzun veya domuz içerikli maddelerin tedavide kullanımının tek yöntem haline gelip alternatifinin bulunmaması durumunda zaruret kapsamında değerlendirildiği sonucuna ulaşılmıştır. Tedavide domuzun tercih edilme sebebinin hızlı üretim ve hızlı yavrulamanın sağladığı finansal avantajlar olma ihtimali hakkında net bilgimiz olmamakla birlikte -alternatif maddenin bulunmasına rağmen- bu ihtimalin gerçekleşmesi, bu maddelerin tedavide kullanımını zaruret kapsamından çıkaracağı sonucuna ulaşılmıştır."
