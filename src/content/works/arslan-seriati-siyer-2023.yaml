abstract: "Bu çalışmada Ali Şeriati'nin düşünce dünyasına girebilmek için öncelikle onun hayatı ve eserleri ele alınmıştır. Hayatındaki dönüm noktaları, ulemaya karşı yaklaşımı, aydınlara yüklediği misyon, siyasi olaylara karşı tavrı, ilme verdiği önem ve daha birçok yönü vurgulanmıştır. Onun, Hüseyniye-i İrşad faaliyetleri kapsamında insanlara fikir ve ruh aşılamakta öncülük ettiği görülmektedir. Şeriati yeni kavramlar türetmede mahir bir düşünürdür. Orijinal fikirler öne sürerek insanları etkisi altına almıştır. Onun hayatında Marksizm gibi batı ideolojilerinin etkisi açıkça görülmektedir. Bir ayağının siyasette olması sansürlü bir dil kullanmasına sebep olmuş ve ürettiği gerçek ile hayal karışımı karakterler vasıtasıyla kendine ifade alanı bulabilmiştir. Şeriati'nin düşünce dünyası ve ortaya koyduğu fikirleri çerçevesinde onun siyere dair görüşleri açıklanmıştır. Bir siyer yazarı olarak Şeriati, hem üslup hem de bakış açısı olarak klasik siyer eserlerinden farklı bir tarz benimsemiştir. Hz. Peygamber'in insani yönünü ön plana çıkararak daha kolay erişilebilir bir portre çizmiştir. İbrahimî peygamberler silsilesinde yer alan bütün peygamberlerin ve zincirin son halkası Hz. Peygamber'in hayatları boyunca şirke karşı mücadele içerisinde olduklarını belirtmiş ve bu mücadeleden kesitler sunmuştur. Şeriati'nin siyerinde okuyucuya sunduğu sembol şahsiyetler bulunmaktadır. Siyere dair görüşlerini onların hayatları üzerinden aktarmıştır. Bir sosyolog bakış açısıyla siyer konularını ele almış ve bu konuları devrim fikrini merkeze alarak açıklamıştır. Yazarın siyerine genel olarak bakıldığında Şiî olmasının etkisiyle bazı konulara objektif yaklaşmadığı da görülmektedir."
