abstract: "TÜRKÇE ABSTRAKT Bu tez çalışması, 20.y.yılın son çeyreğinde sosyal bilimlerde yoğun tartışmalara konu olan İslam'ın ekonomik anlamda toplumsal bir proje sunup sunamayacağına ilişkin tartışmaları kapsamaktadır. Bu amaçla, bu çalışmada İslam'a genel bir bakış çerçevesinde; İslamda mülkiyet, miras anlayışı, İslami ekonomik modelin argümanları bağlamında faiz, faizsiz bankacılık (İslam'da bankacılığa ilişkin kurumsal düzenlemeler) düzenlemeleri, Özel Finan Kurumları ile bunların genel bir değerlendirmesi yer almaktadır. Aynı zamanda küreselleşme süreci ile ortaya çıkan kültürel karşı duruşlar kapsamında“bir karşı duruş olarak İslam”başlığı altında; modernleşme ve İslam, kimliğin stratejik tercihleri, küreselleşme ve kültürel farlılık bağlamında İslam, kimliğin ve farklılığın göstergesi olarak tüketim ve sembollerin kullanımı, konusundaki tartışmalar ele alınarak, modernleşmeci yaklaşımda ortaya çıkan“Batı”ve“Batı olmayan”in kurgusunda“Bir Karşı Duruş Olarak İslam'ın”kendisini nasıl tanımladığı irdelenmektedir. Bu çerçevede“Batı-Dışı”,“Öteki”olarak tanımlanan İslam'ın kendisini nasıl tanımladığına bakılarak, bunu, kimlik, kültürel farklılık bağlamında toplumsal ilişkilere nasıl yansıttığı irdelenmektedir. İslam'ın diğer ekonomik sistemlerden farklılığı, özellikle faiz ve faizsiz bankacılık ve Özel Finans Kurumlarının kâr - zarar ortaklığı anlayışı temelinde ayrı bir konuma oturtuluşunun teorik açılımları ile, gündelik yaşamdaki uygulama biçimleri ele alınıp incelenmektedir. Bu incelemeye bağlı olarak İslam'ın ekonomik anlamda özgün bir ilişki yaratıp yaratmadığı tartışılmaktadır. Sonuç kapsamında; İslami sermaye oluşumunun Türkiye'de ortaya çtkış koşullan ve tarikat- dini cemaat ilişkileri değerlendirilerek, İslam'ın sunduğu ekonomi doktrinin ne kadarının İslamla veya kapitalizm ile örtüştüğü tartışılmaktadır. Piyasa koşullan içinde yer alan Özel Finans Kurumlannın İslami niteliği, II ŞUBAT 2001 tarihinde kapatılan İhlas Finans Kurumunun faaliyetlerinin durdurulmasına eden olan gerekçeler özelinde ele alınarak, bu kurumsal faaliyet üzerinde İslam'ın ekonomik anlamdaki özgünlüğü tartışılmaktadır."
