abstract: "İslam Hukukunda akrabalık kan, evlilik ve süt yoluyla oluşmaktadır. İslam Hukuku akrabalık sebebiyle insana bazı alanlarda hak ve toleranslar tanırken; bazı alanlarda insana sorumluluklar yüklemiştir. Örneğin bayana, yakın akraba erkekler ile selamlaşmada ve tokalaşmada ayrıca onların yanındaki giyim-kuşam konusunda tolerans tanırken; eşlerin ebeveynlerinin birbirleri için öz anne-baba konumuna gelmesi sebebiyle onların bakımı konusunda eşlere dini ve ahlaki bir sorumluluk yüklemiştir. Akrabalar arası ilişkilerin devamlılığını ifade eden sıla-i rahimin, herkesin yerine getirmesi gereken dini ve ahlaki bir sorumluluk olduğu Kur'an-ı Kerim ve Sünnet ile sabittir. Sıla-i rahim, manevi yönüyle akrabaya muamelede bulunma; maddi yönüyle akrabaya infakta bulunma şeklinde gerçekleşmektedir. İslam Hukukunda çocuğun bakım ve terbiyesini ifade eden hidane hakkı, genç kızların evlendirme velayeti ve nafaka hakkı, usul ve fürûdan sonra akrabalık sebebiyle asabe ve zevi'l-erhama geçmektedir. Miras hakkına sahip olan yakınlar ise ashabü'l-ferâiz, asabe ve zevi'l-erhamdır. İslam Hukuku töhmet oluşturabileceği sebebiyle eşlerin, usul ve fürûnun birbirlerinin lehine olan şahitliklerini kabul etmezken; diğer akrabaların birbirlerinin lehine olan şahitliklerini kabul etmektedir. Görüldüğü üzere akrabalık kurumu, ahlaki ve hukuki düzenlemeleri de beraberinde getirmektedir. Bu çalışma son yıllarda önemini yitirmek üzere olan akrabalık ilişkilerini canlandırmayı ve insanların akrabalık ilişkilerindeki ahlaki ve hukuki sorumluluklarını yeniden hatırlatmayı amaçlamaktadır."
