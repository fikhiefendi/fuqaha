abstract: "Çok yönlü bir alim olan İbn Kayyım'ın, İslâmî ilimlerin neredeyse her alanında yetkin bir kimliğe sahip olmasından dolayı, genel anlamda fıkıh özelde ise mali muamelata ilişkin görüş ve yaklaşımlarının bilinmesi önem arz eden bir konudur. İbn Kayyım'ın mali muamelata dair görüşlerine yer verdiği en geniş eseri ise, inceleme konumuz olan İ`lâmü'l-Muvakkı`în adlı eseridir. Bu araştırma, İbn Kayyım'ın bu eserindeki mali muamelat konularındaki yaklaşımını ele almaktadır. İbn Kayyım, İ`lâmü'l-Muvakkı`în adlı eserinde mali muamelata ilişkin her meseleyi ele almamaktadır. Eserde mevzu bahis yaptığı mali muamelat konularını ise tüm boyutları ile incelememektedir. İncelediği kimi meseleye de istitradî bir yöntem ile yer vermektedir. İbn Kayyım, İ`lâmü'l-Muvakkı`în adlı eserinde mali muamelat meselelerini, daha çok kıyas, istihsan, hikmet ve hile kavramları etrafında mütalaa etmektedir."
