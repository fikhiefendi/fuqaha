abstract: "Imam Şafiî (v. 820) İslam hukuk tarihi açısından önemli bir alimdir ve birçok çalışmanın odak noktası olmuştur. Ayrıca, ana kitaplarından biri olan el Risale, İslam hukuk teorisinin temel bir kaynağıdır. El Risale, erken hukuk teorisi üzerinde önemli bir rol oynar ve Imam Şafiî'nin kendi hukuk teorisini gösterir. Ayrıca, Risale, Imam Şafiî'nin hermeneutic terimlerini ve bu terimleri nasıl kullanarak İslam hukuk sorunlarına ilişkin Kuran ve Sünnetin metinlerini anlamaya çalıştığını temsil eder. Bu çalışma, bu terimleri ve Imam Şafiî'nin kutsal metinleri anlama ve kavrama amacıyla nasıl kullandığını vurgulamaktadır. Imam Şafiî'nin hukuk teorisi ayrıca beyān ve çeşitlerine dayanmaktadır. Beyān kavramı ile imam Şafiî'nin hukuki duruşu arasında bir bağlantı olduğu açıktır ve bu kavramla birlikte, Sünnet resmi olarak İslam hukukunda bir yetki kaynağı haline gelmiştir. Ayrıca, Imam Şafiî, hukuki sorunları açıklamak için kuralları belirleme açısından genel ve özel terimler olan āmm ve Khāṣṣ terimlerini analiz eder. Son olarak, Imam Şafiî Risalede bir tefsir terimi olarak nesh kavramını da vurgular. Bu çalışma, Imam Şafiî'nin hukuk teorisi tarafından sunulan tefsir terimlerini (yani beyan, āmm, khāṣṣ ve nesh kavramlarını) inceleyecek ve kullanımlarını açıklamaya çalışacaktır."
