abstract: "Bu tez, Türkiye'de ekonomik istikrarı sağlamak amacıyla, yalnızca reel ekonomi faaliyetlerinde bulunan şirket ve işletmeleri desteklemek için münhasır katılımcı finansmana dayalı, küresel olarak yeni bir tür özel ekonomik bölge oluşturma olasılığını tartışmayı amaçlamaktadır. Bu tip özel ekonomik bölgelerin başlığını“Katılım Bölgeler”olarak önermektedir . Tez, yarı yapılandırılmış görüşmelerden birincil verileri ve üç Türk yerel kanunu tarafından temsil edilen ikincil verileri toplamak için analitik tanımlayıcı metodolojiyi kullanmıştır. Ve veriler analiz edilerek, en önemlisi Katılım Bölgelerinin yeni bir kanunla, diğer özel ekonomik bölge türlerine göre ve dikkate alınması gereken özel şartlarla oluşturulabilmesi olasılığı olan bir dizi sonuca ulaşılmıştır. Tez ayrıca ekonomide İslam Hukuku uygulamasını ölçmek için özel bir ölçek buldu."
