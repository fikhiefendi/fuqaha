abstract: "Bu araştırmada Mısrî Şemseddîn Muhammed'in Tefsîru'l-Kur'ân isimli eserinin En'âm suresinin tahkik ve analizi yapılmıştır. Araştırmanın önemi müellifin eserini âsâr, re'y ve işâri tefsirlerden alarak oluşturması kaynaklı ilmi konumu sebebiyledir. Aynı şekilde müellif âyetleri tefsir ederken kelimelerin i'câzı, belâgıtı, cümlelerin yapısının dayanıklılığı, sözlerin tatlılığı ve terkiplerin güzelliği üzerinde de durmuştur. Belâgat yönleri, irâb, kıraat farklılıkları, akâid fıkıh ve diğer ilimlerle ilgili çeşitli ilmi meselelere önem verilmesi kitabın ilmi kıymetini artırmıştır. Müellif Şemseddîn Mısrî'nin biyografisi, ilmi ve kişisel hayatı incelenirken betimleyici tarihsel metot kullanılmıştır. Eserin yazımı, harekelenmesi, nüshaların karşılaştırılıp farklılıkların tespiti, nakledilen görüşlerin asli kaynaklardaki yerlerinin gösterilmesi konularında tahkik ve talik metodu kullanılmıştır. Araştırmada varılan sonuçlardan önemlileri şunlardır: Müellif Şemseddîn Mısrî, ayetlerin tefsiri, kullandığı metot ve yaptığı nakillerde İmam Kurtubî'den bariz bir şekilde etkilenmiştir. En'âm suresinin başında çeşitli ilimlerle iştigal etmiş büyük âlimlerden bahsetmiştir. Örneğin nahiv konularında Sîbeveyh, Kisâî, Zeccâc ve diğer meşhur âlimlerin görüşleriyle istişhâd etmiştir. Masrî eserinde nahiv, tefsir ve diğer konularda kaynağını açıkça söylemeden birçok nakil yapmıştır. Eserde zayıf isrâilî rivayetler ile zayıf hadislerin bolca bulunması eserin ilmî kıymetine bir halel getirmez."
