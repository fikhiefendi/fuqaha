abstract: "Bu çalışma, her iki (Klasik ve İslâmî) türleri ile Para Politikası konusunu ele almaktadır. Girişte para politikası kavramına değinilmiştir. Sonra para politikasının işleyişi, türleri, parametreleri ve genel ekonomiye etki eden kanalları ele alınmıştır. Bunlar ele alınırken para politikasının etkinliği, parayı ele alan ekonomik ve fıkhi görüşlerinin ortaya konulması amaçlanmıştır. Aynı şekilde bu araştırma, faiz tandanslı klasik finansman parametrelerine karşı bir alternatif sunma amacıyla İslami Finans konusunu da ayrıntılı bir şekilde ele almıştır. Alternatif finansmanın etkinliğinden emin olunmak amacıyla İslami finans yöntemi olarak kullanılan bir dizi uluslararası tecrübeler örnek verilmiştir. Bu özel çalışma ve öneri, para konusunda yetkili olan kurum ve kuruluşların taleplerinin ve arzuladığı hedeflerin gerçekleşmesi ve bunların fıkhi görüş ve kararlarla uygunluğunun belirlenmesi ve faiz ile çalışmayı engelleyen kanunların verilerine uygun olarak Libya Ekonomisi içerisinde yeterli bir şekilde çalışabilen ve İslam Şeriatı ile uyumlu Libya Para Politikasına özgü bir örneğin önerilmesi için bu parametrelerin etkinliğinin boyutunu ve yeterliliğini tecrübe etmek amacıyla en önemli ekonomik göstergeleri açıklamakla birlikte bu parametreleri çalışan ve uygulayan uluslararası tecrübeleri içermektedir. Daha sonra bu çalışma, zaman içerisinde şahit olduğu ve yaşadığı en önemli gelişmelerle birlikte Libya Para Politikasının mevcut durumunu, şer'î ve medeni yasal çerçevesi, Libya Banka Sektörünün tecrübesi ve Libya Devletinin, bunlarla ilgisi olan Para politikaları ele alınmıştır. Sonuç olarak bu çalışma çok önemli sonuçlar ve önerilerle sonuçlandırılmıştır."
