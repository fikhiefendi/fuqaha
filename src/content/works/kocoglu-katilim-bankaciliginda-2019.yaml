abstract: "1960'lı yıllara kadar geçen süreçte yer alan üretim üstünlüğü ile rekâbet edebilme 1970'li yıllarda maliyet üstünlüğü ile rekâbet edebilme sürecine girmiştir. 1980-1990 yılları arasında ilişkisel pazarlamanın gelişimini açıklayan iki önemli ekonomik görüş ortaya çıkmıştır; birinci görüş, var olan müşterileri elde tutma çabalarının yeni müşteri kazanma çabaları ile karşılaştırıldığında maliyeti azaltıcı bir etkiye sahip olunması; ikincisi de alıcı-satıcı ilişki kalitesinin sürdürülebilir bir rekâbet avantajı olarak ortaya çıkmasıdır. Dünyada tüm sektörlerde rekâbet ortamı şiddetlenmeye başlamış; işletmeler arasında yaşanan rekâbet, pazarlamaya müşterinin yeniden keşfini zorunlu hale getirmiştir. Şartların değişimi ve rekâbetin artışı, müşteri ile ilişki kurulması ve kurulan ilişkinin sürekli olması gerekliliğini savunan ilişkisel pazarlama anlayışının gelişmesine yol açmıştır. İlişkisel pazarlamanın önemi, tüketim alışkanlıklarının değişmesi, ihtiyaç ve isteklere yönelik taleplerin zamanla konfor ve kaliteye yönelik değişimi ile hızlanmıştır. Araştırmanın amacı, katılım bankacılığı sektöründe ilişkisel pazarlama ögelerinin müşteri memnuniyeti ve müşteri sadakati üzerine etkilerinin incelenerek pazarlama literatürüne ve katılım bankacılığı sektörüne katkıda bulunmaktır. Bu amaca yönelik olarak Samsun ilinde yeralan bir katılım bankasının dört şubesindeki müşterileri ile yapılan 34 soruluk anket sonuçları SPSS programında çoklu regresyon ile analiz edilmiştir. Çalışma sonuçlarına göre Müşteri memnuniyetinde en güçlü ilişki bankanın hizmet kalitesine bağlı iken en zayıf ilişki katılım bankasının niteliğidir. Bu durum tespite göre katılım bankasının müşterilerinin bankadan memnun olabilmesinde bankanın hizmet kalitesi diğer bağımsız değişkenlere göre daha önemli değişkendir. Müşteri sadakati ile ilişkisel pazarlama ögeleri arasında yapılan ilişki analizi sonuçlarına göre katılım bankası müşterilerinin banka sadakatinde personel uzmanlığı değişkeni diğer değişkenlere göre daha önemlidir. Bankanın niteliğinin müşteri sadakatinde diğer değişkenlere göre zayıf ilişkili olması göstermektedir ki katılım bankalarının potansiyel sadık müşterileri aslında nitelik hassasiyeti olan kitle değil, personel uzmanlığı bekleyen müşteri kitlesidir. Müşteri sadakatinde personel uzmanlığı değişkeni, Bankaya güven değişkenine göre daha güçlü ilişkilidir. Çalışma sonuçlarına göre Müşteri memnuniyetinde en güçlü ilişki bankanın hizmet kalitesine bağlı iken en zayıf ilişki katılım bankasının niteliğidir. Bu durum tespite göre katılım bankasının müşterilerinin bankadan memnun olabilmesinde bankanın hizmet kalitesi diğer bağımsız değişkenlere göre daha önemli değişkendir. Müşteri sadakati ile ilişkisel pazarlama ögeleri arasında yapılan ilişki analizi sonuçlarına göre katılım bankası müşterilerinin banka sadakatinde personel uzmanlığı değişkeni diğer değişkenlere göre daha önemlidir. Bankanın niteliğinin müşteri sadakatinde diğer değişkenlere göre zayıf ilişkili olması göstermektedir ki katılım bankalarının potansiyel sadık müşterileri aslında nitelik hassasiyeti olan kitle değil, personel uzmanlığı bekleyen müşteri kitlesidir. Müşteri sadakatinde personel uzmanlığı değişkeni, Bankaya güven değişkenine göre daha güçlü ilişkilidir."
