abstract: "Tarihî belgeler, geçmiş toplumların siyasî, sosyal ve ekonomik yapılarını anlamada en temel kaynaklardan biridir. Bu belgeler arasında yer alan şer'iyye sicilleri, yalnızca adlî kayıtlar olmalarının ötesinde dönemin toplumsal ilişkilerini, iktisadî dinamiklerini ve kültürel pratiklerini ayrıntılı biçimde yansıtan özgün veriler sunar. Bu çalışma, 23b numaralı Kırım Şer'iyye Sicil Defterinin (H. 1087–1092 / M. 1676–1681) transkripsiyonuna dayanarak dönemin Kırım Hanlığı'ndaki çeşitli yapıları incelemektedir. İdari yapı kapsamında kazanın işlevi ve alt birimleri tespit edilmiştir. Sosyokültürel yapı bağlamında aile hayatı, kölelik, suç türleri, ünvan ve meslek grupları gibi konular ele alınmıştır. Ekonomik yapı ise hayvancılık faaliyetleri, ticaret ilişkileri, kullanılan para ve ölçü birimleri ile maddi kültür unsurları üzerinden değerlendirilmiştir. Elde edilen bulgular, Kırım Hanlığı'ndaki gündelik yaşam pratiklerinden devlet-toplum ilişkilerine uzanan geniş bir perspektif sunmakta olup mevcut literatüre katkı sağlamayı amaçlamaktadır."
