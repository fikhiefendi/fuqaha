abstract: "Araştırma konusu olarak seçmiş olduğum bu mevzu, bazı önemli problemlerin çözümünü sağlayacak mahiyettedir. Çünkü konu olarak Kadının şahitliği meselesi bazı şeylerin ispatı sadedinde kullanılmasında önemli bir etkisi bulunmaktadır. Sadece bu amaçla değil bilakis hukuki açıdan bazı şeylerin ortaya konulması, kadının şahitliği meselesi üzerinde hareket etmekte veya ispat edilmektedir. Aynı zamanda bu araştırmanın konusu âlimler tarafından da ihtimam gösterilen bir konudur, çünkü söz konusu konu, kadının şahitliği meselesidir ki bu birtakım hassasiyetleri bulunan bir meseledir. -Bu bağlamda- fakih ve müfessirlerin konuyla ilgili görüşleri farklılıklar arz etmektedir. Bundan dolayı da elimden geldiğince meseleyi ele almaya çalıştım. Öncelikle kadının şahitliği meselesini insan mefhumu (unsuru) ile Kur'an-ı Kerim'in maksatları açısından konumunu açıkladım ve çalışmada şahitlik kavramı ve aslı, şahitliğin önemi, rükünleri, erkeğin şahitliği ile kadının şahitliği arasındaki farklar ve şahitliğin teşrii olmadığını aksine teklifi bir konu olduğunu ortaya koymaya çalıştım. Bunun yanında şahitlik konusunun kitap ve sünnetteki yerini, şahitliğin şartlarını, kadının tek başına şahit olması ve bunun yeterliliği ile kadın şahitliğinin tek başına yeterli olduğu hallerin kitap, sünnet ve klasik kaynaklar açısından konumunu açıkladım. Ek olarak kadının şahitliği konusunu hadd bablarındaki yerini ile erkekle birlikte kadının şahitliği meselesi ve beşeri düzlemde erkek veya kadın oluşun şahitlik üzerindeki etkisini ifade ettim. -Son olarak- kadının şahitliği konusu çerçevesinde oluşan birtakım şüpheleri belirtip bu şüpheleri cevaplandırmaya çalıştım ve nihai olarak da araştırmanın önemli sonuçlarına yer verdiğim bir sonuç kısmını da çalışmaya ekledim."
