abstract: "Tarihin farklı dönemlerinde ortaya çıkan radikal görüş mensupları, kendi çağlarında ve kendilerinden sonra tarih sahnesinde önemli izler bırakmıştır. Bu şahsiyetlerden biri de Takıyyüddîn İbn Teymiyye'dir. XIII. yüzyılın son yarısı ile XIV. yüzyılın ilk çeyreğinde yaşamış olan İbn Teymiyye, İslâm dünyasının doğudan Moğolların, batıdan ise Haçlıların saldırılarına maruz kaldığı bir dönemde, farklı ve radikal fikirleriyle dikkatleri üzerine çeken bir İslâm âlimidir. İbn Teymiyye, İslâm âleminde dinî yozlaşma olduğunu ve bu durumun ortadan kalkması için Müslümanların Kur'an'ı ve Selef-i Salihîn dönemindeki uygulamaları esas alması gerektiğini savunmuştur. Bu doğrultuda, Kur'an ve hadis temelli uygulamaların çözüm olacağını ifade etmiştir. İbn Teymiyye'nin din, devlet yönetimi ve toplumsal yapıya ilişkin görüşleri, yaşadığı dönemde bazı âlimler tarafından eleştirilirken, bazıları tarafından ise desteklenmiştir. Onun temellerini attığı bu anlayış, kendisinden sonra gelen bireyleri ve âlimleri etkilemiştir. XVIII. yüzyılda Muhammed bin Abdülvehhâb da İbn Teymiyye'nin fikirlerinden etkilenmiş ve Suudi Arabistan'da onun anlayışını temel alarak Vehhabîliği insanlara benimsetmeyi,yaymayı ve uygulamayı başarmıştır. Bu düşüncenin hem Arabistan'ın hem de diğer bazı ülkelerin devlet yönetimi ve toplumsal yapısı üzerinde önemli etkileri olmuştur. Tezin kapsamı, İbn Teymiyye'nin hayatı, yaşadığı önemli olaylar ve verdiği fetvaların, Müslüman ve Oryantalist araştırmacıların kaynakları taranarak betimleyici bir metot kullanılarak incelenmesini içermektedir. Bu doktora tezinde, İbn Teymiyye'nin hayatı ve Kur'an'ı ve Selef-i Sâlihîn dönemini örnek alan anlayışının, yalnızca kendi döneminde değil, tarihsel süreç içerisinde devlet yönetimi ve toplumsal yapılar dair fikirleri araştırılmaya çalışılacaktır."
