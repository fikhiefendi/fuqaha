abstract: "Bu Araştırma,“Karadavi ve Buti Arasında Makasıd-ı Şer'ia: Karşılaştırmalı ve Tahlilî Bir İnceleme”başlığını taşımaktadır. Çalışma, bir giriş bölümü, araştırmaya hazırlayıcı bir ön bölüm, konuyu ele alan üç ana bölüm ve bir sonuç kısmından oluşmaktadır. Ön Bölüm: Birinci konuyu, iki imamın ayrıntılı biyografisine ayırdım. Bu bölümde onların yetişme tarzlarını, kişisel ve ilmî hayatlarını, geride bıraktıkları ilmî ve fikrî mirası ile vefat tarihlerini ele aldım. İkinci konuda ise, çağdaş siyasi gerçekliğe dair kısa bir değerlendirme sundum ve her iki âlimin siyaset sahnesindeki etkilerini, maksatlara dayalı içtihatları çerçevesinde ortaya koydum. Daha sonra birinci bölüme, makâsıd (şer'î maksatlar) kavramını ele alarak başladım. Bu bölümde, hikmet, illet, münasabet ve maslahat gibi makâsıd ile ilişkili en önemli kavramları açıkladım; bu kavramların anlamlarını ve makâsıd kavramıyla olan bağlantılarını detaylandırdım. İkinci konuda ise, makâsıdın önemine değindim. Bu önemi hem genel olarak Müslümanlar için hem de özellikle müctehidler, âlimler ve ilim talebeleri açısından ortaya koydum. Ardından, farklı açılardan yapılan sınıflamalara göre makâsıdın kısımlarını detaylandırarak açıkladım. Bu çerçevede, makâsıdı: kaynağına göre, gerçekleşme zamanına göre, güç derecesine göre, genel şeriatla olan ilişkisine göre, kesinlik (kat'îlik) veya zannîlik durumuna göre, tüm ümmeti mi yoksa fertleri mi kapsadığına göre sınıflandırarak her bir türü açıklığa kavuşturdum. Daha sonra ikinci bölümde, makâsıdın tarihsel bağlam içindeki gelişimini ele aldım. Bu gelişim sürecini şu dört aşama çerçevesinde inceledim: kaynaklara dayalı temellendirme dönemi, ilmî inşa aşaması, türetme, uygulama ve makâsıdî içtihatta özgünlük dönemi, makâsıd düşüncesinin yeniden ihya süreci. Her dönemde öne çıkan makâsıd öncülerini zikrettim ve bu alana yaptıkları katkıları vurguladım. Ardından gelen üçüncü bölüm, araştırmanın asıl başlığını taşıyan bölümdür. Bu bölümde, iki imamın (Karadâvî ve Butî) makâsıd anlayışlarını ayrıntılı biçimde ele aldım. Önce her birinin nezdinde makâsıdın kavramını, önemini ve beslendiği kaynakları inceledim. Daha sonra, görüşleri arasında analiz ve karşılaştırmalar yaptım. Ayrıca, genel maksatlar ve bu maksatların tespit yollarını her iki alim özelinde ortaya koyarak aralarındaki metodolojik farkları karşılaştırdım. Devamında, makâsıdın beş temel korunma alanına (zarûriyyât-ı hamse) indirgenip indirgenemeyeceği ve bu alanların öncelik sıralamaları konusundaki görüşlerini tahlil ettim, karşılaştırdım ve bazı yerlerde bir görüşü diğerine tercih ederek tercihin gerekçesini sundum. Çalışmayı, ulaştığım önemli sonuçlarla sonlandırdım. Bu sonuçlardan en önemlisi; geçmişte ve günümüzde bütün imamların, makâsıd kavramı ve anlamı konusunda görüş birliği içinde olmalarıdır. Bu anlam, menfaatlerin gerçekleştirilmesi ve zararların önlenmesi esasına dayanmaktadır. Ayrıca, tüm meşru menfaatlerin özünde, şeriatın maksatlarını koruma esasına dayandığı ve bu maksatların Kur'an, Sünnet, icmâ ve hâlin delâletleriyle sabit olduğu konusunda da görüş birliği olduğu sonucuna ulaştım. Araştırmanın sonunda, bu alandaki çalışmaları desteklemek ve daha da geliştirmek adına, araştırmacı meslektaşlarıma ve ilim talebelerine bazı öneriler sundum. Anahtar kelimeleri: Makâsıd, Maslahat, Karadâvî, Butî, Ahkâm."
