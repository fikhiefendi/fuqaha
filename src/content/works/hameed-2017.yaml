abstract: "Mâhtût ve fıkıh ilimleri ile bize intikal eden mâhtût mirasın önemi kimseye meçhûl değildir. Saygı ve takdiri hak eden ümmetler, miras ve ilimlerini koruyanlardır. Bununla birlikte miras, geleceğin inşasında birçok fayda sunmaktadır. Tezimiz, Şafiî mezhebinde yazılmış ve Yusuf el-Erdebîlî'ye ait“el-Envâr lî a'mâli'l-ebrâr”isimli kitabın şerhini ele almaktadır. Çünkü bu kitabı Kürt âlim Molâ Muhammed el-Gerdî şerh etmiş ve“Hâşiyetü Molâ Muhammed el-Gerdî 'alâ'l-envâr”“ olarak isimlendirmiştir. Bu kitaptan ”bey'“ (alışveriş) bölümünden ”rehn\" (rehin) bölümünün sonuna kadar tarafımdan tahkik edilmiştir. Mütevazı çalışmamız, İslam Hukuku ve Usûlünde yüksek lisans düzeyini kazanmak amacıyla Bingöl Üniversitesi Sosyal Bilimler Enstitüsü Temel İslam Bilimleri Bölümü İslam Hukuku anabilim dalına sunulmuştur. Tezimiz, önsüz, iki bölüm, sonuç ve kaynakçadan oluşmaktadır. Önsöz, kitabın metodu, bu konuyu seçmenin nedeni ve önemi, kitapla ilgili yapılan çalışmaları ve son olarak da tezin metodunu içermektedir. Birinci bölüm inceleme olup iki kısımdan oluşmaktadır. Birincisinde yazarın hayatı, eserleri, söz konusu eserde izlediği metot ve eserin kaynaklarından bir nebze söz ettik. İkinci kısımda ise tahkikte yapacaklarımı, kitabın ismi, müellife nispeti ve mahtûtun vasıflarından söz ettim. İkinci bölüm ise tahkik edilmiş metinden oluşmaktadır. Bey' bölümünün başından rehn bölümünün sonuna kadar devam etmektedir. Bana ayrılan kısım 29.5 kitabeden oluşmaktadır. Şarih, Envâr'ın şerhini bölüm ve kısımlara ayırmamakta, kitabın bölümlerine olduğu gibi bağlı kalmaktadır. Çalışma esnasında eserin metnini iyice kavradık. Esas aldığımız iki nüsha, en eski nüshalardan sayılmaktadır. Ayrıca iki nüshada yer alan bütün ayetlerin yerlerini, hadis ve âlimlerin sözlerinin kaynaklarını gösterdik. Eserde geçen isimlerin biyografisi ve metin için gerekli olan diğer açıklayıcı notları da yazdık. Sonuç kısmında ise inceleme ve tahkikin en önemli sonuçlarını verdik. Bu çalışma vesilesiyle Yüce Allah'tan takva ve istikameti istemekteyim. Çalışmamın sadece ona mahsus olmasını dua etmekteyim. Onu yazan, danışmanlığı yapan, okuyan ve ondan istifade edenlere faydalı olmasını dilemekteyim. O, ne iyi mevlâ ve ne iyi yardımcıdır."
