abstract: "İslam tarihinin en acı tecrübelerinden biri olan Mihne döneminde kamu düzeni gerekçe gösterilerek uygulanan cezaların ele alındığı bu çalışma bir giriş, iki bölüm ve sonuç kısmından oluşmaktadır. Giriş kısmında konunun önemi, amacı, kapsamı, yöntemi ve kaynaklarına dair açıklamalara yer verilmiştir.“Kamu düzeni”kavramının mahiyeti ve tarihi süreci hakkında malumat verilen birinci bölümde Cahiliyeden itibaren Abbasîlere kadar olan dönemde kamu düzeni anlayışı tespit edilmeye çalışılmış ve ardından İslam hukuk literatüründe bu kavramla bağlantılı olan kurum (hisbe ve şurta teşkilatı, Hacc emirliği) ve kavramlar, tarihi örnekleriyle birlikte ele alınmıştır. İkinci bölümde ise Mihne sürecinin tarihi arka planı hakkında kısaca bilgi verilmiş ve bu süreçte etkili olan bir takım yönetici, kadı, fakih ve toplumun ileri gelenlerinin biyografilerine yer verilmiştir. Ardından halku'l-Kur'ân meselesinin siyasal bir araç hâline getirilmesi ve yargılamalardaki rolü incelenmiştir. Sonuç kısmında da genel bir değerlendirme yapılmıştır."
