abstract: "Bu çalışma, gıda endüstrisinde yaygın şekilde kullanılan hayvansal kökenli katkı maddeleri olan karmin (E120) ve şellak (E904) maddelerinin İslâm hukuku açısından değerlendirilmesini konu edinmektedir. Günümüzde katkı maddeleri; estetik, koruyuculuk ve teknolojik işlevleriyle tüketici tercihlerini şekillendirmektedir. Doğal renklendirici olan karmin, Dactylopius Coccus adlı koşinil böceğinden; şellak ise Kerria Lacca böceğinin salgısından elde edilmektedir. Böcek kökenli bu maddeler helallik tartışmalarına konu olmakta; özellikle gıda, kozmetik ve ilaç sanayisinde yaygın kullanım alanı bulmaktadır. Çalışmada bu katkı maddelerinin üretim süreçleri, işlevleri ve kullanım biçimleri ele alınarak İslâm hukukunun temel ilkeleri çerçevesinde fıkhî değerlendirmeleri yapılmaktadır. Fıkhi açıdan böceklerin tüketimi konusundaki görüşler karşılaştırılarak tartışmaya zemin hazırlanmıştır. Ayrıca helâl sertifikasyon süreçleri, özellikle SMIIC ve TSE standartları kapsamında ele alınarak çeşitli ülkelerdeki güncel fetvalar analiz edilmiştir. Araştırmada karma yöntem benimsenmiş, nitel veri olarak klasik fıkıh literatürü ve ilmî görüşler; nicel veri olarak ise katkı maddelerine dair bilimsel içerikler, standart verileri ve tablolar değerlendirilmiştir. Bu yönüyle çalışma hem fıkhî yaklaşımları hem de üretim koşullarını dikkate alarak katkı maddelerinin hükmünü ele almayı amaçlamaktadır. Elde edilen bulgular söz konusu katkı maddelerinin fıkhî hükmünün, yalnızca kökenine değil kullanım amacı, üretim şekli, örf ve sağlık riski gibi farklı ölçütlere göre değerlendirilmesi gerektiğini göstermektedir."
