abstract: "Bu çalışma, kara para aklamayla mücadelede bütüncül, tutarlı ve kapsamlı bir çerçeve sunan İslami sistem ve tecrübe ile bu alandaki küresel tecrübenin birleştirilmesiyle mümkün olabilecek kara paranın aklanmasının önlenmesi konusunda yeni bir etik çerçeve sunmaktadır. Günümüzde kara para aklama ile mücadele yoluyla suçlara karşı birçok standart ve birim bulunmasına rağmen, bu mücadele insanoğlunun ve etik sisteminin varoluşsal gerçekliği ile tam olarak bütünleşmiş değildir. Çağdaş dünya, kara para aklamaya karşı mücadele bağlamında, iyi ve kötünün yalnızca özgün bir etkisi olmayan duygular olup olmadığı veya temel bir gerçekliğe güçlü bir şekilde bağlı olup olmadığı konusunda pek bir şey söylememektedir. Bunun doğal bir sonucu olarak, günümüzdeki kara paranın aklanmasının önlenmesi faaliyetleri, kolluk kuvvetleri ve istihbarat faaliyetleri ile sınırlıdır; bu yapı ise ekonomi politikaları, ahlak öğretimi, akademik çalışmalar gibi hayatın tüm alanlarını ilgilendiren alanlardaki araçlar kullanılarak aklama ve dolayısıyla suçla mücadele açısından bütüncül bir çerçeve sunamamaktadır. Bu çalışma, İslam'ın kara para aklamayla mücadele için entelektüel, ekonomik, finansal, etik ve diğer ilgili alanları bütünleştiren ve insanın orijinal ve ontolojik gerçekliğine dayanan bir çerçeve sağladığını göstermektedir. Bu amaçla, çalışma kapsamında, ikinci literatür irdelenmiş, kara para aklama ile mücadele alanıyla ilgili yetkililerle yapılan anket değerlendirilmiş, günümüzdeki kara para aklama ile mücadele çerçevesi ile İslami etik sistemi arasında bir boşluk analizi yapılmış, hem İslam İşbirliği Teşkilatı (İİT) ülkeleri hem de diğer ülkelerin kara para aklama ile mücadelede daha üst seviyeye ulaşma konusunda birbirlerini destekleyebilecekleri potansiyel iyileştirme alanları belirlenmiştir. Bu analizlere dayanarak, çalışma kara para aklamaya karşı mücadelede yeni bir etik çerçeve önermekte ve İİT ülkelerinin ve diğer ülkelerin birbirlerinden ve İslam'ın temel öğretilerinden öğrenecekleri çok şey olduğu sonucuna varmaktadır."
