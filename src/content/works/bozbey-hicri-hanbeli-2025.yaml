abstract: "Ahmed b. Hanbel, hayatı boyunca fıkha dair görüş ve fetvalarının yazıya geçirilmemesine özen göstermiştir. Ancak sağlığında kendisine sorulan sorulara verdiği cevapların kendi içerisinde tutarlı bir yapı arz etmesi, onun usûle dair belirli görüşlere sahip olduğunu ortaya koymaktadır. Hanbelî alimler Ahmed b. Hanbel'in vefatının ardından ilk olarak onun görüş ve fetvalarını derleme çabası içerisine girmişlerdir. Bununla birlikte, sistematik bir fıkıh usûlü eseri ancak hicrî V. yüzyılda Ebû Yâ´lâ el-Ferrâ tarafından kaleme alınmıştır. Ferrâ'nın yazdığı el-Udde fî Usûli'l-fıkh adlı eserinin kaynakları incelendiğinde, müellifin bu eseri te´lîf etmeden önce Cessâs'ın el-Fusûl fî'l-usûl'ünü, Ebû'l-Hüseyin el-Basrî'nin el-Mu´temed fî Usûli'l-fıkh'ını ve Bâkıllânî'nin et-Takrîb ve'l-İrşâd fî Usûli'l-Fıkh adlı eserini mütalaa ettiği anlaşılmaktadır. Ferrâ'nın el-Udde'de Ebû'l-Hüseyin el-Basrî'ye yalnızca bir yerde doğrudan atıfta bulunmakla birlikte birçok meselede ondan istifade ettiği açıkça görülmektedir. Ayrıca söz konusu eserin sistematik yapısı bakımından da Basrî'nin el-Mu´temed'ine büyük ölçüde benzediği gözlemlenmektedir. Hanbelî usûl literatürü açısından bir diğer önemli isim olan Ebû'l-Hattâb el-Kelvezânî'nin et-Temhîd fî Usûli'l-fıkh'ında da hocası Ebû Yâ´lâ el-Ferrâ'nın el-Udde adlı eserinin yanı sıra, Basrî'nin el-Mu´temed'inden sistematik ve muhteva açısından doğrudan ve dolaylı birçok biçimde yararlandığı görülmektedir. Ferrâ'nın bir diğer öğrencisi olan Ebû'l-Vefâ İbn Akîl de Mu´tezile'ye yakınlığı ile tanınmaktadır. Bu çalışmada Hanbelî fıkıh usûlünü sistematik bir yapıya kavuşturan Ebû Yâ´lâ el-Ferrâ ile öğrencileri Ebû'l-Hattâb el-Kelvezânî ve Ebû'l-Vefâ İbn Akîl ile Mû´tezilî alim Ebû'l-Hüseyin el-Basrî'nin hayatları ve eserleri hakkında bilgi verilmiş; müelliflerin el-Udde fî Usûli'l-fıkh, et-Temhîd fî Usûli'l-fıkh ve el-Vâzıh fî Usûli'l-fıkh ile el-Mu´temed fî Usûli'l-Fıkh isimli eserlerinde benimsedikleri sistematik yapı incelenip kıyas bağlamında usûl görüşleri ortaya konularak Basrî'nin Ferrâ, Kelvezânî ve İbn Akîl üzerindeki etkileri ortaya konulmuştur."
