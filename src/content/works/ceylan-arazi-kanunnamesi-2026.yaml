abstract: "İslam hukukuna göre araziler beş kısımdır: Bunlar; arazi-i memluke, arazi-i metruke, arazi-i miriyye, arazi-i mevkufe ve arazi-i mevâttır.“Mevât arazi”, kimsenin tasarruf ve mülkiyetinde olmayan, insanlara terk ve tahsis olunmayan, yerleşim yerlerine uzakta bulunan ve zirai olarak faydalanma imkânı bulunmayan arazidir. Mevât arazi“tahcir”ve“ihya”ya konu edilebilir.“Tahcir”arazinin etrafına taş dizmek ve dikenlerini yakmak gibi işlemleri, ihya ise toprağı ziraate elverişli hâle getirebilecek sürme, taraçalama ve sulama gibi işlemleri ifade eder. İmam Ebu Hanife'ye göre ihya için izin gerekir, İmam Muhammed ve İmam Ebu Yusuf'a göre gerekmez. İzin kullanıma veya mülkiyetin kazanılmasına yönelik olarak verilebilir. İmam Ebu Yusuf'a göre yerleşim yerlerine yakın yerler mevât arazi sayılmaz ve ihyasına izin verilmez. İmam Muhammed ise uzaklık şartını gerekli görmez. Ayet, hadis, sahabe uygulaması ve hukukçuların içtihatlarından hareketle; ölü bir araziyi imar ve ihya etmenin insanlara naslarda tavsiye edildiği ve bu tavsiyenin fıtri, iktisadi ve içtimai dayanaklarının bulunduğu sonucuna varılmaktadır. Bu kurumun tanınmasının istihdamın artması ve tarım ürünlerinden istifade edilmesi gibi maslahatlara dayandığı ve ihyayı gerçekleştiren kişinin Allah'tan sevap kazanacağının umulduğu anlaşılmaktadır. Asliye hukuk mahkemelerinde görülen ihyaya dayalı davaların tarihi arka planının araştırılması kapsamında, müessesenin Cumhuriyet devrinden önce Osmanlı Devleti'nde bilindiği ve bugünküne benzer bir biçimde uygulandığı medeni hukuk kitaplarındaki açıklamalardan çıkarılabilmektedir. Türk Hukuk Tarihi eserleri, Arazi Kanunnamesi ve Mecelle metinleri ile bunların şerhlerine bakıldığında, ilişkili kanun maddelerinin Hanefi fıkhından alınarak kodifiye edildiği anlaşılmıştır. Arazi Kanunnamesi'nden önce konuyla ilgili dağınık hükümler bazı derlemelerde yer alsa da Arazi Kanunnamesi bu müesseseyi teknik olarak ayrı bir başlık içinde hükme bağlamıştır. Mecelle ve diğer özel kanuni 479 düzenlemelerden Türkiye Cumhuriyeti döneminde kabul edilen TMK ve Kadastro Kanunu'na kadar konu hakkında birçok düzenleme çıkarılmıştır. 1858 Arazi Kanunnamesi'nden yeni TMK'ya kadar; imar ve ihyanın Osmanlı mevzuatında ve Türkiye Cumhuriyeti'nde düzenlenme şekli ve şartları, arazi ihtilaflarında Osmanlı Devleti'nde verilen kararlar ve fetvalar, Cumhuriyet döneminde Yargıtay'ca verilen kararlar, imar ve ihya yoluyla arazi iktisabına ilişkin uygulamada ortaya çıkan yeni ihtiyaçlar ve yapılan değişiklikleri sebep ve sonuçlarıyla birlikte incelendiğinde; Türk Hukuk Tarihi'nde imar ve ihya müessesesinin temel hukuki normlar çerçevesinde birçok benzerlik taşıdığı anlaşılmaktadır. İmar ve ihya konusunda Cumhuriyet dönemi öncesiyle sonrası arasında bazı önemli farklılıklar da vardır. Şöyle ki; yapı inşa etme Arazi Kanunnamesi'ne göre ihya iken, bugünkü hukukumuzda sahipsiz arazilere yapı inşa etmek Yargıtay tarafından ihya olarak kabul edilmemektedir. İslam hukukunda araziye ihya yoluyla kısa sürede sahip olunabilirken, günümüzde ihya tamamlandıktan sonra yirmi yıl kesintisiz fiili tasarruf durumunda mülkiyet kazanılabilmektedir. İslam hukukunda suya ulaşan kuyu kazmak, fidan dikmek, set yapmak ihya iken günümüz hukukunda bu işlemler ihya sayılmaz."
