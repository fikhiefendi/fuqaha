abstract: "Modern anlamda 1960'lı yıllarda ilk bankacılık faaliyetleri ile gelişmeye başlayan İslami finans özellikle 2000'li yıllarda hızlı bir büyüme yaşamıştır. İslami finans yapısının 2008 yılındaki finansal krize karşı göstermiş olduğu dayanıklılık, uluslararası piyasalarda dikkatleri üzerine çekmiş ve İslami finans ürünlerine olan güveni arttırmıştır. İslami finans ürünü olan sukuk, dünyada ilk kez Müslüman ülkelerde ticari faaliyetlerde kullanılmak üzere ortaya çıkmıştır. Günümüzde ise herhangi bir varlığa dayalı ve bu varlığın değeri ile orantılı olarak çıkarılan ve alıcısına kar payı ve mülkiyet hakkı sunan bir menkul kıymete dönüşmüştür. Türkiye'de kira sertifikası olarak tanınan sukuk, diğer yatırım araçlarından farklı olarak temelinde faiz bulundurmamakta ve bir varlığa dayalı olarak çıkartılmaktadır. Bu çalışmada, faizsiz yatırım aracı olan kamu ve özel sektör kira sertifikası (sukuk) endeksi getirileri ile faizsiz yatırım aracı olan gram altın, dolar ve euro getirileri arasındaki ilişki Granger nedensellik analizine göre ekonometrik olarak incelenmiştir. Birden fazla farklı türde faizsiz yatırım araçları bulunmaktadır. Ancak Gram altın, uds/try ve eur/try çalışmaya dahil edilmiştir. Analiz sonucunda kamu kira sertifikası endeksi ile dolar arasında tek yönlü Granger nedensellik ilişkisi tespit edilmiştir. Kamu kira sertifikası ile gram altın ve Euro arasında ise herhangi bir Granger nedensellik ilişkisi tespit edilememiştir. Benzer şekilde özel sektör kira sertifikası endeksi ile faizsiz yatırım araçları arasında da Granger nedensellik ilişkisi bulunmamaktadır."
