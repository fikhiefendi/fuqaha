abstract: "Dinî yönden bilgilendirme ve bilinçlendirme yollarından biri olan ve her hafta düzenli bir şekilde irat edilen Cuma hutbesi, toplumu bilinçlendirmenin yanı sıra Cuma namazının ayrılmaz bir parçası olarak telakki edilmiştir. Nübüvvet asrından uzaklaştıkça diğer meselelerde olduğu gibi hutbe meselesinde de bazı sorular gündeme gelmiştir. Dolayısıyla ilgili konu hakkında detaylı bilgilere yer vermek ve İslâm toplumunda uygulanış amacının esaslarına işaret etmek oldukça önemlidir. Ayrıca Hanefîlerin görüş ve fetvalarında hadis ve sünnetten istifade etme düzeyi zaman zaman tartışma konusu olmuştur. Elinizdeki çalışmada, bu tartışmalara bir nebze de olsa ışık tutması amacıyla Hanefî mezhebinin ve kısmen de olsa diğer mezheplerin Cuma hutbesi hakkındaki görüşleri ve bu görüşlerinde dayanmış oldukları hadisler tespit edilmeye çalışılmıştır. Çalışma bir giriş ve iki bölümden oluşmaktadır. Giriş kısmında çalışmanın konusuna, amacına, önemine ve izlenilen yönteme vb. temas edilmiştir. Birinci bölümde hutbe ile ilgili genel bilgilere yer verilip Hanefîlerin Cuma hutbesi hakkındaki görüşlerine ve bu görüşlerinde dayandıkları hadislere değinilmiştir. İkinci bölümde ise çalışmayla ilgili hadislerin orijinal metinleri ve bu metinlerin tahriçleri yapılmıştır."
