abstract: "Siyâset-i şer'iyye kamu hizmeti sahasında, dinin genel prensiplerine ters düşmeyecek düzenlemeler ve bu alanda uygulamalar yapmaktadır. Siyâset-i şer'iyyenin adaletin gerçekleştirilmesi, haksızlığı yapanın yanına bırakılmaması, hakkın hak sahibine ulaştırılması, kimsenin haksızlığa uğratılmaması ve kamu yararının sağlanması şeklinde öneminden kısaca bahsedebiliriz. Siyâset-i şer'iyye, şer'in doğrudan düzenlenemediği mevzuları bir forma ve belli bir kaide içerisine koyar. Şer 'î hükümleri onun nihai sınırlarını belirler ve denetler. Memlüklerin hâkim olduğu topraklarda Trablusşam'da doğan Alâeddin Trablusî'nin siyâset-i şer'iyye alanında telif ettiği Muînü'l-Hükkâm adlı eseri bu alanda büyük bir ihtiyacı gidermiştir. Nitekim eser; zina, cinayet, hırsızlık, irtidât gibi hakkında hüküm belirlenmeyen suçların cezalarını siyâset-i şer'iyye açısından ele almıştır. Bununla beraber Trablusî, bu çalışmada kendisinden önce siyaset-i şer'iyye alanında ele alınmayan meseleleri inceleme konusu yapmış ve bu hususlarda içtihadlar ortaya koymuştur. Eserde aynı zamanda siyaset-fıkıh ilişkisinin değişik alanlardaki yansımalarını ele alınırken, siyâset-i şer'iyyeye karşı çıkan muhaliflere yönelik reddiyeler yapılmış ve Kur'an ve Sünnet'ten hareket bu anlayışın gerekliliğine yönelik istidlallerde bulunulmuştur. Bu nedenle Trablusî'nin Muînu'l-Hükkâm adlı eserinin siyâset-i şer'iyye açısından ele alınmasını gerekli görerek bu çalışmayı hazırladık."
