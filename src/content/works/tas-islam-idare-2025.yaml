abstract: "Bu çalışma, İslam hukuku ve İslam idare hukuku çerçevesinde amir-memur ilişkisini uygun bir yaklaşımla ele almıştır. Temel kaynaklar olan Kur'an-ı Kerîm, Sünnet, icmâ ve kıyas doğrultusunda şekillenen idare anlayışı, hem bireysel sorumluluğu hem de kurumsal disiplini esas alan bir yönetim modeli ortaya koymuştur. Hz. Peygamber'in Medine Dönemi'ndeki kamu yönetimi uygulamaları ile Hulefâ-i Râşidîn dönemindeki devlet teşkilatlanmaları, amir-memur ilişkisinin ahlâkî, hukuki ve yönetsel temellerini oluşturmuştur. Bu bağlamda, adalet, ehliyet, liyakat, emaneti koruma ve kamu yararı gibi kavramlar yönetsel etik ilkelerle birlikte değerlendirilmiştir. Çalışmada, amirin yetki kullanımı ile memurun itaati arasındaki sınırların fıkhî ve idari temelleri ortaya konmuş; özellikle“Allah'a, Peygamber'e ve sizden olan yöneticilere itaat edin”(en-Nisâ, 4/59) ayeti bağlamında meşru emir ve itaate dair kriterler analiz edilmiştir. Emirlerin hukuki geçerliliği, haksız emir karşısında direnme hakkı, kamu görevlilerinin görev tanımı, disiplin esasları ve hesap verebilirlik anlayışı ayrıntılı biçimde incelenmiştir. Ayrıca İslam hukukçularının bu konudaki görüşlerine yer verilerek klasik dönem yaklaşımları ile modern kamu hukuku normları mukayeseli olarak değerlendirilmiştir. Modern hukuk sistemlerinde yer alan idari yargı mekanizmaları, kamu hizmeti etiği ilkeleri, 657 sayılı Devlet Memurları Kanunu ve güncel kamu yönetimi teorileri ile İslam hukukunun temel ilkeleri arasında karşılaştırmalar yapılmıştır."
