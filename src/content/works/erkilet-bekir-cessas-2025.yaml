abstract: "Fıkıh usulü, ortaya çıkışından itibaren birçok tartışmaya sahne olmuş ve özellikle elfaz bahisleri fakihler arasında geniş çaplı ihtilaflara neden olmuştur. Âm, hâs ve tahsis meseleleri bu tartışmaların merkezinde yer almış, farklı ekollerin yaklaşımları usul düşüncesinin gelişiminde belirleyici rol oynamıştır. Hanefî ekolünün Irak'taki en önemli temsilcilerinden biri olan Ebû Bekir el-Cessâs, söz konusu tartışmaları ele alırken yalnızca teorik değerlendirmelerle yetinmemiş, aynı zamanda muhalif görüşlere de cevap vermiş ve meseleleri adeta bir münazara üslubuyla tartışmıştır. Özellikle am lafzın delaleti, tahsisi ve tahsis için öne sürdüğü şartlar, onun usule katkılarının merkezinde yer almaktadır. Bu çalışmada öncelikle Ebû Bekir el-Cessâs'ın el-Fusûl fi'l-Usûl adlı eserinde ele aldığı âm ve tahsis konularına dair yaklaşımı ayrıntılı bir şekilde incelenmektedir. Cessâs'ın âm lafzın delaleti, bu delaletin hangi boyutlarda kesinlik ifade ettiği, tahsisin hangi durumlarda gerçekleşebileceği ve tahsisin geçerli olabilmesi için hangi şartların aranması gerektiği hususundaki görüşleri tespit edilmekte; bu görüşlerin onun usul düşüncesindeki yeri ortaya konulmaktadır. Daha sonra, bu usulî çerçevenin furû fıkıh alanında nasıl yansıma bulduğu, Cessâs'ın özellikle Ahkâmü'l-Kur'ân ve Şerhu Muhtasari't-Tahâvî adlı eserlerindeki yorumları üzerinden ele alınmaktadır. Böylelikle, Cessâs'ın usulde belirlediği ilkeleri furû meselelerde ne ölçüde tatbik ettiği, ortaya koyduğu şartlara sadık kalıp kalmadığı ve kendi usûli çizgisinde istikrarlı bir tutarlılık gösterip göstermediği sorgulanmaktadır. Bu inceleme sayesinde, Cessâs'ın usul-furû bütünlüğünü sağlayabilme konusundaki başarısı tespit edilmeye çalışılmakta; onun yaklaşımının yalnızca teorik tartışmalarla sınırlı kalmayıp, aynı zamanda furû fıkhın pratik meselelerinde de nasıl bir etki doğurduğu analiz edilmektedir. Neticede, araştırma Cessâs'ın tahsis anlayışının fıkıh usulü ile furû fıkıh arasındaki ilişkinin mahiyetine nasıl ışık tuttuğunu, bu iki alan arasında kurduğu bağın sağlamlığını ve katkı düzeyini ortaya koymayı hedeflemektedir. Böylelikle hem Cessâs'ın usulî katkılarının değeri hem de genel olarak fıkıh usulü ile furû fıkıh arasındaki ilişkinin doğası daha anlaşılır hale getirilmektedir."
