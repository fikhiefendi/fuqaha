abstract: "Toplumu oluşturan ana unsurlardan biri olan kadının sosyal hayattaki rolü ve konumu insanlık tarihi boyunca tartışma konusu olagelmiştir. İslâm hukuku kendi açısından bu konuda gerekli düzenlemeleri yapmasına rağmen günümüzde bu tartışma farklı şekillerde devam etmektedir. Sosyal hayatta ve beşeri ilişkilerde kadının erkek ile eşit sayılması ve bunun sınırının belirlenmesinde henüz ortak bir kanaat oluşmamıştır. Kadının hakları konusu ve kuralların çatışması hala devam etmektedir. İslâm dininin ön gördüğü kadının hak ve özgürlükleri, özellikle cezâ hukuku, miras hukuku, kadının şahitliği ve kadın erkek eşitliği gibi hususlarda tartışma konusu yapılmaktadır. Çalışmamız da“İslâm Cezâ Hukukunda Kadın-Erkek Eşitliği ve Şiddet”başlıkları altında İslâm hukuku ve modern hukuk açısından kadının hakları, kadına şiddet, kadının mirası ve şahitliği, İslâm ile feminizm ve İstanbul Sözleşmesi konularını ele alacağız. Tezimiz giriş, 3 bölümle sonuçtan oluşmaktadır. İlk bölümde İslâm cezâ hukukunun tanımı, tarihçesiyle günümüz hukuklarıyla karşılaştırılması ele alınmıştır. İkinci bölümde suç, cezâ ve şiddet kavramlarına değinilmiş, bu kavramların tanımı, taksimi, İslâm hukuku ve günümüz hukuk perspektifinde açıklanmıştır. Üçüncü bölüm de ise tarihten günümüze kadının toplum içindeki konumu, İslâm hukukunda ve modern hukukta kadın erkek eşitliği, kadının mirası ve şahitliği dile getirilmiştir. Bu bağlamda feminizm, İstanbul sözleşmesi ve kadının beyanı konuları da işlenmiştir. Sonuç bölümünde de konu ile ilgili değerlendirmede bulunulmuştur."
