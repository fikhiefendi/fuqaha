abstract: "Bu çalışmada eski Türk ailesini, Evlenme geleneklerini ve Aile hukuku ilişkilerini incelemeye çalışacağız. XIV. yüzyılın ilk yarısına kadar incelediğimiz Türk ailesinde, destanlar, yazıtlar, seyahatnameler ve araştırmacıların eserlerinden faydalandık. Araştırmamızın sonucunda, eski Türk ailesi çekirdek aile tipinde idi. Kan akrabalığı esasına dayanan Türk ailesinde, dıştan evlenme esastı. Türk toplumunda, umumiyetle tek eşlilik görülürdü. Leviratus adı verilen ölen kardeşin dul kalan eşi ile evlenilirdi.Evlenmek için belli bir yaş şartı yoktur. Evlenme aracılar vasıtasıyla olurdu. Kızın velisi, olumlu cevap verirse, kalının (başlık) miktarı tespit edilir. Kalın tespiti sonrasında gençler sözlenip, nişanlanmış sayılır. Nişanlılık devrinde güvey (damat) nişanlısını sık sık ziyaret eder. Fakat kalın tamamen ödenmedikçe düğün yapılmazdı.Düğün sonrasında kadın gerek evde gerekse sosyal hayatta büyük ölçüde erkekle eşittir. Her Türk Devletinde devletin başı olan hakan, eşi hatunla birlikte devleti yönetmiştir. Türk devletlerinin mayası birleşen ve büyüyen tecrübeli Türk ailelerine dayanıyordu. Kınık, Kayı, Bayındır gibi boylar bunun canlı misalleridir. Türk aile düzeni adeta bir `aile sigortası' halinde kurulmuş ve herkesin hayatı güvenlik altına alınmıştı.Türk ailesi hukuk alanında İslâmiyet'ten önce töreye göre hareket etmiştir. Prensip olarak bütün çocukların ana ve babalarının mirasında hissesi vardır İslamiyet'in kabulüyle hem töre hem de İslam hukuku, Türklerin hayatında önemli bir rol oynamıştır."
