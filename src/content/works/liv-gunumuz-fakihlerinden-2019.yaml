abstract: "Mehmet Savaş, son zamanlarda ülkemizin İslami ilimler alanında yetişmiş en önemli ilim adamlarından biridir. Başta fıkıh olmak üzere, birçok İslami ilim alanında kendini geliştirmiş ve bu alanlarda söz sahibi olacak donanıma sahip olmuştur. Suriye'de aldığı klasik medrese eğitimi ve ilahiyat fakültesi eğitiminden sonra Türkiye'ye dönerek Diyanet İşleri Başkanlığı Haseki Eğitim Merkezinde fıkıh hocası olarak göreve başlamıştır. Halen emekli eğitim görevlisi vasfıyla derslere devam ettiği bu kurumda yüzlerce vaiz, müftü ve akademisyen yetiştirmiştir.“Hocaların hocası”olarak anılan Mehmet Savaş Türkiye'de fıkıh alanında otorite kabul edilmiştir. Bu çalışmada, ülkemizin önemli değerlerinden olan Mehmet Savaş'ı tanıtmak, fıkıh anlayışını tespit etmek ve sahip olduğu birikimin örnek olabilecek bir kısmını sonraki nesillere aktarmak hedeflenmiştir."
