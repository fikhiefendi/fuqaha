abstract: "Namaz, Müslümanların hayatında önemli bir yere sahiptir. Kur'an-ı Kerim'de defalarca emredilen namazın nasıl kılınacağıyla ilgili ayrıntılar Hz. Peygamber'in sünnetiyle öğrenilmektedir. Namazın kılınışı ana hatlarıyla dört mezhepte de aynı olmakla birlikte mezheplerin namazın rükünleri dışında kalan fiillerle ilgili farklı uygulamaları mevcuttur. Bu uygulama farklılıkları mezheplerin kullandıkları delillerin ve bu delillerden hüküm çıkarmada takip ettikleri yöntemlerin farklı olmasından kaynaklanmaktadır. Mezheplerin bu tür ihtilafları bir görüş zenginliği olarak değerlendirilmelidir.Uygulama ve delilleri açısından dört mezhebe göre namazda ellerin durumunu ele aldığımız bu çalışma, namazda ellerin kaldırılması ve kıyam, rükû, secde ve teşehhüdde ellerin durumu ile ilgili hükümleri içermektedir."
