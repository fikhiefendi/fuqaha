abstract: "ÖZET“İlk Hanefi Hukukçularının Usûl Anlayışı”, ismini taşıyan bu çalışma, giriş ve iki ana bölüm ve de sonuç bölümünden oluşmaktadır. Giriş bölümünde, ilk Hanefi hukukçularının, mezhebin usûlünün oluşumundaki katkıları ve önemleri anlatılmış, çalışmada takip edilen metot ve yararlanılan kaynaklar hakkında bilgi verilmiştir. Çalışmanın konusu olan ilk Hanefî hukukçularının yaşadığı dönemlerde fakihler, delillerden hüküm çıkarmada takip ettikleri metodu yazmaya henüz başlamamışlardı. Onların usûlünü öğrenmenin yolu ise, fu'û konuları hakkında yazdıkları kitapları inceleyip, meseleleri çözmede kullandıkları delilleri ve içtihad usûllerini bu kitaplardan çıkarmaktır. Hilaf tekniği ile yazılmış olan yani kendi mezhep görüşlerini müdafa edip, dayandığı gerekçeleri de bildiren kitaplar da, onların usûllerini öğrenmede en uygun kitaplardır. Birinci bölümde, Hanefi Mezhebinin kurulduğu Irak bölgesindeki ilmî, siyasî ve sosyal hayatın seyri hakkında bilgi verilmiştir. Hanefi hukukçularının usûllerinin oluşumunda, kurulduğu bölgenin etkisine işaret edilmiştir. Irak bölgesi birçok farklı kültür ve medeniyetin doğduğu, farklı sosyal grupların bulunduğu, fikrî hareketlerin yoğunlaştığı bir merkezdi. Bu sebeplerden dolayı birçok uydurma hadis ortaya çıkmaya veya sahih hadisler kabul edilmemeye başlamıştı. Bunlar da, hadisleri kabulde ihtiyatlı olmayı ve re' yi bir kaynak olarak kullanmayı gerekli kılıyordu. İkinci bölümde, Ebu Hanife ve öğrencilerinin hüküm çıkarmada kullandığı kaynaklar tek tek ele alınmıştır. Bunların anlamları ve içeriği, Ebu Yusuf un kitaplarından örnekler verilerek incelenmiştir. Onlar hüküm istinbatında sırasıyla kitap, sünnet, sahabe ve tabiûn kavli, icma, kıyas, istihsan ve örf delillerini bazı ilke ve öncelikleri gözeterek kullanmışlardır. Böylece Hanefî fıkhında belirli bir usûl ve anlayışın hakim olmasını sağlamışlardır. Çalışmada elde edilen verilen ise sonuç bölümünde sunulmuş ve genel bir değerlendirme yapılmıştır."
