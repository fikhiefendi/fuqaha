abstract: "SLAM MUHAKEME HUKUKUNDAŞAH TL KTEN DÖNMEN N KARARLARA ETK SCemil L VŞahitlikten rücÃ», mahkeme kararı öncesi, karar sonrası ve ceza infazı sonrasıolmak üzere üç şekilde meydana gelebilir.Mahkeme kararı öncesi meydana gelen rücÃ»da delil ortadan kalktığı için davadüşecektir.Mahkeme kararı sonrası ceza infazı öncesi şahitlerin beyanlarından dönmeleridikkate alınacak ve davanın sonucunu etkileyecektir. Dava konusu had ve kısasgerektiren suçlarla ilgili ise, şahitlerin rücÃ»ları şüphe oluşturduğu için ceza düşecektir.Dava konusu muamelatla ilgili ise mahkeme kararı bozulmaz. Davacının aldığı malı iadeetmesi gerekir.Ceza infazı sonrasında şahitler beyanlarından dönmelerinde ise, yargılama sürecişahitlerin ifadeleri doğrultusunda sona erdirilmiş, hâkim kararını vermiştir. Kesinkarar neticesinde verilen ceza infaz edilmiş ve yargılama süreci tamamensonuçlanmıştır. Bu andan itibaren dâvada şahitlikte bulunan şahısların beyanlarındanrücÃ» etmelerinin, yalan yere şahitlik yaptıklarını söylemelerinin sonuçlanmış olandavaya hiçbir etkisi olmayacaktır."
