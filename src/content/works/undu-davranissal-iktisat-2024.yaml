abstract: "Bu çalışmanın amacı, İslami finansal okuryazarlığın davranışsal iktisat teorileriyle ilişkilendirilmesi ve bu ilişkinin finansal kararlar üzerindeki etkilerinin araştırılmasıdır. Araştırma, nicel yöntemler arasında yer alan tarama deseni kullanılarak gerçekleştirilmiştir. Altundere Doğan (2020)“İslami Finans Okuryazarlığı Ölçeği”ile Falk (2018) özgeci davranışları ölçtüğü“Global Evidence on Economic Preferences”adlı küresel anketi ve Kamu Malı Oyunu stratejisinden türetilen sorular Aydın ilinde yaşayan 18 yaş üzeri 410 katılımcıya uygulanmıştır. Bu çalışmada, katılımcıların İslami finansal okuryazarlığı ve İslami finansal okuryazarlık düzeyi ile özgecilik davranışı arasındaki ilişkiyi tespit etmek amaçlanmış; ancak katılımcıların İslami finansal okuryazarlıklarının düşük olduğu ve özgecilik düzeylerinin İslami finans okuryazarlıkları üzerinde bir etkisinin olmadığı belirlenmiştir. Buna karşılık, katılımcıların gelir düzeyleri ile İslami finansal okuryazarlıkları arasında anlamlı bir ilişki olduğu tespit edilmiştir. Araştırma sonucunda, katılımcıların İslami finansal ürünlerin benimsenmesini ve kullanımını teşvik eden stratejilere dair öneriler sunulmuştur. Bu çalışmanın, hem akademik alanda hem de İslami finans sektöründe bilgi birikimine katkı sağlayacağı düşünülmektedir."
