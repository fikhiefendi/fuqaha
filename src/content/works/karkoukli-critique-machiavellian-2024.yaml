abstract: "İdeolojiler, ekonomik sistemler ve etik çerçeveler arasındaki karmaşık etkileşimde, Makyavelist zihniyet ile kapitalist üretimin birleşimi eleştirel bir incelemeyi gerektirir. Bu tez, kuruluşların sorumluluklarına bağlılıklarının düzeyine dayalı olarak şirketlerin etkisini, çeşitli alanları etkileyebilecek“kurumsal sosyal sorumsuzluğun”sonuçlarını, bunun işleyiş şeklini ve esas alınışını ve şirketlerin hesap vermeden planlarını uygulamalarına olanak tanıyan teşvik edici faktörleri araştırmaktadır. Tez, şirketlerin ideolojilerini temsil edebilir olay orneklerini tanıtarak, kapitalist üretimin Makyavelist kökenlerini aydınlatmakta ve İslami iktisadî doktrin çerçevesinde daha iyi bir etik arka plan çerçevesi için çözümler önermektedir. Tarihsel metinlerden, İktisat çalışmalarından, bildirilen olaylardan, Machiavelli'nin yazılarından yararlanarak, kapitalist üretimde şirketlerin sorumsuzluğunun sonuçlarını araştırmakta ve İslam kutsal metinlerinden faydalanarak eleştirel bir analiz sunmaktadır. Bu çalışma kâr maksimizasyonunun, pazar hâkimiyetinin ve stratejik düşüncenin çeşitli yaşam alanlarını nasıl etkileyebileceğini inceleyerek, İslami iktisadî etik anlayışı, şirketleri değerlendirmek için alternatif bir bakış açısı olarak sunar. Makyavelist zihniyeti ve iktisadî doktriner yaklaşımların etik boyutunu topluca incelemesiyle, bu çalışma iktisadî sistemlerde etik ihlallerin ve farklı üretim yaklaşımlarının karşılaştığı zorlukları anlamayı hedeflemektedir. Ayrıca, daha adil ve sürdürülebilir bir ekonomik yönetim için etik bir çerçeve oluşturmayı hedefleyen öneriler sunmaktadır. Bu bağlamda, şirketlerin kapitalist üretimdeki rolü incelenirken, etik ihlaller ve farklı üretim yaklaşımlarından kaynaklanan zorluklarla yüzleşen ekonomik sistemlerin doğru bir şekilde anlaşılması hedeflenmektedir. Ayrıca, daha adil ve sürdürülebilir bir ekonomik yapıya ulaşmayı amaçlayan yapıcı tartışmalara katılımı teşvik etmektedir. Etik bir çerçeveye erişmeyi hedefleyen pozitif üretim sonuçlarına ulaşan daha adil ve sürdürülebilir alternatifler araştırmaktadır. Bu çalışmanın, ekonomik sistemlerin doğru bir şekilde anlaşılmasına yönelik katkı sağlaması ve etik ihlallerin ele alınması için yapılan yapıcı tartışmaların artırılmasına yardımcı olması beklenmektedir."
