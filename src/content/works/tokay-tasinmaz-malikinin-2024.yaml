abstract: "Bu çalışmanın amacı TMK m.738'de düzenlenen komşuluk hukuku sınırlamalarından olan kazı ve yapılarla komşu taşınmaza zarar verilmemesi yükümlülüğünü, hüküm içerisinde taşkın yapılara ilişkin yapılan atfı ve yükümlülüğe aykırı davranılması halinde TMK m.730'da düzenlenen sorumluluğu tüm hatlarıyla incelemektir. Komşuluk hukuku sınırlaması olarak düzenlenen TMK m.738 hükmü, mülkiyet hakkına komşuluk hukukundan kaynaklanan bir sınırlama olması sebebiyle; çalışmanın ilk bölümünde Türk Hukukunda mülkiyetin ve sınırlamalarının düzenleniş şekli, taşınmaz malikinin bu sınırlamalara aykırılık halinde doğan sorumluluğunun hukuki niteliği ve sorumluluğun benzer kurumlarla ilişkisi değerlendirilmiştir. Çalışmanın ikinci bölümünde ise taşınmaz malikinin kazı ve yapı faaliyetlerinden doğan sorumluluğun şartları, hukuka aykırı kazı ve yapı faaliyetlerinde sorumluluğun şartları ve yerel âdete uygun kazı ve yapı çalışmalarında sorumluluğun şartları olarak iki kısım halinde incelenmiştir. Çalışmanın son bölümünde ise kazı ve yapı faaliyetleri kaynaklı zarar gören komşuların sahip oldukları dava hakları değerlendirilmiştir."
