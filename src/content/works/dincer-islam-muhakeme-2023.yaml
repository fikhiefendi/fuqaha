abstract: "İslam muhakeme hukukunda hakkı ortaya çıkarmaya yarayan en önemli şey ispat vasıtalarıdır. Bir davada haklı ile haksız, masum ile suçlu ancak gerçeği ispat ederek ortaya konulabilmektedir. İslam muhakeme hukukunda ispat vasıtalarının tamamı nas tarafından belirlenmemiştir. Birçok farklı çeşit olarak karşımıza çıkan ispat vasıtaları günün şartlarına göre şekillenmiş, yeni ispat vasıtaları ortaya çıkmıştır. Günümüzde bilim ve teknolojik gelişmelere bağlı olarak yeni ispat vasıtaları ortaya çıkmış, bunlar sayesinde suçluların yakalanması ve haksızlıkların önlenmesi kolaylaşmıştır. Bilimin ve teknolojinin ilerlemesiyle yenilenen birçok şey gibi ispat vasıtalarında da yenilikler ortaya çıkmıştır. Adli tıp ilminin ortaya çıkmasıyla, gözle görülemeyen izler ortaya konulmaya başlanmıştır. Bilimin ilerlemesiyle DNA, parmak izi, otopsi incelemeleri, kimyasal analizler sayesinde eskiden bilinemeyen pek çok gerçek bugün kesinlik derecesinde ortaya konulabilir olmuştur. Teknolojinin gelişmesiyle mesafeler kısalmış, ulaşım, iletişim, bilgi ağı çok farklı bir boyuta taşınmıştır. Günümüzde teknoloji sayesinde alışveriş, ticaret, maddi kazanç yöntemleri değişmiş, artık tek bir tuşla uzaktan birçok iş halledilebilir hale gelmiştir. Teknolojinin getirdiği bu yenilikler muhakeme alanında insanların sorumluluk ve yükümlülüklerini de arttırmıştır. Ortaya çıkarılmak istenilen maddi gerçek bilim ve teknoloji sayesinde gözler önüne serilebilir olmuştur. Çalışmamızda modern dünyadaki bilim ve teknolojik gelişmelere bağlı olarak ortaya çıkan ispat vasıtalarının neler olduğuna değinmeye çalıştık. Bu ispat vasıtalarını İslam muhakeme hukuku açısından kabul edilebilirliğini naslar çerçevesinde ele almaya çalıştık."
