abstract: "Ortaçağ'ın en önemli devletlerinden biri olan Selçuklular kurulmadan önce tarih sahnesinde yer almış Türk devletlerinden aldığı mirası ve İslam hukukunu birleştirip uygulamaya çalışmışlardır. Böylece Selçuklu devleti bünyesinde Şer'i ve Örfî hukukun uygulandığı bir adalet mekanizması oluşmuş ve devletin sınırları genişledikçe dönemin şartlarına göre ilaveler ve değişiklikler yapılmıştır.Selçuklu hanedan mensuplarının, devlet adamlarının ve halktan kişilerin işlediği suç olarak değerlendirilen olaylar ve ne tür cezaların verildiği incelenmiştir. Devlete karşı isyan, ihanet, görevi ihmal, savaştan kaçma, devlet yöneticilerine suikast ve sultana saygısızlık en ağır suç olarak görülmüş ve cezasız kalmamıştır. Toplum içinde ahlaksızlık olarak kabul edilen zina, hırsızlık, halka zulüm, iftira suçları da ağır bir şekilde cezalandırılmıştır. Suda boğma, zehirleme, derisini yüzerek içine saman doldurma, yakarak öldürme, ortadan ikiye bölme, çarmıha germe bu cezalandırma örneklerindendir. Çalışmamızda cezalandırmaların hangi suçlara karşılık verildiği ve ne şekilde uygulandığı üzerinde durulmuş ve uygulanan yöntemler örnek olaylarla ayrıntılı bir şekilde aktarılmıştır."
