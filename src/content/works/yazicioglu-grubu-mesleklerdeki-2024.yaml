abstract: "Finansal okuryazarlık şüphesiz her birey için önemlidir ancak bireylerin almış olduğu finansal kararların kurallarını belirleyerek, kararlara ve sonuçlarına doğrudan etki eden, karar alma, alınan kararları denetleme ve en nihayetinde alınan kararlar ile alakalı ihtilafları çözme görevi olan A grubu kadrolarda istihdam edilen kamu personeli için daha da büyük bir öneme haizdir. Bu sebeple, belirtilen mekanizmalarda görev alan kamu personelinin finansal okuryazarlık düzeyi, bilgisi ve eğitimi salt bireysel kararlarını değil makro düzeyde ekonomik kararları da etkileyici niteliktedir. Bu bağlamda bu tür kadrolardaki çalışan kamu personelinin, finans sektörü içinde giderek daha büyük bir paya sahip olan İslami finans sektörüne ilişkin terimlere olan aşinalığı ve bilgi düzeyi sektör açısından önemlidir. Bu çalışmanın amacı, A Grubu mesleklerde istihdam edilen kamu personelinin İslami finansal okuryazarlık düzeylerini tespit etmek ve bu düzeyi etkileyen faktörleri belirlemektir. Araştırma sonucunda elde edilen bulgular doğrultusunda, İslami finansal okuryazarlık düzeylerini geliştirmeye yönelik öneriler sunulmaktadır. Araştırmanın konusu finansal karar alma, alınan kararları denetleme ve en nihayetinde alınan kararlar ile alakalı ihtilafları çözme görevi olan A grubu kadrolarda istihdam edilen kamu personelinin İslami finansal okuryazarlık düzeyenin incelenmesidir. Araştırmada finansal okuryazarlık düzeyinin ölçülmesinden ziyade temel iktisat eğitimi alan kişilerin İslami finansal okuryazarlık düzeyi incelenmiştir. A grubu mesleklerde istihdam edilen kamu personelinin İslami finansal okuryazarlık düzeylerini incelemek için halihazırda A grubu mesleklerde istihdam olunan 331 personele nicel araştırma yöntemi kapsamında anket tekniği kullanılmak suretiyle sorular yöneltilmiştir. Anket metni, ulusal ve uluslararası araştırmalardan yararlanarak ve alanında uzman akademisyenlerin katkılarıyla hazırlanmıştır. Anket kartopu örnekleme yöntemi kullanılarak Google Form üzerinden yapılmıştır ve SPSS programı kullanılarak A grubu mesleklerdeki kamu personelinin İslami finansal okuryazarlık düzeyleri analiz edilmeye çalışılmıştır. Araştırmanın sonuçları değerlendirildiğinde A grubu mesleklerde istihdam edilen kamu personelinin İslami finansal bilgi ve okuryazarlık düzeylerinin düşük seviyede olduğu tespit edilmiştir. Bununla birlikte temel iktisat eğitimi almış olmanın İslami finansal okuryazarlık düzeyine etki etmediği görülmüştür."
