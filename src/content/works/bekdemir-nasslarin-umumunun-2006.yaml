abstract: "Tez, `Nassların Umumunun Kıyasla Tahsisi' şeklinde adlandırılmıştır. Tezin konusuna,amacına, yöntemine ve işleniş tarzına `giriş' kısmında yer verilmiştir.Tez, iki bölümden oluşturulmuştur. Birinci bölümde tezin ana başlığını oluşturankavramlar (nass, umum, kıyas ve tahsis) açıklanmıştır. kinci bölümde ise mezheplerinbu konuya yaklaşımları ele alınmıştır.Tezin sonunda `sonuç' başlığı altında kısa bir değerlendirme yapılmıştır. Tez,`kaynakça' bölümüyle sona erdirilmiştir."
