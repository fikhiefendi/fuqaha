abstract: "İslam hukukunda yoruma açık naslar üzerinde dil ve usul kurallarını kullanarak fikir üretmek suretiyle icra edilen ictihâd, müctehid alimlerin bakış açılarının derinliği yanında kullanılan tâlî delillerin çeşitliliği sebebiyle farklı fikir ve mezheplerin ortaya çıkmasına sebep olmuştur. Hanefî ve Şâfiî mezhepleri arasında gerçekleşen görüş farklılıklarını konu alan bu çalışma, giriş ve üç bölümden oluşmaktadır. Birinci bölümde, Hanefî ve Şâfiî mezheplerinin oluşumu, temel dayanakları ve genel karakteristiği ele alınmıştır. İkinci bölümde, her iki mezhebin başlıca ihtilaf sebepleri ve bunların furû'-i fıkha yansımaları mümkün mertebe örnekler üzerinden işlenmiştir. Üçüncü bölümde ise, Molla Hüsrev'in Dürerü'l-hükkâm adlı eserinde -kurbandan nikâh bahsine kadar- 19 yerde İmam Şâfiî ve Şâfiî mezhebine nispet ettiği görüşler, Şâfiî kaynaklarla karşılaştırılarak incelenmiş; 12 yerde bu nispetlerin doğru olduğu tespit edilmiş, 6 yerde Şâfiî mezhebinde detay olduğu, 1 yerde ise Şâfiî mezhebine atfedilen görüşün hatalı olduğu görülmüştür."
