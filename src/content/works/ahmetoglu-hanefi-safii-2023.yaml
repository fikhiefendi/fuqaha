title: "Hanefî ve Şâfiî Mezheplerinin Temel İhtilaf Sebepleri ve Hanefî Eserlerinde Şâfiî Mezhebine Nispet Edilen Görüşlerin İncelenmesi -Molla Hüsrev'in Dürerü'l-Hükkâm Adlı Eserinin Kurbandan Nikaha Kadar Olan Bölümü Özelinde-"
