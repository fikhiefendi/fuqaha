abstract: "Çalışmamızda öncelikle, Şeyh Bedreddin'in hayatını ve eserlerini özet bir şekilde ele alıp, Teshîl'in muhtevası, yazılış nedeni, konuların işleniş tarzı ve Teshîl üzerine yapılan çalışmaları açıkladık. Teshîl'de kendisinden istifade edilen kaynaklarla Teshîl'in sonraki kitaplara etkisini tespit ederek fıkıh literatüründe edindiği yeri belirleyemeye çalıştık. Bedreddin'in yaptığı fıkhi tercihleri ile Hanefi mezhebinde yazılmış benzer kitapların tercihlerini kıyaslayarak bu noktada Teshîl ile diğer kitapların farkını veya benzerliklerini tespit etmeye çalıştık. Teshîl'in mukayeseli bir fıkıh kitabı olduğunu örneklerle göstermek için diğer mezheplere yapılan atıflar ve bu atıfların güvenirliliği üzerinde durduk. Teshîl'deki külli kaideler ve zâbıtaları tespit ederek örneklerle izah ettik. Son olarak Teshil tahkikinde esas alınan nüshaları ve tahkikte izlenilen metodu açıkladıktan sonra Teshîl'in tahkikli metnini oluşturduk."
titleTranslation: {"en": "Critical edition and analysis of Şeyh Bedretti̇n's Teshi̇l"}
