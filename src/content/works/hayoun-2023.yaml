abstract: "Bu çalışma Cezayir'deki faaliyet gösteren İslami bankaların rolünü açıklamayı, topluma finansal katılımı sağlaması, İslami bankaların mali bütünlüğünü geliştirmek adına bulunan çeşitli mekanizmaların belirlenmesi, aynı zamanda İslami bankaların geleneksel bankaların ulaşamadığı toplumdaki yeni gruplara ne ölçüde ulaşabildiğini netleştirmeyi amaçlamaktadır. Çalışmanın hedeflerine ulaşmak için konuyla ilgili çalışmaları gözden geçirirken Tümevarımsal yaklaşımı izlemiştir. Bununla beraber Analitik yöntemi, istatistiksel analizin sonuçlarını incelemek için de kullandı. Al Baraka ve Cezayir'in Al Salam Bank müşterilerinden örnek alarak bir vaka çalışması yapıldı. Bu çalışmada çeşitli sonuçlara varıldı bunlardan en öne çıkanı; İslami bankaların, finansal hizmet ve ürünler sağlayacak ve bunlara erişimi kolaylaştıracak çözümlerin bulunmasında en önemli mekanizmalardan biri olması ve böylece mali bütünlüğünü arttırılır. Çalışma, mali kültürünü geliştirilmesi ve mali teknolojiye takip etmesi gerektiğini, mali katılımı artırmak amacıyla toplumun tüm üyelerine hizmet sunmak için düşük maliyetli İslami finansman araçları oluşturmasını önerdi."
