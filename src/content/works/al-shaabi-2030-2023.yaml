abstract: "Bu çalışma, Katar Vizyonu 2030'a göre Katarlı kadınların sürdürülebilir ekonomik kalkınmadaki rolünü İslami bir perspektiften ele almayı ve bu süreçte başarılarını engelleyen zorlukları belirlemeyi amaçlamaktadır. Çalışmada nitel araştırma yöntemi üzerinden çalışmanın konusuna ve amaçlarına uygunluğu nedeniyle tümevarım yaklaşımı takip edildi. Ayrıca, kişisel görüşmeler yoluyla toplanan verilerin analiz edilmesi amacıyla analitik yaklaşım metodu uygulandı. Altı ay süren saha çalışmasında deneyimleri 5-20 yıl arasında olan yaklaşık 21 Katarlı kadın girişimci seçilerek veriler elde edildi. Çalışmanın neticesinde İslami perspektife uygun çalışma ortamlarda Katarlı kadınların ekonomik hayata pozitif katkı sağladığı ve dosya ve ekonomik alan da birçok sorunun hallinde önemli roller üstlendikleri tespit edildi. Ayrıca çalışmada sözkonusu sürece olumsuz etki eden faktörler de tespit edildi. Çalışma, birtakım önerilerle nihayete erdi: Politika yapıcılar ve paydaşların, Katarlı kadınları sahada destekleyen politikalar, sistemler geliştirme yönünde çalışmalarda bulunması ve yasal/islamî perspektife uygun ekonomik kalkınmaya elverişli ortamların oluşturmasının önemine dikkat dikat çekerek Katarlı kadınların Katar ekonomisine katkılarının ihmal edilmemesi gereken önemli bir alan/oran olacağını hatırlatmaktadır."
