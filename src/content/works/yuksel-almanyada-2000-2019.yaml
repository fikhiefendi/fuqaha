abstract: "Müslümanların yoğunlukla yaşadığı ülkelerden biri Almanya'dır. Dolayısıyla Almanya'da geçmişten günümüze kadar Müslüman akademisyenler ve oryantalistler tarafından İslam Bilimleri alanında birçok çalışma yapılmıştır. İslam hukuku, üzerinde etraflıca çalışmalar yapılan alanlar arasında yer almaktadır. Başta Alman oryantalistler olmak üzere Müslüman akademisyenler tarafından da bu alanda birçok çalışmaya imza atılmıştır. Çalışmamızda, İslam hukuku alanında 2000 yılı sonrası kaleme alınan çalışmalar incelenmiştir. Bunlar arasında, akademik çalışmalardan yüksek lisans tezleri, doktora tezleri, sempozyum bildirileri, bireysel çalışmalar ve bireysel olarak kaleme alınan popüler çalışmaları tespit edip değerlendirmeye çalıştık. Ulaşabildiğimiz çalışmaları kronolojik olarak tanıtıp değerlendirmeye çalıştık. Ele alınan eserlerde konular, müellifler, yayım yeri, tarihi, yayınevi gibi bilgi vermekle yetindik. Ulaşamadığımız çalışmaların toplu listesini tezimizin ekler kısmında verdik."
