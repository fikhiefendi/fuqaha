abstract: "Tunuslu büyük âlim Şeyh Muhammed Zeytûne el-Münestîrî'ye ait“Metâliʿu's-Suûd”adlı eser, önemli yazma eserlerin başında gelmektedir. Hicrî on ikinci yüzyılda yaşayan müellif, başta Zeytûne Üniversitesi olmak üzere Tunus'un ilim geleneğine önemli katkılar sunan seçkin âlimlerdendir. Müellifin ilmî şahsiyeti ve eserin tefsir disiplinindeki konumu sebebiyle, söz konusu yazmanın bir bölümünün araştırma kapsamında tahkik edilmesi önem arzetmektedir. Mezkûr hâşiyeyi değerli kılan iki temel unsur bulunmaktadır. Birincisi; üzerine yazıldığı eser olan Ebüssuûd'un Tefsiri'nin ilgili literatürünün en kıymetli, en nitelikli ve en yaygın eserlerinden biri olmasıdır. İkincisi ise müellifinin Tunus'un önde gelen âlimlerinden olup kaleme aldığı söz konusu hâşiyenin, Ebüssuûd Tefsiri üzerine yazılmış en kıymetli çalışmalardan biri kabul edilmesidir. Eserde, Ebüssuûd'un kapalı veya özlü ifadeleri detaylıca açılanmış; müfessirlerin görüşleri eleştirel bir bakışla tahlil edilerek tercih edilen görüşler ortaya konmuş; ayrıca müellifin tefsire dair özgün değerlendirmelerine ve önemli ilmî katkılarına yer verilmiştir. Bu çalışmanın gayesi, mevcut yazma nüshalar arasında mukayeseler yapılarak mümkün derecede ana metni hatalardan arındırılmış şekilde ortaya koymaktır. Bunun yanısıra eserin İslam tefsir geleneğinin gelişim sürecine yaptığı metodolojik katkıları ortaya koymaktır. Çalışmada ayrıca müellifin tefsir yöntemi incelenmiş, dayandığı temel ilkeler tespit edilmiş, görüş ve yorumları bilimsel bir bakış açısıyla değerlendirilmiştir. Betimleyici-analitik yöntem ile tarihî ve tümevarımsal yöntemler araştırmanın yöntemsel boyutlarını oluşturmaktadır. Sonuç kısmında, söz konusu yazmanın Kur'ân tefsiri literatürüne önemli ve özgün bir katkı sunduğu, bu nedenle tahkik edilmeyi, incelenmeyi ve ilim dünyasına kazandırılmayı hak eden değerli bir eser olduğu ortaya konulmuştur."
