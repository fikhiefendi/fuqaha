abstract: "Bu çalışmada Muvatta'da mekruh, kerahet, kerih ve benzer kelimelere İmâm Mâlik tarafından hangi anlamın yüklenildiğini tespit etmek ve sonrasında bu kelimelerin mezhepte nasıl bir terim anlamı kazandığının izleri araştırılmıştır. Yani çalışma öz itibariyle, İmâm Mâlik'in kullandığı mekruh kelimesinin anlam alanıyla sonraki Mâlikî alimlerin mekruh kavramına yükledikleri anlam arasında var olan benzerlik veya farklılıkların tespit edilmesi hedeflenmiştir. Bu çalışmada gözetilen maksatlardan bir tanesi de söz konusu kavramın zaman içerisinde anlamında bir değişme olup olmadığının örneklerle ortaya konmasıdır. Ayrıca bu çalışmada göz önünde bulundurulan bir diğer hususta İmâm Mâlik'in fıkhî değerlendirmelerinde mekruhu haramdan daha fazla kullanmasının sebebi, Muvatta'nın hangi bölümlerinde mekruh kavramına yer verdiği ve mekruh anlamında kullanılan diğer lafızların incelenmesidir."
