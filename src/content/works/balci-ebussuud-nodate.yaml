abstract: "Ebüssuûd Efendi (ö.982/1574), Kanuni Sultan Süleyman ve II. Selim devirlerinde, devletin muhtelif kademelerinde altmış yıl kadar vazife yapmıştır. En önemlisi de otuz yıla yakın şeyhülislamlık yapmış olmasıdır. Kazaskerlik ve şeyhülislâmlık vazifeleri sırasında ilmiye ve devlet teşkilatını geliştirmeye çalışmış, dolayısıyla Osmanlı idari ve hukuki yapısına ciddi katkı sağlamıştır. Resmi vazifelerini ifa ederken muhtelif sahalarda eserler kaleme almıştır. Bu eserlerin çoğu, elyazması halinde bulunmaktadır. Araştırma konusu yaptığımız ve yine mahtut halde bulunan“Bidâ'atü'l-kâdî li'htiyâcihi ileyhi fi'l-müstakbel ve'l-mâzî”isimli eseri, sakk mecmualarının ilki olma özelliğini taşımaktadır. Bu çalışmada, fazla hacimli olmaması hasebiyle risalenine tamamı tahkik edildi. Müellifin hayatı, talebeleri ve eserleri hakkında bilgi verildi. Bu çalışmada müellif nüshasına ulaşılamadığı için, ona en yakın metni ortaya koyabilmek amacıyla ulaşılabilen nüshalar içerisinden bazı kıstaslara göre üç tanesi tahkik için esas alındı. Nüshalar mukayese edilerek farklılıkları dipnotta gösterildi. Metin içerisinde geçen yabancı kelimelerin izahı ve ayetlerin numara ve sureleri dipnotta gösterildi."
