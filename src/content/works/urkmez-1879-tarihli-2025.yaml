abstract: "Osmanlı Devleti'nde kuruluştan 18. yüzyıla kadar devam eden klâsik dönemde fıkıh ve örfî hukuk iş birliğinden doğan kendine özgü bir hukuk sistemi uygulanmıştır. 18. yüzyılda yaşanan hâdiseler, Osmanlıyı birçok alanda olumsuz etkilemiştir. Devletin iktisâdi, siyasi ve askeri alandaki başarısızlıkları, çeşitli iç ve dış sebeplere bağlı olarak hukuk anlayışında oldukça önemli değişimler yaşanmasına yol açmıştır. Bu dönemde Batı dünyasının doğrudan etkisiyle yenidünya düzeninin dayattığı kanunlaştırma hareketlerine kapı aralanmıştır. Özellikle Fransa'nın etkin rol oynadığı bu süreçte, Batı tekniği ile hazırlanmış olan birçok kanun kabul edilmiş ve bunlar vatandaşlarının çoğunluğunu Müslümanların oluşturduğu Osmanlı devletinde uygulanmıştır. Bu çalışmanın konusu olan 1879 Tarihli Usûl-i Muhâkemât-ı Cezaiye Kanunu Muvakkâtı da bahsedilen kanunlaştırma faaliyetlerinin bir ürünü olarak ortaya çıkmıştır. Bu kanun, Türk hukuk tarihindeki anlayış değişikliğinin yargılama hukuku alanındaki örneğini sunmuştur. Bu çalışmada 18. yy. da değişen Osmanlı yargısı, ceza yargılaması hukuku özelinde ele alınmıştır. Değişim sürecinin anlaşılabilmesi için öncelikle tarihi arka plan aktarılmıştır. Akabinde Fransa hukukundan alınan ceza usûlü hukukunun mâhiyeti genel olarak incelenmiştir. Daha sonra cinâyet davaları özelinde yetkili mahkemelere, hâkimlere, savcılara, muhâkeme evresine ve suçlu hakkında verilecek hükümlere dair düzenlemelerin ayrıntısına girilmiştir. Ayrıca dönemin hukukçularının konu hakkındaki değerlendirmelerine de yer verilmiştir. Böylece sistemin kronolojik takibinin yapılması ve ceza yargılaması alanında Batı'nın Osmanlı hukukuna etkisinin uygulamada ve doktrindeki izlerinin sürülmesi mümkün hale getirilmiştir."
