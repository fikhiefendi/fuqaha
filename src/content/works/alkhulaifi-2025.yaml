abstract: "Bu çalışma, Şeyh Ubeyd künyesi ile meşhur olan hicri 9. asır alimlerinden Abdülmelik Ali el-Babî el-Halebî'ye ait olan 'Muhtasar fi'l-Fıkhi Mimma Leyse fi'rRavda ve'l-Minhac' isimli mahtut eserin tahkikini ele almaktadır. Bu mahtut, aksi durumda unutulacak olan çok sayıda kaynağa atıfta bulunarak muhafaza ederek Ravda ve Minhâc kitaplarındaki konulara eklemeler yapmış, ilmi cevaplar ve tartışmalar açısından da zenginliğinden dolayı Şafii fıkhının önemli eserlerinden biri olarak kabul edilmektedir. Çalışmada genel olarak şu hedefler gerçekleştirilmeye çalışılmıştır: Siyasi, sosyal ve kültürel koşulların tanıtılması ve bunların yazar üzerindeki etkisinin tespiti, elBabî el-Halebî'nin tercemesine ışık tutulması, mahtut eserin isminin ve yazarına olan nispetinin sıhhatinin teracim kitaplarına ve eserlerin isimlerini zikreden kaynaklara yönelmek suretiyle ilmi şekilde değerlendirilmesi. Bunların yanında, metnin tahkiki vesilesiyle kullandığı kaynakların beyanı ve dayandığı fıkhî kaideler üzerinden müellifin yönteminin tespiti de amaçlanmıştır. Çalışmanın neticesinde araştırmacı birtakım sonuçlara varmış olup bunlardan da bazıları şu şekilde ifade edilebilir: Bu eser, İmam Nevevî'den sonra Şafii mezhebi müteahhirin dönemi fukahâsı çabasının bir ürünü olup dört mezhebi karşılaştırmalı olarak ele almakta ve zaman zaman Zahiri mezhebinin de görüşünü zikretmektedir. Her meselede ilgili delili verdikten sonra İmam Şafii'nin varsa konuyla ilgili sözünü ve mezhepteki diğer imamların görüşlerini de ifade etmektedir. Eserin müellifi, salt bir mukallid olmayıp meseleler üzerine yorumlar yapıp olumluolumsuz değerlendirmelerini de yapmaktadır. Eserin dil, hadis, siyer ve tarih alanlarına katkısı olup, eserin sahibi fıkıh ve diğer ilim dallarından toplam seksenden fazla kaynaktan doğrudan kendisi ulaşarak ve okuyarak yararlanmıştır."
