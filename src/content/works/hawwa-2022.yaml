abstract: "Tez, İslam ekonomisinin hayali değil gerçek bir ekonomi olduğunu doğrulayan özelliklere ve bileşenlere sahip olduğunu göstererek İslam ekonomisinin özelliklerini güçlendirme ve vurgulama fikrini ele aldı. Tez, reel ekonominin özelliklerini tahmin etmeyi ve buna karşılık hayali ekonominin göstergelerini tahmin etmeyi ve ortaya çıkan birçok konuda yasal hüküm arayanların işini kolaylaştırmayı amaçladı. Tez, tümevarımsal-analitik yaklaşımı benimsemiş ve ulaştığını pratik kanıtlar ve örneklerle desteklemiştir. İslam'da gerçek bir ekonominin bileşenlerinin varlığını kanıtlamak için tez ulaşmayı çalıştı, bunların en önemlileri: dürüstlük ve şeffaflık, adaletin gereklerine ve gerçek gelişmeyi sağlamak için insan enerjisini yatırmak, orta sınıfı koruma hevesi, üretim alanlarını genişletmek ve bağlılığı teşvik etmek. Öte yandan araştırma yukarıda bahsettiğimiz yönlerden birindeki her kusurun, özellikle büyük aldatmaca, orta sınıfın zenginlerin uygulamaları nedeniyle toplumdaki erozyona uğraması, hayali bir ekonominin göstergesi olduğunu kanıtladı. Kredilerin genişlemesi ve buna yol açan ekonomik ve sosyal riskler, sömürücülere yer açmak ve nihayet kamu yararı üzerinde şahıs mülkiyetini başlatmak."
