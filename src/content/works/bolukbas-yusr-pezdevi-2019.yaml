abstract: "Ebü'l-Yüsr, Mâverâünnehir bölgesinde yetişen meşhur bir fakih ve kelâm âlimidir. Dini ilimler sahasında çeşitli eserler telif eden Ebü'l-Yüsr, fıkıh usûlü alanında da birden fazla eser kaleme almıştır. Ebü'l-Yüsr'ün usûl-i fıkha dair yazdığı eserlerden günümüze ulaşan tek kitabı Ma'rifetü'l-Hüceci'ş-Şer'iyye'dir. Modern dönemde birçok çalışmada Ebü'l-Yüsr'ün Semerkant meşâyihinin öncülerinden olduğu ifade edilmiş olmasına rağmen, bu fakihin eseri dikkate alınarak usûl-i fıkıh anlayışı hususunda yapılan özel bir araştırmaya muttali olamadık. Tezimizde Ebü'l-Yüsr'ün Ma'rifetü'l-Hüceci'ş-Şer'iyye adlı eseri bağlamında fıkıh usûlü anlayışı irdelenerek, Hanefî mezhebi içerisindeki konumunu tespit etmeye çalıştık. Çalışmamızda Ebü'l-Yüsr'ün usûl-i fıkha dair benimsediği görüşlerinin değerlendirilebilmesi amacıyla fukaha metoduyla telif edilen eserlerle mukayese edilmiştir. Yapılan karşılaştırmanın sonucuna göre Ebü'l-Yüsr'ün fıkıh usûlüne dair düşünceleri Irak, Buhara ve Semerkant meşâyihi açısından değerlendirmeye tâbi tutularak bir neticeye ulaşılmıştır. Varılan sonuca göre Ebü'l-Yüsr'ün usûl-i fıkha dair görüşlerinin temelinde kelâm ilminin etkisi net bir şekilde tebarüz etmiştir. Ebü'l-Yüsr'ün tercihlerinde kimi zaman Semerkant meşâyihiyle kimi zaman ise Irak ve Buhara fakihleri ile hemfikir olduğu görülmüştür. Ayrıca Ebü'l-Yüsr'ün bazı hususlar hakkında kelâmi gerekçelerden dolayı başta İmam Mâtürîdî olmak üzere tüm Hanefî usûlcülerine ihtilâf ettiği gözlemlenmiştir."
