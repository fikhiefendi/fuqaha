abstract: "Yetimlerin hak ve sorumluluklarını inceledigimiz çalısmaya, konunun çerçevesi, kaynak, yöntem ve amaçla giris yapılmıstır. Birinci bölümde yetim kelimesinin kapsamı, diger semavi dinlerde yetim, cahiliyede yetim ve modern öncesi ve sonrası bazı toplumlarda yetim ve sosyal hizmet kavramı ve yetim baslıklarını içermektedir. kinci bölümde yetimin Kur'an ve sünnette genel olarak ele alınısı yer aldıktan sonra daha çok yapılan tefsirler gözetilerek Kur'an ve sünnette yetimin aile içindeki yeri, malı, ganimet, fey ve mirastaki hakları ile yetimlerle ihtilat konusu islenmistir. Üçüncü bölümde ise yetimlerin sosyal hakları ve mali hakları genel baslıklarında himayeleri, evlilik kurumundaki yerleri, yetimlerle birlikte yasama ve yetim malının vasfı, çalıstırılması, ikrazı, yetim malının zekâtı, ganimet, fey ve mirastaki hakları ele alınmıstır. Konular islenirken tezvîc-i sıgâr, teaddüd-i zevcât, ihtilat, tebennî,, lakît, ikrâz, para vakıfları, eytam sandıkları,, emvali eytam nizamnameleri ve dede yetimi terimlerine baslıklar altında açıklama getirilmeye çalısılmıstır."
