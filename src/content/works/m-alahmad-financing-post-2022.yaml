abstract: "Bu çalışmada, savaş sonrası altyapı projelerinin sukuk yoluyla finanse edilmesi incelenmiş ve sukuk alanında çalışan beş uzmanla görüşülmüştür. Analizin sonucunda, savaş sonrası ülkelerde sukuk kullanılarak yapılan finansman ile altyapı geliştirme arasında güçlü bir ilişki olduğuna kanaat getirilmiştir. Bununla birlikte, sukukun notu ve getirisi, başarılı bir pazarlama için son derece önemlidir. Ayrıca, söz konusu ülkeler enstrümanlarını ABD doları veya altın'ı baz alarak fiyatlandırmaları gerekmeketedir. Sermaye mümkünse Tekafül Sigorta veya İslam Kalkınma Bankası tarafından garanti altına alınmalıdır. Bahsolunan ülkelerin havalimanları, tren vb. gelir getirici varlıkları İcare Sukuk yoluyla finanse edilebilir. Bu tür gelir getirici varlıkların sağlanma olasılığı uzun dönemde azalacaktır. İcara sukukunun diğer sukuk ve finansman yöntemleri ile birleştirilmesi için hibrit sukuk modeline başvurulmalıdır. Çalışma, ilgili idarenin projelerini icâre sukuk yöntemini kullanarak işletme etkinliğini arttırmasını önermektedir. Bağlayıcı sözleşme hukuki bir sorun içermemelidir. Bu ülkelerdeki ilk icare sukuk deneyimleri küçük ölçekli ve yüksek getirili olmalı, başarılı olunursa bu ülkelerin kredi notu yükselecektir."
