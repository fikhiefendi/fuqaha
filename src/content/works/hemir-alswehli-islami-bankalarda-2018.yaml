abstract: "Araştırmanın amacı Mudaraba kavramı göstermekti. Mudaraba İslami bankalar ve spekülatif sözleşme koşullarında İslami bankalarda uygulanan tür bilmeden. Bazı modelleri spekülatif bankalar tutmak için uygulanan. İslami bankalarda Mudaraba için bazı pratik örnekler kimliği ile. Endüktif ve spekülatif çalışmaları ve uygulamaları hem Tezler veya arama genel kitap okumak için kullanılan konu ele bilimsel yöntemleri bir dizi takip. İslami bankacılık ve spekülatif sözleşme analiz halk modeller yoluyla bu gerçekliğin uygulayarak gerçeği açıklayıcı analitik açıklaması. Arama bulgular ve tavsiyeler bir grup ile sona erer."
