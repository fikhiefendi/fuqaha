abstract: "Katılım bankalarının geleneksel bankalara göre; daha az kaynak ve kabiliyetlere sahip olması, kriz durumlarından daha fazla etkilenmesi, çalışanlara daha az nakdi ve nakdi olmayan teşviklerin sağlaması, katılım bankalarında örgütsel adanmışlığın önemli bir sorun olmasına neden olmaktadır. Bu sorunun üstesinden gelmede, yönetim literatüründe örgütsel adanmışlığın önemli öncüllerinden biri olarak incelenen örgütsel güvenin artırılmasının yararlı olacağı düşünülmektedir. Bu tez çalışmasında, katılım bankalarında örgütsel adanmışlığı sağlamada örgütsel güvenin rolü test edilmektedir. Örgütsel güven ile örgütsel adanmışlık arasındaki ilişkileri katılım bankları bakımından incelemek amacıyla gerçekleştirilen araştırma kapsamında, anket yöntemiyle 496 katılım bankası çalışanından birincil veri toplanmıştır. Araştırma verilerinin analizi neticesinde; yöneticiye, kuruma ve çalışma arkadaşına güven boyutlarından oluşan örgütsel güvenin, örgütsel adanmışlıkla ilişkili olduğu sonucuna varılmış ve araştırma hipotezleri kabul edilmiştir. Bunların yanında, katılım bankası çalışanların örgütsel adanmışlıklarının düşük olduğu ve belirli araştırma değişkenlerinin demografik özelliklere (cinsiyet, gelir, yaş, mesleki deneyim, işyerinde çalışma yılı ve unvan) göre farklılaştığı tespit edilmiştir. Araştırmada ulaşılan sonuçlar, katılım bankalarında örgütsel adanmışlığını artırmada; yöneticiye güven, kuruma güven ve çalışma arkadaşlarına güvenin artırmanın önemli bir yöntem olabileceğini göstermektedir."
