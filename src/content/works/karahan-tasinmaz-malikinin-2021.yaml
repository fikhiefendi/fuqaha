abstract: "Tezimizin konusunu oluşturan ve Türk Medeni Kanununun 730. maddesinde düzenlenen“Taşınmaz Malikinin Sorumluluğu”, uygulama alanı oldukça geniş bir sorumluluk türüdür. Bu sorumlulukta, taşınmaz malikine kurtuluş kanıtı getirme imkânı verilmediğinden kusursuz sorumluluğun bir hali olarak kabul edilmektedir. Taşınmaz malikinin sorumluluğu Medeni Kanunda düzenlenmiş ise de koşulları Borçlar Kanununa göre belirlenmiştir. Bu nedenle çalışma konumuzu ele alırken Sorumluluk Hukuku prensiplerinden hareket edilmiştir. Tezimiz, üç bölüm olarak hazırlanmıştır. Birinci bölümde, öncelikle sorumluluğun tarihsel gelişimi, hukuki niteliği ve esasları ile özellikle diğer kusursuz sorumluluk halleriyle karşılaştırılması yapılmış, sorumluluğun uygulama alanı incelenmiştir. İkinci bölümde, hukuka aykırı eylemlerden kaynaklanan sorumluluk koşulları ile“Fedakârlığın Denkleştirilmesi”ilkesinin uygulama alanı bulduğu hukuka uygun ancak kaçınılmaz taşkınlıklardan kaynaklanan sorumluluk koşulları iki başlık altında irdelenmiştir. Üçüncü ve son bölümde ise, Taşınmaz malikinin sorumluluğunun hukuki sonuçları, açılabilecek davalar, davanın tarafları, ispat yükü ve zamanaşımı ile sorumlulukların yarışması ele alınmıştır. Çalışmamızda özellikle, unsurları ve kapsamları itibariyle birbirine benzeyen“Çevreyi Kirletenin Sorumluluğu”ile taşınmaz malikinin sorumluluğu kıyaslaması yapılarak farkları ortaya koyulmuş; davalısı kamu tüzel kişileri veya idare olan uyuşmazlıklarda mülkiyet hakkını ihlal edebilecek nitelikteki taşkınlıklar sebebiyle uygulamada ortaya çıkan sorunların çözüme kavuşturulması amaçlanmıştır."
