abstract: "“206/4 (603-815) Numaralı Urfa Şer'iyye Sicilinin Transkripsiyonu ve Değerlendirmesi”adlı tez çalışmamızın amacı, H.1282 (M.1865) ile H.1287 (M.1870) yılları arasındaki şer'iyye sicillerinin değerlendirilerek Urfa'nın ticari, sosyal ve kültürel hayatına ait bilgilere ulaşmaktır. Çalışmamız giriş ve üç bölümden oluşmaktadır: Birinci bölüm Tarihte Urfa, Osmanlı Hukuk Sisteminin Genel Yapısı, Osmanlıda Şer'i Mahkemeler, Şer'i Mahkemelerdeki Görevliler, Şer'iyye Sicilleri Tanımı ve İçeriği, Şer'iyye Sicillerindeki Belge Türleri ve Üst Makamlardan Gelen ve Şer'iyye Sicillerine Kaydedilen Belgeler'den oluşmaktadır. İkinci bölümde 206/4 (603-815) Numaralı Urfa Şer'iyye Sicilleri'nin değerlendirmesi yapılmıştır. Değerlendirme bölümünde 1869 yılında Süveyş Kanalı'nın açılması sonucu Urfa ve çevresindeki ticari hacmin istenilen seviyede olmamasından dolayı borçların ödenmemesinden kaynaklı alacak-verecek davalarının yaşandığından bahsedilmiştir. Ayrıca bölgede çekirge istilası ve gala yıllarındaki ürün yetersizliğinden dolayı tarımsal borçlanmalardan söz edilmiştir. Sicildeki alım-satım belgelerinde gayrimenkul satışları içerisinde hane alım-satımının diğer gayrimenkullere göre fazla olmasının sebeplerinden bahsedilmiştir. Kırsal bölgelerdeki eşkıyalık ve yağma olaylarının kente göçü meydana getirdiği ayrıca Kafkas muhacirlerinin bölgeye sevkedilmesinden dolayı hane alım-satımının arttığından sözedilmiştir. Alım-satım belgelerinde İslam hukuk sisteminde gerek Mecelle'de gerekse de Türk Medeni Kanunu'nda yer alan şüf'ayani ön alım hakkı uygulamasının mevcut olduğu görülmüş ve bundan bahsedilmiştir. Belgelerdeki tereke kayıtları incelenerek Urfa'nın gündelik hayat ve mülk yapısı incelenmeye çalışılmıştır. Ayrıca vakıf belgeleri içinde Urfa'nın vakıf kurumu açısından zengin bir geçmişe sahip olduğu Hacı Sakıp Efendi'nin vakfeylediği Hankah-ı Kadiriye Vakfiyesi ve AhmedPaşa nam-ı diğer Rızvaniye Medresesi ve Mescidi Vakfı'nın Sureti Vakfiyeleri değerlendirilerek bu vakıflardan söz edilmiştir. İkinci bölümün son kısmında kısaca diğer belgelerden ve sicillerde geçen yer isimlerine değinilmiştir. Üçüncü bölümde 206/4 (603-815) Numaralı Urfa Şer'iyye Sicili'nin transkripsiyonu yer almaktadır."
