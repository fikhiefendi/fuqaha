abstract: "Katılım bankaları, İslam toplumunun ihtiyaçlarına faiz kullanmadan cevap veren kuruluşlar olarak tanımlanabilir. Faizsiz bankacılık, paranın alınıp satılan bir mal değil, bir değişim aracı olması ilkesiyle bağdaştırılabilir. Günümüzde katılım bankaları hizmetlerinde büyük gelişmeler görülmektedir. Banka sayılarının artışına paralel olarak sundukları hizmet çeşitleri de dolaylı olarak artmaktadır. Birçok banka danışmanlık hizmetleri, kurumsal, bireysel bankacılık veya internet bankacılığı gibi unsurlara ağırlık vermeye başlamıştır. İçinde bulunduğumuz ortamda yaşanan yoğun rekabet şartları, tüm işletmelerde olduğu gibi bankaların da başarısında yatan en önemli unsurlarından birisinin çalışan personelin iş tatmininin iyi olması gerektiğini ortaya koymaktadır. Bankalar, faaliyetlerini sürdürebilmek için diğer sektörlerde faaliyette bulunan işletmelerden daha fazla personelin iş tatminine önem vermek zorundadırlar. Bu personel odaklı faaliyetin amacı, bankanın personeline verdiği hizmet içi eğitim ile personeli ön plana çıkartarak onların ihtiyaçlarını ve beklentilerini belirleyip iş tatminini sağlayarak kaliteli hizmet sunmaya çalışmak olmalıdır. Bu araştırmanın konusunu katılım bankası personeli ve hizmet içi eğitim sürecinin banka çalışanlarının iş tatmini üzerine etkisinin araştırılması oluşturmaktadır. Bu amaçla çalışmanın birinci bölümünde katılım bankaları hakkında genel bilgiler verilmiştir. İkinci bölümde hizmet içi eğitim süreci genel olarak açıklanmıştır. Üçüncü bölümde ise yirmi iki sorudan oluşan bir anket çalışması ile katılım bankalarında çalışan personele verilen hizmet içi eğitimlerin personel iş tatminine olan etkisini ortaya koymak amaçlanmıştır. Tez çalışmasının bu kısmında anket çalışması ve sonuçlarının analizine yer verilmiş olup bu doğrultuda sonuç ve öneriler verilmiştir."
