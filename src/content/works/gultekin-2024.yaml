abstract: "Bu araştırma, Bakara Suresi'ndeki namaz ve zekât ayetlerini eğitimsel bir perspektiften incelemeyi ve bu ayetlerin birey ve toplum üzerindeki etkilerini, bağlam teorisine göre analiz etmeyi amaçlamaktadır. Bu çalışmanın önemi, daha önce bu konuyu kapsamlı bir şekilde ele alan az sayıda çalışma olmasından kaynaklanmaktadır. Bu durum, Kur'an ayetlerinin tam anlamıyla anlaşılmasını ve bunların dini davranışlar üzerindeki etkilerini kavramayı zorlaştırmaktadır. Araştırmanın üç ana amacı vardır: Birincisi; Bakara Suresi'nin amaçlarını ve konularını inceleyerek bu surenin ruhsal ve toplumsal boyutlarını anlamaktır. İkincisi; ayetlerde yer alan namazın eğitimsel etkilerini analiz ederek, bireyin ve toplumun davranışlarını nasıl iyileştirdiğini değerlendirmektir. Üçüncüsü ise zekâtın eğitimsel etkilerini inceleyerek, cömertlik ve toplumsal dayanışma değerlerini nasıl pekiştirdiğini ortaya koymaktır. Bu araştırma, bağlamsal olarak derinlemesine bir anlama ulaşmak için Kur'an ayetlerini toplayarak ve bu ayetleri kendi bağlamları içinde yorumlayarak betimleyici ve analitik yöntemleri kullanmıştır . Araştırma, bağlamında incelenen ibadetlerin, İslam hukuku hükümlerinin amaçlarını daha iyi anlamaya katkı sağladığını ortaya koymuştur. Bu da Müslümanların günlük hayatlarında bu hükümleri uygulamalarını kolaylaştırmaktadır. Ayrıca, zekâtın nefsi arındırdığı ve cömertliği teşvik ettiği, namazın ise bireyin psikolojik ve zihinsel dengesini korumada etkili bir araç olduğu sonucuna varılmıştır. Bu durum, bireylerin ve toplumların yaşam kalitesini iyileştirmeye yardımcı olmaktadır."
