abstract: "Ekonomik faaliyetlerin neredeyse tamamı tüzel kişiliğe haiz ticaret şirketleri aracılığıyla yapılmaktadır. Tarih boyunca toplumun ihtiyacına göre şekillenen ticari birliktelikler farklı zaman ve mekanlarda farklı yapılarda oluşmuştur. Günümüz şirketlerinin büyük çoğunluğunu oluşturan sermaye şirketlerinin kökeni, deniz ticaretindeki gelişmeler ve sanayi devrimine kadar dayanmaktadır. Bu olgular, ticari faaliyetlerde büyük sermaye gereksinimlerinin doğmasına neden olmuş, önceleri genellikle iki kişi arasında kurulan ortaklıklar yapıları daha fazla kişilerin bir araya geldiği sermaye şirketlerine dönüşmüştür. Sermaye şirketlerinin tüzel kişiliği haiz olması bağımsız bir malvarlığın bulunması sonucunu doğurur, bu nedenle ortakların şirket varlıkları üzerindeki hak ve sorumlulukları kısıtlanmıştır. Bu kısıtlama şirketin ve şirket ortaklarının yararına olduğu gibi dolaylı olarak topluma da ekonomik fayda sağlar. İslam hukuku, İslam dininin temel kaynakları Kuran ve sünnette yer alan ana esaslar üzerine tesis edilmiş bir hukuk düzenidir. Erken dönemlerden itibaren hukuk bilginleri, toplumun değişen gereksinimlerini göz önünde bulundurarak usulüne uygun gerçekleştirdikleri hukuki çıkarımlar (içtihat) aracılığıyla hukuk sisteminin güncelliğini muhafaza etmişler ve yüzyıllar boyunca fiilen uygulanabilir olmasını sağlamışlardır. Klasik İslam hukuku eserlerinde şirketler konusu oldukça geniş bir şekilde ele alınmış, eserlerin oluştuğu zaman ve toplumda yaygın olan ortaklık yapıları ayrı başlıklar altında incelenmiştir. Eserlerde yer alan ortaklıkların yanı sıra karma yapıda oluşan ortaklıkların meşruiyeti de İslam hukukçuları tarafından kabul edilmiştir. Bu konuda belirlenen temel ilkelere aykırı olmamak koşuluyla ticari örf, hükümlerin belirlenmesinde en önemli etken olmuştur. Bu nedenle günümüz şirketlerinin İslam hukuku açısından değerlendirilmesinde bu iki etkenin tespiti önem taşımaktadır. Çalışmamızda öncelikle, İslam hukukunun klasik eserlerinde yer alan şirket türleri ve bunlara dair genel hükümlere değindikten sonra, şirketin unsurları ve şirketler hukukuna hâkim olan temel ilkelerin tespitine çalıştık. Günümüz hukukundaki düzenlemelerden (ticari örf) hareketle, şirket ortaklarının hak ve sorumluluklarının İslam hukuku perspektifinden bir değerlendirmesini gerçekleştirdik. Sonuç olarak, İslam hukukunda şirketlere ilişkin hükümlerin, ticari ihtiyaçlara cevap verebilecek nitelikte dinamik bir yapıya sahip olduğu; ortakların menfaatlerinin gözetilmesi esas alınırken, kâr paylaşımının üstlenilen sorumluluk ve sarf edilen emekle orantılı olması, zararın ise sermaye oranına göre paylaştırılması gerektiği sonucuna ulaşılmaktadır."
