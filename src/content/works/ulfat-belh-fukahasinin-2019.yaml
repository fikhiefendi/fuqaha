abstract: "Eskiden Horasan ismi ile dünyaya ün salan günümüzde ise Afganistan, Türkmenistan, İran ve Özbekistan ülkeleri tarafından paylaşılan bölgenin en meşhur dört şehrinden biri olan Belh; gerek İslam öncesi gerekse İslam sonrası siyasî, iktisâdî, ilmî ve dinî açıdan büyük önem taşımaktadır. Bu çalışma kapsamında Belh Şehri farklı boyutlarıyla ele alınmaya çalışılmıştır. Çalışma, üç bölümden oluşmaktadır. Giriş kısmında araştırmanın amacına, önemine, izlediğimiz metot ve kaynaklarına değinilmiştır. Birinci bölümde, İslam hukuku litaratüründe siyaset-i şer'iyye teriminin kelime ve terim anlamları verildikten sonra İslam hukukundaki yeri, amacı, yararı, yetki tanıdığı kişiler ve ilişkili olduğu diğer alanlar açıklanmaya çalışılmıştır. İkinci bölümde ise, Belh'te siyaset-i şer'iyye açısından önemli rol oynayan bazı fakihler anlatılmaya çalışılmıştır. Çalışmanın son bölümünde ise, İslam ordusu tarafından Belh'in fethi, İslamî ilimler açısından önemli bir merkez oluşu, Arap coğrafya ve tarih yazarları tarafından Belh'e verilen değişik lakaplar, İslamî ilimlerin tahsîli için Belhli gençlerin başta Medine olmak üzere Hicaz, Basra, Kûfe ve Bağdat şehirlerine seferleri, Belh fakihlerinin imam Ebu Hanife'ye intisâp etmeleri, siyasî ve ilmî açıdan Bağdat ve Belh ilişkileri ve nihayet Belh fakihlerinin siyaset-i şer'iyye'ye dair belirttikleri bazı görüşleri ve Hanefîlerle karşılaştırılması anlatılmaya çalışılmıştır."
