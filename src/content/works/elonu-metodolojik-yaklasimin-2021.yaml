abstract: "Sünnet, mana ve muhtevasını vahyin belirlediği, İslam'ın tebliğ, tebyin ve tatbik seyrinin tabiî sonucu, fıtrat ve dinin müşterek zeminidir. İslam'ı yaşayış biçimine istikamet olan sünnet, boyutları aşan derinlik, genişlik ve muhtevası ile dinin aslını teşkil etmektedir. Nasları doğru anlama ve anlamlandırma çabasının bir sonucu olarak ortaya çıkan ve zaman içinde sistemleşen kelam, hadis, fıkıh ve fıkıh usûlü gibi İslamî ilimler, sünnet mefhumunu, geliştirdikleri metodolojilerinin sınırları ve bağlamı içerisinde tanımlamıştır. Sınırları içerisinde birbirinden farklı sünnet yaklaşımlarının şekillendiği İslam ilim metodolojileri, sünneti ıstılahî düzlemde ele alarak, dinde kendisine tabi olunması istenen nebevî söz ve fiillere yaklaşımlar üzerinde, bazı etki ve sonuçların ortaya çıkmasına sebep olmuştur. Giriş ve iki ana bölümden oluşan çalışmamızın birinci bölümünde, genelde İslami ilimlere yönelik metodolojilerin, temelde ise fıkıh ve fıkıh usûlü ilimlerinin sünnete yaklaşımları incelenmektedir. Çalışmamızın ikinci bölümünde ise fıkıh ilminde mendup/sünnet hükmü ile isimlendirilen nebevî uygulamaların, bu hükümlerin kaynağı olan üç farklı hadis özelinde hakikatte ne ifade ettiği izah edilmektedir. Sonuç kısmında ise, çalışmamız ile dikkat çekmek istediğimiz husus, tezde yer alan bilgiler ve verilerden hareketle değerlendirilmektedir."
