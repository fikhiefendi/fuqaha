abstract: "Çocuğa genel olarak hayatının her evresinde bir çocuk dense bile, yasal statüleri açısından ilgili hükümlerin sağlanması için farklı fıkhî durumlar bulunmaktadır. Özellikle“rüşd”ve“bulûğ”evrelerinin öz olarak benzerlikleri ve farklılıkları alimler tarafından farklı şekillerde yorumlanmıştır. İslâm Hukuku ise bu iki dönem ile ilgili pek çok ayrıntılı açıklamaya sahiptir. Kişinin din ve hukuk karşısındaki yetkinliğini ifade eden ehliyet kavramıyla doğrudan ilişkili olan bulûğ ve rüşd kavramlarının inceleme konusu edildiği bu çalışma iki bölümden oluşmaktadır. Çalışmamızın birinci bölümünde insan hayatının evreleri, ehliyet kavramı ve ehliyet arızaları gibi konular üzerinde durulmuş, İslâm Hukuk doktrininde ehliyet dini-hukukî açıdan incelenmiştir. Çalışmamızın ikinci bölümünde ise bulûğ-rüşd ilişkisinin fıkhî / hukukî sonuçları ele alınmıştır. İslâm hukuk doktrininde bulûğ ve rüşd yaşı konusundaki farklı değerlendirmelere de değinilmiştir. Çocuğun tasarrufları araştırılmış, hak ve sorumlulukları üzerinde değerlendirmeler yapılmıştır. Farklı İslâm düşünürlerinin görüşleri üzerinde durulmuştur."
