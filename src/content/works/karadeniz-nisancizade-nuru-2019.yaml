abstract: "Nişancızâde, on yedinci yüzyılda yaşamış bir Osmanlı fakihidir. O, Nûru'l-'Ayn fi Islahî Câmi'u'l-Fusûleyn adlı bir eser kaleme almış ve bu eserde Şeyh Bedreddin'e ait olan Câmiû'l-Fusûleyn'e yönelik iyileştirici çalışmalar gerçekleştirmiştir. Nişancızâde bu eserinde Şeyh Bedreddin'in muâmelât ve yargılama hukukunda uzun yıllar kullanılan Câmi'û'l-Fusûleyn adlı eserini düzenlemiş, ilave başlıklar koymuş, bazı başlıkları çıkarmış, yer yer de Şeyh Bedreddin'i eleştirip alternatif fetvalar nakletmiştir. Biz de yaptığımız çalışmada Nişancızâde'nin Nûru'l-'Ayn adlı eseri yazma sebebi olan iyileştirici çalışmaları ön plana aldık. Osmanlı döneminde kâdılık, müderrislik hatta kazaskerlik yapan çok yönlü bir alimin kendi döneminde kâdılar tarafından kullanılan eserinin ilim dünyasına kazandırılmasını hedefledik. Çalışmamız iki bölümden oluşmaktadır. Çalışmanın ilk kısmında Nûru'l-'Ayn'ın 12-19. Fasılları ile Câmi'û'l-Fusûleyn'ın 12-19. Fasılları arasını üslup ve telif tarzı yönüyle karşılaştırdık. Bu bölümde özellikle Nişancızâde'nin Şeyh Bedreddin'den farklı bir metot izlediği tasarruflarına odaklandık. İkinci bölümde tahkik çalışması gerçekleştirdik. Bu bölümde müellif hatlı Topkapı Sarayı nüshası ile Âşır Efendi nüshasını temel aldık."
