abstract: "Bu araştırmanınbaşlığı:“Günümüz Mali İşlemlerininŞafiiMezhebindekiHükümleri”dirvearaştırmacıbuçalışmadagünümüzmaliislemlerinbazılarınınŞafiMezhbinegörehükümlerinielealmıştır. Bu çalışmagünümüzmalikonularınelealınmasındaaraştırmacılarınmenhecinibelirlemedebüyükönemarzetmektedirve İslam hukundaönemarzedenvebazıtehlileribarındanmeselelerdendir.Öylekibuaraştırmagünümüzekonomikvemalimeselelereçözümbulmadafıkıhmezheplerinindöneminedönmeyeöncülükedeceğindendeğeriartmaktadır. Çalışma, mukaddimevetanıtım,dört fasıl vesonuçtanoluşmaktadır: Giriş: Araştırmacıbukısımdaaraştırmanınönemi,hedefleri,araştırmakonusunuseçmesebebini,araştırmanınmenhecivedahaönceyaptığıçalışmalarveokumalarıelealmıştır. Tanıtımbölüm :Bubölümdearaştırmacı ilk fasılda ; konuileilgilimüfredatlarıntanımlarına , ikincibölümde ;günümüzmalimeselelerineçözümbulunmasıaraştımakonusununtanımınıelealmıştır. Bölüm I: Bu bölümdearaştırmacısatış (bey')manasını,şartlarını,rukünlerini,kaidelerinivebey' menhanhkonularınaaçıklıkgetirmiştir. Bölüm II: Araştırmacıbubölümdebankamevduatvekredikartlarıaracılığıya para almakilgilibankacılıkişlemlerinisunmuştur. Bölüm III: Araştırmacıbubölümdemüşterilerinyatırımişlemleriileilgilibankatarafındanyürütülençeşitlibankacılıkişlemlerinielealmışvesunumuaracılığıylatümiyiyatırımfonlarıileilgilibankacılıkişlemleriniaraştırmışvebizesunmuştur. Bölüm IV: Araştırmacıbubölümdesigortanınhükümünüaraştırmış,özelliklerini,kısımlarınıvefıkhiçıkarımlarınıbizleresunmuştur. Sonuç: Araştırmacıbubölümdearaştırmaboyuncaulaştığıenönemlisonuçlarıvetavsiyerianlatmıştır"
