abstract: "ÖZET Anayasa tarafından güvence altına alınmış olan mülkiyet hakkı, sahibine en geniş yetkiler veren mutlak bir haktır. Mülkiyet hakkı, sahibine bir şey üzerinde dilediğini şekilde kullanma (usus), fadyalanma (fructus), tasarruf etme (abusus) yetkisi verir. Ancak malik bu yetkileri içeren mülkiyet hakkını kullanırken sınırsız bir özgürlüğe sahip değildir. Gerçekten de bu yetkileri, başkalarına zarar vermemek ve kanunların koyduğu sınırlamlara uymak şartıyla kullanabilir. Mülkiyet hakkına kamu hukuku ve özel hukuk alanında bir takım sınırlamalar getirilmiştir. Özel hukuk alanındaki bu sınırlamalardan biri de MK. 920. maddesinde sayılan tararruf hakkı sınırlamalarıdır. Kanun koyucu ayni hak olmadığı için tapuya keydedilemeyen ancak yükümlüsü dışındaki kişilere de etkili olması zorunluğu bulunan sınırlı sayıda haklar için şerh müessesesini kabul etmiş ve böylece hak saliplerinin hakkını güvence altına almıştır. Medeni Kanunun 920. maddesi; nitelikleri, hukuki etki ve sonuçlan farklı tasarruf hakkı sınırlamalarını bir araya getirmiştir. Bunlar; çekişmeli hakların korunması ve icra edilebilir kararlar, haciz, iflas ilanı, konkordato mühleti, mirasçı atanması ve aile yurdu şerhleri ile getirilen sınırlamalardır. Hukuki sonuç bakımından genel kural Medeni Kanunun m. 920 'de sayılan şerhe konu tahditlerin malikin tasarruf yetkisini tümden yasaklamayacağıdır. MK. 920. madde hükmü ile getirilen tasarruf hakkını sınırlayan hallerle ilgili olarak, bu hususları düzenleyen özel hükümlerin de aksine bir kural getirilmediği takdirde MK. m. 920/2 fıkrasının varlığı karşısında, taşınmaz malikinin tasarruf yetkisi kalkmamakta ancak şerh sahibinin hakkı sonraki hak sahibi maliklere karşı ileri sürülebilme özelliğini devam ettirmektedir. Diğer bir deyişle şerhe rağmen hak kazanan şahıs, şerh ile güvence altına alınmış olan hakkın ifasına katlanma yükümlülüğü vardır."
