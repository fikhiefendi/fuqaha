abstract: "Tarımın finansmanı konusu Türkiye'de finans sektörünün gelişim sürecinin merkezinde yer almaktadır. İktisadi faaliyetteki payı giderek azalmasına rağmen tarım sektörü ekonomik ve sosyal önemini muhafaza etmektedir. Buna mukabil 150 yılı aşan kurumsal tarım finansmanı tarihimizde şimdiye kadar İslami finansın sunduğu imkânlardan yeterince yararlanıldığını iddia etmek güçtür. Zira bankaların tarım kredilerinin %98'inden fazlası konvansiyonel bankalar tarafından sunulmakta, ülkemizdeki 6 katılım bankasının tarım kredilerinden aldığı pay ise 2019 yılı itibariyle %1.9 seviyesinde görülmektedir. Bu durum katılım bankalarının 2025 yılı stratejik hedeflerine ulaşmaları açısından önemli bir gelişme alanı olarak değerlendirilmektedir. Ayrıca bankalar dışında tarımın finansmanı alanındaki en önemli kaynak olan Tarım Kredi Kooperatifleri (TKK)'nin de İslami finansa yönelik artan bir ilgisi bulunmaktadır. Bu çalışmada Türkiye'de tarımın finansmanında kullanılabilecek Mudaraba, Müşareke, Muzaraa, Musakat, Muğarese, Murabaha, Bey'ul Ecel, Selem, İstisna ve İcare gibi İslami araçlar açıklanmaktadır. Araştırmanın saha çalışması olarak çiftçilerin İslami finans ve katılım bankacılığına yönelik bilgi düzeyi, tutum ve tercihlerini ölçmek üzere 37 ilde TKK ortağı 1902 çiftçiyle bir anket çalışması gerçekleştirilmiştir. Elde edilen veriler Lojistik Regresyon, ki-kare (χ2), Pearson korelasyon, bağımsız gruplar t testi, tek yönlü ANOVA testi gibi istatistiksel yöntemlerle analiz edilmiştir. Elde edilen sonuçlara göre çiftçilerin %10'undan daha azı katılım bankalarıyla çalışmakta ve yaklaşık %60'ı ise katılım bankacılığı hakkında hiçbir şey bilmediklerini ifade etmektedirler. Katılımcıların yaş, eğitim seviyesi, gelir seviyesi, tarım dışı gelir durumu, tasarruf imkânı gibi demografik/ekonomik özellikleri ile katılım bankaları ile çalışma durumları ilişkilidir. Çiftçilerin katılım bankalarıyla çalışma olasılıklarının katılım bankacılığı bilgi düzeyi, katılım bankacılığının dine uygunluk algısı, tasarruf kabiliyeti gibi özelikleriyle pozitif; maliyet hassasiyeti ve yaş gibi özellikleriyle ise negatif ilişkisi tespit edilmiştir."
