abstract: "Osmanlı mahkeme kayıtları, sosyo-kültürel açıdan önemli bilgi ve kayıtlar içererek geçmişin aydınlatılmasında önemli bir rol oynayan kıymetli yazılı kaynaklardan birisidir. Bu belgeler ait oldukları dönem ve yeri hakkında önemli bilgiler içermektedir. çalışmamız bu mahkeme kayıtlarından Gaziantep'e ait olan 66 numaralı şer'iyye sicil defteridir. Gaziantep'te tasnifleri yapılan defterler toplam 174 adettir. buna göre; Gaziantep'e ait ilk defter H.938/ M.1531-1532 tarihlidir. En son defter ise H.1327/ M.1909-1910 tarihlidir. Bu çalışmamız, Türk tarihi ve kültürü açısından büyük bir önem taşıyan Şer'iye Sicillerinden H.1126-1127/M.1714-1715 tarihlerini kapsayan Gaziantep'te tutulan şer'î mahkeme kayıtlarını içermektedir. Toplam 257 sayfadan oluşan bu sicil defterinde 23 adet idari ve 535 adet de hukuki içerikli toplam 558 adet belge bulunmaktadır. Defter iki taraflı kullanılarak bir tarafına merkezden gelen arzuhaller, nişân-ı şerîfler, fermanlar ve buyruldular gibi idari içerikli belgeler diğer tarafında ise miras, nafaka, vasi tayini, boşanma, alacak verecek gibi hukuki içerikli belgeler kaleme alınmıştır. Bu defter ışığında dönemin Gaziantep'inin idari, sosyal, kültürel, ekonomik durumu ortaya konulmaya çalışılmıştır. Transkripsiyonu yapılan belgelerin içerikleri, diplomâtik özellikleri, hicri ve miladi tarihleri kısa belge özetleri ile birlikte her belge için ayrı bir tablo içerisinde sunularak okuyucuya kolaylık sağlanmaya çalışılmıştır."
