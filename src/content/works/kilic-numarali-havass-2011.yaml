abstract: "Şer'iyye sicilleri XV. asrın ortalarından XX. asrın ilk çeyreğine kadar olan dönemin hukuki, içtimai ve siyasi kaynakları olup, siciller muhtevasında yargı yetkisine sahip olan kadıların vermiş oldukları kararları, idari, siyasi ve hukuki yazışmaları içeren, birinci elden kaynak niteliğinde olan önemli tarihi vesikalardır.Sosyal, iktisadi, ticari, askeri, siyasi tarihimizin aydınlatılması adına büyük bir öneme haiz olan şer'iyye sicilleri şehir tarihleri araştırmalarında ise vazgeçilmez bir kaynaktır. Siciller vasıtasıyla sicilin ait olduğu dönemde ait olduğu yerin yaşam tarzı, bölgenin etnik yapısı, halkın ekonomik durumu, hukuki yapının işleyişini öğrenebilmek mümkündür.Tez konumuzu oluşturan 15/573 numaralı Havass-ı Refia Şer'iyye Sicili İstanbul'da Müftülük dâhilinde bulunan Şer'iyye Sicilleri Arşivinde bulunmakta olup, söz konusu yerden temin edilmiştir.İçerisinde 114 adet belge bulunan H. 1311?1332/M. 1894?1895 tarihli 15/573 numaralı Havass-ı Refia Şer'iyye Sicilinin çevirisi ile söz konusu yıllar içerisinde bölge halkının yaşam tarzı, geçim kaynakları, ekonomik yapı, aile yapısı, sosyal hayat vb. konularda bilgi sahibi olmaktayız."
