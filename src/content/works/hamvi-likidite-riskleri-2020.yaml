abstract: "Geleneksel bankalar ve Katılım bankalarının arasında benzerlik ve farklılık vardır ve ikisinde de likidite nasıl yönetileceği çok büyük bir önem taşımaktadır. Likidite yönetimi bankaların karşılaştığı en önemli zorluklarından biridir. Likidite konusunda günümüzde katılım bankaları birkaç sorunla karşılaşabilir çünkü Katılım bankaları İslam hukukuna göre çalışmaktadır. Bu yüzden bazen onun likiditesi geleneksel bankalardan daha fazla olabilir. Bu çerçevede katılım bankaları paraya ihtiyaç duyunca merkez bankasından ya da herhangi bir taraftan faizle kredi alamaz. Ama geleneksel bankalar daha esnek bir davranış gösterebilir. Ek olarak Katılım bankalarının kullanabileceği finansal enstrümanlar geleneksel bankalara göre belki daha az çünkü finansal enstrüman İslam hukukuna aykırı olmaması gerekmektedir. Geleneksel bankalar kuruluşunun tarihi katılım bankaları kuruluşunun tarihinden daha eski olduğu için, geleneksel bankaların tecrübe yılları finansal araçlara pozitif bir şekilde yansıtılıp çeşitli finansal araçlar bulunmaktadır. Finansal mühendisliği yardımıyla katılım bankaları yeni finansal enstrümanlarını bulabilmektedir. Ancak bu katılım finansal enstrümanlar geleneksel enstrümanlara benzememelidir. Bu çalışmada bir kıyaslama yapmakla katılım bankalarının ve geleneksel bankaların likiditesini nasıl yönettikleri, bir de paralarının darlığını ortadan nasıl kaldırabileceği anlatılmıştır."
