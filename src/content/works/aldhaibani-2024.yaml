abstract: "Bu çalışmanın amacı, Yemen Et-Tedâmün İslam Bankası'nda uygulanan proje finansmanı sözleşmelerini AAOIFI'nin Şer'î uyum kriterleri ışığında değerlendirmektir. Araştırmacı, Yemen Et-Tedâmün İslam Bankası'ndaki finansman sözleşmelerinin mevcut durumunu açıklamak ve bu sözleşmeleri AAOIFI'nin Şer'î uyum standartları ışığında eleştirel bir şekilde incelemek için tanımlayıcı-analitik bir teknik kullanıldı. Analiz, bankanın proje finansman uygulamalarının Şer'î normlarına uygun olduğunu sonuçlandırmaktadır. Dayanışma Bankası'ndaki müşareke ve mudarebe finansman sözleşmelerinin, müşareke ve mudarebe ile ilgili şeriat standardı hükümleriyle tamamen uyumlu olduğu sonucuna varılmıştır. Ayrıca, analiz, murabahah sözleşmesinin, paralel murabahah sözleşmesinin ve kiralama satın alma sözleşmesinin genel olarak AAOIFI gereksinimleriyle uyumlu olduğunu, ancak belirli unsurların bunlarla tam olarak uyumlu olmadığını bulmuştur. Çalışma, bankayı AAOIFI standartlarına aykırı olan sözleşme maddelerini gözden geçirmeye ve İslami bankaların şeriat denetim organlarına finansman sözleşmelerini periyodik olarak değerlendirmeleri tavsiyesinde bulunmuştur."
