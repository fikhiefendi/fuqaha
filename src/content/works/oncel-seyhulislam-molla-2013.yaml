abstract: "Şeyhülislamlar başta olmak üzere İslam âlimleri tarafından verilen fetvaların bir araya getirilmesiyle oluşan fetva mecmualarının Osmanlı ve İslam hukuk tarihi açısından büyük ehemmiyeti vardır. Ayrıca bu mecmualar, bir devletin sosyal, siyasi ve ekonomik yönüne ışık tutmaları bakımından tarihi öneme de sahiptirler. Osmanlı tarihi boyunca İbn-i Kemal ve Ebussuud Efendi'nin verdikleri fetvalar başta olmak üzere bazı fetva mecmuaları ön plana çıkmış, bunlardan Fetâvâ-yı Ali Efendi, Behcetü'l-Fetâvâ gibi bazı eserler, Osmanlı kadılarının başucu kitabı olmuştur. Bunlar arasında bir de unutulup giden yahut pek bilinmeyen bazı fetva mecmuaları daha vardır ki bu çalışma, böyle az bilinen bir eseri ve sahibini tanıtıp incelemeyi amaçlamaktadır. Bu fetva mecmuası, Osmanlı şeyhülislamlarının yedincisi olup Molla Arab diye bilinen Mevlana Alaeddin el-Arabi'nin fetvalarının toplanmasıyla oluşmuş bir eserdir. Tezin birinci bölümünde, Molla Arab'ın hayatı ve eserleri incelenmiştir. İkinci bölümde fetva mecmuası; nüshaları ve muhtevası gibi noktalardan gözden geçirilip hukuki bakımdan ele alınmıştır. Üçüncü bölümde ise mecmuanın 1b-33b varakları arasının transkripsiyon ve tercümesi verilmiştir."
