abstract: "Bu çalışmada VIII-XI. (XIV-XVVII.) yüzyıllarda yüzyıllarda Âcurrûmiyye metni üzerine kaleme alınan şerhlerin ve müelliflerinin zaman ve mekân haritası çıkarılmaya çalışılmıştır. Müelliflerin yaşadığı coğrafya, hocaları, talebeleri, fıkhî mezhebi, vefat tarihi belirtilmek suretiyle müellife dair genel bir resim ortaya konularak Âcurrûmiyye şerh literatürü özelinde müellifin bu haritadaki yeri tespit edilmiştir. Böylece Âcurrûmiyye üzerine şerhi bulunan âlimlerin, gerek yaşadıkları dönem ve coğrafya, gerek tabi oldukları mezhep, gerekse hocalık-talebelik bağı gibi unsurlar üzerinden birbirleriyle olan ilişki ağı açığa çıkarılmıştır. Ayrıca tahkîki yapılmayan eserlerin yazma nüshalarına da atıf yapılarak, ilim dünyasına kazandırılmayı bekleyen eserler, araştırmacıların dikkatine sunulmuştur."
