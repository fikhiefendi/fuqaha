abstract: "Bu çalışma, Kamu Gözetimi, Muhasebe ve Denetim Standartları Kurumu tarafından yayımlanmış olan Faizsiz Finans Muhasebe Standartları ile Türkiye Muhasebe ve Finansal Raporlama Standartları arasındaki benzerlik ve farklılıkları faizsiz fon kullandırım yöntemleri açısından incelemek amacıyla yapılmıştır. Bu amaçla, Türkiye'deki faizsiz finans alanında faaliyetlerini sürdürmekte olan kurumların fon kullandırım usullerine (murabaha, müşâreke, mudârebe, selem, istisnâ, icâre) ilişkin uygulama esasları ile bu esaslar doğrultusunda oluşması gereken muhasebe kayıtları incelenmiş, elde edilen bulgular Türkiye Muhasebe ve Finansal Raporlama Standartları uygulamaları ile karşılaştırılarak, Faizsiz Finans Muhasebe Standartlarına uyum için yapılması gerekli düzenlemelerin ortaya konulması amaçlanmıştır. Çalışma sonucunda muhasebeleştirme işlemlerine ilişkin temel prensiplerin her iki standart setinde de benzerlik gösterdiği, diğer taraftan muhasebe kayıtları arasındaki ayrışmaların temelinde gerçekleşen işlemlerin biçim ve öz açısından farklı değerlendirilmelerinin, değer ölçüm uygulamalarındaki farklılıkların, paranın zaman değeri ile ilgili görüş farklılıklarının ve sermaye benzeri hesaplar ile ilgili değerlendirme farklılıklarının bulunduğu tespit edilmiştir. Faizsiz Finansın ve ilgili Muhasebe Standartlarının ülkemizde etkili, verimli ve usule uygun bir şekilde uygulanabilmesine yönelik çözüm önerilerine yer verilerek çalışma tamamlanmıştır."
