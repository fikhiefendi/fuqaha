abstract: "ÖZET Boşanma olgusu ve kentleşme süreci arasındaki ilişkini nin incelenip analiz edildiği bu çalışma altı ana bölümden oluşmaktadır. Birinci bolüm olan girişten sonra kentleşme süreci nin aile üzerindeki etkileri incelenmiştir. Ülkemizde de hızlı kentleşmeden dolayı şehirler büyümekte, fonksiyonlar çeşitlen mektedir. Kentlerdeki toplumsal değişme bireyler arasındaki yüzyüze ilişkileri etkilemektedir. Bu ilişkiler kişilik dışı ve çıkar ilişkisi haline gelmektedir. Karmaşık işbölümü ve yüksek uzmanlaşma modern toplumların özelliğidir. Geleneksel toplumlarda aile ekonomik bir birimken sanayi merkezlerinde yavaş yavaş tüketim birimi halini almaya başlamıştır. Kent leşmenin en belirgin sonuçlarından biri geleneksel geniş ailenin yerini çekirdek ailenin almaya başlamasıdır. Üçüncü bölümde aile kurumu Türk Hukuk Sistemi açı sından incelenmiştir. Türk Medeni Kanunu 1926 yılında yürürlü ğe girmiş ve din kurumunun aile üzerindeki hukuksal etkisini ortadan kaldırmıştır. Evlilik resmi bir törenle kurulmakta ve boşanma yasal koşullar varolduğunda gerçekleşt iri lebi lmektedir. Bu çok önemli bir değişikliktir, çünkü Osmanlı döneminde aile İslam yasalarınca düzenlenmekte ve boşanma yasaları kadını aşağılamakta ve küçük düşürmekteydi. Bugün, Aile Hukuku kadın ve erkeğe boşanmayı isteme konusunda eşit haklar vermektedir. Dördüncü bölümde boşanma sosyolojik açıdan incelenmiş tir. Ailede gerilimler yaşandığında genelde kadın kocasıyla IIIarasındaki maddi bağı koparmakta güçlük çekmektedir. Çünkü pek çok kadın için ekonomik anlamda bağımsızlık sözkonusu değildir. Bu bölümde, ailede çözülmenin çocuk üzerindeki etkileri de incelenmiştir. Çünkü çocuk boşanmadan önce, boşan ma sırasında ve sonra da derin yaralar almaktadır. Beşinci bölümde toplanan veriler analiz edilmiştir, önce, Devlet istatistik Enstitüsünün yayınlarında yer alan boşanma verileri incelenmiş ve değerlendirilmiştir. Toplanan ve- lere göre varılan sonuçlar şöyledir: -1988 yılındaki boşanma oranı %o 0.41dir. -En önemli boşanma nedeni geçimsizliktir. (%o 90.2) -Boşanan çiftlerin %56'sı ilkokul mezunudur. -Toplam boşanmaların %60'mda davacı taraf kadındır. Bu oran kentlerde %63'dür. Boşanma oranları anakentlerde daha yük selmekte ve en yüksek oran İstanbul'da gerçekleşmektedir. İkinci olarak, yapılan belgesel gözlemde 40 dava dosyası rastlantısal yöntemle seçilmiştir. Bu araştırmanın sonuçları şöyledir: -Davacı kadın oranı %65'dir. -Gerçekleşen boşanmaların %52.5'unda çiftler evlilikle rinin beş yılını yaşayan bireylerdir. -Boşanan çiftlerin %92.5'u çocuksuz ya da tek çocukludur. Elde edilen dosyalar teker teker incelendiğinde bo şanma nedeninin“geçimsizlik”olduğu görülmüştür. Üçüncü olarak, verilere ek olarak Bakırköy Kadın Sığınma Evinin danışmanıyla görüşülmüştür. Bu kurum kocası IVtarafından saldırıya uyrayan kadınlara yardım etmeyi amaçlamaktadır. Kurum açıldıktan sonra geçen altı ay süresince 200 kadın ve çocuğa yardım edilmiştir. Şimdi ise 32 kadın kalmakta ve 700 kadın ise sırada beklemektedir. Sonuç olarak: -Boşanma evlilik kadar eski bir kurumdur. -Çiftler arasındaki yasal bağı ortadan kaldırıcı ey lem olan boşanma eşler arasındaki manevi çözülmeyi açıklayama- maktadır. -Kentli aileler kırsal alanlardaki ailelere oranla boşanmaya ve çözülmeye daha uygun bir yapıya sahiptirler. Bunun nedenleri, toplumsal devinim, yakınların çekirdek aile üzerindeki etkisinin azalması, yabancılaşma ve anomi, kadın ların iş yaşamına katılması, ekonomik güçlükler, boşanmayla ilgili anlayışta değişimlerin meydana gelmesi, cinsel eğitim eksikliği...vb."
