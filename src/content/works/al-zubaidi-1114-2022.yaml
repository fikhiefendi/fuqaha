abstract: "Debbağzade'nin Kadı Beydâvi'ye ait Amme cüzü tefsiri üzerindeki el yazma haşiyesi önemli haşiyelerden kabul edilmektedir. Zira bu haşiyeyi Kadı Beydâvi'nin tefsirinin üzerinde telif etmiştir. Müellif, tefsirinde birçok yönü ele almış ve birçok fikirden bahsetmiştir. Nitekim bu çalışmasında kendisinde mevcut olan tüm ilmi birikimini serdetmiştir. Başından sonuna kadar tek bir metot izlemiştir. Kadı Beydâvi'nin tefsirini kelime kelime incelemiş, Beydâvi'nin kelimelere ilişkin maksadı konusunda uyarılarda bulunarak üzerine not düşmüş ve şerh etmiştir. Birçok konuda İmam Zemahşerî'nin tefsiri ile bunları karşılaştırmıştır. Müellifin çoğunlukla odak noktası, tefsirin dilsel yönleri üzerine olmuş ve diğer şer'i ilimlerden nadiren bahsetmiştir. Zira haşiyesinin nebevi hadisleri ve rivayet edilmiş eserleri delil göstermekten yoksun olduğu görülmektedir. El yazmaları bir araya getirilmiş ve üzerinde çalışılmıştır. Ayrıca metinle ilgili orijinal nüshalar seçilerek diğer nüshalarla karşılaştırılmış ve notlardaki farklar kaydedilmiştir. Araştırma müellif hakkında isminin, nesebinin, doğumunun, hocalarının, talebelerinin, telif eserlerinin ve ölümünün belirtildiği bir çalışma ile sunulmuştur. Daha sonra araştırmanın konusu olan el yazmasının adı, müellifinin nispeti ve izlediği yöntem ile birlikte bu hâşiye tüm yönleriyle incelenmiş, müellifin alıntı yaptığı en önemli kaynaklar da bu bağlamda belirtilmiştir. Araştırmanın sonuç kısmında ise, hâşiye üzerinde yapılan bu çalışma sırasında elde edilen neticeler ve sunulabilecek önerilere yer verilmiştir."
