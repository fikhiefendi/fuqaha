abstract: "Vakf Ve İbtida İhtilafları Türkiye Diyanet İşleri Başkanlığı Mushafı İle Medine Mushafı Arasında Mukayeseli Tahlil Çalışması YAKAN, Omar Doktora, Kur'ân-ı Kerim Okuma ve Kıraat İlmi Anabilim Dalı Tez Danışmanı: Doç. Dr. Aydın KUDAT Temmuz 2024, 500 sayfa Vakf ve ibtidâ ilmi, Kur'ân metninin anlaşılmasında ve ayetlerin ahenk ve düzeninde büyük bir etkiye sahip olduğundan, Kur'ân ilimleri arasında önemli bir yer tutmaktadır. Bu doğrultuda bu çalışma mukayese ve tahlillerde bulunmak suretiyle vakf ve ibtida konusunu ele almıştır. Çalışmada, bu alanın önde gelen ulemasının görüşleri de dikkate alınarak vakf ve ibtidanın gramer ve kıraat yönleriyle tahlilleri yapılmış ve ulemanın farklı görüşleri ortaya konmuştur. Daha sonra vakf ve ibtida olgusunun türleri açıklanmış ve Kur'ân-ı Kerim'de vakf yerleri ortaya konmuştur. Bütün bunlar yapılırken vakf ve ibtida konusu bağlamında Türkiye Diyanet Vakfı tarafından onaylanan Mushaf ile özel bir komisyon tarafından denetlenen ve Kral Fahd Külliyesi Basımevi tarafından onaylanan Medine mushafı karşılaştırılmıştır. Çalışma bir giriş, dört bölüm ve bir sonuçtan oluşmaktadır. Girişte konunun önemi, tercih nedenleri, metodu ve amaçlarından bahsedilmiştir. Birinci bölümde vakf ilminin mahiyeti, kökeni ve önemi, kaideleri ve görüşler, vakf yerlerindeki farklılıkların sebepleri ve vakf ilminin şerî ilimler üzerindeki etkisi ve onlardan etkilenmesi bu ilimle ilgili yazılan telifatın yöntemleri ele alınmıştır. İkinci bölümde Medine Mushafı ile Diyanet Mushaf'ı arasındaki resm, zabt ve bunların farklılıkları, Mushafları denetleyen komisyonlara ve dayandıkları temel kaynaklara ve kıraatlere değinilerek ele alınmıştır. Üçüncü bölümde, iki Mushafta yer alan tüm vakf yerleri bir araya getirilmiş ve bunlar vakf alimlerine göre karşılaştırılarak tablolar halinde gösterilmiştir. Bu tablolar Fatiha suresinden Nâs suresine Kur'ân-ı Kerim'in tüm surelerini içermektedir. Dördüncü bölümde ise her Mushaf'a özgü olan yerler ayrı ayrı sıralanmış, Bakara'daki vakf yerleri detaylı olarak ele alınmış, diğer surelerdeki vakf yerleri ise genel olarak tablolarda verilmiştir."
