abstract: "İslâm dininin temel kaynaklarından biri sayılan hadislerin tedvin ve tasnifiyle oluşan hadis külliyatının pratikte daha iyi anlaşılması için hadis âlimleri birtakım çabalar içine girmişlerdir. Bu çabaların en yoğun şekilde tezahürü şerhlerde görülür. Bu gayretlere binaen birtakım sebeplerden kaynaklı şerh yazım faaliyetleri oluşmuştur. Şerhlerin yazılma ihtiyacının tamamen bir anlama çabasının sonucu olarak görmemek gerekir. Bizce en önemli sebep bu olmakla birlikte anlama ihtiyacının dışında başka sebepler de mevcuttur. Bunun ilki şerhlerin genel olarak hem sened hem de muhteva ve metin açısından hadisleri anlama ve izah etme çabası, ikincisi de şârihlerin kendi iç dünyası veya çevresinin etkisiyle oluşan bir takım özel sebeplerdir. Çalışmamızda muhteva ve metin açısından hadisleri anlama çabasına etki eden bu sebeplerin neler olduğunu tespite çalıştık. Bir hadis eserini şerh etmek hiç kuşkusuz önemli bir gayretin sonucudur. Şârihlerin, genellikle bir anlama faaliyeti olarak değerlendirilen bu çabaları yerine getirirken oluşturdukları eserlerin sahip oldukları bazı özellikler şerhlerin genel yapıları hakkında bizlere bilgi vermektedir. Bu özellikler, hadislerden olumlu bazen de olumsuz bir şekilde istifade etmemize sebep olmaktadırlar. Şerhlerin sahip oldukları bu özellikleri hadislerin doğru anlaşılmasına katkıları yönünden inceledik. Hadis şerhlerinin günümüzde hadisleri anlamamıza etkilerini bazı nikâh ve talâk konuları üzerinden örnekleriyle işledik. Konuların hadis şerhlerinde nasıl ele alındıklarını incelemeye çalıştık."
