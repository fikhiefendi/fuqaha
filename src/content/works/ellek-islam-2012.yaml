abstract: ")İslam Hukukunda mali konularla ilgili sulh anlaşması, insanlar arasında çeşitli sebeplerle malla ilgili ortaya çıkan ihtilaf ve çekişmelerin karşılıklı anlaşarak çözüme kavuşturulmasıdır. Allah (c.c), Kur'an-ı Kerim'de sulhta büyük hayırlar bulunduğunu belirtmiş, Allah Rasulü (s.a.s) de helâlı haram, haramı da helâl kılmadığı sürece sulhun caiz bir muamele olduğunu bildirmiş, huzuruna gelen davalarda taraflara aralarındaki anlaşmazlığı sulh yoluyla çözmeleri konusunda tavsiyede bulunmuştur.Müslümanlar sulhla ilgili bu emir ve tavsiyelere uyarak, aralarında meydana gelen ihtilafları mümkün mertebe sulh yoluyla çözmek için gayret göstermişlerdir. Bu anlamda mahkemeye intikal eden davalarda taraflara sulh yoluyla anlaşmaları tavsiye edilmiştir. Hatta Osmanlı zamanında, davaların mahkemeye gitmeden halledilmesi için mahallelerde sulh meclisleri oluşturulmuştur. Böylelikle davaların azımsanmayacak bir kısmı sulh yoluyla çözüme kavuşturulmuş ve netice olarak da taraflar birbirine düşman değil, dost olmuşlardır.Hem fertler arasında hem de toplum içerisinde huzur ve barışın sağlanmasında, ekonomik ve sosyal hayatın gelişmesinde İslam Hukukundaki Sulh Akdinin önemli bir katkısı vardır. Malın el değiştirdiği akitlerle ilgili davalarda sulh olurken dikkat edilmesi gereken en önemli nokta ise, faiz yasağına uygun hareket etmektir.Anahtar Sözcükler: Sulh, Akit, Mal, ihtilaf, Anla?ma."
