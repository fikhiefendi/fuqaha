abstract: "Bu çalışmada, İslamda tesettür konusu temel kaynaklardaki yaklaşımlara bağlı kalınarak İslam hukuku çerçevesinde ele alınmıştır. Tez, üç bölümden oluşmaktadır. Birinci bölümde tesettürde tarihsel süreç araştırılmıştır. İkinci bölümde tesettürle ilgili kavramlar ele alınmıştır. İslam'da tesettür başlığında Kur'an ve sünnette tesettür, tesettürün illeti, hükmü, keyfiyeti, tesettürde ruhsat ve teşebbüh konuları işlenmiştir. Üçüncü bölümde tesettürün hikmet, iffet ve fitne ile ilişkisi, tesettür ziynet ilişkisi ve setr-i avret konuları ele alınmıştır. Sonuç kısmında tezde ele alınan konular kısaca analiz edilmiştir. Anahtar Kelimeler Tesettür, Avret, Ziynet, İffet, Kadın"
