abstract: "Bu tez, önceki hukukumuzda definelerin hukukî statüsünü, mülkiyet ve vergilendirme cihetlerinden ortaya koymayı hedeflemiştir. Bu maksatla incelenen ve Osmanlı Devleti'nde hâkimlere kaynaklık eden fıkıh kitapları, fetva mecmuaları ve kanunnâmeler, çalışmanın teorik esasını teşkil etmiştir. Teorik hükümlerin, nasıl hayata geçtiğini görmek adına mahkeme kayıtları ve Osmanlı arşivleri taranmış, elde edilen vesikalar tetkik edilmiştir. Definenin türü ve bulunduğu yere bağlı olarak malikin kim olacağına dair esaslar ele alınmış, define vergisinin tahakkuk etmesi için gereken şartlar, verginin tahsili ve nasıl sarf edileceği ortaya konmuştur. Yapılan çalışma neticesinde kaynaklardan elde edilen teorik bilgilerin, Osmanlı tatbikatına umumî hatlarıyla yansıdığı; hukukun boşluk bıraktığı sahalarda, esas hukukî çerçeveye uygun usullerin geliştirildiği anlaşılmıştır."
