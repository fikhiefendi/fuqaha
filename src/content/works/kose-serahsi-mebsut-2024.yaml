abstract: "İslam âlimleri fıkhî hükümlere kaynaklık etmesi bakımından Kur'an'dan sonra sünnetin ikinci önemli kaynak olduğu üzerinde ittifak etmişlerdir. Sünnet sıhhat ve bize ulaşması bakımından tasnife tabi tutulduğu gibi mahiyet bakımından da kavlî, fiilî ve takrîrî olmak üzere üçlü bir tasnife tabi tutulmuştur. Her ne kadar bu tasnif hususunda âlimler ihtilaf etseler de sünnetin fıkhî hükümlere mesned teşkil edeceği üzerinde ittifak etmişlerdir. Bu çalışmanın konusunu oluşturan takrîrî sünnet, Peygamberimizin (s.a.v.) doğrudan veya dolaylı olarak tasvip ettiği ve onayladığı durumlardır. Fukaha kavlî ve fiilî sünnetle istidlalde bulunduğu gibi yeri geldiğinden takrîrî sünnetle de istidlalde bulunmuşlardır. Bu fakihlerden biri de Hanefî mezhebinin önde gelen âlimlerinden biri olan Şemsü'l-eimme es-Serahsî'dir. Hanefî fıkıh literatürünün ilk en hacimli kitabı olan Mebsût'u kaleme alan Serahsî, bu eserinde Hanefî mezhebinin görüşlerini delilleriyle beraber zikretmiş zaman zaman diğer mezheplerin görüş ve delillerine de yer vermiştir. Bu yönüyle söz konusu eser daha sonraki Hanefi fıkıh literatürüne de kaynaklık etmiştir. Bu çalışmada Serahsî'nin söz konusu eserinde takrîrî sünnetle istidlalleri konu edilmiştir. Diğer bazı önemli Hanefî kaynaklarına da atıfta bulunularak yani takrîrî sünnetlerin çokça delil olarak kullanıldığı tespit edilerek kaynak olarak sünnete verilen değerin ortaya koyulması hedeflenmiştir. Ayrıca Serahsî'nin takrîr mahiyetindeki bazı rivayetlerden genel ilkeler oluşturmak suretiyle takrîrî sünnetin kaynaklık ettiği hükümler sahasını genişlettiği görülmüştür."
