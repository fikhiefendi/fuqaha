abstract: "Bu çalışmanın amacı bireylerin İslami finansal okuryazarlık düzeyini temel finans ve ekonomi, İslami finans prensipleri, katılım bankacılığı ve İslami finans ürünleri olmak üzere dört alt boyutta ölçmek ve İslami finans okuryazarlık düzeyinin bütçeleme ve tasarruf eğilimleri üzerindeki etkisini ortaya koymaktır. Bu amaç doğrultusunda Türkiye'de yaşayan 530 katılımcıya anket uygulaması yapılmış ve toplanan bu veriler SPSS 24 programıyla analiz edilmiştir. Yapılan analiz sonucunda bireylerin temel finans ve ekonomi bilgisi düzeyinin yüksek, İslami finans prensipleri bilgi düzeyinin düşük, katılım bankacılığı ve İslami finans ürünleri bilgi düzeylerinin ise orta düzeyde olduğu tespit edilmiştir. Ardından İslami finans okuryazarlık düzeyinin demografik özelliklere göre farklılık gösterip göstermediğini belirlemek amacıyla dört alt boyut için ayrı ayrı analiz yapılmıştır. Buna göre bireylerin İslami finans okuryazarlık düzeyi yaş, meslek, eğitim düzeyi, aylık gelir, ailelerinde finans sektöründe çalışan birinin olup olmaması, tercih edilen banka türü değişkenlerine göre her dört alt boyutta da farklılık göstermiştir. Bununla beraber bireylerin medeni durumu katılım bankacılığı bilgi düzeyinde, banka hesap sahipliği ise temel finans ve ekonomi bilgi düzeyinde anlamlı farklılık göstermezken faizli bankayı tercih eden bireylerin İslami finans okuryazarlık düzeyi faizli bankayla çalışma nedenlerine göre hiçbir alt boyutta anlamlı şekilde farklılaşmamıştır. Çalışmada bireylerin İslami finans okuryazarlık düzeyi bütçeleme ve tasarruf eğilimine göre de değerlendirilmiştir. Elde edilen sonuçlar tasarruf yapan bireylerin İslami finans prensipleri ve ürünlerine ilişkin bilgi düzeyinin daha yüksek olduğunu, yine her ay düzenli olarak tasarruf yapanların İslami finans prensipleri konusunda yılda bir defa tasarruf yapanlara göre daha başarılı olduğunu göstermiştir. Ayrıca tasarruf yapmayan bireylere gelecekte tasarruf planı olup olmadığı da sorulmuş ve görülmüştür ki yakın gelecekte tasarruf yapmayı planlayanların temel finans ve ekonomi bilgi düzeyi tasarruf planı olmayanlardan daha yüksektir. Bireylere bütçe yapıp yapmadığı sorulduğunda ise aylık ya da haftalık bütçe yapanların temel finans ve ekonomi bilgisi ile İslami finans ürünlerine ilişkin bilgisinin bütçe yapmayanlara göre daha yüksek olduğu anlaşılmıştır. Son olarak bireylere son altı ay içinde ödeyemediği ya da son ödeme tarihini kaçırdığı bir borcu olup olmadığı sorulmuştur. Buna göre, son altı ay içerisinde ödeyemediği veya son ödeme tarihini geçirdiği borcu olmayanların İslami finans prensipleri bilgi düzeyi, olanlara göre daha yüksekken katılım bankacılığı bilgi düzeyinde tam tersi bir sonuç elde edilmiştir."
