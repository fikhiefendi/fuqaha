abstract: "Bu çalışmada ahkâm âyetlerinden hüküm elde etmede nahvin etkisi ele alındı. Nahiv kurallarının hüküm istidlalinde bir karine olarak kabul edilip edilmediği ve şayet ediliyorsa deliller hiyerarşisinde nerede yer aldığı incelendi. Bu incelemede lafızların nahiv yorumlarındaki farklılıkların hükme doğrudan etki ettiği ve nahvin asla ihmal edilmediği sonucuna varıldı. Ancak nahivden hükme gitme tavrının ittifaklı yerlerde olduğu, ihtilaf noktalarında ise hükümden nahve gitme tavrının daha etkin olduğu görüldü. Nahiv kuralları hüküm elde etmede bir karine olarak kabul edilse de öncelikli deliller arasında yer almamıştır. Bunun sebebi de kabul edilen hükme götürecek başka nahiv yorumlarının da bulunmasıdır. Fakihler, başka delillere bağlı olarak ihtilaf ettikleri konularda nahiv kuralını da bir ispat aracı olarak kullanmış, ancak farklı nahiv ekollerinin varlığı bu ihtilafların dil kuralları ile nihaî çözüme ulaşmasına imkân tanımamıştır. Bu araştımanın, ahkâmü'l-Kur'ân alanında yazılmış eserlerin tamamını kapsaması çalışmanın sınırlarını aşmaktadır. Araştırma, mezheplerin teşekkül sürecinin tamamlanmasından sonra yazılması, mezhepler arası mukayesesi ve nahiv kurallarını öncelemesi gibi sebeplerle İbnü'l-Arabî'nin eseri ile sınırlandırıldı. Böylece tek bir eser esas alınarak eserin tamamı tarandı ve nahvin fıkha etkisi tespit edildi. Giriş ve üç bölümden oluşan çalışmanın birinci bölümünde İbnü'l-Arabî ve eserinin tanıtımının yanı sıra ahkâmü'l-Kur'ân literatürü hakkında bilgiler verildi. İkinci bölümde ise fıkıh-nahiv ilişkisi çerçevesinde kavramlar üzerinde duruldu, nahvin Kur'ân ile olan bağından bahsedildi. Üçüncü bölümde eserden seçilen örnekler çerçevesinde nahvin fıkhî hükme etkisinin boyutları ortaya konuldu."
