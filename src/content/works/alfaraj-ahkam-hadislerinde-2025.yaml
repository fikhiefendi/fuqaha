abstract: "“Ahkâm Hadislerinde Söz Eylemler”başlığını taşıyan bu araştırmada Sahih-i Buhari örneğinde muamelatla ilgili fıkhi hükümlerin çıkarılmasındaki söz eylemlerin rolü tespit edilmeye çalışılmıştır. Tezin hedeflerinin gerçekleştirilmesi amacıyla betimsel analiz yöntemi kullanılmıştır. Araştırma, bir mukaddime ve giriş kısmıyla başlamış, sonrasında iki bölümden gelmiş ve bir sonuç kısmıyla tamamlanmıştır. Birinci bölüm, genel olarak edimselliğin ve özellikle de söz eylemlerin kavramsal ve kuramsal temelleriyle ilgilenen teorik bir incelemeye ayrılmıştır. İkinci bölüm ise, hadis-i şeriften seçilmiş metinler üzerinde uygulamalı bir çalışma olup, fıkıh âlimlerinin“sözeylemler”kavramını fıkhi hükümler çıkarma sürecinde nasıl kullandıklarına dair örnekler ve deliller içermektedir. Araştırmanın önemi, hükümlerin dilbilimsel edimsel bir perspektiften, söz eylemleri teorisine göre anlaşılmasına katkıda bulunmasında yatmaktadır. Araştırma, şu önemli sonuçlara ulaşmıştır: Arapça derslerinde haber türlerinin (başlangıç, talep, inkâr) sınıflandırılması, muhatabın haberi alırkenki durumunu dikkate alan, tamamen pragmatik bir sınıflandırmadır. Bağlama derinlemesine bakmak ve konuşmacının niyetlerini anlamak, konuşma eyleminin taşıdığı edimsel amacın belirlenmesinde temel taşıdır. Bilgilendirme amaçlı konuşma eylemlerinin genel amacı haber vermektir ve çoğunlukla muhatapların durumlarının tanımıyla ilişkilidir. Hadis-i şeriflerde yer alan hükümlerde teşvik ve uyarı ikilemi, tebliğin önemli araçlarından biri olmuştur. Bu araçlar, kanıtlar ve delillerle dolu peygamberlik hitabında ruhlar üzerindeki etkisi ve önemi nedeniyle büyük bir yer tutmuş ve hadis-i şeriflerde en çok kullanılan unsurlardan biri olmuştur. Bunun dışında, araştırmanın sonunda yer alan diğer sonuçlar da kaydedilmiştir."
