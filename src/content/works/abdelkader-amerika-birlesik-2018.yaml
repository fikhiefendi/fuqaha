abstract: "İslam alimleri ve iktisatçıları üç ana eksene dayalı uygulama için bir yol haritası ve program geliştirdiler: İslam toplumu, hükümet ve uygulama üzerinde çalışan insan. Bu araştırma, İslam ekonomisinin çağdaş uygulaması için en önemli engelleri ve zorlukları çözmeyi amaçlamaktadır. Bunlardan en önemlisi İslam ekonomisinin fetvalarındaki fark, İslami ekonomik okuryazarlık, küreselleşmenin küresel hegemonyası ve GATT, ve dış dünyayla nasıl başa çıkılacağı. Araştırma, İslami ekonomi uygulamalarının çağdaş modelleri olduğunu göstermektedir, bunların en önemlileri şunlardır: İslami bankalar, yatırım fonları, sigorta şirketleri, İslami sosyal dayanışma, değişim şirketleri, İslami finans kiralama şirketleri ve İslami ekonomik varlıklar. Bazı dezavantajlar yeniden düzenlenebilir. İstatistikler, İslam ekonomisinin uygulanmasında istikrarlı bir büyüme olduğunu teyit ediyor ve pek çok ılımlı ekonomist İslam ekonomisinin geleceğine işaret ediyor. Araştırma, İslam ekonomisini Batı ülkeleri düzeyinde uygulama fikrinin gerçek pazarlama ve farkındalık ihtiyacına ışık tutmaktadır. Araştırma, Batı inançlarını iyi bir şekilde anlamaya çalışmak ve daha sonra, fayda ve ilgi temelinde farkındalık yaratmak için gerçekçi bir plan yapmak ve yavaş yavaş İslam'ın bunun farkında olduğunun bilincinde olmayı amaçlamaktadır."
