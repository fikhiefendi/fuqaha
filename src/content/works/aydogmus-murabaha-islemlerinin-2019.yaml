abstract: "Bu çalışmada faizsizlik prensibi doğrultusunda çalışan, İslamî bankacılık sektöründe yer alan, Türkiye'de katılım bankacılığı adı altında faaliyet gösteren bankaların murabaha işlemlerinin mali tablolarda sunumu ele alınmıştır. Murabahanın sunumu IFRS ve AAOIFI standartları çerçevesinde karşılaştırmalı olarak Albaraka Türk ve Albaraka Banking Group 2018 faaliyet raporları incelenerek analiz edilmiştir. Mevcut yasal düzenlemeler incelendiğinde katılım bankaları için Uluslararası Finansal Raporlama Standartlarının geçerli olduğu görülmüştür. Türkçeye Türkiye Finansal Raporlama Standartları olarak çevrilen standartlar murabaha işlemlerine de uygulanmaktadır. Söz konusu işlemler TFRS 9: Finansal Araçlar Standardına göre banka mali tablolarına yansıtılmaktadır. Albaraka Türk Katılım Bankası mali raporlarını hem TFRS'ye hem de İslamî Finansal Kuruluşlar Muhasebe ve Denetim Organizasyonu (AAOIFI) tarafından yayımlanan standartlara göre hazırlamaktadır. Bu nedenle araştırmanın amacına uygun olarak söz konusu bankanın Türkiye 'de düzenlediği 2018 yılına ait faaliyet raporlarının yalnızca ilgili kısımları incelenmiştir. Ayrıca Albaraka Banking Group tarafından yayımlanan 2018 faaliyet raporlarının AAOIFI'ye göre düzenlenmiş bölümleri analize dahil edilmiştir. İslami ilkelere dayalı faaliyet gösteren katılım bankalarının da AAOIFI standartlarını esas alarak mali rapor hazırlamasının konunun özüne daha uygun olduğu kanısına varılmıştır. Konvansiyonel bankacılığın ekonomik krizlere duyarlılığı ekonomileri alternatif finans ürünlerine yöneltmiştir. Dolayısıyla hem günümüzde hem de geleceğe yönelik beklenti ve hedeflere bakıldığında üretim ve kar-zarara katılım esasına dayalı bir finans modelinin oldukça büyük bir önem taşıdığı görülecektir. Bu sistemin çalışma prensiplerine yönelik muhasebe standartları da ihtiyacı karşılayacak ölçüde cevap verebilir nitelikte olmalıdır. Çalışmanın bu açıdan bakıldığında literatüre katkısı oldukça önem arz etmektedir. Çalışma nitel araştırma yöntemine göre hazırlanmıştır. Çalışmada literatüre katkısı olan kaynakların sağlanması amacıyla kütüphane arşivleri, ilgili alana yönelik bilimsel makaleler, ilgili kurum ve bankaların internet siteleri, murabahanın raporlanmasında esas alınan uluslararası finansal raporlama standartları, İslamî muhasebe ve raporlama standartları incelenmiştir. Ayrıca Albaraka Türk bünyesinde Bütçe ve Finansal Raporlama Müdürlüğü yetkilileri ile mail aracılığı ile mülakat gerçekleştirilmiştir. Murabaha, mevcut yasaların izin verdiği şekilde bankanın aracılık fonksiyonunu yerine getirdiği düşünüldüğünde finansal tablolara krediler olarak yansıtılmıştır. Oysa ki İslami ürünler ve standartlar incelendiğinde murabahanın AAOIFI standartlarına göre finansal araç olma özelliğinin yanı sıra hukuki anlamda bir satış işlemi olarak değerlendirildiği görülmüştür. Mali raporların AAOIFI standartları baz alınarak hazırlanmış şekli incelendiğinde bu kanaat daha güçlü bir şekilde hakim olmuştur."
