abstract: "Vehbe Zuhaylî'nin hayatı, eserleri ve fıkıh alanına dair bazı konularda vermiş olduğu fetvaları ele aldığımız bu çalışmamızda İslam âlimlerinin ekseriyetinin olduğu gibi Zuhaylî'nin de sadece İslam hukuku alanında değil başta tefsir olmak üzere farklı ilim dallarında da eser verdiğini görmekteyiz. Çalışmamız üç bölümden oluşmaktadır. Birinci bölümde; Vehbe Zuhaylî'nin biyografisi ele alınmıştır. Bu çerçevede doğumu, tahsil hayatı, idari vazifeleri, almış olduğu ödüller ve vefatı gibi hususlar incelenmiştir. İkinci bölümde; Ulaşabildiğimiz ve tespit edebildiğimiz çalışmaları tanıtılmıştır. Çok yönlü bir âlim olan Vehbe Zuhaylî'nin İslami ilimlerin pek çok alanına yönelik irili ufaklı yüzlerce eseri bulunmaktadır. Bu eserleri de mümkün mertebe ait oldukları/olabildikleri ilim alanlarına ait bir sınıflandırmayla tanıtılmaya çalışılmıştır. Üçüncü bölümde ise; Vehbe Zuhaylî'nin fıkıh alanında kendisine yöneltilen sorular çerçevesinde fıkıhla ilgili görüşleri ele alınmıştır."
