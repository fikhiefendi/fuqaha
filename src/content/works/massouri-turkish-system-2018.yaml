abstract: "Yirminci yüzyılın ikinci yarısında, geleneksel bankalardan İslami bankalara dönüşme yönünde önemli bir olgu bulunmaktadır. İslami takas (mübadele), kalkınma ile ilişkili olan finansmanı sağlamak için iyi bir yöntem olarak kabul edilir. İslami mübadele, İslami bankacılık sektörünün önünü açan geçen yüzyılın yetmişli yıllarının ortasında ortaya çıkmıştır. Bu önemli İslami finansman tabanıyla, çalışmamız, genel olarak İslami mübadelenin potansiyeline ve İslami mübadelenin kural ve kavramlarına odaklanmıştır. Geçtiğimiz yüzyılın yetmişinci yılından beri, Libya ve Türk bankacılık sektörü özellikle Libya hükümetinin bankaları kamulaştırdığı dönemde Libya'da çok sıkıntı çekmiştir. Genel mülkiyet vurgusuyla, bankacılık sektörü, takipteki alacakların seviyesinin yükselmesi gibi birçok sorun nedeniyle zayıf kalmıştır. Bu nedenle, Libya ve Türk hükümetleri son yıllarda reform başlattılar ve iki bankacılık sektörünün performansını arttırmak için baskıları ortadan kaldırdılar ve yönlendirme sorunlarını ortadan kaldırarak özelleştirme çalışmalarını yürüttüler. Bu çalışma, İslami bankaların çalışma usullerini ve idari yapısını analiz etmeyi amaçlamaktadır. Ayrıca, çalışma, Libya ve Türkiye'de İslami bankalar ve İslami bankacılık mübadelesi hakkında ayrıntılı bir çalışma yapmayı amaçlamaktadır. Çalışmanın metodolojisi literatürde temsil edilmektedir ve çalışma Libya ile Türk bankacılık ve İslami bankacılık sistemlerinin ve özellikle İslami sistemleri hakkında veri sunmakta ve toplamaktadır ve bunların istatistiksel analizini yapmaktadır. İstatistiksel ve elektronik dergi sonuçları, birçok sorundan mustarip Libya bankacılık sektörünün ekonomiye katkısının zayıf olduğunu göstermiştir. Ayrıca, istatistiksel sonuçlar Türk bankacılık sisteminin büyüme ve istikrarı başlattığını ve bu çerçevede yetkililer tarafından yönetilen bir başarı politikası izleyerek özellikle 2000 yılından sonra Türk ekonomisine etkin bir şekilde katkıda bulunduğunu göstermiştir. Son olarak, çalışma Libya'daki İslami bankacılık mübadelesinin büyük ilgi gördüğünü ve talep artışı ve destek aldığını ortaya çıkarmıştır."
