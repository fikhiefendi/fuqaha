abstract: "Bu araştırma İslam toplumunun en önemli sorunlarından olan küçüklerin evlendirilmesi ve boşanması konusuna çözüm araması sebebiyle önemlidir. Nikah ve boşamanın ailenin bozulması ve yıkılmasına engel olan, aile bireyleri arasında ruhi ve psikolojik sükûneti yerleştiren bir yönü vardır. Bu araştırmanın ana konusu İslam fıkhı ve Irak aile hukukuna göre küçüklerin evliliği konusunu ortaya koymadır. Mutekaddimûn fıkıh alimlerinin geneli buluğ çağına ulaşmamış çocukların nikahlanmasını caiz görürler. Irak aile hukuku ve İslâm fıkhına göre evliliğin asgari yaşını tespit etme ve Irak aile hukukuna göre bu konuda konulan yasağa uymayana verilen ceza de araştırmanın konularına dahildir. Araştırmada betimleyici analitik yöntem kullanılmıştır. Küçüklerin nikahlanması ve boşanması konusunda 189 nolu 1959 yılına ait Irak aile kanunu ile İslam fıkhı verileri mukayese edilirken ve örf, maslahat ile İslam hukukunun ruhuna uygun görüş ortaya konulurken karşılaştırma yöntemine müracaat edilmiştir. Araştırmada şu neticelere ulaşılmıştır: İslâm hukukuna göre mümeyyiz olsun veya olmasın velinin muvafakatiyle küçüğün nikahlanması geçerlidir. Irak aile hukuku ise küçüğün on beş yaşına gelmiş olması ve hâkimin bu evliliği onaylamasını şart koşmuştur. Hem İslâm hukuku hem de Irak aile kanununa göre evlilik için uygun yaş on sekizdir. Hanbelîler dışındaki fakihlere göre küçüğün boşaması geçersizdir. Hanbelîler mümeyyiz çocuğun boşamasının geçerli olduğunu savunmuştur. İslam hukukuna göre küçüğün nikah veya boşamaya zorlanması ise yasaklanmıştır. Irak aile hukuku da bu hususa cezai müeyyideler getirmiştir."
