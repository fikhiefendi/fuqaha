abstract: "Bu tez, muteber olmayan içtihadi uyuşmazlık konusunu ve bunun çağdaş zamanlardaki nedenlerini, kadın sorunlarına odaklanarak ele almaktadır. Tez, muteber olmayan içtihadi uyuşmazlık kavramını ve bir uyuşmazlığın kabul edilen veya makul olmayan uyuşmazlık olarak ayırt edilebileceği unsurları ana hatlarıyla açıklayarak başlamaktadır. Ayrıca, araştırmacıların makul olmayan içtihadi ihtilafın hükmüne ilişkin değerlendirme ve görüşlerini ve bunun yol açtığı birçok sonuç ve sakıncayı ele almaktadır. Çağdaş zamanlarda muteber olmayan içtihadi ihtilafın nedenlerini açıklamak amacıyla tez, muteber olmayan içtihadi ihtilafların ortaya çıktığı kadınlarla ilgili bir dizi çağdaş içtihadi meseleyi ele almaktadır. Bu konuları incelerken, muteber olmayan ictihadlara sevk eden unsurlar, bunların delilleri ve bu tür yaklaşımlara yol açan hususlar üzerinde durdum. Bu çerçevede bu görüşlere yol açan hususları kısaca şöyle ifade etmek mümkündür: - Düşünce ve muhakeme ile ilgili sebepler: Delil sıralamasının ihlali, metinlerin yanlış yorumu, zayıf hadislere başvurma, yanlış kıyas ve sedd-i zerayi ilkesinde abartı. - İctihad veya yorum yapan ile ilgili sebepler: Heva ve hevese uymak, fanatizm ve araştırmacının konu hakkıındaki bilgi yetersizliği. - Çağdaş entelektüel ve siyasi gerçeklikle ilgili motivasyonlar: Feminist akımın etkisi ve devletin siyasi ve sosyal yönelimleri. Tezde ele alınan konular ve farklı görüşlere yol açan hususlar çerçevesinde muteber olmayan fıkhi ihtilafın açık ve gizli nedenlerini açıklığa kavuşturmayı hedefledim. Bu durum, araştırmacıların muteber olmayan fıkhi ihtilafların yayılması olgusunu ve İslam dünyası üzerindeki olumsuz etkilerini sınırlamanın yollarını aramaları için bazı fırsatlar doğmasına yardımcı olmasını ümit ediyorum."
