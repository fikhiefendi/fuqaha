abstract: "Kadın, yaratılıştan bugüne her dönemde tartışmalara ve açıklamalara konu olmuş, tarihin her döneminde gündemdeki yerini korumuştur. Bu durum vahiy ortamında ve devamında da devam etmiş, bu durum ayetlerde“Sana kadınlar hakkında fetva soruyorlar. De ki ”Onlar hakkında size fetvayı Allah veriyor“…”(Nisa 127) şeklinde ifade edilmiştir. Kadın konusunun tartışmalara konu olması yeni olmasa da bugünkü tartışmaların kendine has özellikte olması küreselleşme etkisinde kalan Müslümanların durumuyla yakından alakalıdır. Kadın konusunda bu gün geçerli olan teamüllerin tamamı çoğunlukla son yüzyıllardaki batılılaşma süreci içerisinde Müslüman toplumların geçirmiş olduğu değişim ile doğru orantılıdır. Nitekim elde bulunan uygulamaların batıya karşı tarihi geçmiş uygulamalar şeklinde tarif edilerek batı tarzına uydurulmaya çalışılması veya ayetle sabit olan uygulamaların tarihi geçmiş modeller olarak sunulması, hadislerin varoluşsallığımızı sağlayan ve koruyan yaşantılar şeklinde görülmesi yerine tarihsel kalıplar olarak görülmesi bu durumun birer sonucudur. Modernleşme ve modernleşirken Müslüman kalma mefhumu kadınla ilgili ayetlerle alakalı geçmişte olmayan yeni/çağdaş tartışmaların temel saiki olarak karşımızda durmaktadır. Çalışmamız, çağdaş yorumları yönlendiren bu fikirlerin esasını ve sebebini belirleyerek bu konuda bir farkındalık oluşturma amacına matuf olarak yönlendirilmiş; ancak zamanla kapsamın genişliği dolayısıyla ilgili lireratür taraması ve örneklerden hareketle ayetlerle alakalı çağdaş tartışmalarla ilgili bütüncül bir bakış açısı sunmaya çalışmak düşüncesi hasıl olmuştur. İlgili görülen bütün ayetlerin ve içerdikleri konuların tesbiti, ayrıca bunlarla ilgili tespit edebildiğimiz çalışmaları bir araya getirmeye çalışmakla başlayan çalışmamızı temsil gücü yüksek bir örnek üzerinde uygulama yaparak tamamlanmıştır.. Çalışmada çağdaş görüş ve yorumlar, geçmişteki yorumlarla karşılaştırmalı olarak incelenmiş, çağdaş yorumcuların hataya düştükleri noktalar tesbit edilmeye çalışılmıştır."
