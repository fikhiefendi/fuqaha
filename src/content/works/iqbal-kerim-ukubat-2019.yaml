abstract: "İslâm hukukunda kısas, had ve ta'zîr gerektiren suçlar ukûbât kavramı içerisinde yer alıp incelenmektedir. Bu suçlar hakkında uygulanacak cezaların yer aldığı âyet-i kerimelerle ilgili farklı yorumlar yapılmıştır. Bu tezde gelenek ve mensupları bakımından oldukça zengin bir birikime haiz olan Hanefî, Şâfiî ve Mâlikî mezheplerinden birer eser seçilerek ilgili âyet-i kerimeler üzerinden konuya yaklaşımlarının mukayesesi yapılmaya çalışılmıştır. Ahkâmü'l-Kur'ân disiplininde özel ve güzide bir şöhrete sahip olan Cassâs, Herrâsî ve İbnü'l-Arabî'nin eserleri disiplinin (Ahkâmü'l-Kur'ân) adını taşımaktadır. Bu tezde sadece üç fakîh/müfessirin değil, bilakis üç farklı ekolun mukayesesi yapılmıştır. Bu manada, suça ve suçluya bakış açılarını, cezalarda öngörülen prensip kararlarını, hükme giderken kullandıkları delilleri ve yorumlamalarını görmeye çalıştık. Bu tez, bir giriş ve üç ana bölümden oluşmaktadır. Giriş bölümünde öncelikli olarak konunun önemi, sınırlandırılması ve sunulması üzerinde durulmuş sonra da genel itibariyle Cassâs, Herrâsî, İbnü'l-Arabî'nin hayatları ve Ahkâmü'l-Kur'ân adlı eserleri ele alınmıştır. Tezin kalan bölümlerinde ise tezin ana bölümlerini oluşturan kısas, had ve ta'zîr gerektiren suçlar, sırasıyla ve kapsamlı bir şekilde ele alınmıştır."
