abstract: "Yeni bir kölelik biçimi olan insan ticareti suçu, insanların temel hak ve özgürlüklerinin ellerinden alınarak onların metalaşmasıdır. Artık insanlık için büyük tehike teşkil eden bu suç, her geçen yıl daha çok işlenmektedir. Bunun nedenle insan ticareti suçunun tarihçe, tanım ve boyutu ile birlikte hem uluslararası düzenlemelerde hem de Türk ve Azerbaycan Ceza Hukukundaki yeri ile ilgili bir çalışma yapmaya karar verdim. Yapmış olduğum bu çalışmada, insan ticareti suçunun işlenme oranını, hangi amaçla işlendiğini ve bu suçta mağdur olan kişilerin, kadın, çocuk ve erkek olarak oranlarını uluslarası raporlarla ve Türkiye ve Azerbaycan Cumhuriyeti'nin son yıllardaki istatistiki verileri ile göstermeye çalıştım. Aynı zamanda bu suçun unsurları açısından irdeleme yaparak başta suçun konusu ve diğer unsurları ile ilgili doktrindeki farklı görüşler, ilgili Yargıtay kararları ve Azerbaycan Cumhuriyeti Ağır Cinayetler Mahkemesi'nin kararları ve Avrupa İnsan Hakları Mahkemesinin kararlarını karşılaştırmalı olarak inceledim. Nitekim ilgili kararları da çalışmama ekledim. Nihayet insan ticareti suçunun en çok kabul gören“Sınıraşan Örgütlü Suçlara Karşı Birleşmiş Milletler Sözleşmesi”ne Ek İnsan Ticaretinin, Öncelikle Kadın ve Çocuk Ticaretinin Önlenmesine, Durdurulmasına ve Cezalandırılmasına İlişkin Protokol'ü, yani Palermo Protokolü'ndeki tanımını ele aldım ve bu tanımın 5237 sayılı TCK ve 787-IG sayılı ACCM'deki tanımla karşılaştırmasını yaparak uyumlu olup olmadığını inceledim."
