abstract: "Modernizm'in, Batı toplumlarına olan etkisi kadar ülkemizdeki cemaatlere de etki ettiği görülmektedir. Bu anlamda tezimizde geleneksel din anlayışına sıkı bir şekilde bağlı olan Işıkçılar Cemaatinin modern etki ile yaşadığı değişim süreci ele alınmaktadır. Amacımız Nakşi gelenekten gelen Işıkçılar Cemaatinin modern etki ile hangi anlamda dönüşüm yaşadığını ortaya koymaktır. Bu anlamda cemaatin sahip olduğu medya ve yayın organları Işıkçılar Cemaatinin dönüşümünü anlamamızda yardımcı olacaktır. Giriş bölümü ve üç bölümden oluşan tezimizde birinci bölümde Nakşî geleneği ve Işıkçılar Cemaatinden sonra Hüseyin Hilmi Işık'ın hayatı ve eserleri üzerinde durulmuştur. İkinci bölümde ise Hüseyin Hilmi Işık sonrası Işıkçılar Cemaatinin durumu ve faaliyetleri anlatılmaya çalışılmıştır. Üçüncü bölümde ise Işıkçılar Cemaatinin din algısı üzerinde durulmuştur. Işıkçılar Cemaatini incelediğimizde karşımıza üç önemli isim çıkmaktadır. Bunlardan birincisi Hüseyin Hilmi Işık'ın hocası olan Abdülhakim Arvasi'dir. İkinci isim Işıkçılar Cemaatinin rehber kitabı Tam İlmihal Seâdet-i Ebediyye eserinin yazarı, kanaatimizce cemaatteki en önemli isim olan Hüseyin Hilmi Işık'tır. Işık'ın bu eserinin cemaatin temel kaynağı olmasının yanında diğer eserleri de Ehl-i Sünnet anlayışını muhafaza etmeyi amaç edinmesi bakımından önemlidir. Cemaatteki üçüncü isim ise Işık'ın damadı olan, aynı zamanda gazetecilik ve holdingleşme sürecinde cemaatin geleneksel görünümünden uzaklaşmasında önemli bir rol oynayan ve klasik anlamdaki bir cemaat lideri görünümünden uzak olan Enver Ören'dir. Işıkçılar Cemaatini ele alırken kendi kaynakları üzerinden inceleme yapılmış ve söylem analizi metodu benimsenmiştir. Sonuç olarak geleneksel din anlayışına sahip olan ve içtihat, dinde reform tartışmaları gibi yenilikçi yaklaşımlara karşı çıkan Işıkçılar Cemaatinin, Hüseyin Hilmi Işık sonrası geleneksel din anlayışının modern etki ile büyük bir değişime uğradığı kanaatine ulaşılmıştır. Cemaate ait olan medya ve yayın organlarındaki değişim bize bunu göstermektedir. Işıkçılar Cemaatinin bundan sonraki süreçte nasıl bir görünüme sahip olacağı ya da mevcut yapısını koruyup koruyamayacağı zamanla görülecektir."
