abstract: "Bu çalışma, Amasya'ya ait olan ve Meşihat Arşivi'nde bulunan H. 1104-1105 M.1692-1694 tarihli 20 numaralı Şer'iyye Sicilinin transkripsiyon ve değerlendirmesini içermektedir. Çalışmada, önce Osmanlı Devleti'nin kadılık kurumu, şer'iyye mahkemeleri ve Şer'iyye Sicilleri hakkında bilgi verildikten sonra, sicil içindeki belgeler özetlenip bunların konularına göre tasnifi ve genel değerlendirmesi yapılmıştır. Ayrıca araştırmanın temel kaynağı olan Şer'iyye Sicilleri hakkında genel değerlendirme de yapılmıştır. Çalışmamıza konu olan şehzadeler diyarı Amasya şehrinin tarihi, coğrafi özelliği ve Osmanlı dönemindeki yeri ve dönemin padişahı hakkında da bilgiler ihtiva etmektedir. İncelediğimiz Amasya Şer'iyye Sicilinde alım-satım, ihtida, miras, vasî tayini hibe, sefer, vergi, vakıf görevlileri, kale görevlileri gibi birçok büyük ve küçük görevlilerin atamalarına dair belgelere ulaşmak mümkündür. Defterdeki bilgiler konularına göre sistematik bir şekilde tasnif edilerek, tablolar halinde gösterilmiştir. Bütün bu belgeler ve bilgiler ışığında, Amasya Sancağı'nın söz konusu mezkûr tarihlerdeki siyasi, iktisadi ve sosyal durumu hakkında bazı tespitlerde bulunulmaya çalışılmıştır."
