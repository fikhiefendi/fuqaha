abstract: "İslam Hukukundaki kimi hükümler, şartların değişimine bağlı olarak değişikliğe uğramaktadır. İkrah ve ıztırar halindeki kimi hüküm değişiklikleri bunun örnekleridir. Bu çalışmada fitne şartlarının yaşandığı ortamda hükümlerin değişip değişmediği incelenmiştir. Hadis-i şeriflerde fitne ortamındaki kimi hüküm değişikliklerinden bahsedilmiş. Dahası hüküm değişikliğinin yaşanması gereken fitne ortamının özellikleri de anlatılmıştır. Çalışmada bu özellikler belirlenip tasnif edilmiştir. Fitne ortamının en önemli özellikleri şunlardır: Bu ortamda cehaletin yaygınlaşıp sağlıklı düşünme ortamının bulunmaması sebebiyle hak batıldan tam olarak tefrik edilememektedir. Diğer taraftan bu ortamda tüm Müslümanları temsil eden bir halife bulunmaz iken her biri kendi başına saf hakikati temsil etmeyen çok sayıda grup mevcuttur ve bunlar çatışma ve çekişme halindedirler. Yanı sıra bu ortamda hem yaygın bir ahlaki yozlaşma hem de güvenin kalmaması sebebiyle tam bir toplumsal çöküntü hali yaşanmaktadır. Tüm bu olumsuzlukları gidermek gerekmekte ancak bunu düzeltmek için kendileri ile sorumluluk altına girilebilecek insanların nerede ise yokluğu sebebiyle bir gayret de gösterilememektedir. İşte böyle bir ortamda nasların işareti ile bazı hükümlerin değişikliğe uğradığı görülmektedir. Bunları şu şekilde saymak mümkündür: İmam/halife tayin etme ve ona biat etme yükümlülüğü düşmektedir. İyiliği emir ve kötülüğü engelleme görevi sadece güvenilen insanlara hakkı ve sabrı tavsiye şeklinde daha hafif bir forma bürünmektedir. Bu ortamda meşru müdafaada bulunmak ve silah bulundurmak caiz olmamaktadır. Yine kendini bütünüyle ibadete vermek, uzlete çekilmek ve mal/evlat yönüyle hafiflik bu ortamda teşvik edilirken hakkı açıkça söylemek ve hakkını talep etmek çeşitli şartlara bağlanmaktadır."
