abstract: "Post-pozitivist bir tutum ve nitel metot ile hazırlanan çalışmanın amacı İbn Haldun, Adam Smith ve Arthur Betz Laffer'in vergi ve yatırıma dair görüşlerini karşılaştırmaktır. Çalışmada, alanda yazılmış eserler incelenerek vergi ve yatırım kavramlarının birbirini nasıl etkilediğine yer verilmiştir. Vergiyi teorik olarak açıklayan bazı kavramlar ve verginin tarih boyunca farklı iktisat okulları tarafından nasıl yorumlandığı hususuna tez çalışmasının ikinci bölümünde yer verilmiştir. Ayrıca yatırıma dair kavramlar teorik açıdan incelenmiştir. Daha sonra vergi ve yatırım ilişkisinin nasıl olduğu teorik çerçevede ele alınmıştır. İbn Haldun ve Adam Smith'in iktisada dair görüşlerinin daha iyi anlaşılması amacıyla emek-değer teorisi açıklanmıştır. İbn Haldun 14. yüzyılın değerli ekonomist ve filozoflarından biri olarak tanınmıştır. Tez çalışmasının üçüncü bölümünde, İbn Haldun'un iktisada dair görüşleri ele alınırken“Mukaddime”adlı eserinden faydalanılmıştır. Bununla birlikte, İbn Haldun'dan yüzyıllar sonra ekonomi alanında çalışmalar yapan Adam Smith'in vergi ve yatırıma dair görüşleri incelenirken“Ulusların Zenginliği”adlı eserinden faydalanılmıştır. Ayrıca literatürde“Laffer Eğrisi”ile yer alan Arthur Betz Laffer'in vergi teorisini ortaya koyarken İbn Haldun'un vergi teorisinden esinlendiği hususu işlenmiştir. Tez çalışmamızın dördüncü ve son bölümünde İbn Haldun, Adam Smith ve Arthur Laffer'in vergi ve yatırım teorileri arasında benzerlik ve farklılıkların neler olduğu tespit edilmiştir. İbn Haldun'un Adam Smith ve Arthur Betz Laffer'e kıyasla daha az eleştirilen ve daha kapsamlı vergi teorisi ortaya koyduğu kanısına varılmıştır. İbn Haldun'un toplum refahını bireysel çıkarların üstünde tutan, devlet otoritesinin halkın refahı için çalışması gerektiğini öğütleyen, üretim ve yatırım yoluyla ekonominin daha canlı ve sürdürülebilir olduğunu savunmuştur. İbn Haldun'un vergilerin daha düşük oranlı olmasının hem bireylere hem de devlete daha faydalı olacağını ilk defa ortaya koyan bir iktisadi düşünür olduğu tez çalışmasında ayrıntılı bir biçimde açıklanmıştır."
