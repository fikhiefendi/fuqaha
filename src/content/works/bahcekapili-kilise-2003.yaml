abstract: "IV KİLİSE HUKUKU VE AVRUPA'DA LAİKLİK SÜRECİNİN BAŞLAMASINA TESİRLERİ Laiklik konusunda ülkemizin oldukça sık ve hararetli tartışmalara sahne olmasına rağmen, sorunun kaynağına inilmesi konusunda önemli bir noktanın gözardı edildiği kanaatindeyiz. Çünkü, sorunun temelinde laikliğin ortaya çıktığı Arupa toplumlarının inanç sistemi olan Hıristiyanlığın ve onu temsilen Kilise'nin siyaset ve hukukla ilgili düşünceleri ve pratikleri yatmakta olduğunu görmekteyiz. Kilise ilk üç asrında moral değerleri çok yüksek ve söyleminde din dünya ayrımım esas alan bir inananlar topluluğu iken, 4. asırdan itibaren Roma devletinin himayesinde Roma hukuku ve devlet düzeninden aldığı kurumlarla hızla teşkilatlanmış, 1 1. asrın sonlarına gelindiğinde sosyal hayatın her alanına müdahale eden bağımsız, evrensel bir güç haline gelmiştir. Siyasal alandaki gelişmelere paralel olarak Kilise hukuku Hıristiyanlığın ilk 3 asırda ibadetlerin tanzimi Akdeniz havzasına yayılan Hıristiyan topluluk ya da gurupların idaresiyle ilgili gayet mütevazi düzenlemeler şeklinde ortaya çıkmış, Konstantin'in (Ö.337) ihtidasından sonra Hıristiyan imparatorların himayesi altında gelişmeye başlamıştır. Bu arada Kilise'nin sivil hukuka önemli katkıları olmuş bilhassa Roma imparatorluğunun çökmesinden sonra yaşanan belirsizlik döneminde, Kilise teşkilatı ve mahkemeleri sivil kurum ve mahkemelere model teşkil etmiştir. Kilise hukukunun şahıslan ve olayları dini ve dünyevi olmak üzere ikiye ayırması, Hıristiyan toplumlarda yasama, yürütme ve yargı alanında iki başlılığa sebeb olmuş, bilhassa ortaçağ boyunca iki otorite arasında sürtüşme ve kavgalara sebebiyet vermiştir. Sonuçta, Kilise ve O'nun tüzel kişiliğini temsil eden din adamları sınıfı, kendilerine karşı halkta oluşan tepkiyi önlemek ve mevcut konumu muhafaza için daima baskıcı yöntemler seçmiş, hatta yargılama prosedüründe yaptığı değişikliklerle (inquistik prosedüre) kendi koyduğu hukuk ilkelerini bile çiğnemiştir. Kilise ile halk arasındaki bu çekişme, mutlak bir kavga ve kilisenin hakimiyetini kaybetmesiyle sonuçlanmıştır. Kilise hukukundaki bazı düzenlemeler İslam hukuku ile benzerlik arzetse de bir çok önemli noktada farklılıklar dikkat çekmektedir. Çok evlilik, iddet, süt akrabalığı, evlad edinme, miras taksimi gibi konularda iki hukuk sistemi tamamen birbirinden farklı yaklaşımlar sergiler. Bunun yanında Kilise hukukunun benimsediği boşama yasağı da İslam hukukuna yabancı bir uygulamadır. Dünya, Din, Kilise"
