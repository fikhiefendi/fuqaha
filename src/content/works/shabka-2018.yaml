abstract: "Bu çalışma, İslâmda ve Osmanlıda vakıf kavramı ile çeşitli biçimlerin ve amaçların Osmanlı temellerinin örnekleri ve bunların toplumun hizmet ve istikrarı üzerindeki etkilerini ele almıştır. Daha sonra cumhuriyet dönemindeki vakıfların bugüne kadar yaşanan sıkıntılı biçimini ele aldık. İlim yayma cemiyeti ve vakfı; Bu döneme tanıklık etmek ve amaçların netliğinde kuruluşun ihalesini sürdürme olasılığını kanıtladı"
