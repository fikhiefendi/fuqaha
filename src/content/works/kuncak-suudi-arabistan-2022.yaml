abstract: "Aile Anlaşmazlıkları, artan boşanma oranları ve bunların ortaya çıkardığı sosyolojik ve idari sorunlar, 20. yüzyılın önemli problemlerinden biri haline gelmiştir. Sorunun çözümü için kullanılan yöntemlerden biri aile arabulucuğudur. Tarihin erken dönemlerinden itibaren alternatif anlaşmazlık çözüm yolu olarak başvurulan arabuluculuk, günümüzde toplumların kendi kültür ve inançlarına göre şekillendirdiği bir uyuşmazlık çözüm yolu haline gelmiştir. Türkiye'de de aile arabuluculuğunun, artan boşanma oranları ve bunların sebep olduğu yargı yükünü hafifletmek için kullanılması planlanmaktadır. Ancak Türkiye'de şimdiye kadar yerel kültür ve değerlere uygun bir arabuluculuk sistemi geliştirilmemiştir. Uygulamaya girmesi beklenilen arabuluculukta da Avrupa kaynaklı boşanma arabuluculuğu yöntemlerinin planlandığı anlaşılmaktadır. Diğer yandan özellikle aile konusunda kültürel değerleri ve kabulleri Avrupa'dan farklı Türkiye için toplumun kültürüne, dini kabullerine uygun, tahkim müessesesi ile ortak yetkilerle donatılmış bir arabuluculuk modelinin daha uygun olduğu açıktır. Uygulamaya geçen ülkelerin tecrübelerinden faydalanarak geliştirilecek özgün bir sistemin, var olan sorunun çözümünde daha başarılı sonuçlar vereceği iddia edilmekte ve bu alana örnekler sunmak için bazı akademik çalışmalar yürütülmektedir. Bu çalışma, yapılan araştırmalara katkı sağlamak amacıyla hukuku, İslam hukukuna dayalı ve toplumsal yaşantısında yerleşmiş bir islam kültürüne sahip olan Suudi Arabistan Krallığının, İslami kural ve kaidelere bağlı kalarak geliştirdiği arabulucu-hakemlik uygulamalarını araştırmaktadır. Üç bölümden oluşan çalışmanın ilk bölümünde, Suudi Arabistan'ın kuruluş tarihine ve hukuki uygulamaların oluşum zeminini açıklamaya imkân vermesi için adli teşkilat tarihine kısaca değinilmiştir. İkinci bölüm, Krallığın genel hukuki yapısına ve aile hukukunun temel ilke ve kurallarına ayrılmıştır. Üçüncü bölümde ise ülkede arabuluculuk ve tahkim olarak iki ayrı yöntem şeklinde işletilen aile arabulucu-hakemliği uygulamalarının tarihine, içeriğine ve kurumsal gelişimine dair ayrıntılar detaylandırılmıştır. Öncelikle arabuluculuk ve tahkimin İslam hukukundaki yeri ve kuralları açıklanmış, sonrasında Krallığın uygulamaları ayrıntıları bir şekilde incelenmiştir. Bölümün sonunda Suudi Arabistan arabuluculuk uygulamalarının İslam hukuku ve modern uygulamalara göre konumu değerlendirilmiştir. Sonuç olarak Suudi Arabistan'ın bu alandaki uygulamalarının modern dünyanın gelişim ve gerekliliklerine uygun olarak geliştirilmiş bir İslami arabuluculuk modeli olduğu ve ülkenin sosyolojisine uygun bu modelle, var olan sorunun çözümüne dair başarılı sonuçlar elde edildiği tespit edilmiştir."
