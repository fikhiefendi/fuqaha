abstract: "Avrupa'da 19. yüzyılda kurulmaya başlanmış ve dünyanın birçok ülkesine yayılmış olan tasarruf bankacılığı modeli, kuruluş itibariyle yoksul kimselerin finansal ihtiyaçlarını karşılamak ve küçük birikim sahiplerinin tasarruflarını değerlendirmek amacıyla kurulmuştur. Modern anlamda ilk tasarruf bankası, 1810 yılında Henry Duncan isimli bir rahip tarafından İskoçya'da kurulmuştur. Sonraki yıllarda tasarruf bankaları, Avrupa başta olmak üzere tüm dünyaya yayılmıştır. Tez çalışması, dünyada yerel kalkınmanın itici gücü olarak da kabul edilen tasarruf bankalarını incelemekte ve Türkiye için İslami tasarruf bankacılığı model önerisi sunmaktadır. Tezin bölümlerinde, dünyada var olan tasarruf bankacılığı modelleri incelenmiştir. Ayrıca ilk İslami banka kabul edilen Mit Ghamr yerel tasarruf bankasının kuruluşu ve prensipleri araştırılarak elde edilen literatür çerçevesinde bir anket çalışması yapılmıştır. Anket çalışmasında, katılımcıların Türkiye'deki mevcut Katılım bankacılığı ve kurulacak tasarruf bankacılığı hakkındaki görüş ve önerileri tespit edilmeye çalışılmıştır. Yapılan anket çalışmasının sonucunda, mevcut Katılım bankası müşterilerinin kurulacak tasarruf bankasına olumlu yaklaşım sergiledikleri tespit edilmiştir. Buna göre Türkiye'de kurulacak İslami tasarruf bankasının İslami bankacılık sektörüne ivme kazandırması beklenmektedir. Çalışmada ayrıca Türkiye'deki bankacılık geçmişi incelenerek, Osmanlı İmparatorluğu'nun son dönemlerinde kurulmaya başlayan ve Cumhuriyetin ilk yıllarında yaygın bulunan yerel bankalar incelenmiştir. Kurulacak tasarruf bankasının yerel kalkınmaya etkisini ölçmek amacıyla yerel bankalardan edinilen tarihsel veriler ışığında panel veri analizi gerçekleştirilmiştir. Ampirik araştırma sonuçlarına göre, yerel bankaların faaliyet süreleri ile bölgenin kalkınması arasında pozitif ve anlamlı ilişki tespit edilmiştir. Çalışmanın sonuç bölümünde, elde edilen tüm veriler özetlenerek Türkiye'de kurulacak İslami tasarruf bankasına yönelik önerilere yer verilmiştir."
