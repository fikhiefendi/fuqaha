abstract: "ÇÖRTÜK, Hasan, ?Büyük Haydar Efendi ve Usûl-i Fıkıh Dersler Adlı Eserindeki Metodu?, Danısman Doç Dr. Hakkı AYDIN, C.Ü. lahiyat Fakültesi, 2007. Bu arastırmada, milâdi XIX. y.y.'da Osmanlı Devleti'nin son dönemlerinde stanbul'da yasamıs güçlü bir Hanefi Hukukçusu olan Büyük Haydar Efendi'nin hayatı ve onun en tanınmıs eseri olan ?Usûl-i Fıkıh Dersleri? adlı eserindeki metodu incelenmistir. Çalısmamız üç ana bölümden olusmaktadır. Birinci bölümde Büyük Haydar Efendi'nin yasadıgı dönemin siyasi, iktisadi ve ilmi durumu hakkında bilgiler verilmistir. Osmanlı Devleti'nin son dönemlerinde egitim kurumları ve özellikle de Haydar Efendi'nin tahsil hayatını sürdürdügü medreselerin, XIX. y.y.'daki durumuna deginilmistir. kinci bölümde Büyük Haydar Efendi'nin, hayatı, eserleri ve ilmi kisiliginden bahsedilmistir. Yine Haydar Efendi'nin hayatı, ölümü, hocaları ve ögrencileri hakkında da bilgiler verilmistir. Üçüncü bölümde ise ?Usûl-i Fıkıh Dersleri? adlı eseri incelenmis, eserin konuları, kaynakları, üslubu, müellifin konuları isleyis tarzı ele alınmıs daha sonra da bu konulara örnekler verilmistir. Aynı zamanda Büyük Haydar Efendi'nin Fıkıh Usûlü ilmindeki yeri hakkında bilgiler verilmistir."
