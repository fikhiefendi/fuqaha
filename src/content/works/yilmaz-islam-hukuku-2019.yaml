abstract: "Çalışmamız, casusluk kavramının İslam hukukundaki izdüşümünü ortaya koymayı amaçlamaktadır. Bu amaçla, ilgili kavramların analizinden sonra İslam tarihinde casusluk bir başka deyişle istihbarat faaliyetlerinin ne şekilde yer aldığı ana hatlarıyla incelenmiştir. Casusluk suçuna İslam hukukunun vermiş olduğu ceza, dört ana mezhep ekseninde incelenmeye çalışılmıştır. Çalışmada kitap, dergi, makale, ansiklopedi maddesi ve internet kaynaklarından yararlanılmıştır. Çalışma sonucunda İslam hukukunun gerek devletin kendi güvenliği gerekse vatandaşlarının güvenliği için casusluk faaliyetleri yürütmesinin bir gereklilik olduğu ortaya çıkmıştır. Ancak hem vatandaşlara, hem de devlete karşı yönelecek casusluk faaliyeti yasaklanmış, bu suçun işlenmesi durumunda ta'zir cezası öngörülmüştür. Ta'zir cezasının doğası gereği; devlet başkanı, suçlunun ta'ziren katline hükmedebileceği gibi onu sürgüne gönderebilir ya da başka bir ceza da verebilir."
