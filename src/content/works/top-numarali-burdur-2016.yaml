abstract: "Osmanlı toplum yapısının aydınlatılmasında büyük bir yeri olan Şer'iyye Sicilleri zengin içeriği bakımından tarihi birçok alanda birinci elden vazgeçilmez kaynak olarak nitelendirilmektedir. Osmanlı Devleti'nin sosyal, iktisadi, idari ve kültürel açıdan değerlendirme yapılmasında başvurulacak belgeler niteliğinde olması Şer'iyye Sicilleri'nin değerini bir kat daha artırmaktadır.“H. 1314-1316 / M.1897-1898”tarihli 225 Numaralı Şer'iyye Sicili'ne Göre Burdur'un İdari, Sosyal ve Ekonomik Hayatı\" başlığı altında ele alınan defter inceleme içerisine alınmıştır. Burdur'un aile yapısı, ekonomik uğraşları, vakıfları, gayrimüslim unsurları, kadının sosyal statüsü, meslekleri, mimari eserleri, dönemin önemli kurum ve kuruluşları, devlet görevlileri gibi daha birçok konuyu esas alarak Burdur'un sosyal ve ekonomik hayatı ortaya konulmaya çalışıldı. Defterde bulunan kayıtların konuları, tablo halinde, sayfa numarası beyan edilerek uygun başlıklar altında okuyucuya sunulmuştur. Giriş bölümünde; çalışmamız esnasında yararlanmış olduğumuz konu ve kaynaklar açıklanarak, 225 Numaralı Burdur Şer'iyye Sicili muhtevası hakkında genel bir değerlendirme yapıldı. Osmanlı Hukuku ve adalet yapısında büyük bir ehemmiyet arz eden Şer'iyye mahkemeleri ve Şer'iyye Sicilleri hakkında genel bilgi verilerek, sicillerde bulunan belge türlerinden bahsedildi. Giriş bölümünün diğer aşamasında Burdur'un tarihçesi ele alındı. İki başlık altına alınan bu kısımda, öncelikle, ilkçağdan Osmanlı idaresine kadar Burdur'un geçirmiş olduğu siyasi durum anlatıldı. İkinci kısımda ise, Osmanlı hâkimiyetinde bulunan Burdur'un genel durumu incelendi Birinci bölümde Osmanlı Devleti'nin idari teşkilatının geçirdiği süreçler hakkında genel bir değerlendirme yapıldı. Osmanlı Devleti'nin Tanzimat sonrasında idari alanda yapılan değişikliklerden bahsedilerek, 19. yüzyılda idari sistemin işleyişi hakkında bilgi verildi. Sicil defterindeki bilgiler esas alınarak sancak statüsünde olan Burdur'un, kazaları, nahiyeleri, köyleri, mahalleleri ve bu dönemde idari birimlerde görev yapan devlet adamları ön planda tutularak, Burdur'un idari yapısı hakkında incelemeler yapıldı. İkinci bölümde söz konusu araştırmaya konu olan Şer'iyye Sicil defterinin içerisinde barındırdığı, evlenme, boşanma, nafaka, ölüm, miras gibi kayıtlar sayesinde Burdur'da yaşayan halkın aile hayatı, kişiler arası ilişkileri, yeme-içme kültürü, takı-süs anlayışı, giyim-kuşam anlayışı gibi birçok alanda bilgi sahibi olmamızı sağladı. Üçüncü bölümde Burdur'un ekonomik hayatı esas alınarak, halkın ekonomik uğraşları, mülk satışları ve alacak davaları gibi kayıtlara göre tespit edilmeye çalışıldı. İncelemiş olduğumuz sicil defterinden yola çıkarak Burdur'da tarım alanında kullanılan çiftlikler, bağ ve bahçeler, araziler, yetiştirilen tarım ürünleri hakkında bilgi verilerek, 1897-1898 tarihleri arasında Burdur'da bulunan zanaat ve esnaflardan bahsedilmiştir. Ayrıca çalışmamızın sonuna 225 Numaralı Şer'iyye Sicili transkripsiyonunu da dâhil ettik. Anahtar kelimeler; Osmanlı, Burdur, Şer'iyye Sicilleri, Sosyal Tarih."
