abstract: "ÖZET Ortadoğu, Asya, Avrupa ve Afrika'nın birleşim yeri olan, 1999 verilerine göre 486 milyon insanın yaşadığı 12.8 milyon km2'lik alam kaplayan bir bölgedir. Tarihin ilk dönemlerinden beri ticari, siyasi, coğrafi, iktisadi ve askeri yönden stratejik bir öneme sahip olmuştur. Kültürel ve etnik olarak üç dinin mensuplarının yaşadığı bölgelerin bir kesişim noktası olup, üç kıtayı kara ve su yollarıyla birbirine bağlamakta ve yakınlaştırmaktadır. Osmanlı döneminde sakin bir hayat yaşayan bölgede, Osmanlı'nın zayıfladığı dönemlerden itibaren siyasi ve etnik huzursuzluklar baş göstermiş ve Birinci Dünya Savaşı ile ingiliz ve Fransızların bölgeye el koymasıyla yeni bir dönem başlamıştır. Osmanlı döneminde yeraltı kaynaklarının önemi fark edilmeyen Arap Yarım adası ve Körfez Bölgesi'nde 1900'lü yıllarda petrolün bulunması ve işletilmeye başlan masıyla bölgenin önemi daha da artmıştır. Bölgenin stratejik önemim artıran sebepler, dünya petrol rezervinin %64'e yakınının bu bölgede olması, teknolojik gelişmelerle bu kaynakların kullanım alanlarının artması ile gittikçe tüketimin çoğalması ve petrolün bu ihtiyaçları karşılamak için yaygın ve ekonomik bir enerji kaynağı olmasıdır. Süveyş Kanalı'nın 1869'da açılması ile Akdeniz ve Hint Okyanusu arasında bağlantı sağlanmış, su yollan ile bu kaynakların dünyanın her tarafına ulaştırılabilmesi kolaylaşmıştır. Ülkelerin kaderini etkileyebilecek bu zenginliklere sahip olabilmek için büyük ve güçlü devletler birbirleriyle yarışmaktadırlar. Birinci Dünya Savaşı'nda Osmanlı'nın çökmesiyle, yıldızı parlayan İngiltere ve Fransa İmparatorlukları bölgeyi sömürgeleri altına almışlar, İkinci Dünya Savaşı'na kadar bölgeyi yönetmişler ve bölgenin kaynaklarından faydalanmışlardır. Bu savaştan sonra bölge ülkeleri yavaş yavaş bağımsızlıklarım kazanırken, güçlerini kaybeden bu iki devletin yerini Amerika doldurmaya başlamıştır. 1991 Körfez Savaşı ile bölgeye fiili olarak gelip özellikle Körfez Ülkeleri'nde üs kuran ve yerleşen ABD, son Afganistan ve Irak Savaşı ile bölgeye tamamen hakim olmuş ve burada kalıcı olduğunu hissettir miştir. Sovyetler Birliği'nin dağılmasıyla bu ülkenin yörüngesindeki birkaç Arap ülkesi de ABD çizgisine çekilmiş ve bu devlet her yönüyle bölge üzerinde hakimiyet kurmuş tur. 1 1 Eylül 2000 'de ülkesine yapılan saldırıyı bahane ederek, bölge ülkelerini teröriz min merkezi ve destekleyicisi olarak ilan etmiş ve Irak'ı işgal ederek yerleşmiştir. İran XVIve Suriye üzerinde de tehdit ve baskılan devam etmektedir. Öte yandan bölgede ABD'nin bir müttefiki olarak büyük bir güç durumunda olan İsrail'in Filistin üzerindeki baskı ve işgali devam etmekte olup, Lübnan ve Ürdün'ü pasifize ederek Filistinlilere yardım ve destek vermelerini engellemektedir. Yakın gelecekte, ABD ve İsrail'in bölgenin tamamı üzerinde siyasi ve ekonomik hakimiyet kurma olasılığı kuvvetlidir. İngiltere ve Fransa; Ortadoğu'dan çekilmeden önce yaptıkları anlaşmalarla, bölgedeki kaynaklardan pay almakta ve gelirlerini paylaşmakta iseler de, zamanla çoğunluk hisseleri bölge ülkelerinin eline geçmiştir. Ancak, bir çok ülkenin petrolünün üretimi ABD kökenli firmaların ortaklığı ile sürdürülmektedir. Petrolden elde edilen servetlerin büyüklüğü büyük devletlerin iştahını kabartır ken, 1973 ve 1980'li yıllarda petrol ihracatçısı Ortadoğulu devletlerin petrolün fiyatım artırarak ve üretimini kısarak gelişmiş ülkelere ambargo uygulaması ve bunu bir silah olarak kullanması, bu devletlerin hoşuna gitmemiştir. Zira, hem petrole ödedikleri paralar artmış, hem de petrol enerjisine dayalı sanayilerinin üretimi aksamıştır. Gelişmiş ülkeler için, petrolün ucuza elde edilmesi ve nakliye yollarının güvenliğinin sağlanması son derece önemlidir. Körfez Savaşı ve son Irak Savaşı'nın altmda yatan sebeplerin en önemlisi petrolün sahipliği ve üretiminin sağlanmasıdır. Petrolün üretiminin ve ihracatının artmasıyla elde edilen gelirlerin çoğalması, Ortadoğu ülkelerini zengin etmiş ve büyük bir servet birikimine sebep olmuştur. Bu ülkeler, elde ettikleri bu gelirlerin bir kısmım altyapı çalışmaları ve batıdan aldıkları lüks tüketim mallan için harcarken, büyük bir kısmım da değerlendirmek için ekonomik ve siyasi yönden istikrarlı bulduklan Avrupa ve ABD'deki bankalara, özel ve kamu sektörü tahvil ve hisse senetlerine yatırmışlardır. Daha sonra, bölge kaynaklarının bölge ülkelerinde değerlendirilmesi için çeşitli çalışmalar yapılmış ve tedbirler alınmıştır. Bu kaynaklann bölgede değerlendirilmesi için yerli bankalar kurulmuş, devlet gelirlerinden gerek hibe, gerekse yardım ve krediler yoluyla öncelikle Müslüman ülkelerin devlet ve halklanmn faydalanması için ulusal ve uluslararası fonlar kurulmuştur. Ortadoğu bölgesinde petrolden elde edilen gelirlerin artmasından önce gelenek sel ticari faaliyetler yapılıyordu ve bunların bankacılık hizmetleri İngiltere ve Fransa kökenli bankalar tarafından yürütülüyordu. Bu dönemde bankacılık fazla önemli değil- xvndi. Bölgede ingiliz ve Fransız sömürge yönetimleri zamanında Suriye ve Lübnan'da Fransız, diğer bölgelerde İngiliz para ve finans sistemi hakimdi. Körfez ülkeleri, İran ve Pakistan Hindistan'daki Rupee sistemine, Akdeniz çevresindeki ülkeler Mısır Sterling bölgesi finansal sistemine bağlıydı. Mısır'ın 1952 'de İngiltere ile bağlarını koparmasından önce, Kahire bir para ve finans merkezi idi. Bu tarihte yapılan askeri ihtilalle birlikte, İngiltere ile ilişkiler kesilmiş ve finans merkezi Lübnan'a kaymıştır. 1976'ya kadar Lübnan, bütün Ortadoğu'nun para ve finans merkezi olarak önemini korumuştur. Her türlü para giriş çıkışırım serbest olması, gizlilik prensibine riayet edilmesi, yetişmiş işgücünün bulunması, iletişim ve ulaşım ağının gelişmiş olması Lübnan'ı bir finansal merkez yapmış ve ülkeyi zenginleştirmiştir. 1970 'den itibaren Lübnan'daki iç savaş ve bankacılık krizi nedeni ile finans merkezi Bahreyn'e kaymıştır. Bahreyn'in 1971 'de bağımsızlığım kazanmasının hemen ardından bankacılıkla ilgili düzenlemeler yapması ve 1975 'den itibaren Offshore bankacılığı ve diğer yatırım sektörü firmaları için uyguladığı teşviklerle gerek klasik bankalar, gerekse İslami bankalar açısından, ülke tam bir bankacılık ve finans merkezi haline gelmiştir. 1991 Körfez Savaşı'ndan sonra ve son Irak Savaşı ile bölgedeki istikrarsızlıklar uluslararası yatırımcıları tedirgin etmiş ve yeni merkez arayışları başlamış olmasına rağmen, Bahreyn bankacılık ve finans merkezi olma özelliğini devam ettirmektedir. Ortadoğu ülkeleri, Avrupa ve ABD bankalarında ve menkul kıymetlerinde değerlendirdikleri paraların bir kısmım, ABD'nin 1979'da İran'ın banka hesaplarım dondurması üzerine, Almanya ve Japonya'ya yönlendirmişler ve bankalardaki değerle rin bir kısmım likit menkul kıymet yatırımlarına kaydırmışlardı. 11 Eylül' den sonra ABD'nin Ortadoğu ülkelerinin vatandaşlarına çeşitli sıkıntılar çıkarması nedeniyle bunlar, ABD bankalarından çektikleri bir kısım paralarım yönlendirecekleri istikrarlı ve güvenli piyasalar aramaktadırlar. Ortadoğu bankacılığını, geleneksel ticaretin hakim olduğu 1973 öncesi ve petrol gelMerinin artmasıyla birlikte bankacılık ve finans piyasalarının geliştiği 1973 sonrası dönem olarak ayırabiliriz. Bu ülkelerin, bölge kaynaklarının yine bölge ülkelerinde de ğerlendirilmesi konularında yapılan düzenlemeler çerçevesinde çok sayıda yerli banka ve fonlar kurulurken, faizli ve faizsiz kurumlar ve yatırım araçları da geliştirilmiştir. xvmBölgedeki petro-dolar potansiyelinden pay almak isteyen batı kökenli bankalar buralarda yeni şubeler açmışlar ve yeni bankalar kurmuşlardır. Dünyanın her tarafındaki ülkeler, bölgede Offshore bankacılık birimleri açmışlardır. Özellikle dünyanın en büyük bankacılık gruplarından olan Citibank (Çiti Group) ve HSBC Group faizli bankaların yanında, tamamen İslami usullere göre çalışan faizsiz bankalar da kurmuşlardır. Ortadoğu'nun mevduat potansiyelinden pay alabilmek ve uluslararası sermaye ile direkt temas kurmak için 1982 'den itibaren Türk bankaları Bahreyn'de Offshore bankacılık yapmak üzere şubeler açmışlardır. Öte yandan, Ülkemizde klasik bankalara gelmeyen Müslüman kesimin tasarruflarını bankacılık sistemi içine çekip ekonomiye kazandırmak için 1983 'de mevzuat düzenlemeleri yapılmış, Arap ülkeleri ve İslam Kalkınma Bankası'mn teşvik ve desteği ile İslami usulde bankacılık yapmak üzere Özel Finans Kurumlan kurulmuştur. Çalışmamızda Libya'dan Pakistan'a kadar uzanan 22 Ortadoğu ülkesinin klasik ve İslam Bankacılığı yapılan ve bu bankalann gelişmeleri ile kullandıklan flnansal teknikler incelenmiştir. Üç bölümden oluşan çalışmamızın birinci bölümünde Ortadoğu ülkelerinin fiziki, coğrafi ve flnansal açıdan tanımlan yapılarak global bazda finansal yapılan ve kurumlan tanıtılmıştır. Finansal kurumlardan, bankalar klasik ve faizsiz olarak aynlmış ve bu ayırıma göre fonksiyonlan itibariyle sınıflandmlarak merkez bankalan, kalkınma ve yatırım bankalan, ticari bankalar ile Offshore bankalar incelenmiştir. İslami bankalar ve 54 İslam ülkesi tarafından kurulan çok uluslu İslam Kalkınma Bankası ile banka olmamakla birlikte bankalar gibi fonksiyon icra eden, Körfez Bölgesi'ndeki devletlerin petrol gelirlerinden oluşan kaynaklarından fakir ülke ve şahıslara finansman sağlamak üzere kurulan ulusal ve uluslararası fonlar tanıtılmıştır. İkinci bölümde, Ortadoğu'daki klasik ve İslami bankalann finansman sağlamada kullandıklan finansal tekniklere bankacılık sınıflandırması çerçevesinde yer verilmiştir. Üçüncü bölümde ise, son yıllarda ülkemizde ve dünyada gelişme gösteren İslam bankalarının uygulamada karşılaştığı sorunlar ile ülkedeki mevduat potansiyelinden daha fazla pay alabilmeye ve ekonomi dışındaki tasarrufların bankacılık sistemine çekilmesine yönelik öneriler ile Türkiye'nin Ortadoğu ülkelerinden daha fazla fon transfer edebilmesine ve İstanbul'un bir finans merkezi olmasına dair önerilere yer verilmiştir. XTX"
