abstract: "Üç kıtanın son hükümdarı II. Abdülhamid Han'ın saltanatı Osmanlı Devleti'nin en zor ve en problemli dönemlerinden biri olmuştur. II. Abdülhamid Han, dağılma ve yok olma tehlikesi ile karşı karşıya kalan devletinin yönetim mekanizmalarını kendi kontolüne alarak saltanatı süresince Osmanlı Devleti'ne düşman olanların, devleti bölmeye ve parçalamaya çalışanların tuzaklarını, komplolarını engellemiştir. Basiretli idaresiyle devletin kaybolan prestijini tekrardan kazandırmıştır. II. Abdülhamid Han üzerine yapılan bir çok araştırmanın yanında eksikliğini gördüğümüz ve literatür çalışmalarına katkı sağlayacağını düşündüğümüz bu çalışma, II. Abdülhamid Han dönemi şeyhülislamlarının biyografilerini ve şeyhülislamların II. Abdülhamid Han'ın yönetimi üzerindeki etkilerini araştımayı amaçlanmıştır. Araştırmada öncelikle şeyhülislam kavramının, tarihsel süreçte ortaya çıkışı, İslam devletlerindeki gelişimi, Osmanlı Devleti'nde şeyhülislamlık makamının ortaya çıkışı ve kurumsallaşma süreci incelenmiştir. Şeyhülislamların konumunun daha iyi anlaşılması için atama kriterlerinden, görevlerinden, yetkilerinden, protokoldeki yerlerinden bahsedilmiştir. II. Abdülhamid Han'ın dönemini objektif değerlendirmek için biyografisi, karakteri ile özdeşleşen yönetim anlayışı ve yönetiminin özellikleri araştırılmıştır. II. Abdülhamid Han'ın, saltanat makamına geldiği 31 Ağustos 1876'dan, halʻ edildiği 27 Nisan 1909'a kadar şeyhülislamlık makamına atanan şeyhülislamların biyografileri, etkili oldukları belli başlı siyasi olaylar, II. Abdülhamid Han'ın devlet yönetimine etkileri mukayeseli bir şekilde incelenmiştir."
