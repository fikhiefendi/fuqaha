abstract: "Günümüzün küresel finans, etik bankacılık uygulamaları ve sürdürülebilir ekonomik kalkınma manzarasında tartışmanın ön saflarında yer almaktadır. Çalışmanın amacı, değere dayalı aracılık (VBI) finansal sektör sorumluluğunu nasıl artırabileceğini ve Dairesel Ekonomi (CE) ile uyumlu sürdürülebilir ekonomik uygulamaları nasıl teşvik edebileceğini daha iyi anlamaktır. Bu çalışmanın amacı VBI ilkeleri ve CE arasındaki karmaşık ilişkiyi araştırmaktır. Çalışmanın temel amacı, VBI ilkelerinin CE'nin felsefesine ve ilkelerine bağlı olan sorumlu bir finansal sistemin geliştirilmesine nasıl yardımcı olabileceğine bakmaktır. VBI konsepti, İslami finans iş modellerini ilkelerine uygun hale getirmek amacıyla 2017 yılında BNM tarafından tanıtıldı. 2021'de COP üyeleri, halka daha ayrıntılı bilgi sağlayarak şeffaflığı ve sorumluluğu artırmak için daha fazla çaba gösterdi. VBI, girişimcilik zihniyeti, toplumun güçlendirilmesi, iyi kendini yönetme ve iş davranışını içeren farklı özelliklerden oluşur. VBI'nın her bir unsurunun farklı CE faktörleri üzerindeki etkisinin kaynak verimliliği, faiz oranları, çevresel ayak izi, atık yönetimi, iş yaratma, geri dönüşüm oranı ve atık kullanımını kontrol etmek çok önemlidir. Çalışma, VBI elemanları ve CE için tanımlayıcı istatistikler ve esneklik hesaplamasını kullanır. Veri analizi için Malezya'daki 15 İslami bankaların verileri, özellikle uygulayıcılar topluluğunun (COP) üyeleri 2018-2021 döneminde analiz edilmiştir. Bu kurumlar arasında bankacılık çözümleri ve dijital teklifler. Bazı bankalar yüksek düzeyde evlat edinme ve yenilik gösterirken, diğerleri geride kalıyor ve iyileştirme için önemli bir yer gösteriyor. Müşteri katılımı, 15 İslami bankalarda güçlü bir alan olarak ortaya çıkıyor ve her kurum müşterisi ile düzenli etkileşim sergiliyor. Bulgular, Malezya'daki İslami bankaların, bankacılık sisteminin sürdürülebilirliği için etik uygulamaları daha da güçlendirmek için VBI'yı stratejik çerçeveleri olarak kullanabileceğini göstermektedir. Çalışma, VBI'ın finans kurumlarındaki bu dönüştürücü potansiyelinin CE hedeflerine ulaşmak için yerel ve küresel sürdürülebilirlik eğilimlerini hizalayarak rekabet avantajını nasıl artırabileceğini anlamak için politika yapıcılar, paydaşlar ve finans kurumları için değerli bilgiler sunmaktadır."
