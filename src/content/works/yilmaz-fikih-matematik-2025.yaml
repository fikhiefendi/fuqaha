abstract: "Müslümanın amelî hayatını düzenleyen fıkıh ilmi, hayatın her alanına taalluk eden hükümleri itibariyle kapsamlı bir niteliğe sahiptir. Fıkhın bu geniş kapsamı, onun diğer ilimlerle etkileşim içerisinde gelişmesini zaruri kılmıştır. Zira fıkhın bir mesele hakkında doğru hükme varması o meselenin mahiyetine vakıf olması ile, meselelerin mahiyetine vakıf olmak ise o meselelerin ilgili olduğu diğer ilimlerde derinleşme ile mümkündür. Fıkhın etkileşim içerisinde olduğu ilimlerden biri de matematiktir. Bu çalışma, fıkıh ve matematik arasındaki teorik etkileşimi özellikle İslam miras hukuku, fıkıh literatüründeki adıyla ferâiz ilmi üzerinden ele almayı amaçlamaktadır. Bu kapsamda tez, giriş, üç bölüm ve sonuçtan oluşmaktadır. Giriş içerisinde fıkhın genel itibariyle diğer ilimler, özelde ise matematik ile etkileşimine değinilerek meseleye dair mukaddime sunulmuştur. Tezin ilk bölümünde fıkıh eserleri üzerinden matematiğin kullanımı incelenmiş, klasik kaynaklarda kullanılan matematiğin mahiyeti belirtilerek fıkıh eserlerindeki hesaplamalara dair bir tasnif yapılmıştır. İkinci bölümde ferâiz ilmi matematik ile ilişkisi açısından ele alınmış, tezin odak noktasını oluşturan üçüncü bölümde ise İslam matematik eserlerindeki ferâiz bölümleri incelenmiştir. Konuya ilişkin kimi İslam matematik eserlerinde, matematiğin teorik bölümlerinin anlatımının akabinde bu ilmin pratik yönünün ferâiz hesaplamaları üzerinden gösterildiği saptanmıştır. Buradan hareketle İslam matematik eserlerinden örneklem seçilmiş ve bu eserlerdeki problemler fıkhî açıdan tasnif edilerek fıkhın matematik içerisindeki kullanımı ortaya konulmuştur. Bu sayede matematiğin teorik ve pratik gelişiminde ferâiz ilminin, genel itibariyle de fıkhın katkısı değerlendirilmiştir."
