abstract: "Çalışmada Türk katılım bankacılığının türev araç kullanımının fıkhî açıdan değerlendirilmesi ve türev araç kullanımı ile katılım bankacılığı performansı arasındaki ilişki incelenmiştir. Bu kapsamda ilk olarak türev piyasalarda en yaygın kullanılan forward, futures, swap ve opsiyon sözleşmeleri tanımlanmıştır. Sonrasında İslam hukuku açısından türev sözleşmeler vaad/vaadleşme kavramı, sarf akdi kavramı ve Faizsiz Finans Kuruluşları Muhasebe ve Denetleme Kurumu (AAOIFI) standartları doğrultusunda tahlil edilmeye çalışılmıştır. Yapılan tahlil sonucunda Türk katılım bankalarının türev araçlar içerisinden para swap ve vadeli döviz (forward) işlemlerini İslam hukuku açısından bazı kısıtlar doğrultusunda kullanabilecekleri sonucuna varılmıştır. Fıkhî tahlilin ardından Türk katılım bankacılığında kullanılan türev araçların hacmi ile katılım bankalarının risklilik ve kârlılık rasyoları arasındaki ilişki analiz edilmiştir. Bu amaçla Bankacılık Düzenleme ve Denetleme Kurumu (BBDK) internet sitesinden değişkenlere ait bilanço ve bilanço dışı verilerden yararlanılmıştır. 2012 Eylül – 2020 Haziran dönemini kapsayan çalışmada veriler üçer aylık olacak biçimde analize dahil edilmiştir. Analiz yöntemi olarak da Toda ve Yamamoto tarafından xii geliştirilen nedensellik testi tercih edilmiştir. Analiz sonucunda, türev araç kullanım hacmi ile bazı değişkenler arasında tek veya çift yönlü nedensellik ilişkisi tespit edilirken bazıları arasında herhangi bir nedensellik ilişkisi tespit edilmemiştir. Diğer taraftan katılım bankalarının türev araçlar içerisinden çoğunlukla para swap işlemlerini tercih ettiği ve türev araçları kâr amaçlı kullandıkları sonucuna varılmıştır."
