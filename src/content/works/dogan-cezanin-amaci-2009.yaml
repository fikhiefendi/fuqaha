abstract: "?Cezanın Amacı ve Hapis Cezası? isimli bu çalışmada, ceza ve cezalandırma kavramlarının geçirdiği tarihi aşamalar ile cezanın amacı bağlamında hapis cezası ele alınmaktadır.Birinci bölümünde; ceza kavramı, cezanın amacı, cezalandırma yetkisinin sınırları ve kaynağı ie cezalandırmanın ilkeleri, ceza türleri ve cezanın özellikleri incelenmiştir. İkinci bölümünde; hapis cezasına doğru ilerleyen tarihi süreç aktarılmıştır. Cezaevleri üzerinde durulmuş ve hapis cezanın infazında uygulanan sistemlerin geçirdiği aşamalar irdelenmiştir. Hukukumuz açısından İslam hukukunun etkisi ile Osmanlı Dönemi infaz biçimleri ve Cumhuriyet dönemi aktarılmıştır.Üçüncü bölümde iç hukuk düzenlemeleri ile uluslararası karşılaştırmalar aktarılmaktadır. Hapis cezası ile ilgili küresel sorunlar, hapis cezasının leh ve aleyhindeki görüşler ile birlikte bu bölümün ilk kısımda yer almaktadır.Üçüncü bölümün ikinci kısmında; ağırlaştırılmış müebbet hapis, müebbet hapis, uzun ve kısa süreli hapis cezaları, cezanın amacını gerçekleştirmeye uygunlukları bakımından analiz edilmiş ve karşılaştırmalı hukuk ile uluslararası hukuktaki durum uygulamalar aktarılmıştır. Müebbet hapis cezası bağlamında erken salıverilme hakkı irdelenmiştir. Avrupa İnsan Hakları Mahkemesi kararları ışığında, somut ve makul bir erken tahliye olanağı tartışılmıştır. Hapis cezasına seçenekler ve hapis cezasının cezaevi dışında infazı olanakları irdelenmiştir.Üçüncü bölümün ikinci kısmında, hapis cezasının infazı incelenmiştir. Hükümlülük statüsü, hükümlü hakları ve infazın denetlenmesi yöntemleri üzerinde durulmuştur. Hükümlü hakları, mevzuatımızda ve karşılaştırmalı hukuktaki güncel tartışmalar ışığında aktarılmıştır. Devletin hapis cezasına başvurmasının meşru ve hukuka uygun olmasını sağlayan iki temel çağdaş ölçüt olan yeniden sosyalleştirme ve yeniden suç işlenmesinin önlenmesi konusundaki gelişmeler, XX. yüzyıl boyunca geçirilen aşamalarla aktarılmıştır. Son olarak ceza infaz kurumlarının türleri hakkında bilgi verilmiştir. Çalışmanın ?Sonuç ve Değerlendirme? başlıklı kısmında, görüş ve önerilerimize yer verilmiştir."
