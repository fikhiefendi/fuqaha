abstract: "Bu araştırmada vadeli mevduat ve katılma hesabı arasındaki farklar incelenerek, faiz ve kâr payı olarak iki farklı isimlendirmeye sahip olan risk priminin iki farklı sistemde aynı koşullar altında getirileri arasındaki farklar araştırılmıştır. 1960'lı yıllarda dünyada gündeme giren katılım finans sistemi 25/2/1984 tarihli ve 18323 sayılı Resmi Gazete'de yayımlanarak 19 Şubat 1984 tarihi'nde yürürlüğe giren“Özel Finans Kurumları Kurulması Hakkında 83/7506 sayılı Kararname Eki Karara İlişkin Tebliğ”ile Türkiye'de uygulama alanı bulmuştur. Tebliğde ve uygulamada kâr ve zarara katılma payı olarak isimlendirilen risk priminin konvansiyonel bankacılık sistemi uygulamasında faiz olarak isimlendirilen risk priminden farklı olduğu iddiası yer almaktadır. Bununla birlikte 1985 yılında faaliyete geçen ilk katılım finans kuruluşlarından günümüze kâr ve zarara katılma payının faizden ne kadar farklı olduğu incelenmektedir. Bu sayede son yıllarda popülerlik kazanan finansal okuryazarlık alanında tasarruf sahibi hanehalkına iki farklı finansal ürünün kısa ve orta vadede getirileri hakkında bilgi sağlanarak yatırım tercihlerinde yardımcı olmak amaçlanmaktadır. Çalışmanın ilk bölümünde finansal okur yazarlık ve kişisel finans hakkında temel bilgilere yer verilmiş, ikinci bölümünde kişisel finans unsurlarından tasarruf araçları hakkında bilgiler verilmiş, üçüncü bölümde araştırma planı ve hazırlık süreci anlatılarak araştırmanın sonuçlarına ve genel değerlendirmeye yer verilmiştir. Araştırmada 2012 ve 2019 yılları arasındaki faiz ve kâr payı verileri ile 2012 ve 2020 yılları arasındaki TÜFE verileri kullanılarak 2012 ve 2019 yılları arasında vadeli mevduat ve katılma hesaplarının net reel getirileri haftalık frekansta hesaplanmış ve oluşturulan bu veri seti analiz edilerek en yüksek net reel getiriyi sağlayan finansal araç tespit edilmeye çalışılmış, ek olarak katılma ve mevduat hesaplarının yıllık net reel getirileri arasındaki ilişki Granger Nedensellik Testi ile incelenmiştir. Test sonuçlarında Türk Lirası cinsinden aylık ve yıllık ile ABD Doları cinsinden aylık vadeli mevduat ve katılma hesaplarının yıllıklandırılan net reel getirileri arasında çift yönlü ve Türk Lirası cinsinden üç aylık vadeli mevduat ve katılma hesaplarının yıllıklandırılan net reel getirileri arasında kâr payından faize, Avro cinsinden altı aylık vadeli mevdut ve katılma hesaplarının yıllıklandırılan net reel getirileri arasında faizden kâr payına tek yönlü Granger Nedensellik bulunmuştur."
