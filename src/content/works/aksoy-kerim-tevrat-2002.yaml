abstract: "Tezimizin adı,“Kur'ân-ı Kerim ve Tevrat'ta Aile Hukuku İle İlgili Âyetlerin Karşılaştırmalı Bir İncelemesidir. Bu konuyu incelerken, ”aile hukuku“ ile birlikte ”ahvâli şahsiyye\"yi esas aldık. Bu çalışmanın amacı; Kur'ân ve Tevrat'ta aile hukuku ile ilgili âyetler arasında mukayese yaparak, benzer ve farklı yönleri ortaya koymaktır. Giriş kısmında, Kur'ân-ı Kerim ve Tevrat hakkında genel bir değerlendirme ile birlikte aile hukuku kavramını inceledik. Birinci bölümde; şahıs kavramı, şahsiyetin başlangıcı ve son bulması, hısımlık (akrabalık), kölelik, haklardan istifade şartlan gibi konuları değerlendirdik. İkinci bölümde; evlilik hukuku, evliliğin sona ermesi, eşlerin karşılıklı hak ve ödevlerini, ana babanın çocukların şahsı ve mallan üzerindeki hak ve ödevleri, velayet ve vesayet gibi konuları ele aldık. Son bölümde ise; miras, terike üzerindeki haklar, miras manileri, mirasta derece ve mirasçıların hisseleri ile ilgili konulan içeren miras hukukunu inceledik."
