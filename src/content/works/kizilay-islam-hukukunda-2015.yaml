abstract: "İslam, gayr-i müslimlerin Müslüman toplum bünyesinde barındırılmasına izin vermiştir. Aynı toplumu paylaşmak gayr-i müslim ve Müslümanlar arasında birçok sosyal ilişkiyi de beraberinde getirmiştir.“Gayr-i Müslimin Şahitlik ve Haberinin Değeri”isimli tezimiz bu ilişkinin iki yönünü; şahitlik ve haber kavramlarını ele almaktadır. Tezimiz bir giriş kısmı ile üç bölümden oluşmaktadır. Birinci bölümde şahitlik kavramı üzerinde durulmuştur. Şahitliğin İslam hukukundaki yeri ve önemi incelenmiş, şahitlik için gereken şartlardan bahsedilmiştir. İkinci bölümde haber konusu ele alınmıştır. Konunun İslam hukukundaki yeri, haberin tanımı, çeşitleri, muhbirde aranan şartların neler olduğu gibi konular ele alınmıştır. Üçüncü bölümde ise gayr-i müslim kavramı incelenerek, gayr-i müslimlerin şahitlikleri ve haberleri değerlendirilmiştir. Çalışmamız neticesinde şu sonuca varılmıştır: Her iki kavramın da şahısları bağlayıcı bir yönü vardır. Fukaha, bu bağlayıcılığı velayet kapsamında değerlendirmiştir. Gayr-i müslimlerin şahitlikleri ve haberleri de bu ortak noktadan hareketle ele alınmıştır. Gayr-i müslimlerin Müslümanlar üzerine velayetleri yoktur. Bu sebeple Müslümanlar üzerine velayetin söz konusu olacağı şahitlikler ve haberler geçerli değildir. Velayetin söz konusu olmadığı, gayr-i müslimlerin kendi aralarında şahitlikleri ve dünyevi konularda verdikleri haberler ise geçerli görülmüştür."
