abstract: "Teşekkül döneminin önemli ilim merkezlerinden biri olan Şam'daki ilmî muhit ve bu muhitin mümessilleri yani ehl-i Şam hakkındaki malumatımız oldukça genel ve sınırlıdır. Bu araştırmada ehl-i Şam'ın keşfine ve bu muhitin en meşhur fakihi olan İmam Evzâî ve onun fıkıh düşüncesinin tetkikine çalışılmıştır. Tez iki bölümden müteşekkildir. İlk bölümde erken dönem ilim merkezlerinden biri olan Şam'ın ilmî serüveni hakkında, sahâbe, tâbiîn ve tebe-i tâbiîn dönemlerini içine alan bir tasvir yapılması ve böylece tebe-i tâbiîn neslinden olan İmam Evzâî ve düşüncesi için bir zemin oluşturulması amaçlanmıştır. Bu çerçevedeki tetkikler sayesinde ehl-i Medine ve ehl-i Kûfe'ye nispetle oldukça müphem olan ehl-i Şam'a ışık tutulmuş ve dikkate değer sonuçlara ulaşılmıştır. İkinci bölümde ise önce ehl-i Şam'ın en meşhur âlimi olan ve müctehid imamlar arasında yer alan Evzâî'nin ilmî şahsiyeti ekseninde biyografisi işlenmiş, ardından onun usûl anlayışı ana hatlarıyla tespit ve tahlil edilmeye çalışılmıştır."
