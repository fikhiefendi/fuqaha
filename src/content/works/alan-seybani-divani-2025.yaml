abstract: "Bu çalışmada, Şeybânî Han Divanı'nda sosyal hayat unsurları incelenmiştir. Divan, 16. yüzyıl Çağatay edebiyatının önemli eserlerinden biri olup, dönemin edebi anlayışını yansıtmanın yanı sıra Orta Asya'nın sosyal, kültürel ve siyasi yapısına dair önemli bilgiler sunmaktadır. Günümüze ulaşan tek yazma nüshası, İstanbul Topkapı Sarayı Müzesi 3. Ahmed Kütüphanesi'nde bulunmaktadır ve hem sanatsal hem de tarihsel değeriyle dikkat çekmektedir. Eserde aile ve sosyal ilişkiler, aşk ve sevgi, savaş ve zafer gibi temalar işlenirken, doğa tasvirleri de önemli bir yer tutmaktadır. Şeybânî Han, şiirlerinde halkın yaşadığı ekonomik sıkıntıları, dostluk ve komşuluk ilişkilerini, savaş meydanlarında kazandığı zaferleri ve kişisel kayıplarını içten bir dille anlatmıştır. Geleneksel divan şiiri anlayışının ötesine geçerek, tarihi olayları ve toplumsal konuları şiir formunda aktarmıştır. Aynı zamanda kendisini İslam'ın savunucusu olarak görmüş, ancak katı dindarlığa karşı çıkmış ve tasavvufi düşüncelere açık bir bakış açısı sergilemiştir. Divan'daki dini unsurlar, ibadet, tevekkül ve Hz. Muhammed sevgisi etrafında şekillenmiştir. Allah'a mutlak bağlılık, O'na kulluk etmenin insanın gerçek yüceliği olduğu düşüncesi şiirlerde vurgulanmıştır. Hz. Muhammed'e duyduğu derin sevgi, onun kainatın varlık sebebi olduğu inancıyla işlenmiş, bu bağlamda Miraç Kandili, Mevlid Kandili ve Nevruz gibi kutsal günler de özel bir yer tutmuştur. Nevruz, doğanın yeniden canlanışıyla manevi arınma ve yenilenmenin simgesi olarak ele alınmış, Şeybânî Han bu günü ayrılık acısını hafifletmek ve umut tazelemek için bir fırsat olarak görmüştür."
