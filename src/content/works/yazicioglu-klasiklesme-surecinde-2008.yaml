abstract: "Mezheplerin sistemleşmeye başladığı h. IV ve V. yüzyılda dinî alanda en önemli bilgi kaynağı olan vahiy, daha geniş bir ifade ile sem` olarak kabul edilmektedir. Dünyevî alanda bilgi kaynaklığı tartışmasız olan aklın, dinî alandaki bilgi kaynaklığı konusunda âlimler arasında görüş birliği oluşmamıştır. Bazı mezhepler bu alanda akla hiç söz hakkı tanımazken, birçok mezhep farklı derecelerde de olsa aklı konuşturmaktadır. Kabul edenler arasında ise akıl ile vahiy arasındaki hiyerarşiyi düzenlemek konusunda ihtilâf yaşanmaktadır.Akıl ile vahiy arasındaki hiyerarşi çatışması daha ziyade kelâmda gözlemlenmektedir. Fakat kelâm fıkıh usûlünün alt yapısını oluşturduğundan, burada gözlenen gerilim usûle de yansımaktadır. Sadece mükellef konumdaki insanların fiillerini konu edinen usûl, söz konusu tartışmayı başta vahiy gelmeden önce fiillerin aslen yasak mı yoksa serbest mi olduğu konusunda olmak üzere, içtihat, hükümlerin ta`lil edilmesi konularında gerçekleştirmektedir. Dinî alanda bilgi elde etmede akla öncelik verenler aklın, vahiy olmasa dahi fiiller hakkında hüküm belirteceğini savunmakta, bunun yanı sıra sem`î hitaptan sonra da dinî alanda aklın yetkinliğini geniş tutmaktadır. Bilgi elde etmede vahye öncelik verenler ise fiiller hakkındaki bu değerlendirmeyi vahiyle başlatmakta ve vahiyden sonra da akla mümkün olduğu kadar dinî meselelerde dar bir alan bırakmaktadırlar.Hanefî mezhebi, kurucu ismi Ebu Hanife (h.150) olmakla birlikte, gelişimini farklı ilim merkezlerinde ve farklı kelâmî görüşe sahip kişilerle devam ettirmiştir. Bu merkezlerden en önemlisi Bağdat ve Maveraünnehir'dir. Dördüncü yüzyılda, Mutezilî etkinin baskın olduğu Bağdat'ta Cessas tarafından sistemleştirilen usûlde, usûle konu olan fiilleri değerlendirmede aklın önceliği vardır. Aynı çizgi beşinci yüzyılda Debusî eliyle Sünnî ekolun etkin olduğu Maveraünnehir'de devam ettirilmeye çalışılmışsa da artık aklın, otoriterliği konusundaki görüşlerde Sünnî eğilime dönük bir kırılmanın yaşandığı gözlenmektedir."
