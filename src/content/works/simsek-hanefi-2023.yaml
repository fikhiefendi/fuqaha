abstract: "Bu çalışma, zalim imama itaatin gerekliliği veya ona isyanın meşruiyetine dair akâid/kelâm alanına giren tartışmaları, fıkıhtaki bağy meselesi ile karşılaştırmalı olarak ele almaktadır. Bağy, Müslüman toplum içerisinde silahlı güç sahibi bir grubun, haklı olduğuna inandıkları, ancak aslında haksız olan bir gerekçe (tevil) ile kendisine itaat gerekli olan imama ve Müslümanların geri kalanına karşı savaş başlatmaları anlamını ifade etmektedir. Çalışma, Ebû Hanîfe'den (ö. 150/767) başlayarak hicrî altıncı yüzyıla kadar Hanefî mezhebi mensuplarının görüşlerine odaklanmaktadır. Fıkıh mezhepleri arasından Hanefîliğin araştırmaya konu edilme sebebi, bu ekolün bağy meselesinin fıkıh literatürüne dahil edilmesinde merkezî rol oynamış olmasıdır. Ayrıca fıkıhta Hanefî mezhebini benimseyen âlimlerin kelâmda birbirlerinden ayrışarak çoğunlukla Mutezile ve Mâtürîdîlik şeklinde iki ana eğilime mensup olmaları, zalim kişinin imameti ve ona isyanın meşruiyeti meselelerinde görüş farklılıklarına sebep olmuştur. Bu çalışma, bahsedilen konularda Hanefî mezhebi içerisinde öne çıkan yaklaşımların gelişim sürecinin ve farklılaşmaların izini sürmeyi hedeflemektedir."
