abstract: "Tezimiz giriş ve üç bölümden oluşmaktadır. Giriş bölümünde araştırmanın konusu, amacı, kapsamı ve sınırları hakkında bilgi verilmiştir. İlk bölümde fıkıh, azınlık, fıkhu'l-ekalliyât, Batı Trakya ve dâr (ülke) kavramları, kavramsal çerçeve anabaşlığı altında incelenmiştir. İkinci bölümde, Müslümanların gayrimüslimlerle komşuluk ilişkileri, gayrimüslim kimselerin ikramlarına karşı tutum, boğazlama gerektiren ürünler, gayrimüslimlerin davetlerine katılma, dinî ve millî bayramlarını kutlama ve gayrimüslimlere maddi yardımda bulunma gibi insanî konular, fıkhu'l-ekalliyât bağlamında araştırılmıştır. Üçüncü bölümde ise Müslümanlarla gayrimüslimler arasındaki ekonomik ilişkiler, azınlık Müslümanlarının gayrimüslim kimselerle ortaklık kurması, Müslümanın gayrimüslimi çalıştırması, Müslümanın gayrimüslimin yanında çalışması, İslâm'ın haram kıldığı yoldan kazanç ve faizli muameleler başlıkları altında ele alınmıştır."
