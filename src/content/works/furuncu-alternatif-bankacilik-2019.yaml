abstract: "Uluslararası literatürde İslami bankacılık, faizsiz bankacılık veya alternatif bankacılık olarak isimlendirilen katılım bankacılığı, faiz getirisi elde etmek istemeyen finansal tüketicilerin tercih ettiği bankacılık türüdür. Türkiye'de katılım bankaları 1983 yılından itibaren“özel finans kurumu”adıyla faaliyet göstermeye başlamış, 2005 yılından sonra“katılım bankası”adı altında çalışmaya devam etmiştir. Son dönemlerde bazı kamu bankalarının katılım bankacılığı sektörüne giriş yapması, tahminen sektörün büyümesine katkı sağlayacaktır. O halde bankacılık sektöründe yakın gelecekte önemli bir yere sahip olacağı varsayılan katılım bankları ile ilgili araştırmaların, bu sektörün gelişimine yön vereceği düşünülmektedir. Bu bağlamda araştırmanın amacı, alternatif bankacılık kullanımını etkileyen faktörleri belirlemek ve yeni bir kabul modeli oluşturmaktır. Bu çalışma nicel araştırma desenine sahip olup, veriler TR90 bölgesinde yer alan altı ildeki (Trabzon, Ordu, Giresun, Rize, Artvin ve Gümüşhane) katılımcılardan toplanmıştır. Çalışmadan elde edilen veriler hem betimsel hem de yapısal analiz tekniklerine göre analiz edilmiştir. Bu analizlerin çözümlenmesinde ise SPSS ve AMOS paket programlarından yararlanılmıştır. Sonuç olarak, katılım bankacılığı kullanımındaki uyumluluk, özel normlar, dış etkiler ve endişe müşterinin algıladığı faydayı olumlu yönde etkilemişken, kolaylaştırıcı koşullar, güven ve öz yeterlilik ise müşterinin algıladığı faydayı olumlu yönde etkilememiştir. Ayrıca katılım bankacılığı kullanımındaki uyumluluk, kolaylaştırıcı koşullar, endişe ve güven müşterinin algıladığı kullanım kolaylığını olumlu yönde etkilemişken, özel normlar, dış etki ve öz yeterlilik müşterinin algıladığı kullanım kolaylığını olumlu yönde etkilememiştir. Ek olarak, katılım bankacılığı kullanımında algılanan kullanım kolaylığı ile algılanan fayda müşterinin tutumunu, müşterinin tutumu niyetini ve müşterinin niyet ise davranışını olumlu yönde etkilemiştir."
