abstract: "Bu tez çalışmasında İslâm ceza muhakemesine göre kişiler hakkında ortaya atılan bir töhmet/suçlama ya da yeterli, makul ve kuvvetli bir şüphe ile başlatılan kovuşturma ve muhakeme sürecinde hak ve yetkilere sahip ve talepleriyle muhakemeyi hareket halinde tutan ve hükmün kesinleşmesine kadar suç şüphesi altında sanık sıfatıyla yargılanan kişi hakkında, muhakeme/yargılama hukuku açısından fıkıh doktrinindeki genel bilgi ve verilerden hareketle daha genel ve toparlayıcı tespitlere ulaşmak, sanığın yargısal hükümlerinin neler olduğunu ortaya koymak hedeflenmiştir. Tez iki ana bölümden oluşmaktadır. Birinci bölümde, İslâm ceza hukuku ve ceza muhakemesine dair temel ilkeler ayrıntısıyla ele alınmıştır. İkinci bölümde ise, ilk olarak, araştırma, İslâm hukuku ve alt dalı olan ceza muhakemesi hukuku alanında sanık ve mahkemede muhakemeye katıldıklarından dolayı sanıkla ilgili diğer kişilerin/kavramların tanımı üzerinde durulmuş ve buradan hareketle, sanığın muhakeme safhasında, suç şüphesi bulunduğundan dolayı suçun ispat yolları, karineler, genel bir ilke olan sanığın şüpheden yararlanması, aynı bağlamda şüphe çeşitleri ve son olarak da sanık hakkında mahkeme tarafından; tutuklanması, gözaltı süreci, hapis cezası ve sorgulama safhasındaki işlemler ile ilgili tedbire dayalı verilen kararlar/hükümlere ilişkin muteber kabul edilen klasik ve çağdaş İslâm hukuku eserlerinden genel bilgi ve hukukî hükümler tespit edilmeye çalışılmıştır. Tez çalışması bu açıdan değerlendirildiğinde, ilk dönem klasik fıkıh kaynaklarına ve mümkün mertebe dört mezhebin muteber saydığı fıkıh kitaplarına müracaat edilmiş ve yeri geldikçe çağdaş fıkıh ekollerinin hukukçularının sanığın hükümleri ile ilgili görüşleri, ayrıntılı ve objektif bir biçimde açıklanmaya çalışılmıştır. Bu bağlamda, yapılan bu çalışmanın, İslâm ceza muhakemesi hukukunda sanıkla ve sanığın hükümleriyle ilgili özgün bir çalışma olduğu düşünülmektedir."
