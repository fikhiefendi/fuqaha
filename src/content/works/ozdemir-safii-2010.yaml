abstract: "Şâfiî Mezhebi fürû' fıkıh literatürü ve bunda yer alan mezhep görüşleriyle ilgili kavramlar, mezhebin doğuşundan günümüze gelinceye dek, sürekli bir gelişim halinde bulunmuşlardır. Şâfiî fürû' fıkıh literatürü mezhep tarihinde uzun bir seyir takip ettikten sonra bünyesine, görüşleri ifade eden kavramları katmıştır. Mezhebin fürû' fıkıh külliyâtında görülen dinamik yapı, mezhep görüşleriyle ilgili kavramlarda da kendini göstermiştir.Şâfiî Mezhebi fürû' fıkıh literatürünün ana kaynağını el-Ümm, el-İmlâ/el-Emâlî, Muhtasaru'l-Büveytî ve Muhtasaru'l-Müzenî teşkil etmiştir. el-Cüveynî bu eserleri özümseyerek Nihâyetu'l-Matleb'i yazar. el-Gazzâlî en-Nihâye'yi sırasıyla el-Basît, el-Vasît ve el-Vecîz adlı eserlerle ihtisâr eder. İmam Râfiî'nin el-Muharrer ve el-Azîz Şerhu'l-Vecîz adlı eserleriyle, İmam Nevevî'nin Minhâcu't-Tâlibîn, Ravdatu't-Tâlibîn, el-Mecmû' adlı eserleri mezhebin yeni kaynaklarını oluşturmuştur. Tuhfetu'l-Muhtâc (İbn Hacer) ve Nihâyetu'l-Muhtâc (er-Remlî), mezhebin geç dönem kaynaklarını teşkil etmiştir.Mezhep görüşleriyle ilgili kavramların gelişimi, fürû' fıkıh literatürünün gelişimini andırmaktadır. Fürû' fıkıh literatüründe yer alan mezhep görüşleri kavramları, İmam Nevevî'de tam bir sistematik bütünlüğe kavuşmuştur.Mezhep görüşleri kavramlarının belli başlıları şunlardır: el-kavl, el-vech, en-nass, et-turuk. İmam Nevevî'nin tanıttığı belli başlı tercîh kavramlarıysa şunlardır: el-ezhar, el-meşhûr, el-esahh, es-sahîh, el-mezheb. İmam Nevevî'nin kullandığı temel tazîf kalıplarıysa ve fî kavlin kezâ ve kîle kezâ'dır.Mezhep görüşleriyle ilgili temel kavramların ve tercîh/tazîf kavramlarının yanısıra görüşlerin söyleyenine aidiyeti, görüş belirtme, cevap, red, araştırma, itiraz, hülâsa için de bir takım kavramlar geliştirilmiştir. Ayrıca bir görüşün sıhhat ve hürmet derecesini belirtmek, rivayet, ikrâr, hilâf, teberrî, ihtimâl, bahs, nazar, tedebbür ve fark için de pek çok kavram geliştirilmiştir."
