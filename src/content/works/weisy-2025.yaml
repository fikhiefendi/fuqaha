abstract: "Çalışmanın amacı, İslami finansman standartlarının önemini, bunların dini temellerle ne ölçüde uyumlu olduğunu, gelişmelere ve yeniliklere nasıl ayak uydurduğunu, İslam fıkhının esnekliğini ve her zaman ve mekânda geçerliliğini vurgulamak, fıkhi görüşler arasında tercih yapma ölçütlerini ve dayanaklarını açıklamak, tercih edilen görüşten sapmanın hükmünü ve tercih edilmeyen görüşle çalışma gerekçelerini belirtmek, ayrıca (AAOIFI) için revize edilmiş İslami finansman standartlarında benimsenmiş olan tercih edilmeyen fıkhi görüşleri tanımak, bu konudaki tercih edilen görüşü ve onun delilini ortaya koymak, tercih edilen görüşten tercih edilmeyen görüşe geçişin gerekçelerini açıklamaktır. Bu amaçla, çeşitli yöntemler izlenmiştir; bunlar arasında tümevarım, tanımlama, analiz ve karşılaştırma bulunmaktadır. Fıkhi görüşler, araştırmanın ilgili yerinde belirtilen ölçütlere dayanarak tercih edilmeyen olarak sınıflandırılmıştır. Çalışma, dört mezhepten fıkıh âlimlerinin görüşleriyle sınırlı kalmış, diğer mezheplere değinmemiştir. Fıkhi meseleler, standartlarda yer alan sıralamaya göre düzenlenmiştir. Ayrıca, bilgilerin belgelendirilmesi, metinlerin bilimsel yöntemlerle kaynaklandırılması konusuna da özen gösterilmiştir. Çalışma, standartların kabul ettiği hiçbir tercih edilmeyen görüşün, farklı bir bakış açısıyla tercih edilen bir görüş olmadığını ve onunla çalışma için geçerli bir dini gerekçesi olduğunu ortaya koymuştur."
