abstract: "İslam dininin temel gayesi hak ve adâleti ayakta tutmak, toplum düzenini sağlamaktır. Bu bağlamda aile hayatı kurulurken evlenmeye büyük önem vermiştir. Zira evlenme, hem birey hem de toplum açısından dünyevî ve uhrevî birçok faydayı barındırmaktadır. Bunların en önemlisi de fıtrî bazı arzuların helal dairede karşılanması ve neslin bir düzen dâhilinde devamının sağlanmasıdır. Ancak bazı durumlarda taraflar, rahmet, ülfet ve muhabbet duygularını yitirebildiklerinden evliliğin sona erdirilmesi zorunlu hale gelebilmektedir. Bu nedenle İslam hukukunda evlenme gibi evliliğin sonlandırılmasına ilişkin de köklü düzenlemeler getirilmiştir. Çalışmada karşılaştırmalı bir biçimde İslam hukuku ile medeni hukuka göre nikâh akdinin fesih sebepleri incelenmiştir. Konunun İslam hukukuna bakan yönü dört mezhebin görüşleri çerçevesinde ele alınmıştır. Nitekim İslam hukukçuları, nassların farklı yorumlanmasına bağlı olarak nikâh akdinin feshi ile ilgili bazı meselelerde ihtilaf etmişlerdir. Konunun medeni hukuka bakan yönü ise evlenmenin yokluk ve butlanı kavramları üzerinden işlenmiştir. Zira medeni hukukun evlenmenin sonlandırılmasıyla ilgili kanun maddelerinde, fesih kavramı yerine yokluk ve butlan kavramları geçmektedir."
