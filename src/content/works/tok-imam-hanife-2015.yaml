abstract: "Ebû Hanîfe, İslâm düşüncesinin teşekkül devrinde yaşayan ve ortaya koyduğu düşüncelerle o dönemin fikir hayatına yön veren önemli bir şahsiyettir. O, düşünce sisteminin temeline Kur'ân-ı Kerîm'i koymuş ve yaptığı tüm ictihadlarda da onu ilk kaynak olarak kullanmıştır. Ebû Hanîfe'nin Kur'ân anlayışını ele aldığımız araştırmamızın ilk bölümünde, onun fikirlerinin oluşumunda etkili olan kişisel hayatı, yaşadığı bölgenin sosyo-kültürel yapısı, siyasî hadiseleri ve dönemin fikrî akımlarına inceledik. İkinci bölümde ise, öncelikle Ebû Hanîfe'nin, Kur'ân'ın tanımı, yorumlanması, İlahî kelamın mahiyeti ve başka dillere tercüme edilmesi gibi hususlardaki görüşlerini tespit etmeye çalıştık. Bu bölümde ayrıca, Kur'an'ın anlaşılmasında bilinmesi elzem olan Kur'ân ilimleri hakkındaki onun bilgisini ve yaklaşımlarını araştırdık. Araştırmanın üçüncü bölümünde ise, Ebû Hanîfe'nin Kur'ân'ı yorumlama usulü ve bu çerçevede yaptığı Kur'ân yorumlarına yer verdik. Çalışmamızı, Ebû Hanîfe'nin Kur'ân anlayışını ortaya koyan tespitlerimiz ile onlar hakkındaki değerlendirmelerimize yer verdiğimiz sonuç bölümü ile tamamladık."
