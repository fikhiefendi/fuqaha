abstract: "Makâsidü'l-Kur'âniyye ilmi İslâm şeriatının önemli ilimlerinden bir tanesidir. Dolayısıyla Kur'ân'ın maksatlarını incelemek ve bu maksatların değerini ortaya koymak genel olarak şeriat sahasıyla ilgilenenler için özel olarak da fıkıh ve tefsir alanlarına ilgi duyanlar için önem arz etmektedir. Özellikle bu ilim cüz'î konularla sınırlı kalmayıp hayatın her alanındaki küllî ve genel amaçlara ulaştırmaktadır. Mütekaddim ve müteahhir alimlerin bu ilmin önemine dair bazı işaret ve göndermeleri bulunmaktadır. Ancak bu işaretler daha çok arızi olup açık bir şekilde belirtilmemiştir. Makâsıd kelimesi sözlükte bir şeyi kastetmek, azmetmek ve girişmek anlamlarına gelen kasd kökünden gelmektedir. Ayrıca yakınlık, doğru yol, itidal ve tamama erme gibi manalar da bu kelimenin anlamları arasında yer almaktadır. Makâsıd kavramının her ne kadar kapsayıcı ve genel bir tanımı olmasa da bu kavram ve onun teşri' hikmetinin bilinmesindeki önemi, bu kavramın maslahatların celbi ve mefsedetlerin def'i ile ilgili olduğunu göstermektedir. Makâsıd ilmi gerek sahabe gerekse onlardan sonraki dönemde önemli bir rolü bulunmaktaydı. Sonra bu ilim zamanla gelişerek İmâm Şâtıbî'ye gelinene kadar hakkında müstakil eserler mevcut değildi. İmâm Şâtıbî el-Muvâfakât adlı eserini telif edip bu kitapta Makâsıd ilmi için ayrı bir bölüm açtı ve bu bölümü makâsıd ilmi diye isimlendirdi. Sonra günümüze kadar bu ilmin konuları çoğalarak ve tedavülde yer bularak gelişti. Bu çalışma esnasında Kur'an-ı Kerîm'den bazı âyetlerin, şeri ilke ve hükümlerin teşri'indeki gaye ve maksadını açıkça belirterek bu gayenin itikadın düzeltilmesi, güzel ahlaka teşvik etmesi, insanların idare edilip yönetilmesi ve benzeri amaçlar şeklinde olduğunu ortaya koymaya çalıştık. Bununla birlikte bu gayeyi açık bir şekilde belirtmeyen diğerlerinden önce gelir. Zira hayat idamesi onsuz mümkün değildir. Bu nedenle İslam şeriatı daha çok zarûriyyât üzerinde yoğunlaşmıştır. İslam şeriatının önemseyip korumasını gaye edindiği zarûriyyât din, can, mal, namus ve akıl şeklinde temel beş kısma ayrılmaktadır. Yukarıdaki taksimatın yanı sıra makâsıd genel ve özel olmak üzere iki kısma ayrılmaktadır. Genel maksatlar insanların genel hayatında gerçekleştirilmesi için şeriatın getirdiği maksatlardır. Özel maksatlar ise insanların hayatlarından sadece belli ve cüz'î bir alanda gerçekleştirilmesi amaçlanan hususlardır. Kur'an-ı Kerîm ayetlerinden maksatların ayetlerin varlığı da söz konusudur. Fakat bu ayetlerin sayısı az olduğu için çalışmamızda onlara yer vermedik. Yine Kur'ânî maksatların şer'i maksatlar ile ilişkisinin çok güçlü olduğu hususu da çalışma da varılan sonuçlardandır. Bu ilişki ve irtibat aslın fer' ile olan ilişkisi gibidir. Ancak aralarında bazı farklı noktalar da bulunmaktadır. Zira Makâsidü'şşeri'a ifadesi daha çok usûl ile ilgili bir kavramdır. Buna karşı makâsidü'l-Kur'âniyye ifadesi ise tefsir ile ilgilidir. Yine Makâsidü'şşeri'a'nın tek bir konusu söz konusu iken makâsidü'l-Kur'âniyyenin birçok konusu bulunmaktadır. Çünkü makâsidü'l-Kur'âniyye, hayatın tüm bulunup belirlenmesi mümkündür. Çünkü nerdeyse bir maksat, gaye veya belli bir hedef taşımayan bir ayet söz konusu değildir. Ayetlerdeki bu maksatların bulunup bilinmesi veya bu maksatların bilinmesini sağlayan yöntemleri, İslam'ın genel ve evrensel olması, hükümlerdeki kolaylık, denge ve orta yol şeklinde saymak mümkündür."
