abstract: "XVI. yüzyıl Osmanlı ulemâsının dikkat çekici figürlerinden biri olan ÇivizâdeŞeyh Muhyiddin Mehmed Efendi, doğduğu andan itibaren kendisini ilmî birçevre içinde buldu. Tabiatıyla bu çevrenin de tesiriyle ilmiye tarîkine yöneldi.Bu tarîkde talebelik, müderrislik ve kadılık gibi aşamaları geçerek, Osmanlıilmiye teşkilatının tepe makamları olan Anadolu Kazaskerliği, RumeliKazaskerliği ve müftîlik makamlarına erişti. O, bu makamlarda ses getirenkararlara imza attı. Onun bu tür kararları, genellikle o güne kadaruygulanagelen Osmanlı geleneğine muhalif nitelikte idi. Çünkü o, ilmîzihniyeti itibariyle, Osmanlı ilim geleneğindeki hâkim zihniyet ve yaklaşımdanbelli ölçüde ayrılıyordu. Daha açık bir ifadeyle o, fıkhî meselelerde ?taklidgeleneği prensipleri çerçevesinde selefî tavra? sahip ?rivâyetçi? bir âlim olarakstatik düşünce tarzına sahipti. Oysa zamanın diğer çoğu Osmanlı âlimi, aynımeselelerde ?yorumcu? ve ?dinamik? bir yaklaşım sergiliyorlardı. Keza o,?vahdet-i vücûd?cu tasavvufî düşünce geleneği konusunda da diğer çoğuOsmanlı âliminden farklı olarak, -İbn Teymiyye?nin izinde- sert bir menfî tavırtakınmıştı. İşte Çivizâde, ilmî zihniyetinden kaynaklanan bu tür yaklaşımlarınedeniyle, XVI. yüzyılın ilk yarısında farklı bir Osmanlı âlimi tipi olaraktemâyüz etti."
