abstract: "Selefi tefsir ekolünün özelliklerini ve VIII. asırda yaşayan İslâm âlimlerinden İbn Receb el-Hanbelî'nin (ö.795/1393) hayatını, ilmi kişiliğini ve özellikle selefî tefsir ekolü içerisindeki yeri ile onun tefsir metodunu incelemeye çalıştık. Amacımız İkinci yüzyılda Ahmed b. Hanbel ile başlayan, günümüze kadar süregelen ve bazı dönemlerde farklılaşma geçiren selefi tefsir anlayışın özelliklerini anlatarak selefi tefsirin diğer tefsir çeşitlerinden ayrılan yönlerini belirtmek ve bu anlayışa mensup İbn Receb el-Hanbelî'nin selefi tefsirdeki yerini tesbit etmektir. Çalışmamızı bir giriş ve üç bölümden oluşturduk. Birinci bölümde selef kavramını açıklayarak selefi mezhebinin tarihsel gelişimini, başlıca görüşlerini ve özelliklerini açıkladık. Bu bölümde selefi tefsirin yöntemine değinerek selefi tefsirin geçirdiği dönemleri ayrı ayrı ele aldık. Ayrıca selefi tefsirin akıl ve nakil ilişkisine yer vererek tev'ile olan bakışını açıkladık. Bölüm sonunda ise selefi tefsirin işari tefsiri bakışını açıklayarak modern dönemdeki selefi tefsir anlayışının geldiği duruma dikkat çektik."
