abstract: "Atasözleri ve deyimler milletlerin ortak kültürel özellikleri arasında yer alır ve belirli bir milletin tecrübe ve kültürünü, seci' ve ses uyumu üzere kurulmuş bir kalıpla o halkın kültürüne ve inancına dayanan felsefi bilgelik veya mantıksal yargılar şeklinde özetler. Atasözleri ve deyimlerin önemi, nesiller boyunca şifahî olarak oluşan ve nakledilen ve kuşaktan kuşağa hafızalarda kök salan yerel bir kültür olmasında saklıdır. Atasözleri ve deyimler aynı zamanda araştırma için de zengin bir konudur. Zira hayatın tüm yönlerini ele aldığı ve tüm sosyal, ekonomik, politik ve dini sistemleri kapsadığından toplumların gelişim bilgisini ifade etmektedir. Bunlar, aynı zamanda yüzyıllarca nesilden nesile tevarüs eden ve sürekli yeniden üretilen, insanlığa ait maddi olmayan bir miras ve hazinedir. Çalışmamız giriş ve iki ana bölümden oluşmaktadır. Giriş bölümünde, atasözleri ve deyimlerin ortaya çıkışı, milletlerin düşünce ve tasavvurlarını ifade etmedeki rolü, insan tecrübelerinin artması ve birikmesi sonucu zamanla gelişimi ve konuyu ele alan eski ve yeni Türkçe ve Arapça kaynakları ele aldık. Birinci bölümde sözcük ve terim olarak atasözlerinin ve deyimlerin tanımını, aralarındaki farkları, en önemli atasözü ve deyim türlerini, ortaya çıkış sebeplerini ve özelliklerini ele aldık. Çalışmamızın son kısmı olan ikinci bölümde Arapça ve Türkçedeki atasözleri ve deyimler arasındaki anlam ve lafız olarak benzerlik, uyum ve farklılıklık açısından karşılaştırma yapılmıştır."
