abstract: "Zekât, Müslümanın Allah'ın rıza ve hoşnutluğunu kazanabilmek için, malının bir kısmını hak sahibine vererek ifa ettiği mali bir ibadettir. Zekât ibadetinin, Hz. Peygamber özelinde tarihsel sürecine bakıldığında, Medine döneminde farz kılınarak, diğer ibadetler arasında yerini aldığı görülmektedir. Hz. Peygamber ve Halifeler döneminde devlet eliyle, devletin zekât memurları tarafından toplanmış, ancak bu dönemden uzaklaşıldıkça, zekât-devlet ilişkisi gittikçe zayıflamış, tarihsel süreç içerisinde de bireysel olarak ifa edilmeye başlanmıştır. Osmanlı Devleti uygulamalarına bakıldığında da, bir kurumsallaşmanın olmadığı, vatandaşın zekât ödemelerini kendi eliyle yaptığı görülmektedir. Günümüzde, İslam ülkelerinde kurumsal yapılar ortaya konmaktadır. İslam ülkelerinin bir kısmında zekât kanunları çıkarılarak, zekât ödemeleri zorunlu hale getirilirken, bir kısmında ise, zekât ödemeleri gönüllü olarak yapılmaktadır. Bu ülkelerde, zekât kurumlarında biriken fonların, yoksulluk ile mücadelede önemli bir finansman kaynağı olduğu görülmektedir. Ülkemizde ise, zekâtın kurumsal bir bünyede toplandığı bir zaman dilimi olduğunu söylemek zordur. Hali hazırda ülkemizde gerek ibadetlerle ilgili problemlerin çözümünde, gerekse toplumun dini konularda bilgilendirilmesinde söz sahibi olan kurum Diyanet İşleri Başkanlığı'dır. Zekât kurumunun en kolay, en hızlı ve maliyetsiz olarak Diyanet İşleri Başkanlığı çatısı altında oluşabileceği dikkate alındığında, Diyanet personelinin zekâtın kurumsallaşması noktasında düşünceleri önem arz etmektedir. Bu çalışmada, zekâtın kurumsallaşmasına, Diyanet personelinin bakış açısı incelenmiştir. Anket yöntemi kullanılarak ortaya konan çalışmada; Diyanet personelinin vermeleri gereken zekât miktarından daha az ödeme yaptıkları ya da sahip oldukları servetin zekâta müstehak mallardan olmadığı, zekâtın Diyanet İşleri Başkanlığı bünyesinde kurumsallaşmasına sıcak baktıkları, zekâtın vergiden mahsup edilmesi halinde zekât ödemelerinin artacağını düşündükleri, zekâtın ekonomi üzerindeki olumlu etkilerinin farkında oldukları ve zekât konusunda hizmet içi eğitime ihtiyaç duydukları bulgu olarak tespit edilmiştir. İslam ülkeleri gibi zekâtın kurumsal yapıya kavuşarak, yoksulluk ile mücadelede önemli bir finansman kaynağı olabileceği ve bunun Diyanet İşleri Başkanlığı bünyesinde yarı özerk bir halde teşekkülünün uygun olacağı araştırmada ortaya konulmaktadır. Bu sonuç politika yapıcılar için önemli bir bilimsel bulgu sunmaktadır."
