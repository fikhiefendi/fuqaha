abstract: "Araştırmanın hedefi (medya ve İslami ekonomi gözüyle tüketim davranışlarına etkisi) ile medya ve medya araçlarının tüketim davranışlarının değiştirilmesinde ne kadar etkili olduğu ve tüketici kanaatlerini değiştirmesi yönünden etkenlerin belirlenmesi dir. Aynı şekilde tüketicilere karşı medya organlarının görevlerini kanunlaştırmak için İslam'ın inşa etmiş olduğu kurallara ve tüketici davranışlarının irşadı için İslam iktisadının getirmiş olduğu kurallara ışık tutmaktadır. Araştırmacının bu araştırmasında araştırmacıların yazmış olduğu bireylerin psikolojik yönleri ve satın alma işleminde tüketici yönelişleri ile ilgili yazılara müracaat ederek niteleme yöntemini kullanması, aynı şekilde medya mesleği ile ilgili kuralları ve tüketim etkenlerini toplamış olması, istanbulda yaşayan yemen toplumundan örnek görüşler toplamak amacıyla takip ettikleri klasik ve modern medya araçlarıyla elektronik kamuoyu araştırma tasarımı ile istatistik yöntemini kullanması. Araştırmacı modern medya organlarının insanların bilgi edinmekte tek dayanakları olması itibariyle tüketici davranışlarına hâkim konuma geldiği sonucuna ulaştı. Nitekim istanbulda yaşamakta olan Yemenli tüketicilerde medya organlarını takip etme sonucu karşılaşmakta oldukları zararlar konusunda bir anlama noksanlığı nın hala devam ettiğini, bu sebeple farkındalık olmaksızın alışveriş merkezlerine akın etmelerine sebep olduğunu, aynı şekilde aile bireyleri arasında gelir seviyesi ve ihtiyaçların hacmi konusunda bilgilendirme konusunda kopukluk bulunmaktadır. Araştırmacı tüketicilerin tüketici davranışları hususunda irşat edilmelerinin önemini belirterek bilinçlendirilmelerinin zorunluluğuna tavsiye etti ve tüketicilerde bilinç seviyesinin yükselmesine çalışan medya içeriklerinin kullanılmasını ve satın alma içgüdüsünün doğru şekilde nasıl kullanılacağı konusunu ekledi. Aynı şekilde tüketicileri aldatan medya araçları için engelleyici kanunların işletilme gereğini tavsiye etti. İslam iktisadının teorik yönünü desteklemek suretiyle tüketici davranışlarıyla ilgili medya alanında araştırmanın önemine işaret etti."
