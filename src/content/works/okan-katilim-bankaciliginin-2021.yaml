abstract: "Bu çalışmanın amacı, Türkiye ve Kuveyt'te katılım bankacılığının çeşitli ekonomik değişkenlerle ilişkisini incelemektir. Bu amaçla 2013 – 2018 döneminde Türkiye ve Kuveyt'teki banka sayıları, banka şube sayıları, katılım bankalarının ATM sayıları, katılım bankalarının aktif toplamları, katılım bankalarının özkaynakları, kredi hacimleri ve kredi artış oranları incelenmiştir. Ardından kredi artış oranlarının büyüme, gelir dağılımı ve sosyal refah düzeyleri üzerindeki etkileri karşılaştırılmıştır. Elde edilen sonuçlara göre Türkiye'nin katılım bankacılığı alanında banka sayısı, şube sayısı, katılım bankalarının özkaynak miktarındaki yükseliş ve katılım bankalarının aktif toplamlarındaki artışta Kuveyt'ten ileride olduğu ancak Kuveyt'in ATM sayısının artışı konusunda Türkiye'den ileride olduğu anlaşılmıştır. Her iki ülkenin kredi artış oranları ile büyüme, gelir dağılımı ve sosyal refah düzeyleri arasında ise değişken ilişkiler olduğu gözlemlenmiştir. 2013-2018 yılları arasında Türkiye'de katılım bankacılığı alanında ciddi atılımlar yapıldığı ve devlet tarafından da katılım bankacılığı sektörüne giriş yapıldığı, Kuveyt'te ise katılım bankacılığı konusunda atılımların daha düşük olduğu gözlemlenmiştir. Katılım bankacılığının, bankacılık sektöründe daha fazla paya sahip olabilmesi için insanların katılım bankacılığının işleyişi konusunda daha fazla bilgilendirilmesi gerektiği ve daha fazla reklam yapılması gerektiği sonucuna ulaşılmıştır. Katılım bankacılığına ilginin son yıllarda artmaya başladığı ancak bazı potansiyel müşterilerin katılım bankacılığı sisteminin işleyişini tam olarak bilmemesinden dolayı katılım bankacılığına mesafeli durduğu, bu nedenle katılım bankacılığının tanıtımının başarılı bir şekilde yapılması durumunda tasarruflarını“yastık altı”olarak değerlendiren potansiyel müşterilerin tasarruflarını katılım bankacılığında değerlendireceği ve bunun da dolaşımdaki likidite miktarını artırarak ekonomiye olumlu katkıları olacağı kanaatine varılmıştır."
