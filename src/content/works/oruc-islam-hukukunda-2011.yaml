abstract: "İslâm hukuk terimi olarak ?deyn? kelimesi, birbiriyle etkileşim içinde bulunan taraflardan birinin diğerine karşı yerine getirmekle yükümlü olduğu mâlî sorumluluk anlamını ifade eder. Türkçe karşılığı olarak kullandığımız ?borç? kelimesi ise deynden daha geneldir. Borç, mâlî olup olmamasından kat-ı nazarla tarafların birbirlerine karşı yerine getirmekle yükümlü oldukları bütün sorumlulukları için kullanılır. Arapça'da bu manayı ifade eden kelime ?mûcep? veya ?mültezem? kelimeleridir.Çalışmamızda, deynin İslâm hukukundaki yerinin çizilmesi, diğer konularla bağlantılarının belirlenmesi amacıyla klasik Fıkhımızın muteber kaynaklarına müracaat edilmiş, mümkün olduğunca modern hukukçularımızın eserlerinden yararlanılmıştır.Çalışmamız, giriş, üç ayrı bölüm ve sonuç kısımlarından oluşmaktadır. Giriş bölümünde araştırmanın konusu, amaç ve öneminden, yöntem ve konuyla ilgili daha öneden yapılmış çalışmalardan; birinci bölümünde deynin tarifi ve mahiyetinden, deyn ? hak ilişkisi ve deyni doğuran sebeplerden; ikinci bölümde deynin kısımları ve deynin güvence altına alınma şekillerinden; üçüncü bölümde ise deynin intikâli ve sona ermesinden bahsettik. Çalışmamıza bir sonuç bölümüyle son verdik."
