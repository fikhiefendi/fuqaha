abstract: "Makroekonomik dengesizliklerin ve gelir dağılımı adaletsizliklerinin temel kaynaklarından biri olan enflasyon olgusu, çeşitli iktisat okulları ve İslam iktisadı perspektifinden karşılaştırmalı olarak ele alınmaktadır. Araştırmanın temel problemi, derin bir sosyoekonomik kriz mahiyetindeki enflasyona karşı halihazırda uygulanan ekonomi politikalarının yapısal yetersizliğinin saptanmasıdır. Bu doğrultuda, D-8 İşbirliği Teşkilatı üyesi dokuz ülkenin 1999-2023 dönemine ait yıllık makroekonomik verileri kullanılarak maliye ve para politikalarının fiyatlar genel düzeyi üzerindeki etkileri araştırılmaktadır. Maliye politikalarını ölçmek için kamu borcu, kamu harcamaları ve kamu gelirlerini yansıtan veriler kullanılmıştır. Para politikaları ise politika faizi, geniş para arzı ve döviz kuru değişkenleriyle incelenmiştir. Analizde Dünya Bankası ve IMF gibi kuruluşların veri setlerinden yararlanılmıştır. Çalışmada ilk olarak yatay kesit bağımlılığı sınanmıştır. Ardından ikinci nesil CIPS panel birim kök testi ile heterojen seriler için kurgulanan panel Granger nedensellik yöntemleri uygulanmıştır. Elde edilen ampirik bulgular neticesinde, panel genelinde kamu borcu ile enflasyon arasında birbirini besleyen çift yönlü güçlü bir etkileşim tespit edilmiştir. Kamu harcamalarının, genişletici para arzının ve kur dalgalanmalarının ise fiyatları tek yönlü olarak doğrudan tetiklediği saptanmıştır. İlave olarak, geleneksel politika faizi araçlarının enflasyonu dizginlemede çoğu zaman etkisiz kaldığı ve bizzat enflasyonist beklentiler neticesinde şekillendiği sonucuna varılmıştır. Enflasyonun servet transferine yol açan yıkıcı maliyetlerine karşı, faize dayalı borçlanma mekanizmaları yerine risk paylaşımını ve reel varlıkları merkeze alan İslam iktisadının faizsiz finansman modellerinin hayata geçirilmesi gerektiği vurgulanmıştır. Sonuç olarak ekonomik istikrarın tesisi adına salt parasal sıkılaştırma tedbirleriyle yetinilmeyip, zekât ve vakıf gibi yeniden dağıtım kurumlarıyla desteklenmiş, üretime dönük ve ahlaki temellere dayanan bütüncül makroekonomik reformların gerçekleştirilmesinin gerekli olduğuna ulaşılmıştır."
