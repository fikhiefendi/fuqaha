abstract: "Borç, tarihin her zamanında yaşayan insanlar arasında iktisadî bir olgu olarak karşımıza çıkmaktadır. Doğası gereği borç veren kişinin elinde bulundurduğu menfaati bir başkasına kullandırması karşılığında bir menfaat elde etmesini de gerektirir. Günümüz bankacılık sisteminde bu menfaat, faiz olarak karşımıza çıkmaktadır. Bankalar, müşterilerine kullandırmış olduğu kredi karşılığında faiz almaktadırlar. İslam dinine göre faizin yasaklanmış olması, dinî hassasiyetleri olan insanların ihtiyaçlarını karşılayabilmesi için farklı yöntemler aramasına sebep olmuştur. Karz-ı hasen, faizi tam olarak ortadan kaldıramayacak bir yöntem olsa da müslümanlar arasında borç ilişkilerinde tercih edilen bir yöntem olarak görülmektedir. Allah rızası için verilen güzel borç anlamındaki karz-ı hasen, ihtiyaçları gidermeye yönelik kullanılmaktadır. Karz-ı hasenin temel amacı, Allah'ın rızasını kazanmak ve insanların ihtiyacını karşılamaktır. Karz-ı hasen, kar sağlama amacı olmadığı için yardımlaşmayı destekleyen kurumlarda resmi olarak ya da bireylerin kendi aralarında gayrı resmi olarak uygulanmaktadır. Bu çalışmanın temel amacı, karz-ı haseni gayrı resmi olarak uygulayan sandıkların işleyişlerini ve yapısını araştırıp incelemektir. Bu sandıkların karşılaşmış oldukları problemleri tespit etmektir. Nihayetinde bu problemlere bulmuş oldukları çözümleri aktarmaktır. Gayrı resmi karz-ı hasen sandıklarının yaygınlaşmasının imkanını ortaya koymaktır. Bu sandıkların resmiyet kazanmasının olabilirliği incelenecektir. Bu kapsamda biri yurt dışında on biri yurt içinde olmak üzere toplam on iki gayrı resmi karz-ı hasen sandığı incelenmiştir. Sandıklar hakkında bilgi sahibi olmak için nitel araştırma yöntemi kullanılarak katılımcılarla mülakatlar yapılmıştır. Mülakatlar, yarı yapılandırılmış yöntem kullanılarak online veya yüz yüze gerçekleştirilmiştir. Sandıklar, kuruluş serüvenleri, fon toplama ve karz dağıtma yöntemleri ve amacı gibi yönlerden değerlendirilmiştir. Karz-ı hasenin yaygınlaşabilirliği hususunda İslam iktisat literatürüne önemli katkıları olacağı beklenmektedir."
