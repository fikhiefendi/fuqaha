abstract: "Asıl ismi Muhammed olan İbn Ebî Leylâ 74/693 yılında Kûfe'de doğmuştur. Tâbiinden meşhur Abdurrahman İbn Ebî Leylâ'nın oğludur. Yusuf b. Ömer tarafından 122 yılında kadılık görevine getirilen İbn Ebi Leyla bu görevini hem Emeviler hem de Abbasiler döneminde ölene kadar sürdürmüştür. Ebu Hanife'nin çağdaşı olup rey ehlinden kabul edilmektedir. Uzun süre resmi görev yaptığından dolayı düzenli bir ders halkası ve öğrenci grubu olmamıştır. Onun bilinen bir eseri mevcut değildir. Onun fıkhı görüşlerinin bir kısmını Ebu Yusuf ?İhtilafu Ebî Hanîfe ve İbn Ebî Leylâ? isimli kitabında zikretmiştir. Mutlak bir müçtehit olan İbn Ebi Leyla'nın mezhebi yayılmamıştır. Rical âlimlerince eleştirilmiştir. Ama onun hakkında yapılan bu eleştiriler tartışmaya açıktır.148/765 yılında vefat etmiştir."
