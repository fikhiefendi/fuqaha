abstract: "Dünya ekonomik sistemi içerisinde finans sisteminin payı ve etkinliği gün geçtikçe artmaktadır. Finans sisteminin günümüz dünyasında en büyük aktörü şüphesiz ki konvansiyonel bankacılık sistemidir. Konvansiyonel bankacılık sistemi faiz ve faizle işleyen ürünleri kullandığından, İslami hassasiyeti olan insanları geleneksel bankacılık dışında, islami ya da islamın meşru bulduğu finansal ürünleri kullanmaya yöneltmiştir. Bu ürünlerin başında tasarruf sahiplerinin ellerinde bulundurdukları fonları finansal sisteme aktararak kar elde etmek için krediye dönüştüren katılım bankaları gelmektedir. Katılım bankalarının mevduat ve kredi işleyişi her ne kadar geleneksel finans sistemiyle benzer olsa da işleyiş olarak önemli farklılıklar bulunmaktadır. Bu doğrultuda, çalışmada faizsiz bankacılık sisteminde kamu katılım bankalarının mevduat ve kredi işleyişi incelenerek geleneksel finans sisteminden amaç, kurumsal yapı, faizsiz finans ve gelir modeli, müşteri profili, ürün ve hizmetler, regülasyon ve denetim, risk yönetimi ile küresel yaygınlık bağlamında farklılıkları ortaya konulmaya çalışılacaktır. Çalışma sonucunda Türkiye için faizsiz bankacılık prensipleri ile hareket eden bankaların kullandıkları faizsiz enstrümanların dünya genelinde faaliyet gösteren katılım bankalarına nazaran biraz eksik kaldığı sonucuna varılmış ve faizsiz ürünlerin çeşitlendirilmesi önerilmiştir."
