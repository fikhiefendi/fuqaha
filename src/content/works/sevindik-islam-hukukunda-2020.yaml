abstract: "İslam hukuku şekilci bir hukuk sistemidir. Özellikle şekilciliğin en fazla ön plana çıktığı alan ibadet ve muâmelât alanıdır. Bu amaçla İslam hukukunda; ibadet, muâmelât ve ukûbat alanında kişilerin nassa bağlı olarak ortaya koyduğu davranışlarını şekilcilik bağlamında araştırdık. Bu araştırmamızı yaparken medeni hukuktaki şekilcilikten başlayarak genelden özele doğru bir araştırma yöntemi izledik. İslam hukukunda şekilciliği üç aşamada değerlendirdik. Birinci aşama, kanun koyucunun emrettiği şekilcilik diye isimlendirdiğimiz kısımdır. Burada bir ibadet veya akdin geçerli olmasındaki şekilcilikten bahsedildi. İkinci aşama, kanun koyucunun iradesine aykırı olmayan daha çok, ortaya çıkan bir problemin çözümüne yönelik olan şekilcilikle ilgili konular ele alındı. Üçüncü aşamada ise, kanun koyucunun iradesine aykırı olan şekilcilik, Hîle-i Şer'iyye ile birlikte değerlendirildi. Hîle-i Şer'iyye'nin, kanun koyucunun amaçlamadığı, şeklen meşru bir işlem gibi görünse de, aslında kişileri dinen yasaklanan bir şeye götürdüğü sonucuna varıldı. İslam hukukunda şekilcilik, kişilerin ortaya koymuş oldukları davranışların hangisinin kanun koyucu tarafından emredilen, hangisinin kanun koyucu tarafından amaçlanmayan davranışlar olduğunun ortaya konulması açısından önemlidir."
