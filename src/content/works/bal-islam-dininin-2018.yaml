abstract: "1929 Ekonomik Buhranı ile 2008 Küresel Krizi son bir asırda gerçekleşen en büyük ekonomik krizlerdir. Bu iki kriz de ABD kaynaklı olarak başlamış; sonra Avrupa ülkeleri başta olmak üzere bütün dünya ülkelerinin ekonomilerini ciddi şekilde etkilemiştir. Her iki kriz de kapitalizmin uygulandığı coğrafyalarda doğmuş, finansal piyasalarda başlayarak reel sektöre ciddi tahribatlar yapmıştır. Bu çalışmada yaşanan krizleri oluşturan sebepler İslam'ın Ekonomik Prensipleri ışığında incelenmiş ve bu prensiplerin uygulanması durumunda krizlere etkileri araştırılmıştır."
