abstract: "Bu tez çalışmasında, Osmanlı Devleti'nde şehzade sancağı konumunda olan Amasya kazasının H.1064-1065 / M.1653-1655 yılları arasını kapsamaktadır. Çalışma Anadolu'nun önemli bir şehri olan Amasya'da görev yapan kadıların gördüğü ve defterlere kaydettiği davalardan oluşan 11 Numaralı Amasya Şer'iye Sicili esas kaynaktır. Bu çalışmada 11 Numaralı Amasya Şer'iye Sicilinin transkripsiyonu davaların özeti ve değerlendirmesi yapılmıştır. Kadılar, Osmanlı Devleti'nde padişahın temsilcisi konumundadır. Padişahın, kadının hukukla ilgili almış olduğu kararlara müdahale hakkı yoktur. Kadı noter, yargı işleri gibi çok geniş bir görev alanı bulunmaktadır. Mahkemeye gelen davalar kadılar ya da nâibleri tarafından defterlere kaydedilmiştir. Kadıların tuttuğu zabıtlar olarak geçen Şer'iyye Sicilleri, Kadı Sicili, Kadı Defteri, Sicil-i mahfuz veya Sicil olarak da adlandırılmaktadır. XV. yüzyılın ikinci yarısından XX. yüzyılın ilk çeyreğine kadar olan süreçte ki Osmanlı tarihini incelemek isteyen araştırmacılar için bu kayıtlar birinci el kaynak niteliğindedir. Şer'iye Sicilleri, Osmanlı Devleti'nde merkezde ve taşrada her tabakadan insanlar arasındaki hukukî ilişkilere dair kayıtları içeren defterlerdir. Şer'iye sicillerinin içerdiği kayıtların çeşitliliği tarih açısından önemi büyüktür. Bu defterlerde Osmanlı tarihinin sosyal, ekonomik, hukukî, siyasi ve dini gibi birçok alan hakkında bilgi içermektedir."
