abstract: "Bu çalışma, V/XII. yüzyıl âlimlerinden Begavî'nin Me'âlimu't-Tenzîl adlı tefsirinde esas aldığı kıraat anlayışının tayinini ve kıraatleri kullanma keyfiyetinin tespitini amaçlamaktadır. Begavî'nin tefsirinde naklettiği kıraatlerin tefsir ve Arap diliyle olan irtibatı temelinde, kıraat-lehçe, sarf-nahiv ve kıraat-tefsir ilişkisinin incelendiği araştırmada, öncelikle, kıraat ilmi ve tarihi hakkında özet bilgi verilmiş, akabinde de Begavî'nin hayatı ve ilmî şahsiyeti üzerinde durulmuştur. Ana izleği itibariyle ise çalışmada Begavî'nin kıraat ilmindeki yeri, kıraatteki kaynakları, kıraatleri nakil yöntemi ve kıraatleri işleyiş tarzı üzerinde durulmuş, bunun da ötesinde Begavî'nin mana takdirlerinde kıraat farklarına ne gibi bir rol atfettiği, başta filolojik ve fıkhî yorum olmak üzere tefsir ve te'vil etkinliğinde kıraatleri nasıl kullandığı diğer tefsir ve kıraat kaynaklarıyla mukayeseli olarak incelenmiştir."
