abstract: "Anjiogenezis var olan damarlardan yeni mikrodamarların oluşumudur ve organizmada gerek sağlıklı gerekse patolojik pek çok durumla ilişkilidir. Son yıllarda anjiogenezis en çok araştırılan fenomenlerden biridir çünkü hastalık patogenezinde rol oynar ve terapötik hedef potansiyeli vardır. Çalışmamızda kronik C hepatitinin serum anjiogenezis belirteçleriyle ilişkisini ve antiviral tedavinin bu belirteçlere etkisini araştırdık. 22 yeni tanımlanmış kronik C hepatiti hastasında peg-interferon alfa-2a ve ribavirin tedavisi öncesi , tedavinin 6.ayında ve control gurubunda (18 olgu) serum vasküler endotelyal growth faktör(VEGF), angiopetin-2(Ang-2) ve sTie-2 düzeylerini çalıştık. Tedavi öncesi kontrol gurubuna gore yalnızca anjiogenezis inhibitörü olan sTie-2 düzeyinin yüksek olduğunu ve tedavi ile yalnızca bu faktörde azalma yönünde anlamlı bir değişimi saptadık. Ayrıca tedavi ile sTie-2 düzeyindeki azalmanın HCVRNA düzeylerindeki azalma ile anlamlı bir korelasyon gösterdiğini saptadık, ancak fibrozis göstergesi olarak seçtiğimiz AST/ALT oranı ile hiçbir anjiogenez belirteci arasında anlamlı bir ilişki bulunamadı. Sonuç olarak HCV virüsünün sTie-2'yi artırarak normalde bir savunma mekanizması olan karaciğerde yara iyileşmesini baskılayabileceği hipotezine vardık , ancak bu hipotezin kanıtlanması için ileri moleküler ve klinik çalışmalar gerekmektedir."
