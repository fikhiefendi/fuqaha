abstract: "Bu tez, İslam hukukunda günah ve suç kavramları arasındaki ilişkiyi inceleyerek, ceza hukukunda suçların gizlenmesi (setr) meselesini hukuk–ahlâk bütünlüğü çerçevesinde ele almaktadır. Çalışmanın temel problemi, her günahın hukukî yaptırıma konu edilmemesi ve her suçun da aleniyet gerektirmemesi olgusundan hareketle, İslam ceza hukukunda gizlilik ve aleniyet dengesinin hangi ilkelere dayandığını ortaya koymaktır. Birinci bölümde günah kavramının etimolojik ve semantik anlam alanı analiz edilmiş; günahın ahlâkî boyutu ile ceza hukukunda suç (cerîme) kavramı arasındaki ilişki sistematik biçimde ortaya konmuştur. Ardından suçun hukukî unsurları ve İslam ceza hukukundaki tasnifi (had, kısas-diyet, ta'zîr) incelenmiştir. Özellikle zina ve kazf suçlarında ispat şartlarının ağırlığı, suçun alenileştirilmesini sınırlayan bir mekanizma olarak değerlendirilmiştir. İkinci bölümde hukuk–ahlâk ilişkisi hem modern hukuk teorileri hem de İslam hukuk düşüncesi bağlamında ele alınmıştır. Hukukun normatif yapısı ile ahlâkın bağlayıcılığı arasındaki ilişki tartışılmış; İslam hukukunda hukuk–ahlâk bütünlüğünün ceza teorisine etkisi incelenmiştir. Üçüncü bölümde ise setr kavramı etimolojik ve semantik boyutlarıyla analiz edilmiş; suçun gizlenmesinin hukukî mahiyeti, usulî dayanakları ve sınırları ortaya konmuştur. Şüphe ilkesi (hadlerin şüphe ile düşürülmesi), maslahat, kamu düzeni, mahremiyet ve hakkullah–hakku'l-ibad ayrımı bağlamında gizliliğin meşru ve gayrimeşru sınırları belirlenmiştir. Sonuç olarak çalışma, İslam ceza hukukunda suçun gizlenmesinin keyfî bir tolerans değil; aksine ahlâkî ıslah, mahremiyetin korunması ve toplumsal düzenin temini arasında kurulan dengeli bir hukuk politikası olduğunu ortaya koymaktadır."
