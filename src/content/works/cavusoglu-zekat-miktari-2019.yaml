abstract: "Bu tez, zekât miktarı ile ilgili rivayetlerin tahrîc ve değerlendirmelerini içermektedir. Böylece ayetlerle sabit olan zekât ibadetinin nasıl uygulanması gerektiği ile ilgili hükme kaynaklık eden hadislerin sıhhat tespitini ve güncel değerlendirmeler yapmayı amaçlamaktadır. Çalışmamız giriş ve iki bölümden oluşmaktadır. Giriş bölümünde çalışmanın konusu, amacı, yönteminden bahsedilmiştir. Birinci bölümde zekât ile ilgili genel bilgiler ve Kitabu'z-Zekât eserlerine, eserlerin özelliklerine yer verilmiştir. İkinci bölümde zekât miktarı ile ilgili rivayetlerin tahrîci ve değerlendirmesi, araştırma yöntemlerinde ifade edildiği gibi yapılmıştır. Rivayetler hakkında sahih, hasen, münker gibi hükümlere ve değerlendirmelere yer verilmiştir. Çalışmanın sonunda rivayetlerle ilgili ulaşılan sonuçlar değerlendirilmiştir."
