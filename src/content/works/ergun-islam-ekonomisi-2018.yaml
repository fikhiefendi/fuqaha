abstract: "Bu çalışmanın konusu; tarımsal emtia ticaretinde yeni bir model ortaya koyabilmek, mevcut ticaret borsalarında gerçekleştirilen spot piyasa işlemlerine derinlik sağlayacak elektronik platform işlemlerini modellemek ve tüm bu çalışmaların İslam ekonomisi çerçevesinde analiz edilmesini sağlamaktır. Anketler iki aşamadan oluşmaktadır. Öncelikle lisanslı depoculuk, elektronik ürün senetleri ve bunlar hakkında bilgiyi ölçmek için üreticilere, arkasından tüccarlara anketler yüz yüze görüşme yöntemi tercih edilerek gerçekleştirilmiştir. Yüz yüze görüşme tekniği, araştırmanın sonuca ulaşması açısından soruların net anlaşılması, denetimin sağlanması bakımından diğer anket yöntemlerine göre daha sağlıklıdır. Araştırma konusu anketler 2017 yılı Ağustos-Kasım ayları arasında yapılmıştır. Bölgenin ve ülkenin en büyük ticaret borsalarından biri olan Konya Ticaret Borsası elektronik satış salonunda üreticilere anketler uygulanmış, Konya Büyük Buğday Pazarı'nda tüccarlara yönelik anketler uygulanmıştır. Araştırma öncelikli olarak İslam ekonomisi alanındaki temel kavramları açıklamaya çalışmış, dünyada tarımsal emtia ticaretine yönelik yapılan çalışmalarla ülkemizde yapılan çalışmaları mukayese etmiş ve nihayet özgün bir model olarak ELÜS (Elektronik Ürün Senetleri) sisteminde 3, 6 ve 9 ay vadeli futures işlemler için bir öneri ortaya koymuştur."
