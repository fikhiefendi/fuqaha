abstract: "İslâm hukukunun temel ilkelerinden biri, hak ile sorumluluk arasında dengenin sağlanmasıdır. İslâm'ın ilk dönemlerinden itibaren verilen hükümlere bakıldığında, fıkıh âlimlerinin hüküm verirken, nimet-külfet dengesini dikkate aldıkları görülmektedir. Bununla birlikte bu kavramların mahiyetine ve hükümlere nasıl yansıdığına dair yeterli bilgi veren eserlerin kaleme alınmadığı görülmektedir. Tezimiz, nimet-külfet kavramlarının mahiyetini ve konumunu belirleyerek, Hanefî mezhebine göre malî işlemlerdeki nimet-külfet dengesini ortaya koyabilmeyi, nimet-külfet dengesine uygun olan ve olmayan malî işlemleri belirlemeyi ve bütüncül bir bakış açısı oluşturmayı hedeflemektedir."
