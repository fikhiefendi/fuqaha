abstract: "Klasik dönemde, V. (XI.) yüzyılda usul ilminin yenilenmesiyle ilgili tartışma ve çalışmalar başlamıştır. Modern dönemde ise XIX. yüzyılın son çeyreğinden başlamak üzere önce Osmanlı hukukçuları, daha sonra da diğer İslâm ülkelerindeki hukukçular usul ilmini yenileme sorunuyla ilgilenip tartışmışlardır. Bu önemlerde fıkıh usulünün tecdidi tartışılırken, şekilde tecdid mümkün görülmüş, içerikte yenilik konusunda ise mutabakat sağlanmamıştır. Bu tartışmalar, fıkıh usulünün kati ve sabit olup olmadığı diyalektiği, bazen de usulün ilmî ve epistemolojik olgunluğa eriştiği düşücesi temelinde şekillenmiştir. Bazı bilginler, sadece ilgili disiplinde ve varsa bu disiplini metodolojik olarak kullanan düşüncede bir paradigma dönüşümünü sağlayan yenilikleri tecdid sayarken, diğer bazıları, farklı bazı yeni metodolojik meselelerin ilavesini de içerik tecdidi olarak kabul etmektedir. Klasik dönemde usul ilmi, hem şekil hem de içerik açısından yenilenmiştir. İçerik olarak yenilenmesi, özellikle gâî doktrinin onun bir konusu olarak ele alınmasıyla başlamış, bu doktrin çerçevesinde kapsamı genişletilmiş ve daha sistematik bir şekilde ele alınmıştır. Aynı zamanda, usul bilgisinin değerine ilişkin yeni anlayışlar ortaya atılıp epistemolojik olarak da yenilenmiştir. Modern dönem tecdid tartışmaları bağlamında bazı ilim adamları disiplin içi arayışlarla usulü tecdid etmeye çalışırken, diğer bazıları disiplin dışı imkânlarla tecdid yapmak istemiştir. Bu bağlamda, usul ilminin dil kurallarına aşırı odaklandığı, makāsıd konusunu ihmal ettiği, içeriğinin çoğunlukla tartışmalı olduğu, yaşamın gerçekliğinden kopuk bir şekilde geliştiği gibi eleştiriler yapılmıştır. Usul ilmi ile sosyal bilimler arasında işbirliği yapılması, usulün kavramsal içeriğinin geliştirilmesi ve İslâm hukukunun literatürünün birleştirilmesi önerilmiştir. Usul tecdidinin niteliksel boyutuyla ilgili bazı tartışmalar, klasik çalışmaların tekrarıdan ibarettir. Modern dönemde, içerik tecdidi konusunda fazla bir ilerleme kaydedilmemişse de tecdid tartışmalarıyla çeşitli açılımlar yapılmış, yeni teoriler geliştirilmiş, farklı problemler ortaya konulmuş, usul ilmini yenilemeye dair farklı yaklaşımlar sunulmuştur."
