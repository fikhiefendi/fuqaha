abstract: "Son yıllarda özellikle firmalar ve uluslar açısından emek ve sermaye miktarı ile açıklanamayan üretimin ve büyüme potansiyelinin, yeni bir bakış açısı ile entelektüel sermaye olarak değerlendirildiği bir literatür oluşmuştur. Yeni bir alan olması ve hesaplamalarda kullanılacak henüz ortak kabul görmüş akademik veya kurumsal bir endeksin olmayışı, bilim insanlarının genelde insan, pazar, süreç ve inovasyon öğelerini birçok farklı bileşenle değerlendirdikleri birçok endeksin ortaya çıkmasına sebep olmuştur. İslami iktisatta kalkınmanın maddi ve manevi olarak dengeli olması önerilmektedir. Genellikle firmalar düzeyinde entelektüel sermaye yaklaşımını temel alan ulusal entelektüel sermaye yaklaşımları, somut ve maddi olmayan birçok farklı göstergeyi kullanarak, verimlilik ile büyüme ve kalkınma açısından ülkelerin gelecekteki durumlarını belirlemeye çalışmaktadır. Bunu yaparken, bağımlı değişken olarak genellikle sadece maddi boyutu gösteren GSYİH kullanılmaktadır. Bu çalışmada, geleneksel entelektüel sermaye hesaplama yöntemleri incelenerek, mevcut bileşenlerin dışında İslami olarak ahlak ve etik bileşenlerinin de dahil edildiği ve verimlilik yerine bereket terimi referans alınarak belirlenmiş öğelerden ve bileşenlerden oluşan yeni bir endeks oluşturulmuştur. Bu endeks, Ulusal Entelektüel Potansiyel olarak adlandırılmıştır. Ulusal Entelektüel Potansiyel Endeksinde; eşit ağırlıklara sahip Ulusal İnsan Potansiyeli, Ulusal Pazar Potansiyeli, Ulusal Süreç Potansiyeli ve Ulusal Yenileme Potansiyeli başlıklarının her birinde 9 olmak üzere, toplam 36 bağımsız bileşen bulunmaktadır. Endeksin bağımlı değişkenleri ise Refah Endeksi olarak adlandırılmaktadır. Refah endeksi, eşit ağırlıklara sahip Ulusal Huzur Potansiyeli ve Maddi Boyuttan oluşmaktadır. Ulusal Huzur Potansiyeli de 9 bileşenden oluşmaktadır. Maddi boyut ise GSYİH olarak belirlenmiştir. 2013-2022 yılları arasındaki 10 yıllık verilerin elde edilebildiği 46 ülke üzerinden gerçekleştirilen analizde STATA paket programı ile panel veri modeli kullanılmıştır. Modelde yer alan bağımsız değişkenlerin, bağımlı değişkenler üzerindeki etkiler incelenerek ülke sıralamaları oluşturulmuştur. Öncelikle veriler min-max yöntemi ile normalizasyon işlemine tabi tutulmuştur. Hem bağımlı değişkenler olarak Refah Endeksi, hem de ayrı ayrı Ulusal Huzur Potansiyeli ve Maddi Boyut üzerindeki etkiler test edilmiştir. Bu sayede karşılaştırma yapabilmek amaçlanmıştır. İlgili denkliklerin analizinde panel en küçük kareler yöntemi kullanılmıştır. Elde edilen sonuçlardan Ulusal Entelektüel Potansiyel endeksinin; Refah Endeksi, Ulusal Huzur Potansiyeli ve Maddi Boyut üzerinde pozitif ve istatistiksel olarak anlamlı etkisinin olduğu görülmüştür. 46 ülkenin ortalama puanlarına göre sıralanmasında, Batı Avrupa ülkelerinin ilk sıralarda yer aldığı görülmektedir. Refah Endeksi, Ulusal Huzur Potansiyeli ve Maddi Boyut açısından gerçekleştirilen ülke sıralamalarında çok büyük farklılıklar gözükmemektedir. İİT üyesi ülkeler olarak analize tabi tutulan Malezya, Endonezya, Türkiye ve Kazakistan sıralamalarda çok üst sıralarda yer almamıştır Nispeten Malezya'nın daha iyi ortalama puana sahip olduğu görülmektedir. Ulusal Entelektüel Potansiyel Endeksi, benzerlikleri açısından İslamilik Endeksi ve NIC Endeksleri ile de mukayese edilmiştir. Ülke sıralamaları her iki endeks sonuçları ile farklılıklar göstermektedir. Özellikle NIC endeksi ile daha farklı sonuçlar elde edilmiş olmasına rağmen, İslamilik Endeksi ile daha yakın sonuçlarla karşılaşılmıştır. Bu durum da İslami iktisat temelinde Ulusal Entelektüel Potansiyeli ölçmeyi amaçlayan bu çalışmada, gösterge seçimine göre ülke puanlarının farklılaştığını göstermektedir."
