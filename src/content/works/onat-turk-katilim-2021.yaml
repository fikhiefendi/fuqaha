abstract: "Finans sektörünün gelişimi ekonomik büyüme ve kalkınma için önemli bir itici güçtür. Finans sektörünün bankacılık ağırlıklı olduğu gelişmiş ve gelişmekte olan ülkelerde, bankacılık sektörünün ekonomik büyüme üzerinde büyük bir etkisi bulunmaktadır. Türkiye'de finans sektörü bankacılık ağırlıklıdır ve bankacılık sektörü mevduat bankaları, kalkınma ve yatırım bankaları ile katılım bankalarını içeren üçlü bir yapıdan oluşmaktadır. Türkiye'de özel finans kurumları adıyla faaliyete başlayan ve 5411 sayılı Bankacılık Kanunu ile birlikte katılım bankası adını alarak bankacılık sektörüne dâhil olan katılım bankaları faizsiz finans ilkeleri çerçevesinde faaliyet göstermektedir. Katılım bankaları, Türk bankacılık sektörünün tamamlayıcı bir unsuru olarak son yıllarda güçlü bir büyüme gerçekleştirmekte ve finans sektörü içindeki yerini ve önemini artırmaktadır. Ekonominin temel yapı taşı niteliğindeki küçük ve orta büyüklükteki işletmeler Türkiye için sanayi ve ticaretin büyük bir kısmını oluşturmakta olup, KOBİ'lerin finansal erişim imkânlarının artırılması Türkiye'nin ekonomik büyümesi için bir gerekliliktir. Bu çerçevede çalışmanın amacı, 2008-2019 dönemine ait üçer aylık veriler kullanılarak Türkiye'de faaliyet gösteren katılım bankalarının KOBİ'lere sağladığı kredileri etkileyen faktörlerin analiz edilmesidir. Analiz sonucunda katılım bankalarının KOBİ kredi hacminin, kredi mevduat oranı, KOBİ kredilerinde takipteki alacak oranı ve vergi öncesi kâr/zararın toplam aktiflere oranından oluşan bankacılığa özgü faktörler ile reel efektif döviz kuru ve tüketici fiyat endeksinin dâhil olduğu makroekonomik faktörlerden etkilendiği tespit edilmiştir."
