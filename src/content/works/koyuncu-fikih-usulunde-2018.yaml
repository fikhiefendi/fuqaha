abstract: "İslam hukuku,“faydalı şeyleri almak ve zararlı şeylerden sakındırmak”şeklinde özetlenmiştir. Bu esas, İslam hukukunda insanın faydasına olan şeylerin istendiğine, zararına olan şeylerin ise yasaklandığını ifade eder. Yasaklamaların gayesi, insandan ve onun içinde bulunduğu toplumdan muhtemel kötülükleri kaldırmaktır. Bu, bütün hukuk sistemlerinin değişmez bir esasıdır. İslam hukukunda, emredilen şeyleri yapmayı ve yasaklardan uzak durmayı sağlayacak insanın eğitimi ilk esas olarak kabul edilmiştir. Eğtim aşamasından sonra önleyici tedbirler alınarak toplumun adalet ve huzur içerisinde yaşamasının temelleri sağlamlaştırılmıştır. Yasaklanan şeylere, bir takım müeyyideler tayin edilerek insanın yasaklardan uzak durmasını sağlayacak caydırıcı bir yöntem izlenmiştir. İslam hukukunda yasaklanan şeyler, ya aslındaki ya da taşıdığı vasıftaki zarardan ötürü yasaklanmıştır. Fakihler, Kur'an ve sünnette yasaklamanın vârit olduğu nassları araştırmışlardır. Yasaklamanın vârit olduğu nasslardaki sigaları ve bunların hükme delaletlerini, incelemişlerdir. Bu çalışmada nehyin sigalarını ve hükme delaleti hususundaki görüşleri ve delillerini araştırdık. Fakihler, kötülüğün masdarına göre, yasaklanan şeyler hususunda bazı sınıflandırmalar yapmıştır. Aklın, dinin beyanına ihtiyaç duymadan kötülüğünü anlayabileceği, gasp, hırsızlık vb. şeylerin, meşru hiçbir sonucu meydana getiremeyeceğini ittifakla kabul etmişlerdir. Dinin beyanıyla kötü olduğu bilinen, alkol ve domuz etinin satımı vb. şeylerin de geçersiz olacağını kabul etmişlerdir. Cuma ezanı sırasında alışveriş yapmak gibi, aslen kötü olmadığı halde, başka bir kötülüğe sebep olabilecek şeylerin hükmü fakihler arasında tartışılmıştır. Çoğunluk mahzurlu olmasına rağmen, bu türe giren yasaklamaların sıhhatine hükmetmiştir. Oruç tutmanın yasaklandığı bayram günlerinde, oruç adağında bulunmak vb. asla bitişik lâzimi bir vasıf sebebiyle yasaklanan şeylerin hükmü mezhepler arasında tartışılmıştır. Hanefiler, lazimi vasıflarında eksikliği olan şeyleri, aslen meşru bir amel olarak değerlendirmiştir. Bu kısma giren şeylerin yapılması durumunda bazı hukuki sonuçlar doğuracağını kabul etmişlerdir. Maliki, Şafiî ve Hanbelî mezhebi fakihleri, lâzimi vasıf sebebiyle yasaklanan şeylerin aslen ve vasfen gayri meşru olduğunu ve bunlara hiçbir hükmün terettüp etmeyeceğini kabul etmişlerdir. Bu çalışmada mezheplerin bu konuyla ilgili delillerini araştırdık. Konunun füru fıkha yansımaların örneklerle sunmaya çalıştık. Bu çalışmada, Kur'an ve sünnette beyan edilen yasakları çiğneyen kişilerin, bu ihlallerinin hukuki sonucu ele alınmıştır."
