abstract: "Tarih boyunca üretim ve tüketim ilişkilerinin gelişmesine paralel olarak meydana gelen en tartışmalı konulardan biri gelir dağılımı ve adaletine yönelik olmuştur. Kapitalizm, sosyalizm, karma iktisat ve İslam iktisadı gibi temel iktisadi yaklaşımlar; yapıcı, eleştirel ve radikal yorumlarla konuya katkıda bulunmaya çalışmışlardır. Gelir dağılımındaki adaletsizlik nedeniyle dünyada artan yoksulluk ve sefalete eşlik eden süreçlerin en önemlisi finansal liberalizasyon sürecidir. Pek çok ekonomik ve sosyal sorunun elebaşı olarak değerlendirilen kredi ekonomisi, gelir dağılımını iki farklı şekilde etkilemektedir. Faiz, hem faktör geliri hem de kullanılan kredilerin maliyeti olarak gelir dağılımını ve gelir dağılımının adaletini etkilemektedir. Söz konusu ilişkiler kapitalist sistemin devamı niteliğinde olup, finansal liberalizasyon ile hız kazanmıştır. Araştırmada ?Shorrocks Ayrıştırma Analizi? kullanılarak Türkiye'de hanehalkı bazında ana ve alt gelir türlerinin gelir dağılımı eşitsizliğine yaptıkları katkılar ve gelir türlerine ait ?Gini Katsayıları? hesaplanarak 2002-2009 yılları arasındaki durumun tespiti ve yorumu yapılmıştır. Netice olarak gelir dağılımı eşitsizliğine en büyük katkıyı yapan gelir türünün faiz geliri olduğu saptanmıştır. Bu durum iktisadi kriz dönemlerinde daha belirgindir. Ayrıca faiz geliri kendi içindeki dağılımda da en adaletsiz dağılan gelir türüdür. Faiz, kâr ve rant gelirlerinin eşitsizliğe katkıları, ücret ve transfer gelirlerinin katkısından fazladır ve belirgin bir biçimde farklılaşmaktadır. Söz konusu bulgular, kredi ekonomisinin gelir dağılımı üzerindeki olumsuz etkisini doğrular niteliktedir. Son olarak, analizden yansıyan bir diğer bulgu, transfer gelirlerinin toplam eşitsizliğe yaptığı katkıların azaltılması için sosyal politikaların daha dikkatli tasarlanmasının gerekliliğidir."
