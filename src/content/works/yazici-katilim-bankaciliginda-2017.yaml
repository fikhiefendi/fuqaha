abstract: "Tezimizde, faizsiz bankacılığın temel ilkeleriyle ülkemizde faaliyet gösteren katılım bankalarının kartlı ödeme sistemindeki rolü, çalışma prensibi gereğince faizsizlik esasına dayalı bankacılık ile kartlı ödeme sistemi kuralları ve uygulamalarının uyumluluğu, faizsizlik prensibi kurallarına göre değerlendirilmesi yapılmıştır. Bu değerlendirme yapılırken esas kaynağımız İslam hukuku ve faizsizlik prensibi olup, konuyla ilgili görüş beyan eden İslam fıkhı uzmanlarının içtihatlarına yer verilmiş ve fetvalar sunulmuştur. Kartlı ödeme sisteminin tarihsel süreci, bu sürece gelene kadar geçirdiği aşamalar, kullanılan ödeme yöntemleri gibi ayrıntılara yer verilerek sistemin çalışma prensibi ortaya konulmuştur. Bu prensipler tüm ülkelerde geçerli olan ve tüm kartlı ödeme kuruluşlarını ilgilendiren kurallar bütünüdür. Değişik ülkelerde faaliyet gösteren ödeme sistemi kuruluşları, bankalar, kart hamilleri ve üye işyerleri bulunduğu ülkenin kanunlarını uluslararası ödeme sistemi kurallarına uyarlayarak ulusal ve uluslararası düzeyde kartlı ödeme sistemine dâhil olmuşlardır. Tezimizin başlığı olan, katılım bankalarında kartlı ödeme sistemleri ve Türkiye uygulamasının tüm boyutlarıyla anlatılabilmesi için yedi bölümlük bir tez metni hazırlanmış, her bölüm bir sonraki bölümün anlaşılması kavramsal olarak sıralanmıştır. İlk bölümde bankacılığın tanımı, tarihi, faaliyet konuları ve Türkiye'deki banka türlerinden kısaca bahsedilmiş, üçüncü bölümde tezimizin esas konusunu kavramak açısından ülkemizde katılım bankacılığı olarak tanımlanan ancak uluslararası literatürde İslami bankacılık ya da faizsiz bankacılık olarak bilinen bankacılık türünün prensipleri açıklanmıştır. Faizsiz bankacılığı açıklarken öncelikle faizin ne olduğu ve tarihsel geçmişinden bahsedilerek, faizsizliğin ne anlama geldiği açıklanmış ve faizsiz bankacılığı günümüze gelen tarihsel sürecinden bahsedilmiştir. Daha sonra faizsiz bankacılığın diğer bankacılık faaliyetinden anlayış olarak farklılığı ve faizsiz bankacılığın ortaya çıkma nedenlerinden bahsedilmiştir. Dördüncü bölümde katılım bankacılığı faaliyet alanları fon toplama kullandırma yöntemleri, diğer bankalardan ayıran başlıkları maddeler halinde sıralanmış, faizsiz bankacılığın son durumu ile ilgili bilgi verilmiş ve Türkiye'de faaliyet gösteren katılım bankaları kısaca tanıtılmıştır. Beşinci bölümde kartlı ödeme sisteminin anlaşılabilmesi için ülkemizde uygulanan ödeme sistemi yöntemlerinden bahsedilmiştir. Altıncı bölümde ödeme sistemleri içerisinde yer alan kartlı ödeme sisteminin tarihi, kart türleri, kartlı ödeme sistemi yöntemleri, bu sistemin tarafları, taraflar arasındaki hukuki ilişkiler ve kartlı ödeme sistemindeki takaslaşma gibi kartlı ödeme sisteminin tüm başlıkları geniş bir biçimde anlatılmış ve bir sonraki bölüme hazırlık yapılmıştır. Yedinci bölümde kartlı ödeme sisteminin İslam hukukuna göre yeri, kart türlerinin, taraflar arasındaki sözleşmeler ve kartla yapılan ve yapılacak işlemlerin İslam hukukuna ve fıkhına uyumluluğu, İslam hukuku uzmanlarının ve oluşturulmuş fıkıh komitelerinin görüşlerine yer verilerek görüşlerden ortak bir sonuç çıkarılmaya çalışılmıştır. Sekizinci ve sonuç bölümünde ise kartlı ödeme sisteminin İslam hukukuna göre yapılan analizi ele alınarak, Türkiye'deki katılım bankalarında bu içtihatların uygulanıp uygulanmadığı hususu kart bazında ve yapılan işlem bazında incelenmiştir. Bu inceleme ilgili bankaların resmi internet sitesinde kart uygulamaları ve tanıtımları ile verdiği bilgiler derlenerek yapılmış olup, değerlendirmeler İslam hukuku uzmanlarının ortak görüşleri göz önüne alınarak yapılmıştır. Vakıf Katılım ve Ziraat Katılım Bankası kartlı ödeme uygulamalarına yeni geçtiği için uygulamaları ile ilgili ayrıntılı bilgiye ulaşılamamış ve çalışmada ilgili bankalara çok fazla bilgi verilememiştir. Dolayısıyla değerlendirme genel olarak kartlı ödeme uygulamalarına yer verilmiştir. Türkiye dışında faaliyet gösteren diğer faizsiz bankaların kredi kartı uygulamalarının da bu tabloda olması çok istenmesine rağmen ne kütüphanelerde ne güncel kartlı ödeme sistemi dergilerinde ne de internet sitelerinde bilgi edinilemediği için tezimizde sadece Türkiye deki katılım bankaları incelenmiştir."
