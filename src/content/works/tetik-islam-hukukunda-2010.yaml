abstract: "Bu çalışmanın amacı İslam Borçlar Hukukunda yetkisiz temsili ve hukuki sonuçlarını ortaya koymaktır. Çalışmamızı Türk Borçlar Hukuku ile karşılaştırmalı yaptık. Ekonomik hayatın gelişmesi sebebiyle modern hayatın gereksinimi olarak her insan birçok şahıs ve kurum ile ilişki içerisindedir. Bu ilişkiler çerçevesinde insan bütün hukuki muamelelerine yetişememekte ve mutlaka bir temsilciye ihtiyaç duymaktadır. Ancak ne var ki kimi zaman ehliyet eksikliğinden kimi zaman da üçüncü şahısların haklarından dolayı yetkisiz temsil ortaya çıkmaktadır. Bu bağlamda sırf yardım etme gayesiyle ve sonuçlarına katlanmak şartıyla yetkisiz temsilcinin tasarruflarının geçerli olduğu sonucuna vardık."
