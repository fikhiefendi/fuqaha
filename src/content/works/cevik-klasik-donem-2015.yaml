abstract: "Sayı ve güç bakımından ciddi tehlike arz eden bir topluluk tarafından kendilerince haklı gördükleri bir sebebe dayanılarak, kasten ve fiilen kuvvet kullanmak suretiyle meşru ve adil devlet başkanına karşı gerçekleştirilen her türlü başkaldırı hareketine devlete isyan suçu adı verilir. Bu sebeple meşru devlet yönetimine muhalif olarak gelişen bir eylem veya harekette bu unsurlardan herhangi birisi eksik ise o eylem veya hareketin devlete isyan suçunu oluşturduğu söylenemez. Devlete isyan suçu, nitelik itibariyle adî suç olarak kabul edilmeyip siyasî suçlar kategorisinde değerlendirilir. Dolayısıyla devlete isyan suçunun failleri adî suçlu olmayıp siyasî suçlulardır ve bu kapsamda ayaklanma öncesinde barışçıl yollarla inandıkları şeye davet etme hakkına ve İslam hukuku hükümleri çerçevesinde söz söyleme hürriyetine sahiptirler. Kanunî bir görevden kaçınmadıkları ya da meşru devlet yönetimine itaatten ayrılmadıkları sürece bir yeri mekân edinebilme ve toplanabilme hakları vardır. Bununla birlikte bu toplanma isyan etmek amacı taşıyorsa devlet başkanı tarafından ikaz edilerek uygun bir ta'zir cezası ile cezalandırılabilirler. Bu hususta devlet başkanınca yapılan uyarılar isyancılar tarafından dikkate alınmamış ya da uygulanan ta'zir cezası etkili olmamış ve bunun neticesinde devlet başkanına karşı kuvvet kullanmak suretiyle fiilen isyana başlamışlarsa, devlete isyan suçunun unsurları oluştuğu için faillerle savaşılması şer'an caiz olur. Ancak isyancılarlalarla yapılacak savaşta kendilerinin müslüman olduğu, suçlarının ise siyasî nitelik arz ettiği unutulmamalı ve bu düşüncenin neticesi olarak yalnızca zaruret halinde ve isyanı bastıracak ölçüde şiddet kullanılmalıdır."
