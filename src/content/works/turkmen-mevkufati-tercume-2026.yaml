abstract: "On altıncı yüzyıl eserlerinden olan Halebî'nin Mülteka'l-ebhur'u Osmanlı'da fıkıh alanında oldukça önemli bir yere sahiptir. Sonraki dönemlerde bu eser üzerine şerh, hâşiyeler ve tercümeler yapılmıştır. Üzerine yapılan tercümelerden biri de Mevkûfâtî'nin hem tercüme hem de şerh niteliğindeki Tercüme-i Mülteka'l-ebhur'udur. Mevkûfâtî on yedinci yüzyıl âlimlerindendir. Eserin diğer ismi Mevkûfât'tır. Mevkûfât'ta takip edilen usul ve içerisindeki bilgiler onu Osmanlı medreselerinde okutulmaya layık kılmıştır. Bu usul ve içeriklerin özellikleri incelenip günümüz fıkıh eğitim ve öğretiminin gelişmesine katkı sağlaması bir fıkıh araştırmacısından beklenen bir hizmettir. İslam hukuku disiplininde fıkıh âlimlerinin eserlerine yönelik yapılan çalışmalar fıkıh literatürünün şahıs metodu türünü oluşturmaktadır. Mevkûfâtî'nin ukūbât bahislerinde takip ettiği tercüme ve şerh metodu daha öncesinde ele alınmadığı için bu tez fıkhın şahıs metodu literatüründeki bu boşluğu doldurarak günümüz İslam ceza hukuku eğitimi için alternatif bir model ortaya çıkarmayı amaçlamaktadır. Ayrıca çalışmada Tercüme-i Mülteka'l-ebhur'un doğru anlaşılmasının sağlanması, tercüme ve şerh metodunun kullanımının gösterilmesi ve okuyucuya fıkıh alanında tercüme ile şerh becerisi kazandırılması hedeflenen diğer faydalar arasındadır. Çalışmanın okuyucuya fıkıh alanında telif edilmiş tercüme ve şerh türünde eserleri metodik bir yaklaşımla inceleyip değerlendirme becerisi kazandıracak olması onun önemini gösteren diğer bir özelliğidir. Bu araştırma diğer bahislerin çalışılmış olması nedeniyle gereksiz tekrara düşülmemesi ve yüksek lisans çalışmasının sınırlarını aşmaması amacıyla eserin bir kısmını teşkil eden ukūbât bahisleriyle sınırlandırılmıştır. Bununla birlikte ukūbât bahislerinde Mevkûfâtî'nin kullandığı tercüme ve şerh metodunun daha yoğun bir şekilde görüleceğinin düşünülmesi de bu sınırlamada etkili olmuştur. Tezde başta dokümantasyon metodu takip edilmiş, araştırmanın derinleşmesiyle doküman inceleme, örneklendirme, tümdengelim ve tümevarım metotlarına da başvurulmuştur. Çalışmanın neticesinde ukūbât bahislerinin tercüme ve şerhinde birçok metodun kullanıldığı, bu metotların tercüme ve şerhin değerini ve faydasını artırdığı görülmüştür."
