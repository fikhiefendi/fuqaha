abstract: "Hadis şerhleri metindeki maksadın anlaşılması için çok önemli bir köprü vazifesi görmektedir. Hadisin asıl anlamını yansıtması, kapalılığı giderip anlamı vuzuha kavuşturması gibi bir özelliği olan şerhler şârihin fikir ve yönelişlerinden de bağımsız değildir. Her insan gibi ilim adamları da yorumlamalarında dış etken ve değerlerle beraber metinleri anlayıp yorumlamaktadırlar. En meşhur hadis eseri olan Sahîh-i Buhârî'nin iki önemli şerhi olan Fethu'l-Bârî ile Umdetu'l-Kârî şerhleri günümüzde de başvuru kaynağı olmaya devam etmektedir. Bu şerhlerin yazımında mezhebi saiklerin de etkili olduğu ilim âlemi içinde bilinen bir gerçekliktir. Şârihlerin ilmi yetkinliklerini en yüksek düzeyde göstermekle beraber gerek aralarındaki rekabet gerekse mezhep görüşlerinin müdafacısı olmaları şerhlerinin mahiyetini etkilemiştir. Çalışmamızda Sahîh-i Buhârî'nin namazla alakalı dört bölümü olan“Salât”,“Ezan”,“el-Cemâa ve'l-İmâme”ve“Sıfatu's-Salât”kitaplarında iki şârihin meseleleri nasıl ele aldıklarını ve mezhep aidiyetlerinin şerhte nasıl etkili olduğunu incelemeye çalıştık. Yaptığımız tahlillerde mezhep aidiyetinin şerhleri etkilediğini tespit ederek iki şerhin de mezhebi saiklerle yaptıkları açıklamalardaki usullerini ortaya çıkardık."
