abstract: "İslam düşünce sahasında bilgi üreten her ekol, ürettiği bilginin şer'î hitap üzerinden sağlamasını yapmak durumunda kalmıştır. Tarihi seyir içerisinde ortaya çıkan İslam düşünce ekolleri, olgu ve olaylara karşı ortaya koydukları sistem içerisinde şer'î hitap ile olan ilişkilerine göre tasnif edilmişlerdir. Buna göre akla verdikleri konuma göre bazı ekoller akılcı, diğer bazı ekoller ise literalist şeklinde konumlandırılmıştır. Akılcı ekollerin uç noktasını temsil eden Mu'tezile, şer'î hitaba karşı tutum ve tavırlarıyla akademik sahada merak konusu olmuş ve birçok açıdan mercek altına alınmıştır. Bu çalışmada, şer'î hitabın anlaşılması meselesi Mu'tezilî bir düşünür olan Kâdî Abdülcebbâr özelinde incelenmiştir. Mu'tezilî düşüncenin tarih sahnesinde yeniden canlanmasında önemli role sahip olan baba-oğul Cübbâîler ve Ebu Abdullah el-Basrî gibi önemli âlimlerin temsilcisi kabul edilen Kâdî Abdülcebbâr, Mu'tezile ekolünün zihin kodlarının günümüze taşınmasında önemli rol oynamıştır. Öncelikle şer'î hitabın kavramsal çerçevesi çizilmiş ve Kâdî Abdülcebbâr'ın düşünce sistemi içerisindeki yeri ele alınmıştır. Daha sonra şer'î hitabın anlaşılmasının teorik arka planı olan kelâmî ve dilsel arka plan incelenmiştir. Yapılan bu incelemeler sırasında Kâdî Abdülcebbâr'ın“hasen hitap”kuramı ortaya konulmuş ve çalışma boyunca bu kuramın Kâdî Abdülcebbâr'ın şer'î hitabın anlaşılması noktasındaki etkisi takip edilmiştir. Daha sonra şer'î teklife (hükme) kaynaklık yönüyle şer'î hitabın kısımları olan emir ve nehiy formları incelenmiş ve emir ve nehyin mahiyeti ve şer'î hükme delaleti gibi fıkıh usulünde tartışılan meselelere Kâdî Abdülcebbâr'ın yaklaşımı ortaya konulmuştur. Son olarak anlama delaleti cihetiyle şer'î hitabın özellikleri ve kısımları incelenmiş ve dilin vazՙı itibariyle lafızların zâhir ve zahir olmayan, Şâriՙin irade ettiği anlama delaleti itibariyle şer'î hitabın müstakil ve müstakil olmayan kısımları incelenmiş ve müstakil olmayan hitabın beyanı noktasında Kâdî Abdülcebbâr'ın yaklaşımı ortaya konulmuştur. Çalışmamız esnasında tespit edilen“hasen hitap”kuramının Kâdî Abdülcebbâr'ın şer'î hitabın anlaşılmasına dair görüşlerine etkisi gün yüzüne çıkarılmıştır. Böylece Kâdî Abdülcebbâr'ın mezhebi aidiyetinin usul anlayışına etkisi ortaya konulmuştur."
