abstract: "Vergi yasalarında bulunan bazı düzenlemeler katılım bankaları tarafından kullanılan fon kullandırma yöntemleri ile çeliĢmektedir. Katılım bankaları hem vergi yasalarının bu düzenlemelerinden olumsuz etkilenmemek hem de iĢlem maliyetlerini azaltmak amacıyla fon kullandırma iĢlemlerini usul yönünden bu düzenlemelere uygun olacak Ģekilde yapmaktadır. Ancak bu durum katılım bankacılığının konvansiyonel bankaların faaliyetleri ile çok benzeĢtiği Ģeklinde eleĢtirilerin sebeplerinden birini teĢkil etmektedir. Bu çalıĢmada katılım bankalarının fon toplama ve fon kullandırma faaliyetlerinde kullandıkları araçlar ile katılım bankalarında açılan hesaplardan elde edilen kar paylarının vergilendirilmesine iliĢkin mevzuat düzenlemelerinin ortaya konulması, yaĢanan sorunlar ile ihtiyaç duyulan düzenlemelerin değerlendirilmesi ve çözüm önerileri getirilmesi amaçlanmıĢ olup, katılım bankalarının fon toplama ve fon kullandırma yöntemleri ile bunların vergilendirilmesi ve katılma hesaplarından elde edilen kar paylarının vergi mevzuatı karĢısındaki durumu çalıĢmanın kapsamını teĢkil etmektedir. ÇalıĢma kapsamında vergi mevzuatı her düzeyde taranmıĢ, faizsiz finans alanı ile ilgili olanlar tespit edilmiĢtir. Katılım bankalarının fon kullandırma ve fon toplama yöntemleri ile katılma hesaplarından elde edilen kar payları vergi mevzuatında yer alan düzenlemeler bağlamında değerlendirilerek, sorunlu olduğu tespit edilen kısımlar aktarılmıĢ ve çözüm olabilecek öneriler getirilmiĢtir. Vergi mevzuatı ve mali idare birçok düzenlemede katılma hesaplarından elde edilen kar paylarını faiz; katılım bankaları tarafından fon kullandırma iĢlemlerinde yoğun olarak kullanılan murabahayı ise borç sözleĢmesi olarak değerlendirmekte, vergilendirmesini buna istinaden yapmaktadır. Bu çalıĢmanın odağında katılım bankacılığı faaliyetlerinin faiz temelinde iĢleyen konvansiyonel bankalardan farklı olduğu hususu yer almaktadır. Bu noktadan hareketle, rekabet eĢitliği de gözetilerek katılım bankacılığı faaliyetlerinin hem çalıĢma düzenine hem de faizsiz finans prensiplerine daha uygun olacağı değerlendirilen mevzuat değiĢikliklerine iliĢkin öneriler getirilmiĢtir."
