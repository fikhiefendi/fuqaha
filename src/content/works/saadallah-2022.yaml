abstract: "Tezin adı“Hanefı Mezhebınde Varsayılan Fıkhın Kontrollerı”. Tezin önemi, bilim adamlarının sanal fıkhı hakkındaki görüşlerini içermesi, Kur'an-ı Kerim, sünnet, sahabeler ve tabiinlerden deliller göstermesi, bilim adamlarının gruplaşarak bu delilleri tartışması ve doğru olup olmadığını beyan etmesinde yatmaktadır. Bu fıkıh türünü araştırırken derinlemesine araştırma yapmaya, sınırlarını ve denetimlerini ortaya koymaya özen gösterdim. Bilim adamları bu fıkıh türünün caiz olup olmadığı konusunda anlaşamadı, konuyu derinleştirdi. Araştırmacı, bu anlaşmazlıktan ne çıkardığını ve bu fıkıh türünün koşullarını özetliyor. Bu tez bir giriş ve üç bölümden oluşuyor. Birinci bölümde fıkıh, sanal ve denetim kavramlarının tanımları ve bu tanımlarla alakalı tüm terimler yer almıştır. İkinci bölümde sanal fıkhın meşruiyeti, kökeni, Irak'ta ortaya çıkış ve yayılma nedenleri ele alınmış ve araştırmacı anlaşmazlıkta bir grup bilim adamının fikirlerini tercih etmiştir. Üçüncü bölümde sanal fıkhın denetimi, ayrıca fıkıh ve fakih birbiri ile alakalı olduğu için fakih'in koşulları ele alınmıştır. Tez birçok önemli sonuca ulaştı: Bilim adamlarının ve hukukçuların yaşamın gelişmelerine ve zamanın değişimlerine ayak uydurabilecekleri, modern zorluklara ve yeni teorilere cevap verebilecekleri sanal hukukun gerekli konumunun tanımı. Bu fıkıh türü ve denetiminin diğer şeriat ilimleri gibi önemsenmesi gerekir. Sanal meselelere hâkim olunması ve düzenlenmesi gerekir. Sanal fıkıhla uğraşan fakihlerin bazı özelliklere sahip olması gerekir, böylece fıkıh bilgisi olmayanlar fakihlerle tartışmaya cesaret edemezler. Aksi taktirde fakihin nefsi onu kontrol edip doğru yoldan çıkarabilir. Sanal fıkıh, şeriat kanunlarını içerir ve bu kanunları gerçekleştirmek üzerine inşa edilmiştir."
