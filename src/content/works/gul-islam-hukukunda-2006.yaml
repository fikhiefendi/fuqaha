abstract: "TEMEL İSLAM BİLİMLERİ ANA BİLİM DALI İSLÂM HUKUKU BİLİM DALIİSLAM HUKUKUNDA KAPKAÇMUTLU GÜL(Yüksek Lisans Tezi)ÖZET?İslam Hukukunda Kapkaç? adlı tezimiz, son günlerde ülkemizde oldukçayaygınlık kazanmış olan kapkaç suçunun İslam hukuku açısından tanımını vemahiyetini ortaya koymak için yapılmış bir çalışmadır.Tezimiz, kısa bir giriş ve üç bölümden oluşmaktadır. Birinci bölümde, kapkaçsuçunun tanımı ve mahiyeti modern hukukla da mukayeseli olarak yapılmayaçalışılmıştır. İkinci bölümde, kapkaç suçuyla İslam hukukunda benzerlik arz edensuçlardan ayrıntılı olarak bahsedilmiş ve bu suçlarla kapkaççılığın benzer ve farklıyönleri ortaya konulmaya çalışılmıştır. Üçüncü bölümde de İslam hukuku açısındankapkaç suçunun failine uygulanabilecek olan yaptırımlardan söz edilmiştir.Sonuç olarak, kapkaç suçunun İslam hukukundaki diğer mala karşıcürümlerden farklı olduğu ve günümüzde işlenen şekliyle yeni bir suç tipi olduğubelirtilmiştir.Yazarı: Mutlu GÜLTezin Adı: İslam Hukukunda Kapkaç (Yüksek Lisans Tezi)Danışmanı: Prof. Dr. Hamdi DöndürenSayfa Sayısı: XI+135"
