abstract: "Üç kıtaya hakim olan Osmanlı Devleti, tarihin en köklü ve en büyük devletlerinden birisidir. Kendisinden önce kurulmus olan Türk devletlerinden miras aldıgı Türk devlet gelenegi üzerine kurulmus, ancak devlet teskilatını gelistirerek en üst seviyeye ulastırmıs ve Türk cihan hakimiyeti mefkuresi geregince her dinden, dilden, ırktan ve kültürden insanlara barıs ve huzur saglamayı kendine görev bilerek devlet yapısını adalet temelleri üzerine oturtmustur. Osmanlı hukuk sisteminde adaleti icra eden görevliler kadılardır. Kadılık makamı Osmanlı Devleti'nde ilk ihdas edilen kurumlardandır. Kadıların tutmus oldugu Ser`iye Sicilleri ise Osmanlı Devleti'nin en önemli birinci elden kaynaklarıdır. Sicillerde, ait oldugu dönem hakkında içtimai, iktisadi, siyasi ve adli bilgiler ve sehir yapısı hakkında bilgiler bulmak mümkündür. ?1 Numaralı Kütahya Ser `iye Sicili'nin üçüncü kısmının? degerlendirilmesi ile kayıtların tutuldugu döneme ait Kütahya ve havalisinde yasayan insanların örf, adet, geleneklerine, yer isimlerine, sahıs isimleri ve unvanlara, aile, ceza ve miras hukuku ile o dönemde yasanan meseleler hakkında bilgilere ulasmaktayız. Yaptıgımız çalısma ile dar anlamda Kütahya'nın içtimai ve iktisadi yapısı, genis anlamda Osmanlı Devleti'nin isleyisi ve tarihi hakkında arastırma yapacak olanlara katkıda bulunmak amaçlanmıstır."
