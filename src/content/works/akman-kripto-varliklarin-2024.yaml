abstract: "Sosyal bir varlık olan insan, ihtiyaçlarını karşılamak için satın alma yöntemlerini kullanmaktadır. Satın alma aracı olarak varlık sınıflarından para, çek, banknot vb. gibi varlıkları tercih etmektedir. Daha sık tercih edilen satın alma aracı ise para olmaktadır. Günümüzde ortaya çıkan kripto varlıklar, toplum nezdinde kripto para olarak ifade edilse de bazı çevrelerde para olarak kabul görmemektedir. Tez çalışmasında inceleyeceğimiz konu İslâm hukuku çerçevesinde kripto varlıklar olup kripto varlıkların para vasfındaki durumu, genel kullanım durumu, İslâm dünyasının kripto varlıklara bakış açısı ve İslâm hukukuna göre kripto varlıkların kullanım durumuna yönelik araştırmalardan oluşmaktadır. Beş bölümde çalışılan tezin ilk bölümü olan giriş bölümünde araştırmanın amacı, konusu, araştırmanın önemi ve yöntemi hakkında bilgi verilmektedir. İkinci bölümde, kripto varlığın ortaya çıkış süreci ve kripto varlığın yapısını tanımaya yönelik çalışma yer almaktadır. Üçüncü bölümde, iktisatta ve İslâm hukukunda para konusu, kripto para üzerine yapılmış olan değerlendirmeler ve fetvalar ele alınmaktadır. Dördüncü bölümde, İslâm hukukunda bey' akdi ve sarf akdi yönüyle kripto varlık değerlendirilmeye çalışılmıştır. Son bölümde, İslâm hukuku açısından kripto varlıklar üzerine genel bir değerlendirme yapılmış ve kripto varlıklar para vasfında görülmüştür. Kripto varlıkların caiz olup olmaması durumunun kullanım yollarına bağlı olduğu ve bu yönde kripto varlıklara ilişkin gelişmelerin takip edilmesinin doğru olacağı sonucuna varılmıştır."
