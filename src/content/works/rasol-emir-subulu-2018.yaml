abstract: "Bu çalışma, İmam San'ânî'nin Sübülü's-selâm adlı eserinde yer alan“mutlak-mukayyed uygulamalarını”kapsamaktadır. Bu çalışma, dört bölüm ve sonuçtan oluşmaktadır: Birinci bölümde, ilk olarak İmam San'ânî'nin ilmi ve şahsi hayatı; ismi, lakabı, nisbesi, doğumu, vefatı, hocaları, öğrencileri ve eserleri konuları ele alınmıştır. Daha sonra yaşadığı dönem siyasi, içtimai ve ilmi açıdan incelenmiştir. Yine bu bölümde İmam San'ânî'nin Sübülü's-selâm adlı eserinin tanıtımı yapılarak eserin özellikleri, değeri ve yöntemi ortaya koyulmaya çalışılmış ve esere yönelik eleştiriler tartışılmıştır. İkinci bölümde, İmam San'ânî'nin“mutlak ve mukayyet”ilgili görüşleri diğer üsulcülerin görüşleri ilgili karşılaştırılarak incelenmiştir. Bu bölümde şu başlıklar ele alınmıştır:a. Mutlak-mukayyet kavramları ve usülcülere göre hükümleri, b. İmam San'ânî' mutlak-mukayyet kavramları, hükümleri, İmam San'ânî' ile mezheb alimlerine göre mutlakın mukayyede hamledilmesi, c. Mutlakın mukayyede hamledilmesi ilgili ihtilaf nedenleri, Şafii'ye mutlakın mukayyede hamledilmesi için gerekli şartlar ve nedenleri. Üçüncü bölümde Sübülü's-selâm adlı eserin“ibatler”bölümündeki“mutlak”-mukayyed“ uygulamalarını ele almaktadır. Bu bölümde: a. Durgun suda bevletmenin hükmü, b. Köpeğin içinden su içtiği kabın hükmü, c. Murdar hayvanın postunun hükmü, d. Sidik bulaşmış elbisinin şerî olarak temizlenmesi hükmü, e. Sabah ezanında ”tesvîb“ (es-salât hayrun mi'n-nevm) yapmanın hükmü. Son bölümde Sübülü's-selâm adlı eserin ”muamelat“ bölümünde yer alan:a. Ticaret kervanın şehrin dışında karşılanmasının hükmü, b. Karaborsanın hükmü, c. Aldatma gerçekleştiğinde cayma hakkının hükmü, d. Madûm (var olmayan)da yapılan ”selem“ akdinin hükmü, e. Yanında ”rehine“ (ipotek) bulunun kimsenin rehineden yararlanmanın hükmü. ط Sonuç bölümünde ise çalışma boyunca elde edilen veriler maddeler halinde halinde sıralanmıştır. Bunlardan en önemlisi mutlak olarak gelen ”nass“ı takyit edecek bir kayıt olmadığında mutlakın mukayyede hamledilmemesi ve mukayyed olarak gelen ”nass\"ın ise -delil olmadığı takdirde- kaydı ile birlikte amel edilmesidir."
