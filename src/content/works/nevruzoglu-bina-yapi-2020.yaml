abstract: "Bu tez çalışmasında uygulamada oldukça önemli bir yer tutan bina ve yapı eserinden doğan zarardan malikin sorumluluğu ele alınmıştır. Bu doğrultuda sorumluluk kavramının tanımı, sorumluluğun Türk Hukuku içerisindeki yeri incelendikten sonra, konumuz olan bina ve yapı eseri malikinin sorumluluğu ve bu sorumluluğun meydana gelmesi için gerekli olan şartlar ve bunun yarattığı sonuçlar üzerinde durulacaktır. Özellikle bina ve yapı eserinin hukuki niteliği, bina ve yapı eserinden doğan sorumluluğun diğer sorumluluk türlerinden farkları, oluşan zarardan kimlerin ne oranda sorumlu olduğu gibi hususlar üzerinde durulacaktır. Aynı şekilde zararın giderilmesi hususunda açılacak tazminat davasının tarafları, tazminatın ne tür zararları kapsayabileceği, tazminat davasından sonra zararı giderenin kimlere ne oranda rücu edebilme hakkına sahip olduğu gibi çeşitli noktalara değinilecektir. Keza 6098 sayılı Türk Borçlar Kanununun yapı malikinin sorumluluğu bağlamında 818 sayılı Borçlar Kanunundan farklı olarak ne tür değişikliklere gidildiği konusunda yapılan düzenlemeler de ele alınacaktır."
