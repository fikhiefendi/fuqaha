abstract: "?Ebû Hanîfe'ye Göre Hırsızlık Suçu ve Cezası? adlı tezimizde, insanlık tarihi kadar uzun bir geçmişi olan hırsızlık suçunun ve bu suça verilen cezanın İslâm ceza hukukundaki yerini ve Ebû Hanîfe'nin hırsızlık suçu ve cezasıyla ilgili görüşlerini ele aldık.Tezimiz bir giriş ve iki bölümden oluşmaktadır. Giriş bölümünde, Ebû Hanîfe'nin hayatına ve İslâm hukukuyla ilgili temel görüşlerine kısaca yer verip bununla birlikte, hırsızlık suçunun tarihi gelişimine değindik.Birinci bölümde, ?hırsızlık suçu ve cezasının İslâm ceza hukukundaki yeri? konusu ve İslâm hukukunda ?suç? ve ?ceza? tabirleri üzerinde durduk.İkinci bölümde, Ebû Hanîfe'nin, hırsızlık suçu ve cezası hakkındaki görüşlerini ortaya koyduk, zaman zaman karşılaştırma maksadıyla diğer İslâm hukukçularının fikirlerini de belirtmeye çalıştık."
