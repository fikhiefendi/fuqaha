abstract: "Araştırmamıza göre; eklenti vasfına sahip olan bir taşınır önemli hukuki sonuçları da yanında taşımaktadır. Bu bağlamda Kanun Koyucu, bir şeyin eklenti olarak değerlendirilebilmesi için taşıması gereken şartlar, TMK m.686/2'de düzenlenmiştir. Bu düzenleme çerçevesinde, eklenti, asıl şeyden bağımsız olarak hukuki varlığını devam ettiriyorken asıl şey üzerinde yapılan işlemler, aksi kararlaştırılmadıkça, eklenti üzerinde de sonuç doğurmaktadır. Konuya ilişkin olarak; tasarruf işleminin, eklentiyi kapsamasına ilişkin önemli düzenlemelerden birisi, TMK m.862 olup, buna göre taşınmaz üzerinde tesis edilen rehin, taşınmaza özgülenmiş olan eklentileri de kapsamına almaktadır. Dolayısıyla, tesis edilen taşınmaz rehni, taşınmaz malikinin, eklentinin zilyetliğini taşınmaz rehni alacaklısına geçirmesine gerek olmaksızın, daha fazla kredi bulma imkânını ve eklenti niteliğindeki taşınırı uhdesinde bulundurarak krediyi daha kolay ödemesini sağlamaktadır. Ayrıca eklentinin bu şekilde taşınmaz rehninin kapsamına dâhil olması, taşınmaz rehni alacaklısı açısından da yararlı olmaktadır. Eklenti niteliğindeki taşınır, taşınmaz rehni ile birlikte ticari işletme rehni veya teslime bağlı taşınır rehnine konu olabilmektedir. Taşınırın, hem taşınmaz rehnine hem de ticari işletme rehnine konu olması durumunda, taşınmaz rehni alacaklısı ile ticari işletme rehni alacaklısı arasındaki hak çatışması, taşınmaz ile üzerindeki işletmenin aynı kişiye ait olup olmamasına ve iki rehin türünden hangisinin daha önce tesis edildiğine göre çözülmektedir. Taşınırın, hem taşınmaz rehnine hem de teslime bağlı taşınır rehnine konu olması durumunda ise, taşınmaz rehni alacaklısı ile teslime bağlı taşınır rehni alacaklısı arasındaki hak çatışması, taşınır üzerinde tesis edilen teslime bağlı rehne, taşınmaz rehni alacaklısının muvafakatinin olup olmamasına göre çözümlenmektedir."
