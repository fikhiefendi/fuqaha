abstract: "Bu çalışmanın temel amacı, katılım bankacılığı ürünlerinin pazarlanması sürecinde, geleneksel (konvansiyonel) bankacılık uygulamalarına kıyasla karşılaşılan yapısal ve algısal zorlukları banka çalışanlarının sahada deneyimledikleri tecrübelerle ortaya koymaktır. Nitel olan bu araştırmada, görüşme (mülakat) yaklaşımı benimsenmiş olup veri toplama aracı olarak yarı yapılandırılmış görüşme formu kullanılmıştır. Çalışma grubunun seçiminde, amaçlı örnekleme yaklaşımlarından biri olan ölçüt örnekleme yönteminden faydalanılmıştır. Bu bağlamda çalışma grubu, her iki bankacılık sisteminin karşılaştırmalı biçimde değerlendirilebilmesi amacıyla, geleneksel bankacılıkta en az üç yıl deneyimi bulunan ve hâlihazırda katılım bankalarında en az üç yıldır görev yapan çalışanlardan oluşturulmuştur. Görüşmeler neticesinde ulaşılan bilgiler, birbirleriyle olan mantıksal ilişkileri dikkate alınarak birleştirilmiş ve çalışmanın kuramsal çerçevesini yansıtan sekiz ana tema altında kategorize edilmiştir. Bu sekiz ana tema;“Farkındalık ve Bilgi Düzeyi”,“Güven ve Algı Yönetimi”,“Ürün Farklılaştırması ve Anlatımı”,“Pazarlama Stratejileri ve Kısıtlar”,“Müşteri Segmentasyonu ve Hedef Kitle”,“Regülasyon ve Uyum Süreci”,“Rekabet Ortamı”ve“Eğitim ve Personel Yeterliliği”başlıklarında değerlendirilmiştir. Araştırma bulgularına göre, müşteriler tarafından katılım bankacılığının çoğunlukla“faizsizlik”üzerinden tanımlandığı, ürünlerinin dayandığı temel ilkelerin ise tam olarak anlaşılmadığı belirlenmiştir. Bazı müşterilerin, bu sistemin geleneksel bankacılığın isim değiştirmiş bir türü olduğu yönünde bir algıya sahip olduğu anlaşılmıştır. Ayrıca, kamu katılım bankalarının sektöre girmesiyle müşterilerin bu sisteme duydukları güvenin desteklendiği söylenebilmektedir. İslami finans ilkeleri gereği, bazı sektörlerin finanse edilememesi ve nakit ihtiyacına yönelik ürün çeşidinin geleneksel bankalara göre sınırlı olmasının, pazarlama alanını daraltan önemli faktörler olduğu tespit edilmiştir. Katılım bankalarına özgü fonlama yapısının, özellikle piyasa faiz oranlarındaki dalgalanmalar sırasında maliyet yönetimini farklılaştırdığı ve bu durumun zaman zaman fiyat rekabetini zorlaştırabildiği ortaya koyulmuştur. Etkili bir pazarlama sürecinin gerçekleşebilmesi için ilgili çalışanların ürüne yönelik finansal konuların yanında fıkhi hükümler hakkında da bilgi sahibi olmalarının oldukça önemli olduğu anlaşılmıştır. Buna ek olarak, pazarlama sürecinde ürüne yönelik teknik söylemlerin müşteri seviyesine göre uyumlaştırılmasının, bu sürecin sağlıklı işlemesinde belirleyici bir unsur olduğu tespit edilmiştir. Sonuç olarak bu araştırmada, katılım bankacılığının pazar payını genişletip sürdürülebilir bir büyüme sağlayabilmesi için inanç temelli bir pazarlama yaklaşımının yanında pazarlama sürecinde karşılaşılan finansal, iletişimsel ve operasyonel durumların da dikkatle değerlendirilmesinin oldukça önem arz ettiği ileri sürülebilmektedir."
