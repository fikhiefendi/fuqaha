abstract: "Fıkıh, nahiv, kelâm, hadis, tefsir ve mantık gibi birçok alanda yazdığı eserlerle tanınan İmam Musannifek, IX/XV. yüzyılda yaşamış çok yönlü bir âlimdir. Hanefi mezhebinde muhakkik alimlerden kabul edilir. Hanefi mezhebinin en önemli metinlerinden olan el-Hidâye üzerine yazdığı Şerhü'l-Hidâye eserinde de müellif alanındaki yetkinliğini açığa çıkarmıştır. Hanefî mezhebi çizgisinde kaleme alındığı döneme kadar oluşan fıkıh birikiminden de istifade edilerek yazılan eser, el-Hidâye şerhleri başta olmak üzere kendisinden sonra yazılan birçok Hanefi eserine kaynaklık etmiştir. Taşıdığı önem sebebiyle eserin edisyon kritiğinin yapılıp değerlendirilmesi gerektiği açıktır. Bu ihtiyacı bir ölçüde gidermek amacıyla bu çalışma yapılmıştır. Çalışmamız bir giriş ve 3 bölümden oluşmaktadır. Giriş bölümünde çalışmanın planı, amacı, yöntemi ile edisyon kritikte takip edilen yöntem ele alınmıştır.Birinci bölümde metin yazarı el-Merğînânî ile şarih Musannifek hakkında bilgi verilmiş; ikinci bölümde çalışmada ele alınan Şerhü'l-Hidâye, geniş bir şekilde tanıtılarak değerlendirilmiştir. Üçüncü bölüm ilgili eserin Taharet, Hukuk ve İstihkak bölümlerinin edisyon kritiğine ayrılmıştır.Çalışma sonuç ve bibliyografya ile sona ermektedir"
