abstract: "Hanefî fakihleri Muhammed b. Hasan eş-Şeybânî'nin kitaplarına çok sayıda şerh yazmışlardır. el-Câmiʿu'l-kebîr de bu kitaplardan bir tanesidir. Muhammed b. Abbâd el-Hılâtî gibi bazı âlimler ise el-Câmiʿu'l-kebîr'i ihtisar etmişlerdir. Bu muhtasar eserler içerisinde Telḫîṣü'l-Câmiʿi'l-kebîr diğer muhtasar eserler arasında fukahanın göstermiş olduğu ilgiyle ön plana çıkmaktadır. Kitabın günümüze ulaşan nüshalarının fazlalığı ve üzerine yazılan şerhlerin çokluğu da buna delalet etmektedir. et-Telḫîṣ kendine has üslubu ile diğer muhtasar eserlerden ayrılmaktadır. Kitabın birçok âlim tarafından şerh edilmesi de bu özgünlüğünden kaynaklanmaktadır. Bu çalışma Telḫîṣü'l-Câmiʿi'l-kebîr isimli eserin ilk yarısını olabildiğince Hılâtî'nin kaleme aldığı ilk şekline ulaşma amacı ile tahkikini hedeflemektedir. Ayrıca Hılâtî'nin kitaptaki çabasını ortaya çıkarmak için el-Câmiʿu'l-kebîr'i ve et-Telḫîṣ'i çeşitli açılardan karşılaştırarak kitabın incelemesini yapmak da çalışmanın gayelerindendir."
