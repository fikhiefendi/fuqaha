abstract: "Para vakfı, tüm sosyal yardım ve hayır faaliyetlerini finanse etmek için vakfedilen, bu kurumlarda güvenli hesaplarda takip edilen nakit şeklindeki bir bağıştır. Malezya'da para vakfı fonları başlıca, sağlık, eğitim ve ekonomik kalkınma olmak üzere üç sektörde yoğunlaşmaktadır. Bu çalışma, Malezya'daki eğitim alanındaki para vakıflarına yoğunlaşmaktadır. Özellikle, Malezya hükümetinin eğitime ayırdığı sınırlı tahsis, üniversitelerdeki yüksek öğrenim ücretlerinin fazlalığı ve Yüksek Öğretim Bakanlığı'nın (MOHE) kısıtlı devlet bütçesi sebebiyle bağış yoluyla bir üniversite vakfı kurmak istemesi gibi sorunları ele almaktadır. Fakat genel olarak vakıf müessesi, birçok zorlukla karşılaştığından, eğitim amaçlı para vakıfları da gerek kurulmaları gerekse faaliyetlerini devam ettirmeleri noktasında çeşitli zorlukları taşımaktadırlar. Bu çalışma, Malezya'da eğitim amaçlı para vakıflarının iç ve dış faktörlerle, Covid-19 pandemisi kaynaklı temel sorunlarını ve karşılaştıkları güçlükleri gözlemlemeyi amaçlamıştır. Bu çalışmada yöntem olarak“yarı yapılandırılmış mülakat/görüşme”birincil veriler başta olmak üzere nitel metod kullanılmıştır. Bu çerçevede, ilgili para vakfı kurumlarını temsil eden altı katılımcı çalışmaya dahil edilmiştir. Bulgular, her vakıf kurumunun karşılaştığı zorlukların birbirinden farklı olduğunu ortaya koymuştur. Buna karşın, eğitim amaçlı bu para vakıflarının çoğu, Malezya hükümeti tarafından gerekli kılınan“Hareket Kontrol Emri (MCO)”nedeniyle Covid-19 pandemisi sırasında aynı zorluklarla karşılaşmıştır. Netice olarak çalışma, daha iyi bir eğitim sistemi oluşturmak ve öğrenci refahını sağlamak amacıyla ülke çapında faaliyet gösteren eğitim amaçlı para vakıflarını geliştirmek ve yetkili organları önceden harekete geçirmek için ilgili taraflara çeşitli politika önerileri sunmaktadır."
