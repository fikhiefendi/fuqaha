abstract: "İslâm hukukunda evlenmeye ve dolayısıyla âile hayatına çok büyük bir önem verilmiştir. Zira evlenmenin ferdî ve ictimâî; dünyevî ve uhrevî birçok maslahatı vardır. Bunların en önemlisi de bazı fıtrî arzuların meşru çerçevede karşılanmasının yanı sıra insan neslinin âhenkli bir şekilde kıyamete kadar devamıdır. Bununla birlikte evlilik hayatının sevgi, şefkat ve saygı bağları ile kurulup yürütülmesi hedeflenmiş; bunun için bir takım hukuki kurallar koyulmuştur. Öncelikle evlilik hayatının temeli olan evlenme akdi, sözü edilen bazı kurallara göre yapılır ve âile hayatı da ahlâkî kuralların yanında bazı hukukî kurallara göre şekillenir. Bu kuralların bir kısmı Kur'ân ve Sünnette açıkça yer almış, bir kısmı da bu iki kaynağa dayanan fikhî bilginin yer aldığı literatürde genişçe anlatılmıştır. Ayrıca bu bilgilerin kânun maddeleriyle ifade edildiği kânunlaştırma çalışmaları da vardır. Bunlardan birisi de Suriye Ahvâl-i Şahsiyye Kanunu'dur. Bu kanunda evlenmenin mahiyeti, nişanlanma, evlenme akdinin rükün ve şartları, evlenme ehliyeti, evlenmede velâyet, evlenmede vekâlet, evlenilmesi haram olan kadınlar, evlenme akdinin idari işlemleri, evlenme çeşitleri ve hükümleri, evlenme akdinin sonuçları gibi konular maddeleştirilmiştir. Bu çalışmada da ilgili maddeler çerçevesinde İslâm hukukunda evlenme konusu mezheplerin görüşleri ile karşılaştırılarak incelenmiştir."
