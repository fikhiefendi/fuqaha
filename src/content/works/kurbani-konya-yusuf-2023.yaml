abstract: "Hazırlamış olduğumuz bu çalışmada Konya Yusuf Ağa Kütüphanesi' nde bulunan yazma Fıkıh eserlerini ele aldık. Bilindiği üzere bilimsel araştırmalarda literatür bilgisi önemli bir konuma sahiptir. Bu bağlamda kadim geleneğimizin mirası olan yazma eserlerin kütüphanelerde mahfuz olduğu malumdur. Konya'da bulunan Yusuf Ağa kütüphanesi de bu bakımdan zengin bir koleksiyona sahiptir. İnceleme konumuz olan bu eserler bize dönemin eğitim sistemi hakkında ışık tutması açısından büyük önem arz etmektedir. Kütüphanede 3157 cilt yazma eser bulunmaktadır. Bu eserler Tefsir, Hadis, Fıkıh, Kelâm, Tasavvuf ve Felsefe konularında kaleme alınmışlardır. Biz çalışma alanımıza giren muhtasar usûl metinleri, usûl şerhleri ve haşiyeleri, füru fıkıh ve muhtasar füru fıkıh metinleri, füru fıkıh şerhleri ve haşiyeleri, ilmihâl eserleri, fetva ve muhtasar fetva metinleri, muhtasar kazâ metinleri, kazâ şerhleri ve haşiyeleri, külli kâide eserleri, hilâf eserleri, vakıf eserleri gibi fıkıh alanına ait yazma eserleri inceledik. Yaptığımız çalışmada yazma eserlerin tam künyeleri, müellifleri, içerikleri, fiziki özellikleri hakkında görsellerle beraber bilgi verdik. Kütüphane kayıtlarında bulunan eksik ve yanlışlıkları veya demirbaşa kaydedilirken sehven yapılan hataları tespit etmeye gayret ettik. Çalışmamızın Fıkıh alanında araştırma yapanlara, bu konuya ilgi duyanlara ve Yusuf Ağa Kütüphanesi hakkında tetkik yapanlara da katkı sağlayacağını umut ediyoruz."
