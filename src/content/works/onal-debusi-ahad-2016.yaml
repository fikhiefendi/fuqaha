abstract: "Sünnetin hem aslî bir kaynak olması hem de Kur'ân'ın açıklayıcısı olma vasfını üstlenmesi onu, İslâmî araştırmaların odağına yerleştirmiştir. İslâm ulemâsı da bu kaynağın sonraki nesillere çoğunlukla âhâd yolla ulaşmış olmasını dikkate alarak özellikle âhâd haber üzerinde durmuş, bu haberlerin doğru olma ihtimalleri kadar olmama ihtimalini de göz önüne alarak onunla amel için belli şartlar ileri sürmüştür. Bu çalışma Hanefî fıkıh usûlünü ince bir tasnif ve tertibe tâbî tutan Debûsî ile eski mezhebi olması hasebiyle Hanefî mezhebine de hâkim Şâfiî fakîhi Sem'ânî'nin haber-i vâhidi nasıl değerlendirdikleri, sıhhati için aradıkları şartları ve diğer delillerle arasında nasıl bir ilişkinin olması gerektiğine dair ortaya koydukları tespitleri ve bunu yaparken birleştikleri ve ayrıldıkları yerleri ortaya koymayı hedeflemiştir. Üç bölümden oluşan bu çalışmada sırasıyla Debûsî ve Sem'ânî'de haber kavramı ve türlerine, âhâd haberin hücciyeti ve kabul şartlarına, âhâd haberin diğer delillerle ilişkisine yer verilmiştir."
