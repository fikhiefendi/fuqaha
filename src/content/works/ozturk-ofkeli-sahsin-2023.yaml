abstract: "Bu çalışmada, öfkeliyken yapılan boşamaların, İslam Hukuku açısından geçerli olup olmadığı hususu ele alınmıştır. Birinci bölümde öfke kavramı ele alınmış, öfke ile insan iradesi arasındaki ilişki irdelenmiştir. İkinci bölümde, talâk (boşama) kavramı ve talâk (boşama) çeşitleri ele alınmış, boşamanın geçerli olabilmesi için gerekli şartlar irdelenmiştir. Öfkeliyken alınan boşa(n)ma kararlarının geçerliliği İslam hukuku açısından ele alınmıştır. Üçüncü bölümde, öfkeli şahsın talâkının geçerli olup olmadığı meselesi mezheplerin görüşleri bağlamında ele alınarak değerlendirme yapılmıştır. Çalışmamız esnasında, Şâfiî ve Mâlikî hukukçular ile Hanbelî fukahânın bir kısmının öfkeli şahsın talâkını geçerli saydığı, Hanbelî fukahânın son dönem temsilcileri ile Hanefî hukukçuların ise bu halde gerçekleşen talâkın geçerli ve bağlayıcı kabul edilemeyeceğini savundukları görülmüştür."
