abstract: "Bu çalışmada İslâm fıkhında oyun ve eğlencenin ibadet ve sosyal hayatla ilişkisi incelenmiştir. Araştırmanın amacı, insan hayatının doğal bir unsuru olan oyun ve eğlencenin İslâm hukukundaki yerini ortaya koymak, bu faaliyetlerin dinî ve toplumsal boyutlarını değerlendirmek ve günümüzde ortaya çıkan yeni eğlence türlerinin fıkhî açıdan durumunu tespit etmektir. Araştırmada literatür taraması yöntemi kullanılmıştır. Konu, Kur'ân-ı Kerîm, hadis kaynakları, klasik fıkıh eserleri ve güncel akademik çalışmalar ışığında ele alınmıştır. Öncelikle İslâm öncesi Arap toplumundaki eğlence anlayışı incelenmiş, ardından Hz. Peygamber'in oyun, eğlence, mizah ve sportif faaliyetlere yaklaşımı değerlendirilmiştir. Ayrıca sahâbe ve sonraki dönemlerdeki eğlence anlayışı ile fıkıh mezheplerinin konuya ilişkin görüşleri ele alınmıştır. Çalışmanın son bölümünde dijital oyunlar, oyun içi satın alma sistemleri, sanal varlıklar ve şansa dayalı mekanizmalar İslâm hukuku açısından değerlendirilmiştir. Araştırma sonucunda İslâm'ın oyun ve eğlenceyi mutlak olarak yasaklamadığı, aksine insanın dinlenme ve eğlenme ihtiyacını dikkate aldığı tespit edilmiştir. Bununla birlikte eğlencenin ibadetleri aksatmaması, haram unsurlar içermemesi, ahlâkî bozulmaya yol açmaması ve kumar benzeri uygulamalardan uzak olması gerektiği sonucuna ulaşılmıştır. Buna göre İslâm fıkhında oyun ve eğlenceye yönelik yaklaşımın yasaklama esasına değil, ölçü ve denge ilkesine dayandığı görülmüştür."
