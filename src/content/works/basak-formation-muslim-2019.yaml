abstract: "Bu çalışma, Kanada'nın üç farklı şehrinde yaşayan Müslümanların dini kimliklerini nasıl ifade ettiklerini, nasıl teşekkül ettirdiklerini ve birbirlerini Müslüman olarak nasıl algıladıklarını incelemektedir. Bu çalışmanın üç odak noktası vardır: Birincisi, dini olarak çoğulcu çevrimdışı alanların Ekim 2017'den Nisan 2018'e kadar Mississauga, Halifax ve St. John's şehirlerinde yarı yapılandırılmış görüşmeler yaptığım kendini Müslüman olarak tanımlayan elli beş katılımcının fıkhi tercihlerini nasıl şekillendiriyor? İkincisi, İslami çevrimiçi alanların göç sonrası Kanada bağlamında Müslümanların çevrimdışı dini katılımlarını nasıl etkiliyor? Üçüncüsü, günümüzde Kanada'da göç sonrası Müslümanların dini yaşantılarında Müslümanların dini kimliklerini şekillendirmede İnternet ve diğer dijital teknolojilerin oynadığı roller nelerdir? Bu araştırma Kanada'nın kamusal alanlarının nasıl ağırlıklı olarak İslami mezheplere ve mezhep farklılıklarına hoşgörülü ve saygılı olduğunu gösteriyor. Daha spesifik olarak, katılımcıların Müslüman kimliklerini belirli bir İslami hukuk geleneğine atıfta bulunarak tanımlamanın, ulus devletin insan haklarına, eşitliğe ve din özgürlüğüne bağlı olduğu Kanada'da ya gereksiz ya da yersiz olduğuna inandıklarını ortaya koyuyor. Ayrıca, İnternet'in göç sonrası dindarlığı şekillendirmede aktif kişisel katılımdan çok daha zayıf olduğunu gösteriyor İnternetin, Müslüman katılımcıların dini kimliklerini azınlık bağlamında yaşamaları için hızlı ve kolay erişim sağladığı, ancak göç sonrası dini yaşamlarını oluşturmada daha az önemli olduğu sonucuna varıyor."
