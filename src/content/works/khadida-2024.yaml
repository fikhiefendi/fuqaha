abstract: "İslam hukuku, insanların maslahatını sağlamak amacıyla gelmiştir; bu da insanların zaruriyat, haciyat, tahsiniyat iyileştirilmesiyle mümkündür. Şüphesiz geniş anlamıyla şer'i hükümler bize maslahat, hüküm ve maksadı ihtiva ettiğini göstermektedir. Bu da ancak makasad ilmini kapsamlı bir şekilde öğrenmiş, araştırmış bir kavramış kişiler tarafından anlaşılabilmektedir. Bu önem doğrultusunda, tezimizde şer'i makasıdın lafızları anlamadaki etkisi ele almıştır. Çalışmada, şer'i maksad kavramı, türleri, önemine dikkat çekilmiş ve daha sonra lafızların anlamları kavramı ve maksıdın uygulanabilirliği incelemiştir. Ayrıca, maksadın lafızların anlamları üzerindeki etkisini, belirli kurallar çerçevesinde nasıl sağladığını, makasıd ilmiyle şer'i hükümler arasında tearuzun giderilemesi konusu ele almıştır. Bu kapsam dahilinde, anlamı kavranabilen ve kavranılmayan hükümlerin bazı faydaları belirtilmiştir. Bilahare, nas ve zahir kavramlarının tanımları ile anlamlarını ve her birinin çeşitleri açıklamış, zikredilen çeşitlerden hangilerinin kastedildiği ifade edilmiştir. Daha sonra, maksadın bu anlamlar üzerindeki etkisini nasıl sağladığını ve her birinin anlamına ilişkin uygulamalı örneklerle belirtilmiştir. Bununla birlikte, maksadın lafzın anlamı tahsis etme, anlam daraltma etkisi konusu ele almış, bu kapsamda genel ve mutlak lafızların anlamları incelemiştir. Genel ve mutlak kavramların tanımları, çeşitleri ve bu çeşitlerin hangilerinin kastedildiğini belirttikten sonra, maksadın bu anlamlar üzerindeki etkisi açıklamış ve örnekler verilmiştir. Bilahare, has ve mukayyed lafızların anlamlarını, maksadın bu lafızlara etkisine değinilmiş, bunlarla ilgili uygulamalara yer verilmiştir. Emir ve nehiy ile ilgili bölümde ise, bu kavramların tanımları ve anlamlarını belirttikten sonra, maksadın emir ve nehiy üzerindeki etkisi konuları işlenmiştir. Anahtar Kelimeler: Makasıd, makasıdü'ş-şerîa, Delâletü'l-elfâz, Şer'î hükümler, Nas, Mutlak"
