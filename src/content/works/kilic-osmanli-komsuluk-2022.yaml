abstract: "Komşuluk, insanların sosyal ilişkileri bakımından aileden sonra gelen ilk basamaktır. İnsanların birbirine ihtiyaç duyması, onları bir arada yaşamaya teşvik eder. Bir arada yaşama kuralları da komşuluk hukukunu meydana getirmektedir. Bu çalışmada dar ve geniş kapsamıyla Osmanlı komşuluk hukuku ele alınmıştır. Birinci bölüm, komşuluk hukukuna ilişkin temel kavramların tespit edilip açıklanmasına ayrılmıştır. Komşuluğun yanında hem içerik hem de fiziksel bakımdan daha geniş bir kavram olan“mahalle”üzerinde de durulmuştur. Bu iki temel hususların dışında şehir, semt, köy kavramlarından da kısaca bahsedilmiştir. İkinci bölümde mülkiyet haklarının kısıtlanması bakımından komşuluk hukuku üzerinde durulmuştur. Özellikle zarar-ı fahiş ve komşunun şuf'a hakkı etraflıca izah edilmiştir. Komşuların birbirine fahiş zarar verecek şekilde eylemlerde bulunmasının bütün hukuk sistemlerinde hukuka aykırı olarak tanımlandığından bahsedilmiştir. Üçüncü bölüm, komşuların mahalleli sıfatıyla yüklendiği sorumluluklar ve bu sorumlulukları ne şekilde yerine getirdikleri, bireyler ile mahalleli arasındaki hukuki ilişkilerden oluşmuştur. Vakıfların kamu hizmetlerinin görülmesindeki rölü, şahsa kefalet, kasame ve bir suçtan dolayı toplu sorumluluk, mahalleden ihraç bu bölümün önemli başlıkları arasındadır. Çalışmanın son bölümünde komşuluk hukukunun Tanzimat döneminde ne şekilde değişikliğe uğradığı incelenmiştir. Kadının yetkilerinin azaltılması, bu yetkilerin çeşitli nazırlıklara verilmesi, Yeniçeri ocağının kaldırılması, muhtarlıkların ve belediyelerin kurulması, ebniye nizamnamelerinin birbirine komşu olan evlerin fiziki yapısına etkisi bu bölümde araştırılmıştır."
