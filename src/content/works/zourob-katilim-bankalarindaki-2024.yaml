abstract: "Sözleşme yapan taraflardan birisinin gücü yetmesine rağmen sözleşmenin sorumluluklarını vaktinde ve tam olarak yerine getirmeyerek suç işlemesine karşılık verilecek cezanın ne olduğu meselesi hususunda gerek klasik fukahâ gerekse günümüzdeki fukahâ farklı görüşler ileri sürmüştür. Bu görüşler incelendiğinde klasik fukahânın çoğunluğunun böyle bir suç işleyen kimseye mali niteliği olmayan cezalar, günümüzdeki fukahânın da mali niteliği olan cezalar uygulanması gerektiği konusunda görüş ileri sürdükleri görülür. Günümüzdeki fukahânın ileri sürdükleri mali ceza uygulamaları da birbirinden farklıdır. Bu tezde katılım bankalarındaki mali ceza uygulamaları İslam iktisadı açısından ele alınmaya ve ileri sürülen her bir görüş İslam iktisadı çerçevesinde değerlendirilmeye çalışılacaktır. Yapılan değerlendirmeler sonucunda herhangi bir suça karşılık verilen cezanın adaleti sağlamak açısından suça uygun olması gerektiği ve gücü yetmesine rağmen sözleşmenin sorumluluklarını vadesinde tam olarak yerine getirmeyen kimseye ceza verilirken de bu ilkenin göz önünde bulundurulması gerektiği ve bu ilkeyi öne çıkaran görüşün isabetli olduğu kanaatine varılmıştır."
