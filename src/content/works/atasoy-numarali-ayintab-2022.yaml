abstract: "Şer'îyye Sicilleri, Osmanlı Dönemi Türk tarihine dair önemli bilgiler ihtiva eden arşiv kaynaklarının başında gelmektedir. Ayrıca ait oldukları şehir hakkında zengin bilgiler içeren birinci el kaynaklardandır. Çalışmaya konu olan 50 numaralı Ayıntâb Şer'îyye Sicili, H. 1110-1111/M. 1698-1700 yıllarını kapsamakla birlikte 359 sayfa ve 714 belgeden oluşmaktadır. Tezin ilk bölümünde Şer'îyye Sicillerinin önemi ile içerdiği belge türlerinden ve mahkemede görev alan kişilerden bahsedilmiştir. İkinci bölümde incelenen defterin transkripsiyonu ve belge özetleri yer almaktadır. Son bölüm olan üçüncü bölümde ise sicilden elde edilen veriler ışığında 1698-1700 yılı Ayıntâb şehrinin siyasi, iktisadi, idari ve kültürel hayatı hakkında önemli bilgiler sunulmuştur. Bu çalışma, Osmanlı döneminin tipik Anadolu kentlerinden biri olan Ayıntâb'ın tarihini aydınlatmak ve şehir tarihi araştırmalarına katkı sağlamak amacıyla hazırlanmıştır."
