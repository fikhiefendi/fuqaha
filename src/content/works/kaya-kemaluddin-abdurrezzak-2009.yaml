abstract: "Tâbiûn devrinden itibaren (H.II. asır) Yüce Kitabımız Kur'ân-ı Kerîm değişik yöntemlerle tefsir edilmeye başlanmıştır. Bu tefsir yöntemlerinden birisi de işârî tefsir yöntemidir. İşârî tefsir de zaman içerisinde sistemleşme, inkişâf ve Vahdet-i Vücût dönemi olmak üzere üç dönem geçirmiştir.Biz bu çalışmamızda, işarî tefsirin Vahdet-i Vücût döneminde yaşamış olan Abdürrezzâk Kâşânî (ö. 736/1335) ve -bilinmeyen bir sebeple- yıllarca Muhyiddin b. Arabî'ye nispet edilerek basılan tefsiri Te'vîlâtü'l-Kur'ân'ı inceleyeceğiz. Kâşânî, otuza yakın eser vermesine, kendisinden sonra Davûd-u Kayserî (ö. 751/1350), İsmâil Hakkı Bursevi (ö.1137/1725) ve Âlûsî (ö. 1270/1854) gibi önemli müfessirleri etkilemiş olmasına rağmen ilim dünyasında kendisi ve eserleri hak ettiği yeri alamamıştır.Çalışmamız üç bölümden oluşmakta olup giriş bölümünde Abdürrezzâk Kâşânî'nin hayatı, birinci bölümde Tasavvuf ve işârî tefsir, ikinci ve son bölümde de müfessirin Te'vîlâtü'l-Kur'ân adlı eseri tefsir metodolojisi açısından incelenecektir.Anahtar Kelimer:Tefsir, İşârî Tefsir, Tasavvuf, Abdurezzâk Kâşânî, Te'vîlâtü'l-Kur'ân"
