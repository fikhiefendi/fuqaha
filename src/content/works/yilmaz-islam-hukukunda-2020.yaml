abstract: "Günümüzde boşanma vakalarının artmasıyla birlikte çocukların velayeti daha çok tartışılır olmuştur. Aile birliği devam ederken çocuğun bakımı ve terbiyesi aile ortamı içerisinde yapılır. Aile birlikteliği ölüm, boşanma vb. nedenlerle dağıldığında çocuk ve ebeveynlerine ait bazı hak ve sorumlulukların düzenlenmesi ve çocuğun velayeti problemi ortaya çıkar. Velayet konusunun İslam Hukuku ve Türk Medeni Hukukunda kapsam ve içerik olarak aynı olup olmadığı sorusu bizi bu çalışmaya yönlendirmiştir. Çalışmamızda diğer çalışmalardan özgün olarak İslam Hukuku ve Türk Medeni Hukukundaki velayet ile ilgili başlıklar sistematik bir şekilde ele alınmıştır. Çalışmanın amacına uygun olarak İslam Hukuku ve Türk Medeni Hukukunda velayet kavramının içerik ve kapsamı araştırılarak farklı ve benzer yönleri ortaya konulmuştur. İslam Hukukunda 'velayet' ve 'hidane' kavramları araştırılarak iki kavramın temel farklarına değinilmiştir. Yöntem olarak literatür taraması, verilerin analizi, tümevarım, tartışma ve karşılaştırma yöntemlerini kullanılmıştır. İslam Hukukunda velayet ve hidane görevlerinin vacip olduğu, veli ve hadin arasında görev farklılıklarının olduğu, Türk Medeni Hukukunda velayet ve çocuğun bakımı görevinin tek kişiye verildiği, Türk Medeni Hukukunda velayet görevinin kimde olacağına hakimin karar verdiği, İslam Hukukunda velayet görevinin sistematik bir sıraya göre verildiği, İslam Hukuku ve Türk Medeni Hukukunda kişiye verilen hak ve sorumluluklar açısından çok farkın olmadığı, arıza teşkil eden durumların aynı olduğu sonuçlarına ulaşılmıştır. Bu sonuçlar değerlendirilmelere tabi tutulmuş ve bazı önerilerde bulunulmuştur."
