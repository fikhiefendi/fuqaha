abstract: "Osmanlı, üç kıtaya hükmetmiş büyük bir imparatorluk olarak askeri, siyasi, sosyal ve ekonomik açıdan merak konusu olmuştur. Bu denli büyük bir imparatorluk askeri, siyasi, sosyal ve ekonomik açıdan merak konusu olmuştur. Ancak böylesi büyük bir imparatorluğu bir bütün olarak ele alıp incelemek çok zordur. Bu nedenle imparatorluğu bölgesel olarak ele alıp incelemek araştırmacılara kolaylık sağlamaktadır. Bölgesel olarak yapılan çalışmalarda en önemli kaynak Şer'iyye Sicilleridir. Şer'iyye Sicilleri, dönemin mahkeme kayıtları olup daha çok sosyal ve ekonomik tarihe ışık tutması bakımından oldukça kıymetlidir. Bu defterlerde hüccet, ilam, fetvalar yer aldığı gibi, şiirler hatta ilaç tarifleri de bulunuyordu. Bu defterlerin çalışılması kültür edebiyat ve hukuk alanına da katkı sağlamaktadır. Kadı mahkemelerinde merkezden gelen fermanlar, normal askerlik işlemleri ve dava özetleri fazla ayrıntıya girmeden kaydedilmiştir. Defterlerdeki konuların çeşitliliği bu kayıtların Osmanlı tarih araştırmacıları için vazgeçilmez kaynak olmasını sağlamıştır. Özelde imparatorluğun yerel düzeydeki Yar Ahmed Mahallesi üzerinden yapılan bu çalışma genelde Osmanlı İmparatorluk tarihine katkı sağlamayı hedeflemiştir. Bu çalışmada, 1772-1810 yılları arasını kapsayan Tokat Şer'iyye Sicil defterleri incelenmiş ve Yar Ahmed Mahallesine ait kayıtların bulunduğu 11 defterden 84 belgenin transkripsiyonu ve özeti yapılarak belgelerden elde edilen bilgiler değerlendirilmiştir. Ağırlıklı olarak tereke kayıtları, borç-alacak verecek davaları ve satış davalarından oluşan defterlerden tereke sahiplerine ait mal ve eşyaların çeşit ve fiyatları, çocuk ve eş sayıları, terekede geçen yer ve şahıs isimleri, lakaplar, miras taksimi, vasi tayini gibi konular incelenerek mahallenin sosyo-ekonomik durumu ortaya konulmaya çalışılmıştır. Bu çalışma, giriş kısmı ile birlikte üç bölüm ve sonuç bölümünden oluşmaktadır. Giriş'te Şer'iyye Sicilinin tanımı, önemi ve Tokat'a ait mevcut siciller ile Tokat Şer'iyye Sicilleri ile ilgili araştırmalar, materyal ve yöntem hakkında bilgi verildikten sonra araştırmanın konusunu teşkil eden 1, 2, 3, 4, 5, 7, 8, 9, 11, 12 ve 13 numaralı Tokat Şer'iyye Sicillerinin tanıtımı yapılmıştır. 4 başlıktan meydana gelen birinci bölüm Tokat'ın coğrafi konumu, tarihi ve idari yapısı hakkında bilgi vermektedir. İkinci bölüm mahallenin tanımı, Tokat Yar Ahmed Mahallesi hakkında genel bilgi ve bu mahallenin isminin tarihi geçmişi hakkında bilgi vermektedir. Üçüncü bölümde ise 1772-1810 tarihli Tokat Şer'iyye sicilleri ve bu sicillerdeki belgelerin konularına göre tasnifi ve transkripsiyonu yapılıp ardından konularına göre belgeler değerlendirilmiştir. Çalışmamız konu bazlı olduğu için çeşitli doktora tezleri, makale ve kitaplarla desteklenmiştir. Mahalle halkı, imamı ve muhtarları ile görüşülüp mahalle tarihi hakkında röportaj yapılarak teze katkı sağlanmaya çalışılmıştır."
