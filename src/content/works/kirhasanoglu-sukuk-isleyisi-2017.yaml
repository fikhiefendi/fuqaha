abstract: "Dünya ekonomisinin çok hızlı ve büyük gelişimi farklı finansman kaynakları ihtiyacını doğurmaktadır. Bu anlamda geliştirilen yöntemlerin birçoğunun faiz içermesi sebebiyle, dini inançları gereği faize mesafeli yaklaşan İslâmî kesimin sahip olduğu fonların ekonomiye katılması zor bir durum olmaktadır. Son yıllarda İslâmî sermayenin ekonomiye katılması amacıyla yeni finansman yöntemleri geliştirilmeye ve uygulanmaya başlanmıştır. Söz konusu fonların ekonomiye kazandırılması amacıyla geliştirilen faizsiz yöntemlerden en başarılı olarak görüleni sukuktur. Sukuk son yıllarda önemli bir ivme kazanarak yaygınlaşmaya başlamıştır. Bu çalışmada öncelikle sukukun tanımı ve gelişimi ele alınarak sukukun nasıl bir finansman aracı olduğu, günümüze kadar hangi aşamalardan geçerek gelişim gösterdiği incelenmiştir. Bunun yanı sıra sukukun işleyişi ve çeşitleri de ele alınmıştır. Ek olarak sukukun Türkiye'de vergilendirilmesi ve muhasebeleştirilmesi temel boyutlarıyla kısa bir şekilde ele alınmıştır."
