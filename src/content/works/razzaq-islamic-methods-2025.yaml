abstract: "Bu çalışma, mikro, küçük ve orta ölçekli işletmelerin kısa vadeli İslami bankacılık finansmanına etkili bir şekilde erişim yeteneklerini, birçok önemli faktörleri analiz ederek incelemektedir. Bu faktörler arasında, İslami bankacılık araçlarının kısa vadeli finansman ihtiyaçlarını karşılama etkinliği ve işletmelerin kısa vadeli İslami finansmana erişimlerini sınırlayan engeller ile farkındalık ve dindarlığın etkileyici faktörler olarak rolünün ölçülmesi yer almaktadır. Çalışma, İslami bankacılık finansmanı konusunda önceki deneyimleri olan Filistinli Mikro-KOBİ sahipleri ve yöneticilerinden, ayrıca İslami bankalardaki finansman yetkililerinden veri toplanmasına dayanmaktadır ve işletmelerin çalışma sermayesi ihtiyaçlarını karşılamak için İslami bankacılık araçlarını benimseme kararını etkileyen motivasyonları ve belirleyicileri anlamayı amaçlamaktadır. Anket ve mülakatların bir kombinasyonu kullanılarak 240 Mikro-KOBİ finansal yöneticisi ve sahibinin yanıtları istatistiksel olarak analiz edilmiştir. Aynı zamanda, Filistin'deki İslami bankalarda çalışan yedi finansman yetkilisinin gözlemleri de mülakatlar yoluyla elde edilmiştir. Çalışma, Mikro-KOBİ'lerin İslami bankacılık araçlarını benimsemelerini engelleyen bir dizi zorluğun olduğunu ortaya koymuştur. Sonuçlar ise özellikle çoklu sözleşmeleri içeren bu araçların karmaşıklığının, işletmeler için büyük bir engel oluşturduğunu aynı zamanda bu durumun araçların verimliliğini ve kullanım kolaylığını sınırladığını göstermiştir. İslami bankalar tarafından talep edilen teminat gerekliliklerinin MikroKOBİ'ler için pratik olmadığı ortaya konulmuştur. Sonuçlar, finansal araçların Şeriat standartlarına uygunluğunun yanı sıra etkili iletişim ve maliyet etkinliğinin, işletmeleri İslami finansman araçlarını benimsemeye teşvik eden başlıca motivasyonlar arasında olduğunu göstermiştir."
