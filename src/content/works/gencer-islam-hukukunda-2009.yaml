abstract: "?İslâm Hukukunda Delil Olma Yönüyle Örf ve Âdet? isimli tezimiz bir giriş ile üç bölümden meydana gelmektedir. Giriş bölümü araştırmanın amacı, yöntemi ve sınırlarından oluşmaktadır.Birinci bölümde İslâm hukukunda delil kavramı üzerinde durup asli deliller ile fer'i delilleri kısaca açıklamaya çalıştık.İkinci bölümde örf ve adet kelimelerinin anlamlarını verdikten sonra bu delilin kısımlarından bahsettik.Üçüncü bölümde ise örfün hüccet oluşuna Kur'an ve Sünnetten delilleri sıraladıktan sonra örf ve âdetin hüccet değeri kazanması için aranan şartları sıraladık. Ayrıca, hulefa-i raşidin kararlarında örfün etkisi ve mezheplerin örf ve âdet deliline bakışı ele alındı. Örfün değişmesiyle, örfe bağlı hükümlerinde değişmesi, hüküm veren kişilerin içinde yaşadıkları toplumun örf ve âdetlerini dikkate almaları gerektiğine de değindik.Anahtar kelimeler; örf, âdet, delil, İslâm hukuku, fukâha."
