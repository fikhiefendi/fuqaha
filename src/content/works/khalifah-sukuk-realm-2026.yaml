abstract: "Bu çalışma, makroekonomik koşullar ile Çevresel, Sosyal ve Yönetişim (ESG) faktörlerinin farklı piyasa rejimleri ve yargı alanları arasında Sukuk getirilerini nasıl etkilediğini ve paydaş beklentilerine rağmen ortalama düzeyde ESG etkilerinin neden zayıf kaldığını incelemektedir. Araştırma, heterojen kurumsal ve düzenleyici yapılara sahip ESG–Sukuk piyasalarında etik hedefler, paydaş talepleri ve fiyatlama sonuçları arasındaki boşluğu gidermeyi amaçlamaktadır. Çalışmada Açıklayıcı Veri Analizi (EDA), dinamik İki Yönlü Sabit Etkiler (TWFE) modelleri, Kantil Regresyonu ve Analitik Ağ Süreci (ANP) yöntemleri kullanılmaktadır. EDA veri özelliklerini incelemekte, TWFE ve Kantil Regresyonu normal ve aşırı piyasa koşullarında getiri belirleyicilerini ortaya koymakta, ANP ise paydaş temelli ESG önceliklerini ve ülkeler arası karşılıklı bağımlılıkları belirlemektedir. ESG etkileri ülkeler arasında farklılık göstermekte olup, özellikle enflasyon başta olmak üzere makroekonomik faktörler incelenen tüm ülkelerde ortalama Sukuk getirilerinin temel belirleyicisi konumundadır. Malezya ve Birleşik Krallık, daha güçlü düzenleyici çerçevelere ve şeffaf raporlama standartlarına sahip olmaları nedeniyle, özellikle yönetişim değişkenlerinde daha yüksek ESG duyarlılığı sergilemektedir. Buna karşılık, gelişmekte olan Sukuk piyasalarında kurumsal kısıtlar ve düzensiz uygulamalar nedeniyle fiyatlama etkileri daha zayıf ve parçalıdır. ESG değişkenleri normal koşullarda sınırlı etkiye sahipken, finansal stres dönemlerinde belirgin hale gelmekte ve çevresel, sosyal ve yönetişim unsurlarının aşırı rejimlerde seçici farklılaşma mekanizmaları olarak işlev gördüğünü göstermektedir. ANP bulgularına göre yönetişim tüm ülkelerde en yüksek paydaş önceliğine sahip olup, bunu sosyal ve çevresel boyutlar izlemekte; ağırlıklar ise piyasa gelişmişliği ve düzenleyici kapasiteye bağlı olarak şekillenmektedir. Paydaş, meşruiyet, sinyalleme ve İslami Etik Finans teorileri, ülkeler arasında ESG önceliklerini, kurumsal benimsemeyi, açıklama güvenilirliğini ve etik uygulamaları açıklamaktadır. Çalışma, ihraç sonrası ESG performansından ziyade fiyatlama davranışına ve paydaş çıkarlarına odaklanmakta ve ESG niteliklerinin finansal açıdan anlamlı sinyallere dönüşebilmesi için güçlü yönetişim yapıları, açık raporlama sistemleri ve etkin düzenleyici denetimin gerekli olduğunu vurgulamaktadır. Bulgular, Sukuk piyasalarında ESG'nin öneminin koşullu, rejime bağlı, ülkeye özgü ve yönetişim yapıları aracılığıyla şekillendiğini ortaya koyarak, İslami sürdürülebilir finans alanında ESG entegrasyonunun anlaşılmasına yönelik bütünleşik bir çerçeve sunmaktadır."
