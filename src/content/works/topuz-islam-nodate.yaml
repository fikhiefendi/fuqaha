abstract: "Mezarın yapısıyla alakalı şeklî kurallar ve cenaze defni ile ilgili hüküm ve uygulamalar fürû-i fıkıhta önemli bir yer tutmaktadır. Ayrıca günlük hayatta karşımıza yeni problemler de çıkabilmektedir. Bu problemlere uygun çözümler bulabilmek mezar ve definle ilgili hükümlerin değerlendirilmesi ile mümkündür. Temel kaynaklara, çağdaş araştırma ve fetvalara dayanarak yapılan bu çalışmanın amacı; mezar ve defin ile ilgili hükümlere işaret etmek, bu konuda toplumda yapılagelen yanlışlara dikkat çekmek ve güncel olarak meydana gelen meselelere çözüm yolu üretmektir. Ayrıca İslam hukuku ile Türk hukuku arasında benzerlik ve farklılıklara da işaret ederek bir mukayese imkânı sağlamaktır. Bu çalışma genel olarak mezarın iç/dış yapısı ve cenaze defninin yapılışı ile alakalı konuları kapsamaktadır. Ayrı bir araştırma konusu olabilecek mezarlıklar konusuna bu çalışmada girilmemiştir. Mezarın yönünün, uzunluğu kıbleye dik açı oluşturacak şekilde kazılması genel ve değişmez bir kuraldır. Ancak yaşanılan bölge, toprağın yapısı ve yırtıcı hayvan varlığı gibi bazı faktörler, mezarın derinliği ve kazılış şekli (lahd/şakk) noktasında farklı uygulamalara neden olmuştur. Vefat etmiş bir müslümanın naaşını toprağa gömmek diğer müslümanlar üzerine farz-ı kifâye bir görevdir. Defin konusunda sünnet olan uygulama bir mezara sadece bir defnin yapılmasıdır. Ancak savaş, salgın hastalık, doğal afet durumları gibi zaruri hallerde toplu defin yapılabilir. Defin işlemi tamamlandıktan sonra geçerli bir mazeret olmaksızın mezarın açılması ve ölünün mezardan çıkarılması caiz değildir. Mezarın yapısı ve defin uygulamalarında İslam hukuku ile Türk hukuku arasında genel anlamda uygunluğun olduğu anlaşılmıştır. Bununla birlikte iki doktrin arasında bazı farklılıklar da mevcuttur."
