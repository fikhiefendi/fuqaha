abstract: "Suçta manevî unsur, suç teşkil eden fiille fâil arasındaki zihinsel ve psikolojik bağı ifade etmektedir. Bu unsur, suçun oluşmasında aranan genel unsurlardan birisini teşkil etmekte ve fâilin cezaî sorumluluğunun meydana gelmesinde esas alınmaktadır. Suçun manevî unsuru, fâilin içsel yapısından kaynaklı olarak değişik şekillerde tezahür etmektedir. Bu durum da farklı türlerde suçların ortaya çıkmasına ve fâilin bu suçlardan dolayı cezaî sorumluluğunun derecelendirilmesinde göz önünde bulundurulmaktadır. Diğer ceza hukuku sistemlerinde olduğu gibi İslâm ceza hukukunda da suçun oluşumunda ve cezaî sorumluluğun belirlenmesinde suçta manevî unsurun varlığının tespiti önemli bir yer teşkil etmektedir. Bu nedenle bu tez çalışmasında, İslâm ceza hukukunda suçta manevî unsur başlığı altında, suçta manevî unsurun mahiyetinin açıklanması ve sınırlarının belirlenmesi üzerinde durulmuştur. Bunun için İslâm ceza hukukunda suçun manevî unsurunun analizi yapılarak incelenmeye çalışılmıştır. Bu konuda mukayese imkânı sağlanabilmesi için de zaman zaman Türk, Alman ve İngiliz ceza hukuku sistemlerine değinilmiştir. Bu tez çalışması, önsöz, giriş ve iki bölümden teşekkül etmektedir. Önsözde tezin konusu ve önemi; giriş bölümünde tezin gâyesi, sınırları ve tez çalışmasında izlenen usûl anlatılmıştır. Birinci bölümde, suç ve ceza hakkında genel bilgiler verilmiştir. Suç ve ceza kavramlarının başlığı altında suç kavramı ve suçun manevî unsuru dışındaki unsurları, ceza kavramı ve çeşitlerinden bahsedilmiştir. İkinci bölümde, İslâm ceza hukukunda suçta manevî unsurun niteliği ve kapsamı başlığı altında, suçta manevî unsur kavramı ve suçta manevî unsurun mahiyeti ile suçta manevî unsuru oluşturan öğeler üzerinde durulmuştur. Bölümler içerisinde işlenen konuyla ilgili bölüm sonlarında değerlendirme yapılmıştır. Sonuç olarak ise, belirtilen bölümlerin umûmî bir değerlendirmesi yapılarak ulaşılan sonuçlar belirtilmiştir."
