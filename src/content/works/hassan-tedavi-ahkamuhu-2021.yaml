abstract: "Bu çalışma، İslam hukuku açısından، haram nesnelerle tedavinin hükümleri ve bu konu çerçevesindeki ilkeleri konu edinmekte olup، bir giriş ve altı bölümden oluşmaktadır: Giriş bölümünde; çalışmanın konusu، önemi hakkında bilgi verildikten sonra başta tedavi kavramı olmak üzere konunun kavramsal çerçevesi tanıtılmıştır. Birinci bölümde sarhoşluk verici ve uyuşturucu nesnelerle tedavinin hükümleri üzerinde durulmuştur. İkinci bölümde etinin yenilmesi haram olan hayvanların etleri، hayvan bevilleri ve zehirler ile tedavinin hükümleri incelenmiştir. Üçüncü bölümde kıymetli madenler ve kumaşlarla tedavi üzerinde durulmuştur. Dördüncü bölümde sihir ve muska gibi yöntemlerle yapılan tedavilerin hükmü tespit edilmiştir. Beşinci bölümde doktor hatalarının tazmini ele alınmıştır. Son olarak altıncı bölümde tedavi çerçevesindeki değişik konular hakkında bilgi verilmiştir. Çalışmamız araştırmada ulaştığımız önemli neticeler ile bazı tekliflerimizle son bulmuştur."
