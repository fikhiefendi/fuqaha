abstract: "Bu tezde, bölgesel ve küresel faktörlerin GCC İslami ve geleneksel piyasa endeksleri üzerindeki etkisi incelenmektedir. Bu amaçla, Nisan 2011'den Nisan 2021'e kadar aylık veriler üzerinde kantil regresyonu uygulanmıştır. İlk makale, kantil regresyon yöntemi kullanılarak GCC ülkelerinde İslami ve geleneksel hisse senedi getirileri üzerinde bölgesel faktörlerin etkisini incelemektedir. Çalışma, piyasa getirilerinin bölgesel faktörlere olan tepkisinin GCC'nin hisse senedi getirilerinin dağılımı boyunca değiştiğini ortaya koymaktadır. Özellikle, bölgesel faktörlerin çoğu GCC piyasasında hisse senedi getirileri üzerinde asimetrik etkilere sahip olması, portföy çeşitlendirmesini zorlaştırmaktadır. İkinci makale, moment kantil regresyonu kullanarak GCC bölgesinde İslami ve geleneksel hisse senedi endekslerinin performansı üzerinde küresel risk faktörlerinin etkisini değerlendirmektedir. Sonuçlar, farklı risk faktörleri altında GCC piyasalarının performansının kantiller arasında asimetrik olarak değiştiğini, ancak GCC'deki İslami ve geleneksel piyasaların benzer bir getiri modeli izlediğini göstermektedir. Bulgular, GCC piyasalarına ilgi duyan yatırımcılar, özellikle Körfez tabanlı portföy varlık kompozisyonuna sahip olanlar için Şeria taramasının herhangi bir özel fayda sağlamadığını göstermektedir. Bu sonuçlar önemli yatırım ve politika sonuçlarına sahiptir."
