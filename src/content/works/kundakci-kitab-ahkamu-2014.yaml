abstract: "Merkezî Oğuz Türkçesine ait Kitab-ı Ahkamü'l-'Akayid adlı eserin (115b-180a) numaralı varakları üzerine yaptığımız bu yüksek lisans tezi; giriş, dilbilgisi incelemesi, çeviriyazılı metin, Türkiye Türkçesine aktarım, dizini alınmış sözlük ve tıpkıbasım bölümlerinden oluşmaktadır. Giriş kısmında eserin sahası ve bu sahaya ait bilgiler, nüsha bilgisi, eserin muhteva özellikleri ve eserin bölümlerine değinilmiştir. Dil incelemesi kısmında metnin yazım, ses bilgisi, yapı bilgisi ve söz varlığı özellikleri üzerine açıklamalar yapılmıştır. Metin kısmında metnin çeviriyazısı yapılmıştır. Türkiye Türkçesine aktarım kısmında metnin Türkiye Türkçesine aktarımı yapılmıştır. Dizini alınmış sözlük kısmında; kelimelerin köken bilgisi ve anlamları verilerek, ses gelişimi ve değişimine uğramış kelimeler, karşılaştırma yapmaya müsait biçimde verilmiştir."
