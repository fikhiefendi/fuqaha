abstract: "Âdem ve Havva'dan beri insanlık kurallar ve düzenin var olduğu bir nizam içinde yaşamaya başlamıştır. İnsanoğlu yalnızca güdü ve çevresel faktörlerin etkisi altında kalmamış aynı zamanda bilinç, akıl yürütme, sosyal yapılar ve kültürel etmenler tarafından şekillendirilmiştir. Söz konusu süreç insanın hem bireysel hem de toplumsal olarak daha karmaşık bir varlık haline gelmesine neden olmuştur. Toplumlar adâlet, ahlâk ve düzen gibi kavramlar etrafında şekillenen kuralları benimseyerek insan davranışlarını yönlendirmiş ve bir düzen oluşturmuştur. Mezkûr noktada Türkler kendi varlığını kadim gelenekleri, töreleri ve inanç sistemleri etrafında inşa etmişlerdir. Onlar adâlet, birlik ve düzen anlayışını, sosyal ve kültürel yapılarla pekiştirerek güçlü devletler kurmuşlardır. Töre, onların toplumsal düzenini sağlayan temel kurallar bütünü olarak hem bireylerin hem de devletin davranışlarını yönlendirmiştir. Bahse konu olan düzen yalnızca yönetici sınıfı değil tüm toplumu kapsayarak, adâletin ve toplumsal düzenin sağlanmasında önemli bir rol oynamıştır. Türkler, tarih boyunca bu ilkeler doğrultusunda hareket etmiş ve devlet nizamını kurarken hem içsel hem de dışsal etkenlerle başa çıkma kabiliyeti geliştirmiştir. Türkler, İslâm ile tanışarak kendi varlık anlayışlarını ve iktidar kavrayışlarını onun değerleriyle bütünleştirmiştir. Onlar İslâm'ı kabul ettikten sonra kozmik düzen anlayışlarını İslâm'ın tevhid inancıyla (Allah'ın birliği) birleştirerek iktidarı, Allah'ın iradesine dayanan bir yönetim anlayışı çerçevesinde yeniden tanımlamışlardır. Mezkûr süreç Türk devletlerinde hem dünyevî hem de manevî iktidarın bir arada yer aldığı adâlet, ahlak ve töreye dayalı bir düzenin inşasına yol açmıştır. İlk Müslüman Türk devletlerinde adliye teşkilatı, Sâmânîler, Karahanlılar ve Gazneliler döneminde önemli bir yapı taşı olarak ortaya çıkmıştır. Söz konusu devletlerde adâletin tesisi, sadece bireysel hakların korunması değil toplumsal düzenin sürdürülebilirliği için de merkezî bir öneme sahip olmuştur. Eski Türklerin töre anlayışı, İslâm hukukunun evrensel ilkeleri ile bütünleşerek güçlü bir adliye sistemi oluşturmuş, bu da Müslüman Türk devletlerinin uzun süre ayakta kalmasına katkı sağlamıştır."
