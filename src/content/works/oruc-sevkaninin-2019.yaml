abstract: "Ebû Abdullah Muhammed b. Ali b. Muhammed eş-Şevkânî es-San'ânî el-Yemenî, önemli Zeydî âlimlerden ders almış, kendini mutlak müctehid addeden bir âlimdir. Daha eğitim hayatı devam ederken fetva vermeye başlamış; bilinen bir müftü olmuştur. Otuz altı yaşındayken başkadılığa getirilmiş ve ömrünün sonuna kadar bu makamda kalarak devlet mekanizmasında etkin bir şekilde rol almıştır. Batılılaşma arayışı henüz kendi yaşadığı coğrafyaya girmemişken İslâm medeniyetine yönelik eleştiriler ortaya koymuştur. Tefsir, Hadis, Fıkıh ve Akâid'e dâir birçok eser telif eden Şevkânî, modern dönem İslâm dünyasında eserlerine en çok müracaat edilen isimlerden biridir. Görüşleri, kendisinden sonra birçok araştırmaya konu olmuş; Dünya'nın farklı yerlerinde hakkında onlarca yüksek lisans ve doktora tezi hazırlanmıştır. Fıkıh mezheplerine karşı çıkarak taklidi reddeden Şevkânî'nin, çalışmamızın temel kaynağı olan Neylü'l-evtâr isimli eseri, Mecdüddin İbn Teymiyye'nin el-Müntekâ adını vererek derlediği ahkâm hadislerinin şerhidir. Şevkânî bu eserde selef âlimlerden nakillerde bulunduğu gibi kendi görüşlerini de belirtmiştir. Onun görüşlerinin ve kendinden önceki fakihlere yönettiği eleştirilerin değerlendirilmesi amacını taşıyan bu çalışma iki bölümden oluşmaktadır. Birinci bölümde genel olarak Şevkânî'nin hayatı, eserleri ve modern döneme etkileri ele alınmıştır. İkinci bölümde ise alışveriş ve icâre konularına dair Şevkânî'nin görüşleri incelenmiştir. Söz konusu görüşler, tarafımızdan da değerlendirilmiştir. Konunun amacı, önemi ve yöntemiyle ilgili bilgilerin yer aldığı giriş kısmıyla çalışmaya başlanmış; ulaşılan neticelerin sunulduğu sonuç kısmıyla tamamlanmıştır."
