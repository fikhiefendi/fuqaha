abstract: "Hadis ilminde cerh ve ta'dil, bir rivayetin sübutunu ve sıhhatini belirlemede kilit role sahip olan râvinin güvenirliğini tespit etmek için teşekkül etmiştir. Tarihî bir olguyu haber veren sağlam rivayetlere ulaşma amacı ile oluşturulmuş olan isnad kontrol yönteminde, bazı lafızlar kullanılarak râviler derecelendirilmekte ve bu işlem sonunda ya râviler ta'dîl edilerek rivayetleri kabul edilmekte yahut da cerh edilerek naklettikleri haberler reddedilmektedir. Böylece râvilerin nakil yapabilme yeterliklerini inceleyen pek çok eser kaleme alınmak suretiyle rical edebiyatı oluşmuştur. Dördüncü asrın tanınmış münekkitlerinden olan İbn Hibbân el-Büstî de (ö. 354/965) râvileri tenkît eden eserler ortaya koymuştur. Kitâbü'l-Mecrûhîn isimli çalışmasında hadis rivayetine uygun olmayan râvilere yer vermekte, onların adalet ve zabtına dair kusurlarını izah etmektedir. Eserin en uzun tenkidini ise İmâm'ı-Âzam Ebû Hanîfe'ye yapmaktadır. Bu çalışmada Ebû Hanîfe'ye yöneltilen tenkitlerin tetkiki yapılmaktadır. Tez; giriş, iki bölüm ve sonuçtan meydana gelmektedir. Girişte bölümde İbn Hibbân'ın hadis ilmindeki yeri ele alınmıştır. Birinci bölümde Kitâbü'l-Mecrûhîn'de yer alan Ebû Hanîfe'ye dair aktarılan haberler senet yönünden değerlendirilmiştir. İkinci bölümde ise nakledilen haberler, metin açısından tetkikin yanısıra Ebû Hanîfe'nin hadis ilmindeki yeri ve İbn Hibbân tarafından aktarılan haberlere karşı diğer hadis ve rical âlimlerinin görüşlerine de yer verilerek bütüncül olarak değerlendirilmiştir."
