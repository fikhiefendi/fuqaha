abstract: "Modern dönem ile beraber fıkıh farklı meydan okumalara maruz kalmıştır. Yaşadığı bu tecrübenin bir yansıması olarak fıkıh tarihi seyrinde bir dönüşüm yaşanmıştır. Söz konusu bu dönüşümün bir parçası ise literatürde yeni ortaya çıkan bir üslup veya 'genre'dir. Bu üslup fıkıh geleneğinin kazuistik yapısından genel bir teori oluşturma çabası olarak ifade edilmiştir. Bu süreç XX. yüzyılın bir döneminde belirli İslâm hukukçusu tarafından ortaya konulan eserler yoluyla meydana gelmiştir. Bu tez temsil kabiliyeti yüksek modern dönem İslâm hukukçularının akit hürriyeti ve buna bağlı olarak satım akdinde takyidi şartlara yaklaşımlarını incelemektedir. Zira satım akdi ve takyidi şartlar gerek yeni ortaya çıkan bu üslup ve 'akit teorisi' bağlamında gerekse klasik mezheplerin düşünce yapılarında belirleyici bir konumdadır. Özellikle modern dönem içerisinde akitlerde 'irade özgürlüğü ilkesi' açısından takyidi şartlar İslâm hukukçularının üzerinde durdukları bir konudur. Nitekim takyidi şartların değerlendirilmesinde İslâm Hukukunun irade özgürlüğüne verdiği önem vurgulanmış ve diğer hukuki sistemlerle mukayeseli bir şekilde ortaya konulmuştur. Söz konusu bu konunun ana eksenini ise mezheplerin görüşleri oluşturmaktadır. Modern dönem İslâm hukukçuları konuyu değerlendirirken hem mezhepler arası hem de İslâm Hukuku ile modern hukuki sistemler arasında karşılaştırmalı bir yöntem izlemişlerdir. İslâm hukukçuları mezheplerin görüşlerini serdederken çağdaş problemlerine yönelik çözüm arayışları içerisinde olmuşlardır. Bu arayışların bir neticesi olarak farklı yaklaşımlar sergilemişlerdir. Söz konusu bu arayışlar bu tez içerisinde değerlendirilip aktarılmaya çalışılmıştır."
