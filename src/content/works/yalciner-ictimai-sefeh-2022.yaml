abstract: "Kapitalizm sisteminin ayakta durabilmesi, üretim-tüketim döngüsünün devamlılığına bağlıdır. Döngünün bozulmaması için sistem; kitle iletişim araçları, reklam, moda, alışveriş merkezi gibi vesileleri kullanarak ihtiyaç kavramının mahiyetinin değişmesine ve birçok yapay ihtiyacın ortaya çıkmasına sebep olmuştur. İnsanlar, yeni ihtiyaçlarını tatmin için daha çok tüketime yönelmiş, savurganlık kategorisinde değerlendirilebilecek hedonik, sembolik ve gösterişçi tüketim çeşitleri normalleşmiş ve tüketim kültürü, toplumlara hâkim hale gelmiştir. Bu kültür, tüketim toplumunun oluşmasına ve savurganlığın artık toplumların bir vasfı haline gelmesine sebep olmuştur. İslâm Hukuku'nda tercih edilen görüşe göre,“sefîh”olarak ifade edilen savurgan kimsenin malî tasarruflarına, malını tebzîr ile yok etmesinin ve savurganlığı sebebiyle kendisinin, bakmakla yükümlü olduğu bireylerin ve toplumun maruz kalabileceği zararların önüne geçmek amacıyla hacr konulur. Mümeyyiz çocuk gibi yararına olan tasarrufları geçerli, zararına olan tasarrufları geçersiz sayılır, yarar ve zarara ihtimali olan tasarrufları ise velisinin iznine bağlıdır. Günümüz Türk Medeni Kanunu'nda da benzer şekilde savurganlar, kısıtlılık altına alınırlar. Sefîhe uygulanan yaptırımların amaçları ve savurganlığın yıkıcı sonuçları göz önünde bulundurulduğunda bu yaptırımların benzerlerinin, dakik incelemeler ile hukukun yetki alanına riayet edilip bireylerin hak gasbına sebep olunmaması şartıyla,“sefîh toplumlara”da uygulanabileceği söylenebilir."
