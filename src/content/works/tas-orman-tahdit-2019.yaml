abstract: "4721 sayılı Türk Medeni Kanunu'nun (TMK) 1007. maddesinde, tapu sicilinin hatalı tutulması durumunda, Devletin sorumluluğunun doğacağı hususu açıkça düzenlenmiştir. Devletin, tapu sicilinin tutulması açısından tek yetkili olması, tapu sicilindeki kayıtları düzgün tutmakla yükümlü olmasını ve yolsuz bir kayıt tutulduğunda, bundan dolayı ortaya çıkan zararlardan sorumlu olmasını gerektirmektedir. Tapu kayıtlarının yolsuz sayılmasının kabul edildiği durumlardan biri de, orman ve genel arazi kadastro çalışmalarının uyumlu bir şekilde tamamlanmaması neticesinde, tapu kayıtlarının orman tahdit sınırları içerisinde bırakılmasıdır. Ancak,“kamu yararı”ilkesi kapsamında tapu kayıtlarının orman tahdit sınırları içerisinde kalması sonucu yolsuz kabul edilerek kısıtlanması veya iptal edilmesi, hatalı kadastro çalışmaları ile ortaya çıkan bir durum olduğundan ve kadastro işlemleri uzun yıllar boyunca tapu sicili çerçevesinde değerlendirilmediğinden, tapu kayıtlarının orman tahdit sınırları içerisinde kalması, TMK'nun 1007. maddesinde ifade edilen tapu sicilinin hatalı tutulması kapsamında değerlendirilmemiştir. Ülkemizde, birbiriyle uyumlu olarak yürütülememiş orman ve arazi kadastro çalışmaları, birçok taşınmaz malikinin tapu kayıtlarının hükümsüz sayılmasına neden olmasına rağmen karşılığı ödenmediği gibi tazminat talepleri de mahkemelerce kabul edilmemiştir. Mülkiyet hakkı ihlal edilenlerin yaptığı başvurulara ilişkin Avrupa İnsan Hakları Mahkemesi'nin (AİHM) vermiş olduğu ihlal kararları neticesinde, Yargıtay Hukuk Genel Kurulu, (T. 18.11.2009, E. 2009/4-383, K. 2009/517) 2009 tarihli kararı ile görüş değişikliğine giderek, tapu kayıtlarının orman tahdit sınırları içerisinde kalması nedeniyle ortaya çıkan mülkiyet hakkı ihlallerinde, mülkiyet hakkı sahiplerine tazminat ödenmesi gerektiğine hükmederek, üzerinde çalışılması gereken yeni bir hukuki durumun önü açılmıştır. Yukarıda belirtilen süreçten sonra, iç hukukta daha sık karşılaşılmasına rağmen, doktrin ile Yüksek yargı kararları arasında bir çok hususta farklı görüşler ortaya çıktığından, (henüz) net bir şekilde sınırları çizilememiş olan bir alan olduğunu düşündüğümden, üzerinde çalışılması gerektiğine karar verdiğim bu çalışmamı dört bölüm halinde tamamladım. İlk bölümde, mülkiyet hakkı ihlaline neden olan durumun temelindeki idari işlemler olarak Orman ve Arazi Kadastrosu; ikinci bölümde kadastrodan sonraki aşama olarak tapu sicili hususu; üçüncü bölümde devletin sorumluluğunun hukuki niteliği ve dördüncü bölümde ise devletin sorumluluğunun sonuçları, doktrin, Yargıtay, AYM ve AİHM görüşleri dikkate alınarak değerlendirilmiş ve kanaatimiz paylaşılmıştır."
