abstract: "Kavramsal çerçevesi 1970' lere dayanan sürdürülebilirlik anlayışı, bu alanda çalışmalar başlatan uluslararası girişimlerle, dünya genelinde farkındalık kazanmaya başlamıştır. Gün geçtikçe daha büyük kitlelere ulaşan bu anlayışla, İslami finans ilkeleri bir araya getirilerek, daha adil, uzun vadeli ve ekolojik hedeflere uygun, ekonomik büyümeyi destekleyen bir finansal model oluşturma potansiyeline sahiptir. Dünyada kabul görmüş modern ekonomik sistemlere göre karşılaştırmalı üstünlüğe sahip olan ve mevcut durumu düzeltmesi beklenen İslami finansın, detaylı teorik ve nicel incelemeleri yapılarak bu alandaki gelişim ihtiyacı olan konulara farkındalık yaratılabilir. Zira, sürdürülebilir kalkınmanın bireysel, sosyal, çevresel ve ekonomik çıkarları dengeleyen İslami kuralların takip edilmesiyle sağlanabileceği düşünülmektedir. Bu bağlamda, yaşamın hem maddi hem de manevi çıkarları arasında itidal unsurları ile sürdürülebilir kalkınma sürecinin, İslami ilkelere tam olarak bağlı kalması güçlü bir şekilde önerilmektedir."
