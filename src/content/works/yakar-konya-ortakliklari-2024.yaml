abstract: "1550-1800 yılları arasında Konya'daki iş ortaklıklarını inceleyen bu çalışma, ortaklıkların ekonomik yapıya etkilerini ve ticaret hayatındaki önemini araştırmaktadır. Ayrıca İslam hukuku çerçevesinde teorik esasların pratikteki gelişimi ve ortaklıkların yapısal özellikleri de ele alınmıştır. İslam'ın faiz yasağına alternatif olarak kullanılan ve faizsiz finans araçlarından biri olan İslami ortaklıklar, yerel ölçekteki pratiklerle desteklenerek somut örnekler üzerinden detaylı bir şekilde analiz edilmiştir. Elde edilen veriler, sermaye temini ve kaynakların verimli kullanımında iş ortaklıklarının merkezi bir rol oynadığını ortaya koymaktadır. Sermaye ve emek unsurlarına dayanan bu ortaklıklar, özellikle sermaye ve iş gücü eksikliklerini gidermek amacıyla yaygın olarak tercih edilmiştir. Ortaklıklar sayesinde farklı kaynaklar etkin bir biçimde bir araya getirilmiş ve ticari faaliyetlerdeki verimlilik artırılmıştır. Osmanlı döneminde önemli bir ticaret merkezi olan Konya, coğrafi olarak ana ticaret yolları üzerinde bulunmasıyla iş ortaklıklarını sadece yerel değil aynı zamanda bölgesel ve uluslararası ticaretin bir aracı haline getirmiştir. İş ortaklıkları, şehirdeki üretim ve ticaret hayatının önemli bir parçası olmuştur. Çeşitli sektörlerde faaliyet gösteren bu ortaklıklar, farklı büyüklükteki sermayelerle yürütülmüştür. Ortaklık türleri ve faaliyet süreleri, girişimcilerin ihtiyaçlarına ve ticaretin gereksinimlerine göre şekillenmiş, bu durum ekonomik ilişkilerdeki esnekliği de artırmıştır. Klasik dönemden modern döneme kadar devam eden bu ortaklıklar, yapısal olarak ciddi bir değişim göstermemiş ve durağan bir biçimde işleyişini sürdürmüştür. Ortaklıkların teorik çerçevesi ile pratikteki yansımaları büyük oranda uyum içindedir. Konya'daki ortaklıklar, Osmanlı ortaklık (şirket) kültürü kapsamında, farklı coğrafyalardaki örneklerle kıyaslandığında önemli benzerlikler taşımaktadır. Mevcut farklar ise şehirlerin veya bölgelerin sahip olduğu iç dinamikler ve yerel koşullardan kaynaklanmaktadır."
