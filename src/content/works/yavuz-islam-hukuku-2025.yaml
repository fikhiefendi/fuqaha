abstract: "Bu çalışma, İslam hukukunda maslahat ve tarihsellik kavramlarını, özellikle Necmeddin et-Tûfî ve Fazlurrahman'ın düşünce sistemleri çerçevesinde incelemeyi amaçlamaktadır. İslam toplumlarında fıkıh hukukunun zamanla statikleştiği ve toplumsal değişime uyum sağlamakta zorlandığı iddiası, bu çalışmanın temel arka planını oluşturmaktadır. Çalışma, maslahat ve tarihsellik düşüncelerinin, İslam hukukunun dinamizmini yeniden kazanmak ve çağın gereklerine uygun çözümler üretmek için geliştirilmiş teoriler olduğunu savunmaktadır. Araştırma, maslahat ilkesinin ve tarihsellik anlayışının İslam hukukundaki yerini, teorik temel ve tarihsel gelişim bağlamında ele alırken, bu kavramların İslam hukukunun esnekliğine nasıl katkı sağladığını değerlendirmektedir. Tûfî'nin maslahat anlayışı ile Fazlurrahman'ın tarihsellik yaklaşımının, İslam hukukunun toplumsal koşullara uyum sağlama kapasitesine nasıl etki ettiğine dair çözüm önerileri tartışılmaktadır. Çalışmada, bu iki düşünürün görüşleri karşılaştırılarak, İslam hukukunun günümüz toplumlarının ihtiyaçlarına nasıl daha uygun hale getirilebileceği değerlendirilmektedir. Araştırmanın temel amacı, İslam hukukunun gelişiminde maslahat ve tarihsellik kavramlarının teorik ve pratik boyutlarını incelemek, bu düşüncelerin toplumdaki geri kalmışlık algısına ne gibi çözüm önerileri sunduğunu ortaya koymaktır. Çalışma ayrıca, bu iki düşüncenin modern İslam düşüncesine katkılarını inceleyerek, İslam hukukunun dinamik ve değişen toplumsal koşullara uyum sağlama potansiyelini tartışmaktadır."
