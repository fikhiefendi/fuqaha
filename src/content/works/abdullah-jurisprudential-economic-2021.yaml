abstract: "İran'da faizsiz bankacılık işlemleri ve buna dayalı bankacılık sistemini uygulama yasasının onaylanmasının üzerinden yaklaşık 36 yıl geçmiştir. Anılan sistemin tasarlanmasından güdülen hedef ise İran bankacılık sisteminden faizin uzak tutulması idi. Ancak bu hedef pratik olarak ne denli hayata geçirilmiştir? İşte bu araştırmada İran'da faizsiz bankacılık sisteminde, bankacılık işlemlerinin şeklen, görünüşte faizden temizlenmesine rağmen gerçekte faizin kötü tesirinden ve kurduğu sultadan kurtulamadığını göstermeye çalışmaktayız. Bu etkilerin en önemlileri arasında kaynakları donatma alanında ödenen garantili (peşin) ('Ale'l-hesap) kâra değinmek mümkün. Bu kâr türü pratik güvenceler ile garanti kârına dönüşür ve tam faiz gibi bir rol oynar. Bu tezde araştırma mdetodolojisi olarak fıkhî ve ekonomik analizler ile beraber betimleyici araştırma yöntemi kullanılmıştır. Ayrıca verilerin toplanması için veri tabanları ve kütüphane kaynaklarına başvurulmuştur. Mevcut araştırmada garantili (peşin) kârın incelenip eleştirilmesinin yanı sıra 1990-2018 yılları arası bankaların mevduatlarındaki garantili (peşin) kâr ve kesin kâr arasındaki farkları ayrıca 2001-2014 yılları arası Merkez Bankası şirket tahvili garantili (peşin) kârı incelenmiştir. Sonuçlar ise bu iki kâr türü rakamları arasındaki farkın çoğu yıllarda sıfır kadar olduğunu ve minimum kesin olmayan kâr oranının mevduat döneminin sonunda kesin kâr oranı olarak telakki edildiğini göstermektedir. Halbuki faizsiz bankacılığın en önemli temeli kâr ve zararda ortaklık yapmaktır. Bu yüzden banka mevduatları ve şirket tahvillerinde minimum garanti (peşin) kârın ödenmesi hususunda belli başlı kuşkular söz konusudur. Buna rağmen mevcut araştırmanın asıl odaklandığı konu garantili (peşin) kâr ve bu süreç ile mücadeledeki çözüm yollarıdır."
