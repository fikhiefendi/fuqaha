abstract: "Tahkikini yaptığımız bu çalışma, hadis ilmi ile fıkıh ilmi arasında bir saha olan ahkâm hadislerine dairdir. İlim tarihimizin meşhur simalarından Kadı'l-Kudât Bedreddîn b. Cemâa'ya (ö. 733/1333) ait olan eserin ihtiva ettiği hadisler, Buhârî ve Müslim'in sahihlerinden veya en azından birinden seçilmiştir. Müellif, konu başlıkları itibariyle ana çerçeve olarak Şafiî mezhebinin temel kaynaklarından Ebu İshak eş-Şîrâzî'nin et-Tenbîh'ini esas almıştır. Çalışmamız, İbn Cemâa zamanında yazılmış olan iki nüshaya dayanmaktadır. Bu nüshalar, Süleymaniye Kütüphanesi ve Princeton Üniversitesi Kütüphanesi'nde mevcuttur. Süleymaniye Kütüphanesi nüshasının tahkikteki işareti س, Princeton Kütüphanesininki ise ب olarak gösterilmiştir. Çalışmamız, önsöz, giriş ve üç ana bölümden oluşmaktadır. Önsözde eseri tahkik etmekteki gayemize ve çalışma hakkındaki önemli noktalara dikkat çekilmiştir. Girişte İbn Cemâa'nın hayatı ve eserleri tetkik edilmiş, sonuçta onun kadılık, müderrislik ve hatiplik görevleri yanında İslamî ilimlere ait hemen her alanda eser yazdığı ve tabii olarak pek çok talebe yetiştirdiği gösterilmiştir. Birinci bölümde ahkâm hadisleriyle alakalı çalışmalar hakkında ana hatlarıyla bilgi verilmiş ve İbn Cemâa'nın eserinin metodu ve diğer ahkâm hadislerine dair yapılan çalışmalar içerisindeki konumu mukayeseli bir şekilde ele alınmıştır. İkinci bölümde ise gerek tahkikte gerekse hadislerin tahricinde takip edilen metot ortaya konulmuştur. Ayrıca eserin, İbn Cemâa'ya nispetinin sihhati üzerinde durulmuş, müellife aidiyeti tespit edilmiştir. Diğer taraftan yazma nüshaların tanıtımı ile nüshaların bazı kesitlerinin resimleri ikinci bölüme eklenmiştir. Üçüncü bölümde ise eserin gövdesini oluşturan 15 ana konu ve 769 hadisten meydana gelen metinin tahkiki yer almaktadır. Burada yöntem olarak İslam Araştırmaları Merkezi (İSAM)'nin belirlemiş olduğu tahkik metodunu takip etmiş bulunmaktayız. Çalışmamız âyet, hadis, şahıs indeksleri ve bibliyografya ile sona ermektedir."
