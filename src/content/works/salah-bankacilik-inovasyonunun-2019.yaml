abstract: "Bu çalışma kavramını tanımlamak amaçlanmıştır arasında yenilik ve Msahtmh gelişme içinde İslami finans ürünleri ve hiç nedenlerini belirlemek için de Zmor yenilik İslami finans endüstrisi, gerçeği öğrenmek ait yeniliğin İslami Finansal Kurumlar. Bu makalede elektronik bankacılık alanındaki finansal inovasyon disiplinlerini ve İslami finans kurumlarında finansal inovasyon başarısı elde etme mekanizmalarını vurguladı. Konuyla ilgilenen bir dizi bilimsel metodolojiyi , indüktif yöntem yöntemiyle takip etmiştir: bu, araştırma probleminin özelliklerini ve farklı yönlerin teşhisini tanımlamak için gerekli verileri toplamak için araştırma probleminin gerçekliğini tahmin etmeyi amaçlamaktadır: Araştırma konusuyla ilgili gerekli verileri, çeşitli kaynaklar aracılığıyla toplayın; bunların en önemlileri , araştırma konusuyla ilgili önceki çalışmaların ve masa başı bilgilerinin araştırılmasıdır. Ve özel referanslar. Sayesinde kullanım ait tümdengelim yaklaşımı eduction sonuçlarını ve tavsiyelerini çizmek için çalışma ve teklif edilen politikaları içinde bağlantı ile ilgili kurumsal zihinsel akıl yürütme yoluyla araştırma problemi sonuçlarının ait tanı çalışmalarında gelmiş kullanılmıştır endüktif parça. Çalışma bir dizi tavsiyeyle sonuçlandı."
