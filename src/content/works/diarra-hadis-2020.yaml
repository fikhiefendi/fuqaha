abstract: "Fıkıh, Fıkıh Usûlü ve Hadis uleması delillerini Kur'an-ı Kerim'den ve Hz. Peygamber'in sünnetinden almaya, sonra da içtihatlarını bu ikisi üzerine b.a etmeye özen göstermiştir. Haklarında sarih (açık-net) nas bulamadıkları hususlarda hüküm istihrâc etmekte (çıkarsama yapmakta), haberleri (hadisleri) iyice araştırıp ve fikir ürettikten sonra da bunlardan muhtemel olanları seçmişlerdir. Tezat teşkil eden hususların çözümü, muhtelif (farklı) olanların tercih edilmesi, müşkül olanların açığa kavuşturulması ve mücmel olanların da tefsir edilmesinde (yorumlanması-açıklanmasında) büyük bir gaye üstlenmişlerdir. Ancak gaye birliğine rağmen birçok meselede ve haberle (hadisle) alakalı hükümlerde ihtilaf etmişlerdir. Birçok âlim hadisi sahih veya zayıf kabul etmede kendi özel şartlarını benimsemelerinden dolayı Hadis ulemasının bazı sıhhat şartlarında ihtilaf etmiştir. Ancak bazı ulemayı kendi özel şartlarına göre zayıf hadisle amel etmeye cevaz verdiklerini görmekteyiz. Dolayısıyla hadisle amel etmede Hadis'in sahih olmasını şart koşup koşmadıkları konusunda ikileme düşmüş bulunmaktadır. Sonuçta bu ihtilaf muhaliflik iddiası gütmeksizin gerekli ve doğal bir durum olup bu âlimlerin her birisinin doğru bilgiyi aramakta, aralarındaki ihtilafın da ırkçılık, ego tatmini ve büyüklenme değil ellerindeki deliller sebebiyle olduğu bilinmektedir."
