abstract: "Bireylerin tek başına yapamayacakları işleri şirketler gerçekleştirir. Hukukçular ilk devirlerden itibaren bu şirketlerin hukuki statüsünü tespit etmeye çalışmıştır. İslâm hukukçuları da bu konuda oldukça hassas davranmıştır. Onların bu çabası İslâm hukukunun klasik kaynakları incelendiğinde hemen göze çarpar. Bu çalışmada, sanatkârların kendi emeklerini esas alarak kurdukları bir şirket olan emek şirketi, kuruluşundan tasfiyesine kadar etraflıca ele alınmıştır. İlk bölümlerde konuyu temellendirme ve genel şirketler içindeki yerini tespit amacıyla şirketler hakkında genel bilgi verilmiş, neticede emek şirketinin akit(sözleşme) şirketinin bir çeşidi olduğu görülmüştür. Konular işlenirken, kurulması daha kolay olması sebebiyle inan şirketi esaslarına göre kurulan emek şirketi esas alınmış olup, mufavada esaslarına göre kurulan emek şirketine de yeri geldikçe temas edilmiştir. Hukuki ilişkiler ve tasfiyesine dair bölümlerde, bütün akit şirketlerinde yer alan genel hükümler yanında, emek şirketine ait özellikler de belirtilmiştir. Neticede diğer inan şirketlerinden farklı olarak ortakların her biri iş sahibine karşı yapmayı taahhüt ettikleri işin yapılmasından sorumlu oldukları gibi ücreti istemeye de yetkilidirler. Araştırmada Hanefilerin görüşü esas alınmakla beraber diğer hukuk ekoUerinin de görüşlerine yer verilmiş olup, zaman zaman bu ekoller arasında karşılaştırmalar yapılmıştır. Bu çalışmayla, emek şirketinin tarihteki uygulanış biçiminin gün ışığına çıkarılması amaçlanmıştır."
