abstract: "Bu çalışmanın amacı، Araştırma, İslami bankalardaki Finans sözleşmelerinin kontrollerine ışık tutmayı hedefliyor. Ayrıca Şeriat'ın denetimi ile ilgili terimlerin açıklığa kavuşturulması ve İslami bankaların Şeriat'ın kontrolleri ile işlemlerinde taahhüdünün yer aldığı İslami bankaların finansal işlemlerle ilgili hükümlerine uygulanması yoluyla köklü hale getirilmesi amaçlanmaktadır. müşterileri arasında şeffaflığı ve güvenilirliği sağlamanın güçlü bir göstergesi. Araştırma ayrıca, Şeriat'ın denetiminin bileşenlerinin ifadesine ışık tutuyor. Bu araştırmada, Suudi bankalarındaki Şeriat kontrollerinin İslami finans sözleşmelerindeki uygulamalarını da açıklamaya çalıştım. Bu sansür konusunu ele alan birçok çalışmaya referans alarak araştırma konusu ile ilgili kavramları ve unsurları takip ederek endüktif yöntemi takip ettim ve daha sonra İslami bankalardaki finansman sözleşmelerinde şeriat denetiminde en önemli kontrollerden bahsetmek için tanımlayıcı tanımlayıcı bir yöntem kullandım. sahiplerinin görüş ve sözlerinin atıfta bulunduğu modern gelişmelerin ışığı ve labirentlerinin konsept ve önerileri. Araştırma bir dizi sonuç ve öneriyle sona eriyor."
