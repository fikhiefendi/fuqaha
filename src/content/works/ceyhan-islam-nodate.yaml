abstract: "İslâm ceza hukukunda eşitlik konusunun işlendiği bu çalışma, eşitlik ve adalet ilişkisini kişiler açısından irdelemiştir. Bu tezin başlığı olan \"İslâm Ceza Hukukunda Eşitlik\" konusu aynı suçu işleyen farklı şahıslara, kişisel özellikleri ve toplumsal statüleri itibarıyla farklı cezalar verilebilmesini merkeze almıştır. Suçluya verilecek cezanın suçun ağırlığı ile orantılı olmasına odaklanan suç ve ceza denkliği ana konu değildir. Temelde İslâm, yaratılış bakımından insanları eşit görmüş, sınıf farklılıklarını ortadan kaldırmayı ilke edinmiştir. Prensip olarak cezaların uygulanacağı kişiler arasında da imtiyazlı grup kabul edilmemiştir. Fakat bu durum, işlediği suçun etkisi ve toplumsal sonuçları bakımından herkesin aynı olduğu anlamına da gelmemiştir. Bu tezde, suçu işleyen failin durumuna göre, cezanın değişmesinin eşitlik ile bağdaşmasa da adalet ile uyumlu olduğu ortaya konulmaya çalışılmıştır. Adaletin tesis edilmesinde eşitlik önemli bir unsur olsa da bununla çoğu zaman mutlak ve şematik bir eşitlik değil her açıdan aynı olanlara eşit davranılmasını öngören nispi eşitlik kast edilmiştir. Bu çalışma, İslâm hukukunda adalet ve kamu yararı için durum ve şartlara göre bazı ayrımların meşru sayıldığını, haklı bir nedene dayalı olması gereken ayrım kriterlerinin ise, İslâm ceza hukukunda genel olarak din, cinsiyet ve hürriyet farkına göre belirlendiğini göstermiştir. Bu etkenlerin kısas, diyet ve had cezalarına yansımaları, İslâm hukuk literatürü incelenerek çeşitli örnekler ve delilleriyle ele alınmıştır."
