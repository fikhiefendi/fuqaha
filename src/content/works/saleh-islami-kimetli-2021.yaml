abstract: "Araştırmamız İslam hukukunun finansal hedeflerini ve İslami menkul kıymetler piyasalarının bu hedefleri gerçekleştirme kabiliyetini; ayrıca İslami menkul kıymetler piyasalarında mümkün olan en yüksek ekonomik verimlilik düzeyine ulaşabilmek için ele alınması gereken hususları açıklamayı hedeflemektedir. Çalışmamızda, alimlerin konu ile ilgili görüşleri, bu husustaki delillerinin toplanması ve sonucunda İslam hukukunun gerçekleştirmeye çalıştığı finansal hedeflere ulaşılması suretiyle, İslam hukukunun finansal hedeflerinin belirlenmesi noktasında tümevarım yaklaşımı uygulanmıştır. Öte yandan araştırmamız, finansal piyasaların varlığının gerekçeleri ve bu piyasalara yöneltilen temel eleştirileri de ortaya koymuş; akabinde bir yandan bu gerekçe ve eleştiriler arasındaki ilişki boyutunu ve diğer yandan bunların İslam hukukunun finansal hedefleri ile ilişkisini tartışmıştır. Çalışmamızın vardığı en önemli sonuçlar, İslami menkul kıymetler piyasalarında İslam hukukunun finansal hedeflerinin ihlaline neden olan birçok sorun olduğunu ortaya koymuştur. Bunun ışığında çalışmamız bu eksiklikleri gidermek için bir dizi öneri sunmaktadır. Bu önerilerin en öne çıkanları arasında, menkul kıymetler piyasalarında ortaya çıkan sorunlu noktaların birçoğu ile ilişkili olması nedeniyle fiyat farklılıkları üzerine spekülasyon olgusunu sona erdirmek için etkili mekanizmalar bulunması gerektiği yer almıştır. Öte yandan çalışmamız İslami menkul kıymetler piyasalarında ekonomik sektörlerin paylarındaki dengesizliği, ümmetin önceliklerini dikkate alacak şekilde gidermek için mekanizmalar geliştirilmesi gerektiğini de önermiştir. Ayrıca nominal değer ve defter değerleri arasındaki büyük fark sorununa çözüm getirilerek, birden fazla değer olgusunu ortadan kaldırma ihtiyacının söz konusu olduğu tespit edilmiştir."
