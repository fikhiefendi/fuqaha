abstract: "Sahâbe devrinden beri varlığını sürdüren Ehl-i Reʾy – Ehl-i Hadîs ayrışması, İslâmî ilimler tarihinde polemik türü eserlerin yazılmasına zemin hazırlayan sebeplerden biridir. Hadislere, diğer fıkıh mezhepleri gibi, amele konu olması bakımından yaklaşan Hanefîler hadis/sünnet tespit metotlarına ilişkin bahisleri müstakil hadis usulü eserleri yerine fıkıh usulü kitaplarının“Sünnet”bahislerinde işlemişlerdir. Modern dönemde Selefî düşüncenin yeniden canlanmasıyla mezheplerin Kur'ân ve Sünnet ile irtibatı tekrar tartışılmaya başlanmış, bu bağlamda Selefî düşünce, mezheplerin çoğu hükmünün nasslarla çeliştiğini iddia ederek Müslümanları doğrudan“Kur'ân ve Sünnet”e dönmeye çağırmıştır. Bu çağrı itikadda Mâtürîdî ve Eşʿarî mezheplerini, fıkıhta ise özellikle Hanefî mezhebini hedef almıştır. Bu mezhep karşıtı tutum karşısında Hanefîler, mezhebin hadis/sünnete yaklaşımlarını göstermek için müstakil usul eserleri yazma ihtiyacı hissetmişlerdir. Bu bağlamda, 20. yüzyıl Hint alt kıtası Hanefî âlimlerinden Zafer Ahmed et-Tânevî'nin kaleme aldığı Kavâʿid fî ʿulûmi'l-hadîs, Hanefî hadis/sünnet usulüne ilişkin literatürün ilk örneklerinden sayılabilir. Eser, bu rolü sebebiyle ilgiye mazhar olduğu gibi Selefî âlimlerin eleştirilerine de hedef olmuştur. Eser üzerine yazılan tek müstakil eser, yine Hint alt kıtasından Selefî-meşrep bir âlim olan Bedîüddîn es-Sindî'nin yazdığı Nakzu Kavâʿid fî ʿulûmi'l-hadîs başlıklı reddiyedir. Bu araştırma, es-Sindî'nin Nakz'ında et-Tânevî'ye yönelttiği eleştirileri konu edinmekte, Hanefîlerin hadis/sünnet tespit metoduna dair ilk müstakil metnin ne gibi eleştirilere muhatap olduğunu ortaya koymaktadır. Araştırma kapsamında eleştirilerin sahibi olan ve Türkçe literatürde hayatı ve fikirlerine dair herhangi bir bilgi bulunmayan Bedîüddîn es-Sindî tanıtılmış, eleştirileri değerlendirilmiş ve bu değerlendirme onun ilmî mevkii ve metodolojisi hakkında bir ölçüde fikir sahibi olunmasına da olanak sağlamıştır. es-Sindî'nin eleştirilerinden hareketle, onun Zâhirîliğe yakın olduğu, geniş bilgisine rağmen bu bilgiyi sistematik bir şekilde işleyemediği ve getirdiği eleştirilerin muhatabını ilzam etme noktasında çoğunlukla yetersiz kaldığı sonucuna varılmıştır. Bu nedenle es-Sindî-Tânevî tartışmasının, aynı dönemde Gumârî-Kevserî ve Muʿallimî-Kevserî arasında yaşanmış diğer Ehl-i Reʾy – Ehl-i Hadîs polemiklerine nazaran daha az nitelikli olduğu söylenebilir."
