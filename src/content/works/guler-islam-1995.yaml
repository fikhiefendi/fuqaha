abstract: "SONUÇ VE ÖZET Bu araştırmamızda, İslâm İdare Hukuku'nun Ortaya Çıkışı'nı, Hz. Peygamber ve Râşid Halîfeler dönemlerindeki uygulamaları ele alarak inceledik. Diğer müesseselerde olduğu gibi, İslâm İdare Hukuku da, gerek nazariyatı gerekse uygulaması açısından tedricî olarak ortaya çıkmıştır. Bu bakımdan araştırmamızda, kavramdan müesseseye doğru kronolojik bir metod izlenmiştir. Bu metod, İslâm Idâre Hukuku 'nu iki safhada incelemeyi gerekli kılmıştır. Bu safhalar, Mekke ve Medine dönemleridir. Mekke dönemi, İslâm İdare Hukuku ile ilgili kavramların ortaya çıktığı ve İslâm İdare Hukuku 'nun hazırlığının teşkîl edildiği safhadır. Medîne dönemi ise, İslâm îdâre Hukuku ile ilgili kavramların tamamlandığı, kaidelerin ortaya çıktığı ve İslâm İdare Hukuku konularının tekevvün ettiği safha olmaktadır. Bu şekilde, İslâm'da idarenin tanzîm edilişi belirlenmiş ve İslâm İdare Hukuku da, kamu velayetinin hukukî bir müessesesi olarak ortaya çıkmıştır. İşte Tez çalışmamızda, Bölümler içinde dağılmış olarak ortaya çıkarılan İslâm İdare Hukuku'nu, bu Sonuç bölümünde, toparlayıp özetlemenin, İslâm İdare Hukuku hakkında bütünlük içinde bir fikir edinilebilmesi açısından faydalı olacağını düşündük. Şimdi bu özeti, aşağıda belirlenen başlıklar altında sunmaya çalışalım: A. İSLÂM IDÂRE HUKUKU'NUN KONUSU VE TARİFİ İslâm İdare Hukuku'nun konusu, İslâm toplumda bireylere yüklenen görevler, İslâm Hukuku tabirleriyle, yükümlülerin fiillerine müteallik iktidâ', tahyîr ve vad' şeklindeki Şâri'e ait hitâb içinde, bireylerin tek başına karşılayamadıkları ve birey kuvveti üstünde bir kuvvet gerektiren yükümlülüklerin karşılanması için, müminlerin meydana getirdikleri dayanışma vakıası (olgusu) dır. Bu dayanışma vakıasının islâmî nasslarda,.« Vj » kavramı ile karşılanması ve bu“velayet”, ya da“vilâyet”in de diğerlerinden ayrılması için“kamu (âmme) velayetleri, ya da vilâyetleri”diye adlandırılması bakımından, islâm idare hukukunun konusu“kamu velayeti”olur. Buna göre, İslâm İdare Hukuku'nun tarifi de, kamu velayetlerinin kuruluşuna, faaliyetlerine ve bunların özel kişiler ile münasebetlerine ilişkin kurallar bütünü şeklindedir.- 246 - b. İslâm îdâre hukuku'nun kaynaklari Kur'ân'da,“Ey inananlar ! Allah'a itaat edin, Peygamber'e ve sizden buyruk sahibi olanlara itaat edin. Eğer bir şeyde çekişirseniz, Allah'a ve âhiret gününe inanmışsanız, onun hallini Allah'a ve Peygamber'e bırakın. Bu hayırlı ve netice itibariyle en güzelidir.”âyeti, itaat edilmesi gerekenleri düzenlerken; 1. Allah, 2. Rasûl, 3. Ulu'l-Emr (Emir Sahipleri) şeklinde sıralanan merciler, İslâm'da İdare Hukuku'nun kaynaklarını, Kitap, Sünnet ve UIu'I-Emr şeklinde teşkil etmektedirler. C. İSLÂM'DA ÎDÂRE'YÎ DÜZENLEYEN TEMEL KAİDELER Allah'tan başka ilâh yoktur; Hz. Muhammed O'nun elçisidir: «111 Jj»>j iv*-»,,,» <<DI ^l aJI^“jJ diyerek islâm inanç toplumunu meydana getiren bireyler, Allah'ın emir ve nehiylerini uygulamada, ferdî olarak müslümanca yaşarken karşılaştıkları engeller, her bireyin kendini müslümanlık hali içinde muhafaza için sarf edeceği kuvvetine üstün gelmesi ve müslümanlar bu ferdi yaşama şekillerini değiştirmezlerse yok olup gitmeleri tehlikesi üzerine, insanların kuvvetlerini arttırmakta, yeni kuvvetler yaratmayacakları, ve ancak mevcûd kuvvetleri birleştirerek kullanmaktan başka bir şey kalmayacağı hakikati karşısında, Allah'ın emirlerini yerine getirebilmek şeklindeki müslümanlıklannı koruyabilmeleri için, bir araya gelmek suretiyle, yani yukarıda sözü edilen dayanaşrna ile mukavemeti kırabilecek bir kuvvet yekûnu meydana getirmişlerdir. İşte, bu birleşik kuvvetten optimum (en yüksek) verim elde etmek için, yani bu bir araya gelen kuvvetlerde eş güdümü sağlamak için, kendi aralarından en ehil bir tek muharrik vasıtasiyle bu bir araya gelen, birleşen kuvveti ahenkli şekilde harekete getirmek, yani, içlerinden birine bu birleşik kuvveti eyleme geçirme vazifesini vermek ile de ”idare“ adı vereceğimiz cihazı kurmuşlardır. Bu bakımdan, Hz. Peygamber ve Râşid Halîfeler dönemlerinde idare müessesesini (hukuksal kurumu) oluşturan şu kaideler ile İslâm'da idare meselesi düzenlenin 1. İdare kuvvetinin (kamu vilâyetinin) akit ile teşkili-Bey'at ilkesi İnsan ile insan arasındaki müsavatın doğrudan doğruya bir netice-i lâzımesi olan ve İslâm İdâresi'nin üzerine kurulduğu bu kaidedir. Bunda, İslâm İdâre'sini kurabilmek için, İslâm Ümmeti ile Ürnmet'de en ehil kişi seçilen ve Devlet Başakanı olarak nitelendirilecek olan kişi arasında bey'at denilen bir anlaşma yapılır. - Bu bey'atte, islâm toplumunun işlerini üstlenmek ve islâm idaresi veya devlet başakanı ile idarecilere itaat etmek akdedilir, yani meşru' (hukukî) bağlanış gerçekleştirilir.-247- 2. Kamu vilâyetinin emânet kapsamında nitelendirilmesi Kamu velayetinin konuları ile kulluk görevleri aynılık gösterdiklerinden, kamu vilâyetleri, namaz görevi gibi emânet kabul edilir. Bu bakımdan, görev ile ilgili yükümlülükler ihmâl edildiğinde kulluk yerine getirilmemiş sayılır. 3. İdâri kararın (irâdenin) şûra ile belirlenmesi îdâre, Şûra ve Katılmalı Yönetirrit göre işler. Hz. Peygamber ve Râşid Halîfeler dönemlerinde kâmû velayetleri, Mescid'de görülür ve Devlet İdaresi, Mescid'de yapılır; zira İslâm'da Devlet Merkezi, Allah'ın Evi olan Mescid olmaktadır. İşte bu bakımdan o, bütün müslümanlara açıktır. Hiçbir kimse bu müslümanlardan birini, orada cereyan eden hadiselere iştirak etmekten ve bu hadiselerde alınan kararlarda payının bulunmasından alıkoymaz. Bu, Hz. Peygamberin Medine'deki Mescidinin işleyiş şeklidir. Diğer şehir ve bölgelerdeki mescidlerde de, aynı işleyiş hâkimdi. Birçok hadîsin manalarından, Hz. Peygamber kadar çok şûra yapan bir başka kimsenin bulunmadığı açıkça anlaşılmaktadır. Aynı özellik Râşid Halîfeler ve Sahâbe'de de görülmektedir. Bu sahâbîler, başkentte şûra ilkesine bağlı kaldıkları gibi, başkent dışında İslâm Devleti'nin geniş topraklarında ve değişik halklar arasına gönderdikleri valileri ve memurları için de şûra ilkesine bağlı kalmalarını mecburî kılıyorlardı. 4. Otorite'nin merkezi olarak Allah ve Rasûl, mahallî olarak da, ûlû'l-emr şeklinde kademeleşmesi (hiyerarşisi) Kur'ân'da, Allah şöyle buyurmuştur: ”Ey inananlar ! Allah'a itaat edin, Peygamber'e ve sizden buyruk sahibi olanlara itaat edin. Eğer bir şeyde çekişirseniz, Allah'a ve âhiret gününe inanmışsanız, onun hallini Allah'a ve Peygamber'e bırakın. Bu hayırlı ve netice itibariyle en güzelidir“. 5. Bey 'at ile teşkil edilen kamu vilâyetinin (idare kuvvetinin) kullanımında hukuka tâbilik-Hukukîlik ilkesi Sâri1 olan Yüce Allah, teşrî'î (hüküm koyma) yetkisini beşerin elinden, bu yetkiyle bazıları bazılarına üstünlük sağlamasın diye, çekip almıştır. Bu yüzden, İslâm'da idarecinin rolü, ancak Allah'ın Şerî'atı'nın hükümlerini uygulama ve yerine getirme olarak belirlenmiştir. İşte İslâm Devleti'nde âmme (kamu) kudreti (gücü), daima Şâri'in getirdiği kaide ve hükümlere bağlı ve bunlar ile yükümlüdür. Hukuk'u, yani Allah'ın Şerî'atı'nı, O'nun indirliklerini tatbik edemeyen idareciler, fâsık (bozgunucu), kâfir (inkâr eden) ve zâlim (haksızlık yapan) kimselerdir. 6. Hukukîlik ilkesinin vasıtalı müeyyidesi olarak tasarruf ve eylemlerde meşrûiyyet İslâm'da îdâre işlerken, idareci, Allah'ın şerî'atının hükümlerine itaat etmek, onunla yüklenmek ve onunla yükümlü kılınmak mecburiyetindedir; aksi halde işleri ve248 tasarrufları meşru' olmaz, bâtıl olur; çünkü Yüce Allah şöyle buyurmaktadır: ”Ey inananlar ! Allah'a itaat edin, Peygamber'e itaat edin; işlerinizi boşa çıkarmayın.“ Bu, Hz. Peygamberin şu sözleriyle açıklanmıştır: ”Halik (Yaratan) 'a isyan olan durumda, mahlûka (yaratılmışa) itaat yoktur“ ve ”Üzerinde emrimiz bulunmayan her iş reddedilir“. Meşruiyyet kaidesinin müeyyidesi olan teşkilâtlanma da, Hz. Peygamber ve Râşid Halîfeler dönemlerinde, Allah'ın hükümlerine aykırı olarak alındığı iddia edilen bütün kararların iptalinin dâva edilebildiği ve bu şekilde, İslâm'da meşruiyyet kaidesinin korunduğu ”mezâlim kazâ“sı ile ”tahkim“ düzenlemesi suretindedir. 7. Hukuktlik ilkesinin vasıtasız müeyyidesi olarak idare olunanların isyan hakkı Ümmet'e îdârecelerin işlerini denetleme yetkisi, öğütleşme temelindeki dûıde, el- emr bi'1-ma'ruf ve'n-nehy ani'l-münker farzı ile verilmiştir. Bu farz ile gerçekleştirilmek istenen gayenin de, islâmî şerî'ate bağlılığı gerçekleştirmek, onu garanti altına almak, idarecilerin güçleri ile istibdadlarına ve kamu yasalarını terketmelerine engel olmak, denetlemeyi sürekli kılmaktır. Bu bakımdan Ümmet' den müslüman halkın, Devlet Başkanı'nı ve bunun dışındaki idarecileri, Şerî'at hükümlerine aykırı davranışlarında ve bu fiilerinde ısrar ettiklerinde, görevden alma ve bu görevden almaya karşı konulduğunda da, silah kullanma haklan vardır. D. İSLÂM'DA tDÂRE TEŞKİLÂTI Kamu velayetinin idaresi, yani Hz. Peygamber ve Râşid Halîfeler dönemlerindeki îdâre Teşkilâtı, yerinden yönetime (ademimerkeziyetçiliğe) yönelik, fakat ”İdarî Vesayet“, yani ”Yetki Genişliği“ usûlü ile yerinden yönetim usûlünün sakıncalarını azaltmış ve Merkezî İdâre'ye, Mahallî Idâre'yi gözetleme ve kontrol etme hakkını vermiş olarak gerçekleştirilir. Kamu vilâyetinin merkez teşkilâtı, yani merkezî idare teşkilâtı, ”Devlet Başkanlığı“, ”İstişare Cihazı, yani Yardımcı Kurul“ ve ”îdârî Birimler, yani Dîvânlar“dan meydana gelir. Devlet Başkanı, siyasî ve idarî sifatlan, kendinde toplar. Devlet Başkanı, devlet işlerinin idaresinde, Şûra Ehli'nden meydana gelen istişare Cihazı ile işbirliği eder. Tedrici bir şekilde ortaya çıkan ihtiyâçlar, ihtisaslaşmış divanların kurulmasını gerekli kılar. Gerek devlet başkanı ve gerekse şûra ehlinin seçimindeki esas belirgindir. Seçim usûlü da, oylarla seçmek ile ilgisi olmayan yeni bir uslûb olarak otamatik (kendiliğinden olma) bir yapıya sahiptir. Bu, islâm'ın bir hareket olarak ortaya çıkışında kendini gösterir. Diğer müslümanlardan, hizmetleri, fedâkârlıkları, isabetli ve açık-249- görüşlülükleri ile çok üstün olanlar seçilirler. Bu şekildeki seçim, yaşantılanndaki zorluklar, sıkıntılar ile yoğrulmaları ve tecrübe güçleri ile gerçekleşmiştir. Seçimin bu üslûbu çok daha sıhhatli ve oylamadan çok daha kısa olarak netice vericidir.. Kamu vilâyetinin merkez teşkilâtına bağlı taşra teşkilâtına gelince, bu, kamu velayeti yetkilerinin taksim edilmesinin bir sonucu olarak ortaya çıkar. Bu yetkiler sayı ve şekil itibariyle bir zamandan diğer zamana değişiklik gösterebilirler. Bu bakımdan, Hz. Peygamber Dönemi'nde, taşra teşkilâtı ”özerk idare bölgeler“den meydana gelirken Râşid Halîfeler Dönemi'nde, ”vilâyet“ ve ”cundlar“dan meydana geliyordu. Taşra Teşkilâtı'nda büyük me'murlar şöyle sıralanabilir: Emîr (Komutan veya Vâlî), Kadı, Zekât Memuru, Dîvân Kâtibi, Beytu'1-Mal Sahibi. Her taşra teşkilâtı birimi, genel olarak, bir merkez şehir ile ona bağlı olan şehirler ve isimlendirilmeleri birinden diğerine değişebilen şehirden küçük idarî birimlere bölünebilir. E. İSLÂM'DA İDARE PERSONELİ İslâm'da idare görevliliği bir kazanç yolu değil; ancak dinî bir görevi edâ yoludur. Bireyin dinî yükümlülükleri ile kâmû velayetinde görev yapması arasında organik bağlar vardır. Nitekim müslüman birey, kulluk görevlerini yapmak yoluyla Allah'ın rızâsını elde etmeye çalışır. Aynı şekilde kâmû velayetini yapmak, insanların ihtiyaçlarını karşılamak da, Allah'a yaklaştıncı, O'unu rızâsına ulaştıncı yollardan biridir. Bu durum, idare cihazının üreticiliğini ve verimliliğini arttırır. İslâm'da kamu velayeti personeli ile îdâre arasında kurulan ilişkilere ait hukukî yapı, iki ayrı mahiyette ve buna uygun olarak iki ayrı bağda toplanır. Bunardan birincisi, ”nass ile düzenleme ve statü bağı“, diğeri de, ”mukavele ile düzenleme ve akit bağı“da. Islâmî anlayış ışığında kâmû hizmetleri personeline, yani kâmû velayeti görevlisine, îdâre ile aralarmda nass ile düzenleme ve statü bağı ilişkisi kurulduğunda, uygun görülecek asgarî ücret, görevlinin kişisel rahatını gerçekleştirebilen unsur ve sebebleri içermelidir. Bu yüzden ücretin, yiyecek ve oturma ile ailenin istikrârını sağlayacak giderleri karşılayacak miktarda olması gerekir. Mukavele ile düzenleme ve akit bağında ise, ücret, güç sarfedilerek yapılan çalışma miktarınca ücret olmalıdır. Nitekim Kur'an-ı Kerîm'de şöyle buyurulmaktadır: ”İşlediklerinden ötürü herkesin bir derecesi vardır. Herkese işlediklerinin karşılığı ödenir. Kendilerine haksızlık yapılmaz“. F. İSLÂM'DA İDÂRE'NİN MALLARI Hz. Peygamber ve Râşid Halîfeler dönemlerinde İdâre'nin malları ve emlâki, mülkü sahiplerine göre yapılacak bir sınıflandırma ile, beytu'l-mal (devlet) mülkiyeti ve âmme (kâmû) mülkiyeti şeklinde belirlenir.250 Buna göre, beytu'1-mal, yani devlet mülkiyeti, sahibinin Allah olduğu mülkiyet olurken, bu mülkiyetten bazı mallar ve emlâkin, rakabesi beytu'l-mal'ca korunmak üzere, bireyleri sayılamayacak şekilde bütün müslüman ümmet veya onun bir topluluğu olan ve aralarındaki bireylerden sadece birine değil de, insanların hepsine olacak biçimde, elden ele dolaşılmasına ve kullanılarak faydalanılmasına tahsis edilmesi ile âmme (kâmû) mülkiyeti meydana getirilir. islâm'da kâmû mülkiyeti kılman eşyada, toplumun ihtiyâcı sona erdiğinde ve kamunun menfâ'ati kalmadığında, bu eşya Devlet Mülkiyeti'ne, yani Beytu'1-Mal Mallan arasına rucûu eder ve müslüman idareci, bu eşyanın rakabesinde tasarruf edebilir; yani onda tasarruf hakkı olan kullanma, gelirinden yararlanma ve devretme işlemlerini yapabilir. G. İSLÂM'DA IDÂRÎ USÛLLER islâm'da idarî usûller şöyle sıralanır: 1. Kamu velayetinde görevlendirme usûlü îslâmî düzenin özelliği, işçi ve memurlarını seçmede ve onları kuvvetlilik (yeterlilik) ile güvenirlik gibi iki esas ilkeye göre görevlendirmede kendini gösterir, islâm'da vilâyet (görevlendirme), devletin en yüksek makamından en aşağı memuriyetine kadar, kuvvetlilik (yeterlilik) ve güvenirlik esasına göre yapılır. 2. Kamu düzenini koruma usûlü Günümüz Idâre Hukuku kitaplarında buna, ”idarî kolluk“ veya ”zabıta“ usûlleri de denilen kâmû düzenini koruma usûlleri ve vasıtaları, değişik ve çeşitli şekillerde görünür. Bunların başında düzenleme usûlü ve talimatname vasıtası gelir. Bunlar umumî, objektif ve tanzimî usûl ve vasıtalardır. Bir de, ferdî mahiyette olan, bilinen ve belli bir ferdi ilgilendiren, ona yöneltilmiş usûller ve maddî ve fiili bir takım vasıtalar vardır. Düzenleme usûlü ve talimatname vasıtasının kullanımını, hicreti müteakıb Medine'de harb (cihâd)in emredilmesi ile Hz. Peygamber (a.s.)'in yaptığı ”Emân Düzenlemesi“ güzel bir örnek teşkil etmektedir. Bunun gibi, îdâre'nin bu düzenleme usûlü ve talimatname vasıtasının kullanımına, gerek Hz. Peygamber (a.s.) ve gerekse Râşid Halîfeler dönemlerinde, ”cuma namazı düzenlemesi“, ”zekât düzenlemesi“, ”cihad düzenlemesi“, ”kadâ (mahkeme) düzenlemesi“ ve diğerler düzenlemeler şeklinde rastlamak mümkündür. 3. idâri iktisap usûlleri îslâmî teşrî'de ferdî (özel) mülkiyet korunmuştur. Herhangibir ferde, ferdî mülkiyete tecâvüz hakkı verilmezken, Idâre'ye zorunlu ihtiyâcın gerektirdiği kâmû-251- yarannı sağlamak için, özel mülkiyete müdâhale ederek zorla alınmasına İslâm cevaz vermiştir. Kâmû yararı sebebiyle zorla mülk edinme şekillerinden biri, ”istimlâk“ halidir. Buna cebrî temellük hali de denilir. Eğer sahibi bunda, rızâ göstermezse, devlet başkanı veya idarecinin, ona, kıymetini ödeyerek zorla alma hakkı vardır. Zorla mülk edinme şekillerinden bir diğeri, ”istimvâl“ veya ”tevzîfu'l-emvâl“ denilen, beytu'l- malın beklenilen hiç bir şeyi bulunmadığında ve gelir kaynaklan da zayıf olduğunda, tevzîf hükmünün uygulanması, yâni taşınır malların bir kısmını istisnaî olarak almasıdır. ”Devletleştirme“, ya da ”millîleştirmeye“ gelince, bu, Ümmet'in olması gereken malları asıl yerleri olan Ümmet mülkiyetine döndürülmeleri olduğunda, bu, bir çok hadîs rivayetine göre uygulamış bir usûldür. 4. İdare' nin sözleşme usûlleri îdâre alanına özgü olan idarî sözleşmeler, özel hukuk ilke ve kurallarından esinlenmekle beraber, ayrı ve bağımsız bir hukukî rejime sahiptirler. Bu rejim, İslâm'da devlet arazileri ve gayri menkûllerine uygulanan ”iktâ' rejimV'âfc. islâm'da, Devlet Arazîleri ve Gayr Menkûlleri, Devlet Başkanı'nın her türlü tasarrufta bulunabileceği, emirlerinin geçerli olduğu mülklerdir. Hz. Peygmaber ve Râşid Halîfeler Dönemleri'ndeki uygulamalara, tâbi oldukları esas ve usûlleri bakımından iki çeşit göstirirler: Birincisi : Arazîlerin Mülk Olarak Verilme Sözleşmesi ve Usûlleri (: İktâ'u't-Temlîk) dir. Nitekim, Temimu'd-DârTye, fetholunmadan önce, Şam'ın bir kısımını da içeren bölgenin kuyuları verilmiştir. İkincisi : Gayri Menkûllerin İntifasının Mülk Olarak Verilme Sözleşmesi ve Usûlleridir. Nitekim Hz. Ömer, Irak arazîsini alınca, İran hükümdarının mallarını, saray adamlarının mallarını, kaçan mal sahiplerinin mülkleri ile harab olmuş mülkeleri Beytu'l-Mal'a maletmiştir. 5. Kamu alacaklarının tahsili usûlü İdâre'nin ayrıcalıklarına dayanan İdarî usûllerden biri de, kâmû alacaklarının tahsilinde görülür. îdâre, kâmû alacaklarının tahsilinde, icrâî karar ve re'sen hareket salâhiyetine dayanarak kendi kudret ile alacaklarını tahsil eder. Hz. Peygmaber ve Râşid Halîfeler Dönemleri'nde, idâre'nin kâmû alacaklarının tahsilindeki usûl, mâlî mükellefiyetlerin tahsilinde kendini açıkça gösterir. Nitekim, bu mâlî mükellefiyetlerin tahsili için İdâre'ye mani olunulursa, bunun için îdâre onlarla savaşır. H. İSLÂM'DA İDÂRE'NİN DENETLENMESİ islâm'da îdâre karşısında ferdin vaziyeti, toplumsal sorumluluk üzerine kurulmuştur; yani, birey devlet kuruluşlarını gözetlemeden ve herhangi bir bozukluk veya kusuru bildirmekten sorumludur. Bu sorumluluk, kâmû velayetleri kuruluşlarının idarî sağlamlık unsurları ile ilgili bir unsurdur ve şu iki önemli hususa dayanır: Birincisi', bireysel sorumluluk, bireyin görevsel davranışı, kulluk görevleri ve bunlardaki tekamül ile bağlantılıdır. Zihinsel seviye, idarî işlerin güzelce yerine- 252 - getirilmesinde esaslı bir rol oynar. Bu bakımdan birey, kendi nefsinin bekçisidir. İkincisi ise; toplumsal sorumluk, devlet görevlilerinin tasarrufları üzerinde bir denetleme cihazı gibidir. Bu yüzden, toplumun bütün fertleri, islâmî şerfatın öğretisi ve edebî çerçevesinde kâmû velayeti personelini kontroldan sorumludur. tdâre'nin eylem ve işlemlerinden, menfaati ya da hakkı etkilenen kimselerin, idarî işlemin iptali, ya da karşılaştığı haksızlığı gidermek için başvurduğu yargı mezâlim kazasıdır. Hz. Peygamber ve Râşid Halîfeler Dönemleri'nde, bu kaza (yargı), Hz. Peygamber'in kendisince ve Râşid Halîfelerin de kendilerince dava ve mesele çeşitleri arasında herhangibir ayırım yapmaksızın genel kaza (yargı) içinde, yapılmaktaydı. İslâm'da mezâlim kazasından çıkan karar ve hükümler için, duruma göre, kanun yolları açıktır. Bunlara göre, tarafların sergiledikleri delillere bağlı kalarak, mezâlim kadâsında verilmiş bir karar veya hüküm, sonradan bazı hata ve delillerin ortaya çıkması ile bozularak, yargı yenilenebilmektedir. îbnu Kayyum el-Cevzî, Hz. Ali'nin Şureyh'ilı baktığı bir davayı, muhakeme usûlüne uygun olarak bakmadığı için, yeni baştan baktığını kaydetmektedir. islâm'daki hukuk devleti anlayışı, Devlet Başkanı'nın karar ve tasarrufları yargı denetimine tâbi tutulurken yargıcın bağımsızlığını sağlamak için, tahkim sistemini kabul etmiştir; zîra,“Devlet Başkanı'nın bizzat kendisi ile ilgili bir olayda kadılık edemiyeceği”Hz. Peygamber ve Râşid Halîfeler'in uygulamalar ile kaideleşmişrir."
