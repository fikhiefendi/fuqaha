abstract: "Türkiye'de Katılım Bankaları, faizsiz finansal enstrümanlar ile faize duyarlıkesimin birikimlerini değerlendirmeye çalışmaktadır. Her nekadar beklentilerin altında piyasaderinliği olsa da alternatif enstrümanlarla yapısını güçlendirebilecektir. Sukuk Ortadoğu daortaya çıktıktan sonra dünya da ve özellikle Malezya'da çok yayılmıştır. Her geçen günSukuk'a artan ilgi onu faizsiz finans sisteminin içinde önemli yer bulmasını sağlamıştır. Birçeşit menkul kıymetleştirme yöntemi olan Sukuk 'un en önemli farkı faizsiz olmasıdır. Buçalışmada menkul kıymetleştirme (securitization) ile beraber varlığa dayalı menkul kıymet(VDMK) gibi enstrümanlar ile Sukuk karşılaştırıldı. Sukuk'un dünya piyasalarındaki yeri veönemi üzerinde duruldu. Bu çalışmada lüteratürdeki menkul kıymetleştirme ve Sukukçalışmaları incelenerek çok değişkenli“doğrusal panel-veri regresyonu”(linear panel-dataregression) yöntemi kullanılmıştır.Sonunda da panel regrasyon yöntemi ile henüz ülkemizegelmemiş olan bu yeni enstrümanın piyasa girmesi ile beklenen ilgi ve fon toplamaya etkisiaraştırıldı."
