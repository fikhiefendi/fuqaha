abstract: "Pîrîzâde İbrahim, 17. yüzyılda Mekke'de yaşamış ve müftülük vazifesi yapmış olan önemli bir Hanefî âlimidir. Osmanlı Devleti'nin zayıflamaya başladığı, çeşitli karışıklık ve sıkıntıların baş gösterdiği bir dönemde yaşayan Pîrîzâde, bu olumsuzluklara karşı kalemiyle mücadele etmek amacıyla el-İ'lâm fi'l-mühimmâti'ş-şer'iyye mine'l-ahkâm isimli risalesini telif etmiştir. Bu çalışmasında adaleti sağlamanın önemini vurgulamak amacıyla İslam muhakeme usûlüyle ilgili konulara yer vermiştir. Beş fasıldan müteşekkil olan risâlede birinci fasıl“edebü'l-müftî”, ikinci fasıl“edebü'l-kâdî”, üçüncü fasıl“dava”, dördüncü fasıl“şehâdet”, beşinci fasıl“ta'zîr”hakkında kaleme alınmıştır. Hanefî mezhebinin sıkı bir takipçisi olan Pîrîzâde'nin risâlesinin dayandığı çok sayıda kaynak Hanefî literatürüne ait metinlerden oluşmaktadır. Zengin kaynak değeri ve içerdiği mühim mevzular sebebiyle el-İ'lâm fi'l-mühimmâti'ş-şer'iyye mine'l-ahkâm risâlesinin, tahkik ve tercüme edilerek günümüze ve ilim dünyasına kazandırılması amaçlanmaktadır."
