abstract: "Ülkemizde nüfus artışı ve artan konut ihtiyacının giderilmesinde, geleneksel sistemlerle sorunu çözmek sonuç vermemekte ve her yıl büyük bir konut ihtiyacı birikimi olmaktadır. Türkiye'de inşaat sektörü üretime devam etmekte fakat toplumumuzun büyük bir kesiminin gelir düzeyinin yetersiz olması sebebiyle satışlarda durgunluk gözlenmektedir. Hâlbuki kira ücretlerinin de yüksek olması, aile bütçesi için dikkate değer bir gelir kaybıdır. Birçok kişi borçlanarak kira öder gibi taksit ödeme mantığı ile bir ev sahibi olma ümidi beslemektedir. Ancak günümüzde genellikle kimse birikimini bekletmemekte, herhangi bir yatırıma bağlamaktadır. Ayrıca enflasyonun da değişken olması sebebiyle, para veya altın borç alınsa bile sonuçta alacaklı veya borçludan birinin zarar etme olasılığı mevcuttur. Bu sebeple insanoğlunun temel ihtiyaçlarından olan barınma ihtiyacının gerektirdiği konut edinme meselesi, realitenin farkına varılarak; İslam hukuku açısından Kur'an ve sünnetle delillendirilerek, bütün verilerin ışığında doğruların tespit edilip ortaya konulması günümüz şartlarında çözüm bekleyen önemli konulardan biri olmuştur. İktisadi açıdan finans kaynaklarının araştırılması ve İslam hukukuna göre kullanılmasının hükmü üzerinde mümkün olduğu kadar doğru bilgiye ulaşılması kanaatimizce lüzumlu görüldüğünden bu doğrultuda çalışma yapmaya karar verilmiştir. Bu çalışmayla günümüzde konut edinmek isteyenler için mevcut olan seçenekler ele alınıp, mesele etraflıca değerlendirilerek, helal yoldan konut sahibi olmak isteyenlerin tereddütlerinin giderilmesi amaçlanmış olup yine İslam hukukunda zaruret ve ihtiyaç açısından konut edinmenin temelleri incelenerek bu sahada fikir alınabilecek bir kaynak ortaya konulması hedeflenmiştir. Çalışmamız giriş ve iki bölümden oluşmaktadır. Giriş bölümünde çeşitli yönleriyle konut kavramı ele alınmıştır. Birinci bölümde makasıd-ı şerianın tanımı yapılarak zaruriyyat, haciyyat ve tahsiniyyat kavramları değerlendirilmiştir. İkinci bölümde konut ihtiyacını gidermenin yoları hakkında bilgi verilirken bazı güncel meselelere de dikkat çekilmiştir. Erzincan'ın çeşitli mahallelerinde yapılan konut edinme anketi ile halkın konut ihtiyacı ve bu ihtiyacın giderilmesinde halkın fikir ve tercihleri tespit edilerek değerlendirilmiştir. Bununla beraber Diyanet İşleri Yüksek Kurulu'nun da konu ile ilgili fetvalarına yer verilmiştir."
