abstract: "Kat maliklerinden biri, kat amliki olma sıfatıyla kendisine düşen borçları ve yükümleri yerine getirmemek suretiyle diğer kat maliklerinin haklarını, onlar için çekilmez hale gelecek derecede ihlâl ederse, onlar, o kat malikinin müstakil bölümü üzerindeki mülkiyet hakkının kendilerine devredilmesini hâkimden istiyebilirler. Bu gibi bir kat maliki hakkında, bağımsız bölümün mülkiyetinin dava tarihindeki değeri o kat malikine ödenerek bu mülkiyetin diğer kat maliklerine, arsa payları oranında devredilmesi için dâva açılmasına katmalikleri kurulunca karar verilir; bu kararı almak için çoğunluk sağlanamazsa veya kat maliklerinden bir kısmı bu dâvayı açmak istemezse, dâvayı öteki kat malikleri açar ve dâvalının bağımsız bölümünün mülkiyeti, dâvayı açmış olankat maliklerine, arsa payları oranında devrolunur. ( Bu gibi bir kat maliki hakkında, bağımsız bölümün mülkiyetinin hükme en yakın tarihteki değeri o kat malikine ödenerek bu mülkiyetin diğer kat maliklerine, arsa payları oranında devredilmesi için davanın açılması, aksi kararlaştırılmış olmadıkça, diğer kat maliklerinin sayı ve arsa payı çoğunluğuyla karar vermesine bağlıdır. Bu karara rağmen kat maliklerinden bir kısmı bu davayı açmak istemezse, davayı öteki kat malikleri açar ve hakim hüküm vermeden önce devir bedelinin ileride hak sahibine ödenmek üzere bankada üçer aylık vadeli hesaba yatırılması ve makbuzunun ibrazı için davacılara resen belirleyeceği uygun bir süre verir. Devir bedelinin süresi içinde yatırıldığına ilişkin belge ibraz edildiğinde ve davanın kabulü halinde hakim, davalının bağımsız bölümünün mülkiyetinin davayı açmış olan kat maliklerine arsa payları oranında devredilmesine ve devir bedelinin işlemiş faiziyle birlikte davalıya ödenmesine karar verir"
