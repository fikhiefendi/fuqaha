abstract: "Çalışmada, 2011-2019 yılları arasında yapılan bir uygulama çalışmasıyla Kobİ'lerin gelişimine ilişkin beklentiler ve Yemen'deki ekonomik kalkınmaya katkıları tartışıldı. Çalışma, fonlamanın ve idari ve teknik kısıtlamaların Yemen'deki Kobİ'lerin başarısı üzerindeki etkisini göstermeyi ve netleştirmeyi amaçlamaktadır. Ayrıca, Yemen'deki Kobİ'lerin karşılaştığı finansman kısıtlamalarına ve idari ve teknik kısıtlamalara çözüm önermeyi amaçladı. Çalışma endüktif yaklaşım, analitik açıklayıcı yaklaşım ve çıkarım yaklaşımı kullanılarak gerçekleştirilmiştır. Araştırma, Kobİ'lerin verimliliği üzerinde finansman ve idari ve teknik kısıtlamalar üzerinde önemli bir etki olduğunu ve böylece Yemen ekonomisinin büyümesini etkilediğini ortaya koydu. Yemen'deki projelerin finansmanı ve idari ve teknik kısıtlamalar sorununu ele almak için bir dizi tavsiyede de bulunuldu."
