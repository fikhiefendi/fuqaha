abstract: "İki muhterem imamı, İmam-I Mahamili ve İmam-I Nevevî'yi ele alan araştırmanın başlığından ve onun el-Mecmu' Şerhu'l-Muhadhzab adlı kitabından hareketle bu risaleyi şu şekilde beş bölüme ayırmak gerekmiştir: Birinci bölüm: İçinde Mehamili ve Nevevî adlı iki imamın tanımını ve (El-Mecmû') kitabını, onların fıkıh doktrinlerini ve kitapta dayanılan en önemli kaynakları zikrettim. Ardından ikinci bölümde İmam-I Mahamili'nin zekat kitabındaki görüşlerine değindim. Bu görüşleri topladım ve karşılaştırmalı olarak inceledim ve her bölümde aynısını yaptım. Üçüncü bölümde (El-Mecmu') kitabı aracılığıyla İmam Mahamili'nin oruç hakkındaki görüşlerine değindim, dolayısıyla onun tanımı ve bölümlerine değindim ve bu kitapta İmam Mahamili'ye özgü görüşleri ayrıntılı olarak anlattım. Içtihat. Dördüncü bölümde (El-Mecmu') kitabı aracılığıyla İmam el-Mahamili'nin hac hakkındaki görüşlerine, beşinci bölümde ise (El-Mecmu) kitabı aracılığıyla İmam el-Mahamili'nin kişisel statüsündeki görüşlerine değindim. Daha sonra, sonuç bölümünde en önemli sonuçlardan ve tavsiyelerden bahsettim ve bir kaynak ve referans ."
