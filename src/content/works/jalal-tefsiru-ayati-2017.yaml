abstract: "İlimlerin en yücesi tefsir ilmidir. Bu ilmin dallarından biri de Allah'ın Kitabındaki ayetlerden şer'î hüküm veya fıkhî kâide elde eden tefsîr-i teşrîi ilmidir. Gerek eski gerekse de yeni âlimler bu ilme önem vermişlerdir, Malumdur ki, İslâmî teşrî'de/hüküm koymada Kur'ân-ı Kerîm, esas ve ilk kaynaktır. Şer'î hükümler, Kur'an ve Nebevî sünnete bina edilirler. Kur'an, Teşrîi kaynakların esası ve direği olunca; haliyle Tefsir ve Kur'an'dan hüküm istinbat etmek de, ilimlerin en kıymetlisi ve en yücesi olur. Çünkü bu ilim, hayat için gerekli olan şer'î, amelî hükümleri ele alır. Kuşkusuz, ahkâm âyetlerini bilmenin genelde bütün Müslümanlar; özelde de tefsir ve fıkıh araştırmacısı için büyük faydaları vardır. Çünkü onları bilmek, Alah'ın insanlar için teşri' buyurduğu şeyleri bilmenin yegâne yoludur. Onlarla helali-haramı bilir ve yine onlarla Allah'ın bize vacip veya müstehap gördüklerini temyîz ederiz. Çünkü onlar, kulların dünya ve ahiret maslahatlarına dair fıkhî hükümleri içeren âyetlerdir. tezimde Kur'an'ın son cüzlerinde geçen bazı ahkâm âyetleri hakkında; İmam Serahsî'nin hanefî fıkıh kitaplarının en büyük ve en önemlilerinden olan Mebsut isimli kitabındaki değerlendirmelerini ele aldım."
