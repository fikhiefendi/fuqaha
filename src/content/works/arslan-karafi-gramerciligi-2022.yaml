abstract: "626 yılında Mısır'ın Behnesâ bölgesinin Bûş köyünde doğan Ḳarâfî'nin ilk eğitimi babası Şeyh İdrîs (ö. [?]) ile başlar. Ḳarâfî babasından aldığı eğitimden sonra Sahibiyye, Kamhiyye ve Fazıliyye medreselerinde eğitim görmüştür. Eğitiminin çoğunu“Sultânu'l-'ulemâ”lakaplı İzzeddîn b. Abdisselâm'dan (ö. 660/1262) tahsil etmiş ve hocası vefat edene kadar yaklaşık 30 sene yanında kalmıştır. Bunun dışında İbnu'l-Ḥâcib (ö. 646/1249), el-Hûnecî (ö. 646/1248), el-Hüsrevşâhî (ö. 625/1254), İbrahim el-Makdîsî (ö. 676/1277), Şerafuddîn el-Fâkihâni (ö. [?]), Abdulazîm b. Abdulkavî el-Munzirî (ö. 656/1259), İbn Ebî'l-Fazl el-Mursî (ö. 655/1257) ve Şerîf el-Kerekî (ö. 688-89) de Ḳarâfî'nin hocaları arasındadır. 684 yılında Kahire'de vefat etmiş ve Ḳarâfe'de defnedilmiştir. Asıl alanı fıkıh ve fıkıh usûlü olan Ḳarâfî'nin bu ilimler dışında da çalışmaları mevcuttur. Bu çalışmalar nahiv, sarf, kelam, mezhepler ve dinler tarihiyle alakalıdır. Ḳarâfî gramer alanında üç eser bırakmıştır. Bu eserler incelendiğinde onun Basra nahiv ekolüne mensup olduğu anlaşılmaktadır. el-Ḫaṣâiṣ adlı eserinde nahiv âlimlerinin çoğunluğunu eleştirmiş ve kendi görüşlerini ortaya koymuştur. Onun bu eleştirilerinde Fahreddîn er-Râzî'den (ö. 606/12109 etkilendiği söylenebilir. Râzî'nin Mefâtîḥu'l-ġayb adlı eserinde kelime ve kısımları hakkında yaptığı yorumlar Ḳarâfî'nin el-Ḫaṣâiṣ adlı eserinde de görülür. el-İstiġna adlı eserinde, istisna hakkında kapsamlı bilgiler vermiş ve bazı konularda ilk sayılabilecek şeylere değinmiştir. el-Ḳavâ'idu'ŝ-ŝelâŝûn fî 'ilmi'l-'arabiyye adlı eseri ise nahiv ve sarf ilmiyle alakalı kısa bir eserdir. Bu eserinde nahiv ve sarfla alakalı kısa kısa kaidelerden bahsetmiş ve bunları örneklendirmiştir."
