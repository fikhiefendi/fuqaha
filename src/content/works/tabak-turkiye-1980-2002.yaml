abstract: "ÖZET Klasik Osmanlı düzeninin çözüldüğü yüzyıllar, Batı kapitalizminin hızla yayıldığı ve Osmanlıyı da etkisi altına aldığı dönemle denk düşmüştür. Gecikmiş Türkiye kapitalizmini eşitsiz gelişme yasası belirlemiş, ulusal burjuvazi yaratılması ve bağımlılık gibi tarihsel-yapısal sorunlar ortaya çıkmıştır. Sermaye birikiminde devletin başat rolü üstlenmesi, egemen sınıfların istikrarlı bir hegemonya kuramaması, ekonomik ve siyasal bunalımların her defasında otoriter müdahalelerle çözülmeye çalışılması bu olgunun somut toplumsal sonuçlandır. Toplumsal gelişmenin bu özgüllükleri, egemen sınıfların gözünde devletle ilişkileri sorunsallaştırmış, gecikmiş kapitalizmin doğurduğu sorunların kaynağı her zaman siyasal düzeyde aranmış, bağımlı sınıfların mücadeleleri doğal karşılanmamıştır. 1980 yılından itibaren de ordunun müdahalesiyle devletin liberal tarzda yapılanması sağlanmış, bağımlı sınıflar toplumsal iktidar denkleminden dışlanmış, bunlara karşı yürütülen ideolojik saldın çerçevesinde dinsel ideoloji canlandırılmış ve burjuvazi siyasetin tek sınıf aktörü haline gelmiştir. Ancak, bu siyaset tekeline karşın, burjuva toplumsal iktidarın ekonomik temelleri yaratılamamış, mevcut üretim temeli de giderek tasfiye edilmiştir. Yeterli ekonomik temelin olmamasının doğrudan sonucu egemen sınıfın hegemonik bir birlik kurarak toplumsal iktidarını tesis edememesidir. Aksine, uzlaşmaz toplumsal ve ekonomik tasarımlara sahip büyük sermaye, İslami sermaye ve küçük-orta boy sermaye fraksiyonları arasında 1990'larda şiddetlenen çatışmalar genel bir siyasal bunalımla sonuçlanmıştır. Otoriter bir müdahalenin ardından ekonomik ve toplumsal yaşam uluslararası kapitalist kurumların ayrıntılı düzenlemesine konu olmuştur. Burjuvazinin Türkiye'yi yönetemediği açıklık kazanmış, burjuva toplumsal iktidarı önemli ölçüde dışardan örgütlenmeye başlamıştır. Öte yandan, alternatif bir hegemonyaya önderlik etmeleri beklenecek bağımlı sınıflar, yirmi yıl önceki saldırının etkisini henüz atlatamadıklarından iktidar denklemini etkileyebilecek bir toplumsal güç olmaktan uzaktır. Bu iki olgunun bileşkesinde, 21. yüzyılın başındaki Türkiye'nin temel ikilemi ortaya çıkmaktadır. 164"
