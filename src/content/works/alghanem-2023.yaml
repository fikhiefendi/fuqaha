abstract: "Kirala-sahip ol (leasing), İslami finansın bir finansman formülüdür ve işlemleri düzenleyen ve finans akitlerini İslami şeriat akitleri haline getiren AAOIFI'nin şeriat standartlarının 9 numaralı kriterinde karşılığını bulmaktadır. Bu araştırma İslâmi Finansal Kuruluşlar Muhasebe ve Denetim Organizasyonu (AAOIFI) tarafından yayınlanan şeriat standartlarının 9 numaralı kriteri olan kiralama ve kirala-sahip ol akitlerinin kıstaslarını incelediği için önemlidir. Çalışmada bu standardın modelini ve fıkhî uyarlamasını anlamak ve daha sonra bankaların kiralama akdi işlemlerinde standarda uyup uymadıklarını görmek için Kuveyt Türk ve ve Albaraka Türk Bankalarının cari işlemleri üzerinden uygulamalı bir çalışma yapılmıştır. Mevzubahis standartlar önemli ve dikkate değer olduğundan, bu araştırmada bu standartların anlamı, ne zaman ortaya çıktıkları, birçok İslami banka tarafından kabul gören ve akitleri ve işlemleri düzenlemek için referans haline gelen bu etkili formülasyonda ortaya çıkana kadar kimler tarafından ve nasıl oluşturulup geliştirildikleri açıklığa kavuşturulmaktadır. Çalışmada nitel araştırma yöntemine başvurulmuş, bu standardı inceleyen kaynaklar, referanslar ve çalışmalara müracaat edilmiştir. Yine çalışmada 9 numaralı şer`î standart hakkında söylenen fıkhî görüşlerle diğer fıkhî görüşler arasında karşılaştırma yapılmıştır. Son olarak tümevarımsal analitik yöntem çerçevesinde iki bankanın sözleşmelerinden toplanan bilgiler analiz edilmiş, bunlarda var olan sorunlar belirlenmiş ve alternatifler ve çözümler sunulmuştur. Araştırmanın sonuç kısmında Kuveyt Türk ve Albaraka Türk bankalarının şartnamelerinde şeriata uygun olmayan maddeler belirtilmiş ve bunlara dikkat çekilmiş, bu iki bankaya AAOIFI'nın belirlediği şeriat standartlarına uygun çözüm önerileri sunulmuştur. Ayrıca bu iki banka kiralama ve kirala-sahip ol akdi işlemlerini 9 numaralı standarda mümkün olduğunca uygun yapmaları veya bir standardı uygulamanın mümkün olmadığı durumlarda Allah'ın geniş ve hikmetli şeriatına uymaları hususunda teşvik edilmiştir."
