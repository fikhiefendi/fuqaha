abstract: "-Q-ZET Osmanlı devletinde, adalet örgütünün içerisinde bulunan mahkemelerin başında yer alan kadılar ve İstanbul'un dışındaki kaza ve nahiyelerde fetva vermekle görevli müftüler, şeyhülislâmlık makamına yardımcı kurumlar olarak çalışmışlardır. Osmanlı devletinde ilk olarak Fatih devrinden sonra, ortaya çıktığı tahmin edilen şeyhülislâmlık makamının, bu tarihten itibaren devlet teşkilâtı içerisinde oynadığı rol büyük olmuştur. Savaş, barış, antlaşmalar, siyaseten kati vb. önemli devlet işlerinde şeyhülislâmlardan fetva alınma sı gereği duyulmuştur. Ayrıca XVI.yüzyılın ortalarından itibaren ilmiye teşkilâtının üyelerinden olan kadı, müftü ve müderrislerin atamaları görevi sadrazamlardan alınarak şeyhülislâmlara bırakılmıştır. Aynı yüzyıl içerisinde şeyhülislâmlık görevine getirilen kimselerin son derece bilgili ve yetenekli olmaları makamın önemini iyice arttırmış tır. Bununla birlikte bu dönemde devlet işlerinde oynadıkları önemli role rağmen şeyhülislâmlar, Divan-ı Hümayun i- çer isinde asıl üye olarak yer alamamışlardır. III. Selim zamanından (1789-180?) itibaren siyasi organlar içerisinde de görülmeye başlayan şeyhülislâmlar, bu dönemde oluşturulan Meşveret Meclisleri 'ne üye olarak girmişlerdir. 1 1. Mahmut devrinde meydana getirilen Meclis~i Vükelâ 'ya da kabul edilen şeyhülislâmların, ıslahat dönemi (1789-1876) ile birlikte siyasi yetkileri arttığı söz konusu olmuşsa da gerçekte bu makam giderek padişahların kontrolü altına girmiştir. Yine ıslahat döneminde şeyhülislâmların şeriat mahkemeleri üzerindeki yetkileri sınırlanmış, eğitimalanında da. sadece medreselerin sorumluluğu kendilerine verilmiştir. Ayraca bu dönemde şeyhülislâmlık kurumunda yeni mali düzenlemelere de gidilmiştir» Tanzimat döneminde modernleşme ile birlikte devlet kurumlarında meydana gelen değişiklikler., dinin devlet yapısı üzerindeki etkinliğine yeni boyutlar kazandırmıştır»"
