abstract: "Sosyal bir varlık olan insan temel ihtiyaçlarını karşılamak amacıyla çeşitli ticari sözleşmeler yapar. Yapılan her bir sözleşme sözleşmenin özelliğine göre içerisinde birtakım riskler barındırır. Sözleşmelerde söz konusu riskler ticari işlemlerin özünü etkilediği gibi bu işlemlerden elde edilen gelirin meşruiyetini de etkiler. İslam borçlar hukukundaki akitlere hangi risklerin nasıl bir etkide bulunduğunu tespit etmeyi amaçlayan bu çalışmada öncelikle akit konusu daha sonra risk meselesi ele alınmıştır. Elde edilen veriler neticesinde riskin akitleri etkileme açısından hem olumlu yönünün hem de olumsuz yönünün bulunduğu ve bu her iki yönünün birtakım kavramları kapsadığı tespit edilmiştir. Fıkıhta akitlere etki eden risk meselesinin tespit edilebilmesi için bu meselenin Kur'ân ve sünnet açısından da ele alınması önemlidir. Bu sebeple fıkıhta akitlere etki eden risk meselesine işaret eden ilgili nasların ve konunun fıkıhtaki yerinin tespit edilmek suretiyle meseleye Kur'ân, sünnet ve içtihat çerçevesinde açıklık getirilmesi tezin temel hedeflerindendir. Tezin ikinci bölümünde risk meselesi hem günümüz finansındaki çeşitleri hem de İslam fıkhı çerçevesinde akdin sıhhatini olumsuz etkilemesi ve akit için gerekli olması bakımından ele alınmıştır. Buradan hareketle çalışmanın son bölümünde İslam borçlar hukukundaki akitlere risk bağlamında yer verilmiştir. Yapılan değerlendirmeler sonucunda akitlere etki eden riskin bir kısmının akitlerin sıhhatine engel olduğu, buna karşın mülkiyet sorumluluğunu üstlenme anlamını içeren ve kâr sonucunu doğuran riskin ise risk-getiri dengesini sağladığı ve dolayısıyla bu riskin akitler için gerekli olduğu sonucuna ulaşılmıştır."
