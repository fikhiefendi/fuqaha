abstract: "Arşiv kaynakları, Osmanlı tarihine ışık tutan belgelerdir. Şehir tarihlerine tanıklık eden bu belgeler arasında yer alan şerʻîyye sicilleri, mahkemelerde kadılar tarafından kaydedilen kararları içermektedir. Şerʻîyye sicilleri, Osmanlı devletinin hâkim olduğu topraklarda bir bölgenin sosyal tarihini, hukuki yapısını, dini, idari ve iktisadi ilişkilerini bütünüyle yansıtması ve şehir tarihine katkı sağlaması bakımından önemlidir. Biz de bu çalışmamızda Sivas şehri sosyal yapısını incelemeye çalıştık. Çalışmamızın ana kaynağını H.1302-1303 (M.1885/1886) yıllarını kapsayan 18 Numaralı Sivas Şerʻîyye Sicili'ndeki dijitalde (1-44 sayfalar) belgeler oluşturmaktadır. Çalışmanın amacı belgelerde yer alan hüccetlerin doküman analizi yapılarak, Osmanlı toplum yapısını anlamaktır. Çalışmamızın merkezine Sivas şehrini koymamızdaki amaç ise Sivas'ın tarihsel süreçte birçok medeniyete ev sahipliği yapmış, yerleşim yerlerinden biri olmasıdır. Bu çalışmada Sivas şehri kentsel gelişim, idari yapı, toplumsal ve ekonomik hayat, mahalleler, evler, aile hayatı, evlenme, boşanma, çocuk sayısı, mihr, nafaka, vasi tayinleri, miras, vakıf gibi çeşitli başlıklar altında incelenmiş ve bunlara dair genel bir değerlendirme yapılmıştır. Sonuç olarak incelenen dönemde, Sivas şehri örneğinden yola çıkılarak 19.yüzyılda Osmanlı mahalli ve sosyal yapısı ortaya konulmaya çalışılmıştır. Bu çalışmayla Osmanlı bölgesel ve taşra tarihine katkı sağlamak amaçlanmıştır."
