abstract: "Tüketim alışkanlıkları ve israf günümüz araştırma konuları içerisinde son zamanlarda artan bir trende sahiptir. Daha bilinçli bir ekonomiye kayan güncel sistem; kaynakların etkin kullanımı, bireylerin sosyal refah anlayışı gibi kavramlara bolca yer vermektedir. Bu kavramlar bireylerin tüketim davranışları ve sonucunda gelişen israf anlayışının sorgulanması ve incelenmesini gerektirmektedir. Tüketim alışkanlıklarını etkileyen birçok faktör vardır. Bu faktörlerden en önemlisi ve çalışmamızın ana konusunu oluşturan din ve kültürdür. Bu çalışmada iki aynı dine mensup fakat iki ayrı kültüre sahip Türkiye ve Malezya ülkelerinde tüketicilerin israf ve tüketim alışkanlıklarını değerlendirmek amacıyla anket çalışması yapılmıştır. 265'i Türkiye'de ve 204'ü Malezya'da yapılan anketler t-testi, ANOVA testi, korelasyon analizi ve frekans analizleri uygulanarak değerlendirilmiştir. Değerlendirmeler sonucunda tüketim ve dindarlık arasında Türkiye ve Malezya özelinde belirli alanlarda anlamlılık tespit edilmiştir. Bu çalışma neticesinde ulaşılan sonuçlar daha detaylı ve derinlemesine değerlendirilerek yeni çalışmalar için ufuk açıcı olması hedeflenmektedir."
