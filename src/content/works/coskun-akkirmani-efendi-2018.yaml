abstract: "Bu tez 16-17. yüzyıllar arasında yaşamış olan Akkirmânî Ali Efendi'nin yaşadığı asra genel bir bakış, hayatı, fıkhi yönü ve“Fetâvâ Akkirmanî”adıyla anılan fetva mecmuasındaki nikah ve talakla ilgili fetvalarının çevirim yazısı ve tahkiki konularını kapsamaktadır. Çalışmanın ilk bölümünde Akkirmani Ali Efendi'nin yaşadığı bölge, 16.yüzyılın son yarısı ve 17. yüzyılın başları Osmanlı Devleti hakkında siyasi ve sosyal bilgilere yer verilmiş, daha sonra müellif Ali Efendi'nin hayatı ve fıkhi yönü ele alınmış ve fetva mecmuası hakkında bilgilere yer verilmiştir. İkinci Bölümde Fetâvâ Akkirmanî'nin“Nikah”ve“Talak”bölümlerinin çevirim yazısı ve tahkiki yer almaktadır. Çalışmanın son bölümünde genel bir değerlendirmeye ve ekte ise çevirim yazısı yapılan bölümlerin orjinal metinlerine yer verilmektedir."
