title: "Kiralama İşlemlerinin Muhasebeleştirilmesi ve Türkiye Finansal Raporlama Standardı 16: Kiralamalar Standardının Borsa İstanbul Şirketlerinin Finansal Tablolarına Etkisi Üzerine Bir Araştırma"
