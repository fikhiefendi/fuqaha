abstract: "Muhasebe standartlarını düzenleyen kurullar, işletmelerin iç ve dış çevrelerine mali bilgilerini; gerçeğe uygun, anlaşılabilir ve şeffaf bir şekilde ortak bir muhasebe dili kullanarak sunması amacıyla birçok standart yayınlamış, bu standartlar içerisinde kiralama işlemleri de kendine yer bulmuştur. Uluslararası Muhasebe Standartları Kurulu, Uluslararası Finansal Raporlama Standartlarını (UFRS) yayınlamış ve söz konusu standartlar içerisinde kiralama işlemleri, Uluslararası Finansal Raporlama Standartları (UFRS) 16'da açıklanmıştır. Öte yandan Kamu Gözetimi Muhasebe ve Denetim Standartları Kurumu (KGK), Büyük ve Orta Boy İşletmeler İçin Finansal Raporlama Standartları'nı (BOBİ FRS) yayınlamış ve kiralama işlemlerine standardın“Bölüm 15: Kiralamalar”kısmında yer vermiştir. İslami Finansal Kuruluşlar İçin Muhasebe ve Denetim Organizasyonu'nun yayınladığı Faizsiz Finans Muhasebe Standartları'nda (FFMS) kiralama işlemlerinden Faizsiz Finans Muhasebe Standardı 8: İcare ve İcare Müntehiye Bittemlik bölümünde bahsedilmiştir. Bu çalışmada çeşitli örnekler kullanılarak standartlara göre günlük defter kayıtları yapılmış, böylece hem kiralama türleri hem standartlar arasındaki farklar gösterilmiştir. Ayrıca mali kuruluşlar ve holdingler hariç olmak üzere BİST 100'de faaliyet gösteren şirketlerin TFRS 16 kullanmaya başladıktan sonraki ve önceki ikişer yılda yayınladığı finansal tabloları ve dipnotları incelenmiş, ilgili finansal tablo kalemleri ve finansal oranları sunulmuştur. Böylece yeni kiralama standardının finansal tablolar ve finansal oranlar üzerindeki etkisini görmek mümkün olmuştur. Yapılan analizler sonucunda başlıca finansal tablo kalemlerinin tümünde artış tespit edilmiştir. Ayrıca aktif karlılık ve net kâr marjı oranlarında azalış; toplam borç / toplam varlıklar ve faaliyet kâr marjı oranlarında artış saptanmıştır."
