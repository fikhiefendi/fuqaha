abstract: "Hanefî Mezhebinin meşhur eserlerinden birisi Kudûrî'nin (ö.428/1037) Muhtasarıdır. Kars Sancağı Mutasarrıfı Muhammed Emin Fehim Paşa bu eseri Osmanlıca olarak şerh etmiştir. Bu eser Osmanlı Devleti zamanında medreselerde ve zamanın eğitim kurumlarında bir ders kitabı olarak okutulmuştur. Biz bu çalışma ile eserin Arapça metin kısmını parantez içinde orijinal hattıyla harekesiz olarak yazdık, Osmanlıca yazılan şerh kısmını günümüz Türkçesine transkript yönteminden faydalanarak aktardık. Eserin içerisindeki kitâb ve alt başlıkları olan bâblarını dört ana bölümde yani sırasıyla; ibâdât, muâmelât, münâkehât ve ukûbât ana başlıkları adı altında topladık. Muhammed Emin Fehim Paşa'nın Aziziye adını verdiği Muhtasari'l Kudûrî Şerhî'nin bölümlerinin içeriği şu şekildedir. Birinci bölüm olan ibâdât ana başlığı altında; tahâret, namaz, oruç, zekât ve hac kitâbı başlıkları bulunmaktadır. İkinci bölüm olan muâmelât ana başlığı altında; alışveriş, sarf, rehin, hacr, ikrâr, icâre, şufʿa, şirketler, mudârabe, vekâlet, kefâlet, havale, sulh, hibe, vakıf, gasb, vediʿa, ʿâriye, lakît, lukata, hünsâ, mefkud, îbak, ihya-i arâzi-i mevât, meʾzûn, muzâreʿa, musâkat kitâbı alt başlıkları bulunmaktadır. Üçüncü bölüm olan münâkehât ana başlığı altında; nikâh, radâʿ, talâk, huluʿ, zıhâr, nafaka, ʿıtâk, mükâteb, velâ kitâbı alt başlıkları bulunmaktadır. Dördüncü bölüm olan ukûbât ana başlığı altında; cinâyât, diyetler, ʿakile, hudûd, hadd-i sirkât, harâm olan içkiler, sayd ve zebh, udhiye, yemin, dâva, şâhitlik, şehâdetlerden rücûʿ etme, edebî kâdî, kısme, ikrâh, siyer, bâgilik, harâm ve mübâh, vasiyet ve ferâʾiz kitâbı alt başlıkları bulunmaktadır."
