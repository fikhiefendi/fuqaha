abstract: "Fıkıh ekollerinin teşekkül sürecinde mezhep imamlarının yanı sıra onların tedrisat halkasında bulunan gözde talebelerinin mezhep birikimine yaptıkları katkılar inkar edilemez. Özellikle onların içtihad ve istinbat metotlarını zapta geçirip kaynak eser haline getirmeleri ve akabinde kendilerinin bu eserlerden ilham alarak fıkıh literatürüne yeni eserler kazandırmaları takdire şayan bir durum olmuştur. Bu tezde İslam Hukuku alanında füru-i fıkıh ile ilgili Şafiîlerden Müzenî'ye ait Muhtasaru'l-Müzenî ile Hanefîlerden Tahâvî'ye ait Muhtasaru't-Tahâvî isimli iki eserin incelenmesi ve mukayesesi üzerinde durulmaktadır. Tezde öncelikli olarak her iki müellifin yaşadıkları dönemin siyasi, sosyo-ekonomik, ilmi ve kültürel yapısı hakkında ana hatlarıyla bilgi verilmeye çalışılmaktadır. Bu çalışma, kapsam ve sınırlandırma itibariyle Hanefî ve Şafiî mezhebi üzerine olduğu için Şâfiî mezhebinde ezber bozan içtihat ve değerlendirmeleriyle mezhebin olgunlaşmasında hatta sonraki dönemlerde fakihler üzerinde derin etkiler bırakmasında önemli rol oynayan Müzenî ile Hanefî mezhebi kurucularının yerleşik içtihad ve görüşleri hakkında -mezhebin usül ve prensiplerine uygun bir şekilde- değerlendirme ve tercihlerde bulunarak sonraki nesiller üzerinde farklı etkiler bırakan Tahâvî'nin hayatları, hocaları, talebeleri, eserleri, eserleri üzerine yapılan v çalışmaları, mezhebe katkıları, mezhep içindeki konumları tezin diğer bir bölümünü oluşturmaktadır. Yine her iki müellifin muhtasarlarının belli başlı birtakım özellikleri sunularak hem bir ön tanıtım hem de zihinde formel bir çerçeve tasvir etme amacı güdülmektedir. Buna ilaveten bu muhtasarların beslendiği kaynaklar ve bu kaynaklarla irtibatını tashih amacıyla veri karşılaştırma yöntemi kullanılmıştır. Bu tezde son olarak, her iki muhtasarın aile hukukuna giren nikah ve talak konularının muhtevasına inilerek mezhebe ait görüşleri ne şekilde aktardıkları, konuları nasıl işledikleri, mezhebin doktrinlerini kendi eserlerine ne şekilde yansıttıkları, mezkur konular ile ilgili değerlendirmelerde bulunurken kendi birikimleriyle ne tür bir katkıda bulundukları, konuları işleyiş şekillerinin yanı sıra konu sıralaması ile bab başlıklarını hangi tarz veya prensibe göre oluşturdukları karşılaştırmalı olarak sunulmakta ve ilim dünyasına katkılarına değinilmektedir."
