abstract: "Şeybânî'nin Zâhiru'r-rivâye-Nâdiru'r-rivâye olmak üzere ikili bir tasnife tabi tutulan eserleri, Hanefî mezhebinde mezhep içi üç hukuk önermesinin ilk ikisinin temelini teşkil etmektedir. Hicri IV. yüzyılın önde gelen fakihlerinden Ebü'l-Leys es-Semerkandî'nin Kitâbü'n-Nevâzil'i ise üçüncü ve son hukuk önermesini içermekte olup vâkıât eserlerinin ilk örneğini temsil etmektedir. Bu çalışmada kütüphanelerde yazma halinde bulunan ve Hanefî mezhebinde yepyeni bir literatürün doğmasına öncülük eden Kitâbü'n-Nevâzil'in -hacminin genişliğine binaen- son yarısının, klasik tahkik yöntemlerinden farklı olarak metin tenkidi sahasında soyağacı/stemmatik yöntemi olarak bilinen metoda göre tenkitli neşri yapılmıştır. Elde edilen veya ortaya çıkarılan asıl (tali olmayan) vasfını haiz gerçek ve sanal nüshaların tamamının tahkik işleminde kullanıldığı söz konusu yöntemin, esere ait metnin, müellifin kaleminden/dilinden çıkmış haline en yakın versiyonunu ortaya koyma konusunda klasik yöntemlere göre oldukça başarılı olduğu gözlemlenmiştir. Soyağacı yönteminin Temel İslam Bilimleri literatüründe yer alan klasik eserler üzerinde uygulanması, daha güvenilir metinler ortaya çıkarmak adına güçlü bir alternatif teşkil etmektedir."
