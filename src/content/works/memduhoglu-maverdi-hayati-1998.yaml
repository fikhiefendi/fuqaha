abstract: "ÖZET Mâverdî hicri 5. asırda yaşamış ve İslami ilimler sahasında, özellikle kamu hukuku alanında kıymetli eserler vermiştir. İslam siyasi düşünce tarihi ve kamu hukuku gibi alanlarda çalışma yapan araştırmacıların günümüzde müracaat ettikleri kaynaklar arasında Mâverdî'nin eserleri en başta gelmektedir. Özellikle“el-Ahkâmu's-sultaniyye”adlı eseri bu sahada yazılmış en eski müstakil çalışmalardan olup, ele aldığı mevzular devletin esas teşkilat, hukuk, idare ve mali yapısıyla ilgili ana konulan kapsamaktadır. Mâverdî'nin hayatı, eserleri, yaşadığı devrin siyasi, iktisadi ve kültürel özellikleri dikkate alındığında onun hilafet ile ilgili görüşleri daha iyi anlaşılabilir. Bu çalışmada İslâm kamu hukuku ile ilgili temel bilgiler cümlesinden kamu hukukunun kaynakları, devletin şekli, özellikleri, unsurları ve temel organları ile hak ve hürriyetler konularına temas edilmek suretiyle hilafet konusunun daha iyi anlaşılmasına zemin hazırlandı. Hilafetin gerekliliğini aklın verilerinden kaynaklanan delillerden çok, şer'i nasların verileri ışığında değerlendiren Mâverdî, halifeyi belirleme yöntemi olarak seçim ve önceki adayın ta'yîni şeklinde iki yol kabul eder. Mâverdî halifeyi belirleme konusunda, gerek halife adayında, gerekse halifeyi seçecek olanlarda birtakım şartlar ileri koşar. Ayrıca halifenin hak ve görevlerini, halifelik süresini ve idari işlerde görevlendirme yetkisini ele alarak görüşlerini sıralar. vı ı"
