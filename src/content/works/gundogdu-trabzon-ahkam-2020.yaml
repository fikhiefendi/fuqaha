abstract: "Osmanlı devlet geleneği içerisinde köylü, şehirli, asker, Müslüman, gayrimüslim, kadın, erkek herkesin dilekçe vasıtasıyla şikayetini hükümdara iletme hakkı vardır. Bu şikayetlerin kaydedildiği en önemli arşiv belgelerinden biri eyaletlere göre tasnif edilmiş olan ahkam defterleridir. Ahkam defterlerinde, halkın bireysel veya toplu halde padişaha ilettiği şikayetlerden, ilgili bölgenin sosyal ve ekonomik ilişkileri ve devletin bu ilişkilere bakış açısı ortaya çıkmaktadır. Bu çalışmada 19.yüzyılda Trabzon eyaletinin bir kazası konumunda olan Giresun araştırma konusu olarak seçilmiştir. Ahkam defterleri ile birlikte salnameler, şer'iyye sicilleri, seyyahların notları ve konsolos raporlarından derlenen bilgiler bir araya getirilerek, 19.yüzyılda Giresun'unun genel sosyo-ekonomik tablosu ortaya konulmaya çalışılmıştır. Araştırma sonucu, 19.yüzyılda Giresun halkının en önemli şikayetlerinin toprak mülkiyeti alanında olduğu görülmüştür. Toprak mülkiyeti konusu, miri toprak rejimi nedeniyle devletin iaşe kaynaklarını ve hazinesini direkt olarak ilgilendirmektedir. Miri toprakların yanında mülk toprakların bu dönemde gösterdiği gelişim dikkat çekicidir. Şikayetler arasındaki miras anlaşmazlıklarının konusu yine çoğunlukla toprak mülkiyetidir. Miras anlaşmazlıklarını, alacak verecek anlaşmazlıkları, vergi anlaşmazlıkları ve tımar-zeamet anlaşmazlıkları izlemektedir. Vergi anlaşmazlıkları ile tımar ve zeamet anlaşmazlıkları dolaylı olarak toprak mülkiyeti konusuna dahildir. Devlet bu anlaşmazlıklarda görevlileri aracılığıyla taraftır. 1858 tarihli Arazi Kanunnamesi ile toprak mülkiyeti konusu yeni düzenlemelere tabi tutulmuştur. Ahkam defterlerinde yeni arazi kanununun Giresun'da olan uygulamaları incelenmiştir. Bir diğer konu alacak-verecek anlaşmazlıkları adı altında parasal ilişkilerdir. Bu ilişkiler faiz ve tefeciliği içeren murabaha konusunu kapsamaktadır. Parasal ilişkiler alanında 1852 tarihli Murabaha Nizamnamesi ile yeni düzenlemeler yapılmıştır ve yine ahkam defterlerinde nizamnamenin Giresun'da olan uygulamaları incelenmiştir. Ahkam defterleri araştırılarak Giresun'un sosyal hayatına dair bazı tespitler yapmak da mümkün olmuştur. Şehirlilerin ve köylülerin sorunları, gayrimüslimlerin toplum hayatı içindeki konumu, şehrin nüfuzlu ailelerinin yani ayanların dahil olduğu şikayetler incelenmiştir. Sonuç olarak 19.yüzyılda Giresun'da yaşanan çok kimlikli sosyal ve ekonomik hayatla beraber oluşan servet birikimi tespit edilmiştir. Ek olarak salnameler, şer'iyye sicilleri, seyyahların notları ve konsolos raporlarından edindiğimiz bilgiler bir araya getirilerek, 19.yüzyıl Giresun'unun genel sosyo-ekonomik tablosu ortaya konmuştur."
