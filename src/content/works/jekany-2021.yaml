abstract: "Bu araştırmanın amacı verginin şeriat perspektifinde ceza unsuru olarak kullanılması sorununu çözmektir, zira şeriat malı çok iyi korur ve haram şekilde kullanılmasını men eder. Burada asıl olan malın sahibinden rızası dışında alınmamasıdır. Mal ile cezalandırma birkaç hadiste yer almaktadır ve sahabe bu hadislerle amel etmişlerdir. Bu cezalandırmanın kurallarına bir göz atalım. Bu araştırmanın alanı fıkıh ve özellikle de mal ile ilgili hükümleridir, yani şeriatın suç işleyeni cezalandırmak amacıyla malına el koymasını düzenleyen kurallarıdır. Şeriat hâkime insanların mallarıyla dilediği gibi tasarrufta bulunmasına izin vermez. Ancak diğer yandan da kamu yararını gözeterek gerektiğinde vergi koymasına izin vermektedir. Araştırma fıkıh âlimlerinin sözlerini, bu sözlerin dayanaklarını, bu dayanakların tartışılmasını ve cevaplandırılmasını kapsamaktadır ve mümkünse aralarında bir sentez oluşturulmasını ya da dayanağı güçlü olanı tercih etmeyi amaçlamaktadır. Vardığım sonuçlar aşağıdaki gibidir: İslam Devletinin Hazinesi fakirleşip yükümlülüklerini yerine getiremez hale gelirse, İmam herhangi bir adaletsizliğe ya da zarara mahal vermeden herkesin maddi olanağına uygun olarak insanlardan vergi alabilir. Söz konusu verginin toplanması miktar ve süre ile kısıtlıdır. Diğer bir deyişle, toplanan vergi miktarı devlet hazinesinin ihtiyacını aşmamalıdır ve vergi toplama süresi ise devlet hazinesinin güçlenerek kamu ihtiyaçlarını karşılar hale gelmesiyle sınırlı tutulmalıdır. İmamın Peygamberimizin ve Halifelerin fiillerine dayanarak mal ile cezalandırması caiz olup, bu konu kesin bir hükümdür. Ancak burada asıl olan bu yetkinin insanların mallarına zarar vermek için kullanılmaması ve adaletli olunmasıdır."
