abstract: "Tüketicinin korunması kavramı 20. yy. ile ortaya çıkmıştır. Ancak doğrudan veya dolaylı olarak tüketicinin korunması yönünde faaliyetlerin başlangıç tarihi, insanlığın ilk dönemlerine kadar gitmektedir. İslam hukukunda tüketicinin korunmasına yönelik çok önemli uygulamalar mevcuttur. İslam dininde insanın temel alınması, hakka riayet edilmesi, adatmanın yasaklanması, zayıf konumda bulunanın daha fazla korunması gibi temel ilkeler de İslam hukukunda tüketicinin korunmasına yönelik önemli kuralların varlık göstergelerindendir. İslam hukukunun iki yönlü bir yapısının bulunması, tüketiciyi koruma faaliyetlerinin, günümüze nazaran çok daha tesirli olmasını sağlamaktadır. Rasulullah (sav) döneminden beri var olan bu koruma Raşit halifeler ve diğer İslam devletlerinde de gelişerek devam etmiştir. İslam hukuku kurallarını uygulayan Osmanlı Devleti'nde de özellikle şer`i kanunlar, örfi kanunlar, resmi ve yarı-resmi kurumlar aracılığıyla tüketicileri koruyucu faaliyetler söz konusu olmuştur. Osmanlı uygulamasına bakıldığında, bulunulan çağın çok ötesinde tüketiciyi koruma faaliyetleri olduğu görülmektedir. İlk standardizasyon kanunnameleri olan ihtisab kanunnameleri, kalite kontrol denetimi, ihtikar yasağı, narh uygulaması, aldatmanın önlenmesi, çeşitli muhayyerlik türleri, malların yolda karşılanması yasağı ve daha birçok uygulama ve yasak ile tüketici hakları korunmuştur. Ayrıca ahi teşkilatı, lonca teşkilatı gibi yarı resmi olarak ifade edilen teşkilatlar ve hisbe teşkilatı gibi İslam'ın ilk yıllarından beri var olan ve Osmanlı Devleti'nde kemal noktasına ulaşan resmi bir teşkilat ile tüketici hakları ve bu hakların korunması denetim altına alınmıştır."
