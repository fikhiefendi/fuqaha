abstract: "Furûk-u fıkhiyye, farklı hükümlerin verildiği benzer fıkhî meseleleri araştıran ve fıkhın bir alt disiplini olarak gelişen ilim dalıdır. Bu çalışmada furûk-u fıkhiyye hakkında bilgi verilmesi ve Şâfiî mezhebinde önemli bir yere hâiz olan İmâm Nevevî'nin Minhâcü't-Tâlibîn adlı eserinde yer alan farklı hükümlerin verildiği benzer meselelerin tespit ve tahlili amaçlanmıştır. Bu bağlamda furûk-u fıkhiyyenin kavramsal analizi, önemi, ilgili olduğu kavramlar ve tarihsel gelişimi üzerinde durulmuştur. Furûk-u fıkhiyye türü eserlerin telifinde takip edilen metotlar ve furûk-u fıkhiyye örneklerinde bulunması gereken nitelikler açıklanmaya çalışılmıştır. Yine Minhâcü't-Tâlibîn'de yer alan furûk-u fıkhiyye örnekleri tespit edilmeye çalışılmış ve bunlardan furûk-u fıkhiyye meselelerindeki mantaliteyi net bir şekilde ortaya koyacağına inandığımız furûk örnekleri tahlîl edilmiştir. İmâm Nevevî'nin Minhâcü't-Tâlibîn adlı eseri muhtasar bir eser olmasına rağmen çok sayıda furûk-u fıkhiyye örneği ihtiva etmektedir. Bu örneklerden tahlîl edilen doksan beş örnek incelendiğinde benzer meselelerin farklı hükümler almasında nas başta olmak üzere şerʻi delillerin yanında Arapçadaki gramer kurallarının ve kelimelerin semantik boyutunun etkili olduğu görülmektedir."
