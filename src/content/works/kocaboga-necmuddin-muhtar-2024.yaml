abstract: "Bazı insanlar ve kitaplar yaşadıkları ve yazıldıkları tarihî zaman sebebiyle kritik bir öneme sahiptir. Hiç şüphesiz Ebüʼr-Recâ Necmüddîn ez-Zâhidî ve Kunyetüʼl-Münye eseri de bunlar arasında yer almaktadır. Moğolların İslam topraklarına düzenledikleri saldırılar sebebiyle birçok alim şehit edilmiş ve birçok eser kayıplara karışmıştır. Zâhidî kaybolmaya yüz tutmuş bir birikimi kendinden sonraki nesillere aktaran bir köprü görevini başarıyla yerine getirmiştir. Onun eserlerinde yaptığı atıflar sayesinde günümüze ulaşması pek zor olacak birçok mesele kayıt altına alınmıştır. Hocasının Münyetüʼl-fukahâ eserinden seçmeler yaparak oluşturduğu Kunye kitabının ülkemizde yüzlerce yazma nüshasının bulunması, Zâhidîʼnin bu eserinin tarihte ve bölgemizde ne kadar yaygın bir referans kaynağı olduğunu göstermesi için yeterli olduğu düşünülmektedir. Böylesi bir eserin kütüphanelerin tozlu raflarının içinden çıkarıp okuyucuların istifadesine sunmak için Kunyetüʼl-Münye kitabını tercih ettik. Eser bir yüksek lisans tezinin sınırlarını aşacağı için eserin Büyû', Şüf'a, Kısmet, İcârât ve Edebü'l-Kâdî bölümlerinin edisyon kritiği ile yetinilmiştir. Zâhidîʼnin hayatı, ilmi kişiliği, itikadî görüşü, alimlerin övgüleri, hocaları, öğrencileri ve eserleri birinci bölümde detaylı bir şekilde ele alınmıştır. İkinci bölümde Kunyetüʼl-Münye kitabının müellife aidiyeti tespit edilip eserin muhtevası, Hidâye kitabı ile karşılaştırılmıştır.. Edisyon kritği yapılan yerler okunup çıkarım yapılarak Zâhidîʼnin metodu okuyucuların dikkatine sunulmuştur. Zâhidîʼnin kitapta kullandığı kaynaklar tespit edilip tanıtımları yapıldıktan sonra Kunyeʼnin Hanefi mezhebi içindeki yeri, önemi ve kitabın gayr-ı muteber eserlerden sayılmasıyla ilgili değerlendirme, İbn Âbidîn örnek alınarak araştırılmıştır. Mezhep içinde Kunyeʼye yapılan atıflar belirtildikten sonra eserin yazma nüshaları tespit edilip tahkikte kullanılacak nüshalar belirlenmiştir. Tahkikte takip edilen yöntem ele alındıktan sonra üçüncü bölümde kitabın ilgili yerlerinin Arapça kısmının edisyon kritiği yapılmıştır."
