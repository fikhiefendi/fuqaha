abstract: "Bu çalışma, İslam dininde hadım etme (kısırlaştırma) konusunu Kur'an, Hadisler ve İslam hukukçularının görüşleri çerçevesinde ele almaktadır. İslam'ın yaratılışa ve bedensel bütünlüğe verdiği önem doğrultusunda, hadım etme işlemi insan hakları ve etik ilkeler ışığında incelenmiştir. Kur'an-ı Kerim'de doğrudan hadım etme ile ilgili bir hüküm bulunmamakla birlikte, yaratılışa müdahale ve bedensel bütünlüğün korunması prensipleri, hadım etmenin yasaklanmasını destekler. Peygamber Muhammed (sav), hadislerinde hadım olmayı açıkça yasaklamış ve cinsel arzuların kontrol altına alınması için oruç tutmayı tavsiye etmiştir. İslam hukukçuları, insanın hadım edilmesini yaratılışa müdahale ve kişisel hakların ihlali olarak gördüklerinden genellikle haram olarak kabul ederler. Kur'an'da hayvanların hadım edilmesi hakkında doğrudan bir hüküm bulunmamakla birlikte, Peygamber Efendimiz'in sünneti ve hadisler, hayvanlara iyi davranmayı ve onlara gereksiz yere acı çektirmemeyi öğütler. İslam hukukçuları arasında, hayvanların insanların yararına olacak şekilde hadım edilmesi kabul edilebilir görülmekte, ancak bu işlemin hayvanlara gereksiz acı çektirmemesi gerektiği vurgulanmaktadır. İslam, insan hakları ve bedensel bütünlük ilkelerine büyük önem verir. Hadım etmenin insan onurunu zedelemesi ve bedensel bütünlüğünü bozması nedeniyle yasaklanmış olması, yaratılışa saygı ve insan haklarının korunması prensiplerine dayanır. Hayvanların hadım edilmesi ise, onların yaşam kalitesini artırmak amacıyla kabul edilebilir olarak görülmekte, ancak bu işlemin etik ve insancıl bir şekilde yapılması gerektiği belirtilmektedir. İslam'da hadım etme, insan onuru, bedensel bütünlük ve yaratılışa saygı prensipleri doğrultusunda ele alınır. İnsanın hadım edilmesi yasaklanırken, hayvanların hadım edilmesi belirli koşullar altında kabul edilebilir görülmektedir. Bu çalışma, İslam'ın genel etik ve ahlaki ilkeleri ışığında hadım etme konusunu değerlendirir ve bu işlemlerin dikkatle ele alınması gerektiğini vurgular."
