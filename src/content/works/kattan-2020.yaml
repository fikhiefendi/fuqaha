abstract: "Bu tez Hicri 12. Asırda yaşamış Şeyh İbrahim B. Mustafa el-Halebi el-Mezari isimli bir müellifin“Dürrü'l-Muhtar”üzerine yazdığı“Tuhfetü'l-Ahyar Ala'd-Dürri'l-Muhtar”isimli eserinin yazma nüshasının ilmi tahkik ve incelenmesinden ibarettir. Bu tezinin bir ehemmiyeti de, tahkik edilen kitabın Osmanlı Devleti Payitahtından ve Mısır Diyarının Şeyhlerinden olan büyük bir alim tarafından telif edilmesidir. Ayrıca“Tuhfetü'l-Ahyar”Kitabı Alaüddin el-Haskefinin“Dürrü'l-Muhtar şerhi Tenviri'l-Ebsar”kitabı üzerine yazılan ilk haşiyelerden birdir.“Dürrü'l-Muhtar”kitabı Hanefi mezhebinde kendinden sonra gelen müteahhir alimler tarafından bir ana kitap ve asıl sayılmış, fıkıh kaynaklarından biri olarak itibar görmüştür. Bu sebeple tahkik ehli bir çok alim Hanefi Mezhebinin Umdesi mesabesinde gördükleri bu eser ile özel olarak ilgilenmişler ve ondan faydalanmak ve istifade etmek için gayret göstermişlerdir. Şeyh İbrahim el-Halebi de bu Haşiyesinde anlaşılması kolay olsun ve mana doğru şekilde anlaşılsın diye“Dürr”kitabının meselelerini tahkik edip incelemiş, illet ve istidlal açısından değerlendirmiş, eleştirilerini ve düzeltmelerini zikretmiş, ayrıca kitabı izah etmeye şerh edip açıklamaya, ıstılahlarını tanıtmaya, ibarelerini düzeltmeye gayret göstermiştir. Bu tezinin tahkikinde iki yazma eser nüshası ile mukabele edilmiş ve bir asıl nüshası üzerine itimat edilmiştir. Ayrıca Ayetlerin yerleri belirtilmiş, Hadislerin tahrici yapılmış, müellifin zikrettiği nakiller ve eserlerin sağlaması ve tevsiki, ismi geçen kişilerin kısa biyografileri zikredilmiştir. Başında Müellifin Hayatı ve sonrasında özet bir şekilde kitapta geçen kaynaklar belirtilmiş noktalama ve rakamlandırma işaretleri münasip yerler konulmuş, anlaşılması zor kelimeler ve fıkhi ıstılahlar açıklanmış ve ilmi bir tahkikte yapılması gereken şeyler yapılmıştır. Ve bu kitap için inceleme olarak hazırladığımız Dirase'de“Tenvirü'l-Ebsar”metninin ve“Dürrü'l-Muhtar”kitaplarının müelliflerinin ilmi şahsiyetlerinden ve ilmi menheclerine, önemli kaynaklarını açığa çıkaran kısa bir çalışma da yaptık. Yüce olan Allah Celle Cellalühü'den İhlas ve kabul dilerim. Anahtar kelimler: Fıkh, Furu' fıkh, Haşiye, Metin, İbrahim el-Halebi,“Tuhfetü'l-Ahyar”,“Dürrü'l-Muhtar”, Mahtut/Yazma Eser, Tahkik, Dirase/İnceleme"
