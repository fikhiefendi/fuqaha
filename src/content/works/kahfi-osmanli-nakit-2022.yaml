abstract: "Endonezya, en büyük nüfusa sahip Müslüman ülke olarak vakıf gelişimi için çok büyük bir potansiyele sahiptir. Kitlesel olarak geliştirilebilecek bir yön, maksimize edilebildiği takdirde çok geniş bir fayda kapsamına sahip olan nakit vakfıdır. Bununla birlikte, bu potansiyel çeşitli nedenlerle optimal olarak maksimize edilememiştir. Bu potansiyeli en üst düzeye çıkarmak için nakit vakfı düzgün, etkin ve şeffaf bir şekilde yönetilmelidir. Bu araştırmanın amacı, Osmanlı döneminde ve Endonezya'da nakit vakıflarının yönetimini incelemek ve değerlendirmektir. Bu araştırma, literatürdeki bulgulara dayalı olarak olguyu açıklamaya çalışan nitel araştırmadır. Osmanlı döneminde ve Endonezya'da nakit vakıf yönetimini analiz etmeyi ve değerlendirmeyi kolaylaştırmak için bu araştırmada nakit vakıf yönetimini kaynak yaratma yönetimi, geliştirme yönetimi, kullanım yönetimi ve raporlama yönetimi olmak üzere dört kategoride sınıflandırmaktadır. Bu araştırma, Osmanlı döneminde para vakıflarının kitlesel olarak geliştiğini ve hem ekonominin iyileştirilmesi hem de toplumun refahı için büyük faydalar sağladığını ortaya koymaktadır. Endonezya'da para vakıflarının yönetimi yeni bir konu olarak sınıflandırılmaktadır ve 2004 Tarihli 41 Sayılı Vakıflar Kanununda düzenlenmiştir ve hala geliştirilmesi oldukça mümkündür. Bu araştırmada, Endonezya'da nakit vakıf yönetiminin ekonomik kalkınma ve toplum refahı üzerinde de faydaları olduğu, ancak vakıf varlıklarının yönetiminin Osmanlı dönemindeki yönetime göre esnek ve çeşitli olmadığı için maksimize edilmediği tespit edilmiştir."
