abstract: "Aile toplumun temelidir ve nikâh akdi ile kurulan bir kurumdur. Her toplumun ve hukuk sisteminin bir aile anlayışı vardır. Biz bu çalışmamızda Güneydoğulu bir âlim olan Şeyh Abdurrahman eş-Şâviri?nin hayatı, ilmi şahsiyeti ve İslam aile hukukunda evlenme ile ilgili konuların yer aldığı ?Nehcu?n-necâh fi âhkâmî?n-nikâh? isimli eserin ilmi kritiğini yapmaya çalıştık.Ayrıca çalışmamızda eş-Şâvirî?nin eserinde yer alan nikâhla ilgli nikâh akdinde kullanılan lafızlar, küçüklerin evlendirilmesi, evlilikte denklik ve evlenmede velâyet gibi bazı önemli konuların günümüz açısından bir değerlendirmesini yaptık."
