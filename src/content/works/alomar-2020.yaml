abstract: "Bu çalışmanın amacı, Türkiye'deki Sukuk'un durumunu netleştirmeyi ve uygulamasında olumlu ve olumsuz yönleri göstermenin yanı sıra, İslami Şeriat hükümlerine ve ekonomik ve sosyal etkinliğine ne ölçüde uyduğunu tespit etmeyi amaçlamaktadır. doğa özellikleri türlerini ve dünyadaki durumunu belirledikten sonra yapılır. Türkiye, İslam konseyleri tarafından verilen kararlar ve periyodik raporlar ve TC Hazine ve Maliye Bakanlığı ve banka raporları tarafından verilen ihtiyati hukuk kararları için seçilmiştir.. Çalışma ayrıca, Türk hükümetinin mevcut sukuk geliştirme ve altın esaslı sukuk verme gibi yeni mekanizmalar oluşturma konusundaki amansız çabalarını göstermektedir. Hindiyi bu çalışma için bir model olarak tahsis etme fikri, Türkiye;nin dünya ekonomisindeki artan rolünün yanı sıra, İslami dünyanın dikkatini verimli bir ekonomik çevre ve İslami finans endüstrisini güçlendirmek için Türk Devletine yönlendirmenin bir sonucudur."
