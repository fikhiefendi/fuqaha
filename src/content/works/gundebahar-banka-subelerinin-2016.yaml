abstract: "Bu araştırma ile insansız şube olarak adlandırılan ve hiçbir işgücünün banka şube lokasyonunda çalışmadığı şubelerin etkinliği ve verimliliği ile geleneksel banka şubelerinin etkinliği ve verimliliği karşılaştırılacaktır. Banka şubeleri; banka gelirlerinin, etkinliklerinin ve banka müşteri tabanlarının büyümesinde önemli görevleri bulunmaktadırlar. Teknolojinin gelişimi ile banka şubelerine olan ihtiyaç azalsa da günümüzde banka şubelerine olan ihtiyaç halen kaçınılmazdır. Şubeler halen bankaların en çok masraf yaptıkları alandır. Şube ekseninde bankaların temel konsantrasyonu şube maliyetlerinin azaltılmasına yöneliktir ve şubelerdeki en büyük maliyet faktörü ise işgücüdür. Günümüzde geleneksel banka şube işlemlerini yapabilen ve şube lokasyonunda hiçbir personelin çalışmadığı,“insansız banka şubeleri”olarak adlandırılan, teknoloji şubeleri bulunmaktadır. Bu çalışmanın amacı, insansız şubeler için bir etkinlik ölçüm modeli geliştirmektir, geleneksel banka şubelerini, bankaların kullandıkları alternatif dağıtım kanalları ve insansız şubeleri Veri Zarflama Analizi ile karşılaştırma yaparak bir karar aracı sunmaktır."
