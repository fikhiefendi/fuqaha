abstract: "1970 yıllarında yaşanan enerji krizi, enerji sektöründe dışa bağımlı bulunan ülkelerin enerji korunumunu ön plana çıkarmasına sebep olmuştur. Dolayısıyla doğal çevreye en az zarar veren, hali hazırda bulunan enerji kaynaklarının kullanımını düşürme metotlarına, yenilenebilir, aynı zamanda alternatif enerji kaynaklarının yaygınlaştırılmasına yönelik araştırma ve çalışmalar yapılmıştır. Çevre sorunları sonucunda ortaya konan bu çalışmalar 18. yüzyılda sürdürülebilirlik kavramı, sürdürülebilir yapı tasarımı ve ilkelerini ortaya çıkarmıştır. Sürdürülebilirliğin temel faktörlerinden biri olan enerji etkin yapı tasarımı ve parametreleri ardından konfor koşulları ile ilgili konular araştırmalar arasında yerini almıştır. Günümüzde yapı sektöründe oldukça büyük değişimler olmaktadır. Dijital inovasyon, yapıların proje iş akışının birçok evresini geleneksel çalışma yöntemlerinden modern çalışma yöntemlerine dönüştürmeye başlamıştır. Birçok ülkede yapı tasarlamak için resmi olarak tanımlanmış bir aşama süreci bulunmaktadır fakat yapı tasarımı strateji ve yöntemleri ile birlikte aşamalar halinde uygulanmamaktadır. Bu sebeple yapının tasarım süreci boyunca üstleneceği fonksiyonları belirlemek ve aşamalar halinde uygulamak için gerekli çalışmaların yapılmasının önemi ortaya çıkmıştır. Tez kapsamında incelenen RIBA Çalışma Planı, projelerin genel olarak tasarım aşamasındaki karmaşıklığını ortadan kaldırmak, değişen enerji ve konfor şartlarını tasarım aşamasında değerlendirmek aynı zamanda talep edilen tasarım kararlarını ve isteklerini projeye entegre etmek için ortaya çıkmıştır. Bu yaklaşım, sürdürülebilir mimari tasarım ilkelerini, enerji etkin yapı tasarımı ve fiziksel konfor koşulları parametrelerini RIBA Çalışma Planına yerleştirirken, enerji hedeflerinin, ilkelerinin ve sürdürülebilirlik stratejilerinin doğru aşamalarda uygulandığı takdirde sürdürülebilir bir yapı ortaya çıkarılabileceğini öne sürmektedir. Çalışma kapsamında giriş bölümünde tezin amacı, tezin kapsamı ve tez çalışması esansında uygulanan yöntemden bahsedilmektedir. İkinci bölümünde Sürdürülebilirlik ve Sürdürülebilir Mimari Tasarım İlkeleri ilgili kaynaklar incelenmiştir. Tez çalışmasının üçüncü bölümünde ise Enerji Etkin Yapı Tasarımı ve İlkeleri başlığı altında tasarım parametrelerinin literatür incelemesi yardımı ile ulaşılan tez kapsamında kullanılacak olan veriler sunulmuştur. Tez çalışmasındaki dördüncü bölümde yapılarda Fiziksel Konfor Koşulları incelenerek görsel, işitsel, ısısal ve hijyenik konfor koşulları ele alınıp literatür taraması yapılmıştır. Tezin kapsamı açısından önemli bir konu olan RIBA Çalışma Planı, aşamaları ve stratejileri ise beşinci bölümde aktarılmıştır. Tez kapsamında sonuç olarak sürdürülebilir yapı tasarımı aşamalarında, yasa ve yönetmeliklerle uygulanan yapım veya tasarım süreçleri için bir çalışma alt yapısı olabilecek şemalara ihtiyaç duyulduğu gözlemlenmektedir. Bu şemalar ülkesel şartlara ve çevresel koşullara elverişli olarak sosyal ve ekonomik değerlendirme koşullarını kapsayarak sistematize edilmelidir. Günümüzde iyi bir uygulama örneği olarak RIBA Çalışma Planı gösterilebilir. Yapılan çalışma ile yapı tasarımı parametrelerinin tasarımcılar ve mimarlar tarafından RIBA Çalışma Planı Aşamaları doğrultusunda planlama ve uygulamaya dâhil edilmesi, süreci çok daha sistemli hale getirerek varılmak istenen sonuca ulaştırdığı görülmektedir."
