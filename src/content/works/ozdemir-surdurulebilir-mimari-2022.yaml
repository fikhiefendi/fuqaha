title: "Sürdürülebilir Mimari ve Enerji Etkin Yapı Tasarımı İlkelerinin Fiziksel Konfor Koşulları ile Birlikte RIBA Çalışma Planı İçerisinde Değerlendirilmesi"
titleTranslation: {"en": "Evaluation of sustainable architectural and energy efficient building design principles with physical comfort conditions in RIBA plan of work"}
