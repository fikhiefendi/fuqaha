abstract: "Fıkıh usûlü, kendisi ile İslâm hukukunun üretildiği kaideler haline gelen asıllardan oluşan özgün bir ilimdir. İslâm tarihinde, özellikle hükümlerin çıkarılmasına tatbik edilmiş ve meşhur olmuştur. Müspet bilimlerde matematik ve mantık ilmi hangi öncelik ve öneme sahipse, fıkıh usûlü bunları da kapsayarak İslâm ilimleri arasında aynı konumdadır. Geliştirilebilir ve her bilimin alanına kolayca tatbik edilebilir özelliğine sahip aklî ilimlerdendir. Dünya, biri doğu diğeri batı olmak üzere iki hukuk anlayışına sahiptir. Kudüs-Mekke ekseninde gelişmiş olan doğu hukuk anlayışına temel teşkil eden esaslar ki kısaca Sâmî hukuk sistemi denmektedir. Atina-Roma ekseninde gelişmiş olan batı hukuk anlayışına temel teşkil eden esaslara da Ârî hukuk anhyjşj^^d^nmfiktedir. Her iki anlayışın kendilerine özgü felsefeleri mevcuttur. Bununla birlikte doğu hukuk anlayışının tarih bakımından en son halkasında delil olarak yer alan sabit metin Kur'an-ı Kerim vasıtasıyla, batı kültürünün yabancısı olduğu bir metot geliştirmiştir. İşte bu metot, doğu kültürüne özgü bir bilim olarak fıkh usûlü diye isimlendirilmektedir. Fıkh usûlü başlangıçta, ilahi mesajlar içeren metin olan Kur'an-ı Kerim'in doğru anlaşılması ve yorumlanması için zamanındaki kendi dışında kalan kültürlerin etkisinden uzak bir şekilde ortaya çıkmıştır. Erken devirde yazılan Muhammed JKjdrjş.\"eş-Şâfi'î'nin er-RisaleJsij, fıkıh usûlü ilminin, üzerinde filizlendiği temel eserdir. Zamanla, İslâmiyet'in yayıldığı coğrafyanın genişlemesi nedeniyle farklı düşüncelerle karşılaşılmış ve yeni sentezler oluşturulmuştur. XIX. asra gelindiğinde genelde İslâm dünyası özelde Osmanlı Devleti 'nde fıkıh usûlü alanında öncekilerin tekrarı olan eserler kaleme alınmıştır. Bunun yanında bazı ilim adamları tarafından da bu konuyu tartışmaya açan makaleler yazılarak gündeme taşınmıştır. Böylece fıkıh usûlü ilminin, başlangıçta oynadığı aktif rolünü kazanmasına gayret gösterilmiştir. Bunların kritik edilerek gün yüzüne çıkarılmasının Türk ilim hayatma katkı sağlayacağı bir gerçektir. Cumhuriyetin kuruluşuna fikrî altyapı sağladığı kanaatine vardığımız bu dönem fıkıh usûlü alanında yapılan çalışmalar açısından aydınlatılmaya çalışılmıştır. >"
