abstract: "İslam ülkelerinde ve diğer ülkelerde mali işlemlerle ilgili teknolojik gelişmeler hızlanıp yayılmakta ve finansal teknolojiye dayalı akitler çeşitlenmektedir. Dolayısıyla bu çalışma, muâvazalı akitlerde elektronik kabz kavramını tanımlamayı, İslam hukukundaki uygulamalarını ve bu akitlerin İslami ilke ve kurallarla ne ölçüde uyumlu olduğunu netleştirmeyi amaçlamaktadır. Araştırmanın hedefine ulaşması maksadıyla akit ve türleri, kabz mekanizmaları ve modern uygulamaları ile ilgili literatürün çoğunu incelemek için tümevarımcı yaklaşım benimsenmiş, ardından akitlerde elektronik kabz uygulamalarını İslam hukuku açısından incelemek için analitik yöntem takip edilmiştir. Bu çalışmada elektronik kabzın fıkhi ve kanuni kökeni ve çağdaş örnekleri, teknolojik gelişmeler ışığında elektronik kabzın kuralları, örnekleri ve biçimleriyle elektronik paranın nasıl kabzedileceği konularına odaklanılmış; ayrıca elektronik sarf, elektronik selem ve elektronik banka tahvilleri gibi yeni ortaya çıkan bazı işlemlere elektronik kabz hükümleri uygulanmıştır. Aynı zamanda çalışma; alışverişlerde, sarf akitlerinde, kredili satışlarda, selem, istisnâ', icare akdi ve diğerlerinde kabz konusunu ele alma yönüyle ön plana çıkmıştır."
