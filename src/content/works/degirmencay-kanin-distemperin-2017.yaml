abstract: "ÖZET Kanin Distemperin Tedavisinde Antiviral Kullanımının Klinik Bulgular, Hematolojik ve Biyokimyasal Parametreler ve Viral Saçılım Üzerine Etkilerinin Değerlendirilmesi Amaç: Kanin distemper dünyada ve ülkemizde özellikle aşısız yavru köpeklerde yaygın olarak görülen viral bir hastalıktır. Spesifik bir tedavisi olmayıp, klinik olarak doğal enfekte köpeklerde tedavide antiviral kullanımı ile ilgili çalışma sayısı da yok denecek kadar azdır. Bu nedenle bu çalışmada kanin distemper'in tedavisinde klasik sağaltıma ilave olarak kullanılan antivirallerin klinik bulgular, hematolojik ve biyokimyasal parametreler ile viral saçılım üzerine etkilerinin değerlendirilmesi amaçlanmıştır. Materyal ve Metot: Bu çalışmada 24 distemperli ve 6 sağlıklı olmak üzere toplam 30 köpek kullanıldı. Kesin tanı PZR testi ile yapıldı. Distemper'li köpekler 6'şarlı 4 gruba ayrıldı. A grubundaki köpeklere 10 gün süreyle klasik tedavi (ringer laktat+dekstroz+% 0.9 NaCI, amoksisilin+klavulanik asit) uygulandı. A+R grubundaki köpeklere 10 gün süreyle klasik tedaviye ilave olarak 30 mg/kg dozda ribavirin uygulandı. A+P grubundaki köpeklere 10 gün süreyle klasik tedaviye ilave olarak 10 mg/kg dozda proanthocyanidin uygulandı. A+R+P grubundaki köpeklere ise 10 gün süreyle klasik tedaviye ilave olarak 30 mg/kg dozda ribavirin ve 10 mg/kg dozda proanthocyanidin uygulandı. Çalışma gruplarındaki köpeklerden tedavinin 0., 3., 7. ve 10. günlerinde kan ve swap örnekleri alındı ve semptomlar ayrıntılı olarak kaydedildi. Gruplarda 0., 3., 7. ve 10. günlerde klinik bulgular, hematolojik ve biyokimyasal parametreler ve 0., 7. ve 10. günlerde ve tedavi sonrası 5. ve 10. günlerde ise viral saçılım değerlendirildi. Bulgular: Toplam klinik iyileşme skorları sırasıyla A+P (182), A+R (188), A (244) ve A+R+P (349) olarak bulundu. En iyi klinik iyileşme proanthocyanidin uygulanan A+P grubunda belirlendi. Tedavi öncesi ve süresince tüm gruplarda lenfosit sayılarında düşüklük dikkati çekti. Tüm gruplarda tedavi süresince eritrosit, hemoglobin ve hematokrit değerlerde sayısal azalmalar saptandı. A+P grubunda total lökosit ve nötrofil sayılarında önemli artış belirlendi. A+R grubunda ise total lökosit, nötrofil ve monosit sayılarında azalma oldu. Grupların hepsinde tedavi öncesi ve tedavi süresince albümin düzeylerinde bir azalma belirlendi. A+R ve A+P gruplarında kreatinin düzeyinde artma, kolesterol düzeyinde ise azalma olduğu görüldü. Tedavinin 7. gününde swap ve lökosit örneklerinde en fazla CDV Ag negatif saptanan grup A+R grubu oldu. Tedavi sonrası 10. günde sadece A+R ve A+P gruplarındaki 2'şer köpekte viral saçılımın olmadığı görüldü. Sonuç: Kanin distemperin tedavisinde klasik sağaltıma ilave olarak kullanılan ribavirin ve proanthocyanidin uygulamalarının klinik bulguların şiddetini, mortaliteyi ve viral saçılımı azaltarak hayatta kalma oranlarını artırdığı belirlendi. Klinik skor, hematolojik ve biyokimyasal bulgular ve hayatta kalma oranları bakımından en iyi sonuç proanthocyanidin uygulanan grupta elde edilirken viral saçılım bulguları dikkate alındığında en iyi sonuç ribavirin uygulanan grupta elde edildi. Ribavirin ve proanthocyanidin kullanımının kanin distemperin tedavisinde olumlu etkilerinin olduğu anlaşıldı."
