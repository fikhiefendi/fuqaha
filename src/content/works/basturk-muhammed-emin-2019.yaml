abstract: "Çalışmada Reddu'l-Muhtâr adlı eserin nahiv uygulamaları ele alınmıştır. Eserin nahvî kaynakları ve İbn Âbidîn'in edebî analizleri tespit ve tertip edilmiş, böylece onun nahiv ilmiyle alakalı açıklama ve söylemleri ön plana çıkartılarak, fakih ve usûlcü tarafının yanı sıra edebî yönü gösterilmeye çalışılmıştır. Araştırmada İbn Âbidîn'in edebî yönüne dikkat çekme, dil-nahiv bilgisinin önemi ortaya koyma ve nahiv kurallarının teorik yanını, Reddu'l-Muhtâr üzerinde tatbik edilmiş halini gösterme hedeflenmiştir. Araştırma iki bölümden oluşmaktadır. Birinci bölümde Muhammed Emin İbn Âbidîn'in doğumu ve nesebi, eğitim hayatı, kişilik ve şahsiyeti, hocaları, öğrencileri ve eserde ismi geçen nahiv âlimleri, kitapları, görüşlerinden bahsedilmiştir. İkinci bölümde Reddu'l-Muhtâr'daki nahiv uygulamalarından merfu', mansûb ve mecrûr bölümleri incelenmiştir."
