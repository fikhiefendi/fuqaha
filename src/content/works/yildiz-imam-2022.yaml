abstract: "Bu tezin amacı Hanefî mezhebinin kurucusu olan İmâm Ebû Hanife ile mezhebin oluşumunda önemli bir paya sahip olan ve mezhep bilginlerince İmâmeyn olarak bilinen İmâm Ebû Yusuf ve İmâm Muhammed arasındaki fer'i ihtilaflar olduğu gibi usûlî ihtilafların var olup olmadığını ve sınırlarının ne olduğunu ortaya koymaktır. Zira İmâm ile İmâmeyn arasında fürû fıkhın birçok meselesinde ihtilaf olduğu bilinmektedir. Bu sebeple biz de bu çalışmamızla mezhebin müteahirin fıkıhçıları tarafından \"eimmetünâ es-selâse\" terkibiyle bilinen bu İmâmların fer'i ihtilaflarının sebeplerini araştırıp bu ihtilafların usûlî bir yansımasının olup olmadığını ortaya koymayı hedefledik. Birinci bölümde mezhebin doğuşunu, gelişimini ve İmâmeyn'in mezhep içerisindeki rolünü ele aldık. İkinci bölümde İmâm ile İmâmeyn'in muamelat ile ilgili ihtilaflarını gerekçeleriyle birlikte zikrettik. Yaptığımız araştırmanın neticesinde, Hanefî mezhebinin Kurucusu İmâm-ı Âzam'ın eğitim ve öğretimde klasik metodun aksine meseleleri eleştirel bakış açısıyla ele alıp konu hakkında hüküm vermeden önce öğrencilerinin istişaresine sunduğunu ve kendi görüşünü kabul etmesi için öğrencilerini zorlamadığını tam aksine herkesin kendi görüşünü ifade etmesi için teşvik ettiği sonucuna vardık. Bu özgür eğitim ve öğretim sonucunda mezhep içerisinde birçok ihtilafın olduğu ancak bu ihtilafların çoğunun usûlî olmadığı çok azının ise usûlî olabileceği kanaatine vardık."
