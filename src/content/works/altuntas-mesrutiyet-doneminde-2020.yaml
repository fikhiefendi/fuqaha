abstract: "Osmanlıda“anayasalı ve meclisli saltanat-hilafet rejimi”olarak tanımlanan meşrutiyet kelimesi genel olarak 1876 ve 1922 yılları arasındaki dönem olarak ifade edilmiştir. Ayrıca 1876'dan 1878 yılına kadar ki dönem I. Meşrutiyet, 1908'den 1922 yılına kadarki dönem II. Meşrutiyet olarak sınıflandırılmıştır. Tanzimat döneminde temelleri atılan yenileşme ve modernleşme düşüncelerinin yavaş yavaş filizlendiği I. Meşrutiyet döneminde tartışmaların çok yoğun olmadığı hararetli tartışmaların II. meşrutiyet dönemine saklandığı görülmüştür. Bu sebeple de tezimizin ana konusunu II. Meşrutiyet dönemi ve bu dönemde yapılan tartışmalar oluşturmaktadır. II. Meşrutiyet dönemi içerisinde yapılan tartışmaların modernleşme ve feminizmin etkisiyle daha çok kadın üzerinden yapıldığı, kadının hak ve adalet arayışı içerisinde olduğu görülmüştür. Tartışmaların dönemin gazete ve dergileri üzerinde yapılmış olması moderniteden en çok aristokrat kesimin etkilendiğini göstermektedir. Kanun ve kararnamelere baktığımız zaman ise dönemi içerisinde hangi fikir akımı etkili ise onun düşüncelerinin kanun maddeleri arasında yer aldığı görülmektedir. Ayrıca günümüz dünyasında da hala bu dönemin fikir akımlarının etkisinin devam ettiği inkâr edilemez bir gerçektir. Bu çalışmada Osmanlıyı toplumsal, ekonomik, ailevi ve dini konular başta olmak üzere ilmi perspektifden bakıp incelemek amacıyla; Meşrutiyet Döneminde yaşanılan yoğun tartışmaların, din-hukuk ilişkisi içerisinde incelemesi yapılmıştır. İslam aile hukuku (nikâh ve talak) eksenli yapılan tartışmalara yer verilmiş, ayrıca yapılan tartışmaların kararname ve kanunlara yansıyıp yansımadığı da incelenerek hukuksal zemin üzerinde tartışılmıştır. Çalışmamız kapsamında tümdengelim tekniğiyle araştırma yapılmış olup bilimsel araştırma yöntem ve teknikleri kullanılmıştır. Dönemi içerisinde tartışılan konular daha çok modernleşme etrafında şekillendiği için sosyoloji bilim dalının verilerinden faydalanma yoluna gidilmiş ve bu vesileyle de disiplinler arası zeminde de istifade edilebilir düzeyde çalışma ve araştırma yapılmıştır."
