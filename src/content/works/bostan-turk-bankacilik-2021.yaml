abstract: "Bankacılık sektörü finansal sistem içerisinde üstlendiği aracılık rolü ile reel sektörün gelişmesine katkı sağlamakla birlikte ülke ekonomisinin önemli yapı taşlarından birisini oluşturmaktadır. Katılım bankaları mevduat bankaları gibi bankacılık sektöründeki yoğun rekabet ortamında müşterilerine en iyi hizmeti sunmaya çalışırken maliyetlerini azaltmayı ve kârlarını yükseltmeyi amaçlamaktadırlar. Katılım bankalarının sürdürülebilir büyüme hedeflerini gerçekleştirebilmeleri için finansal performans yönetiminin başarı ile yürütülmesi önemlidir. Bu çalışmamızın amacı, Türk bankacılık sektöründe faaliyet gösteren katılım bankalarının 22 adet kârlılık ve maliyet rasyoları kullanılarak finansal performanslarının çok kriterli karar verme tekniklerinden ENTROPİ, TOPSIS ve VIKOR yöntemleriyle analiz edilmesidir. Uygulama aşamasında 6 ana kriter literatür araştırması sonucu en çok kullanılan aktif rasyosu, sermaye yeterliliği, likidite, bilanço yapısı, gelir-gider yapısı ve kârlılık rasyolarından belirlenmiş olup ana kriter ve alt kriter ağırlıkları ENTROPİ yöntemiyle belirlenmiştir. Kriter ağırlıkları belirlendikten sonra katılım bankalarının yıllar itibariyle performans değerlendirmeleri TOPSİS ve VİKOR yöntemleri kullanılarak yapılmıştır. Çalışmamızda 2017-2019 yılları arasında faaliyet gösteren 2 kamu sermayeli ve 3 özel sermayeli katılım bankalarının performansları değerlendirilmiştir."
