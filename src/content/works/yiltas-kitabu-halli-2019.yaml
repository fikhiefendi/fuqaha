abstract: "Şehzade Korkud'un fıkhi anlayışının izaha kavuşması sonucunda Osmanlı hanedanının fıkıh ilmine katkısı ve Osmanlı dönemi fıkıh tarihinin anlaşılması açısından büyük önem arz etmektedir. Şehzade Korkud'un kaleme aldığı eserlerden onun Şafii mezhebi çizgisini takip ettiği bu mezhep literatürüne yaptığı yoğun atıflar ve Şafii mezhebi çevresinden gösterdiği delillerden anlaşılmaktadır. Nitekim Şehzade Korkud, Osmanlı hanedan üyelerinden Şafii mezhebini benimseyen tek kişi olarak bilinmektedir. Bu çalışmada Şehzade Korkud'un mezhep değişikliğinin eserlerine ve fikirlerine yansımasının boyutları üç bölüm halinde incelenmiştir. İlk bölümde Şehzade Korkud'un hayatı ve eserleri üzerinde durulmuştur. Şehzade Korkud, saltanat makamından ve idari işlerden uzak durmak istediğini her fırsatta dile getirmiştir. Ancak yasa haline gelen kardeş katli teamülünün bir sonucu olarak da padişah olma yollarını denemekten geri durmamıştır. Şehzade Korkud, diğer Osmanlı sultanları gibi divanı olmakla beraber İslami ilimler alanında eser veren tek hanedan üyesidir. İkinci bölümde Şehzade Korkud'un Osmanlı dönemi ganimet ve cariye hukukuna dair eleştirileri meseleler halinde ele alınmıştır. Korkud, o dönemde ganimet ve cariyelik konusunda şer'i hükümlerin tatbik edilmediğini, Kitabu Halli İşkâli'l-Efkâr fî Hilli Emvâli'l-Küffâr adlı eserinde zikretmektedir. Üçüncü bölümde ise siyasete örf şüphesinin karışmasıyla siyasi ser'i hükümlerin terk edilmesi ve kardeş katli konusundaki Şehzade Korkud'un eleştirilerine meseleler halinde yer verilmiştir."
