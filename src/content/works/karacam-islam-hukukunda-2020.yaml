abstract: "Karz akdi İslam hukukunda yer alan çok yönlü bir akit çeşididir. Teberru özelliğinin yanı sıra sosyal yönü ile dayanışma ve yardımlaşmaya, üretime ve faizli işlemlerin azalmasına olumlu katkısı vardır. Bu sebeple tarihsel süreçte olduğu gibi günümüzde de uygulanabilmesi önemlidir. Bu çalışma yukarda bahsedilen düşünceler üzerine bir çözüm olması temennisi ile oluşturulmuştur. Böylece insanlık tarihinden beri muamelat işlemlerinde farklı uygulama şekilleri ile birlikte var olmuş karz akdinin İslâm hukukundaki yeri ve güncel bazı uygulama örnekleri incelenerek işlevselliğinin artırılması ve hukuk bilimine katkı sağlaması amaçlanmıştır. Giriş ve iki bölümden oluşan çalışmanın birinci bölümünde karz akdinin İslam hukukundaki yeri ve akdin hukuki çerçevesi ortaya konulmaya çalışılmış problematiğine dair bazı konular ile akdin bazı akidlerle mukayesesi incelenmiş Osmanlı para vakıflarına değinilmiştir. İkinci bölümde ise akdin günümüzdeki bazı uygulamaları, dünya ve Türkiye örnekleri, katılım bankalarındaki uygulamaları, İslami mikro finans konuları akdin kurumsal bazı uygulama modelleri incelenmiştir. Son bölümde karz akdine dair kanaatimiz olan bazı uygulama önerilerinde bulunup sonuç bölümündeki değerlendirmelerimiz ile çalışmamız sonlanmıştır."
