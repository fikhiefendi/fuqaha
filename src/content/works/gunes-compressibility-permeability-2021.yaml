abstract: "Cam, karbon ve aramid gibi yüksek performanslı iplikler kullanılarak çift yataklı örme makinelerinde örüldüklerinde esneyebilen, birbirine geçmeli ilmeklerden oluşan, üç boyutlu, gözenekli atkı örgülü kumaşlar çok sayıda teknik uygulama alanına sahiptir (örneğin rahat koruyucu giysi, kimyasal ve aleve dayanıklı filtre ortamı ve darbeye dayanıklı polimer matrisli kompozit malzeme). Bu kumaşların teknik uygulama alanlarındaki performansları, öncelikle örgü deseni (mimarisi) tarafından dikte edilen ve kumaşın hava geçirgenliği ile ölçülen kumaş gözenekliliğine (veya elyaf hacmi oranına) bağlıdır. Bu çalışmada 136 tex numaralı tek uçlu E-cam iplikten 3 kat kullanılarak 1x1, 2x2, İngiliz ve balıkçı ribana desenli atkı örme kumaşlar üretilmiştir. Kumaşları örmek için 5E incelikte manüel, düz, çift yataklı Brother KH 868 marka bir atkılı örme makinesi kullanılmıştır. Kumaşların kalınlığı (sıkıştırma ve gevşeme süreçleri esnasında), alansal yoğunluğu, sıra sıklığı, çubuk sıklığı, ilmek uzunluğu ve hava geçirgenliği ölçülmüştür. Örgü mimarisinin hava geçirgenliği ve sıkıştırılabilirlik ile kumaşın fiziksel özelliklerine etkileri incelenmiştir."
