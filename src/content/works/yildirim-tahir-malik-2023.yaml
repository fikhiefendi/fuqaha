abstract: "Daha Tahir Malik, polisiye roman türünde verdiği başarılı örneklerle Yeni Özbek edebiyatında önemli bir yere sahiptir. Yazarın“So'nggi O'q/Sonuncu Kurşun”adlı kıssası; 1922 yılından 1957 yılına kadarki otuz beş yıllık süreçte Sovyet rejiminin Lenin ve Stalin dönemlerinde Özbekistan'da yaşanan baskı, sürgün, zulüm ve katliamları polisiye bir kurguyla gerçek kişilerin trajedileri üzerinden anlattığı eseridir.“Sonuncu Kurşun”kıssası bu yönüyle Özbekistan'da oldukça ses getirmiştir. Türkiye'de Tahir Malik'in eserlerinden“Jinoyatin Uzun Yo'li/Suçun Uzun Yolu”,“Ov/Av”ve“Şaytanat/Şeytanlar”romanın I.cildi üzerine çalışma yapılmıştır. Söz konusu çalışmalarda eserlerin edebî yönden incelenmediği fark edilmiştir. Dolayısıyla Tahir Malik'in Türkiye'de edebî yönden incelenen eseri bulunmadığı için“Sonuncu Kurşun”kıssası Türkiye Türkçesine aktarılıp edebî açıdan yapı izlek yöntemiyle incelenecektir. Çalışmanın giriş bölümünde Ekim Devrimi'nin Özbekistan'a etkilerinden ve Özbek edebiyatında hikâyenin gelişiminden bahsedilecek, birinci bölümde Özbek yazar Tahir Malik'in hayatı, sanatı ve eserleri ele alınacak, ikinci bölümde“Sonuncu Kurşun”kıssasının Türkiye Türkçesine aktarımı gerçekleştirilecek, üçüncü bölümde eser edebî yönden yapı izlek yöntemiyle incelenecektir."
