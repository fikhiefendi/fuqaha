abstract: "Kavâid-i Fıkhiyye'nin günlük hayatın pek çok alanında olumlu etkileri vardır. Nitekim bu bilim sayesinde farklı fıkhi meseleler ve çağdaş uygulamalar, fıkhi kurallar temelinde bir araya getirilmiş, genel şerî metinlerden veya başka kaynaklardan çıkarılan kısa, özlü hükümler içeren kurallar şeklinde bir çatı altında toplanmıştır. Bu kısa hükümler, anlaşılır ve uygulamaya kabil olup bazen muteber bazen de destekleyici veya açıklayıcı bir delil olarak kabul edilir.“Adetlerin hakemliği”ilkesi, toplumun gelenek ve âdetleriyle ilgili olan önemli bir kavâid-i fıkhiyyedir. Nitekim bu kural altında birçok fıkhi alt kural bulunur ve bu kural, kadı ve müftüler için verimli bir kaynaktır. Çünkü farklı fıkhi meseleleri bir araya getirir ve karşılaşılan güncel olaylarla ilgili birçok konuyu ele alır, bu olayların hükümlerini düzenler. Bu kural sayesinde çağdaş fıkhi konuları temel prensiplere dayandırarak ele almak daha kolay hale gelir. Söz konusu külli kaidenin önemine binaen bu çalışmada bu temel kaidenin altında yer alan altı kaide incelenmiştir. Bu bağlamda“Adet muhakkemdir”ilkesinin alt kaidelerinin sınırsız olduğuna, gelenek ve göreneklere göre yenilendiğine ve birçok şerî konuyla ilişkili olduğuna dikkat çekilmiştir. Dolayısıyla toplumun örfünü esas alan şerî hükümler zamana ve mekâna göre hâkim örfün değişimine bağlı olarak değişebilmektedir. Çalışma kapsamında konuyla ilgili pek çok güncel örneklere yer verilmiştir. Çalışmada yer verilen örneklerin tamamında referans olarak Kitap, sünnet vb. edille-i şeriyye esas alınmıştır. Bu durum, insanların günlük yaşamlarına ve değişen olaylarına temas eden çalışmanın özelliklerinden biridir. Bilim kodu: 60403 ilahiyat"
