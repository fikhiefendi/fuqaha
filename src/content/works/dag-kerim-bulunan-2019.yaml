abstract: "Terâdüf ve furûk, İslam'ın erken dönemlerinde ortaya çıkmış iki dil bilimsel alandır. Tarihi süreç içerisinde her iki alanın savunucuları ile beraber ciddi bir literatür birikiminin ortaya çıktığı müşahede edilmektedir. Birinci alan eş anlamlılığın varlığını gerekçelendirerek savunurken ikinci alan ise eş anlamlılığın reddini esas almakta ve bu iddialarını çeşitli delillerle temellendirmektedirler. Bu araştırmamızda, Kur'an'da geçen eş anlamlı kelimelerin furûk kaynaklarında nasıl ele alındığını ve aralarında ne gibi farklar bulunduğunu ele aldık. Kur'an'da müterâdif diyebileceğimiz kelimeler, bir anlam paydasında birleşmekle beraber aralarında bir takım farklar bulunmaktadır. Bu sözcüklerin çok büyük bir çoğunluğu, gerek furûk kaynaklarında gerek sözlüklerde, aralarında bulunan farklar tespit edilebilmektedir. Kur'an'da bu kelimeler büyük bir hassasiyet ile kullanılmakta ve kelimeler arasındaki ince farklar göz önünde bulundurularak büyük bir ihtimam ile sözcükler tercih edilmektedir. Genel olarak kelimeler arasındaki farkları kaynaklarda bulmak mümkün olmakla beraber az da olsa bazı eşanlamlı kelimeler arasında ne gibi farklar olduğu özellikle furûk kaynaklarında yer almamaktadır. Bu durum, eş anlamlılığı kabul etmeyen dil bilginlerinin ve furûk taraftarlarının bu iddialarında aşırıya gittiklerini göstermektedir. Bu konuda makul olan yaklaşıma göre; lafız-mana ilişkisinde tabayün/farklılık esas olmakla beraber; kaynaklarda farkları zikredilmeyen kelimeler arasında eş anlamlılığın varlığı kabul edilmektedir. Kur'an-ı Kerim'de bulunan eşanlamlı kelimeler beş farklı uslup ile varid olmakta ve her bir uslubun ayrı ayrı furûk açısından ele alınması gerekmektedir. Birbirinden farklı bu kullanım şekilleri şunlardır: 1. Peşpeşe gelen ve birbirini te'kîd eden müterâdif kelimler, 2. Kendi müterâdifine atfedilen sözcükler, 3. Bir kelimenin kendi müterâdifi için“hal-i müekkide”formatında kullanıldığı üslup, 4. Benzer ayet ve bağlamlarda (lafzî Müteşabih ayetlerde) gelen eşanlamlılar, 5. Farklı ayet ve faklı bağlamlarda varîd olan eşanlamlı kelimeler."
