abstract: "Balkan coğrafyasının önemli iki ülkesi olan Bosna Hersek'te 1992-1995 ve Kosova'da 1998-1999 yılları arasında bölgenin çoğunluk nüfusunu oluşturan Müslümanlara yönelik tüm dünyanın şahit olduğu iki savaş yaşandı. Savaştan daha ziyade toplu bir kıyım hüviyetindeki bu katliamlarda bölge Müslümanlarının yaşadığı dini, hukuki, siyasi, sosyal, ekonomik pek çok kriz/olağanüstü durum cereyan etti. Başta Balkan coğrafyasının alimleri olmak üzere birçok alim ve kanaat önderi, savaş sebebiyle gündem olan zor zaman meselelerine cevap bulmak için gayret sarf ettiler. Bu çalışma, belirtilen zaman aralığında ve coğrafyada savaşın oluşturduğu koşullara yanıt olarak ortaya çıkan fıkhî üretimin tespitini arka planı ile birlikte ortaya koymaktadır. Netice, canlı ve dinamik bir ilim olan fıkhın sorun çözmedeki ve toplumsal hareketlilik ve değişimdeki konumunu belirgin bir şekilde ifade etmektedir."
