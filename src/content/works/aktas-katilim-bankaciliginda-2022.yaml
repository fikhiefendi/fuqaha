abstract: "Gelişen ve değişen dünya, ülkelerin kaynak taleplerini fazlalaştırmış, finans sektörü sürekli değişen kişisel ihtiyaçlarla doğmuş, finansal piyasalar meydana gelmiş ve finansal piyasa araçları ortaya çıkmıştır. 1970'lerde petrol ve dolar fiyatlarındaki yükseliş Ortadoğu'daki petrol zengini ülkeleri daha da zenginleştirmiştir. Müreffeh Ortadoğu ülkelerinden gelen yatırımcılar, kaynaklarını farklı ülkelere yatırmak için finansman yöntemleri inançlarına uygun ülkeleri tercih etmektedir. Bu durumda sukuk, İslami ilkelere uygun olarak ihraç aşamalarını ortaya koyan sermaye piyasasının araçlarından biri haline gelmiştir. Çalışmada, İslami Tahviller finansman modelleri çerçevesi, katılım bankacılığında bir finansal araç olarak sukuk işlemlerinin dünü bugünü ve muhasebe kayıt örnekleri açıklanmıştır. Sukukun finansman modelinin kavramsal boyutu, ihraç aşamaları, Türkiye'deki uygulaması örneklerle açıklanmıştır."
