abstract: "Bu tez, Üsküdar Şeriat mahkemesinin hicrî 1155-1156 (mîlâdî 1742-1743) tarihli 407 numaralı şer'iyye sicilini ele almaktadır. Tez iki bölümden oluşmaktadır. Birinci bölümde genel olarak Osmanlı'daki şer'iyye sicilleri ve ihtiva ettiği belge çeşitleri, Şeriat mahkemeleri, kadılar ve diğer mahkeme görevlileri hakkında ve Üsküdar şer'iyye mahkemesi hakkında bilgiler verilmektedir. İkinci bölümde 407 no'lu Üsküdar şer'iyye sicilinin özellikleri hakkında malumat verilmekte ve defter ışığında o dönemdeki Üsküdar ve civarına dair dinî, kültürel, sosyal ve iktisadi hayat hakkında bilgiler verilmekte ve sicilden bazı örnekler incelenmektedir. Ve sicilin latin alfabesiyle yapılmış transkriptli metni bulunmaktadır."
