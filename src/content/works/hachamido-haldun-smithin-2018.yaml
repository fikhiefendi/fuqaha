abstract: "XIV. yüzyılda yaşayan İbn Haldun, (1332- 1406) tarih, felsefe, fıkıh ve iktisat alanlara önemli katkılarda bulunmuştur. Çok meşhur bir iktisatçı olan Adam Smith ile birçok iktisadi kuramlar ve fikirler öne sürmüştür. İbn Haldun ve Adam Smith'in iktisat alanında günümüzde hala kullanılan önemli ve muhteşem görüşleri vardır. Bu çalışmanın amacı, İbn Haldun'un ve A.Smith'in bazı iktisadi görüşlerini sunmak ve günümüzde iktisat alanını ne kadar etkilediğini ortaya koymaktır. Ayrıca iktisadi fikirlerinin bir değerlendirmesini yapmaktır. Çalışmada ilk önce, İbn Haldun'un hayatı ve iktisadi fikirleri daha sonra A.Smith'in hayatı ve iktisadi fikirleri incelenmiştir. Bu incelemelerde iktisadi fikirlerinin değerlendirilmesi yapılmıştır"
