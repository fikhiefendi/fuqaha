abstract: "İslam hukuk tarihi boyunca her dönemde fıkıh ilminin gelişimine katkı sağlayan önemli şahsiyetler ortaya çıkmıştır. 18. yüzyılın çok yönlü âlimlerinden Murtazâ ez-Zebîdî, Hanefî fıkhına dair derinlikli yorumları, hadis-fıkıh ilişkisini ele alışı ve dilbilimsel yaklaşımlarıyla öne çıkan bir isimdir. Eserlerinde fıkıh, hadis ve Arap diline yaptığı katkılar, onun ilimler arası birikimini yansıtır. Ancak, bu âlimlerin bir kısmının akademik literatürde yeterince incelenmemesi, onların eserlerinin ve fıkıh ilmine olan etkilerinin tam olarak anlaşılamamasına neden olmuştur. Bu durum, bazı dönemlerin fakihlerin az yetiştiği veya fıkhi üretkenliğin azaldığı gibi yüzeysel genellemelerle nitelendirilmesine yol açmıştır. Oysa özellikle son dönemlerde yaşamış fakihlerin eserleri, İslam hukuk geleneğinin sürekliliğini ve dinamizmini ortaya koyması bakımından büyük önem arz etmektedir. Bu çalışma, söz konusu genellemeleri eleştirel bir yaklaşımla ele alarak, Murtazâ ez-Zebîdî'nin fıkıh sahasındaki konumunu, metodolojik yaklaşımlarını ve katkılarını nizami bir şekilde incelemeyi hedeflemektedir. Çalışma, metodolojik olarak üç temel eksen üzerine inşa edilmiştir. İlk bölümde, Zebîdî'nin biyografik detayları, ilmî altyapısı, hoca-öğrenci ilişkileri ve dönemin entelektüel çevresi sosyokültürel bağlamıyla birlikte analiz edilmiştir. İkinci bölüm, Zebîdî'nin fıkıh usulüne dair tartışmalı konulardaki görüşlerini karşılaştırmalı yöntem ile ele almakta; aynı zamanda onun hadis ilmindeki yorumlarını ve ictihad mekanizmasını usûlî açıdan irdelemektedir. Üçüncü ve son bölümde, Zebîdî'nin füru-i fıkha dair görüşleri detaylı bir şekilde ele alınmıştır. Bu kısımda, müellifin fıkhi ihtilaflara metodik yaklaşımı, dilbilimsel unsurlarla fıkıh prensipleri arasında kurduğu bağlantı ve Hanefî mezhebinin görüşlerine karşı takındığı eleştirel tavır analiz edilmiştir. Ayrıca, Zebîdî'nin fıkhi müzakerelerde tercih ettiği terminolojik yapı ve bu tercihlere esas teşkil eden gerekçeler ilmî bir yöntemle irdelenmiştir. Bu araştırma, Zebîdî'nin fıkıh mirasını akademik bir titizlikle ortaya koymayı ve İslam hukuk düşüncesinin tarihsel sürekliliğini belgelemeyi amaçlamaktadır. Zebîdî gibi çok yönlü âlimlerin varlığı, fıkıh geleneğinin her dönemde nazarî derinliğini koruduğunu ve canlı bir tekâmül süreci geçirdiğini kanıtlamaktadır. Benzer monografik çalışmalar, İslam ilim geleneğinin zengin ilmî birikiminin nesillerarası aktarımını sağlamak açısından mühim bir işlev görmektedir. Anahtar Kavramlar: İslam Hukuku, Hanefî Mezhebi, Murtazâ ez-Zebîdî, Hindistan, Yemen"
