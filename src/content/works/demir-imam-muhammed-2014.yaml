abstract: "İmam Muhammed'in el-Asl İsimli Eserinin Mütûn-i Erbaa'ya Tesiri ismini taşıyan bu tezde, el-Asl'ın mütûn-i erbaa'ya hangi yönlerden tesir ettiği incelenmiştir. Tez giriş, iki bölüm ve sonuçtan oluşmaktadır. Giriş bölümünde tezin konusu, tezin sınırlandırılması, tezin önemi ve amacı, tezin yöntemi ve kaynakları hakkında bilgi verilmiştir. Birinci bölümde el-Asl, Vikâyetü'r-rivâye, el-Muhtâr, Mecmau'l-bahreyn ve Kenzü'd-dekâik'in tanıtımı yapılıp müellifler hakkında kısa bilgiler verilmiştir. İkinci bölüm iki kısma ayrılmıştır. Birinci kısımda el-Asl'ın mütûn-i erbaa'ya şekil açısından tesiri ele alınıp eserlerin sistematiğini oluşturan kitâb, bâb, fasıl ile dil ve üslupları hakkında genel bilgi verilip aralarında mukayese yapılmıştır. İkinci kısımda mütûn-i erbaa'nın kitâbü'l-beyʽ bölümünde yer alan konular tercüme edilerek bu konuların el-Asl'da var olup-olmadığı tespit edilmeye çalışılmış, el-Asl'da olan kısımların el-Asl'da ne şekilde zikredildiği mütûn-i erbaa'ya kıyas edilerek değerlendirmeye tabi tutulmuştur. Sonuç olarak el-Asl ile mütûn-i erbaa'nın farklı dil ve üsluplara sahip olduğu, mütûn-i erbaa'da kullanılan kitâb ve bâb başlıklarının biri hariç tamamının el-Asl'da kullanıldığı, mütûn-i erbaa'da geçen meselelerin yüzde yetmişinin el-Asl'da bulanabileceği tespit edilmiştir."
