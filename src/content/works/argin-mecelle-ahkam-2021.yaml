abstract: "İnsanın toplumsal bir varlık olması ve yaşamsal ihtiyaçlarını karşılaması gerekliliği onu diğer insanlarla bir arada yaşamaya mecbur kılmıştır. Topluluk halinde yaşam beraberinde insanlar arası muamelelerin meydana gelmesine, zamanla insanların çoğalması da muamelelerin sayı ve çeşit yönünden artmasına sebep olmuştur. Bu şekilde asırladır devam eden döngü akidler konusunun hukukta önemli bir yer icra etmesini kaçınılmaz hale getirmiştir. Elbette kurallar, her dönemde aynı kalmayarak zamanın şartlarına ve gereklerine göre yenilenmeyi gerektirmiştir. Osmanlı Devleti döneminde de Tanzimat sonrasında klasik adlî yapı önemli ölçüde değiklik göstererek tek hâkimli şer'iyye mahkemelerinin yanı sıra toplu hâkimli ticaret, hukuk ve ceza mahkemeleri kurulmaya başlanmıştır. Bu mahkemelerin üyelikleri için başlangıçta yeterli hukuk bilgisine ve klasik fıkıh literatürüne vâkıf kimseler bulunamamıştır. Bu sebeple üyelerin yararlanabileceği, Türkçe kanun metinlerinin yazılması ihtiyacı ortaya çıkmıştır. Yanı sıra oluşan dönemlerinin siyasî şartları, devletin içte ve dışta çözmek zorunda olduğu problemler, yenileşme ve Batılılaşma çabalarıda eklenice birçok teşebbüs neticesinde Meccelle-i Ahkâm-ı Adliye hazırlanarak yürürlüğe girmiştir."
