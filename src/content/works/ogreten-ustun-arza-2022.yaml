abstract: "Roma hukukundan günümüze varlığını sürdüren bir ilke olan arazinin üzerinde bulunan şeylerin mülkiyetinin yine o araziye ait olması kuralına üstün arza tabi olması kuralı denir. Ancak bu kural mutlaklık taşımaz. Bazı istisnaları vardır. Bunlardan biri de taşkın yapıdır. Taşkın yapı, iki komşu taşınmazdan birinin diğerinin sınırlarını ihlal etmesi ve yapılan yapının taşması sonucu oluşur. Bu durumda kanun koyucu taşmanın bir hakka dayanıp dayanamaması, dayanmadığı takdirde ise bazı koşul ve şartlarda ne olacağına dair düzenleme yapmıştır. Bir hakka dayanılarak yapılan yapılar ana yapının bütünleyici parçası olur. Ancak arada bir irtifak hakkı yoksa bu durumda malik on beş günlük sürede itiraz etmemiş ve durum ve koşullar da haklı gösteriyorsa ve yapı maliki de iyi niyetli ise bir irtifak hakkı kurulmasını yahut taşan kısmın mülkiyetinin geçirilmesini talep edebilir. Fakat arada bir irtifak hakkı yoksa en nihayetinde taşınmaz malikinin mülkiyet hakkının ihlali söz konusu olacaktır. Bu nedenle malikin de bu talepleri bertaraf etmesinin bazı yolları vardır. Malik taşkın yapı nedeni ile yapı malikine karşı el atmanın önlenmesi ve ya taşkın yapının kaldırılması ve ortada haksız işgalden kaynaklı bir zarar varsa ecrimisil davası açabilir. Bu tezin amacı, hukukumuzda var olan taşınmaz mülkiyetinin prensiplerinden biri olan bütünleyici parça (üstün arza tabi olması) kuralının istisnası olan taşkın yapı kavramını doktrin ve Yargıtay kararları ışığında incelemek ve taşkın yapı hakkında ortaya çıkan sorunları günümüz koşullarını göz önünde bulundurarak değerlendirmektir."
