abstract: "Azerbaycan aile hukukunun İslam aile hukuku ile mukayesesinin yapılmasının amaçlandığı çalışmada, Azerbaycan ve İslam hukukunda aile kavramı nikah, evlilik, boşanma ve nafaka ile ilgili hükümler incelenirken, Azerbaycan Aile Mecellesi ve İslam dinindeki mezheplerin ilgili görüşleri mukayeseli olarak incelemiştir. Azerbaycan'da, geçmişten gelen kültürünün de etkisiyle aile kavramına önem veren bir yapı hakimdir. Çoğunlukla geniş aile yapısının hakim olduğu ülkede erkeğin egemen olduğu ataerkil bir yapı bulunmaktadır. Günümüzde geniş aileler yerini anne, baba ve çocuktan oluşan çekirdek aileye bırakmış olsa da aile büyüklerinin aile üzerindeki etkileri halen devam etmektedir. Azerbaycan'da aileye verilen değer Aile Mecellesindeki hükümlere yansımış durumdadır. Benzer şekilde İslam'da da aile kavramına önem verilmekte; ailenin yapısı, kurulması, korunması ve sürdürülmesi önemli görülmektedir. Kur'an-ı Kerim'de ve Hazreti Muhammed'in hadislerinde aile yapısı ile kadın ve erkeğin görevleri sarih bir şekilde ortaya konmaktadır. İslam dinin sevgi, saygı, hoşgörü, sağlıklı iletişim gibi kavramların aile ilişkilerinde de olması beklenmektedir. Ayrıca Hazreti Muhammed'in ailesi ile yaşadıkları İslam dininde aileye verilen önemi açıklamak konusunda yol gösterici mahiyettedir."
