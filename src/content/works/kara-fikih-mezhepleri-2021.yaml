abstract: "Fıkhî hükümler çerçevesince içmede ve temizlikte kullanılan suyun sahip olması gereken özellikler arasında“temiz”ya da“temizleyici”özellikte olması şartları aranmaktadır. Bu şartların bulunmadığı suların kullanımında ise bazı ibadetlerin sıhhati açısından ya da insan sağlığını koruyucu tedbirlerin alınması amacıyla bir takım kısıtlamalar bulunmaktadır. Söz konusu kısıtlamalardan kurtulabilmek ya da böyle bir duruma düşmemek için de sulardan istifade ederken fıkhî kriterler doğrultusunda hareket edilmesi gerekmektedir. Temelde fıkhî açıdan temizlenme ve suların mahiyetini incelediğimiz bu çalışmada, bir şeyin şer'î olarak kirlendiğinin anlaşılabilmesi için şer'an necâset kabul edilen kirletici unsurların bilinmesi gerektiğinden dolayı öncelikle birinci bölümde suların da mahiyetini değiştirerek necis hale gelmesine sebep olan necâsetler hakkında bilgi verilmiştir. Bu bölümde ayrıca çalışmamızın ilerleyen safhalarındaki bazı meselelere ışık tutmak amacıyla başta su ile yıkama olmak dahil olmak üzere diğer temizlik yöntemlerine de yer verilmiştir. İkinci bölümde ise fıkhî yönden suların mahiyeti üzerinde durulmuştur. Suların mahiyetinden bahsederken de içine karışan temiz ya da necis maddelerin ve abdestte kullanılmasının suyun mahiyetine olan etkisi, sular değişik tasniflerle incelenerek değerlendirilmiştir. Ayrıca bu bölümde necis hale gelen suların, hangi klasik yöntemlerle tekrardan temiz ya da temizleyici olma vasfını kazanacağı anlatılmıştır. Üçüncü bölümde ise necis hükmündeki atıksuların, modern/bilimsel tekniklerle arıtılmaları durumunda fıkhî hükmünün ne olabileceği üzerinde durulmuştur. Bunun için öncelikle atıksuların arıtılmasında kullanılan modern/bilimsel teknikler ve bu teknikler uygulanarak arıtılmış atıksuların bilimsel açıdan kullanılabilirlik durumu incelenmiştir. Sonrasında ise modern/bilimsel teknikler kullanılarak arıtılmış olan atıksuların fıkhî değerlendirmesi yapılmıştır."
