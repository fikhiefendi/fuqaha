abstract: "Vakıfların denetimi, ebedi olmak üzere kurulan vakıfların varlığının devam etmesi açısından önem taşımaktadır. Bu çalışmada, eski vakıflar hukukunda vakıfları denetlemekle görevli olan nazır, hukuki çerçeve içerisinde incelenecektir. Bu çerçevede mahkeme kayıtları ve fetva mecmualarından yararlanılacaktır. Böylece literatüre katkı sağlanması ve nazırın hukuki kimliğinin ortaya konulması amaçlanmaktadır. Bu bağlamda şu sorulara cevap aranacaktır: Evkaf-ı Hümayun Nezaretinin kuruluşuna kadar olan süreçte vakıfları denetlemekle görevli nazır kimdir? Nazır, hangi şartları taşıdığı takdirde göreve gelebilirdi? Göreve gelme yolları nelerdi? Nazırların vakıfları denetlemek dışında görevleri var mıydı? Varsa, bu görevler nelerdi? Nazırın hakları nelerdi? Hangi hallerde görevine son verilebilirdi?"
