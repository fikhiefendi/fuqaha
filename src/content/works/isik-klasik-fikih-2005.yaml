abstract: "Hakkında açık hüküm bulunmayan meselenin hükmünü, aralarındaki ortak özelliğeveya benzerliğe dayanarak hükmü açıkça belirtilen meseleye göre belirlemek şeklindetanımlanan kıyasa suç ve cezalarda başvurulup vurulamayacağı usÃ»lcü bilginlerarasında tartışma konusu olmuştur. Bazı bilginlere göre, suçların ve cezalarınbelirlenmesinde kıyas yöntemine başvurulabilir, bazılarına göre ise, suç ve cezalarınbelirlenmesinde kıyas yöntemine başvurulamaz.Modern hukukta, suç ve cezaların belirlenmesinde kıyas yolunun takip edilipedilemeyeceği hususunda genel şekliyle iki ekol oluşmuştur. Bu ekollerden KlasikEkole göre ?kanunsuz suç ve caza olmaz? kuralı kıyaslama yapmaya imkantanımamaktadır. Buna mukabil Pozitivist Ekol, cezanın genel önleme nitelikleri yanısıra özel önleme niteliklerini de göz önüne alarak asıl amaç toplumu koruma olmaktırdiyerek suç ve cezalarda kıyas yöntemine başvurulabileceği görüşündedir.slam hukukçularının büyük çoğunluğu kıyasın şer'û amelû hükümlerin bilinmesinisağlayan bir delil ve şer'û esaslardan biri olduğu hususunda aynı görüştedir. Ancak bubilginler, suç ve cezalarda kıyasın cari olup olmayacağı hususunda en genel şekliyle ikigruptur. Bilginlerin çoğunun teşkil ettiği birinci gruba göre, şartları oluştuğu zamansuç ve cezalarda kıyas yoluna başvurulabilir. Bunlara göre, kıyasın meşruluğu Kitapve Sünnetten delillerle kanıtlanmıştır, dolayısıyla kıyasın meşru olduğu kabuledildikten sonra artık onun geçerlilik sahasını sınırlamanın anlamı yoktur. Kıyas, suçve cezada geçerli olamaz fakat diğer hükümlerde geçerli olur denilemez.kinci grup bilginlere gelince, bu gruptaki bilginler, kıyasın meşruluğunu kabuletmekle birlikte onun uygulama sahasını sınırlı görürler. Bunlara göre, suç vecezalarda özellikle de hadd ve keffâret cezalarını gerektiren suçlarda kıyas yolunagidilemez. Yani hükmü belirtilmemiş bir suçun cezası hükmü belirtilmiş bir suçla aynıkefeye konamaz. Bu bilginler, hadd ve keffâret cezalarının konuluş amacını vekonmuş olan ceza miktarlarını aklen kavramanın mümkün olamayacağı, aynızamanda bahsedilen hükümlerin taabbüd içerikli olduğu gerekçesiyle suç ve cezalardakıyas yoluna başvurmanın mümkün olamayacağı görüşündedir.ANAHTAR KEL MELER:KıyasTa'lilKıyas ŞartlarıCeza HukukuHaddler ve Keffâretlerde Kıyas"
