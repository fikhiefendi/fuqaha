abstract: "Bu tez ile Malikiyet ve Serbestlik isimli yepyeni bir dönem incelenmiştir. İnsanın yeterince özgürleşemediği yönetim şekilleri üzerinde durularak tekâmül sürecinde insanların bu olumsuz şartlardan kurtulabilmesinin yolları araştırılmıştır. Gelişim süreci içinde insanlığın başına gelen kölelik, esaret ve insan emeğinin sömürülmesi gibi olumsuz şartların sona erip eremeyeceği tartışılmış bunun ancak“Malikiyet ve Serbestiyet Devri”ile mümkün olabileceği değerlendirilmiştir. İnsanın yaşam serüveninde ortaya çıkan dönemler üzerinde durularak birbirinden farklı sosyal yaşam biçimleri üç bölümde ele alınmıştır. Bu devirlerden birincisine Marks'ın“İlkel Komünal Toplum”adını verdiği insanlığın“Vahşet ve Bedeviyet Devri”, ikincisine“Köleci ve Sömürgeci Toplum”ve üçüncü olarak da tezin adını verdiği“Malikiyet ve Serbestiyet Devri”denilmiştir. Köleci ve sömürgeci toplum düzeni ki bu devir üç bölümde ele alınmıştır. Birincisi basit kölelik devri, ikincisi esaret içindeki feodal sömürü dönemi ve üçüncüsü ise kapitalizm adı verilen ücretli sistem, şeklinde tanımlanarak incelenmiştir. Tekâmül süreci içinde olan insanın yaşadığı bu devirler incelenerek toplumsal formasyonun en gelişmiş düzeyi olarak“Malikiyet ve Serbestlik Devri”olduğu tezi ileri sürülmüştür. Mülkiyet haklarının önem kazandığı ve her konuda tam bir özgürlüğün yaşanacağı bu dönemde mülkiyet, sahip olma ve hürriyet kavramları üzerinde yoğunlaşılarak orijinal bir bakış açısı geliştirmeye çalışılmıştır. Tezin diğer önemli bir konusu da“Kayıtdışılık”olarak ele alınmış bunun ülkelere yüklediği maliyetler göz önüne alınarak mülkiyet sisteminin önemi vurgulanmıştır. Ülke ve devletlerin kalkınmasında gerekli sonucun elde edilmesi için yıllarca süren araştırma ve incelemelerden yararlanılmış olup ortaya çıkan sermaye ve mülkiyet sorunları ele alınmıştır. Bu sayede gelecekte daha fazla önem kazanacağı düşünülen mülkiyet ile ilgili kavramların yanı sıra yeni bir dönemin ana parametreleri tespit edilmiştir."
