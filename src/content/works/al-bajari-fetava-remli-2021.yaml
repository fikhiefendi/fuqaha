abstract: ".Genelde Genelde fıkhî konular, özelde de fıkıh alanında temizlik ile ilgili verilen fetvalar ve yapılan içtihatlar dinde önemli bir yeri haizdir. Zira bu tür konular şâri'in meramını doğru anlamaya kapı aralar. Şâfiî mezhebi fakihlerinden Şemseddîn er Remlî tarafından derlenen ve babası Şehâbeddîn er-Remlî'ye ait fetvalar, konunun öne çıkan örneklerindendir. Bu çalışmada Remlî'nin abdest, mestler üzerine mesh ve teyemmüm konuları ile ilgili fetvaları incelenecek ve bu fetvalar müçtehit imamların görüşleri ile temellendirilecektir. Bunun yanı sıra fıkıh ilminin Müslüman hayatındaki önemi, fıkhın temel prensipleri, fetva makamının dindeki ehemmiyeti, fetva için gerekli yeterliliğe sahip olunmadığında ortaya çıkabilecek riskler, müçtehit imamların istidlal metotları ve içtihadlarının temelleri bilimsel bir yöntemle incelenecektir."
