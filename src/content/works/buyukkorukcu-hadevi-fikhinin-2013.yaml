abstract: "Erken dönem mezhebler tarihi eserlerinde Zeydiyye?nin belirli kollarına nispetle dillendirilen, mezhebin ?usulde Mutezilî, furûda Hanefî? olduğu yönündeki iddia, ilerleyen dönemde mezhebin tüm kollarına şâmil olacak şekilde kullanılır olmuştur. Bu kanaatin, furûî alanda, Zeydî geleneğin fıkıh birikimini tevârüs eden Hâdevî teşekkül açısından ne oranda kabul edilebilir olduğu, geleneğin mezhebleşmesi noktasında hayatî önemi hâiz olan el-Hâdî ilelhakk?ın el-Ahkâm isimli eseri üzerinden sınanmıştır. Gerek el-Ahkâm?ın hâiz olduğu özellikler gerek fıkhî meselelerde her iki kesimin ulaştığı hükümler gerekse de el-Hâdî?nin hükme ulaşırken kullandığı usûl, Hâdevî-Hanefî irtibatının bahsedildiği kadar kuvvetli olmadığını ortaya koymuştur."
