abstract: "Herhangi bir mezhebin kimliğini belirleyen ve akait, fıkıh ve tasavvuf gibi üç ana disiplin içerisinde mündemiç bulunan karakteristik kodları mevcuttur. İşte bu kodları tam anlamıyla kavradığımızda herhangi bir mezhebin müstakil olarak net bir profilini görmekle beraber söz konusu mezhebi diğer mezheplerle sağlıklı bir düzlemde kıyaslamak suretiyle benzerlik ve farklılıklarını ortaya koyabilme fırsatına nail olmuş bulunacağız. Bu bağlamda, Geleneksel Hanbelilik ve Çağdaş Selefilik adlı iki tane oluşumun her ikisinin de müstakil olarak oluşum tarihleri, belli başlı teorisyenleri, literatürleri ve doktrinleri incelendikten sonra, zorunlu olarak bu iki mezhep hakkında belirli bir düzeyde zihnimizde bir tasavvur ve profil meydana gelecektir. Bu zihnimizde ortaya çıkan tasavvurumuzu söz konusu iki oluşumun kendi aralarındaki benzerlikleri ve farklılıkları açısından nihai sonuca varmak sadedinde tekrar incelediğimizde bu iki oluşumun birbirinden temayüz eden farkları açıkça belirecektir."
