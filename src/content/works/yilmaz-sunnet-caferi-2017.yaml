abstract: "Bu çalışmada, Ehl-i Sünnet ile Şiî Caferî mezhebi arasındaki tartışmalı meselelerden biri olan mut'a nikâhına, Kur'ân tarafından izin verildiği iddiası araştırılmıştır. Şiî Caferî mezhebi, istimtâ' âyeti olarak da bilinen Nisa sûresinin 24. âyetini, Kur'ân'da mut'anın cevazına referans göstermiştir. Mut'anın haram olduğunu iddia edenler ile cevazına fetva verenlerin görüşleri, Nisa sûresi 24. âyeti bağlamında ele alınıp değerlendirilmiştir. Ayrıca konuya ışık tutması amacıyla evlilikle ilgili diğer konular da ana hatlarıyla ele alınmıştır."
