abstract: "Müslümanlar; artan nüfusları, değişen tüketim alışkanlıkları, İslam ülkelerinde yaşanan gelişmelerle birlikte ilgi çekmiştir ve günümüzün önemli pazar gruplarından birisidir. Firmalar, Müslüman tüketicilerin hassasiyetlerini gözetmekte ve İslami standartlara uygun ürünler sunmaya çalışmaktadır. Bu çalışmada İslami pazarlamanın genel bir literatür incelemesi yapılmıştır. İslami pazarlamaya kaynak teşkil eden ilkeler açıklanarak temel pazarlama bileşenleri İslami perspektiften incelenmiştir. İslam ekonomisini oluşturan sektörler ( helal gıda, İslami finans, helal turizm, İslami moda, helal kozmetik, helal ilaç, helal medya ve rekreasyon) ve sertifikasyon çalışmaları hakkında bilgi verilmiştir. Bu alandaki bilgi ve teori, Müslüman toplumlar içerisinde ve dışında büyümeye devam etmektedir. Bu nedenle bu çalışma, İslami pazarlamaya ilişkin önemli konuları açıklamak ve gelecek vaat eden araştırma alanlarının belirlenmesine yardımcı olmak için hazırlanmıştır. Bu bağlamda çalışmanın, gelişmekte olan İslami pazarlama literatürüne katkısı olacağı düşünülmektedir."
