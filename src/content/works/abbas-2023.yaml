abstract: "Fıkhî uyum konusunda hüküm istinbât ederken aynı metodu kullanma ve delillere aynı açıdan bakma şart olmadığı için bu araştırmada imam Ebû Yusuf (ö. 182) ile İmam Şâfiî'in (ö. 204) ittifak ettikleri hususlar incelenmiştir. İmamların ihtilaf ettiği meseleler delil ve bürhan konusuyla ilgili olup mezhep taassubuyla ilgili değildir. İmamlardan birinin Ehl-i rey diğerinin Ehl-i hadis ekolüne mensup olması ve iki metot arasında ihtilaf meşhur olmasına rağmen birçok fıkhî konuda ittifak etmişlerdir. Araştırmada ittifak edilen konuların tespiti ve analizi yapılmıştır. Araştırmanın hedeflerini gerçekleştirmek için iki imamın şahsi ve ilmi hayatları yazılırken betimleyici tarihsel metot kullanılmıştır. İttifak edilen hususlar ve imamlarla aynı görüşte olan fakihlerin tespiti ve görüşlerden birinin tercih edilmesinde karşılaştırmalı betimleyici metot tercih edilmiştir. Araştırmada ulaşılan neticelerden bazıları şunlardır: Fakihlerin, farklı ekol ve yaklaşımlarına rağmen bazı konularda ittifak etmelerinin sebebi, genel şeriat ilkelerine ve mekâsıdu'ş-şerîaya bağlılıklarından kaynaklanmaktadır. Bu durum farklı ekole mensup olmalarına rağmen, Ebu Yusuf ve Şâfiî arasındaki ittifakı da açıklar. İki imamın ittifak ettiği konuların çoğu ihtiyat gereği insanlar için en genel, kolay ve hafif olanı tercih etme ve şeriat ve dönemin ruhunun uyuştuğu konularla ilgilidir. Kadının kocasına zekât vermesi, orucu bozma sebebi ne olursa olsun hamile ve emzikli kadına orucun kazasının gerekmesi bu konulara örnek olarak verilebilir. Fetvaların çoğunda kamu yararı, şer'î hikmet ve şeriatın genel amaçlarını gözetme, fıkhi görüşlerine zenginlik, çeşitlilik katan ve Hanefi ve Şafii fıkhı üzerinde büyük etkisi olan iki içtihatçı şahsiyete delalet eden kati şer'î delillere dayanma, iki imamın temayüz ettiği metot olarak ifade edilebilir."
