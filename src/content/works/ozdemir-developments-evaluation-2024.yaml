abstract: "Bu çalışma, yüzyıllardır farklı aile hukuku hükümlerinin hakim olduğu bir dönemden, zorluklar getiren yeni bir döneme geçişin doğasında var olan sorunlara işaret etmektedir. Müslüman ülkelerin aile yasalarındaki karmaşık konular ve hızlı dönüşümler, Müslümanlar için evlilik ve boşanma konusunda önemli çatışmalara ve yansımalara yol açmaktadır. Bu araştırmanın temel amacı, İslam dünyasının önde gelen dört ülkesinde İslami aile yasalarının kodifikasyonunun ve 19. yüzyıldan günümüze uzanan gelişiminin karşılaştırmalı bir analizini yapmaktır. İncelenen ülkeler Türkiye, Ürdün, Fas ve Malezyadır. Tümevarımcı bir yaklaşım kullanan çalışma, kodifikasyon, tedvin ve aile hukukunun konuyla doğrudan ilgili karmaşık yönlerini araştırmaktadır. Bu dört ülkenin kodifikasyon tarihi kapsamlı bir şekilde tartışılmakta ve Aile Hukukuna ilişkin güncel meseleler incelenmektedir. Araştırma daha sonra, ihtilaflı konuları değerlendirmek ve her ülkedeki farklı bakış açılarını ortaya çıkarmak için analitik ve saha yaklaşımlarını kullanmaktadır. Saha çalışması aşamasında, yarı yapılandırılmış bir yöntem kullanılarak Türkiye'den sekiz, Ürdün'den altı, Fas'tan iki ve Malezya'dan beş olmak üzere toplam yirmi bir uzmanla görüşülmüştür. Bu uzmanlara yöneltilen beş sorudan oluşan kapsamlı bir set, konu hakkındaki görüşlerini ve kendi ülkeleri için önemli çıkarımlarını yakalamayı amaçlamaktadır. Araştırma ayrıca, ömür boyu nafaka, çok eşlilik, evlilik sırasında eşlerin başka bir dine geçmesi, evlilik kaydı ve aile hukukunda tahkim meselesi gibi kritik çağdaş aile hukuku sorunlarını fıkıh perspektifinden analiz etmektedir. Bu araştırmanın bulguları, daha önce kodifiye edilmiş olan İslami aile yasalarının, Müslüman ailelerdeki gelişen sorunları ele almak ve değişen zaman ve koşullara uyum sağlamak için değişikliğe uğramaya devam ettiğini ortaya koymaktadır. Sonuç olarak bu çalışma, toplumsal uyum ve refahın teşvik edilmesinde kodifikasyonun vazgeçilmezliğini savunmaktadır. Ayrıca, birliği teşvik etmek için aile hukukunun etkin bir şekilde uygulanmasının çok önemli bir rolü olduğunu vurgulamaktadır. Bu bağlamda, mevcut yasal çerçeveyi tamamlamak üzere tahkim ve arabuluculuk gibi alternatif yaklaşımlar önerilmektedir."
