title: "Developments and Evaluation of Islamic Family Law in Light of Experiences of Muslim Countries"
titleTranslation: {"tr": "Müslüman ülkelerin deneyimleri ışığında İslam aile hukukunun gelişimi ve değerlendirilmesi"}
authors: ["Özdemir, Selman Zahid"]
language: "en"
year: 2024
