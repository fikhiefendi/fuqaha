abstract: "Tez; giriş, üç bölüm, sonuç ve bibliyografyadan oluşacak şekilde hazırlanmıştır. Girişte, tezin içerik ve yöntemi hakkında bilgiler verilmiştir. Tezin birinci bölümünün kendi içerisinde dörde ayrılması uygun görülmüştür. İlk kısımda tarıma elverişli olmayan arazinin ıhyâ edilmesi ve İhyâ ile doğrudan ilgili kavramlar, ikinci kısımda mevât arazilerinin İhyâ edilmesinin hukukî dayanakları, üçüncü kısımda ihya edilmeden ve ihya edildikten sonraki mülkiyeti, mevât arazinin unsurları ve ihya yöntemleri, dördüncü kısımda ise mevât arazinin ihya edilmesinde aranan şartlar ve önemi ele alınmıştır. Tezin ikinci bölümünde Mevât arazinin İhyâ edilmesinin hukuki süreci ve İhyâ ediliş şekilleri incelenmiştir. İlk kısımda mevât arazinin ihya edilmesinin hukuki süreci ele alınmış. İkinci kısımda ise mevât arazinin ihya ediliş şekillerine yer verilmiştir. Tezin üçüncü bölümünde ise, Arazinin İhyâ edilmesi meselesinde İslam hukuku ile Uganda hukuku arasında bir karşılaştırma yapılarak aradaki benzerlik ve farklılıklar ortaya konulmaya çalışılmıştır. İlk kısımda Uganda'daki mevât arazilerinin bilgisi ve bugünkü İhyâ etme sebepleri, ikinci kısımda uganda'da mevât arazisinin ihya edilmesine ilişkin hukuki düzenlemeler ve islam hukuku ile kıyaslanması. Tez üç ana bölümden sonra gelen sonuç bölümüyle sona ermektedir. Sonuç bölümünde, yapılan çalışma sonucunda konuyla ilgili elde edilen kanaatler ve öneriler yer almaktadır."
