abstract: "Çalıştığımız dönem H. 1214?1215 / M. 1799?1800 yıllarına ait 6 numaralı Sivas şer'iyye sicili'dir. Çalışmamızın başında Osmanlı Hukuk Sistemi ve şer'iyye sicillerinin tanımı, ortaya çıkışı, tarihi gelişimi, şer`iye sicillerinin önemi; Sivas şer`iye sicilleri ve 6 numaralı Sivas şer`iye sicilini ana hatlarıyla ele alarak izah etmeye çalıştık.İncelemiş olduğum sicillâtdaki belgelerde genellikle merkezden kadıya hitaben gelen fermân ve buyuruldularla Sivas ilinin imdâdiye, hazeriyye, ağnam, zehâyir ve diğer vergilerinin toplanması ve irsâline ilişkin emirleri varlığını gördük. Bunun dışında belgelerde görev tevcihleri, mâlikâne ve tımar tahsilâtları, tereke taksimi, mirâs, alacak-verecek, evlenme akidleri vs. birçok belge türüne de rastlanmaktadır. Belgelerde Sivas iline bağlı livalar, kazalar, nahiye ve köylerin ve bunların büyüklüklerinin yanında ekonomik durumlarına dair ipuçlarına da şahit olduk.Çalıstıgımız dönemde Sivas'da Müslümanlar ile gayr-i Müslim tebadan olan Ermenilerin bir arada yasadıkları görülmüştür. Genelde alacak-verecek ve satışla ilgili durumlarda gayr-ı Müslim tebaanın isimlerinin geçtiği görülmüştür. Bunun dışında vergi toplamada bir çok esnaf grubundan insanında gayr-ı Müslim olduğu anlaşılmaktadır. Gayr-ı Müslim-müslim arasında çok az sayıdaki da`va dışında önemli bir olayın olmadığı ve dini kimliği farklı olan insanların bir arada mutlu ve huzurlu yaşadıkları da tarafımızca müşahede edilmiştir. Diğer taraftan incelediğimiz belgelerden 212 adetinin Müslümanların birbirleriyle olan münasebetlerine ait olması(fakat bu belgelerde gayr-ı Müslimleri de ilgilendiren vergi toplama ve bunun ahaliye duyurulması gibi direkt ve dolaylı yoldan ilgilendiren konuların mevcut olması), 22 adetinin gayr-i Müslimlerin kendi aralarındaki meselelerine ait olması ve 10 tanesinin ise Müslim-gayr-i Müslim arasındaki anlaşmazlıklara ait olduğu görülmüştür.Sicil defterine bakıldığında Sivas merkezindeki insanların geçim kaynağının ticaret olduğu esnaf ve zanaatkarların varlığından anlaşılmaktadır. Bunun yanında tarım faaliyetlerinin varlığından da söz edilmelidir."
