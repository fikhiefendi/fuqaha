abstract: "Hanefi mezhebinde usulî kaidelerin yeri ve yine mezhepte bunların uygulama ve temellendirme açısından nasıl ele alındığı konusu çalışılmayı hak eden konulardan biridir. Buradan hareketle bu çalışma usulî kaidelerin doğuşu, gelişimi ve belirli bir metot üzerinden şer'î amelî hükümlere ulaşmak için fakihlerin bunları kullanma biçimi ele alınmıştır. Çalışmanın konusunun Hanefi mezhebinin önemli kitaplarından olan Mecme'ü'l-Bahreyn adlı eserin şerhlerinden biri olan, Leknevî'nin hakkında“O, ilimlerin çoğunu yeteri kadar ezberlemesiyle ünlü ve ilimlerin zor alanlarında en seçkin kişilerden biriydi ve hem avam tabakasında hem de üst tabakalar arasında tam bir kabul görmüştü”dediği el-Kirmanî'ye ait kitap üzerinden olmasını tercih ettik. Bu çalışmanın en önemli hedefleri usulî kaidelerin mahiyetini beyan etmek, özellikle Hanefi alimler ve Kirmanî'ye göre doğuş ve gelişimine ışık tutmak, yine onun şerhinde kullandığı kaidelerin lafızları üzerinden usulî kaideleri ele almadaki ve usulî kaidelerle istidlal şekli ile bunları furu' fıkha tatbik yöntemini çıkarmaya çalışmaktır. Bundan sonra da müsteceddat üzerindeki etkisini görebilmek adına bu şerhten elde edilen usulî kaidelerin bazı güncel meselelere uygulanması amaçlanmaktadır. Bu hedeflerin gerçekleştirilmesi için birden çok metot kullanılmıştır. Bunların en önemlileri; Kirmanî'nin eserinden usulî kaideleri bulup çıkararak bir araya getirmek için kullanılan tümevarım metodu ve Kirmanî'nin metodunu ortaya koyabilmek için elde edilen bu kaidelerin tahlil ve analiz edilmesinde kullanılan analiz metodudur. Çalışmanın vardığı en önemli sonuçlardan bazıları şunlardır: Hanefi usulünde kaidelerin oluşturulmasında katkısı olan alimler arasında ön plana çıkanlar Kerhî, Cessas, Debûsî, Serahsî ve Pezdevîdir. Kirmanî, özellikle Mecme'ü'l-Bahreyn'e yaptığı şerhte usulî kaidelere özen ve itina gösteren bir alimdir. Bu özelliği eserinde kaideye ve onunla bağlantılı olan hükümlere yaptığı atıflarda ve bunların peşinden gelen fıkhi meselelere yaptığı beyanlarda ortaya çıkmaktadır. Bu meselelerin sunuşunda farklı üsluplar kullanmış ve bu da onun ilminin genişliği ve anlayışının dakikliğini ortaya koymuştur."
