abstract: "Katılım bankalarının kuruluş gerekçeleri, bu bankaların geleneksel bankacılık yöntemlerinden farklılaşmasını sağlamakta ve özgünlüğünün temelini oluşturmaktadır. Katılım bankalarının faaliyet gösterdiği ülkelerin bankacılık sistemleri çoğunlukla ikili bir görünüme sahiptir. Merkez bankaları bu sistem içerisinde yer alan oyuncular ile görev ve sorumlulukları çerçevesinde yoğun bir ilişki kurmaktadır. İkili bankacılık sisteminde katılım bankacılığı ilkelerinin tamamen gözetilmesine yönelik bir merkez bankası anlayışı mevcut değildir. Bu durum katılım bankaları ile merkez bankaları arasında gerçekleşen bazı uygulamalarda katılım bankacılığı ilkelerinin ihlal edilmesine yol açmaktadır. Türkiye'de faaliyet gösteren katılım bankaları ile TCMB ilişkileri, içerisinde birçok sorunu barındırmaktadır. Bu sorunlar arasında; TCMB'nin zorunlu karşılık uygulaması doğrultusunda katılım bankalarının faiz içerikli bir sürece maruz bırakılması, açık piyasa işlemleri (APİ) çerçevesinde gerçekleştirilen repo uygulamasının tartışmalı bir ürün olan sat-geri al (Bey'u'l-Îne) uygulaması kapsamında gerçekleştirilmesi, APİ ve hazır imkân uygulamalarında geleneksel bankalara kıyasla katılım bankalarına sınırlı sayıda ürün ile hizmet sunulması gibi hususlar yer almaktadır. Bu sorunların toplamında karşımıza çıkan tablo ise TCMB nezdinde katılım bankacılığı alt yapısına uygun bir sisteminin mevcut olmadığıdır. Çalışmanın temel amacı, Türkiye'de faaliyet gösteren katılım bankaları ile TCMB arasındaki işlemleri katılım bankacılığı ilkeleri temelinde yeni uygulama önerileri üzerinden şekillendirmek ve bu önerilerin para politikası, kurumsal kimlik politikaları, makro iktisadi değişkenler üzerindeki olası etkilerini çözümlemektir. Uygulama önerileri çerçevesinde; ilk olarak, TCMB nezdinde katılım bankacılığı sistemine uygun bir alt yapının oluşturulması amacıyla faizsiz pencere sistemine dayanan bir sistemin kurulması önerilmiştir. Ardında bu organizasyon çatısı altında zorunlu karşılık işlemleri ile para ve sermaye piyasası işlemlerine yönelik yeni uygulama önerilerine yer verilmiştir."
