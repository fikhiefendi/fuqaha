abstract: "Bu çalışmada Türkiye'de 1980'den sonra İslami sermaye birikim süreci analizedildi. İslami sermaye bağlamında dünya genelindeki İslam ekonomisi tartışmalarınabakıldı. Serbest piyasa ekonomisi, İslami çevrelerde ekonomik model olarak genel kabulgörmekte ve uygulamada faiz gibi birkaç sorun dışında İslami açıdan sıkıntıgörülmemektedir. İslami sermayenin ve İslam bankacılığının gelişiminde dönemin iç vedış ekonomik, siyasi konjonktürü belirleyici olmuştur. Kapitalizmin 1970'lerde yaşadığıpetrol krizinin küresel ekonomik etkileri, İslami bankacılığın ortaya çıkışında etkiliolmuştur. Bu bağlamda siyasal İslam'ın gelişimi ile İslami sermayenin gelişimi arasındakiilişki incelenmiş ve bu ilişkide bazen siyasetin bazen de ekonominin belirleyici olduğugörülmüştür. Türkiye'de de 1980 sonrası İslami sermayenin gelişiminde 12 Eylül askeridarbesi etkili olmuştur. İslam bankacılığı ?Özel Finans Kurumları? adıyla askerisıkıyönetimden sonraki ilk hükümet tarafından yasalaştırılmıştır. Türkiye'de İslamisermayenin gelişiminde Özel Finans Kurumları önemli bir role sahip olmuştur. Siyasalİslam'ın gelişmesine paralel olarak İslami ekonomik kurumlar da 1990'ların ortasına kadarivme kazanmıştır. 28 Şubat süreci İslam'ı hem siyasal hem de ekonomik planda düzeninsınırları içine çekmiştir. Kabul edilebilir sınırlar içinde İslami sermaye özellikle bankacılıkalanında büyümüştür. İslami bankacılık büyürken, İslami öğelerden uzaklaşıp liberalekonomi ile bütünleşmiştir. Küresel kapitalist bir ekonomide kar maksimizasyonu hedefi,İslami hedeflerden daha baskın gelmiştir. Faizli ticari bankalar ile arasında bir farkkalmamıştır. Dağıtığı kar payları İslam bankacılığın temeli olan kar-zarar ortaklığıyöntemiyle değil murabaha yöntemi ile oluşmaktadır. İslam bankacılığı içindeki pay %90'lara ulaşan bu yöntemde gizli faiz, gölge faiz olduğu konusunda genel kanı vardır.İslami mevduatlara kar-zarar ortaklığı esasına aykırı olarak devlet garantisi ve güvencegetirilmiştir. İslam fıkıhçılarını da rahatsız eden bu gelişmeler, İslami esaslara göre işyaptığını söyleyen İslami sermayenin temel sorunudur."
