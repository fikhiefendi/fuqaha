abstract: "İnsani yardımın temel aracı ve sivil toplumun vazgeçilmez unsuru olan vakıflar, faaliyetlerinin finansmanı için sürekli kaynak arayışındadır. Bu kaynaklar genellikle bağışlar, kurumsal destekler, devlet destekleri ve uluslararası projeler gibi seçeneklerden oluşmaktadır. Ancak bu kaynaklardan elde edilen gelirler öngörülebilir ve devamlı değildir. Dolayısıyla finansman konusundaki zorluk ve eksiklikler, vakıfların sürdürülebilirliği önündeki en büyük etkenlerin başında gelmektedir. Araştırmanın temelini teşkil eden Girişim Sermayesi Vakfı modeli, bahsedilen sorunlara bir çözüm arayışı olarak, vakıfların hem finansal istikrarlarını sağlamasını hem de gelirlerini düzenli bir şekilde artırmasını hedefleyen bir yapı önermektedir. Bir başka ifadeyle araştırmanın konusu, Osmanlı döneminde yaygın olarak kullanılan para vakıflarının günümüz yansıması olarak sosyal etki yatırımlarını önceleyen sürdürülebilir bir girişim sermayesi vakfı model önerisinde bulunmaktır. Bu model önerisi geleneksel, sosyal etki ve İslami girişim sermayelerinden farklılaşarak, iktisadi kalkınmaya katkı sağlayabileceği öngörülen yeni ve bütüncül bir yaklaşımdır. Araştırmanın öncelikli amacı; para vakıflarının ve girişim sermayelerinin temel alındığı; yeni, sürdürülebilir ve sosyal etkisi yüksek bir vakıf modeli sunmaktır. Araştırmanın ikincil amacı ise sunulan vakıf modelinin uygulanabilirliğinin bir saha araştırmasıyla incelenmesidir. Çalışmada nitel araştırma yöntemleri kullanılmıştır. Veriler yarı yapılandırılmış açık uçlu mülakat yöntemiyle toplanmış ve içerik analizi ile incelenmiştir. Araştırmaya paya dayalı kitle fonlama platformuna üye toplam otuz iki kişiyle mülakatlar gerçekleştirilmiştir. Yapılan analiz sonuçlarına göre bulgular beş farklı temada toplanmıştır. Bu temalar“bağış davranışı”,“vakıflar”,“girişim firmaları”,“GSV modeli”ve“dindarlık”tır. Araştırmadan elde edilen bulgu ve sonuçlardan hareketle, modelin çıkış noktası olan ancak piyasada bir türlü etkin uygulamalarına rastlanılmayan para vakıflarının, günümüze uyarlanmış, sürdürülebilir ve sosyal etkisi yüksek bir model olan GSV ile hayata geçirilebileceği söylenebilir."
