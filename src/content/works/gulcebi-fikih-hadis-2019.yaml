abstract: "İslami ilimler tarihi süreç içerisinde çeşitli faktörlerin de etkisiyle gelişime açık olmuştur. Bir ilimdeki çalışmaların üst düzeyde olduğu diğer ilimlerde hiçbir çalışmanın olmadığı bir dönem olmamıştır. İlimleri anlama ve yorumlama noktasında ıstılâhlar büyük bir öneme sahiptir. Her ilim dalı ıstılâhlarıyla, kendi oluşturduğu kavramlarla kendini ifade eder. İslami ilimlerin grift bir yapıya sahip olması, disiplinlerarası çalışmaların yapılmasını ve bu çalışmaların öneminin vurgulanmasını beraberinde getirmektedir. Çalışmamızın konusu fıkıh ve hadîs ilminde müşterek olarak kullanılan terimlerin tespiti ve bu terimlerin son dönemde kazanmış oldukları anlamların mukayeseli bir şekilde açıklanmasıdır. Terimlerin fıkhî anlamları, Hanefî mezhebi ve mezhepteki müftâbih görüşler dikkate alınarak verilmiştir. Tez çalışmamız, fıkıh ve hadîs ilmi arasındaki ilişkinin ne kadar kuvvetli olduğunu; tarihi gelişim sürecinde ıstılâh çalışmalarının neler olduğunu ve hangi dönemlerde yapıldığını; hangi alanlarda ortak olarak kullanılan terimlerin fazla olduğunu; terimlerin sözlük ve ıstılâhi anlamları arasındaki yakınlığı; Hadîs-i şeriflerde, hangi ilim dalındaki anlamıyla kullanıldığını; ortak olarak belirlenen ıstılâhların hangi dönemde fıkıh ve hadîs kitaplarına alındığını göstermesi açısından önem arz etmektedir. Anahtar Kelimler: Fıkıh, Hadîs, İlim, Istılâh, Müşterek"
