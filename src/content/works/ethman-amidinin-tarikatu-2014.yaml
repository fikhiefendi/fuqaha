abstract: "Hicrî 6. Asırda mezhepler arasında fıkhî ihtilaflar artmıştı. Bu, Hanefîler ile Şafiiler arasında ise daha da sık yaşanmaktaydı. Her bir mezhebin alimleri, deliller zikretmek suretiyle kendi mezhebini temellendiriyor ve muhaliflerinin delillerini çürüterek kendi mezhebinin savunusunu yapıyordu.İşte böyle bir dönemde, döneminin önde gelen Şâfiî alimleri arasında bulunan İmam Âmidî, bu iki mezhep arasındaki öne çıkan ihtilaflı meseleleri tartışmak için et-Tarîkatü's-sağîrâ adlı eserini kaleme almıştır. Âmidî kitabını dört konuya ayırmış olup her konuyu on mesele etrafında ele almıştır. Her meseleye, kendi mezhebi olan Şâfiî mezhebinin görüşüyle başlayan Âmidî, ardından Hanefî mezhebinin görüşlerini serdeder. Hanefî mezhebinin görüşlerini imkan nispetinde hem naklî hem aklî delillerle delillendirmeye gayret eder. Daha sonra bir bir bu fikirleri çürütmek üzere tekrar ele alır ve bu meyanda Âmidî kendi mezhebini desteklemek adına Şâfiî mezhebinin delillerini zikreder. Eser boyunca, Âmidî'nin istidlal yapmada ve Kur'ân, hadis ve kıyasa çokça başvurabilmekteki yetkinliği müşahade edilmektedir. Kitabın önsözünde Âmidî'nin hayat hikayesine, ilmî hayatına ve onun hayatının altın çağını yaşadığı dönemde ilmî hayatın ne durumda olduğuna yer verilmiştir."
