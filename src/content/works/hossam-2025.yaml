abstract: "Sukuk, İslami finans sektöründe en önemli finansal araçlardan biri olup, konvansiyonel tahvillere şer'i bir alternatif sunmaktadır. Faizsiz bir araç olarak öne çıkan sukuk, genellikle büyük projelerin finansmanında kullanılmaktadır. Bu çalışma, sukukun mahiyetini, diğer menkul kıymetler olan hisse senetleri ve tahvillerle temel farklılıklarını, ayrıca tasarrufları çekme ve yatırım yapmadaki rolünü ele almaktadır. Çalışma ayrıca sukuk türleri ile ihraç, alım-satım, kâr dağıtımı ve itfa süreçlerindeki şer'i hükümleri açıklamaktadır. Çalışmada, Türkiye'de İslami bankacılığın (katılım bankaları) doğuşu ve gelişimi üzerinde durulmuş, bu bankalarda sukuk ihraç faaliyetleri ve Türkiye finans piyasasındaki işleyişi detaylandırılmıştır. Ayrıca, Türk finans piyasasındaki sukuk işlemlerinin İslam hukuku kurallarına uygunluğu incelenmiştir. Bunun yanı sıra, Türkiye ve Afganistan'da sukuk ve İslami bankacılığın mevcut durumu genel olarak karşılaştırılmış, iki ülkenin finans sektöründeki farklılıklar ve karşılaşılan zorluklar açıklanmıştır. Türkiye'de katılım bankaları olarak bilinen İslami bankacılığın kökleri Osmanlı dönemine kadar uzanmakta olup, zamanla kayda değer bir gelişim göstermiştir. İslam hukuku prensiplerine uygun hizmetler sunan bu bankaların,“kira sertifikaları”adı altında ihraç ettiği sukuk İslami bankaların likiditesini artırarak yatırımcılar için cazip bir seçenek haline gelmiştir. Türkiye'nin İslami finans ve sukuk ihraç alanındaki tecrübesi, İslami finansmanın geliştirilmesinde öncü bir model olarak değerlendirilmektedir. Afganistan'da ise İslami bankacılık, Türkiye'ye kıyasla daha geç başlamış ve hizmetleri sınırlı bir şekilde gelişmiştir. Bu durum, toplumun ve finans sektörünün ihtiyaçlarını tam anlamıyla karşılayamamasına yol açmıştır. Afganistan'ın önceki hükümeti, sukuk ihraçlarını kolaylaştırmak için çeşitli adımlar atmış ve mevcut hükümet de bu finansal araca öncelik vermiştir. Bu çerçevede, sukuk ihraçlarını düzenlemek için özel bir yasa hazırlama komisyonu kurulmuş, yasa taslağı hazırlanmış, ancak henüz kanunlaşma yönünde somut bir ilerleme sağlanamamıştır. Çalışmada, iki ülke arasındaki ortak noktalar göz önünde bulundurularak, bankacılık sisteminin geliştirilmesi ve sukuk ihraçında örnek alınabilecek bir model olarak Türkiye deneyiminden yararlanılabileceğine işaret eden bazı öneriler sunulmaktadır. Çalışmada ayrıca Afganistan'da bu alanın geliştirilmesi için Türkiye'nin verebileceği teknik destekten faydalanılmasının önemi vurgulanmaktadır."
