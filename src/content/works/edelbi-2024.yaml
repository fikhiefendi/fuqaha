abstract: "Çalışmanın problemi Suriye'deki faizsiz bankacılık sektöründe sosyal sorumluluğun uygulanması gerçeğini araştırılmasıdır. Yıllık mali raporlarında açıklananları üzerinden araştırmaktır. Bu araştırmayla, bir yandan Suriye'deki İslami bankaların sosyal sorumluluğa verdikleri önemi göstermeyi, diğer yandan da paydaşlara yönelik sosyal sorumluluk konusundaki taahhütlerinin boyutunu değerlendirmeyi hedefliyoruz. Değerlendirmemizde sosyal kimlik endeksini esas alarak betimleyici analitik yaklaşımı kullandık ve Çalışmanın sonuçları, Suriye İslami bankalarının sosyal sorumluluk konusunda en önemli üzere birçok nedenlerden dolayı bir eksiklikler olduğunu gösterdi. Bu bankalar için Savaş koşullarının Suriye toplumuna dayattığı asıl zorluklar, ardından da öncelik sırasını değiştiren Corona salgını geliyor. bu bankalar için öncelik sırasını değiştirdi. Çalışma, İslami bankaların sosyal sorumluluk konusunda ihmalkâr olmalarına rağmen, ellerindeki imkanlar dahilinde toplumlarıyla iletişim kurmaya istekli oldukları sonucuna varmıştır. Çalışmada Suriye İslami bankalarının bundan sonradaki aşamada varlıklarının özü ve özü olan sosyal sorumluluğa daha fazla öncelik vermeleri ve bu bankaların sosyal sorumluluk performanslarını sosyal medyanın etkinliğini ve kalitesini artıracak şekilde düzenlemeleri önerildi. Sorumluluk uygulaması onun toplumunda."
