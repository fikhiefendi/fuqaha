abstract: "Özellikle kriz dönemlerinde reel sektör firmalarının en ciddi sorunu finansman sağlamak ve krizi bu yolla yönetebilmektir. Bilindiği gibi reel sektörün en önemli ve birincil finans kaynağı bankalardır. Son yıllarda gittikçe önemi artan ve bankalara benzer şekilde işletmelere finans sağlayan Katlım Bankalarıda bu sürecin bir parçası olmuştur. Çalışmamızda özellikle kriz dönemlerinde Reel sektör firmalarının Bankalar ve Katılım Bankaları ile çalışmaları irdelenmiş ve krizi atlatma ve krizde finansal sorunlarını çözme bağlamında bir değerlendirme yapılmıştır. Katılım Bankacılığın sektör içerisindeki payının düşük olması ve niceliksel bir analiz yapmaya yetecek seviyede bir tarihsel gelişimi bulunmaması çalışmanın en önemli kısıtı olmuştur. Buna bağlı olarak derinlemesine mülakat yöntemi tercih edilmiş olup, toplamda 18 firma ile derinlemesine mülakat yapılmıştır. Karşılaştırmanın sağlıklı bir şekilde yapılması için bu firmalardan 6 tanesi sadece Katılım Bankası ile çalışan firma, 6 tanesi sadece Mevduat Bankası ile çalışan, 6 tanesi ise hem Katılım hemde Mevduat Bankası ile çalışan firma seçilmiştir. Firmaların birbirine yakın özellikte olmasına azami gayret gösterilmiş ve firma temsilcilerininde benzer niteliklere sahip olmasına dikkat edilmiştir. Toplam 18 sorudan müteşekkil soru seti mülakat esnasında derinleştirilmiştir. Değerlendirme sonucunda Kriz dönemlerinde katılım bankaları ile çalışan işletmelerin mevduat bankaları ile çalışan işletmelere göre krizi daha kolay atlattıkları müşahade edilmiştir. İşletmelerin likidite konusundaki duyarlılıkları, kullanılan kredilerin karşılığının bilançoda yer alması (Asimetrik Enformasyon), kriz dönemlerinde mevcut kredilerin geri çağrılmıyor olması ve yine kriz dönemlerinde fon kullandırım oranlarında bir değişiklik yapılmıyor olması bu durumu ortaya çıkartan en önemli etkenler olarak görülmüştür."
