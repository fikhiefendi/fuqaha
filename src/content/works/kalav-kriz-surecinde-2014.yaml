title: "Kriz Sürecinde İşletmelerin Finansmanında Katılım Bankalarının Rolü ve Mevduat Bankaları ile Mukayesesi: Bir Uygulama"
titleTranslation: {"en": "Role of the participation banks in the finance of enterprises within the crisis periods and their comparison with deposit banks: An application"}
