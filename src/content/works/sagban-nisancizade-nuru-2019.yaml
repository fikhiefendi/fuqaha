abstract: "Nûru'l-'Ayn fi Islâhi Câmi'i'l-Fusûleyn eseri, Nişancızâde tarafından, Şeyh Bedredin'in Mecdüdddin el-Usrûşenî'nin (ö. 632/1235) el-Fusûl ile İmâdüddin el-Merğinânî'nin Fusûlü'l-ihkâm fî usûli'l-ahkâm adlı eserlerini bir araya getirerek telif etmiş olduğu, yargılama hukuna dair eseri olan Câmi'u'l-Fusûleyn'i ıslah etmek amacıyla yazılmıştır. Çalışmamız, Nûru'l-'Ayn'ın 20 ve 24. fasılları ile Câmi'u'l-Fusûleyn'in 20 ve 25. fasıllarının karşılaştırılmasını ve incelenmesini amaçlamakta olup iki bölümden oluşmaktadır. İlk bölüm, iki eser arasında fasılların muhtevası, üslup telif tarzı, lafız-nakil tercihleri bakımından yapılan karşılaştırmayı ve Nişancızâde'nin eser üzerinde ıslah amacıyla yapmış olduğu tasarrufların incelenmesini içermektedir. İkinci bölüm ise, fasılların Nûru'l-'Ayn'ın iki farklı müellif nüshası üzerinden tahkikini içermektedir."
