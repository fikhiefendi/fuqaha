abstract: "Kimsesiz çocukların korunması ve bakımı toplumlarda sürekli bir sorun teskiletmistir. Her toplum ekonomik, sosyal ve kültürel durumuna göre kimsesiz çocuklarınkorunması ve bakımı hususunda bir takım düzenlemeler yapmıstır. ?slam Hukuku datoplumsal bir yara olan kimsesiz çocuklar sorununa dikkat çekmis ve ?lakit? baslığı altındakimsesiz çocukların bakımı, korunmaları, nafakaları, dinleri ve neseplerinin belirlenmesihususunda sürekli terkedilmis çocukların lehine hükümler ortaya koymustur.?slam Hukuku kimsesiz çocukların bakımı, korunması ve topluma kazandırılmasıiçin en uygun yöntemin bir aile içinde bakılması ve büyütülmesi olduğunu kabul etmis, buyüzden istemesi halinde terkedilmis çocuğun bakımı ve korunması sorumluluğunuöncelikle onu bulup alan kimseye yüklemistir. Bu çocukların nafakalarının da varsa kendimallarından karsılanacağı, malları yoksa nafakalarını devletin karsılayacağı hükmebağlanmıstır. Günümüzde ise kimsesiz çocukların bakımları ve korunmaları hususundaevlat edinme ve koruyucu aile uygulaması ön plana çıkmıstır."
