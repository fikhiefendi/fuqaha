abstract: "İslam, kâinatın özü üsaresi mahiyetinde olan insanın başıboş yaratılmadığı her fırsatta ifade etmiştir. İnsanın görülen, görülmeyen tüm varlıkları yaratan Allah'la, etrafındaki insanlarla, mahlûkatla, nebatatla ve ruhaniyatla bir münasebeti vardır. Dolayısıyla bu sayılanlara karşı bir sorumluluğu ve yükümlülüğü de söz konusudur. Bu minvalde inananların, özelde de kadınların bu mükellefiyetlerini bir şekilde öğrenmeleri ve hayatlarını buna göre tanzim etmeleri gerekmektedir. Kadın konusu bütün din ve sistemlerde tartışılmış ancak en mutedil ve fıtrata en uygun hükümler şüphesiz dinimizde yer almaktadır. Zira İslam bir beşer sistemi değil ilahî nizamlar bütünüdür. Geleceğin toplum ve dünyasını inşa etmede kadın ve ailenin ehemmiyeti bu kadar açıkken bu alanda telif edilmiş eserler maalesef az sayıdadır. Bu çalışma hicrî VI. yüzyılda yaşamış büyük âlim Ebu'l-Ferec Abdurrahman b. Ali İbnu'l-Cevzî'yi (ö.597/1201) ve İbnu'l-Cevzî'nin“Ahkâmu'n Nisa”adlı eserini incelemektedir. Bu eser bu alanda kaleme alınmış ilk eser olma özelliğini taşımaktadır. Hususiyle kadınlara ait hükümlerin ayet, hadis ve kıssalarla anlatıldığı bu eserin hem Türkçe'ye kazandırılması hem de bu eser üzerinde akademik çalışmalar yapılması gerektiği aşikârdır."
