abstract: "Tez giris, üç ana bölüm, sonuç, bibliyografya ve eklerden olusmaktadır: Giris bölümünde; slam öncesi dönem ile slam'ın zuhurundan sonraki dönemde ölçü, tartı, para birimleri ve nisap kavramının ortaya çıkısı incelendi. Birinci bölümde; ölçü , tartı ile ilgili ayetler ile zekat, fıtır sadakası, diyet ve ganimetlerdeki nisap konusu ile ilgili hadisler arastırıldı. kinci bölümde; slam hukuku açısından nisabın tarifi ve bölümleri ele alınıp, zekata tabi malların nisabı ile fıtır sadakası, kurban, diyet, hırsızlık haddi, zıhar kefareti, mehir ve nafakada nisap konusu incelendi. Üçüncü bölümde; temel ihtiyaçlar, ihtiyaçların zamana göre degismesi arastırılıp, Hz. Muhammed dönemi ile günümüzdeki ihtiyaç kavramı karsılastırıldı. Sonuç bölümünde ise somut olarak ne yapılması gerektigini ifade edilerek tez bibliyografya ve yoksulluk sınırları ile ilgili arastırma ve istatistikleri ihtiva eden eklerle tamamlandı."
