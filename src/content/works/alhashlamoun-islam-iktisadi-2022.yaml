abstract: "Bu çalışmada, İslâm iktisadı bakış açısına göre vakıfların sürdürülebilir iktisadi kalkınma konusu incelenmektedir. Vakıfların temel hedefi, toplumun sosyo-ekonomik ihtiyaçlarını karşılamak için istikrarlı ve kalıcı finansal kaynaklar oluşturup toplumun farklı tabakaları arasındaki dayanışmayı sağlamaktır. Ekonomik, sosyal ve çevresel boyutlara ulaşmanın yanı sıra sürdürülebilir kalkınmanın dayandığı bağlam budur. İslâm medeniyetinde vakıflar, ilk çağlardan günümüze kadar oynadığı rol bakımından, esnekliğinin yanında sürdürülebilir kalkınma teriminin ortaya çıkmasıyla birlikte dünya devletlerini ve kuruluşlarını sürdürülebilir kalkınmaya yöneltmektedir. Bu tez, vakıf mekanizmalarından biri olan İslâm iktisadı açısından, sürdürülebilir kalkınmayı sağlama noktasında, vakıfların rolüne ışık tutar niteliktedir. Sürdürülebilir kalkınma göstergeleri; insani değerler ve mevzuat açısından İslâm iktisadında somutlaştırılmıştır. Bu çalışma, bahsedilen sorunsala, sürdürülebilir kalkınma boyutlarını da ele alarak İslâm iktisadı'nın bakış açısından net bir çözüm getirmektedir. Ayrıca bu araştırma, vakıf çalışmalarını genişletmek, sürdürülebilir kalkınma performansını geliştirmek ve gerekli olan en önemli modern yatırım araçları için pratik modeller ve fikirler ortaya koymaktadır."
