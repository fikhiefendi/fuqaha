abstract: "Her ibadetin Şari' tarafından konulmuş bir hükmü ve kendi içerisinde kuvvet bakımından dereceleri vardır. Namaz da bu ibadetlerden biridir. Farz olan beş vakit namaz olduğu gibi nafile ve vâcip namazlarda vardır. Ancak farz namazlar haricinde hakkında çokça rivayetin zikredildiği, mezheplerin ihtilaf ettiği bir namaz vardır ki o da vitir namazıdır. Vitir namazının hükmünde ihtilaf eden iki taraftan biri vitrin vâcip olduğunu ileri süren Ebû Hanîfe ve ashabı; diğeri de, vitrin müekked sünnet olduğunu ileri süren, içlerinde İmâmeyn'in de bulunduğu cumhurdur. İki taraf da nakli delilleri kullanmakla beraber bu delillerden aklî çıkarımlar elde etmiştir. Aynı zamanda her iki tarafta aynı delillerden farklı hükümler elde etmişlerdir. Bunun sebebi ise, nassların keyfiyeti ile doğrudan ilişkilidir. Bu nassların keyfiyeti ile kast edilen şey, yoruma açık olmaları, delalet ve sübut bakımından zan ifade edip etmemelidir. Tüm bu etkenler, Hanefîler ile Cumhur arasında vitir namazı ile ilgili hüküm vermede ihtilafa sebebiyet vermiştir. Mezheplerin üzerinde tartıştığı bu ihtilaf sadece vitrin hükmü ile sınırlı değildir. Vitrin rekâtları, vakti, kazası, kılınışı, kırâati gibi hususlarda mezheplerin ihtilaf ettiği önemli noktalardır. Diğeri ise vitir namazında yerine getirilen kunuttur. Kunut da kendi içerisinde, hükmü, duası, miktarı vb. birçok yerde mezheplerin ihtilafı ile geniş bir yer tutmaktadır. Tüm bu ihtilafların asıl kaynağı vitir namazının sünnet veya vacip olmasıyla ilişkilidir. Yani vitir namazının vacip olması vitirde okunan kunut dualarının hükmüne etki etmiştir. Çünkü tüm bu sayılanlar vitrin içinden bir ibadet olarak değerlendirilir. Dolayısıyla vitrin hükmünde ihtilaf edenler, ona bağlı diğer hususlar üzerinden de ihtilaf etmişlerdir. Başka bir önemli husus, ihtilafın kaynaklandığı ana sebepledir. Bu sebepler Hz. Peygamber'in nebevi ve beşerî yönü, hadislerde geçen lafızların farklı manaları ifade etmesi, usûl-ü fıkıh gibi birçok yönden değerlendirilmiştir."
