abstract: "Bu çalışmanın amacı Türkiye'de katılım bankacılığı sisteminin gelişimini ve seçili ülkeler çerçevesinde konvansiyonel bankalarla karşılaştırmasını ortaya koymayı amaçlamaktadır. Dünya genelinde katılım bankacılığı 1960 yılı itibariyle gündeme gelmiş ve 1976 yılında ilk kez Mısır'da uygulama alanı bulmuştur. Katılım bankaları hizmet vermeye başladığı yıllarda özellikle Müslüman ülkelerde faaliyet gösterirken günümüzde çeşitli gereksinimlerin giderilmesi amacıyla dünya genelinde önem arz eden bir işlevselliğe sahiptir. Türkiye'de 1983 yılında çıkartılan 83/7506 sayılı Kanun Hükmünde Kararname ile katılım bankacılığının ekonomik sistem içerisinde yer almaya başladığı görülmektedir. İlk katılım bankası“Özel Finans Kurumu”ismiyle kurulmuş ve akabinde 5411 sayılı Bankacılık Kanunu'nda yapılan değişiklikle“Katılım Bankaları”ismini almıştır. Türkiye'de katılım bankalarının faaliyetlerinde 2001 ekonomik krizinin ardından büyük bir ivme kazandığı söylenebilir. Katılım bankaları bu tarihten itibaren konvansiyonel bankalar ile rekabet edebilir hale gelmiştir. Bunun nedenleri arasında katılım bankalarının bankalar kanununa tabii ve konvansiyonel bankalar ile mevzuat bakımından eşit haklara sahip olması yer almaktadır."
