abstract: "Bu araştırma, yaklaşık dokuz asır önce yazılmış en önemli kitaplardan birini ortaya koymaktadır. Söz konusu kitap Hanefi mezhebinin önde gelen fakihlerinden İmam Attabi'nin İmam Muhammed'e ait el-Cemiu'l-kebir adlı eserine kendi yazdığı şerhin yine kendisi tarafından yapılan ihtisarı üzerine araştırma ve eserin tenkitli neşri amacını taşımaktadır. Çalışma, giriş ve iki temel bölümden oluşmaktadır. Girişte çalışmanın konusu, amacı ve önemi gibi hususlara değinilmiştir. Birinci bölümde çalışmanın amacı, içeriği gibi hususlar yanında gün yüzüne çıkardığımız eserin kaynağı olan İmam Muhammed'in el-Cemiu'l-kebir'i ve müellifi tanıtılmı, haklarında bilgiler verilmiştir. Sonra bu eser üzerine yapılan çalışmara temas edilmiş, ardından İmam Attabi'nin hayatı ve eserleri tanıtılmış ve el-Cemiu'l-kebir şerhinin muhtasarı hakkında malumat sunulmuştur. Söz konusu bölüm Türkçe ve Arapça olmak üzere kaleme alınmıştır. Yine burada eserin tahkikinde tapip ettiğimiz metottan bahsedilmektedir. Ayrıca çalışılan yazma eserin nüshaları hakkında bilgiler verilmekte ve sonuç bölümü ile bu kısım sona erdirilmektedir. İkinci bölüm ise Attabi'nin eserini tenkitli neşrinden oluşmaktadır. Tenkitli neşirde üç nüsahadan istifadeyle oluşturulmuştur. Attabi muhatasar fıkıh eserini, fıkhi meseleleri talebelerin zihnine yaklaştırmak için yazmış, daha önce yazdığı şerhin sebep olabileceği mahzurları bertaraf etmek için uğraşmıştır. O bu haliyle kendi yazdığı şerhin muhtasarını sıradan bir özetleme çalışması olarak ortaya komamış, adeta daha sistemli bir kitap olarak yeniden telif etmiştir. Tenkitli metinden sonra metinde geçen ayet ve hadislerin indeksi ile isim indeksi de eklenmişti."
