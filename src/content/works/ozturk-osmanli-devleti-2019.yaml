abstract: "İnsan olmanın ve aynı yeryüzünde yaşamanın getirdiği doğal bir etkileşim olsa gerek ki ulusların ve devletlerin uzaktan ya da yakından birbirleri ile tesis ettiği münasebetlerde isimleri ve karakterleri farklı olsa da aynı gayeye hizmet eden makamlara ve uygulamalara rastlamak mümkündür. İşte imtiyâzlar ya da diğer bir ifade ile kapitülasyonlar bu kadim uygulamalardan biridir. Kuruluşundan itibaren uzun yıllar Osmanlı Devleti'nin coğrafi ve siyasi konumu dolayısıyla sahip olduğu avantajları ve dezavantajları diplomatik bir maharetle kendi lehine çevirebilmesinin sanatı olarak da tasvir edebileceğimiz imtiyâzlar, fıkhi dayanakları ve uygulamadaki tezahürü ile çalışmamızın esasını teşkil etmektedir. Nitekim bu çalışmada imtiyâzlar, kendisine hukuki mesned teşkil eden klasik islam müesseselerinden emân akdi üzerinden temellendirmeye çalışılmış ve Osmanlı Devleti'nin İngiltere'ye vermiş olduğu 1675 tarihli imtiyâznamenin maddeleri üzerinden fıkhi açıdan değerlendirmeye tabi tutulmuştur. Bu sayede meselenin hem nazari hem de ameli cephesini tarihi resmi bir vesika özelinde görmek mümkün olmuştur."
