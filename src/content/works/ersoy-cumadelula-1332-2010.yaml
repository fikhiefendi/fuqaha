abstract: "Osmanlı Devleti'nin en önemli yargı organı Şer`î Mahkemelerdir. Devletin muhtelifdevirlerdeki hukûkî, iktisâdî, dînî, askerî ve idârî müesseseleri hakkında çok değerli bilgilerbu mahkemelerin defterlerinde bulunmaktadır. Bu belgeler din, dil, renk farkıgözetmeksizin bütün teb`â ile ilgili olayları ve bu olayları ilgilendiren mahkeme kararlarınıve idârî düzenlemeleri ihtivâ etmektedir. Bu siciller aynı zamanda XV. Yüzyılın yarısındanbaşlayarak XX. Yüzyılın ilk çeyreğine kadarki yaklaşık 472 yıllık Türk kültür ve tarihinintemel kaynaklarının başında gelmektedir.20. yüzyılın başında Osmanlı toplumunun içinde bulunduğu sosyal durumuöğrenmeye yönelik bir katkı sağlaması amacıyla yapılan bu çalışmada H. 1332 (M. 1914)tarihli Erzincan Şer`iyye Sicili incelenmiştir. Çalışmamızın temel kaynağını oluşturan busicil, toplam 107 varak ve 214 sahîfeden oluşmaktadır. Bu çalışmamızda ilgili sicilin ilkyarısını (1914-1922) oluşturan 99 sahîfenin transkripsiyonu yapılmıştır. Bu bölümde toplam215 dava tespit edilmiştir.Erzincan'daki sosyo-kültürel hayat açısından değerlendirdiğimiz bu sicil, Osmanlıhayat tarzına yönelik çok önemli bilgiler ihtivâ etmektedir. Özellikle verâset, mehir, nafaka,vesâyet, vekâlet v.b. konuları içermekle birlikte dönemin idârî, iktisâdî ve dînî hayatıhakkında mühim bilgilere kaynaklık etmektedir."
