abstract: "Bu çalışma, hastalığın ibadetlere etkisi hakkındadır. Çalışmada, hastalara ibadet alanında sağlanan kolaylaştırmalar ve ibadetlerdeki şekil değişikliklerinden bahsedildi.Tez, bir giriş ve iki bölümden oluşmaktadır. Giriş bölümünde tezin konusundan, amacından ve yönteminden bahsedilmiştir.Birinci bölümde, ?Abdest ve Namazda Hastalığa İlişkin Hükümler? genel başlığının altında, bu ibadetlerde ne tür hastalıkların ibadetleri yapmaya engel teşkil ettiği ve ne gibi farklı uygulamaları gerektirdiği tespit edilmiştir. Buna göre, hastaların teyemmüm etmeleri, sargı üzerine mesh ve özürlülerin abdest alma biçimlerinden ve namazın şart ve rükünleriyle ilgili hastalara sağlanan kolaylıklardan bahsedilmiştir.İkinci bölümde, ?Oruç ve Hacda Hastalığa İlişkin Hükümler? genel başlığının altında hangi tür hastalıkların bu ibadetleri tam manasıyla yapmayı engellediği ve ne tür uygulamaları sonuç verdiği tespit edilmiştir. Bundan hareketle, orucun şartlarında hastalıkla ilgili hükümler ve oruç tutmamayı mubah kılan hastalıkla ilgili mazeretlerden ve haccın şartlarında ve hac fiillerinde hastalıkla ilgili uygulamalardan, bahsedilmiştir.Son olarak ise konular hakkında genel bir değerlendirme yapılmıştır."
