abstract: "Çağdaşı Osmanlı Türkçesi ile Türk dilinin uzun bir yazılı kültür geçmişine sahip iki büyük kolundan biri olan Çağatay Türkçesi, Türkologların genel kabul gören değerlendirmesiyle Orta Asya edebî Türk dilinin 15. yüzyıl ile 20.yüzyıl arasındaki dönemini kapsar. Bu çalışmada 19. yüzyılın ikinci yarısında yazılmış, Çağatay Türkçesinin son dönem dil özelliklerini yansıtan“Kıssa-i Hanîfe”adlı metin incelenmiştir. Kazan Devlet Üniversitesi Kütüphanesinde 643T demirbaş numarasıyla kayıtlı, 1857 (H. 1273) yılında istinsah edilen Arap harfli yazmanın müstensihi belli değildir. 344 sayfadan oluşan yazma;“Timur turında”,“Kıssa-i Zarkûm”ve ilki daha kısa olan iki“Kıssa-i Hanîfe”olmak üzere toplam dört metinden oluşmaktadır. Tezin esasını oluşturan“Kıssa-i Hanîfe”adıyla bilinen manzum hikâyeler, yazmanın 90b-170a sayfaları arasındadır. İlk metin 90b-110a, ikinci metin ise 110b-170a sayfaları arasındadır. Metinde; Muhammed Hanefî'nin hayatı etrafında şekillenen dinî-kahramanlık konulu olaylar anlatılır. Sözlü kültür ile yazılı kültürün iç içe geçtiği bu tür eserler, yazıldığı dönemin dil özellikleriyle ilgili oldukça zengin malzeme içerir. Bu sebeple metinden hareketle Çağatay Türkçesinin son dönem dil özelliklerinin örneklerle tanıklanması, tarihî karşılaştırmalı dil incelemesinin yapılması ve elde edilen verilerin Çağatay Türkçesi söz varlığına katkı sağlaması tezin asıl amacını oluşturmaktadır. Bu tez çalışmasında Arap harfli metnin Latin harflerine aktarımı yapılmış, inceleme bölümünde metnin yazım, ses ve şekil bilgisi özellikleri incelenmiş ve dil bilgisel dizin oluşturulmuştur."
