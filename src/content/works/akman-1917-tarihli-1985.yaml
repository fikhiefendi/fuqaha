abstract: "Araştırma konusu 1917 tarihli Usul-i Muhakeme-i Şer'iyye Kararnamesi odağında özellikle Tanzimat sonrası ortaya çıkan batılılaşmanın da tesiriyle Osmanlı hukukundaki değişikleri de ele alarak, Şer'iye mahkemeleri yanı sıra ortaya çıkan yeni yargı düzenlerini ele almaktadır. Bu çerçevede özellikle Nizamiye mahkemelerin oluşmaya başladığını ve zaman içerisinde birçok alanda olduğu gibi yargılama alanında da ikili bir durumun meydana geldiğini görüyoruz. Şer'iye mahkemeleri ele alınırken İslâm yargılama hukuku ve Osmanlı tatbikatı da konu edinilmiştir. Şer'iye mahkemelerinin yargılama düzeninde tez konusu Kararname öncesi de birçok düzenlemenin parçalı olarak yer aldığı görülür. Kararname konuyu bütüncül açıdan düzenlemiş, ancak birçok maddesinde batı hukuku tesiriyle hazırlanmış Usul-i Muhakeme-i Hukukiye Kararnamesi atıfda bulunmuştur."
