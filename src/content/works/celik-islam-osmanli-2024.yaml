abstract: "Bu çalışmada, içki içme suçu, modern hukukta suçların incelendiği metoda yakın şekilde incelenmiştir. Öncelikle, İslam hukukunun temel kaynakları, ilkeleri ve genel esaslarından bahsedilmiştir. Klasik kaynaklarda suç tipi üzerinden incelenen genel esaslar, ilk bölümde suç genel teorisi şeklinde toplanmıştır. İkinci bölümde, içki içme suçunun tanımı, kaynağı, tasnifi, maddi ve manevi unsurları ve cezası detaylı olarak incelenmiştir. Modern ceza hukukundaki terimler ile suç konusu, fiil, hareket, netice ve kusurluluk konuları ortaya konulmuştur. İslam mezheplerinde yer alan görüş ayrılıklarına, konu başlıklarında değinilmiştir. İçki içme suçu, Hanefi mezhebindeki hadd-i hamr ve hadd-i sekr suçu şeklindeki ayrıma göre ele alınmış ardından, Osmanlı hukukuna ve kadı sicillerinden alınan örneklerle bu suçun uygulamasına ilişkin bölüm yer almaktadır. Son olarak, modern İslam ülkelerinden olan Endonezya ve Malezya'da uygulanan İslam ceza hukuku ve içki içme suçuna dair bilgiler verilmiştir."
