abstract: "Bu tez Osmanlı devletinde yirmi dört yıl hükümdar olan I. Mahmud'un döneminde (1730-1754) şeyhülislamlık yapmış on iki kişinin biyografilerini içermektedir. Osmanlı devletinin genel uleması içinde ayrı bir öneme sahip On sekizinci yüzyıl ulemasının bu on iki şeyhülislamı tez içinde tek başlarına incelenmelerinin yanı sıra kendilerinden önce ve sonra ilmiye sınıfında yer alan aile fertleriyle de ele alınmış yaptıkları icraatlar ve eserler tezin konusunu oluşturmuştur.Bu tezin hazırlanmasına olanak sağlayan kaynakların başında arşiv belgeleri gelmektedir. Diğer yardımcı kaynaklar ise şeyhülislamlara ait fetva mecmuaları, dönemin resmi tarihçilerinin ve özel tarihçilerinin yayınları, günümüzde mevcut yapılmış yüksek lisans ve doktora tezleri, yayınlanmış makalelerdir. Tezin birinci bölümünde I. Mahmud dönemi genel bir analizle incelenmiştir. İkinci bölümünde ise Osmanlı Devleti'nde şeyhülislamlık kurumu incelenmiş ve on sekizinci yüzyıl perspektifinden ele alınmıştır. Tezin üçüncü bölümde ise, bu on iki şeyhülislamın hayatı, şeyhülislamlık dönemi, yapmış oldukları eserleri çerçevesinde detaylı olarak anlatılmıştır. Sonuç bölümünde tüm şeyhülislamlar ve dönemin genel özellikleri analiz edilmiştir."
