abstract: "Fıkıh usûlü kelâm ilmine paralel bir gelişme kaydetmiş, usûlün ilk meseleleri genellikle öncelikle kelâmî mezhepler tarafından ele alınmıştır. Bu açıdan öncü bir rolü bulunan Mu'tezile iç içe olduğu Irak Hanefîlerinin fıkıh usûlü görüşlerine kelâmî ilkeleri aracılığıyla doğrudan etki etmiştir. Ancak sonraki asırlarda gerek Semerkant gerekse Buhara meşâyihi bu etkinin farkında olarak Irak ulemâsı aracılığıyla mezhebe mâl edilen usûl görüşlerinde bazı tadilatlar yapmışlardır. Bu tartışmaların neticesinde hicrî altıncı asırdan sonra son şeklini alan Hanefî usûlünde Buharalı usûlcülerin ağırlığı hissedilse de Semerkant meşâyihi kelâm görüşleri üzerinden diğer iki meşâyih grubuna eleştirilerini sürdürmüştür. Çalışmamız hicretin ilk altı asrında kelâm meseleleri üzerinden devam eden fıkıh usûlü görüşlerinde Mu'tezile'nin Hanefî mezhebine etkisine yoğunlaşmaktadır. Tezimiz üç bölümden oluşmaktadır. Birinci bölümde, fıkıh usûlünün kelâm ilmiyle ilgisinden bahsedilmekte, akabinde Mu'tezile ve Hanefî mezhebinde usûlün gelişimine katkı sağlayan meşâyih gruplarını incelemektedir. İkinci bölümde, Kitap, Sünnet ve Kıyas olarak üç bölümde ele alınan şer'î delillerle ilgili usûl konularındaki farklı görüşler karşılaştırmalı olarak verilmiştir. Üçüncü bölümde, elfâz bahislerinde Mu'tezile ile Hanefî mezhebinin görüşleri mukayese edilmektedir."
