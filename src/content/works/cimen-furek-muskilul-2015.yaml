abstract: "İbn Fûrek (ö. 406/1015), h. IV. (X.) asırda yaşamış çok yönlü bir âlimdir. Başta kelâm olmak üzere fıkıh, hadis gibi birçok alanda eserler veren müellif, Eş'arî mezhebi içerisinde, mezhebin kurucusu olan Ebu'l-Hasan el-Eş'arî'den (ö. 324/936) sonra üçüncü kuşakta yer alan önemli bir ilmî şahsiyettir. Çağdaşı olan Bâkıllânî (ö. 403/1013) ile birlikte, mezhebin görüşlerinin yayılmasında ve sistemleşmesinde son derece etkili olmuştur. İbn Fûrek'in yüze ulaşan eserleri arasında bir de hadis alanında telif ettiği Müşkilü'l-hadis ve beyânüh adlı eseri vardır. Bu çalışmada, müşkilü'l-hadis ilminin önemi bağlamında, İbn Fûrek'in özellikle haberî sıfatlarla ilgili müşkil hadislerin te'vîli konusunda, eserinde takip ettiği, te'vîl metotlarının tespiti amaçlanmıştır. Haberî sıfatların Eş'arî ekolü içerisinde te'vîl edilmeye ve kabul görmeye başlamasının ilk adımı olarak değerlendirebileceğimiz İbn Fûrek'in yaklaşımı, bu eserde net bir şekilde görülebilmektedir. Tez; giriş ve üç bölümden oluşmaktadır. Birinci bölüm müşkilü'l-hadisin temel kavramları, tarihî seyri, önemi, literatürü ve hadislerdeki işkâl çeşitleri gibi konuları içermektedir. İkinci bölümde ise, İbn Fûrek'in hayatı ve ilmî kişiliği konuları yer almaktadır. Eserin tanıtımının ve muhtevâ değerlendirmesinin yapıldığı üçüncü bölümde, ilgili eserin hadis ilmi açısından analizi yapılarak, İbn Fûrek'in müşkil hadisleri açıklama metodu, bazı te'vîllerin, İbn Kuteybe'nin (ö. 276/889) yaptığı te'vîllerle mukâyesesi ve esere yöneltilen eleştiriler ele alınmaktadır."
