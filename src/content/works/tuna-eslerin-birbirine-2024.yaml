abstract: "Tezde T.C. mevzuatındaki şiddet algısı göz önünde bulundurularak eşlerin birbirine psikolojik şiddet uygulamasının İslâm hukukundaki yeri incelenmiştir. Tezimiz giriş, üç bölüm ve sonuçtan oluşmaktadır. Giriş bölümünde araştırmanın amacı, konusu, önemi ve yöntem hakkında bilgi verilmiştir. İkinci bölümde hangi davranışların eşler arasında şiddet sayılabileceğine ilişkin Türkiye'nin de taraf olduğu uluslararası sözleşmeler ve T.C. mevzuatındaki mevcut algı tespit edilmeye psikolojik şiddet sayılabilecek davranışlar belirlenmeye çalışılmıştır. Üçüncü bölümde öncelikle İslâm hukukunda eşlerin birbirleri ile olan ilişkilerinde temel ilkeler ele alınmış, mevzuata göre psikolojik şiddet sayılabilecek davranışlar İslâm hukukunun usul ve kaideleri göz önünde bulundurularak incelenmiş ve yorumlanmaya çalışılmıştır. Mevzuatta yer almamakla birlikte İslâm hukukuna göre haksız muamele veya psikolojik şiddet içerebilecek davranışlar da bu bölümde ele alınmıştır. Dördüncü bölümde İslâm hukukuna göre eşler arası şiddeti önlemede izlenecek hukukî yöntem incelenmiştir. Sonuç olarak eşler arası şiddetin önlenmesinde kavramların önemi ve davranışın şiddet içerip içermediğinin doğru şekilde değerlendirilmesinin önemli olduğu tespit edilmiştir. Bir davranışın hukukî açıdan şiddet içerdiğinin tanımlanması sonucunda izlenecek yol; şiddetin önlenmesi, ailelerin korunması ve devamlılığı açısından oldukça önemlidir. İslâm hukukunun eşler arası şiddeti önleme konusundaki hukuksal yönteminin günümüzdeki birçok problemi çözebileceği sonucuna ulaşılmıştır."
