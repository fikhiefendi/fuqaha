abstract: "Irak, birçok farklı kültüre ev sahipliği yapmış, tarih boyunca farklı din ve mezheplerin beraber yaşadığı bir yer olmuştur. İslam dininin bu bölgede yayılması, kadim Irak topraklarının günümüze kadar İslam kültür ve medeniyetinin önemli bir merkezi haline getirmiştir. Irak coğrafyası; barındırdığı dini mekânlar sayesinde İslam dininin önemli iki mezhebi olan Sünnilik ve Şiilik için merkez halini almıştır. Bu iki mezhep ortaya çıktığı günden günümüze kadar Irak'ta birçok çekişme ve savaşların yaşanmasına sebep olmuştur. İslam dininin iki farklı yorumu olan Sünnilik ve Şiilik arasındaki çekişmelerden dolayı dünyanın herhangi bir yerinde gerçekleşen olaylar, bir şekilde Irak coğrafyasında yaşayan halka yansımıştır. Irak'ın modern döneminde meydana gelen mezhep savaşları ve çekişmelerini anlamak için Klasik Mezhepler Tarihi metoduyla beraber Medern Mezhepler Tarihi metodundan ağır-lıklı olarak faydalanılmıştır. Klasik Mezhepler Tarihi tezlerinin metodolojisi bir grubun teşekkül sürecini, isimlendirmesini, temel görüşlerini, hangi dönemde telaffuz edildiği nereden geldiği gibi gerekli bilgileri (konunun sınırları kabaca belli olduğundan) sunabilmektedir. Ancak güncel konularda Modern Mezhepler Tarihi metodolojisine ihtiyaç duyulmaktadır. Modern Mezhepler Tarihi; tabiatıyla din-devlet ilişkileri ve siyasetin mezheplerle kurduğu ilişkilere bakılmasını gerekli kılmaktadır. Benzer şekilde dini gruplar, mezhep çatışmaları, harici güçlerin bölgeye müdahaleleri, mezheplerin kamusal alanda varolma-yayılma çabaları, mezheplerin bulundukları yerlerde; güç, nüfus, iktidar mücadeleleri gibi konulara müdahil oldukları bir gerçektir. Bu gerçeklik karşısında Ortadoğu ülkelerinin tamamı açık veya gizli bir mezhep ajandası bulundurmaktadır. Bu durum interdisipliner bir çalışmayı zorunlu kılmaktadır. Bu tezde amacımız komşumuz olan Irak'ın yakın tarihînde etkili olan olaylar üzerin-deki mezhep unsurlarını anlamaktır. Mezhep unsuruyla şekillenen Irak'ı anlamak başka bir disiplinin Modern Mezhepler tarihi disiplini olmadan sağlıklı bilgiler vermede eksik kalacaktır. Tezimiz bu yönüyle İslam Mezhepler Tarihî'nin birikimi; Uluslararası İlişkilerin ortaya koyduğu üstün emek ve çalışmalar, Siyaset Bilimi, Sosyoloji, Psikoloji gibi disiplinlerin yakın dönemde Irak'ta gerçekleşen olaylar üzerindeki çalışmalarından faydalanarak bölge ile ilgilisağlıklı bilgilerin ülkemize ve coğrafyamıza sağlanmasını kolaylaştırmaktır. Tezimiz Mezhepler Tarihî'nin sahip olduğu tarihî birikim ve metodolojiyi kullanarak Irak'ta yıllarca var olan mezhep çekişmelerinin sonunda 2014 yılı sonrasında somut bir aktöre dönüşen Haşdi Şabi'nin anlaşılmasına katkı sağlayacaktır. İslam Mezhepler Tarihî alanın Haşdi Şabi üzerine yapılan ilk çalışmasının tezimiz ol-duğunu belirterek birçok konuda eksiklikler barındırabileceğini belirtmekte fayda vardır. Ancak bu çalışmanın ileride yapılacak çalışmalara bir nebze katkı sağlayacağını umut ediyoruz. Irak'ın bu günü ve yarınında teolojik ve politik yönde çok önemli bir konuma gelen Haşdi Şabi birliklerini anlamak ve akademik bir tahlile tabi tutmak, Ortadoğu ve Ortado-ğu'nun bir prototipi olan Irak için önemlidir. Örgütün ülkedeki mezhepsel tutumları yüzünden Irak'ta ve komşu bölgeler üzerinde önemli olumsuz etkiler bıraktığı görülmektedir. Bizlerin bu olumsuzlukları bilmemiz, komşumuz olan coğrafya ile ilişkilerimize huzur ve güven konusunda katkı sağlayacaktır. Tezimiz üç bölümden oluşmaktadır. İlk bölüm 1920 öncesi Irak'ın; isimlendirmesini, Irak coğrafyasını, ekonomisini, ülkede dominant olan unsurların Irak tarihîndeki serüvenlerini ve oranlarını, Irak'ın dini ve mezhebi yapısını konu etmektedir. Ayrıca İslam öncesi ve İslamlaşma sürecinde gerçekleşen siyasi ve sosyal hareketlerin mezhepler ışığında verdiği tepkileri kısaca ele almaktadır. Tezin ikinci bölümü İngiliz işgalinden 2003 yılındaki ABD işgaline kadar geçen süreç içinde Irak halkının dahili ve harici olaylardan kaynaklı yaşadıkları önemli olayların mezhepsel etkileri ve bağlantıları ortaya konulmuştur. Bu bölümde özellikle İran Devrimi'nin Irak Şiileri ve Kürtler üzerinde bıraktığı etki sonucu Sünni rejiminin mezhepsel kaygılardan dolayı ülkeyi içinden çıkılamaz bir kâosa nasıl sürüklediğiyle ilgili olaylar analiz edilmiştir. Tezin üçüncü bölümünde Haşdi Şabi birliğinin oluşmasına sebep olan faktörler ele alınmakla beraber Haşdi Şabi birliğinin oluşumu, içindeki çatı örgütleri, Irak'a etkileri, ülke üzerinde etkili olan aktörlerin Haşdi Şabi'ye yaklaşımını konu edip Irak'ın geleceğinde çatı görevi gören yapının rolünden bahsedilmiştir."
