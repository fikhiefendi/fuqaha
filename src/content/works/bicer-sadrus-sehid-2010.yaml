abstract: "İslam Hukuku'nda nevâzil ve fetva eserleri, günün problemli meselelerine yer veren bir alan olarak karşımıza çıkmaktadır. Vâkı`ât, havâdis de aynı türü ifade için kullanılan kavramlardır.Tezde, Karahanlılar devrinde yetişmiş es-Sadru'ş-Şehîd (536/1141)'in Umdetu'l-Fetâvâ adlı nevâzil türü eserinin tahkik ve tahlili ele alınmıştır.Tez, giriş, iki bölüm ve sonuçtan oluşmaktadır. Girişte konu ile ilgili kısa bir bilgiye, araştırmanın konusu, amacı, kapsamı, metodu ve kaynakları hakkında açıklamalara yer verilmiştir.İlk bölümde, nevâzil, nevâdir, vakı`ât, havâdis ve fetva kavramlarının tanımları ve nevâzil ile fetva arasında farklar üzerinde durulup, nevâzil ve fetva eserleri hakkında katalog bilgileri tablolar halinde sunulmuştur.İkinci bölümde es-Sadru'ş-Şehîd (536/1141)'in yaşadığı dönem ve dönemin siyasi durumu, yaşadığı dönemde ilmî ortam, hayatı, hocaları, öğrencileri, eserleri ve Umdetu'l-Fetâvâ hakkında bilgi, değerlendirme ve eserin tahkiki işlenmiştir.Bu tez ile nevâzil literatüründeki el yazma bir eser, okuyucusunun istifadesine sunulmuş ve alanla ilgili belli dönemdeki eserlerin katalog bilgileri iki kapak arasında toplanmıştır."
