abstract: "Oyun ve eğlence, insan fıtratında var olan ve her dönem farklı vasıtalara başvurulmak suretiyle giderilmeye çalışılan bir ihtiyaçtır. Çağlar üzeri bir din olan İslâm, her dönemde ve her toplumda ortaya çıkan ihtiyaçlara çözüm üretebilecek ilke ve esasları bünyesinde barındıran dinamik bir dindir. İnsan fıtratına son derece uygun bir din olan İslâm, insan fıtratında var olan oyun ve eğlence ihtiyacını görmezden gelmeyerek gerekli sınırları çizmiş, belli ölçülere uymak kaydıyla bu tür faaliyetlere müsaade etmiştir. Çağımızın tanınır oyun ve eğlence vasıtaları arasında yer alan dijital oyunlar, her yaşta kullanıcının oyun ve eğlence ihtiyacını karşılamak için başvurduğu vasıtaların başında gelmektedir. Hayatımızın her alanında olduğu gibi dijital oyun dünyasında da yaşanan pek çok gelişme, yeni meseleleri beraberinde getirmektedir.“Fıkhi Yönleriyle Dijital Oyunlar”isimli tez çalışmamız, başta dijital oyunların meşruiyeti olmak üzere, oyuncuların oyun dünyasında gerçekleştirmiş oldukları tasarrufları fıkhî boyutlarıyla ele almayı amaçlamaktadır. Tezimiz, üç ana bölümden oluşmaktadır. Birinci bölümde dijital oyunların mahiyetine ilişkin gerekli açıklamalar yapılarak bu tür oyunların hukuken korunması üzerinde duruldu. İkinci bölümde ise tarihsel süreci göz önünde bulundurup veri toplayabilme adına Cahiliyye, Asr-ı saadet, Emevi ve Abbasiler dönemi oyun ve eğlence vasıtaları irdelendi. Çalışmanın son bölümünde ise ilk iki bölümde elde edilen verilerden hareketle başta dijital oyunların meşruiyet şartları olmak üzere söz konusu oyunların mal, menfaat ve hak kavramlarıyla ilişkisi, alım-satım gibi oyun dünyasında gerçekleştirilen belli başlı tasarruflar fıkhî yönleriyle incelendi. Sonuç itibariyle, dinimizin genel ilkeleri ve temel esasları çerçevesinde tespit edilen şartlara riayet etmek kaydıyla dijital oyunların oynanabileceği müşahede edildi. Diğer taraftan başta dijital oyunların alım-satımı olmak üzere oyun dünyasında tahakkuk eden pek çok işlemin sahih bir şekilde gerçekleşebilmesi için tespit edilen şartlara ilaveten oyun firmalarının oyunculara yöneltmiş oldukları sözleşme koşullarına riayet edilerek bu çerçevede hareket edilmesi gerektiği bulgusuna ulaşıldı."
