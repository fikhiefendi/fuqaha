abstract: "ÖZET Mülkiyet hakkı, sahibine en geniş yetkiler veren bir mutlak hak olmasına rağmen, sınırsız değildir. Mülkiyet hakkının tanıdığı yetkiler, hukuk düzeninin sınırları içinde kullanılabilir; bu sınırların aşılmaması ise, malikin yükümlülüğüdür. Taşınmaz mülkiyetinde de, malik, hukuk düzeninin sınırları içinde taşınmazını kullanırken ve işletirken başkalarına zarar vermemek zorundadır; malikin aksine davranışları, onun sorumluluğunu gerektirir. Malikin mülkiyet hakkını aşarak taşkınlıkta bulunması, Medenî Kanunumuzda, objektif esaslara dayalı kusursuz bir sorumluluk olarak düzenlenmiştir. 743 sayılı önceki Medenî Kanunumuzun 656. maddesinde, taşınmaz malikinin sadece hukuka aykırı taşkınlıklardan doğan sorumluluğu düzenlendiğinden, hukuka uygun taşkınlıklardan, taşınmaz maliki aleyhine herhangi bir sorumluluk öngörülmemişti. 1 Ocak 2002 tarihinde yürürlüğe giren 4721 sayılı Türk Medenî Kanununun 730. maddesinin birinci fıkrasında, malikin hukuka aykırı taşkınlıklardan doğan sorumluluğu aynen korunmakla birlikte, maddenin ikinci fıkrasında, taşınmaz malikinin hukuka uygun ve kaçınılmaz taşkınlıklardan doğan sorumluluğu, yeni hüküm olarak yer almıştır. Bu sorumluluğun doğması için, taşınmaz malikinin mülkiyet hakkını aşması, mülkiyet hakkının aşılmasından komşuların zarar görmesi ve nedensellik bağının bulunması şartlarının yan ıs ıra, taşkınlığın hukuka uygun ve kaçınılmaz (Kanunun ifadesiyle,“yerel âdete uygun ve kaçınılmaz”) olması da gerekmektedir. Şartların gerçekleşmesi durumunda, hâkim, zararların uygun bir bedelle denkleştirilmesine karar verebilir. Bu çalışmada, taşınmaz malikinin hukuka uygun ve kaçınılmaz taşkınlıklardan doğan sorumluluğu genel olarak incelendikten sonra, sorumluluğun koşulları olarak belirlenen, taşınmaz malikinin mülkiyet hakkını aşması, mülkiyet hakkının aşılmasının hukuka uygun ve kaçınılmaz olması, komşuların zarar görmesi ve uygun nedensellik bağı bulunması konulan ayrıntılı olarak açıklanacaktır. Son olarak ise, sorumluluğun şartlarının gerçekleşmesi durumunda açılabilecek davalar ile sorumluluktan kurtulma konuları ele alınacaktır."
