abstract: "Bu çalışmanın amacı, İslami finansın sürdürülebilir kalkınma hedeflerine katkı potansiyelini ortaya koymak ve literatürde bu iki alan arasındaki ilişkinin nasıl ele alındığını bilimetrik analiz yöntemi ile incelemektir. Çalışmada nicel bir araştırma yaklaşımı benimsenmiş olup, bilimetrik (scientometric) Analiz yöntemi kullanılmıştır. Araştırmada veriler Web of Science veri tabanından elde edilmiştir ve 2008–2025 yıllarını kapsamaktadır. Bulgular, alanın çok disiplinli bir yapı sergileridiğini, İslami finansın küresel sürdürülebilirlik hedefleriyle uyumlu ve hızla gelişen bir yapıya sahip olduğunu göstermektedir. Literatürde konuyu mercek altına alan - Malezya, Endonezya ve S.Arabistan vd. ülkeler; International Islamic University of Malaysia, İslamic Azad University and University of Utara Malaysia vd. kurumlar; -M.K. Hassan, Sokmana, R. ve Hassan R. vd. yazarlar ve International Jounal of Islamic and Middle Eastern Finance and Management, Sustainability and Journal of Islamic Accounting and Business Reseach vd. dergiler öne çıkarken; İslami sosyal finans, yeşil finans ve etik yatırımlar dikkat çeken temalar arasında yer almaktadır. Tematik analizler, geleneksel konuların yanı sıra yenilikçi yaklaşımların da literatürde giderek daha fazla yer bulduğunu ortaya koymaktadır. Bölgesel eşitsizlikler ise daha kapsayıcı ve iş birlikçi araştırma stratejilerine olan ihtiyacı vurgulamaktadır. Bu çalışma, İslami finansın sürdürülebilir kalkınmadaki rolünü anlamaya yönelik veri temelli bir dayanak oluşturmaya imkan sunmaktadır. Anahtar kalemler: İslami finans, Sürdürülebilir kalkınma, Sürdürülebilir Kalkınma Hedefleri (SKH'ler), Bilimetrik Analiz, Scientometric Analiz."
