abstract: "Çalışma, Katar'daki üç İslami bankadan oluşan bir örneklem için 2011-2020 döneminde İslami bankaların finansal performansının iyileştirilmesi ile yönetişim mekanizmalarının uygulanması arasındaki bağlantıya ilişkin sorunu ele almayı amaçlamaktadır. Çalışmada bağımsız değişkenler olarak dokuz yönetişim değişkeni kullanılmıştır: (yönetim kurulu üyelerinin sayısı - yönetim kurulu toplantılarının sayısı - buradaki bağımsız üyelerin sayısı - başkanın bağımsızlığı ve icra kurulu başkanı işlevi - denetim komitesi üye sayısı - komite toplantılarının sayısı - Şeriat kurulu üyelerinin sayısı - Şeriat komitesi toplantılarının sayısı - ve Komisyon üyelerinin bağımsızlığı). Finansal performansın bağımlı değişkenler olarak değerlendirilmesinde kriter olarak bankaların performansı da üç ölçüm göstergesi ile ölçülmüştür; bunlar varlık getirisi, yatırım getirisi ve ekonomik katma değerdir. Çalışma, gerekli hedeflere ulaşmak için, yönetişim değişkenleri ile finansal performans arasındaki ilişkinin türünü bilmek için değişkenler üzerinde tümevarım yaklaşımı ve SPSS programını kullanan analitik istatistiksel yaklaşım dahil olmak üzere birçok yaklaşım kullandı. Çalışma, en önemlisi denetim komitesi üye sayısı, aktif getiri ve bankaların özkaynak getirisi arasında doğrudan ve istatistiksel olarak anlamlı bir ilişkinin varlığı olan birçok sonuç ortaya çıkardı. Yönetim kurulu toplantılarının sayısı ile özkaynak kârlılığı arasındaki ilişkide de aynı eğilim var. Sonuçlar ayrıca, 2011-2020 arası dönem iki bağımsız değişken, denetim komitesi üye sayısı ve yönetim kurulu toplantılarının sayısı ile Katar'daki İslami bankaların katma ekonomik değerlerinin temsil ettiği bağımlı değişken arasındaki istatistiksel anlamlılıkla ters bir ilişki olduğunu göstermiştir."
