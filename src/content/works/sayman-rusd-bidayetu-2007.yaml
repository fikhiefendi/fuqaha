abstract: "Çalısmamızda bn Rüsd'ün hilaf kitabı niteliginde olan Bidâyetü'l-Müctehid adlı eserinde Zâhirî mezhebine dair naklettigi görüsleri tahkik etmeye çalıstık. Tezimizde de bahsettigimiz üzere bir mezhebe mensub bir alimin baska bir mezhebin görüsünü naklederken bazı hatalara düstügü görülür. Bunların sebepleri arasında mezhebî taassub, objektif olamama, diger mezhebin ana kaynaklarına ulasamama, ıstılah farklılıgından dogan yanlıs anlasılmalar, herhangi bir kaynaga dayandırılmadan zihindeki kanaatle yetinme gibi durumlar sayılabilir. bn Rüsd'dün de eserinde Zâhirîlerin görüslerini verirken bazı hatalara düstügü görülür. Bu hatalar mezhebî taassub ve objektif olamamaktan kaynaklanmamaktadır. Bidâyetü'l-Müctehid'de Zâhirîlere dair 552 görüs incelenmis olup, 44 hatalı görüs tespit edilmistir. Bunlar 1. bölümde Taharet, Namaz, Oruç, Hac, Cihad, Yemin, Nezir, Kurban konularında; 2. bölümde Nikah, Talak ve zıhar konularında, 3. bölümde Büyu', Müsakat, Rehin, Teflis, Lukata, Hibe, Itk, Ümmü'l-veled ve Feraiz konularında; 4. Bölümde Akdiye konularındadır."
