abstract: "Bu tez, Sierra Leone'de İslami Finans uygulamasının önündeki yasal ve düzenleyici engelleri ortaya koymayı amaçlamaktadır. Ülke nüfusunun yaklaşık %76–78'ini oluşturan Müslümanlar tarih boyunca ekonomide etkin olmuş; tarım, ulaşım, ticaret, emlak ve madencilik gibi alanlarda önemli katkılar sunmuştur. Ancak, sömürge döneminde uygulanan bazı politikalar Müslümanların formel eğitim, mülkiyet hakları ve ekonomik fırsatlara erişiminde ciddi kısıtlamalara yol açmış ve onların formel ekonomik sisteme tam olarak entegre olmasını engellemiştir. Günümüzde Müslümanlar demografik olarak çoğunlukta olmalarına rağmen, inançlarına uygun finansal hizmetlere erişimden büyük ölçüde mahrum kalmaktadır. Bu durumdan hareketle, tez Sierra Leone'nin mevcut hukuk sisteminde İslami Finans'ın gelişmesini zorlaştıran veya engelleyen unsurlar olup olmadığını incelemektedir. İlk defa bu konuda yapılacak olan akademik araştırma olması bakımından çalışma önemli bir boşluğu doldurmaktadır. Tez kapsamında, Anayasa, bankacılık ve finans kanunları, vergi düzenlemeleri, tüketici hakları, sigorta ve kredi mevzuatı gibi çok sayıda yasal doküman sistematik bir şekilde incelenecek; içerikleri siyasal, sosyo-ekonomik ve dini bağlamlar ışığında analiz edilecektir. Araştırma, aynı zamanda Batı Afrika'da yer alan Nijerya, Senegal, Gambiya ve Gana gibi bölgesel örnekler ile Malezya, Türkiye ve Birleşik Krallık gibi İslami Finans alanında gelişmiş ülkelerden edinilen veriler, Sierra Leone için uygun ve uygulanabilir bir ulusal düzenleyici çerçeve oluşturmayı hedeflemektedir. Bu bağlamda tezin temel amacı, Sierra Leone'de İslami Finans'ın yasal entegrasyonunu sağlayacak öneriler geliştirmektir. Çalışmanın özgün değeri, bu alandaki ilk kapsamlı hukuki analizi sunmasıdır. Bilimsel katkısı, finansal hukuk ve ekonomik adalet alanlarına yeni bir perspektif kazandırmak; kültürel katkısı, din temelli finansal ihtiyaçların tanınmasını sağlamak; ekonomik katkısı ise, faizsiz ve etik temelli finans sisteminin kapsayıcı kalkınmaya olan katkısını ortaya koymaktır. Sonuç olarak bu tez, Sierra Leone için İslami Finans'ın yasal altyapısını oluşturmaya yönelik somut bir yol haritası sunmayı amaçlamaktadır."
