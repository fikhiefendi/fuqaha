abstract: "İslam Medeniyetinin kök salıp gelişmesinde aile kurumu her daim mühim vazife ifa etmiştir. Madde ve mananın en mükemmel tarzda meczedildiği sistemlerin başında gelen İslam medeniyetinde aile hususunda ideal olanın yanında rasyonalite de ihmal edilmemiş, yaşamın gerçekleri dikkate alınarak hukuki düzenlemeler vaz edilmiştir. Zamanla Kur'an sünnet ve icmaya dayanan zengin bir hukukî literatür ortaya konmuştur. Aile hukuku konuları, klasik dönem fıkıh kitaplarında muamelat konuları arasında değerlendirilirken XIX. yüzyıdan itibaren bu alanda bir takım yenilikler yapılmıştır. Avrupa'da başlayan kanunlaştırma hareketlerinin İslam dünyasına da sirayet etmesiyle birlikte aile hukuku kapsamına giren konular el-ahvâlü'ş-şahsiyye adıyla anılmaya başlanmıştır. Bu konular ilk olarak Osmanlı Devleti tarafından Tanzimat'ın ilanı ile birlikte Hukûk-i Âile Kararnâmesi adıyla kanunlaştırılmıştır. İslam dünyasındaki kanunlaştırma hareketleriyle birlikte hukuk sistemleri laikleşme sürecine girmiş ve aile hukuku konuları ahvâl-i şahsiyye başlığı altında ayrı bir hukuk dalı olarak birçok İslam ülkesinde kesintiye uğramadan uygulanmaya devam etmiştir. Nitekim Müslüman âlimlerin asırlar boyu süren katkıları neticesinde şekillenen ahvâl-i şahsiyye literatürü içerisinde aile hukuku konuları etraflıca ele alınmıştır. Dolayısıyla bu çalışmada, ahvâl-i şahsiyye alanında yazılan eserler incelenerek muhtevasının neler olduğu tespit edilmeye çalışılmıştır."
