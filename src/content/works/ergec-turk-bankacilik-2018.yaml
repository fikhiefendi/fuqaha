abstract: "Katılım bankaları, İslam dini ile uyumlu faaliyet gösteren bankalardır. Bu bankaların da geleneksel bankalar gibi fon transfer sürecinde etkin çalışması arzulanmaktadır. Bu çalışma Türkiye'de bulunan katılım bankaları ve geleneksel bankaların etkinliğini analiz ederek, 2008 küresel krizinin katılım bankalarının etkinliğinde bir değişmeye sebep olup olmadığını incelemeyi amaçlamaktadır. Veri zarflama modeli ile yapılan analizlerde, 5 katılım bankasından sadece iki tanesinin etkin çalıştığı sonucuna ulaşılmıştır."
