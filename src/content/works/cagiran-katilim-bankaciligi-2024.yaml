abstract: "Müşterilerine finansman sağlama ve müşterilerin sahip olduğu fonları toplama hizmetleri, bankacılık sisteminin temel işlevlerindendir. Konvansiyonel bankacılık sistemine benzer olarak katılım bankacılığında da müşteriye finansman sağlama ve müşterilerinin sahip oldukları fonları kazanarak değerlendirme önemli işlevlerden biridir. Bununla birlikte katılım bankacılığının kullandığı finansman yöntemleri ile fon toplama ürünleri konvansiyonel bankacılıktan çeşitli yönlerden farklılık göstermektedir. Faizsiz bankacılık anlayışıyla İslam dininin ticari hassasiyetlerine uygun bir şekilde bankacılık işlemlerinin yürütüldüğü katılım bankacılığı, sunduğu finansman yöntemleri ve fon toplama ürünleri ile konvansiyonel bankacılık anlayışından farklılık sergilemektedir. Bu hususta katılım bankaları faizin temel alınmadığı, ancak kar payı üzerinden bankanın gelir kazandığı finansman yöntemleri kullanarak müşterilerinin finansman ihtiyaçlarını karşılamaktadır. Konvansiyonel bankacılıkta olduğu gibi katılım bankaları da sunduğu finansman yöntemlerini sağlamak amacıyla tasarruf sahiplerinin elindeki fonlara ihtiyaç duymaktadır. Bu hususta tıpkı konvansiyonel bankalar için olduğu gibi katılım bankaları da müşterilerinin fonlarını toplama ihtiyacı duymaktadır. Finansman yöntemlerine benzer olarak fon toplamada da faizsiz kazancın temel alındığı katılım bankacılığında kullanılan fon toplama ürünleri de bu yönde çeşitlilik göstermektedir. Bu kapsamda katılım bankaları müşterilerin fonlarını özel cari hesaplar, kar ve zarar katılım hesapları, yatırım hesapları, tasarruf hesapları ve kıymetli maden depo hesapları aracılığıyla elde etmektedir. Bu araştırmanın amacı katılım bankacılığında finansman ve fon toplama ürünlerinin müşterilerin tercihine olan etkisinin incelenmesidir."
