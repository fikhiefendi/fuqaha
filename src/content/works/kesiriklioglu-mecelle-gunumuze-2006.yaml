abstract: "ÖZETYazar : Murat KES R KL OĞLUÜniversite : Uludağ ÜniversitesiAnabilim Dalı : TAR HBilim Dalı :Tezin Niteliği : Yüksek Lisans TeziSayfa Sayısı : VII + 113Mezuniyet Tarihi : â¦. /â¦. / 2006Tez Danışman(lar)ı : Doç.Dr.Nurcan ABACIMECELLE'DEN GÜNÜMÜZE BORÇLAR HUKUKU'NUN TAR HSELGEL Ş M VE DEĞ Ş MÖZETOsmanlı Devletindeki kanunlaştırma hareketleri, Tanzimat'ın ilanından sonramevcut kanunların günün koşullarına uygun ve yeterli olamayışı nedeniyle, yenibir ivme kazanmıştı. Gerek yabancı devletlerle olan ilişkilerde ve gerekseimparatorluk içindeki azınlıkların haklarında yapılması öngörülen değişiklikler,yeni kanunların yapılmasını zorunlu kıldı. Osmanlı Devleti bu sorunu gerekyabancı kanunları aynen benimseyerek, gerekse günün şartlarına uygun kanunlaryaparak aşmaya çalıştı. Mecelle'nin yapılmasındaki amaç, eksik olan OsmanlıMedeni Kanunu boşluğunu doldurmaktı. 1876 yılında tümüyle yürürlüğe girenMecelle, 1926'da Türk Medeni Kanunu ve Türk Borçlar Kanunu'nun yürürlüğegirmesine kadar, elli yılı aşkın bir süre imparatorluk topraklarında yürürlüktekaldı. Bu çalışmada, Mecelle'nin oluşumundan Borçlar Kanunu'nun kabulünekadar geçen süreç, tarihsel gelişim ve değişim bağlamında incelenmiştir. Ayrıca,Yeni Borçlar Kanunu'nun birinci kısmını oluşturan genel hükümler kısacaanlatılmıştır. Mecelle'den Borçlar Kanunu'na geçiş süreci hukuksal değişimiifade etmekten başka; bir devrin sona erip yeni bir devrin başlangıcının dasembolüdür.Anahtar SözcüklerHUKUK MECELLE HUKUK TAR H OSMANLIHUKUKU"
