abstract: "Faizsizlik prensipleri çerçevesinde faaliyet gösteren katılım bankacılığı, kar ve zarara katılma yoluyla fon toplayan ve elindeki fonları müşterilerine para-para ilişkisi olmadan, paranın arkasına da mal veya hizmeti ekleyerek, üretim ve ticareti destekleyen bir sistem üzerine kuruludur. Faizin bir alternatifi olmayan ancak faizin iki taraftan birini muhakkak zarara uğratması nedeniyle, bu sistemin yerini alacak bir sistemi inşaa etmek üzere kurulan katılım bankaları, İslam dininin ve yasaların emrettiği ölçüde, ticaret ve üretimi ana merkezine alarak; yapılan işin sonucuna hem sermayedarı hem de girişimciyi dahil eder. Yani kar da edilse zarar da elde edilse banka ve müşterileri ayrılmaz bir bütündür. Sözleşmenin sonucunda kar ya da zarar üretilip üretilemeyeceği en başından belli olmadığı için de baştan bir oran belirlenmesi, bankaya mutlak bir kar getireceğinden ve girişimci sömürüye maruz kalacağından dolayı bu sistemde karşılığını bulmamaktadır. Katılım bankacılığı sektörü sermayenin üretim amaçlı kullanılıp para ticaretinin arkasında bir mal ya da hizmet hareketinin olması gerektiğini savunmakta olup, faizin sıfıra yaklaştığı hatta yok olduğu bir toplum kurmaya çalışmakta ve toplumdaki gelir adaletsizliğini düzenlemeyi hedeflemektedir."
