abstract: "Kur'ân'ı öğrenme ve anlama çabaları, onun Hz. Peygamber'e indirilmesiyle başlamış, Kur'ân İlimleri de bu çalışmalara yardımcı ilimler olarak gelişmiştir. Ebussuûd,“İrşâdü'l-Akli's-Selîm ilâ Mezâyâ'l-Kitabi'l-Kerîm”adlı tefsirinde Kur'ân'ı gayet dikkatli ve Arapça dil kurallarına itina göstererek âyet âyet baştan sona tefsir etmiştir. Bu çalışmada Ebussuûd'un Kur'ân İlimleri'ne yaklaşımı ve bu ilimleri tefsirine nasıl yansıttığı ele alınıp değerlendirilmiştir. Çalışmanın temel amacı Ebussuûd'un Kur'ân İlimleri'ne ne ölçüde yer verdiğini saptamak ve onun bu konu ile ilgili fikir ve yaklaşımını değerlendirerek ortaya koymaktır. Çalışmada öncelikle Kur'ân İlimleri'nin tanımı, kapsamı, doğuşu, gelişimi ve kavramlaşma süreci incelenmiştir. Daha sonra Ebussuûd Tefsiri baştan sona Kur'ân İlimleri ekseninde dikkatli bir şekilde taranarak okunmuştur. Çalışma planımız çerçevesinde Ebussuûd tefsiri'nde yer alan Kur'ân İlimleri teker teker tespit edilmiş ve elde edilen veriler konu başlıkları altında toplanmıştır. Konular, bir giriş ve üç ana bölümde incelenip değerlendirilmiştir. Bu çalışma sonuç ve bibliyografya ile son bulmuştur."
