abstract: "Çalışmamızda, Hanefî mezhebi'nin önde gelen fıkıh kaynaklarından biri olan el-Hidâye adlı eserde yer alan, Ebû Yûsuf'a ait görüşler ele alınmış, bu görüşler içerisinde İmâm-ı Âzam ve İmâm Muhammed'e muhalefet edip görüşünde tek kaldığı meseleler tesbit edilmiştir. Çalışmanın birinci kısmında müctehidlerin hayatı eserleri ve ilmi özellikleri ile ilgili bilgilerin yanı sıra, ictihâd, fetvâ ve müftâ bih kavramları açıklanmaktadır. Sonraki bölüm ise Ebû Yûsuf'un İbadât alanındaki ihtilâfları, bu ihtilâfların nedenleri ve diğer mezheplerde konu hakkında tesbit edilebilen görüşler verilmektedir. Ardından gelen bölüm, münâkehât alanıdaki görüşlerin aynı şekilde ele alınması şeklinde teşekkül etmiştir. Sonuç bölümünde ise Ebû Yûsuf'un müctehidlik vasfı değerlendirilmekte ve ictihâdlarındaki faklılıkların tesbit edilen gerekçeleri usûl açısından ele alınmıştır. Bu değerlendirme sonucu, Ebû Yûsuf'un birçok konuda İmâm Ebû Hanîfe ve İmâm Muhammed'le aynı görüşte birleşmekle beraber bazı konularda farklı ictihâdlarda bulunduğu tesbit edilmiş, bu farklılıkların nedeninin ise Ebû Yûsuf'un usûl alanında birtakım farklı yaklaşımları benimsemiş olduğu görülmüştür."
