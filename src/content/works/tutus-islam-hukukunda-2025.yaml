abstract: "İslâm hukukunun en önemli fonksiyonlarından biri adalete uygun bir şekilde sosyal düzeni sağlamak ve sosyal ihtiyaçları karşılamaktır. Her zaman ve mekânda farklı sosyal ihtiyaçlar oluşabilmektedir. Bu çalışmada Hz. Peygamber'in soyundan gelen kimselerin, yani eşrâfın işleriyle ilgilenilmek üzere tesis edilmiş nakîbu'l-eşrâflık kurumu araştırmaya konu edinilmiştir. Kurumla alakalı temel kavramların açıklandığı ve kurumun kısa tarihinin de ele alındığı bu çalışmanın ortaya konulmasındaki esas gaye nakîbu'l-eşrâflık kurumunun İslâm hukuk bilimi açısından inceleme ve değerlendirmeye tâbi tutulmasıdır. Çalışmada fıkıh kitaplarında nakîbu'l-eşrâflık kurumuyla alakalı bölümler ve İslâm hukuku disiplini dışında kurumla alakalı klasik ve çağdaş çalışmalar incelenmiş, elde edilen verilen analiz edilip yeni bir sentezle sunulmuştur. Kurumla alakalı hukukî kuralların gerekçeleri tespit edilmiş, kurumun hukukî yönlerine dair tümevarım yoluyla bazı yargılar ifade edilmiştir. Çalışmada nakîbu'l-eşrâflık kurumunun eşrâfın haklarını alması ve sosyal ihtiyaçları başta olmak üzere kendileriyle alakalı işlerin görülmesi için tesis edilen bir kurum olduğu sonucuna varılmıştır. Eşrafın sosyal ihtiyacının giderilmesi için kurulan bu kurumun doğru bir şekilde kurulup işlemesi için İslâm hukukunda gerekli düzenlemelerin ve hükümlerin vazedildiği tespit edilmiştir. Çalışmadaki bilgiler ışığında ilgili kurumun İslâm toplumunda önemli bir yeri olan eşrâfın yönetim ve halkla münasebetlerinin iyi bir hâl üzere olmasında önemli bir rolü olduğu söylenebilir."
