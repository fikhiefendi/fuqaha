abstract: "XIX. yy'da Avrupa toplumlarında sanayileşmenin ve modernleşmenin etkisiyle kapitalistleşme sürecinin başladığı öne sürülmektedir. Günümüz dünyasında ise kapitalizm hemen hemen bütün toplumlara sirayet etmektedir. İslam öğretileri kapitalist bir düzene izin vermediği iddiaları karşısında dini hassasiyeti yüksek işadamlarının seküler tutuma dönük eğilimleri dikkat çekmektedir. Bu minvalde çalışmamıza, Marx ve Weber'in kapitalizm ve din hakkında ortaya atmış olduğu teorilerle yön verilmekte ve İslam çalışma ahlakı referans kaynaklarını oluşturan yaklaşım, uygulama ve tarihsel tecrübelerden istifade ederek günümüz modern toplumunda, geçmişten günümüze çalışma ahlakının tasviri yapılmaktadır. Çalışmamızda nitel analiz tekniği olan, tarihsel dokümantasyonlar ve belgeler veri olarak kullanılmaktadır. Çalışmanın nihayetinde ise, Osmanlı toplumunun kuruluş ve gelişme dönemlerinde Tımar sistemi, ahilik, lonca kurumu ve uygulanan iktisadi politikaların kapitalist sisteme kapı aralamadığı ancak Avrupa'da yaşanan endüstriyel devrimin etkisiyle kapitalizmin bu toplumda gelişme sergilemeye başladığı görülmektedir. Türkiye nezdinde ise, siyasi partilerin farklı çalışma ahlakı ve iktisadı benimsemiş olduğu, bunun da siyaset alanında etkilerinin görüldüğü ve çoğunlukla bu ahlak ve iktisat zihniyeti belirlenirken dinden bağımsız hareket edildiği anlaşılmaktadır. Bu siyasal söylemlerde, zaman zaman İslam'ın siyasal söylemi ile İslam dinine ait olan uygulamalara ekonomi ve iktisatta yer verilmeye çalışılsa da, bu uygulamalara askerî ve sivil bürokrasi müdahalelerinin kendi şartları içerisinde, böyle bir zeminin oluşmasına engel olduğu Türkiye pratiğinde görülmektedir. Buna karşın son dönem AK Parti iktidarlığında, dini hassasiyeti yüksek olduğu düşünülen işadamları sayısının ve kamusal görünürlüğünün artış gösterdiği ve bu iş adamlarının gündelik yaşamlarında İslam çalışma ahlakı ve kapitalist çalışma ahlakı arasında bir ikilem yaşadıkları ve çoğunlukla seküler davranarak, kapitalistleşme eğiliminde oldukları yapılan alan çalışmalarından ve bizim çalışmamızdan çıkarılabilmektedir."
