abstract: "Çalışmamız Hanefî mezhebinin temel kaynaklarından olan Kudûrî'nin el-Muhtasar'ı üzerine Kâsım b. Kutluboğa'nın kaleme aldığı et-Tashîh ve't-Tercîh 'ale'l-Muhtasari'l-Kudûrî'nin metot ve muhteva yönünden incelenmesini hedeflemektedir. Kâsım b. Kutluboğa bu eserinde mezhep içerisindeki en muteber görüşleri bir araya getirmeyi amaçlar. Tezimiz giriş ve üç ana bölümden oluşmaktadır. Giriş bölümünde tezimizi temellendirmeye, böyle bir çalışmayı gerektirebilecek sebepleri açıklamaya çalıştık. Konumuzun zihinde canlanabilmesi adına, giriş bölümünde Hanefî mezhebinin kısa tarihi, Ebû Hanîfe'nin ilim senedi, mezhebin teşekkülü, Hanefî mezhebinin imamları, tabakâtu'l-fukahâ ve tabakâtu'l-mesâil, mezhebin muhtasar metinleri, el-Muhtasar'ın mezhep içindeki önemi, el-Muhtasar'ın şerhleri ve eserin müellifi olan Ebu'l-Hüseyn Ahmed el-Kudûrî'nin biyografisi hakkında kısa bilgiler verip, mezhep hakkında bilinmesi gereken temel malumatı özet halinde vermeye çalıştık. Birinci bölümde Kâsım b. Kutluboğa'nın hayatı hakkında bilgiler vermeye gayret ettik. Yaşadığı dönemin siyasi, kültürel ve ilmi durumu, öğrenimi ve hocaları, talebeleri ve eserlerini ele aldık. İkinci bölümde et-Tashîh ve't-Tercîh 'ale'l-Muhtasari'l-Kudûrî'yi metot yönünden incelemeye çalıştık. Eserin mahiyeti, önemi, müellifin eseri kaleme alırken izlediği yöntem, eserin bilinen isimleri ve telif edildiği tarih, kütüphane kayıtlarındaki el yazması nüshaları, eser ve müellif hakkına yapılan çalışmalar ve ibadetler bölümünde müellifin faydalandığı kaynakları tespit etmeye ve açıklamaya çalıştık. Üçüncü bölümde muhteva yönünden eseri incelemeye aldık. et-Tashîh ve't-Tercîh 'ale'l-Muhtasari'l-Kudûrî'in mukaddimesini tercüme edip tehâret bölümü özelinde, Kâsım b. Kutluboğa'nın tercih ettiği görüşleri başta el-Hidâye, Feth-u Bâbi'l-'İnâye, Fethu'l-Kadîr ve başka furû' fıkıh eserlerinden de istifade ederek açıklamaya gayret ettik. Tezimizin, Hanefi âlim Kâsım b. Kutluboğa'nın hayatını ele alması ve mezhebin muteber metinlerinden el-Muhtasar'ın kısa bir şerhi olan ve kendisinden sonraki eserlere de kaynaklık eden et-Tashîh ve't-Tercîh 'ale'l-Muhtasari'l-Kudûrî'yi kısa da olsa tanıtması açısından önem taşıdığını söyleyebiliriz."
