abstract: "ÖZET On sekizinci yüzyıl malikaneleşme süreci ve de bu sürecin devlet ve de toplum ilişkileri üzerindeki etkileri bu çalışmanın konusunu oluşturmaktadır. Bu çalışmaya göre on sekizinci yüzyıldaki malikane sistemi devlet tarafindan sıkı bir şekilde kontrol edilmekteydi. Bu kontrol sonucunda Osmanlı Devleti topraklardan vergi toplayarak dönemin ekonomik buhranım yenebildi. Diğer yandan dönemin diğer bir sorunu ise devlet iktidarının, bu yeni süreçte, köylü gözündeki meşruiyeti problemiydi. Diğer bir deyişle, malikaneleşme ile ortaya çıkan yeni mülkiyet ilişkileri devlet iktidarının meşruiyetini ne derece etkilemişti sorusu bu tezin merkezim oluşturmakta. Tezde savunduğum üzere hem mülkiyet ilişkileri hem de toprak üzerinde hak talep eden grupların meşruiyeti Osmanlı devletinin koyduğu kurallarda yatmaktaydı. Hükümdarın adaletin dağıtıcısı pozisyonu-ki bu pozisyon toplum içerisindeki ahlaki bir konsensusa dayanmakta ve de köklerini İslam geleneğinden almaktadır-hem devlet iktidarım köylü gözünde meşrulaştırmış, hem de farklı grupların mülkiyet mücadelelerini düzenlemiş ve şekillendirmiştir. Adalet fikrini destekleyen en önemli unsur kuşkusuz Osmanlı devlet iktidarının taşra ve de merkez arasında kurduğu iletişim kanalıydı. Çünkü on sekizinci yüzyılda Osmanlı devleti Ahkam defterleri kanalıyla taşradaki sayısız şikayetleri dinleyerek hem meşruiyetini tebası gözünde koruyabilmiş hem de bu dönemin mülkiyet ilişkilerini denetlemiştir. m"
