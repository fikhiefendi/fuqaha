abstract: "İslam hukuk tarihinde fıkıh ilmine katkısı olan birçok şahsiyet vardır. Bunlardan biri de İshak b. Râhûye?dir. Horasan?da dünyaya gelip Irak, Şam, Hicaz ve Yemen bölgelerinde birçok şehire ilim yolculuğu yapmıştır. İlim merkezlerinde ve meclislerinde genç yaşına rağmen itibarlı biri olmayı başarmıştır. Tefsir ve Kelam konularında söz sahibi olmakla birlikte asıl yetkinliği Hadis ve Fıkıh ilmindedir. Başta kütüb-i sitte müellifleri olmak üzere çok sayıda öğrenci yetiştirmiştir. Bazı kaynaklarda Hanefî, Şâfiî veya Hanbelî mezhebine mensup biri olarak tanıtılsa da herhangi bir mezhebe bağlılığı olmayan mutlak müctehittir. Bu özelliği sayesinde vefatından sonra kaleme alınan fıkıhla ilgili eserlerde görüşüne müracaat edilen isimler arasında günümüze kadar gelmiştir. Biz de bu özelliğini hem tarihî hem de ilmî açıdan tespit etmeye çalıştık. Anahtar Kelimler : İshak, Fıkıh, Düşünce, Müctehid, Mezhep, Horasan"
