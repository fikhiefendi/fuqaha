abstract: "Bu çalışmanın öncelikli amacı Abdurrahman b. Seydî Ali (ö. 983/1575)'nin Terğîbü'l-Lebîb adlı yazma eserini tanıtarak, Abdurrahman Efendi'nin İbn Kemâl hakkındaki“mükemmel şârihleri, gafiller ve cahiller mertebesine indirdi”ifadesinin doğruluk payını tespit etmeye çalışmaktır. Bunu gerçekleştirmek adına XVI. asrın, üzerine risaleler yazılan önemli bir meselesi olan mestler üzerine mesh konusu seçilmiştir. Bu sebeple“mesh ale'l-huffeyn”ile ilgili temel kavramlar ve İslam Hukuku'nda mestler üzerine mesh konusu ele alınmış daha sonra Terğîbü'l-Lebîb'in“mesh ale'l-huffeyn”bölümü ayrıntılı bir şekilde incelenmiştir. Bu bölümdeki Abdurrahman Efendi'nin İbn Kemâl'e itiraz noktaları tespit edilmiş ve bu itirazların değerlendirmeleri yapılmıştır. Bütün bunlar yapılırken mestler üzerine meshin hükmü konusunda Ehl-i Sünnet ile İmamiyye Şîa'sı arasındaki görüş ayrılığının sebepleri ortaya konulmuştur. Abdurrahman Efendi İbn Kemâl'e yönelttiği eleştirilerin bir kısmında haklı olmakla birlikte pek çok yerde diğer Hidâye şârihlerini savunmak adına İbn Kemâl'i eleştirmiş izlenimi vermektedir. Fakat bunu yaparken Abdurrahman Efendi'nin yararlandığı çok çeşitli kaynaklar ve Hidâye şerhlerine olan hâkimiyeti onun donanımlı bir âlim olduğunu ispatlamaktadır."
