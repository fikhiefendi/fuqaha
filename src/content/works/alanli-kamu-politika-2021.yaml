abstract: "Kamu politikası analizi, kamu kurum ve kuruluşların oluşturdukları politikaların nedenleri ve sonuçlarına nasıl ve neden yapıldığını, uygulaması sonrasında ne çeşit neticelerin elde edildiğine dair sorular sorarak, ilgili politikayı anlamaya ve açıklamaya yönelik araştırma yoludur. Kamu politikası ile ilgili akademik yazında, süreç analizi modeli, en yaygın olarak kullanılan, kamu politika analizi yöntemidir. Kamu politika analiz türlerinden süreç analizi yaklaşımı çerçevesinde ilgili politika, gündeme gelme, formülasyon, yasalaşma, uygulanma ve değerlendirme aşamalarına ayrılır, aktörler ve faktörler ile detaylandırarak incelenir ve analiz edilir. Süreç analiz modeli ortaya çıktığı günden itibaren çeşitli değişimler geçirmiş, doğrusal, kesin çizgiler ile ayrılmış aşamalar yerine, geri beslemeler ile her aşamada gündeme gelme aşamasına dönüş yapabilen politika döngüsü yaklaşımı kullanılmaya başlanmıştır. 2008 yılında yaşanan küresel ekonomik kriz gerek kamu yöneticilerini gerekse de yatırımcıları alternatif finans araçlarının arayışına sokmuştur. Bu alternatif finans arayışları arasında, karşımıza çıkan alternatif finansal araçlardan biri de İslam Bankacılığı/Katılım Bankacılığı'dır. 2008 yılından buyana Katılım Bankacılığının bankacılık sistemindeki payı her geçen yıl artmaktadır. Bu nedenle, kamu politikaları bakımından finansal sistemin bir bileşeni olarak Katılım Bankacılığına ilişkin kamu politikasının incelenmesi önem arz etmektedir. Bu tez çalışmasında, Türkiye'de Katılım Bankacılığına ilişkin kamu politikası süreç analizi yöntemi ile incelenmeye çalışılmıştır. Çalışmada süreç modelini destekleyici nitelikte temel politika belgeleri ve faaliyet raporları üzerinden bir doküman incelemesi de yapılmıştır. Politika, 1975 yılında kurulan Devlet Sanayi ve İşçi Yatırım Bankası'nın kâr ortaklığı ilkesini benimsemesi ile uygulanmaya başlamış ancak bu dönemde yeterli seviyede gelişme imkânı bulamamıştır. 1983 yılında Özel Finans Kurumlarının kurulmasına ilişkin Bakanlar Kurulu Kararı sonrasında, uzun süre bankacılık dışı finansal kuruluş olarak değerlendirilen Katılım Bankaları, 1999 yılında Bankacılık Kanununa girmiş ve 2005 yılında Banka statüsü almıştır. Politikanın uygulanması ve geliştirilmesi ile ilgili esas ivme İstanbul Uluslararası Finans Merkezi Projesinde öncelikler arasında yer alması ile başlamıştır. İlgili politikada, yasal ve kurumsal altyapının geliştirilmesine yönelik politikalara ağırlık verilirken, İnsan Kaynağı ve Katılım Bankacılığı araç çeşitliliğine ilişkin faaliyetlerin yeterli düzeyde olmadığı söylenebilir. Tez çalışması, Türkiye Katılım Bankacılığının Oluşturulması ve Geliştirilmesi Politikasına ilişkin önerilerin geliştirilmesi ile son bulmaktadır."
