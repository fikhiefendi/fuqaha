abstract: "Bu çalışma ile hacca dair sûre ve âyetleri, Hz. Peygamber'in yaptığı haccın türünü, haccın ahkâmı ve menâsikine dair hükümleri, siyer, hadis ve tefsir kaynaklarının delâleti ile netleştirmeye ve anlaşılır hale getirmeye çalıştık. Mekke şehrinin kuruluşu, Kâbe'nim inşası, tarihi süreçte Mekke ve çevresinde yaşanan sosyal ve dînî hayat, İslâm öncesi Mekke toplumunun siyasî, kültürel ve dînî yapısı, hacla ilgili âyetlerin vahiy süreci, ilgili âyetlerin kronolojisi ve Hz. Peygamber'in hac günlüğü açıklığa kavuşturduğumuz konulardır. Hz. Peygamber, ömründe dört defa umre, bir defa da hac yapmıştır. O, 100.000'i aşkın arkadaşı ile hicretin X. yılında yapmış olduğu hacda, hem bu ibadetin nasıl îfâ edileceğini bizzat göstermiş, hem de yapmış olduğu konuşmalarla yirmi üç yıllık davetin evrensel mesajını insanlığa ilân etmiştir. Hz. Peygamber, hacdan üç ay sonra vefat ettiğinden bu hac seferi, İslâm tarihinde, hadis ve tefsir kaynaklarında“Veda Haccı”, bu esnada yaptığı konuşmalar da“Veda Hutbesi”olarak adlandırılmıştır. Hz. Peygamber'in yapmış olduğu haccın türü, yaptığımız araştırma sonucunda ulaştığımız bilgilere göre“kıran haccı”dır, ancak O, ümmetine“temettu haccı”nı tavsiye etmiş, mazereti sebebiyle Arafat vakfesinden önce tavaf yapamayan eşi Hz. Âişe'ye de“ifrad haccı”yapmasını tavsiye etmiştir."
