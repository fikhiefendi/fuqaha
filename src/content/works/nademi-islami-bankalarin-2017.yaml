abstract: "Bu tezin amacı; ortadoğu ülkeleri arasında hızla büyüyen ve islami bankacılık sektörünün küreselleşmesinde önemli rol oynayan altı ülkenin -Suudi Arabistan, Birleşik Arap Emirlikleri, Katar, Kuveyt, Türkiye ve Bahreyn- finansal performanslarını ölçup karşılaştırmaktır. 2010 Yılının ilk çeyreği ile 2014 yılının son çeyreği arasındaki yıllık finansal verileri kullanarak 36 katılım bankasının karlılık belirleyicileri panel veri analizi ile analiz edilmiştir. Çalışmada Katılım bankaların karlılığına etki eden farklı içsel ve dışsal değişkenler seçilmiştir. İki farklı karlılık ölçütü, yani aktif karlılığı (ROA) ve özkaynak karlılığı (ROE) bağımlı değişken olarak kullanılmıştır. Sonuçlara göre maliyet gelir oranı, değişkeninin bağımlı değişken olan ROA ve ROE değişkenini negatif ve anlımlı bir şekilde etkilediği tespit edilmiştir. Özkaynaklar/Toplam Aktifler ve Toplam Aktifler değişkeninin bağımlı değişken olan ROA ve ROE değişkenini olumlu ve anlımlı bir şekilde etkilediği tespit edilmiştir. Tahmin sonuçlarına göre dışsal değişkenlerin bağımlı değişken olan aktif karlılığı ve özkaynak karlılığına istatistiksel açıdan anlamlı bir etksi bulunmamaktadır."
