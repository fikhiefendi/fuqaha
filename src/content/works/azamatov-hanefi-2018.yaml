abstract: "Tezde, Serahsî'nin maslahat anlayışı Temhîdu'l-Fusûl fi'l-Usûl ve el-Mebsût adlı eserleri bağlamında ele alınmıştır. Serahsî'nin, maslahat-ı mürsele konusuna Temhîdte tâlî kaynaklar arasında ayrıca yer vermediğinden, el-Mebsût eserinde hukukî meselelerle ilgili ortaya koyduğu görüşleri bağlamında maslahat-ı mürsele düşüncesinin müellifimizin usûl anlayışında yer alıp almadığı teorik olarak tespit edilmeye çalışılmıştır. Maslahat-ı mürsele konusunun daha çok Mâlikî, Şâfi'î ve Hanbelî İslam hukukçuları tarafından ele alındığı için tezde, zikri geçen İslam hukukçularının görüşlerine de yer verilmiş ve böylece teze mukâyese boyutu kazandırılmaya çalışılmıştır. Hanefîler'in dışındaki bazı mezhep İslam hukukçuları tarafından maslahat-ı mürselenin İslam hukukunun müstakil kaynağı olarak kabul edilirken tezde, Serahsî'nin anlayışında maslahat konusunun kıyâs ve istihsân kavramları kapsamında ele alındığına şâhit olduk. Tez, Giriş ve İki Bölüm, Sonuç ve Bibliyografya'dan oluşmaktadır. Giriş bölümünde tezin içeriği, hazırlanmasıyla ilgili teknik bilgiler ve Serahsî'nin hayatı konularına yer verilmiştir. Birinci Bölüm'de maslahat kavramı ve ilişkili olduğu diğer kavramların tanımlanması; maslahatın çeşitleri, çatışması ve maslahatı belirleme yöntemleri incelenmiştir. İkinci Bölüm'de maslahat-din ilişkisi; maslahatın kıyâs, istihsân, örf, nesih, hîle-i şer'iyye ve sedd-i zerâi' düşünceleri arasındaki ilişkisi ve Serahsî'nin anlayışında maslahat-ı mürsele düşüncesinin yer alıp almadığı konusu ele alınmıştır. Sonuç Bölümü'nde konuyu araştırma sonucunda varılan kanaat ve öneriler sunulmuştur. Bibliyografya Bölümü'nde ise konunun araştırılması esnasında yararlanılan kaynaklara alfabetik sıraya göre yer verilmiştir."
