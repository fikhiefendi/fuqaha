abstract: "Ahmed Rıza Han'ın hayatı, eserleri ve İslam hukuku alanına dair bazı sorulara verdiği fetvaları ele aldığımız bu çalışmada birçok İslam âlimi gibi Ahmed Rıza Han'ın İslam hukukunun yanında birden fazla ilim dalında bilgi sahibi ve velut bir şahsiyet olduğunu gözlemlemekteyiz. Çalışmamız üç bölümden oluşmaktadır. Birinci bölümde; Ahmed Rıza Han'ın biyografisi işlenmiştir. Bu noktada Ahmed Rıza Han'ın doğumu, ailesi, ilmî tedrisatı, yetiştiği dönemin sosyal ve siyasal durumu, verdiği mücadeleler ve vefatı gibi bazı hususlar mercek altına alınmıştır. İkinci bölümde; Ahmed Rıza Han'a ait olan başta fıkıh olmak üzere çeşitli ilim dallarına dair kaleme alınan bazı eserler zikredilerek kısa açıklamalar yapılmıştır. Eserler tanıtılırken mümkün mertebe ait oldukları ilim dallarına göre tasnif edilmiş ve bu başlıklar altında tanıtılmışlardır. Üçüncü bölümde: Ahmed Rıza Han'ın Hanefî mezhebi içerisinde sahip olduğu yetkinlik tespit edilmeye çalışılmış, devamında fetva işlemi esnasında benimsediği usul anlatılmış ve sonrasında kendisine ait fetvaların bir kısmı aktarılmıştır. Anahtar Kelimeler Fıkıh, İslam Hukuku, Ahmed Rıza Han, Fetava Radaviyye, Hint Alt Kıtası."
