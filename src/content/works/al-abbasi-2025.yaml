abstract: "Kelam ilmi, İslam dininin inanç ilkelerini naslardan hareketle ortaya koyan, akli ve nakli yöntemlerle bu ilkeleri temellendirip destekleyen, İslam inanç sisteminin korunması ve gelecek nesillere aktarılmasında etkin roller üstlenen bir ilim dalıdır. Osmanlı Devleti'nde bu sahada eser yazan âlimlerden birisi de 1842 yılında Irak'ın Süleymaniye bölgesinde doğmuş olan Seyyid Ahmed Fâiz el-Berzencî (ö.1918)'dir. Berzencî, Osmanlı devlet yönetiminde önemli görevler üstlenmiş, eserler yazmış ve çok sayıda talebe yetiştirmiştir. Anne ve baba tarafından nesebi, Hz. Peygamber'e dayandığından seyyid olarak kabul edilir. Aynı zamanda Osmanlı devlet idaresinde önemli vazifeler üstlenmiş“Berzencî ailesine”ne mensuptur. Ahmed Faiz el-Berzencî, Osmanlı Devleti'nde başta müderrislik ve kadılık olmak üzere önemli görevlerde bulunmuş, eğitim ve öğretim faaliyetlerinde etkili olmuş, çok sayıda eser kaleme almıştır. Türkçe'nin yanında Arapça, Farsça ve Fransızca gibi dillere de hâkimdir. Bu çalışmada, ömrünün ilk yıllarında Irak Süleymaniye'de, daha sonra Osmanlı Devleti'nin değişik vilayetlerinde görev yapan Ahmed Fâiz el-Berzencî'nin“Ebha'l-Kalâid fi Talhîs Enfesil'l-Fevâid”adlı yazma haldeki kelam eseri tahkik edilmiştir. Eserde, genel olarak“tevhid, nübüvvet ve meâd”gibi temel kelamî konular işlenmiş olmakla birlikte dönemin padişahı Sultan II. Abdülhamid Han'a övgü, namaz, sıla-i rahim ve tevbe gibi konulara da yer verilmiştir. Çalışmamızın konusu, Ahmed Fâiz el-Berzencî'nin (D. 1258/1842-Ö.1336/1918) Ebha'l-Kalâid fi Talhîs Enfesil'l-Fevâid adlı eserinin tahkiki ve incelenmesidir. Kelam ilmiyle ilgili olan bu eserde Ahmed Fâiz el-Berzencî, eserini üç bölüme ayırmıştır. Birinci bölümde ilahiyat konularını yirmi yedi başlıkta incelemiştir. Taklid ve marifetullah konuları ile başlanmış, zâtın hükümleri, tenzih, sıfat, tevhit gibi konular işlenmiş hidayet ve dalalet meseleleri ile bu bölüm sona ermiştir. İkinci bölümde ise on başlıkta Sem'iyyat konuları işlenmiş, kabir azabı ve imanın şubeleri ayrıntılı bir şekilde ele alınmıştır. Üçüncü bölüm ise peygamberlerin gönderilişi ile başlamış, bölümde yirmi iki başlıkta nübüvvet ve imamet konuları ele alınmıştır Eserde, kelam ilminde nadiren ele alınan tevbe, tevekkül ve tasavvuf gibi konularına da yer verilmiştir. Ayrıca eserin son bölümünde hicri ve miladi yıl farkları, ay ve güneş yıllarının mukayesesi gibi konular da işlenmiştir. Tahkik Çalışmasının Metodu: Çalışmamızda, yazma eserin tahkikinde iki nüshadan istifade edilmiştir. İlk olarak eserin yazarı ve eserin yazıldığı dönem tespit edilerek detaylı açıklamalarda bulunulmuştur. Ardından eser tanıtılıp eserin yazara nispetinin doğruluğu ispatlanmıştır. Eserin metodolojisi belirtilerek içerik analizi yapılmıştır. A Nüshası: müellif nüshası olup Mısır, İskenderiye'deki Daru'l-Kütüb Kütüphanesi'nde kayıtlıdır. Çalışmamızda bu nüshanın dijitali kullanılmıştır. B Nüshası: İstanbul Müftülüğü Kütüphanesi'nde kayıtlı olan taş baskı nüshadır. Çalışmamızda ulaşılan temel sonuçlar şunlardır: Öncelikle mukaddime ve elli dokuz ana başlıktan oluşan Ebha'l-Kalâid fi Talhîs Enfesil'l-Fevâid adlı eser Ahmed Fâiz el-Berzencî'ye aittir. Müellif, kendi mezhebi olan itikatta Eş'ariliği ve fıkıhta Şafiiliği öne çıkarmakla birlikte diğer mezheplerin görüşlerini aktarırken oldukça objektif davranmış, onların görüşlerini eleştirirken de mutedil bir dil kullanmıştır. Yine müellif, eserinde çok detaya girmeden temel kelamî meseleleri kısa ve öz bir şekilde izah etmiş, ehl-i sünnetin dışındaki görüşleri aktarırken de ayrıntıya girmemiştir. Bazen mantıksal ve felsefi izahlarla konuyu anlatmaya çalışmıştır. Nüshalar arasında az da olsa farklılıklar vardır. A nüshasında elli dokuz temel konu yer alırken, B nüshasında elli yedinci ve elli dokuzuncu konular bulunmamaktadır."
