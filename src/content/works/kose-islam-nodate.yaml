abstract: "Sahih nikâh bağı ile kurulan evlilikte kocanın tek taraflı nikâh bağını bağını sonlandırması durumunda karısına mut'a nafakası ödeyip ödemeyeceği ödeyecekse bunun miktarı ve süresinin ne olacağı çalışmanın temel problemi olacaktır. Bu çalışma, mut'a nafakasını, bu nafakanın ahkâm tefsirlerinde nasıl ele alındığını, mezheplerin bu konudaki görüşlerini ve bazı İslam ülkelerinde mut'a nafakasıyla ilgili uygulamaları ortaya koymak amacıyla yapılmıştır. Birçok islam ülkesinde şafiî mezhebinin yaklaşımı kodifiye edilmek suretiyle kocası tarafından boşanmış kadının belirli şartlarda ve süreli olmak koşuluyla bu nafakayı hak edeceği uygulamaya konmuştur. Denilebilir ki mut'a nafakası, fakihlerin de dile getirdiği üzere kadının mağduriyeti ve üzüntüsünün bir nebze olsun hafifletilmesi maksadına matuftur. İslam ulemasının mut'a nafakasının miktarı ve türüne yönelik verdiği hizmetçi, üç kat kıyafet, 30 dirhem gibi örnekleri dönemsel ve örfe dayalı olup tahdidi değildir."
