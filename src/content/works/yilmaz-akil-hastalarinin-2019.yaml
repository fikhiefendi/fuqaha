abstract: "Suç, suçu işleyen bireylerin kendisine ve bireylerin içinde bulunduğu sosyal çevreye zarar veren bir eylemdir. Bu nedenle küçük veya büyük her toplum düzen ve huzuruna gölge düşüren bu eyleme ceza adı verilen bir müeyyide ile cevap vermiştir. İslam Ceza hukukunda da suçun cezalandırılması ile kamu vicdanının rahatlatılması, caydırıcılık ile yeni suçların önüne geçilmesi hedeflenmiştir. Kamunun maslahatı, mağdurların hakları gözetilirken suç işleyen fertlerin hukuku da ihmal edilmemiş öncelikle kanunen muhatap olup olamayacakları sorgulanmıştır. İslam hukukunda temel olarak akıl ve yeteneği henüz gelişmemiş olan çocuklar ve bu yeteneklere sahip olmayan akıl ve ruh hastaları dinen mükellef sayılmamaktadır. Bununla beraber ceza ehliyetlerinin de olmadığı kabul edilmektedir. Ne var ki klasik İslam hukuku literatüründe akıl ve ruh hastalıkları sadece ilk ortaya çıkışları veya süreleri itibariye tasnif edilmiş, suç ve cezası açısından bir tasnife tabi tutulmamıştır. Bu çalışmanın amacı klasik literatürde bulunmayan akıl ve ruh hastalıklarını ele alıp İslam ceza hukuku açısından hükümlerini araştırmak, yeni sorulara kapı aralamak ve bu vesileyle fıkıh ilminin sürekliliğine bir katkıda bulunmaktır. Çalışmada İslam ceza hukukundaki temel taksime göre had, kısas, diyet ve tazir konu başlıkları Hanefi mezhebi merkezli olarak taranmış; modern psikiyatri, adli psikiyatri eserlerindeki ve bilimsel makalelerdeki veriler, TCK maddeleri de alınarak fıkhi bir sonuca ulaşılmaya çalışılmıştır. Söz konusu bir yüksek lisans tezi olduğundan konunun hacmini aşmamak için ele alınan akıl ve ruh hastalıkları da sınırlı tutulmuştur. Adli psikiyatri verilerine göre ilk sıralarda yer alan şizofreni ve duygu durum bozuklukları çalışmaya dahil edilmiştir."
