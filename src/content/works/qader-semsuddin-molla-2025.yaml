abstract: "Bu çalışma, Osmanlı ilim geleneğinin öncü simalarından Şemseddin Molla Fenârî'ye nispet edilen Şerhu Telḫîṣi'l-Câmiʿi'l-Kebîr adlı şerh eserinin tahkik ve değerlendirmesini konu edinmektedir. Molla Fenârî, fıkıh, usûl, mantık ve kelâm gibi farklı ilim alanlarındaki derin birikimiyle temayüz etmiş, klasik metinlere yazdığı şerhlerle hem Osmanlı ilim zihniyetine hem de Hanefî fıkıh geleneğine önemli katkılar sunmuştur. Bu tez kapsamında, Molla Fenârî'nin İmam Muhammed eş-Şeybânî'ye ait el-Câmiʿu'l-Kebîr üzerine kaleme aldığı bu şerh metni, dört farklı yazma nüshaya dayanılarak ilmî usullere göre tahkik edilmiştir. Çalışmanın birinci bölümünde Molla Fenârî'nin ilmî şahsiyeti, yaşadığı dönem ve Osmanlı medreselerindeki yeri incelenmiştir. İkinci bölümde eserin yazma nüshaları tanıtılmış ve bunların karşılaştırmalı tahlilleri yapılmıştır. Üçüncü bölümde ise şerhin metodu analiz edilmiş; müellifin meseleleri ele alış tarzı, delil kullanımı, fıkhî tartışmalara yaklaşımı ve istidlal biçimi ayrıntılı olarak değerlendirilmiştir. Nihayetinde tahkik edilen metin dipnotlandırılmış ve ilmî yöntemlere uygun biçimde neşre hazırlanmıştır. Bu tez, Molla Fenârî'nin Hanefî fıkıh geleneğine yaptığı katkıları görünür kılmanın yanı sıra Osmanlı dönemi ilmî birikiminin kaynaklarını gün yüzüne çıkarmayı da hedeflemektedir."
