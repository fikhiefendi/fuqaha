abstract: "Bu tezde XLIX numaralı Antalya şer'iyye sicil defterine göre Antalya'nın 1897- 1899 yılları arası hukuk ve sosyo-kültürel ve idari özellikleri incelenmiştir.Osmanlı hukuk tarihinde Tanzimat'ın ilanıyla başlayan dönem önemli bir kırılma noktasıdır. Bu zamana gelinceye kadar mahkemeler ve uygulanan kurallar dairesinde İslam hukuku merkezli olma özelliğini sürdüren Osmanlı hukuku, Tanzimat ile birlikte bu özelliğinden önemli ölçüde ayrılmıştır. XIX. yüzyıl sonları Osmanlı devleti için dengelerin aleyhine döndüğü, dünya siyasetinin yön değiştirdiği ve devletin hemen her alanda bozulma ve gerileme yaşadığı bir dönemdir. Bu süreçte yöneticiler Tanzimat ile birlikte sosyal ve siyasi kurumların yanında devletin esasını teşkil eden adalet sistemini düzeltmek için reformlara yön vermişlerdir.1897- 1899 yılları arası Antalya'sında, Tanzimat ile başlayan köklü değişimlerin izini sürmekle beraber o dönem Müslüman ve gayrimüslim halk arasındaki ilişkiler, ailelerin durumu, kullanılan lakaplar, miras vekâlet, vasi, nafaka ve vekil tayinleri hakkında bilgilere ulaşılmakta birlikte etnik-dini yerleşim itibariyle kentin sosyal profili ortaya konulmaya çalışılmıştır."
