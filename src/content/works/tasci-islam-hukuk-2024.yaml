abstract: "Eserlerde yer alan kavramların zihinsel ve toplumsal bir milat süreci vardır. Bu açıdan baktığımızda İslâm hukuk literatüründe yer alan nice kavramın farklı zaman dilimlerinde hem toplum nezdinde hem de yazılı kaynaklarda tezahür ettiğini görürüz. Kaldı ki İslâm hukuku kavram zenginliği ile dikkat çekmektedir. Gerçek şu ki İslâm hukuku literatüründe yer alan kavramların teorik ve pratik boyutu her daim eş zamanlı olarak sübut bulmamıştır. Nitekim İslâm hukuk literatüründe yer alan pek çok kavramın Hz. Peygamber döneminde muhteva olarak yer almasına karşın ilerleyen süreçte literatürde yer bulduğunu ifade edebiliriz. Amel-i ehl-i Medîne özü itibariyle Medine toplumunun genel tavır ve tutumunun, bir başka ifadeyle karşılaştıkları şer'î amel hususunda göstermiş oldukları refleksin adı olmuştur. Toplumda fıkhı ilgilendiren bir hususta herkesin muttali olma imkanını ifade eden umûmü'l-belvâ kavramı da Hz. Peygamber'in bazı uygulamalarında mana olarak yerini almakla beraber kavram olarak fıkıh literatürüne sonraki süreçlerde dahil olmuştur. Amel-i ehl-i Medîne ve umûmü'l-belvâ hüküm istinbatında kullanılan önemli yöntemlerdir. Tezimizde amel-i ehl-i Medîne ve umûmü'l-belvâ kavramlarını ve aralarındaki ilişkiyi benzeşen ve ayrışan yönleri ile ele almaya çalıştık. Yaptığımız çalışmanın ilim dünyasına bir nebze katkı sağlayacağı ümidindeyiz."
