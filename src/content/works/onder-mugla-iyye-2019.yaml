abstract: "Şer'iyye sicilleri, kayda alındıkları dönemi anlama konusunda önemli görülen kaynaklardan kabul edilmektedir. Tezin konusu, 203 Numaralı Muğla Şer'iyye Sicil Defteri'dir. Çalışmada öncelikle Osmanlı Hukuk Sistemi ve şer'iyye sicil defterleri hakkında bilgi verilmiştir. Dava özetlerine ve sicil defterinin transliterasyonuna yer verilmiş, davaların konusu kısaca açıklanarak değerlendirilmiştir. Bu çalışmayla, o dönemdeki dava konularının, dava sonucunda alınan kararların, bu kararların uygulanma aşamalarının nasıl olduğunun ve İslam Hukuku'na uygunluğunun öğrenilmesi amaçlanmıştır. 203 numaralı sicilde, nafaka, mehir, talâk, hul', verâset, fesh-i nikâh gibi konulara ait dava örnekleri bulunmaktadır."
