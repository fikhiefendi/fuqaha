abstract: "Bu tez,“Burhânüddîn el- Mergînânî'nin ”et-Tecnîs ve'lMezîd“ Adlı Eserinin kapsamlı bir çalışmasıdır. Hanefi mezhebinin en önemli kitaplarının çoğunun alıntılandığı fetva koleksiyonları ve fıkıh kitapların en önemli ve alimler ve müftüler için bir referans ve Kaynak olarak bilinmektedir. Bu çalışmanın amacı ise: ilim ve ehline ve İslami kütüphanelere hizmet olarak sunmak ümidiyle kitabı yazarının biçimine en yakın biçimde yayınlanmasında katkıda bulunmaktır. Araştırma bir giriş ve iki bölümden oluşmaktadır: Giriş: makalenin önemini, araştırmanın seçilme nedenlerini, amaçlarını ve planını içermektedir. Birinci bölüm: değerlendirme hakkında: Müellifin tercümesi: hayatı, şeyhleri, talebeleri, akademik rütbesi, eserleri, kitabın adı ve müellifine atfedildiğinin belgelenmesi ve konuya yaklaşımı yer almaktadır. İkinci bölüm: ”et-Tecnîs ve'lMezîd\" Adlı Eserinin, Nikâh Kitabının Başlangıcından Zıhâr Babının Sonuna Kadar Tahkikidir ve el yazmamızda yer alan sembollerin kısa bir tercümesi sunulmuştur ve araştırmanın sonunda teknik indekslere de yer verilmiştir."
