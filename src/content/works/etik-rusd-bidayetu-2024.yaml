abstract: "Bu çalışmada, İbn Rüşd'ün Bidâyetü'l-müctehid ve nihâyetü'l-müktesid isimli eserinin Namaz Bölümünde bulunan bazı hadisler, hem Muhtelifü'l-hadis açısından hem de fukahanın rivâyetlere farklı bakış açıları cihetinden incelenmiştir. Bu meyanda 5 vakit namaz ile ilgili birbirinden farklı bazı meseleler ele alınmıştır. İbn Rüşd'ün bahsi geçen konularla alakalı birbirine zıt manadaki rivâyetlere ve bu rivâyetlerle alakalı verdiği bilgiler değerlendirilmiştir. Rivâyetler incelenirken, başta temel hadis kaynakları, hadis şerh eserleri ve mezheplerin müdellel fıkıh eserleri kaynak olarak kullanılmıştır. Tez çalışmamızda nitel araştırma yöntemleri kullanılmıştır. Gerek muhtelifü'l-hadis kapsamına giren hadisler gerekse fukahanın ihtilâfına sebeb olan rivâyetler tespit edilmiştir. Sonrasında ise konu ile ilgili hadisler, dökümantasyon usulüyle inceleme altına alınmıştır. Elde ettiğimiz bilgiler analiz yöntemiyle değerlendirilerek bazı kanılara varılmaya çalışılmıştır."
