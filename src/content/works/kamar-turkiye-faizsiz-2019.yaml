abstract: "Yaklaşık 300 yıllık bir gelişimin neticesinde güncel şeklini alan konvansiyonel finans düzeninin merkezinde borçlanma ve fâiz yer almaktadır. Tarihî seyirde, hem semavî dinler hem de kadîm felsefi doktrinler fâizin toplum dengesini bozucu etkisini önlemek amacıyla ve borca ve fâize dayalı iktisadi ve finansal düzene alternatifler önermişlerdir. İslâm, insan ve toplum hayatının her alanını olduğu gibi, iktisadi ve finansal hayatı düzenleyici kurallar ve kurumlar da ihdas etmiştir. İslâm, toplum hayatını düzenlerken insanı topluma toplumu da insana karşı koruyacak bir denge tahsis etmeye çalışarak, bu dengeyi bozucu en büyük etken olan fâizi, iktisadi ve finansal düzenin merkezinden çıkarmış; merkezî rolü fâizin yerine, risk paylaşımına dayalı ortaklık kurumuna vermiştir. Bu bağlamda tezde, fâize dayalı bir finans düzeninin yerine, ortaklığa dayalı bir finansal düzenin ikame edilmesi gerektiği; bunun için en uygun vâsıtanın fâize dayalı borçlanma araçlarının dışlandığı, ortaklığa dayalı finansal araçların yer aldığı fâizsiz sermaye piyasaları olması gerektiği savunulmuş; Türkiye'de fâizsiz sermaye piyasalarının teşekkülü için neler yapılabileceği ve fâizsiz sermaye piyasalarında İslâmi umdelere uygun olarak hangi finansal araçların yer alabileceği araştırılmıştır."
