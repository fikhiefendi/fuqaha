abstract: "İslam dini, kişinin dinî ve dünyevî sorumluluklarını yerine getirebilmesi için ruhen ve bedenen sağlıklı olması gerektiğini öngörmektedir. Bu sebeple Hz. Peygamber (s.a.v.) sağlığı sürdürmeye ve hastalıklardan korunmaya yönelik birçok tedbir almış, hastalandığında da çeşitli tedavi metotları uygulamıştır. Bulaşıcı hastalıklara karşı ise karantina gibi daha ciddi tedbirler alınmasını tavsiye etmiştir. İnsanlar, bulaşıcı hastalıklardan korunmak için Hz. Peygamber'in koruyucu hekimlik sayılabilecek tedbirlerini devam ettirmekle birlikte dönemin imkanları dâhilinde çeşitli yöntemler de geliştirmişlerdir. Aşı da böyle bir çaba neticesinde ortaya çıkmış ve hedeflendiği şekilde bulaşıcı hastalıkların kontrol altında tutulması ve ortadan kaldırılması konusunda başarılı sonuçlar vermiştir. Etkili ve güvenilir bir koruyucu hekimlik uygulaması olmasına rağmen aşı ciddi tepkilerle de karşılaşmıştır. Bunun birçok sebebi olmakla birlikte aşı karşıtlığında dini gerekçeler de etkili olmuştur. Bu çalışmada, İslam dininin sağlığı devam ettirmeye yönelik tavsiyesini gerçekleştirmeye hizmet edecek olan koruyucu hekimlik ve tedavi uygulamalarına yer verilmiştir. Aynı şekilde insanları bulaşıcı hastalıktan korumak için geliştirilmiş olan aşı uygulamalarına, aşı reddine ve sebeplerine, aşının dini boyutuna değinilmiştir. Çalışma, bir giriş, iki bölüm ve bir sonuçtan meydana gelmektedir. Girişte konunun genel çerçevesi, önemi, amacı gibi konular, birinci bölümde tedavi ve koruyucu hekimlik konuları, ikinci bölümde aşı uygulamaları ve İslam hukukundaki yeri gibi konular yer almaktadır. Çalışma, ulaşılan sonuçları ihtiva eden sonuç bölümüyle sona ermektedir."
