abstract: "Mikrofinans, aşırı yoksulluk içinde yaşayan insanların hayatlarını iyileştirmek ve toplumdaki yoksulluğu azaltmak için sigorta, tasarruf ve kredi sağlayan bir programı ifade eder. Bu çalışma, Kovid-19 pandemisinin Somali'deki mikrofinans kuruluşlarını nasıl etkilediğini ve salgının başlangıcından bu yana karşılaştıkları temel zorlukları incelemeyi amaçlamaktadır. Araştırmada hem nicel ve hem de nitel metodoloji kullanılmıştır. Veriler, 2022'de Somali'deki Mogadişu ve Hargeisa şehirlerinde mikrofinans kuruluşlarına yöneltilen bir anket aracılığıyla toplanmıştır. Sonuçlar, salgının bu kuruluşlar üzerinde orta derecede bir etkiye sahip olduğunu ama bu kuruşların çoğunun yüksek kredi riskiyle karşı karşıya olduğunu ve mevcut müşterilerinin kuruluşardaki tasarruflarını kullanmalarında artış olduğunu göstermiştir. Ayrıca bu kuruluşların karşılaştığı problemlere örnek olarak sahada ve ofis ortamında müşterilerle buluşmada yaşadıkları zorluklar, kredilerin geri ödenenemesi problemi, artan aktif olmayan varlıklar, azalan kar, finansal krizler ve birçok finansal ve operasyonel zorluklar verilebilir. Salgının sebep olduğu bu sorunların üstesinden en az hasarla gelebilmek için bu kuruluşların finansal portföylerini çeşitlendirmeleri, daha fazla dijital inovasyon yapmaları, verdikleri kredileri yeniden planlamaları, daha fazla devlet teşviği ve desteği almaları ve kendi yatırımlarını artırmaları gerekmektedir."
