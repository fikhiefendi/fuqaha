abstract: "Bu çalışma, Şafi'i okulunda örflerin finansal işlem hükümlerinin uyarlanması üzerindeki etkisinin ne ölçüde ortaya çıktığını göstermeyi amaçlamaktadır. Bu iş Örfle amel etmenin hiçbir sakıncasının olmayacağı bir şekilde bununla alakalı esaslar konulmak suretiyle tamamlanmıştır. Şafi mezhebinde örfle amel edildiğine dair tafsili yönteme ek olarak genel bir yöntem de ortaya koydum. Şafi mezhebinde örfle istidlal hususunda uygulama kısmına geçtiğimizde örfün bütün mali muamele içeren akitlere şamil geldiğini görmekteyiz. Örfün tatbiki boyutuna baktığımızda Şafi mezhebinde her türlü mali muamelede örfün etkisini görmekteyiz. Keza teberrü Akitleri ve diğer mali muamelelerde de görmek mümkündür. Bu çalışma sırasında ortaya çıktı ki Şafiler örfle amelin çerçevesini akdi yapanların sarahaten bir ifade kullanmamaları ile sınırlamıştır. Şafiler örfle amelin çerçevesini akdi yapanların sarahaten bir ifade kullanmamalarıyla sınırlandırmışladır. Çalışmamız sadece geçmişle sınırlı olmasın ve toplumun maslahatını sağlayacak bir şekilde islami ekonomiyi muasır suretiyle desteklemeye olan arzumuzdan dolayı bu çalışmamız bir bölüm güncel mali muameleleri ve örfle amelin en geniş mefhumuyla Şafi mezhebinde etkisini gösterdiği muameleleri içermiştir. Bunların başında da kabzın şekli ile alakalı örfe itimat ve yine akdin muktezasına muhalif olmayan yeni yöntemler gelmektedir."
