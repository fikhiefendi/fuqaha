abstract: "Bu çalışmanın önemi، Allame Ebu el-Tayyib el-Sindi'nin Qaratu'l-Enzaar Ala Şerhi Tanweer al-Absar adlı Hanefi fıkhının önemli bir kitabı hakkında olmasıdır. Fıkıh، tahkik ve tetkik ilimlerinin önde gelen âlimlerinden kabul edilen Allame es-Sindî tarafından şerh edilmiştir. Ben de hastalar için namaz، oruç، zekat ve hac hükümleri ile ilgili kısımları seçtim. es-Sindî bunu şerh ederken sağlam ve düzenli bir yöntem izlemiştir. Yapılan bu şerhte fıkıh ve dilbilgisi yetenekleri ortaya çıkmıştır، ayrıca bazı zor anlamlara açıklayıcı işaretleri ve belirsiz fıkıh terimlerinin anlamlarını açıklığa kavuşturmuştur. Açıkladığı fıkıh meselelerini kökleştirmek için Kitap ve Sünnet'ten delil göstermeyi esas almıştır. Fıkhi konular arasında tercih yaparak çoğu konuda görüş bildirmiş ve diğer mezhepleri ihmal etmeden görüşünü Hanefi mezhebine dayandırmıştır. Araştırmacı bu araştırmada üç nüshaya dayanmıştır ve tümevarım، analitik ve karşılaştırmalı yöntemleri kullanmıştır. Araştırmacının ulaştığı sonuçlar ise : Bu haşiye، Durr Al-Muhtar kitabı hakkında kıymetli haşiyelerden biri olarak kabul edilir. Belki de İbn Abedin'in (Allah ona rahmet eylesin) Hatime-t El-Muhakkikin adlı haşiyesi ile yarışmaktadır. Bu kitabın tetkiki، Haskefi'nin ilmi konumunu ortaya çıkarmıştır. Faydalı ve sağlam tashihlerinden yoksun olmayan faydalı yorumlardan ve bilimsel tartışmalardan yola çıkarak bu ilmi konumu ortaya çıkmıştır."
