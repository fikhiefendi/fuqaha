abstract: "Güveni kötüye kullanma suçu, 5237 sayılı Türk Ceza Kanunu'nun 155. maddesinde düzenlenir. Bu suç, belirli bir amaçla bir malın zilyetliğinin belirli bir hukuki ilişki çerçevesinde başka bir kişiye devredilmesinden sonra, malın zilyetliğini devralan kişi tarafından bu amaç dışında kendisinin veya başkasının yararına olarak, mal üzerinde tasarrufta bulunulması veya bu tevdi olgusunun inkar edilmesi şeklinde tanımlanabilir. Roma hukuku döneminde de var olan ancak, müstakil bir suç olarak düzenlenmeyen güveni kötüye kullanma suçu, hırsızlık fiillerinin içinde yer almaktaydı. İslam hukuku döneminde tazir suçları arasında yer alan güveni kötüye kullanma suçu, bu dönemde müstakil bir suç olarak düzenlenmiştir. Temel ilkelerinden birisi de emanete riayet etmek olan İslam Hukukunda, emanet alınan bir eşyanın güvenliğinden, değerinin kaybolmamasından eşyaya bir zarar gelmemesinden emanet alan kişi sorumludur. Osmanlı Devleti döneminde 1858 tarihli Ceza Kanunname-İ Humayunu çıkarılmış, bu kanunun ikinci babının dokuzuncu faslında güveni kötüye kullanma suçu,“emniyetin suistimali”başlığı altında düzenleme alanı bulmuştur. Türkiye cumhuriyeti döneminde ilk olarak 765 sayılı Türk Ceza Kanunu Döneminde emniyeti suistimal başlığı altında düzenlenerek uygulanmış, halen de 5237 sayılı TCK'nın 155. maddesinde düzenleme alanı bularak uygulanmaktadır. Farklı ülkelerin hukuk düzenlerinde de güveni kötüye kullanma suçuna ilişkin düzenlemeler mevcuttur. Güveni kötüye kullanma suçunda korunan değer kişinin mülkiyet hakkı ve kişiler arasındaki güven duygusudur. Güveni kötüye kullanma suçunun faili, suça konu mal üzerinde lehine zilyetlik devredilen ve bu devir amacına aykırı tasarrufta bulunan veya bu devir olgusunu inkar eden kişi suçun failidir. Güveni kötüye kullanma suçu malı belirli şekilde kullanmakla yükümlü olan kişilerce işlenebileceğinden, bu suç özgü suç kabul edilir. Bu suçun faili herkes olamaz. Güveni kötüye kullanma suçunun oluşabilmesi için; faile bir malın zilyetliğinin belirli bir hukuki ilişki çerçevesinde devredilmesi, failin kendisine zilyetliği devredilen mal üzerinde veriliş amacının dışında tasarrufta bulunması ya da devir olgusunu inkar etmesi gerekir. Güveni kötüye kullanma suçu kasten işlenebilen bir suçtur. Bu suçun taksirle işlenmesi mümkün değildir. TCK 155/2. maddesi uyarınca; suçun, meslek ve sanat, ticaret veya hizmet ilişkisinin ya da hangi nedenden doğmuş olursa olsun, başkasının mallarını idare etmek yetkisinin gereği olarak tevdi ve teslim edilmiş eşya hakkında işlenmesi halinde nitelikli güveni kötüye kullanma suçu oluşur. Daha fazla cezaya hükmolunur. Güveni kötüye kullanma suçunun; hırsızlık, dolandırıcılık, zimmet, bankacılık zimmeti, mala zarar verme ve muhafaza görevini kötüye kullanma suçlarıyla benzer yanları olduğu gibi bu suçlardan ayrılan yönleri de vardır. 1632 Sayılı Askeri Ceza Kanunu ve 6362 Sayılı Sermaye Piyasası Kanunu'nda güveni kötüye kullanmaya ilişkin özel düzenlemeler mevcuttur. Güveni kötüye kullanma suçuna teşebbüs, iştirak mümkündür. Güveni kötüye kullanma suçunda içtima ve zincirleme suç hükümlerinin uygulanması gündeme gelebilir. Güveni kötüye kullanma suçunda şahsi cezasızlık sebepleri, cezayı hafifletici şahsi sebepler ve etkin pişmanlık hükümlerinin uygulanması mümkündür. Güveni kötüye kullanma suçunun basit halinin soruşturulması ve kovuşturulması şikayete bağlı iken, nitelikli halinin soruşturulması ve kovuşturulması re'sen yapılır. Güveni kötüye kullanma suçunda yaptırım olarak hapis cezası ve yanında adli para cezası öngörülmüştür. 155/1. madde kapsamında kalan basit güveni kötüye kullanma suçu için öngörülen ceza; altı aydan iki yıla kadar hapis ve adlî para cezasıdır. 155/2. madde kapsamında kalan nitelikli güveni kötüye kullanma suçu için öngörülen ceza ise; bir yıldan yedi yıla kadar hapis ve üç bin güne kadar adlî para cezasıdır."
