abstract: "Aile ile toplum, toplum ile devlet, devlet ile de adâlet birbirini tamamlayan olgular ve varlıklardır. Bu tamamlayıcılığın farklı görünümlerinden birisi şu şekildedir: birden fazla insanın olduğu her ortamda, insanı ilgilendiren farklılıklar ve değişkenler bulunmaktadır; bu farklılıklar ve değişkenler, insanlardan oluşan toplumları etkileyen çatışmalara sebebiyet verir; çatışmaların olumsuz sonuçlarından korunmak isteyen toplumlar, herkesin hürriyet alanının belirlenmesi ve toplumsal barışın sürdürülebilir olarak tesis edilmesi amacıyla bir devlet çatısı altında örgütlenir; devletler ise, ancak iyi işleyen bir adâlet düzeni ile varlık ve devamlılık kazanabilir. Adâlet olgusunun devlet aygıtı içinde kurumsallaşması yönünde yaptığı önemli çalışmalar ile hukuk tarihinde müstesnâ bir yere sahip olan Hz. Ömer(ra)'in mükemmel tespitinde vurgulandığı üzere;“Adâlet, mülkün (devletin) temelidir.”Mülkün temeli olan adâletin ilk şartı ise, hukuk düzeni tarafından korunması gereken kişilerin adâlete erişimlerini kolaylaştıran bir hukuk sistemi inşâ etmektir. Modern hukuk sistemlerinde adâlete erişimin kolaylaşması, alternatif uyuşmazlık çözüm yöntemlerinin yaygınlaşması ile pozitif korelasyona sahip bir süreci ifâde eder. Söz konusu yöntemlerin hukuk kişilerince en çok tercih edileni ise, taraflar arasındaki uyuşmazlıkların, tarafsız üçüncü kişilerin katılımıyla daha etkin, hızlı ve dostâne bir şekilde çözüme kavuşturulmasını mümkün kılan arabuluculuk yöntemidir. Aile arabuluculuğu ise, ihtisaslaşmış bir arabuluculuk dalı ve alternatif uyuşmazlık çözüm yöntemi olarak, modern hukuk sistemleri içindeki yerini her geçen gün güçlendirmektedir.“Türk Hukuku'nda İslâm Hukuku ile Karşılaştırmalı Olarak Aile Arabuluculuğu”isimli bu çalışmada, aile arabuluculuğu bütün yönleriyle ele alınmış ve“Türkiye Aile Arabuluculuğu Modeli”isimli özgün bir model önerisi oluşturulmuştur."
