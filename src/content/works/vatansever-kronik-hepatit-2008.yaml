abstract: "Amaç: Hepatit C virusu otoimmunitenin ortaya çıkışında rol oynayabilmekte, interferon da hepatik ve non-hepatik otoimmun reaksiyonlara neden olabilmektedir. Bu prospektif çalışmamızda, kronik C hepatitli hastalarda interferon tedavisinin tiroid otoantikorları, tiroid fonksiyon testleri ve tiroid volümleri üzerine olan etkilerini amaçladık. Materyal ve Metod: Karaciğer biyopsisi ile kronik hepatit C oldukları kanıtlanmış, daha önce tedavi edilmemiş ve tiroid fonksiyonları başlangıçta düzgün olan 45 hastayı prospektif olarak inceledik. 20 erkek hastanın yaş ortalaması 49.65 ± 8.23, 25 kadın hastanın yaş ortalaması 47.45 ± 9.55 olarak bulundu.Tüm hastalar peg-IFN + ribavirin kombinasyonu ile tedavi edildi. Tedavi başlangıcında ve tedavinin 1.3.ve 6.aylarında bütün hastalarda fT3, fT4, TSH, Anti-Tg, Anti-TPO değerleri ölçüldü. Tiroid disfonksiyon görülme sıklığı, yaş ve cinsiyete göre değerlendirildi. Çalışmanın başlangıcında bütün hastalar ötiroiddi ve tiroid otoantikorları negatifti. Sonuçlar: Kronik C hepatitli 45 hastadan 15'inde (%33.3) 6 aylık antiviral tedavi sonunda tiroid disfonksiyonu gelişti. 2 hastada semptomatik tiroid hastalığı görüldü ve tedavi başladık. 1 aylık tedavi sonunda 2 kadın hastada subklinik hipotiroidi görüldü.Üç aylık tedavi sonunda 1 erkek, 3 kadın hastada subklinik hipertiroidi ( %8.9), 3 kadın hastada (%6.7) subklinik hipotiroidi gözlemlendi. Altı aylık tedavi sonunda ise 1 kadın hastada semptomatik hipertiroidi (%2.2), 1 erkek, 5 kadın hastada subklinik hipertiroidi (%13.3), 7 kadın hastada subklinik hipotiroidi (%15.6), 1 kadın hastada ise semptomatik hipotiroidi (%2.2) görüldü.12 kadın hastada (%26.7) 6 aylık antiviral tedavi sonunda antitiroglobülin (anti-Tg) otoantikorları pozitifleşti. Kadınlarda 6.ay Tg yüksekliği anlamlı derecede daha fazlaydı (p 0.05). Yorum: Kronik C hepatiti için peg-IFN + ribavirin kombinasyonu ile tedavi edilen hastaların %33.3'nde tiroid disfonksiyonu ortaya çıktı.Bu hastaların çoğunun kadın olması (14/15), kadın hastalarda kronik C hepatiti ile tiroid otoimmunitesinin var oluşu arasında klinik olarak anlamlı bir ilişki kurulabilir.Tiroid disfonksiyonu gelişen 15 hastanın 12'sinde (12/15) tiroid otoantikorları pozitifken, 3 (3/15) hastada negatifti.Bu yüzden bu tiroid bozukluklarının olasılıkla otoimmunite ile açıklanabileceği görüşünü desteklemekteyiz. Sonuç olarak peg-INF + ribavirin kombinasyon tedavisi alan kronik hepatit C'li hastaların tiroid otoimmunitesi açısından belirli periyotlarla izlenmesini, otoantikorları pozitif ve/veya pozitifleşen hastalarda tiroid disfonksiyonu açısından klinik ve laboratuar olarak sıkı takip edilmesini önermekteyiz."
