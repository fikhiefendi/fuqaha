abstract: "İslâm devletlerinin adalet teşkilatında meydana gelen önemli değişikliklerden birisi, kâdı'l-kudâtlık makamı/kurumunun ihdas edilmesidir. Devletin başı olan halifelerin, adalet teşkilatı üzerindeki yetkilerini devretmesiyle, 170/786 yılında ortaya çıkmış olan kurum, Abbâsî devlet idaresi içerisinde önemli bir yer edinmiştir. Bu tarihten başlayarak, halifeler, adalet teşkilatına ilişkin yetkilerini kademeli bir şekilde kâdı'l-kudâtlara devretmişlerdir. İlk dönemlerde sınırlı olan bu yetki devri, zamanla genişlemiştir. Halifelerin siyasî gücü ve devletin içerisinde bulunduğu durumun yanı sıra, toplumda meydana gelen mezhepsel değişiklikler de bu kurumun gücünü doğrudan etkilemiştir. İslâm devletinin adalet teşkilatında ortaya çıkan kâdı'l-kudâtlık kurumunun, devlet ve toplumdaki yansımalarının tespiti, çalışmanın amacını oluşturmaktadır. Bu amaçla, İslâm Tarihi kaynakları başta olmak üzere, tabakât, terâcim kitapları ve hukuk kurumunu ele alan eserler incelenerek, kâdı'l-kudâtların devlet ve toplum nezdindeki yerleri tespit edilmiştir. Sonuç olarak, kâdı'l-kudâtlık kurumunun ilk kurulduğu dönemde daha dar yetkilere sahip olduğu, halifenin danışmanı gibi görev yaptığı fakat Abbâsî devletinin son dönemlerine doğru daha geniş yetkilere sahip olduğu görülmektedir. Bununla birlikte kâdı'l-kudât, toplum nazarında saygın bir yere ve bağımsız bir hareket alanına sahip olmuştur. Diğer taraftan, bazı aile ve mezhep mensuplarının, kâdı'l-kudâtlık görevinde daha fazla bulundukları da göze çarpan hususlardan birisidir. Araştırmanın, başta İslâm Tarihi olmak üzere, İslâm Hukuku, İslâm Kurumları Tarihi, İslâm Medeniyeti Tarihi gibi alanlarda çalışma yapan araştırmacılara katkı sağlaması beklenmektedir."
