abstract: "İslam hukuku, insanın doğumundan itibaren onun onurunun, haysiyetinin ve özel alanının korunmasını esas almış; çocukluk dönemini mahremiyet eğitiminin başladığı ve bireysel sınırların öğretildiği kritik bir dönem olarak değerlendirmiştir. Çocuk mahremiyeti, yalnızca fiziksel gizliliğin korunması değil; aynı zamanda çocuğun ruhsal bütünlüğü, kişilik gelişimi ve toplumsal değerlerle uyumlu şekilde yetiştirilmesiyle de ilişkilidir. Kur'an-ı Kerim ve Sünnet'te yer alan hükümler, çocuğun özel alanına saygı gösterilmesini, ebeveynlerin bu konuda bilinçli bir yaklaşım sergilemesini ve erken yaşta mahremiyet bilincinin kazandırılmasını emretmektedir. Bu alanda özel hayatın gizliliği ve mahremiyet konusu üzerine çeşitli çalışmalar yapılmış olmakla birlikte, çocuk mahremiyetini İslam hukuku perspektifinden müstakil ve sistematik bir şekilde ele alan çalışmaların sınırlı olduğu görülmektedir. Mevcut literatürde çoğunlukla mahremiyet, genel ilkeler veya yetişkin bireyler bağlamında incelenmiş; çocukların gelişim dönemleri, aile içi sorumluluklar ve çağdaş tehditler çerçevesinde bütüncül bir değerlendirme yeterince yapılmamıştır. Bu durum, çocuk mahremiyetinin İslam hukukundaki temellerinin yeniden ele alınmasını gerekli kılmaktadır. Bu çalışmada, klasik fıkıh kaynakları ve çağdaş yorumlar ışığında çocuk mahremiyetinin kapsamı, sınırları ve modern dönemde karşılaştığı tehditler ele alınmıştır. Dijital çağın getirdiği medya ve sosyal paylaşım ortamlarının çocuk mahremiyetine etkileri tartışılmış; İslam hukukunun bu konuda sunduğu koruyucu ilkelerin günümüz toplumsal yapısına nasıl uygulanabileceği değerlendirilmiştir. Sonuç olarak bu çalışma İslam hukukunda çocuk mahremiyetinin dinî, ahlaki ve hukuki temelleriyle incelemekte, bireyin kişisel dokunulmazlığının, aile içi düzenin ve toplumsal ahlakın korunması açısından vazgeçilmez bir ilke olarak ortaya koymaktadır."
