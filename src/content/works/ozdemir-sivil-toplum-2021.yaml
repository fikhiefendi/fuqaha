abstract: "Bir toplumun geleceğinin belirleyicileri olan çocuklar zekası, ekonomik durumu, yaşı ve sosyal durumu ile orantılı şekilde beklenen düzeyde gelişmesi için korunmaya muhtaçtır. Bunun için yoksul veya zengin, suçlu ya da suçsuz, herhangi bir kimsesi olan ya da olmayan, bedensel, ruhsal ve zihinsel özrü olan ya da olmayan gibi ayrıma bakılmaksızın tüm çocukların korunması gerekmektedir. Annesi veya babası belli olmayan ya da annesiz ve babasız olması nedeniyle ebeveyn korumasından mahrum kalan bu çocuklar yetim sayılmaktadır. Toplumun en kırılgan kesimi olarak görülen bu çocuklar ülkeleri açısından önemli bir sorumluluk alanıdır. Çünkü yetim çocuklar ileride yaşadıkları ülkenin gençleri olarak nitelikli iş gücünü temsil etmektedir. Yetim çocuklara yönelik destekleyici çalışmalar hem kamu kurumlar hem de sosyal yardım ve sosyal destek konusunda faaliyet yürüten STK'lar eliyle yürütülmektedir. Bu STK'lardan birisi de İHH İnsani Yardım Vakfıdır. Bu çalışma da sivil imkânlarıyla az gelişmiş ve yoksul ülkelerde, yetimlere yönelik çalışmaları bulunan İHH'nın yetimlere yönelik faaliyetleri konu edinmektedir. İHH tarafından yapılan bu yardımların ne düzeyde başarılı sonuçlar ortaya koyduğu yapılmış bir alan araştırması ile analiz edilmektedir. Nitel araştırma yöntemlerinin uygulandığı çalışmada veriler yarı yapılandırılmış görüşme formu yardımıyla elde edilmiştir. Görüşme formu ilgili literatürden yararlanılarak araştırmacı tarafından geliştirilmiştir. Uzman görüşü alındıktan sonra son hali düzenlenen görüşme formu İHH'nın sunduğu olanaklardan faydalanan 32 yetim çocuğa uygulanmış ve elde edilen veriler betimsel analiz yöntemi ile analiz edilmiştir. Araştırmanın sonunda İHH insani yardım vakfı tarafından sağlanan sosyal yardım, eğitim ve sağlık olanaklarının yetim çocukların beşeri sermaye gelişimi ve başarı düzeyi üzerinde etkili olduğu çocukların öz yeterlilik inancını artırdığı görülmüştür."
