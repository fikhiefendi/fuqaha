abstract: "İslam hukuku ve içtihatında kürtaj suçu ile ilgili hükümler, hukukçuların görüşleri ve muhakeme ve değerlendirmedeki davranışları ve aşağıdaki karşılaştırmaları incelemek bu araştırma ile ortaya çıkmıştır: Bunu şu şekilde özetleyebiliriz: Birinci bölümde, modern hukukta ve İslam hukukunda suç tanımıyla ilgili konuşmayı ele aldık ve kürtaj suçundan kastedilenin hamileliğin sona ermesi veya kadının karnında ne olduğunu, hamileliği tamamlanmadan önce kendisinin veya başkalarının bir eylemi ile bitirmesi olduğu açıklanmaktadır. bahsettiğimiz tüm tanımlar fetüsün rahimden ayrılmasını ve ondan çıkmasını zorunlu kılmaktadır. Bu çalışmada, tıpta ve hukukta kürtaj suçunun tanımı açıklanmaktadır. Kürtaj ve kontrasepsiyon arasındaki ayrımdan bahsederken şöyle ifade edildi: Hamileliğin engellenmesi kürtaj değildir. Çünkü kürtajda gebeliğin var olduğu varsayılır ve sonra büyüme ve gelişmesi sona erer. Kürtaj ile cinayet arasındaki ayrımdan da söz ederken şöyle ifade edilmiştir: Kürtajın kurbanı cenin. İkinci suçta ise mağdur yaşayan bir kişidir. Bizim için düşük olgusunun bazı nedenleri açıklığa kavuşmuştur. Bu çalışmada, Yahudi, Hıristiyan ve İslam hukukunda kürtajla ilgili hüküm açıklanmaktadır. Bu yasaların her birinin kürtaja karşı olup cezalandırdığını görüyoruz. İslam hukukunda, hukukçuların ruh üflenmesinin öncesi ve sonrası aşamada gerçekleşen kürtajı birbirinden ayırdıkları için, hukukçuların konuyla ilgili görüşleri tartışıldı. Alimlerin çoğu, ruh üflenmesinden sonraki aşamada yasak olduğu görüşündedir. Ruh üflenmesinden önceki aşamada farklılaştılar ve farklılıkları ele alınmıştır. İslam hukukunda kürtaj cezasından da bahsedilmiş ve İslam'ın bu suçun unsurları ve şartları yerine getirilmesi halinde işlenmesi gerektiğine karar verdiğini anlıyoruz. Alimler gurre miktarı konusunda farklıydılar ve aynı zamanda kefaret yükümlülüğü konusunda da ayrıldılar ve onların farklılıkları ele alınmıştır. insan yapımı yasaların konumunu tartışıp filozofların ve hukukçuların kürtaj hakkındaki farklı görüşlerinden bahsedilmiştir. Bazıları hamile kadının rızası ile yapıldıysa destekledi, bazıları Fildişi yasasında olduğu gibi zorunluluk halleri dışında hamile kadının rızasıyla olsa bile engellemektedir. Kürtaj suçunda şeriat ile hukuku iki açıdan karşılaştırılmıştır: Birincisi: Terapötik açıdan: Bu açıdan, karşılaştırmayı üç noktada ele alınmıştır: a) Tıbbi nedenlerle kürtaj b) Fetal nedenlerden dolayı kürtaj c) Ekonomik ve sosyal nedenlerle kürtaj İkincisi: Ceza açısından: Bu açıdan şeriat ve ceza açısından hukuk arasındaki fark görünmüştür. Bu araştırma, İslam hukukunun aksine, Fildişi kanununun ruh meselesini tartışmadığını, bunun yerine fetüsten sperm olsa bile çekingen herkesi cezalandırdığını ve kanunun İslam hukukunda olduğu gibi kürtajın doğru bir tanımını vermediğini göstermektedir."
