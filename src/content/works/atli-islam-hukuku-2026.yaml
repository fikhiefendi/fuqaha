abstract: "Yapay zekâ teknolojilerinin hızlı gelişimi, hukuk sistemlerinde yeni sorumluluk problemlerini gündeme getirmiştir. Özellikle otonom karar verebilen yapay zekâ sistemlerinin sebep olduğu zararların kime nispet edileceği meselesi, klasik hukuk anlayışındaki fail, kusur, irade ve sebebiyet kavramlarının yeniden değerlendirilmesini gerekli kılmaktadır. Bu çalışma, yapay zekâ tarafından gerçekleştirilen fiillerden doğan sorumluluğu İslam hukuku açısından incelemeyi amaçlamaktadır. Araştırmada öncelikle İslam hukukunda sorumluluk kavramı; teklif, ehliyet, zimmet, kasıt, hata ve illiyet bağı çerçevesinde ele alınmıştır. Ardından yapay zekânın mahiyeti, teknik işleyişi, kullanım alanları ve hukukî etkileri değerlendirilmiş; özellikle otonom sistemlerin ortaya çıkardığı riskler üzerinde durulmuştur. Çalışmanın son bölümünde ise yapay zekâ fiillerinin hukukî niteliği incelenmiş; yapay zekânın fail, âlet, eşya, köle veya tüzel kişilik benzeri bir statüde değerlendirilip değerlendirilemeyeceği tartışılmıştır. Araştırma, klasik Hanefî, Mâlikî, Şâfiî ve Hanbelî fıkıh literatürü başta olmak üzere usûl ve fürû kaynakları temel alınarak hazırlanmış; ayrıca çağdaş İslam hukukçularının görüşleri ile modern hukukta ileri sürülen sorumluluk teorilerinden de istifade edilmiştir. Yöntem olarak kavramsal analiz, mukayeseli hukuk yaklaşımı ve nitel içerik analizi benimsenmiştir. Çalışmada ulaşılan sonuca göre yapay zekâ, mevcut haliyle bağımsız bir hukuk süjesi veya tam anlamıyla bir fail olarak kabul edilemez. Çünkü İslam hukukunda sorumluluğun temelini oluşturan akıl, irade, kasıt ve ehliyet unsurları yapay zekâda bulunmamaktadır. Bu sebeple yapay zekâ sistemlerinin sebep olduğu fiillerden doğan sorumluluğun; kullanım şekli, müdahale derecesi ve kusur durumuna göre üretici, programcı, kullanıcı veya işleticiye nispet edilmesi daha isabetli görünmektedir. Bununla birlikte klasik fıkıhtaki damân, mübaşeret ve tesebbüb teorilerinin, yapay zekâ kaynaklı modern problemlerin çözümünde önemli bir teorik çerçeve sunduğu sonucuna ulaşılmıştır."
