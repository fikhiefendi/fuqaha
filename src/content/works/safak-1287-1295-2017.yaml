abstract: "Çalışmamız, 1287-1295 tarihli Tuzla Mahkemesi Şer'iyye Sicili'nin transkripsiyonlu metnini, bu metnin imlâ ve bazı gramer özelliklerini, şer'iyye sicillerinin genel yapısını, gramatikal dizinini, sonuç ve önerilerle birlikte tıpkı basımını içermektedir. Birinci bölüm, giriş bölümü olup, burada Kıbrıs adasının tarihi, Türklerin adaya yerleşmesi, idarî yapısıyla ilgili genel hatlarıyla bilgiler verilmiştir. İkinci bölüm, Kaynak Araştırma ve Kuramsal Çerçeve bölümüdür. Burada çalışmamıza başlamadan önce nasıl bir süreç izlediği ve çalışmamıza başlarken gerek metnin okunmasında gerekse değerlendirilmesinde esas alınan kuramsal çerçeve ile ilgili bilgiler yanında araştırma modeli, yöntem ve verilerin toplanmasıyla ilgili esas alınan hususlar üzerine bilgiler verilmiştir. Üçüncü bölümde, Tuzla Mahkemesi Şer'iyye Sicili'nde yapmış olduğumuz dil incelemesi yer almaktadır. Bu bölümde vokallerin ve konsonantların yazılışları, ünlü değişmeleri, kalınlık incelik uyumu ve biçim özellikleri ele alınmıştır. Dördüncü bölümde, dil ve üslûpla ilgili bilgiler verilmiş, bunun yanında şer'iyye sicillerinde geçen mahkeme davaları konuları bakımından sınıflandırılmış ve örnek davalar verilmiştir. Bunun yanında şer'iyye mahkemesindeki görülmüş olan belli başlı davalardan yola çıkılarak davaların genel yapısı tablo halinde verilmiştir. Beşinci bölüm ise sonuç ve öneriler bölümdür. Burada sonuç ve önerilerimizi maddeler halinde sıralanmıştır.Ekler bölümünde TÜRKSÖZDİZ v.1.3.0 programı ile hazırlanmış Türkçe gramatikal indekse yer verilmiştir."
