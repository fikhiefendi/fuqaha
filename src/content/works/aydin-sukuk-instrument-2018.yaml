abstract: "İslam'da hayatın her alanında olduğu gibi finans alanında da ahlaki prensipler mevcuttur. Dolayısıyla İslami Finans'ın bir parçası olarak Sukuk Enstrümanı bu prensipler doğrultusunda değerlendirilmeye çalışıldı ve sukuk'un alternatif bir finansman enstrümanı olma ve topluma fayda sağlama potansiyeli analiz edildi. Bu bağlamda ilk olarak, İslami Finans'a genel bir çerçeve çizmek için İslam Ekonomisi'nin prensiplerine değinildi. Ardından, İslam Hukuku'nun amaçlarına göre ideal sukuk enstrümanlarından bahsedildi. Ek olarak, vakıf-sukuk ve sosyal sorumluluk yatırımları sukuk gibi sosyo-ekonomik kalkınmayı finanse eden araçlar açıklandı. Ardından mevcut sukuk enstrümanı İslam Hukuku ve uluslararası finansal standartlara göre eleştirildi. Tezin son kısmında, araştırmanın neticesi olarak sukuk enstrümanını geliştirmek ve alternatif bir finansman enstrümanı yapabilmek için gerekli politika önerileri sunuldu."
