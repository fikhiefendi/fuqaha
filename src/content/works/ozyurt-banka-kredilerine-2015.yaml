abstract: "Bu araştırma genel olarak bankacılık, katılım bankacılığı, kredi ve faiz, murabaha ve kar payı konularını kapsamaktadır. Özelde ise araştırmada amaçlanan katılım bankalarının uyguladığı murabaha finansman yönteminin teori ve pratikte İslam'ın faiz yasağına uygunluğunun incelenmesidir. Bu amaçla katılım bankaları üzerinde mülakat yöntemi uygulanmıştır. Ayrıca anket yöntemi uygulanarak toplumun konuya bakışı görülmek istenmiştir. Araştırmadan elde edilen sonuçlara göre murabaha yönteminin teoride İslam'ın faiz yasağına uygun bir finansman yöntemi olduğu söylenebilir. Pratikte ise bu yöntem İslam'ın faiz yasağına uygunluk açısından giderilmesi gereken bazı sorunlar barındırmaktadır. Bu sorunların başlıcaları olarak gecikme cezası ve tek fatura uygulamaları gösterilebilir. Ayrıca anket sonuçları toplumun konu hakkındaki doğru bilgi seviyesinin düşük olduğunu göstermiştir."
