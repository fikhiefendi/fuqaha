abstract: "Araştırmamızda, fıkıh alanında önemli bir yere sahip olan ve ilim geleneğinde öncü bir rolü bulunan Abdullah bin Abbas'ın ictihad anlayışı özelinde durulmuştur. Abdullah bin Abbas'ın Tercüman'ül-Kur'ân olarak meşhur olması ve bu yönüne vurgu yapılması kendisi hakkında tefsir alanında çok sayıda çalışmaların yapılmasına sebep olmuştur. Fakat her ne kadar tefsir ve hadis alanında meşhur olsa da bu eşsiz sahabi kendi döneminde“Abâdile”olarak bilinen dört fakih sahabe arasında anılmaktaydı. Ayrıca O, dönemin halifeleri tarafından hac emiri olarak seçilmesi ve Hz. Ömer zamanında hadlerin uygulanması için görevlendirilmesi yanında ibadet, muâmelât ve ukubât alanında ortaya koyduğu içtihatlarıyla fıkıh alanında ne kadar önemli ilmi bir şahsiyet olduğunu ortaya koymaktadır. Biz de bu çerçevede Abdullah bin Abbas (r.a) ve Fıkhi Görüşleri adlı tez çalışmamızı yaparak Abdullah bin Abbas'ın ictihad anlayışını, kendine has görüşlerini ve cumhurdan ayrıldığı ve ittifak ettiği bazı konuları ortaya koyarak bu fakih sahabinin fıkıh alanındaki otoritesine bir nebze de olsa değinmeye çalışacağız. Ele aldığımız konularda İbni Abbas'ın görüşlerine yer verilecektir. Konuların genişliği tezin çok uzun olmasına neden olacağından bir konu ele alındığında bilhassa İbni Abbas'ın görüşleri ortaya konularak gerekli yerlerde diğer görüşlerle karşılaştırmalı bir biçimde ihtilaf edilen noktalar ve ittifak edilen hususlar ortaya konulmaya çalışılacaktır."
