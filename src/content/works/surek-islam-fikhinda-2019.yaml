abstract: "“İslâm Fıkhında Farz-ı Kikâye”isimli bu çalışma bir giriş ile iki bölümden meydana gelmektedir. Giriş bölümü araştırmanın amacı, önemi, yöntemi ve sınırlılıklarından oluşmaktadır. Birinci bölümde önce hüküm kavramı üzerinde durulmakta daha sonra dört mezhebin önde gelen isimlerinin hüküm kavramına yükledikleri anlamlara işaret edilmektedir. Ardından araştırmanın konusu olan farz-ı kifâyenin hüküm bahsindeki yerini tespit etmek için hükmün kısımları ve hükümle alakalı konulara özetle değinilmektedir. İkinci bölümde ise“farz-ı kifâye”tamlamasını oluşturan“farz”ve“kifâye”kavramlarına yüklenen anlamlara ayrı ayrı değinildikten sonra terkip olarak“farz-ı kifâye”ye yüklenen anlamlara işaret edilmektedir. Peşinden farz-ı kifâye ile farz-ı ayn karşılaştırmalı olarak ele alınıp aralarındaki farklılıklar ortaya konmaktadır. Devamında farz-ı kifâyenin önemi ve fazileti üzerinde durulup farz-ı kifâyenin farz-ı ayna dönüştüğü durumlar zikredildikten sonra farz-ı kifâyeye muhatap olacak kesimlerin kimler olduğu hususu tahlil edilmektedir. Çünkü bazı farz-ı kifâyeler vardır ki bunlar bazen sadece belli bir kesime veya gruba yönelik olup diğer mükelleflerin takatini aşmaktadır. Bazen de bir kısım farz-ı kifâyelerin ifası için kurum ve kuruluşlar inşa etmek gerekmektedir. Bunlar hakkında da araştırmanın gerekli yerlerinde izahat yapılmaktadır. Daha sonra toplumda yaygınlaşmış olan farz-ı kifâyelerden; cemaatle namaz kılmak, cenaze işlemleri (techiz, tekfin, teşyi ve cenaze namazı gibi ), ictihad, emr-i bi'l-ma'ruf (iyiliği emretmek) nehy-i ani'l-münker (kötülükten sakındırmak) ve cihad konuları ele alınarak incelenmiştir. Farz-ı kifâye bağlamındaki bu örneklerin psikolojik ve sosyolojik boyutlarına her bir konunun kendi başlığı altında yer yer atıflar yapılmaktadır. Farz-ı kifâyeleri eda etmenin toplumsal dayanışmaya etkilerinden bahsettikten sonra toplumsal ödev bilincinin insanlarda oluşabilmesi ve Müslüman topluluklarının da medeni toplumlar arasındaki yerini alabilmesi için bu görevlerin ifa edilmesinin gerekliliğine değinilmektedir. Nihayet her biri birer toplumsal ödev olan farz-ı kifâyelerin şer'an temellendirilmesi adına her bir konu başlığının altında ilgili ayet ve hadislere yer verilerek konu bitirilmiştir."
