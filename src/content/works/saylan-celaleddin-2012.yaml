abstract: "İslam yargı hukukunun bir dalı olan şürût ilmi kısaca belge düzenleme esaslarını inceleyen ilim olarak tanımlanabilir. İslam'ın ilk dönemlerinden itibaren uygulanagelen hukukî işlemlerin yazıya geçirilmesi faaliyeti, ilerleyen dönemlerde müstakil bir ilim dalının konusu haline gelmiştir. Şürût ilmi olarak isimlendirilen bu ilim dalı ile ilgili hicrî üçüncü yüzyıldan itibaren müstakil eserler yazılmaya başlanmış, bu konuda geniş bir literatür oluşmuştur. Telif edilen bu eserlerden biri de Ğureru'ş-Şürût ve Dürerü's-Sümût adlı eserdir.VIII./XIV. yüzyılda Harezm Cürcâniyyesi'nde (Gürgenç) Celâleddin el-İmâdî el-Fethâbâdî tarafından telif edilen Ğureru'ş-Şürût klasik dönem şürût literatürünün son örneklerinden biridir. Mukaddime, dört ana bölüm ve sonuçtan oluşan eserde; birinci bölümde şürût belgelerinin yazımı, ikinci bölümde mahdar ve sicillerin yazımı, üçüncü bölümde mahdar ve sicil yazımında yapılan hatalar ve hata örnekleri, dördüncü bölümde atama yazıları ve kâdı yazışmaları konularına değinilir. Sonuç bölümünde yazıyla ilgili muhtelif hususlarla ilgili açıklamalara yer verilir.Dört bölümden oluşan çalışmamızda; birinci bölümde şürût ilminin tanıtımı ve tarihçesine; ikinci bölümde türlerine göre belgelerin yazımı ve belge örneklerine; üçüncü bölümde Ğureruş-Şürût ve eserin müellifi İmâdî'nin tanıtımına; dördüncü ve son bölümde ise Ğureruş-Şürût'un tahkîkli Arapça metnine yer verilmiştir. Tahkîkin sonunda ayrıntılı bir konu fihristi ve kitap, şahıs ve yer indeksi yer alır.Anahtar Kelimeler : Belgeleme, Şürût, Şürûtî, Müvessık, Celâleddin el-İmâdî, Ğurerü'ş-Şürût ve Dürerü's-Sümût, Mehâdır, Sicillât, Menâşir, Kitâbu'l-kâdî ile-l-kâdî, Kitâbu-l-hükmî, Vesâik, Tevsîk, Sukûk."
