abstract: "Abdulkerim Zeydan son asrın en mühim fakih, usulcu, hukukçu ve davetçilerindendir. İslam fıkhı, usulü ve daveti başta olmak üzere muhtelif birçok alanda çok kaliteli eserler yazmış üretken bir alimdir. Irak'lı olan Zeydan, hem alim hem de akademik kimliği ile üst düzey bir şahsiyete sahip, muteber kabul edilen aksiyoner biridir. Biz de bu çalışmamızda, Abdulkerim Zeydan Hoca'nın hayatı, eserleri, ilmî, fıkhî ve eğitimsel yönleri hakkında bilgiler sunup onun daha iyi tanınmasına ve kendisinden daha ziyade istifade edilmesine katkıda bulunmak istedik. Zeydan, ilmî yöntem olarak sık sık İslam hukuku ve modern hukuku karşılaştırmıştır. Ayrıca fıkhî bakışı açısından birtakım yeni gelişmeleri, sosyal değişimleri, siyasi konuları, muhtelif mesele ve problemleri, ilmî ve maslahata uygun bir usulle ele almış, vakıayla yüzleşmiştir. Sahih ilmî ve usulî temellere dayanmış, hakikate, gerçekliğe en uygun cevaplar ve çözümler için gayret etmiştir. Eğitim ve İslamî davet alanında da, yine ilmî bir yol çizmiş aktif bir konumda olmuştur. Bu bağlamda dört bölümden oluşan çalışmamızın ilk bölümünde, giriş başlığıyla konunun önemi, amacı, yöntemi ve kaynaklarına değindik. İkinci bölümde, Zeydan'ın hayatı ve kişiliğini, üçüncü bölümde ise en mühim bazı eser ve makalelerini ele aldık. Dördüncü bölümde onun fıkhi kişiliğini ve anlayışını aile hukukunun nikâh ve talak konuları çerçevesinde işledik ve son kısımla sonuca vardık. Zeydan Hanefî mezhebinden olup, tabakatu'l-fukaha'dan tercih ve tahric ehl-i bir fakihtir. Kendisi köklere bağlı gelenekçi bir alim olmakla beraber modern konularla da yüzleşen, yenilikçi yönü olan biri. Tabi bu“yenilikte”ifrat ve tefrite düşmeden, istikamet üzere bir yol izlediği görülüyor. Ayrıca çağdaş meseleleri ve sorunları iyi bir şekilde işleyip sadra şifâ olan isabetli çareler ve çözümler sunduğu, görüşlerinde ve fetvalarında, ictihad ve maslahat anlayışına riayet ettiği tesbit edilmiştir."
