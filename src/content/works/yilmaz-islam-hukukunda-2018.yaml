abstract: "Kadın ile erkeğin arasındaki ilişkinin meşru olması için nikâh akdi gereklidir. Günümüzde nikâh akdinden önce veya nikâh akdi esnasında taraftarın birbirlerine çeşitli şartlar öne sürdükleri görülmektedir. Bizde bu çalışmamızda nikâh akdi esnasında şart koşma konusunu İslâm hukukunun en önemli temsilcilerinden olan Hanefî, Şâfiî, Mâlikî, Hanbelî ve Zâhirî mezheplerinin görüşleri çerçevesinde inceledik."
