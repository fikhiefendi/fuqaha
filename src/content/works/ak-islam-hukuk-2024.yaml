abstract: "'İslâm Hukuk Tarihinde İnsan Hakları'nın incelenmeye çalışıldığı bu çalışmada; insan ve hak kavramları, aslında birbirinden ayrılamayacak derecede iç içe geçmiş bir bütün olup ikisinin birbirinden ayrılamaz olduğu sonucuna ulaşılmıştır. Bu açıdan bakıldığında insan hakları terimi insanlık tarihiyle eş zamanlıdır. İslam inancına göre, hak kelimesinin Allah'ın isimlerinden biri olması, tüm hakların kaynağının Allah'a ait olduğunu vurgular. İslam hukuk tarihine bakıldığında, bu vurguya ve inanca dayalı öğretiler tüm metinlerde görülebilir. İslam tarihinde insan haklarına yönelik ilk vurgu \"Medine Sözleşmesi\" ve \"Veda Haccı\" ile ilişkilendirilirken, \"geride kalan öne geçmeye adaydır\" hakikatine uygun olarak, Batı eserlerinde insan hakları kavramının bir terim olarak doğuşu ve önem kazanması iki yüzyılı aşmazken, bu konuda söz sahibi olmuşlardır. İslam dünyasında insan hakları kavramı böylesine köklü bir geçmişe sahip olmasına rağmen, bu kavramın Batı'daki felsefi düşüncelerle ortaya çıktığı ve İslam dünyasındaki insan hakları ihlallerinin bu bilinç eksikliğinden kaynaklandığı öne sürülmektedir. Bu çalışma, insan haklarını evrensel ve tarihsel bir perspektiften, İslam hukuku bağlamında yorumlamayı ve bu alandaki modern yaklaşımlarla olan ilişkisini derinlemesine incelemeyi amaçlamaktadır. İslâm hukukunda \"hak\" kavramını geniş ve çok katmanlı bir anlam örgüsüne sahip olduğu hem Allah'ın emir ve yasaklarına bağlı kalmayı hem de bireylerin sosyal ve kişisel yararlarını korumayı gerektiren bir ifade olduğu söylenebilir. İslâm hukuk tarihinde insan haklarının dört ana teori altında incelenmesi mümkündür: -İnsâniyyet/Âdemiyyet Teorisi; insanın yaratılışındaki değeri, sosyal ve ahlaki boyutlarını vurgular. Bu teori, tüm insanların eşit temel haklara sahip olduğunu savunur ve Hz. Âdem'in yaratılışı üzerinden insanın hak ve sorumluluklarını ele alır. İslam hukuku insanı sadece fiziksel bir varlık olarak değil manevi ve ahlaki sorumlulukları olan bir birey olarak değerlendirir. -İman ve Emân Teorisi; İslam hukukunda vatandaşlık ve insan haklarını inanç ve devletle yapılan anlaşmalar çerçevesinde değerlendirir. İman Müslümanların Allah'a karşı sorumluluklarını tanımlarken, emân Müslüman olmayanlara sağlanan haklar ve güvenceleri kapsar. Bu teoride zimmet anlaşmaları, sosyal uyum ve toplumsal barışın temini için önemli bir yer tutar ve İslam hukukunun toplumsal düzeni koruma amacını yansıtır. -Mekâsıd ve Maslahat Teorisi; İslam hukukunun amaçlarını (mekâsıd) ve toplumsal yararı (maslahat) esas alır. Hukuk, bireylerin ve toplumun ihtiyaçlarını karşılayarak refahı artırma ve adaleti sağlama hedefi üzerine inşa edilmiştir. Bu teori, hukukun esnekliğini ve zaman içindeki değişimlere uyum sağlama yeteneğini vurgulayarak, İslam hukukunun evrensel ilkelerle uyumlu olmasını sağlar. -İnsan Onuru Teorisi; İslam hukukunda insan onurunun haysiyet ve adaletle eşdeğer kabul edildiğini belirtir. İnsan onurunun korunması, temel hakların savunulmasıyla mümkündür. İslam hukuku, insan onurunu her koşulda korumayı ve yüceltmeyi amaçlar; bu yaklaşım insan haklarının temelini oluşturur ve İslam hukukunun adalet ve merhamet ilkelerine dayandığını gösterir. Sonuçta; çağımızda insan hakları ve temel özgürlükler bağlamında yapılan vurgular, insan onurunun korunmasını ve hukukun üstünlüğünü esas alır. İslâm hukukunun tarih boyunca bu prensipleri benimsemiş ve insan onurunu koruyacak şekilde teoriler geliştirdiği ve bu doğrultuda da yorumladığı tespit edilmiştir. Anahtar Kelimeler: İslam Hukuku, İnsan Hakları, Adalet, Eşitlik, İnsâniyyet, Âdemiyyet, İman ve Emân, Mekâsıd, Maslahat, İnsan Onuru, Hürriyet, Özgürlük, İnsan Hakları Teorisi, Barış."
