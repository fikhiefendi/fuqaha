abstract: "?İslam Devletlerinde Toplumsal Cinsiyet ve Hukuk? başlıklı çalışmamızda, gerek siyasi gerek idari yapıları açısından birbirinden son derece farklı olan Müslüman ülkelerde Tanrı adına yaratılan eril hukuksal yapı ele alınacaktır.Çalışmamız üç bölümden oluşmaktadır. Birinci bölümde, İslami terminolojide birbirine sıkı sıkıya bağlı; fakat özünde farklı iki kavram olan Şeriat ve fıkıh arasındaki ayrım ve bu anlam kargaşasının İslam hukukunun modern anlamda reformunun önünde ne ölçüde psikolojik bir engel oluşturduğu ve 19. yüzyılda modernist akımla başlayıp günümüzde insan hakları söylemi, modern yorum trendleri ve feminist teolojiyle süren gelişmelerin İslam hukukuna etkileri ele alınacaktır.İkinci ve Üçüncü bölümlerde, Mısır ve İran'da yürürlükteki yasaların şer'i hukukla çatıştığı noktalar, şer'i hukukun kaynaklarına pozitif hukukun kaynakları olarak nasıl ve ne ölçüde başvurulabileceği ve İslam hukukunun çağdaş toplumun ihtiyaçlarına ne oranda cevap verdiği kadınlar üzerinden ortaya konmaya çalışılacaktır. Bu doğrultuda İran hukuk sistemi, İslami Devrim öncesinde İran kadın hareketi, Pehleviler Döneminde gerçekleştirilen sosyal ve hukuki reformlar, İslami Devrim sonrasında devletin anayasal ve hukuki niteliği ve kadınların hukuki statüsünde yaşanan gelişmeler; Mısır hukuk sistemi, Mısır kadın hareketinin tarihsel gelişimi ve Mısır pozitif hukukunda kadınların statüsü incelenecektir."
