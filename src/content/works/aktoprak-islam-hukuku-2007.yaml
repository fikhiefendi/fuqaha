abstract: "Çal mam z Giri ve üç bölümden olu maktad r. Giri i iki k s m olaraktasarlad k. Birinci k s mda çal mam z n konu ve kapsam ; önemi ve gayesi,metodu ve sistemati i alt ba l klar n n yer ald teknik alt yap verildi. kincik sm nda ise köle ve cariye kavram n n anlam alan ; slam hukukuna göreincelendi.Birinci bölümümüzü kölelik ve cariyelik kavramlar n n tarihi süreçtedurumunu inceledik. Bu kavramlar aç klayarak köleli i do uran sebeplerüzerinde durdu. slam öncesi semavi ve semavi olmayan dinlerde kölelikkonular n inceledikkinci bölümde özellikle slam toplumlar nda kölelik durumu, özelliklekad n köleler göz önüne al narak incelendi..Üçüncü bölüm ise slam hukukuna göre kölelerin yine özellikle kad nkölelerin sosyal hayattaki pozisyonlar na, hak ve hürriyetlerine de inerekinceledik.Ve sonuç bölümünde de tezimizin sonucunda vard m z sonuçlaraç klad k."
