abstract: "Helal ve güvenilir gıdaya ulaşmak Müslümanların temel önceliğidir. Ancak son dönemde biyoteknolojinin gelişmesiyle sağlık ve hayvancılık alanlarında olduğu gibi gıda alanında da atılımlar yaşanmaktadır. Bu durum helal ve güvenilir gıdaya erişim noktasında insanları tedirginliğe sevk etmektedir. Son dönemde popüler bir ürün olarak görülen yapay et teknolojisi de bu atılımların bir sonucu olarak karşımıza çıkmaktadır. Canlı hayvandan biyopsi yöntemiyle alınan kök hücrelerin laboratuvar ortamında kültürlenmesiyle elde edilen yapay et, alternatif protein kaynağı olarak sunulmaktadır. Çünkü ürünün geleneksel et üretim sistemlerine kıyasla gıda eşitsizliğine çözüm olacağı, hayvan refahını sağlayacağı, insan ve çevre yararına olacağı iddia edilmektedir. Ancak mahiyetindeki bazı belirsizlikler nedeniyle topluma, çevreye ve ekonomiye yönelik uzun vadeli etkileri öngörülememektedir. Bu sebeple, yapay et özelinde dini ve etik bağlamda bazı soru işaretleri doğmuştur. Araştırmanın temel amacı ortaya çıkan soru işaretleri ışığında yapay et üretim ve tüketimini fıkhi ve etik açıdan değerlendirmektir. Bu doğrultuda tezimizin birinci bölümünde yapay et teknolojisi incelenerek elde edilen verilerle bir temel oluşturulmuştur. İkinci bölümde İslam dünyasında ortaya çıkan fıkhi tartışmalar ortaya konularak yapay et, helal gıda kriterleri bağlamında analiz edilmiştir. Son bölümde yapay et, batı dünyasında ortaya çıkan etik tartışmalar bağlamında değerlendirilmektedir."
