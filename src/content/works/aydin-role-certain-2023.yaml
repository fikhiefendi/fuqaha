abstract: "Bu çalışmanın önemi, toplumdaki bireylerin yaşamlarıyla ilgili sosyal bir olguyu ele almasında temsil edilmektedir. Çalışmanın odak noktası sosyal yabancılaşmanın önlenmesinde İslam öğretilerinin rolünün Makâsıd İlmi açısından incelenmesidir. Bu çalışmada; şeri nasların incelenmesi ve bu naslardan sosyal yabancılaşmayı önleyici nitelikteki makâsıdların ortaya çıkarılması yoluyla tümevarım, niteleyici ve analitik araştırma metotları kullanılmıştır. Bu çalışmayla İslam'ın önemli sosyal statüsü ortaya çıkmış, Şari'nin ortaya koyduğu kanunlar yoluyla İslam'ın ilke ve değerlerinin toplumsal hayatta refahın en üst düzeylerini temsil ettiği sonucuna ulaşılmıştır. Aynı zamanda bireylerin toplumlara aidiyet duygusunun pekişmesiyle birlikte sosyal yabancılaşmanın önlenmesinde Zekât ibadetinin rol oynadığı saptanmıştır. Ulaşılan bir diğer sonuç ise Hac ve Oruç ibadetlerinin makâsıdından olan takvanın sosyal yabancılaşmayı önlemedeki rolünün belirmesidir."
