abstract: "Bu araştırma, Libya şiirinde metinlerarasılık fenomeni ve Arap eleştirmenlerin ona karşı pozisyonunu ve bu fenomenin Libyalı şairlerin divanlarında ne ölçüde yaygın olduğunu ve şairlerin şiirsel çalışmalarında dini ve edebi mirasa başvurmalarını gösteren bazı şiirsel örneklerin sunumunu ele alıyor. Eleştirmenler, metinlerarasılığın modern, eski bir fenomen olduğu konusunda hemfikirdirler. Eski edeiyatçılar bu fenomeni tanımlamışlar ve bunu çalışmalarında kullandıkları gibi şiirlerinde de uygulamışlardır. Ancak buna“metinlerarasılık”olarak isimlendirmemişlerdir. Bunun yerine başka adlar, en önemlisi intihal, hırsızlık, düşüncelerin benzerliği ve metinlerin bir kısmının diğer bir kısmıyla örtüşmesine delalet eden ve şairlerin şiirlerinde bazı eski metinleri getirmeleri gibi başka isimlendirmeler altında ele almışlardır. Belagat alimleri, metinlerarasılığın hiçbir şairin vazgeçmediği bir yöntem olduğu konusunda hemfikirdirler. Aksine, bazıları şairin kendisinden öncekilerin edebi kültürü hakkındaki bilgisini şairliğin bir koşulu yapmışlardır. Bir edip, yeteneğini geliştirmek ve tarzını geliştirmek için kendisinden öncekilerin yazdıklarını okumadıkça edip olmaz. Eleştirmenler arasında bunu, başkalarının anlamlarının ve fikirlerinin, özellikle şair kendi tarafından yeni bir şey eklemeden lafızı veya anlamı tamamen aldıysa intihal olduğunu düşünenler vardır. Bu haklı gösterilemeyen veya kabul edilemeyen çirkin bir hırsızlık sayılmıştır. Ama eğer şair kendisinden öncekilerin sözlerini ve anlamlarını alırken onları yeni bir kisveyle ortaya koyarsa o zaman bu, kınanması gereken intihal başlığı altına girmeyen, kabul edilen övülen bir alıntı sayılır. Eleştirmenler arasında, kendisinden öncekilerin içinde dalmadıkları hiçbir lafız ve anlamı bırakmadıkları gerekçesiyle şairi sözler ve fikirleri alıntı yapmalarında mazur görenler de vardır. Lafızlar ve anlamlar herkese açıktır ve onlarla ilk kez ilgilenenler için öncelik erdemi vardır ve çağdaş araştırmacıların bu fikir ve anlamlara ustalık ve yenilik ekleme erdemini göstermeleri gerekir. Libyalı şairler, diğer şairler gibi, Libya toplumunda yayılan din kültürü sayesinde, metinlerarasılığın pek çok biçimini, özellikle dini metinlerarasılığı şiirlerinde yaygınlaştırmışlardır. Şairlerin tümü olmasa da kahir ekseriyeti Kuran-ı Kerim'i ezberlememiş ve hükümlerini ve ilimlerini öğrenmişlerdir.Şiirsel çalışmalarında bunun etkisinin görünmesi gayet doğaldır. Ayrıca, her şairin eski (dini ve edebi) mirası getirmek için kendine özgü bir tarzı vardır. Bazıları Kuran-ı Kerim'in bazı ayetlerinin lafızlarını şahit getirirken, bazıları da onun fikirleri ve anlamlarından yardım almışlar, bir kısmı ise iktibas metoduna başvurmuş, bazıları ise tazmin sanatına yönelmiş, bazıları da dini ve edebi mirası şiirlerinde birleştirmişlerdir."
