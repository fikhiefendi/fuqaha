abstract: "Çalışmamızda üzerinde ciddi anlamda araştırma yapılmamış olan Bâtınî mezheplerin ibadet anlayışını incelemeyi hedefledik. Birçok inanıştan ögeler barındıran Bâtınî mezheplerin ibadet anlayışlarını ortak paydalar üzerinden ele alarak kitâbî İslâm'dan farklı yönlerini belirlemeye çalıştık. Ayrıca Bâtınî mezhepler her ne kadar isim, zaman ve mekân noktasında farklı olsalar da pek çok noktada olduğu gibi ibadet noktasındaki fikirsel alt yapının da benzer olduğunu tespit etmeye çalıştık. Çalışmamız giriş ve üç bölümden oluşmaktadır. Giriş bölümünde İslâm dünyasında yaşanılan ayrılıklara, Bâtıniyye'nin oluşumuna ve Bâtınî mezheplere değinilmiştir. Birinci bölümde, girişte tespit edilen Bâtınî mezhepler, zaman açısından ele alınıp namaz ve oruç ibadeti bağlamındaki uygulamaları incelenmiştir. Ayrıca bu ibadetler ele alınmadan önce ibadetlerin temel şartlarından olan abdest uygulaması ele alınmıştır. İkinci bölümünde mekâna bağlı ibadetler bağlamında kutsal kabul edilen kişiler, hac ibadeti, türbeler ve doğa kültleri ele alınmıştır. Son bölümde ise mâli ibadetler bağlamında zekât ve kurban başlıkları altında Bâtınî mezhepler incelenmiştir. Anahtar Sözcükler Bâtınîlik, Abdest, Namaz, Oruç, Kült, Hac, Türbe, Zekât, Kurban"
