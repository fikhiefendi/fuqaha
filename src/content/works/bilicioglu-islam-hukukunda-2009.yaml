abstract: "İslam Hukuku, muamelat sahasının temel konularından biri olan satım akdine özel bir önem atfetmiştir. Bu önem sayesinde olmalıdır ki satım akdi çerçevesinde gelişen literatüre bakıldığında oldukça ayrıntılı ve zengin bir birikimin varlığıyla karşılaşılır. Bu birikimin özellikle mebî` ve mal kavramları etrafında geliştiği söylenebilir. Çalışmamız satım akdine konu olamayacak nitelikteki malların tespit ve tasnifi gayesiyle, dört fıkıh mezhebinin kaynak değerine sahip belli sayıdaki eserleri incelenerek oluşturulmuştur.İslam Hukuku'na göre bazı mallar ayn/zât'larından kaynaklanan sebeplerle satım akdine konu olamazlar. Bu tür mallara ilişkin hükümleri tespit etme ihtiyacı, fakihlerin akit konusu mal için bazı ?meşrûiyyet? şartları geliştirmeleri ile sonuçlanmıştır. ?Malın malla mübadelesi?nden ibaret bir işlem olarak görülen satım akdinin sonuç doğurabilmesi için, akit konusunun her şeyden önce hukukun meşru kabul ettiği, koruduğu, ?mütekavvim? bir mal olması gerekir. Netice itibariyle şer`î hukukun ?fayda?sını yasaklamadığı, ?fayda? temin edilebilen, temiz, iktisadî değer/kıymet'i olan ve sahipli tüm mallar, meşrû mal sınıfında yer alırlar ki diğer akdî şartların da gerçekleşmesi halinde bu mallar satım akdine konu olabilirler."
