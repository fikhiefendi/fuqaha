abstract: "Bu çalışma, İslâm iktisadının epistemolojik ve normatif temellerinin Ahlâk felsefesi tarafından kurulduğunu ortaya koymayı amaçlamaktadır. Modern İslâm iktisadı literatüründe kaynakların çoğunlukla Kur'an, Sünnet ve fıkıh çerçevesinde ele alınması, Ahlâk felsefesinin kurucu rolünün geri planda bırakılması, araştırmanın temel problematiğini oluşturmaktadır. Bu bağlamda çalışma, İslâm iktisadının yalnızca hukukî normlar bütünü değil, temelde ahlâkî bir düzen teorisi olduğunu savunmaktadır. Araştırmanın merkezinde İbn Miskeveyh'in Tehzîbü'l-Ahlâk adlı eseri yer almakta; bu eser üzerinden fazilet teorisi, nefs anlayışı, adalet ilkesi ve saadet tasavvuru analiz edilmektedir. Tarihsel ve kavramsal çözümleme yöntemiyle yürütülen çalışmada İbn Miskeveyh'in ekonomik arzuların dengelenmesini nefs terbiyesi ve itidal kavramı üzerinden temellendirdiği; serveti ise bireysel çıkarın değil toplumsal maslahatın hizmetinde konumlandırdığı ortaya konmuştur. Çalışma ayrıca İbn Miskeveyh'ten Gazzâlî, Nasîrüddîn Tûsî, Celâleddîn Devvânî ve Kınalızâde'ye uzanan entelektüel sürekliliği inceleyerek, Ahlâk-iktisat ilişkisinin İslâm düşüncesinde arızi değil sistematik ve medeniyet ölçeğinde süreklilik arz eden bir yapı olduğunu göstermektedir. Bu süreklilik, İslâm iktisadının tarihsel olarak değer-yüklü ve adalet merkezli bir normatif çerçeve içinde şekillendiğini ortaya koymaktadır. Modern iktisadın homo economicus merkezli, değer-nötr ve çıkar maksimizasyonuna dayalı yaklaşımıyla mukayese edildiğinde, İslâm Ahlâk felsefesine dayalı iktisat anlayışının insanı fazilet ve toplumsal sorumluluk ekseninde tanımlayan bütüncül bir model sunduğu sonucuna ulaşılmıştır. Bu modelde iktisat, maddi refahın ötesinde ahlâki kemal ve toplumsal adaletin aracı olarak konumlandırılmaktadır. Araştırmanın temel katkısı, ahlâk felsefesini İslâm iktisadının tali değil asli epistemolojik kaynağı olarak konumlandırması; böylece disipline metodolojik genişlik ve felsefi derinlik kazandırmasıdır. Bu yönüyle çalışma hem klasik literatürün yeniden okunmasına hem de çağdaş İslâm iktisadı tartışmalarının teorik çerçevesinin yeniden inşasına katkı sunmaktadır."
