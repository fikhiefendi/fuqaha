abstract: "?Bir Finansman Tekniği Olarak Barter Sistemi ve İslam Hukukundaki Yeri? başlıklı bu tez çalışması, son yıllarda dünya ekonomisine alternatif bir finansman aracı olarak temâyüz etmiş olan Barter Sistemini tanıtmak ve bu sistemin İslâm Hukukundaki yerini ortaya koymak için yapılmış bir çalışmadır.Tez, kısa bir giriş ve iki bölümden oluşmaktadır. Birinci bölümde, Barter Sistemiyle ilgili genel bilgiler, sistemin işleyişi ve diğer finansman ve pazarlama teknikleriyle ilişkisi en sade şekliyle izah edilmiştir. İkinci bölümde ise, Barter sisteminin İslâm Hukukundaki yerinin tespiti ve değerlendirmesi hususuna yer verilmiştir. Bu bağlamda, öncelikle İslâm Şirketler Hukuku açısından Barter şirketi ele alınmış, daha sonra da Barter Sisteminde taraflar arasında gerçekleşen vekâlet, kefâlet, havâle ve takas akdi gibi hukukî işlemlerin İslâm Hukuku açısından değerlendirilmesi yapılmıştır.Sonuç olarak, yeni bir ticaret finansman sistemi olduğu için ismen İslâm Fıkhı kaynaklarında yer almayan Barter Sisteminin, uygulamada birçok yönüyle İslâm Borçlar Hukukunun ortaya koyduğu hükümlere uygunluk arzettiği görülmüş, ekonomide para piyasasından mal piyasasına geçiş sürecinin orta noktasında olduğu ve dünyaya hakim olan faize dayalı ticarî mantaliteye karşı ciddi bir alternatif olarak incelemeye ve geliştirmeye değer bir sistem olduğu sonucuna ulaşılmıştır."
