abstract: "İslâm hukukunda bir kimseye ceza sorumluluğunun yüklenebilmesi için o kimsenin insan olması tek başına yeterli değildir. Ferdin, işlediği suçun sonuçlarından mesul olması, cezaî sorumluluğu gerektirmektedir. Sorumluluk, insan olmanın yanı sıra idrak (anlama) ve irade sahibi olmayı ve suçu işlemeye elverişli olmayı da gerektirir. Tez çalışmamızda, İslam ceza hukukunda ceza sorumluluğunu sınırlayan ve kaldıran durumlar ele alınmıştır. Çalışmamız giriş ve iki bölümden oluşmaktadır. Giriş kısmında konunun fıkıh ilmi içindeki yerine, sınırlandırılmasına, amaç ve yöntemi ile kaynaklarına dair bilgilere yer verilmiştir. Çalışmamızın birinci bölümünde suç ve ceza kavramları ele alınmış ve kaynaklarda yer alan alt başlıkları incelenmeye çalışılmıştır. Tezimizin asıl kısmını oluşturan ikinci bölümde ise İslam ceza hukukunda ceza sorumluluğunu sınırlayan ve kaldıran durumlar pozitif hukuktaki yansımaları ile ele alınmıştır."
