abstract: "Bu çalışma, Filistin İslami bankalarında Şeriat denetiminin etkinliğini artırmada finansal teknolojinin kullanılmasının rolünü belirlemeyi amaçlamaktadır. İlgili çalışmalara bakılarak konu anlatılarak tümevarım yaklaşımı izlenecek olan çalışmada istatistiksel işlemlerden yararlanılarak hazırlanan soru formu SPSS programı aracılığıyla analiz edilerek analitik yaklaşım kullanılmıştır. Çalışma, Filistin İslami bankalarında finansal teknolojinin kullanılmasının olumlu bir rolü olduğu, finansal teknolojinin Filistin İslami bankalarında Şeriat denetiminin etkinliğini artırmada olumlu bir rolü olduğu ve finansal teknolojinin Filistin İslami bankalarında Şeriat denetiminin etkinliğini artırdığı sonucuna varmıştır. Filistin İslami bankaları Çalışma, şeriat denetiminde finansal teknolojinin kullanımı konusunda şeriat ve şeriat denetim kuruluşlarındaki çalışanların eğitilmesini ve banka işlemlerinin şeriat boyutunda denetlenmesine yönelik yeni mekanizmaların geliştirilmesini tavsiye etti."
