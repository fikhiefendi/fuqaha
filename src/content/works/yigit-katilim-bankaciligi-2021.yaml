abstract: "Bu çalışmanın amacı katılım bankası ve ticari banka reklamlarında kullanılan mesajlara yönelik; ilgilenim, biliş ihtiyacı ve manevi değerlere hassasiyet düzeyleri açısından tüketicilerin satın alma niyetleri ve tutumlarında farklılık olup olmadığının ortaya çıkarılmasıdır. Bu bağlamda araştırmanın ana kütlesini bir banka hesabına sahip, üniversite öğrencisi veya mezunu, 18 yaş üzeri bireyler oluşturmaktadır. Araştırmanın örneklemi belirlenirken kolayda örneklem yöntemi kullanılmıştır. Araştırma tanımsal bir araştırma olup, veri toplama tekniği olarak anket yöntemi tercih edilmiştir. Veriler analiz edilirken ilk olarak faktör analizi yapılarak boyutların aynı faktör altında toplandığı gözlemlenmiş, daha sonra hipotezlerin test edilmesi amacıyla veri seti t-testi analizine tabi tutulmuştur. Bu çalışmanın sonucunda, katılım bankası ve ticari banka reklamlarına yönelik satın alma niyeti ve tutumun, ilgilenim ve manevi hassasiyet düzeyi açısından farklılaştığı görülmektedir."
