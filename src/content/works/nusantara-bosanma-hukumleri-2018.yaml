abstract: "Osmanlı İmparatorluğu, 1917'de Hukuk-i Aile Kararnamesi'nin yürürlüğe girmesiyle birlikte ilk İslam aile hukukunu yasallaştıran ülke olmuştur. Daha sonra İslami Aile Hukuku'nun yenilenmesi, 1991'de Kompilasi Hukum İslam'ını uygulamaya koyan Endonezya gibi müslüman ülkelerde gerçekleştirildi. Bu iki devletin İslami Aile Hukuku'nda en çok dikkat edilen ve en çok etkiye sahip olan hüküm boşanma hükmüdür. Elbette, her iki ülkedeki Boşanma Hükümlerinin dayanmasında farklı esaslara ve geçmişlere sahiptir. Bu çalışma, Osmanlı Hukuk-ı Aile Kararnamesi (HAK) ve Endonezya İslami Aile Hukuku'nda“Kompilasi Hukum İslam”(KHI) boşanma hükümlerini karşılaştırmayı amaçlamaktadır."
