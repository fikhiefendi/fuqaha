abstract: "Bu araştırmada Şeyh Ahmed b el-Masrî'nin -Sefatî isimli eserinin tahkik ve analizi yapılmıştır. Eser, Şâfiî fıkhına dair son dönem fetva kitaplarındandır. Fıkhın birçok konusuyla ilgili fetva bulunan eserde Müslümanın hayatı boyunca karşılaşacağı sorunların şer'î hükümleri bir araya getirilmiştir. Müellif Şâfiî fıkhına dair kendisinden önce yazılan eserlere dayanmıştır. Araştırmada Mısır el-Mektebetü'l-Ezheriyye kütüphanesinde bulunan tek mahtut nüsha esas alınmıştır. Müellifin şahsi ve ilmi hayatı yazılırken betimleyici tarihsel metot kullanılmıştır. Eserin yazılmasında ise tahkik ve talik yöntemi takip edilmiştir. Müellifin görüşlerinin diğer fakihlerin görüşleriyle kıyaslanması, Şâfiî mezhebine uyan ve uymayan görüşlerinin ortaya koyulmasında karşılaştırma yöntemi tercih edilmiştir. Araştırmada birçok ilmi sonuca ulaşılmıştır. Bunlardan önemlileri şunlardır: Yazar, kendi devrinde yeni ortaya çıkan bazı meselelerle ilgili fetvalar eklemiş, bazı konularla ilgili bilgileri düzeltmiştir. Yazar, karmaşık ve tuhaf konulara cevap vermesiyle temayüz etmiştir. Müellif eserini, konular, bölümler ve Şâfiî fıkıh kitaplarındaki fıkhi meselelere göre tertip etmiştir. Zor fıkhî meselelerin çoğuna değinmiş, kendi görüşünü açıkça ifade etmiştir. Başta Remlî'nin el-Minhâc isimli eseri olmak üzere son dönemde yazılan haşiyelerden Ibâdî, Şebrâmlesî, Bâcûrî ve diğer eserlere atıflar yapmıştır. Bazı fıkhî meseleler hariç Hanefi, Mâlikî ve Hanbelîlerin görüşlerine nadir olarak değinmiştir. Kâyâtî'nin fıkhî meseleler yanında şiirler ve edebiyat konusunda da ilmi ve edebi açıdan mahir bir âlim olduğu görülmüştür."
