abstract: "İslam muhakeme hukukunda hakkın tespitine katkı sağlayacak her türlü ispat vasıtaları önemli ve muteberdir. Dava konusunun ispatı açısından son asradamgasını vuran DNA incelemesi de bu bağlamda, hem medeni hem de ceza hukuku davalarında kendisinden yararlanılabilecek en önemli ispat vasıtalarından biri olarak kabul edilmelidir. İslam hukuku, metodolojik olarakdinamik bir yapıya sahip olmasıda bunu gerektirmektedir. Biz tezimizde bu dinamizmin yansımasına dair bir örnek sunmuş olacağız. DNA incelemesinin ispat vasıtası olarak kabul edilmesinin özünde, bunun, ittifakla ispat vasıtası olarak kabul edilen kuvvetli karîneye (kat'i karine) benzemesi vardır. Hatta DNA incelemesi sonuçları, karine örnekleriyle mukayese edildiğinde, DNA incelemesi daha kabul edilebilir ve kesin olması hasebiyle karîne karine örnekleri içerisinde en kuvvetli karîneye, belkide müstakil bir ispat vasıtası olarak kabul edilmesinin, daha uygun olacağı bile söylenebilir. Şu da varki, İslam hukukunda sanık lehine olmak üzere; öngörülen cezanın uygulanmasını öteleyici ya da engelleyici etkenler (şüphe unsuru, kanuni delil sistemi, delilde taabbudilik vs.) olduğundan dolayı, karîne-i kâtia, dolayısıyla DNA incelemesi, İslam hukukçularınca muteber birer ispat vasıtası olarak görülmesine karşın, muhakeme usulü hukukunda, özellikle de ceza muhakemesinde, aynı derecede itibar görmemektedir. Bu etkenler dikkate alındığında, karîne-i kâtiave DNA incelemesi, bazı dava konularında tam etkili iken, bazılarında nakıs bir etkiye sahip olmakta, ya dahiç etkili olamamaktadır. Dolayısıyla DNA incelemesi güçlü bir ispat vasıtası olmasına rağmen, yargıç tarafından dava konusunun türüne göre değerlendirmeye tâbi tutulacağından, delilin zatındaki katiyyet, aynı derecede sonuca etki etmemektedir. Bundan dolayı DNA incelemesinin ispata olan etkisini değerlendirirken, taalluk ettiği dava konularını kısımlandırarak, her türe olan etkisi ve düzeyini ayrı ayrı ele aldık, dava türüne göre farklı sonuçların olduğunu ortaya koymaya çalıştık."
