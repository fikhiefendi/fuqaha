abstract: "Tarımsal emtia ticareti küresel ekonomi içinde kritik bir öneme sahiptir. Bu ticaretin ekonomik büyüme ve toplumsal refah üzerinde doğrudan etkileri mevcuttur. Küresel düzeydeki emtia ticaretinin önemli bir kısmını ise buğday oluşturmaktadır. Bu bakımdan buğday piyasaları hem üretici ülkeler hem de tüketici pazarlar açısından stratejik öneme sahiptir. Buğday piyasalarının yapısı ve işleyişi yalnızca arz talep dengelerinden değil makroekonomik dinamiklerden de etkilenmektedir. Bu tez çalışması, makroekonomik değişkenlerin Türkiye buğday piyasasına dinamik etkisini araştırmayı amaçlamaktadır. İlk olarak, buğday piyasalarının tarihsel gelişimi, ticaret borsalarının işleyişi ve piyasadaki rolü genel hatları ile ele alınmıştır. Ayrıca, lisanslı depoculuk sistemi ve ürün ihtisas borsacılığı üzerinde durularak Türkiye Ürün İhtisas Borsası'nın (TÜRİB) buğday piyasasındaki işlevi üzerinde durulmuştur. Tezin uygulama kısmında, spot piyasada işlem gören buğday fiyatı ile makroekonomik değişkenler arasındaki dinamik ilişki ARDL (Autoregressive Distributed Lag- Otoregresif Dağıtılmış Gecikme) modeli kullanılarak analiz edilmiştir. Spot piyasa buğday fiyatı olarak Konya Ticaret Borsası (KTB) elektronik satış salonunda işlem gören kırmızı sert ekmeklik buğday fiyatları baz alınmıştır. Bunun yanında, organize bir piyasa olan TÜRİB'de işlem görerek Elektronik Ürün Senedine (ELÜS) dönüştürülen kırmızı sert ekmeklik buğday fiyatları kullanılarak sağlamlık analizi yapılmıştır. Buğday fiyatları ile bir dönem önceki değerleri arasında pozitif ve istatistiksel olarak anlamlı bir ilişki bulunmuştur. Analiz sonuçları, makroekonomik değişkenler ile buğday fiyatı arasında uzun dönemli bir ilişkiyi göstermektedir. Buğday fiyatı ile döviz kuru ve petrol fiyatı arasında pozitif ve istatistiksel olarak anlamlı bir ilişki vardır. Ayrıca, Ukrayna'nın jeopolitik riskinin Türkiye'deki buğday fiyatları üzerinde pozitif ve istatistiksel olarak anlamlı kısa dönemli bir etkisinin olduğu ortaya koyulmuştur. Bu çalışmanın, ilgili alandaki araştırmacılara, tarımsal emtia piyasasının paydaşlarına ve politika yapıcılara faydalı olması beklenmektedir."
