abstract: "Husün-kubuh meselesi, aklın teklîfteki rolünü belirleme çabasından ibârettir. Bu çalışmanın en önde gelen amacı, husün-kubuh meselesinin, Fıkıh Usûlü'nün bir problemi olduğunu ispatlamaktır.Giriş Bölümü'nde, araştırmanın amacı, konusu, önemi ve orjinalliği ile kullanılan kaynak ve yöntemler hakkında bilgi verilmiştir. Birinci bölümde, Gazzâlî'ye kadar uzanan dönemden seçilen Fıkıh Usûlü eserlerinde husün-kubuh meselesine yer verilip verilmediği incelenmiştir. Bunlar arasında sistematik üslûbu ve diğer pek çok özelliği ile öne çıkan iki önemli eser (Basrî'nin el-Mu?temed'i ve Gazzâlî'nin el-Mustasfâ'sı) seçilmiş; Fıkıh Usûlü'nde husün-kubuh meselesinin hangi konularla doğrudan veya dolaylı irtibatı bulunduğu, örneklenmek istenmiştir. İkinci Bölüm'de el-Mu?temed'in; Üçüncü Bölüm'de el-Mustasfâ'nın husün-kubuh meselesiyle ilgili konuları ele alınmıştır. Dördüncü Bölüm'de ilk üç bölümden elde edilen veriler ışığında, Basrî ve Gazzâlî'nin görüşleri karşılaştırılarak yorumlanmıştır.Araştırmanın Sonuç kısmında ise husün-kubuh meselesinin Fıkıh Usûlü'nün bir konusu olduğu; Basrî ve Gazzâlî örneğinde görüldüğü üzere, bir fakihin husün-kubuh görüşlerinin, onun bütün bir Fıkha bakış açısını ve hatta eserinin tertibini etkilediği; meselenin kuru bir teorik tartışmadan ibâret olmayıp usûlden furû?a uzanan pek çok alana tesirde bulunduğu neticesine ulaşıldığı ifâde edilmiştir.Anahtar Kelimeler: Husün, kubuh, hüküm, hâkim, teklîf, akıl, fiil, hikmet."
titleTranslation: {"en": "Al-Husn-al-kubh in Islamic legal theory: In the light of the comparison of al-Mu'tamad and al-Mustasfâ"}
