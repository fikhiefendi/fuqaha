abstract: "İsmâil Hakkı Bursevî XVII. yüzyılın ikinci yarısıyla XVIII. yüzyılın ilk çeyreğinde yaşamış, özellikle Ruhûl-Beyân adlı tefsiriyle şöhret bulmuş bir mutasavvıftır. Ancak Bursevî kendisini tasavvuf ile sınırlamamış, hemen hemen İslâmî ilimlerin her birine dâir bir ya da birkaç eser kaleme almış çok yönlü bir ilim adamıdır. Onun ilgilendiği alanlardan birisi de Arap Dilidir. Nitekim bu alanda kaleme aldığı Furû adıyla bilinen eseri yazıldığı andan itibaren büyük ilgiye mazhar olmuş matbaanın Osmanlı Devletinde kullanılmaya başlanmasından sonra müteaddid baskıları yapılmış ve XIX. yüzyılın son çeyreğinde yayın hayatına başlayan Mekteb ve Hazine-i Fünûn adlı dergilerde parça parça tercümeleri yayımlanmıştır. Elinizdeki çalışma Bursevînin bu mühim eserinin Arap Dili açısından incelenmesi ve zaman içerisinde eserde meydana gelen değişikliklerin, istinsah hatalarının ve yanlışların bertaraf edilerek eserin müellifin kaleme aldığı nüshaya en yakın şekliyle ortaya çıkarılmasından ibârettir. Çalışma dört bölüm halinde kaleme alınmış, ilk bölüm müellifin hayatı ve şahsiyetine, ikinci bölüm Furû? adlı eserin özellikleri ve kaynaklarına, üçüncü bölüm eserin nüshaları ve tahkikiyle ilgili teknik bilgilere ayrılmıştır. Tamamı Arapça olan son bölümde ise eser nüsha farklarıyla aynı metin içerisinde aktarılmış, dipnotlarda eserde geçen özel isimler tanıtılmış, alıntıların kaynakları gösterilmiş ve çalışmanın sonuna eklenen fihristlerle eserden istifâde kolaylaştırılmaya çalışılmıştır."
