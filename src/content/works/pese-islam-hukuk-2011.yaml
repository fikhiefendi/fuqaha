abstract: "Bu araştırmada fıkıh usûlünün en temel konuları arasında yer alan lafzî yoruma başvurulduğunda karşılaşılan bazı temel problemler ve bu konudaki tartışmalar incelenmektedir. Öncelikle lafız, anlam, hüküm ve bu kavramlar arasındaki delâlet ilişkisinin ne olduğu ve usulcülerin bu konuda geliştirdikleri kavramların analizi hedeflenmektedir. Çalışmanın ana konusu, usulcülerin çoğunluğunun bu delâlet türleri ile elde edilen anlamları sınıflandırırken kullandıkları mantûk ve mefhûm kavramlarıdır.Bir lafzın doğrudan veya dolaylı olarak delâlet ettiği anlamlar sözde belirtilmiş olabileceği gibi sözde belirtilmemiş de olabilmektedir. Bunlardan ilkine mantûk, ikincisine ise mefhûm denmektedir. Bu iki kavram, bir delâlet çeşidi olarak değil, lafzın delâlet ettiği şeyin/medlûlün bir çeşidi olarak görülmelidir.Delâlet çeşitlerini sınıflandırırken esas alınan kriterler açısından, İslam hukukçuları arasında bir görüş birliği yoktur. Hanefîler, lafızdan elde edilen anlamları, konuşanın onu söylemekteki amacı ve kasdını göz önünde bulundurarak tasnife tabi tutarken, İslam hukukçularının çoğunluğu, önce anlamın sözde belirtilip belirtilmediğini daha sonra lafzın, anlamla olan ilişkisini (mutâbakat, tazammun veya iltizâm) esas almışlardır. Bu anlamlardan hangisinin mantûk ve hangisinin mefhûm olduğu konusunda da usulcüler arasında görüş ayrılıkları bulunmaktadır. Bunun yanı sıra, Hanefîler ve mütekellimîn ekolü arasında mahiyetleri bakımından ortak olduğu zannedilen işâretin delâleti ve iktizânın delâleti gibi türlerin, birbiriyle tamamen örtüşmediği görülmektedir.Lafızların genellik niteliğinin tespit edilmesi aşamasında, nasların birbiriyle çelişmesi ve bunun sonucu olarak tahsîs veya nesh edilmesi gibi usûl problemlerinin çözümünde, mantûk-mefhûm ayrımından istifade edilmektedir. Bu konulardaki tartışmalarda söz konusu ayrımın önemi ortaya çıkmaktadır."
