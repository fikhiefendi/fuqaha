abstract: "Bu çalışma, Hanbelî fakihi ve usûlcüsü Ebû Ya'lâ el-Ferrâ'nın (ö. 458/1066) el-Udde fî usûli'l-fıkh adlı eseri çerçevesinde icmâ kavramına yaklaşımını ele almakta ve sistematik biçimde incelemektedir. İslam hukuk düşüncesinde önemli bir teşriî delil olan icmâın tanımı, mahiyeti, bağlayıcılığı ve diğer delillerle ilişkisi tarih boyunca farklı görüşlere konu olmuştur. Bu çalışmada, Ebû Ya'lâ'nın ilgili meseleye dair özgün yaklaşımları incelenmek suretiyle, hem Hanbelî mezhebinin usûl anlayışı kapsamlı bir biçimde ele alınmakta hem de dönemin usûl tartışmalarına sunduğu katkı ortaya konulmaktadır. Çalışma iki ana bölümden oluşmaktadır. İlk bölümde, Ebû Ya'lâ'nın hayatı, ilmî şahsiyeti, yetiştiği çevre, hocaları, talebeleri ve eserleri tanıtılarak icmâ konusundaki düşüncelerinin arka planı sunulmuştur. İkinci bölümde ise icmâ kavramı çok yönlü olarak ele alınmış; tanımı, tarihi gelişimi, oluşum şartları, çeşitleri, delil değeri ve nesh edilip edilemeyeceği gibi temel meseleler detaylı biçimde incelenmiştir. Farklı mezheplere mensup âlimlerin görüşleri ile Ebû Ya'lâ'nın görüşleri mukayeseli olarak değerlendirilmiş; özellikle icmâa itiraz eden gruplara yönelik cevapları analiz edilerek Ebû Ya'lâ'nın sistematik tutumu ve özgün katkıları vurgulanmıştır. Bu bağlamda tez, Ebû Ya'lâ el-Ferrâ'nın icmâ anlayışını bütüncül biçimde ortaya koyarak, İslam hukuk düşüncesi içerisindeki konumunu ve etkisini görünür kılmayı amaçlamaktadır."
