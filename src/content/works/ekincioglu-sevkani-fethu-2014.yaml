abstract: "Bu tezin amacı, rivayet ve dirayeti birleştirmek iddiasıyla Şevkânî tarafından kaleme alınan Fethü'l-Kadîr isimli tefsirin yazımı esnasında müellifin takip ettiği metodu ortaya koymaktır. Ayrıca Zeydî bir çevrede yetişen, ancak zamanla taklidi terk ederek mutlak müçtehit olduğunu ilan eden Şevkânî'nin hayatı hakkında bilgiler vermektir. Tezde, ilk önce Şevkânî'nin hayatı, ilmi kişiliği ve eserleri ele alınmış, daha sonra tefsir hakkında genel bilgiler verilerek tefsirin kaynakları ayrıntılı olarak ortaya konulmaya çalışılmıştır. Son olarak ise tefsirin rivayet ve dirayet yönü örneklerle izah edilmiştir."
