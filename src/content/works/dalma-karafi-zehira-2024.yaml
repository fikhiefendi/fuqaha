abstract: "Araştırmamızda Mâlikî fakihlerinden Şihâbeddin Karâfi'nin ez-Zehîra isimli eseri esas alınarak ibâdetler konusunda Ebû Hanîfe'ye nispet edilen görüşler tespit edilmiştir. Bu görüşlerin, Hanefî kaynaklarında nasıl ele alınmış olduğu araştırılarak mukayesesi yapılmıştır. Nitekim nispet edilen görüşün Ebû Hanîfe'ye ait olduğu teyit edilmiş veya söz konusu görüş doğrulanamamıştır. Ayrıca tespit edilen görüşlerin delilleri, çoğu zaman her iki mezhebin kaynakları gözetilerek lafız ve mana açısından değerlendirilmesi yapılmıştır. Malikî hukukçusu olmasına rağmen Karâfi'nin, Ebû Hanîfe'ye nispet ettiği teyemmüm, tesvib gibi birçok meseledeki birden fazla görüşü, Hanefî mezhebi içerisinden bir fakih gibi detaylı olarak ortaya koyduğu görülmüştür. Özellikle, Ebû Hanîfe'nin hadisleri delil olarak kullanmasını gerek senet ve metin bakımından gerekse diğer sıhhat ölçüleri açısından değerlendirmiştir. Bu bağlamda Ebû Hanife'nin ve Hanefilerin âhâd haberle hüküm verme hususundaki tutumları tartışılmıştır. Nitekim benzer örneklerle hem Karâfî'nin mezhepler arası ilmi yetkinliği hem de başta Ebû Hanîfe olmak üzere Hanefîlere karşı tutumu ortaya konulmuştur."
