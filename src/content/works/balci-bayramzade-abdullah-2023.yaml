abstract: "Din Yolunda adlı eser 1908 yılında Bulgaristan'ın Varna şehrinde Hristiyan olduğu anlaşılan bir müellif tarafından kaleme alınan ve Muhammed ile Mesih Arasında Hadsiz Farklar başlığıyla neşredilen, İslamiyet aleyhine önü sürülen birtakım eleştirilerin yer aldığı esere reddiye olarak Abdullah Edib tarafından kaleme alınmıştır. A. Edib eserinde öne sürülen eleştirilerin tutarsızlıktan ibaret olduğunu ortaya koyarak İslam dinini müdafaaya çalışmıştır. Bu çalışma da Din yolunda adlı eser esas alınarak hazırlanmıştır. Çalışma bir giriş ve iki bölümden oluşturulmuştur. Giriş bölümünde çalışmanın konusu, amacı ve genel özellikleri hakkında bilgi verilmiştir. Birinci bölümde A. Edib'in hayatı ve eserleri hakkında bilgi verilmiş, Din Yolunda adlı eserin fıkıh tarihindeki yeri, eserde ortaya konulan ve fıkha konu olan cihad, nikah, yalanın haram olması ile hükümlerin zamana yayılması konuları tetkik edilmiş, A.Edib'in bu konularda ortaya koyduğu şer'i ahkamın hikmetleri ele alınmış, hükümlerin hikmetleri tetkik edilmiştir. Bununla birlikte bahsedilen konularda Rahmetullah Hindî'nin İzhâru'l-Hak adlı eserinde ortaya koyduğu görüşlere de kısaca yer verilmiş ve iki eser mukayese edilmiştir. İkinci ve son bölümde ise Osmanlıca matbu olan eserin latinizesine yer verilmiştir."
