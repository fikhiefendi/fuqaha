abstract: "\"İslâm Ticâret Hukukuna Göre Cehâlet ve Güncel Akidlere Etkisi\" isimli tezimiz, bir giriş ve iki bölümden oluşmaktadır. Girişte tezin konusu ve kapsamı, önemi, amacı, yöntemi ve araştırmada takip edilecek metod ve tez konusuyla ilgili yapılan çalışmaların üzerinde durulmuştur. Birinci bölümde cehâletin tanımı ve cehâlet kavramıyla ilişkili olan garar, gabin, galat, kumar ve ibhâm kavramları ele alınarak cehâletle olan ilişkileri açıklanmıştır. Sünnet'te bilinmezlikle ilgili vârid olan hadisler ve buna dayalı fıkhî yorumlar ele alınmış, cehâletin kısımları olan az, orta ve aşırı cehâlet açıklanarak akde etkileri beyan edilmiştir. Mevzu' itibarıyla cehâletin kısımları da ele alınmış cehâletin zarar verdiği ve vermediği akidler de zikredilmiştir. İkinci bölümde ise güncel ticarî akidler, cehâlet vasfı açısından değerlendirilerek cehâletin güncel akidlere uygulanması ele alınmış, günümüzde herkesin karşılaştığı bazı örnek akidler seçilmiş ve bu örnekler cehâlet vasfı açısından yorumlanarak fıkhî hükümleri beyan edilmiştir Anahtar Sözcükler: Akid, cehâlet, garar, güncel."
