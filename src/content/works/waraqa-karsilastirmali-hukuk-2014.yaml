abstract: "Karşılaştırmalı Hukuk Ve Irak Anayasalarında Seyahat Özgürlüğü konulu yüksek lisans tez çalışması, üç bölümden oluşmaktadır.Birinci bölümde, hakkın, özgürlüğün ve seyahat özgürlüğünün hukuki ve şeri tanıtımlarını ele almıştır. Ayrıca seyahat özgürlüğünün anayasal fıkıh ve yargısal görüşü açısına göre hukuki niteliğini de ortaya koymaya çalışılmıştır. En kapsamlı olan İkinci bölümde, 1876-2005 arasındaki Irak anayasalarına göre seyahat özgürlüğünün tarihi gelişimi incelenmiştir; bu özgürlüğün sınırlanması rejimlerinin tarih içindeki değişimleri ele almıştır. Ayrıca Irak kanunlarına göre seyahat özgürlüğünün kapsamını incelemiştir; özellikle Iraklı vatandaşların ve yabancıların yurda giriş ve yurt dışına çıkışlarda, seyahat özgürlüğüne yaklaşımı ne şekilde etkilediğine yer verilmiştir.Son bölümde, seyahat özgürlüğünün sınırlanma rejimleri ayrıntıları incelenmiştir; Anayasa ve kanunlardan kaynaklanan sınırlamaların, seyahat özgürlüğünün kullanılabilirliği üzerindeki etkileri ele alınırken, çeşitli kanunlardan kaynaklanan sınırlamalardan ayrı ayrı ortaya konmaya çalışılmıştır. Bununla birlikte birçok devlet anayasalarında, uluslararası ve bölgesel sözleşmelerde ve yargı alanında yer alan seyahat özgürlüğüne ilişkin teminatlara bu bölümde yer verilimiştir."
