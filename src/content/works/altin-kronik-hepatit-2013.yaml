abstract: "Öz Amaç: Bu çalışmada, kronik hepatit C tedavisinde kullanılan pegile interferon alfa 2a/2b ve ribavirinin insulin direnci ve metabolik faktörler üzerine etkileri incelenmiştir. Materyal ve Metotlar: Çalışmaya yaşları 20 ile 75 arasında değişen, 0 ve 48. haftalara ait insulin değerleri ile birlikte 0, 12, 24, 48 ve 72. haftalardaki HCV-RNA değerleri mevcut olan toplam 104 kronik hepatit C hastası dahil edilmiştir. Tüm klinik parametreler tedavi yanıtına göre değerlendirilmiştir. Bulgular: Kalıcı virolojik yanıt (KVY) 104 hastanın 55'inde elde edilebilmiştir. KVY elde edilen ve edilemeyen gruplar arasında GGT, HCV-RNA düzeyi, fibrozis evresi ve 48. haftadaki insulin düzeyi, insulin direnci ve HOMA skoru arasında istatistiksel olarak anlamlı ilişki tespit edilmiştir. Sonuç: İnsulin direncinin KVY üzerinde negatif etkisi olduğu kabul edilmektedir. SVR elde edildiğinde ise insulin direnci düzelebilmektedir. İnsülin direncinin 48. haftadaki varlığı, KVY ile ilişkili bulunmuştur. Bu bağlamda; 48. haftada mevcut olan insulin direncinin, 72. haftadaki KVY konusunda öngördürücü olacağı söylenebilir."
