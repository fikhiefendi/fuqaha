abstract: "Toplumun İhtiyacından doğmuş bulunan, hukuk normları, toplum düzeninin sağlanması açısından uyulması gereken kurallardır. Bu kurallar ihlal edildiği takdirde ise toplum düzeni bozulmaya başlar ve adalet ortadan kalkar. Bu hukuk kuralları bazen insanlar tarafından ihlal edilebilmektedir. Bu duruma müsade edilmesi ise mümkün değildir. Suçlulara uygulanan cezalar, zorla da olsa hukuk kurallarına uyulmasını temin eder. Cezalandırmanın adaletten soyutlanması mümkün değildir. Suçlu cezalandırılırken, işlediği suç ile kendisine verilen ceza arasında denge sağlanmalıdır. Aksi taktirde, adaletin sağlanması ve toplum düşeninin temini için bir vasıta olan cezanın bizzat kendisi zulüm kaynağı olur. Cezalar, insanlara zulüm ve işkence olsun diye değil, belirli amaçların gerçekleştirilmesi için uygulanır. Farklı gayeler, cezaların farklı çeşitlerde ve anlayışlarda uygulanmasına yol açmaktadır. Cezalar, kendilerinden beklenen gayelere göre çok hafif müeyyidelerden ölüm cezasına kadar değişiklik göstermektedir. Bu gayeler ise ilk insan topluluklarından itibaren sürekli değişikliğe uğramış ve medeniyetin ilerlemesine paralel olarak olgunlaşmıştır. Cezalardan beklenen gayeler, topluma yönelik ve şahıslara yönelik gayeler olarak farklılık arzetmektedir. Şahıslara yönelik gayelerde suçlunun şahsı gözönüne alınır ve suçlunun durumuna uygun olan bir ceza belirlenir. Topluma yönelik gayelerde ise, suçlunun şahsından daha ziyade devlet ve toplum düzeninin korunması ön plandadır. Toplum düzenini tehdit edeni suçların cezalarında yumuşaklık gösterilmeyip, bu cezalar muhakkak uygulanmalıdır. İslam ceza hukuku'nun öngördüğü hadd cezalarında, kişinin şahsından daha ziyade toplum düzeninin korunması ön plandadır. Bu cezalar herkese ve aynı oranda uygulanır. Hakimin bu cezaları değiştirerek uygulama yetkisi yoktur. Tazir cezalarında ise, suçlunun şahsı ön plandadır. Bu cezalar suçlunun şahsına göre ayarlanır ve gereken miktardan fazla ceza verme yoluna gidilmez. Tazir cezalarının miktarları belli olmayıp, hakim suçlunun durumuna göre bu miktarı belirler. 106"
