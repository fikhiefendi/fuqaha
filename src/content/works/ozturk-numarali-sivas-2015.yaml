abstract: "Osmanlı Devleti, İslam hukukunu uygulamış; buna sadık kalacak şekilde hukuk kuralları ve şer'i mahkemeler teşkil etmiştir. Bu mahkemeler Osmanlı adlî ve idarî işlerinin yürütüldüğü, beledî işlerin yerine getirildiği, merkezden gelen emirlerin ulaştığı ve uygulandığı kanallar olmuştur. Söz konusu araştırmamız olan, 1238 H/ 1823 M yılını kapsayan 13 No'lu Sivas Şer'iyye Sicili de bu mahkemelerden ortaya çıkmış kayıtların tutulduğu defterdir. İncelenen kayıtlarda Sivas ve kazalarının sosyo-iktisadî ve idarî yapısını gösteren unsurlar mevcuttur. Bu sicilde tereke kayıtları, vakfiye, hüccet, buyuruldu, ferman, borç, salyane, tayin, zina suçlaması, izinsiz enfiye üretimi ev satışı, katil vb. kavramlara dair konular ve hükümler işlenmiştir. Bu bilgiler ışığında Sivas şehri ile ilgili tarihî araştırmalarda şehrin idarî, iktisadî, sosyal alanlara dair pek çok konuya ulaşabilmek mümkündür. Sivas'ın mühimbir merkez şehri olmasından dolayı, bu çalışma bizim konuya daha ehemmiyetle yaklaşmamızı sağlamıştır. Yapılan çalışmada amacımız Sivas Şer'iyye Sicillerini inceleyerek bizden sonraki çalışmalara bir örnek teşkil edebilmektir."
