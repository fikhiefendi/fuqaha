abstract: "Araştırma, Anadolu'daki (Anadolu ülkelerindeki) Osmanlı devleti döneminde kurulmuş olan sağlık bağış kurumlarını,türlerini, kuruluş tarihlerini, dikkate alınan hususları (tarafları), bu kurumların sağlık sektörü üzerindeki etkisi ve farklı yönlerini incelemeyi amaçlıyor. Araştırma hedeflerine ulaşmak ve bilgi toplamak için enduktif yöntemi, kronolojik olarak düzenlemek için ise tarihsel yöntemi kullanıldı. Sağlık sektöründeki etkileri belirlemek için tanımlayıcı analitik yaklaşım (yöntem) benimsenmiştir. Araştırma, bu kurumların, toplum halk sağlığı ve toplumun çeşitli kesimlerine ücretsiz tıbbi hizmet ile ilgili olanlarda dahil olmak üzere birçok olumlu etkisinin olduğunu ortaya çıkarmıştır. Bunlardan bazıları, meslek uygulamasını düzenleyen ve tıp meslekleri ve sendikaları için birçok fonksiyonel sistemlerin kurallarının oluşturulmasında açık bir etkisi olduğu gibi çeşitli tıp bilimlerinin ortaya çıkışı ve çeşitli bölümlerinin oluşturulması ile ilgilidir."
