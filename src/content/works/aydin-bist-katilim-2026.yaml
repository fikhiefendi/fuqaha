title: "BİST Katılım Endeksi'nin Finansal ve Reel Ekonomik Faktörlere Duyarlılığı: Yapısal Kırılmalı Eşbütünleşme ve Nedensellik Analizi"
titleTranslation: {"en": "The sensitivity of the BIST Participation Index to financial and real economic factors: A structural break cointegration and causality analysis"}
