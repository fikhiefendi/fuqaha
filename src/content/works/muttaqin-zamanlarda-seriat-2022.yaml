abstract: "Bu çalışma, Endonezya'daki ikili düzenleyici çerçeve yaklaşımları altında finansal konularda sürdürülebilirlik hesaplarına olan talebi genişletmeyi amaçlamaktadır. Zorlu ekonomik ve finansal hareketler, politika yapıcıların tanınmasına düzenli olarak zarar verdiğinden, çalışmanın amaçlanan hedefleri, sürdürülebilir finansın öngörülebilir geleceğini kapsayacak şekilde yaklaşan çerçeve önerilerini dahil etmektir. Bu çalışma, sürdürülebilir finans ve onun Şeriat ilkeleri açısından eleştirel düşünmeyi sağlayarak nitel yöntemi uygulamaktadır. Ana eleştirel incelemeler, Emerald, SSRN veritabanları ve Web of Science'daki diğer indeksli-Scopus gibi saygın açık erişim dergilerinden makaleler, evraklar ve önceki ilgili çalışmalardan elde edilir. Çalışma, Endonezya'daki sürdürülebilir finansın görünüşte yavaş hareket eden ancak durdurulamaz bir tren olarak nitelendirildiğini, çünkü Endonezya'nın finansal risklere karşı Dünya'nın sınırlarının aşılmasını önlemeyi amaçladığını ortaya koyuyor. Zamanlar arası seçim, yatırım kararlarında gezegen sınırlarının geçişi ve uyarlanması için ne kadar güvenilir olduğunu açıklar. Buradaki zorluk, çevresel, sosyal ve yönetişim yaklaşımı aracılığıyla İslami finans ilkelerini somutlaştıran uzun vadeli tahminler ve senaryolar oluşturmak için Şeriat ve ana akım finansal yönler arasında varsayılan boşluğu kapatmaktır."
