abstract: "İslam iktisat düşüncesinin şekillenmesinde önemli bir rol oynayan zekât, ekonomik kalkınma açısından da önemli bir kurumdur. Günümüzde ana akım iktisat anlayışının ve yerleşik kurumların, ekonomik geri kalmışlık ve yoksulluk gibi üstesinden gelmekte yeterince başarılı olamadığı kabul edilen birçok sosyoekonomik problemin çözümünde zekât kurumu çeşitli katkılar sunabilecek bir potansiyele sahiptir. Klasik fıkıh kaynaklarında zekât müessesesi daha çok mikro planda zekât verecek ve alacak kişiler bağlamında ele alınmış olsa da bu çalışmada zekât kurumu hem mikro hem de makro boyutta ele alınarak ekonomik gelişime etkisi üzerinde durulmaktadır. Zekât kurumu, yüzde 2.5'lik bir kısmı zenginlerden alırken, aynı zamanda yüzde 97.5'lik kısmın atıl kalmayıp yatırıma ve toplumsal menfaate kanalize edilmesinde önemli bir rol oynayabilmektedir. Aynı zamanda zekât kurumu, işlevselliğine bağlı olarak atıl olan sermayenin yatırıma yönelmesini temin ederek makro düzeyde ekonomik kalkınmaya olumlu etki edecektir."
