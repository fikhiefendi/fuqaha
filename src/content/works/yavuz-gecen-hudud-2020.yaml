abstract: "“Kur'an'da Geçen ”Hudûd“ Kelimesinin ve Eş Anlamlı Kelimelerin Lügat Yönünden İncelenmesi”isimli bu tezimiz“Hudûd”lafzını merkeze alarak, müfredatı (kelimeleri) ayrıntılı olarak icelemenin önemini ortaya koymayı, bu sâyede bir belâgat mûcizesi olan Kur'an-ı Kerîm'in doğru anlaşılmasını amaç edinmiştir. Bu amacı gerçekleştirebilmek için Kur'an-ı Kerîm'de 14 yerde Lafza-i Celâl'e izâfetle bulunan“Hudûd”lafzını, etimolojik ve semantik tahlîl yöntemleri ile ele aldık. Üç bölümden oluşan bu çalışmanın birinci bölümünde“hudûd”lafzı, türevleri, yakın ve uzak anlamlı olan kelimelerin tahlîli; ikinci bölümde hudûd kelimesinin sarf ve iştikâkı; üçüncü bölümde ise Kur'an'da geçen âyetler incelenerek araştırmanın kapsamı sınırlı tutulmuştur. Çalışmanın sonucunda arapça bir lafız; lügat, sarf, iştikâk, nahiv ve belâgat yönleri ile tahlîl ve tetkîk edilip, mânâ derinliklerine nüfûz edilmiş, Kur'an'ın en doğru şekilde anlaşılmasına katkı sağlanmıştır. Binaenaleyh bu lugavî incelemenin netîcesi ile“hudûd”kelimesi anlaşıldığında; âile, toplum, çevre ve hukuk ihlâlleri, islamofobi, radikalleşme, sapkınlık, bölünme gibi durumlar ortadan kalkmış, İslâmın fıtrata uygun bir din, Kur'an'ın İlâhî bir Kelâm, İslâm Hukûkunun sağlam bir hukuk sistemi olduğu daha iyi kavranmış olacaktır."
