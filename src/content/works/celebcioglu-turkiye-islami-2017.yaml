abstract: "Yürütülen çalışma, son zamanlarda sayıları hızla artmakta olan Katılım Bankalarında kullanılmakta olan İslami Finans yöntemleri olmaktadır. Bilindiği gibi Kâr/Zarar ortaklığına dayalı İslami Finans kurumlarında, ortaklık esası söz konusudur. Bu ortaklıkta risk taraflara dağıtılmakta, riskin yaratacağı tehlike kısmen azaltılmaktadır. Ortaklık şeklinde gelirin dağılımında, isminden de anlaşılacağı üzere riskin paylaşımı, eşit gelir dağılımı yani bir adalet yapısı hakimdir. Bu kurumlarda; menfaat yerine fedakarlık, yıpratıcı rekabet yerine işbirliği esasları geçerlidir. Hal böyle olunca faizin hüküm sürdüğü kapitalist piyasa koşulları içerisinde faaliyet sürdürmeye çalışan İslami Finans kurumları; bu olumsuzlukları kökten bitirmek maksadıyla sürekli kendini yenilemenin yanısıra, çıkış noktası İslam dini olması sebebiyle her açıdan sektörde örnek teşkil edecek davranış ve tutumlar içerisinde bulunmak durumunda kalacaktır. Sağladıkları“üretim-yatırım-istihdam-fayda-denge”unsurlarıyla İslami Finans kuruluşları; toplumda zenginleşme, yardımlaşma ve kardeşlik duygularını pekiştirerek, her geçen gün insanların güven ve huzur içersinde yaşamasına imkan veren kurumlar olmaktadırlar. Tüm bu hususlar birlikte değerlendirilerek hazırlanan çalışmanın temel hareket noktası; İslami Finans yöntemlerinin şayet usulüne uygun şekilde uygulanırsa faizden kaçmaya altarnatif bir yol olduğu, ancak usulüne uygun ve kurallarına riayet edilmeden yapıldığında üstü örtülü bir faiz hükmüne büründürüleceği için durumun büyük sakıncalar doğuracağı, bu sakıncaların da doğrudan İslam dini ile ilişkilendirileceği hususu olmaktadır. Çalışmada bilhassa“İslami Finans Yöntemleri”ayrıntılı ve tarafımca hazırlanan“tablo-grafik-çizim ve karşılaştırmalarla”daha anlaşılır olması hedeflenmiştir. Bunu sağlamak için, tez genelinde yöntemler tek tek ele alınarak ilgili yöntemlerin“özellikleri-işleyişi-üstün yönleri-zayıf yönleri-benzer yöntemlerle mukayesesi”hususlarına ayrıntılı değinilmiş olup, özellikle son bölümde belirtilen yöntemlerin kendi aralarında mukayesesi tarafımca hazırlanılan karşılaştırmalı tablolar yardımıyla, daha net ve anlaşılır hale getirilmeye çalışılmıştır."
