abstract: "Bu tez giriş, iki bölüm ve sonuçtan oluşmaktadır.Tezin birinci bölümünde şahitlik kavramı ve şahitliğin unsurları, şahitlik ehliyetinde aranan şartlar, şahitliğin davaya uygun olması, şahitlerin ifadelerinde tutarsızlık ve şahitlik üzerine şahitlik konularını inceledik.İkinci bölümde ise yalancı şahitlik kavramı ve yalancı şahitliğin hukukî sonuçlarını detaylı bir şekilde ele aldık.Sonuç bölümünde ise adalet mekanizmasının düzgün çalışması için İslam muhakeme hukukunda şahitliğe önem verildiği, yalancı şahitlik ve yalancı şahitliğin neticesinde ortaya çıkan zararın nasıl telafi edileceği ile ilgili detaylara inildiği ifade edilmiştir."
