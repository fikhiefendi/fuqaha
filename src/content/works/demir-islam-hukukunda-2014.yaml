abstract: "Taklid ve telfik, İslam Hukukunun önemli konularındandır. Özellikle taklid konusu neredeyse insanların tümü, hayatlarının her aşamasında kendisine başvurdukları bir konu olmuştur. Taklid ve telfik konuları taklid ve telfik kavramlarıyla mezheplerin tamamen teşekkül ettikten sonra Usûl kitalarda kendisinden bahsedilmiştir. Ancak her ne kadar İslam'ın ilk dönemlerinde taklid ve telfik kavramları bilinmese de aslında insanlar, İslam'ın ilk döneminden itibaren ibadet hayatlarında bu kavramlara bazen bilinçli bazen de bilinçsizce başvurmuşlardır. 4. Asırdan itibaren İçtihadın, yerini neredeyse tamamen taklide bırakmasıyla beraber insanlar, artık ibadet hayatlarında bütünüyle taklide bazen de telfike yöneldiler. Ve bu hal günümüzde hala devam etmektedir. Anahtar Sözcükler Taklid, Telfik, İslam Hukuku, Mezhepler"
