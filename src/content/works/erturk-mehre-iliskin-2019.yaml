abstract: "Bu tezde mehre ilişkin anlaşmaların Türk hukukundaki niteliği incelenmiştir. İlk bölümde mehir kurumunun İslam hukukunda düzenlenişi ele alınmıştır. Bu kapsamda mehrin amacı, konusu, miktarı, türleri, kesinleşmesi; değişmesi ve ortadan kalkması incelenmiştir. Ayrıca mehre benzer kurumlar ele alınmıştır. İkinci bölümde mehrin İslam hukukundaki niteliği ve mehre ilişkin anlaşmaların İngiltere ve Alman mahkemelerinde çözümlenmesi üzerinde durulmuştur. Son bölümde ise mehre ilişkin anlaşmaların Türk hukukundaki niteliği doktrindeki görüşler kapsamında ele alınmıştır. Bu kısımda inceleme, aile hukuku ve borçlar hukuk kurumları bakımından ayrı ayrı yapılmıştır. Sonuç olarak Türk hukukunda mehre ilişkin anlaşmaların hukuki niteliğinin kanaatimizce ne olduğu belirtilmiştir."
