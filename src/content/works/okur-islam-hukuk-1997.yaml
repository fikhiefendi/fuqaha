abstract: "ÖZET Okur, Kaşif Hamdi, İslam Hukuk Metodolojisinde Münasebet Kavramı, Danışman Prof. Dr. İbrahim Çalışkan, A.Ü. İlahiyat Fakültesi, 1997, 1-V, 1 18 s. Giriş bölümünde tezin sunulması ve kaynaklan hakkında bilgi verdikten sonra rey ve içtihad kavramlarının doğuşuna ve gelişmesine temas ettik. Birinci bölümde münasebet kavramıyla bağlantılı olarak, kıyas ve illet kavramlarının mahiyetini inceledik. Münasebet Kavramının illet için taşıdığı önemi vurgulamaya çalıştık. İkinci bölümde münasebet kavramının ve münasib vasfın mahiyeti üzerinde durduk. Münasebet Kavramının illetin belirlenmesi için güvenilir bir metod olmasının arka planındaki düşünceyi irdelemeye çalıştık. İslam hukukçulanmn münasib vasıf çerçevesinde geliştirdikleri tasnifleri inceleyerek bu kavrama bakış açılarım somutlaştırmaya gayret ettik. Üçüncü bölümde mürsel maslahat kavramım ve bu kavramın nasslarla olan ilişkisini inceledik. Tezimiz genel bir değerlendirme ve önerilerle son bulmaktadır. KM! Sİ İEffiEt"
