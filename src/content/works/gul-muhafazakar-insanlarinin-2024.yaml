abstract: "Zekât İslam'ın yerine getirilmesini emrettiği ibadetlerden birisidir. Farziyeti Kur'an ve sünnetle sabittir. Nisap miktarı mala sahip olan her Mü'minin yerine getirmesi gereken zorunlu bir görevdir. Zekâtı diğer ibadetlerden ayıran en önemli husus mali yönünün olmasıdır. Ekonomiye yön vermesidir. Zekâtın en önemli amacı zengin ile yoksul arasındaki dengenin kurulması, gelir dağılımında adaletin sağlanmasıdır. Ancak nisap miktarına ulaşan malların zekâtı verileceği zaman nasslarda kesin olarak belirtilmemiş malların zekâta tabii olup olmayacağı klasik fıkıhçılar arasında tartışma konusu olmuştur. Özellikle modernleşen dünyamız ile birlikte tedvin döneminde olmayan birçok yeni iş kolları ve sektörü hayatımıza girmiştir. Bu da zekât hesaplanması noktasında birtakım sıkıntıları beraberinde getirmiştir. Bu bağlamda çalışmanın amacı, son derece önemli olan zekât ibadetinin dindar ve aynı zamanda muhafazakâr olan iş insanlarının zekâta olan bakış açılarının ayrıntılı olarak incelenmesi ve araştırılmasıdır. Zekât ibadetinin yerine getirilmesi esnasında yaşanılan problemlerin, kişilerin zekât ibadeti hakkında bilgileri, algıları ve zekâta karşı uyumlarının incelenmesi hedeflenmiştir. Zekât ibadetinin eksiksiz ve doğru bir şekilde yerine getirilmesinin istenmesi, öneminin yeterince kavranıp farkındalığın oluşturulmasının istenmiş olması bu çalışmanın ortaya çıkmasına sebebiyet vermiştir. Çalışmamızın konusu muhafazakâr iş insanlarının zekât algılarının ölçülmesidir. Yapmış oldukları ticari faaliyet sonucunda kazançlarının belli bir miktarını zekât olarak veren iş insanlarının zekât hakkında bilgileri, farkındalıkları, zekât ibadetine karşı düşüncülerinin ölçülmesi ve yaşanılan problemler karşısında takındıkları tavırların neler olduğunun tespit edilmesidir. Bunun haricinde vatandaşlık görevi olarak devlete vergi de ödemektedirler Araştırmada nitel araştırma yöntemi benimsenmiştir. Araştırma deseni olarak ise olgubilimi yöntem deseni tercih edilmiştir. Veri toplama aracı olarak görüşme (mülakat) ve doküman incelemesinden yararlanılmıştır. Araştırmanın çalışma grubunu ticaret ile uğraşan ve zekât veren muhafazakâr iş insanları olan 12 kişi oluşturmuştur."
