abstract: "Klasik Türk edebiyatında şiir, mûsikî ile daima iç içe olmuş, şairler mûsikî terminolojisini şiirsel ifadenin bir parçası haline getirmiştir. Bu etkileşimin en dikkat çekici örneklerinden biri, en yüksek dinî otorite olan şeyhülislâmlık makamındaki divan sahibi âlimlerin eserlerinde görülür. Şeyhülislâmlık makamının Osmanlı Devleti'ndeki gelişimine bakıldığında, ulema ailelerinin süreklilik arz eden bir yapı oluşturduğu gözlemlenmektedir. Aile içinde kuşaklar boyu aktarılan ilmî miras, aynı aileye mensup birden fazla kişinin ilmiye sınıfında önemli vazifeler almalarının temel etkenlerden biri olmuştur. Bu aileler arasında Hoca-zâdeler yedi şeyhülislâm ile ilk sırada yer alırken, Dürrî-zâdeler altı, Ebûishak-zâdeler ise beş şeyhülislâm ile üçüncü sırada bulunmaktadır. Bu çalışma, Osmanlı ilmiye sınıfının köklü ailelerinden biri olan Ebûishâk-zâdeler'den şeyhülislâmlık vazifesini îfâ eden ve divan sahibi şairlerin divanlarındaki mûsikî unsurlarını incelemektedir. Mûsikînin dinî hükmü etrafındaki tartışmalar devam ederken, fetva makamının zirvesindeki bu şahsiyetlerin divanlarında mûsikîye sanatkârane bir üslupla yer vermeleri, Osmanlı'da ilim ve sanatın nasıl bütünleştiğini göstermesi bakımından önemli bir araştırma konusudur. Çalışmanın kapsamı, Ebûishâk-zâde ailesinden Şeyhülislâm İshâk Efendi, Şeyhülislâm Mehmed Es'ad Efendi, Şeyhülislâm Mehmed Şerîf Efendi, Fıtnat Zübeyde Hanım ve Şeyhülislâm Mehmed Ataullâh Efendi'nin divanları ile sınırlıdır. Bu şairlerin, özellikle de Atrabü'l-Âsâr gibi müstakil bir mûsikîşinaslar tezkiresi kaleme almış olan Es'ad Efendi'nin varlığı, ailenin mûsikî ile olan derin bağını ortaya koymaktadır. Bu divanlar metin tarama yöntemiyle incelenmiş; tespit edilen enstrümanlar, makamlar, usûller ve terimler, Klasik Türk mûsikîsi nazariyatı kaynakları ışığında tanımlanmış ve beyitler içindeki kullanımları edebî sanatlar ve anlam katmanlarıyla birlikte tahlil edilmiştir. Araştırma neticesinde, bu âlim şairlerin mûsikîyi sadece bir şiirsel araç olarak değil, aynı zamanda ruhun manevî hallerini, ilâhi aşka duyulan hasreti ve kâinattaki tevhîdî nizamı yansıtan sembolik bir lisan olarak kullandıkları görülmüştür. Enstrümanları insan hallerinin birer yansıması olarak ele almaları, makamları ise nazarî özelliklerini ve tesirlerini dikkate alarak tevriyeli bir şekilde kullanmaları, onların mûsikî ilmine olan vukufiyetlerini göstermektedir. Dolayısıyla bu çalışma, mûsikî unsurlarının, şairlerin dünya görüşü ve manevî tecrübeleriyle bütünleşerek, dinî ve tasavvufî muhtevayı sanatsal bir dille ifade etme vasıtası olarak nasıl işlev gördüğünü ortaya koymayı hedeflemektedir."
