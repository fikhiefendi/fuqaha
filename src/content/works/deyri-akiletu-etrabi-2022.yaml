abstract: "Hamd, yerin ve göklerin rabbi olan Allah'a mahsustur. Salat ve selam yaratılmışların en hayırlısının (s.a.v.) üzerine olsun. Bu araştırma, İmam Şâtıbî'nin (ö. 590/1194) el-'Akîle metni üzerinden Mushaf imlası ilmine râm olmak isteyenlerin yolunu aydınlatan bir yol göstericidir. Bu sebeple okuyucu, Şâtıbî'ye ait manzum bir eser olan el-'Akîletü'l-Etrâbi'l-Kasâid adlı esere ve bu eserdeki metodun nasıl olduğuna; aynı zamanda bu manzum eser hakkında şerh ve araştırma yapanların metotlarına ve bu manzumenin, aslı olan el-Mukni' kitabından üstün ve eksik yönlerine vakıf olacaktır. Yine okuyucu burada âlimlerin İmam Şâtıbî hakkındaki algılarını, onu eleştirme hususundaki farklı yaklaşımlarını, şârihlerin metotlarını, bu metotları takdim şekillerini ve bu şerhlerin kıymetini ve ehemmiyetini öğrenecektir. Bu çalışma bir giriş, üç bölüm ve bir sonuçtan oluşmaktadır. Girişte, konunun öneminden, bu konunun seçilme nedeninden, araştırma planı ve metotlarından bahsedilmiştir. Birinci Bölüm, rasmü'l-mushaf ilmine dair on mukaddime ve bu ilmin kaynakları hakkında hazırlık mahiyetinde bir bölümdür. İkinci Bölümde, İmam Ebû 'Amr ed-Dânî (ö. 444/1053) ve el-Mukni' (ki bu el- 'Akîle kitabının aslı ve kaynağıdır) adlı eseri ve bu eserdeki kaynaklar tanıtılmıştır. Yine bu bölümde İmam Şâtıbî ve el-'Akîle adındaki manzum eseri ve bu eserin önemi zikredilmiş, yazarın bu eserdeki metodu açıklanarak el-'Akîle ile el-Mukni' adlı eserlerin arasındaki münasebet zikredilmiştir. Üçüncü Bölüm ise el-Akîle metninin ders olarak okunması hakkındadır. Bu bağlamda; el-'Akîle metninin güzelliği ve edebiyatı, el-'Akîle'nin el-Mukni' den üstün yanları, eksikleri, üzerine yazılan şerhler ve şarihlerin metotlarından bahsedilecektir. Sonuç ise araştırmanın neticesinde elde edilen sonuçları ve önerileri içermektedir."
