abstract: "Bu çalışmada şâir, nahivci ve arûzcu İbn Mu?rî'nin ??'Unvân el-Şeref el-Vâfî'' adlı eseri incelenmiştir.İbn Mu?rî, eserinin baş tarafında ifâde ettiği gibi muhtasar bir şafi?î fıkıh kitabı olan bu eserde fıkıh ilmi haricinde dört farklı risâleyi tek bir metne dercetmiştir. Eser fıkıh, arûz, târih, nahiv ve ilm-i kâfiyeden müteşekkildir. Eser ufkî (sağdan sola) okunduğunda muhtasar fıkıh kitabıdır. Satır başlarındaki kırmızı renkli harfler amûdî (yukarıdan aşağıya) olarak okunduğunda arûz, ortada ikinci sütundaki harf(ler) baştan aşağıya doğru okunduğunda târih, satırların en sonundaki harf(ler) baştan aşağıya doğru okunduğunda ilm-i kavâfî, tarih ile kâfiye kısmı arasında kalan sütün okunduğu takdirde nahve dâir yazılmış risale ortaya çıkmaktadır.Çalışmamızın giriş kısmında İbn Mukrî dönemi ve öncesindeki siyâsî, içtimâi ve ilmî durum hakkında bilgi verilmiştir. Birinci bölümde İbn Mu?rî'nin hayatı ve eserleriyle birlikte tahsil hayatı ve eser hakkında bilgiler aktarılmıştır. İkinci bölümde arûz risâlesi, müellifin metodu ve bu ilimde bilinmesi gereken kavramlar üzerinde durulmuştur. Üçüncü bölümde nahiv risâlesi ve nahvin doğuşundan müellifin yaşadığı döneme kadarki serüveni ele alınmıştır. Son bölümde ise ilm-i kavâfi risalesi ve bu ilimle alâkalı bilinmesi gerekenler hakkında bilgi verilmiştir."
