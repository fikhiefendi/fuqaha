abstract: "Bu tez, Aden'deki konut krizinin İslami finansman yoluyla nasıl ele alınabileceğini incelemektedir. Nüfus artışı, çatışmalar ve iç göç nedeniyle kötüleşen bu kriz, şehirde gecekondulaşmanın yayılmasına neden olmuştur. Çalışma, İslami finansman mekanizmalarının önemini vurgulamaktadır; bunlar arasında kira yoluyla mülkiyet (İcara Muntahia Bittamleek), inşaat finansmanı (İstisna), azalan ortaklık (Müşareke) ve vakıf gibi yenilikçi ve şeriata uygun finansman çözümleri yer almaktadır. Araştırmanın amacı, bu mekanizmaların konut sorununu çözmedeki etkinliğini değerlendirmek ve toplumsal farkındalık eksikliği, idari yolsuzluk ve hedef gruplar arasındaki satın alma gücü farklılıkları gibi uygulama ile ilgili zorluklara dikkat çekmektir. Ayrıca, diğer ülkelerdeki başarılı deneyimler analiz edilerek Aden'de uygulanabilecek çözümler çıkarılmıştır. Analitik ve karşılaştırmalı bir yaklaşım benimseyen çalışma, İslami finansmanın kentsel ve sosyal kalkınma üzerindeki etkilerini incelemektedir. Bulgular, İslami finansmanın geleneksel finansman sistemlerine sürdürülebilir ve etkili bir alternatif sunduğunu ve düşük ile orta gelir gruplarının konut sahibi olmasını kolaylaştırarak sosyal adaleti sağladığını doğrulamaktadır. Tez, bankaları ve kamu kurumlarını bu mekanizmaları benimsemeye teşvik etmek ve konut projeleri için ek bir finansman kaynağı olarak İslami vakıfları desteklemek için öneriler sunmaktadır. Bu, Aden'de sosyal istikrarı artıracak ve sürdürülebilir kalkınmayı destekleyecektir."
