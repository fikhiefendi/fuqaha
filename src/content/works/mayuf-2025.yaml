abstract: "Şâfiî fıkhının önemli bir yazma eseri olan bu metin, İmâmet ve İktidâ konularını tek bir müellif bünyesinde nadiren görülen bir derinlikle ele almasıyla dikkat çekmektedir. Eser, Şâfiî âlimlerin imamı ve imamın taşıması gereken şartları tanımlama yaklaşımlarını, ayrıca tartışmalı meseleleri tutarlı bir fıkhî bakış açısıyla yorumlama biçimlerini ortaya koyması açısından büyük önem taşımaktadır. Bu araştırma, nadir bulunan bir fıkıh metnini gün yüzüne çıkararak, araştırmacılara ve fıkıh mirasıyla ilgilenenlere mezhepteki imâmet hükümlerinin pratik uygulamalarını anlamalarını sağlayacak belgelenmiş ve sistematik bir sunum sunmaktadır. Araştırmacı, çalışma sürecinde çeşitli zorluklarla karşılaşmıştır. Özellikle yazma nüshalardaki hasarlar veya okunamayan kısımlar nedeniyle metinlerin bazı yerlerini okumakta güçlük çekilmiş ve en doğru metne ulaşmak için nüshalar arasındaki rivayet farklılıklarını karşılaştırma ve doğrulama noktasında kapsamlı bir ilmî çaba sarf edilmesi gerekmiştir. Araştırmacı, bu yazma nüshayı incelerken titiz bir bilimsel metodoloji izlemiştir. İlk olarak, mevcut yazılı nüshaların doğruluğunu ve bütünlüğünü incelemiş, ardından metni bilimsel araştırma ilkelerine göre tashih etmiştir. Müellifin ifadelerini muteber Şâfiî fıkıh kaynaklarında zikredilenlerle karşılaştırmış, hadisleri ve rivayetleri sıhhat açısından değerlendirmiş ve anlaşılması garip ifadeleri açıklamaya özen göstermiştir. Araştırma sonucunda, bu el yazmasının Şafiî fıkhının değerli miras eserlerinden biri olduğu kanısına varılmıştır. Zira eser, imâmet ve iktidâ hükümlerine dair nadir bir derleme sunmakta, aynı zamanda kesin bir bilimsel düzenleme ve açık bir öğretim yöntemi sergilemektedir. Çalışma, bu metnin önde gelen âlimlerin içtihatlarının bir kısmını muhafaza etmedeki değerini ve özellikle namazla ilgili fıkıh dallarının belgelenmesine olan katkısını vurgulamaktadır. Bu durum, el yazmasını fıkıh kütüphanesine önemli bir katkı haline getirerek, öğretim, araştırma ve bilimsel çalışmalar için kullanılabilecek değerli bir kaynak konumuna yükseltmiştir"
