abstract: "Bu çalışma, Türkiye'de katılım sigortacılığı sisteminin geleneksel sigorta sisteminden ayrılan yönlerini, müşterilerine sundukları fırsatları, katılım sigortacılığında müşteri portföyünü zamanla nasıl genişlettiğini ve müşteri sadakatini sağlayan faktörlerin neler olduğunu verilerle ortaya koymayı amaçlamaktadır. Tez çalışması üç bölümden oluşmaktadır. Birinci bölümde katılım sigortasının, tanımı, esasları ve uygulanma aşaması, uygulanan katılım sigorta modellerine yer verilmiştir. İkinci bölümde, katılım sigorta sektöründe müşteri ilişkileri, hizmet kalitesi, müşteri memnuniyeti ve sadakati açıklanarak aralarındaki bağıntıya değinilmiştir. Son bölümde araştırmanın literatürü, genel çerçevesi, araştırma analiz modeli ve yöntemi ayrıntılı olarak açıklanmıştır. Araştırmaların evreni, katılım sigorta şirketlerinden hizmet alan müşterilerden oluşmaktadır. Anket formu bireylerin demografik özelliklerini ölçen 8 soru ve SERVQUAL model anket sorularını ölçen 32 soru içermektedir. Elde edilen veriler ile yapısal eşitlik modellemesi (YEM) yöntemi kullanılarak hizmet kalitesi boyutları olan somutluk, güvenlik, güvenilirlik, empati ve istekliliğin müşteri memnuniyeti üzerinde etkisi ölçülmüş, ayrıca müşteri memnuniyetinin müşteri sadakatini nasıl etkilediği analiz edilmiştir. Yapılan analiz sonuçlarına göre hizmet kalitesinin somutluk ve isteklilik boyutlarının müşteri memnuniyeti üzerinde anlamlı bir etkiye sahip olmadığı bulunmuştur. Hizmet kalitesinin güvenlik, güvenilirlik ve empati boyutlarının müşteri memnuniyeti üzerinde anlamlı ve pozitif bir etkisini olduğu tespit edilmiştir. Katılım sigorta şirketi müşterilerinin memnuniyetinin müşteri sadakati üzerinde güçlü ve anlamlı pozitif etkisi olduğu sonucuna ulaşılmıştır."
