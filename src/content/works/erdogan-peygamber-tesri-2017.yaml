abstract: "Rasûlullâh (s.a.s.)'ın teşrî yetkisi, vahyin nüzulünden itibaren kabul edilen ilâhî bir görevdir. Ayet ve hadisleri merkeze alarak yaptığımız araştırmalarda Kur'an-ı Kerim ve hadislerde bu yetkinin varlığı vurgulanmaktadır. Hz. Peygamber (s.a.s.)'in teşrî yetkisi ve bu yetkinin vahiyle münasebeti vardır. Bu sebeple sünnetin bağlayıcılık sınırı ve bunun tespitindeki usûl kriterleri gibi gibi konulara yer verilmiştir. Rasûlullâh (s.a.s.)'ın bütün söz, fiil ve takrirlerinin teşrî değeri ile ilgili ihtilaflar vardır. Hadis kaynakları tarandığında O (s.a.s.)'na ait söz ve fiillerin teşrî değerine müstakil olarak yer verildiği görülmektedir. Ancak takririnin ise sünnet içindeki yeri ve değeri, O'nun söz ve fiillerinin ayrıntılarına girildiği zaman tespit edilebilmektedir. Bu sebeple takrîrî sünnetin hüküm koymadaki etkisi ve Hz. Peygamber (s.a.s.)'in teşrî yetkisinin sınırını tespitteki rolü müstakil olarak ele alınmıştır. Rasûlullâh (s.a.s.)'ın kavlî ve fiilî sünneti gibi takrîrî sünnetinin de hüccet değeri bulunmaktadır. Bu sonuca götüren en somut delil sahâbenin takrirlerle ihticacta bulunma çabalarıdır. Hemen her konuda takrîrî sünnete dair rivâyetlerin hadis külliyatında özellikle es-Sünen adlı eserlerde yer aldığını söyleyebiliriz. Tespitimize göre takrîrî sünnetler en az itikâdî, en çok da ibadetlerle ilgili meselelerde varid olmuştur. Araştırmada hadis usulü prensipleri dikkate alınarak detaylı sıhhat analizi yapılmış olup bazı teâruz halindeki takriri ve kavlî sünnet rivâyetine yer verilmiştir. İbadetlerle ilgili takrîrî sünnetler fazla olduğu için namazla ilgili ihtilaf halinde bulunan takriri ve kavlî sünnet rivâyeti hakkında araştırma yapılmış ve gerektiğinde takrîrî sünnetin teşrî sınırları belirleme konusunda kavlî sünnetten daha çok tercihe şâyân olduğu görülmüştür."
