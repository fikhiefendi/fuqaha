abstract: "Bu çalışma, siyasi çatışmaların Yemen İslami bankalarında finans kararı üzerindeki yansımaları konusunu ele almakta, Mevcut Durumu olduğu gibi tanımlama ve ekonomik açıdan analiz etmek amacıyla tanımlayıcı analitik yaklaşım benimsenmiştir. Çalışmada ayrıca, Yemen İslami bankalarının finans, sunulan kolaylıklar açısından kredi durumu ve merkez bankasının bölünmesinde etkili olan finans kararını etkileyen faktörler, likidite eksikliği ve dövizdeki dalgalanmalarla alakalı siyasi çatışmaların öncesi ve sonrasını karşılaştırmak için karşılaştırmalı bir yaklaşım kullanılmıştır. Araştırma Neticesinde Elde Edilen En önemli bulgular: Özelde Yemen Merkez Bankası'nın ve genel olarak da Yemen'deki İslami bankaların siyasi ihtilaflardan korunması ve bunlara müdahil edilmemesi, İslami bankaların faaliyet ve çalışmalarının kısıtlanmaması gerekliliğinin yanında Merkez Bankası'nı birleştirme ihtiyacına ve Yemen'deki ablukayı sona erdirme ihtiyacına ek olarak, Yemen Merkez Bankası'nın döviz gelirlerini artırmak için meşru hükümetin petrol ve gaz ihraç etmesine izin verilmesi gerekmektedir."
