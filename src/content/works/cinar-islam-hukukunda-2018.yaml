abstract: "Hac ibadetinin farziyeti kitap, sünnet ve icma ile sabittir. Pratikteki uygulamada, müctehid imâmlarının, yaşadıkları dönemin toplumsal yapısını, toplumun ekonomik imkânlarını, hac menâsikinin icra edileceği bölgenin coğrafi özelliklerini göz önünde bulundurarak hüküm vermiş olmaları en tabii durumdur. Fakat günümüzde teknolojinin gelişmesi, toplumun refah düzeyinin artması, dünyadaki Müslüman nüfusunun müctehid imâmlarının zamanındaki nüfusla kıyaslanamayacak kadar fazla olmasının yanında, hac ibadetinin çok yönlü bir ibadet olması, bir takım zorlukları beraberinde getirmiştir. Hac ibadetini, bir tek mezhebe bağlı kalarak îfa etmeye çalışmak, bu zorluğu dahada pekiştirecektir. Bu durum da, hacla ilgili birçok unsurun yerine getirilememesi sonucunu doğuracaktır. Tezin amacı; Şâri'nin hac ibadeti ile ilgili emrini ve isteğini yerine getirmek için, İslâm hukukunda kolaylaştırma ilkesini, hac ibadetinde ele alarak, günümüz uygulamasına katkı yapmaya çalışmaktır."
