abstract: "Boşanma,İslamda evlilik sorunlarının çözüm yollarından biri olarak kabul edilmiş toplumsal bir durumdur. Bu olağan bakış Kur'an ayetleri ve sahih hadislere bakıldığında görülebilir. İslam açısından boşanma, ailedeki sorunların çözümü açısından ilk ve en kolay yol değil,sorunların büyümemesi için bir çaredir.Bu yüzden boşama/Talak tüm hatları ve hakları ile birlikte Kur'an da açıklanmıştır. Boşanmanın İslam nezdindeki bir türü olan Talakın hükümlerinin inananlar tarafından bilinçsizce tanındığı bir gerçektir.Detaylarına inilerek Kur'an'da açıklanmış olmasına rağmen uygulamada bilgisizlik ve karmaşa oldukça fazladır. Bu İslam'da ki tüm mezhepler için de geçerlidir.Kur'an boşama konusunda açık ve nettir.Boşanmanın topluma ve insanlara verdiği zararların endişeleri yerine uygulanabilirlik ve hakların korunabilirliğini destekleyen Kur'an ayetlerinin bilinilebilirliği artırıldığında, boşanma aile ve toplum için huzur ve düzen sağlayıcı bir rol oynar. Bu çalışmada Kur'an'da ve İslam mezheplerinde Talak konusu tartışılmıştır.Kur'an'daki Talakla ilgili ayetler belirtilmiş,bu konu ayetler ve mezheplerin konuyla ilgili ayetleri yorumu açısından da değerlendirilmiştir. Anahtar Kelimesi : Aile, Talak, İslam, Mezhepler, Kuran"
