abstract: "Bu çalışmada, son yıllarda Ortadoğu merkezli uyguladıkları şiddet eylemleriyle dünya gündemine oturan günümüzdeki Selefî Hâricî akımın tarihî seyrini, düşünce dünyasını ve şiddet anlayışlarını dayandırdıkları dinî referanslarını tahlil ettik. Çalışmamızın birinci bölümünde, İslam'ın şiddete bakışını ve İslam'da ilk şiddet hareketi olan Hâricîleri inceledik. İnceleme sonucu, İslam'da merhamet, müsamaha ve barışın asıl olduğu, şiddetin savaş gibi zarurî durumlarda istisnaî olarak kullanıldığı ve kadim Hâricîlerle günümüzdeki Selefî Hâricî akımın temel şiddet anlayışında birbirine benzedikleri sonucuna vardık. İkinci bölümde, akımın tarihî sürecini ve şiddet anlayışının seyrini inceledik. Akım, şiddet anlayışı bakımından üç merhale geçirdiğini gördük. Birinci merhale, şiddet anlayışının ilk oluştuğu ve müessis eserlerin yazıldığı Mısır dönemidir. Bu dönem 1960'lı yılların ortalarından, 1980'li yılların ikinci yarısına kadar devam etmiştir. İkinci merhale, akımın şiddet anlayışının Arap Yarımadası kökenli zâhirî ve lafızcı anlayışla mezcedilerek daha şedit hale geldiği ve uluslararası boyut kazandığı dönemdir. Bu dönem, 1980'li yılların ortalarından, 2000'li yıllara kadar Afganistan merkezli devam etmiştir. Üçüncü merhale, din ve cihat adına İslam'ı kendileri gibi yorumlamayan Müslümanlara dahi şiddet uyguladıkları ve Hâricîlik vasfıyla anıldıkları Irak ve Suriye dönemidir. Bu dönem, akımın 2003 yılında Irak'ta toplanmasıyla başlamış olup, son meşhur liderleri Ebu Bekir el-Bağdâdî'nin 2019'da öldürülmesiyle son bulmuştur. Üçüncü bölümde, akımın düşünce dünyasını, zihniyetlerini oluşturan fıkhî ve fikrî arka planı, şiddet adına savundukları fikirlerde Ehl-i Sünnet'in temel ilkelerine vi riayet ettikleri ve Müslümanların maslahatı için cihat ettikleri iddialarını ele aldık. Yaptığımız araştırma sonucu, şiddet fıkhının oluşmasında ilmî ve fikrî zafiyetin yanı sıra, tecrübe eksikliğinin etkili olduğu, son geldikleri nokta itibariyle kendilerini desteklemeyen Müslümanlar dâhil bütün insanları ötekileştiren ve din adına öldürmeyi kutsal sayan bir düşünceye sahip oldukları anlaşılmış oldu. Aynı zamanda şiddet düşüncesinin açıkça tezahür ettiği tekfir, hâkimiyet, velâ-berâ ve cihat konularında Ehl-i Sünnet âlimlerin ortaya koydukları ilmî kurallara riayet etmedikleri ve cihat adına gerçekleştirdikleri eylemlerden en çok Müslümanların ve İslam Dünyası'nın zarar gördüğü gerçeğiyle karşılaştık. Anahtar kelimerler: Selefîlik, Hâricîlik, Aşırılık, Şiddet, Cihat, Teoloji"
