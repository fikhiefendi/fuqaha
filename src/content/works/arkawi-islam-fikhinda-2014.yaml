abstract: "İnsanın Tasarrufu asıl olan özgürlüktür, Satış kontratı ancak tarafların kabulü ile imzalanır, Fiyatların yükselmesi arz ve talep yasasına göre, Ticari Malların azalması talebin yükselmesinin, kendiliğinden fiyatın yükselmesine neden olur. bu durumlarda yönetici müdahale etmez, ancak satıcılar haklarını kötüye kullandıkları tekdirde, kendi aralarında fiyatları yükseltmek için Hileli Bir İşbirliği yaparlar ise. Buda ticari malların fiyatları doğal olmayan yapay bir şekelde yükselmesine neden olur, bu durumda yöneticinin müdahalesi söz konusu olur. Fiyatlarda denge oluşturur, burada artan yapay fiyatları düşürerek doğal fiyatına dönüşüne kader , veya bununda adına semen-i misl'dir denir. Yöneticinin Ticari Malların fiyatlandırmasına müdahalesi fakihler arasında tartışma konusudur bu konu ele alındığında Karşılaştırmalı Fıkhi yöntemi uygulayarak açık ve özet bir çözüm göstermek için bir araya gelinir buda fakihlerin İslam ekonomisi konularında en belirgin rollerini gösterir."
