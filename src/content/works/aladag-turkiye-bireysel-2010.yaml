abstract: "Ekonomik gelişmeler sonucunda ortaya çıkan hukuki düzenlemeler, küreselleşme ve artan rekabet ortamı her alanda olduğu gibi bankacılık sektöründe de modern pazarlama anlayışının yer bulmasına neden olmuştur. Bireysel Bankacılık ise bankaların diğer faaliyetleri içerisinde ayrı bir önem kazanmıştır.Katılım bankaları, mali sektörde bir yenilik olarak, faiz endişesi nedeniyle klasik bankalara gitmeyen fonları ekonomiye kazandırmak ve tasarruf sahiplerinin fonlarını güvenle saklamalarına ve değerlendirmelerine yardımcı olmak amacıyla kurulmuştur.Katılım bankaları bireysel bankacılıkta henüz tam olarak kendilerini gösterememiş ve mevduat toplamadan öteye geçememişlerdir, Bireysel bankacılıktaki bu zafiyetleri sonucu yakın gelecekte bütün ödeme kanallarında saf dışı kalmalarına ve kurumsal müşterileri bile kaybetmelerine neden olabilir.Bu çalışmada bankacılığın geçmişten günümüze gelişimi ele alınmış, Türk bankalarının gelişimi üzerinde durulmuş ve Bireysel Bankacılık ürünleri tanıtılıp, Katılım Bankalarındaki bireysel bankacılığın yeri ve önemi üzerine inceleme yapılmıştır. Çalışma sonucunda elde edilen bulgularla, Katılım bankalarının, iç ve dış müşteri memnuniyetinde; kendi karlılık ve büyüme hedeflerini gerçekleştirmede, bireysel bankacılığın öneminin vurgulanması amaçlanmıştır."
