abstract: "Çalışmanın problemi, Libya'daki İslami sigorta şirketlerinin yatırım faaliyetlerini yönetme çalışmalarının performansındaki ortaya çıkmaktadır. Bu nedenle bu çalışma, İslami sigorta şirketlerindeki yatırımların Şeriat uyumluluğuna yönelik etkin kontrollerin ne ölçüde bulunduğunu değerlendirmeyi amaçlamaktadır. Yatırım işletmelerini yönetirken stratejik yönetime yönelimi değerlendirmenin yanı sıra bu şirketlerin yatırım faaliyetlerine yönelik aktif teknik yönetimin varlığını da değerlendirmektedir. Bu hedeflere ulaşmak için çalışma, teorik çerçevenin tümevarım ve tümdengelim yaklaşımını izlemiştir. Ayrıca hipotezleri test etmek ve sonuçlarını analiz etmek için tanımlayıcı analitik yöntemi kullanılmıştır. Çalışmada bir dizi sonuç ortaya çıktı; bunlardan en önemlileri: Libya'daki İslami sigorta şirketlerinde yatırım faaliyetlerine ilişkin Şeriat uyumluluğuna yönelik kontrolleri olmasını ancak dokümantasyon ve uygulama taahhüdü açısından etkililik düzeyi tam değildir. Bu şirketlerde yatırım faaliyetinin yönetilmesinde de zayıf bir stratejik yönelim vardır. Performansta ise üstünlüğe ulaşmak zordur. Ayrıca incelemeye konu olan şirketlerdeki yatırımların aktif teknik operasyonları zayıf bir performansla yönetilmektedir. Bununla beraber hedeflere ulaşmak zor olur. Çalışma, İslami sigorta şirketlerinin yönetimine, tüm çalışmalarında tamamen stratejik yönetime yönelmelerini tavsiye etti. Ayrıca yatırımlarda uygulanabilecek tüm prosedürleri içeren aktif bir teknik yönetim yönteminin benimsenmesi."
