abstract: "Çalışmamız temel besin maddelerinden süt ve peyniri helâl gıda bağlamında ele almaktadır. Tez giriş ve iki bölümden oluşmaktadır. İlk bölümde helâl gıda literatürünün temel kavramlarından olan necaset, istihlâk ve istihâle terimleri farklı İslâmHukuku ekolleri bakımından ele alınmış, birbirleriyle olan ilişkileri fıkhi tartışmalar çerçevesinde ortaya konulmuştur. İkinci bölümde sütün ve peynirin mahiyeti ile oluşum süreci incelenmiş, bu aşamalarda İslâmHukuku bakımından sorunlu olarak görülebilecek noktalara işaret edilmiştir. Bu noktalara klasik İslâm fıkhında getirilen çözümlemeler ve verilen hükümler belirlenmeye çalışılmıştır. Ardından farklı yaklaşım ve tartışmalar dikkate alınarak karşılaşılan sorunlara günümüzde getirilen çözümler irdelenmiştir. Ulaşılan kanaat ve değerlendirmeler sonuç bölümünde paylaşılmıştır."
