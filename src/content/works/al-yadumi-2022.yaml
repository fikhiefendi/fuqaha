abstract: "Türkiye'de son yıllarda tekafül sigortasına ilgi artmıştır. Türk devleti, Türkiye'deki sigorta sektörüne katkıda bulunan bir tür sigorta modeli olarak Tekafül endüstrisini teşvik etmek için büyük çaba sarf etmektedir. Türkiye sigorta piyasasını yakından takip edenler, sigorta sektörünün son yıllardaki hızlı büyümesine dikkat çekmektedir. Türkiye'deki Arap Müslüman topluluklarının sayısındaki artışı ve onların din kültürlerinin doğasını, Türkiye'de ikamet işlemlerini tamamlamak için bazı sigorta türlerine katılımlarının zorunlu olmasını, araştırmacı bu çalışmayı yapmaya ihtiyaç duymuştur. Nitekim, bu çalışma aynı zamanda Türkiye'deki Arap Müslüman toplumunun Tekafül sigorta bilinci gerçeğine de ışık tutacaktır. Ayrıca, araştırmacı araştırmanın sonuçlarına ulaşmak için analitik yöntemin yanı sıra nicel ve nitel yöntemleri birleştiren uygulamalı betimsel yöntemi uygulamıştır. Bu tez, teorik çerçevesinde sigorta kavramı, türleri ve ürünleri ile tekafül sigortacılığı kavramı, çalışma modelleri ve büyümesinin önündeki engellerin belirlenmesini içermektedir. Aynı zamada, bu çalışmada sigorta bilinci, önemi ve yayılmasının karşılaştığı zorluklar ele alınmıştır ve Türkiye'deki sigorta piyasasına kısa bir giriş yapılmıştır. Bu tez, pratik bir bakış açısıyla, çalışmanın sonuçlarına ulaşmak için saha araştırması sonuçlarının istatistiksel analizini içermektedir. Araştırmada, Türkiye'deki Arap Müslüman toplumunun sigorta ve önemi konusundaki farkındalığının orta düzeyde, Türkiye'de ise tekafül sigortasına ilişkin farkındalığının düşük düzeyde, Tekafül sigorta şirketi seçme bilincinin orta düzeyde olduğuna dair olmak üzere bir takım sonuçlara ulaşılmıştır. Çalışmanın nihai sonucu olarak, Türkiye'deki Arap Müslüman toplumunun karşılıklı sigorta bilincinin orta düzeyde olduğunu anlaşılmıştır. Bu araştırma, Türkiye'deki Tekafül sigorta şirketlerinin Arapça reklam ve pazarlama materyalleri üretmesini önermiştir. Aynı zamanda, Arap toplumunu pazarlama ve tanıtım kampanyaları için hedef gruplara dahil etmlerini tavsiye etmiştir. Ayrıca, Türkiye'deki Arap toplumunun ihtiyaçlarına ve kültürüne uygun dayanışma ürünleri tasarlamasını önermiştir. Ayrıca, bu tez Türkiye'deki Tekafül şirketlerinin, Tekafül sigorta müşterileriyle doğrudan ilişki kurmak için kanallar ve ofisler açma ihtiyacını da tavsiye etmiştir."
