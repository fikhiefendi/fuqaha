abstract: "\"el-İtticahatu't-Tecdid ve'l Muasara fi Mekasidi'ş Şeria\" başlıklı bu risalemiz içinde bulunduğumuz çağın önemli konularından birine değinmektedir. Çünkü Eski alimler ve muasır ulemanın İslam şeriatınin maksatlarına dair görüş ve ictihadlarına vakıf olmak Şer'i ilimlerin gelişimi ve yenilenmesi açısından önemli yer edinmektedir. Bu risalenin amacı ve önemi; eski ve muasır ulemanın mekasıd'a dair eserlerini ortaya çıkarması, onların düşünce yapısındaki, yenilenme, birikim ve yapıcılık yönlerine vakıf olmayla orantılıdır. Risalenin önemi, ihtiyac duyulan konulardan Şer'i maksatlar ve tüm alanlardaki rolünden kaynaklanmaktadır. Çalışılan konuda araştırmacı endüktif-analitik yöntemi kullanmıştır. Araştırmada, âlimlerin mekasıd düşüncesinin hala canlılık ve hassasiyet taşıdığı ve araştırmacılar tarafından çok eski ve sık kullanılmasına rağmen \"makâsıd\" teriminin, amaçlarından sonra kapsamlı bir tanım üzerinde bugüne kadar yerleşmeyeceği, araştırmacı için önemli sonuçlara ulaşmıştır. tarihsel süreci ve eğilimleri karşılaştırırken, araştırmacı, ortak noktalar ve farklılıklar ve çağdaşların amaçlarına ilişkin görüşlerinde ortak özellikler bulmuştur. Araştırmacı, öncelikle talebelere, şeriatın sırlarını ifşa etmek, hükümlerini mazur göstermek, kökenlerine dayandırmak, kurallarını oluşturmak ve musibetlerin şeriatla daha yakından ilgili olup olmadığını araştırmak için meşru amaçlara yönelik meselenin hâlâ acilen çaba sarf etmesi gerektiğini başta ve sonrasında faydalı olması için talebelere tavsiye eder. Çünkü dinde içtihat, bilgelik bilgisidir. Şeriat ve amaçları ve avantajları ve araştırmacı, bilim merkezlerinin ve ihtisas üniversitelerinin teoriden uygulamaya geçmesini ve çoğu şeyin teoriden uygulamaya geçmesini önerir. kasıtlı bağlamda başarılması, soyutlama ve teorileştirmeye yönelir."
