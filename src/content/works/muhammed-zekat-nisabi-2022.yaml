abstract: "İslam şeriatı (İslamî yasama), kendisine mensup olanlar için özel bir sosyal dayanışma sistemi sunmuştur. Bu sistem, İslam'ın rükünlerinden üçüncüsü olan ve fakir ve muhtaçların haklarını garanti altına alan zekât yasasında görünmektedir. Ayrıca İslam şeriatı, zekat yoluyla o zamanlar yaygın olan toplumsal sınıfı ortadan kaldırmıştır. Zekât yasasının en önemli ayırt edici özelliklerinden biri, zengine servetinden dilediği şekilde, dilediği kimseye dilediğini verme yetkisi vermemesidir. Daha ziyade, zekâtın asıl yerine ulaşması için birtakım özel şartlar şart koşmuştur. Bu çalışmada zekatı hak eden fakirin durum ve şatları ele alınacaktır. Ancak ondan önce genel ve özet bir şekilde zekat ve harcanacak yerler kısa bir girişle ele alınarak çalışmaya başlanacaktır. Bunun ardından fakirlik kavramı, şer'ân kendisinden kastedilen mana ve bu konuda mezhepler arasındaki ihtilaflar ile ilgili çalışma tamamlanmış olacaktır. Bundan sonra fakirlik ve etnoloji ile ilgili bazı yeni sorun ve meseleler işlenecektir."
