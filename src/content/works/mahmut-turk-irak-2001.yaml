abstract: "ÖZET Türk ve Irak özel hukuklarında mukayeseli olarak intifa hakkı konusunu incelediğimiz tezimiz, giriş dışında üç bölümden oluşmaktadır. Giriş bölümünde, intifa hakkının takdimi, terminoloji, benzer kurumlarla mukayesesi, Türk ve Irak hukuklarında düzenleniş biçimi, tarihçesi, Fransız ve Mısır Hukuklarındaki yeri, fayda ve sakıncaları yer almaktadır. Birinci bölümde, intifa hakkının tanımı, hukukî niteliği, tüketilebilen eşya üzerinde intifa hakkı, konusu, tesisi ve sona ermesi açıklanmıştır. İntifa hakkı bir başkasma ait olan ve ekonomik değer arz eden mal ve eşya üzerinde kullanma ve ondan yararlanma yetkisi veren bir haktır. İntifa hakkının hukukî niteliğine gelince, sınırlı ve süreli bir aynî hak olarak, devri mümkün değildir. Aksi kararlaştırılmadıkça, konusu olan şeyi kullanma ve ondan yararlanma hakkı veren bir haktır. Taşınmazlar, taşınırlar, haklar ve malvarlığı, intifa hakkı konusu olarak belirlenmektedir. Bu hak Türk hukukunda, tesisen veya asli yollarla iktisap edilerken, Irak hukukunda sözleşme, vasiyet ve zamanaşımı ile iktisap edilir. İkinci bölümde, intifa hakkının hükümleri yer almaktadır. Burada, iki hukukta intifa hakkı sahibinin ve malikin hak ve borçlan açıklanmaktadır. Üçüncü bölümde intifa hakkının sona erme sebepleri ek alınmıştır. İntifa hakkının terkini, konusunun yok olması, intifa süresinin dolması, sahibinin gerçek kişi ise ölümü, tüzel kişi ise sona ermesi intifa hakkı ile mülkiyet hakkının aynı kişide bulunması, mahkeme karan ve konusunun kamulaştırılması veya sigortası halinde intifa hakkı sona erer."
