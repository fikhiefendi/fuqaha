abstract: "Yüksek Lisans Tezi olarak yapılan bu tezin amacı, 1922/ 108 Numaralı Trabzon Şer'iyye Sicilinin transkripsiyonunun yapılarak bu sicilin tafsilatlı bir değerlendirmesinin sunulmasıdır. Transkripsiyonu yapılan sicil H. 1169-1170/ M. 1756-1757 yıllarına tekabül etmektedir. Sicil transkribe edilirken, kelimelerin tamamına yakını okunmaya ve okuma hataları en aza indirgenmeye çalışılmıştır. Ancak buna rağmen okumakta zorluk çekilen, kişi lakap ve isimleri, özellikle de gayrimüslim isimleri mevcuttur. Ayrıca bugün kullanılmayan yer isimleri de transkripsiyon içerisinde zorlanılan kısımlardandır.“1922/108 Numaralı Trabzon Şer'iyye Sicilinin Transkripsiyonu ve Değerlendirmesi”isimli tez çalışması toplamda üç ana bölümden oluşmaktadır. Birinci bölümden önce tezin girişinde, sicilin kaydedildiği dönem olan XVIII. yüzyılda Osmanlı Devleti ve Trabzon Eyaleti hakkında kısa bilgiler verilmiş ve sicilin transkripsiyonunda kullanılan yöntemlerden bahsedilmiştir. Birinci Bölümde, konunun daha iyi anlaşılması için, Osmanlı Devleti'nde Kadı ve görevleri, Şer'iyye Mahkemesi, Şer'iyye Sicil Defterleri ve içerdiği belge çeşitleri, Şer'iyye Sicilinin tanımı ve önemi, Trabzon Şer'iyye Sicilleri ile ilgili genel bilgiler verilmiştir. Takip eden bölümde, 1922/108 Numaralı Trabzon Şer'iyye Sicilindeki kayıtların konularına göre tasnifi ve bunların açıklaması yapılmıştır. Çalışmanın Üçüncü Bölümünde ise Şer'iyye Sicilinin tam transkripsiyon metni yer almaktadır ve bu bölümü sırasıyla Sonuçlar, Kaynaklar ve Ekler takip etmektedir. Bu tez çalışmasında mikro düzeyde Trabzon'un, makro düzeyde de Osmanlı Devleti'nin ekonomik, sosyal, hukuki, idari ve askeri tarih çalışmalarına katkı sağlamak hedeflenmiştir. Transkripsiyonu yapılan bu sicil tek başına dönemi aydınlatmak için yeterli olmamakla birlikte o dönemin diğer kaynaklarıyla bütüncül bir yaklaşım ile tarih çalışmaları için faydalı olacağı düşünülmektedir."
