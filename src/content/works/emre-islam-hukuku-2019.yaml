abstract: "Ferdi ve içtimai hayatın en asli unsurlarından birisi olan hukukun menşei hakkında farklı nazariyeler geliştirilmiştir. Bunlardan bazıları şu şekildedir. Hukukun menşei güçlü liderlerin veya ruhların iradesidir. Bazen halk ruhudur. Bazen akıl bazen gerçeklik veya ihtiyaçlar, bazen de kutsal irade (vs.)'dir. Kaynakları/delilleri açısından İslam Hukuku'na bakılırsa (Kur'ân, sünnet, icma', kıyas, istihsan, maslahat, içtihat vs.) o, asli olarak ilahi iradeye dayansa da insan iradesine alan açılmıştır. Kaynakların sınırlı olması ve anlaşılmaları hukukun insan aklına bırakılması sonucuna götürmektedir."
