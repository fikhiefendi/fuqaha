abstract: "İnsanın, yaşadığı toplum içerisinde, sahip olduğu hakları, yerine getirmesi gereken sorumlulukları ve kaçınması gereken durumları bilme noktasında kendisine yöneltilen emir ve talepleri doğru bir şekilde anlaması son derece önemlidir. Çünkü bu anlama ameliyesi, kişinin bilinçli bir yaşam sürmesi hususunda geçirmesi gereken sürecin ilk adımını teşkil etmektedir. Bu sürecin doğru bir şekilde yönetilebilmesi için hitap dilinin hususiyetlerine yeterince vâkıf olunması gerekmektedir. Hukuk kurallarının oluşturulması noktasında dilsel öğelerden yapılan çıkarımların rolünün büyüklüğü düşünüldüğünde hitabın doğru anlaşılmasının arz ettiği önem çok daha net bir şekilde kendini göstermektedir.Süreçteki ikinci adım ise uygulama yani îfâ aşamasıdır. Bu noktada kişinin emir formunda kendine yöneltilen hitabın gereğini yerine getirme şekilleri olan îfâ formlarını ve emre konu olan fiillerin bu formlardan hangisi veya hangileri ile uygunluk arz ettiğini bilmesi gerekmektedir. İşte bu çalışmada hem ilgili hitabın nasıl doğru anlaşılacağı hem de anlaşılanın doğru bir şelikde nasıl fiiliyata geçirileceği ortaya konulmaya çalışılmıştır.Çalışma bir giriş, onu takip eden on bölüm ve bir sonuçtan oluşmaktadır. Giriş bölümünde çalışma tanıtılmakta ve çalışmanın önemi îfâde edilmekte, girişi takip eden diğer bölümlerde ise emrin tanımı ve mahiyeti, emir kapsamında değerlendirilebilecek îfâdeler, bu îfâdelerin delâletleri, emrin zaman ile ilişkisi, emredilen, emredilenin îfâ şekilleri ve îfâ hususunda kişide bulunması gereken kudret konuları incelenmiştir."
