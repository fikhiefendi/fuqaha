abstract: "2019 yılının sonunda dünya,“Covid-19”olarak bilinen Korona salgınına maruz kaldı ve bu virüs, tüm tıbbi, sosyal ve ekonomik sektörleri de büyük ölçüde etkiledi. Bu çalışma, Korona salgını krizinin Kuveyt bankacılık sektöründe faaliyet gösteren İslami ve geleneksel bankaların finansal performansının verimliliği üzerindeki etkisini tespit etmek için geldi, Araştırma örnekleminin İslami bankalar (Warba, Ahli United, Kuveyt Uluslararası, Kuveyt Finans Evi, Boubyan) ve ayrıca geleneksel bankalar (Kuveyt Ulusal, Kuveyt Al Ahli, Kuveyt Ticari, Burgan, Alhalij) tarafından temsil edilmesi ve ayrıca hangi bankaların finansman yöntemleri şokları absorbe etme konusunda daha yeteneklidir: İslami veya geleneksel finansman yöntemleri, CAMELS göstergelerine göre, geleneksel bankalardaki DuPont sistemi göstergeleri ve Basel Komitesi standardı, İslami bankalardaki İslami Finansal Hizmetler Komitesi standardına karşılık gelmektedir. Bu çalışmanın bulguları arasında, Korona krizinin (COVID-19) sermaye yeterliliği endeksi ve ekonomik varlık devir hızına göre ve ayrıca Basel Komitesi standardına göre geleneksel bankaların finansal performansı üzerinde açık bir etki yarattığı yer alıyor. Sermaye yeterliliğinin ölçülmesi. Korona krizinin (COVID-19) İslami bankaların finansal performansı üzerindeki etkisi ise varlık kalitesi standardına ve İslami Finansal Hizmetler Komitesi'nin sermaye yeterliliğini ölçme standardına göre ortaya çıktı. Bunun nedeni İslami finansman yöntemlerinin finansal şokları absorbe etme yeteneğidir. Çalışmada İslami ve konvansiyonel bankaların acil krizlere karşı ihtiyati ve önleyici bir politika izleyerek, gelecekte oluşabilecek herhangi bir krize müdahale etmek için acil durum planları geliştirerek önlem almaları öneriliyor."
