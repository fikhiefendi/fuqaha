abstract: "Bu çalışma, hukuk felsefesinde son birkaç asırdır tartışma konusu olan hukuk ve ahlak ilişkisine dair problemlere Şâtıbî'nin (720/1320) görüşlerinden hareketle bir cevap vermeyi amaçlamaktadır. Ayrıca bu tez, hukuk ve ahlakın amaç noktasında birleştiğini ve Şâtıbî'nin bu iki alan arasındaki ilişkiyi anlamlandırma gücünü ortaya koyarak, hukuk felsefesi ve İslam hukuku literatürüne katkı sunmayı hedeflemektedir. Tez, Şâtıbî'nin görüşlerini günümüz hukuk felsefesi bağlamında ele alarak fıkhın bu alandaki tartışmalara nasıl bir perspektif sunduğunu netleştirmeye çalışmaktadır. Çalışmada, öncelikle Şâtıbî'den hareketle hukuk ve ahlak alanlarını birbirinden ayırmanın imkanı sorgulanmaktadır. Yetki bağlamında bir ayrım tespit edilmekle birlikte hukuk ve ahlak alanlarının iç içe olduğu, hukukun amacının ahlaki olduğu Şâtıbî'nin görüşlerinden hareketle ele alınmıştır. Ahlaka aykırı amaçlarla yapılan hukuki tasarrufların nasıl sınırlandırdığı ortaya konarak konunun pratik yönü de vurgulanmıştır. Araştırmanın temel kaynağı olarak Şâtıbî'nin el-Muvâfakât adlı eseri kullanılmıştır."
