abstract: "Bu çalışma, İslâm siyaset düşüncesinin temel kurumlarından biri olan vezirlik müessesesini kavramsal ve tarihsel yönleriyle ele almakta ve bu müessesenin elAhkâmü's-Sultâniyyeliteratüründe nasıl konumlandırıldığını incelemektedir. Araştırmanın odak noktası, bu literatürün iki önemli müellifi olan Ebû'l-Hasen elMâverdî (ö. 450/1058) ve Ebû Ya'lâ el-Ferrâ (ö. 458/1066)'nın vezirlik anlayışlarını mukayeseli bir perspektifle değerlendirmektir. Birinci bölümde, vezirlik kavramının sözlük ve terim anlamları, etimolojik kökenine ilişkin tartışmalar ile Kur'ân ve hadislerdeki kullanımları incelenmiştir. Ardından, İslâm devletlerinde vezirlik müessesesinin Asr-ı Saâdet'ten Osmanlı dönemine kadar geçirdiği kurumsal dönüşüm ortaya konulmuştur. Ayrıca, el-Ahkâmü'sSultâniyye eserlerinin İslâm siyaset teorisi içerisindeki yeri ve bu eserlerde vezirlik kurumunun teorik temelleri değerlendirilmiştir. İkinci bölümde, Mâverdî ve Ebû Ya'lâ el-Ferrâ'nın el-Ahkâmü's-Sultâniyye adlı eserlerinde vezirlik makamına ilişkin görüşleri ayrıntılı olarak ele alınmıştır. Bu bağlamda, tefvîz ve tenfîz vezirliği ayrımı, bu görevlere atanacak kişilerde aranan nitelikler, atama sürecinin hukukî mahiyeti ve vezirliğin yetki sınırları tartışılmıştır. Ayrıca, her iki müellifin vezirlik anlayışları arasındaki benzerlik ve farklılıklar mukayeseli olarak analiz edilmiştir. Çalışmada, klasik kaynaklar ile modern literatür birlikte değerlendirilmiş, belgesel tarama ve karşılaştırmalı analiz yöntemleri kullanılmıştır. Elde edilen bulgular,Mâverdî ve Ebû Ya'lâ'nın vezirlik anlayışlarının temelde ortak bir siyaset teorisi çerçevesinde şekillendiğini, ancak mezhebî ve dönemsel farklılıkların belirli noktalarda farklı yaklaşımlara yol açtığını ortaya koymuştur."
