abstract: "İslam dinine ve bu dinin Peygamberi Hz. Muhammed'e (s.a.v.) inanmış ve iman etmiş olan her bir kişinin bizzat Allah'ın emretmesi hasebiyle yapması gereken farz ibadetler vardır. Bu farz ibadetlerden bazılarını yapmak için belirli bir vaktin girmiş olması gerekmektedir. Ancak gerek dünyamızda gerekse dünyamızın dışında vaktin belirlenmesinin günümüz şartlarında çok güç olduğu yerler bulunmaktadır. Bu çalışmamızda vaktin belirlenemeyeceği yerlerde Allah'ın biz kullarına farz kıldığı ve bir vakte bağlı olan ibadetleri hangi zaman ve durumda yerine getirebileceğimizi, Ramazan ayı orucu gibi vakti Kamerî aylara göre belirlenen ibadetlerin, ayın görünmediği yerlerde nasıl ifâ edileceğini anlatmaya çalıştık. Yaptığımız bu çalışma ülkemizin uzay yolculuğunun yeni yeni başladığı bu dönemlerde uzayda nasıl ibadet edileceği konusunda önem arz etmektedir. Çalışmamız sırasında fıkhın temel kaynakları olan Kur'an ve Sünnet başta olmak üzere temel fıkıh kitapları, temel hadis kitapları ve tefsir kitaplarından yararlanılmıştır."
