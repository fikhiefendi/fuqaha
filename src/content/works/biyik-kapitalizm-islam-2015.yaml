abstract: "Kapitalizm ile İslam arasındaki ilişkinin incelendiği bu çalışmada, serbest piyasa sistemi içinde belirleyici olan bireycilik, özel mülkiyet, serbest ticaret, rekabet, devletin rolü gibi kavramlar açıklanarak inanç sistemlerinin ve özellikle İslam dininin bu kavramlara bakışı üzerine odaklanılmıştır. Kapitalizm ile İslam'ın benzer ve farklı yönlerinin olup olmadığının gösterilmesi amaçlanmıştır. Teorik bir yapıda şekillendirilmiş bu çalışmada inanç sistemleri ile iktisadi sistemler arasındaki ilişki gösterilmek istenmiştir.Bu amaçla Kapitalist sistem ile İslam' ın uyumu değerlendirilmiştir."
