abstract: "This study aims at broadly identifying the Takaful Insurance market in Turkey, and the actual status of low-income families in Turkey. It also aims at finding a correlative relationship between Takaful Insurance and the income of low-income families in Turkey to formulate a proposed model to activate the positive relationship between Takaful Insurance and increasing income of the low-income families in Turkey. The study used the descriptive analytical approach, through induction by studying the subject in details to reach general rules relevant to it, and deduction by examining the study problem to obtain general findings by reviewing a number of important indicators, and then analyzing and interpreting them and linking them to economic theories and previous studies. The study used the SPSS statistical program to process data using statistical methods to examine the validity and reliability of the questionnaire. The researcher used following statistical methods: arithmetic means, standard deviations, relative weight, Pearson correlation coefficient, T test, one way AVONA analysis, and Scheffe test. The researcher also discussed adopting a measure for the role of Takaful Insurance in increasing income of low-income families. The study population consists of the Takaful Insurance companies operating in Turkey and the agents of these companies. The researcher applied the study to a random sample of 130 Takaful Insurance companies and their agents in Istanbul to whom he distributed 130 questionnaires and collected 117 questionnaires by means of 90%. Bu çalışma,Türkiye'deki Tekafül Sigortacılığı piyasasının ve Türkiye'deki düşük gelirli ailelerin gerçek durumunun kapsamlı bir şekilde belirlenmesini amaçlamaktadır. Aynı zamanda, Tekafül Sigortacılığı ve Türkiye'deki düşük gelirli ailelerin gelirlerinin artırılması arasındaki olumlu ilişkiyi harekete geçirmeye yarayacak bir öneri modeli formüle etmek amacıyla, Türkiye'deki düşük gelirli ailelerin gelirleri ile Tekafül Sigortacılığı arasında korelasyonel bir ilişki bulmayı amaçlamaktadır. Bu çalışmada; tümevarım yoluyla, konuyla ilgili genel kurallar elde etmek için konu detaylarıyla irdelenerek; tümdengelim yoluyla, birtakım önemli göstergeler incelenerek genel bulgular elde etmek amacıyla araştırma sorusu irdelenerek betimleyici analitik yaklaşım kullanılmıştır. Sonrasında tüm bunları yorumlama, analiz etme, ekonomik teorilerle ve geçmiş çalışmalarla bağdaştırma yoluna gidilmiştir. Çalışmada, anketin geçerliliğini ve güvenilirliğini sınamak için istatistiksel yöntemler kullanarak verileri işlemek amacıyla SPSS istatistik programı kullanılmıştır. Araştırmacı, aşağıdaki istatistiksel yöntemleri de bu çalışmada kullanmıştır: aritmetik araçlar, standart sapmalar, bağıl ağırlık, Pearson korelasyon katsayısı, T testi, tek yönlü ANOVA analizi ve Scheffe testi. Araştırmacı aynı zamanda, düşük gelirli ailelerin gelirlerini artırmada Tekafül Sigortacılığının rolünü belirlemek için bir ölçüt edinilmesini de tartışmıştır. Çalışmanın kitlesi, Türkiye'de faaliyet gösteren Tekafül Sigortacılığı şirketlerinden ve bu şirketlerin acentelerinden oluşmaktadır. Araştırmacı, İstanbul'daki 130 Tekafül Sigortacılığı şirketinin ve acentelerinin rastgele örneklerine bu çalışmayı uygulamış ve kendilerine 130 anket dağıtmıştır. Bu anketlerin, %90'lık bir orana denk gelen 117'si geri dönmüştür. Çalışmanın en önemli bulguları, düşük gelirli ailelerin gelirlerinin artırılmasında Tekafül Sigortacılığının rolüne yönelik çalışma örneğine verilen yanıtlarda, 'cinsiyet, yaş, eğitim düzeyi, uzmanlık veya çalışma alanı' değişkenlerine atfedilebilecek, istatistiksel olarak anlamlı bir farklılık olmadığını göstermektedir. Bu bulgular ışığında, bu çalışma, Tekafül Sigortacılığı şirketlerinin faaliyetleri ve alanları hakkındaki bilgileri artırır nitelikteki en önemli tavsiyeleri ortaya koymuştur. Ayrıca, Türkiye'deki Tekafül Sigortacılığı işlemleri ve uygulamalarını düzenleyen bir yasa çıkartılmasına, Türkiye'de Tekafül Sigortacılığı şirketleri kurulmasının teşvik edilmesi ile faaliyetlerinin ve etki alanlarının genişletilmesine, finansal olanaklar aracılığıyla işlerini kolaylaştırmanın gerekliliğine de değinilmiştir."
