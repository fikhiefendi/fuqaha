abstract: "İnsanın olduğu yerde aile hayatının varlığından söz etmek gerekir. Aile, iki yabancı insanın meşru ölçü ve prensipleri gözeterek hayatlarını birleştirmeleri ile meydana gelen bir sosyal kurumdur. Her inanç sistemi gibi İslam dini de hayata ait meselelerde kendi has ölçü ve sınırlar vaz eder. Evlilik yoluyla yeni bir aile oluşturmak isteyen Müslüman bireyler, bu ölçü ve sınırların getirdiği bir takım sorumlulukları kabul etmiş sayılır. Allah (c), kâinatı bir düzen ve hiyerarşik bir kurallar manzumesi içinde yaratmıştır. Sünnetullah kâinatın tedvirini sağlayan ilahi yasalar demektir. Dünyayı idare ve imar etme görevini üstlenen insan, bu kurallara uyduğu ve sünnetullahı yani ilahi yasaları hayatında uyguladığı ölçüde sorumluluğunu yerine getirmiş kabul edilir. Kendisi için yaratılmış olan tabiatta mevcut olan düzenin tabi olduğu ilahi yasaları insan kendi hayatında uygulamadığı zaman, yalnız kendisinin değil tabiatın da fıtratını bozmaktadır. Bir yaşama düzeni/dini olarak İslam, eşlerin bir araya gelerek evlenmeleri sonucu aralarında oluşan duygusal bağı ilahi bir nimet; bu düzenin bozulmaması için de evliliği ve aile yuvasını mukaddes ilan etmiştir. Bu birlikteliğe bu kadar önem veren Allah (c), eşlerin ayrılığını sıradan bir durum olarak görmemiştir. İslam, eşlerin arasını bozan ve kadın ile erkeği bir birinden ayıranları“şeytanlar”olarak nitelendirmiştir. Ancak insanın olduğu yerde fikri ayrılıkların, beğeni ve tercihlerde farklılaşmanın olması ve bunların neticesinde ağır tartışmaların vuku bulması kaçınılmazdır. Eşlerin başkalarının etkisi veya zorlaması olmadan, mücbir sebepler dâhilinde meydana gelebilecek ayrılmalara bazı kural ve prensiplere uyulduğu takdirde izin vermiştir. Adına“talak”denilen bu ayrılık meselesine fıkıh disiplininde çok geniş bir yer verilmiştir. İslam hukukunda bu kadar geniş yer verilen talak meselesi, tabii olarak fıkıh mezheplerin farklı anlama ve yorumlama sistemleri ve modernitenin getirdiği farklı yaklaşımlar sebebiyle ihtilaflı bir sosyal mesele olmaya devam etmektedir. Bu çalışmamızda“Talak”meselesini, her hangi bir fıkıh ekolünün kaynakları ve görüşü doğrultusunda değil; fukahânın da kendi görüşlerine mesnet ve kaynak olarak alıp, üzerine reylerini bina ettikleri“Rivayetler”e bağlı kalarak anlatmaya çalıştık."
