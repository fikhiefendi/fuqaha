abstract: "Çalıştığımız dönem H.1314?1318 yıllarına ait Konya Şer`iyye Defteri'dir. Bu çalışma Konya'nın 130 No'lu Şer`iyye Sicili Defteri'nin transkripsiyonu ve değerlendirilmesinden ibarettir.Tanzimat sonrasında, sicillerin konularının daraltılarak sadece belli konulara sıkıştırıldığını görsekte, sicillerin, mahalli tarihimiz için önemi büyüktür. Sicilimiz miras-tereke, evlenme- boşanma, nafaka, vakıf ve tevliyet konularını içermektedir.Çalışmamız; giriş ve 2 bölümden oluşmakta olup, girişte, şer`iyye sicillerinin tanımı ve önemi ile şer`iyye mahkemelerinin geçirdikleri süreç ele alınmıştır. Birinci bölümde, Konya halkının sosyal hayatı, ekonomik faaliyetleri, dini müesseseleri tespit edilerek Konya'nın mahalli tarihi hakkında bilgilere ulaşılmıştır. Konya'da kullanılan isimler, unvanlar, lakaplar, eşyalar ile şehirdeki mahalle, köy, kaza, nahiye isimleri tespit edilmiştir. Bununla birlikte dini, ticari ve sosyal müesseselerin de tespiti yapılmıştır.Ayrıca çalıştığımız dönemde Gayrimüslim halktan olan Ermeni ve Rumlar ile Müslüman halkın, bir arada hoşgörü içerisinde yaşadıkları görülmüştür. Defterimizde Gayrimüslimlerin miras- tereke ile ilgili şer`i mahkemelere başvurmuş oldukları 3 tane dava vardır. Burada Gayrimüslimlerin kendi cemaat mahkemeleri yerine, Müslümanlara ait şer`i mahkemeleri tercih ettiklerini görmekteyiz.Defterimizde kadınların haklarını aramak için rahatça dava açabildiklerini, sosyal hayatın en küçük unsuru olan ailenin içerisindeki önemli yerlerini tespit etme imkânı bulduk. Aile kurumu incelenerek, ailedeki çocuk sayıları, eş sayısı, geçim kaynakları belirlenmiştir. Ailelerin ortalama 2?3 tane çocuk sayısına sahip olduklarını, ayrıca sanılanın aksine Osmanlı toplumunda çok eşliliğin tercih edilmediğini görmekteyiz.İkinci bölümde ise Konya şer`iyye sicillerinden 130 nolu defterin transkripsiyonu yapılmıştır."
