abstract: "Bu çalışmada aynı kökenden gelen Sami Dillerin birbirlerine olan yakınlıklarından hareketle Kur'ân'da geçen köklerin anlamları veya köklerin anlamlarında meydana gelen değişiklikler, diğer kutsal kitaplar ve diğer Sami Dillerden istifade etmek suretiyle tespit edilmeye çalışılmıştır. Bu amaçla kelimelerin kök anlamlarını tahlil edebilmek için Artsüremli Semantik analiz yöntemi kullanılmış, köklerin kök anlamları Tanakh'ta, İbranice sözlüklerde, İncillerde, Yunanca ve Aramice (Süryanice) sözlüklerde incelenmiş, son olarak Kur'ân-ı Kerîmde, Arapça sözlüklerde, tefsirlerde ve meallerde karşılaştırmalı olarak incelenmiştir. Netice itibariyle“Z/K/W”(Z/K/Y) kökünün kök anlamının,“ağaç ve sarmaşıkları (gelişmiş yararsız sürgünlerden) budamak”anlamında olduğu gibi“bir şeyi gereksiz ve kötü şeylerden temizlemek, arındırmak”yani“temizlemek, arındırmak, temizlik ve temiz”gibi anlamların olduğu ve kökün bu anlamı eski zamanlardan beri muhafaza ettiği sonucuna ulaşılmıştır. Ayrıca kök anlamın korunmasının yanı sıra,“Z/K/W”(Z/K/Y) kökünün özellikle Kur'ân'ın nâzil olması ile birlikte“artmak, çoğalmak, büyümek, gelişmek, zekât”gibi yeni anlamlar kazanarak anlam genişlemesi gösterdiği tespit edilmiştir.“S/D/K”kökünün ise kök anlamının“doğruyu konuşmak, doğru olmak, doğruluk, dürüstlük, doğru”gibi anlamlar olduğu, kökün asırlardır bu anlamları muhafaza ettiği görülmüştür.“S/D/K”kökünün Kur'ân'ın nuzülü ile birlikte“mehir ve zekât”anlamlarını kazanarak anlam genişlemesi gösterdiği tespit edilmiştir."
