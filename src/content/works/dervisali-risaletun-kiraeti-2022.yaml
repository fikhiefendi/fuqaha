abstract: "Bu araştırmada, İbrahim el-'Adevî es-Sâlihî (ö. 1099/1688) adlı âlimin“Risâletün fî Kırâeti Hafsın 'an 'Âsımın Radiyellâhu Te'âlâ 'anhuma min Tarîki'ş-Şâtibîyye li-İbrahim el-'Adevî”isimli risâlesi incelenmektedir. Bu risâle, hicrî 11. yüzyılda Şâm'da kaleme alınmış, daha önce üzerinde çalışılmamış ve tahkik yapılmamıştır. Tezimizde, eserin tahkikine ve aslına uygun olarak açıklanmasına çalışılmış, İslâmi kültür hayatına ve Kur'ân literatürüne katkı yapmak istenmiştir. Araştırmamız üç bölüme ayrılmıştır: Birinci Bölüm: Burada müellifin hayatı ve ilmi kişiliği incelenmiş ve eserleri tanıtılmıştır. Ayrıca risâlenin başlığında adı geçen İmâm Hafs b. Süleymân ve İmâm Şâtıbi'nin Hayatı ve ilmi kişiliği hakkında bilgi verilmiştir. İkinci Bölüm: Bu bölümde“Risâletün fî Kırâeti Hafsın 'an 'Âsımın Radiyellâhu Teâlâ 'anhuma min Tarîki'ş-Şâtibîyye li-İbrahim el-'Adevî”isimli risalenin özellikleri ve eserin müellife nispeti, eserin Ebu'l-Mevâhib El-Hanbelî'nin eseriyle alakası ve ondan farkları, eserde müellifin takip ettiği yöntem hakkında bilgi verilmiş; yazma eserin nüshaları tek tek tanıtılmıştır. Üçüncü Bölüm: Bu bölümde, tahkikli metin yer almıştır. Müellif nüshası da dahil olmak üzere toplam dört nüsha ile yaptığımız bu çalışmada, müellif nüshası esas alınmakla birlikte yer yer diğer nüshâlar tercîh edilmiştir. Böylece en doğru metin ortaya çıkarılmaya çalışılmıştır."
