abstract: "Bu tez çalışmasının amacı, Türkiye'de murabaha finansman yönteminin uygulama esaslarını Faizsiz Finans Muhasebe Standardı (FFMS) 28'e uygun olarak açıklamak, murabaha işlemine ilişkin örnek vaka ve muhasebe kayıtlarına yer vererek literatüre katkı sağlamaktır. Çalışmada, belirtilen amaç doğrultusunda birinci bölümde katılım bankacılığı açıklanmış ve katılım bankalarının fon kullandırma yöntemlerinden bahsedilmiştir. İkinci bölümde, Faizsiz Finans Muhasebe Standardı (FFMS) 28“Murabaha ve Diğer Vadeli Satışlar”kapsamında murabaha işleminin muhasebeleştirme esasları açıklanmıştır. Üçüncü bölümde ise bireysel ve kurumsal murabaha örnekleri ile birlikte standarda uygun muhasebe kayıtlarına yer verilmiştir. Çalışma sonuç ve öneriler bölümü ile tamamlanmıştır. Çalışma sonucuna göre murabahaya konu varlığın standart düzenlemesine uygun olarak“stok”hesap olarak muhasebeleştirilmesi ve stok kontrolünün katılım bankasınca sağlanması gerektiği tespitleri yapılmıştır. Ayrıca TMS/TFRS düzenlemelerinden farklı olarak FFMS 28'e göre murabaha işlemi bir“kredi”işlemi değil,“satış vaadi”olarak muhasebeleştirilmelidir. Bununla birlikte katılım bankalarına yönelik standarda uygun bir hesap planının hazırlanması yararlı olacaktır."
