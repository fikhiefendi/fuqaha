abstract: "Çalışmamızda Hanefi mezhebinin büyük imamlarından biri olan İmam Muhammed b. Hasan eş-Şeybani'nin, ibadet hukukuna dair görüşleri incelendi. Tezimizde ibadet hukuku ile ilgili bazı konular ele alınmış olup, İmam Muhammed'in konulara getirmiş olduğu çözümlerden hareketle, onun düşünce yapısını anlamak ve bu sayede geçmişte olduğu gibi günümüz ve gelecek açısından, hukuk düşüncesinde metodik olarak farklı düşüncelere alan açmak amaç edinildi. Bu sayede günümüz fıkıh çalışmalarına gücümüz nispetinde yeni yorumların getirilmesinin önünü açmaya çalışıldı. Çalışmamız bir giriş ve iki bölümden oluşmaktadır. Çalışmamızı tanıttığımız giriş bölümünden sonra, birinci bölümde İmam Muhammed'in hayatı, yöntemi genel bir bakış açısı ile ele alınmış, eserleri, hocaları, öğrencileri tanıtılmıştır. İkinci bölümde ise İmamı Muhammed'in mezheb içerisinde, ibadet hukuku alanında, Ebu Yusuf ve Ebu Hanife'nin görüşüne paralel olan ve hocalarından farklı düşündüğü görüşleri tespit edildi. Çalışmamızda İmam eş-Şeybani'nin ibadet hukuku ile ilgili görüşlerini özetle vermek suretiyle konuların kolayca anlaşılmasına yardımcı olacağına inanıyoruz."
