abstract: "Fıkıh kitaplarında önemli bölümlerden biri de“Nikah”bölümüdür. Bunun da önemli kısımlarından biri“Nafaka”dır. Tezimiz“HANEFİ VE CAFERİ MEZHEPLERİNDE KADINLARIN NAFAKASI”başlığını taşımaktadır. Burada kadınların nafakası denildiğinde evlilikte eş olan kadınlar kastedilmiş, nafakaları ele alınmış, eşlerle ilgili hükümlere bakılmış ve bunlarla ilgili açıklamalar yapılmaya çalışılmıştır. Tezimizde Hanefi ve Caferi mezheplerinde Şemsü'l-eimme Serahsi'nin ve Şeyhu't-taife Ebu Cafer et-Tusi'nin Mebsut kitaplarında eşlerin nafakaları ile ilgili bölümler incelenmiştir. Bu çalışma giriş ve iki bölümden oluşmaktadır. Giriş kısmında araştırmanın önemi, amacı, yöntem ve kaynaklarla ilgili meseleler ele alınmış, nafaka hakkında kısaca bilgi verildikten sonra İmam Serahsi (ö. 483/1090) ve Ebu Cafer et-Tusi'nin (ö. 460/1067) hayatı, eserleri, hocaları ve öğrencileri hakkında malumat verilmiştir. Birinci bölümde İmam Serahsi'nin Mebsut eserinde eşlerin nafakaları, ikinci bölümde ise Ebu Cafer et-Tusi'nin Mebsut eserine göre eşlerin nafakaları ile ilgili hükümler araştırılmaya çalışılmıştır. Sonda ise sonuç kısmı ve faydalanılan kaynakların listesi verilerek çalışma tamamlanmıştır."
