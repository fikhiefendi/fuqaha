abstract: "ÖZET“İslâm Borçlar Hukukunda Vedîa”adını taşıyan bu tez çalışması bir giriş ve beş bölümden oluşmaktadır. Vedîa ve emanet kavramlarının ele alındığı Giriş'ten sonra Birinci Bölümde vedianın mahiyeti, şartlan ve özel şekilleri incelenmiştir. Konuyla ilgili hem akit, hem de akdin konusu olan nesne anlamındaki vedîa için, akdin şart ve niteliklerini de kapsayan şöyle bir tanım getirdik:“Vedîa kişinin mal veya mal hükmünde olan ve teslim edilebilen bir taşınırın muhafazası konusunda güvenilir birini yetkilendirip, karşı tarafin ücretsiz kabulüyle oluşan ve bağlayıcılığı olmayan bir emanet akittir.”Modern hukukta vedîanın“Ardiye Sözleşmesi”ve“Usulsüz Tevdi1”gibi bir kısım özel şekilleri bulunmaktadır. Ancak bunlar bir ücret karşılığı yapıldığı için, özellikle malın tazmini konusunda normal vedîadan farklıdır. İkinci Bölümde tarafların hak ve yükümlülükleri açıklanmıştır. Vedîa akdinde, vedîayı kendi malı gibi koruması, mûda' için önemli bir yükümlülük olurken; kendisine, vedîa için yaptığı harcamaları veya vedîa sebebiyle uğradığı zararları da mal sahibinden talep, hatta bu alacağını tahsil için malı hapsetme hakkı tanınmıştır. Vedîa sahibinden izinsiz kullanılamaz. Malın kullanılması ve iadede aynı (kendisi) yerine mislinin geri verilmesi esasına dayanan usulsüz vedîanın ele alındığı Üçüncü Bölümde, konu İslâm hukuku açısından değerlendirilmiş ve usulsüz vedîanın, özel bir vedîa şekli olarak İslâm hukukuna ters düşmeyeceği kanaatine varılmıştır. Vedîa bir emanet akdi olması sebebiyle mûda'ın, kasdî bir kusuru olmadıkça tazmin yükümlülüğü yoktur. Tazmin gerektirecek sebepler ile bu konudaki davalar da Dördüncü Bölümde yer almıştır. Beşinci Bölümde ise akclin sona ermedi ve vedîanın iadesi konu edilmiştir. Mûdi'in istemesi veya sözleşmenin sona ermesi durumunda mûda' vedîayı iade etmek zorundadır. Onun bir alacağım elindeki vedîadan takas yoluyla tahsil etmesi, genel olarak geçerli görülmemiştir. Mukayese metoduyla yapılan bu çalışmadan, İslâm borçlar hukukundaki vedîa ile ilgili hükümlerin, genel ahlâk ve hukuk kuralları çerçevesinde, zamanın ve şartların gereklerine göre şekillendiği, dolayısıyla modern hukuklardaki konu ile ilgili hükümlerden önemli farklarının bulunmadığı anlaşılmaktadır. IV"
