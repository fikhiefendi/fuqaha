abstract: "Bu tez, Hanefi mezhebinin önde gelen alimlerinden Kudûrî'nin, muhtasar geleneğinin ilk örneklerinden biri olan ve Hanefi mezhebinin fıkıhta üç temel kaynağından biri kabul edilen el-Muhtasar isimli eserindeki hadisler tahric ve eserde kullanılan rivayetlerin otantik değeri tespit edilerek, Kudûrî'nin hadis kullanımına ilişkin fikir vermesi amacıyla hazırlanmıştır. Çalışma giriş ve iki bölümden oluşmaktadır. Tezin giriş bölümünde konu, amaç ve yöntemden bahsedilmiştir. Birinci bölümde okuyucunun zihninde Kudurî'ye dair genel bir çerçeve oluşması gayesiyle onun hayatı, ilmi kişiliği ve eserleri hakkında bilgi verilmiştir. İkinci bölümde ise eserde geçtiği tespit edilen 54 rivayetin tahrici ve sıhhat değerlendirmesi yapılmıştır. Eser, telif gayesi itibariyle görüşlerle birlikte delillerin de aktarıldığı bir mahiyete haiz olmadığı için hadis formatında nakledilen rivayet sayısı oldukça sınırlıdır. Kudûrî'nin bu şekilde naklettikleri yanında doğrudan hadis olmasa da eserde metin olarak yer alan fakat hadis metninden alındığı tespit edilen ibarelerden hareketle Kudûrî'nin kullandığı hadisler ortaya çıkarılmış ve bu çerçevede bir değerlendirme yapılmıştır. Bu hususta onun diğer eserleri de göz önünde bulundurularak hadisler konusunda en isabetli tespitler yapılmaya gayret edilmiştir. Bu şekilde tespit edilen elli dört rivayetin önce hadis literatüründeki yeri, ardından otantik değeri ortaya konuşmaya çalışılmıştır. Ayrıca ilgili rivayetlerin mezhep içi yaygınlığı hususunda fikir vermesi için, Hanefî literatüre ait Kudûrî öncesi ve sonrası bazı eserler baz alınarak rivayetlerin kullanıldığı kaynaklara atıfta bulunulmuştur. Rivayetlerle ilgili tespit edilen sıhhat değerlendirmeleri ile rivayetlerin Hanefî literatürdeki yerine ilişkin veriler en son bir tabloya aktarılmış ve sonuç bölümüyle tez tamamlanmıştır."
