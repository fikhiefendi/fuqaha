abstract: "Kur'an-ı Kerîm, hem lafız, hem de mana cihetinden insanlığı kendisine muhatap edinen ilâhî bir kelâmdır. Bu hitabın muhataplara sağlıklı ve verimli bir şekilde ulaşabilmesi için Kur'an âyetlerinin münasebet/münâsebât ve makâsıd açısından ele alınması zaruret teşkil etmektedir. Bu çalışmayla, Kur'an'ın metin yapısını ve esas gayelerini anlama konusunda temel iki kavram olan münâsebâtü'l-Kur'ân ve makâsıdü'l-Kur'ân perspektifinden Sâd sûresinin incelenmesi amaçlanmaktadır. Bu iki konu zaviyesinden Kur'an'ın araştırılıp incelenmesi, insanlığın uyanışına tesir etme potansiyelinden dolayı çok mühim araştırmalar olarak kabul edilmektedir. Kur'an âyetlerinin ve sûrelerinin birbirleriyle olan ilişki, alaka ve irtibatlarını ele alan münâsebet ilmi, Kur'an nassının gelişi güzel değil, etkileyici bir anlam insicamıyla tertip edildiğini bize göstermektedir. Makâsıdü'l-Kur'ân ise; tevhid, nübüvvet, ahiret, adalet ve kulluk gibi Kur'an'ın ana gaye ve hedeflerini ele alan bir yaklaşım biçimidir. Sâd sûresi içerdiği mevzuların çeşitliliğine nazaran kısa sayılabilecek bir sûre olmasına rağmen tadat edilen mevzuları kendi bünyesinde detaylı bir bir şekilde barındırmaktadır. Sûrede konular arasında geçişlerin olması münâsebet ilmi açısından sûrenin incelenmesini gerekli kılmaktadır. Bundan dolayı çalışmada sûre, hem âyetler ve sûreler arası anlam münâsebetleri, hem de bu münâsebetlerin Kur'an'ın maksatlarıyla olan örtüşmesi cihetinden ele alınmıştır. Sâd sûresi gerek öncesi ve sonrasındaki sûrelerle, gerek kendi âyetleri arasındaki insicamla tam bir münâsebet halindedir. Yine gerek Kur'an'ın umumi maksatlarını, gerek sûrenin âyetlerindeki maksatları ifade etme konusunda güçlü bir ifade tarzına sahiptir. Bu tezle, Kur'an'ın nazım yapısını daha iyi kavrama çabasına katkı sunmak ve tefsir ilminde münâsebet ile makâsıd temelli okuma biçimlerinin önemine dikkat çekme amaçlanmıştır."
