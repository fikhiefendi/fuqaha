abstract: "Fetâvâ-yı Üskübî 16. yy.a ait son derece önemli ve meşhur nukûllü (nakilli, alıntılı, kaynaklı) bir fetva mecmuasıdır. Üskübî'nin vefatından sonra fetva katibi olan oğlu Ahmet Efendi tarafında derlenmiştir. Mecmuanın genelinde Üskübî kısa ve öz cevaplar vermiştir. Fetvaların beşte birini tek kelimelik (olur-olmaz/caizdir-mekruhtur) cevaplar oluşturmaktadır. Ancak bazen cevaptan sonra kısa açıklamalar yapmış veya birden fazla cevap vermiştir. Üskübî fetva alametlerine de fetvalarında yer vermiş ve cevaplarını verirken bazen hangi kategoriye dahil olduğunu belirtmiştir. Eser boyunca Üskübî genel olarak tek bir görüşü aktararak fetva verme yolunu tercih etmiş, yüzde onluk bir kısımdaysa ihtilaflara ve başka görüşlere yer vermiştir. Üskübî'nin ihtilaflı noktalarda fetva verme usûlü de farklı etkenlere (zamanın değişimi, istihsan, şeyhülislam fetvasına uygunluk vb.) bağlı olarak değişiklik arz etmiştir. Bu tarz durumlarda bazen de tercihte bulunmadan görüşleri zikretmekle yetinmiş, nakil bulamadığını belirttiği az sayıda meseledeyse mezhep içi kıyas yaparak veya tevakkuf ederek fetva verme yoluna meyletmiştir. Üskübî eserin nerdeyse tamamında nakil yazmıştır. Nakiller de çeşitlilik arz etmektedir. Müellif nakillerin bir kısmında meselelerin aynını Arapça olarak ifade ederken, bir kısmında meselelere bazı ek açıklamalar getirmiş, bazen de mesele içerisinde hiç değinmediği ihtilafları ihtiva eden nakillere yer vermiştir. Üskübî nakillerin bir kısmındaysa“ekûlu-kultü”gibi ifadelerle kendi kanaatini açıkça ifade etmiş, bazen de tercih yapmadan alıntılamakla iktifa etmiştir. Üskübî eserinde en muteber kabul edilen 300'e yakın eser ve müellife atıfta bulunmuş, mecmuasının güvenilirliğini ve ilmî derinliğini artırmıştır. Bu sayede eser çok meşhur olmuş ve zamanla kadıların el kitabı haline gelmiştir."
