abstract: "Bu çalışmada, Eski Türklerde evlilik hukuku hakkında bilgi verildikten sonra Tanzimat, II. Abdülhamid, İttihat ve Terakki dönemleri evlilik hukuku üzerinde durulmuştur. Cumhuriyet Dönemi Medeni Kanunu ve Çorum'daki uygulamaları incelenmiştir. Konu esas itibariyle iki ana başlıktan oluşturulmuştur. Birinci bölümde Tanzimat'tan Cumhuriyete kadar olan dönemde evlilik hukuku incelenmiştir. İkinci bölümde ise Medeni Kanun ve Çorum uygulaması üzerinde durulmuştur. Konumuzu Çorum Şer'iye sicillerinden, 1917 Aile nizamnamesinden ve 18401930 Çorum Evlenme Sicil Defterlerinden faydalanarak ortaya koymaya çalıştık. Bununla birlikte çalışmalarımızda diğer ikinci el kaynaklardan da yararlanılmıştır."
