abstract: "Çalışmamızda sigortanın tanımı, türleri ve temel özellikleri ile toplumsal ve ekonomik etkileri ele alınmıştır. Sigortacılığın dünya ve Türkiye'deki tarihsel gelişimi, güncel sektör verileri ve yasal düzenlemeleri değerlendirilmiştir. İslam tarihinde sigortaya benzer uygulamalar ve fıkhi yaklaşımlar incelenmiş; katılım (tekafül) sigortası modelleri ile dünyadaki ve Türkiye'deki sektörün durumu ve yasal çerçevesi detaylandırılmıştır. Araştırmanın uygulama kısmında, Aksaray'da görev yapan Diyanet personelinin katılım sigortacılığına yönelik bilgi düzeyleri, tutumları ve tercihleri anket yoluyla ölçülmüş, ulaşılan bilgiler SPSS programı ile analiz edilmiştir. Bulgular, katılımcıların kahir ekseriyetinin faiz hassasiyeti taşıdığını ve katılım sigortasına olumlu yaklaştığını göstermiş; ancak bilgi eksikliğinin sektörel bilinçlendirme ihtiyacını ortaya koyduğu göstermektedir. Çalışmada, katılım sigortacılığının gelişimine katkı sağlayacak kamu otoritesi ve sektör aktörlerine yönelik öneriler de sunulmuştur."
