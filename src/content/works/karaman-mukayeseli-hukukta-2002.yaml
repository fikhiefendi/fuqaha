abstract: "V ÖZET YÜKSEK LİSANS TEZİ MUKAYESELİ HUKUKTA RÜŞT KAVRAMI Hatice KARAMAN Danışman: Yrd. Doç. Dr. Murtaza KÖSE 2002 - Sayfa: 64 Jüri: Yrd. Doç. Dr. Murtaza KÖSE Prof. Dr. Hamza AKTAN Doç. Dr. Faruk KARACA İnsan doğumla ölüm arasında hukuken bir mevcudiyet ifade eder, şahıs olarak tanınır. Şahıs, mevcudiyeti ve başkalarından ayrı oluşu sebebiyle hukuken korunan maddi ve manevi varlıklara sahiptir. Hukuk düzeni, bir takım hak ve yükümlülükler getirmek suretiyle şahısların toplu halde yaşamını düzenler. Hak ve yükümlülükler insan üzerinde anlam kazanmaktadır. Çünkü hak ve borç kavramlarının ortaya çıkması sonucu, hukuk düzeni, bunlara kimin sahip olabileceğini belirtmek zorunda kalmış ve kişiler meydana gelmiştir. Bir kimse, ancak davranışlarının sonuçlarını idrak edebiliyorsa, bunun sorumluluğunu taşımalıdır. Bundan dolayı, sorumluluğun kabulü için, şahsi bir nitelik olarak temyiz, şekli (formal) bir nitelik olarak da rüşt aranmıştır. Rüştün, İslam hukuku ve Türk hukuku temel olmak üzere diğer hukuk sistemleriyle karşılaştırmalı olarak kriterlerinin belirlenmesinin, kavramın daha iyi anlaşılmasında faydalı olacağı kanaatindeyiz."
