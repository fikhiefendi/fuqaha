abstract: "Bu çalışma, Sahabe Döneminden beri İslam Hukukunun tartışmalı konularından biri olan bir anda veya bir mecliste verilen üç talak konusunu ele almaktadır. Birinci bölümünde genel anlamda talak konusu ele alınmıştır. Bu kapsamda talak kavramının tanımı, meşruiyyeti, hikmeti, boşama yetkisi ve ehliyeti, boşama için kullanılan lafızlar, talak çeşitleri, boşanma sonucunda beklenmesi gereken iddet ve evliliği talak dışında sona erdirme şekilleri (fesih, tefrik, muhâle'a (hul'), îlâ, müla'ane (liân), zıhar) hakkında genel bilgi verilmiştir. Tezimizin de ana omurgasını oluşturan ikinci bölümde ise tarihsel süreçte üç talak meselesi ele alınmıştır. Bu kapsamda Hz. Peygamber, sahabe ve tabiûn dönemlerinde; daha sonra mezheplere göre ve Osmanlı uygulamasında ve nihayet Cumhuriyet dönemi ve günümüzde üç talakın nasıl ele alındığı ve uygulandığı çok geniş şekilde incelenmiş ve üç talak konusunda bir kanaat sahibi olmamız hususunda büyük bir etkisi olmuştur. Üçüncü bölümde ise üç talakın ilişik olduğu diğer önemli meseleler ele alınmış ve bu meselelerin üç talak ile ilişkili olduğu yönler teker teker ortaya konmuştur. Bu çalışmanın sonucunda Hz. Peygamber döneminden günümüze üç talakın nasıl ele alındığı ve uygulandığı konusu vuzuha kavuşmakta ve günümüzde üç talak meselesinin nasıl uygulanabileceği hususunda tezimiz bir fikir beyan etmektedir."
