abstract: "IV TÜRKÇE ÖZET Osmanlı Devleti'nin yargı müessesesi şer'iye mahkemeleridir. Mahkeme tutanaklarını ihtiva eden şer'iye sicillerinde kişilerle ilgili olaylar ve bu olayları sonuca bağlayan kararların yanışına idari düzenlemeler yer almaktadır. Elimizde çalıştığımız defter Beşiktaş mahkemesinin 62 numaralı şer'iye sicilidir. Bu defterde hicri 26 Rebî'ul-evvel - 15 Zilka'de 1061 (miladî 19 Mart - 30 Ekim 1651) tarihleri arasında yazılmış kayıtlar yer almaktadır. Defterde yer alan kayıtların çoğunluğunu hüccetler oluşturmaktadır. Hüccet; kadı huzurunda tarafların anlaşmaya vardıklarını belirten ve kadının tasdikleyerek taraflara verdiği belgedir. Çalışmamızda önce hücceti açıklayıp, defterde bulunan hüccetler ışığında Beşiktaş'ın söz konusu dönemdeki sosyal ve ekonomik durumu hakkında bir değerlendirme yaptık. Daha sonra defteri basit transkripsiyon metoduyla transkrip ettik. Transkripsiyonda defterin dil hususiyetlerini bozmadan aktarmaya çalıştık. Çalışmamızın son kısmında sicilde bulunan bütün hükümleri numaralandırarak bunların muhtevasını kısaca özetledik. Defterde bazı kayıtlar Arapça olarak yazılıdır. Arapça kayıtların transkribini yapmayıp, metnin orjinalini varak ve hüküm numarası sırasına göre metin transkribi içine yerleştirdik. Beşiktaş mahkemesinin 62 numaralı şer'iye sicilini ihtiva eden bu defterde emlak ve arazi alam-satımı, alacak-verecek davaları, köle ve cariye azadı, vakıflara ait çeşitli konular, evlenme ve boşanmayla ilgili çeşitli hükümler yer almaktadır. Defterimiz Beşiktaş'ın söz konusu dönemdeki demografik yapısı, sosyal, ekonomik ve idari durumu gibi konuların araştırılmasında önemli bir kaynak durumundadır."
