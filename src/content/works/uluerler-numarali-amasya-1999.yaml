abstract: "Tezimiz 71 Numaralı Amasya Şer'iyye Sicilidir. Sicil, Hicrî 1234-1236 / Miladî 1818- 1821 yılları arasını kapsamaktadır. Bu dönemde Amasya, Sivas Eyaleti'ne bağlı Sancak merkezi idi. Bu çalışmada öncelikle, Osmanlı Devleti'nde mahkeme ve kadı hakkında bazı bilgiler verdik. Sonra sicil içindeki belgeleri tasnif ettik ve belgelerin özetleri ile transkripsiyonunu verdik. Son olarak da konuların kısa bir değerlendirmesini yaptık. Amasya Kazası, Amasya Sancağı'nın merkezi idi ve o dönemde 4 nahiye ile şehir merkezine bağlı 109 köyü vardı. Kadı kazadaki en yetkili devlet görevlisiydi. Aynı zamanda Yeniçeri Serdarı, Müftü ve A'yân gibi diğer görevlilerde bulunuyordu. Şehir merkezindeki halk genellikle ticaretle uğraşırlardı. Köylüler de geçimlerini çiftçilikle kazanırlardı. Amasya önemli yollar üzerindeydi ve şehirde canlı bir ticari yapı vardı. Bu etkenler sayesinde Amasya önemli bir şehir haline gelmiştir. O dönemde Amasya'da yaklaşık olarak 25.000 kişi olan nüfusun, 5.000 kadarı gayr-ı müslimdi. Halk, sosyal yaşantıda birbirine karşı hoşgörülüydü. İktisadî yapının gelir gider dengelerine göre vergilerin toplanması ve Sancak masraflarının kayıtları düzenli bir şekilde yapılmıştır. Anahtar KelimelenAmasya Şer'iyye Sicili, Kadı, Kaza, Eyalet, Sancak."
