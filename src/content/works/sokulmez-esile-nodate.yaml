abstract: "Çalışmamız, ilk dönem Osmanlı âlimlerinden Şeyh Bedreddin'in Câmiʿu'l-fusûleyn isimli eserinde Hanefi fukahâsına yaptığı itirazlara Süleyman b. Ali el-Karamânî'nin yazdığı bir reddiyenin tahkîki ve tahlîli üzerine yapılmıştır. Mezkûr eser ağırlıklı olarak yargılama hukuku ve muâmelat konularından teşekkül etmiştir. Eserin kaynaklarından yapılan alıntılar, başta Süleymaniye Kütüphanesi olmak üzere yazma eser kütüphanelerinde yaptığımız araştırmayla yerinde tespit edilmiştir. Çalışmamızda Şeyh Bedreddin'le Süleyman b. Ali'nin fıkıhçılığının mukayesesi yapılmıştır. Şeyh Bedreddin'in el-Esile ve'l-Ecvibe'deki fetvalarından onun ilmî kişiliği tespit edilmiş ve Vâridât isimli eserindeki fikirlerinin el-Esile ve'l-Ecvibe'de yer alıp almadığı kontrol edilmiştir. Süleyman b. Ali'nin Şeyh Bedreddin'e niçin itiraz ettiği ve nasıl cevaplar verdiği konusu incelenmiştir. Tezimiz üç bölümden oluşmaktadır. Girişte araştırmanın konusu, önemi, amacı, yöntemi ve kaynakları üzerinde durulmuştur. Birinci bölümde Süleyman b. Ali'nin hayatı, ilmî kişiliği, görevleri, yaşadığı dönemin ilmî ve siyasî yapısı ve eserlerinden bahsedilmiştir. İkinci bölümde el-Esile ve'l-Ecvibe el-mute'allika bi Câmi'i'l-fusûleyn'in telif nedeni, muhtevası, metodu, imla özellikleri ve Câmiʿu'l-fusûleyn üzerine yapılan çalışmalardan bahsedilmiştir. Üçüncü bölümde Süleyman b. Ali el-Karamânî'nin fıkhî tercihleri, tercihleri ifade eden lafızlar, Şeyh Bedreddin'le Süleyman b. Ali'nin fıkıhçılığının mukayesesi yapılmıştır. Eser, metin seçimi metodu ile üç nüshadan tahkik edilmiş ve nüsha farklılıkları dipnotta gösterilmiştir."
