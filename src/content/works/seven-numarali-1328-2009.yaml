abstract: "Şer'iyye sicilleri, kadıların mahkemede verdikleri hükümlerin ve hükümet merkezinden gelen yazıların kaydedildiği defterlerdir. Şer'iyye sicillerine; kadı defteri, mahkeme defteri veya zabt-ı vekâyi sicilleri gibi isimler de verilmektedir. Kadılar, görev yaptıkları bölgelerde devletin resmi temsilcisi konumundadırlar. Tanzimat dönemine kadar kadılar görev yaptıkları yerin aynı zamanda beledî ve noter hizmetlerini de üstlenmişlerdir. Kadılar sorumlu oldukları bölgedeki her türlü hukuki olaylardan sorumlu idiler. Verdikleri her türlü kararı da şer'iyye sicillerine kaydederlerdi.Şer'iyye sicillerinde ilam, hüccet, ferman, buyruldu, mürasele gibi değişik konularda kayıtlar bulunurdu. Şer'iyye sicillerindeki kayıtlar hakların güvence altına alınmasının teminatıdır ve bu kayıtlar yerel tarihçilik açısından çok önemlidir. Şer'iyye sicillerinden yola çıkarak şehir tarihi ile ilgili pek çok mesele çözüme kavuşturabilmektedir. Bu anlamda şer'iyye sicilleri söz konusu dönemin askeri, siyasi, ekonomik, sosyal, kültürel ve hukuki durumunu yansıtır. Görüldüğü üzere şer'iyye sicilleri parçadan bütüne doğru gitmemizi sağlayan tarihi vesikalardır.Yaptığımız bu çalışmada, ?426 Numaralı Manisa Şer'iyye Sicil Defteri? incelenmiştir. Defter gerçekte Kırkağaç kazasına aittir. Kırkağaç kazasına ait ayrı siciller bulunmadığından bu kazanın sicilleri Manisa şer'iyye sicilleri içerisinde zikredilmiştir. Üç bölümden oluşan çalışmaya giriş olarak Kırkağaç kazası hakkında bilgiler verilmiştir. Ardından birinci bölümde Osmanlı hukuku, kadılık kurumu, şer'iyye sicilleri ve incelediğimiz defter hakkında bilgi verilmiştir. İkinci bolümde ise incelediğimiz sicilin transkripsiyonu ve üçüncü bölümde de belge özetleri ile sicilin değerlendirilmesine yer verilmiştir. Ayrıca, çalışmadan istifadeyi kolaylaştırmak için tezin sonuna dizin eklenmiştir."
