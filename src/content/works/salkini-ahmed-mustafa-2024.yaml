abstract: "Bu tahkik çalışması ferâiz/miras alanında büyük önemi haizdir. Leâlî Çelebi'nin ferâiz alanında çok sayıda kitabı bulunmakla birlikte bunların hiçbiri tahkik edilmemiştir. Yine Çelebî'yi tanıtan kaynakların çoğu Türkçe olup Arapça eserlerde kendisinden pek bahsedilmemiştir. Bu çalışmada Leâlî Çelebi'nin genel olarak fıkıhtaki ilmi kişiliğinin, özel olarak mirasla ilgili bakış açısının ortaya konulması amaçlanmıştır. Bu araştırma aynı zamanda müellif Ahmed bin Mustafa'nın (Leâlî Çelebî) büyümesi, kullandığı yöntemi ve söz konusu eserinin miras alanındaki yerini belirtmeyi, kelime analizleri yapmak ve kapalı olan lafızları açıklamak suretiyle onu bilimsel olarak ele almayı hedeflemektedir. Araştırma, Ahmed bin Mustafa'nın bilimsel ve pratik yaşamını incelerken, metnin teknik ve bilimsel açıklamalarını ve bilimsel içeriğinin analizini içeren tanımlayıcı ve analitik bir yaklaşım benimsemektedir. Araştırma sonucunda ulaşılan en önemli bulgular arasında şunlar zikredilebilir: Müellifin miras ilmi konusunda emekleri bariz şekilde görülmektedir. Onun mirasla ilgili kaleme almış olduğu birçok kitap Arapça, Osmanlıca ve Farsça gibi çeşitli dillerde yazılmıştır. Esere bilimsel değeri olan bir takım önemli ekler konulmuş olup bunların başında mirasların asıllarını açıklayan tablolar gelmektedir. Yine onda mirasla ilgili bazı terimleri açıklayan bilgiler bulunmaktadır. Bu yazma eser içerisinde mirasla ilgili konuların resim ve şekillerle anlatıldığı tabloları ihtiva etmesiyle ön plana çıkmaktadır. Temel amaç ve hedef, yazarın üretmek istediği metni en iyi ve en doğru şekilde üretmekti. Şunu da belirtmek gerekir ki müellif bu kitabında anlaşılması ve ezberlenmesi zor olan miras meselelerini kolaylaştırmaya, sistemli hale getirmeye çalışmıştır."
