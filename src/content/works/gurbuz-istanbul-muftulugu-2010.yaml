abstract: "Çalışmamız Meşihat Arşivi'ndeki Sicil Ahval Komisyonu'nun tuttuğu defterlerdeki Sivas başlığı altında bulunan şahıs dosyalarından oluşmaktadır. Çalışmamız iki bölüm ve sonuçtan oluşmaktadır. Birinci bölümde ilk olarak Meşihat Arşivi'nin tarihi süreci değerlendirilmiş, akabinde Meşihat Arşivi'nin içerisinde barındırdığı arşiv defterlerine yer verilmiştir. Bu defterlerden Sicil-i Ahval Dairesi Defterleri'ne yer verilirken yaptığımız çalışmanın içeriğinden örnekler verilerek, çalışma yapılan dosyaların özetleriyle birinci bölüm sonlandırılmıştır. İkinci bölümde ise metinler sunulmuştur.Meşihat Arşivi Süleymaniye'de İstanbul Müftülüğü bünyesinde bulunmaktadır. Arşivin bulunduğu bina, ilk olarak Yeniçeri Ağası'na ait bir köşk olarak kullanılmış, II. Mahmud'un yeniçeri ocağını kapatmasıyla şeyhülislamların hizmetine girmiştir. Bu bina 1892 yılında II. Abdülhamit Han'ın emriyle tamir ettirilerek Şer'iyye Sicilleri Arşivi olarak kullanılmaya başlanmıştır.Arşiv bünyesinde birçok sicil defteri bulunmaktadır. Bizim çalışmamız 1879 yılında kurulan Sicil-i Ahval Dairesi'nin hazırlamış olduğu defterler üzerinde gerçekleşmiştir. Sicil-i Ahval Dairesi devlet teşkilâtında görev alan memurların memuriyet hayatları boyunca meydana gelen şahsî muamelelerini, tercüme-i hallerini toplayarak her bir memura ait dosya oluşturmuştur. Bu dosyalar 1950 yılından sonra bölgelere, mahkemelere ve ait olduğu yüzyıllara göre tasnif edilmiştir. Çalışmamız bu tasnif sonucu Sivas başlığı altında ortaya konulan dosyalar üzerinde olmuştur.Anahtar SözcüklerMeşihat Arşivi, Sicil-i Ahval Dairesi, Sivas, Tercüme-i Hal"
