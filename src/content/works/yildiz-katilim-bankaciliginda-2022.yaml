abstract: "Tüketim ve ticaret hayatının vazgeçilmez unsularından birisi şüphesiz ki kredi imkanıdır. İslami Finans anlayışı ve kurumları tüm dünyada olduğu gibi ülkemizde de kayda değer bir teveccüh görmektedir. İslam dininin yasak ilan ettiği ribadan yani günümüzde aşina olduğumuz literatüre göre en yakın anlamı ile faizden imtina etmeyi tercih eden kişilerin katılım bankaları ile çalışmaları ihtiyacı doğmuştur. Mevduat Bankalarının müşterilerine sunmuş olduğu kredilere alternatif olarak Katılım Bankalarında başta murabaha ve teverruk hizmeti gibi hizmetler sunulmaktadır. Yıllardır ülkemizde faaliyet gösteren katılım bankacılığı faaliyet alanının doktrinde şaşırtıcı derecede az yer tuttuğu görülmektedir. Çalışmamız için özellikle bu alanın seçilmesi de tam olarak bu nedenledir. Faizsiz bankacılığın giderek daha fazla pay sahibi olduğu finans sektöründe yapılan çalışmaların çok büyük çoğunluğunun salt ilahiyat veya bankacılık alanındaki çalışmalar olması bu alanda hukuki bir çalışma yapılması için teşvik edicidir. Çalışmamızda öncelikle katılım bankacılığı ve bu sektörde başvurulan sözleşme tipleri ana hatları ile ortaya konulduktan sonra asıl konumuz olan murabaha sözleşmesi bankacılık ve konu bağlamında ilgili olması dolayısıyla ilahiyat öğretisinden yararlanılarak değerlendirilmiştir. Teoride ve uygulamada çok sayıda dilemması olan bu sözleşme modeli, konvansiyonel bankacılığın kredilendirmeleri ile karşılaştırılarak benzerliklerine ve farklılıklarına dikkat çekilmiştir."
