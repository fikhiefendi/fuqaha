abstract: "Şer'iyye sicilleri, kadıların görevleri gereği mahkemelerde verdikleri hükümleri, merkezden gelen belgeleri ve sorumlu oldukları bölgelerdeki önemli olayları kaydettikleri defterlerdir. Şer'iyye sicilleri kadı ve naiblerin mahkemelerde kaydettikleri, hüccet, i'lam, maruz, mürasele gibi belgeler ile ferman, berat, buyruldu mektup ve tezkire gibi belge suretlerini ihtiva etmektedir. Şer'iyye sicillerindeki konular bir kaza bölgesinde meydana gelen her türlü olay ve tarihi gerçekleri kapsar. Şer'iyye sicillerinden ait olduğu dönemin ekonomik, sosyal, kültürel ve hukuki durumunu tespit etmek mümkündür. bu çalışmada 10 Numaralı Bor Şer'iyye Sicilinden elde edilen veriler yardımıyla H. 1205-1207 M. 1790-1792 yılları arasında Bor Kazasının sosyal, ekonomik ve kültürel durumu tahlil ve analiz edilmeye çalışılmıştır."
