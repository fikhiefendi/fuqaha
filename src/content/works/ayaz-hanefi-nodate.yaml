abstract: "İslam muhakeme usulünde, dâvacı ve dâvalının sunduğu beyyinelerin çatışması durumunda hangi delilin tercih edileceği önemli bir tartışma konusudur. Bu tür meseleler, fıkıh kitaplarında genellikle dağınık ve farklı başlıklar altında yer alır. Bu durum, kadıların hüküm verirken mezhep görüşlerine ulaşmasını zorlaştırır. Bu nedenle, 16. yüzyılın sonlarından itibaren Hanefî mezhebinde bu konuya özel ve bağımsız eserler yazılmaya başlanmıştır. Bu eserlerin hepsi aynı metot üzere telif edilmemiştir. Bir kısmı özel bir meselenin tahliline odaklanırken bir kısmı beyyinelerin teâruz ve tercihine dair meseleleri fıkıh kitaplarından derlemiştir. Üç ana bölümden oluşan bu çalışmanın birinci bölümünde konunun kavramsal altyapısını oluşturacak, temel terimler ve tanımlar ele alınmıştır. İkinci bölümde konuyla ilgili özellikle Osmanlı döneminde gelişmiş olan literatüre dair genel bir bakış sunulmaya çalışılmıştır. Üçüncü bölümde ise bu literatürde beyyinelerin teâruzu durumunda ortaya çıkan meseleler Osmanlı ulemasından İzmîrî'nin eseri esas alınarak incelenmiştir. Meseleler, beyyinelerin teâruzu durumunda ortaya çıkabilecek üç ihtimal olan birinin diğerine tercih edilmesi, her ikisi de geçerli kabul edilerek birlikte uygulanması ve her ikisi de geçersiz sayılarak sâkıt olması şeklinde bir tasnif içerisinde değerlendirilmiştir."
