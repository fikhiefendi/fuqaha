abstract: "İslâm Hukuku'na göre ise, ferdin İslâm Ülkesi'nde yaşamını devam ettiriyor olması temel hükümleri bildiğine dair bir karinedir. Konu, usul kitaplarında ? Dâr-ı İslâm'da hükme cehalet özür olmaz.? şeklinde ilkeleştirilmiştir. Buna göre, delâleti ve sübûtu kat'î Kur'an ve hadis metinleriyle belirlenmiş olan temel emir ve yasakları bilmemek mazeret değildir. Ancak, delâleti zannî, sadece hukuk bilginlerinin ictihadla bilebileceği konulardaki bilgisizlikler suç sayılmamıştır. Bununla birlikte kalabalık yerleşim merkezlerinin çok uzağında yaşayan veya Müslümanlığı seçerek İslâm Ülkesi'ne yeni girmiş olan şahsın temel hükümlerdeki bilgisizliği de ispatlanması şartıyla müctehid bilginlerce mazeret kabul edilmiştir. İslâm Ülkesi'nin dışındaki ülkelerde Müslüman olma ve orada yaşamını devam ettirme hali ise bilgisizlik karinesi olduğundan bu haldeki fertlerin temel hükümlerdeki bilgisizliği mazeret kabul edilmiştir."
