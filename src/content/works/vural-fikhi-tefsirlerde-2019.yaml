abstract: "Çalışmamızın konusu Fıkhi tefsirlerde talâk meselesi olup, Kur'an-ı Kerim'deki talâkla ilgili âyetleri, fıkhi tefsirlerdeki açıklamalara göre ve bir bütünlük içerisinde değerlendirmeyi amaçlamaktadır. Fıkhi tefsirlerde talâk meselesi, talâkın dönüşlü olup olmaması açısından ric'î ve bâin olarak; Kur'an-ı Kerim ve Hz. Peygamberin sünnetine uygun olup olmaması açısından ise sünnete uygun talâk ve bid'î talâk olarak izah edilmiştir. Bir ve ikinci talâktan sonra kocaya, karısına zarar verme kastı taşımaksızın ricat etme hakkı tanınmış olup, üçüncü talâkla birlikte bu hak bâin talâka dönüşmektedir. Bu durumda kadın, bir başka adamla sahih bir nikâhla evlenmediği takdirde eski kocasına ricat edemez. Yine fıkhi tefsirlerde, Kur'an-ı Kerim ve sünnete uygun olarak gerçekleşen talâkla birlikte bu kapsam dışına çıkan bid'î talâk da zikredilmiştir. Bunlar dışında, kadının bedel karşılığında talâk yetkisini alması, kocanın rızasıyla talâk yetkisinin hakemlere verilmesi ve kadının kocası tarafından talâkta muhayyer bırakılması caizdir. Nikâh öncesinde gerçekleşen talâk ise geçerli değildir. Talâk lafızları sarih ve kinayeli olmak üzere iki kısma ayrılmakla birlikte, kinayeli lafızlarla gerçekleşen talâkta niyete bakılarak hüküm verilir. Talâk sonrasında ay hali gören kadının iddeti üç kurû', ay hali görmeyen küçükler ve ay halinden kesilmiş yaşlıların iddeti üç ay, hamile kadınların iddeti ise doğum yapıncaya kadardır. İddet beklemekten maksat ise ayrılıktan sonra yıpranan tarafların kendini toparlaması ve kadının varsa hamileliğinin ortaya çıkmasıdır. Kadının mehrinin verilmesi hususunda boşanmış kadınlar dört gruba ayrılmış olup hüküm de buna göre verilmektedir. Bu durumda mehri belirlenmiş olup cinsel münasebetin gerçekleştiği kadına mehrinin tamamı verilirken mehri belirlenmemiş ve cinsel münasebetin de gerçekleşmediği kadına mehir yerine meta' verilmesi gerekmektedir. Mehir belirlenmiş olup kendisiyle cinsel münasebetin gerçekleşmediği kadına belirlenen mehrin yarısı verilir. Mehri belirlenmemiş olup kendisiyle cinsel münasebetin gerçekleştiği kadına mehrin tamamının verilmesi gerekmekle birlikte mehrin miktarı emsali kadınlara göre belirlenir. Ric'î ve bâin talâkın iddeti süresince kadının mesken ve nafakasının kocası tarafından temin edilmesi gerekmektedir. Çocuğun emzirilmesi ise tarafların anlaşması halinde ve kocanın emzirme ücreti vermesi durumunda anneye aittir. Anlaşma gerçekleşmezse koca çocuğu için sütanneyle anlaşabilir."
