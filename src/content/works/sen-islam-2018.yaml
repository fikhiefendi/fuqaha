abstract: "İslam hukukunda imamet akdinin \"hiçbir baskı ve zorlamanın ilişmediği karşılıklı rıza ve seçim akdi\" şeklinde ifade edilen bir özelliği meşru iktidar olan otorite ile kaba güç olarak ifade edilebilecek otoriterlik arasında bir ayrım yapmamıza imkan verirken, ehl-ü hal ve'l-akdin imamet akdinin velileri olarak görülmesi ise, iktidarın gücünü nereden aldığına dair bir fikir vermektedir. Gerçekte akdin kurucu unsuru olarak görülen ümmet iradesinin temsilinin neresi olduğu, gücün toplumda nerede temerküz ettiği, özetle iktidar gücünün kaynağının ne ya da nerede, kim ya da kimler olduğu konusu iktidarın meşruiyeti bağlamında cevabı aranan en önemli sorular olmaktadır. Bununla birlikte her iktidar uygulamalarının bağlayıcı, yaptırımlarının geçerli olması, içeriden veya dışarıdan gelen tehditler karşısında varlığı ve bekasını koruması için güç kullanımına ihtiyaç duymaktadır. Karşılıklı rızaya dayalı bey'at ile iktidarın güç kullanımı teoriyle pratiğin uyuşmazlığı mı? Ya da bu teorik meşruiyet çerçevesine bağlı kalarak İslam tarihinde iktidarların kuruluş pratiklerini değerlendirmek mümkün mü? Bu konular 11. Yüzyıldan itibaren güç olgusuna eserlerinde özenle vurgu yapmış olan İslam hukukçularının görüşleri çerçevesinde incelecektir."
