abstract: "Vakıf kurumu, İslam medeniyetinin geliştirdiği ve müslüman toplumları birçok yönden etkileyen en eski ve en önemli kurumların başında gelmektedir. Bu kadim müessesenin en büyük dayandığının İslam'ın ortaya koyduğu insan anlayışı olduğu söylenebilir.“Sizin en hayırlınız, insanlara en hayırlı olanınızdır.”fehvasınca hareket eden vakıflar, fert ve toplum bazında doğumdan ölüme kadar hayatın her alanına nüfuz edebilmiştir. Meşruiyetini İslam'ın iki ana kaynağı olan Kur'ân ve sünnetten alan vakıf kurumu, İslam hukukunun belirlediği kurallar çerçevesinde varlığını sürdürmüştür. Vakıf kurumu, İslam hukukçuları başta olmak üzere, yöneticiler, din adamları ve bürokratların gayretleriyle gelişmiş ve İslam şeriatının amaçlarına aykırı düşmemesine ehemmiyet verilmiştir. Vakıf kurumu, diğer müslüman toplumlar gibi Senegal toplumunda da benimsenmiştir. Refahın paylaşımı, temel sosyal hizmetlere erişimin kolaylaştırılması ve toplumsal dayanışmanın arttırılması gibi temel amaçlar güden vakıflar, Senegalde yasal bir çerçeve oluşturularak siyasi olarak desteklenmektedir."
