abstract: "Şer'iyye Sicilleri Osmanlı Devleti'nin sosyal, iktisadî, idarî, askeri, hukukî ve dinî müesseseleri hakkında önemli bilgiler içeren birinci elden kaynaklardır. Özellikle şehir tarihi ve araştırmaları için son derece önemli olan bu kayıtlar sayesinde, bir şehrin sosya-kültürel, idari ve iktisadi vs. durumu hakkında önemli bilgiler elde edilebilmektedir. Dolayısıyla bu siciller incelenmeden Osmanlı Devleti'nin, özellikle şehirlerin durumu hakkında doğru bilgilere ulaşmak mümkün değildir. Çalışmaya konu olan 31 Numaralı Ayıntâb Şer'iyye Sicili (H.1085, 1086, 1087, 1266,1267/ M. 1674, 1675,1676, 1849,1850) (s.101-202) tarihli mahkeme kayıtlarını içermektedir. Tezde defterin 101-202 sayfa aralığının transkripsiyon ve değerlendirilmesi yapılmıştır.“31 Numaralı Ayıntâb Şer'iyye Sicili'nin Transkripsiyon ve Değerlendirilmesi (H. 1087-1266-1267/ M. 1676-1849-1850) (s. 101-202)”isimli bu çalışma ile özellikle Ayıntâb şehrinin durumuna ilişkin somut verilere ulaşılmıştır."
