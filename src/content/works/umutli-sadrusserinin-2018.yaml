abstract: "Bu çalışmada hicri VIII. asır âlimlerinden Sadrüşşerîa'nın (ö. 747/1346) usul konularına yaklaşımı ve Hanefi usul düşüncesine katkıları tespit edilmeye çalışılmıştır. Sadrüşşerîa'nın usul düşüncesinin bütüncül bir yaklaşımla incelenmesi yönüyle çalışmamız bu alandaki önemli bir boşluğu doldurmaktadır. Tezimiz giriş ve sonuç bölümleri hariç iki bölümden oluşmaktadır. Giriş kısmında araştırmamızın konusu, önemi, amacı, kaynakları ve Sadrüşşerîa'nın hayatı ve eserleri hakkında bilgiler verilmiştir.Birinci bölümde Sadrüşşerîa'nın; şer'î deliller, lafız ve hüküm konuları hakkındaki görüşlerine yer verilmiştir. Bu sayede Sadrüşşerîa'nın usul konularına dair yaklaşımları tespit edilmiş ve Hanefi usul geleneği ile mukayeseli olarak değerlendirmeler yapılmıştır.İkinci bölümde Sadrüşşerîa'nın usul düşüncesinin karakteristik özellikleri üzerinde durulmuştur. Bu bağlamda usul konularını tasnif ederken benimsediği sistem, fıkıh usulü anlayışı ile mantık ve kelam disiplinleri arasındaki ilişki incelenmiştir. Bu bölümde ayrıca Sadrüşşerîa'nın, Hanefi usul anlayışına yapmış olduğu katkılar ele alınmış ve tek kaldığı görüşleri verilerek değerlendirmeler yapılmıştır. Bu çalışmayla Sadrüşşerîa'nın, sonraki dönem Hanefi usul anlayışının şekillenmesinde etkili bir rol oynadığı sonucuna ulaşılmıştır. Elde ettiğimiz diğer neticeler sonuç kısmında özet olarak verilmiştir."
