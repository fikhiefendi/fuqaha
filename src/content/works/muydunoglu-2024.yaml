abstract: "Araştırmamız, Hanefi Mezhebinin temel kitaplarından biri olan el-Câmiu's-sağīr üzerine hicri 5-6'ncı yüzyıllarda Maveraünnehir bölgesinde yazılmış şerhlerin mukayeseli incelenmesini konu edinmektedir. Ebü'l-Usr el-Pezdevî (ö. 482/1089), Şemsüleimme es-Serahsî (ö. 483/1090), Sadrüşşehîd İbn Mâze (ö. 536/1141) ve Ebü'l-Mehâsin Kādîhân'ın (ö. 592/1196) el-Câmiu's-sağīr üzerine kaleme aldıkları şerhler seçilmiş örnekler üzerinden mukayeseli bir biçimde incelenmiştir. Çalışma, İmam Muhammed'in el-Câmiu's-sağīr adlı eseri üzerine yazılmış şerhlerin incelenmesine özgün katkı yapmayı amaçlamaktadır. Bu araştırmada, birkaç örnek detaylı bir biçimde karşılaştırmalı bir analize tabi tutulmuş ve söz konusu örnekler belirlenen şerhlerden önceki ve sonraki Hanefi mezhebi kaynakları bağlamında eleştirel bir bakış açısıyla değerlendirilmiştir. Şerhlerin bu şekilde incelenmesi, ilgili eserlerin Hanefi mezhebi içindeki evrimini anlamamıza ve bu eserlerin tarihsel süreç içindeki konumunu belirlememize yardımcı olacaktır. Ayrıca, bu araştırma, İslam hukuk tarihi açısından kısa sayılabilecek bir zaman dilimi içinde aynı coğrafi bölgede kaleme alınmış olan dört şerhin, yazılış amacı, metodolojisi ve içeriği açısından benzerliklerini ve farklılıklarını ortaya koymayı hedeflemektedir. Bu dört şerh, önce genel bir karşılaştırmaya tabi tutulmuş, ardından seçili örnekler üzerinden ayrıntılı bir biçimde incelenerek, her bir şerhin özgün nitelikleri belirlenmeye çalışılmıştır. Çalışmanın odağını oluşturan örnek meselelerin mukayeseli incelenmesi bölümünde, ilgili meseleler sadece belirlenen dört şerh üzerinden bir karşılaştırmaya tabi tutulmamış, aynı zamanda anılan dört şârihten önce ve sonra yaşamış Hanefi fakihlerin görüşlerine de başvurulmuştur. Bunlar arasında özellikle Tahâvî (ö. 321/933), Cassâs (ö. 370/981), Kudûrî (ö. 428/1037) Debûsî, (ö. 430/1039) Kâsânî (ö. 587/1191), Merğînânî (ö. 593/1197), Mevsılî (ö. 683/1284) ve Zeylaî'nin (ö.743/1343) eserleri incelenmiş ve böylece fıkhi görüşlerin gelişimi uzun bir zaman dilimi içinde takip edilmeye çalışılmıştır. Çalışma, İmam Muhammed'in el-Câmiu's-sağīr'i üzerine yazılmış dört şerhi konu edindiğinden, İmam Muhammed'in hayatı ve eserlerinin yanı sıra, dört müellifin hayatı ve eserleriyle ilgili özet bilgiler sunmuştur. Ayrıca, çalışmanın kapsamı gereği, hicri 5-6. yüzyıllarda Maveraünnehir'deki siyasi, ilmi ve kültürel durum hakkında özet bilgiler de sunulmuştur. Araştırmada şu aşamalar takip edilmiştir: (1) İlk olarak, inceleme konusu şerhlerin metni olan el-Câmiu's-sağīr'in müellifi İmam Muhammed'in ilmi hayatı ve Hanefi mezhebinin temelini oluşturan eserleri hakkında bilgi verilmiş, el-Câmiu's-sağīr'in bu eserler içindeki yeri ve özelliği tespit edilmeye çalışılmıştır. (2) Ardından, hicri 5-6 yüzyıllarda Maveraünnehir bölgesindeki siyasi, ilmi ve kültürel ortam incelenmiş, bu dönemde kaleme alınan dört şerh genel hatlarıyla mukayeseli olarak incelenmiştir. (3) Bir sonraki aşamada, üç örnek mesele inceleme konusu dört şerh üzerinde önceki ve sonraki literatür de dikkate alınarak derinlemesine bir incelemeye tabi tutulmuştur. (4) Mukayeseli incelemelerden elde edilen sonuçlar önceki çalışmaların bulgularıyla karşılaştırılmıştır. Bu çalışmanın amaçladığı akademik katkılar şu şekilde özetlenebilir: • Fıkıh tarihi içerisinde kısa sayılabilecek bir zaman diliminde aynı coğrafyada yazılan dört şerhin ana hatlarıyla benzer ve farklı yönlerinin tespiti. • Fikirleri ve eserleriyle Hanefi mezhebinde yaygın etkiye sahip olan bu müelliflerin Hanefi fıkıh öğretisi içindeki konumlarının belirlenmesi. • Maveraünnehir bölgesinin İslam Hukuku açısından önemi, özellikle Karahanlı döneminde Maveraünnehir'in Hanefi mezhebinin gelişimine katkısının örnekler üzerinden gösterilmesi."
