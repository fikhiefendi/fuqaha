abstract: "YÜKSEK LİSANS TEZ ÖZÜ İSTANBUL KADILIĞI 43 NUMARALI ŞER'İYYE SİCİLİ (H. 1192-1193 / M. 1778-1779) Nail KAYA Tarih Anabilim Dalı Anadolu Üniversitesi Sosyal Bilimler Estitüsü, Aralık 1999 Danışman: Doç. Dr. Halime DOĞRU Defter, istanbul Müftülüğü'ne bağlı şer'iyye sicil arşivinin 1 numaralı İstanbul Mahkemesi Bölümü'nde 43 numaralı ile l'lam defteri olarak kayıtlıdır. 44 x 15 cm. ebadında olup 50 varak'tan ibarettir. Defterde 16 sayfa boş bulunmaktadır. Dış kapağı ebru kaplı ve kağıdı beyaz aharlıdır. Kapakta şu ibareler vardır;“Merhum ve mağfur Müfti Zade Ahmet Efendinin huzurunda olan 1191 senesinden ahirine bir ferman kayıdı. 1192-1193 seneleri İstanbul Kadısı sicilidir. 1193 senesi/3”Çeşitli konularda 129 davanın görüldüğü defterde zaman zaman knorolojiye uyulmamıştır. İlmiye sınıfının sıkça kullandığı Ta'lik yazı türü kullanılmıştır. Defterin konu başlıklarına genelde“Sahib-i Arzuhal”,“Sadır olan ferman alilerine imtisal kabil-i şer-iden irsal olunan”, Asitane-i Aliyede Vaki“Derkenarı ali”tabirleriyle başlamaktadır. Sonralarında ise“İstanbul mahkemesinden huzuru alilerine ilam olundu”, diye bitirilmektedir. Sonlarına tarihler atılmıştır. Bir üst makama da'va sonuçlarını bildirmektedir."
