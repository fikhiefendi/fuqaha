abstract: "Kadın hakları, son asırlarda güncelliğini kaybetmeyen konuların başında gelmektedir. Kadının sosyal ve hukuki durumu, Osmanlı Devleti'nde de Tanzimat dönemiyle birlikte devletin ve toplumun gündeminde önemli bir yer işgal etmiştir. Bu bağlamda kadının toplum içindeki konumu sorgulanmaya başlanmış, kadınların toplumsal sorunlarına çözüm aranmıştır. Toplumu bir arada tutan ailenin mimarı olan kadının, sosyal ve ekonomik hayatta daha fazla söz sahibi olması gerektiği gündeme getirilmiş ve tartışmalar daha çok bu bağlamda gerçekleşmiştir. Bu araştırmada, Tanzimat döneminde gerçekleşen tartışmalarda kadının şahsi hak ve sorumlulukları incelenecektir. Bu nedenle öncelikle Tanzimat dönemi hakkında genel bilgiler verilmiştir. Bu dönemde kadının haklarına ilişkin kanunları içeren düzenlemeler de konuya dâhil olmaktadır. Çalışmada ayrıca konunun daha iyi anlaşılması için İslam Hukuku'nda kadının şahsi hak ve sorumluluklarına da yer verilmiştir."
