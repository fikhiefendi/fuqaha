abstract: "Günümüz finans dünyasında yeni teknolojilerin kullanımı ve dijitalleşme hızla yaygınlaşmakta ve her geçen gün önemi artarak daha da ön plana çıkmaktadır. Finans dünyasında yeni teknolojilerin kullanılmaya başlanması sonucu ortaya çıkan yeni rekabet ortamı ile Türkiye'deki katılım bankacılığı sektörü, rakiplerinden geri kalmamak için için çeşitli stratejilere başvurmaktadır. Bu alana yapılan yatırımlar neticesinde maliyetlerin düşmesi, iş verimin artması, karlılık, büyüme, rekabette öne geçmek, müşteri memnuniyeti ve müşteri sadakati için dijital dönüşüm stratejik bir alan olarak ortaya çıkmaktadır. Tezin konusu, katılım bankacılığında dijital dönüşümün müşteri memnuniyeti ve sadakati üzerine olan etkilerini incelemektir. Bu çalışmanın amacı yeni finansal teknolojiler sayesinde dijitalleşme ile katılım bankalarının müşterilerine dijital platformlar üzerinden sunduğu ürün ve hizmetlerin, müşteri memnuniyeti ve sadakati üzerine etkilerini tespit etmek ve mevduat bankaları ile kıyaslamaktır. Elde edilen bulgulara göre; dijitalleşmenin müşteri memnuniyetini sağlamada etkili olduğu ancak müşteri sadakatine olan etkisinin ise daha düşük olduğu tespit edilmiştir. Ayrıca, katılım bankaları müşterilerinin müşteri memnuniyet ve sadakat seviyesi mevduat bankalarına göre daha yüksektir. Katılım bankası müşterilerinin, dijital bankacılık uygulamaları hakkındaki hizmet algıları, mevduat bankası müşterileri ile kıyaslandığında müşteri memnuniyeti ve müşteri sadakati seviyelerinin daha yüksek olduğu tespit edilmiştir. Bu durum dijitalleşmenin katılım bankası müşterilerinin müşteri memnuniyeti ve sadakati için önemli bir etken olduğunu gösterirken mevduat bankası müşterileri için sadece müşteri memnuniyeti üzerinde etkisi olduğu müşteri sadakati üzerinde etkisi olmadığını göstermiştir. Ayrıca dijitalleşmenin mevduat bankası müşterilerinin müşteri memnuniyet seviyelerine etkisinin katılım bankası müşterilerine göre kıyaslandığında çok daha az etkilediği tespit edilmiştir."
