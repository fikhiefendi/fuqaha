abstract: "Suçluluk Faslında Modern Teknolojilerle Muamele Yapılmasına Dair İçtihat Hükümleri\" başlıklı bu çalışmada, suçlar faslında modern teknolojilerin içtihat hükümleriyle olan ilişkisi ve suçlar faslının insan hayatını ilgilendirdiği için ağırlıklı olarak ele alınmıştır. Şeriat nefsi, ırzı, parayı ve aklı kapsar. Bu bölümde şeriat âlimlerinin özenini göstermiş ve fıkıh ihtilaflarını ele almıştır. bazı kısımlar mübarek İslami kütüphanemizdeki muazzam miktardaki bilgi sayesinde.ve şeriat, onsuz insanların hayatlarının düzelmeyeceği ihtiyaçları olan dinin, hayatın, ırzın, neslin, aklın ve paranın muhafazası için geldiğinden ve modern teknolojilerin varlığıyla somut bir gerçek haline geldi. yaşamlar doğrudan etkilenmektedir ve modern teknolojilerin etkilediği bu alanlardan biri de suçlar faslı; Bu nedenle, bu bölümde bunlarla ilgili hukuki hükümlerin incelenmesi ve hukukun genel kurallarına uygun hukuki çözümlerin bulunması gerekli olmuştur ."
