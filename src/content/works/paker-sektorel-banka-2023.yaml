abstract: "Enflasyon, banka kredileri gibi birçok değişkenden etkilenen makroekonomik bir olgudur. Dolayısıyla, literatürde krediler ile enflasyon arasındaki nedensellik ilişkisini inceleyen birçok çalışma yapılmış ve bu iki değişken arasında çift yönlü bir nedensellik bulunmuştur. Ancak bildiğimiz kadarıyla sektörel katılım ve mevduat banka kredileri ile enflasyon arasındaki nedensellik ilişkisini ve zaman içindeki değişimini inceleyen bir çalışma bulunmamaktadır. Dolayısıyla bu çalışma, mevduat ve katılım banka kredileri ile enflasyon arasındaki nedensellik ilişkisinin zaman içinde değişip değişmediğini ve sektörel banka kredilerinin enflasyona etkisinin banka türüne ve sektöre göre değişip değişmediğini inceleyen ilk çalışmadır. Bu çalışmanın motivasyonu, katılım bankalarında varlığa dayalı ve karşı taraf ödeme gereklilikleri nedeniyle katılım bankası kredilerinin enflasyon üzerindeki etkisinin mevduat bankalarına göre daha düşük olacağı algısına dayanmaktadır. Bunun için öncelikle mevduat ve katılım banka kredilerinin enflasyon üzerindeki etkileri Vektör Otoregresyon Modeli (VAR) modeli ile, ardından krediler ile enflasyon arasındaki nedensellik ilişkisi Granger Nedensellik Testi (GC) ile, kredilerin enflasyon üzerindeki etkilerinin zaman içinde değişip değişmediği 2011M01-2022M12 yılları arasında aylık verileri kullanılarak Zamanla Değişen Granger Nedensellik (TVGC) testi ile ve son olarak kredilerin enflasyona etkisinin banka türüne ve sektörlere göre değişip değişmediği 2011Q1-2022Q4 dönemine ait BDDK tarafından seçilen 10 farklı sektörel banka kredi verileri ile analiz edilmiştir. Elde edilen VAR analizi sonuçlarına göre her iki banka kredi türünün enflasyon üzerinde pozitif ve istatistiksel olarak anlamlı etki ettiği görülmüştür. İlaveten, krediler ile enflasyon arasındaki nedensellik ilişkisi (GC) sonuçlarına göre, kredilerden enflasyona ve enflasyondan kredilere doğru çift yönlü bir Granger nedenselliği olduğunu göstermiştir. Ayrıca, krediler ile enflasyon arasındaki nedensellik ilişkisinin zaman içinde değişip değişmediğini test eden TVGC sonuçlarına göre, mevduat banka kredileri ile enflasyon arasındaki nedensellik ilişkisi 2014 yılından sonra arttığı ve değişkenler arasındaki Granger nedenselliğin özellikle 2014-2016 ve 2018-2022 yılları arasında daha belirgin hale geldiği görülmüştür. Katılım banka kredilerinin enflasyona nedenselliği 2022 yılının ikinci ayından sonra belirginleştiği görülmüştür. Dolayısıyla, elde edilen sonuçlar katılım banka kredilerinin enflasyona etkileri mevduat bankalarına göre daha az neden olduğu görülmüştür. Sektörel analiz sonuçlarına göre sektörel mevduat banka kredilerinin çoğu enflasyona neden olurken, sektörel katılım banka kredilerinin çok azı enflasyon üzerinde küçük ve pozitif etkiye sahip olduğu görülmüştür."
