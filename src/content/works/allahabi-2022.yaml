abstract: "Bu çalışma, çağdaş finans düşüncesinde büyük önem taşıyan üç konuyu ele almıştır.Birinci konu, finansal piyasalardaki finansal getiriler ve İslami Şeriat'ın bunlara ilişkin konumudur.İki bölümden oluşan ilk bölüm, finansal getirilerin bölümlerini tanıtmaya ayrılmıştır. Çalışma, eski ve modern hukukçuların finansal getirilere bakış açısı ve bunların Fıkh'a uyarlanması ile finansal çıkışların benimsenmeye yönlendirildiği yöntem arasında bir karşılaştırma göstermiştir. İkinci konu, kredi kartı ve kredi kartı kullanımının meşru olarak meşrulaştırılabileceği ideal yolların en ünlü hukukçu kitaplarının araştırıldığı İslami piyasalardaki çalışmaları ve kredi kartı üzerindeki etkilerinin niteliğidir. taşıyıcısı ve hareket mekanizması İslami Şeriat'a göre. Üçüncü bölümde İslami yatırım fonları hakkında bilgi verilmiş, bu fonların özellikleri ve sahip oldukları özellikler açıklanmıştır.Araştırmacı, İslami fonlar için özel bir teşkilat kurulmasına ihtiyaç olduğu sonucuna varmıştır. Çünkü zengin İslam ülkelerinin sahip olduğu kaynaklar, İslami yatırım fonları etkin bir şekilde kullanılırsa İslam toplumunu tek başına zengin ülkeler saflarına yükseltebilir."
