abstract: "En önemli tarımsal finansman araçlarından biri olan tarımsal kredilerin içerdiği faiz oranları son yıllarda çok sık tekrarlanan borç yapılandırmaları nedeniyle, gıda tedarik sisteminin en dinamik zincirlerinden biri olan yaş meyve-sebze tedarik zincirinin yapısı ise özellikle tanzim satış noktalarının kurulduğu günden bugüne devam eden fiyat yükselişleri nedeniyle tarım sektöründe en çok tartışılan konular arasında yer edinmiştir. İslam ekonomisinin teorisinde ve tarihsel tecrübesinde faiz yasağından sonra çiftçilerin sermaye ihtiyaçlarının faizsiz bir şekilde nasıl karşılandığını göstermesi itibarıyla selem sözleşmesi yöntemi, Medine'ye hicretten sonra çiftçilere ait ürünlerin tedarik zincirinin nasıl işlediğini göstermesi itibarıyla da Medine Pazarı tecrübesi günümüz şartlarında oldukça dikkat çekicidir. Karma yöntem yaklaşımının benimsendiği bu çalışma, Türkiye'de hem tarımsal kredilerin yüksek faizli niteliğine hem yaş meyve-sebze tedarik zincirinin uzun ve karmaşık yapılı niteliğine ilişkin sorunları tespit etmeyi ve bunların İslam ekonomisi çerçevesinde çözümlerine yönelik uygulanabilir nitelikte model ve politika önerileri geliştirmeyi amaçlamaktadır. Bu doğrultuda ilk olarak konunun teorik çerçevesi, güncel verilere de yer verilmeye çalışılarak açıklanmıştır. Daha sonra bazı analizler (zaman serisi analizi, örnek sayısal alıştırma ve içerik analizi) yapılarak söz konusu sorunların neler olduğu tespit edilmiştir. Son olarak tespit edilen tüm sorunların çözümlerine yönelik özgün öneriler geliştirilmiş ve bunların uygulanabilirliklerini analiz etmek için tarım sektöründeki bazı paydaşlarla (çiftçiler, TKK yetkilileri ve uzmanlık alanları farklı akademisyenler) değerlendirmelerini (veriler) toplamak üzere mülakatlar gerçekleştirilmiştir. Mülakatlarla toplanan veriler, MAXQDA 2020 programında tematik analize tabi tutulmuştur. Analizin bulgularına göre çiftçiler, geliştirilen model önerisinden aktif olarak yararlanmaya isteklidirler. TKK yetkilileri, model önerisinin teknik olarak ve politika önerilerinin genel olarak uygulanabilir olduğu kanaatindedirler. Akademisyenler, politika önerilerini kısmen uygulanabilir görmektedirler."
