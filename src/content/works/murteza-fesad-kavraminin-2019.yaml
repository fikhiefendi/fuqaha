abstract: "Bu çalışmada, fesâdın fıkhî ve sosyolojik bağlamda toplum yapısındaki tezâhürünün, çeşitli yönleriyle incelenmesi hedeflendi. Bu amaçla ferdin ahlâkî ve vicdânî şuurundaki eksikliklerin insâni değerlere zarar vererek toplum yapısını nasıl bozduğu izah edildi. Cemiyette, düzeni bozucu faaliyetlerin devlet eliyle nasıl azaltılabileceği ile ilgili örnekler (siyasi, hukûkî ve askerî anlamda) ortaya konuldu. İslam hukukunun sözleşmeler çerçevesinde gelişen literatürüne bakıldığında, muamelat sahasının en temel konularından biri olan akit müessesesine özel bir önem atfedilmesi sebebiyle, çalışma içerisinde fesadın akitler üzerindeki etkilerine değinildi. Akdin sonuç doğurabilmesi için hukukun meşru kabul ettiği ölçütler ve fakihlerin akit için geliştirdiği şartlar; sıhhat, fesad ve butlan kavramı çerçevesinde ele alındı. Çalışma içerisinde“Fesâdın”lugavî ve fıkhî manası yanında maslahat ve mefsedet düzleminde topluma etki eden yönleri incelendi. Fesâdın toplumsal yapı üzerindeki menfî tesirlerinin çözüm yollarını izah etmeyi hedefleyen bu çalışma, giriş, dört bölüm ve sonuç bölümlerinden oluşmaktadır. Birinci bölümde fesad kavramının dilsel tahlîli ile birlikte fitne ve herc bağlamında değerlendirilmesi ve fesâdın fıkhî manâda tanımı yapılıp, maslahat ve mefsedet kavramları incelendi. İkinci bölümde akit teorisi, akdin tarihçesi ve toplum hayatındaki yeri izah edilip akit çeşitleri, akdi ifsad eden noktalar ve İslamda nehy edilen akitler ele alındı. Üçüncü bölümde fesadın toplumsal yapı ve ferde etki eden yönü, ferdin sorumluluk ve hakları, ayrıca“ilk fitnecinin durumu”anlatıldı. Bu bölümde, devletin birliğini ve ülke bütünlüğünü bozma amacı taşıyan siyâsi suçlar kapsamındaki üç fitne hareketi (“bağy, hırabe, irtidad”) ve bunların cemiyetteki olumsuz yansımaları izah edildi. Dördüncü bölümde, şahıs ve toplum bağlamındaki çözüm yolları üzerinde durulup, devlet teşkîlat yapısındaki hisbe teşkilatının toplumsal ahlâkı ve ticarî faaliyetleri tanzim etmesi ve fesâdı önlemedeki katkılarına değinildi. Ayrıca bu bölüm içerisinde fesâdın devleti ve devlet başkanını ilgilendiren yönü değerlendirilirken, bu bağlamda devletin üzerine düşen görevler askerî ve siyâsî noktada ele alınıp îzah edilmeye çalışıldı."
