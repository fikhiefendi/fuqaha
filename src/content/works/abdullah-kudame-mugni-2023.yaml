abstract: "Bu araştırmada İbn Kudâme'nin (ö. 620/1223) el-Muğnî isimli eserinde nezir ve ifası incelenmiştir. İbn Kudâme, dönemin en önemli fakihlerinden kabul edilmektedir. Onun yazmış olduğu eser, Hanbelî mezhebi yanı sıra Malikî, Hanefi ve Şâfiî'nin görüşleri ile Evzâî ve Ebû Ubeyd gibi dört mezhep arasında yer almayan diğer fakihlerin de görüşlerini ele alan karşılaştırmalı fıkıh hüviyetindedir. Müellif, Hırakî'nin eserini şerh ederek meseleleri detaylandırmıştır. Önce meseleler tespit edilmiş sonra da konuyla ilgili görüşler ve deliller ele alınmış; Kur'ân, sünnet, icmâ, kıyas ve diğer şer'î delillere dayanarak doğru görülen görüş tercih edilmiştir. Çalışmada müellifin hayatı ve ilmi yönü hakkında da bilgi verilmiştir. Nezir ve ifasıyla ilgili bilgilerin toplanması، konuyla ilgili görüşlerin kıyaslanıp analiz edilmesi ve sahîh olan görüşün tercih edilmesinde analitik metot tercih edilmiştir. Araştırmada ulaşılan sonuçlardan önemlileri şunlardır: İbn Kudâme el-Makdisî meseleleri ele alırken sadece nakille yetinmemiş; delilleri dikkate alara yer yer tercihler yapmıştır. Çoğu zaman tercihleri Hanbelî mezhebine uygun olsa da zaman zaman sahîh olan delile uygun farklı görüşleri tercih etmiştir. Makdisî'nin nezir konusuyla ilgili en önemli görüşü masiyet konularında nezirde bulunmanın caiz olmadığına dair icmâ olduğunu söylemesi ve adak dahil olmak üzere kurban etlerinden yemenin caiz olduğunu belirtmesidir. Müellifin derin fıkıh bilgisi birçok konuyu ele alırken kendisini hissettirmektedir. O, sadece Hanbelîlerin görüşlerini değil, konuyla ilgili diğer fakihlerin görüşlerini de ele almış Şâfiî'nin eski ve yeni XII görüşlerine değinmiştir. Eser ümmetin beğenisini kazanmış; kendisinden sonra gelen müellifler onun görülerine itimat etmişlerdir."
