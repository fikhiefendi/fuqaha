abstract: "Müslümanların hadis literatürü ile ilgili değerlendirmelerini kabul etmeyen ve Ignaz Goldziher sonrası dönemde, hadislerin büyük kısmının uydurma olduğunu iddia eden yaklaşımın hâkim hale geldiği Batı'daki hadis çalışmaları geliştirdikleri tarihlendirme yöntemleri ve klâsik hadis usûlü yerine yeni bir metot sunma çabası içinde olmaları nedeniyle önem arz etmektedir. Bu durumda, hadis literatürünün otantik rivâyetleri tespitte yetersiz kaldığı anlayışına dayalı söz konusu tarihlendirme yöntemlerinin hadis usûlüne nispetle değeri sorusu kaçınılmaz olarak gündeme gelmektedir.Bu çalışmada, tarihlendirme yöntemleri arasında, ilk uygulanış itibariyle isnâdları, geldiği nokta itibariyle ise hem isnâd hem de metinleri dikkate alması ile ön plâna çıkan ve gittikçe daha fazla çalışmada uygulandığı görülen müşterek râvî teorisi, örnek bir hadis grubundan hareketle kritik edilmektedir. Söz konusu yöntemin kurucusu Joseph Schacht ve yöntemin Batı'da en önemli uygulayıcılarından G. H. A. Juynboll'un şüpheci oryantalistler arasında yer almasına rağmen, metodu isnâdlarla metinler arasındaki tevâfuk/korelasyon ekseninde ve Schachtçı çizgisinden bağımsız uygulayan Harald Motzki, mutavassıt oryantalistler arasında yer almakta ve hadisleri seleflerinden daha erken dönemlere tarihlendirmektedir. Tezde, Motzki'nin teoriyi Schachtçı öncüllerden tecrîdine benzer şekilde, müşterek râvî merkezli isnâd-metin analizinin oryantalist paradigmanın öncüllerinden bağımsız bir şekilde yorumlanmasının imkânı tartışılmıştır. İsnâdlar ve metinler arasındaki uyumun, genel oryantalist kabulün aksine bir kurgu değil de tarihî ve organik bir süreç olarak hadis rivâyet tarihine delâlet ettiğini göstermek amaçlanmış, hadis rivâyet tarihinin ve hadis öğretiminin sistemleşmesinin isnâdlar ve metinlerdeki karşılıkları tespit edilmeye çalışılmıştır. Ayrıca, isnâd-metin analizi ile elde edilen sonuçların ricâl literatüründeki bilgilerle mukayesesi suretiyle, söz konusu literatür hakkında da bir değerlendirme yapma imkânı ortaya çıkmıştır."
