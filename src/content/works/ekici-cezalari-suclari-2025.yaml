abstract: "Bu çalışmada, genel olarak suç türleri özelde ise hırsızlık, hırâbe, zina, kazif (zina isnadında bulunma) ve sarhoşluk gibi had cezaları ele alınmıştır. Had cezalarının uygulanabilmesi için bulunması gereken şartlar, ispat yolları, cezanın uygulanma şekli, cezayı kimin uygulayacağı ve cezanın düşmesi gibi hususlar, Hanefî ve Şâfiî fakihlerin ileri sürdükleri görüşler çerçevesinde incelenmiştir. İhtilaf ettikleri konular tesbit edilmiş, dayandıkları deliller ve ileri sürdükleri gerekçeler zikredilmiştir. Hanefî ve Şâfiî fakihlerin dayandıkları deliller ve gerekçeler karşılaştırılarak tahlile tabi tutulmuştur. Bu çalışma giriş ve iki bölümden oluşmaktadır. Giriş bölümünde araştırmamızın önemi, konusu, kapsamı, yöntemi ve başvurulan kaynakların bir kısmı açıklanmaktadır. Ayrıca konumuz ile bağlantısı olan suçun çeşitlerine kısaca değinilmiştir. Birinci bölümde can ve mal güvenliğini ihlâl eden had suçları ve cezaları, ikinci bölümde ise iffet ve akıl güvenliğini ihlâl eden had suçları ve cezaları Hanefî ve Şâfiî mezheplerine göre mukayeseli bir şekilde ele alınıp incelenmiştir. Fakihlerin delilleri ve görüşleri tesbit edilip verdikleri hükümlerin sonuçları aktarılmıştır. Anahtar Kelimler: Had, Ceza, Hanefî, Şâfiî, Hüküm, Mukayese"
