abstract: "Bu tezin ana amacı İktisat biliminin tarihi gelişim sürecinde yer alan“homo economicus”kavramı üzerinden şekillenen ahlaki alt yapının incelenmesini esas alır. Bu süreçte ortaya konan insan algısı üzerinden İktisat biliminin ahlaki boyutları sorgulanmaktadır. Çalışmada, mevcut iktisat anlayışının ortaya koyduğu hedonist, rantını maksimize eden rasyonel insan kavramı üzerinden 'Seküler İktisat' ve 'İslam İktisadı' anlayışı olmak üzere bir ayrım yapılmaktadır. Bu anlayış üzerinden İslam'ın öngördüğü insan ve ahlak kavramı, modern iktisat biliminin öngördüğü anlayışla karşılaştırılmaktadır. Bu süreçte İranlı sosyolog Ali Şeriati'nin kapitalizmin ahlaki eleştirisi, kavramlar üzerinden Batı düşüncesiyle mukayeseli olarak incelenmektedir. Bu çalışmayla modern bilim düşüncesi ve iktisadın ahlaki bir varlık olan insanı 'homo economicus', 'animal rationabile' gibi kavramlarla tanımlaması karşında, İslam'ın öngördüğü 'eşref-i mahlukat' ve ona ait 'isar' anlayışı öne çıkarılmaktadır."
