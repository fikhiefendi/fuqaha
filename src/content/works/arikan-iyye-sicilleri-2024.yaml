abstract: "Köle, hürriyetinden yoksun, sahibinin tasarrufu altında olan kimsedir. Hukuken sahibinin malı kabul edilen köleler, çeşitli muamelelere tabi tutulmuş, buna kölelik adı verilmiştir. Tarihin ilk devirlerinden itibaren ortaya çıkan ve tüm toplumlarda görülen kölelik, sosyal ve ekonomik hayatın önemli ve vazgeçilemez bir parçası olmuş ve bir müessese haline gelmiştir. Kölelik, diğer toplumlarda olduğu gibi Osmanlı Devleti'nde de kabul görmüş ve kurumsallaşarak devam etmiştir. İstanbul, Bursa ve Edirne gibi baş şehirler başta olmak üzere devletin birçok şehrinde köleler toplumsal düzenin bir parçası olmuştur. Bu şehirlerden biri de Ayıntâb şehridir. Önemli ticaret yollarının geçiş güzergâhında bulunan Ayıntâb'da köle varlığı mahkeme kayıtları olan Şer'iyye Sicilleri'nde görülmektedir. Şer'iyye Sicilleri'nde mevcut köle ve cariyeler ile ilgili doğrudan ve dolaylı tüm dava örnekleri ve terekelerden elde edilen verilere göre, 16. ve 17. yüzyıllarda Ayıntâb toplumunda ekonomik gücü olan herkesin köle ve cariyeye sahip olduğu görülmektedir. Halkın gündelik hayatında kullandığı bu köle ve cariyeler, azad edilmeleri yanısıra, alım-satım, miras, hibe, firar ve adli vakalara konu olmuşlardır. Etnik köken bakımından da çeşitli arz eden köleler, özellikle azad edildikten sonra, Ayıntâb'ın toplumunun bir parçası olarak sosyal ve ekonomik hayatta aktif rol oynamışlardır."
