abstract: "Şer?iyye sicil defterlerini anlayabilmek için öncelikle söz konusu defterlerin kısacatanıtımı yapılmış ve araştırmaya konu olan defterin özellikleri hakkında bilgi verilmiştir. Araştırmaya esas teşkil eden kaynağın dili, osmanlıca olduğu için, osmanlıca?nın latin alfabesine transkribesinde kabul edilen standartlara uygun olarak, kelimelerin yazımında özel bir tarz benimsenmiştir. Buna göre belgede yer alan ve okunuş itibarıyla farklı anlamlara gelmesi muhtemel sözcükler, mümkün olduğunca aslına uygun olarak transkribe edilmiştir. Bir devletin tarihini araştırırken doğru bilgiye ulaşmak için birinci el kaynaklara bakılması gerekmektedir. Şer?iyye sicil defterleri de Osmanlı Devleti?nin tarihi hakkında birinci el bilgi sunmaktadır. Bu nedenle Samsun şehrinin Osmanlı Devleti?nin son dönemine ilişkin tarihini doğru anlayabilmek için bu defter incelenmiştir. Defter, Osmanlı Devleti?nin son döneminde Canik Sancağı?nın merkezi olan Samsun şehrinin sosyo-ekonomik, dini, siyasi ve kültürel hayatıyla idari durumu hakkında bilgiler içermektedir. Aynı zamanda şer?iyye mahkemelerinin işleyişi ve hukuksal dayanakları hakkında da veriler sunmaktadır. Araştırma 1793/39 No?lu ve 101 Poz numaralı Samsun şer?iyye sicil defteri?nin transkripsiyonu ve değerlendirmesidir. Giriş?in ardından iki bölümden oluşmaktadır Araştırmada defterin transkripsiyonundan sonra, 1793/39 numaralı şer?iyye sicil defterine göre Canik Sancağı?nın merkezi olan Samsun Bölgesinin ilgili döneminin kültürü, ekonomisi, siyasi anlayışı, dini yapısı ve sosyal hayatı hakkında bir değerlendirme yapılmıştır. Sonuç olarak Samsun şehrinin Osmanlı Devleti?nin o yıllarındaki genel profilinin ne olduğu ve azınlık statüsündeki halklara yaklaşımın nasıl olduğu gibi sorulara cevaplar aranmış ve şer?iyye mahkemeleri?nin işleyişi ve hukuksal dayanakları hakkında bilgi verilmiştir."
