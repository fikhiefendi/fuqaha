abstract: "Ada, soyadı : Mehmet YALAR Ahabilim dalı:Temel İslâm Bilimleri '^Anabilim Dalı Programı tYüksek Lisans Tezin konusu :“ Gayr ımU slim Bir Ülkede Yaşayan Müslümanın Sıkhî Problemleri”Yılı :1992 Tezsin sayfüsı:127 Tezin özeti : A Tezde, Gayrimüslim Bir Ülkede Yaşayan Müslümanın Fıkhı Problemle rinin tesbitine, çözüm yollarının ve fıkhı hükümlerinin aydınlatılması na çalışılmıştır, özellikle, gayrimüslim bir ülkede uygulanması mümkün, fakat uygulanmasında güçlük çekilen veya Müslüman ülkaye göre, hüküm ba kımından farklılık gösteren meseleler üzerinde durulmuş, gayrimüslim ül ke şartlarında bu meselelerin çözüm yolları şer» ı delillerin ışığında aranmaya çalışılmış ve gerek mezhep imamlarının gerekse de diğer İslam hukukçularının farklı görüşlerine yer verilerek probleme çözüm olan gö rüşe işaret edilmiştir. Tez. bir giSriş, dört bölüm ve bir sonuçtan oluşmuştur. Giriş bölü münde, islam hukukunda“ ülke”kavramı.ele alınarak tarif ve taksimi yapıl mış ve gayrimüslim ülkede^ikâmet etmenin hükmüne ilişkin görüşlere yer ve rilmiştir. Ayrıca, fıkhı ıpeselelerin, Müslümanın hayatındaki önemi üze rinde durulmuştur. Birinci bölümde ibadetlerle ilgili problemlere yer verilmiş ve bir takım gözlemler de dile getirilerek tslâm hukuku çerçevesinde ve içinde bu lunulan şartlar dikkate alınarak çözüm yalları ve meselelerin hükümleri be lirlenmeye çalışılmıştır. Bu bölümde yer alan problemler, cenaze nakli ve defni ile ezan, namaz, oruç, zekât ve hac ±±s konularıyla ilgilidir. İkinci bölüm, ekonomik ve ticarî hayatla ilgili problemlerden iba rettir. Bu problemler, gayrimüslim ülkede faiz muamelesi, gayrimüslime iç ki v® domuz eti satışı, piyango ve kumar gibi konular ile fasit akitlerle yapıdan alış-verişler ele alınmış, bu muamelelerin gayrimüslim ülkede ve gay rimüslimlerle yapılması halinde arzedeceği farklılıklar, İslâm hukukçuları nın görüşleri çerçevesinde açıklanmıştır. Ayrıca, gayrimüslimlerle ortaklık ve vekâlet muamelelerinin hükümlerine de yer verilmiştir. Ü ç üncü