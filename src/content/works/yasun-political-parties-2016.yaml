abstract: "Siyasi partiler dini konular üzerindeki görüşleri etkileyebilirler mi? Geçtiğimiz yıllarda, İslami görüşe sahip siyasi partiler parti programlarındaki İslami vurguları azaltmışlardır (Kurzman ve Turkoglu, 2015). Bu değişimi Türkiye'de de görmek mümkündür. Türkiye'deki ana İslami akıma bağlı olan partiler kademeli olarak parti programlarından İslam ekonomisine yaptıkları vurguları kaldırmışlardır. İslami görüşe sahip siyasi partilerdeki bu değişim bu partileri destekleyenlerin düşüncelerini şekillendirerek odaklarını dinin legalistsik yorumlamasından alıp daha seküler bir sosyal düzene yakınlaştırabilir. Dahası, İslami partilerin dışındaki partileri destekleyenler de İslami partilerdeki değişen retorikten etkilenebilir. Ancak seçmen davranışındaki akademik çalışmalar siyasi partilerin seçmenlerin görüşlerini etkilemede diğer sosyal ve ekonomik konularla karşılaştırıldığında en az başarıya ahlaki konularda ulaştıklarını ortaya koymuşlardır. Bununla birlikte dini ifadeler insanların toplumsal ve siyasi konulardaki görüşlerini çoğunlukla etkileyememektedirler. Facebook üzerinden kolayda örnekleme yöntemi kullandığım bu çalışmamda siyasi partilerin İslam dini öğretilerinin algıları üzerinden parti içi ve parti dışı seçmenlerin görüşlerini etkileme becerilerini Türkiye üzerinde inceliyorum. Çalışmada algıları ölçülen dini öğretiler İslami iktisat alanındaki miras bölüşümü ve faiz bankacılığı konularıdır. Bulgular bu çalışmadaki örneklemlerde parti içi görüş etkilemelerinin olmadığına fakat parti dışı görüş etkilemelerinin olduğuna işaret etmektedir."
