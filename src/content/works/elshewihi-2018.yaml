abstract: "Bu araştırma gösteriyor ki ; vakıflar üzerinden ekonomik güçlendirme her hangi bir toplumda kalkınmayı ölçmek için nemli hale gelmiştir, vakıfların ekonomik durumunu güçlendirip kalkındırmak için hükümet ve sivil toplum kuruluşlarının elinden geldiğince destek vermeleri gerekiyor. Aynı zamanda ekonomik güçlendirme ile alakalı tüm sıkıntıları ulusal , blgesel ve uluslararası kuruluşlara anlatılması gerekir çünkü güçsüz bir toplum ile hiç bir devlet kalkınmayı sağlayıp ayağa kalkamaz. Ayrıca , her hangi bir toplumu bir kalkınma sürecin içine katarsan demek oluyor ki bu adıma göre toplumların gelişip gelişmeyeceğine karar verilir, uluslararası arenada büyük devletlerden biri olabilmek için toplumu kalkınma sürecin içine katmakla olur . Hayırlı ve gnüllülük işi olduğu için bu alan her zaman fakirlik sıkıntısını çzüp ekonomik güçlendirmek için nemli rol almıştır. Vakıf kuruluşların tarihine bakarsak grürüz ki ekonomik güçlendirme vakıflar için hep sağlam bir kaynak olup bağışçıların ilgisini çekmiştir bu da şundan kaynaklanıyor; ekonomik güçlendirme hem eğitim, sağlık, genel hizmetler, ulaşım hem de konut yapımı için kolaylık sağlayıp tüccarlara , çiftçilere ve çalışanlara maddi olarak kaynak bulup finans etmiştir . Araştırmalara gre , sivil toplum kuruluşları, hayırsever kurumlar ve vakıflar fakirlere ister maddi ister teknik ister de ayni yardımları vererek aktif bir rol oynamıştır . STK'lar, gerek ulusal gerekse uluslararası arenada ekonomik güçlendirmek için bir rol oynadığını gösteriyor bir de devletlerin ve bağış yapan kurumların güvenini kazanıyor . Allah'a çok şükür ki bir taraftan kuranı kerim ve sünnetteki metin -VIIIbir taraftan da iktisatçılar, araştırmacılar ve bilim adamların söylediklerine dayalı olarak çalışmamdaki bu açıklayıcı yaklaşımı kullandım çünkü ekonomik güçlendirmede vakıfların önemli rolünü açıklamak istedim.aynı zamanda , araştırmalarımın doğruluğunu göstermek için son yıllarda ve çeşitli çağlardaki vakıfların tarihine ulaşabilmek için çok büyük çaba gösteip önemli tavsiyelerde bulunmak istedim ki belki ümmetin bu ekonomik sıkıntılarından kurtulmak için bir vesile olur ve bu tavsiyeler bu araştırmanın sonucudur."
