abstract: "Hicrî V. asır fıkıh usulünün en önemli asrıdır. Bu asırda telif edilen fıkıh usulü eserlerinde emrin delaleti konusuna genis yer ayrılmıstır. Bu konu ciddi tartısmaların ortaya çıkmasına neden olmustur. Usulcülerin çoguna göre dilde emrin bir sıygası vardır ve o sıygayla emir manası anlasılır. Emrin delalet ettigi hüküm, miktar ve zaman hakkında usul bilginleri arasında görüs birligi yoktur. Usulcülerin çogu mutlak emrin vücubu gerektirdigini söylemistir. Yasaklamadan sonra gelen emir yasaklamayı karine kabul edenler tarafında ibâhaya hamledilmistir. Bu yasaklamayı karine kabul etmeyenler ise emrin delalet ettigi asıl hükmün devam ettigini söylemislerdir. Usulcülerin çoguna göre emir zıddında nehyi gerektirir. Emrin gerektirdigi miktar konusunda çogunluk bir defa yapma taraftarıdır. Emrin gerektirdigi zaman hakkında ise usul bilginlerinin bir kısmı emrin hemen yapmayı (fevr) gerektirdigini iddia ederken bir kısmı da geciktirerek yapmayı gerektirdigini (terâhî) söylemistir. Usulcüler bu tartısmalarda büyük ölçüde dilbilimsel deliller kullanmıslardır. Bu delillerden bazıları oldukça zayıftır. Hatta bazı deliller zıt görüslü yaklasımlar tarafından kullanılmıstır. Bu durum bazı usulcülerin bu delillerden hareketle usul kurallarına ulasmadıkları fakat zihinlerinde zaten var olan bu kurallardan hareketle deliller ortaya koydukları izlenimini uyandırmaktadır."
