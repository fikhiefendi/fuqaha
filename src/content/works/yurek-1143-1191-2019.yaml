abstract: "Osmanlı tarihi, dünya tarihi içerisinde 600 yılı geçen muhteşem bir dönemi kapsamaktadır. 1299 yılında Osman Bey adına Karacahisar'da adına hutbe okutularak başlayan serüven, 3 Mart 1924 tarihinde TBMM tarafından hilafetin kaldırılmasıyla yerini yeni kurulan Türkiye Cumhuriyetine bırakmıştır. 1730-1789 yılları arası, bu muhteşem tarihin sadece yarım asırlık bir dönemidir. Sivas–Divriği şer'iye sicili 77 numaralı defter h.1143-1191 (1730-1777) tarihleri arasındaki Sivas ili Divriği azası ve köylerinde gerçekleşen bazı adlî, ekonomik, sosyal-kültürel ve dinî olaylar ile üst makamlardan Sivas vilayetine veya Divriği kazasına gelen yazılı emirleri kapsamaktadır. Defterin tamamı 72 sayfadan ibaret olup 40 pozdan oluşmaktadır. Tezimizde Giriş kısmında Osmanlı padişahlarından I. Mahmud (1730-1754), III. Osman ( 1754-1757), III. Mustafa ( 1757-1774) ve I. Abdülhamid (1774-1789) Han dönemleri hakkında siyasî tarih açısından özet yapıldıktan sonra, I. Bölümde Osmanlı hukuk sistemi ve şer'iyye sicillerinin önemi, kapsadığı belgeler ve mahkemede görev yapan memurlar hakkında bilgi verilmiştir. II. Bölümde Divriği tarihçesi ve eserleri hakkında şeri'iyye siciline atıflar yaparak ön bilgi vermeye çalışılmıştır. III. Bölümde değerlendirme yapılmış olup son bölümler olan IV. ve V. bölümde sırasıyla belge özetleri ve metin transkripsiyonuna yer verilmiştir. Önceleri Sivas Kongre ve Etnografya müzesinde muhafaza edilen Sivas Şer'iyye Sicillerinin orijinalleri Ankara Millî Kütüphanede muhafaza altına alınmıştır. Sivas'a ve kazalarına ait şer'iyye sicillerinin mikrofilmleri daha önceleri Sivas İl Halk Kütüphanesinde araştırmacıların istifadesine sunuluyorken, bugün için çalışılmak üzere bizim de temin ettiğimiz gibi Sivas Ziya Bey Yazma Eserler Kütüphanesinde bulunmaktadır. Osmanlı Devletini ve kendisinden önce kurulan Müslüman Türk Devletlerinin idarî teşkilatlarını şer'iyye sicilleri gibi belgelerle ortaya çıkararak anlamamız mümkün olacaktır. Divriği'nin yaklaşık 50 yıllık durumunu ortaya koymaya çalıştığımız bu çalışmadaki temennimiz, mahalleler, köyler ve o devrin toplumu ve devlet yapısı hakkında soysal, ekonomik, siyasî, adlî ve dinî alanlarda araştırma yapmak isteyenlere yol göstermesidir."
