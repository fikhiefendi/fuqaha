abstract: "Türkiye, son on yılda kayda değer artan nüfusuyla hızla gelişiyor. Ancak bu nedenle Türkiye ekonomisi hala kendi artan enerji ihtiyacını karşılamak için mücadele ediyor. Ülke, enerjisinin ortalama %50'sini ithal ediyor. Bu durum Türkiye için enerji arz güvenliği, enerjiye dış bağlılık ve cari açık gibi sorunlara neden olmaktadır. Türkiye'nin Yeni Ekonomik Planı (YEP) çerçevesinde cari açıklar ve enerji ithalatı ayrı bir öneme sahip olmaktadır. Bu bağlamda yenilenebilir enerji yatırımları yaygın olarak yeşil finans ve sosyal sorumluluk yatırımları olarak anılmakta olup son dönemde Türkiye'nin de aralarında bulunduğu birçok ülkenin gündeminde yer almaktadır. Bu çalışma, Türkiye'de yenilenebilir enerji finansmanının alternatif yollarını tartışmaktadır. Bununla birlikte, yenilenebilir enerjiye yapılan yatırımlar, yüksek işlem maliyetleri ve dar yatırımcı tabanı ve yetersiz kamu bütçesi gibi çoklu piyasa başarısızlıkları nedeniyle birçok yatırımcı tarafından tercih edilmemektedir. Bu nedenle, durumu çözmek için Kobilerin ve girişimcilerin finansmana ulaşmasını kolaylaştırılması gerekmektedir. Bu durumda doğrudan reel sektöre kaynak aktararak, kaynak yaratma olanaklarının etkinliğini artırabilecek sukuk ve yenilikçi finansal araçlara ihtiyaç duyulmaktadır. Bu keşif çalışması, Türkiye'de blok zinciri bazlı sukukun potansiyelini ve fizibilitesini değerlendirmeyi amaçladı ve uzman geri bildirimlerinden ve açık uçlu sorulardan ve uzmanlarla yapılan görüşmelerden elde edilen nitel kanıtlara dayalı tümevarımca bir yaklaşım uyguladı. Görüşülen hedef kitle politika yapıcılar, banka çalışanları ve profesörlerdir. Fintech, İslami sermaye piyasası ve yeşil ekonomi başlıkları altında kategorize edilen mülakat soruları ve bu üç ana konunun uzmanlarıyla yüz yüze ve çevrimiçi olarak mülakatlar gerçekleştirilmiştir. Bu çalışmanın bulguları, Blockchain teknolojisinin küçük ve orta ölçekli girişimciler için fonlara kolay erişim sağlayan, işlem maliyetlerini azaltan, şeffaflığı artıran ve tam izlenebilirliğe sahip tokenize sukuk tokenleri aracılığıyla geniş bir yatırımcı tabanı sağlayan yenilikçi bir finansman mekanizması olarak ortaya çıktığını göstermektedir ve yeşil finans alanında önemli bir potansiyele sahiptir. Bununla birlikte, blok zincir teknolojisi hala yeni bir çalışma alanıdır ve sektöre daha fazla yatırım çekmek için özel düzenleyici çerçeveye ihtiyaç vardır. Çalışma ayrıca, Düzenleyiciler, Sukuk ihraççıları gibi Sukuk paydaşlarının yanı sıra diğer yatırımcıların blockchain teknolojisinin nasıl çalıştığını ve yeni teknolojiyi kullanarak finansal enstrümanları çeşitlendirmenin alternatif bir yolu olarak sahip olduğu fırsatları anlamaları için bir kapasite geliştirmeye ihtiyaç olduğunu göstermektedir. Çalışma, daha ileri akademik araştırma alanlarını göstermektedir."
