abstract: "Çağımız, yaygın dijital bağlantı ile karakterize edilen bir dönemde, bu araştırma bankacılık sektöründeki dijitalleşmenin derin etkilerine odaklanmaktadır. Özellikle, çalışma Türkiye, Pakistan ve Malezya'daki İslami bankalardaki elektronik hizmetlerle ilgili müşteri memnuniyeti üzerinde dijital reklam araçlarının etkisini incelemektedir. Araştırma, 260 katılımcıdan oluşan bir örneklem büyüklüğünü kapsamaktadır ve çalışmanın amaçlarını ele almak ve genel amacını yerine getirmek için hem tanımlayıcı hem de analitik yaklaşımları içeren kapsamlı bir metodoloji kullanılmıştır. Veri toplama süreci bir anket aracılığıyla kolaylaştırılmış ve çalışmanın hipotezleri basit ve çoklu regresyon analizleri kullanılarak titizlikle incelenmiştir. Bu araştırmanın sonuçları, İslami bankacılık alanında dijital pazarlama araçlarının Türkiye, Pakistan ve Malezya'daki üç ülkede elektronik hizmetlere yönelik müşteri memnuniyeti üzerinde istatistiksel olarak anlamlı bir etkisi olduğunu ortaya koymaktadır. Çalışma sadece ortaya çıkan istatistiksel ilişkilere ışık tutmakla kalmaz, aynı zamanda dijital pazarlamanın müşterilerin günlük yaşamlarını şekillerindeki daha geniş önemini vurgular. Bulguların ışığında, bu makale, politika yapıcılar, İslami bankacılık profesyonelleri ve uygulayıcılar için önemli sonuçları olan anlamlı öneriler ortaya koymaktadır. İslami bankacılık sektöründeki paydaşlar, dijital pazarlama araçlarının ölçülebilir etkisini kabul ederek, stratejik kararlarını bilgilendirmek ve müşteri memnuniyetini genel olarak artırmak için değerli içgörüler elde edebilirler. Bu çalışma, bankacılık endüstrisinde dijitalleşmenin kilit rolü üzerine devam eden tartışmalara katkıda bulunur ve bu alandaki politika ve uygulamaları şekillendirenler için uygulanabilir içgörüler sunar."
