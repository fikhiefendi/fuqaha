abstract: "?İslam Deniz ticaret hukukunda hukuki sorumluluk? adlı çalısmamızdadeniz ticaret hukuku ile ilgili olarak, İslam hukuku eserlerinde çesitli bölümlerde dağınıkhalde bulunan ?Daman? konusu üzerinde durmaya çalıstık.Konuyu ele alırken giriste özellikle önce, deniz hukuku ile deniz ticaret hukukarasındaki ayrıma dikkat çekerek deniz hukuku ile ilgili konuları dısarıda tuttuk. Daha sonra?İslam deniz ticaret hukuku? kavramını irdeledik. Ardından hukuk-fıkıh arasındaki güncelayrıma göre ?slam hukuku eserlerindeki ibadetlerle ilgili konuları ele almamamız gerektiğinibelirttik. Daha da özele inerek tezimizde; konunun cezai sorumlulukla ilgisini dısarıdatutmak gerektiğinin gerekçelerini sıralamaya çalıstık ve kaynakları nasıl ele alacağımızı izahettikArastırmamızda, birinci bölümde genel olarak ?slam hukuku ve günümüzhukuklarında sorumluluk üzerinde durduk. Sorumluluk fikriyle ilgili ayet ve hadislerden vefıkıh eserlerindeki ilgili tanımları ve sınıflandırmalara dikkat çektik. İslam deniz ticarethukukunun kısa tarihçesini vererek, Rodos deniz Kuralları gibi Roma hukukundan alıntıolduğu iddiasına cevap vermeye çalıstıkİkinci bölümde sözlesmeden doğan hukuki sorumlulukla ilgili olarak, İslamhukukçularının daha ilk yüzyıllardan beri denizde yük/esya ve yolcu tasıma ile ilgili olarak,gemiyi tümden kiralama ve sözlesme yaparak bir bölümünü kiralama veya bizatihi yüktasımayı esas alan kiralama sözlesmelerini farklarıyla birlikte bildiklerini gördük. İslamhukukçuların özellikle sözlesmelerde; geminin adı, varma limanı, yolculuğun süresi, yüksahibinin adı, navlun ücreti ve onun ne zaman ne sekilde ödeneceği vb. hukuki ayrımlarınyük tasıma sözlesmelerinde sözlü veya yazılı olarak olarak ayrıntılı bir sekilde yer almasınısart kostuklarını belirttik.Bilhassa Maliki hukukçuların bu alanda çalısmalarının diğerlerine göre daha fazlaolduğunu gördük. Malikiliğin yaygın olduğu Endülüs İspanyasında ortaya çıkan Consolatedel Mare'da Maliki emir ve hukukçuların büyük etkisi olduğunu karsılastırmalı olarakgöstermeye çalıstık.Üçüncü bölümde haksız fiilden doğan sorumlulukta İslam hukuku eserlerinde?ta'addî ve ifrât? kavramının olduğunu, deniz kazaları, avarya gibi yükün ve gemininkorunması ile ilgili meydana gelen masrafların iki taraf arasında kusurlu olup olmamadurumuna göre bölüsülmesi gerektiğine dikkat çektik. Fırtına, rüzgâr gibi beklenmeyendurumların sebebiyet verdiği kazalarda kusur bulunmasa da sorumlu olunduğunu vemasrafların iki taraf arasında paylasıldığını gördük. Müstakil bir bölüm teskil edecek ölçüdepek yeterli örnekler olmamakla birlikte, son bölümde sebepsiz zenginlesmeden kaynaklananhukuki sorumlulukla ilgili bazı tespitlere yer verdik.Anahtar Kelimeler: İslam Deniz Ticaret Hukuku, Sorumluluk Hukuku, Daman,Sözlesme, Consolate Del Mare, Haksız Fiil, Kusur-Zarar, Beklenmeyen Durum, DenizKazaları, Avarya"
