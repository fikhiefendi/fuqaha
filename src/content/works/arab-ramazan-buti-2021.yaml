abstract: "Hz Peygamberin (sallallahu aleyhi ve sellem) hayatı, bu güne kadar ilim dallarından birisi olmuş ve Allah'ın izniyle da öyle olmaya devam edecektir. Siyerin sahih kısmı, İslam dininin teşri kaynaklarından birisidir. Bu nedenle birçok ilim insanı bu saf ve duru kaynağa müracaat etmiştir. İşte bu ilim insanlarından birisi de Dr. Ramazan el-Bûtî'dir. Kendisi, Hz Peygamberin (sallallahu aleyhi ve sellem) hayatını kaleme almış ve ondan ibret ve dersler çıkarmıştır. Bu dersler arasında fıkhı konuları da yer almaktadır. Yazar, fıkıh mezheplerinin bu konular hakkındaki ihtilaflarını ortaya koymuş ve görüşler arasında tercih yaparak kendi bakış açısını da belirtmiştir. Buti'nin kitabının adı (Fıḳhü's-Sîreti'n-Nebeviyye)'dir. Gerekli araştırmaları yaptıktan sonra çalışmamın başlığını (Ramazan El-Bûtî'nin“Fıkhü's-Sîreti'n-Nebeviyye”Eserindeki Şer'i Siyaset Ve Fıkhî Tercihlerinin Karşılaştırmalı Çalışması olarak belirledim. Bu çalışmadaki amacım, hakkında ihtilaf olan fıkhi konularda Buti'nin tercih ettiği görüşü ortaya çıkarmaktır. Belirlenen bu hedefe ulaşmak amacıyla çalışma dört bölüme ayrılmıştır. Bu bölümlerdeki konular şu başlıkları altında ele alınmıştır: 1. Buti'nin biyografisi, Fıḳhü's-Sîreti'n-Nebeviyye kitabının ve yaşadığı dönemin tanıtımı. 2. Bûtî'nin Şer'i siyaset alanındaki tercihleri, 3. Bûtî'nin cihad alanındaki tercihleri, 4.Bûtî'nin farklı konular hakkındaki fıkhi tercihleri. Toplam ele alınan konu sayısı on sekizdir. Her konu; a) Konunun açıklaması, b) Fakihlerin bu konudaki görüşleri ve delilleri ve c) Dr. Ramazan el-Bûtî'nin tercihi olmak üzere üç başlık altında ele alınmıştır. Çalışma, ulaşılan en önemli sonuçların yer aldığı sonuç bölümüyle sonlandırılmıştır."
