abstract: "Bu tezde, Türkiye'de uygulanan tasarruf finansman sisteminin (TFS) fıkhî keyfiyeti incelenmiştir. Tasarruf finansman faaliyeti ve sözleşmeleri, yasal düzenleme öncesi ve sonrasındaki değişiklikler dikkate alınarak İslâm hukuku akit teorisi çerçevesinde analiz edilmiştir. Fıkıh, hukuk ve iktisat literatüründe TFS'nin niteliğine dair ortaya konan görüşler, temel problemler ve çözüm önerileri; kanun, Yönetmelikler ve sözleşmeler temelinde teorik, tarihsel ve uygulamaya dönük yönleriyle analiz edilmiş ve fıkıh ilkeleri muvacehesinde değerlendirilmiştir. Araştırma sonucunda, güncel bir finansman tekniği olan TFS'nin işleyiş yönünden dünyadaki çeşitli tasarruf esaslı kooperatif ve sandık uygulamalarıyla benzer özellikler taşıdığı tespit edilmiştir. Buna karşılık işlemlerin faizsiz finans ilkelerine dayanması, yalnızca devlet tarafından yetkilendirilen şirketler tarafından uygulanması ve Bankacılık Düzenleme ve Denetleme Kurumunun gözetimine tabi olması diğer finansman tekniklerinden farklılaştığı noktalardır. Araştırmada tasarruf finansman faaliyetinin tek bir akit ile açıklanamayacak şekilde karmaşık yapılı olduğu ve işlem aşamalarının vekâlet, icâre, vedîa, karz ve mudarebe akit türlerini içerdiği belirlenmiştir. 6361 sayılı Kanun ve ilgili Yönetmelikler doğrultusunda şirketlerin uyguladığı tasarruf finansman sözleşmeleri taraflar, mülkiyet ve zilyetlik ilişkileri bağlamında incelendiğinde, şirket ile müşteri arasında kurulan iki taraflı bir sözleşme izlenimi verdiği ancak sistemin işleyişi dikkate alındığında finansman sağlayan diğer müşterilerin de sözleşme ilişkisinin ayrılmaz bir unsuru olduğu anlaşılmıştır. Bu inceleme doğrultusunda tasarruf finansman sözleşmelerinin şirket, müşteri ve tasarruf fon havuzu ekseninde çok taraflı hukukî ilişkiye dayandığı saptanmıştır. Birden fazla akit türünü hukukun öngörmediği biçimde bir araya getiren kendine özgü akit türü olduğu sonucuna varılmıştır. Tespit edilen problemlerin giderilmesiyle tasarruf finansman sisteminin fıkhî ilke ve esaslar doğrultusunda tatbik edilebilir alternatif bir finansman tekniği olduğu çalışmanın neticelerindendir."
