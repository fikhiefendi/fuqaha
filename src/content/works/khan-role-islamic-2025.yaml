abstract: "Bu çalışma, İslam finansmanının iklim onarımı konusundaki rolünü eleştirel bir şekilde inceleyerek, iklim değişikliğini çağımızın acil bir sorunu olarak tanımlamaktadır. Bu sorun, sağlık, su ve gıda kaynakları, ticaret, ekonomi, göç, siyaset ve uluslararası ilişkiler dahil olmak üzere yaşamın tüm yönlerini etkilemektedir. Finansal kurumlar, çevresel bozulmada karmaşık ve çok yönlü bir rol oynamaktadır. Bir yandan, fosil yakıt enerji kaynaklarının finansmanı da dahil olmak üzere çevresel zarara katkıda bulunan işletmeler için bir can damarı işlevi görmektedirler. Diğer yandan, iklim olayları bu finansal kurumları da önemli ölçüde etkileyebilmektedir. Küresel finansal hizmetlerin ayrılmaz bir parçası olan İslam finans kurumları da bu dinamiklerden muaf değildir. İslam finansmanının teorik temelleri ve etik ilkeleri incelendiğinde, bu yapının Yahudilik, Hristiyanlık ve İslam gibi tüm İbrahimî dinlerde ortak olan güçlü dini temellere dayandığı ortaya konulmaktadır. İslam finans kurumlarının yapısını değerlendirmek için, dünya çapında tanınan iklim organizasyonları tarafından belirlenen ilkelere dayalı bir matris sunulmaktadır. Ayrıca, İslam finans kurumlarının performansını değerlendirmek için dokuz değişken kullanılmaktadır. Çalışma, 9 İİT (İslam İşbirliği Teşkilatı) üyesi ülkedeki 18 İslam finans kurumu ile 4 İslam finans mimarisi kurumunun üç aylık verilerini analiz etmektedir. Bu analizde, söz konusu kurumların teorik ilkeleri ile bu ilkelerin pratikteki uygulanması arasında tutarsızlıklar olduğu tespit edilmiştir. Dahası, İslam finansmanının iklim sorunlarını ele almadaki rolünü değerlendiren akademik araştırmaların eksikliği vurgulanmaktadır. Bugüne kadar, İbrahimî dinler perspektifinden iklim sorunlarını ele alan ya da bu bağlamda İslam finansının performansını değerlendiren yüksek lisans veya doktora düzeyinde bir çalışma yapılmamıştır. Bu çalışmada, söz konusu boşluğu doldurmak ve İslam finans kurumlarının faaliyetlerinin hem Şeriat ilkelerine hem de hedeflerine uygun olmasını sağlamak amacıyla Maqasid Al-Shari'ah temelli bir finansman modeli önerilmektedir."
