abstract: "Bu çalışmada, İslam hukukunda gıda üretimi ve ticaretinin denetimine ilişkin temel ilke, norm ve esaslar ele alınmıştır. Araştırmanın temel amacı, gıda üretim ve ticaretinin hangi ölçütler çerçevesinde denetlenmesi gerektiğini ortaya koymak ve bu alandaki klasik fıkhî birikimi günümüz meseleleri ışığında değerlendirmektir. Bu kapsamda denetim anlayışının mahiyeti, denetim çeşitleri, hisbe kurumu ile denetim görevlilerinde bulunması gereken nitelikler incelenmiştir. Günümüz gıda endüstrisindeki helal sertifikalandırma, biyoteknolojik müdahaleler ve modern gıda güvenliği normları ile klasik fıkıh eserlerinde yer almış olan ilkelerin ele alındığı bu çalışma; geçmişin denetim tecrübesinden yararlanarak günümüz gıda piyasalarındaki denetim sorunlarına fıkhi ve kurumsal çözüm önerileri sunmayı hedeflemektedir. Çalışmada, helâl ve haram kavramları esas alınarak gıda üretimi, işlenmesi ve ticaretine ilişkin temel kriterler açıklanmış; gıda hammaddelerinin taşıması gereken dinî, hukukî ve sağlıkla ilgili şartlar değerlendirilmiştir. Bunun yanında kanın gıda üretiminde kullanımı, genetiği değiştirilmiş organizmalar (GDO), yapay et, hormon uygulamaları, gıda katkı maddeleri ile istihâle ve istihlâk gibi güncel meseleler, İslam hukukunun temel ilkeleri doğrultusunda ele alınarak farklı görüşler ve ulaşılan sonuçlar ortaya konulmuştur. Araştırmada ayrıca gıda üretim yerleri ve üretim süreçlerinin denetimi, hijyen, çevre sağlığı, ruhsatlandırma ve kamu denetimi gibi hususlar incelenmiş; tarihî hisbe teşkilatı ile günümüz denetim mekanizmaları arasındaki benzerlikler değerlendirilmiştir. Tezin son bölümünde ise ticaret hukukuna ilişkin hükümler ele alınarak helâl ve haram ticaret, satım akdinin şartları, tağşiş, garar, tedlîs, faiz, tüketici hakları ve piyasa denetimine ilişkin temel esaslar açıklanmıştır."
