abstract: "Finansal krizler ülke ekonomilerini derinden etkilemektedir. Avrupa Borç Krizi de Avro Bölgesi başta olmak üzere çevre ülkelerde yıkıcı sonuçlar doğurmuştur. Küreselleşme ile birlikte geniş ölçeklerde ticaret, ülkelere avantaj sağlarken; bulaşıcılık riski dezavantaj oluşturmuştur. Avrupa Birliği ile yakın ilişkiler yürüten Türkiye'de, ekonomik olarak krizin tesirleri hissedilmiştir. Ekonomilerin destekleyicisi olan bankacılık sisteminin etkinliğinin ülke ekonomileri için son yıllarda önemli hale gelmesi göz önünde bulundurularak; bu çalışmada Türkiye'de faaliyet gösteren katılım bankalarının teknik etkinliği stokastik sınır analizi ile ölçülmüştür. 2009-2016 yıllarındaki verilerle çalışılmış ve ekonometrik analiz neticesinde krizin Katılım bankalarının etkinliği üzerinde etkisinin olmadığı görülmüştür"
