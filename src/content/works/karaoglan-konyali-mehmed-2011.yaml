abstract: "Bu araştırmada, Konyalı Mehmed Vehbi Efendi'nin Ahkâm-ı Kur'âniye? adlı tefsiri ile, Muhammed Ali es-Sâbûnî'nin ?Revâiü'l-Beyan Tefsiru Âyatil Ahkâm Mine'l-Kur'ân? adlı tefsirinin Fıkhî Tefsir bağlamında mukayesesi yapılmıştır. Ahkâmu'l-Kur'ân gibi tefsir literatüründe çok önemli bir yeri olan modern ve anlaşılır bir tarzda hazırlanmış bir eserin Ahkâm-ı Kur'âniye ile bu eserden -60 yıl sonra kaleme alınmış bulunan Revâiu'l-Beyân adlı bir eserle- mukayeseye çalışılması bu tefsirlerin aynı mez-hep çizgisinde yapılan bir tefsir çalışması olması, hem de farklı kültürün ve coğrafyanın ilim adamlarının ayetleri değerlendirmeleri bakımından önem arz etmektedir.Araştırmada, konumuzla ilgili eserler incelenmiş, bu konuda hazırlanmış akademik ça-lışmalarda konumuza esas olmak üzere, konumuzla ilgili uzman kişilerle istişare edilmiş ve böylece ulaşılan neticelerin tartışma yoluyla değerlendirilmesi yapılmıştır.Bu araştırmada öncelikli olarak tefsir, çeşitleri, Fıkhî Tefsir ekolü ve Ahkâmu'l-Kur'ân kavramlarının üzerinde durulmuş, tarihi serüveni ele alınmış ve bu konuda otorite olan kişiler hakkında bilgi verilmiş, daha sonra bir giriş, toplam üç bölüm halinde tezimiz sonuçlandırılmıştır.Tezimiz bir giriş ve üç ana bölümden oluşmaktadır: Giriş bölümünde tezin konusu, önemi, amacı, metodu ve kavramsal çerçeve üzerinde durduk. Ana bölümleri ?Konyalı Mehmed Vehbi Efendi ve Ahkâm-ı Kur'âniye'si?; ?Muhammed Ali es-Sâbûnî Ve Revâiül-Beyan ? ve ?Konyalı Mehmed Vehbi Efendi ve Muhammed Ali es-Sâbûnî'nin Tefsirlerinin Mukayesesi? şeklindedir.Tezimizde Konyalı Mehmed Vehbi Efendi tefsiri ile Muhammed Ali es-Sâbûnî'nin tef-sirlerinin metotları üzerinde durulmuş, müfessirlerimizin görüşlerindeki farklılıkların tefsir metotlarından kaynaklandığı tespiti yapılmıştır."
