abstract: "Gıda ihtiyacı tüm tarih boyunca bütün toplumların en önemli konusu olmuştur. Gıdanın bolluğu veya kıtlığı kadar onun niteliği de önem arz etmiştir. Her inanç ve kültür toplumu, kendi ilkelerini koymuş, bu doğrultuda gıda felsefelerini oluşturmuştur. Gıda maddeleri konusunda İslam dini hassas olmuş ve Kur'an-ı Kerim'de buna dair geniş yer vermiştir. Onun helal ve sağlıklı olmasını şart koşmuştur. Özü itibariyle helal olmayan, insanın akıl, ruh ve beden sağlığına aykırı olan tüm hayvansal ve bitkisel gıdaları yasaklamıştır. Bu manada yasak olanların sayısı, serbest olanlara göre daha az olduğundan onları bize Kur'an'da tek tek saymıştır. Araştırmamız giriş, üç bölüm ve sonuçtan oluşmaktadır. Giriş bölümünde araştırmanın konusu, yöntemi, sınırlıkları ve kaynakları hakkında kısa açıklama yaptık. Sonra da konuyla ilgili helal, haram, gıda ve bununla ilişkili kavramları açıkladık. Birinci bölümde konumuz ile ilgili kavramsal çerçeve oluşturduk. Bu bakımdan helal, haram, mekruh, rics, gıda gibi temel kavramları sözlük ve ıstılahi tanımlarını yaptık ve örnekleri ile açıkladık. Ondan sonra İslam'ın helal rızka verdiği önemden bahsederek helal ve haramla ilgili temel prensiplere yer verdik. İkinci bölümde gıdalarda helal ve haramı tespit etme yolları hakkında geniş bilgi verdik. Orada birinci kaynak olan nasslarda ve ictihad yoluyla tespit etme yollar hakkında bilgi sunduk. Ayrıca konumuz ile ilgili tayyıbat ve habais kavramını fıkıh mezheplerinin anlam ve yorumlaramara geniş yer verdik. Son bölümde ise gıdaların kaynağı açısından ele aldık. Onların hayvansal, bitkisel gıdalar ve içecekler başlığında tertip ettik. Bu gıdaların mezheplere göre haram olduğuna ittifak edilenler, helal olduğuna ittifak edilenler ve helal ve haramlığı hakkında ihtilaf edilener olarak ayırdık ve tartışmalar ile kendi kanatimize yer verdik Sonuç ve değerlendirmede bunların tahlilini ve analizini yaptık."
