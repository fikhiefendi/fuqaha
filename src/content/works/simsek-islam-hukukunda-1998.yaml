abstract: "ÖZET İslâm Ceza hukukunda cezalar, ağırlıklı olarak bedeni cezalar tarzında uygulanmaktadır. Seküler Ceza hukukunda ise bedeni cezalar zamanla gittikçe azalma göstermiş hemen hemen kalkmaya yüz tutmuş, bunun yerini ağırlıklı olarak hürriyeti bağlayıcı cezalar almıştır. Cezaların ne şekilde olmasının daha doğru ve faydalı olacağı ceza felsefesinin tartışma konusudur ve bu konu hâlen tartışılmaktadır. İslâm Ceza Hukuku, dinin, malın, canın, neslin ve ırzın muhafazasına önem vermiş, bunlara tecavüzü suç saymıştır. Öncelikli olarak suçu önlemeye çalışmış, suça teşvik edici unsurları ortadan kaldırmış, fakat buna rağmen suç işlenmişse ceza müeyyidesini uygulamıştır. İslâm Ceza hukuku, suç ve ceza da kanunilik, şahsilik, umumilik prensiplerini Seküler Ceza Hukukundan çok daha önce getirmiştir, suç ve cezada keyfiliği ortadan kaldırmıştır. Suçta kesinlik aramış ve bunu da açık şartlara bağlamıştır. Şüpheli durumlarda cezayı uygulamamış, hatta hâkimleri, şüphe bularak cezayı uygulamamayı teşvik etmiştir, yanlış yere ceza vermektense, yanlışlıkla suçların affını tercih etmiştir. İslâm Ceza Hukukunda suçun unsurlarının gerçekleşmesinde şüpheye yer olmayan bir kesinlik aranmıştır. İspat vasıtaları olarak sadece şahitlik ve ikrar müesseselerini kabul etmiş ve azami derecede titizlik göstermiştir. Şahitliğin kabulü için en az iki adil erkeğin, yapılan hırsızlığı şüpheye mahal bırakmayacak şekilde bildirmeleri gerekmektedir. İkrar ise hırsızın kendi suçunu bildirmesidir ki, kişi daha sonra ikrarından dönerse veya baskı altoda ikrar etmişse bu ikrarı geçerli olmamaktadır. Bunların yanında hırsızlık suçunun oluşması için cezai ehliyete haiz bir kimsenin; alma fiilini tam gerçekleştirmiş olması, kıymetli bir malı çalması, korunmuş bir yerden gizlice çalması, çalma kastının olması, başkasına ait bir malı çalması gibi şartların da gerçekleşmesi gerekir. Bütün bunlar gerçekleşmiş, hırsızlık suçu oluşmuşsa, ibret verici ve önleyici olması için el kesme cezası vererek bu suçu cezalandırmıştır. Seküler hukukta hırsızlık suçuna ise hapis cezası verilmektedir, yani hürriyeti bağlayıcı ceza verilmektedir. vuHer iki hukukun, hırsızlık suçuna verdikleri cezalar birbirinden tamamen farklı olmasına rağmen, bu suç için aradıkları unsurların; alma fiili, başkasına ait bir malı rızası olmadan alma, çalman malın menkul mal olması, kötü niyetin olması vs. gibi..., büyük bir benzerlik gösterdiğini söyleyebiliriz. Bununla birlikte bazı farklılıklar da görünmektedir. Çalman malın belirli bir kıymette olması, korunmuş yerden çalma gibi unsurlar İslâm Ceza Hukukunda olup Seküler Ceza Hukukunda yer almamaktadır. Bu unsurlar büyük ölçüde cezanın verilmesini önleyici nedenlerdir. Bir diğer husus da şudur; İslâm Ceza Hukukunda ceza verilebilmesi için ispat üzerinde hassasiyetin Seküler Ceza Hukukuna göre daha fazla oluşudur. Bütün bunlardan anlıyoruz ki, İslâm Ceza Hukukunda hırsızlık suçunun gerçekleşmesi Seküler Ceza Hukuka nazaran daha zordur. Sonuç olarak; İslâm Ceza hukuku ve bunun alt birimi olan hırsızlık suçu ve cezası konusunda, ilgili hükümlerin, cezanın uygulanması için gerekli şartların daha doğru ve tarafsız bir şekilde anlaşılmasının gerekli olduğunun bir kez daha görülmüş olduğu kanaatindeyiz. vuı"
