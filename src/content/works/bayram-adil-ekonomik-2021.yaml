abstract: "İslam iktisadı 1980'li yıllardan sonra özellikle İsmail Raci Fârûkī'nin öncülük ettiği bilginin İslamileştirilmesi programı ile iktisat literatüründen de faydalanarak İslam ekonomisinin prensiplerine uyan ekonomik modeller üzerinde çalışmalar yapmaktadır. Bu bağlamda 1990 yılının başlarında kamuoyuna duyurulan Adil Ekonomik Düzen (AED) ekonomik modeli Türkiye'de geliştirilen yegâne İslam ekonomisi modelidir. Hesaplanabilir genel denge modeliyle AED modellenmiştir. Kapalı ekonomi varsayımı altında ilk önce AED'nin esasını oluşturan ve üretim fonksiyonunda bölüşüm kriterini yerine getiren üretim fonksiyonu oluşturulmuştur. Üretim fonksiyonu olarak Cobb-Douglas fonksiyonu kullanılmıştır. Daha sonra AED'nin talep kısımlarına ilişkin hanehalkarı, devlet, vakıf ve yatırım taleplerine ilişkin fonksiyonel formlar olarak modellenmiştir. Hesaplanan genel denge çözümünde devletin sadece üretime katkısı nispetinde gelir elde ettiği ve faizin olmadığı bir adil ekonomik düzenin varlığı gösterilmiştir. Daha sonra dört simülasyon yapılmıştır. İlk seneryoda, teknik ilerleme durumu ele alınmıştır. Teknik ilerleme olduğunda toplam üretim, hanehalkı reel gelirleri, devlet reel gelirleri, vakıf sektöründe toplanan fonlar ve tasarrufların arttığı gözlenmiştir. İkinci seneryoda devletin müdahalesine bakılmıştır. Devlet faktörü miktarının arttırılması üretilen çıktı miktarlarını arttırmıştır. Üçüncü senaryoda müteşebbislerin ekonomideki önemi incelenmiştir. Müteşebbis faktörünün elindeki sermayenin arttığı durumlarda ekonominin genişlediği gözlenmiştir. Son seneryoda ise hanehalkı yardım oranları arttığında toplam üretim seviyelerinde bir değişiklik olmadığı görülmüştür. Vakıf gelirleri artmış artan bu gelir ihtiyaç sahibi hanehalkına sevk edilmektedir."
