abstract: "Burhâneddin İbrahim el-Halebî'nin telif ettiği Tuhfetu'l-Ahyar ala'd-Dureri'l-Muhtar eserinin Kefâet babından Talak babına kadar olan kısmının tahkik ve incelemesi. Elimizdeki bu çalışma; İbrahim b. Mustafa b. İbrahim el-Halebî el-Mezari'nin Hanefi fıkhında telif ettiği“Tuhfetu'l-Ahyar ala'd-Dureri'l-Muhtar”el yazması eserinin bilimsel bir incelemesidir. Bu eser bir grup ilim talebesi arasında paylaşılarak çalışılmıştır. Bana ayrılan kısım ise“Kefâet”bölümünden başlamakta ve“hasta kişinin talak işlemi”bölümünde sona ermektedir. Şeyh Burhâneddin el-Halebî, başkenti İstanbul olan Osmanlı İmparatorluğu'nun on ikinci yüzyılda yaşayan büyük âlimlerinden birisidir. Et-Tuhfe eseri, ed-Durerü'l-Muhtar kitabı üzerine yazılmış ilk haşiyedir. Eser, müellifin yaşadığı dönem ve kısa bir dönem sonrası için büyük öneme sahiptir. Ancak daha sonraki dönemlerde kitaptan bahsedilmez olmuştur. Allah Teâlâ, bir grup ilim talebesinin ortaya koyduğu bu çalışma ile birlikte bu kitabın, faydalı eserler arasında yerini almasını nasip etti. Bu çalışma, ilmi ve kamu kuruluşlarıyla İslam'a ve Müslümanlara yarar sağlamak ve hizmet sunmak üzere bu güzel ülkenin sağladığı imkân ve gayretler ile son dönemde Arap ülkelerinde yaşanan çalkantılar nedeniyle fazilet sahibi seçkin bir grup ilim insanınınTürkiye'ye taşınmasıyla ortaya konulmuştur. Böyle hassas bir aşamada bu çok önemli bir değişim sayılır ki bu durum Türkiye'nin daha önceden olduğu gibi Allah'ın izniyle ümmetin liderliği konusundaki rolünü tekrar geri kazanmasının temellerini oluşturmaktadır. Benim bu çalışmadaki üstlendiğim role gelince; el yazması eserin karşılaştırılmasından ibarettir. El yazması eser, önemli üç nüshası ile karşılaştırılmıştır. Bunlardan ikisi esas alınan orijinal nüsha ile ve müellif Timurtaş'ın tercümesi ve Tenviru'l-Ebsar'ın metni ve el-Haskefi'nin tercümesi ve onun şerhi ed-Durerü'l-Muhtar ala Metni Tenviru'l-Ebsar ile karşılaştırılmış ve aralarındaki farklara işaret edilmiştir. Bununla beraber et-Tuhfe eserinin müellifi İbrahim el-Halebî ve haşiyesi tanıtılmış, eserde izlediği yol ve yöntemler açıklanmış ve ayrıca itimat ettiği kaynaklar izah edilmiştir. Çalışmanın sonunda ise ulaşılan sonuçlardan bahsedilerek öneri ve tavsiyelere yer verilmiştir."
