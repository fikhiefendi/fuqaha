abstract: "Kur'ân-ı Kerîm'in lafzî yapısının derinliği, anlam dünyasının doğru anlaşılabilmesi için Arap dili ilimlerinin incelikli bilgisini zorunlu kılmaktadır. Bu bağlamda, özellikle nekira (belirsiz) isimlerin umum (genellik) ifade etme özelliği, hem nahiv hem tefsir hem de usûl literatüründe güçlü kaidelerle ortaya konulmuştur. Ancak Arapçada normalde nefiy, nehiy, şart, istifham ve umum mukteza bağlamlarında gelen nekiralar umum ifade ettikleri halde, Türk ilim dünyasında bunlardan sadece nefiy bağlamında gelen nekiraların umum ifade etttiği gerçeği şöhret bulmuş, diğerleri ihmal edilmiştir. Meallerde, üzerlerindeki tenvin dikkate alınarak nekira kelimelere“bir şey”,“bir kimse”gibi daraltıcı anlamların verilmesi, ilgili âyetlerin orijinal bağlamının yeterince yansıtılamamasına neden olmuş, hatta bazen anlam sapmalarına yol açmıştır. Bu çalışma, Kur'ân'daki nekira kelimelerin dilsel bağlamlarını esas alarak, onların umum ifade edip etmediklerini hem teorik hem de uygulamalı olarak incelemeyi amaçlamaktadır. Nefiy, nehiy, şart, istifham ve umum mukteza gibi bağlamlarda nekiranın kazandığı anlam kapsamı tahlil edilmiş, bu bağlamlarda gelen nekira kelimelerin umum manalarının meallere nasıl yansıtıldığı kuranmeali.com sitesinde yer alan 48 Türkçe meal üzerinden karşılaştırmalı olarak analiz edilmiştir. Araştırma bulguları göstermektedir ki, Kur'an'ın orijinal metninde umum ifade eden birçok yapı, Türkçe meallerde eksik ya da sınırlı biçimde aktarılmıştır. Yapılan incelemelerde ayetlerin kimi zaman %80-%90'lara varan oranlarda nekira ismin umûm ifade ettiği dikkate alınmadan tercüme edildiği tespit edilmiştir. Bu durum sadece semantik bir eksiklik değil, aynı zamanda ilahî hitabın muhataba yönelik yönlendirmesinin de zayıflaması anlamına gelmektedir. Meal çalışmalarında, nekira kavramının yalnızca dil bilimsel bir mesele değil, aynı zamanda anlamın inşasında belirleyici bir unsur olduğu gerçeği göz önünde bulundurulmalıdır. Bu nedenle, klasik dil ilimlerinin sağlam temelleri üzerine inşa edilmiş, çok katmanlı ve bağlamsal analizlere dayanan meal anlayışlarının geliştirilmesi elzemdir. Bundan sonra yazılacak meallerde benzer hatalara düşülmemesi için, 1. İlgili nekira kelimenin içinde bulunduğu bağlam dikkatle incelenmeli, umum ifade edip etmediği dikkatle araştırılmalıdır. 2. Kur'an'ın dil yapısı itibariyle sık sık itirazî cümlelere yer verdiği dikkate alınmalı, nekira kelimenin bağlamı tespit edilirken bu gerçek dikkatten kaçırılmamalıdır. 3. Lugavî tefsirlerden ve i'rabu'l-Kur'ân türü eserlerden yararlanarak umum ifade eden nekira isimlerin doğru şekilde tespit edilmesi için gayret edilmelidir. 4. Daha önce yazılmış meallerden istifade ederek umum ifade eden nekiraların tesptinde onlardan yararlanılmalıdır."
