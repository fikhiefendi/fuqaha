abstract: "Bu araştırma, İmam Gazali ve İbn Teymiyye'ye göre makasıd içtihadının gerçekliğini açıklamak ve bunları iki ana eksen üzerinden karşılaştırmakla ilgilidir, şöyle ki: 1. Makasıd içtihadının esasları ve bunların her birine göre kontrolleri ve bunların karşılaştırılması. 2. Her ikisine göre makasıd içtihadının özellikleri ve bunların karşılaştırılması. Çalışma şu şekilde üç bölüme ayrılmıştır: Birincisi: Giriş bölümü: iki imam Ebu Hamid el-Gazali ve İbn Teymiyye'nin tanıtılması ve amaçlanan içtihad ve yöntemlerinin tanıtılması: Giriş bölümünün dört bölüm halindedir. İlk olarak İmam Ebu Hamid Gazali'nin tanıtılmasını ele aldım. İkinci bölümde İmam Takiyüddin İbn Teymiyye'nin tanıtılmasını ele aldım. Üçüncüsü ise genel olarak içtihadın tanımı, türleri ve şartlarından bahsettim. Daha sonra makasıd içtihadının tanımı ve yöntemlerinin açıklandığı dördüncü bölüm yer aldı. İkincisi: Birinci bölüm: İki imama göre makasıd içtihadının esasları, kontrolleri ve uygulamaları ve aralarındaki karşılaştırma: Birinci bölüm dört bölümden oluşmaktadır: İlkinde“iki imama göre masalih-i mürsele ve uygulamaları”konusunu ele aldım: Gazâlî'ye göre bunun anlamı“şeriatın amacını korumak”olarak ve onun için bir argüman olduğu ortaya çıktı. Kur'an, Sünnet ve icmâ'dan sayısız ve çok delillerle bilindiği ve belirli bir kökene bağlı olduğundan değil. Zaruret, kesinlik ve küllilik olarak üç şart belirledi. Kesin olmanın ve onu beyanının esası olarak değil, tartışmasız bir delil olarak değerlendirmenin şartı olarak görürüz. İbn Teymiyye ise“faydalı olan her şeyin olduğunu ve şeriat'ta bunu reddeden hiçbir şeyin bulunmadığını”savunur. İslam Şeriatının maslahatı elde etmek ve kötülüğü engellemek üzerine kurulduğunu, nassa, genel veya külli bir kurala aykırı olmadığı sürece dünyada ve dinde faydalar sağladığını savunur. İki imamın, mesalih-i mürseleyi Şeriat hukukunun genel hedeflerine göre değerlendirerek ve bunlara riayet ederek tanımlama konusunda fikir birliğine vardığı ve Kur'an'a, Sünnet'e veya İcma'ya aykırı olduğunda masalih-i mürseleyi uygulamama konusunda ittifak ettikleri görülmektedir. Mesalih-i mürseleyi işletme konusunda teorik olarak farklılık gösterseler de fer'i konularda neredeyse hiçbir etkisinin olmadığını gördüm. İkinci bölümde“İki İmama Göre İstihsan ve Uygulamaları”konusunu ele aldım: Gazâlî'nin İstihsânı reddettiği açıkça ortaya çıktı. Bir yandan, güvenilir Şeriat delillerine başvurmadan Şeriat hükmünü çıkarmanın bir yoludur. İbn Teymiyye ise bunu söylemiş ve bunu, sebebi etkili farklılığa bağlamak olarak tanımlamıştır. Gazâlî bunu söylerken onunla aynı fikirdedir, ancak bunu istihsan olarak nitelendirmemektedir. İbn Teymiyye bunu“istihsan”olarak adlandırmakta hiçbir sakınca görmezken bu araştırma, anlaşmazlığın fıkhî konulara etkisi olmayan teorik bir anlaşmazlık olduğunu ortaya koydu. Üçüncü bölümde ise“iki imama göre sedd-i zerâî ve uygulamaları”konusunu ele aldım: Gazâlî, sedd-i zerâî ilkesinin geçerliliğini reddetmiş ve uygulanmasını geçersiz kılmıştır. Ancak çoğu durumda onun bunu haram bir mesele olarak değil, bir takva meselesi olarak gördüğünü gösteren örneklere rastlamak mümkündür. İbn Teymiyye ise, mefsedet ve haramlara götüren vesileleri ortadan kaldıran sedd-i zerâî kuralını çalıştırmıştır. Bunu dört kategoriye ayırdı: Çoğu zaman yasak olana yol açan, daha sonra yol açması muhtemel olan ya da olmayan, ancak doğası gereği yol açmaya meyilli olan, sonra da bazen yasak olan ve hiçbir faydası olmayan bir şeye yol açan şey. Ona göre bu üç kategori haramdır ve sedd-i zerâî işletilir. Dördüncü kategori ise bazen mefsedete götüren, faydası zararından fazla olandır ve burada zerianın kullanılır. Araştırma, iki imamın sedd-i zerâî konusunda gerçek bir anlaşmazlık içinde olduğunu ortaya çıkardı, en iyisini Allah'ın bilir. Dördüncü konuya gelince,“iki imama göre örf ve uygulamaları”konusunu ele aldım: Örfün tanımını Gazâlî'nin usûl kitaplarında bulamadım, ancak pek çok fıkıh eserinde örften ve bunun delillerinde bahsettiğini buldum. İbn Teymiyye ise bunu şöyle tanımlıyor:“İnsanların dünya hayatında alıştıkları ve ihtiyaç duydukları şeyler”. Bunun dikkate alınabilmesi için şeriatta gerek Kur'an'da, Sünnet'te, icma'da, veya dilde bir tanımının olmamasını şart koşmuştur. Uygulamalardan Gazzâlî ve İbn Teymiyye'nin örf ve adetlerde uygulanması konusunda anlaştıkları ancak taabbudi konularda bunu yapmadıkları anlaşılmaktadır. Üçüncüsü: İkinci Bölüm: İki imamın makasıd içtihadının özellikleri, uygulamaları ve ikisinin karşılaştırması: Üç bölümden oluşmaktadır: Birinci bölümde“iki imama göre gerçeklik fıkhının dikkate alınması ve uygulamaları”konusunu ele aldım. İkincisinde“iki imama göre sonuçların dikkate alınması ve uygulamaları”konusu ele alındı. Üçüncüsünde ise“iki imama göre öncelikler fıkhının dikkate alınması ve uygulamaları”konusunu ele aldım. Bu araştırma, gerçekçi ve ileriye dönük bakış açısının, iki imamın siyasi fetvalarında, imamet ve halifelik meselesine ve şartlarına, zalim imamın azledilmesi veya ona isyan edilmesi meselesine bakışlarında açıkça ortaya çıktığını göstermiştir. İbn Teymiyye'de olduğu gibi, emirlerin kastedilen anlamı, İslam halifeliğinin gerekliliği meselesi ve zalimin işlevi meselesi gibi konularda da İbn Teymiyye'de hükümdar, otoriteye itaat meselesi ve bu konuya ve diğer birçok konuya vurgu yapıyor. Bu araştırma, aralarında gerçekçi ve ileriye dönük bakış açısında açık bir benzerlik olduğunu, aralarındaki fıkhi konularda fetva farklılığı sayılan şeyin aslında görüş birliği olduğunu ortaya koydu. Ancak bu ihtilaf, iki imam arasındaki -Allah onlara rahmet etsin- zaman, mekan ve ortam farkından kaynaklanıyordu. İki imam aynı zamanda dengeler fıkhını dikkate alma ve şeriat'ın maslahatı gerçekleştirmek ve mükemmelleştirmek, kötülükleri engellemek ve azaltmak için geldiği ve iki iyinin daha iyisi ve iki kötünün en azını daha seçme konusunda da fikir birliğine vardılar. İbn Teymiyye, yasak bir eylemin daha yüksek bir fayda amacıyla gerçekleştirilmesi konusunu tamamen maslahat perspektifinden tartışan tek kişiydi. Emrolunanları yapmanın, yasakları terk etmekten daha hayırlı ve daha üstün olduğuna, emredilenleri ihmal etmenin ise yasakları yapmaktan daha büyük olduğuna inanır. İbn Teymiyye -Allah ona rahmet etsin- kötülüğün, kendisinden daha kötü olanı defetmek ve ondan vazgeçildiğinde daha hayırlı olana ulaşmak için hoş görülebileceğine ve bu olmadan bu başarının sağlanamayacağına inanmaktadır. Bu araştırma ayrıca önceliklere bakma, helal ve haramları veya iyilik ve kötülükleri üst üste derecelere ayırma ve bu farklılığı değerlendirme konusunda aralarındaki benzerlik de ortaya konmuştur."
