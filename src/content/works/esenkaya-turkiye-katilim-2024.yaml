abstract: "Risk unsuru insanların hayatlarında ve kurumların iş akış süreçlerinin neredeyse tamamında bulunarak önemli finansal kayıplara yol açabilmektedir. İnsanlar, söz konusu risklerin etkilerini azaltmak için sigortacılık faaliyetlerini geliştirmiştir. İslami finansal ekosistem içerisinde sigortacılık taleplerine karşılık verilebilmesi için katılım sigortacılığı faaliyetleri gelişim göstermiştir. Çalışma ile öncelikle İslami finansal ekosistemin önemli paydaşlarından biri olan katılım sigortacılığı faaliyetleri ve uygulama modelleri ele alınmıştır. Katılım sigortacılığının uygulama ve mevzuat yapısına ilişkin gelişmeler incelenerek sektör analizi ile sistemin iyileştirilmesi için önemli konular tespit edilmiştir. Çalışmada nitel analiz yöntemi kullanılmıştır. Katılım sigortacılığı sektöründe yer alan altı farklı şirket temsilcisi ile görüşme yapılmıştır. Katılım sigortacılığı uygulamaları, mevzuat yapısı, farkındalık düzeyi ve sektörel gelişimi hususlarında hazırlanan sorular katılımcılara yöneltilmiştir. Elde edilen veriler neticesinde henüz tam oturmayan mevzuat yapısı, uygulama modeli konusunda yapılan değişiklikler ve belirsizlikler, toplumun sigorta konusunda yeterli düzeyde bilince sahip olmaması gibi konular sistemin temel problemleri olarak belirlenmiştir. Literatür araştırmalarında akademik çalışmaların daha çok tekafül modeli üzerine gelişim gösterdiği görülmektedir. Fakat Türkiye'de mevcut sistemde tekafül modeli uygulanmamaktadır. Sektörel gelişimin sağlanmasında mevcut uygulamaların ve ihtiyaçların doğru belirlenmesi önem kazanmaktadır. Bu sebeple çalışmada sistemin gelişmesi ve sektörün büyümesi için öncelikle var olan uygulamaların anlaşılması esası temel alınmıştır. Çalışmada yer alan sektör analizi ile bunun sağlanması ve katılım sigortacılığının gelişimine katkı sunulması beklenmektedir."
