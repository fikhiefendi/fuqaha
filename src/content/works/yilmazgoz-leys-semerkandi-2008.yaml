abstract: "İslam'ın VII. yüzyılda Arap Yarımadası'nda doğmasından itibaren geçen üç asır boyunca İslam Hukuku müstakil bir ilim niteliği kazanmış, çeşitli hukuk ve mezhep ekolleri meydana gelmiştir. Bu ekollere mensup hukukçular, şer'i delillerin kaynaklar hiyerarşisindeki yer ve değerleri ile bu delillerden hüküm çıkarma yöntemlerinde farklı yollar takip etmişlerdir.İslamî ilimlerin doğuş ve ilk gelişim süreçlerinin yaşandığı dönemde hukukçuların bu ihtilaflarına fıkhî meseleler zikredilirken yer verilmiştir. Daha sonra bu ihtilaf ve farklılıklar eserlerde müstakil olarak yer almaya başlamıştır. Ebu'l-Leys es-Semerkandî'nin, tezin temel konusunu teşkil eden Muhtelifu'r-rivâye adlı eseri de bu literatür içinde yer almaktadır. Eserde, Hanefi mezhebi literatüründe dağınık olarak bulunan mezhep imamlarının birbirleri ile ihtilaflı görüşleri, belirli bir sistematik içinde ele alınmıştır. Klasik fıkıh metinlerindeki başlıklar esas alınmakla birlikte her bab başlığı altında ihtilaf eden fakihler arasında bir sınıflandırmaya gidilmiştir.Eserde Hanefi imamlarından Ebu Hanife, Ebu Yusuf, İmam Muhammed ve Züfer'in görüşlerine yer verilmekle birlikte, Malikî ve Şafiî mezhebinin kurucu imamları olan Malik ve Şafiî'nin de görüşleri yer almaktadır.İhtilaflı meselelerde tarafların görüşleri zikredildikten sonra görüşlerin delillerine yer verilmiş ve tercih edilen görüş karşı tarafın delillerine karşı savunularak zikredilen delillere cevap verilmiştir.Aynı zamanda ictihad alanı olan fakihler arasındaki ihtilafların bir çok sebebi vardır. Eserde zikredilen ihtilaf sebeplerini başlıca nasslara dayalı ve nassların dışındaki sebeplere dayalı olmak üzere ikiye ayırmak mümkündür.Müellif, ihtilaflar gibi dağınık ve anlaşılması zor olan meseleleri bir araya toplamış, sade ve akıcı bir üslup kullanarak meselelerin daha kolay öğrenilmesini sağlamıştır. Hilafiyat alanında yazılan ilk ve en önemli kitaplar arasında yer alan eserin dünyanın dört bir yanındaki kütüphanelerde çeşitli nüshalarının bulunuyor oluşu ve birçok eserin Muhtelifu'r-rivâye'ye yaptığı atıflar bu eserin fıkıh ve hilaf literatüründeki değerini ortaya koymaktadır."
