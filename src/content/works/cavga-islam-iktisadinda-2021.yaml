abstract: "Borçlanma, insan hayatında sıkça karşılaşılan bir olgudur. Günümüz finansal araçlarının borçlanma davranışlarını karmaşıklaştırması, insanların faize düşme riskini artırmaktadır. Faizin neden olacağı sosyal, iktisâdî ve mânevî zararları temelinden önleyebilmek için İslam toplumunun kendine has çözüm yöntemleri ile hareket etmesi gerekmektedir. Bu çalışma ile İslam toplumunun borçlanma ve infak konusundaki en özgün ve önemli aracı olan“karz-ı hasen”üzerinde durularak bu güzel davranışın yaygınlaştırılmasına katkı sağlanması amaçlanmaktadır. Bu sayede, çok yönlü faydalar barındıran İslam iktisadı araçlarından biri kullanılarak faiz gibi çok yönlü zararlar içeren bir olgu ile nasıl mücadele edilebileceğine ve sosyal adaletin tesisine nasıl katkı sağlanabileceğine dair örnekler sunulmaya çalışılacaktır. Betimsel bir analiz yöntemi kullanılan çalışmada, öncelikle, karz-ı hasen sürecinin Kur'an ve Sünnet ekseninde sağlıklı bir şekilde yönetilebilmesi için dikkat edilmesi gereken konulara ve karz-ı hasenin ilişkili olduğu iktisâdî kavramlara değinilecektir. Karz-ı hasenin dar ve geniş anlamları çerçevesinde asr-ı saadetten günümüze kadar hayata geçirilmiş karz-ı hasen müessesesi örneklerine yer verilecek ve bunların sağladığı faydalardan bahsedilecektir. Anadolu'daki sadaka taşı uygulamasından hareketle yapılacak model önerisi üzerinden karz-ı hasen müesseselerinin işletilmesinde karşılaşılacak riskler ve çözüm önerileri tartışılacaktır. İslam iktisadı ilkelerine uygun olarak mikro düzeyde hayata geçirilecek başarılı örneklerin, yapılacak mevzuat düzenlemeleri ile daha büyük ölçekte işletilebilmesinin mümkün olacağı ve bu müesseselerin faizle mücadelede önemli bir görev üstleneceği düşünülmektedir."
