abstract: "Tokat, köklü tarihsel geçmişi ve Osmanlı döneminde sahip olduğu stratejik konum sayesinde Orta Karadeniz Bölgesi'nin önemli merkezlerinden biri olarak öne çıkmıştır. Osmanlı idari teşkilatı içerisinde Sivas Eyaleti'ne bağlı bir şehir olarak yer alan Tokat, ticaret yollarının kesişim noktasında bulunması sebebiyle hem ekonomik hem de idari açıdan dikkat çekici bir gelişim göstermiştir. Bu yönüyle şehir, Osmanlı taşra yapısının anlaşılması bakımından önemli bir örnek teşkil etmektedir. Şehir tarihçiliği çalışmalarında, dönemin idarî, ekonomik ve toplumsal yapısını birinci elden yansıtan şer'iyye sicilleri ise vazgeçilmez kaynaklar arasında yer almaktadır. Bu çalışmada, M. 1807–1808 (H. 1222–1223) tarihli 11 no'lu Tokat Şer'iyye Sicili'nin 1. ve 51. varakları arasında yer alan kayıtlar transkribe edilerek incelenmiştir. Söz konusu sicil, içerdiği belge türleri ve sunduğu veriler bakımından Tokat'ın idari ve sosyo-ekonomik yapısının ortaya konulmasına imkân tanımaktadır. Özellikle tereke kayıtları; bireylerin mal varlıkları, aile yapıları, borç-alacak ilişkileri ve miras hukukunun işleyişi hakkında ayrıntılı bilgiler sunmaktadır. Bunun yanı sıra fermânlar, buyuruldular ve berâtlar; taşra yöneticilerinin tayin süreçleri, vakıf idaresi ve halkın şikâyet mekanizmaları üzerinden devlet-halk ilişkilerini anlamaya katkı sağlamaktadır. Çalışma kapsamında sicilde yer alan belge türleri ayrı başlıklar altında ele alınmış, içerikleri analiz edilerek tarihsel bağlam içerisinde değerlendirilmiştir. Hüccet ve tereke kayıtları aracılığıyla Müslim ve gayrimüslim unsurların sosyal ve ekonomik durumları karşılaştırmalı olarak incelenmiştir. Bu yönüyle 11 no'lu Tokat Şer'iyye Sicili, yalnızca hukuki bir kayıt defteri olmanın ötesinde, dönemin şehir yaşamına dair çok boyutlu ve zengin veriler sunan önemli bir kaynak niteliği taşımaktadır. Bu çalışma ile Osmanlı taşra yönetiminin idari, hukuki, mali ve sosyal boyutlarının ortaya konulması; Tokat'ın toplumsal ve ekonomik yapısına dair özgün tespitler yapılması amaçlanmıştır. Ayrıca, Osmanlı arşiv kaynaklarının bilimsel yöntemlerle değerlendirilmesine yönelik bir örnek sunularak şehir tarihi ile Osmanlı sosyal ve ekonomik tarihi alanındaki çalışmalara katkı sağlanması hedeflenmiştir."
