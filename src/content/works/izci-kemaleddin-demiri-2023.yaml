abstract: "Kemaleddîn ed-Demîrî'nin Hayâtü'l-Hayevân isimli eserini dikkatle inceleyen kimse, onun sadece bir zooloji kitabı olmadığını açıkça görecektir. Çünkü eserin dikkat çekici birçok yönü vardır ve eserdeki konular farklı birçok ilim dalıyla da yakından ilintilidir. Demîrî, birçok ilim dalına vâkıf olmasının yanında çok iyi bir fakihtir. Demîrî'nin Hayâtü'l-Hayevân eseri hacimli bir zooloji kitabı olmasının yanında, alanında geniş mâlûmât barındıran bir fıkıh kitabı olma özelliğine de sahiptir. Eserde hayvanlardan hangilerinin etlerinin yenilmesinin helâl olduğuna, hangilerinin etlerinin yenilmesinin helâl olmadığına dâir bilgilerin yanında, haram olan hayvanların avlanması, hayvanın satışının yapılması, hayvan eti yemekle abdestin bozulup bozulmaması, hayvanın ağılında namaz kılmak, hayvanların itlâfı, hayvanların zekâtı gibi birçok konu fıkhî yönden ele alınmıştır. Fıkıh kitaplarında eti helâl olan ve olmayan hayvanlar konusu genel ilkeler hâlinde ele alınmış, belirli hayvanlar örnek verilerek konu fazla detaylandırılmamıştır. Çalışmanın konusu olan Demîrî'nin Kitâbü'l-Hayevân isimli eserinde, klasik fıkıh kaynaklarında ismine yer verilmemiş birçok hayvan mevzubahis edilerek konu detaylı bir şekilde ele alınmıştır. Bu bakımdan çalışmanın başta sosyal ve beşeri bilimler olmak üzere İslam fıkhı alanda önemli bir boşluğu dolduracağı düşünülmektedir."
