abstract: "Bu çalışma, Endülüs Batı İslam medeniyetinin siyasi istikrarsızlığın yaşandığı h. 404-497 yıllarında yaşamış olan kadı, Mâlikî mezhebinin fakihi ve muhaddis kimliği ile tanınan İbnü't-Tallâ el-Kurtubî ve Akziyetü Rasûlillâh isimli eserini ele almıştır. Mezkûr dönemde her ne kadar siyasi alanda bir istikrar elde edilememişse de ilim ve eğitim kendi mecraında ilerlemiş ve İbnü't-Tallâ'nın yaşadığı Kurtuba şehri ilim merkezi haline gelmiştir. İbnü't-Tallâ, Kurtuba'da doğup büyümüştür. Kurtuba'nın ve oraya ilim seyahatinde bulunan büyük âlimlerden istifade etmiştir. İlmî gelişimini tamamlayan İbnü't-Tallâ, İmam Mâlik'in el-Muvatta eseri başta olmak üzere pek çok eserin âlî isnadına sahip olmuştur. Bu nedenle kendisi ilim merci haline gelmiştir. Kurtuba Ulu Camii imam hatipliği, kadılık ve şûrâ görevlerini üstlenmiştir. Bununla birlikte pek çok öğrenci yetiştirmiş ve eser vermiştir. Bu eserlerden, hadis alanında otorite kabul edilen pek çok muhaddisin övgüsüne nail olan Akziyetü Rasûlillâh isimli çalışması günümüze ulaşmıştır. Müellif bu eseri, dönemin güncel fıkhî meselelerine cevap olacak mahiyette Hz. Peygamber (s.a.v.)'in ahkâm hadislerini derlemeyi hedeflemiştir.“Akziye”türünde daha önceden temel hadis kitaplarında kitap bölümleri ve İbn Ebi Şeybe'nin el-Musannef\"inde hususi bölümüyle kısmi çalışmaların yapıldığı alanda müstakil olarak ilk çalışmanın İbnü't-Talla'nın eseri olması önemlidir. Eserdeki mükerrer rivayetleri çıkararak muhtasar hale getirerek, hadislerin sıhhat bilgileri hakkında bilgiler verilmiştir. Tablo halinde verilen bilgiler, okuyucuya kolaylık sağlaması açısından önemlidir."
