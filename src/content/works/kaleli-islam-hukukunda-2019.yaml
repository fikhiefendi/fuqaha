abstract: "Sağ ve tam doğduğu andan itibaren, zengin- fakir, suçlu-suçsuz, sağlıklı-engelli, kimseli- kimsesiz ayrımı yapmadan bütün çocuklar reşit oluncaya kadar bakım ve gözetime muhtaçtır. Bu ilgi ve şefkatin gösterilebileceği en uygun yer aile ortamıdır. Ancak savaşlar, afetler, kıtlık, hastalık, ölüm, göç gibi nedenlerle birçok çocuk aile ortamından bazen de tüm yakınlarından ayrı yaşamak durumunda kalabilmektedir. Peki bu durumlarda çocuğun bakım ve gözetimi nasıl sağlanacaktır? İslam Hukuku bu konuya nasıl bir çözüm getirmiştir? Günümüzde menfi yönleri tespit edilen kurum bakımı yerine, koruyucu aile uygulaması ön plana çıkmaktadır. Ancak koruyucu aile uygulamasının toplumumuzda daha derin bir şekilde ele alınması gerekmektedir. Çocuklara haklarını çok erken çağlarda vermiş olan İslam Hukuku'nun klasik anlayışında koruyucu aile, kavram olarak yer almasa da fiili olarak uygulamada görülmektedir. Kur'an-ı Kerim'deki ayetler ve Sünnet'teki uygulamalar bize göstermektedir ki çocuğun sağlıklı gelişimi için en uygun yer, bir aile ortamıdır. Osmanlılar döneminde de bu sorun ihmal edilmemiş, koruyucu aile benzeri uygulamalar toplum tarafından benimsenmiştir."
