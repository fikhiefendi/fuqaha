abstract: "Çalışmada, sıfır reel faizle çalışan banka modelinin Dünya Bankası'nın gelir grubu sınıflandırmasına göre hangi ülkelerde daha uygulanabilir olduğunun tespit edilmesi amaçlanmıştır. Faiz, ödünç verilebilir fonlar ve para piyasalarını dengeye getirme, kapalı ve açık ekonomi dengelerini sağlama ve politika aracı olma rolleri ile kapitalist ekonominin temel dayanaklarından biri olmuştur. Ancak tasarruf için yüksek, yatırım için düşük faizin tercih edilmesi, faiz ve enflasyon oranları arasında sarmal ilişki oluşabilmesi, yüksek faizin baskı, bağımlılık ve sömürü aracına dönüşebilmesi ve dini hassasiyeti olan insanlar açısından sorun oluşturması gibi faizle ilgili bazı yapısal sorunlar bulunmaktadır. Kâr/zararın paylaşımı esasına göre çalışan katılım bankaları bu konuda her ne kadar bir alternatif olsalar da sektördeki payları %10'un altındadır. Bu durum, faizin taşıdığı sorunları taşımayan, uygulaması kolay, faize karşı hassasiyeti olan insanların kolayca ulaşabilecekleri yeni bir banka modeline ihtiyaç olduğunu göstermektedir. Çalışma böylesine önemli bir boşluğu doldurma ve literatüre kayda değer katkı yapma iddiası taşımaktadır. Çalışmanın dini dayanağını, İmam Ebû Yûsuf'un“Ödünç verilen para zaman içinde değer kaybına uğrarsa, borçlu vade sonunda değer kaybı kadar fazlalığı alacaklıya ödemelidir”fetvası ve günümüz İslam hukukçularının çoğunluğunun bu konuda görüş birliği içinde olmaları oluşturmaktadır. İslam hukukçularının bu konudaki değerlendirmeleri bireyler arası ödünç alıp verme ile sınırlı kalmışken, çalışmada ödüncün reel değerinin vade boyunca korunması uygulaması bankacılık sektörüne taşınmış olmaktadır. Çalışmada, düşük gelirli, alt orta gelirli, üst orta gelirli ve yüksek gelirli ülkelerin 1995-2024 dönemine ait reel faiz ile büyüme oranları arasındaki ilişkinin tespiti ile sonuca varılmak istenmiştir. Veriler önce kuadrant grafikte gözlemlenmiştir. Her iki verinin pozitif bölgede yoğunlaştığı, gelir düzeyi arttıkça ülkelerin genellikle sıfır reel faize yaklaştığı ve farklı reel faiz-büyüme kombinasyonlarının ortaya çıkabildiği görülmüştür. Reel faizle büyüme arasındaki ilişkiyi derinlemesine tespit etmek amacıyla parabolik model ve sıfır reel faizin (eşik değerin) altında ve üstünde reel faiz-büyüme ilişkisini yakalamak için threshold panel analizi yapılmıştır. Parabolik model bulgularına göre, reel faizle büyüme arasında ülke gruplarında genellikle anlamlı güçlü ilişki bulunamamış ve bu durumun büyümeyi faizin dışında başka faktörlerin etkilemesinden kaynaklanabileceği yorumu yapılmıştır. Threshold panel modeli bulgularında, özellikle yüksek gelirli ülkelerde reel faiz sıfırdan büyükse düştükçe büyümenin arttığı tespit edilmiştir. Buradan hareketle sıfır reel faizin yüksek gelirli ülkelerde daha kolay uygulanabileceği kanaatine varılmıştır. Modelin diğer bağımsız değişkenlerinden brüt sabit sermaye oluşumu ve dışa açıklığın büyümeyi desteklediği, işsizliğin alt-orta gelirli ülkelerde büyümeyi olumsuz etkilediği, bilimsel yayın sayısı ile büyüme arasındaki ilişkinin genellikle anlamsız olduğu tespit edilmiştir. Çalışmada sıfır reel faizle büyüme arasında anlamlı güçlü ilişki bulunamaması, analizde kullanılan büyüme verilerinin piyasa faizine göre oluşan veriler olmalarından, özellikle düşük ve alt orta gelirli ülkelerin tasarruf açığı, zayıf hukuki alt yapı ve siyasal istikrarsızlık gibi sorunlar yaşamalarından kaynaklanmış olabilir. Teorik modellerin gerçeğin tespitinde yetersiz kalabileceği, faize karşı dini hassasiyeti olan insanların sorunlarını çözme gereği, sıfır reel faizin enflasyonla faiz arasında oluşabilecek sarmal ilişkiye mani olması, para üretmenin kolay ve maliyetinin düşük olduğu kağıt para sisteminde paranın yüksek maliyetle (pozitif reel faizle) el değiştirmesinin anlamsız olabileceği dikkate alınarak sıfır reel faizle çalışan alternatif banka modelinin uygulanabilir olduğu değerlendirilmektedir. Bu modelde nominal faiz oranı gerçekleşen enflasyon oranına eşitlenerek ödünç verilen fonların satın alma gücü vade süresince korunmakta, banka fon arz edenler ile fon talep edenleri buluşturmadaki aracılık hizmetine karşılık fon kullananlardan veya şartlara göre her iki taraftan düşük oranlı hizmet primi almaktadır. Bu konuda gelecekte yapılacak çalışmalarda, hizmet priminin optimal düzeyinin belirlenmesi ve ekonomik koşullara göre nasıl değişebileceği, sıfır reel faizle çalışan banka ile merkez bankası ilişkileri, mevduat ve kredi güvence sistemleri, uluslararası sermaye hareketlerinin sisteme olası etkileri ve sıfır reel faiz ile makroekonomik modeller ilişkisi araştırılabilir."
