abstract: "Son yıllarda, blok zinciri, yapay zeka (AI) ve merkez bankası dijital para birimleri (CBDC'ler) gibi dijital teknolojilerin benimsenmesi nedeniyle küresel finans manzarası kökten bir değişime uğradı. Bu dijital dönüşüm, özellikle Batı ve Doğu'da finans kuruluşlarının nasıl faaliyet gösterdiğini, müşterilerle nasıl etkileşim kurduğunu ve düzenleyici gerekliliklere nasıl uyduğunu yeniden şekillendiriyor. Gelişmiş ekonomiler, inovasyonu teşvik etmek ve verimliliği artırmak için bu teknolojileri büyük ölçüde benimserken, birçok Müslüman çoğunluklu ülke, Şeriat uyumluluğunu, etik bankacılığı ve finansal katılımı vurgulayan İslami finans çerçevesinde dijital dönüşümü benimsemede benzersiz zorluklarla karşı karşıyadır. Bu tez, Batı ve Doğu finans sistemlerindeki dijital dönüşümün karşılaştırmalı bir analizini sunar ve İslami finans kuruluşları için etkilerini araştırır. Çalışma, gelişmiş dijital teknolojilerin İslami bankacılıkta operasyonel verimliliği, düzenleyici uyumluluğu ve müşteri deneyimini İslami hukuk ilkeleriyle uyumlu kalırken nasıl artırabileceğini inceliyor. Amerika Birleşik Devletleri, Çin ve Körfez İşbirliği Konseyi (GCC) ülkeleri gibi ülkelerdeki başarılı dijital girişimleri değerlendirerek, bu çalışma Müslüman çoğunluklu ülkelerin dijital yeniliklerden yararlanmada karşılaştıkları fırsatları ve zorlukları vurguluyor. Temel bulgular, dijital dönüşümün finansal katılımı iyileştirme, sürdürülebilirliği teşvik etme ve maliyetleri düşürme konusunda muazzam bir potansiyel sunarken, aynı zamanda altyapı hazırlığı, düzenleyici uyumlaştırma ve kalifiye işgücü geliştirmeyle ilgili endişeleri de gündeme getirdiğini ortaya koyuyor. Bu tez, Müslüman çoğunluklu ülkelerin bu zorlukları başarıyla kontrol altına almaları ve daha kapsayıcı ve dayanıklı bir finansal sisteme katkıda bulunarak İslami etik çerçevelere saygılı bir şekilde dijital teknolojileri uygulamaları için öneriler sunuyor."
