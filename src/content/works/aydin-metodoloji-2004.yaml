abstract: "V ÖZET DOKTORA TEZİ METODOLOJİ VE SOSYAL VAKIA AÇISINDAN İSTİHSAN Fatih Mehmet AYDIN Danışman: Prof. Dr. Mustafa BAKTIR 2005- Sayfa: IX+1 83 Jüri: Prof. Dr. Mustafa BAKTIR Prof. Dr. Hamza AKTAN Prof. Dr. Niyazi USTA Prof. Dr. Beşir GÖZÜBENLİ Prof. Dr. Ali BAKKAL Bu çalışma, İslam Hukuk Metodolojisinde yer alan“İstihsan”kavramını yeniden yorumlayarak, ortaya çıkan hukukî problemlerin çözülmesinde bu metodun rolünü ortaya koymayı amaçlamaktadır. Bu bağlamda tezimiz, sadece tarihî ve salt metodolojik bir çalışma olmayıp, sosyolojik yönü ve pratik açılımı da olan bir araştırmadır. Üç ana bölümden oluşan tezin birinci bölümünde istihsan kavramı, hukukî meşruiyeti, gelişmesi ve klasik fıkıh literatüründe kullanılış biçimi anlatılmıştır. İkinci bölümünde istihsan, bazı klasik ve çağdaş hukukî terimler ile karşılaştırılmıştır. Üçüncü bölümde ise, teknolojik-kültürel modernleşme gibi sâiklerin gereği olan sosyal hayattaki değişim gerçeği, değişimin meydana getirdiği problemler ve bunların çözümünde istihsanın rolü vurgulanmıştır."
