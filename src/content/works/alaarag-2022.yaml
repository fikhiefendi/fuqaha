abstract: "Bu çalışma, İslami vakıf, vakıf fonlarının ve kadınların ekonomik olarak güçlendirilmesinin mahiyetini açıklayarak, vakıf fonlarının kadınların ekonomik olarak güçlendirilmesindeki rolünü kanıtlamayı amaçlamış ve bu alandaki en belirgin deneyimleri sunmuştur. Bunun için öncelikle Jana Endowment Fund, ardından bağış yatırım araçları yoluyla bağış fonlarının çalışmalarını geliştirmeye yönelik beklentiler sunulmaktadır. Yine bu bağlamda, kadınların ekonomik olarak güçlendirilmesini sağlamak için start-up'lar, küçük ve orta ölçekli işletmelerin finansmanları ele alınmıştır. Bu çalışmada araştırmacı, genel olarak vakıflarda ve vakıf fonlarında yazılan edebi materyalden ve özelde kadınların ekonomik olarak güçlendirilmesi teriminden yola çıkarak tümevarımcı yaklaşıma dayanmış ve vakıfların ve vakıf fonlarının doğasını açıklığa kavuşturan betimsel yaklaşımı kullanmıştır. Kadınların ekonomik olarak güçlendirilmesine yönelik uygulamaları ve analitik yaklaşım İstatistikçi, Jana Fonu'nun kadınların ekonomik olarak güçlendirilmesindeki rolünü araştırmak için örnek almış ve ilgili konuyla anket yürütmüştür. Ardından, sonuçlarını analiz ederek Kadınların ekonomik olarak güçlendirilmesini sağlamada vakıf fonlarının etkin rolünü netleştirmiştir."
