abstract: "İslami bankacılık sektörü, mevcut finansal sistemde giderek daha önemli bir rol oynamaktadır. Müşterilerin İslami bankacılık olanaklarına olan talebi nedeniyle, genişlemesi otuz yıl içinde sadece Müslüman ülkelere değil, Müslüman olmayan ülkelere de ulaştı. Bununla birlikte, İslami bankacılık sisteminin uygulanmasının eksik olduğu Özbekistan gibi hâlâ Müslüman çoğunlukta birkaç ülke var. Bu nedenle, mevcut makale Özbekistan'da İslami bankacılığın bir fizibilite çalışması yürütmüştür. Çalışma, Özbekistan vatandaşları arasındaki farkındalık düzeyinin kapsamını ve ülkede İslami bankacılığın getirilmesi durumunda İslami bankacılık olanaklarını kullanma isteklerini incelemektedir. Çalışma, müşterilerin İslami bankacılığı himaye etmeye yönelik davranışsal niyetlerini etkileyen faktörleri incelemek için Gerekçeli Eylem Teorisi'ni (TRA) benimsemiştir. Toplam 240 (n=240) Özbekistan bankacılık müşterisinden veri toplamak için kendi kendine yapılandırılmış bir anket anketi kullanıldı. Veriler daha sonra Statistical Package for Social Sciences (SPSS) ve Analysis of Moment Structure (AMOS) yazılımı kullanılarak analiz edildi. Betimsel Analiz yapmak için ilk aşamada SPSS kullanıldı. Doğrulayıcı Faktör Analizi (DFA), Ölçüm Modeli ve Yapısal Eşitlik Modellemesi (SEM) çalıştırmak için AMOS yazılımı kullanıldı. Çalışmanın bulguları, dindarlığın ve sosyal faktörlerin İslami bankacılık tesislerini himaye etmede önemli bir pozitif etkiye sahip olduğunu, müşterilerin bilgi ve tutumlarının İslami bankacılık sistemine karşı olumsuz bir etki taşıdığını göstermektedir. Çalışmanın bulgularının, politika yapıcılara Özbekistan'da İslami bankacılığın kurulmasına yönelik ön bilgiler sağlayacağı umulmaktadır."
