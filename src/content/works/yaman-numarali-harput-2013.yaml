abstract: "Osmanlı şehir tarihi çalışmalarının en önemli kaynaklarından olan şer?iyye sicilleri, aynı zamanda Osmanlı tarihi ve kültürünün hukuki, içtimai ve siyasi kaynakları arasında yer almaktadırlar. Ait oldukları döneme ilişkin pek çok bilgi ihtiva eden bu kaynaklardan, bir bölgeye ait idari, mâli, demegrafik, tarımsal, askeri, sosyal, ailevi ve günlük yaşama dair çeşitli bilgiler elde edilebilmektedir. Bu çalışmada H.1073 (M.1663-1664) tarihli Harput Şer?iyye Sicili?nin tasnif, tahlil ve değerlendirmesi yapılarak Harput Şehri?nin söz konusu tarihteki ekonomik, sosyal, siyasi v kültürel hayatının aydınlatılmasına katkıda bulunulmaya çalışılmıştır."
