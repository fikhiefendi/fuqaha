abstract: "İslam coğrafyasında, özellikle Osmanlı Devleti'nde en yüksek dini otorite olarak kabul edilen Şeyhülislam, ''yaşlı, bilge, reis'' gibi anlamları içerir. H. IV. yy.'da ise sûfîlere verilen bir şeref unvanı olarak kullanılmaya başlanmıştır. Şeyhülislamlık kurumunun en başta gelen vazifesi, dini meselelere fetva vermektir. Bununla birlikte, Şeyhülislamlık müessesine bazı İslam ülkelerinde medreseleri teftiş etme, icazet verme gibi farklı görevler verildiği de olmuştur. Şeyhülislamlığın müessese haline gelmesi Osmanlı Devleti'nde gerçekleşmiştir. Bazı İslam ülkelerinde değişik adlarla anılan Şeyhülislamlık, Osmanlı Devletinde Fatih Sultan Mehmet döneminden sonra mütevâzi fetva makamı olarak ortaya çıkmış ve ilmiye sınıfını temsil etmiştir. Bu tarihten itibaren devlet teşkilatı içerisinde büyük rol oynayan ve Meşîhat olarak da adlandırılan, daha sonraki süreçte sürekli gelişim ve değişim gösteren Şeyhülislamlık, zaman zaman siyasi nüfuza sahip olmuş; savaş, barış, anlaşmalar vb. konularda bu makamdan fetva alınmış ve Şeyhülislam kabine üyesi olmuştur. Osmanlı Devletinde bizzat Padişah tarafından atanan ve onun tarafından azledilebilen Şeyhülislamlar, aynı zamanda en yüksek hiyerarşi ve protokoldeki konumu itibariyle en itibarlı devlet görevlileri arasında yer almışlardır. Şeyhülislamlık kurumu, Cumhuriyetin ilanıyla önce Şer'iyye ve Evkaf Vekâleti olmuş, daha sonra bu kurumun yerini Diyanet İşleri Başkanlığı almıştır. Bu çalışmamızda Osmanlı Dönemine ait Şeyhülislamlık Kurumunun yapısı ve işlevi incelenecek, daha önce müderrislik, ceza mahkemesi reisliği, evkaf nezareti ve mebusluk görevlerinde bulunan, 1914-1916 yılları arasında Şeyhülislamlık görevini deruhte eden, Osmanlı Devletinin I. Dünya Savaşına girmesine gerekçe olarak gösterilen meşhur Cihad-ı Ekber fetvasını veren ve Osmanlı Devletinin 167. Şeyhülislamı olan Ürgüplü Mustafa Hayri Efendi'nin hayatı, eğitimi, üstlendiği görevler ile şeyhülislamlığı anlatılacak, şeyhülislamlığı sırasında verdiği fetvaları içeren metinler tercüme edilecektir."
