abstract: "Zekât İslam hukukunda çeşitli alt başlıkları olan geniş kapsamlı mali bir ibadettir. Bu çalışma hem zekât yükümlülüğü açısından borçluluğu ele alarak, hem zekâtın verileceği yerler bakımından borçluluk durumunda zekâtın nasıl uygulanabileceğini incelemektedir. Borçluluk bireylerin veya kurumların finansal yükümlülüklerini yerine getirememesi durumunu ifade eder. Bu çalışma ilk olarak, İslam hukukunda zekâtın verileceği yerler ve kişiler belirlenirken hangi kriterlerin göz önünde bulundurulması gerektiği üzerine odaklanmaktadır. Bunun yanı sıra borçluluğun zekât yükümlülüğünü nasıl etkilediği ve borçluların zekât alabileceği durumlar ve sınırlar incelenmektedir. Bu çalışmanın amacı, zekâtın verileceği yerler ve zekât yükümlülüğü açısından borçluluğun ele alınarak İslam hukukuna göre borçluluğun zekâta tesirini açıklamaktır. Borçluluk fakihlerin çoğunluğuna göre zekât yükümlülüğüne belirli şartlar çerçevesinde tesir etmektedir. Aynı şekilde borçlular zekât sarf yerleri açısından da belirli şartlarla zekâta konu olmaktadır."
