abstract: "Çocukların suçta kullanılmasını inceleyen ve“İslam Ceza Hukuku Açısından Çocukların Suçta Kullanılması”adıyla kitaplaşan bu çalışmada öncelikle konuyla bağlantılı terimler ele alınmakta, İslam ceza hukukunun mahiyeti, ceza hukuku kavramı, güncel hukuk ve İslam hukuku açısından suç ve ceza kavramları tartışılmaktadır. Bu kavramsal girişin akabinde uluslararası çocuk antlaşmaları ve çocuk hakları değerlendirilmektedir. Çocukların suçta kullanılmaları ile buna yol açan sebepler tartışılmakta, bunun toplumda meydana getirdiği olumsuzluklar ve ceza hukuku bakımından hükümleri ortaya konulmaktadır. Suçlar karşısında hem çocukların hem de zorlama, emretme, suça iştirak veya teşvik gibi yollarla çocukları suça iten kişilerin durumları, cezalandırılmalarındaki caydırıcılık ve çocukların bu tür kişilerden ve sebep oldukları suçlardan korunma yolları ele alınmaktadır. Bunun yanında çocukluktan çıkarak cezai ehliyeti kazandığı sorumluluk yaşının nerede başlaması gerektiğine dair hususlar gündeme getirilmekte ayrıca genel anlamda çocukların çalışma ortamlarında yaşadıkları sorunlar çerçevesinde çalışan çocuk meselesi ele alındığı gibi İslam fıkhıyla günümüz modern hukuk anlayışlarındaki aynılık ve farklılıkların değerlendirilmesi yapılarak çocuklar için en doğru ve iyisinin ortaya çıkartılacağı hükümler tespit edilmeye çalışılmaktadır."
