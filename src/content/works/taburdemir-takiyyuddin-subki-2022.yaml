abstract: "Bu çalışma, 683-756/1284-1355 yılları arasında yaşamış Şâfiî fakihi Takıyyüddin Sübkî'nin fetvalarını konu edinmektedir. Fetvaları, Fetâvâ's-Sübkî isimli eser üzerinden incelenmiş, genel özellikleri ve cevap verirken takip ettiği yöntemler tespit edilmeye çalışılmıştır. Çalışmamız giriş, sonuç ve üç temel bölümden oluşmaktadır. İlk bölümde, Sübkî'nin hayatı ve yaşadığı dönem işlenmiştir. İkinci bölümde, Fetâvâ'sı tanıtılmış ve fetvalarının fıkhî birikim ve sosyal tarih açısından önemi üzerinde durulmuştur. Son bölümde kullandığı deliller, el altı kitapları, cevaplarında benimsediği üslup ve yaptığı atıflar üzerinden Sübkî'nin fetva usulü izaha çalışılmıştır."
