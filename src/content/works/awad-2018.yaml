abstract: "Bu çalışmanın amacı, İslami bankalarda ortaya çıkan sözleşmelerde şeriatın maksadları çerçevesinde nasıl kullanılacağını belirlenmesi, islami bankaları tarafından uygulanan modern sözleşmelerinin imajlarını tanımlamak ve şeriatın maksadları doğrultusunda ne kadar uygulandığını öğrenmek, aynı zamanda ekonomik ve finansal işlemlerde şeriat maksadlarının uygulanmasından elde edilen en önemli faydaları ele almak ve Şeriat maksadlarının finansal bankacılık alanında etik üzerindeki etkisini öğrenmektedir . Çalışma, Makasıd biliminin farkındalığıyla, amaç ve hedefleri anlamaya yardımcı olduğu, yeni meseleleri için ve hiçbir hüküm olmadığı zaman içtihad sürecini kolaylaştırdığı ve şeriat maksadları, islamin öncelikleri doğrultusunda ve şeriat ahkamları çerçevesinde oluşturulmasını gerektiğini sonucuna varmıştır. Şeriat maksadlarından dünyayı iyi işlerle imar etmek, kötü işlerlerdan uzak durma yı amaçlamaktadır. İslam ahkamları istinbat edilmesi (türetmek) durumunda kolaylık seçilmesi, güçlük ve meşakkattan uzak durması gibi önemli noktalara dikkat edilmesi gerekmektedir. İnsanların günlük ilişkilerinde ahlaki boyut, etik, adalet sağlanması, zülüm kaldırılması, Şeriat'ın maksadlarıyla ayrılmaz bir biçimde bağlantılıdır. Araştırmacı, Şeriatın maksadlarına yönelik tipik yönden çıkarak uygulamalı pratik yönüne harekete geçme ihtiyaç duyduğunu, finansal işlemleri gelişmesiyle ilgili islam hükümleri ve şeriat maksadları çerçevesinde sürekli değerlendirilerek şeriat maksadları uygulamasına geçmek, ve islam hukuku doğrultusunda kurallar, hükümler ve düzenlemeler yapmayı önermektedir. Aynı zamanda, finansal bankacılığın yürütülmesindeki şeriat çalışmaları ile ilgili bilimsel çabaları, araştırma ve vi çalışmaların birleştirilmesi, çalışmalarda daha derin ve detaylı bir şekilde bankacılık ile ilgili bir konu seçilip üzerinde çalışmayı tahsis etmek ve üzerindeki şeriat maksadları açıklamayı tavsiye eder. Örnek olarak ortaya çıkan sözleşmelerden bir banka finansmanı sözleşmesi üzerinde detaylı bir şekilde çalışması ve içinde yer alan şeriat maksadlarını açıklamaktır. Bunun dışında islami bankalarında meşruiyet denetçileri olarak çalışanlar şeriat meseleleri kavramaları, doğru hükümleri istinbat edilmeleri ve şeriat maksadlarına önemsemeleri gerekmektedir."
