abstract: "Çalışma, İslami bankaların sosyal kalkınmadaki rolünü vurgulamayı amaçlamaktadır. Sosyal kalkınma kavramına değinilmiş ve İslam tarihindeki derinliği, sosyal sorumluluğun doğası ve bankanın sosyal kalkınmaya katkı sağladığı araçlar ele alınmıştır. Bu amaca ulaşmak için, sosyal kalkınma hakkında yazılanları ve İslami bankaların bu konudaki rolünü izlemek için tümevarım yöntemi kullanıldı. Türk toplumunun rastgele bir örneğine bir anket dağıtarak istatistiksel analitik yöntem de kullanıldı, İslami bankaların (Al Baraka Türk Bankası) sosyal kalkınmadaki rollerini ne ölçüde oynadığını ölçmek için çalışma, sosyal kalkınmanın sosyal kalkınma olduğu sonucuna varmıştır. İslam dininin temel direği olan ve Hz. Peygamber،in (s.a.v.) döneminden beri var olan İslami bankaların finansal araçlar yoluyla toplumsal kalkınmada da önemli bir rolü vardır; Kâr amacı güden veya gütmeyen, çalışma, 2016-2020 vizyonuyla Al Baraka Bankacılık Grubu،nun sosyal kalkınmadaki olumlu rolünü de gösterdi, İslami bankaların sosyal kalkınmaya katkıda bulunarak toplumlara karşı sosyal sorumluluklarını hissetmeye teşvik edilmesi önerildi. İslami bankalar içinde bu konuyla ilgilenmek için bağımsız bir departman tahsis edilmesi de tavsiye edildi."
