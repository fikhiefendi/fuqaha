abstract: "Bankacılığın kökeni çok eski tarihlere dayanmaktadır. Fakat 1300'lü yıllardan bu yana ilerlemesini devam ettirmiş olan bankacılık sistemi, 20. yy'da Amerika Merkez Bankası'nın kurulmasıyla beraber modern bankacılığa dönüşmüştür. Ekonomik sistemlerin ihtiyaçlarına göre gelişen ve büyüyen bankacılık alanında günümüzde konvansiyonel bankacılıktan farklı bankacılık çeşitleri de vardır. Ayrıca bu farklı bankacılık türleri giderek daha etkin ve aktif bir biçimde etkinliklerine devam etmektedir. Bu bankacılık türlerinden biri de Katılım Bankacılığıdır. Katılım bankacılığı kısaca, özel cari ve katılma hesapları aracılığıyla fon toplamak ve topladığı bu fonları faizsiz finans şartlarına uygun biçimde kullandırmak amacıyla faaliyet göstermekte olan bankalardır. Katılım bankacılığı tüm dünyada olduğu gibi Türkiye'de de talep görme açısından gelişimini sürdürmektedir. Bu çalışmamızda, Katılım bankalarını tercih eden müşterilerin tercihlerinin belirleyicileri üzerine bir anket uygulanmıştır. Anketler, Google formlar aracılığıyla oluşturulup Türkiye geneline dağıtılmış ve 423 kişinin ankete katılımı olmuştur. Anketlerin analizi sonrasında, belirlenen dört faktör içerisinden, müşteriler için en önemli olan faktörün Müşteri Hizmetleri faktörü olduğu sonucuna varılmıştır. Bu doğrultuda, müşteri tercihlerinin belirleyicileri konusunda en önemli etkenin Müşteri Hizmetleri faktörü olduğu belirlenmiştir."
