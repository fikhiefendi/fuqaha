abstract: "Bu çalışmada ülkemizdeki kooperatiflerin öz kaynak yetersizliği ve krediye erişim sorunu yaşadığı tespitinden yola çıkılarak kooperatif bankacılığı konusu ele alınmakta ve Türkiye'de faizsiz kooperatifler bankası kurulmasının gerekliliği üzerinde durulmaktadır. Araştırmanın ana gayesi İslam iktisadı anlayışı çerçevesinde gelişen faizsiz kooperatif bankacılığı uygulamalarının finansal piyasalarımızda etkin yer almalarıdır. Yine kooperatif bankacılığı modelinin uygulama alanı bulmasıyla kooperatiflerin finansal sorunlarına kalıcı çözüm üretmektir. İslami bankacılık prensiplerini dikkate alan sosyal sorumluluğa sahip, ortaklık temelli bir faizsiz kooperatif bankacılığı modelinin yaşama geçirilebilmesi tez çalışmasının nihai amaçları arasındadır. Tez süresince dünya genelindeki kooperatif bankacılık uygulamaları İslam iktisadı anlayışı çerçevesinde incelenmiş ülkemizde kurulacak faizsiz kooperatifler bankasının finansal sistemimize sosyo-ekonomik gelişmemize sağlayacağı katkıların önemi üzerinde durulmuştur. Ülkemizde İslam iktisadı bağlamında kurulacak bir kooperatif bankasının bir ihtiyaçtan mı kaynaklandığı, finans sistemimiz içerisinde ne gibi boşlukları dolduracağı, temel yaklaşımlarının neler olması gerektiği hususu tartışmaya açılmış katılımcıların görüşleri doğrultusunda faizsiz kooperatif bankası model önerisi geliştirilmeye çalışılmıştır. Konuyla ilgili mesleki tecrübe ve akademik birikimi olan yirmi (20) katılımcıyla soru seti kapsamında yarı yapılandırılmış mülakat tekniği kullanılarak mülakatlar gerçekleştirilmiş tezimize kaynak teşkil edecek bulgulara ulaşılmıştır. Ülkemizde kooperatiflere finansal ürün ve hizmetler sunan İslam iktisadı temellerine dayalı kooperatif bankasının kurulması bir ihtiyaçtan kaynaklanmaktadır. Kooperatif bankasının ülkemiz finansal sisteminde yerini almamış olması bir eksikliktir. Dayanışma ve yardımlaşma esasına dayalı ortaklık modeli ile faaliyet gösteren kooperatiflerin faizsiz kooperatif bankalarınca desteklenmesi ekonomik sosyal hayatımızda üretim tüketim paylaşım dengesinin sağlanmasını mümkün hale getirecektir. Tez çalışmasında ülkemizde faizsiz kooperatif bankası kurulması düşüncesinin sosyo-ekonomik kalkınmamız ve sağlıklı bir finansal aktarım mekanizmasına sahip olmamız açısından doğru bir yaklaşım olduğu sonucuna varılmıştır."
