abstract: "Eşler arasında karşılıklı anlayış ve hoşgörünün zayıflaması, anlaşmazlıklar çıkması gibi nedenlerle kocanın karısına bir eziyet olmak üzere yahut karısının ilişkiyi kaldıramayacağı dönemlerde ona kolaylık olması gibi bir niyetle eziyet kastı olmaksızın yaklaşmama kararı alması ve bunu yemin ederek kuvvetlendirmesi durumunda kadının korunması maksadıyla İslâm, îlâ hükümlerini getirmiştir. Îlâ hükümleri ile kocanın bu yolla zulmetmesinin, karısının da zarar görmesinin önlenmesi hedeflenmiştir. Îlâya dair düzenlemelerin olmaması, İslam Hukukunda boşama yetkisinin kocada olduğu düşünüldüğünde bireylerin özel yaşamında derin yaralar açılmasına sebebiyet verecek hukukî boşlukların var olması demektir. Ancak İslâm Hukuku bu ihtiyaca en güzel şekilde cevap vermiştir.“İslâm Aile Hukukunda Kocanın Karısına Yaklaşmama Yemini (Îlâ)”isimli çalışmamız, giriş, iki ana bölüm ve bir sonuçtan oluşmaktadır. Girişte îlânın tanımı, hukukî dayanakları; ilk bölümde mahiyeti, unsurları ve bu unsurların şartları ele alınmıştır. İkinci bölümde ise îlânın hukuki sonuçları ile îlâyı düşüren ve iptal eden şeyler incelenmiştir. Sonuç bölümünde bu çalışmadan elde edilen neticeler ifade edilmiştir."
