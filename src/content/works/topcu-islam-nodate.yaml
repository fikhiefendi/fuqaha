abstract: "Yaklaşık beş bin yıllık bir tarihe sahip olan toplumlararası hukukî ilişkilere dair kayıtlara rağmen devletler hukukunun tarihi bu kadar eski değildir. Daha önceki asırlarda bu alanda var olmuş ve birer siyasi yaklaşım olarak tanımlanabilecek kayıtlar bir yana bırakılırsa dünya tarihinde bu alanda ilk defa Müslümanlar devletler hukukunu bir ilim dalı olarak ortaya koymuştur. Devletler hukuku alanındaki ilk eser veren ve bu alanda ilk tartışmaları başlatan kişinin Ebû Hanîfe olduğu söylenebilir. Onun görüşleri İslâm dünyasında ses getirmiş ve çağdaşı Evzâî tarafından bir reddiyeyle cevaplanmıştır. Siyerü'l-Evzâî adıyla meşhur olan bu reddiyeye, Ebû Hanîfe'nin en önde gelen talebesi Ebû Yûsuf tarafından verilen cevap daha sonra Şâfiî'nin kendi yorumlarını eklemesiyle büyük bir zenginliğe kavuşmuştur. Bu metin, üç müctehidin aynı eser üzerinde kalem oynattığı bilinen tek metindir. Bununla birlikte daha sonraki fıkıh âlimleri bu eser üzerine bir çalışma yapmamış ve bu tartışma Şâfiî ile son bulmuştur. Bu çalışmada öncelikle İslâm devletler hukukunun temelleri ortaya konmuş, söz konusu müctehidlerin Siyerü'l-Evzâî eksenindeki tartışmaları özelinde ictihad eleştirileri analiz edilerek ihtilaf sebepleri tahlil edilmiştir. Ayrıca çalışmada Şâfiî ile son bulan bu tartışmaya sonraki Hanefî fakihlerinin katkılarını tespit etmek ve bunları değerlendirmek amaçlanmıştır. Çalışmada görüşleri tahlil edilen müctehidlerin devletler hukuku konularındaki ihtilaflarından birçoğunun temelde Ebû Hanîfe'nin ülke farklılığına özel hükümler öngörmesi ve mülkiyet için mücerred istîlâyı yeterli görmemesi gibi sebeplere dayandığı görülmektedir. Sonraki Hanefî fakihleri ise Şâfiî'nin ilgili eserindeki eleştirilerini direkt olarak ele almamakla ve bu sebeple bir kısmını cevapsız bırakmakla birlikte, mezhep imamlarının görüşlerini muhtelif gerekçelerle delillendirerek savunmaya devam etmişlerdir."
