abstract: "İnsanlık tarihi boyunca iktisat, insan hayatını etkileyen en önemli unsurların başında gelmiştir. Bireysel ve toplumsal hayatı etkileyen tüm olaylar iktisadi hayatı da etkilemiştir. Kapitalizmin etkisi ve Sanayi Devrimi'yle birlikte seri üretim aşamasına geçen insanlık, farklı bir çağa kapı aralamıştır. Bu çağda zenginleşen sermayedar, fabrikatör ve bankerler, maddi imkanlarını, fakir kesimle hiç kapanmayacak derecede gittikçe ilerleyen bir makas skalasında genişleterek yoksulların daha da yoksullaşmasına neden olmuşlardır. Bu kapital düzenle birlikte bahsi geçen bu elit kesim, dünya piyasalarına yön vermeye başlamış, kurduğu şirketlerle zamanla bir tekel haline gelmişlerdir. Kapital düzende Avrupa ülkeleri, tarım, sanayi ve hizmet sektörleriyle birlikte teknolojik imkanları verimli kullanma, kendi kendine yeter bir iktisadi sistem ve yöntemi benimseme ve sömürü gibi daha pek çok etkenle birlikte iktisadi anlamda gelişmiş ülkeler arasında ilk sıralarda yer almaktadır. Ancak bu düzene karşı iktisadi imkanlarını geliştirmek isteyen üçüncü dünya ülkeleri, bu sanayi ve teknoloji yarışında geride kalarak gelişmemiş veya az gelişmiş ülkeler arasına dahil olmuşlardır. Bu geri kalmışlıktan kurtulmak için pek çok iktisadi sistem ve model iktisadi, siyasi ve akademik olarak pek çok alanda tartışma konusu olmuştur. İktisadi problemler ve gelişme ile ilgili birçok uzman ve iktisatçı çeşitli yorumlarda bulunmuşlardır. Bunlardan biri de 20. Yüzyılda yaşamış olan Malik İbn Nebi'dir. Tezde İslam hukuku ve iktisadı bağlamında düşünürün görüşleri ele alınmaktadır. Bu çalışmada altı bölüm bulunmaktadır. Birinci bölümde İbn Nebi'nin eğitim hayatı, entelektüel ve eylemci yaşamı zikredilmiştir. İkinci bölümde iktisadi sistemler hakkında bilgi verilerek İslam iktisadıyla bu sistemlerin mukayesesi yapılmıştır. Üçüncü bölümde insanların bizatihi yaşadığı iktisadi problemlerden bahsedilmiştir. Dördüncü bölümde iktisadi kalkınmanın üç temel ögesine yer verilmiştir. Beşinci bölümde sömürgecilik, sömürü çeşitleri, İslam'ın sömürüye bakış açısı ile birlikte sömürü psikolojisi ve siyasetinden bahsedilmiştir. Altıncı bölümde iktisadi görüşleri uygulamadaki temel argümanlar söz konusu edilmiştir."
