abstract: "Çalışmamız bir giriş, üç bölüm ve sonuç kısımlarından oluşmaktadır.Giriş bölümünde ?İslam Hukukunda Faizin İlleti İle İlgili İhtilaflar? konusunun öneminden, amacından, yönteminden, kavramsal çerçevesinden, sınırlandırılmasından ve sunulmasından bahsettik.Birinci bölümde faizin mahiyetini, tanımını, kısımlarını, kar ve kira ile olan mukayesesini ve tarihçesini ele aldık. Ayrıca beşeri sistemlerdeki faiz konusuna değindik.İkinci bölümde Kur'an'da faiz konusunu, sünnette faiz konusunu, sahabe döneminde faiz konusunu ve İslam bilginleri arasında faiz konusunu ele aldık. Ayrıca faizin yasaklanma sebeplerini izah ederek onun ekonomik ve sosyal hayattaki olumsuz etkilerine değindik.Üçüncü bölümde ise öncelikli olarak ?illet? kavramını fıkıh bilimi açısından bir değerlendirmeye tabi tuttuk. Daha sonra faizin illeti ile ilgili genel anlamda mezheplerin, özel olarak bazı âlimlerin görüş ve düşüncelerini ele aldık. Yine bu bölümde faizle ilgili ortaya çıkan yeni ve farklı yaklaşımlardan bahsettik.Son olarak tüm bölümlerde ayrı ayrı ele aldığımız konuların sentez ve değerlendirmesini sonuç bölümünde gerçekleştirdik."
