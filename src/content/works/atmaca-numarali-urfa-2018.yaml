abstract: "Şer'iyye Sicilleri Osmanlı'da kaza kadılarının her türlü davalarda verdikleri kararları ve merkezden gelen emirleri kaydettirdikleri mahkeme kayıtlarıdır. Bu kayıtların özellikle de kaza merkezlerinde kaydedilmiş olması, onları yerel tarih araştırmaları açısından çok önemli kaynak haline getirmektedir. Bundan dolayı bir şehrin Osmanlı dönemindeki sosyal, ekonomik, iktisadi, içtimai, askeri ve kültürel mazisini daha iyi derk etmek ve bir kanaate varmak için o şehre ait şer'iyye sicillerine başvurmak büyük önem arz etmektedir. Bu çalışmanın birinci bölümünde Urfa'nın tarihi, coğrafi konumu, adının kaynağı ie alakalı genel bilgilere yer verilirken ikinci bölümde şer'iyye mahkemelerinin tarihçesi, işleyiş tarzı ve mahkeme görevlileri hakkında bilgi verilmiştir. Çalışmamızın son bölümünde ise 216 numaralı Urfa şer'iyye sicilinin 187- 366. Sayfalarının transkripsiyonu ve değerlendirmesi yapılmıştır. 206 Numaralı defterden yararlanılarak Urfa'nın sosyal, kültürel, ekonomik, hukuki ve siyasi hayatı hakkında bilgi sahibi olabiliriz."
