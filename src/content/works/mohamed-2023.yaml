abstract: "İslam hukuku, sığınma ve mültecilerle ilgili konulara değinerek mültecilerin karşı karşıya kaldığı birçok riski dikkate aldı ve bu risklerle başa çıkmak için uluslararası anlaşmalar da dahil olmak üzere hukuki mekanizmalar geliştirdi, 1951 Sözleşmesi ve Protokolü gibi. Bu çalışma, sığınma kavramını, nedenlerini, taşıdığı risk türlerini ve İslam hukuku ve uluslararası hukuk çerçevesinde mültecileri koruma yöntemlerini araştırmayı amaçlamaktadır. Çalışma mümkün olan yerlerde betimsel, analitik ve karşılaştırmalı bir metodoloji benimsedi. Çalışma, mültecilerle ilgili riskler ve bu risklerin etkileri konusunda İslam hukuku ile uluslararası hukuk arasında çok sayıda anlaşma ve benzerlik olduğunu sonucuna vardı, örneğin mültecilerin hayatlarına yönelik tehdit gibi. Bu prensipler uluslararası hukuka benzer ancak özellikle uygulama için gerekli olan hukuki sorumluluk açısından daha kapsamlı, tam ve olgunlardır, İslam hukukuna göre bireysel, toplumsal ve resmi uluslararası sorumluluğu içerir. Çalışma, İslam hukukundaki sığınma ve mültecilerle ilgili konular üzerine daha fazla araştırma yapılmasını, ayrıca İslam hukuku ile uluslararası sözleşmeler arasındaki karşılaştırmalı çalışmaları önermektedir. Çalışma ayrıca Arap ve İslam dünyasındaki insan hakları kuruluşlarının İslam hukuku ışığında mülteciler için yasaları gözden geçirmesini ve geliştirmesini önermektedir. Bu, İslam hakkında yanlış yanılgıların birçoğunu ortadan kaldıracak ve İslam'ın temel insan hakları ve özgürlüklerini ihlal ettiği ve çağdaş sorunlarla başa çıkmak ve bunları çözmek için uygun olmadığına dair yanlış yanılgıları gidermeye yardımcı olacaktır."
