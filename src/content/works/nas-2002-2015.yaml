abstract: "Bu araştırmanın amacı, Osmanlı Devleti kanunlarının İslâm şeriatine ne ölçüde uygunluk arz ettiğini ve dayandığı hukukî sistemleri, kuruluşundan yıkılışına kadar olan süreç içerisinde özlü bir şekilde ortaya koymaktır. Bu çerçevede çalışmada, söz konusu kanunları etkileyen bazı önemli tarihsel gelişmelere temas edilmiş; ayrıca Osmanlı hukuk yapısı içerisinde yer alan kimi kanunî ve yarı kanunî metinlere de işaret edilmiştir. Bunun yanı sıra araştırma, Türk Medenî Kanunu'nu özellikleri, kaynakları ve gelişim süreci bakımından ele almakta; Batı hukukundan iktibas edildiği dönemden günümüze kadar geçirdiği aşamaları ve bu süreçte hukuku etkileyen belli başlı gelişmeleri incelemektedir. Son olarak, Türk Medenî Kanunu'nun“aile hukuku (ahvâl-i şahsiyye)”bölümünün evlenme ve boşanma konularında İslâm fıkıh mezhepleriyle ne ölçüde örtüştüğü değerlendirilmektedir. Araştırmanın ulaştığı sonuçlara göre, Osmanlı Devleti'nde kuruluşundan Tanzimat dönemine kadar olan süreçte yargı düzeni ve hukukî sistem büyük ölçüde şer'î esaslara dayanmakta idi. Tanzimat sonrasında ise hukuk sistemi, Batı kaynaklı kanunlar ile şer'î hükümlerin birlikte yer aldığı ikili (düalist) bir yapıya dönüşmüştür. Devletin yıkılıp Türkiye Cumhuriyeti'nin ilan edilmesiyle birlikte ise hukuk düzeni bütünüyle Batı menşeli ve seküler bir mahiyet kazanmış ve bu durum günümüze kadar devam etmiştir. Aile hukuku bağlamında yapılan değerlendirmede, Türk Medenî Kanunu'nun İslâm fıkhı mezhepleriyle birçok noktada farklılaştığı tespit edilmiştir. Bu farklılıklar arasında; çok eşliliğin kesin olarak yasaklanması, süt hısımlığına dayalı evlilik yasağının bulunmaması, semavî bir dine mensup olmayanlarla evliliğin engellenmemesi, evlat edinen ile evlatlık arasında evliliğin kesin biçimde yasaklanması ve boşama yetkisinin erkekten alınması gibi İslâm hukukuyla doğrudan çelişen hükümler yer almaktadır. Bunun yanında, küçüklerin evlendirilmesinin mutlak surette yasaklanması, evlenme yaşının belirlenmesi ve velâyet düzeninin farklı bir tertibe kavuşturulması gibi hususlarda da cumhur fukahaya muhalif düzenlemelerin bulunduğu görülmektedir. Bu sonuçlar çerçevesinde araştırmacı bir dizi öneri sunmaktadır. Bunların başlıcaları şunlardır: Mevcut aile hukuku düzenine İslâmî-şer'î bir perspektifle yaklaşılması suretiyle, kanunların dinî ve toplumsal değerlerle örtüşmeyen yönlerine dikkat çekilmesi ve bu hususta başta toplum geneli olmak üzere özellikle ilim çevreleri ile devlet erkânının bilinçlendirilmesi önerilmektedir. Ayrıca, devlet bünyesindeki akademik ve idarî kadroların ilmî seminer ve konferanslara katılımının teşvik edilmesi; bu yolla kanun komisyonları üyeleri, öğretim elemanları, öğrenciler ve idarî personelin, toplumun değerleri ve dini doğrultusunda kanunlaştırma ve düzenleme süreçlerine ilişkin farkındalıklarının artırılması önerilmektedir."
