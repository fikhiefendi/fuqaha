abstract: "Anadolu Kazaskerliği ve Sadareti 122 No'lu 1308 / 1309 (M. 1890 / 1891 ) tarihli Sicil Defteri toplamda 102 varaktan oluşan, içerisinde 108 davanın yer aldığı hüccet defteridir. Hüccet defterinin ne olduğu ve kapsamı ile ilgili değerlendirmelerin yanı sıra Anadolu Sadareti'ne bağlı çeşitli sancak, kaza ve köylerden yansıyan tarla-arsabağ-bağçe-mülk-konak-değirmen satışları, kahvehane satışı ya da kirası, vasii tayinleri, boşanma, vakıf kirası, gemi kazası sonucu miras paylaşımı, Müslüman ve gayr-i Müslümanlara ait miras paylaşımlarının yer aldığı Osmanlı tarihi incelemeleri açısından önem ihtiva eden bir çalışma olmuştur. Defter üç bölüm ve birçok konu başlığını kapsayacak şekilde incelenmiş, trankripsiyonu yapılmış ve değerlendirilmiştir. Osmanlı hukuk ve toplumsal yapısı hakkında önemli bir çalışma olan 122 No'lu Şer'iyye Sicil Defteri yapılacak olan çalışmalara kaynak sağlayabilmesi için çok uzun ve meşekkatli bir çalışmanın sonucudur."
