abstract: "V ÖZET İcmaın hücciyyetine Kitap, Sünnet ve akıl yoluyla delil getirilmiştir. Bu üçü arasında delaleti en güçlü olanı Sünnet'tir. Usulcülerin Sünnet' e dayanarak söylediklerini şöyle özetleyebiliriz: Hz. Peygamber (s.a.v.) ümmetinin dalalet üzere birleşmeyeceğini haber veriyor; bu gösterir ki ümmet bir ictihad hatası üzerinde birleşmez. Ayrıca Peygamberimiz (s.a.v.) cemaatten ayrılmamayı da emretmektedir; bu da icma eden cemaatin fikirlerine muhalefet etmenin haram olduğuna delalet eder. Ancak gerek ümmetin dalalet üzere toplanmayacağını gerekse cemaate sarılmayı emreden hadisler hep fıten hadisleridir ve incelendiğinde görüleceği üzere furu ile değil akideyle ilgili manalar taşımaktadırlar. Anlayabildiğimiz kadarıyla Peygamber Efendimiz'in (s.a.v.) bu hadislerle bize verdiği mesaj şudur: Ümmetimin içinden bazı sapık fırkalar çıksa da ümmetim dalalet (sapıklık) üzere toplanmayacak; akidesi bozuk bu grupların yanında daima saf bir akideye sahip Müslümanlar da olacak; işte bu saf Müslümanların topluluğu cemaattir; sakın bu cemaatten ayrılmayın. Usulcüler Kitap'tan şöyle istidlal ederler: 1. Müminlerin yolundan başkasına uymak yasaklanmıştır. 2. Cenab-ı Hakk bu ümmetin adil ve şahit olduğunu; iyiliği emredip kötülükten nehyeden en hayırlı ümmet olduğunu bildirmiştir. Hatalı bir ictihad üzerinde icma eden; adil, şahid ve en hayırlı olamaz. Yine bu ayet-i kerimeler incelendiğinde görülecektir ki müminlerin yolundan başkası ile Cenab-ı Hakk“küfr”ü kastetmiştir ki bunun icmaa delaleti yoktur. Hadislerde içtihadın hatasına dahi sevab verildiği bildirildiğinden, bir ictihad hatası üzerinde icma etmesi bu ümmetin adilliğini, şahidliğini ve en hayırlı olma vasfını bozmaz. Akli olarak denen ise şudur: İslam şeriatı kıyamete kadar baki kalacaktır ancak vahiy kesilmiştir. Şayet ümmet ictihad edip bir dalalet üzerinde toplanırsa şeriat o meselede son bulmuş demektir. Burda ictihad hatasını dalalet kabul etme gibi önemli bir yanlış yapılmaktadır. Burdan da icmaa gidilmez. Öyle anlaşılıyor ki icmaın ne akli ne de nakli sağlam bir delili vardır. İmam Şafiî icma iddiasının ilk defa kendi neslinde ortaya çıktığını önceleri böyle bir şeyin olmadığını söylemektedir."
