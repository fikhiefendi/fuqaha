abstract: "Borç ilişkisinde borcun amacı alacaklının tatmin edilerek borcun sona ermesidir. Bu amaçtan hareketle modern hukuk üçüncü kişilerin borç ilişkisine müdahalelerini kabul etmektedir. Üçüncü kişilerin borç ilişkisine dahil olması ile çözülmesi gereken hukuki problemler ortaya çıkmaktadır. Bu sorunlardan ilki başkasının borcunu ödeyen üçüncü kişinin korunmasıdır. Halefiyet, borcun başkası tarafından ifa edilmesi halinde alacaklının haklarının halef olan kişiye geçmesi olup, üçüncü kişinin korunmasını sağlamaktadır. Borcun tamamını ödeyen borç ilişkisine dahil olmayan bir üçüncü kişinin borçtan sorumlu kimselerin (örneğin kefilin) bu ödemeden dolayı meydana gelen zararın giderilmesi ve ödemede bulunan lehine doğacak talep hakkını hukuk düzenleri denkleştirme yapma suretiyle çözmeye çalışmıştır. Bu çözüm ise rücu ile mümkündür. İpotek ve kefalet sözleşmeleri ise borç ilişkisi teminat altına alan iki ayrı hukuki imkândır. İpoteğin üçüncü kişi tarafından verilmesi halinde, taşınmaz malikinin alacaklıyı tatmin etme yetkisi vardır. Malik alacaklıyı tatmin edince, halefiyet ve rücu hakkı gündeme gelir. Kefil ise alacaklıyı tatmin ettiğinde, borçluya rücu etmek için hem halefiyete dayanan hem de iç ilişkiye dayanan rücu hakkı bulunmaktadır. Halefiyet ile rücu malvarlığında kayıp yaşayan üçüncü kişinin bu kaybı gidermesini amaçladığı için birbiri ile oldukça ilişkili kavramlar olmasına rağmen aynı anlamda da değillerdir. Halefiyetin rücu ile ilişkisinin kurulması gereklidir. Nitekim rücu hakkı daha geniş bir kavram olup, kimi zaman halefiyetin neticesinde doğmakta, kimi zaman ise rücu hakkı kanun tarafından sağlanarak halefiyet ile bu rücu hakkı kuvvetlendirilmektedir. Bu çalışmada amaç, halefiyet ve rücunun birbiri ile ilişkisini ortaya koymaktır. İpotek ve kefalet sözleşmeleri özelinde de halefiyet ile rücunun ilişkisi çerçevesinde, halefiyete ilişkin özel hükümlerde aranan şartlar ve halefiyetin sonuçları incelenmektedir."
