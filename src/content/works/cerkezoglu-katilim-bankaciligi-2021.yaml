abstract: "Bu çalışmada 2006-2020 yılları arasındaki çeyrek dönemlik veriler kullanılarak Türkiye'deki katılım bankalarının gelişmişlik düzeyi ile iktisadi büyüme arasındaki ilişki incelenmiştir. Elde edilen sonuçlara göre ilgili iki değişken arasında uzun dönemli bir eş bütünleşme ilişkisinin varlığı tespit edilmiştir. Diğer bir ifadeyle, katılım bankalarının gelişmişlik düzeyi ile iktisadi büyüme uzun dönemde birlikte hareket etmektedir. Dengeden herhangi bir sapma olması durumunda ise sapmanın %77'sinin her çeyreklik dönemde düzeltildiği görülmektedir. Ayrıca katılım bankalarının kullandırdıkları kredilerde meydana gelecek %1'lik bir artışın büyüme üzerinde % 0,13 seviyesinde bir artış oluşturduğu görülmektedir."
