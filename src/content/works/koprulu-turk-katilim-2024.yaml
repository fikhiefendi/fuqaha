abstract: "Bu araştırmada, Türkiye'deki katılım bankalarından hizmet alan yabancı müşterilerin bankacılık hizmetlerine ilişkin deneyimleri, katılım bankacılığı ile alakalı bilgi düzeyleri, tercih nedenleri ve memnuniyetleri ölçümlenerek değerlendirilmiştir. Elde edilen sonuç ve araştırmalar ile katılım bankacılığına ilişkin çalışmalarda yabancı müşteriler bakımından müşteri deneyimi ve müşteri memnuniyeti açısından çeşitli öneri ve ipuçları sunularak bu alanda iyileştirilmelerin sağlanması ve bu araştırmaların gelişimine de katkı sağlanmıştır. Araştırmada betimsel tarama yaklaşımı kullanılmış ve uygulama İstanbul Avrupa yakasında faaliyet gösteren bir katılım bankasının şubelerinden hizmet alan 186 yabancı müşteri ile gönüllülük esasına dayalı olarak gerçekleştirilmiştir. Araştırmada, istatiksel modelleme programından yararlanılmış ve parametrik testler kullanılarak müşteri deneyimlerinin tespitine çalışılmıştır. Yapılan araştırma neticesinde katılım bankaları müşteri bilincini artırmak için çeşitli stratejileri benimsenmeleriyle katılım bankacılığının çalışma prensipleri konusunda müşterilerin bilinç düzeyini artırabilir. Müşteri bilgilendirmeleri artırılarak yabancı müşteri sayısını artırmalarına ve sektörde daha rekabetçi bir konum elde etmelerine olanak tanıyabileceği gibi güvenirliğin ve katılım bankacılığının tanınırlığın artmasına katkı sağlayacağı düşünülmektedir. Katılım bankaların ürünler hususunda reklam ve iletişim stratejilerini geliştirerek potansiyel müşterilere ulaşılabilir ve doğru bilgi aktarılabilir."
