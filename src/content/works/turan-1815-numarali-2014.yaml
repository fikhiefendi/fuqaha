abstract: "Şer'iye sicilleri, şer'iye mahkemelerinde yapılan tüm işlemlerin kaydedildiği defterlerdir. Kadının hakimlik görevinin yanı sıra birçok idari görevi de yerine getirmesi, şer'iye sicillerindeki kayıtların muhtevasının geniş olmasını sağlamıştır. Dolayısıyla şer'iye sicilleri Osmanlı hukukunun uygulamasını gözler önüne serdiği gibi, Osmanlı Devleti'ne ilişkin birçok konuda zengin bilgiler içermektedir. 1815 Numaralı Trabzon Şer'iye Sicili, Trabzon'un halihazırda günümüze ulaşmış ilk şer'iye sicilidir. Sicilde bulunan kayıtlar 1554-1558 yıllarını kapsamaktadır. Bu çalışmanın amacı Osmanlı hukukunun uygulamasını göstermek ve böylelikle Osmanlı hukukunun yapısına ilişkin objektif bir değerlendirme yapabilmektir. Çalışmamızda öncelikle 1815 Numaralı Trabzon Şer'iye Sicili'nin transkripsiyonu yapılmıştır. Daha sonra sicilde bulunan kayıtlar içeriklerine göre hukuki açıdan tasnif edilmiş ve yorumlanmıştır."
