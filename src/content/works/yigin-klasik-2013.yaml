abstract: "Bilgi anlayışı, fıkıh usûlünün kavramlarını şekillendirdiği gibi epistemolojik işleyiş alanını da belirler. Bu araştırmanın amacı, klasik fıkıh usulüne ait bilgi anlayışının temel kavramlarını sunmak ve kuramsal yapısını kendi iç çeşitliliğiyle birlikte ortaya koymaktır.Araştırma temelde dört ana bölümden oluşmaktadır. Birinci bölüm, usûlcülerin bilgi anlayışlarına geçmeden önce fıkıh usûlünün içinde filizlenip geliştiği epistemolojik çevrenin kuramsal ve kavramsal düzeyde özetle tanıtılmasını amaçlamaktadır. Bu çerçevede ilk bölümde İslâm ilim çevrelerinde görülen bilgi anlayışına kelâm-felsefe geleneği merkeze alınarak genel bir bakış yapılmıştır. İkinci bölümde, usûlcüler açısından bilginin mâhiyeti incelenmiştir. Bu bölüm, kendi içinde bilginin tanımı ve kısımları iç başlıklarına taksîm edilerek ele alınmıştır. Usûlde bilginin kaynaklarının ele alındığı üçüncü bölümde, bilginin dayanakları konusunda usûlcülerin bakış açıları belirlenmeye çalışılmıştır. Bu amaçla duyular, akıl ve haberin bilgiye götürüp götürmeyeceği, götürüyorsa hangi tür bilgiye ulaştıracağı soruları üzerinde durulmuştur. Kaynaklardan elde edilen bilginin tek tip olmayacağı, birçok bilgi seviyesinin söz konusu olacağı tahmin edilebilir. Buna bağlı olarak insanın elde ettiği farklı güçlerdeki bilgi seviyeleri, bilginin imkânı ile birlikte, usûlde bilginin değerini ortaya koymayı hedefleyen son bölümde incelenmiştir. Usûldeki bilgi anlayışı çerçevesinde verilen tanımlar arasında temsîl kabiliyeti taşıyanların Arapça karşılıkları ekte verilmiş, dipnotlar aracılığıyla ekteki karşılıklarına atıfta bulunulmuştur.Sonuç olarak klasik fıkıh usûlündeki bilgi anlayışı, bilginin mâhiyeti, kaynağı ve değeri meselelerinden hareketle kavramsal ve kuramsal yapısıyla ortaya konulmaya çalışılmıştır. Böylece fıkıh usûlünün epistemolojik zemini ve bu zeminin taşıdığı imkân ve sınırlılıklar gösterilmiştir.Anahtar Kelimeler : Fıkıh usûlü, bilgi, bilginin mâhiyeti, kadîm bilgi, hâdis bilgi, zarûrî bilgi, istidlâlî bilgi, istidlâl, nazar, delil, emâre, tasavvur, tasdîk, bilginin kaynağı, duyular, akıl, haber, bilginin değeri, bilginin imkânı, bilginin gücü"
