abstract: "Bu tez, Muhammed Münîb el-Ayıntâbî'nin“Teysîrül-mesîr fî Şerhî's-Siyeri'l-kebîr”isimli eserinin başlangıç kısmından 'el-Enfâl' bâbına kadar tahkik ve incelenmesi konusunu amaçlamaktadır. Bu eser, Müellif tarafından İmam es-Serahsî'ye ait“Şerhu's-Siyeri'l-kebir”adlı eseri üzerine yazılmış ilk haşiyedir. İmam es- Serahsî'ye ait bu eser, Hanefî meszhebinde 'zâhirü'r-rivâye' kitaplarından biri olarak kabul edilen İmâm Muhammed b. Hasan eşŞeybânî'nin“Es-Siyerü'l-kebîr”adlı eseri üzerine yazılmış bir şerh niteliğindedir. Tez, bir giriş, iki bölüm ve tahkik edilen Kısmı içermektedir. Giriş bölümünde, tezin konusunu, amacını, izlenen metodolojiyi ve kaynaklarının değerlendirmesini ele almaktadır. Birinci bölüm, Muhammed Münîb el-Ayıntâbî'nin hayatını tüm yönleriyle incelemektedir. İkinci bölüm, el yazmasını, tahkik sürecinde kullanılan nüsahları ve takip edilen metodolojiyi değerlendirmektedir. Tahkik edilmiş kısımda ise, tahkik kurallarına uygun olarak metnin en iyi şekilde ortaya konulması amacıyla dört adet el yazması arasında karşılaştırma yapılmıştır."
