abstract: "Tarih boyunca insanlar sahip olmadıkları ve ihtiyaç duydukları şeyleri elde edebilmek için alışveriş yapmışlardır. Alışverişin yöntemleri değişmekle birlikte temel amacı hiç değişmemiştir. Gün geçtikçe edinilen tecrübeler, tarafların tam olarak memnun olacağı ideal sözleşme yapısının elde edilebilmesi için alışveriş yöntemlerini şekillendirmiştir. Şart kurumu, bu gelişimin en önemli adımlarından biridir. Taraflar şart sayesinde tam olarak memnun olabileceklerini düşündükleri sözleşmeyi kendi iradelerine göre tasarlamaktadırlar. Sözleşmenin kuruluşunu taraflardan birinin tek taraflı iradesine bağlayan mutlak iradî şart da eski zamanlardan beri ihtiyaç duyulan işlemlerdendir. Öyle ki bu şarta, genel esaslara aykırı olmasına rağmen istisna olarak Roma hukukunda \"pactum displicentiae\", İslâm hukukunda \"şart muhayyerliği\" vb. isimler adı altında izin verilmiştir. Türk hukukunda \"beğenme koşuluyla satış\" olarak isimlendirilen bu şart, günümüzde istisnaî bir işlem olmaktan çıkıp Kara Avrupası kanunlarındaki yerini almıştır. Fakat hukukçular onun hukuki niteliği hususunda hala görüş birliğine varamamışlardır. Nitekim, Kara Avrupası hukukunda beğenme koşuluyla satışı bir \"şart\" olarak görenlerin yanı sıra \"ön sözleşme\", \"opsiyon\", \"isimsiz-aynî sözleşme\" veya kabul bekleyen bir \"icap\" görüşleriyle açıklayan hukukçular da vardır. Onun şart olduğunu kabul edenler ise alelade şart mı yoksa mutlak iradî bir şart mı olduğu hususunda tartışmışlardır. Şart muhayyerliği fıkıh kitaplarının satış sözleşmesi bölümlerinde en başta ele alınacak kadar önemli olmasına rağmen tespit edebildiğimiz kadarıyla İslâm hukukunda onun hukuki niteliği üzerine yapılmış bir inceleme yoktur. Hatta bazı yazarlar tarafından beğenme koşuluyla satışın İslâm hukukundaki karşılığının sevm-i şirâ (satış pazarlığı) olduğu veya bu koşulun takyidî bir şart olduğu söylenerek onun hukuki niteliği hakkında katılmadığımız bir tespit yapılmaktadır. Bu çalışmanın başlıca amacı, şart muhayyerliğinin İslâm hukukunda sözleşmelerdeki öneminin sebebini tespit etmek, onun hukuki niteliğini belirlemek ve fıkıh kitaplarında dağınık olarak yer alan hükümlerini bütüncül bir şekilde ele almaktır."
