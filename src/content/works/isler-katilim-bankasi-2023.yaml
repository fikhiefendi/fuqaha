abstract: "Bu araştırma, katılım bankası müşterilerinin sigorta poliçesi yenileme isteklerinin farklılaşmasındaki sebeplerin araştırılması ve incelenmesi amacıyla yapılmıştır. Bu gerekçe ile özel ve kamu banka müşterilerinin sigorta poliçesi yenileme istekleri; cinsiyet, yaş, medeni durum, eğitim durumu, müşteri türü, bankalarla çalışma geçmişi, meslek grubu, aylık gelir düzeyi, sigorta yaptırma nedeni ve kullanılan sigorta ürünü değişkenleri açısından incelenmiştir. Araştırmaya 18 ile 60 yaş aralığında toplam 350 kişi katılmıştır. Araştırmanın verilerini toplamak için demografik bilgi formu ve anket çalışması hazırlanarak, çevrimiçi form şeklinde katılımcılara ulaştırılmıştır. Toplanan verilerin istatistiksel analizleri SPSS 20.0 programı ile yapılmıştır. Analizler için normallik testi uygulanmış ve puanların normal dağılım gösterdiği anlaşılmıştır. Bu sebeple iki bağımsız grup karşılaştırması için t-testi, çoklu gruplar için Tek Yönlü Varyans Analizi, kategorik değişkenler arasındaki ilişkilerin tespit edilmesi için Ki-Kare analizi, anket maddelerinin güvenirlik analizleri için Cronbach's alpha değeri (0,90) ve iç tutarlılık değerleri (0,84) hesaplanmıştır. Yapılan analizler sonucunda katılımcıların sigorta poliçesi yenileme isteklerinin; yaşa, medeni duruma, eğitim düzeyine, sigorta yaptırma nedeni ve sigorta ürün tercihlerine göre anlamlı farklılık gösterdiği tespit edilmiştir. Bunun yanında katılımcıların sigorta poliçesi yenileme istekleri; cinsiyet, müşteri türü, bankalarla geçmiş çalışma yılı, meslek grubu, aylık gelir düzeyine göre anlamlı bir farklılık göstermemiştir."
