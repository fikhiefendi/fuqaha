abstract: "Bir cinsel suç türü olarak tecavüz, genellikle kamu düzeni ve ahlakına karşı bir tehdit olarak görülmüştür. Her toplum, tecavüzün önlenmesi ve cezalandırılması için kendi kanunlarını yapmış ve uygulamıştır. Osmanlı otoriteleri de tecavüzü sadece bireye karşı işlenen bir suç olarak değil aynı zamanda İmparatorluğa karşı işlenen bir suç olarak değerlendirmiş ve gerekli hukuki çalışmaları yürütmüştür. Ancak, Osmanlı hukuk literatüründe tecavüzün ne olduğunu doğru bir şekilde anlamak için; öncelikle, İslam hukukunun tecavüzü nasıl tanımlandığı ve İslam hukukunun Osmanlı hukuk geleneğine etkisi dikkatlice analiz edilmelidir. Bu analiz, Tanzimat Fermanı (1839) sonrasında Osmanlı hukuk kaynaklarında tecavüzün tanımlanması hususundaki devamlılığı ya da farklılığı tespit etme imkânı sağlamaktadır. Özellikle; Tanzimat sonrası, Osmanlı hukuk anlayışı, kanunlaşma hareketi sonucunda, daha nesnel ve standart bir hal almış ve hukuk sistemindeki yenilikler, tecavüzün tanımlanmasına ve cezasının belirlenmesine ciddi bir şekilde etki etmiştir. Nitekim, 1838-1876 yılları arasında en yetkili hukuk kurumu olarak hizmet etmiş olan Meclis-i Vala'ya yansıyan tecavüz vakalarına dair, tecavüz suçunun mahkeme sürecini aydınlatmak ve mahkemenin tecavüz suçunu nasıl ele aldığını analiz etmek için, önemli veriler içermektedir. Ayrıca, 1858 Ceza Kanunu'ndan sonra, cinsel suçlar tek bir başlık altında toplamış ve tecavüz için verilecek olan cezalar, teşhir, kürek, hapis ve tazminat olarak belirlenmiştir. Şöyle ki; Meclis-i Vala'daki tecavüz dava kayıtları, 1858 Ceza Kanunu'nda homoseksüel ve heteroseksüel tecavüz suçları ile ilgili maddeleri nasıl ele aldığını ve yargılama sürecinin nasıl yansıtıldığını analiz etmek için büyük bir fırsat sağlamaktadır. Nitekim, bu araştırmanın amacı, öncelikle; Osmanlı ceza kanunlarında ve mahkeme kayıtlarında tecavüzü tanımlamak için kullanılan terimleri analiz ederek terminolojik değişimi göstermektir. Daha sonra, 19.yy'da, Meclis-i Vala'da görülen tecavüz davalarının yargılanma sürecini 1858 Ceza Kanunu ve 1858-1868 yılları arasındaki Meclis-i Vala kayıtlarını kullanarak hukuki devamlılığı veya değişikliği ortaya çıkarmaktır."
