abstract: "Osmanlı sosyo-ekonomi tarihi için önemli kaynaklardan yer alan tereke defterleri yerel özelliklere ait pek çok bilgiyi barındırması nedeniyle önemli kaynaklardandır. Çalıştığımız tereke kaydı Şer'iyye sicili içerisinde yer almaktadır. Bu çalışmada Denizliye ait 1892-1896 yılarını kapsayan Şer'iyye sicilinin içerisinde yer alan terekelerden 96 tane terekenin transkripsiyon ve değerlendirilmesi yapılmıştır . Çalışmamızın giriş kısmında bu konu üzerinde yapılan çalışmalarla ilgili literatürdeki önemli kaynaklara değindik.Denizli'nin coğrafi konumu ve tarihçesinden sonra terekeler hakkında bilgi verip terekelerin neleri kapsadığını , İslam miras hukunundan yola çıkarak terekelerin nasıl dağıtılacağı ve bunun dağıtım aşamasına kadar gelen süreçler hakkında bilgi verdik .Çalıştığımız defter hakkında bilgi verip son kısımda ise terekelerde bulduğumuz eşyaların değerlendirmesini ve bunların Denizli'ye ait yerel yaşam tarzındaki önemini, sosyo-ekonomik hayatın izlerini bulmaya çalışıldı."
