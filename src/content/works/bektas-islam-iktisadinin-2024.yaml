abstract: "İslami finans standartları, klasik fıkıh birikimi ve mevcut iktisadi ve finansal ihtiyaçları dikkate alarak İslami finans kurumlarının işleyişini belirlemeyi hedefleyen metinlerdir. Bu standartları dünya genelinde oluşturan kuruluşlar, genellikle Körfez ülkeleri, Malezya ve Endonezya gibi İslami finansın geliştiği Asya ülkeleri ve Türkiye gibi ülkelerde yer almaktadır. Farklı coğrafyalarda çalışan farklı kuruluşlar, benzerliklerin yanı sıra birçok farklılık ve zenginliği de ortaya koymaktadır. Bu kuruluşların kurumsal yapıları, standart hazırlama yöntemleri, klasik fıkıh mirasıyla ilişkileri, danışma kurulları yapıları ve özellikle fıkıh hükümlerinin dayanakları önemli konulardır ve araştırmanın temel konularını oluşturmaktadır. İslami finans standartları fıkhi yönü olan metinler olması hasebiyle klasik fıkıh ile bir şekilde ilişki kurmak durumundadır. Bu ilişkinin mahiyeti tezin temel amacını teşkil etmektedir. Bu amaç doğrultusunda İslami finans standartları geliştiren altı kuruluş tespit edilmiştir. Bu kuruluşlar AAOIFI, IFSB, TKBB, IIFM, DSN-MUI ve SACBNM'dir. İslami finans standartlarında klasik fıkıh ile ilişkilerinin görülebileceği en net alan hükümlerin gerekçelendirme ve dayanakları kısımlarıdır. Tezde de bu doğrultuda altı ayrı kurumdan on farklı konuda 44 standart tespit edilerek bu minvalde ele alınmıştır. Standartların incelenmesi neticesinde klasik fıkha hem kaynak hem de yöntem olarak İslami finans standartlarında sıkça başvurulduğu görülmüştür. Standartları dayanaklarında başvurulan yöntemler ise genel itibarıyla naslar, genel fıkıh ilkelerinden ibaha, zaruret, maslahat ve sedd-i zerai, klasik fıkıh kaynakları, diğer kuruluşların standart ve fetvaları, kıyas, kaideler, mezhep görüşleri, görüş birliği ve örf ve teamül olarak ifade edilebilir. İslami finans standartlarında genel hatlarıyla klasik fıkhın kutsanmadan fakat göz ardı da edilmeden dengeli bir kullanıma sahip olduğu, kuruluşların kendilerine has bazı kullanım alışkanlıklarının olduğu, çoğu zaman gösterilen dayanakların haklı gerekçelere dayandığı, literatürde çokça eleştirilen zaruret ve maslahat temelli yaklaşımların usulsüz kullanımlarının yaygın olmadığı kanaatine ulaşıldığını ifade etmek mümkündür."
