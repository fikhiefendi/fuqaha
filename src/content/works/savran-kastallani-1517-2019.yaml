abstract: "Şehâbeddîn Ahmed b. Muhammed el-Kastallânî, 851-923/1448-1517 yılları arasında Memlüklerin hüküm sürdüğü Kâhire'de yaşamış, kıraat, hadis ve siyer alanlarında verdiği eserlerle tanınmıştır. Yazmış olduğu eserler günümüzde de değerini korumaktadır. Kastallânî'nin el-Mevâhibü'l-ledünniyye bi'l-minehi'l-Muhammediyye adlı eseri hacimli bir siyer telifidir. Zengin muhtevasıyla bilinen ve farklı ilim dallarında iki yüze yakın kaynaktan istifade edilerek yazılan el-Mevâhibü'l-ledünniyye üzerine pek çok şerh, hâşiye, talik ve tercüme çalışması yapılmıştır. Eser, Osmanlı coğrafyasında da yaygınlık kazanmış ve çevirileri yapılmıştır. Bu çalışmada el-Mevâhibü'l-ledünniyye, müellifiyle birlikte tanıtılmış; kaynakları ve kaynak kullanım usulleri açısından incelenmiştir. Eserin siyer edebiyatı içerisindeki yeri ve öneminin yanı sıra günümüze kadar uzanan etkilerine işaret edilmiştir."
