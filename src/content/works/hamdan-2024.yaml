abstract: "Bu çalışma, dijital kripto para birimlerinin teorik çerçevesine, kökenine, kullanimina ve Bitcoin gibi bilinen kripto para birimlerine alternatif olarak bankalar, bireyler ve kurumlar tarafindan kabul edilen merkezi bir dijital para biriminin geliştirilme olasiliğına odaklanmiştir. Çalışmada dijital para birimlerinin ve kripto para birimlerinin, özelliklerinin, elde edilme mekanizmalarinin ve kullanimlarinin belirlenmesi amaçlandi. Daha sonra dijital para birimlerinin İslami, ekonomik ve hukuki geleceği açiklanacak, daha sonra hukuki görüşler gösterilecek ve son olarak dijital para birimlerinin merkez bankaları için mevcut durumu, ihraç mekanizmalari, yararlari ve riskleri tartişilacaktir. Bu çalişmada kullanilan tümevarimsal yaklaşim ve dijital para birimleri hakkinda, ekonomik etkilerinin yani sira kuruluşundan mevcut durumuna kadar tüm detayları kapsayan, ardından yasal ve şeriat adaptasyonuna ilişkin derinlemesine bir liretim incelemesi yapilmiştır. Çalişmada merkez bankalari için dijital para birimlerinin geliştirilmesine ilişkin küresel durum ve onlarin kullandıği yaklaşimlar gözden geçirildi. Daha sonra analitik yaklaşım, AIDC adinin verildiği, merkez bankasina bağli, İslami ve yasal olarak kabul edilebilir bir dijital kripto para birimi için önerilen bir model geliştirmek için kullanildi. Çalişma, dijital ve kripto para birimleri ile herhangi bir ülkede merkez bankasina bağli bir dijital para biriminin geliştirilmesi hakkinda gerekli bilgilere açiklik getirdi. Çalışma, bir ön dijital para modeli tasarlamak ve gerekli düzenleme ve talimatlari geliştirmek için daha fazla araştırma yapilmasini öneriyor. Ayrica, özel bir ağ içerisinde birden fazla ülke arasinda kullanilacak dijital para biriminin geliştirilmesi."
