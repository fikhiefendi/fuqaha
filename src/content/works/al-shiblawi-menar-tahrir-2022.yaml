abstract: "İsrâiliyat rivayetleri hâlâ tefsir kitaplarında büyük bir kısım işgal etmektedir. Hiçbir müfessir yoktur ki onlardan ya kabul ederek ya da reddederek bir rivayet almış olmasın. Menar Tefsirinin yazarı Muhammed Reşid Rıza ve aynı şekilde Tahrir ve Tenvir tefsirinin yazarı İbn Aşur bu rivayetlerden almış ve tefsirlerinde onlardan bahsetmişlerdir. Her ikisininde tesirlerinde bu rivayetlere yer vermeleri ile ün kazanmaları ve bu rivayetlerdeki metotlarının açıklığa kavuşturulmasının ehemmiyetine binaen“MENÂR ve et-TAHRÎR ve't- TENVÎR TEFSİRLERİ ARASINDA İSRÂİLYAT İLE İSTİŞHAD -MUKAYESELİ ÇALIŞMA-”başlıklı bir tez yazmaya karar verdim. Tez bu iki müfessirin İsrâiliyat rivayetlerini ele alma tarzlarını ve bu tür rivayetler hakkındaki tutumlarını A'dan Z'ye kadar açıklar. İsrâiliyatın önemi, kısımları, bu rivayetlerden hangileri üzerinde ittifak ettikleri ve diğer hususlar. Ayrıca kitaplarında bu rivayetlerden ne kadar sayıda delil getirildiği de beyan edilmiştir. Tez, önsöz, giriş, üç ana bölümden oluşmaktadır. Birinci ana bölümde İsrâiliyat rivayetlerin kabul ve ret delilleri, bu konudaki ihtilafın kaynağını ve bu nakiller arasında en racih olanı zikreder. İkinci ana bölümde, karşılaştırmaya başlar. Üçüncü ana bölüm ise, iki müfessirin bu rivayetlerde ittifak ettiği hususlara ve tefsirlerinde toplam kaç sayıda yer verdiklerine ayrılmıştır."
