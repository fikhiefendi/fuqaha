abstract: "Günümüzde faizsiz bankacılık ve ev finansman modeli uygulamaları oldukça yaygın olarak kullanılmaktadır. Özellikle ev sahibi olma ve borcunu ödeme durumlarında karşılaşılan zorluklar, ev finansmanı modellerinde farklı ödeme yöntemlerini geliştirme sonucunu doğurmaktadır. Ortaklığa Dayalı Konut Finansmanı Modeli'nde, geri ödemeler kişinin gelir düzeyine ve ekonomik yapısına göre her bir dönem için eşit olmakla birlikte miktarsal yada oransal farklılıklar göstermektedir. Bununla birlikte, geri ödemeler ve kira gelirleri ile müşterinin hissesinin arttığı, finansörün hissesinin azaldığı, borçlanma esasına dayanmaktadır. Çeşitli modeller ile elde edilen formüller literatürde yer almaktadır. Ancak bazı problemlerin çözümünde bu formüller yetersiz kalmaktadır.Bu çalışmada, Ortaklığa Dayalı Konut Finansmanı Modeli'ndeki bazı varsayımlar genişletilerek geri ödemelerin ve özellikle de kira miktarlarının eşit, parçalı geometrik ve aritmetik eğilimli seri şeklinde olduğu durumlar için yeni formüller elde edilmektedir. Elde edilen formüllerde, geri ödemeler ile kira gelirleri arasındaki ilişkiler belirlenmektedir. Ayrıca geliştirilen modeller için sayısal örnekler ve çözüm önerileri verilmektedir. Geri ödemelerdeki ve kira gelirlerindeki değişimlerle birlikte ödeme süresi bilgisayar çözümleri ile incelenmektedir."
