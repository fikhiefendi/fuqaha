abstract: "İslâm alimleri Kur'an tebliğinin iyi anlaşılması için, bugün bizim“Usûlul-Fıkh”veya“Hukuk Metodolojisi”dediğimiz birtakım kural ve prensipler ortaya koymuşlardır. Tabiûn döneminden sonra tedvin edilmeye başlanan bu ilim, zamanla daha da sistemleştirilerek, müçtehidlerin Kur'an'a yaklaşanlarını ve ona bakış açılarını ortaya koymuştur. Bu ilim Kitap ve Sünnetten ibaret yazılı ve değişmez iki temel kaynak ile, durmadan akıp giden hayatın getirdiği yeni olay ve problemler arasında bir ilişki kurma ve yeni çözümler üretme imkanını sağlamıştır. Nasların nasıl doğru anlaşılacağı, yeni olaylar karşısında nasıl bir yol izleneceği ancak bu ilim sayesinde öğrenilebilir. Dolayısıyla bütün müçtehidler, nasslardan hüküm istinbat etmeye vasıta olan metod ve kuralları ortaya koyan usûl ilmine çok önem vermişlerdir. Bu nedenle fâkih ve müfessirlerin birçoğu, özellikle ahkâm tefsiri yazanlar. Fıkıh Usûlü konusunda eserler vermişlerdir. İşte Râzî de bu kervana katılarak, önce“el-MahsûFu kaleme almış ve bu eserinde ortaya koyduğu metodolojisini, çalışmamızda verdiğimiz örneklerde de görüleceği üzere, Mefatihu'1-Gayb isimli tefsirinde zorlanmadan uygulama fırsatını bulmuştur. Müfessirimiz, özellikle ahkâm ayetlerinde lafızların iyi anlaşılması ve sonuçta kastedilen mananın ortaya çıkması için usûl kuralları uygulamasına büyük önem vermiş, dolayısıyla derin lafzı ve mantıkî yorumlar yapmıştır. Hüküm çıkarmak amacıyla ayetlerde geçen bazı kelimeleri, Arap dilinin inceliklerini de göz önüne alarak, ”hâss, âmm, hakikat, mecaz, müşterek, muhkem, müteşabih ve mücmel“ gibi kısımlara ayırarak, bunların her birine, bir zenginlik ve açılım ifade etmek üzere, ayrı ayrı manalar vermiştir. Bu çalışmamızı okuyanlar onun ayrıca, ”tearuz, nesh, tercih, te'vü ve lafızların manaya delâleti\" gibi konulara da, yer verdiğini ve ilginç tesbitler yaptığım müşahade ederler. Ayrıca RâzTnin usûl ile ilgili görüşleriyle, tefsirindeki uygulamaları arasında bir iki istisna hariç tam bir ahenk mutabakatın mevcut olduğu da kendiliğinden ortaya çıkar."
