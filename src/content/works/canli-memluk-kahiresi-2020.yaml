abstract: "Hanefîliğin Mısır'da tanınması 2./8. asrın ortalarına kadar uzansa da mezhebin bölgede dikkate değer bir müntesip varlığına sahip olması ancak Memlükler döneminde (648-923/1250-1517) gerçekleşmiş, Memlüklerin merkezi olan Kahire müteahhir dönemde Hanefîlerin varlık gösterdiği en önemli merkezlerden biri haline gelmiştir. Bu çalışma, Hanefî mezhebinin ilgili dönem ve bölgedeki tarihi gelişimine odaklanarak Memlük Kahiresi'ne nispet edilebilecek Hanefîleri teşhis etmeyi, incelemeyi ve böylelikle söz konusu Hanefî varlığının öne çıkan hususiyetlerini ele almayı hedeflemektedir. Tabakatların ve tarih kaynaklarının yoğun bir şekilde kullanıldığı çalışmada Memlükler döneminde Kahire'de bulunduğu ifade edilen Hanefîler tespit edilmiş, Hanefîleri ilgilendiren gelişmeler ve önemli dönüm noktaları kaydedilmiş, elde edilen bilgiler ışığında Kahire'deki Hanefî varlığını esas alan bir dönemlendirme ortaya konmaya çalışılmıştır. Söz konusu dönemlendirmeye göre tertip edilen tez, iki bölümden oluşmaktadır. Memlüklerden önceki sürece yoğunlaşan birinci bölümde ilk olarak erken dönemdeki (2-6./8-12. asırlar), sonrasında Eyyûbîler dönemindeki Hanefîlik konu edilmiştir. İkinci bölüm ise Memlükler dönemine tahsis edilmiştir. İlk Hanefî kadılkudatın tayininden (h. 663) Memlüklerin sonuna kadar uzanan bu zaman dilimi, üç dönem halinde ele alınmıştır."
