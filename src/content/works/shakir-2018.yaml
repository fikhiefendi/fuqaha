abstract: "AraĢtırmamızda, Ġslâm hukuku ile günümüz hukuku kaynaklar, ceza hukuk ve kazaî deliller açısından karĢılaĢtırılması yapılmıĢtır. Birinci bölümde geçmiĢ milletlerin inanç ve hukuklarına değinilmiĢtir.Tarih ve Kur‟ân-ı Kerîm perspektifinde Sümerler, Babiller, Asurlular, Yunanlılar, Romalılar, Eski Mısırlılar ve Câhiliye döneminde yaĢamıĢ olanların hukuklarının ele alındığı bu bölüm Ġslâm hukukunun ortaya çıkma sürecinin anlatılmasıyla sonlandırılmıĢtır. Ġkinci bölümde de Ġslâm hukuku ve günümüz hukukunun kaynakları incelenmiĢtir. Ġslâm hukukunun kaynaklarına öncelik verilerek bu kaynakların aslî (birincil) ve fer„î (ikincil) Ģeklinde ikili ayırımı üzerinde durulmuĢtur. Aslî kaynakların sırasıyla Kur‟ân, sünnet, icmâ ve kıyastan ibaret olduğu vurgulandıktan sonra Kur‟ân lafzının delâlet açısından kat„î ve zannî olarak ikiye ayrıldığı konusu ele alınmıĢtır. Bu bölümde sünnetin Ġslâm hukukunun ikinci dayanağı olduğu özellikle de Kur‟ân‟ın sünnetle nesh edilebileceği meselesine etraflıca iĢlenmiĢtir. Ġcmâ ve kıyas dayanaklarının da ele alındığı bu bölümdeyasama, örf, geleneksel ilkeler ve adalet kurallarından ibaret olan vaz„î/beĢeri hukuk (ilgili ve yetkililer tarafından oluĢturulmuĢ hukuk kurallarına) da yer verilerek bir karĢılaĢtırmaya gidilmiĢtir. Üç ayrı baĢlık altında ele alınan üçüncü bölümde ise genel bir Ģekilde suç kavramının Ġslâm hukuku ve beĢerî hukuk boyutu incelenmiĢtir. Hadd cezalarının anlatıldığı birinci baĢlığın altında gerek Ġslâm hukuku gerekse beĢeri hukuk bazında haddin tanımı, çeĢitleri ve boyutları ele alınmıĢtır. Sonrasında ilgili alandaki söylemlerin bir arada toplanılabilmesi hasebiyle Malikilerin görüĢüne öncelik verilerek yedi tane suç unsuru sırasıyla incelenmiĢtir. Zina suçu, zina suçunun tespitine yönelik deliller, Ġslâm ve beĢeri hukuka göre cezası karĢılaĢtırmalı bir Ģekilde aktarıldıktan sonra fıkhî mezheplerin yaklaĢımları ile günümüz hukukunun öngörüleri bağlamında kazif, içki içme, hırsızlık,yol kesme, irtidâd (Ġslâm dininden çıkma), zülüm ve haksızlık suçları mukayeseli bir Ģekilde incelenip değerlendirmeye tabî tutulmuĢtur. Üçüncü bölümün ikinci baĢlığı altında kısas ve diyet gerektiren suçlara değinilerek \"katl\" yani öldürme fiili ve fıkıh kitaplarında yer alan tüm benzeri eylemler tanıtılmıĢtır. Katl fiilinin üç çeĢidinin irdelendiği bu baĢlıkta her bir çeĢidi iki hukuk açısından mukayeseli olarak değerlendirilmiĢtir. Ayrıca varis olma ve vasiyet etme durumlarına da değinilmiĢtir. Üçüncü bölümün üçüncü baĢlığında ise ta„zîr gerektiren suçlar incelenmiĢ ta„zîrin ne olduğu, meĢruiyeti, çeĢitleri ve yargıdan sorumlu en üst kimlikli hâkimin, hakkında herhangi bir nassın olmadığı suçlarda yetkisini kullanarak uygun bir ceza verebileceği konusu üzerinde durulmuĢtur. Dördüncü bölümde ispat konusu Ġslâm hukuk ve beĢeri hukuk açısından incelenmiĢtir. Ġspat yollarından biri olan ikrar (itiraf) dan baĢlanarak tanımı, meĢruiyeti, Ģartları, rükünleri ve ilgili hükümler mukayeseli bir Ģekilde ele alınmıĢtır. Daha sonra Ģahitlik, tanıklığın reddi, yeminin reddi, yazı, parmak vs. izi, ip uçlar, yemin, hâkimin bilgisi, tanık ve bilir kiĢi raporları gibi diğer ispat delilleri detaylı bir Ģekilde ele alınmıĢtır. Bu bağlamda modern yöntemler olarak anestezi, hipnotize, yalan makinesi, eğitimli köpekler ve DNA‟nın ispattaki rolü üzerinde de ayrıca durulmuĢtur. Gâib (kaybolmuĢ-kendisinden haber alınamayan) kiĢinin Ġslâm ve beĢeri hukuka göre konumunun irdelendiği beĢinci bölümde gâibin tanımı, gâib sayılma süresi, gâible ilgili ilahi ve beĢerî hükümler mukayese edilmiĢtir. ÇalıĢmamızın sonunda araĢtırmamızdan elde ettiğimiz sonuçlar özetlenerek araĢtırma sonlandırılmıĢtır."
