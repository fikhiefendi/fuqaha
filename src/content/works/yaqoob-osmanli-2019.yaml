abstract: "Çalışmamız, 1858 yılında çıkarılan Ceza Kānunnâme-i Hümâyunuyla 1969 yılında çıkarılan Irak Ceza Kanunlarının Hanefi mezhebi esas alınarak mukayesesini konu edinmektedir. Böylelikle her iki kanunun Hanefî merkezli İslam Ceza Hukuku hükümleriyle uyuşan ve çakışan yanlarının ortaya çıkarılması hedeflenmektedir. Araştırmamız üç bölümden oluşmaktadır. Birinci bölüm genel ceza prensiplerine dairdir. Bu bölüm de, kendi içinde şu üç alt başlığa ayrılmıştır: Birinci alt başlıkta, İslam ceza hukukunun mahiyeti, ortaya çıkış keyfiyeti ve kaynakları; ikincisinde, suçların ve cezaların şer'îliği/hukukiliği ilkesi ve ceza hukukuna ilişkin ihtilafa açık olan dini metinlerin yorumlanma keyfiyeti; üçüncüsünde ise, ceza hukukunun kapsam ve sınırlarının, zaman, mekân ve şahıslar açısından beyanı üzerinde durulmuştur. İkinci bölüm suç kavramı hakkındadır ki, bu bölüm ise şu dört alt başlıkta incelenmiştir: Birincisinde, mücrimin /suçlunun kimliği ve suç işlemenin aşamaları; ikincisinde, suçları oluşturan genel unsurları; üçüncüsünde işlenen suçların şekillerinin beyanı; son olarak dördüncüsünde ise, cezai sorumluluğa engel teşkil eden hususların izahı ve bazı suç eylemlerinin mubah kılınmasının sebepleri ortaya konulmuştur. Üçüncü bölüm ise ceza konusuna tahsis edilmiştir. Bu bölüm de, şu alt başlıkları havidir: Birincisi, suçun mahiyeti, hedefleri, ilkeleri, özellikleri ve çeşitleri; ikincisi, hakimin cinayet işleyen kişinin içinde bulunduğu ortam ve şartları gözeterek ceza vermesi; üçüncüsü ise cezaların hangi yollarla düştüğü konusundadır. Bu araştırma vesilesiyle ulaşılan en önemli neticelerden biri ise, Ceza Kānunnâme-i Hümâyununun bazı İslam ceza hukuku hükümleriyle çelişmiş olmasıdır ki, bunların en önemlisi hadlerle ilgili cezaları tamamen ihmal ederek bunların yerine tazir cezalarını getirmesi ve tatbik etmesidir. Bu dönemde uygulanan tazir cezaları ise İslam ceza hukukuna tamı tamına aykırıdır. Yine Osmanlıların kısas suçlarına yaklaşımları ve bu konudaki uygulamaları, pek çok İslami nassa aykırılık teşkil etmektedir."
