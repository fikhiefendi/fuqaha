abstract: "Ekonomik ve finansal sistemde rol almak isteyen gerçek ya da tüzel kişilerin kararlarını etkileyen dini hassasiyetler, İslam dininin ekonomik hayata yönelik emirlerine uygun yeni bir sistem oluşturulması ihtiyacını doğurmuştur. Temel olarak bu ihtiyaçtan doğan İslami finans sistemi, özüne uygun ürünler üretmektedir. Bu ürünlerden biri olan ve mevzuatımızda“kira sertifikası”adıyla düzenlenen“sukuk”, ülkemizde ve dünyada önemli bir gelişim göstermektedir. Bu çalışmada ilk olarak finansal sistem içindeki sermaye piyasalarına değinilmiş, ardından İslami finans sistemi içinde yer alan katılım bankacılığı incelenmiştir. Katılım bankalarınca bir ürün olarak sunulan sukuk, tüm yönleriyle ele alınmıştır. Sonrasında Türkiye'de yapılan sukuk ihraçlarının gerçekleşme şekli ve bu ihraçlara yönelik sayısal bilgiler sunulmuştur. Çalışmada son olarak sukuk ile ilgili vergi düzenlemelerine ve muhasebe uygulamalarına yer verilmiştir."
