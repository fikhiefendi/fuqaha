abstract: "Bu tez çalışması, sürdürülebilir kalkınma çerçevesinde yenilenebilir enerji kaynaklarının kullanımını ve bu kullanımın stratejik yaklaşımlarını ele almaktadır. Sürdürülebilir kalkınma, ekonomik büyüme, sosyal eşitlik ve çevresel koruma arasındaki dengeyi sağlamayı amaçlamaktadır ve bu bağlamda enerji yönetimi büyük önem taşımaktadır. Yenilenebilir enerji kaynakları, fosil yakıtların sınırlı ve çevresel olarak zararlı olmasına karşılık sınırsız ve çevre dostu alternatifler sunarak, enerji arz güvenliğini artırmakta ve karbon ayak izini azaltmaktadır. Türkiye'nin yenilenebilir enerji potansiyeli, bu alandaki başarıları ve karşılaştığı zorluklar üzerinde durulmuş, enerji politikalarının oluşturulması, ekonomik teşvikler ve düzenleyici çerçeveler gibi konular analiz edilmiştir. Çalışma, yenilenebilir enerji kaynaklarının kullanımının yaygınlaştırılması için enerji verimliliği stratejileri, finansal destek mekanizmaları ve toplumsal farkındalık artırma kampanyaları gibi öneriler sunmaktadır. Bu çalışmada, güneş, rüzgar, hidroelektrik ve biyokütle gibi yenilenebilir enerji kaynaklarının mevcut durumu, bu kaynakların sürdürülebilir kalkınma hedeflerine katkıları ve bu alandaki en güncel gelişmeler ve uygulamalar incelenmiştir. Ayrıca, yenilenebilir enerji teknolojilerinin geliştirilmesi ve yaygınlaştırılmasında karşılaşılan teknik, ekonomik ve politik engeller de detaylı bir şekilde ele alınmıştır. Bu kapsamda İslami finansman alanında yöneticilik yapan 10 kişi ile görüşme sağlanmış ve fenomolojik yöntemle derinlemesine analiz yapılmıştır."
