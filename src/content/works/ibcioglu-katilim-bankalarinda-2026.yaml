abstract: "Bu çalışma, mudârebe finansman yönteminin Türkiye'de katılım bankalarında neden sınırlı düzeyde uygulandığını incelemeyi ve bu sınırlılıkların aşılmasına yönelik kurumsal bir model geliştirmeyi amaçlamaktadır. Teorik olarak risk paylaşımına dayalı ideal bir yöntem olarak kabul edilen mudârebe, uygulamada murabaha gibi borç benzeri ürünlerin gerisinde kalmakta; bu durum normatif üstünlük ile pratik kullanım arasındaki çelişkiyi ortaya koymaktadır. Araştırma, nitel yöntemle tasarlanmış; mudârebe uygulamalarında görev almış 14 banka çalışanı ve 5 sektör temsilcisiyle yapılan yarı yapılandırılmış görüşmelerden elde edilen veriler tematik analizle incelenmiştir. Bulgular, mudârebenin yaygınlaşamamasının başlıca nedenlerini güven ve ahlaki risk algısı, vade uyumsuzluğu, operasyonel zorluklar, uzman insan kaynağı eksikliği ve mevzuata ilişkin belirsizlikler olarak ortaya koymaktadır. Bu sorunların büyük ölçüde kurumsal yapı ve yönetişim eksikliklerinden kaynaklandığı anlaşılmaktadır. Bu çerçevede çalışmada, mudârebe finansmanına uygun bir yapı olarak“İPFŞ”modeli önerilmektedir. Model, işlemlerin uzman birimler aracılığıyla yürütülmesini, izleme ve risk yönetimi ile şer'i uygunluk süreçlerinin kurumsal düzeyde yapılandırılmasını öngörmektedir. Finansman süreci, başlangıçta özkaynak ağırlıklı olup, güven ve performans sağlandıkça alternatif finansman kaynakları kademeli olarak devreye alınmaktadır. Bu yaklaşım, mudârebe projelerinin ölçeklenebilirliğini artırmayı ve yatırımcı tabanını genişletmeyi hedeflemektedir. Sonuç olarak çalışma, mudârebe finansmanını teorik bir ideal olmaktan çıkararak uygulanabilir ve sürdürülebilir bir model çerçevesinde ele almakta ve katılım bankacılığı literatürüne özgün bir katkı sunmaktadır."
