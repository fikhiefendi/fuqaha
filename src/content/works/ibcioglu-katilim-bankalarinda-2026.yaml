title: "Katılım Bankalarında Mudârebe Finansmanının Yaygınlaşamamasının Nedenleri: Katılım Bankası Yöneticileri ile Reel Sektör Temsilcileri Gözünden İnceleme ve İştirak Proje Finansman Şirketi Model Önerisi"
