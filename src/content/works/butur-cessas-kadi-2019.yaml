abstract: "Usûl-i fıkıh metotları içerisinde iki temel ekol yer almaktadır. Bunlardan biri genellikle Hanefî âlimlerin usûl anlayışları doğrultusunda gelişen Fukahâ ekolüdür. Diğeri ise çoğunlukla Şâfiî mezhebine bağlı âlimlerin temsil ettiği Mütekellimîn ekolüdür. Bu çalışmada Hanefî usûl-i fıkıh ekolüne dair günümüze ulaşan en eski eserin müellifi olarak bilinen Ebû Bekir el-Cessas ile Mütekellimîn usûl-i fıkıh ekolünün temel eserlerinden birinin müellifi olan Kâdı Abdulcebbar'ın kıyas anlayışları ele alınmıştır. Buna göre Cessas'ın el-Fusûl fi'l-usûl isimli eseri ile Kâdı Abdulcebbar'ın el-Muğnî fi ebvabi't-tevhidi ve'l-adl isimli eseri çerçevesinde kıyas konuları tahlil ve mukayese edilmiştir. Bu mukayese işleminde her iki âlimin de kıyas tanımları, kıyasın unsurları ve kıyas maslahat ilişkisi başta olmak üzere pek çok konudaki görüşleri karşılaştırmalı olarak incelenmiştir. Böylece Cessas ve Kâdı Abdulcebbar arasındaki kıyas konusundaki ortaklıkların ve ayrışmaların ortaya konması amaçlanmıştır."
