abstract: "Bu tez, Mekkî b. Ebî Tâlib'in (ö. 437/1045) el-Hidâye ilâ Bulûği'n-Nihâye adlı tefsiri özelinde, müellifin Endülüs tefsir geleneği içerisindeki ilmî konumunu incelemektedir. Çalışma, gramer, nakil, kıraat, isrâiliyat ve ahkâm olmak üzere beş temel tefsir argümanı esas alınarak ve Endülüs tefsir geleneği içerisinde eser veren beş müfessir üzerinden karşılaştırmalı bir yöntemle kurgulanmıştır. Bu çerçevede Mekkî b. Ebî Tâlib'in diğer Endülüs müfessirleriyle benzer ve farklı yönleri ortaya konularak Endülüs tefsir tarihi içerisindeki konumu belirginleştirilmeye çalışılmıştır. Araştırma, nitel araştırma yaklaşımına dayalı fenomenolojik desen çerçevesinde tasarlanmış, veri toplama sürecinde doküman incelemesi tekniği uygulanmış, elde edilen veriler içerik analizi yöntemiyle değerlendirilmiştir. Bu verilere göre Mekkî b. Ebî Tâlib'in el-Hidâye adlı eserinin, Endülüs tefsir geleneği içerisinde kurucu bir rol üstlendiği, Doğu tefsir birikimi ile Endülüs tefsir geleneği arasında metodolojik bir irtibat ve geçiş niteliği taşıdığı sonucuna ulaşılmıştır."
