abstract: "Fıkhî Açıdan Katılım Bankacılığında Kaydî Para Üretimi başlıklı tezimizde kaydî paranın üretimine ve kullanımına dair fıkhî meseleleri inceleyerek katılım bankaları tarafından kullanımının analizi amaçlanmaktadır. Bu konunun seçilme nedeni, akademik çalışmalarda yeterince sorgulanmayan ve çoğunlukla arka planda kalan kaydî para üretiminin katılım bankaları tarafından kullanımını, İslam hukukunun temel prensipleri çerçevesinde ele alarak değerlendirmektir. Çalışmada öncelikle paranın tarihsel serüveni ve türleri incelenmiş, ardından bankalar eliyle gerçekleşen kaydî para üretiminin teknik süreçleri ve bu sürecin fıkhî meşruiyeti tartışılmıştır. Katılım bankalarının da konvansiyonel bankalarla benzer şekilde para ürettiği ancak bunun çoğu zaman göz ardı edildiği ya da yeterince sorgulanmadığı ortaya konmuştur. Farklı İslam ekonomistlerinin ve fıkıh alimlerinin konuya dair görüşleri karşılaştırmalı olarak sunulmuş ve kaydî paraya yönelik olumlu, olumsuz ve şartlı kabuller değerlendirilmiştir. Ayrıca tam rezerv bankacılığı gibi alternatif modellerin fıkhî tutarlılığı ve uygulanabilirliği de ele alınmıştır. Çalışma neticesinde, kaydî para üretiminin faiz, enflasyon ve servet eşitsizliği gibi olumsuz sonuçlara yol açtığı dolayısıyla sistemin mevcut haliyle fıkhî ve iktisadî sorunlar barındırdığı sonucuna ulaşılmıştır. Bu bağlamda İslam iktisadı çerçevesinde, para üretimi meselesinin daha derinlikli, disiplinler arası bir bakışla ele alınması ve mevcut sistemin maslahata uygun alternatiflerle yeniden yapılandırılması gerekli görülmüştür."
