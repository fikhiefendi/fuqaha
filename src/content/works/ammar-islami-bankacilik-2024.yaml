abstract: "Şeria, İslami bankacılık faaliyetlerini yönlendiren hukuk sistemini temsil ettiğinden, İslami bankaların performansının analizi, yalnızca finansal yönlerine odaklanan ve Şeria'nın ilke ve hedeflerini göz ardı eden klasik finansal oranlar ve verimlilik ölçümleriyle sınırlı olmamalıdır. Bu çalışma, İslami bankaların performansını geleneksel ölçütlerin ötesinde, tüm paydaşların refahının sağlanması olarak tanımlanan Makâsıdü'ş-Şeria doğrultusunda“İslami”kimliğine vurgu yaparak değerlendirmeyi amaçlamaktadır. Çalışmada aynı zamanda İslami bankaların kamuyu aydınlatma uygulamalarındaki Makâsıdü'ş-Şeria'ya uyumu etkileyen faktörler de incelenmektedir. Şeria'nın 5 amacını (Nefsin, Dinin, Aklın, Neslin ve Malın korunması), 12 unsuru, 25 boyutu ve 25 değişkeni içeren bir endeks geliştirilmiştir. Makâsıdü'ş-Şeria endeksi, İslami bankaların yıllık raporlarında Makâsıdü'ş-Şeria'ya ilişkin faaliyetleri açıklama konusundaki şeffaflık düzeyini yansıtmaktadır. Makâsıdü'ş-Şeria'nın teorik kavramını ölçülebilir göstergelere dönüştürmek amacıyla Sekaran'ın operasyonelleştirme yöntemi kullanılmıştır. Ayrıca İslami bankaların Makâsıdü'ş-Şeria'ya dayalı performansını etkileyen faktörleri belirlemek üzere panel veri analizi yapılmıştır. Örneklem 2017-2021 dönemi için 10 ülkeden 20 İslami bankayı içermektedir. Bulgulara göre, İslami bankalar %40.93 ile Nefis hedefinde en iyi performansı gösterirken onu Din (%38.46), Mal (%37.18), Nesil (%36.48) ve Akıl (%34.46) takip etmektedir. Genel olarak, örneklemin Makâsıdü'ş-Şeria endeksine göre ortalama performansı 40%'ın altındadır. En yüksek puanı %51.02 ile Pakistan'daki Meezan Bankası alırken, en düşük puanı ise yalnızca %15.60 ile Dubai İslam Bankası almaktadır. Panel veri analizi sonucunda, bankanın kuruluş tarihinin Makâsıdü'ş-Şeria endeksi üzerinde anlamlı ve pozitif bir etkisi olduğu belirlenmiştir. Makroekonomik belirleyicilerin etkisi açısından, kişi başına düşen GSYİH büyüme oranının Makâsıdü'ş-Şeria endeksini olumlu yönde etkilediği, insani gelişme endeksinin ise olumsuz yönde etkilediği tespit edilmiştir. Bu çalışma, İslami bankaların finansal ve finansal olmayan kamuya açıklamalarını“İslami”kimliğini yansıtacak ve Makâsıdü'ş-Şeria'ya uyacak şekilde geliştirmeleri gerektiği sonucuna varmaktadır."
