title: "معاني أدوات الشرط والاستفهام عند اللغويين والأصوليين وأثر استعمالها في اختلافالفقهاء / Meânî Edevât'ış-şartı Ve'l-istifham İnde'l- Lugavıyîn Ve'l-usûlıyînı ve Eserü İsti'malihâ Fî İhtilâfi'l-fukahâ"
