abstract: "Dilbilimciler ve usûlcülere göre şart ve istifham edatları konusu ve fıkıhçılarla Arap dili ve belağatı alimlerinin ihtilafına etkileri meselesi, dilbilim, fıkıh ve yan dalları alanlarında büyük bir öneme sahip bulunmaktadır. Bu edatlar dilbilimcilerle usûlcülerin görüş ve düşüncelerinde kendisini bulan türlü çıkarım ve içtihatlara kapı aralayan, hem asıl anlamlarıyla hem kullanıldıkları bağlamda birçok ince ve değişik manalar taşımaktadırlar. Bu konunun sonuçları, dilbilim, fıkıh ve dallarının farklı alanlarındaki İslam alimlerinin büyük çoğunluğunun eserlerinde toplu veya dağınık olarak kendini göstermektedir. Gerçekten dilciler ve usûlcüler, özellikle nahiv, belağat, fıkıh ve tefsir uleması, kelamın ve maksatlarının hakiki, mecazi, temsili, dilâli, lâzimi, mantûki, mefhûmi veya ihtirâzi incelik ve ayrıntılarına ulaşmak için yarış etmişlerdir. Dolayısıyla böyle bir konunun betimsel analitik, tümevarım ve karşılaştırmalı yöntem gibi farklı metotlarla araştırılıp incelenmesi uygun olacaktır."
