abstract: "X TEZ ÖZETİ Tezin adı:“Hanefîlerde ”Kitabu'I- Kerahiyyât“ Konulan ve Hükümleri”Hanefilerin klasik fikıh eserlerinde yer alan“Kerahiyyât”başlığı altında işlenen konuların, çerçevesinin ne olduğu ve bu konulan hangi usul ile işlediklerini esas aldığımız tezimiz; bir giriş ve üç ana başlık olmak üzere dört bölümden oluşmaktadır. Giriş kısmında;“Kerahiyyât”bölümlerinin içinde yer alan konuyla ilgili kavramlann izahı ve bu konuyu işlerken ayn başlıklar kullanan alimlerin konuyu işlerken takip ettikleri usul, aynı başlığı kullanan kitaplar gruplandınlarak açıklanmıştır. Birinci bölümde;“Kerahiyyât”açısından yiyecek-içecek, giyim-kuşam alanlan ve diğer bazı tasarruflar başlığı altında; yiyecekler, içecekler, giyecekler ve ev eşyası ve süsü olarak kullanılan edevatın haram-helal ve mekruh olma noktasından sınıflandınlmaları yapılmıştır. İkinci Bölümde; Kerahiyyât“ açısından aile hayatı ve cinsel hayat başlığı ile; aile hayatı, eşler ve çocuklar arası ilişkiler ve çeşitli yönleri ile cinsel hayat anlatılmıştır. Üçüncü Bölümde ise; Kerahiyyât”açısından ticaret ve toplumsal hayat başlığı altında; kazanç alanlan ile ilgili konular, oyunlar, yanşlar ve müzik konusu işlenmiştir. TEXTSUMMARY This thesis examines the topics called“ the disliked ”in the classical books of Hanafis and its methods which consists of on introduction and three parts. In introduction, It is explained the related terms that are in the parts of Disliked and method of scholars who examined the same subject by grouping the books of qurahiyya. In part one, from the qurahiyya(Kerahiyat) point of view, food, beverage, cloth and other usages have been classified in terms of their situation on the topic of disliked. In part two, the disliked manners in family, sexual life and the disliked behaviour with regards to one's children are examined. In part three, the disliked with regards to social life, source of income, games, races and music has been searched."
