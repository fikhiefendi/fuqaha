abstract: "ÖZETHÂM D EL- MÂDÃ'N N R SALELER N N SLAM HUKUKU AÇISINDANDEĞERLEND RMESBu çalışmada Şam Müftüsü Hâmid el- mâdû ve eseri Resâilü'l-Hâmidiyyeti'l- mâdiyye incelenmiş ve onun görüşleri slam Hukuku açısındandeğerlendirilmiştir. Bu amaçla onun yaşadığı çağ olan 18. yy değerlendirilmiş,onun yaşamı ve çalışmaları hakkında bazı bilgiler verilmiştir. Resâilü'l-Hâmidiyyeti'l- mâdiyye'yi oluşturan 36 risalenin konuları ve bu konular hakkındahangi alim ve eserlerden yararlanıldığı araştırılmıştır. Aynı zamanda müellifinkonularla ilgili farklı görüşünün olup olmadığı da araştırılmıştır. Ayrıca slamhukuku ile ilgili iki risale Türkçeye tercüme edilmiş ve risalelerde yer alan alimlerve eserleri dipnotlarda belirtilmiştir. Fıkıhla ilgili iki mesele slam Hukukuaçısından değerlendirilmiş ve dört büyük mezhebin görüşü ile karşılaştırılmıştır.Neticede Hâmid el- mâdû'nin meseb taassubu gözetmeyen, farklı görüşlere saygılı,klasik bir Hanefi fıkıh alimi olduğu görülmüştür."
