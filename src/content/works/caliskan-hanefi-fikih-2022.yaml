abstract: "Bu çalışmada IV ve VII. asırlar arasında telif edilen Hanefî fıkıh usulü eserlerinin sistematikleri birbirleriyle mukayese edilerek incelenmiştir. Eserler arasındaki benzerlik ve farklılıklar tespit edilerek Hanefî fıkıh usulü eserlerinin sistematiğinin oluşum süreci ortaya konulmuştur. Tez giriş, üç bölüm, sonuç ve ekden oluşmaktadır. Giriş kısmında tezin konusuna, sınırlarına, sunumuna ve yöntemine değinilmiştir. Birinci bölümde IV ve V., ikinci bölümde VI., üçüncü bölümde ise VII. asırda yazılan usûl eserlerinin sistematikleri tanıtılmıştır. Ulaşılan tespitlere ve değerlendirmelere sonuç bölümünde yer verilmiştir."
