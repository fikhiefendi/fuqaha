abstract: "Bu çalışmada müctehidlerin Arap dilinden kaynaklı ihtilafları ele alınmıştır. Bu ihtilaflar ele alınırken İbn Rüşd'ün Bidâyetü'l-Müctehid ve Nihâyetü'l-Muktesid adlı eserindeki ihtilaflara yaklaşımı esas kabul edilmiştir. Konu ele alınırken günümüze ulaşan mezheplerin görüşlerininin yanı sıra sahâbe, tâbiîn ve daha sonraki müctehidler olmak üzere hemen hemen hicri altıyüzlü yıllara kadar müctehidlerin görüşleri incelenerek bu görüşler arasında Arap dilinden kaynaklı olan ihtilaflara değinilmiş ve Arap dili kriterleri ile bunların tahlili yapılmıştır. İncelenen her bir fıkhî meselede özellikle dört mezheb imamlarının görüşlerine yer vermeye özen gösterilmiştir. Bu isimler, İbn Rüşd'ün adlarını zikrettiği yerlerde metin içinde, zikretmediği yerlerde dipnot olarak verilmiştir. Ayrıca her bir müçtehidin görüşü –imkân oldukça- temel kaynaklardan incelenerek görüşün sıhhati tetkik edilmiş ve nisbette bir hata var ise buna değinilmiştir. Her bir meselenin ihtilaf nedeni İbn Rüşd'ün naklettiği şekilde ele alınmakla beraber bu nedenlerin farklı olduğu konusunda bir tespitimiz var ise onlara da değinerek gerekçeleri sunulmuştur. Bu tahliller yapılırken fıkıhçıların delilleri, dil âlimlerinin konu hakkındaki görüşleri ile değerlendirilmiştir. Usûl-i fıkıh kitaplarında bahsedilen dil kaideleri esas alınmamış, yer yer onlara temas edilse de bu bilgiler ek bir delil olarak kullanılmıştır. Bu çalışma giriş ve sonuç dışında üç bölümden oluşmaktadır. Birinci bölümde Arap dilinin bir ayağı olan lafızlar incelenmiştir. Ancak lafızlar usûl-i fıkıh kitaplarında yer aldığı şekilde taksim edilmemiş, mecaz, kinâye gibi belâgat ilmi ile alakalı lafızlar birinci bölümün dışında tutulmuştur. Bu bölümde lafızlar vaz' ilmi açısından ele alınarak, müşterek ve menkul olmak üzere iki başlık altında incelenmiştir. Fıkıhçıların lafzın kapsadığını iddia ettikleri bir anlam var ise bu anlam Arap şiirleri, âyet-i kerimeler ve hadis-i şeriflerle ile desteklenmiştir. İkinci bölümde iʻrâbtan kaynaklı ihtilaflar ele alınmıştır. Farklı iʻrâb yaklaşımları incelenerek bunların manaya etkisine değinilmiştir. Ulaşılan manadan hükmün nasıl istidlâl edildiği ifade edilmiştir. Üçüncü bölümde belâgat ilminden kaynaklı ihtilaflar ele alınmıştır. Bu bölümde fıkıhçıların kabul ettikleri anlamlar, belâgat ilminin ölçüleri ile incelenmiştir. Bu bağlamda kelimelerin anlam tercihindeki karineleri tesbit edilerek, bu karinenin manaya yansımaları ortaya konulmuş ve fakihlerin hükme nasıl ulaştıkları belirtilmiştir."
