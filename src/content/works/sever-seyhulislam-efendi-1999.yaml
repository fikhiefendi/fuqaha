abstract: "02. Özet Büyük bir imparatorluğun asırlar süren tarihi içerisinde üç dilin ortak kelime kadrosu ve ifade gücü ile meydana gelmiş; din, tasavvuf, menkıbeler, târih, folklor, gelenek ve görenek, bâtıl ve hakîki ilimler, felsefe, kelâm, fıkıh gibi başka toplumlarda eşine rastlanamayacak kadar zengin kaynaklar olan dîvânlar, bütün bu sahibi olduğumuz zenginlikleri günümüze en iyi şekilde taşıyabilmemiz için mutlak surette çok iyi incelenmesi gereken kültürel hazinelerimizdir. İşte biz de bu düşünceden yola çıkarak babası Ebu ıshâk İsmail Efendi ve kardeşi Şeyhülislâm İshâk Efendi gibi millî irfana bir çok kazasker, kadı, âlim ve şâir kazandırmış, bir Lâle Devri şâiri olan Şeyhülislâm Mehmed Es'ad Efendi'nin Dîvânı'nı ele alarak, şiirlerinde bahsi geçen kişi ve yer adlarım ve bu adların hangi özellikleriyle kullanıldıklarım tespit etmeye çalıştık. Bunun için de yaptığımız ilk iş mevcut nüshalar içerisinde bulunan bütün şiirleri tek tek inceleyerek içinde özel isim geçen beyitleri tespit etmek oldu. Tespit ettiğimiz bu beyitleri fişleme usulüyle alfabetik sıraya göre tasnif ettikten sonra, çeşitli kaynaklardan bu isimler hakkında bilgi toplamaya çalıştık. Daha sonra derlediğimiz bilgileri sunarak, bunlara ait beyitleri verdik. Böylece beyitlerin anlaşılmasını kolaylaştırmış olduk. VIII"
