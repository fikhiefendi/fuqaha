abstract: "İslam fıkıh tarihi açısından çok önemli bir yer teşkil eden Semerkant bölgesinde, hicri V. ve VI. yüzyıllarda yaşamış önemli İslâm hukukçularından biri de Alâeddin es-Semerkandî'dir. Farklı alanlarda yazdığı birçok eseri bulunmakla birlikte, onun fıkıh usulü ile ilgili en önemli eseri Mîzânü'l-usûl fî netâici'-ukûldür.Semerkandî eserinin giriş kısmında mezhep içerisinde yazılmış usul eserlerinin yöntem ve özelliklerini veciz ifadelerle anlatmakta ve kendinden önce bazı Hanefilerin bu alanda yazmış oldukları eserlerde, fıkhî ilkelerin kelâmî ilkelerle uyumu konusunda yeterince duyarlı olmadıklarını, Mu`tezilî görüşlere eğilim göstererek zaman zaman Hanefî (yani Mâtürîdî kelâm) ilkelerine ters görüşler ortaya koyduklarını ve muhaliflerin görüşlerini savunur duruma düştüklerini ifade etmektedir. Semerkandî'nin bu ifadelerini göz önünde bulundurarak, onun Mu`tezile'ye yaklaşımını daha derinlemesine görebilmek için söz konusu eser kapsamında görüşlerini inceleme konusu yaptık.Giriş ve iki bölümden oluşan tezimizin giriş kısmında, Semerkandî'nin söz konusu eserinin mezhep içindeki yerini görebilmek için fıkıh usulü metotlarını ve Semerkandî'nin de temsilcisi olduğu Semerkant Hanefi koluna kısaca değindik. Tezimizin birinci bölümünde müellifin yaşadığı dönemin siyasi, ilmi-kültürel şartlarından bahsettikten sonra, onun çevresine ve eserlerine dikkat çekerek, ilmi şahsiyeti hakkında bilgi verdik. İkinci bölümde; kısaca Hanefîlik-Mu`tezile ilişkisine vurgu yaptıktan sonra, müellifin bahsi geçen eseri çerçevesinde, onun hüküm, emir, hüsün-kubuh, sünnet, illet, bazı lafız bahisleri, ictihad ve nesih gibi usul konularında Mu`tezilî görüşlere bakışını inceledik. Bu görüşler için yer yer bazı Mu`tezilî kaynaklarına da müracaat ettik. İncelememizde bazı istisnalar dışında, genellikle müellifin kitaptaki konu sırasını gözetmeye özen gösterdik."
