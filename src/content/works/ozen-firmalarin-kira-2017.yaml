abstract: "Firmalar faaliyetlerini devam ettirmek ve planladıkları yatırımları gerçekleştirebilmek için gerekli olan finansmanı özkaynaklarından, borçlanma yoluyla veya sukuk ve bono gibi borçlanma senetleri ihraç ederek sağlarlar. Firmalar için en uygun olan borçlanma aracının seçimi finansman maliyetleri açısından son derece önemlidir. Bu çalışmada, firmaların borçlanma araçlarından sukuk veya bonoyu tercih nedenleri araştırılmaktadır. Araştırmada, firmaların sukuk veya bono ihraçlarının karlılık, maddi duran varlıklar, firma büyüklüğü, büyüyebilme olanakları ve borç dışı vergi kalkanı değişkenleri ile ilişkisi, dengeleme teorisi (trade-off theory) ve finansal hiyerarşi teorisi (pecking order theory) üzerinden incelenmiştir. Araştırmanın analiz kısmında, muhasebesel işleyişi diğer sektörlerden farklı olan, finans sektöründe yer alan firmalar araştırmamıza dâhil edilmemiştir. Sukuk veya bono ihracının en çok olduğu ülkeler arasından seçilmiş yedi ülke üzerinde analiz yapılmıştır. Sukuk veya bono ihraç eden firmaların borçlanma oranları ile değişkenler arasındaki ilişki, kısmi ayarlamalar modeli ile Fark-GMM ve Sistem-GMM ekonometrik yöntemleri kullanılarak değerlendirilmiştir. Araştırmanın bulguları şu şekilde özetlenebilir: Bono ihraç eden firmaların daha hızlı borç kullanmaktadır. Bono ihracında, borcun kapatılması sukuka göre daha hızlıdır. Bonoda borçlanma artışının firma karlılığını azaltıcı etkisinin daha az olduğu sonucuna ulaşılmaktadır. Bono ihraç eden firmaların büyüklüğü arttıkça daha fazla bono ihraç edebildikleri gözlenmiştir. Firmaların sahip oldukları maddi duran varlıklarının çok olmasının firmaların borçlanabilmelerine etkisinin daha fazla olduğu sonucu ortaya çıkmıştır."
