abstract: "“Şâfiî Mezhebinde Helâl Gıda Kriterleri”başlıklı bu çalışmada, yiyecek ve içeceklerin helâlliği ve haramlığı konusu, Şâfiî mezhebi merkeze alınarak sunulmuştur. Araştırmada elde edilen bulgularla güncel tartışmalara katkı sağlamak hedeflenmiştir. Tezimizde Şâfiî mezhebinin temel kaynakları kullanılarak gıda ile ilgili görüşleri tespit edilmiştir. Diğer mezheplerin görüşlerine ise gerekli yerlerde başvurulmuştur. Tezimiz giriş ve iki bölümden oluşmaktadır. Giriş kısmında, araştırmanın konusu, araştırmanın önemi, araştırmanın yöntem ve kaynakları, konu ile ilgili yapılmış diğer çalışmalar, İmam Şâfiî ve Şâfiî mezhebi hakkında bilgi verildi. Birinci bölümde, taâm, helâl, haram, tayyib, habîs, rics, istihâle kavramları tahlil edildi. Akabinde, Şâfiî mezhebinin gıda konusunda sıklıkla kullandığı temel kriterler örnekleri ile beraber sunuldu. İkinci bölümde, Şâfiî mezhebine göre helâl ve haram olan hayvansal gıdalar değerlendirildi. Şâfiî mezhebinin bu gıdalara haram ve helâl hükmü verirken kullandığı deliller sunuldu. Akabinde bitkisel kökenli gıdalar ve bitkilerden üretilen içeceklerin hükmü değerlendirildi. Sonuç bölümü ve kaynaklarla çalışma tamamlandı."
