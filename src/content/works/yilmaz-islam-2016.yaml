abstract: "Bu araştırmada Mekke ve Medine Haremi ve bu alanlarla ilgili hükümler İslam Hukuku açısından ele alınıp değerlendirilmektedir. Bu çalışmada \"Harem\" kavramı belirleyici unsur olmuştur. Çalışmada bir yerin harem olması ile kastedilenin ne olduğu, onu diğer yerlerden ayırt edici yönleri, onun bünyesinden sayılan unsurları, harem olarak nitelendirilen yerlerin, insan hayatına pratikte etkileri vb. hususlar ele alınmıştır. Araştırmada Mekke ve Medine şehirleri bu hususiyet açısından değerlendirilmiştir. Harem kelimesi harâm ile eş anlamlıdır. Harem, Mekke'nin sınırları belirleyen dikili taşlara kadar olan çevresi ile Medine'nin etrafında sınırları Hz. Muhammed (s.a.v.) tarafından belirlenmiş alanı ifade eder. Mekke'nin mukaddes çevresinin sınırları tespit edilmiş ve buralara işaretler konulmuştur. Harem içerisinde uyulması gereken kurallar ve bazı yasaklar vardır. Bu özel hükümler sebebiyle bölgeye \"Harem\" adı verilmiştir. İnsanlık tarihi boyunca, yüklenen değer açısından bazı coğrafî yer ya da mekânlar kutsal olarak kabul edilmiş ve ayrı bir statüye konulmaktadır. İslâm dininin inanç esaslarına göre bir mekâna, bir zamana kutsallık atfedilmesi Allah'ın iradesiyle olur ve O'nun bildirmesiyle bilinir. Kur'an'da Kâbe'nin haram, saygıya layık bir yer olduğu, Kâbe çevresindeki Mescid ve Mekke şehrinin de haram, dokunulmaz olduğu belirtilmiştir. Hz. Peygamber, Mekke'nin fethinde, bu şehri Allah'ın haram kıldığını bildirmiştir. Mekke, Kâbe'nin inşasından itibaren \"harem\" kabul edilirken, Medine hicretten sonra Hz. Peygamber (s.a.s.) tarafından harem ilan edilmiştir. Anahtar Kelimeler : Mekke, Medine, Harem"
