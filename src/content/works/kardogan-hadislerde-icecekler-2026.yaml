abstract: "Bu çalışma, Kütüb-i Tis'a'da yer alan Kitâbü'l-Eşribe bölümlerindeki hadislerde geçen içecek türlerini tespit etmektedir. Bu çalışmanın amacı, hadis literatüründe dağınık hâlde bulunan bu bilgilerin sistematik bir şekilde ele alınması, söz konusu içeceklerin mahiyetlerinin ve kullanım bağlamlarının daha iyi anlaşılmasına katkı sağlamaktır. Tespit edilen içeceklerin ana hatlarıyla tanıtılması, Kitâbü'l-Eşribe bölümlerinde geçen rivayetlerin daha sağlıklı değerlendirilmesine imkân sunmaktadır. Araştırmanın birinci bölümünde Hz. Peygamber dönemi içecekleri ele alınmış ve dönemin içecek kültürü değerlendirilmiştir. Bu bağlamda hadislerde zikredilen içecek türleri hakkında genel bilgilendirme yapılmıştır. Söz konu dönemde tespit edilen içecekler, doğal, bitkisel, hayvansal ve nebevî tıp açısından içecekler olmak üzere dört kategori altında sınıflandırılmıştır. Ayrıca her kategoriye ilişkin tespit ve değerlendirmelerde bulunulmuştur. Hadislerde otuz tür içeceğin varlığı tespit edilmiştir. Hadislerdeki içecek türleri farklı isimlerle adlandırılmış olsada genellikle hurma, üzüm, bunların kuru ve yaş hallerinin karışımı olan meyvelerden veya mısır ve arpa gibi tahıllardan yapıldığı tespit edilmiştir. Bunlardan hem şerbet türü içecek hem de sarhoş edici içki türü içecekler elde edildiği görülmüştür. Aynı zamanda doğal olarak su, süt ve bal şerbetide tüketilmiştir. Çalışmanın ikinci bölümünde, içecekler hüküm ve adap açısından sınıflandırılarak incelenmiştir. İçeceklerle ilgili hadisler hüküm açısından değerlendirilmiş; haram içecekler ve helal içecekler olmak üzere iki ana kategoriye ayrılmış on yedi türünün haram on üç türününde helal olmak üzere otuz tür içeceğin varlığı tespit edilmiştir Yine bu bölümde Hz. Peygamber'in sünnetinde yer alan içme adabı ele alınmış; adap ile ilgili sünnetler sıralanmıştır. Bu çalışma, Kütüb-i Tis'a'daki Kitâbü'l-Eşribe bölümlerinde yer alan içecekleri tespit ederek Hz. Peygamber dönemi içecek kültürünü, bu içeceklerin tür, hüküm ve içme adabı bakımından sistematik biçimde incelemeyi amaçlamaktadır."
