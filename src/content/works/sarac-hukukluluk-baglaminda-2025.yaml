abstract: "Çok hukukluluk, bir ülkede birden fazla hukukun uygulanması anlamına gelmektedir. Çok hukukluluk meselesi bilimsel literatüre sömürgecilik döneminde girmekle birlikte pratikte uzun bir geçmişe sahiptir. Çok hukuklu bir sistemde hukuk, yalnızca devlet hukukundan ibaret değildir. Toplulukların din, ahlak, örf ve âdet gibi özelliklerine göre farklı hukuk kuralları tatbik edilebilir. İslam hukukunun geçerli olduğu devletlerde, Medine Vesikası'ndan itibaren farklı hukuk düzenlerine ait kuralların uygulanmasına izin verilmiş ve çok hukuklu bir yapı bulunmuştur. Hıristiyan ve Yahudiler başta olmak üzere, çeşitli din ve mezheplerin dini hukukları ve mahkemeleri görevlerini sürdürmüş, aile ve miras hukuku gibi özel hukuk ihtilafları kendi mahkemelerinde çözülebilmiştir. Günümüzde İslam hukuku kurallarının uygulandığı ülkelerden biri olan Malezya bu konunun bir örneğini oluşturmaktadır. Malezya'da şer'i hukuk, şahsi hukuk ve aile hukuku gibi Müslümanların özel hukuk davalarına uygulanırken, diğer alanlarda seküler hukuk uygulanmaktadır. İslam'ın bölgede yerleşmesiyle başlayan İslam hukuku uygulaması, sömürgecilik döneminde İngiliz hukukunun etkisiyle farklı bir boyut kazanmış ve bağımsızlık anayasasıyla günümüzdeki halini almıştır. Malezya'da çok hukukluluk, temelde bu iki hukuk sisteminin Malezya toplum gelenekleriyle birlikte tatbik edilmesinden meydana gelmektedir."
