abstract: "Bu çalışmada Şîa'nın imamet nazariyesi, eski din ve kültürlerle mukayese edilerek örneklerle incelenmeye çalışılmıştır. Bu bağlamda kadim din ve kültürlerden İran, Hint, Mısır, Mezopotamya, Türk, Japon, Hıristiyanlık, Yahudilik ve Sâbiîlik irdelenerek imametle ilgili ortak ve farklı unsurlar belirlenmiştir. İmameti bir inanç esası haline getiren Şîa, imamlara insanüstü birtakım vasıflar nispet etmiştir. Çalışmamızda Şîa tarafından imamlara atfedilen nas ve tayin, masumiyet, ilim gibi özelliklerin yalnızca Şiîliğe özgü olmadığına, önceki din ve kültürlerde lider olarak tanımlanan şahsiyetlere de beşer üstü nitelikler verildiğine dikkat çekilmiştir. Öte yandan Şîa'nın bir esası haline gelen mehdilik inancının da Şîa'ya has olmadığı, önceki toplumların neredeyse tamamında görüldüğü ortaya konmuştur. Çalışmamızın giriş bölümünde Şiî imamet nazariyesine ve genel anlamda kadim din ve kültürlerin özelliklerine değinilmiştir. Birinci bölümde seçilmişlik ve tanrısal krallık kavramları doğrultusunda kadim din ve kültürlerdeki hükümdarların imamlarla mukayesesi ele alınmıştır. İkinci bölümde ise ilim, masumiyet ve kurtarıcı kavramları bağlamında söz konusu mukayese yapılmaya çalışılmıştır."
