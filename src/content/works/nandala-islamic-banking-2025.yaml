abstract: "İslami bankacılık (IB), fizibilitesi, yasal çerçevesi ve zorluklarıyla Uganda'da popülerlik kazanıyor. Bu araştırmada, Ugandalıların IB kullanma niyetinin belirleyicileri araştırılmıştır: dindarlık, tutum ve öznel normlar. Bu çalışma, Malezya'daki İslami finansın düzenleyici çerçevesini, Uganda'daki IB'nin işine yarayacak olan evrimsel tarihini keşfederek açıklamaktadır. Şeriat uyumluluğunu sağlamaya, tüketici memnuniyetini artırmaya ve finansal okuryazarlığı geliştirmeye yönelik potansiyel çözümleri araştırıyor. Bu çalışma, Tanzanya, Ruanda, Kenya ve Uganda'ya odaklanarak Doğu Afrika'daki IB'yi karşılaştırmakta ve bölgenin düzenleyici dinamiklerini ve büyüme beklentilerini vurgulamaktadır. Nitel araştırma, Uganda'da IB'nin benimsenmesinin finansal hizmet alternatiflerini ve ekonomik katılımı artıracağını ortaya koydu. Sınırlı Şeriat uyumu ve personel ve yolsuzluk için asgari Şeriat eğitimi gibi çok sayıda zorluğun benimsenmesini beklediğini tespit etti. Uganda için daha hafif tarafta, Malezya deneyiminden diğerlerinin yanı sıra hizmet kalitesini ve müşteri memnuniyetini kucaklayan vergi teşvikleri sunmayı taklit edebilir. Olumlu bir kayda göre, Uganda, vergi teşvikleri ve müşteri memnuniyeti ve hizmet kalitesi gibi Malezya uygulamalarını benimseyerek Malezya'dan öğrenebilir. Odak noktası, Malezya deneyiminden alınan geçmiş dersler ve bunların özellikle Uganda'da IB'yi ilerletmek için nasıl kullanılabileceğiydi. Önerilen çözümler arasında hizmet sunumu, KOBİ finansmanı, vergi indirimi ve halk eğitimi kampanyaları yer alıyor. Uganda'da IB ve finansı geliştirmek için Malezya'da öğrenilen dersler ve zorluklar raporda sunulmaktadır."
