abstract: "Bu çalışmamızda sahabenin önde gelen isimlerinden biri olan ve ismi tefsir, hadis, kıraat ve fıkıh alanlarında sıkça zikredilen Zeyd b. Sâbit'in öne çıkan bazı fıkhî görüşleri ele alınarak değerlendirilmeye tabi tutulmuştur. Üstlenmiş olduğu pek çok vazifenin yanı sıra, Kur'an'ı Kerim'i kitap haline getiren ve onun çoğaltılma işlemini gerçekleştiren komisyona başkanlık etmesi bu dönemde yerine getirdiği en önemli görevlerden birisi olmuştur. Çalışmada Zeyd b. Sâbit'in fıkhî yönünü ortaya koymak amacıyla kendi dönemindeki gibi fakîh sahabîler ile farklı düşündüğü ve mezheplerin görüşlerinin şekillenmesinde etkili olduğu hatta bazı meselelerde sahabe icmâsını bozan fıkhî görüşleri ele alınarak değerlendirmeye tabi tutulmuştur. Böylelikle onun kendi döneminde ve kendisinden sonraki dönemde gelen fakîhler üzerinde etkili olduğu konular ortaya konulmaya çalışılmıştır. Yine bu çalışmada Zeyd b. Sâbit'in müçtehit kişiliğine yer verilmiştir. Çalışmada özellikle farklı düşündüğü noktalar zikredilmek suretiyle hükümlerindeki bireyselliğe dikkat çekilmek istenilmiştir. Hüküm istinbatında kullandığı deliller ve izlemiş olduğu birtakım yöntemler ise örnekler verilerek açıklanmaya çalışılmıştır."
