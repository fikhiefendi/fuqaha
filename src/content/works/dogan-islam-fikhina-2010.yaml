abstract: "Moda, ev dekorasyonundan mobilyaya, mutfak kültüründen giyim kuşama, kısaca iğneden ipliğe kadar birçok şeyde ortaya çıkan geçici değişiklikler, yenilikler olarak ifade edilir.Modanın, Fransız İhtilali'nin ortaya çıkardığı eşitlik ve hürriyet akımlarının bir sonucu olarak ve Sanayi İnkilabı'nın beraberinde getirdiği seri üretime geçen kumaş fabrikaları sayesinde saray çevresinden halka doğru geniş bir alana yayıldığını görüyoruz.Modayı meydana getiren sebepler zincirine baktığımızda insanın fıtratında olan süslenme ve değişiklik ihtiyacı, yenilik arayışı, beğenilme duygusu v.b. güdüler etkili olabildiği gibi, anlık ve tesadüfi unsurların da etkili olduğuna şahit oluyoruz.Modanın en önemli özelliği değişimdir. Zira moda bu sayede üretim üstüne üretim yapmakta, gücüne güç katıp ayakta kalmakta, pek çok insanı ve özellikle de kadınları israf kültürüne alıştırmaktadır.Modanın önemi belki de insanda var olan yenilik arayışından kaynaklanmaktadır. Bu noktada moda insanın ihtiyaç duyabileceği, araba, kozmetik sanayi, mobilya, kılık kıyafet, v.s. tüm sahada geçici yenilikler manzumesidir. Moda ekonomik yönden çok büyük bir güç ve aynı zamanda çok büyük bir ticari sektördür.Bugün moda denilince insanın ister istemez aklına giyim kuşamdaki geçici değişiklikler manzumesi gelmektedir. Zira moda en çok bu sahada söz sahibidir.Canlılar içinde giyinme ihtiyacı duyan tek canlı insandır. Tarihin her döneminde insanlar iklimsel, utanma duygusu, süslenme ve değişiklik ihtiyacı gibi dini ve örfi yanı bulunan gerekçelerle örtünmüşlerdir.Giyim birçok disiplinle de ilişki içinde olup her bir disiplin kendi ilmi penceresinden meseleye bakmaktadır.Giysi kimlik, kültür, taklit ve sosyal statü gibi sahalarla işbirliği içindedir. Bizce bunlardan en önemlisi ve tehlikelisi, taklitle olan ilişkisidir. Zira taklit kişiyi bir başkasının medeniyetini, inancını benimseme ve kendi inancını test etme noktasına kadar götürmektedir.İslam fıkhı, her şeyden önce iyi ve kötünün sınıflandırılmasında bir değer hükmüne sahiptir. Dolayısıyla İslam, bir yeniliği, kendi kaynaklarına aykırı olmadığı sürece kabul eder. Detaylar hususunda da mahalli örf ve adetleri her zaman göz önünde bulundurmuştur. Bu açıdan bakıldığında tez konumuz, özellikle kadının giyim kuşamı hususunda da bir takım kriterleri tesbit etmiştir:El ve yüzün dışında vücudun tamamının kapanması, süsün çevreye aksetmemesi, elbisenin dar ve tene yapışık olmaması, elbisenin erkek elbisesine benzememesi, elbisede başka medeniyetlerin taklid edilmemesi, şöhret ve kibir elbisesi olmaması, elbisenin temiz ve sade olması, elbisede israfa gidilmemesi?Medeniyetleri, inançları birbirinden ayıran kırmızı çizgiler vardır. Din, dil, tarih, coğrafya, örf, gelenek, görenek v.s. bunlardandır. Giyim kuşamı da bu sınıflandırmanın içine sokabiliriz. Çünkü giyim medeniyetten ve inançtan izler taşır.İslam fıkhı, Kur'an, Sünnet ve ondört asırlık zengin kültürü ve birikimiyle insanın her türlü ihtiyacına cevap verecek ve üretebilecek bir potansiyele sahiptir. Bu açıdan bakıldığında kendi tarihi, dini, örfi köklerine uygun bir giyim kuşam modasını yine kendi içinde neşvünema bulan modalist ve stilistlerle pekala ortaya koyabilir."
