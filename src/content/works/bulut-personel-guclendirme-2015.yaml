abstract: "Bu çalışmada, personel güçlendirme, örgütsel özdeşleşme ve çalışan performansı arasındaki ilişkinin araştırılması ve belirlenmesi hedeflenmiştir. Bu doğrultuda, personel güçlendirme, örgütsel özdeşleşme ve çalışan performansı konuları işlenmiş ve bu değişkenlerin birbirleri ile olan ilişkileri ele alınmıştır. Bir başka ifade ile iş görenin örgütü ile özdeşleşmesi ve performansının artmasında personel güçlendirmenin nasıl bir rol oynadığı incelenmiştir. Araştırmamızı ölçümlemek için alan araştırma yöntemlerinden anket çalışması yapılmıştır. Verilerin elde edileceği anket hazırlanırken literatür taranmış ve en uygun ölçekler tespit edilmiş olup; 5'li likert tarzında Türkiye'de görev yapan katılım bankası personelleri arasında bir alan çalışması yapılmıştır. Ankete katılan ve bütün soruları cevaplayan 273 katılım bankası personelinden elde edilen veriler“SPSS”programında değerlendirilmiş olup; faktör analizi, korelasyon analizi, regresyon analizi ve karşılaştırmalı analizler yapılmıştır. Çalışma neticesinde, personel güçlendirmenin alt boyutları olan anlam, yetkinlik, özerklik ve etkinin; örgütsel özdeşleşmeyi ve çalışan performansını olumlu olarak etkilediği; aralarındaki ilişkilerin pozitif ve anlamlı olduğu bulunmuştur. Yine örgütsel özdeşleşmenin de, çalışan performansını olumlu olarak etkilediği görülmüştür."
