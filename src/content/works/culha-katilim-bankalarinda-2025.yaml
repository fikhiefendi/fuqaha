abstract: "Bu çalışma, 2000-2024 yılları arasında SSCI indeksli dergilerde yayımlanmış 341 adet çalışmayı bibliyometrik analiz yöntemiyle incelemektedir. Çalışmanın amacı, İslami bankacılık alanındaki Çevresel, Sosyal ve Kurumsal Yönetim (ÇSY) uygulamalarının literatürdeki temel eğilimlerini, araştırma trendlerini ve bölgesel farklılıklarını analiz etmektir. Çalışmada, bibliyometrik analiz yöntemi ve SSCI indeksli dergilerde yayımlanmış çalışmaların verileri kullanılmıştır. Bibliyometrik analiz için VOSviewer ve Bibliometrix yazılımları kullanılmıştır. Kullanılan bibliyometrik analiz teknikleri arasında atıf analizi, ortak atıf analizi ve kümeleme analizi yer almaktadır. Böylece İslami bankacılık ve ÇSY arasındaki etkileşimler, anahtar kelimeler ve yazarlar arasındaki iş birliği ağları incelenmiştir. Ayrıca, bu analizler aracılığıyla literatürdeki gelişim süreci detaylı bir şekilde haritalandırılmıştır. Çalışma, SSCI indeksli dergilerde yayımlanmış çalışmalar üzerine yapılan ilk kapsamlı analizlerden biridir. Bulgular, bu alandaki ÇSY uygulamalarının performansla ilişkili olabileceğini göstermektedir. Ayrıca, yazarlar arasında güçlü bir uluslararası iş birliği olduğu ve en fazla atıf alan 20 yazarın gelecekteki araştırmalara dair önemli öneriler sunduğu belirlenmiştir ve bu önerilerden hareketle çalışma yapan yazarlar incelenmiştir. Sonuç olarak, bu araştırma, İslami bankacılık alanında ÇSY uygulamalarını inceleyerek literatürdeki boşlukları ve gelecek araştırmalarını ortaya koymaktadır."
