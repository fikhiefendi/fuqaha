abstract: "Sadece mensubu olduğu mezhep açısından değil diğer mezhepler bakımından da dikkat çeken şahıslar vardır. Bunlardan birisi de İslam hukuku metodolojisine farklı bir katkı veren Ebu İshak eş-Şâtıbî'dir. Şâtıbî, özellikle islam hukukunun gayeci yönü yani makâsıdu'ş-şerîa ve bidatlerin dine olumsuz etkisi hususuna dikkatlerimizi çekmiştir. Çalışmamız; giriş ve üç ana bölümden oluşmaktadır. Giriş kısmında; tezin konu ve amacı ile yöntemi hakkında bilgi verilmiş ve ayrıca konuya ilişkin öncelikli literatürün değerlendirmesi yapılmıştır. Birinci bölüm; Şâtıbî'nin ilmi yönünü ele almaktadır. Bu nedenle, onun eğitim hayatı, hocaları ve talebeleri ile eserleri fazla detaya girmeden ana hatlarıyla tanıtılmıştır. İkinci bölüm; islam hukuk metodolojisindeki yeri detaylarıyla işlenmiştir. Bu bağlamda onun Muvâfakât'ından hareketle islam hukuku delilleri (asli deliller: Kur'ân ve Sünnet; ferî deliller: mesâlih-i mürsele, istihsan, sedd-i zerâyi ve sahabe uygulaması) hakkındaki düşünceleri ele alınmıştır. Ayrıca onun ictihad, akıl-nakil ilişkisi, hukuk-ahlak ilişkisi ve hukuk-örf ilişkisi hususundaki görüşleri özlü bir biçimde konu edinilmiştir. Üçüncü bölümde ise; makâsıdu'ş-şerîa konusu ele alınmıştır. Şâtıbî öncesinde Cüveynî, Gazzâlî, İzzüddin b. Abdisselam, Karâfî ve Tûfî'nin makâsıd görüşleri özlü bir biçimde ve Şâtıbî'nin makâsıd anlayışı ise farklı açılardan değerlendirilmiştir. Anahtar Kavramlar:\tŞâtıbî, Makâsıdu'ş-şerîa, Maslahat, Mefsedet, Zarûriyyat-hâciyyat ve tahsiniyyat"
