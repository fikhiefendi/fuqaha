abstract: "Vahiy sürecinin erken sayılabilecek dönemlerinde nazil olan Müzzemmil ve Müddessir sureleri Hz. Peygamber'e hitabıyla öne çıkan iki suredir. Bu sureler konuları ve hitapları açısından birbirleriyle benzerlik arz etse de farklılıkları da içeren iki önemli suredir. Mekke döneminde nazil olan bütün surelerin temel kavramlarının birçoğunu ortaya koyan bu iki surenin karşılaştırmalı konulu tefsirinin yapılmasının gerekliliği ortadadır. Tezimize erken dönem vahiy sürecinin kodlarını çözme çalışması da denilebilir. Bunu yaparken her iki surede geçen kavramların semantik tahlilleri yapılmış olup gerekli yerlerde başta temel tefsir kaynakları olmak üzere birçok kaynaktan istifade edilmiştir. Tevhid, Nübüvvet, Ahiret'e ilişkin bu kavramların tahlil edilmesi ve tenasüb metodolojisi bağlamında tefsir edilmesi, klasik tefsir geleneğimizin de önemsediği bir konudur."
