abstract: "Mezhep müktesebatının kayda geçirilmesi gayesiyle tek düze bir faaliyet olarak başlayan fıkıh yazımının, bu ilk aşamadan çok da uzak olmayan bir zaman dilimi içerisinde farklı saikler doğrultusunda neşet eden yeni telif formlarıyla devam ettirildiği görülür. Bu meyanda Hanefî mezhebinin ilk kaynaklarından sonra karşımıza çıkan iki telif türü bulunmaktadır: Muhtasarlar ve şerhler. Teoride birbirinden farklı amaçlarla oluşturulan iki yazım türü, zaman içerisinde biri diğerini gerekli kılan bir işlev üstlenmiştir. Öncelikle İmam Muhammed'in el-Câmiu's-sağîr ve el-Câmiu'l-kebîr'i üzerine yazılan şerhlerle başlayan Hanefî fıkıh şerh geleneği, muhtasarlar ve sonrasında da hâşiyeler, ta'likler ve hatta şerhe de şerh yazma şeklinde bir hüviyete bürünmüştür. Cessâs'ın Şerhu Muhtasari't-Tahâvî adlı eseri çerçevesinde gerçekleştirilen bu çalışma, ilk dönem şerh yazımının fıkıh şerh geleneğinin temelini teşkil ediyor olması açısından önemlidir. Her şeyden önce müstakil bir yazım türüne işaret etmesi hasebiyle genel olarak şerhçilik, şerh ve şerh geleneği kavramları ile bunların fıkıh ile irtibatı pek çok açıdan fıkıh şerhlerini de incelemeyi gerekli kıldığı için ilk olarak bu hususlar üzerinde durulmuştur. Sonrasında ise fıkıh şerh yazımının neye tekabül ettiği sorusunun yanıtı olarak şerhin dil, üslûp, muhteviyat ve yöntem değerlendirmesi yapılmıştır. Ayrıca ilk Hanefî usul eserinin de yazarı olan Cessâs'ın fıkhî delilleri şerhin bir unsuru olarak kullanma yöntemine dair değerlendirmeler de müstakil bir bölüm olarak ele alınmıştır."
