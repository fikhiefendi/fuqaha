abstract: "Mecelle-i Ahkâm-ı Adliye, Osmanlı Devleti tarafından Tanzimat döneminde çıkarılan, bazı İslâm özel hukuku hükümlerinin Hanefî mezhebinin görüşleri doğrultusunda derlendiği bir kanundur. Bu çalışmada Mecelle'deki kira hukukuna ilişkin hükümler ve bunların nizâmiye mahkemelerindeki uygulanışı incelenmektedir. Mecelle'nin“Kitâbü'l-İcârât”başlıklı ikinci kitabındaki hükümlerden günümüzde salt kira hukuku kapsamında yer alanlar, Mecelle şerhlerinden yararlanmak sûretiyle teze ayrıntılı bir şekilde işlenmiştir. Kira hukukuna ilişkin olan nizâmiye mahkemeleri kararları bidâyet, istinaf ve temyiz düzeyinde ayrı ayrı değerlendirilmiş ve Mecelle'nin kira hükümlerinin uygulanıp uygulanmadığı, uygulanması hâlinde bunun kapsamı, hükme nasıl dâhil edildiği ve ne derece etkili olduğu konuları araştırılmıştır. Bu doğrultuda Mecelle'nin uygulanışına yön veren mahkemenin Temyiz Mahkemesi (Mahkeme-i Temyiz) olduğu; bu Mahkeme'nin bidâyet ve istinaf mahkemeleri arasındaki görüş ayrılıklarını giderdiği gibi hükümlerin uygulanma alanını da belirlediği görülmüştür. Temyiz Mahkemesi örf-âdet, kıyas gibi hukukun diğer kaynaklarından yararlanmak sûretiyle Mecelle'nin uygulama alanını genişletmiştir."
