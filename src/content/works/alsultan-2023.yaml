abstract: "Fankalat), geçmişte tefsirciler tarafından kullanılan tefsir yöntemlerinden. (Fankalat), tefsircinin belirli bir konuda soru sorarak ve ardından cevaplayarak muhakeme etmesi sırasında sunulan konulara yönelik bir yönergedir, zihin açıcı olabilir , veya muhtemel itirazları def etmek için, yada sanrılı bir şüphe kaldırmak için, bu (Fankala) gerçekte söylenen bir söz yada alimler arasında bir ihtilaf, yada tefsircinin zihninde belirlenen bir fikir . Araştırmacı, hedefine ulaşmanın bir yolu olarak nesnel yaklaşımı benimsedi, tümevarımsal çalışmalar başvurdu ve bunların meydana geldikleri yerleri araştırdı, daha sonra araştırıldı ve bilimsel ilke ve kurallara göre çıkarım yolu netleştirildi, hedefe ulaşmak için (Fankala)'yi kullanma imkanı, en önemli ulaştığım sonuçlardan biri her (Fankala)'nın ayrı bir araştırma olabilmesidir. Her (Fankala) başlık, giriş ve konu içeriğinden ve en son sonuçtan oluşmaktadır, Al-Kurtubi tefsirinde yaklaşık 200 (Fankala) kullanmıştır, bu araştırmada 67 tanesini ele aldım, Nisa süresinden Yusuf süresine kadar olan sürelerde dağılmıştır . (Fankalat) bir çoğu başka tefsircilerden nakil edilmiştir,Al-Kurtubi bir çok yerinde isabette bulunmuştur."
