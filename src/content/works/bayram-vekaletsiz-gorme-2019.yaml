abstract: "Vekaletsiz iş görme; bir kimsenin hukuken yetkili veya yükümlü olmaksızın, başkasına ait bir işi iş sahibi, kendi veya üçüncü bir kimsenin yararına görmesi halidir. Vekaletsiz iş görme; bir kimsenin başkasına ait bir işi o kimsenin menfaati doğrultusunda yerine getirmesi şeklinde olabileceği gibi, kimi bazı durumlarda da kendi veya üçüncü bir kimsenin yararına iş görmesi şeklinde de meydana gelebilmektedir. İşte bu durumlardan ilki“gerçek vekaletsiz iş görme”kavramını, ikincisi ise“gerçek olmayan vekaletsiz iş görme”kavramını oluşturmaktadır. Çalışmamızda; vekaletsiz iş görmenin Roma Hukukundan bu yana geçirdiği tarihsel süreç, Türk Hukukundaki yeri, vekaletsiz iş görme ile türleri olan gerçek ve gerçek olmayan vekaletsiz iş görme kavramlarının tanımları, hukuki nitelikleri, unsurları ve uygulanacak kanun hükümleri, vekaletsiz iş görmenin taraflarını oluşturan iş gören ve iş sahibinin borç, sorumluluk ve hakları üzerinden vekaletsiz iş görmenin hükümleri, vekaletsiz iş görmede zamanaşımı, iş görenin ehliyetsizliği, iş sahibinin yapılan işi uygun bulması gibi konular doktrinde yer alan tartışmalı görüşler, kanuni düzenlemeler, uygulamada yer alan örnekler ve yargı kararları ışığında ele alınarak incelenecek ve vekaletsiz iş görmenin kavramsal çerçevesi ortaya konulacaktır."
