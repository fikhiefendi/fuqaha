abstract: "İnsanların can, mal, ırz, akıl ve nesillerini korumak için konulan had cezalarının uygulandığı suçların neler olduğu, bu suçların sabit olma şartları, sabit olan suça uygulanacak cezada hangi şartların bulunması gerektiği, modern dönemlerde hadlere, özellikle de CELDE ve EL KESME cezalarına yönelik eleştiriler ile bunlara verilen cevaplar belirtilip gelişen ilim, teknik ve tıp ile beraber EL KESME, KISAS ve RECM cezalarının nasıl uygulanması gerektiği, yeni teknik ve yöntemlerin bu cezalarda kullanılmasının şer'an mümkün olup olmadığı bu çalışmamızda ortaya konulmaya çalışılmıştır. Yapılan araştırma neticesinde modern yöntemlerle hadlerde organların kesilmesi hususunda iki görüş ortaya çıkmıştır. Birinci görüşe göre cezaların, caydırma, ibret olma vb. amaçlar için konması sebebiyle modern yöntemleri had cezalarında kullanmak mümkün değildir. Diğer görüşe göre ise maslahat, istihsan ve diğer yöntemlerden hareketle had cezalarında modern yöntemlerin kullanılması mümkündür. Diğer taraftan günümüzde idam cezalarının infazında kullanılan elektrikli sandalye, gaz odası, zehirli iğne gibi modern idam yöntemlerinin kısas olarak uygulanan idam cezasında kılıcın yerine kullanılması, kılıçla yapılan infazda aranan şartları taşımamaları sebebiyle uygun görülmemiş ama kurşuna dizme ve giyotinle kesmede gerekli şartların bulunması dolayısıyla bunların kısasta kullanımı uygun görülmüştür. Ayrıca recm cezasının kısasa benzetilerek bu cezanın taşın dışında modern bir infaz aletiyle uygulanması tartışma konusu yapılmış ve bunun iki ceza arasındaki birtakım farklılıklar sebebiyle mümkün olamayacağı ifade edilmiştir. Öte yandan çalışmamızda had ve kısas cezalarının infazında anestezinin kullanımı da bu konudaki görüşler çerçevesinde belirtilmeye çalışılmıştır. Buna göre recm, celde ve mağdur veya velinin rıza göstermediği kısas cezalarında anestezi kullanmanın mümkün olmayacağı buna karşın el kesme, ölüm cezası ve mağdur veya velinin rıza gösterdiği kısas cezalarında anestezi kullanımının mümkün olabileceği sonucuna ulaşılmıştır. Yine infazda aranan aleniliğin modern iletişim aletleri vasıtasıyla gerçekleşip gerçekleşmediği araştırılmış ve cezaların teşri nedenleri dolayısıyla bunun mümkünlüğü ifade edilmiştir. Ayrıca hadlere alternatif olarak gösterilen hapis cezası ele alınmış ve bu cezanın olumsuz tarafları belirtilerek hadlere alternatif olamayacağı belirtilmiştir."
