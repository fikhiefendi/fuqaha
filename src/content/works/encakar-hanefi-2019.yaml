abstract: "Hanefî mezhebi imamlarından aktarılan mesail, bilgi ve kaynak değeri açısından temelde Usûl ve Nevâdir veya sonraki kavramsal ifadesi ile Zâhiru'r rivâye ve Gayru zâhiri'r rivâye olmak üzere ikiye ayrılır. Bu iki temel kavramdan Usûl'ü oluşturan eserler doğrudan mezheb imamları tarafından telif edildiğinden bu eserlerin hangileri olduğu ve içerisinde ne tür mesailin bulunduğu noktasında mezheb tarihinde çok farklı görüş bulunmamaktadır. Öte yandan mezheb imamlarının Usûl'de geçmeyen görüşlerini kayıt altına almak için ağırlıklı olarak talebeleri tarafından Nevâdir adıyla aktarılan mesail ve eserlerin mahiyeti, tespiti, tasnifi ve müelliflerinin kim olduğu konusu net olarak ortaya konulabilmiş değildir. Bu tezde Hanefî mezhebi literatürünün önemli bir kısmını oluşturan Nevâdir eserleri ele alınmıştır. İlk bölümde, kaynaklardan verilerin toplanıp analiz edilmesi ve varılan sonuçlar üzerinden mesail tasnifinde kullanılan ilgili kavramların yeninden tanımlanmasına gayret edilerek özelde Hanefî mezhebinin, genelde fıkıh mezheblerinin mesail tasnifinde kullandıkları kavramlar üzerinde durulmuştur. İkinci bölümde Hanefî mezhebi Nevâdir eserlerinin tespit ve tasnifi yapılarak her bir Nevâdir eseri ve müellifi hakkında bilgi verilmiştir. Üçüncü ve son bölümde ise mevcut veriler üzerinden Nevâdir eserlerinde yer alan mesailin temel özellikleri ele alınmış, tespit edilen her bir madde hakkında Nevâdirlerden yeteri kadar örnek vermek suretiyle söz konusu mesailin mahiyetinin belirlenmesine gayret edilmiştir. Çalışma neticesinde biri hariç hepsi kayıp durumdaki Nevâdir eserlerinin V/XI. asır Bağdat Hanefî fakihleri arasında Usûl eserleri gibi mütedavil olup onlar kadar bilgi ve kaynak değeri taşıdığı görülmüştür. Tezde daha çok Nevâdir literatürünün tespit ve tanıtımına odaklanılmış olduğundan Nevâdir mesailinin özellikle geç dönemde mezheb içindeki yeri ve etkisi ile bilgi ve kaynak değeri açısından değerlendirilmesi başka çalışmalara bırakılmıştır."
