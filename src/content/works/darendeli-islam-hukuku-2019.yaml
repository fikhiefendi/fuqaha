abstract: "İnternetin bir iletişim aracı olarak kullanılması ve gittikçe yaygınlaşması birçok sözleşmenin internet ortamında kurulabilmesi durumunu ortaya çıkarmıştır. İnternet ortamında elektronik araçlarla yapılan sözleşmelerin İslam hukukunun ortaya koyduğu akit teorisine uygun olarak kurulması gerekmektedir. Modern hukuk ve İslam hukuku akit nazariyesi hükümleri açısından internet üzerinden yapılan sözleşmeler, akdin kuruluşu, geçerlilik şartları, muhayyerlikler, cayma hakkı ve ikâle açısından benzerlikler ve farklılıklar bulunmaktadır. İnternet üzerinden yapılan sözleşmeler klasik usulle yapılan sözleşmelerle büyük ölçüde örtüşmekle beraber, aralarında elektronik ortamın mahiyetinden kaynaklanan tarafların ehliyet ve yetkisinin tespiti, elektronik aracıların kullanılması, elektronik ortamda kurulmayan sözleşmeler gibi bazı hususlarda farklılıklar ortaya çıkmaktadır. Özellikle internet üzerinden yapılan sözleşmelerde tarafların bilinmiyor olması karşı tarafın ehliyeti ve üçüncü şahıslarla ilgili yetki sorununu ortaya çıkarabilmektedir. İnternet üzerinden yapılan sözleşmelerde icabın umuma yapılabilmesi mümkün olmakla birlikte“icab”ile“icaba davet”ayrımına dikkat edilmesi gerekmektedir."
