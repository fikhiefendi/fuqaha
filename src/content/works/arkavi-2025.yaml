abstract: "Hamd alemlerin Rabbi olan Allah'a mahsustur, salat ve selam peygamberlerin ve elçilerin en şereflisi üzerine olsun. (Bu bölümü, teknik olarak çıkarsan iyi olur. Özette olmaz. Yine de sen bilirsin) Fonlara saldırı suçlarının, mali haklara yönelik bir tehdit, işlemlerin yasal düzenlemesinin ihlali ve bireylerin faaliyet ürünlerine sahip olma haklarının meşru ve yasal olarak korunmasına yönelik bir saldırıya yol açması nedeniyle toplumun güvenliğini ve ekonomik sistemlerinin istikrarını etkilediğine şüphe yoktur. Hileli iflas kararının Türk hukuk ve içtihadındaki durumunun ayrıntılı bir şekilde ele alınması, giderek ciddi bir ekonomik sorun haline gelen bu meselenin hukuki boyutlarının da detaylı bir şekilde incelenmesi gerekmektedir. Zira hileli iflas davalarına ilişkin prosedürlerde çok önemli yasal boşluklar ve kanuni eksiklikler göze çarpmaktadır. Ticari ve ekonomik hayattaki önemi, bu suçu tanımlamak, sınırlarını ve özelliklerini belirlemek ve bu suça karışanların takip edilmesinde yardımcı olacak bir kaynak oluşturmak üzere bu konuyu seçtim. Böylece Türk hukukundaki ilgili cezai hükümlerin ne ölçüde uygulandığını ortaya koymak ve incelemek mümkün olacaktır. Araştırma esnasında Betimsel analitik karşılaştırmalı yöntem takip edilmiştir. Bu, planda yer alan konuların belirlenip incelenmesi hususunda araştırmamıza en uygun yöntem olarak benimsenmiştir. Araştırmamızın başlığı da bu doğrultuda netleşmiştir:“İslam Hukukunda Hileli İflas ve Türk Hukukunda Karşılaştırmalı Bir Çalışma”. Giriş, beş bölüm ve sonuçtan oluşan çalışmada, hileli iflas suçunun tanımı ve diğer fonlara saldırı suçlarından ayrıldığı noktalara yer verilmiştir. İslam şeriatı ve Türk hukukunda hileli iflas suçuna ilişkin hukuki hükmün vurgulanması, suçun oluşması için karşılaştırmalı hukukun gerektirdiği hileli yöntemlerin belirlenmesi, ayrıca şeriat içtihatları ve Türk hukukunda hileli iflas suçları için öngörülen cezaların tespiti, hileli iflas suçlarıyla mücadelede asil İslam hukuku içtihatlarının önceliğinin doğrulanması; ceza davasını oluşturmak, kontrollerini ve bileşenlerini tanımlamak, şeriat tarafından öngörülen cezaları açıklığa kavuşturmak; bu suçla mücadele için Türk yasa koyucu tarafından öngörülen usulleri ortaya koymak, bu suçun azaltılmasına yönelik çözümler bulmak, hileli iflas suçlarıyla yüzleşmeye katkıda bulunmak, muhtemel tehlikelerine karşı uyarıda bulunmak ve ülke fertleri arasında hukuki farkındalığı artırmak, hileli iflas suçunun bulunmadığı karşılaştırmalı kanun metinlerinde tanımlanan diğer hile yöntemlerini tespit etmek. (Buradaki son cümleyi sildim. Yukarıdaki paragrafı şöyle düzenlesen çok daha iyi olur. Giriş bölümünde şu konular ele alındı. Birinci bölüm, …. İkinci bölüm… Sonuç bölümünde de konu hakkında şu hükme varılmıştır: gibi…) Araştırmamızın Sonuç bölümünde şu tespitlere ulaşılmış ve aşağıdaki öneriler dile getirilmiştir: - İslam hukukunda hileli iflas suçu, alacaklılar ile diğerleri arasında açıklama yapma yükümlülüğünün getirdiği görevin ihlalidir. Taraflar arasında işleyiş ile ilgili bir iç görü bulunması gerekir. Bunun ihlali, yani gizlilik ve sır barındırması, fakihler göre aldatmanın ortaya çıkmasına yol açar. -Hileli iflas suçunun, maddi, manevi ve hukuki olmak üzere üç temel unsurunun bulunmasıyla hileli iflas unsurları oluşur. -İflas suçu, hareket sayısı itibarıyla iradi, şekli itibariyle icrai, ani ve sabit, uygulamasının devam edip etmediği, devam eden önemi itibarıyla da sürekli ve hareketli bir suçtur. Ele aldığımız karşılaştırmalı hukuk sistemleri, hileli iflas suçlarıyla mücadelede mekanizmalarını ve düzenleyici vizyonları geliştirmişler; çeşitli ilerleme ve aşamalardan geçerek, bu tür suçların tehlikeleri ve bunlarla mücadele mekanizmaları hakkında derinlemesine bir vizyon ortaya koyan düzenleyici bir yaklaşıma gelmişlerdir. Sonuç bölümünün ardından araştırma kaynakları ile teknik indekslere yer verilmiştir."
