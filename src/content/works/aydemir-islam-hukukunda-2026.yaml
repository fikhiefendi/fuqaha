abstract: "İslam dini doğumdan ölüme hatta ölüm sonrasına kadar müslümanın hayatına bir düzen katmıştır. Biz çalışmamızda bu düzenin fıkhî yansımalarını ele aldık. İslam hukukunda yaşlılarla ilgili hükümler bağlamında yaptığımız çalışmada üç farklı bölümde tezimizi şekillendirdik. Birinci bölümde ibadetler hususunda yaşlılar hakkındaki hükümler ele alınmaktadır. İbadetler konusunda ele alınmış alt başlıklar yaşlıların çekmiş oldukları belli başlı sıkıntıları göz önüne alarak hazırlanmıştır. Kendi başına bedensel temizliğini yapamayan yaşlı kimsenin durumunun incelenmesi buna örnek olarak verilebilir. Bu belli başlı problemlere çözüm üretilirken geçmişte üretilen çözümler ile günümüzde getirilen çözümler arasındaki benzerlik ve farklılıklar ortaya konmaya çalışılmıştır. İkinci bölümde aile hayatı, muamelat, cinayet ve had konuları gibi meseleler ele alınmıştır. Aile hayatı denilince yaşlı kimse ile yalnız kalma durumu, yaşlı kimsenin mahremi olmadan yolculuğa çıkması, nikahlanması, nafakası gibi konular sırasıyla ele alınmıştır. Üçüncü bölümde tıp ve sağlık alanlarında yaşlılarla ilgili ötanazi hakkındaki hükümlerden estetik cerrahi operasyonlara varana kadar çeşitli konular ele alınmaya çalışılmıştır. Birinci bölümde bireysel konular ele alınıp işlenmeye çalışılırken ikinci bölümde daha çok topluma yönelik konular ele alınmıştır. Üçüncü bölümde ise tıp ve sağlık alanında yaşlılarla ilgili hükümler ele alınmıştır. Sonuç itibariyle çalışmanın hedefi klasik eserlerle günümüz çalışmalarını inceleyerek yaşlılarla alakalı genel konuları ve sorunları, çözümleri ile tek bir çalışma altında toplamak olmuştur."
