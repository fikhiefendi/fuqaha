abstract: "Bu araştırma, ihtilafların çözümlenmesi kuralının ne anlama geldiğini, ihtilafların çözümlenmesi, ihtilafta olması gereken şartları ve ihtilafların çözümlenmesi kuralının hücciyet değerini öğrenmeyi amaçlamaktadır. Ayrıca, ihtilafların çözümlenmesi kuralını; ticaret, evlilik, boşanma, vasiyet, söz kesme gibi ve diğer fıkhın muamelat bölümlerinde derlemeyi hedeflemektedir.. Bu araştırmada analitik ve tümevarımcı yöntem kullanılmıştır İhtilafların çözümlenmesi kuralına dayanan fıkhi görüşlerin çıkarılabilmesi için konular bir araya toplanarak incelenmiş, fıkıh alimlerinin mezhepleri ve görüşleri aktarılarak kritiği gerçekleştirilmiştir. Araştırmanın önemli sonuçlarından biri, fıkıh alimlerinin, özellikle Şafiilik mezhebinin ihtilafların çözümlenmesini hoş gördüğü ve bu kuralın fıkıhlarında özellikle muamelat bölümlerinde etkileri görülmüştür. Ayrıca, ümmetin alimlerinin genellikle mezhep ve görüşlere taraftarlık etmekten kaçındığı ve ihtilafı dikkate alarak, önem verdikleri görülmüştür. İhtilafların çözümlenmesi kuralının fıkıh alimleri yanında önemli bir yeri olduğu, belirli şartların olmasıyla bu kuralın uygulandığı ve hoş görüldüğü ortaya çıkmış, genellikle takva ve ihtiyatlı davranılması gereken konularda yer aldığı ve her ihtilafın dikkate alınmadığı anlaşılmıştır."
