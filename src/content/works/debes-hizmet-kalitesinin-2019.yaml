abstract: "Hizmet kalitesi kuruluşların çoğunda ve özellikle bankacılık alanında önemli faktör sayılmaktadır. Çünkü müşteri tatmini ve sadakatini kazanmak için önemli rol oynamaktadır. Bu çalışmanın amacı Türkiye'de katılım bankalarının müşterilerini kaybetmemeleri ve yeni müşterileri kazanmalarında hizmet kalitesinin rolünü açıklamaktır. Ayrıca müşteri tatmini ve sadakatini kazanabilmek için kullanılabilen hizmet kalitesi kavramını ve buna bağlı boyutları belirlemek, bu boyutların iyileştirme yöntemleri açıklamaktır. Katılım bankacılık hizmetlerinin kalitesi bu çalışmanın odak noktasıdır. Katılım bankalarının hizmet kalitesini pazarın algıladığı, ardından müşteri memnuniyeti ve sadakati ile ölçmek, nihai olarak pazar payını ve potansiyel müşterilerdeki artışı, Türkiye'de verimliliği artırmak, Türkiye'de katılım bankacılık sektöründe kârlılığı artırmak. Hizmet kalitesinin ölçülmesi ve etkin bir katılım bankacılık hizmet kalitesinin geliştirilmesinde tavsiyeler sunmak. Bu nedenle, katılım bankalarının hizmet kalitesini artırmak için yapılan her türlü araştırma çabası, katılım bankacılık kurumuna önemli ölçüde katkıda bulunmak ve desteklemek için önemli bir girişim olarak değerlendirilmelidir. Katılım banklarını ziyaret ederek o bankalarda mevcut olan müşterilere anketler dağıtarak 250 anket doldurulmuş ve bu anketlerin analizi yapılmıştır. Hipotez kurarak (SPSS) programıyla bu istatistiksel analizler yapılmış olup hizmet kalitesi, müşteri tatmini ve sadakati arasındaki bağ incelenmiştir. Bankacılık alanında Türkiye'deki katılım bankalarının daha çok müşteri kazanabilmeleri için hizmet kalitesini iyileştirmesinde gerekli öneriler sunulmuştur. Araştırma sonucunda hizmet kalitesinin müşteri sadakatini artırmada önemli bir etkisinin olduğu tespit edilmiştir."
