abstract: "ÖZET Faizsiz fınanskurumu, uzun vadede verimlilik artışından dolayı yüksek gelişme potansiyeline sahip rekabet üstünlüğü olabilecek firmalara ve diğer uzmanlık hizmetleri sunarak girişimci firmalara piyasa değer artışı sağlamak ve belli bir süre sonra bu yatırımdan çıkarak yüksek kazanç elde etmeyi amaçlamaktadır. Faizsiz finans kurumları bu fonksiyonunu, özellikle günümüzde önem arz eden bilgisayar ve ekonomik alanlarda teknolojik yenilik getiren veye getirme kabiliyetine sahip olan küçük ve orta büyüklükteki firmaların desteklenmesinde gösterebileceklerdir. Faizsiz finans kurumunun girişimci firmaları destekleme biçimi faizsiz ve kâr-zarar ortaklığına dayanan hisse senedi mukabili olacaktır. Faizsiz finas kurumlarının 'Mudaraba', 'Murabaha', 'Muşaraka' ve 'Leasing' metodlan bu kurumun finansal metodlarıdır. Son bir kaç yıldır Türkiye'nin gündeminde olan faizsiz finas kurumlan nın, İslâm ülkelerinde uygulaması büyük boyutlara ulaşmıştır. Türkiye açısından büyük önem arz eden ve hukuki yapılanması tamamlanan bu sistemin uygulanmasına devam edilmesi zorunluluk arz etmektedir. Şube yöneticilerinin başarı durumları tesbit edilirken; şubenin kuruma olan toplam kâra katkısı, şubenin plasman ve mavduat rakamları toplamı, şubenin toplam döviz girdi ve çıktısı, şubenin finansman ortaklıklarının hacmi, şube ortaklıklarının kârlılığı, şubenin bir ortaklığının kâr ortalaması, şubenin yeni ortaklarının sayısı, şubenin mevduat hesaplarının rezerv ortalaması gibi ölçülerden biri ya da bir kaçı dikkate alınabilir. IX"
