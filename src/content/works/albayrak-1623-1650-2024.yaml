abstract: "Türkiye'de Osmanlı dönemi kadınlar konulu araştırmalar yapılmaktadır. Bu araştırmaların önemli bir bölümü Osmanlı yönetici kesiminin kızları ve kadınları ile ilgilidir. Çalışmalarda, Osmanlı'nın üst tabakası diyebileceğimiz kadınlar ve Osmanlı'nın son dönem kadınları ağırlıklı olarak ele alınmıştır. Osmanlı arşiv kaynakları üzerinde yapılacak çalışmalar kadın çalışmaları için önem arz etmektedir. Osmanlı coğrafyasındaki Anadolu kadınını anlamamızda arşiv kaynakları üzerine yapılacak çalışmalar büyük rol oynayacaktır. Çalışmamızın ana kaynağını 1623-1650 yılları arasındaki Amasya şer'iyye sicilleri oluşturmaktadır. Tezimizde söz konusu tarihler arasındaki Amasya'da kadınların ekonomik statüsüne konu olan davalar incelenmiştir. Davalardan miras, mehir, nafaka, hibe gibi kadının iktisadi faaliyetlerini içeren konular değerlendirilmiştir. Değerlendirilen veriler ışığında Amasya'da kadının ekonomik statüsü, mal varlıkları, mal varlıklarının kaynakları ve sosyal görünürlüğü ortaya konulmaya çalışılmıştır. Bu çalışmada amacımız, 1623-1650 yılları arasında Amasya'da kadınların ekonomik statüsü üzerinde durmaktır. Çalışmada kaynak olarak daha önce transkripsiyonu yapılmış olan Amasya sicillerinden yararlanıldığı gibi transkripsiyonu yapılmamış siciller de kullanılmıştır. Çalışma 4 bölümden oluşmaktadır. Çalışmanın giriş bölümünde Osmanlı'da kadın ile ilgili yapılmış çalışmalardan ve Amasya'nın konumuzu ilgilendiren dönemi ile ilgili yapılmış çalışmalardan bahsedilmektedir. Çalışmamızın ikinci bölümünde 17. yüzyılda Amasya, Amasya'nın idari yapısı ve bu yüzyılda Osmanlı'nın genel durumu, sosyal ve ekonomik hayat üzerinde durulmuştur. Üçüncü bölümde ise aile hayatında kadının yeri, evlenme, boşanma, nafaka gibi başlıklar ile siciller ışığında açıklamalar yapılmıştır. Çalışmamızın dördüncü bölümünde Amasya'da kadınların iktisadi statüsü Amasya şer'iyye sicillerindeki belgelerin verilerine dayanarak incelendi. Kadınların mal varlıklarının kaynakları, mal varlıklarının nelerden oluştuğu, mal varlıkları üzerindeki tasarrufları bu bölümün ana konularındandır. Son olarak da sonuç kısmı ve kaynakça kısmı bulunmaktadır. Sicillerde bulunan belgeler dipnotlarda A.Ş.S., 2 veya 6, 1/1, 1/2, 1/3 şeklindedir. (6 numaralı Amasya şer'iyye sicilinin 1. sayfadaki 1. belge) şeklinde gösterilmiştir. İlk rakam sicil numarası, ikinci rakam ise sayfanın numarasını göstermektedir. Üçüncü rakam da sayfada bulunan kayıt sırasının numarasını göstermektedir."
