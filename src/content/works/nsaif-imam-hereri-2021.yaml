abstract: "Münasebet ilmi، edebî zevki ile tefsirleri süsleyen önemli ve kıymetli ilimlerden birisidir. Bu ilim sayesinde surelerin ve ayetlerin nasıl irtibat kurduğu bilinir. Bu ilmin bazı türleri ve kuralları vardır ki، bunlarla müfessir Kur'an'ın sırlarına ulaşabilir. Bu ilme ehemmmiyet veren alimlerden biri de Hadaiku'r-ruh ve'reyhan adlı tefsirinde Hereri'dir. Bu eserinde، Kur'an-ı Kerim'in münasebetlerinde dair müfessirlerin sözlerini derlemiş، surelerin tefsirleri ve ayetlerinde dair akıcı ve kapsamlı bir üslup benimsemiştir. Bu çerçevede، sure isimleri، ayetlerin sayısı ، Mekki ya da Medeni oluşları، esbab-ı nüzul، münasebetler ve son olarak i'rabına dair bilgilere yer vermiştir. Bu çalışmada، bu ilmin tarifi ve çeşitleri، bu ilimde öne çıkan alimler، Hereri'nin tefsirinde izlediği yöntem، münasebet ilmini ele alırken takip ettiği yöntem، Mekki-Medeni sureler münasebetine dair üslubu incelenmiş، bu şekilde ele aldığımız müfessir ve tefsiri penceresinden münasebet ilmine bir katkı sunulmuştur."
