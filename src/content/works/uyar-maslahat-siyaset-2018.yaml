abstract: "İslam ceza hukukunda tazir cezaları siyasi otoritenin yetkisine havale edilmekle birlikte taziren cezalandırmalarda üst sınırın ne olacağı hususu tartışmalıdır. İlk dönemlerde ağırlıklı görüş tazirin üst sınırının had cezaları olduğu belirtilirken sonraları taziren katlin cevazı tartışılır olmuştur. Bu tartışmada taziren ölüm cezası verilebileceği görüşleri daha çok Türklerin İslam dünyasına hâkimiyetleri sonrasına tekabül etmektedir. Karâfî, Türklerin İslam dünyasına hâkim olduğu dönemlerde yaşamış Maliki bir fakih olarak bu tartışmada taziren katli tereddütsüz savunanlar arasındadır. Mürsel maslahatlarla amel etmenin herhangi bir şartı olamayacağını savunan müellifin siyasi otoriteyle alakalı görüşleri toplum menfaati bağlamında incelendiğinde onun tazirle alakalı görüşlerinin maslahat ve siyaset düşüncesiyle irtibatlı olduğu ortaya çıkmaktadır. Bu çalışmada, onun maslahat ve siyaset görüşleri temeline dayanan tazir anlayışının mahiyeti ve sonrakilere etkisi ele alınmıştır."
