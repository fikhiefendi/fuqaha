abstract: "Çalışmamızda Cumhuriyet'in ilanından sonra ortaya çıkan ihtiyaçlar neticesinde toplumun dinî, millî, kültürel ve ahlaki telakkilerinden doğan yerli bir Medeni Kanun oluşturma çalışmalarının sonuç vermemesi üzerine İsviçre Medeni Kanunu'ndan tercüme yoluyla alınan ve 1926 tarihinde yürürlüğe giren 743 sayılı Türk Medeni Kanunu ile İslam Aile Hukuku hükümlerinin tespit edilmesi ve mukayeseli olarak analiz edilmesi amaçlanmaktadır. Araştırmamızda her iki hukuk sisteminin teori ve pratikte benzeşim ya da ayrışım gösteren noktaları tespit edilmiş ve elde edilen bulgularla bir mukayese çalışması ortaya konmuştur. Çalışmamız, bilgi-belge ve kaynakların mukayesesini esas alan tarihsel bir karakterde olup veri dokümantasyon tekniği ile yazılmış nitel bir çalışmadır. Karşılaştırma çalışmaları, karşılaştırmaya tabi tutulan her iki bilim dalı açısından eksik ve aksayan yönlerin tespit edilmesi, araştırmacılara genel bir çerçeve belirlemesi açısından önem arz etmektedir. Araştırma alanımızda yapılan çalışmalar, daha çok müstakil alt başlıklar şeklinde ele alınmış olup literatürde çalışmamızda olduğu gibi detaylarıyla bir bütün halinde güncel çalışma bulunmamaktadır. İslam aile hukuku hükümlerinin birçoğu Kur'an, sünnet ve icmâ ile belirlenmiş olup detayları ise fukahânın bilgi, tecrübe ve dönemlerin ihtiyaçlarına göre şekillenen görüşlerinden oluşmaktadır. Türk Medeni Kanunu'nun hükümleri ise temelde İsviçre Medeni Kanunu'ndan alınarak kanun koyucu tarafından muhatap kitlenin özellik, kültür, değer ve ihtiyaçlarına göre zaman içinde değişiklik göstermiştir. Araştırmamız neticesinde her iki hukuk sisteminin dayandıkları kaynakların ilahi ve beşerî olarak ayrılması, aileye ilişkin temel aldıkları esasların farklı amaçları ihtiva etmesi, aileye yüklenen anlam ve sorumluluk niteliklerinin ayrışması, sahip oldukları ideolojilerle yakın ve uzak amaçlarının başkalık göstermesi, maslahat düzeyinde önceliklerinin fert ve kamu düzeyinde değişmesi gibi sebeplerle birbirlerinden farklılık gösterdikleri tespit edilmiştir. Evrensel unsurlar, insan hayatı ile ilgili temel ilkeler ve toplumların maslahatları kapsamında ise birbirlerine yaklaştıkları noktalar bulunmaktadır."
