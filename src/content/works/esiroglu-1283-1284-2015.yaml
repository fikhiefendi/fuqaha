abstract: "Tarih araştırmalarında“Birinci Elden Kaynak”durumunda olan“Şer'iyye Sicilleri”içerdikleri önemli belge ve bilgiler nedeniyle tarihi araştırmalarda önemli bir yere sahiptirler. Şer'iyye Sicilleri içinde kaydedildikleri dönemin idarî, askerî, beledî, adlî, sosyal ve kültürel konuları ile ilgili ayrıntılı bilgiler bulundurmaktadır. Şer'iyye sicillerinin incelenmesi, konu çeşitliliği ve zenginliği bakımından hem geçmişe dair bilinmeyenlerin aydınlatılmasında hem de günümüze ışık tutması açısından son derece önemli ve gereklidir. Bu çalışmanın amacı, 34 No'lu Antakya Şer'iyye Sicili'nin transkripsiyon ve değerlendirmesini yaparak, elde edilen veriler doğrultusunda Antakya'nın idari yapısı, hukuki, iktisadi, sosyal ve kültürel yaşamı hakkında değerlendirmeler yapmaktır. 110 sayfadan oluşan Şer'iyye Sicilinde toplam 317 belge bulunmaktadır. Bunların önemli bir kısmı tereke ve mülk satışı kayıtlarıdır. Ayrıca, hüccetlere, ilamlara, nikâh ahitlerine, velayet ve borç davalarına, ferman ve beratlara da belgeler arasında rastlamak mümkündür. Tereke kayıtlarında o dönem halkının ekonomik düzeyini tespit etmek mümkündür. Evlilik ve boşanmalarda, miras dağılımında, o dönemin sosyal hayatına dair bilgiler edinilebilmektedir. Hazırlamış olduğumuz bu çalışmayı dört bölümde ele aldık. Birinci bölümde; Şeriyye Sicillerinin tanımı ve kapsamı, Şeriyye sicilleri içerisindeki belge çeşitleri, mahkeme görevlileri, hakkında açıklamalara yer verilmiş; ardından Antakya Şeriyye Sicillerine ve bu konuda yapılan çalışmalara değinilmiştir. İkinci bölümde; 34 No'lu Antakya Şer'iyye Sicilinin genel özellikleri ve defterdeki belgelerin kısa özetleri ve bu belgelerin içeriklerine göre tasnifi yapılmıştır. Üçüncü bölümde, sicilin transkripsiyon metnine yer verilmiştir. III Dördüncü bölümde; transkripsiyon yapılan belgelerden de yararlanılarak 1866- 1868 yılları içerisinde Antakya'nın sosyal, ekonomik ve idari yapısı ile ilgili elde edilen bilgilerin değerlendirmesi yapılmıştır. Son olarak da sonuç ve kaynakçaya yer verilmiştir. ANAHTAR KELİMELER Antakya, Şer'iyye Sicili, Tereke, Aile, Mülk Satışı."
