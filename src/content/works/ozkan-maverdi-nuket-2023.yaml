abstract: "Mâverdî, hukukçu kimliği ön planda olan bir şahsiyettir. Kendisiyle ilgili kısa bir bilgi edinilmek istendiğinde ise müellifin çok yönlülüğü dikkat çeker. Mâverdî' nin bu fikri zenginliği ve bilgisinin mahsullerinden birisi de en-Nüket ve'l 'Uyûn ismiyle te'lif ettiği tefsiridir. Mâverdî' nin bir yönetici olarak, yönetimle ilgili olabilecek ayetleri kendi perspektifinden nasıl değerlendirdiğini görmek bu çalışmanın ortaya çıkmasındaki temel sebeptir. Çalışma giriş ve ve iki bölümden oluşmaktadır. Giriş kısmında Mâverdî hakkında kısaca bilgi verilmiştir. Birinci bölümde yönetimle ilgili Kur'ân'da vurgulanan kavramlar ve fıkhî doktrinde bize göre önemli olan ilkeler Mâverdî ekseninde değerlendirilmeye çalışılmıştır. Satır aralarında Mâverdî'nin fikirlerine atıfta bulunulmuştur. Çalışmanın ikinci bölümünde yönetimle ilişkilendirebileceğimiz ayetlerin en-Nüket ve'l 'Uyûn'da Mâverdî tarafından nasıl ele alındığı saptanmaya çalışılmıştır. Ayrıca bu bölümde Taberî, Kurtubî ve çağdaş dönem müfessirlerinden Mevdûdî'nin mezkûr ayetlere getirdiği yorumlar incelenmiş, ayetlerin tefsirindeki yorum farklılıkları ortaya koyulmaya çalışılmıştır. en-Nüket ve'l 'Uyûn rivayet tefsiri olarak değerlendirilmektedir. Bununla birlikte müfessir bazı rivayetleri aktarırken kendi yorumunu da dile getirmiştir. Fakat bu çalışmada ilgili ayetlerde Mâverdî'nin kendi tercihlerini açık bir şekilde ortaya koyduğu görülmemiştir."
