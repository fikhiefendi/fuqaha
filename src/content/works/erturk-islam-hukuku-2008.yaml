abstract: "Çalısmamızda ?slam Hukuku açısından günümüzdeki kumar çesitlerini elealdık. Çalısma bir giris ve iki bölümden olustu. Giriste helal ve haram kavramlarıüzerinde durularak ?slam'daki helal ve haramı belirleyen etkenler ortaya kondu.Birinci bölümde Kumar kavramı tarif edilerek Kur'ân, sünnet ve ?slam Hukukuaçısından değerlendirildi ve kumarın haram kılınmasındaki etkenlere ulasılmayaçalısıldı?kinci bölümde günümüzde kumarla iliskilendirilebilecek uygulamalar?slam'daki kumar yasağı çerçevesinde değerlendirilerek hüküm verilmeye çalısıldı.Özellikle piyango üzerinde durularak, günümüzde büyük kitlelere hitap eden buuygulamanın tarifi, tarihi seyri ve günümüzdeki uygulama sekli üzerinde durularak?slam Hukuku açısından yeri belirlenmeye çalısıldı.Son olarak kumarın ferdi ve içtimai açıdan bir değerlendirmesi yapılmayaçalısıldı.Sonuçta ise, ulastığımız kanaatler belirtildi."
