abstract: "Nazarî-küllî disiplinlerde felsefe-mantık dilinin hâkim olmaya başladığı dönemde yaşayan Fahreddin er-Râzî, felsefe-mantık diliyle oluşturduğu üslubu fıkıh usûlü eseri olan el-Mahsûl'e de taşımıştır. Bu anlamda arka planında zengin bir fikrî tartışmayı barındıran umûm kavramının mahiyetini, bu üslûbun imkânlarıyla ele almaya çalışmış, mütekellim-usûl geleneğinden tevarüs ettiği umûm tasavvurunu felsefe-mantık diliyle yeniden ifade etmiştir. Mensup olduğu usûl geleneğinden Ebü'l-Hüseyin el-Basrî'nin ile Gazzâlî'nin eserlerinde verdikleri tanımları eklediği ihtirâzî kayıtlarla zenginleştiren Râzî, üçüncü tanımda mahiyete delaleti esas almıştır. İlk tanımda umûm lafzın uygun olduğu fertleri istiğrak vasfını öne çıkaran Râzî, ikinci tanımda umûmun sınırsız çokluğa delaletini vurgulamıştır. Üçüncü tanımda ise umûm lafzın mahiyete belirsiz çokluk kaydıyla delaletini esas almıştır. Üç tanımdan hareketle onun düşüncesinde umûm lafız ortak mahiyeti taşıyan fertlerin tümünü istiğrak eden lafız olarak tanımlanabilir. Mantık dilinde küllîlik cüz'îlerin/fertlerin aynı mahiyeti bedel yoluyla taşıması demek iken; usûl düşüncesinde umûmluk lafzın, mahiyeti eşit nispette taşıyan bu fertlerin tümüne istiğrak yoluyla delalet etmesidir. Nitekim Râzî'nin bu umûm tasavvuru sığaları kabul kıstaslarını da belirlemiş, ancak delalet ettiği mahiyetin tüm fertlerini istiğrak eden lafızların umûm olabileceğini ileri sürmüştür."
