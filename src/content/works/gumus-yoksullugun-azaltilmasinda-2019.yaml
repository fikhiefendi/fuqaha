abstract: "Yoksulluk dünyada olduğu gibi Türkiye'nin de önemli sorunlarından birisidir. Ülkeler yoksullukla mücadelede etmekte ve bu mücadelelerinde de çeşitli araçlar kullanmaktadırlar. Bu çalışmamızda yoksulluğun tanımı yapılmış olup, iktisadi ekollerde ve İslamda yoksulluk konusu incelenmiştir. Yoksulluk çeşitleri, dünyada, İslam ülkelerinde ve Türkiye'de yoksulluk ve nedenleri ele alınmıştır. Günümüzde İslam ülkelerinde yoksulluğun önemli bir sorun olduğu ve İslam ülkelerinin yoksullukla mücadelede en büyük eksikliklerinden birinin zekât müessesesini çalıştırmamak olduğu belirtilmiştir. İslam'ın yoksullukla mücadelede en temel enstrümanı zekât olmasına rağmen İslam ülkeleri bundan gerektiği gibi istifade edememektedir. Aynı durum Türkiye için de geçerlidir. Yoksulluğun azaltılmasında bir çözüm önerisi: Zekât fonu örneği adlı çalışmamızda bu eksikliğin giderilmesine çalışılmaktadır. Türkiye'de yoksulluk sorunu mevcut olup devlet bu sorunla mücadele etmektedir. Devlet yoksulluğu azaltmak için bazı çalışmalar yapmaktadır. Yoksullukla mücadele için SYDGM (Sosyal Yardımlaşma ve Dayanışma Genel Müdürlüğü) ve diğer bazı kamu ve özel kuruluşlar aracılığıyla yoksullara çeşitli yardımlar yapılmaktadır. Fakat İslam'ın yoksullukla mücadelede en etkili aracı olan zekât müessesesinden istifade edilememektedir. Çalışmamızda Türkiye'de devletin gözetimi ve denetiminde resmi bir zekât fonu kurulması ve bu fon aracılığıyla zekâtların toplanıp, zekât gelirlerinin yoksulluğun azaltılmasında kullanılmasının önemi ele alınmıştır. İslam dininde zekâtın önemi anlatılıp, tarihte ve günümüzde zekât uygulamaları incelenmiş, bilhassa Hz. Ömer ve Emeviler dönemi halifesi Ömer b. Abdülaziz döneminde zekâtın toplanması ve dağıtılması esasları incelenerek o dönemlerde zekâtla yoksulluğun yok denecek derecede azaldığından hareketle aynı uygulamaların günümüzde de tatbik edilmesi durumunda İslam ülkelerinde ve Türkiye'de yoksulluğun azaltılacağına vurgu yapılmıştır. Türkiye'de insanların zekât bilincini ölçmek, devletin kuracağı zekât fonu hakkındaki görüşlerinden istifade etmek amacıyla Sakarya ili genelinde anket çalışması yapılmıştır. Ankette kolayda örnekleme yöntemi kullanılmış olup, katılımcılarla yüz yüze görüşülmüş ve anket sonuçları yorumlanmıştır."
