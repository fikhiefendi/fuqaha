abstract: "Osmanlı'da Kadılık adlı tez çalışmamızda makro bir bakış açısı ile özellikle Osmanlı klasik dönemi ve devam eden süreçte devletin bir bürokratı olarak kadının iş yükünü tespit etmeye çalıştık. Bunu yaparken kadının her türlü resmi işlemi kaydettiği şer'iye sicilleri (kadı defteri) verilerini esas aldık. Sicillerin yanı sıra Osmanlı kanunnameleri temel başvuru kaynaklarımız arasında yer aldı. Zaman zaman şeyhülislam fetvaları başvurduğumuz eserler arasındadır. Konu ile ilgili pek çok araştırma eserden de faydalanıldı. Tımar sisteminin uygulandığı başta başkent olmak üzere seçtiğimiz sicillerde yer alan veriler bize kadının esas iş yükünü sefer gibi olağanüstü durumlar dışında noter kayıt işlemlerinin oluşturduğu sonucunu gösterdi. Kadı denilince ilk akla gelen“hakim”görevi ise yaklaşık %15 gibi bir iş yükü ile karşımıza çıktı. Bugünkü gibi bürokratik ayrışmanın olmadığı bir dönemde kadı bulunduğu kazada günümüz kaymakam ve belediye başkanının yerine getirdiği pek çok sorumluluğu üstlenir. Sultan tarafından taşrada doğrudan muhatap olunan tek idari amir olarak ümera sınıfının da denetleyicisidir. Ancak bu derece öneme haiz yetkiliye tüm bu görevlerini yerine getirmesi ve kayıtları sağlıklı bir şekilde saklayabilmesi için neden kamu binası tahsis edilmediği sorusu akla gelir. Ancak özellikle iş yükünü belirmeyi esas aldığımızdan konudan uzaklaşmamak adına bu ve benzeri konular kısaca değerlendirmiştir. Sonuç olarak hukukçu kimliği ile bilinen ancak taşrada tüm resmi kayıtları tutan ve bulunduğu kazanın en büyük idari amiri olan kadının daha çok noter işlemleri gibi hukuki işlemler ile uğraştığını dava işlemlerinin bu tür işlemlere nazaran daha az vaktini aldığını söylemek mümkündür."
