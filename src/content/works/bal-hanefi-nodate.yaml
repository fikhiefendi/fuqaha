abstract: "Bu çalışmada usul yazımında ikinci klasik dönem olarak isimlendirilen hicri VI. asırdan sonra yazılmaya başlanan ve medreselerde ders kitabı olarak okutulan Hanefi muhtasar usul eserlerinin edebi bir metin olarak ortaya çıkış süreci ve bu muhtasar usul eserlerinin kaynakları, etkileşimleri, benzer ve ayrışan yönleri ortaya konulmaya çalışılacaktır. Bu çalışma ile ikinci klasik dönemde Hanefi usul yazımının seyri muhtasar usul eserleri üzerinden ele alınmış olacaktır."
