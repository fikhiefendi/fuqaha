abstract: "Bu çalışmanın amacı Türkiye'de devlet sermaye ilişkileri kapsamında İslami sermayenin konumunu analiz etmektir. Bu bağlamda Poulantzas ve Jessop'un devlete dair geliştirdikleri analitik çerçeveden yola çıkarak islami sermaye'nin devletle ve diğer sermaye fraksiyonlarıyla olan ilişkisi incelenmektedir. Tezde, İslami sermayenin tarihsel gelişimini ele almanın yanı sıra MÜSİAD'ın yayınları ve İslam ekonomisine dair çeşitli analizlerin neşredildiği İslamcı dergilere yer verilmiştir. İslami sermayenin geliştirmek istediği ekonomi projesinin izini sürmek için bu yayınlar günümüzde önemli olduğu kadar, tartışmaların yürütüldüğü dönemde de fikir düzleminde yön verici etkiye sahiptirler. Neoliberal piyasa anlayışının islami temalarla yeniden yorumlandığı ve 1990'lı yıllara dair önerilerin sunulduğu bu kaynaklardan yola çıkarak İslami sermayenin nasıl bir sermaye birikim modeli tahayyül ettiği anlaşılmaya çalışılmıştır. Bu modellemede devletin varlığının ve devlet müdahalesinin ne düzeyde olması gerektiğine dair düşünceler irdelenmiştir. Ayrıca, yayınlardaki görüş ve tartışmalara dayanarak İslamcı sermayenin çalışma ilişkilerinde emeği nasıl konumlandırdığını açığa çıkarmak hedeflenmektedir."
