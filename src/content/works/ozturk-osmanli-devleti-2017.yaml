abstract: "Tanzimat Dönemi'yle başlayan adli modernleşmeyle birlikte Osmanlı Devleti'nin adli yapısında önemli değişiklikler görülmüştür. Ceza hukuku alanında başlayan değişim kendini ticaret, arazi, aile hukuku gibi alanlarında da göstermiştir. Adli modernleşme, Osmanlı Devleti'nin hukuk sistemi içerisinde yer alan mesleki yapılarda değişiklikler yaratmıştır. Tanzimat Fermanı'nda dile getirilen kişilik hakları doğrultusunda, ifta, müzevirlik, ayak kavaflığı, arzuhalcilik gibi bireysel savunma için kullanılan mesleki yapılar yerlerini dava vekilliğine bırakmıştır. Öncelikli olarak Tanzimat ve Islahat Fermanları, 1858 Ceza Kanûnu, Usûl-i Muhakeme-i Ticaret Nizamnâmesi, Şurâ-yı Devlet Dahili Nizamnâmesi, Mecelle gibi düzenlemelerde, dava vekilliğine atıfta bulunmak kaydıyla, yer verilmiştir. 1876 tarihli Dersaadet Dava Vekilleri Nizamnâmesi ile de dava vekâleti mesleğine giriş ve kabul şartları, dava vekillerinin görevleri, dereceleri ile ücretleri, dava vekili cemiyetinin oluşumu ve görevi ile ilgili ayrıntılı çalışma yapılmıştır. Bu nizamname ile dava vekilliği resmi olarak varlığını göstermiştir. Dava vekilliğinin resmiyet kazanmasıyla birlikte dava vekili yetiştirmek amacıyla Hukuk Mektebi açılmış ve adli yapı eğitim sistemiyle de desteklenmiştir. Nizamiye mahkemelerinde, dava vekili zorunluluğu getirilmesi dava vekilliğinin Osmanlı Devleti'nin adli yapısında iyice yerleşmesinde etki etmiştir. Dava vekâletinin göstermiş olduğu ilerlemeyle birlikte Dava Vekilleri Cemiyeti kurulmuş böylece dava vekilleri bu sistem içerisinde denetim ve kontrol altına alınmıştır. Cumhuriyet dönemine kadar var olma mücadelesi veren dava vekâleti mesleği 1924 tarihli Muhamat Kanunu'yla ilk kez meslek haline gelmiştir."
