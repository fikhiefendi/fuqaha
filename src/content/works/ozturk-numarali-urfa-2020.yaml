abstract: "Şer'iyye sicilleri, Osmanlı taşrasında yerel tarih araştırmalarında devlet sisteminin işleyişinin ortaya konulmasını sağladığı gibi Osmanlı adalet sistemine işaret eden temel kaynaklardandır. Bir şehrin askeri, sosyo-kültürel, dini ve ekonomik yaşantısını anlamak ve değerlendirmek için o şehrin Şer'iyye sicillerine başvurmak gerekmektedir. Şer'iyye sicilleri, kadılar tarafından görevli bulundukları bölgelerde görülmüş olan davalar, tesciller ve devlet merkezinden gelen hükümlerin kayıt altına alınmış olması hasebiyle, sicil defterlerini yerel tarihin incelenmesi ve değerlendirilmesi açısından önemli kılmaktadır. Birçok milleti çatısı altında barındıran Osmanlı devleti, adlî ve idari kurumlara gereken önemi vererek idarede adaleti esas almaya özen göstermiştir. Bu bakımdan adaleti sağlamada kadı/şer'iyye mahkemeleri Osmanlı hukukî yapısını icra eden önemli teşekküllerden bir tanesidir. Bu hukukî teşekküller Osmanlı hukuk tarihi açısından önemli rol oynamışlardır. Osmanlı'nın adlî yapıda göstermiş olduğu önem ve hassasiyet Urfa şer'iyye sicillerindeki kayıt sisteminde de kendisini göstermektedir. Araştırma konumuz giriş ve iki bölümden oluşmaktadır. Giriş kısmında kadılık ve Şer'iyye mahkemeleri hakkında bilgiler verilmiştir. Birinci bölümde Urfa Şer'iyye sicilleri ve 216 numaralı sicil defteri hakkında bilgilere ve genel değerlendirmelere yer verilmiştir. İkinci bölümde ise 216 numaralı sicil defterinin transkripsiyonu yapılmış olup, her davanın özeti belgelerin üstüne yazılmıştır. Çalışmamız, 216 numaralı Urfa Şer'iyye Sicili'nin (H. 1315-1317 / M. 1897-1899) ikinci yarısındaki sayfalar ile ilgilidir. Bu çalışmanın amacı, söz konusu defterde 239 ile 478 sayfalar arasındaki belgelerin transkripsiyon ve değerlendirmesini yapmaktır. Böylece Osmanlı döneminde mahkemelerin işleyişi, mahkemelerde görülen davalar, Urfa şehrinin sosyo-kültürel ve ekonomik yaşantısına çeşitli açılardan ışık tutulmaya çalışılmıştır. Defterde yer alan davalarla ilgili değerlendirmeler ve analizler yapıldıktan sonra çalışmamızın ana konusu olan sicilin transkripsiyon kısmına yer verilmiştir. Sonuç kısmında çalışmamızla ilgili genel değerlendirmeler ve çıkarımlar yapılmıştır."
