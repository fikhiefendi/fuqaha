abstract: "ÖZETadlı Eseri BağlamındaMATKAR MOV Vohid; ?el-UmniyyeKarâfû'nin Niyyetle lgili Görüşleri ve badetlerde Niyyet?, YüksekLisans Tezi, Danışman: Prof. Dr. Şami DAĞCI, Ankara Üniversitesi lahiyatFakültesi, IX+90 s.Karâfû'nin el-Umniyye fi drâki'n-Niyye adlı eseri ?Niyyeti drakEtmede temenni edilen ve umulan vasıf? aniamını ifade edip niyyetkonusunda müstakil bir çalışmadır.Tez Giriş ile üç bölümden oluşmaktadır.Birinci bölümde; tez, Mâlikû usÃ»lcüsü Şehâbüddin el-Karâfû'nin ?el-Umniyye fû drâkin-Niyye? adlı eseri çerçevesinde olması hesaba alınarak,müellifin hayatı ve eserleri hakkında malumat verilmeye çalışılmıştır.Bununla birlikte söz konusu eser hakkında kısaca bilgi verilmeye çalışılmışve yazılış amacı müellifin kendi dilinde anlatılmıştır.kinci bölümde; ?el-Umniyye fû drâkin-Niyye?de el-Karâfû'ninniyetle ilgili görüşleri çerçevesinde niyyetin mahiyet ve çeşitli hallerindenbahsedilmiştir.Üçüncü bölümde ise niyyet-ibadet ilişkisi ele alınarak niyyetinibadetlerde gerekli olup olmadığına temas edilmişti. Bununla birliktekonunun ayrılmaz parçalarını oluşturması bakımından boşamada, yeminlerdeve yolculukta niyyet bahsine çok kısaca değinilmiştir.Sonuç kısmında ise tezimde ulaştığım önemli sonuçlar ortayakonulmaya çalışılmıştır."
