abstract: "Kadınların özel hallerinde yapabilecekleri ve yapamayacakları ibadetler\" adlı tezimiz önsöz, iki bölüm ve sonuç bölümünden meydana gelmektedir. Önsözde ibadetin öneminden, bu konuda kadın ve erkek arasında bir ayrım olmadığından, tezimizin hazırlanış amacından bahsedilmiştir. Birinci bölümde kadınların özel hallerinin ne olduğunu, özel hallerin tıbbi ve psikolojik sonuçlarını, İslâm'ın ve diğer ilahi dinlerin özel hallerdeki kadınlara bakış açısını açıklamaya çalıştık. İkinci bölümde kadınların özel hallerinde yapabilecekleri ve yapamayacakları ibadetleri Kur'ân-ı Kerim ve hadisler ışığında ele aldık. Mezheplerin görüşlerine delilleriyle birlikte yer verdik. Klasik bakış açısının bazı çevrelerce yeniden tartışılmaya başlanması sonucu ortaya çıkan modern görüşlere değindik. Sonuç kısmında ise genel bir değerlendirme yaparak deliller ışığında kendi görüşümüzü ortaya koyduk. Anahtar kelimeler; Kadın, ibadet, hayız, nifas, istihâze."
