abstract: "Türk kasidesi daha çok İran kaside şairlerinin etkisiyle geliştiği için, İran kasidelerinde olduğu gibi övülen kişinin özellikleri mübalağa ile ifade edilmiştir.Kaside , şeklen gazele benzer. Bir yandan onun bize gelmezden önceki şekli, diğer yandan Divan şiirimizin geleneklere sıkı sıkıya bağlı karakteri, bir başka yandan da çağın, şairi saran içtimai, kültürel, iktisadi şart ve eğilimleri, Divan şiirimizde kasidenin bu yönüyle ön plana çıkmasına ve büyük bir çoğunlukla bu doğrultuda kullanılmasına sebep olmuştur. Şairlerimiz ya adete uymak, ya övdüğüne gerçekten inanmak, ya çeşitli bakımlardan övgüye mecbur olmak, özellikle bu yoldan geçimini sağlamak, durumunu yükseltmek, ya da bu sebeplerden bir kaçı çevresinde hemen daima kaside yazmışlardır. Bunu gayet ölçülü, seviyeli yürütenler olduğu gibi, kötüye kullananlar, bayağılaştıranlar da olmuştur. Değerli, seviyeli şairlerin elinde kaside, hem şair olma haysiyetini korumuş, hem de Osmanlı Türk kültür ve medeniyetinin bir bakıma edebiyattaki yankısı olagelmiştir.Osmanlı tarihinde pek çok şeyhülislâm gelmiş geçmiştir. Şeyhülislâmlar ?Efendi? ünvanı ile anılmaktadır. Ancak, soyunda Bey veya Paşa olanlara ?Beyefendi? diye hitabedilmektedir.Şeyhülislâmlar çok kez Türklerden seçilmiştir. Bunun da nedeni soyca Türk olmayan ?devşirme?lerin bilimsel mesleklere rağbet etmeyişlerinden ileri gelir. Ancak bu karinenin de istisnaları vardır. Örneğin Molla Abdülkerim Efendi Sırp veya Hırvat ırkındandır. Molla Hüsrev'in babası Fransızdır. Kadızâde Ahmed Şemseddin Efendi bir köle torunudur.Şeyhülislamlara yazılan kasidelerin de amacı o şeyhülislamın beğenisini kazanmak, onu sevdiği için dua etmek ve onun yakın çevresinde olmak gibi sıralanabilir.Çalışmamız saha tarama tekniği ile oluşturulmuş bir tezdir ve bu konuyla ilgili yapılan çalışmaların bir kısmı bu teze dahil edilmeye çalışılmıştır."
