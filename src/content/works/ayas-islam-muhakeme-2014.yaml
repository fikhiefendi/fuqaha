abstract: "Hangi hukuk sistemi olursa olsun muhakeme kısmı büyük önem taşır. Bu konuda toplumsal adaletin sağlanması ve insanların haklarının korunması için muhakeme mercilerine büyük görevler düşmektedir. Bir hak iddia eden kimse kendi hakkını savunurken karşıdaki kişiyi de töhmet altında bırakmaktadır. İşte bu yüzden muhakeme hukukunda ispat vasıtaları büyük önem taşımaktadır. İslam muhakeme hukuku da gerek hakkın korunması gerekse töhmet altında kalan kişinin hakkının korunması amacıyla iddianın ispatlanmasını istemiştir. İslam muhakeme hukukunun temelinde, Hz. Peygamber'in (a.s) de bizzat uygulamış olduğu“Delil getirmek davacıya, yemin etmek davalıya düşer.”kaidesi yer alır. Delil getirmekten kasıt o dönemi göz önüne aldığımızda, genel olarak şahit getirmektir. İspat için belirli bir şahit sayısı, ayet ve hadislerde net olarak belirlenenler hariç İslam hukukçuları arasında ihtilafa sebep olmuştur. Çalışmamızın konusu olan tek şahit ve yeminle hüküm meselesinde Hanefiler ve diğer mezhepler arasında ihtilaf olmuştur. İhtilafın kaynağı ise, bir ayetin ve hadisin uygulanması üzerinde oluşan farklılıktır."
