abstract: "Tarafların sözleşmeden kaynaklanan sorumluluklarını kararlaştırılan zamanda ifa etmemeleri birtakım sorunlara sebep olmaktadır. Özellikle davaların kısa sürede sonuçlandırılamaması, zarar ve kusurun ispatı gibi güçlükler alacaklıyı borcun ifasını sağlayacak arayışlara sevk etmektedir. Cezai şart günümüzde borçlar hukukunda, ticaret hukukunda, iş hukukunda ve medeni hukukta geniş uygulama alanına sahiptir. Tarafların kolay bir şekilde ve kendi iradeleriyle istedikleri gibi kararlaştırabilmeleri cezai şartın sıklıkla başvurulan hukuki işlem olmasının en önemli nedenlerindendir. Borçluyu ifaya zorlama, zararın tazmin edilmesi ve alacağın teminat altına alınması gibi birçok temel işlevi olan cezai şart borçlunun, asıl borcunu ilerde hiç veya gereği gibi ifa etmemesi ya da geç ifa etmesi durumunda, alacaklıya ödemeyi önceden taahhüt ettiği edimdir. Cezâî şart anlaşmasından doğan borç, asıl borca bağlı feri bir borçtur. Bu bakımdan asıl borç yoksa cezai şartın varlığından bahsedilemez. Ancak ifa zamanından sonra cezai şart, niteliği veya miktarı bakımından bağımsız bir edim haline dönüşür. ?Sözleşmelerde Cezai Şart? konulu çalışmamız, üç bölümden oluşmaktadır. Giriş kısmında çalışmanın önemi, amacı, yöntemi, kaynakları ve değerlendirme metodu hakkında bilgi verilmiştir. Birinci bölümde hem modern hukuk hem de İslam hukukuna göre sözleşme, şart ve cezai şart kavramları incelenmiş, cezai şartın konusu, amacı, benzer kavramlarla ilişkisi ve çeşitleri araştırılmış, hukuki niteliği, unsurları ve muaccel olmasının şartları tespit edilmiş, İslâm hukukuna göre para borçlarında ve diğer borçlarda cezai şartın hükmü tahlil edilmiştir. İkinci bölümde amacı bakımından sınıflandırılan sözleşmelere cezai şartın etkisi araştırılmıştır. Bu bağlamda sözleşme çeşidi hakkında kısa bilgi verilmiş İslâm hukukçularının görüşleri delilleriyle birlikte tespit edilmiştir. Üçüncü bölümde cezai şartın tadili, iptali ve sona ermesi başlığı altında, modern hukukla mukayeseli olarak cezai şart miktarının indirilmesinin veya artırılmasının kriterleri tespit edilmiş, cezâî şartın iptali ve sona ermesi konusu araştırılmıştır. Sonuç kısmında ise `Sözleşmelerde Cezai Şart? konulu çalışmadan elde ettiğimiz neticeler ifade edilmiştir."
