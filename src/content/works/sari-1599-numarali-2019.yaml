abstract: "Şer'iyye Sicilleri içerdiği bilgiler açısından bölgesel tarih çalışmalarında kullanılan önemli kaynaklar arasındadır. Bu çalışmada; Rodoscuk/Tekirdağ'a ait olan Hicri 1074 – 1076 ve Miladi 1663-1666 yıllarını ihtiva eden 1599 numaralı Rodoscuk Şer'iyye Sicili'nden elde edilen veriler analiz edilmiştir. Defterdeki belgeler türlerine ve konularına göre tasnif edilmiştir. Merkezden veya diğer devlet görevlileri tarafından gönderilen belgeler“suret”(fermân, berât, buyruldu), mahkeme tarafından düzenlenen belgeler ise“zabıt”(i'lam, hüccet, tereke) olarak tanımlanmıştır. Kayıt altına alınan belgelerin %80'ini zabıtlar %20'sini de suretler oluşturmaktadır. Zabıtların büyük çoğunluğunu mesken satışları, bağ ve bağçe satışları, miras taksimleri, vasi tayinleri, terekeler oluşturmaktadır. Sicilde, köle azadından, vakıf kayıtlarına, vergi işlemlerinden, gayrimüslimlerin yaşantılarına varıncaya kadar pek çok farklı konudaki belgeye rastlanmaktadır. Defterdeki kayıtlar yıllara göre ayrı ayrı tasnif edilmiştir. Yıllara göre ayrılan belgeler zabıt ve suretler olarak listelenmiştir. Tanıtımını yaptığımız 1599 numaralı Rodoscuk Şer'iyye sicilinde bulunan belgeler, bölgenin sosyal, kültürel ve ekonomik manada anlaşılmasına katkı sağlayacak bilgiler içermektedir. Bu bilgiler ışığında Rodoscuk Kazası hakkında değerlendirmeler yapılmıştır."
