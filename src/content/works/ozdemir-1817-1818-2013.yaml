abstract: "Şer? iyye Sicilleri ihtiva ettikleri belge ve bilgiler nedeniyle bulundukları bölge ve yazıldıkları dönemle ilgili zengin bilgiler ihtiva etmektedir. 561 numaralı Afyon Şer?iyye Sicili , bizlere devletin halka olan ilişkilerini ve sistem agı içerisinde cereyan eden olayları aktarmada ve böylece Osmanlı Devleti?nin gün yüzüne çıkmayan karanlık noktalarını aydınlatmaya yardımcı olmaktadır. Afyon Şer?iyye Sicili Miladi 1817 ve 1818 Hicri 1233 tarihleri arasında Afyon?da meydana gelen birçok olayı aydınlatmaya yarayacak ve şehir tarihçilerine büyük faydalar sağlayacaktır. Sözü edilen sicilde daha çok merkezden gelen ferman, buyuruldu, berat vb. gibi belgeler kaydedilmiştir. Mahalli olarak Afyon?u anlatan buyruldu, mektup, hüccet, ilâm ve mürâsele gibi vesikalar çoğunluktadır, bu defter daha çok ?Sicil-i Mahfuz Defterli? şeklinde tanzim edilmiştir."
