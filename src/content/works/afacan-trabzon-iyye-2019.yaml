abstract: "Bu çalışmada, insanlar arasında ortaya çıkan anlaşmazlıkları sona erdiren sulhun Trabzon şehrindeki toplum ilişkileri ile hukuk sistemine yansıyan uygulanış biçimi ele alınmaktadır. Konu ile ilgili olarak 1857, 1858, 1859, 1860, 1861, 1862 numaralı Trabzon şer'iyye sicillerinden faydalanılmıştır. Çalışma alanı XVII. Yüzyılın son çeyreğini kapsamaktadır. On yıllık süreci kapsayan bu dönem Hicri 1101-1108 miladi 1689-1698 yılları arasındaki kayıtları ihtiva etmektedir. Bu çalışma üç ana bölümden oluşmaktadır. Birinci bölümde sulh akdinin İslam ve Osmanlı hukuk sistematiği içerisindeki yeri üzerinde durulmuştur. Bu kısımda ilk olarak sulhun kaynaklardaki önemi ayetler, hadisler, fetvalar ve kanunnâmeler doğrultusunda açıklanmaya çalışılmıştır. Ayrıca bu bölümde sulh akdi kendisine has özellikleri bakımından ele alınmıştır. İkinci bölümde Trabzon örneği üzerinden sulhle alakalı kayıtlar çeşitli hukuk başlıklar altında incelenmiştir. Çeşitli konularda tasnif edilen sulh akidleri gerektiğinde grafik ve tablolarla desteklenerek kapsamlı bir değerlendirmeye tabi tutulmuştur. Üçüncü bölümde ise XVII. Yüzyılın son çeyreğinde Trabzon mahkeme kayıtlarında sulh akidlerinin genel bir analizi yapılmıştır. Bu bölümde muslihûn (arabuluculuk) müessesesi, bedel-i sulhun çeşitleri, niteliği açısından sulh akidleri incelenmiştir. Yine bu kısımda Trabzon'da sulh akidlerinin yaşandığı kaza, nahiye, mahalle ve köyler tasnif edilmiştir. Ayrıca sulh akdinin dini gruplar üzerindeki etkisi ile tarafların unvanları, cinsiyetleri ve akrabalık bağları ayrıntılı olarak değerlendirilmiştir."
