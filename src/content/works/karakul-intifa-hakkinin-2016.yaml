abstract: "İNTİFA HAKKI, SAHİBİNE KONU OLAN EŞYA ÜZERİNDE KULLANMA VE YARARLANMA HAKKI VEREN, DEVREDİLMEZ VE MİRASÇILARA GEÇMEZ NİTELİKTE SINIRLI AYNİ BİR HAKTIR. İNTİFA HAKKININ SONA ERMESİ MK MD. 796 VD. HÜKÜMLERİNDE DÜZENLENMİŞTİR. SONA ERME, BAZEN ÇEŞİTLİ ŞARTLARIN MEYDANA GELMESİYLE KENDİLİĞİNDEN GERÇEKLEŞEBİLECEĞİ GİBİ BAZEN DE BİR HUKUKİ İŞLEM VEYA MAHKEME KARARIYLA MEYDANA GELEBİLECEKTİR. HAKKIN KONUSU EŞYANIN YOK OLMASI, HAK SAHİBİNİN ÖLÜMÜ, SÜREYE BAĞLI HAKLARDA SÜRENİN DOLMASI, YASAL İNTİFA HAKKINDA ONU KURAN SEBEBİN ORTADAN KALKMASI, EŞYANIN KULLANILMAYACAK DERECEDE HARAP OLMASI GİBİ DURUMLAR MEYDANA GELDİĞİNDE İNTİFA HAKKI KENDİLİĞİNDEN SONA ERMEKTEDİR. BUNA KARŞILIK HAK SAHİBİNİN TEK TARAFLI VEYA MALİKLE ANLAŞARAK HAKTAN VAZGEÇMESİ, TAŞINMAZLARIN PARSELLERE BÖLÜNMESİ VE BİRLEŞTİRİLMESİ, MK MD. 785'İN KIYASEN UYGULANMASI İLE HAKKIN YARAR SAĞLAMAMASI, PAYLI MÜLKİYETE ÖZGÜ SONA ERME SEBEPLERİNİN GERÇEKLEŞMESİ, CEBRİ İCRA VE KAMULAŞTIRMA GİBİ SEBEPLER DE İNTİFA HAKKININ SONA ERMESİ İÇİN HUKUKİ İŞLEME VEYA MAHKEME KARARINA İHTİYAÇ DUYULAN HALLERDİR. HAK SONA ERDİĞİNDE EŞYANIN MALİKE AYNEN GERİ VERİLMESİ GEREKMEKTEDİR. GERİ VERME YÜKÜMLÜLÜĞÜ YERİNE GETİRİLİRKEN, EŞYADA MEYDANA GELEN OLAĞAN ESKİMELER DİKKATE ALINMAYACAK ANCAK HAK DEVAM EDERKEN, HAK SAHİBİ ELİNDEKİ EŞYAYI KORUMA BORCUNA AYKIRI DAVRANDIĞI VE GEREKLİ ONARIMLARI YAPMADIĞI SÜRECE BUNDAN SORUMLU OLACAKTIR. HAKKIN KONUSU EŞYADA DEĞER AZALMASI GERÇEKLEŞTİĞİNDE VEYA YOK OLDUĞUNDA, İNTİFA HAKKI SAHİBİ ZARARIN KENDİ KUSURUNDAN MEYDANA GELMEDİĞİNİ İSPATLAMADIĞI SÜRECE, DOĞAN ZARARDAN SORUMLU TUTULACAKTIR. BUNA KARŞILIK İNTİFA HAKKI SAHİBİNİN YAPMAKLA YÜKÜMLÜ OLMADIĞI HALDE YAPTIĞI GİDERLER, YENİLEMELER VE EKLEMELER İÇİN MALİKTEN TAZMİNAT İSTEMESİ MÜMKÜNDÜR. BU TAZMİNAT, VEKALETSİZ İŞGÖRME HÜKÜMLERİNCE TALEP EDİLEBİLİR. MALİKİN BU GİDERLERİ TAZMİNDEN KAÇINMASI HALİNDE İNTİFA HAKKI SAHİBİ, SÖKÜP ALMA HAKKINI KULLANABİLECEKTİR."
