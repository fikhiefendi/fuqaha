abstract: "Bu çalışma, Ağa Hanlar olarak bilinen İsmâ'îlîlerin son dört imamlarının hayatlarını ve onların günümüzdeki faaliyetlerini ele almaktadır. Son iki yüz yılda yaptıkları faaliyetlerinin tespit edilmesi amaçlanmaktadır. Çalışma ile İsmâ'îlî imamların masum ve günahsız olduklarına mensuplarınca inandıkları tespit edilmiştir. Bu grubun başarısında en önemli rolün imamlarına olan bağlılıkları olduğu belirlenmiştir. Zekâtlarını imama vermelerinden dolayı yüzlerce okul, hastane ve finansal kurum kurdukları, vakıfsal faaliyetler ile insani yardımları organize ettikleri, enstitüler vasıtası ile akademik dünyada etkili konumlara geldikleri ortaya çıkarılmıştır. Din, dil ve ırk ayrımı gözetmeden hizmet vermeleri nedeniyle örnek bir toplum olarak görüldüklerine dikkat çekilmiştir."
