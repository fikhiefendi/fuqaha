abstract: "Hanefî mezhebinde haber-i vâhidin değeri konusunda önemli bir yere sahip olan manevî inkıtâ kavramının doğuşu, gelişimi ve bu zaman dilimi içerisinde (şayet var ise) manevî inkıtâ algısı hakkındaki değişimleri, söz konusu kavramın ortaya çıktığı ilk Hanefî usûl eserinden memzûç eserler dönemine kadarki süreci izleyerek tespit etmeye çalışmak tezin hedefini teşkil etmektedir. Diğer ilim dallarında da görüldüğü üzere, bir konunun tarihin her döneminde ilgili çevrelerde aynı yoğunlukla tartışılmadığı, bilakis bazı dönemlerde oldukça etraflı bir şekilde ele alınan bir meselenin başka bir zamanda önem ve değerinin azaldığı bir gerçektir. Bu açıdan manevî inkıtâ kavramı hakkında hazırlanması düşünülen bu tezin öncelikli sorusu, Hanefî mezhebinin teşekkül sürecinde mezhebin haber anlayışının tekâmülünü gösterecek şekilde ayrıntılı bir biçimde işlenen manevî inkıtâ kavramı ile hedeflenenin ne olduğunu ve manevî inkıtâ adı verilen durumları Hanefî usûl âlimlerinin nasıl değerlendirdiklerini ortaya koymaya çalışmak olacaktır."
