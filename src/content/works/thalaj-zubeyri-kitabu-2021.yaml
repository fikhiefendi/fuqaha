abstract: "Fıkıh, İslam kültür mirasını oluşturan ilimler içinde müstesna bir yere sahiptir. Fıkıh ilminin alt-disiplinlerinden biri kabul edilen“Furûk”(Farklar), bu ilmin odaklandığı en ince ve en önemli meseleleri konu edinir. Fıkhî meseleler ve başlıklar arasındaki ilişkilere ve incelik arz eden farklılıklara yoğunlaşan bu konu, ilk dönemlerden itibaren İslam âlimlerinin ilgisini çekmiş; fıkıhla ilgili çalışmaların ve disiplinlerin gelişmesine bağlı olarak bu konuda zaman içerisinde birçok kitap telif edilmiştir. Farklar, hemen bütün fıkıh mezheplerinde müstakil tasnif ve araştırmalara konu olmakla birlikte, özellikle Şâfiî mezhebinde bu alanda birçok metin kaleme alındığı görülür. Bu kitapların en meşhurları, İbn Süreyc'in Kitâbu'l-furûk'u, Ebû Muhammed el-Cüveynî'nin el-Cem' ve'l-fark'ı, Sübkî ve Süyûtî'nin el-Eşbâh ve'n-nezâir başlıklı kitaplarıdır. Elde edebildiğimiz bilgilere göre bu konuda yazılan ilk kitap, hicri 317 yılında vefat eden Ebû Abdullah ez-Zübeyr b. Ahmed ez-Zübeyrî'nin el-Müskit adını verdiği eseridir. Zübeyrî kitabını Şâfiî kitaplarında takip edilen sıralamaya göre bablara ayırmamış olup kitabın tertibini Tâcüddîn Muhammed b. Hibetullah el-Hamevî (v. 595) üstlenmiştir. Zübeyrî eserinde, fıkhın muhtelif bablarına ait birçok meseleye değinmiş, birbirine benzeyen konu ve hükümler arasındaki farkları kısa, öz ve tutarlı bir yöntemle ortay koymuştur. İmam Şâfiî'nin görüşlerini ve özellikle Arap diliyle ilgili temel kabullerini takip eden Zübeyrî, Şâfiî mezhebi fukahası arasında sayılmaktadır. Müellif, kitabında geçmiş ulemadan -Şâfiî dışında- nakil yapmaya özen göstermemiştir. Şâfiî'den yaptığı nakillerin mevcut metinlerde bulunması, kitabın güvenilirliğini arttıran bir husus sayılabilir. Bu çalışmanın amacı, el-Müskit'i ilim alemine kazandırmak; kitabı ilmî ve akademik esaslara uygun olarak tanıtıp inceledikten sonra gün yüzüne çıkarmak ve okuyucuların istifadesine sunmaktır. Çalışmamız kitabın metnini dizip yeniden tertip etmekle sınırlı kalmayacak; muhtevası üzerinden yapılacak tetkiklerle müellifin birbirine benzer konuları nasıl ele aldığı, bunları birbirinden nasıl ayırdığı ve hangi yöntemi kullanarak sonuçlara vardığı tespit edilecek ve değerlendirilecektir. Ayrıca tezde, müellifin hayatı hakkında da bilgi verilecek ve hem kendisi hem de fıkıh ilmini tahsil ettiği hocaları ile ilmî silsilesi tanıtılacaktır. Araştırmanın bir diğer amacı, furûk sahasında telif edilmiş bir metin üzerinden fıkhî tefekkürün haritasını açıklamaya yardımcı olacak genel sonuçlar çıkarmak ve bu sayede fıkhî düşünce yönteminin daha iyi anlaşılmasına katkı sunmaktır."
