abstract: "Rekabetin hız kazandığı günümüzde bankaların başarılı olabilmeleri, ürün çeşitliliklerinin yanında başarılı ve kurumlarına bağlı personel kadrolarıyla mümkündür. Motivasyon ise performans ve verimliliği etkileyen en önemli unsur olarak ön plana çıkmaktadır. Çalışanların yüksek düzeyde motive edilmiş olmalarıyla birlikte örgütsel bağlılıkta giderek artacak, aksi durumda yaşanabilecek çeşitli risklerin önüne geçilmiş olacaktır. Çalışmanın amacı; katılım bankaları çalışanlarına yönelik içsel ve dışsal motivasyonun örgütsel bağlılık ve alt boyutları üzerindeki etkisini inceleyerek literatüre katkı sağlamaktır. Birinci bölümde motivasyon kavramı, ikinci bölümde örgütsel bağlılık kavramı teorik olarak ele alınmış ve üçüncü bölümde ise konu ile ilgili yapılan bir çalışmaya yer verilmiştir. Araştırma kapsamında Konya il sınırları içerisinde bulunan katılım bankaları çalışanlarından tesadüfi yöntem ile elde edilen 231 anket SPSS 22 programı kullanılarak analiz edilmiştir. Çalışmanın sonucunda, içsel ve dışsal motivasyonun örgütsel bağlılık ve alt boyutları üzerinde pozitif ve anlamlı etkisi olduğu bulunmuştur. Başka bir ifadeyle çalışanların motivasyon düzeyleri artıkça, örgütsel bağlılık düzeylerinin de artığı söylenebilir."
