abstract: "Bu tez Kuzey Irakt'a bulunan İslamî bankaların İslami hassasiyetlere göre çalışıp çalışmadıkları irdeleyen kapsamlı bir çalışmadır. Çalışmamızda Kuzek Irak'taki tüm İslami bankalar mercek altına alınmış ve bu bankaların iş ve işlemlerinde İslami ölçütlere dikkat edilip edilmediği araştırılmıştır. Bankalardaki işlemlerden İslami olanlar ve İslama aykırı olanlar belirlenmiştir. Kuzey Irak Bölgösel Kürt Yönetimi bölgesinde bu güne kadar akademik açıdan bu konuda her hengi bir çalışma yapılmamıştır. Bu açıdan bu tez ilk defa olarak bölgedeki İslami bankacılığın iş ve işlemlerini İslami açıdan ortaya çıkarmaktadır. Kuzey Irak'taki İslami bankalar yönetimin belirlediği ve İslami olmayan kanunlar çerçevesinde çalıştığı için bu konuda pek çok proplemler meydana gelmektedir. Bu durum dünyadaki bütün İslami bankalar için geçerlidir. Çalışmada bu asırda İslami bankacılığın önemine değinmiştir. İslami bankaların olmasının zaruri olduğu kanısına varılmıştır. Müslüman halkın faize bulaşma korkusu bu bankaların varlığını olmazsa olmaz kılmıştır. Ancak hem sözde hem de amelde (teori ve pratik) İslami kurallara göre çalışmaları şarttır. Bu çalışma konu ile ilgili hem eski asır alimlerin görüşlerini hem de günüzdeki alimleri görüşleri incelenmiş ve özellikle ihtilaflı konular araştırılarak sağlıklı ve doğru sonuçlara ulaşılmıştır."
