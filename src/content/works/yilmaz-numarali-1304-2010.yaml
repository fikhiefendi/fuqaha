abstract: "Çalışmamız 82 Numaralı Tokat Şer'iye Sicilinin günümüz Türkçesine çevrilmesi ve değerlendirilmesinden oluşmaktadır.H. 1304-1313\\ M. 1886-1896 yıllarını kapsayan ve 118 sayfa olarak kayıtlarda bulununan sicil defterinin tamamı tereke kaydı (kişinin vefatı dolayısıyla geride bıraktığı her türlü mal varlığı ve varislerine taksimi) ndan oluşmaktadır.Tez , dört ana bölümden müteşekkil olup; giriş bölümünde Osmanlı Devleti'nin hukuki yapısı ve şer'iye sicilinin tarihi ve önemi genel olarak anlatılmıştır. Birinci bölümde belge özetleri verilerek bir belgenin içinde geçen olay hakkında ön bilgi verilmiştir. İkinci bölümde ise metin tarsnkripsiyonu verilmiştir. Tezimizin üçüncü bölümünde ise defterden elde ettiğimiz bilgiler ışığında Tokat ile ilgili idari, sosyo-ekonomik, ve iktisadi yapı hakkında bilgiler verilmeye çalışılmış ve değerlendirme yapılmıştır.Trankribe edilen metinlerde yazı tarzı nadiren değişiklik arz etmiştir. Sicil defterinin kapsadığı yıllarda ki; mahalle, nahiye ve şahıs isimlerine, lakaplara, ölçü birimlerine, kullanılan giyim ve ev eşyaları, ölçü ve para birimleri hakkında bilgilere ulaşılabilmektedir. Geride kalan mal varlıkları incelendiğinde, halkın, ekonomik yapısı hakkında veriler bulabilmekteyiz. Bununla birlikte, Müslim ve gayr-i Müslim tebaanın birlikte yaşadıkları ve gayr-i Müslim halkın, Müslüman halka göre ekonomik yönden daha iyi şartlara sahip oldukları da görülmektedir. Osmanlı dönemi aile yaşantısı hakkında da bilgi sahibi olabilmekteyiz."
