abstract: "İktisat, sınıflandırma ve kompozisyon açısından modern pozitif sosyal bilimlerin bir dalıdır, ancak uygulama açısından eski bir bilimdir ve uygulama açısından insana eşlik etmektedir. Sınırlı ekonomik kaynaklar karşılığında insanın çoklu ihtiyaç ve isteklerinin varlığından kaynaklanan sorunları incelemekle ilgilenen, mümkün olan en fazla sayıda toplum üyesinin ihtiyaçlarını karşılamak için mevcut kaynakları yönetmeye çalışmaktadır. Birçok iktisatçı, kaynakların kıtlığının ve sınırlılığının iktisadın ortaya çıkış nedeni olduğuna inanmaktadır. İktisat Bilimi'nin bu sorunu çözmek için var olduğunu söylemektedir. Ekonomi (İktisad) sorununu çözmek için kapitalist ülkeler tarafından benimsenen kapitalist sistem gibi pozitif ekonomik sistemler ortaya konulmuş ve ardından komünist ülkeler tarafından benimsenen sosyalist sistem geliştirilmiştir. Bu şekilde, her ekonomik sistemin, ekonomik süreçte benimsediği ilkeleri ile kuralları bulunmakta ve ekonomik sorunu çözmeye yönelik bir bakış açısına sahip olmaktadır. İslam ekonomisine gelince, İslam inancına bağlı bir ekonomidir. Ekonomi, İslam Hukuku (Fıkıh) tarafından düzenlenir. Modern anlamdaki İslam ekonomisinin ortaya çıkışı ise yirminci yüzyılın ortalarına denk gelmektedir. İkinci Dünya Savaşı sonrasında İslam ülkelerinin yaşadığı siyasi değişim, birçok İslam ülkesinin bağımsızlığına kavuşmasına neden olmuştur. Sonuç olarak İslami değerlere dönülmesine katkı sağlamış ve bu da ekonomi alanına yansımıştır. Siyasî bağımsızlıklarını kazanan İslam ülkeleri, ekonomik olarak güçlenmiş, ekonomik bağımsızlık araçlarını da petrol yoluyla elde etmişler ve bu ekonomik kazanımı İslami usullere göre kullanmak istemişlerdir. Batı ekonomisi ve biliminin tüm yönleri İslam ile bağdaşmadığından, ekonomiyi İslami usullere göre kullanma çabaları“İslam ekonomisi”terimini oluşturmuştur. Ana akım ekonominin yöntem ve analizlerini İslami bakış açısıyla karakterize etmeye çalışan bu terimi ilk kullananların Pakistanlı Müslümanlar olduğu kabul edilmektedir. İslam Ekonomisini yaşama dökmek için 1975 yılında Dubai İslam Ticaret Bankası'nı kurulmuş, bu da“İslami”bankacılığın ortaya çıkmasına yol açmış ve böylece İslam ekonomisi, İslami finansın özel sektör uygulamasıyla devreye girmiştir. 21. yüzyılda İslam ülkelerinin yaygın bir İslami ekonomik sistem için bütünleşik bir model bulmaya yönelik ilgisi artmış ve bu ilgi İslam ekonomisine dair birçok sorunu ve tartışmayı beraberinde getirmiştir."
