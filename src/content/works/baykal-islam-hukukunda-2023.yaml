abstract: "İslam hukukunda suç ve cezaların had, tazir, kısas şeklinde üçlü tasnifi esastır. Zina, mezhep ekolleri tarafından, bütün cinsel suçları içine alacak şekilde bir had suçu sayılmıştır. Ayet ve hadislerde zina suçunun bütün tipleriyle ele alınmış olması, zinanın bir had suçu olduğu konusunda şüpheye mahal vermemektedir. Ancak zinanın alt dalları (çeşitleri) kabul edilen diğer bütün suçlar, suçun unsurları yönünden zinadan farklılık göstermektedir. Aynı zamanda zina suçunun ispatı için cumhurun şart olarak sunduğu kanunî delil zorunluluğu, bu suçu işleyen bireylerin sır alanı içinde onlara özgürlük kazandırırken, zinanın altdalları (çeşitleri) kabul edilen diğer cinsel suçlar da, mağduriyetlere sebep olmaktadır. Bu soruna çözüm olarak sunulan had suçlarında serbest delil kullanılmasının kabul edilmesi halinde ise zina suçu işleyen bireylerin sır alanına devletin müdahale etme hakkını doğuracaktır ki bu da İslam'ın özgürlüklere karşı totoliter bir yapıya bürünmesi anlamını taşıyacak, tehlikeli bir yaklaşımdır. Çalışmamızda ilk olarak İslam hukukunda yapılmış olan sınıflandırma çalışmaları incelenerek kişinin sır alanının dokunulmazlığı ilkesinin hukuktaki yeri gösterilmiş, daha sonra zina suçunun ayetlerin ışığında tipleri oluşturulmuş, tecavüz suçunda bu tiplerin olmadığı tespit edilmiştir. Zina ve tecavüz suçlarının, bu suçlara verilen ceza ile korunan hukuksal değerler yönüyle karşılaştırılması yapılmıştır. Bütün bunlar tecavüzün zinanın bir alt dalı olmadığını göstermiştir. Bu probleme çözüm olabilecek üç ihtimal tespit edilmiştir. Birincisi Osmanlı döneminde olduğu gibi tazir suçlarından saymak. İkincisi modern dönem İslam hukukçularının çare olarak sunduğu iğtisap suçu olarak kabul etmek. Üçüncü olarak tecavüz suçu ve türevlerine, İslam hukukunun yapısına uygun, Yusuf suresinde örneklendirildiği ve sahabe döneminde de tatbik edildiği üzere, serbest delille ispatlanabileceği müstakil bir alan açmak. Çalışmamızda bütün bu ihtimallere yer verilmekte ve değerlendirilmektedir"
