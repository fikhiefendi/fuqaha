abstract: "Günümüz finansında borsa işlemleri büyük bir önem arz etmektedir. Borsa işlemleri içinde de hisse senedi alım-satımı konusu İslâmî finans ilkelerine uygunluk bakımından araştırma konularının başında gelmektedir. Hisse senedi işlemlerini İslâmî finans ilkelerine uygunluk bakımından incelediğimizde öz ve nitelik olmak üzere iki açıdan değerlendirildiğini görürüz. Öz açısından değerlendirmede bir menkul kıymet olarak alım satıma konu olup olamayacağı incelenir. Nitelik açısından değerlendirmede ise sahiplerine sağladıkları haklar ve yükledikleri sorumluluklar ile hisse senedini çıkaran şirketin faaliyet alanı bakımından fıkhî incelemeye tabi tutulur. Bu faaliyet alanlarının İslam'a göre meşru olup olmaması değerlendirmedeki ana unsurdur. Çünkü hisse senetleri bir ortaklık belgesini temsil eder. Hisse senedi sahibi, şirketin ortağı olarak bütün ortaklık haklarından faydalandığı gibi o şirketin yapmış olduğu faaliyetlere de ortak olur. Bu sebeple şirketin faaliyet alanının yanında gelir ve giderlerindeki haram kazançların miktarları da incelemeye tabi tutulur. Günümüzde katılım endeksleri için de bu miktarlar önemlidir. Katılım endekslerine girecek şirketler için fıkıh kurullarının belirlediği farklı oranlar mevcuttur. Bu konuda çok sayıda ilmî toplantı ve sempozyumlar yapılmasına rağmen ittifak edilen bir görüş ortaya çıkmadığı görülmüştür. Biz tezimizde hisse senetlerini çıkaran şirketlerin faaliyet alanları bakımından hükmünü ve katılım endekslerine girecek şirketler için fıkıh kurullarının belirlediği farklı oranların dayandığı delilleri incelemeye çalıştık. Şirketlerin faaliyet alanlarının karışık olması sadece faizle ilgili olmamasına rağmen faiz konusuna yoğunlaşıldığını tespit ettik. Bu konuyla ilgili daha kapsamlı çalışmalar yapılmasına ihtiyaç duyulduğu görülmektedir."
