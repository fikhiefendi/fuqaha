abstract: "Özen borcu, akitten doğan yapma borçlarının gereği gibi ifa edilebilmesi için borçlunun ifa fiillerine göstermesi gereken dikkat, çaba ve hassasiyeti konu edinen modern bir borçlar hukuku kavramıdır. Bu çalışmada, Hanefi mezhebinin klasik kaynakları esas alınarak iş görme akitlerinde özen borcunun fıkhi karşılığı incelenmiştir. Öncelikle biçimsel ifade yönünden özen borcunun Hanefi kaynaklardaki kullanım ve görünümleri tespit edilmiş, kavramın fıkıh dili ve yöntemi itibariyle ne şekilde edim programına dahil edildiği ele alınmıştır. Ardından muhteva yönünden özen borcunun kapsamına ilişkin bir inceleme yapılmıştır. Hanefî kaynaklara göre icâre-i âdemî, vekalet ve istisna akitlerinden doğan borçların özen ile ifası bakımından ortaya çıkan yükümlülükler ile bunların akit sorumluluğuna etkisi araştırılmıştır. Bu çerçevede fıkhi bakış ile akitten doğan borçların ifasında özen anlamına gelen bir davranışın ne olabileceği, ne tür örneklendirmeler yapıldığı ve özen ile ifa kapsamındaki bir davranışın akit sorumluluğuna etkisinin ne olduğunun ortaya konulması hedeflenmiştir. Son olarak kavramın soyut yapısı itibariyle gündeme gelen meselelerinden“gereken özen”in akit sorumluluğu bağlamında ne olduğu ve nasıl belirlendiği sorusuna cevap aranmıştır. İş görme akitlerinden doğan borçların ifa edilmesinde borçlunun sorumlu olduğu özenin sınırlarını belirleyen faktörler, Hanefi kaynaklar üzerinden ele alınmıştır. Bütüncül olarak çalışma, özen borcunun temel meselelerine ilişkin fıkhi yorumun tespitine odaklanmaktadır."
