abstract: "İcmâ' konusu, İslam hukuk literatüründe uzun dönemler boyunca tartışılmıştır. İcmâın güncelliği, fonksiyonelliği, değişebilirliği, bir mesele üzerinde icmâ' edildikten sonra bu icmâın değişebilirliği, günümüz şartlarında icmâın mümkün olup olmadığı gibi birçok konu İslam âlimlerinin gündemini meşgul etmiştir. Bu çalışma İslam hukukunun ana kaynaklarından olan ve her dönemde önemini koruyan icmâ ile ilgili problermleri ele alarak bu problemlere çözüm üretebilmek ve bu konuda görüşleri hem kendi döneminde hem de kendinden sonraki dönemlerde oldukça etkili olan Şafiî mezhebinin önde gelen müctehidlerinden Gazzâlî (ö. 505/1111) ve Mâlikî mezhebinin önde gelen müctehidlerinden İbn Rüşd'ün (ö. 595/1198) icmâ' konusundaki görüşleri mukayese edilerek bu ihtilaflara cevap verilmiştir. Bu kapsamda hazırlanan çalışma üç bölümden oluşmaktadır. Birinci bölümünde; Gazzâlî ve İbn Rüşd'ün hayatları, eğitimleri, ilmi şahsiyetleri, eserleri hakkında bilgi verilmiştir. Ayrıca her iki müçtehidin fıkıh usulüne dair kaleme aldıkları eserler detaylı bir şekilde tanıtılmıştır. İkinci bölümde çalışmamızın ana konusu olan icmâ', icmâın manası ve kaynak oluşu, delil olarak ortaya çıkış süreci, oluşum imkânı, icmâın rükünleri ve kısımları, icmâ ile ilgili ihtilaflar ve bu ihtilaflara verilen cevaplar genel hatlarıyla ele alınmıştır. Son bölümde ise Gazzâlî ve İbn Rüşd'ün icmâa dair görüşleri mukayeseli bir şekilde ele alınmıştır."
