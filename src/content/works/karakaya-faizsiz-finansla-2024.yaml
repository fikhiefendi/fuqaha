abstract: "Faizsiz finans sektörünün hızla gelişmesi, birçok kurumun sektöre katılımını teşvik etmiş ve bu kurumların İslâmî prensiplere riayet etmelerini sağlayan fıkıh kurullarının sayısında artışa neden olmuştur. Farklı fıkıh kurullarının aldıkları çeşitli kararlar, sektörde birden fazla uygulamayı doğurmuştur. Bu farklılaşma, fıkıh kurullarının kararlarını ve dayanaklarını fıkıh perspektifinden incelemeyi gerekli kılmıştır. Bu çalışma, farklı ülkelerden otuz kadar fıkıh kurulunun on spesifik meseleye ilişkin kararlarını analiz ederek, ilgili kararların gerekçelerini, kurulların usullerini, klasik fıkıh ilmiyle kurulan bağın mahiyetini ortaya koymayı hedeflemektedir. Çalışmada, öncelikle on spesifik problem özelinde kurulların görüşleri ve dayanakları ortaya konulmuştur. İkinci aşamada, bu dayanakların klasik füru fıkıh ile ilgisi, bağlamsal temeli ve uygunluğu incelenmiştir. Son aşamada ise ikinci bölümde elde edilen veriler doğrultusunda, klasik fıkıh birikimiyle nasıl bir ilişki kurulduğu ve hangi usulün takip edildiği tespit edilmiştir. Fıkıh kurullarının genel olarak klasik fıkıh birikimiyle mezhep görüşlerini temel alarak bir ilişki kurduğu, ancak bu ilişkinin aksayan ve problemli yönlerinin olduğu gözlenmiştir. Bu yönlerin, kurulların tercih ettiği yaklaşımlar ve usullerden kaynaklanabileceği gibi, yasal düzenlemeler, piyasa kabulleri ve mevcut ihtiyaçların da etkili olduğu görülmektedir."
