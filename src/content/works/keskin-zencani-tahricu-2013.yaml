abstract: "Zencânî'nin hayatı ve Tahrîcü'l-fürû ale'l-usûl isimli eserinin konu edildiği bu çalışma üç bölümden oluşmaktadır. Birinci bölümde Zencânî'nin hayatı, ilmî şahsiyeti ve eserleri tanıtılmıştır. İkinci bölümde ise fıkıh edebiyatında ayrı bir türü oluşturan tahrîcü'l-fürû ale'l-usûl edebiyatına yer verilmiştir. Bu bölümde tahrîc kavramı, tahrîcü'l-fürû ale'l-usûl edebiyatının ilişkili olduğu kavâid, furûk, eşbah ve nezâir, hilaf ve cedel ilimleri tanıtılarak bu edebiyatta öne çıkan altı eser hakkında bilgi verilmiştir. Üçüncü bölüm ise Zencânî'nin Tahrîcü'l-fürû ale'l-usûl isimli eserine tahsis edilerek, eserin te'lif amacı ve ilgili edebiyat içerisindeki konumu hakkında değerlendirmelerde bulunulmuştur. Ayrıca bu bölümde Zencânî'nin eserinde zikrettiği asıllar ile bu asıllardan çıkarılan fürû örnekler sunulmuştur."
