abstract: "Bu çalışmada, Semerkant ve Irak Hanefi okullarının önde gelen temsilcilerinden olan Mâtürîdî (ö. 333/944) ve Cessâs'ın (ö. 370/981) ibadetlere dair ahkâm ayetleri yorumları incelenmektedir. Çalışmamız giriş, iki ana bölüm ve sonuç olmak üzere dört bölümden oluşmaktadır. Giriş bölümünde konunun kapsamı, önemi ve işleniş yöntemi ile Mâtürîdî ve Cessâs'ın fıkhî kişilikleri ve tefsirlerinin fıkhî özellikleri hakkında bilgi verilmektedir. Birinci bölümde Mâtürîdî ve Cessâs'ın bedeni ibadetler olarak adlandırılabilecek olan taharet, namaz ve oruç ile alakalı ahkâm ayetlerine yaptıkları yorumlar ve ayetlerden çıkardıkları hükümler mukayeseli olarak ele alınmaktadır. İkinci bölümde ise bu iki müfessirin malî yönüyle öne çıkan zekât, hac ve kurban ibadetlerine dair ahkâm ayetleri yorumları mukayeseli olarak incelenmektedir. İki fakihin görüşleri ele alınırken meselelerle alakalı mezhepler arasındaki ihtilaflı noktalara da değinilmekte, Mâtürîdî ve Cessâs'ın fıkhî yorumlarının fıkıh tarihinde hangi konumda olduğu da ortaya konmaktadır. Ayrıca çalışmamız Mâtürîdî'nin ahkâm ayetlerini tefsir ederken hükümlerin hikmetlerine dair yaptığı açıklamaları da kapsamaktadır. Sonuç bölümünde ise görüşlerini incelediğimiz iki Hanefî fakihin ahkâm ayeti yorumları arasındaki benzerlik ve farklılıklar değerlendirilmekte ve araştırmada elde edilen sonuçlar yer almaktadır."
