abstract: "İkrah, bir kimseyi tehdit etmek suretiyle rızası olmaksızın bir işi yapmaya, bir sözü söylemeye ya da bir şeyi yapmamaya haksız yere zorlamak anlamına gelmektedir. Bununla birlikte ikrahın kişilerin rızasını ortadan kaldıran, kasıt ve hür iradelerini etkileyen söz ve fiillerin sonuçlarına tesir eden bir muhtevaya sahip olduğuda aşikârdır. Bu çalışmada ilk önce Kâsânî'nin hayatı ve mühim eseri Bedâ'i'u's-sanâ'î' hakkında bilgiler verilmiş; ikinci bölümde ehliyet ve kısımları, ikrahın tanımı, unsurları, gerçekleşme şartları ve çeşitleri müstakil bir bölümde ele alınmıştır. Son bölümde ise ikrah neticesinde meydana gelen tasarrufların dünyevî ve uhrevî sonuçları irdelenmiştir. Kâsânî'nin ikrah düşüncesini ortaya koyabilmek amacıyla öncelikle hocası Alâüddin es- Semerkandî'nin (v. 537/1144) Tuhfetü'l-fukahâ' adlı eseri incelenmiştir. Daha sonra el-Mebsût'un müellifi Serahsî ve Reddü'l- Muhtâr'ın müellifi İbn Abidin başta olmak üzere farklı müelliflerin bakış açıları, Kâsânî'nin ikrah hakkındaki bakış açısı da dikkate alınarak eserler arasında karşılaştırmalar yapılmıştır. Yapılan değerlendirmeler sonucunda Kâsânî'nin ele aldığı meselelerde, birkaç istisna dışında Klasik Dönem Hanefî mezhebini müdafaa çabası içinde olduğu gözlemlenmiştir. Çalışmanın ilgili yerlerinde söz konusu bu benzerliklere ve farklılıklara ayrıca değinilmiştir. Bununla birlikte Kâsânî'nin kendisinden önceki âlimlerden etkilendiğini ifade etmekle birlikte yine kendisinden sonraki müellifleri etkilediğinide söylemek mümkündür. Tezin sonuç kısmında Kâsânî'nin ikrah düşüncesi sistematik bir şekilde özetlenerek çalışma sonuçladırılmıştır."
