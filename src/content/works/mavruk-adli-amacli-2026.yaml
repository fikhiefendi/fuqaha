abstract: "Feth-i Kabir (Mezar Açma) İşlemi, ölüm sonrası defin süreci tamamlanmış bir kişinin mezarının, hukuki veya bilimsel gerekçeler doğrultusunda yeniden açılarak ceset üzerinde inceleme yapılmasını ifade eden istisnai bir adli işlemdir. Bu işlem; ölüm sebebinin belirlenmesi, kimlik tespiti, delil elde edilmesi, DNA incelemesi yapılması ve maddi gerçeğin ortaya çıkarılması gibi amaçlarla uygulanmaktadır. Özellikle ceza muhakemesi hukuku bakımından önemli bir delil elde etme yöntemi olan mezar açma işlemi, aynı zamanda insan onuru, ölüye saygı, aile hayatının korunması ve dini-kültürel değerler bakımından da son derece hassas bir müdahale niteliği taşımaktadır. Bu çalışmada Mezar Açma İşlemi; kavramsal, hukuki, etik ve karşılaştırmalı hukuk boyutlarıyla incelenmiştir. İlk olarak defin, ölüm ve mezar kavramları ile ölüm sonrası bedenin hukuki statüsü değerlendirilmiş, ardından mezar açma işleminin amacı, uygulanma nedenleri ve hukuki niteliği ele alınmıştır. Çalışmanın temel inceleme alanını Türk hukuk sistemi oluşturmaktadır. Özellikle soruşturma ve kovuşturma aşamalarında işlemin uygulanışı, yetkili merciler ve usul kuralları incelenmiştir. Ayrıca Avrupa İnsan Hakları Sözleşmesi (20), Minnesota Protokolü (6), Cenevre Sözleşmeleri (22) ve Avrupa İnsan Hakları Mahkemesi içtihatları (21) çerçevesinde uluslararası hukuk ile karşılaştırmalı değerlendirmeler yapılmıştır. Çalışmada ayrıca mezar açma işleminin etik boyutu ile Türk hukukunda konuya ilişkin yüksek yargı kararları incelenmiştir. Yapılan değerlendirmeler sonucunda, Türk hukukunda Mezar Açma işlemine ilişkin açık ve sistematik bir düzenlemenin bulunmadığı, uygulamanın büyük ölçüde yargı içtihatları ve ceza muhakemesi ilkeleri doğrultusunda şekillendiği tespit edilmiştir. Sonuç olarak çalışma, Mezar Açma işleminin yalnızca teknik bir adli işlem olmadığını; insan hakları, etik ilkeler ve toplumsal değerlerle doğrudan ilişkili çok boyutlu bir hukuki kurum olduğunu ortaya koymaktadır. Bu bağlamda konuya ilişkin normatif düzenlemelerin güçlendirilmesi ve insan hakları temelli yaklaşımın geliştirilmesi gerektiği sonucuna ulaşılmıştır."
