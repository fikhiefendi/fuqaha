abstract: "Bu tezde siyâset-i şer'iyye kavramının mahiyeti, Hanefî mezhebi uygulaması üzerinden belirlenmeye çalışılmıştır. Hanefî mezhebinde genellikle siyaset şeklindeki yalın hali kullanılan siyâset-i şer'iyye kavramının, Hanefî metinlerindeki kullanım örnekleri üzerinden nasıl bir manaya geldiği, çerçevesi ve onu var eden amillerin tespiti amaçlanmıştır. Siyasetin fürû-ı fıkıhta nasıl bir yer bulduğu, hangi anlamlarda kullanıldığı, kavramlaşma sürecinin nasıl gerçekleştiği ve herhangi bir anlam değişimine uğrayıp uğramadığı gibi hususlara odaklanmak ve buradan hareketle Hanefî fürû' geleneğinde nasıl bir siyâset-i şer'iyye anlayışının olduğunu belirlemek tezin temel hedefleri arasındadır. Kavramın genellikle, Hanefî mezhebinin bir meselede asıl olan görüşüne aykırı duran hâs, şâz veya genel olarak âhâd nitelikteki rivayetlerin te'vili ve bunların Hanefî mezhep sistematiğine aykırı yönlerini anlamlandırma bağlamında kullanıldığı belirlenmiştir. Özellikle Hz. Peygamber'in ve Râşid Halifelerin Hanefî mezhep imamlarınca makbul olmayan uygulamaları, siyaset kavramı ile meşru çerçevenin içine dahil edilmiştir. Belli bir aşamadan sonra ta'zîr kavramı ile müradif kullanılmaya başlanan siyâset-i şer'iyye kavramı, ağırlıklı olarak ceza hukuku alanında siyasal otorite tarafından“re'sen ceza ihdâsı”ve mevcut“cezaların ağırlaştırılması”bağlamında kullanılmıştır. Siyaset kavramı bazı cezalar hakkında devlet başkanından“imamın takdir hakkı”bağlamında sadır olan“içtihadlar”şeklinde de anlaşılabilmiştir. Nitekim Hanefî mezhep sistematiğine aykırı rivayetlerin uygulanmama nedeni açıklanırken, bu rivayetlerde yer alan uygulamaların içtihad mahsulü olduğu, siyaset kavramı kullanılarak dile getirilmektedir. Kavramın mahiyetine dair tanımlamalarda bulunan fakihler bu özel kullanımı dikkate alarak daha dar çerçeveli tarifler yapmışlardır. Elbette kümülatif bir okuma neticesinde kavramın ağırlıklı olarak ceza hukuku alanına hasredildiği, bu alanda da ta'zîr kavramının eşdeğeri görüldüğü inkâr edilemez bir gerçektir. Ancak terim olarak siyaset kavramının ta'zîr ile ne kadar aynı olduğu hususu tartışmalı bir mevzudur. Zira ta'zîr cezasına dair en önemli ilke olan had cezasına ulaşmama kriterinin, siyaset olarak isimlendirilen uygulamalara bakıldığında geçerli olmadığı görülmüştür."
