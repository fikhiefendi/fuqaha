abstract: "ÖZET İslâm hukukçuları, Batı'dan yüzyıllar önce ve“Milletlerarası Hukuk”üzerinde hassasiyetle durmuş, Kur'an ayetleri ve Hz. Peygamber'in uygulamaları etrafında çeşitli projeler ve görüşler sunmuşlar, müstakil eserler vermişlerdir. Müslümanlarla gayri müslimler arasındaki olağan ilişkinin savaş veya barış olması konusunda İslam hukukçularının düştüğü ihtilaf, milletlerarası hukukun en önemli kavram ve konularından biri olarak karşımıza çıkan antlaşmaların İslam hukukundaki meşruiyetini ve yerini derinden etkilemiştir. Her vesileyle barışa çağrıda bulunduğu, bozgunculuğa, kaosa, vahşete karşı çıktığı Kur'an ve Hz. Peygamber'in uygulamalarıyla net biçimde görülen İslâm'ın milletlerarası ilişkiler kuramında, savaş ve çatışma halinin karşıtı olarak antlaşmaya biçtiği rol ve buna bağlı olarak, yapılan antlaşmaların herhangi bir süreyle sınırlı olup olmadığı, müslümanların hangi şartlarla antlaşma yapabilecekleri ve antlaşmaları terk edebilecekleri hakkında görüşler ileri sürülmüştür. İslâm, çatışmayı körükleyen, savaşı hayat gayesi edinen, büyük bir hızla yayılmasını şiddete borçlu olan, antlaşma ve antlaşmak olmak konusunda katı bir tutum izleyen bir din değil, insanın huzuru ve yeryüzünün ıslahı yolunda savaşı ve barışı hayatın gerçekleri kabul eden, ama anlaşıldığı üzere barışı şiddete tercih eden ve antlaşmak olma hali konusunda ufku geniş bir yapıdır. İslâm dini savaşın, şiddetin, çatışmanın varlığını ve kaçınılmazlığını göz ardı etmemiş ve alınması gereken önlem, izelenmesi gereken kuralları ortaya koymuş, barışı da olağan dışı bir durum olarak nitelememiş, mensuplarına İslâm'ın ruhu ve temel değerlerine sadık kalmak, İslam'ın ve müslümanların maslahatını gözetmek kaydıyla antlaşmalar yapmak konusunda büyük bir serbesti tanımıştır. Buna göre müslümanların yaşadıkları çağın şartlarını, temin edilecek maslahatları, bunun yanında medeniyetlerinin huzur, gelişme ve barışa olan ihtiyacını dikkate alarak antlaşmalar yapmalarının son derece olağan ve hatta gerekli bir durum olduğuna inanıyoruz."
