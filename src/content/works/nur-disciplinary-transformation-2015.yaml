abstract: "Yaklaşık son elli yıl içerisinde yeni bilgi sosyolojisi çerçevesinde yürütülen kapsamlı ampirik araştırmalar sonucu ortaya çıkan çeşitli teorik yaklaşımlar geç dönem Osmanlı İmparatorluğu'nun baş döndürücü tarihsel süreçlerini ilgili tarihyazımına çok uzun süredir hakim olagelen tözcü, teleolojik ve dikotomist perspektiflerden sıyrılarak açıklayabilmek için elverişli bakış açıları sunma imkanı taşıyor. Yeni bilgi sosyolojisi literatürüne bir katkı olarak tasarlanan bu tez, Osmanlı İmparatorluğu'nda fıkıh-hukuk eğitiminin 1826-1926 yılları arasındaki disipliner dönüşümünün esas olarak ikincil literatüre dayalı tarihsel-sosyolojik bir açıklamasını yapmaya çalışmaktadır. Açıklayıcı araçlarını büyük ölçüde Abbott'un bağlı ekolojiler/etkileşim alanları teorisinden ve kısmen Bourdieu'nün modern devletin oluşumuna dair analizlerinden devşiren bu çalışma, ilk olarak Osmanlı fıkıh-hukuk eğitiminin son dönemdeki dönüşümlerinin tarihsel arkaplanını oluşturması itibariyle Osmanlı yükseköğretim ekolojisinin ondokuzuncu yüzyıla kadarki oluşumlarının yapısal bir analizini sunmaktadır. Ardından da Osmanlı fıkıh-hukuk eğitiminin 1826'dan 1926'ya kadarki disipliner dönüşümünün tarihsel imkan koşullarını analiz etmektedir. Tezin iki temel çıkarımı vardır. Birinci çıkarıma göre; Osmanlı fıkıh-hukuk eğitiminin 1826-1926 arasındaki disipliner dönüşümü modern devlet oluşumu sürecinin farklı cihetlerini teşkil eden ve çeşitli kolektif aktörler arasında cereyan eden mücadele süreçlerinin bir sonucu olarak gerçekleşmiştir. Sözkonusu mücadele süreçleri bürokratik ekoloji, yükseköğretim ekolojisi ve adli ekolojinin kesişiminde oluşan bir etkileşim alanı içerisinde vuku bulmuştur. İkinci çıkarıma göre; on dokuzuncu yüzyıldan itibaren yeni ortaya çıkan kolektif aktörlerin (Maarif Nezareti, Mekteb-i Hukuk, Darülfünun vesaire) varolagelen kolektif aktörlerin (Meşihat, medrese sistemi vesaire) aleyhine olarak modern devlet oluşumu süreci boyunca mezkur etkileşim alanı içerisinde biriktirdikleri gittikçe artan sembolik iktidar miktarı hukuk disiplininin eğitim müfredatı mekanındaki akademik yerleşim alanının fıkıh disiplininkini daraltacak şekilde genişlemesini ve böylece Osmanlı fıkıh-hukuk eğitiminin fıkıh merkezli bir disipliner yapıdan hukuk merkezli bir disipliner yapıya doğru dönüşmesini mümkün kılmıştır."
