abstract: "2004 yılında Basel II Standartlarının yayınlanmasıyla birlikte birçok Avrupa ülkesinde faaliyet gösteren bankalar bu standartlara uyum konusunda yoğun çalışmalar gerçekleştirmişlerdir. 2006 yılında bankaların Basel II standartlarına uyma zorunluluğu AB müktesebatına dahil edilmesiyle, AB'ye üyelik yolunda olan ülkeler için bu standartlara uyum zorunlu hale gelmiştir. Temel amacı bankaları krizlere karşı daha dirençli hale getirmek olarak ifade edilen Basel II standartlarına uyum konusu, Türkiye'de yasal, siyasi ve ekonomik birçok nedenden dolayı tartışılmış ve ilk başta 2008 yılında uygulanması planlanan standartlar belirtilmeyen bir süreye ertelenmiştir. Fakat AB üyeliği konusunda çalışmaları devam eden Türkiye'nin Basel II standartlarına uyum çalışmalarına hız kesmeden devam edeceği belirtilmiştir. Her ne kadar Basel II standartlarında asgari sermaye yeterlilik hesaplamaları öne çıksa da, Basel II standartları etkileri geniş ve derin olan standartlardır. Türkiye açısından bakıldığında kredilendirmedeki yöntem ve süreç değişikliği büyük önem arz etmektedir. Basel II standardıyla birlikte kredilendirmede firma için verilen derecelendirme (rating) notu, kredi limitinin tespit edilmesinde, kredi fiyatlamasında ve teminat yapısının belirlenmesinde ana faktör olarak kabul edilecektir. Günümüzde kredilendirme ise bankalarca yapılan mali tahlil ve istihbarat (MTİ) çalışmalarına göre yapılmakta olup, bu çalışmaların bankacılık sektörü açısından önemi, Basel II standartlarına uyumu ve MTİ çalışanlarının derecelendirme sistemine bakış açılarına ilişkin literatürde fazla kaynak bulunmamaktadır. Bu çalışmayla; bankacılık sektörünün üzerinde durduğu en hassas faaliyetlerden biri olan kredilendirme sürecinin MTİ çalışmaları ve bu çalışmaların temel dayanakları incelenmiş ve bu sürecin Basel II standartlarının sonucu olan derecelendirme sistemine uyumu tartışılmıştır.Bu bağlamda Türkiye'de faaliyet gösteren 4 katılım bankasının 83 MTİ uzmanına anket uygulanmıştır. Sonuçlara göre; MTİ çalışmalarıyla, Basel II standartlarının yapılmasını ön gördüğü uygulamalar arasında temel farlılıklar olmadığı, hem Basel II standartlarının önerdiği derecelendirme sisteminde hem de mali tahlil çalışmalarında firmaların kredi değerliliğini belirleyen ana faktörün firma mali verileri olduğu tespit edilmiştir. Bunun yanında firma mali verilerine olan güvenin az olduğu, bu nedenle derecelendirme sistemine olan güvenin de düşük olduğu görülmüştür. Basel II standartlarına uyum konusunda eğitim alan personelin az olduğu ve alınan eğitimin personelin tamamını tatmin etmediği tespit edilmiştir. Sonuç kısmında; yapılan bu çalışmanın bulgularından bahsedilmiş ve önerilerde bulunularak literatüre katkı sağlanmaya çalışılmıştır."
