abstract: "Uluslararası muhasebe standartları, genel olarak şirketlerin, özelde ise bankaların mali tablolarını hazırlarken çalışmalarını düzenleyen en önemli standartlardan biri olarak kabul edilmektedir. Özellikle Filistin'deki İslami bankalar, finansal tablolarını uluslararası muhasebe standartlarına, özellikle de İslami bankaların Filistin'de uyguladıkları en önemli sözleşmelerden biri olarak kabul edilen finansal kiralamasına ilişkin (16) numaralı Muhasebe Standardına göre hazırlamakla yükümlüdürler.Standardın uygulanması çeşitli zorluklara sahipti ve bu araştırmanın incelemeyi amaçladığı Filistin'deki İslami bankalar üzerindeki etkilerini bıraktı. Standardı uygulamanın zorlukları ve Filistin'deki İslami bankalar üzerindeki etkileri hakkındaki görüşlerini bilir.Araştırmanın en önemli bulgularından biri, genel olarak uluslararası muhasebe standartlarının ve finansal kiralama için (16) numaralı uluslararası muhasebe standardının uygulanmasında, İslami bankaların her iki mevzuata uygun olarak çifte finansal tablo düzenlemesi de dahil olmak üzere bazı zorlukların varlığıdır. Al-Aoufi tarafından yayınlanan ve raporlamada heterojenliğe yol açan uluslararası standartlar ve standartlar Ek olarak, İslami bankaların faaliyetlerinin geleneksel bankalardan farklı olması nedeniyle uluslararası muhasebe standartlarının İslami bankacılığın incelikli yönlerini ele alma ve anlama konusundaki yetersizliği.Bankaların (16) sayılı Uluslararası Muhasebe Standardını kiralara uygularken karşılaştıkları en önemli zorluklardan biri, kiralama süresinin belirsiz olması ve standardın kiralama sözleşmesini ele almaması durumunda iskonto oranının ve beklenen sürenin belirlenmesidir. sahipliği ile sona erer. (16) kriterinin uygulanmasının banka üzerindeki etkilerine gelince, uzmanlar kriterin uygulanmasının kiraya veren olarak bankayı etkilemediğini, kiracı olarak banka üzerindeki etkisine gelince; banka aktiflerindeki artış ve kira giderlerinin varsayımsal mali dönemlere eşitsiz bir şekilde dağıtılması açısından olumsuz etkiler. Araştırma, diğer muhasebe standartlarının İslami bankalar üzerindeki etkilerini incelemek için başka araştırmalar yapılmasını tavsiye etti."
