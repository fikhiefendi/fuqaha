abstract: "Tasavvuf, bazı amellerden meydana gelen bilinç hâlidir. Kalbi uyanıklığı yakalamaya çalışan mutasavvıflar tarafından maksada ulaşılmak adına belirli metotlar geliştirilmiştir. Bu yolların başında her zaman rehberler olmuştur. Rehberlik yapan bu zatlar Müslümanların hüsn-i zannında Allah'ın velileri olarak kabul görmüştür. Velâyet makamında bulunan kimselerde ise zaman ve mekâna has olmadan insanların akıllarının almayacağı harikulade olaylar cereyan etmiştir. Bu harikulade olayların peygamberlik iddia etmeyen ve Peygamber Efendimizin (s.a.v.) getirdiği şeriatın zahirine ve onun sünnetine tam anlamıyla mutabaat eden kişiden zuhur etmesi durumunda bu gibi harikulade olaylar keramet olarak adlandırılmıştır. Ancak bazen bu harikulade olaylar istismar edilmiş, şeriatın zahirine uygun düşen keramet çerçevesinden çıkartılarak sanki tesirin ve kudretin velinin elinde olduğunu ifade eden cümlelerle anlatılmıştır. Bu anlatımlar elbette bahsi geçen velilerin aleyhinde propaganda yapmaya çalışan kişilerin en büyük kozları haline gelmiştir. Mevlânâ Hâlid el-Bağdâdî, Şam halkı arasında ve sair vilayetlerde velâyetine halkın şahit olduğu bir zattır. Ancak anlatılan bazı olağan üstü olaylardan dolayı kendisine kin ve hırs besleyen Abdulvehhâb es-Sûsî adındaki eski halifesi Mevlânâ Hâlid'i bu olayları delil göstererek küfürle itham etmiştir. İbn Âbidîn ise Mevlânâ Hâlid'i ilmi olarak savunmak adına Sûsî'nin iddiasında yer alan bütün önermeleri detaylı bir şekilde din âlimlerinin sözleriyle tartmıştır. İddia edilen olayların başında cinlerle irtibat kurmak, sihir yapmak, gaybî bilgilere vakıf olmak gibi itikadi anlamda önemli konular gelmektedir. İhtilaflı olan konuları da zikretmekten çekinmeyen İbn Âbidîn kendi iddiasını destekler nitelikte olan meseleleri dahi haksız bulduysa eleştirmiştir. Bu konuları hem fıkıh âlimleri nazarından hem de kelam âlimleri nazarından inceleyen İbn Âbidîn zikredilen konuların keramet yoluyla Allah'ın veli kullarında görülebileceğini açıkça anlatmış ve âlimlerin de bu konulardaki ittifakını zikretmiştir. Özellikle tasavvuf ilmi ile sair ilim dalları arasında uzun zamandır karşılıklı münazaraların olduğu bilinmektedir. Buna binaen İbn Âbidîn'in yapmış olduğu savunma metodu dikkat çekmiştir. Çünkü İbn Âbidîn tasavvufun itiraz edilen meselelerine fıkıh ilmi ve kelam ilmi çerçevesinde cevaplar vermiştir. Bu çalışmanın temelini de İbn Âbidîn'in yapmış olduğu savunma metodu oluşturmaktadır. Tezde İbn Âbidîn'in vermiş olduğu cevaplar incelenmiş ve zahiri ilimlerle tasavvuf alanındaki harikulade olaylara bakış açısı değerlendirilmiştir. Konuyla alakalı İbn Âbidîn'in cevaplarının ne kadar tutarlı olduğu da tartışılmıştır."
