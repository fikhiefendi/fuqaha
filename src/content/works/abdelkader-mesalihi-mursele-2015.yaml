abstract: "Biz bu tezimizde ilim talebesinin önem vermesi gereken şeriatın en önemli bablarından iki bab olan Şer'î siyâset ve fıkıh üsûlü münasebetini inceledik. Tezimizde, özellikle fitnenin çoğaldığı, devletlerin ayrıştığı, kanların aktığı, cemiyetlerin çoğalıp her birisinin hak üzerinde olduğunu iddia ettiği günümüzde ümmetin en çok ihtiyaç duyduğu maslahat-ı mürsele ve Şer'î siyâsette uygulaması konusunu ele aldık. Tezimiz bir giriş ve dört bölümden oluşmaktadır. Giriş bölümünde genel olarak maslahatın, kısımlarını, İslâm şeriatının ona nasıl önem verdiğini ve İslâm'ın beşeriyetin dünya ve ahiret mutluluğu için geldiği hususunu şüpheye mahal kalmayacak şekilde ele aldık.Birinci bölümde maslahat-ı mürsele ile maslahat-ı ammenin farkını eski ve yeni âlimlerin maslahat-ı mürsele konusundaki ihtilaf ve tartışmalarını, onunla amel etmenin sıhhatini, mezheplerin bu konudaki tartışmalarını ve onunla müstakil bir delil gibi amel etmenin mezheplerin neş'etinden önce sahâbe ve tabiin döneminden itibaren var olduğunu izah ettik. İkinci bölümde ise, Şer'î siyâsetin tarifi İslâm siyâsî fıkhının özelliklerini, delillerini, maslahat fıkhını, Şer'î siyâsette maslahat-ı mürselenin tatbikini inceledik.Üçüncü bölümde ise sahâbe, tabiin ve etbâ-ı tabiinin Şer'î siyâsette maslahat-ı mürsele ile amel etmesini örnekleri ile ve Hz. Ebubekir döneminden Ömer b. Abdulaziz'e kadarki dönemde onunla amel etmelerini ve siyâsî konularda ve ümmetin siyâsî yönüyle alakalı fetvalarda uygulayış biçimini ele aldık. Dördüncü bölümde ise çağdaş siyâset ile ilgili özellikle devlet başkanı seçimi, değiştirilmesi şura ve maslahat-ı mürsele ile ilgisini ele aldık. Sonuç bölümünde ise araştırmamız boyunca elde ettiğimiz bazı önemli sonuçları ve Şer'î siyâsetimizin devam etmesi ve dinimizle bağının te'sisi için maslahat-ı mürseleyi ve işlerimizle bağlantısının ehemmiyeti üzerinde durduk."
