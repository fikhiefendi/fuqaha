abstract: "Nehir ve göllerde küçük kayıklarla başlayan ticari girişimler, daha büyük ve dayanıklı gemilerin inşasıyla denizlere taşınmıştır. Deniz taşımacılığında meydana gelen hasarların kim tarafından yüklenileceği üzerinde ve geleneksel uygulamalarla gelişmeye başlayan deniz ticaret hukuku, ilerleyen dönemde taşıma sözleşmeleri ve sigorta gibi konularda da çeşitli normların ortaya koyulduğu bir alana dönüşmüştür. Denizci beylikleri sınırlarına katması ile başlayan Osmanlı denizciliği, başta askeri amaçlara hizmet etmiş, zamanla genişleyen sınırları ile ticari anlamda da ciddi bir yol kat etmiştir. İstanbul'un fethi ile Avrupa deniz ticaretinde önemli bir ticari pazarı ele geçiren Osmanlı Devleti, sonrasında Karadeniz ve Akdeniz'deki egemen güç olmuştur. Genişleyen egemenlik alanında, Osmanlı deniz yük taşımacılığı önem kazanmıştır. Bu kapsamda karşımıza gemi kira sözleşmeleri çıkmaktadır. Osmanlı uygulamasında gemi kira sözleşmelerinin şekli ve hükmi esaslarının gelişimini iki döneme ayrılarak incelemek mümkündür. Klasik dönemde şer'i hukuk ve kapitülasyon hükümlerine göre esasları belirlenen gemi kira sözleşmeleri, Tanzimat sonrasında çıkartılan Ticaret-i Bahriye-i Kanunname-i Humâyûn'da navlun sözleşmesi başlığı altında düzenlenmiştir. Çalışmanın amacı klasik dönemde ve Tanzimat sonrasında Osmanlı deniz ticareti hukukunda gemi kira sözleşmelerinin esaslarını ortaya koymaktır. Bu kapsamda İstanbul kadı sicillerinde kayıtlı sözleşme hükümlerinin şer'i hukuk esaslarına uygunluğu irdelenmiş, Ticaret-i Bahriye-i Kanunname-i Humâyûn ve tamamlayıcısı Mecelle hükümleri özelinde gemi kirasının hukuki gelişimi ele alınmıştır."
