abstract: "Günümüz dünyasında hemen hemen tüm alanlarda olduğu gibi finansal piyasalar üzerinde de hızlı değişimler ve dönüşümler yaşanabilmektedir. Özellikle finansal alanda yaşanan teknolojik gelişmelerle birlikte finansal varlıklara daha kolay yatırım yapılabilmektedir. Finansal varlıkların fiyatlarında meydana gelen dalgalanmalar birtakım riskleri de beraberinde getirmektedir. Başlangıçta risklerden korunmak amacıyla ortaya çıkan türev piyasalar günümüzde daha çok spekülasyon amacıyla kullanılmaktadır. Dünya'da yaygın olarak kullanılan türev ürünlerin özellikle Türk bankacılık sektöründe de kullanımının son yıllarda yaygınlaşması nedeniyle bu tezde türev ürünlerin bankaların kârlılıkları üzerindeki etkisinin araştırılması amaçlanmıştır. Türk bankacılık sektöründe de yaygın olarak kullanılan türev ürünlerin 2005Q4-2020Q4 dönemleri için bankaların aktif kârlılığı, özkaynak kârlılığı ve net faiz marjı üzerindeki etkileri Vektör Otoregresif (VAR) Modeli kullanılarak incelenmiş ve mevduat bankaları ve katılım bankaları ayrı ayrı analiz edilmiştir. VAR modeli bulgularına göre; mevduat bankalarının türev araç kullanımında meydana gelen 1 standart hatalı şok karşısında net faiz marjının anlamlı tepkiler verdiği görülürken, katılım bankalarının türev ürün kullanımında ise özkaynak kârlılığının anlamlı tepkiler verdiği görülmüştür. Mevduat ve katılım bankalarının varyans ayrıştırması analizinde mevduat bankalarının türev ürün kullanımının sırasıyla en fazla net faiz marjı, daha sonra aktif kârlılığı ve özkaynak kârlılığı üzerinde etkisi olduğu görülürken, katılım bankalarında ise türev ürün kullanımının en fazla özkaynak kârlılığı üzerinde etkisi olduğu görülmüştür. Ayrıca yapılan Toda-Yamamato nedensellik testi ile katılım bankalarında türev ürün kullanımı ile özkaynak kârlılığı arasında çift yönlü bir ilişkinin olduğu tespit edilmiştir."
