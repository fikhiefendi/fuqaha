abstract: "İslam Borçlar Hukuku sahasının temel konusu olan akitlerin kuruluşunda irade beyanı esastır. Bu beyanın iç irade olarak da ifade edilen rızaya uygun olması gerekmektedir. Tarafların karşılıklı rızalarının bulunması, irade beyanının sıhhati açısından önem arz etmekte olup akitlerin bağlayıcılığının da ön şartı olmaktadır. Dolayısıyla ikrah, hata ve hile gibi rızayı sakatlayan durumlarda, irade beyanı kusurlu kabul edildiğinden akitlerin bağlayıcılığı da zarar görmektedir. Bu çalışmada, irade bozukluklarından biri olarak kabul edilen hilenin bir fıkıh terimi olarak Hanefî doktrinindeki tarifi, çeşitleri ve akitler üzerindeki tesiri incelenmektedir. Böylece, mezhep içerisindeki farklı görüşlere de temas etmek suretiyle, hile kavramının teorik çerçevesinin çizilmesi hedeflenmiştir. Hilenin teorik boyutu ele alındıktan sonra, Hanefî mezhebinin resmî mezhep olarak kabul edildiği Osmanlı Devleti'nde, hilenin uygulamada nasıl sonuçlarının olduğunu ve teoriyle pratiğin örtüşüp örtüşmediğini görmek amacıyla XVII. yüzyıldaki veriler incelenmiştir. İlgili döneme ait fetva mecmuaları ve şer'iyye sicilleri bu noktada çalışmaya büyük katkı sağlamıştır."
