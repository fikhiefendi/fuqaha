abstract: "Bu ÇalıĢma H.1264-1266/M.1848-1850 yılları arasını ihtiva eden 293 Numaralı Tarsus ġer„iyye Sicili‟nin incelenmesinden oluĢmaktadır. 293 Numaralı Tarsus ġer„iyye Sicili Osmanlıca metninin günümüz Türkçesine çevrilmesinde metne sadık kalındı, kelimeler değiĢtirilmeksizin cümle kuruluĢları aynı Ģekilde verildi. Ana metin basit transkribe tekniği ile okundu. Metinde geçen Farsça, Arapça, Türkçe sıfat ve tamlamalar bu dillerin gramer kurallarına göre yazıldı. Osmanlıca metinde geçen, ayın harfi: („) iĢareti, hemze (elif) harfi: (‟) iĢareti, uzun a: â harfi, uzun i: î harfi, uzun u: û harfi ile yazıldı. Sicilde geçen 108 belgenin tamamının transkripsiyonu yapılarak değerlendirildi. Belgede yer alan hükümlerin özeti tablo halinde verildi. ÇalıĢmamızın özet tablosu, defter hakkındaki bütün sorulara cevap verebilecek niteliktedir. Sicilde; verâset, vesâyet, mihir-boĢanma, tereke taksimleri gibi konular yer almaktadır.ġer„iyye sicilleri kaydedildiği dönem hakkındaki en orijinal bilgileri içermektedir. Bu bilgiler ıĢığında dönemin sosyal, idarî, hukukî, iktisadî ve kültürel yapısı hakkında bilgilere ulaĢmak mümkündür. Bu amaç doğrultusunda sicilde yer alan yer isimleri, devlet görevlilerinin isimleri, askerî görevlilerin isimleri birer birer tespit edildi. Yine sicilde geçen camii, medrese ve diğer dinî yapıların birer birer tespiti yapıldı. Sicilde dönemin soysal yapısı hakkında bilgiler verildi. Dönemin giyim-kuĢamı ve kullanılan eĢyaların tespiti yapıldı. Yine dönemin iktisadî yapısı hakkında genel bilgiler verilip meslek grupları, çarĢıları, dükkânları, esnaf grupları, iskeleleri tespit edildi. Ayrıca dönemin eĢya fiyatları ve hayvan fiyatlarına ulaĢıldı."
