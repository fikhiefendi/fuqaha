abstract: "İnsani ilişkiler ve siyaset alanında vuku bulan muhalefet olgusu insanlık tarihi kadar köklü bir geçmişe sahiptir. Hukuk alanında görüşleri değer bulanlar, bu alana ait görüşler de ortaya koymuşlardır. Ebu Hanife de bunlardan birisidir. İslam hukukunda siyasi muhalefet alanında sıklıkla adı zikredilen Ebû Hanîfe, hakkında birbiriyle çelişir gibi görünen farklı düşüncelerin ortaya konduğu, sahip olduğu görüşleri türlü taraflar ve gruplar arasında haklılıklarının ispatı için kullanılmaya çalışılmış bir kimsedir. Hakkında ortaya atılan bu farklı görüşler ve söylemler arasında bir uzlaşıya gitmek ise gerekli bir durum halini almıştır. Özellikle de onun muhalif tutumlarının değerlendirilmesi sırasında ortaya çıkan ihtilafları mümkün oldukça uzlaştırmak, onun doğru tanınabilmesi için önemlidir. Bu çalışma içerisinde bu düşünceyle hareket edilmeye çalışılırken, mümkün olduğu kadar ona nispet edilen eserlerden faydalanılacak, ilk kaynaklardan beslenmeye çalışılacak ve kendisine nispet olunan eserlerde siyasi tutumlarının sebeplerini açıklar şeklinde olan ve kendisine nispet olunan görüş ve söylemler değerlendirmelere tabi tutulacaktır.. Ebû Hanîfe'nin, hem ahlaki hem de fıtrî olarak sahip olduğu kişiliği ve duruşu, siyasetteki tutumlarına yansımış ve belirleyici rol oynamıştır. Olaylar salt bir siyasi çekişme şeklinde gerçekleşmeyip, iç ve dış etkenlerin olaylara yön vermesi şeklinde gerçekleşmiştir. Ebû Hanîfe çevresinde gerçekleşen olaylar fıkhî bir kimliğe sahip olduğu gibi, fıkıhtan bağımsız, kişisel etkilerin de şekillendirdiği olaylar olmuştur. Kişisel ve sosyal etkenler, olayları aynı oranda şekillendirmiştir. Ebû Hanîfe etrafında gelişen ve sahip olduğu siyasi görüşünü yansıtan olaylar ne kadar tarafsız ve derinlikli tahlil edilebilirse, Ebû Hanîfe'nin siyasete ve siyasi muhalefete olan yaklaşım tarzı da o kadar net ortaya çıkarılabilecektir."
