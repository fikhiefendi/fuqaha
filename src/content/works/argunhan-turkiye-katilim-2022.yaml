abstract: "Ülke ekonomilerinde sağlıklı gelişmeler için bankacılık sektörünün etkin ve verimli bir şekilde faaliyetlerde bulunması gerekir. Bankalar kârlı ve krizden az etkilenecek şekilde önlemler alırlarsa daha etkin ve verimli olur. Bu çalışmada; bankacılık ve katılım bankacılığı kavramlarına, bu kavramların içerik ve ayrıntıları inceledikten sonra Türk bankacılık sisteminde faaliyet gösteren beş katılım bankası ile sekiz özel sermayeli mevduat bankası olmak üzere toplam on üç bankanın finansal performansları ölçülmüştür. Çalışmada kullanılan bu ölçüm 2016-2020 yılları arasındaki veriler kullanılarak yapılmıştır. Çalışmanın analizi yapılırken öncelikle katılım bankaları ve özel sermayeli mevduat bankalarının gelir tablolarından ve bilançolarından veriler elde edilmiştir. Bu veriler çalışmanın analizinde kullanılacak oranların analizi için gereklidir. Analizde kullanılan oranlar; aktif kârlılığı, öz kaynak kârlılığı, öz kaynaklar/toplam aktif, net kâr payı geliri/toplam aktif, VÖK/pasif toplamı, takipteki krediler/toplam krediler, toplam krediler/toplam aktiftir. Bu oranlar elde edildikten sonra Topsis Yöntemi ile finansal performans puanları hesaplanmış ve sonuçlar elde edilmiştir. Analiz sonuçları incelendiğinde finansal performansı en yüksek çıkan banka özel sermayeli mevduat bankalarından Akbank'tır. Katılım bankaları yıllar içerisinde finansal performans olarak değişiklik göstermektedir. Finansal performansı en düşük olan özel sermayeli mevduat bankası ise Turkish Bank'tır. Tüm bankaları incelediğimizde; özel sermayeli mevduat bankalarının katılım bankalarından daha yüksek performans puanlarına ulaştıkları ve kârlılık oranlarının daha yüksek olduğu sonucuna ulaşılmaktadır."
