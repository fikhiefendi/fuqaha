abstract: "Bu çalışmada, Hanefî fıkıh doktrininde özellikle aile hukukuna ilişkin düzenlemelerde ihtiyat prensibinin nasıl ve ne şekilde işletildiğinin ortaya konulması amaçlanmaktadır. İslâm hukuk düşüncesinde ihtiyat, kendisine sıkça atıf yapılan bir delil konumundadır. Özellikle Hanefî hukukçuların aile hukukuna ilişkin birçok düzenlemede çeşitli argümanların yanında ihtiyat ilkesine dayanması, bu prensibe doktrinde hatırı sayılır bir yer verildiğine hatta müstakil bir delil gibi itibar edildiğine ilişkin tezi gündeme getirmektedir. Söz konusu tezin değerlendirilebilmesi, bir başka açıdan ihtiyatın teorideki konumunu irdelemeyi zorunlu hale getirmektedir. Pratikteki yoğun kullanımına karşın ihtiyat, teoride müstakil bir delil olarak ele alınmamıştır. Fakat usûl bilginleri tarafından ihtiyat; sedd-i zerâiʽ, istihsan, mürâât-i hilâf gibi fer'î delillerle bağlantılı görülmüş; hatta bir anlamda ihtiyatın onlarla aynı mânada veya onların gerekçesi olarak kullanıldığı ileri sürülmüştür. Buna göre her ne kadar kendisine müstakil bir başlık açılmasa da ihtiyat, usûl-i fıkıhta da haklı bir rolü üstlenmiştir. Esâsen Hanefî doktrininde aile hukuku alanınına ilişkin düzenlemelerde işletilen ihtiyat ilkesinin konumu da usûldeki bu tabloya benzer şekillenmiştir. Zira zikri geçen alandaki düzenlemelerde ihtiyat, bazen istihsanın gerekçesi bazen de sedd-i zerâiʽnin bir başka bakış açısı olarak yorumlanmıştır. Son olarak belirtilmelidir ki ihtiyatın gerek teori gerekse de pratikte sahip olduğu konum ve üstlendiği işlev, temelinde“şüphe/belirsizlik”olgusunun bulunduğunu göstermektedir. Şüphe/belirsizlik ise farklı zaman ve mekânlarda şartların değişmesi ve olayların farklı nitelik kazanması durumunda, kısmen veya tamamen ortadan kalkabileceği gibi yeniden gündeme gelebilecek bir olgudur. Buna göre klâsik fıkıh literatüründeki birçok düzenlemede benimsenmiş olan ihtiyat kurallarının günümüz şartlarında devre dışı kalabilmesi mümkündür. Buna karşın çağdaş döneme ait fıkhî/hukûkî düzenlemelerde ihtiyat ilkesinin işlevselliği değerlendirilebilir."
