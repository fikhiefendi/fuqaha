abstract: "Zekât, İslam'ın temel şartlarından biri olup, ibadet olması dışında çok sayıda hikmetleri bulunan bir müessesedir. Eski ümmetlerde de var olan zekât, İslam'ın ilk dönemlerinden itibaren kurumsal bir yapı içerisinde uygulanmıştır. Günümüzde de çeşitli İslam ülkelerinde zekâtın kurumsal niteliğe sahip olduğu gözlemlenmektedir. Son asırda Sosyal devlet anlayışı ön plana çıkmış ve bu anlayışın temelinde iç barışın temini ve devamlılığı, düşük gelirli ya da dezavantajlı grupların devlet eliyle desteklenmesi yatmaktadır. Düşük gelirli vatandaşların devlet tarafından desteklenmesi İslam toplumlarında zekât, sadaka, karz-ı hasen gibi yollarla gerçekleşmektedir. Zekâtın sarf yerleri ile devlet bütçesinin büyük bir kısmını oluşturan verginin harcama yerlerinin bir kısmı kesişmektedir. Bu noktada zekâtın kurumsallaştırıldığı takdirde aynı zamanda vergi gibi bir kamu hizmetlerinin finansman yöntemi olabileceği ortaya çıkmaktadır. Söz konusu meselenin anlaşılabilmesi ve değerlendirilebilmesi adına bu çalışma giriş ve sonuç dışında üç ana bölümden oluşmaktadır. Birinci bölümde kavramsal çerçeve çizilmektedir. Ayrıca zekât ve zekât ilişkili kavramlar ile birlikte konunun anlaşılabilmesine yardımcı olacak diğer kavramlara değinilmektedir. İkinci bölümde zekât ve verginin benzer ve farklı yönleri ortaya konulmaktadır. Son bölümde ise zekâtın kurumsallaşmasının önemine değinilerek ilgili model ve yöntemler üzerinde durulmaktadır. Zekâtın kendine özgü durumları sebebiyle, kurumsallaştırıldığı takdirde bütçede özel bir fon veya zekât için özel bir birimin kurulması gereği ortaya çıkmaktadır. Nitekim zekâtın kurumsal olarak toplanması ve etkin bir şekilde dağıtılması hem bireysel hem toplumsal açıdan çok yönlü yararlar sağlayacaktır."
