abstract: "ÖZET Konut kapıcılığı, sanayileşmenin ve dolayısı ile kentleşmenin ortaya çıkardığı bir meslektir. Yaptıkları hizmetin gereği kesintili ve düzensiz olarak çalışan konut kapıcıları, îş Hukuku bakımından özellikler gösterir. îş Kanunumuzun 5. maddesi, 1. fıkrasının 8. bendinde konutların kapıcılık hizmetlerinde“îş Kanununun uygulanmayacağı açıklandıktan sonra, 2. fıkrasının (e) bendinde istisnaya istisna getirilerek ”kaloriferli, konut kapıcıları ile çalışmasının tümünü aynı işverene ya da aynı konuta hasreden konut kapıcıları“, 11.4.1970 tarihinden itibaren İş Kanunu kapsamına alınmışlardır. Yerleşmiş adetlere göre, konutun genel temizliğini yapan, korunmasından ve güvenliğinden sorumlu olan, varsa kaloriferini çalıştıran, konutun ve konut sakinlerinin servis hizmetlerini yerine getiren konut kapıcılarının işvereni ”konutun maliki veya ortaklarıdır.“ Konut kapıcısı ile konut maliki ya da ortaklan İş kanununun işçi ve işverene tanıdığı hak ve yükümlere sahiptirler. Konut kapıcısı ile konut işvereni arasındaki ilişki, işverenin kapıcıya daire tahsis etme borcunu da kapsadığından ”karma sözleşme“ olarak nitelendirilmelidir. Hizmetleri gereği kesintili ve düzensiz çalışan konut kapıcılarının sekiz saatlik çalışma süreleri, ara dinlenmeleri uzatılarak korunabilmektedir.Konut kapıcılarının ücretleri kural olarak en az ücretin altında olamaz. Yasakoyucu kapıcı dairesi için kira istenmesini emredici bir hükümle yasaklamıştır. Sözleşmede su, elektrik ve ısınmadan yararlanma imkanının açıkça düzenlenmediği hallerde bunların karşılıkları ”aynî ödeme“ niteliğinde olacağından en az ücretin hesabında gözönünde tutulmalıdır. Ancak hesap yapılırken, kapıcı dairesi aynı zamanda işyeri olarak kullanıldığından, indirimin makul ölçülerde olması gerekir. Konut kapıcısı fiilen işe başladığı tarihten itibaren bir yıl çalıştığı takdirde yıllık ücretli izne hak kazanacaktır. Bu hakkın kullanımında halen Fransız tş kanununda uygulanan ve doktrin tarafından da ileri sürülen ”geçici kapıcı\" uygulaması en iyi çözüm olacaktır. Kapıcılık sözleşmesine son verilmesi halinde, kapıcıya tahsis edilmiş bulunan dairenin, oturmayı gerektiren hukuki sebebin ortadan kalkması nedeniyle tahliyesi gerekir. Bunu sağlamak için hukuk mahkemelerinde dava açılabileceği gibi idari yola da başvurulabilir. Konut kapıcılarının kıdem tazminatlarının hesabmda İş kanunu kapsamına alındıkları tarihten önceki çalışmaları gözönünde tutulmayacaktır."
