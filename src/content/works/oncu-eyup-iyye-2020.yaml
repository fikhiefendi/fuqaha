abstract: "İncelediğimiz şeriʻyye sicili H.(1311-1312) M. (1893-1894-1895) tarihleri arasında Eyüp mahkemesine ait 575 numaralı kadı sicilinin transkripsiyonunu ve değerlendirmesini içermektedir. Bu tarihlere uygun olarak Eyüp kazası, idari, sosyal ve ekonomik yönleriyle incelenmiştir. Bu tezde 575 numaralı Eyüp kadı sicilinin transkripsiyonu yapılarak hem tarihimize katkıda bulunmak hem de özellikle Eyüp ilçesiyle ilgili araştırma yapacak olanlara yardımcı olmak amaçlanmıştır. İncelediğimiz 575 numaralı Eyüp şerʻiyye sicili İstanbul Müftülüğü Şerʻiyye Sicişi arşivinden alınmıştır. İçerisinde toplam 127 belge bulunmaktadır."
