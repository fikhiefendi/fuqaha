abstract: "Toplumsal yapı içerisinde yaşayan ve var olan insan, yaşamını ve varlığını sürdürebilmek için diğer insanlarla ilişki kurmak zorundadır. Kurulan bu ilişkinin hukuk düzeni tarafından konulmuş olan kurallara uygun olması gerektiğinden ötürü insanlara birtakım hak ve yükümlülükler tanınmıştır. İnsanların bu hak ve yükümlülüklere aykırı harekette bulunarak üçüncü kişilerin haklarını zarara uğratması durumunda hukuk düzenleri meydana getirilen bu eylemi haksız fiil şeklinde tanımlamış ve bunun neticesinde eylemde bulunan ile eyleme maruz kalan arasında borç ilişkisi kurulacağını kabul etmiştir. Bu bakımından çalışmamızın konusu olan hem Türk borçlar hukuku hem de İslam borçlar hukuku haksız fiili borcun kaynağı olarak kabul etmiştir. Türk borçlar hukuku haksız fiile dayalı borç ilişkisini; kusura dayalı haksız fiiller ve kusur aranmaksızın borç doğuran haksız filler şeklinde ikili tasnife tabi tutarak düzenlemiştir. Fiil, hukuka aykırılık, zarar, illiyet bağı ve kusur unsurlarının bir araya gelerek kusura dayalı haksız fiili oluşturacağını kabul etmiştir. Kusur aranmaksızın borç doğuran haksız fiilleri ise tehlike, hakkaniyet ve özen ilkesine dayalı olarak her birinin kendi başlığı altında spesifik konular üzerinden düzenlemiştir. İslam borçlar hukukunda haksız fiilin iktisadi değer taşıyan mala karşı işlenmesi ve haksız fiil işlendikten sonra ortaya çıkan zararın giderilmesinin iktisadi sonuçlarının olması sebebiyle İslam iktisadı, İslam borçlar hukukunun dayanağını oluşturmaktadır. İslam borçlar hukuku haksız fiile dayalı borç ilişkisini; gasp ve itlaf şeklinde ikili tasnife tabi tutarak düzenlemiştir. Özellikle borçlar hukuku çerçevesinde haksız fiilleri kapsamlı ve modern hukuka benzer şekilde itlaf bölümü içerisinde ele almıştır. İtlafı da kendi içerisinde mübaşereten itlaf ve tesebbüben itlaf şeklinde ikili ayrıma tabi tutmuştur. Mübaşereten itlaf, modern hukukta yer alan kusura dayalı haksız fiile karşılık gelmekte olup fiil, hukuka aykırılık, zarar, illiyet bağı ve kusur unsurlarının bir araya gelmesiyle oluşacağını kabul etmiştir. Tesebbüben itlaf ise modern hukukta yer alan kusur aranmaksızın borç doğuran haksız fiile karşılık gelmekte olup spesifik konuları ele almıştır. Biz bu çalışmamızda her iki sisteminde borcun kaynağı olarak kabul edilen haksız fiil kavramını, unsurlarını ve türlerini ele alarak iki hukuk sistemi bakımından benzerlikleri ve farklılıkları yönünden mukayesesini yaptık."
