abstract: "Kıraat farklılıklarının Kur'ân âyetleri üzerine etkisi konusunda eskiden beri tartışılmakta ve farklı görüşler ortaya sunulmaktadır. Kimilerine göre kıraat farklılıkları Kur'ân'ın farklı okunmasına imkan verirken özünde manaya hiçbir tesiri olmamıştır. Kimilerine göre ise bu vecihlerin bir kısmı bir şekilde manayı etkilemiştir. Her görüş sahibi kendi kanaatini ispat ve ikna amacını gütmüştür. Sahasında uzman olan bu kişiler kıraatlerde bulunan ihtilafları, gerek kıraatin kendi oluşum ve gelişim aşamalarını gerekse manaya tesirini kendi sahalarında (Kıraat, Tefsir ve Fıkıh İlimleri) kullanma yoluna gitmişlerdir. Kur'ân âyetlerine mana veren müfessirler, kıraat farklılıklarından dolayı Kur'ân metnine değişik anlamlar verseler dahi bu durum, tefsirlerde bir çelişki oluşturmamıştır. Bu,“Eğer bu Kur'ân Allah'tan gelmeseydi onda birçok çelişki bulurlardı”(4/82) âyeti gereğince onun mu'cizliğinin bir delilidir. Günümüze kadar bir çok müfessir bu mu'ciz Kur'ân'ı çeşitli yöntemlerle tefsir etmiştir. Bu bağlamda çalışmamızın teması gereği tezimizin ana çatısını oluşturacak eser olarak Kurtubî'nin, el-Câmi' li-Ahkâmi'l-Kur'ân adlı tefsiri seçilmiştir. Kurtubi tefsirinde hem î'râba hem kıraatlere hem de ahkâm âyetlerine geniş yer vermektedir. Tezimizde Kurtubî Tefsiri bağlamında bazı aile hukuku âyetlerindeki kıraat farklılıkları ve müfessirlerin bu okuyuşlara göre âyetlere vermiş oldukları anlamlar incelenerek kıraat farklılıklarının manaya tesiri olup-olmadığı tespit edilmeye çalışılacaktır. Bu amaçla araştırma çerçevesinde kıraat ilmi konularına değinilmiş, kıraat farklılıkları bazı aile ahkâmına yönelik âyetlerde tespit edilmiş ve bu farklılıkların fukahânın âyetlerden çıkarmış oldukları fıhki hükümlere tesirinin olup olmadığı incelenmiştir."
