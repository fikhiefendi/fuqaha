abstract: "Necmeddin Tufi'nin Maslahat Anlayışı? adını taşıyan bu tezimiz, Necmeddin Tufi'nin kendi eserlerinden, Tufi'nin hayatını ve görüşlerini inceleyen kaynaklardan ve Tufi'nin kendilerinden etkilendiği alimlerin eserlerinden faydalanılarak hazırlanmış bir tezdir. Bu tezin amacı ise Necmeddin Tufi'nin ortaya koymağa çalıştığı ?maslahat teorisi?ni konu bütünlüğü içerisinde incelemektir. Necmeddin Tûfî, tüm mezheplerin kaynaklarını küllî bir bakış açısıyla değerlendirmiş ve mutlak maslahatı delil olarak kabul etmiştir. Necmeddin Tufi, farklı kaynaklar/delillerin ışığı altında ulaşılmak istenen ?maslahat?ı müstakil bir delil/kaynak olarak ele almış, nasların zahiri anlamları ile gayelerini bu delille birleştirmeyi amaçlamıştır. Fakat nasıl ki, Hanefiler istihsan, Malikiler maslahat-ı mürsele kavramlarını geliştirirken tenkitlere maruz kaldılarsa, Tûfî de benzer tenkitlere, hatta, ağır ithamlara uğramıştır. Onun ?maslahat teorisi?ni ortaya koyarken amacı mezheplerdeki farklı görüşlerden en uygulanabilir olanına ulaşmak ve delalet veya sübut yönünden zanni olan nasların literal anlamlarını hukukun genel gayeleri ile kontrol etmektir. Bu kontrolü, zanni olan nasları maslahat delili ile tahsis ederek sağlamaktadır. O, ?maslahat teorisi?ni geliştirirken kendinden önceki alimlerin fikirlerinden etkilenmiş ve görüşlerini bu alimlerin görüşlerine paralellik gösteren bir şekilde ortaya koymuştur"
