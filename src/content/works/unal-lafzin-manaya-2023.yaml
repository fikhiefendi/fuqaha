abstract: "Kökleri eskilere dayanan bilimsel tefsir çalışmaları telif yönünden kazanmış olduğu yoğunluktan dolayı artık bir tefsir ekolü olarak karşımızda durmaktadır. Ekol içerisinde kevnî ayetler bilimsel veriler ışığında ele alınırken tefsir literatürü içerisinde bilimsel tefsir ekolüne dair yapılan çalışmalar ise onu kabul edenler ve reddedenler arasındaki çekişmeden usûlî ortama çekilememiştir. Alanın usulî bir zemine oturtularak Kur'ân âyetlerinin bilimsel referanslar ışığında yapılan yorumlarının makbul olup olmadığı hususunda bir metot sunmayı hedefleyen bu çalışma birinci bölümünde bilimsel tefsir kökenine dair izleri takip ederek klasik ve modern dönem argümanlarının mukayesesi üzerinde durmuştur. İkinci bölümde çeşitli açılardan lafız mana ilişkisi ele alınmış, bilimin doğası ve bilimin bir tefsir referansı olup olmaması irdelenmiştir. Üçüncü bölümde ise Kur'ân âyetlerinin bilimsel yorumlarına bir usûlî kıstas getirilirken aynı metot“Usûlî Tefsir Yöntemi”başlığıyla tefsir literatürüne ilk defa bir öneri olarak sunulmuş ve bu yöntemin uygulamalı örnekleri mufassal bir şekilde sergilenmiştir. Usûlî Tefsir Yöntemi'nin kökleri usûl-i fıkıh ilminin delalet bahisleri üzerine kurulu olması hasebiyle kadim usûl geleneğine dayanırken bu prensiplerin uygulanarak âyetin anlam alanlarının tespit edilmesi ve yapılan yorumların kabul edilip edilmeyeceği hususunda bir ölçüt olarak tatbik edilmesi ise yeni bir yöntem olarak tefsir literatürüne arz edilmiştir."
