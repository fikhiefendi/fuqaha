abstract: "Muhaddisler, hadis ilmine ve ıstılahlarına büyük önem vermişlerdir. Bu ilim, hadis türleri ve kısımlarına dair özel bir terminolojiyi kapsamaktadır. İslam tarihinde, bu ilimle hem rivayet hem de dirayet yönüyle ilgilenen büyük hadis âlimleri yetişmiştir. İlk olarak, rivayet yönüyle hadis ilmi, Hz. Peygamber'in sözlerinin ve fiillerinin rivayetini, lafızlarının korunmasını ve doğruluğunun tespitini konu edinir. İkinci olarak, dirayet yönüyle hadis ilmi, hem râvinin hem de rivayet edilen hadisin kabul veya reddedilme durumunu belirleyen bir ilimdir. Muhaddisler, kendi eserlerinde her bir râvînin biyografisine yer vermiş ve rivayetlerinin hadis kitaplarındaki yerini göstermeye büyük özen göstermişlerdir. Öte yandan fukahâ da hadis ilmine, sadece toplama ve rivayet etme noktasında değil; aynı zamanda istidlal ve içtihat açısından da büyük önem vermişlerdir. Hadislerden hükümler çıkarmışlar ve bu doğrultuda İslam beldelerinde fıkhî görüşler ortaya koymuşlardır. Bu tür hadislere“ahkâm hadisleri”denilmiştir. Bu çerçevede İmam Mâlik, İmam Şâfiî ve İmam Ahmed b. Hanbel gibi İmam Ebu Hanife başta olmak üzere Hanefî mezhebi fukahası da hadisleri fıkhî hükümlerin inşasında temel kaynak olarak görmüşlerdir. İmam Ebû Hanîfe, iki öğrencisi ve diğer Hanefî fakihleri, eserlerinde hadislerle istidlal noktasında büyük bir titizlik göstermiş, hadislerin kabulüne dair birtakım şartlar ve ölçütler ortaya koymuşlardır. Bu şartlar içerisinde genel kabul gören kadar bazı yönleriyle farklılık arz edenler de Bulunmaktadır. Bu durum sebebiyle Hanefîler eleştirilmiş; haksız yere hadisi terk ettikleri, zayıf hadislerle amel ettikleri, ayrıca kıyası ve rey'i hadise tercih ettikleri gibi İthamlarla karşı karşıya kalmışlardır. Bu iddiaların ilmi bir temele dayanmadığı açıktır. Dolayısıyla bu ithamların detaylı bir şekilde incelenmesi ve değerlendirilmesi gerekmektedir. Bu kapsamda \"Hanefî Fakihlerine Zayıf Hadisle İstidlal başlıklı çalışmada Hanefî fakihlerinin zayıf hadisle ne ölçüde istidlal ettikleri, zayıf hadisin her durumda terk edilip edilmeyeceği, zayıf hadisle ahkâm istinbâtının mümkün olup olmadığı ve bu istidlalin hangi ölçütlere göre yapılabileceği gibi hususlar incelenmektedir. Böylece Hanefîlerin zayıf hadisle istidlal metodunun ve bu konuda geliştirdikleri usulün mahiyetini anlamaya dair bir katkı sağlanması hedeflenmiştir. Çalışmada ayrıca şu konular da işlenmiştir: zayıf hadis kavramlarının tanımı, zayıf hadis çeşitleri, zayıf hadisle amel konusundaki âlimler arası ihtilaf, hadislerin takviyesi ve tevsiki meselesi, fakihlerin amel ettiği zayıf hadis örnekleri Hanefî fakihlerinin hadisi anlama ve yorumlama yöntemleri, Hanefîlerin hadiste yetersiz oldukları yönündeki iddiaların ilmi bakımdan değerlendirilmesi. Bu amaçla çalışmada, Hanefî mezhebinin önde gelen fakihlerinden Cessâs (370/981) Kudûrî (428/1037), Serahsî (490/1090),Alauddin Semerkandî (539/1145), Kâsânî (587/1191) Mergînânî (593/1197) Mevsılî (683/1284), ve diğer alimlerin eserlerinden örnekler sunularak uygulamalı analizler yapılmıştır."
