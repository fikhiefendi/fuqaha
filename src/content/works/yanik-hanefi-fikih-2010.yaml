abstract: "Bu tez, Moğol istilâsının hemen akabinde, XIV. yüzyılda Zeylâ ve Mısır ekseninde yetişen ünlü Hanefî fakîh Zeylaî ve onun en önemli eseri sayılan Tebyînü'l-Hakâik'ı tanıtma amacıyla hazırlanmıştır. Tezimiz öncelikle tarihî seyri içinde Hanefî fıkhını, bu fıkhın oluşum sürecini ve literatürünü incelemektedir. Hanefî fıkıh literatürünün oluşumuna katkısı bulunan isimler ve eserler verilirken asıl mevzûmuzu teşkil eden, Hanefî fıkıh tarihi içinde müstesna bir mevkiyi hâiz olan Ebu'l Berekât en-Nesefî'nin Kenzü'd-Dekâik adlı eseri ve bu eser üzerine yazılmış en önemli şerh sayılan Tebyîn'ül Hakâik'da literatürdeki yerleriyle beraber ve ayrıntılı bir şekilde ele alınmıştır. Tebyînü'l Hakâik İslam fıkıh tarihi içindeki seçkin konumunu asırlar boyu muhafaza etmiş, Osmanlı medreselerinde ders kitabı olarak okutulmuş ve pek çok fetvâya kaynaklık etmiştir. Hanefî fıkhı ekseninde Tebyînü'l-Hakâik ve onun müellifi Zeylai'yi -hakkında yeterli ve tatmin edici bilgi kaynaklarına ulaşamasak da- bizzat esere başvurarak tanıtırken nihaî amacımız, literatürde önemli bir yeri olan bu eserin mikro planda da olsa yeniden hatırlanmasının sağlanması ve araştırmacıların dikkatlerinin bu zemine çekilmesidir."
