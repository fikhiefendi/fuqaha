abstract: "Günümüzde katılım bankalarının hem ulusal hem de uluslararası düzeyde faaliyetleri ve bankalar arasındaki piyasa payı giderek artmaktadır. Katılım bankaları kendine has fon toplama ve kullandırma yöntemleriyle klasik bankalardan ayrışmaktadırlar. Ayrıştığı yöntemlerden biri de fon kullandırma yöntemi olan kâr zarar ortaklığı projeleridir. Kâr zarar ortaklığı projelerinin muhasebeleştirilmesinde katılım bankalarının farklı muhasebe standartları kullanmalarından dolayı belirli zorluklar yaşanmaktadır. Bu çalışmada katılım bankaları tarafından uygulanan kâr zarar ortaklığı projelerinin muhasebeleştirilmesinin muhasebe standartları açısından incelenmesi ve AAOFI standartlarının uygulanmasından beklenen yararları incelenmiştir."
