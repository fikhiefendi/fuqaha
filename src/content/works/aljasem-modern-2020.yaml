abstract: "Şer'î hükümlerin, sabit olanları ile belirli sebep ve şartların değişmesine bağlı olarak değişebilenleri olmak üzere iki türlü olduğu bilinmektedir. Hükmün üzerine binâ edildiği bilgilerin değişmesi, bu sebeplerin en önemlilerindendir. Tıbbî bilgi ve teknolojiler, asırlar boyunca önemli bir şekilde değişen en bariz bilgilerdendir. Çalışma, değişebilen hüküm ve fetvâların açıklanmasını, akabinde bu değişimde tıbbî gelişmenin etkisini ortaya koymayı amaçlamaktadır. Araştırma, bu amacı, değişimin şartları, kriterleri ve sebeplerini açıklayan bir etimolojik araştırmaya ek olarak ibâdât, aile ve ceza hukukuyla ilgili fıkhî meseleler üzerine yapılan uygulamalı bir araştırma aracılığıyla gerçekleştirmeye çalışmaktadır. Uygulamalı araştırma bölümünde tıbbî meselelerde mütekaddimûnun fetvâları, bu meselelerle alakalı tıbbî yeniliklerin değişimine binaen bu fetvâların uygulanabilirlik boyutuna açıklık getirilmektedir. Çalışmada, değişimi kabul eden fetvâların şartları, tıbbî teknolojilerden etkilenmesine göre fetvâ çeşitleri, etkilenmenin şekilleri ve bunlara benzer başka sonuçlara ulaşılmıştır."
