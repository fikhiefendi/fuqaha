abstract: "Hicri 593 yılında vefat eden Merğînânî Hanefi mezhebinin önemli fıkıh âlimlerindendir. Merğînânî'nin en önemli ve en çok okutulan eseri el-Hidâye adlı telifidir.Merğînânî bu eserinde Ebu Hanife'nin, İmam Muhammed, İmam Yusuf ve bazen de İmam Züfer 'in görüşlerinin yanında diğer mezhep imamların görüşlerine yer vermektedir. İmam Şâfiî'nin mezhebi de bunlardan bir tanesidir. Bu araştırmamızda Merğînânî'nin el-Hidâye adlı eserinde hadd ve kısas bölümlerinde İmam Şâfiî'ye nispet ettiği görüşlerini Şâfiî mezhebi kaynaklarında tespit etmeye çalıştık. Çalışmamız üç bölümden oluşmaktadır. Birinci bölümde İmam Şâfiî ve Merğînânî'nin hayatlarından ve el-Hidâye'nin mezhep içerisinde ki konumuna kısaca değinilmiştir. İkinci bölümde hadd konusunda İmam Şâfiî'ye nispet edilen görüşler ele alınmıştır. Üçüncü bölümde ise kısas konusu ele alınmıştır.Sonuç olarak Merğînânî'nin el-Hidâye adlı eserinde hadd ve kısas bölümlerinde İmam Şâfiî'ye nispet ettiği görüşlerinden 76 tanesini tespit ettik. Bu görüşlerden 65 tanesinde isabet etmiş olup 11 tanesinde ise hata etmiştir."
