abstract: "Senegal, altyapısının gelişimini sağlamak için yatırım ihtiyacı ile karşı karşıyadır. Halen düşük olan bankacılık oranıyla (%17), İslami finans yeni bir finansman kanalı olmaya adaydır. Senegal'de bütün işletmelerin yaklaşık %80'ini temsil eden küçük ve orta boy işletmeler yoksulluk, güvencesizlik işsizlik ve eksik istihdam gibi sorunlara karşı dikkate değer bir manivela işlevi görür. Bu çalışmanın amacı, KOBİ'lere sunulan İslami finansman biçimlerini ve KOBİ'lerin ihtiyaçlarını mercek altına almaktır. Araştırmacı, listesi verilen 20 bankayı örneklem olarak kullanarak Senegal'de bulunan İslami ve Geleneksel bankaların finansal performanslarını da karşılaştıracaktır. Çalışmada, CAMEL tabanlı tanımlayıcı istatistikler kullanılacaktır. Araştırmacı sıfatıyla, performansı Sermaye yeterliliği, varlık kalitesi, yönetim, kazanç ve likidite açısından ölçmeyi planlıyorum. Hipotezi test etmek için T-test analizi kullanılacaktır."
