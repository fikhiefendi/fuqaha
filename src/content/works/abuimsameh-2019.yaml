abstract: "Bu çalışmanın amacı, İslami İktisat alanında önerilen bir teori için, yenilikçi bir model ile uygulamalı bir çerçeve geliştirmektir. Bu model, İslami ekonomi sistemi için profesyonel bir medya çerçevesi ve yerel, bölgesel ve uluslararası alanında bir rekabet ortamı sağlamak için ekonomik rekabetçilik alanında uygulanacaktır. Bu amaçla İslami Ekonomik Sistemininin önemine vurgu yapmak ve islam iktisadında bilginin rolü ve önemine vurgu yapılmıştır. Araştırmanın amaçlarına ulaşmak için, araştırmacı, medya ve iletişim alanında daha önce yapılan çalışma ve iletişim felsefelerinden yararlanmıştır. Bu araştırmadan yola çıkarak elde ettiği bilgi teorileri ve felsefelerini kozmolojik ve ideolojik açıdan derinliklerine inerek tüm sistemlerin entelektüel bağlamda en büyük etkiye sahip olduğunu araştırdı. Bütün bu etkiler de siyasi, ekonomik alanlarda İslam medyasının küreselleşmesini ve dünya ekonomilerindeki önemli ve etkili bir rolününün olduğuna dikkat çekmiştir. Nitekim islam iktisadında medyanın etkin ve faal gücü sınırları aşmıştır. Araştırmacı ayrıca, genelde islam iktisadı özelde ise islam ekonomisini özel bir başlık altında incelemiştir. İslam ekonomisinde ekonomik medya uzmanının yokluğu araştırma yapmayı zorlaştırdığı göz önününde bulundurulmalıdır. Araştırmacı ayrıca ekonomik rekabetin gereklilikleri ve etkileri alanında genel de Arap ekonomilerinin özelde ise İslami ekonominin konumu konusunda geniş bir yelpaze sunmuştur. Araştırmacı, saha ziyaretleri ile araştırmayı desteklemiştir. Ayrıca ekonomik medya alanında islami iktisadi alanında çalışma yapanlara üniversitelerin İslami ekonomi alanındaki uzman profesörlerine yönelik bilimsel anketler hazırlamıştır. 150 anket paylaşmış, bunlardan 114'ünü gerçekleştirmiştir, 3 anket ise tamamlanmadığından çalışmada onlara yer vermemiştir. 111 anket (% 74) veri alınmış,sosyal ve beşeri bilimler (SPSS) alanında en popüler istatistiksel veriler kullanılarak tteorilerin analizleri için veriler toplanmıştır. Araştırma sonuçlarını ve verilerini analiz etmek için on farklı istatistiksel yöntem kullanılarak araştırmanın ,önemli sonuçlar elde etmesine katkı sağlamıştır. En bariz katkı ise ekonomik medya ile genel olarak ekonomik sistemlerin arasında güçlü bir pozitif ilişki olduğu saptanmıştır. Bu sonuca dayanarak, önerilen teorinin başarılı olduğu, ve teoriye dayanan yenilikçi bir modelin gerçekleşme olasılığı artmış ve gerçekleştirilen değişikliklere istinaden , İslami ekonomi sisteminin rekabetçiliğini büyük ve olumlu bir şekilde desteklemiştir. Araştırma genelde ekonomik medya alanında özel de ise İslam ekonomisi alanında araştırma yapmanın önemini pekiştirmiştir. Ayrıca, ekonomik medya alanında ve İslam ekonomisi alanında bilimin her düzeyinde (lisans- yükseklisans- doktora ) bilimsel bir uzmanlaşma gerektiği saptanmıştır. Özellikle akademilerde, üniversitelerde ve ihtisas enstitülerinde,ekonomik medya ve islami ekonomi alanında ilmi uzmanlaşma zorunlu hale gelmiştir. Ekonomistlerin ve medya uzmanlarının teknik kadroları, uzmanların kollektif fikirlerinden yararlanarak bu alanda gelişmiş olan ekonomik ve medya platformlarından faydalanmalıdır. Bütün bu yapılan çalışmalarla alanda analitik,eleştirel ve güvenilirliği yüksek, islam ekonomi sistemine hizmet eden bir sistem oluşturmak amaçlanmıştır.Ayrıca yerel, bölgesel ve uluslararası alanda islam ekonomisinde rekabetin etkin kılınmması önem arz etmekktedir."
