abstract: "İslâm Tarihi boyunca para ve paranın hükümleri Müslümanlar arasında uzun uzadıya tartışılan konulardan birisidir. Bundan dolayı İslâm Hukuku'nda bir bedelin, neye itibarla para olarak değerlendirileceği, bu husustakî temel kriterlerin ne olduğu ve para olarak kabul edildiğinde hangi farklı hükümleri alacağı mühim konulardır. Özellikle günümüzde, klasik kaynaklar döneminde ki para cinslerinden farklı paraların kullanılması ve teknolojinin gelişmesiyle her geçen gün para çeşitlerinin gelişmesi gibi etkenler paranın İslâm Hukuku'na göre hükümlerinin yeniden ve daha tafsilatlı araştırılmasını gerektirmektedir. Günümüzde kullanılan kâğıt paraların durumlarını tespit edip onlar hakkında yorum yapabilmek için klasik kaynaklarımızda geçen para ve para cinsleri ile alakalı ahkâmın ayrıntılı şekilde tahlil edilip, değerlendirilmesi gerektiği kanaatindeyiz. Bundan dolayı bu çalışmada günümüz paralarına benzediğine kanaat getirdiğimiz fels paraların hükümlerine ayrıntılı şekilde yer verilecektir. Fels paraların hükümlerinden bahsederken felsleri, altın ve gümüş paralara kıyaslayarak farklı oldukları hükümler tespit edilmeye çalışılacaktır. Sonuç olarak günümüz paralarının hüküm cihetinden altın ve gümüş cinsi paralara benzemediği, fels paralara benzediği ve ona göre hüküm alması gerektiği görüşü incelenmeye çalışılacaktır"
