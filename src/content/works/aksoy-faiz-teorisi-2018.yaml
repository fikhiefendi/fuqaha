abstract: "İslam borçlar hukukunun temel konularından birisi olan faiz, mübadele türü akitlerde karşılığı bulunmayan fazlalığı ifade etmektedir. Bu fazlalığın, akitlerde şart koşulması yasaklanmıştır. Bu yasağa uymak için faizin illeti tespit edilmiştir. Hanefi mezhebinde cins ve ölçü birliği olarak tespit edilen faiz illeti sadece cins anlayışı ile bu çalışmanın konusu olmuştur. Tez çalışmamızda, cins kavramının sözlük anlamları, mantık ve fıkıh ilminde kazandığı ıstılâhi anlamları, faiz konusu özelinde faizin illeti olarak cins anlayışı, cinsi farklılaştıran ölçütler, ticari hayata yansıyan uygulama örnekleri ele alınmıştır. Çalışma bir giriş ve üç bölümden oluşmaktadır. Giriş kısmında çalışmanın çerçevesi, kaynakları, amacı ve yöntemine yer verilmiştir. Birinci bölümde cins kavramının lügat anlamı incelenmiş olup veriler temel olarak üç ana grupta toplanmıştır. İkinci olarak cins kavramının mantıkçılar nezdindeki anlamı araştırılmıştır. Bu araştırmalar sonucu elde edilen veriler çerçevesinde cins kavramının mantık ilminde kazandığı anlam serdedilmiştir. Fıkıhta cins kavramı incelenerek birinci bölüme eklenmiştir. Bölüm sonuna bir de değerlendirme başlığı ilave edilmiştir. İkinci bölümde cins kavramının fukaha nezdindeki anlamı araştırılmıştır. Hanefi mezhebinin cins anlayışı, faiz konusu özelinde nasıl belirlediği ve problemlere nasıl uyguladıkları incelenmiştir. Mezhep içi ihtilaflar tespit edilip çalışmaya eklenmiştir. Bu inceleme esnasında tarihi süreçte cins algısında bir değişimin olup olmadığı da tespit edilmeye çalışılmıştır. Üçüncü bölümde cumhuriyet sonrası modern dönemde cins anlayışı için geliştirilen ölçütler tespit edilmeye çalışılmıştır. Geliştirilen ölçütler problemlere nasıl aktarılmış, hayatın değişen akışı içinde cins anlayışı nasıl bir farklılaşma göstermiş vb. noktalar soruşturulmuştur. Modern dönemde Hanefi mezhebi cins anlayışına dair ortaya konulan verilerde ikinci bölüm verilerince analiz edilmeye çalışılmıştır."
