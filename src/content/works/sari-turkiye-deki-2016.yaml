abstract: "Bankalar, finansal ve ekonomik sistem içinde son derece büyük öneme sahip aracı kuruluşlardır.Bankacılık sektörünün performansının değerlendirilmesi, rekabet açısından gereklilik olmuştur. Bu çalışmanın amacı Türk bankacılık sisteminde faaliyet gösteren ticari bankalar ve katılım bankalarının 2012-2014 yılları arasında finansal performanslarının Çok Kriterli Karar Verme yöntemleri kullanılarak değerlendirilmesidir. İlk olarak kriterlerin ağırlıklarının belirlenmesi amacıyla Analitik Ağ Süreci (AAS) yöntemi kullanılmıştır. Bankaların performans değerlendirmesinde ana kriterlerden sermaye yeterliliği oranları, alt kriterden (özkaynaklar/kredi+piyasa+ operasyonel riski için gerekli sermaye yükümlülüğü) oranının en fazla öneme sahip olduğu ortaya çıkmıştır. İkinci aşamada bankalarVIKOR yöntemi kullanılarak finansal performanslarına göre sıralanmıştır."
