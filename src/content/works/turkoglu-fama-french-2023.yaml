abstract: "Bireylerin rasyonel olduğu ön kabulüyle piyasa etkinliğini öne süren Fama (1970) mevcut piyasaların tüm bilgileri içerdiği ve piyasa katılımcılarının anormal getiri elde edemeyeceği görüşü ile finans literatürüne farklı bir bakış açısı kazandırmıştır. Söz konusu görüş ampirik çalışmalarla da desteklenmiştir. Ancak destekleyici çalışmaların yanı sıra piyasalarda anomalilerin de var olduğunu, tüm bilgilerin piyasaya yansımasının mümkün olmadığını ve yatırımcının anormal getiri elde edebileceğini öne süren çalışmalar aynı zamanda yatırımcının rasyonel olmaktan ziyade irrasyonel tavır sergilediğini gözler önüne sermiştir. Tüm bu kavramlar Davranışsal Finans teorisi çerçevesinde değerlendirilirken yatırımcı davranışları her boyutta incelemeye alınmıştır. Bilişsel önyargılar ve hevrestikler bu incelemelerin ana temasını oluşturmakta ve bununla birlikte sosyolojik ve psikolojik olgular çalışmalara yön vermektedir. Bu olguların yanı sıra bireylerin rasyonel kararlar verme davranışı dışında, farklı bakış açılarıyla kararlar vermeyi tercih ettiği bir diğer alan da İslami Finans'tır. İslami Hukuk kuralları çerçevesinde şekillenen İslami Finans yatırımcıların finansal kararlarında dini inançlarının etkisini konu edinmektedir. Tüm bu teorik alt yapı çerçevesinde çalışmada Fama ve French (2015) tarafından ortaya konan beş faktörün hangilerinin hangi tip portföylerde etkin olduğunu ortaya koyabilmek amacıyla, elde edilen veriler, Genetik Algoritması optimizasyonuyla oluşturulan Yapay Sinir Ağları tabanlı hibrit bir modelle analiz edilmiştir. Bu çerçevede geleneksel ve İslami bakış açısıyla oluşturulan portföyleri oluşturmada olası farklılıkların da altı çizilmiştir. Bu amaçla öncelikle Borsa İstanbul Tüm Endeksi'nde yer alan 159 firmanın ve Borsa İstanbul Katılım 50 Endeksinde yer alan 29 firmanın 2014- 2021 arası dönemin çeyreklik verileriyle oluşturulan portföylerle her iki endekste de Fama ve French Beş Faktörlü Modelin geçerliliği test edilmiştir. Yapılan analizler neticesinde, Fama ve French Beş Faktörlü regresyon modeliyle uygulanan Panel Veri Analizi testlerinde, geleneksel ve İslami bakış açısıyla oluşturulan portföyler üzerinde etki eden faktörlerdeki olası farklılıklar tespit edilmiştir. Ayrıca, uygulanan Genetik Algoritması optimizasyonuyla oluşturulan Yapay Sinir Ağları tabanlı hibrit modelle yapılan değerlendirme neticesinde, benzer şekide, farklı bakış açılarıyla oluşturulan portföylerde etkin gen parametrelerinin değişkenlik göstermesi farklılaşmaya işaret etmektedir. Sonuç olarak geleneksel bakış açısıyla ve İslami bakış açısıyla oluşturulan portföylerdeki farklılaşma davranışsal açıdan incelenmiştir. Bunun yanı sıra uygulanan iki model çerçevesinde genetik algoritması optimizasyonuyla oluşturulan yapay sinir ağları tabanlı hibrit modelin sonuçlarının daha spesifik çıktılar ürettiği sonucuna varılmıştır."
