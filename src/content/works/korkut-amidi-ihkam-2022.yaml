abstract: "Fıkıh usulünde dinî kaynaklardan istinbat etme ve bununla amel etme süreci ictihad, taklid ve istiftâ sistematiği çerçevesinde varlık kazanmaktadır. Mukallit karşılaştığı meselenin dinî hükmü konusunda müctehitten fetva ister, müctehid de dinin ana kaynaklarından hareketle ictihad vasıtasıyla meselenin dinî hükmünü ortaya koyar, mukallitler ise bu hükmü taklid ederek onunla amel ederler. Fıkıh usulünde ictihad, taklid ve istiftâ başlıkları altında incelenen bu sürecin doğru işleyebilmesi için çeşitli kurallar belirlenmiştir. Bu kurallar geçmişte olduğu gibi günümüzde de önemini korumaktadır. Araştırmamız Seyfeddin el-Âmidî'nin el-İhkâm fî Usûli'l-Ahkâm isimli eserinin bağlamında ictihad, taklid ve istiftâ sürecinin temel kurallarını ele alarak bu sürecin doğru işlemesine katkıda bulunmayı hedeflemektedir. Giriş kısmında Seyfeddin el-Âmidî'nin hayatı, yaşadığı dönemin şartları ve ilmî kişiliği ele alınmıştır. Birinci bölümde Âmidî'nin usul düşüncesi esas alınarak ictihadın sözlük ve terim anlamı, müctehidin sözlük ve terim anlamı, kimin ictihad yapması gerektiği, Hz. Peygamber'in (s.a.v.) ictihad yapıp yapmadığı ve ictihad kapısının kapalı olup olmadığı gibi hususlar eleştirel bir yapı içerisinde incelenmiştir. İkinci bölümde ise taklid ve istiftâ üzerine Âmidî'den önce vuku bulan tartışmalar Âmidî özelinde ele alınıp bir sonuca ulaştırılmıştır. Bununla beraber taklid ve istiftâ süreçlerinin temel kuralları yine Âmidî özelinde incelenmiştir. Kelamcı ve usulcü kimliğiyle ön plana çıkan Âmidî'nin ictihad, taklid ve istiftâ ile ilgili görüşlerinin ortaya konulmasının ictihad, taklid ve istiftâ sürecinin doğru anlaşılmasına katkı sunacağını umut etmekteyiz."
