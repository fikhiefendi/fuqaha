abstract: "Tezimizde İslam hukukunda iftira suçunu ele almaktayız. İslâm hukuku iftiranın bütün biçimlerini açık bir dille yasaklamıştır. İslâm hukuku, zina iftirasını (kazf), farklı bir statü içerisinde değerlendirmeyi tercih etmiş ve bunun için diğer iftiralara nazaran daha hassas bir çerçeve çizmiştir. Zina iftirası (kazf), içinde hem Allah hakkı ve hem de birey hakkının birlikte bulunması sebebiyle diğer iftiralar ve hadlerden ayrılmaktadır. Bu hakların hangisinin önde olduğuna yönelik ihtilaf ise tezimizde andığımız çok sayıda tartışmaya zemin teşkil etmektedir. İslâm hukuku, kazf için bedeni ceza yanında, diğer hukuk sistemlerinde de rastlanması güç bir cezalandırma biçimi olan şahitlikten men müeyyidesine yer vermektedir. Böylece kazf diğer iftiralardan ve İslam hukukunda bahsi geçen bütün cezalardan açıkça ayrılmaktadır. Şahitlikten mahrumiyet cezasının birey ve toplum psikolojisi ile caydırıcılık bağlamında büyük anlam taşıdığını söyleyebiliriz.Hakkında Kur'ân-ı Kerîm'de bir cezâî tespitin bulunmadığı kazf dışındaki iftiralar için İslâm hukuku, siyasi otoriteye, toplumun durumunu, suçların gelişimini ve bireylerin özel şartlarını göz önünde bulundurarak düzenlemeler yapma imkanı tanımıştır. Temel gayesi ceza vermek değil, barış ve huzurun hakim olduğu bir toplum var etmek olan ve bu anlamda suçlu arayışına girmekten ziyade suçun kaynağını kurutmaya yönelik tedbirler alan İslâm hukukunun kazf ve diğer iftira biçimleriyle ilgili tutumunun bilhassa insan onuruna ve toplumun genel maslahatına verdiği büyük değerden kaynaklanmaktadır. Böylece üzerine gidilmedikçe açtığı yara daha da büyüyen iftiraya karşı, İslam hukuku, keskin bir cezalandırma yöntemi benimsemekte, insanlararası ve hatta toplumlararası ilişkileri tehdit eden bu suçu hiçbir şekilde tolere etmemektedir.Hakkında Kur'ân-ı Kerîm'de bir cezâî tespitin bulunmadığı kazf dışındaki iftiralar için İslâm hukuku, siyasi otoriteye, toplumun durumunu, suçların gelişimini ve bireylerin özel şartlarını göz önünd