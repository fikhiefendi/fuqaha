abstract: "Bu çalışmada, İmâmiyye ekolünün temelini teşkil eden Ca'feriyye mezhebinin icmâ anlayışı konu edinilmiştir. İki bölümden oluşan bu çalışmanın birinci bölümünde, Ehl-i sünnet fukahâsına göre icmâ ele alınmıştır. Ehl-i sünnet fukahâsı icmâı hücccet olarak kabul etmiş ve hüccet olduğuna dair Kur'an'dan ve sünnetten deliller getirmiştir. Özellikle Nisâ Sûresi 115. ayeti ve ümmetin ismeti ile ilgili hadisleri icmâın hüccet olduğuna dair dayanak olarak sunmuşlardır. Aynı zamanda icmâın bir senede dayanması gerektiğini; çünkü icmâın bir hüküm koymadan ziyâde hüküm sabitleme özelliği ile ortaya çıktığını ifade etmişlerdir. İkinci bölümde ise Ca'feriyye mezhebinin icmâ anlayışı ele alınmıştır. Ca'ferî âlimler icmâı hüccet olarak kabul etmenin yanında icmâa ahbârı keşfetme özelliği yüklemişlerdir. Onlara göre icmâ delilin delilidir. İcmâı delil olarak kabul etmelerinin dayanakları ise Sekaleyn hadîsi ve 'masum imamın ismeti' anlayışıdır. Sonuç olarak Ehl-i sünnet'te icmâ delili ümmetin ismeti anlayışına dayandırılırken, Ca'feriyye'de masum imamın ismeti anlayışına dayandırılmıştır. Ca'feriyye'de icmâ ile hüküm tespit etmekten ziyade masumun konu hakkındaki görüşü bulunmaya çalışılmıştır."
