abstract: "Hindistanlı muhaddis ve fakih Abdulhayy el-Leknevî, İngiliz iradesinin Hint alt kıtasını işgali sırasında dinin temel kaynaklarına dönüş hareketine öncülük eden, çeşitli ilim dallarında yüz yirmiye yakın eser telif eden bir İslam âlimidir. Leknevî, özellikle delillerden hüküm elde etme hususunda derinleşmiş ve Fıkhu'l-Hadis ilmi ile iştigal etmiştir. Hüküm elde ederken deliller arasındaki ihtilafın giderilmesi ile ilgili uygulamları mevcuttur. Bu uygulamalarına örnek teşkil edebilecek eserlerinden biri de araştırmamıza konu olan risalesidir. Çalışmada Leknevî'nin bir konu hakkında hüküm verirken takip ettiği yöntem incelenmiş ve bu yolla onun İhtilâfu'l-Hadis ilmine yaklaşımı değerlendirilmeye çalışılmıştır. Araştırmamız giriş ve iki bölümden oluşmaktadır. Giriş bölümünde araştırmanın konu, amaç, kapsam, yöntemi ve konu ile ilgili kavramlardan bahsedilmiştir. Birinci bölümde Abdulhayy el-Leknevî'nin hayatı, ilmî kişiliği, eserleri ve çalışmamıza konu olan İmâmu'l-Kelâm fi mâ Yeteallaku bi'l-Kıraâti Halfe'l-İmâm risalesi hakkında bilgiler verilmiştir. İkinci bölümde Leknevî'nin İhtilâfu'l-Hadis anlayışı ve uygulaması aynı eser bağlamında yedi ana başlık halinde ele alınmıştır. Bu başlıklar altında Leknevî'nin hadislerin teâruzu halindeki tutumu, ayet ve hadislerle istidlâl yöntemi, icma' ve aklı kullanış şekli ile hüküm çıkarma metodu hakkında bilgiler verilmiştir. Sonuç kısmında ise araştırmanın neticesinde varılan kanaat ve tespitler ortaya konmaya çalışılmıştır. Ayrıca araştırmada Hanefî fakihi Leknevî'nin fıkhî meseleleri kendi mezhebi dışındaki âlimlerin görüşlerine de yer vererek tüm boyutlarıyla ele alma gayretinde olduğu gözlemlenmiştir. Bunun yanı sıra rivâyetlerin sıhhat ve zayıflığını gözardı etmeksizin hadis ve sünnete oldukça bağlı kaldığı ve kendisinden önceki âlimlerin düşüncelerine ehemmiyet göstererek deliller arasındaki ihtilâfları gidermeye çalıştığı görülmüştür."
