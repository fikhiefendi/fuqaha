abstract: "Bu çalışma, boykot kavramını İslâm hukuku perspektifinden ele alarak tarihsel, kavramsal ve fıkhî boyutlarıyla incelemeyi amaçlamaktadır. Çalışmada öncelikle boykot kavramının tanımı yapılmış; abluka, ambargo ve muhâsara gibi benzer kavramlarla ilişkisi değerlendirilmiştir. Ardından siyasî, sosyal, kültürel ve ekonomik boykot türleri ele alınmış; İslâm tarihinde müşriklerin Hz. Peygamber'e uyguladığı boykot, Tebük Seferi'ne katılmayan sahâbîlere yönelik uygulamalar ve Sümâme b. Üsâl örneğinde olduğu gibi tarihî hadiseler incelenmiştir. Ayrıca çağımızda Danimarka, Fransa ve İsrail'e yönelik boykot hareketleri değerlendirilmiştir. Çalışmanın ikinci bölümünde boykotun İslâm hukukundaki hükmü Kur'an, Sünnet, mesâlih-i mürsele ve sedd-i zerâi' gibi şer'î deliller çerçevesinde analiz edilmiştir. Bunun yanında çağdaş âlimlerin bireysel ve kolektif fetvaları incelenerek boykotun meşruiyeti değerlendirilmiştir. Sonuç olarak bu çalışma, boykotun şartlara göre meşru bir tepki ve baskı yöntemi olarak değerlendirilebileceğini; özellikle zulmü engelleme, müslümanların maslahatını koruma ve haksızlığa karşı tavır alma amacı taşıdığında dinî açıdan önemli bir araç olma niteliği üstlendiğini ortaya koymaktadır."
