abstract: "Bu tez, bir giriş ve üç bölümden oluşmaktadır. Girişte tezin önemi, amacı, konunun kapsamı ve sunumu ele alınmıştır. Birinci bölümde, nikâhın tanımı, hükmü, nikâh akdinin unsur ve şartları, kefâet, kefâetin hükmü ve mezheplerin kefâetle ilgili görüşleri ve kefâetin olmaması durumunda oluşacak hukuki sonuçlar açıklamaya çalışılmıştır. İkinci bölümde, evlilik sonrasında ailenin devamlılığını sağlayan hukuki unsurlar; nafaka, çocuğu emzirme, cinsi ihtiyacı karşılama gibi eşlerin karşılıklı olarak birbirine karşı görev ve sorumlulukları, birbirlerinin ailelerine karşı görev ve sorumlulukları, evlilikte ileri sürülen şartlar, riayet edilmesi gereken ve gerekmeyen şartlar, eşlerin birbirlerine karşı itaatleri, nüşuz ve şikâk kavramlarından sonra eşlerin konu ile ilgili anlaşmazlıklarda hakeme gitmesi gibi konular hakkında bilgi verilmiştir. Üçüncü bölümde, evlilik sonrasında ailenin devamlılığını sağlayan ahlaki ve manevi unsurlar; karı-koca arasında rahmet ve meveddet, ahlaki ve manevi değerler, eşlerin birbirine verdiği sıkıntıya sabır göstermek, eşlerin birbirlerini Allah için sevmeleri, manevi değerlere inanan insanların ebedi âlemde de bir araya gelebilecekleri, sadakat, vefakâr, fedakâr vb. konular sunulmuştur."
