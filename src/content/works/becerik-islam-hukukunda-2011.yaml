abstract: "İslam ceza hukukunda suçun tekerrürünün incelendiği bu çalışma giriş, üç bölüm ve sonuç kısmından oluşmaktadır.“İçerik ve Yöntem”başlığı altında konunun önemi ve konunun sınırlan hakkında bilgi verilmiştir. Bunun yanında kullanılan kaynaklar değerlendirilmiştir. Bundan sonra suçun tekerrürünün de içinde bulunduğu cezayı ağırlaştıran sebepler hakkında bilgi verilmiştir. Konunun anlaşılması amacıyla genel bilgilerin verildiği birinci bölümde, tekerrür kavramı açıklanmaya çalışılmıştır. Daha sonra cezaların içtimai, suçta itiyad gibi tekerrüre benzeyen kavramlarla tekerrürün ilişkisi incelenmiştir. Ardından tekerrürün uygulanmasında yöneticinin rolü konusu siyasetüş-şeriyye kavramı çerçevesinde incelenmiştir. İkinci bölümde Tekerrür hükümlerinin uygulanması için gereken şartlar incelenmiştir. Daha sonra tekerrürün çeşitlerine değinilmiş ve İslam ceza hukukunun bu konudaki tercihlerine değinilmiştir. Üçüncü bölümde ise tekerrürün cezayı nasıl ağırlaştıracağı incelenmiştir. Sonuç bölümünde ise genel değerlendirme yapılarak ulaşılan sonuçlar belirtilmiştir."
