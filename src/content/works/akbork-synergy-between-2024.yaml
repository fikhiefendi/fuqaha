abstract: "Girişim semayesi (VC) genç, yenilikçi ve büyüme potansiyeli taşıyan şirketlere finansman kaynak ve profosyonel destek sağlayan özkaynak temelli bir finansal enstrumandır. VC farklı kavramsal çerçevelerde ifade edilse de, temel olarak sermaye sahipleriyle ile girişimcilerin bir iş üzerinde ortaklık kurmasını sağlayan bir mekanizma olarak tanımlanmaktadır. Bu mekanizma süreç içinde farklı sektörlerde çok sayıda yenilikçi fikir somut projelere dönüştürmüş, şirketlerin büyümesinde ve kurumsallaşmasında katalizör görevi görmüştür. Tarihsel süreçte VC bireysel çabalar ve ilişkiler üzerine inşaa edilmiş bir model iken günümüz ekonomisinde başta Silikon Vadisi olmak üzere birçok teknoloji merkezinde aktif olarak kullanılan, profesyonel fonlar, yatırım ortaklıkları ve aracı kuruluşlar vasıtasıyla beslenen bir ekosistem haline gelmiştir. VC faiz ve borç temelli bir finansal araçtan ziyade ortaklık ve varlık temelli ekosistem vaad ettiği için İslami finansın ruhuna uygun bir yatırım stratejisi sunmaktadır. Dahası, VC yatırım patikası İslam ekonomisinin ortaklık temelli finansal enstrumanlarından mudarabah ve musharakah ile oldukça benzer bir program çerçevesinde işleyen bir süreçtir. Türkiye bağlamında VC, özellikle son yıllarda yabancı fonların ve yatırımcıların öne çıktığı, yerli yatırımların ise VC fonları (VCIFs) , VC yatırım ortaklıkları (VCITs), kitle fonlama platformları ve melek yatırımcı ağlarıyla ekosisteme dahil olduğu bir akış çerçevesinde işlemektedir. Türkiye'de VC ekosistemi son yıllarda atılım yapmış ve Avrupa'nın en hızlı büyüyen yatırım sahalarından birisi olmuştur. Bu atılım sürecinde Getir, Dream Games, Insider gibi girişimlere yapılan montanlı yabancı yatırımların etkili olduğu gözlemlenmiştir. VCIFs ve VCITs yatırımlarında da son yıllarda Türk Lirası bazında sert bir artış trendi yakalandığı görülmektedir. Bununla birlikte son yıllarda yaşanan döviz şoklarına karşın bu yatırım enstrumanlarının USD bazında da potansillerini korudukları gözlemlenmiştir. Yurtiçi yatırımlar detaylı olarak incelenmiş olup bilgi teknolojilerinin (IT) yanı sıra sağlık, enerji, iletişim gibi geleneksel sektörlere de yatırım yapıldığı dikkat çekmiştir. İslam finansal kuruluşlar bağlamında, katılım bankaları bankacılık sektörünün içsel koşulları sebebiyle VC yatırım süreçlerine dahil olamamaktadır. Bu içsel koşullar ele alınacak olursa, öncelikle VC bir bankacılık enstrumanı değil bir sermaye piyasası aracıdır. Bu sebeple Türkiyedeki bankacılık sisteminin tabi olduğu kanuni ve idari rejim tabi olunan yasalar, düzenleyici denetleyici kurumlar yönünden sermaye piyasası ekosisteminden ayrışmaktadır. İkinci olarak, bankacılık sektörü kısa vadeli mevduat yapısına sahip iken VC ekosistemi uzun vadeli fonlardan oluşmaktadır. Dolayısıyla bankacılık sektörünündeki kısa vadeli mevduatların uzun vadeli yatırımlara yöneltilmesi vade uyumsuzluğu ve finansal rasyoların bozulması gibi bir takım finansal riskler doğurmaktadır. Üçüncü olarak VC ekosistemi çoğunlukla riskli yatıımlardan oluştuğu muhtemel başarısız yatırımlar için bankalar için itibar riskine sebebiyet verebilmektedir. Öte yandan katlım bankaları geçici musharakah gibi enstrumanlar vasıtası ile proje bazlı uygulamalarıyla ekosisteme katkı sunmaya başlamışlardır. Katılım bankacılığı sermayesi ile sürdürülen uzun vadeli girişim sermayesi yatırımları ise katılım bankalarının iştiraki olarak kurulan portföy yönetim şirketleri bünyesinde gerçekleşmektedir. Bu tezde VC-dünya ekonomisi, VC-İslam ekonomisi, VC-Türkiye ekonomisi, VC-Türkiye'deki İslami finansal kurumlar olmak üzere dört farklı bağlam üzerinde ele alınarak VC'nin Türkiye özelinde Katılım Finans Ekosistemi içindeki mevcut durumu, gelişimi ve potansiyeli ortaya konulmaya çalışılmıştır. VC'nin Türkiye Finans Sistemi içindeki durumu, açık kaynaklardan alınan verilerle desteklenmiş ve sektör paydaşları ile yapılan anket ve mülakatlarla beslenmiştir. Söz konusu bağlamlar üzerinde tezin amacı ve araştırma soruları ile uyumlu olarak gerçekleştirilen bu çalışma neticesinde sonuçlar analiz edilmiştir. Son olarak, araştırmacılara ve sektör paydaşlarına bir takım politika önerileri sunulmuştur."
