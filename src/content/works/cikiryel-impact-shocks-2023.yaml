abstract: "Bankalar, parasal aktarım mekanizmasına olanak sağlamak ve tasarruf sahipleri ile borçlananlar arasında aracılık yapmak gibi ekonomide birçok önemli rol oynayarak finans sektöründe merkezi bir konuma sahiptir. Öte yandan petrol, ekonomik hayatın en önemli girdilerinden biridir. Petrol piyasasındaki dalgalanmalar ekonomik istikrarsızlığın ana kaynağı haline gelerek makroekonomik ve mikroekonomik göstergelerin bozulmasına neden olmaktadır. Ekonomideki kritik rolleri nedeniyle petrol ve banka performansı arasındaki ilişki araştırmacıların, bankacıların, piyasa katılımcılarının, politika yapıcıların ve düzenleyicilerin dikkatini çekmektedir. Petrol şokları ve banka performansı arasındaki ilişkiyi inceleyen ve giderek genişleyen bir literatür vardır. Ancak önceki çalışmalar petrol şoklarının banka karlılığı üzerindeki etkisini ya petrol ihraç eden ülkeler ya da tek bir ülke perspektifinden ele almıştır. Mevcut çalışma önceki araştırmaları bir adım öteye taşıyarak literatürdeki boşluğu doldurmayı hedeflemektedir. Bu çalışma petrol şoklarının banka performansı üzerindeki etkisini net petrol ithal eden ülkeler açısından, banka türleri arasındaki farklılıkları dikkat alarak incelemektedir. Çalışmada karlılığın sürekliliğini (kalıcılığını) ve içselliği kontrol etmek için dinamik panel metodu (genelleştirilmiş momentler metodu) kullanılmaktadır. Bu araştırma, petrol şoklarının banka karlılığı üzerinde hem doğrudan hem de dolaylı etkilerinin olduğunu ortaya koymuştur. Enflasyon, ekonomik büyüme ve reel efektif döviz kurunun, petrol şokları ve banka performansı arasında aktarım mekanızması işlevi gördüğünü tespit etmiştir ve bu durum banka türlerine göre değişiklik göstermektedir. Petrol şokları ve banka performansı arasındaki ilişkiyi bilmek, bankacılara, hükümet yetkililerine ve para otoritelerine finans sektörünün istikrarı için stratejiler belirlemede ve etkili politikalar geliştirmede yardımcı olacaktır."
