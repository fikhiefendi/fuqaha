abstract: "Bu çalışma, Türkiye'deki mevat arazilerin ekonomiye kazandırılmasının İslami ve ekonomik boyutlarına odaklanmaktadır. Arazilerin kullanımı ve yönetimi, sürdürülebilir kalkınma açısından büyük önem taşırken, ekonomik olarak değerlendirilmeyen mevat araziler yerel ve ulusal ekonomiler için kayıp fırsatlar anlamına gelmektedir. Çalışmanın amacı, mevat arazilerin ekonomiye entegrasyonunun engellerini kapsamlı bir şekilde değerlendirmek ve İslami açıdan ihyâu'l-mevât kavramı çerçevesinde çözümler sunmaktır. Çalışmada mevât arazilerin ihyâsı sürecinde yer alan ilgili kamu kurumu yetkilileri, hukukçular ve ihya faaliyetini gerçekleştirenlerle yapılan yarı-yapılandırılmış mülakatlar içerik analizi yöntemiyle analiz edilmiştir. Çalışma, ihyâu'l-mevât kavramı çerçevesinde atıl arazilerin değerlendirilmesi konusunda Türkiye'deki güncel durumu tespit etmeyi hedefleyerek literatüre katkı sağlamayı amaçlamaktadır."
