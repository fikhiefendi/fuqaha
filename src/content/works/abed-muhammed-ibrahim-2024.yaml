abstract: "Bu çalışma, İslam hukukunda“nesh”kavramının fakihler arasındaki ihtilaflara nasıl etki ettiğini incelemektedir. Nesh, İslam hukuku kapsamında bir hükmün başka bir hükümle değiştirilmesi anlamına gelir ve bu durum fakihler arasında önemli görüş ayrılıklarına yol açmıştır. Araştırmanın odak noktası, Muhammed İbrahim b. Serkend'in nesh konusundaki görüşleri ve bu görüşlerin fıkhî ihtilaflara etkisidir. Çalışmada, neshin tanımı, tarihsel gelişimi, türleri ve meşruiyeti ele alınmış, ayrıca nesh iddialarının nasıl ortaya çıktığı ve bu iddiaların fakihler arasındaki ihtilaflara nasıl etki ettiği incelenmiştir. Literatür taraması ve belge analizi yöntemleri kullanılarak, nesh kavramı ve fıkhî ihtilaflar hakkında detaylı bilgi toplanmış, Muhammed İbrahim b. Serkend'in görüşleri diğer fakihlerin görüşleriyle karşılaştırılmıştır. Araştırma sonuçlarına göre, neshin doğru bir şekilde anlaşılması ve uygulanması, İslam hukukunun daha iyi anlaşılması ve uygulanması açısından büyük önem taşımaktadır. Muhammed İbrahim b. Serkend'in nesh konusundaki görüşleri, özellikle farklı mezhepler arasındaki anlaşmazlıkların çözümünde önemli bir rol oynamaktadır. Bu çalışma, nesh kavramının fakihler arasındaki ihtilaflara etkisini detaylı bir şekilde ele alarak, İslam hukukunun dinamik yapısını ve bu yapının fıkhî yorumlar üzerindeki etkisini ortaya koymaktadır."
