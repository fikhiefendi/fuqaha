abstract: "Psikolojinin ve felsefenin temel kavramlarından birisi olan bilinç, genellikle insanın kendisinin ve çevresinin farkında olması şeklinde tanımlanmaktadır. Bilinç kavramının çıkış noktası psikoloji ve felsefedir. Bununla beraber, bilincin hukuk ilminde de önemli bir yeri vardır. İslâm hukukunda sıkça kullanılan akıl, temyiz gücü ve irade gibi önemli kavramlar bilinçle yakından ilişkilidir. Ayrıca uyku, rüya, hipnoz, baygınlık ve sarhoşluk gibi hukukî açıdan önemli sonuçlar doğuran pek çok kavram aslında bilincin değişik birer görünümünden ibarettir. Bilincin tam veya bozuk olmasının yanı sıra haram ya da helâl yolla bozulmuş olmasının da önemli fıkhî etkileri vardır."
titleTranslation: {"en": "The effect of the consciousness on the rights and the responsibilities in Islamic Law"}
