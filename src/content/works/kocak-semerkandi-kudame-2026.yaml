abstract: "Bu çalışmada, fıkıh usûlü asli delillerinden biri olan icmâ, klasik döneme ait iki önemli kaynak metin üzerinden tahlil edilmiştir. Araştırmanın temel problemini, fıkıh usûlü tarihinde fukahâ ve mütekellimîn olarak adlandırılan iki ana yazım metodunun yapısal sınırları ve bu ekollerin birbirleriyle olan yöntemsel etkileşim boyutları oluşturmaktadır. Çalışmada, Alâeddin es-Semerkandî'nin Mîzânü'l-usûl'ü ile Muvaffakuddin İbn Kudâme'nin Ravzatü'n-nâzır adlı eserlerindeki icmâ bölümleri karşılaştırmalı bir yaklaşımla ele alınmıştır. Bu incelemeyle, memzûc metod henüz fiilî olarak ortaya çıkmadan önce literatürde var olan erken dönem yöntemsel geçişkenliklerin ortaya konulması amaçlanmıştır. Araştırma sürecinde ilgili bölümler merkeze alınarak elde edilen veriler ortak bir başlıklandırma sistemi altında mukayeseli bir analiz yapılarak incelenmiştir. Araştırma neticesinde elde edilen bulgular, her iki müellifin de şer'î deliller sıralamasında icmâı üçüncü sıraya yerleştirme hususunda cumhurun safında yer alarak ittifak hâlinde olduklarını göstermiştir. Bununla birlikte, eserlerin mimari yapısında, kavramsal çerçeveyi çizme usûllerinde ve delillendirme yöntemlerinde yer yer kendi metot çizgilerini aşan dikkate değer yaklaşımlar tespit edilmiştir. Mensup olduğu mezhebin pratik fıkıh merkezli yapısını yansıtmasıyla beraber Semerkandî'nin, icmâın kesinliği, asrın tükenmesi ve sükûtî icmâ gibi belirli başlıklarda zihnî kesinliği merkeze alan soyut bir mütekellimîn muhakemesine kapı araladığı müşahede edilmiştir. Buna mukabil, teorik kurgu ve sistematik yönüyle öne çıkan Ravzatü'n-nâzır'da İbn Kudâme'nin ise, sükûtî icmâı temellendirirken, inkırâz şartını ve çoğunluk otoritesini reddederken sahâbîlerin somut ictihad örneklerini ve amelî gerçekliği öne sürerek hukuki sürekliliği gündeme getiren pratik bir fukahâ refleksine yaklaştığı görülmüştür. Ulaşılan nihai sonuçlar, her iki eserin de tek bir metot seyri içinde değerlendirilmesinin eksik kalacağını ve klasik usûl literatüründeki genel tasniflerin ötesinde metotlar arası bir geçişkenliğin bulunduğunu ortaya koyar niteliktedir. Çalışmada yapılan yöntemsel incelemeler ve ülkemizde Ravzatü'n-Nâzır eseri üzerine doğrudan akademik düzeyde bir lisansüstü çalışmaya rastlanamaması araştırmanın özgün yönünü oluşturmaktadır."
