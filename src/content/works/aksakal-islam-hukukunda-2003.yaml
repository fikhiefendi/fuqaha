abstract: "ÖZET YÜKSEK LİSANS TEZİ İSLAM HUKUKUNDA KADINLARIN SİYASAL HAKLARI Sultan AKSAKAL KSÜ SOSYAL BİLİMLER ENSTİTÜSÜ TEMEL İSLAM BİLİMLERİ ANABİLİM DALI DANIŞMAN: Yrd. Doç. Dr. Nuri KAHVECİ Yıl: 2003 Sayfa: 113 Jüri: Prof.Dr. H. Ezber BODUR Yrd.Doç.Dr. Nuri KAHVECİ Yrd.Doç.Dr. İzzet SARGIN Hak ve hukuk kavranılan, toplumların kültürlerinden, sosyal yaşantılarından ve felsefelerinden etkilenerek gelişim göstermiştir. Geçmiş dönemlerde bu kavramların realiteye dönüştürülmesi sırasında 'cinsiyet ayrımı' önemli derecede etkin olmuş ve kadınların varlığı sürekli olarak göz ardı edilmiştir. Bu durum son zamanlarda feminizm akımının doğmasında etkin olmuştur. Böylece kadınlar, gerekli haklarını hem elde etmek hem de kullanmak için aktif hale gelme çabası içerisine girmişlerdir. Buna paralel olarak kadınların devletin bütün yapılanmalarında söz sahibi olmalarım sağlayan siyasal haklar alanında da gözle görülür bir gelişme kaydedilmiştir. Müslüman toplumların uygulamalarının aksine din olarak İslam ve doktrin olarak İslam hukukunda hakların edimi ve kazanımında ne erkek ne de kadın için bireysel ayrıcalıklar bulunmaktadır. Bilakis, hakları kullanmada ehliyet sahibi olma, temel şart olarak gösterilmekle birlikte insana hizmet edecek sosyal şartlardan hareketle toplum düzenini bozmayacak önemli kararlar alırken elbette yine toplumsal şartların oluşturduğu gerçeklerle hareket etme fikirlerin ortak paydası olmuştur. Dolayısıyla bundan ne kadm ne de erkek soyutlanabilir. Çünkü önemli olan, hukukun insana hizmet etmesi, insanın ise gerçek hukuku uygulatacak davranışlarla hukuka yön vermeye çalışmasıdır."
