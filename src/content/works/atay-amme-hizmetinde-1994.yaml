abstract: "Tez esas olarak giriş, dört bölüm ve sonuçtan oluşmaktadır. Girişte kısaca çalışmanın çerçevesi, yöntem ve kaynaklar üzerinde durulmuştur. Birinci bölümde iki ana başlık altında eski medeniyetler ve eski semavi dinler den konunun tarihi seyri incelenmiştir. İkinci bölümde Türk Medeni Hukuku ve bazı çağdaş beşeri hukuk sistemlerin de kadına bakış özet olarak gözden geçirilmiştir. Üçüncü bölümde fizyoloji ve psikolojik açıdan kadın başlığı altında, kadın ve erkek arasındaki farklılıklar hakkında kaynakların imkan verdiği ölçüde modern bilimin verileri değerlendirilmiştir. Dördüncü bölüm esas bölümü teşkil etmektedir ki islam hukukunda durum in celenmiştir. Bu bölüm kendi içinde üç alt başlığa ayrılmaktadır. İlk başlık altında kadının her türlü kamu hizmetinde görev almasına karşı çıkanların ileri sürdükleri deliller ve görüşler üzerinde durulmuştur, ikinci başlık kadının kamu hizmetinde görev almasını bazı alanlarda kabul edenlerin delillerini ve görüşlerini içermektedir. Son olarak bütün alanlarda kadının kamu hizmeti yapabileceğini kabul edenlerin görüşleri ve delilleri incelenmiştir. İncelemelerimiz ışığında varabildiğimiz değerlendirmeleri içeren sonuç bölümü ile tez sona ermektedir."
