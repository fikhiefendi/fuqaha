abstract: "Bu tezde Hanbelî mezhebi nezdinde aile hukuku alanındaki icmâlar tespit edilmiş ve bunların diğer üç mezhep nazarındaki hükümsel durumu ortaya konmaya çalışılmıştır. Bu çalışma icmâ ile ilgili tartışmalardan soyutlanarak Hanbelîlerin icmâ olarak tanımladığı bir konuyu diğer üç mezhebin nasıl nitelediğini ortaya koymaya yöneliktir. Bu kapsamda birinci bölümde evlilik öncesi süreçte evlenme engelleri, nikâhın rükünleri, şartları, hitbe ve düğün konularına dair hanbelî literatüründe görülen icmâlar tespit ve analiz edilmiştir. Bunun ardından ikinci bölümde evlilik sonrası süreç bağlamında mehir, nafaka ve hidane gibi başlıklar altında ilgili icmâlar tespit ve analiz edilmiştir. Üçüncü bölümde ise evliliğin sona erme süreci kapsamında, talak, fesih, îlâ, zıhar, muhâlea, mefkud, iddet ve ihdâd kavramları ekseninde Hanbelî literatüründe görülen İcmâlar belirlenmiş ve bu icmâlarda ilişkin diğer mezheplerin yaklaşımları analiz edilmiş, sonuç kısmında elde edilen verilere sunularak araştırma tamamlanmıştır."
