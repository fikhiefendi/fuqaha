abstract: "Ḫalîl Ahmed Sehârenpûrî (ö. 1346/1927), yirminci yüzyıl Hindistan hadis âlimlerinin en önemlilerinden biridir. Bütün İslâmî ilimlerde kendini kanıtlamasının yanında özellikle hadis ilminde temayüz etmiştir. Hayatını, dinin ikinci kaynağı konumunda olan hadis ilmine adamış bir âlim olan Sehârenpûrî, Buḫârî ve Müslim'den sonra üzerinde en fazla çalışma ve şerh yapılan hadis kitapları arasında bulunan Sünen-i Ebî Dâvûd'a, tezimizin de konusu olan Bezlü'l-mechûd fî Halli Sünen-i Ebî Dâvûd adıyla yazdığı şerhle İslâm dünyasında tanınmıştır. İşte İslâm âlemi nezdinde özellikle bu eseriyle tanınmış bir âlim olan Sehârenpûrî'yi tanımak, kendisini ve eserini dünyaya tanıtmak maksadıyla bu tez çalışması yapılmıştır. Tezimiz bir giriş, iki bölüm ve bir sonuçtan oluşmaktadır. Giriş bölümünde şerh metodu incelenen eserin ilmî değerinin bilinmesi için eserin ortaya çıkış serüveni, konu amacı ve tezin yöntemi ve tezi ile ilgili yazılış süreci bilgilerine yer verilmiştir. Birinci bölümde müellifin yaşadığı dönemin siyasî yapısı, sosyal, dini hayatı, ilmî ve kültürel durumu, ilmi şahsiyeti, eserleri hakkında bilgiler verilmiş ve ayrıca Beẕlül-i Mechûd'un müellifi Sehârenpûrî'nin hadis, fıkıh ve tasavvuf yönü ayrıntılı olarak ele alınmıştır. İkinci bölümde Beẕlül-i Mechûd'un kaynakları tanıtılmış ve tasnif edilmiş; Sehârenpûrî'nin bu kaynaklardan naklettiği rivayetlerde kullandığı ifadeler ve bunları ne ölçüde kullandığı hakkında bilgiler verilmiştir. Ayrıca Sehârenpûrî'nin şerh metodunun yapısal özellikleri de hadisleri nasıl yorumladığı örneklerle açıklanmaya çalışılmıştır."
