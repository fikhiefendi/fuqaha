abstract: "Bu çalışma, kamusal iç borçlanma konusunu tarihsel olarak değerlendirmeyi ve bu bağlamda özgün bir kaynak olan Ahmet Ragıp'ın“Altın Düyûnat Meselesi”(1921) adlı eserini tahlil etmeyi amaçlamaktadır. Osmanlı Devleti'nin iktisadi ve mali politikalarının etkisiyle kullanılan borçlanma araçları, borçlanmaların sosyo ekonomik etkileribu araştırmanın temelini oluşturmaktadır. Osmanlı Devleti'nde XVI. Yüzyıl ve XX. yüzyıl aralığında iltizam, malikane ve esham gibi iç borçlanma araçları ile sonrasında devleti dış borçlanmaya götüren nedenler tarihsel verilerin ışığında incelenmiştir. Bilhassa XIX. yüzyılda dış borçlanmaya başlanması ve bu borçların artması, Duyun-u Umumiye İdaresi'nin kurulmasıyla iktisadi bağımsızlığın büyük ölçüde kaybedilmesi hususu değerlendirilmiştir. Ahmet Ragıp'ın“Altın Düyûnat Meselesi”(1921) adlı eseri, döneminde kamu iç borçlanması hususunda yapılan yanlışların eleştirildiği, altın karşılığı borçlanma mevzusunun şer'i, hukuki, iktisadi ve ahlaki boyutları ile değerlendirildiği, borcun ödenmesi hususunun İslam Hukuku perspektifinden ele alınması gibi yönleriyle önemli bir kaynaktır. Bu bağlamda, çalışma kapsamında borçlanma konusuna inter disipliner bir bakış açısı sunan bu eser de tahlil edilmiştir."
