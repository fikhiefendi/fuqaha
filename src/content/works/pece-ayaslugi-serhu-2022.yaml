abstract: "Hanefî fıkıh literatüründe dört temel metin (mütûn-i erbaa) olarak kabul gören kaynaklar önemli bir yer işgal etmektedir. Bunlardan biri, Muzafferüddîn İbnü's-Sââtî'ye (öl. 694/1295) ait Mecma'u'l-bahreyn adlı eserdir. Tezde bu metnin Mehmed b. Yûnus el-Ayaslûgî'ye (öl. 831-850/1427-1446) ait Şerhu Mecma'i'l-bahreyn isimli eserin tahkik ve tahlili yapılmıştır. Bu eserle ilgili daha önce yapılan ulusal veya uluslararası bir çalışma bulunamamıştır. Araştırmalarımızda eserin dört nüshasına ulaşılabilmiştir. Bu dört nüshadan biri Ayaslûgî'ye ait olduğundan asıl nüsha kabul edilmiştir. Diğer üç nüsha ile de karşılaştırma yapılarak eserin en orijinal şekliyle ortaya çıkarılması sağlanmıştır. Tahlil aşamasında ise eserin sistematiği, muhtevası, konuların işleniş tarzı, Ayaslûgî'nin kendisine ait görüşleri, eserde yer verilen genel kaideler vb. konular ele alınmıştır. Anahtar Kelimeler: Sââtî, Mehmed, Ayaslûgî, Mecmâ, Bahreyn"
