abstract: "Çalışma başlığı“İslam Ceza Hukuku ve Irak Kanunlarında Kürtaj Hükmünün Karşılaştırılması”dır. Ceninin anne karnında oluşmaya başlamasından itibaren öldürülmesini engellemek için, konunun şer`î ve hukukî açıdan irdelenmesi gereklidir. Araştırmanın gayesi cenin öldürülmesiyle ilgili hükümlerin açıklanması ve Irak kanunlarının bu konu hakkındaki tutumunu açıklamaktır. Aynı zamanda İslam şeriatının ve Irak kanunlarının nesli korumaya verdiği değeri görmektir. Bunun sağlanması cenini koruyup onun zarar görmesini engelleyen şer`î hükümler ve kanun maddeleri ile mümkündür. Kürtaj için birçok gerekçe oluştuğunda, şer`î ve kanunî olarak ceninin öldürülmekten tamamen korunup korunmayacağı problemi de araştırmanın kapsamındadır. Oluşumunun her aşamasında kürtaj yapılması halinde cenini ilgilendiren hükümler çalışmada ifade edilmektedir. Kürtajla ilgili zaruri durumlardan ve bunların kurallarından bahsedilmektedir. Ardından kürtaj konusunda kadınları ilgilendiren hükümler açıklanmaktadır. Çalışmada suçlunun ödeyeceği bedel ve yine suçlunun, gerek anne, gerek doktor, gerekse bir başkası olsun fark etmeksizin, yüklendiği kanunî sorumluluktan bahsedilmektedir. Bu bedel miktarı, geçerliliği ve çokluğu bakımlarından tasnif edilmiştir. Kürtajın mirasa etkisi ve Irak kanunlarının kürtaj suçu hakkındaki tutumu aynı şekilde çalışmada tasnif edilmektedir.“Suçlunun niyeti”nin şer`î ve kanunî açılardan ne anlama geldiği ve kürtaj suçuna sevk eden nedenler açıklanmıştır. İslam şeri`atinin ve Irak kanunlarının cenini korumaya çalıştığı ve ona zarar verilmesini suç kabul ettikleri ifade edilmiştir. Kürtaja dair konular ilgili kanun maddeleri üzerinden karşılaştırma, tümevarım ve tahlil yöntemleriyle çalışılmış, son olarak elde edilen şu sonuçlar yazılmıştır: Suçlunun kürtaj işlemini kasten yapıp yapmadığında şüphe olsa dahi, ona kısas uygulanmayacağı konusunda şeriat ve yasalar görüş birliği içindedir. Kürtajın kasten yapılmış olması durumunda diyeti başkasından değil suçludan tahsil edilir. Suçluya en ağır yasal cezalar uygulanır."
