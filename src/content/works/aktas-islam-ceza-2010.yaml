abstract: "Bu çalışma, İslâm ceza hukukunda akrabalığın suç ve cezaya etkisini incelemeyi amaçlamıştır. Daha açık bir ifadeyle, suç fâili ile mağdur arasında herhangi bir akrabalık ilişkisinin var olduğu durumlarda, fiilin suç kabul edilmesi ve cezalandırmadaki değişimler ele alınmıştır.?İslâm Ceza Hukuku Hükümlerinin Uygulanmasında Akrabalığın Rolü? başlığını taşıyan bu çalışma, giriş ve üç bölümden oluşmaktadır. Giriş bölümünde araştırma hakkındaki amaç, yöntem ve teknik bilgilere değinilmiştir. Birinci bölümde ceza ve akraba kavramlarının mahiyetleri ve genel olarak İslâm hukukunda cezalar incelenmiştir. Sırasıyla ikinci ve üçüncü bölümlerde ise akrabalığın suça ve cezaya etkisi ayrıntılı olarak ortaya konmaya çalışılmıştır.Bu çalışmadan elde ettiğimiz en önemli sonuç, akrabalığın, cezaya, kimi zaman doğrudan, kimi zaman dolaylı olarak etkisinin olduğudur. Bu etki de kendisini, cezaların düşmesi veya ağırlaşmasında gösterir. Buna ilâveten cezaların düşmesi veya ağırlaşmasında, cezalandırma amaçları çok önemli bir rol oynar."
