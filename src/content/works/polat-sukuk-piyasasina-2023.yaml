abstract: "Din, yalnızca inanç ve ibadetlerle sınırlı kurallar sistemi değildir. İslam dini de diğer dinlerde olduğu gibi yaşamın farklı alanlarına yönelik hükümler içermektedir. Bu alanlardan biri de finastır. Temelde faiz yasağı üzerine kurgulanan İslami finans sistemi, geçmişten günümüze kadar gelen süreçte önemli aşamalar kaydetmiştir. Müslüman nüfusunun artışı, İslami farkındalığın artması, Müslümanların gelir seviyesindeki iyileşmeler, Müslümanların finans sistemine entegre olma isteği gibi temel nedenler İslami finansın gelişimini desteklemiştir. İslami finansa olan ilgiyle beraber yeni finansman kaynakaları da ortaya çıkmaya başlamıştır. Bu kaynaklardan biri de faizsiz bono olarak adlandırılan sukuktur. Nispeten yeni bir finansman aracı olan sukuk, konvansiyonel finans araçlarına alternatif bir enstürman olma noktasında önemli gelişimler kaydetmiştir. Günümüzde Müslüman nüfusun yoğun olduğu bölgelerin yanı sıra uluslararası borsalar da işlem görmeye başlayan bu enstürman giderek yaygınlaşmaktadır. Ancak sukuk piyasasındaki bu gelişime rağmen henüz daha birçok ülkenin sukuka ilişkin yasal çerçevenin oluşturulması noktasında yetersiz kaldığı bilinmektedir. Özellikle sukukun kendine has yapısı nedeniyle diğer finansal araçlardan farklı bir vergilendirme rejimine tabi tutulması noktasındaki düzenlemeler yetersizdir. Bu çalışmanın odak noktası sukuk piyasasına yönelik vergilendirme rejiminde yaşanan gelişmelerin incelenmesidir. Bu kapsamda sukuk piyasasında önde gelen ülkelerdeki yasal çerçeve ve vergilendirme rejimleri incelenmiş, Türkiye ve diğer ülkelerdeki durum hakkında karşılaştırmalar yapılmıştır. Çalışmanın sonucunda Türkiye'nin sukuk açısından benimsemiş olduğu tarafsız vergilendirme rejimi olumlu olarak değerlendirmekle birlikte bu noktada tarafsız vergilendirmenin ötesinde sukuka yönelik olarak geleneksel tahvillerden farklı teşvik politikalarının oluşturulması önerilmiştir."
