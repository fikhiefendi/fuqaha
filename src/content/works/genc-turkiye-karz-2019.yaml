abstract: "Borç, tarihin her döneminde insanlar arası var olmuş bir ilişkidir. Borç ilişkisinin doğasında olan hiyerarşik yapı, borç verenlerin bu ilişkiden menfaat elde etmesine sebep olmaktadır. Günümüz finansal sisteminde faizli borç tam olarak bu menfaate karşılık gelmektedir. Çoğunlukla faize dayanan borç işlemleri bazı iktisadi ve toplumsal sorunlara yol açmaktadır. Oysa İslam'da faiz yasaklanmıştır. İslami iktisat borç konusunda karz-ı haseni tavsiye etmektedir. Karz-ı hasen güzel bir borç anlamına gelmekte, fıkhi olarak misli bir malın aynı miktarda geri ödenmek üzere verilmesini ifade etmektedir. Karz-ı hasenin temel amacı Allah rızasını kazanmak ve borç alanın ihtiyacının giderilmesini sağlamaktır. Karz-ı hasen, kâr sağlayan bir işlem olmadığı için İslami finansta oldukça sınırlı bir alanda gerçekleştirilmektedir. Karz-ı hasen uygulamaları daha çok sivil toplum kuruluşları, İslami mikro finans kurumları ve yardımlaşma sandıkları üzerinden işlemektedir. Ayrıca karz-ı hasen, bireylerin yakın çevresiyle, güvendiği kişilerle gerçekleştirdiği bir işlem olabilirken, bireylerin grup olarak yaptıkları gün ve sandık uygulamaları da karz-ı hasen örnekleri arasında yer alır. Bu çalışmanın temel amacı resmi ve resmi olmayan karz-ı hasen sandıklarının kuruluş amaçlarını ve işleyiş süreçlerini ortaya koymaktır. Çalışmada üçü resmi ve dördü resmi olmayan yedi karz-ı hasen sandığı örneği ele alınmıştır. Bu örnekler hakkında derinlemesine bilgi edinmek amacıyla nitel araştırma yöntemi olan fenomonolojik yaklaşım tercih edilmiştir. Yaygın ve ortak deneyimlerden yola çıkarak karz-ı hasen sandığı fenomeninin anlaşılması ve yorumlanması amacıyla sandık yöneticileri ve üyeleriyle yarı yapılandırılmış mülakatlar gerçekleştirilmiştir. Sandıklar kuruluş süreçleri, fon toplama yöntemleri, fon kullandırma kuralları ve sürdürülebilirlik önlemleri açısından değerlendirilmiştir. İncelediğimiz sandıkların hem uzun süreli tecrübeleri hem de başarılı ve özgünlükleri açısından İslami iktisat literatürüne önemli katkılar sağlaması beklenmektedir."
