abstract: "İşletmelerin rekabetçi ortama uyum sağlamaları noktasında personelleri çok önemli bir yere sahiptir. Bu bağlamda personel güçlendirme kavramı her geçen gün daha da öne çıkmaktadır. Bu çalışma, katılım bankalarında personel güçlendirmenin yenilikçi iş davranışı ve örgütsel çevikliğe etkilerini incelemeyi amaçlamaktadır. Türkiye'deki katılım bankaları çalışanlarına yapılan anket üzerinden toplanan veriler ile personel güçlendirmenin çalışanların işinde yenilikçi davranış göstermesi ve örgüt çevikliğine olan katkısı ve kamu ile özel katılım bankaları arasındaki farklılık araştırılmıştır. Anket verileri SPSS ve AMOS paket programları ile yapısal eşitlik modeli ve hipotez testi kullanılarak analiz edilmiştir. Araştırma sonucunda, personel güçlendirmenin yenilikçi iş davranışını ve örgütsel çevikliği pozitif ve anlamlı olarak etkilediği tespit edilmiştir. Özel ve kamu katılım bankaları karşılaştırıldığında, kurum türleri arasında personel güçlendirme ve yenilikçi iş davranışları açısından anlamlı fark olmadığı, fakat örgütsel çeviklik için anlamlı fark olduğu belirlenmiştir. Özel katılım bankaları çalışanlarının örgütsel çeviklik düzeyleri daha yüksek çıkmıştır."
