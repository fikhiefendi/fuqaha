abstract: "Katılım bankaları ve konvansiyonel bankalar ortak bankacılık risklerine sahiptirler. Bu risklerin yanı sıra kendilerine özgü riskleri de vardır. Ülkemizde bununla ilgili olarak müşteriler açısından algılanan riskler bankalara göre de değişebilmektedir. Bu çalışmada Türkiye' deki katılım bankalarında ve konvansiyonel bankalardaki algılanan riskler ve müşteri portföyü üzerine etkisinin bankacılar özelinde incelemesi amaçlanmıştır. Katılım bankacılığının ülkemizdeki yeri, ekonomi açısından önemi anlatılarak, konvansiyonel bankacılık ile karşılaştırılması yapılmıştır. Öncelikle katılım bankacılığı ve konvansiyonel bankacılığın işlevleri, çalışma prensipleri anlatılmıştır. Katılım bankacılığı ve konvansiyonel bankacılık risklerindeki algılanan tehditler ve çözüm önerileri nitel araştırma yöntemlerinden mülakat tekniği ile kamu bankaları ve özel bankalarda şube müdürleri özelinde 2 grupta toplam 16 banka ve 16 kişi ile yapılan görüşmelerde ele alınmıştır. Bu görüşmeler Konya' da 1 Mart 2020- 30 Ağustos 2020 tarihleri arasında aralıklı olarak gerçekleştirilmiştir. Çalışmanın sonunda katılım bankacılığı ve konvansiyonel bankacılık hakkında bilgiler paylaşılmış algılanan riskler hakkında görüşler bildirilmiştir. Bu kapsamda yapılan görüşmelerde katılım bankacılığının ve konvansiyonel bankacılığın belirtilen problemleri ve eksiklikleriyle ilgili çözüm önerilerinde bulunulmuştur. Anahtar Kelimeler Katılım Bankacılığı, Konvansiyonel Bankacılık, Risk, Risk Algısı"
