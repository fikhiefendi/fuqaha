title: "كَشْفُ القِنَاعِ عَن مَتْن وَشَرْحِ أَبي شُجَاع حاشية العلامة الشبراملسي على شرح ابن قاسم الغزي لمتن أبي شجاع من كتاب الزكاة وحتى آخر كتاب النكاح - دراسة وتحقيق"
