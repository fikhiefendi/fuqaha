abstract: "Bu çalışma, tozlu raflarda kaderine terk edilmiş değerli bir yazma eseri gün yüzüne çıkarıp, faydalanılması için onu tekrar canlandırmayı ve bu vesileyle İslam kültür mirasına bir katkı sağlamayı amaçlamaktadır. Bu nedenle eş-Şebramellsi 'nin (h.1087) Keşfu'l-Kina an Metni ve Şerhi ebî Şucaa' adlı eseri seçtik. Bu eser, âlimler arasında rağbet gören, şafi fıkhı eserleri arasında çok meşhur ve yaygın olan Ebî Şucaa'ın 'Metnil Ğaye ve Tekrib' adlı eserin ve İbn Kasım el Ğazzi'nin şerhinin haşiyesidir. Çalışmamız, bu önemli eseri iki bölüm halinde ele almak suretiyle tahkik ve incelemesini yapmıştır. Çalışmamızın birinci bölümü bu eseri üç başlık altında incelemektedir. Birinci başlıkta Ebî Şucaa' ve İbn Kasım el Ğazzi'nin hayatları ve eserin metin ve şerhinin önemi ele alınmıştır. İkinci başlıkta eş-Şebramellsî'nin dönemindeki siyasi, ictimai ve ilmi durum ele alınmıştır. Üçüncü başlık ise iki alt başlık şeklinde ele alınmıştır. Birinci alt başlıkta eş-Şebramellsî'nin yetişmesi, ahlakı, aldığı eğitim, hocaları, öğrencileri, eserleri ve alimlerin övgüsü aktarılmıştır. İkinci alt başlıkta, çalışmamızın konusu olan haşiyenin isminin ve müellifine nispeti, farklı nüshaların tanıtımı, eserin önemi ve ilmi değeri ele alınmıştır. Aynı başlık, eş-Şebramellsi'nin yöntemini ve faydalandığı kaynakları anlattıktan sonra Haşiyesinde kullandığı kavramların tarifleriyle son bulmaktadır. Çalışmamızın ikinci bölümü olan tahkik ve yorumlama iki başlıktan oluşmaktadır. Birinci başlıkta farklı nüshalar numuneler verilerek tanıtıldı ve tahkik, yorumlamada takip edilecek yöntem açıklandı. İkinci başlıkta zekat kısmından başlayarak aile hukuku bölümüne kadar olan metnin tahkiki yapıldı."
