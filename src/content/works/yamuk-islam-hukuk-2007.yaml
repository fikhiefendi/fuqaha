abstract: "ÖZETYamuk, Mustafa, slam Hukuk Usulünde stihsan le Maslahat-IMürsele Arasındaki lişki, Yüksek Lisans Tezi, Danışman, Prof. Dr. Şamil Dağcı,116 s.Bu tez giriş, iki bölüm ve sonuçtan oluşmaktadır.Tezin birinci bölümünde, stihsan ve maslahat-ı mürsele kavramları,çeşitleri huccet değerleri incelenmiştir.kinci bölümde ise slam hukuk ekollerinin bu iki kavramı nasılanladıkları ve uyguladıkları karşılaştırılmalı olarak incelenmiştir. ki kavram veçeşitleri arasında yakın bir bağın olduğu ortaya konmuştur. Zaruret prensibininhem istihsana hem de maslahata kaynaklık yaptığı ifade edilmiştir.Sonuç bölümünde ise bu iki delilin insanların problemlerini çözmedeçok önemli katkı sağlayacağı yazar tarafından ifade edilmiştir."
