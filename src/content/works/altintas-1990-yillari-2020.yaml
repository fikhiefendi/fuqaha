abstract: "Bu çalışma, sınıfsal bir perspektife yaslanarak İslamcılık içre iktisadi tartışmaların izini 1990 başı ile 1996 sonu arasında yayımlanmış olan bazı dergilerde sürmektedir. İncelemedeki ağırlığı Çerçeve, İktisat ve İş Dünyası, Haksöz, Yeryüzü ve devamı olarak çıkan Yeni Yeryüzü dergisi taşımakla birlikte bu kapsamda toplam 11 farklı dergiden makale ve haber metinleri taranmıştır. Dergilerden edinilen bulgular 'Bankacılık ve Faiz', 'Piyasaya Devlet Müdahalesi ve Özelleştirmeler', 'İşveren Örgütlenmeleri ve İşçi-İşveren Münasebetleri/Çatışmaları', 'Bölüşüm ve Gelir Adaletsizliği' ile 'Kapitalizm ve Girişimcilik' başlıkları altında tasnif edilerek tartışılmakta ve analiz edilmektedir. Mevzubahis dergi metinleri çerçevesinde bu başlıklar açısından 'serbest piyasacı' ve 'sosyal adaletçi' kutuplanmanın ne ölçüde teşekkül ettiği değerlendirilmektedir. Sonuç olarak çalışmada, 90'ların ilk yarısı için en azından iktisadi meseleler temelinde Müslüman sağ ve Müslüman sol'dan bahsedilebileceği öne sürülmekte ve bu bulguların çeyrek asır sonra Türkiye siyaseti ile toplumu için anlamı irdelenmektedir."
