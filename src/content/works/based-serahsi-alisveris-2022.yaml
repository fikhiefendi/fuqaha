abstract: "“Serahsî'nin Alişveriş Bahislerindeki Tercihleri”isimli bu tez, bir giriş, iki bölüm, bir sonuç ve ek-1 olarak bir istatistikten oluşmaktadır. Giriş bölümünde konunun önemi, sınırları araştırmanın yöntemi ve kaynakları ile kısaca Serahsî'nin hayati ele alınmıştır. Birinci bölümde Serahsî'nin el-Mebsût isimli eseri dikkate alınarak alışveriş bahislerindeki tercihleri ve tercihlerin gerekçeleri tespit edilmeye çalışılmış ve neticede derli toplu bir bilgi sunulmaya gayret edilmiştir. Bununla birlikte ihtiyaç görünen yerlerde de kısa değerlendirmeler yapılmıştır. İkinci bölümde ise ele alınan bahislerinde delil olarak kullanılan küllî kaideler tespit edilerek, hangi meselelerde kullanıldığına dair örnekler sunulmuştur. Sonuç“ başlığı altında Serahsî'nin eserinin yazma metodu üzerinde durulmuştur. Son olarak EK-1'de ”Serahsı̇'nı̇n Tercih Ettı̇ğı̇ Görüşlerı̇nı̇n İstatı̇stı̇ğı̇\" başlığı altında Serahsî'nin tercihleri ayrı ayrı başlıklar altında toplanarak bir şablon halinde sunulmaya gayret edilmiştir."
