abstract: "Tezimizde Hanefî mezhebinin temel eserlerinden biri olan Şemsü'l-Eimme es-Serahsî'nin el-Mebsût adlı eseri çerçevesinde mehir konusu ele alınmıştır. Fıkıh literatüründe mehirle ilgili meseleler daha ziyade nikâh üst başlığı altında ele alınmıştır. Ancak Mebsût'un ansiklopedik tarzda bir eser olması, mehir konusunun yaklaşık otuz ciltlik eserin geneline yayılabileceği düşüncesine sevk etmiş ve mehirle ilgili meselelerin eserin bütününde araştırılması amaçlanmıştır. Tez, Giriş, İki Bölüm ve Sonuç kısımlarından oluşmaktadır. Girişte, konunun amacı ve önemi hakkında bilgi verilmiştir. Birinci bölümde Serahsî'nin hayatı ele alınmıştır. Bu minvalde ilmi şahsiyeti, yaşadığı siyasi ortam ve eserleri incelenmiştir. İkinci bölüm araştırmanın temelini oluşturan bölümdür. Bu bölümde öncelikle mehir konusunun diğer klasik fıkıh kitaplarının sistematiğinde olduğu üzere nikâh babındaki bilgilerden hareketle, mehrin Mebsut'un genelinde ele alındığı konular incelenmiştir. Sonuç kısmında ise araştırmanın sonucunda varılan bulgular değerlendirilmiştir."
