abstract: "Sözleşmeler, kendilerinden beklenen amacın elde edilmesi için yapılır. Taraflar, bir akit ilişkisi kurarken bu akitle amaçlanan neticenin gerçekleşeceğinden ve sözleşmenin tek taraflı olarak feshedilmeyeceğinden emin olmak isterler. Diğer taraftan sözleşme sonrası birtakım pişmanlıkların ve anlaşmazlıkların ortaya çıkması da mümkündür. İslam hukukunda bu gerekçelerle“(akit) meclisi”kurumu geliştirilmiş, ayrıca“muhayyerlik müessesesi”ortaya çıkmıştır. İslam hukukunda farklı muhayyerlik türleri bulunmaktadır. Bunların bir kısmının meşruiyeti üzerinde görüş birliği olmakla birlikte bazılarında görüş ayrılığı söz konusudur. Tezimizin konusu olan“meclis muhayyerliği”ihtilaf konusu olan muhayyerlik haklarının başında yer alır. Taraflara tek taraflı olarak sözleşmeyi feshetme imkânı veren bu muhayyerlik yetkisi, esasında satım sözleşmesinde pratik olarak“in'ikad”ve“lüzûm”olgularının birbirinden ayrılabileceği, başka bir deyişle satım akdinin bağlayıcı hale gelmesi için icap ve kabul beyanlarının yeterli olmadığı kabulüne dayanır. Bu çalışmada, meclis muhayyerliği konusu mukayeseli bir metot takip edilerek incelenmiştir. Öncelikle“meclis”kavramı detaylı bir şekilde ele alınmış ve meclise ilişkin fıkıh ekollerinin ve İslam hukukçularının tasavvurları analiz edilerek meclis muhayyerliğinin kavramsal ve teorik çerçevesi ortaya koyulmaya çalışılmıştır. Bu çalışma meclis muhayyerliğinin meşruiyetine dair temel ihtilaf noktalarının tespit ve tahlilini, hukukî niteliğini netleştirmeyi ve meclis muhayyerliğine ilişkin hükümleri bütüncül bir bakış açısıyla ele almayı hedeflemektedir. Meclis muhayyerliğiyle ilgili olarak Türkçe literatürde tez düzeyinde yapılmış bir çalışma bulunmamaktadır. Bu nedenle söz konusu çalışma alandaki bir eksikliği kapatmayı amaçlamaktadır."
