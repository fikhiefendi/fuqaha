abstract: "Muhammed Hamidullah Müslüman ilim dünyası üzerinde büyük etki bırakan Hint asıllı alimlerinden biridir. Hamidullah, geçmişi tetkik ve tespitte titiz bir araştırmacı olmasının yanında günümüz ilmî ve kültürel birikimini orijinal dilinden takip edip değerlendirebilen bir entelektüel ve fikir adamı olarak karşımıza çıkmaktadır. Bu çerçevede onun günümüz fıkıh problemlerine ilişkin görüşlerinin bilinmesinin İslam hukuk mirasının doğru okunması ve algılanmasına katkı sağlayacağı açıktır. Bu sayede İslam hukukunun, küreselleşen dünyanın ortak hukuk arenasında, varislerince en iyi şekilde temsil edilme imkânı daha yüksek olacaktır. Bu çerçevede Muhammed Hamidullah'ın günümüz fıkıh problemlerine ilişkin görüşlerinin incelendiği bu çalışmada öncelikle Hamidullah'ın hayatı ve temel hukuki fikirleri yanında Hamidullah'ın modern sorunlar ile ilgili görüş ve değerlendirmeleri ele alınarak bunların günümüze olan yansımaları üzerinde durulmuştur."
