abstract: "Bu çalışmada mikrofinans, türleri ve uygulamaları ile bu uygulamaların savaştan etkilenen topluluklar üzerindeki etkileri ele alınmıştır. Genel olarak bölge üzerindeki ekonomik etkiye ek olarak, Kuzeybatı Suriye incelenerek bireylerin ve ailelerin savaşın etkilerinden ekonomik olarak kurtulmalarını sağlamada mikrofinansın rolü değerlendirilmiştir. Araştırma, güvenlik, sosyal ve ekonomik istikrarsızlık ışığında mikrofinansın uygunluğunu gözden geçirmekte olup, mikrofinans kavramını, türlerini ve İslami finansman kriterlerini açıklamayı amaçlamaktadır. Ek olarak ekonomik güçlendirme tanımlanmış olup savaş bölgelerindeki ekonomik sorunun karakterizasyonu ile mikrofinansın bu bölgelerde ekonomik güçlendirmeyi sağlamadaki rolü de incelenmiştir. Çalışmada ayrıca mikrofinans programlarının karşılaştığı engeller ve bu engellerin bazılarının ele alınmasında İslami finans standartlarının önemi vurgulanmaktadır. Araştırmacı çalışmada betimsel analitik yöntemi kullanarak, mikrofinansın gerçekliğini anlamak ve mevcut deneyimleri tespit etmek, bu deneyimlerin amaçlarına ulaşma durumunu tespit etmek ve karşılaşılan sorunlar ile nedenleri hakkında bilgi edinmek için araştırma alanında bulunan kişi ve kuruluşlara bir anket yapmıştır. Çalışma sonucunda, yerel kuruluşlar ve yönetimler düzeyinde mali destek ve iyi organizasyon sağlanması, yerel toplum bileşenlerinin bu sektörün başarısı için bir araya gelmesi ve bunları düzenleyen yasaların çıkarılması ile mikrofinansın savaştan etkilenen toplulukları güçlendirmeye katkı sağlayacağı anlaşılmıştır. Son olarak, bu sektörün yönetişim işlevlerini yerine getirmek, İslami şeriat kurallarına uygun olarak bölgede onu yöneten standartları ve temelleri belirlemek ve bölgedeki İslami mikrofinans formüllerini etkinleştirmek için mikrofinans adına bir kamu kurumu kurulması önerilmektedir."
