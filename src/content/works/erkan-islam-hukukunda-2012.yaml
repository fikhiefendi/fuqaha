abstract: "İslâm hukuku açısından sosyal hayatın olduğu kadar ticarî hayatın da sağlıklı bir şekilde sürdürülebilmesi gerekir. İslâm hukuku bu amaçla haksız kazanç sağlayacak her türlü muameleye karşı önleyici bir takım tedbirler almış ve bunları da İslâm tarihinin ilk dönemlerden itibaren hayata geçirmiştir. Bu manada genelde iki taraflı akitlerde karşılıklar arasında, özelde ise alışverişte, satılan şeyle fiyatı arasında değer yönünden farklılık ve dengesizliği ifade eden ğabnin iktisadî olduğu kadar ahlakî ve içtimaî yönden de çok çeşitli problemler içerdiği bir gerçektir. Bu tezde söz konusu problemlerin çözümüne bir nebze de olsa katkı sağlamak amacıyla İslâm hukukunun ğabne bakışı ve ğabnin akitlere etkisi ortaya konulmaya çalışılmıştır.Tez üç ana bölümden oluşmaktadır. İlk bölümde ğabnin tanımı, dindeki hukukî temelleri, kapsam ve unsurları belirlenmeye çalışılmış, ayrıca bazı noktalarda kıyaslama yapabilmek için batı hukuklarında ğabnin ele alınışı incelenmiştir. İslam hukukunda ğabn çeşitlerinin ve ğabnin tağrîrle olan ilişkisinin ortaya konulmaya çalışıldığı ikinci bölümde de farklı görüşler çerçevesinde ğabn ve tağrîr ilişkisi değerlendirilmiştir. Ğabnin akitlere etkisine ayırılan son bölümde ise daha çok fakîhlerin bu konudaki yaklaşımları ele alınmaya ve bazı alanlarda ğabnin ne gibi sonuçlar doğurduğu tespit edilmeye çalışılmıştır."
