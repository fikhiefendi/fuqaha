abstract: "Ali Cevheri'nin“Tercüme-i Nisâbü'l-İhtisab”isimli eserinin latinize ve tahlilini yaptığımız bu çalışma giriş ve üç bölümden oluşmaktadır. Giriş kısmında çalışmanın konusu, amacı ve önemi üzerinde durulmuş ve çalışmada takip ettiğimiz metod hakkında bilgi verilmiştir.“Hisbe Teşkilatı”başlığını taşıyan birinci bölümde latinizesini yaptığımız eserin ait olduğu hisbe alanı genel olarak tanıtılmaya çalışılmıştır. Bu bölümde Hisbe'nin sözlük ve terim anlamları verilmiş, önemi, görev alanı ve devlet teşkilatı içerisindeki konumuna değinilmiş ve genel hatlarıyla tarihi gelişimi ele alınmıştır. Bölümde eserin tercümesinin yapıldığı dönem olan Osmanlı dönemi İhtisab Müessesesi biraz daha ayrıntılı şekilde ele alınmış, müessesenin tarihi gelişim serüvenine değinilmiş ve yerine getirdiği görevler hakkında bilgi verilmiştir. İkinci bölümde eserin tahliline yer verilmiştir. Bölümde öncelikle latinizesini yaptığımız tercüme eserin tahliline geçmeden önce eserin müellifi Ali Cevheri'nin hayatı hakkında bilgi verilmiş ve eserleri kısaca tanıtılmaya çalışılmıştır. Daha sonra Tercüme-iNisâbü'l-İhtisab, metodu, önemi, hisbe literatürü içerisindeki konumu ve muhtevası açısından ele alınmış ve tercüme eser ile asıl eser arasındaki farklılıklara değinilmiştir. Çalışmamızın son bölümü olan üçüncü bölümde ise önce eserin latinizesinde kullandığımız nüshalar tanıtılmış ve latinizede kullandığımız yöntem belirtilmiş ve sonrasında eserin latinize edilmiş metnine yer verilmiştir."
