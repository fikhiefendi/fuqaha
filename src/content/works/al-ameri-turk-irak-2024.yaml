abstract: "Evlat edinme tarihi çok eski çağlara dayanan ve günümüze değin süregelen bir kurumdur. Bugünün perspektifinden bakıldığında, evlat edinmenin temel amacı, çocukların sağlıklı ve mutlu bir aile ortamında büyümelerini sağlamaktır. Evlat edinme süreci, diğer çocuklarla ilgili hukuki işlemlerde olduğu gibi, evlat edinilen çocuğun en yüksek yararının gözetilmesi ilkesine dayanmaktadır. Uluslararası sözleşmelerle desteklenen bu ilke, evlat edinmenin düzenlenmesinde önemli bir rol oynamaktadır. Ülkelerin hukuk sistemlerinde evlat edinmeye dair kurallar bulunmaktadır. Türk hukukunda evlat edinme, aile hukukuna tabi bir kişisel durum meselesi olarak değerlendirilmektedir. Irak hukukunda evlat edinme İslam hukuku gereği yasaktır. Ancak Irak yasa koyucusu bazı farklılıklarla evlat edinmeyle aynı anlamı taşıyan ve 1983 tarihli ve 76 sayılı Irak Çocuk Esirgeme Kanunu hükümlerine tabi olan başka bir sistem oluşturmuştur. Bu çalışmanın temel amacı evlat edinme koşullarını Türk ve Irak hukukları açısından incelemektir. Çalışmada evlat edinme şartları hem Türk Medeni Kanunu hem de Irak Medeni Kanunu bağlamında ele alınmaktadır. Ayrıca çalışmada iki kanun arasındaki benzerliklere ve farklılıklara değinilmiştir. Çalışma sonucunda iki kanun arasında benzerlik ve farklılıklar bulunması bakımından bazı alanlarda hakim dengenin Irak hukukundan yana olduğu, bazı alanlarda ise tercih ağırlığının Türk hukukundan yana olduğu sonucuna varılmıştır. Her iki ülkedeki yasa koyucuların diğer ülkelerin yasalarının avantajlarından yararlanması, evlat edinme kurumunu daha uygulanabilir ve değerli hale getirecektir. Bu bakımdan da çalışmanın sonuç bölümünde konuya ilişkin değerlendirmelerde bulunulup öneriler sunulmuştur."
