abstract: "Gayr-i müslimlerin şer'î hükümlere muhatap olup olmaması konusunda İslâm âlimleri ihtilaf etmişlerdir. Fıkıh bilginlerinin çoğunluğu, gayr-i müslimlerin de şer'î hükümlere muhatap olduğunu söylerken, başta Hanefîler olmak üzer bazı âlimler de onların muhatap olmadığı görüşünü benimsemişlerdir. Bu çalışmada, konu etrafında ortaya konan görüşler delilleriyle beraber ve mukayeseli olarak ele alınmıştır. çalışmamızda inanç yönünden insanlar, teklif ve mahiyeti hakkında bilgiler verilmiş, ibadet ve hukuk alanında olmak üzere gayr-i müslimlerin sorumluluğu incelenmiştir."
