abstract: "Finansal serbestleşmenin etkisiyle ülkeler arasındaki finansal entegrasyon artmış ve özellikle geleneksel bankacılık sistemi dünya finans sisteminin vazgeçilmez yapıları haline gelmiştir. Ancak bu geleneksel finans insanların inanç temelli ihtiyaçlarına cevap veremedikleri için özellikle Müslümanların alternatif faizsiz finans sistem arayışları giderek artmıştır. Bu ihtiyaca Türkiye'deki adıyla katılım bankacılığı bir başka ifade ile faizsiz bankacılık sistemi cevap vermektedir. Ancak katılım bankacılığında kullanılan İslami finansal enstrümanların toplum tarafından yeterince bilinmemesi bu sektörün gelişmesine olumsuz yansımaktadır. Bu bağlamda bu çalışmanın amacı, katılım banka müşterilerinin İslami finansal okuryazarlık düzeyleri ve bu düzeyin katılım bankacılığı kullanan bireylerde yatırım tercihi veya tutumları gibi etkilerinin neler olduğunun incelenmesi amaçlanmıştır. Araştırma kapsamında nicel araştırma yöntemlerinden anket yöntemi kullanılmıştır. İstanbul'daki katılım bankacılığı müşterilerinden 110 katılımcı ile gerçekleştirilen çalışma kapsamında elde edilen veriler SPSS paket programı kullanılarak analiz edilmiştir. Çalışmanın sonucunda elde edilen bulgulara göre katılım bankacılığı müşterilerinin finansal tutum, finansal davranış, İslami finans bilgi düzeyi, İslami finans ürünleri ve katılım hesaplarına ilişkin toplam puanları ile cinsiyet, medeni durum, hesap türü, yaş ve banka sayısı (İslami finans bilgi düzeyi hariç) arasında anlamlı farklılaşma görülmemiştir. Katılımcıların cevapları genel olarak değerlendirildiğinde İslami finans prensipleri ile ilgili bilgi düzeylerinin yüksek olduğu ve yatırım tercihlerinde katılım bankalarını değerlendirdikleri tespit edilmiştir."
