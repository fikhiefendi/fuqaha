abstract: "Bu tezin amacı, klasik dönem İslâm hukuk doktrininde doğal âfetlerin akitler üzerindeki etkisini tespit edip bu hususta ileri sürülen yaklaşımları, modern iki nazariye olarak kabul edilen beklenmeyen hal ve mücbir sebep açısından değerlendirmeye tabi tutmaktır. Bu yüzden giriş kısmında klasik ve modern dönemde doğal âfetlerin nasıl ele alındığı hakkında genel bilgiler verildikten sonra birinci ve ikinci bölümde, akitleri etkileyen ve aralarında doğal âfetlerin de bulunduğu kimi durumların sebep olduğu problemleri konu edinen ve bu yönde çözüm sunan beklenmeyen hal ve mücbir sebep konuları ayrı ayrı ele alınmıştır. Son bölümde ise özellikle dört büyük mezhep literatürü kapsamında doğal âfetlerin akitler üzerindeki etkisi müstakil başlıklar altında işlenmiş ve neticede doğal âfetlerin akitleri etkilediği, fakat bu hususta mezhepler arasında bir konsensüsün sağlanmadığı anlaşılmıştır. Şöyle ki doğal âfetler hususunda satım ve icâre türü akitlerde borçlu ve alacaklıya yönelik hasar sorumlulukları söz konusu edilirken, genel olarak diğer akit türlerinde makudun aleyhi elinde bulunduranın tazmin sorumluluğu gündeme gelmiştir. Ayrıca doğal âfetlere geniş bir alan tayin eden hukukçular olduğu gibi dar ve sınırlı bir çerçeve çizenler de olmuştur. Fakat neticelerinin kabul edildiği her durumda doğal âfetler, borçluyu borcundan kurtaran bir sebep olarak kabul edilmiştir."
