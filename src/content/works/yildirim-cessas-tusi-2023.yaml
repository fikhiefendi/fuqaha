abstract: "Müfessirlerin çoğunlukla, yaşadıkları dönemin ve ilim yolculuklarının şekillendirdiği mezhebî kimlikleri, ahkâm âyetleri yorumlarına yansımaktadır. Bunun bir örneğini sunan çalışmamızda, IV/X. asırda yaşayan Cessâs'ın Ahkâmü'l-Kur'ân'ıyla, IV/X. yüzyılın son yarısıyla V/XI. yy. başlarına tekabül eden bir dönemde yaşayan Tûsî'nin et-Tibyân fî tefsirî'l-Kur'ân'ında ahkâm âyetlerinin nasıl yorumlandığı üzerinde durulmaktadır. Bu minvalde her iki müfessirin yorumlarına geçmeden önce müfessirlerimizi iyi anlayabilmek adına yaşadıkları dönem başta olmak üzere hayatları ve ilim yolculuklarına dair bilgiler verilecektir. Ayrıca çalışmamızın temel kaynakları olan Ahkâmü'l-Kur'ân ve et-Tibyân tefsirleri genel manasıyla tanıtılacaktır. Müfessirlere ve tefsirlerine dair bilgiler verildikten sonra müfessirlerin ahkâm âyetleri yorumlarına mukayeseli bir şekilde yer vermek amaçlanmaktadır. Bu bağlamda Ahkâmü'l-Kur'ân ve et-Tibyân tefsirleri detaylı bir şekilde incelenmiş, çalışmada metin analizi yöntemi kullanılmıştır. Mezhebî kimliğin ahkâm âyetlerinin yorumlanmasında etkili olup olmadığı sorusundan hareketle ele alınan bu çalışmada, ilgili tefsirlerde yer alan yorumlar değerlendirilmektedir. Bu değerlendirmeler sonucunda Ehl-i sünnet ve Şîa genelinde, Cessâs ve Tûsî özelinde mezhebî kimliğin ahkâm âyetlerinin yorumlanmasında belirleyici bir etkiye sahip olduğu görülmektedir."
