abstract: "Ekonomik faaliyetlerin gelişmesiyle birlikte finans piyasasına yeni finans yöntemleri girmektedir. Finansal piyasalara yeni giren ürünlerden biri ise faizsizlik iddiasında bulunan Katılım Bankaları tarafından sunulmaktadır. Hayatımıza 1980'li yıllarda Özel Finans Kurumu adıyla giren ve daha sonra Katılım Bankaları adıyla faaliyetlerine devam eden kurumların bu faaliyetlerinin İslami ilkelere göre yapılıp yapılmadığının araştırılması oldukça önemlidir. Faiz konusunda dini hassasiyetleri sebebiyle duyarlılık gösteren insanların ekonomik sistemde başvuracağı ilk kurumlar şüphesiz Katılım Bankaları olacaktır. Bunun sebebi, Katılım Bankaları'nın faizden kaçınan insanlara faizsiz ekonomik faaliyet vaad ediyor olmalarıdır. Katılım Bankaları faiz konusunda çekimser durumda olan kişileri, dolayısıyla ekonomik sistem dışında kalan birikimlerini bankacılık sistemlerine dahil edebilmek için, İslami kavram ve söylemleri kullanmaktan da geri durmazlar. Katılım Bankaları'nın faizsizlik iddialarının doğru olması için icra ettikleri ekonomik faaliyetlerin İslami kurallara uygun olması gerekir. Çalışmamızda Katılım Bankaları'nın bankacılık faaliyetleri arasında en fazla kullandığı araçları incelenerek, Katılım Bankacılığına ışık tutmak amaçlanmıştır. Çalışmamızda yöntem olarak; Kur'an-ı Kerim ve Hz. Muhammed'in, İslam'ın ruhunu inşa eden ilkeleri esas alınarak, Katılım Bankaları faaliyetleri bu ilkelere uygun olup olmama esasına göre değerlendirilmiştir. Ayrıca Katılım Bankacılığının daha iyi anlaşılması için mevcut bankacılık sistemi ve Katılım Bankalarıyla olan ilişkileri ele alınarak, ekonomik sistem de irdelenmiştir."
