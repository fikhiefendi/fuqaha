abstract: "Mahmud b. Abdülaziz, 15. yüzyılın sonu ve 16. yüzyılın başında yaşamış, hayatını sarayda ser-mutribân olarak geçirmiş, kuvvetli bir mûsikîşinas ve yazardır. Dedesi ve babası da çok ünlü mûsikî bilginlerinden olan Mahmud b. Abdülaziz, dedesi ve babası gibi Safiyyüddin Urmevî'den itibaren ortaya konulan 17'li ses sistemine dair eserini yazmıştır.Mak?sidü'l-Edvâr adlı eserinde ses sistemine dair kendi dönemine kadar tespit edilmiş bütün bilgilere kısaca değinmiş ve o bilgilere bir takım ilâvelerde bulunmuştur. İcat edilmiş devirlerden bahsetmiş ve onlara kendi icat ettiği devirleri de ilâve etmiştir. Mahmud b. Abdülaziz eserinde kendisine ait olan bestelerden de bahsetmiştir fakat nota kaydı vermemiştir. Ayrıca yine kendisinin icat ettiği enstrumandan bahsetmiştir.Mahmud b. Abdülaziz'in Mak?sidü'l-Edvâr adlı eseri 15. yüzyılda mûsikîye dair son kitap olması itibariyle önemlidir. İçerdiği bilgilerin o dönemin gelmiş olduğu noktayı net olarak ortaya koyması sebebiyle bu önem daha da artmaktadır. Günümüzde de kullanılan bir sistem olan 17'li ses sistemi hakkındaki bu eser makamların, perdelerin, aralıkların, dizilerin, usûllerin ve bazı enstrumanların hakkında bilgiler ihtiva ettiği için o dönemin müziğini anlamak açısından önemli bir çalışmadır."
