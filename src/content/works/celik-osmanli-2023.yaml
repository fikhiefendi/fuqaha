abstract: "Fıkhi bilginin tarih içinde toplumsal ihtiyaçlara daha uyumlu hale gelmesini sağlayan fetva mecmuaları, Osmanlı hukuk sisteminin şekillenmesine yardımcı olan önemli kaynak eserlerdir. Bu çalışma Osmanlı fıkıh geleneğinde oldukça merkezi bir konuma sahip olan Minkârîzâde Yahyâ Efendi'nin (ö.1088/1678) fetva mecmuasını incelemektedir. Minkârîzâde Yahyâ Efendi, kendi derin ilmî birikimi ve yetiştirdiği talebeleri vasıtasıyla Osmanlı ilmiyesi ve bürokrasisi üzerinde belirleyici bir rol üstlenmiştir. Bununla birlikte Yahyâ Efendi'nin Osmanlı hukukuna etkisi, Fetâvâ-yı Abdürrahim adlı eserdeki ona ait olan fetvaların literatürde yanlış olarak Menteşzâde Abdürrahim Efendi'ye atfedilmesi gibi sebeplerle tam olarak kavranamamıştır. Bu çalışma, literatürdeki söz konusu yanılgıyı düzelterek fetvaların asıl sahibinin Minkârîzâde Yahyâ Efendi olduğunu ortaya koymaktadır. Ayrıca tez, önde gelen bir şeyhülislam olarak Yahyâ Efendi'nin Osmanlı hukukunu nasıl etkilediğini tartışmakta ve fetvalarının Osmanlı fetva literatüründe temel bir kaynak olduğunu iddia etmektedir. Çalışmada Yahyâ Efendi'nin belirleyici konumunu gösteren bir örneklem olarak Osmanlı hukukuna büyük katkı sağladığı vakıf hukuku ayrıntılı olarak ele alınmakta ve bu alandaki fetvalarının içerik analizi yapılmaktadır. Bu analiz sonucunda Yahyâ Efendi'nin vakfın finansman sorunlarına yoğunlaştığı sonucuna ulaşılmakta ve bunun sebepleri incelenmektedir. Böylece Yahyâ Efendi'nin fetvalarının, vakıf hukuku ve daha geniş çerçevede Osmanlı hukuk sistemi üzerindeki etkisinin daha derinlemesine anlaşılması amaçlanmaktadır."
