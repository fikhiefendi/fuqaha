abstract: "Bir Ülke ekonomisinde bankacılık sektörü büyük bir öneme sahiptir, bankacılık sektörü diğer ekonomik sektörlerden ayrı olarak bir ülkenin finansal göstergesi şeklinde bilinmektedir. Önemli finansal aracı kurumu olarak bilinen bankacılık sektöründe yaşanın olumlu ya da olumsuz herhangi bir olay ister istemez diğer ekonomik yapıları da etkilemektedir. Bu doğrultuda bankacılık sektörü bir ülkenin ekonomik gelişmesi açısından kilit bir konuma sahiptir. Bankacılık sisteminin bir unsuru olan katılım bankaları son yıllarda küresel ekonomide ve Türkiye ekonomisinde hızla büyümektedir. Günümüzde küreselleşme ile beraber katılım bankalarının performans değerlendirmesi, sürdürülebilir ve karlı büyümelerine katkı sağlaması açısından önem kazanmıştır. Bu çalışmanın temel amacı, 2016 – 2020 yılları arasında Türkiye'de faaliyette bulunan kamu ve özel sermayeli beş katılım bankasının (Vakıf Katılım Bankası, Ziraat Katılım Bankası, Albaraka Katılım Bankası, Kuveyt Katılım bankası, Türkiye Finans Katılım Bankası) performansının değerlendirmektir. Bu kapsamda, sermaye yeterliliği, bilanço yapısı, aktif kalitesi, likidite, karlılık ve gelir-gider yapısı olmak üzere altı (6) temel kriter ve yirmi (20) alt kriterden oluşan değişkenler kullanılmıştır. Oranlar oluşturulduktan sonra çok kriterli karar verme yöntemlerinden ENTROPI yöntemi ile seçilmiş olan kriterlerin ağırlıkları belirlenmiş, ardından TOPSIS yöntemi ile bankaların performans sıralaması gerçekleştirilmiştir. Ortalama değer sonuçlarına göre, en yüksek puana sahip olan banka Vakıf Katılım Bankası yer almıştır. 2. Sırada Ziraat Katılım Bankası, 3. Sırada Kuveyt Katılım Bankası, 4. Albaraka Katılım Bankası ve 5. Sırada Türkiye Finans Katılım Bankası yer almıştır."
