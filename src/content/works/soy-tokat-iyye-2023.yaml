abstract: "Bu tez çalışmasında 1887-1890 yıllarını kapsayan“83 Numaralı Tokat Şer'iyye Sicil Defteri”içerisinde yer alan Gayrimüslim davaları incelenmiştir. Defterde bulunan belgelerden yalnızca gayrimüslimlere ait olan davalardan yola çıkılarak söz konusu dönemde Tokat'taki dava çeşitleri incelenmiştir. Yaptığımız çalışma dört bölümden oluşmaktadır. Birinci bölümde Tokat coğrafyası ve Tokat adının kaynakçası ve şer'iye sicillerinin tanımı ve kapsamı hakkında bilgi verilerek 83 Numaralı Tokat Şer'iye Sicilinden bahsedilmiştir. İkinci bölümde, Osmanlı Devleti'ndeki hukuk sistemi, şeriye mahkemeleri, mahkemedeki görevlilerden ve sosyal yaşam içerisinde yer alan ve belgelerde bulunan konular ile bilgilendirme yapılmıştır. Üçüncü bölümde ise, defterden faydalanarak o döneme ait gayrimüslim davaların türleri ile sosyal ilşkiler üzerinde durulmuştur. Son olan dördüncü bölümde 83 Numaralı Tokat Şer'iye Sicili'nde bulunan gayrimüslim davalarının tarnskripsiyonu yer almaktadır."
