abstract: "Tez giriş, üç bölüm ve sonuç kısmından oluşmaktadır.Girişte araştırmanın amacı, önemi ve araştırmada izlenen yöntem ele alınmıştır.Birinci bölümde, istihsânın kavramsal çerçevesi üzerinde durulmuştur. Bu bağlamda istihsânın tanımı, tarihsel gelişimi ve Hz. Peygamber, (sav) sahâbe ve tâbiîn devirlerinde ortaya çıkan ve re'y ictihadının önemli bir parçası olan istihsân örneklerine yer verilmiştir.İkinci bölümde, mezheplerin istihsân ile ilgili görüşleri, istihsânın İslâm hukuk usûlunün bir delili olarak kabul edilip edilmemesi ve istihsânın diğer delillerle ilişkisi ele alınmıştır.Üçüncü bölümde, günümüz usûlcülerin istihsâna yaklaşımları, modern hukukta istihsâna denk sayılabilecek kavramlar ve güncel fıkhî problemlerin çözümünde istihsân metodunun kullanılması gibi konular işlenmiştir.Tezimizin sonuç kısmında ise, çalışmamızda sonucunda ulaşmış olduğumuz hususlar ifade edilmiştir."
