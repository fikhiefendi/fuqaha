abstract: "Bu çalışma kapsamında Eminönü'nde yer alan vakıf hayrat eserleri incelenmiştir. Cumhuriyetin ilk yıllarında Fatih İlçesi ile beraber İstanbul'un Merkez İlçesi'ni oluşturan Eminönü, 1928'de İstanbul İli Merkez İlçesi'nin ikiye ayrılmasıyla ayrı bir ilçe olmuştur. 2008'de İstanbul İl'inde Eminönü İlçesi kaldırılmıştır; Eminönü ve Fatih ilçeleri birleşerek, Fatih adı altında tek bir ilçeye dönüşmüştür. Eminönü'nün zengin mimari dokusu İstanbul'un fethiyle başlayan ve yirminci yüzyıl başına kadar devam eden süreç içinde, Osmanlının inşa ettiği sayısız vakıf eserleriyle şekillenmiştir. Bir açık hava müzesi olan bu alanda anıtsal külliyeler, camiler, mescitler, medreseler, sıbyan mektepleri, çeşmeler vb. yapılardan oluşan vakıf eserlerinin hem işlevsel hem de tarihsel olarak bütün çeşitliliği izlenebilmektedir. Vakıf bir çeşit anlaşmadır, kurulurken oluşturulan vakfiye ile hukuki değer kazanır. Vakıf bir malı alınıp satılmaktan ebedi olarak alıkoymak, insanların yararına, dini, hayri ve sosyal bir amaca sonsuza kadar tahsis etmektir. Vakıf kurulurken bu vakfın mümkün olduğunca uzun süre devam edebilmesi hedeflenir. Vakıf hizmetlerinin sürekliliği vakıf eserlerinin devamlılığı ile sağlanabilecektir. Tüm vakfiyelerde ayrılan paranın her şeyden önce onarıma harcanacağının belirtilmesi sistemin devamlılığının bir göstergesidir. Kendisinden doğrudan yararlanılan bina ve müesseseler“hayrat”, vakfedilen hizmet, bina ve müesseselerin sonsuza kadar yaşayabilmesi için vakfedilen gelir kaynakları ise“akar”olarak tanımlanmaktadır. Bu çalışma kapsamında Eminönü'ndeki hayrat vakıf eserlerinin korunarak gelecek kuşaklara sağlıklı bir şekilde aktarılması için bir strateji oluşturulması hedeflenmiştir. 1922 yılında, Maarif Vekaleti'nin genelgesi ile illerdeki tüm eski eserlerin ve tamir edilebilecek olan anıtların listesi ile yazıt ve mezar taşlarının tespiti istenmiştir. Yapılan bu tespit çalışmalarıyla İstanbul'daki mevcut vakıf eserleri belgelenmiş, bulundukları durum, adres bilgileri, vakıf bilgileri vb. kayda alınmıştır. Çalışmamız bu kayıtlardan yola çıkılarak başlamış, yapıların günümüzdeki korunma durumları incelenmiştir. Kaybolan vakıf eserleri tespit edilmiş, günümüze ulaşan yapıların özgünlük durumu irdelenmiştir. Mahalle sınırlarının ve adlarının sürekli değişmesi, sokak adlarının süreklilik içermemesi zaman zaman tespitleri zorlaştırmış, eski haritaların kıyaslamalarıyla adresler bulunmaya çalışılmıştır. Eminönü'nün otuz üç mahallesinde (Alemdar, Balaban Ağa, Binbirdirek, Beyazıt, Cankurtaran, Demirtaş, Emin Sinan, Hacı Kadın, Hobyar, Hoca Gıyasettin, Hoca Paşa, Kalenderhane, Katip Kasım, Kemal Paşa, Küçük Ayasofya, Mimar Hayrettin, Mimar Kemalettin, Mercan, Mesih Paşa, Molla Fenari, Molla Hüsrev, Muhsine Hatun, Nişanca, Şehsuvarbey, Rüstem Paşa, Saraç İshak, Sarıdemir, Süleymaniye, Sultan Ahmet, Sururi, Tahtakale, Taya Hatun, Yavuz Sinan) yerinde tespit çalışmaları yapılmış, bu çalışmalar arşiv ve kaynak araştırmalarıyla desteklenmiştir. Hayrat eserler halihazır harita üzerinde işaretlenmiştir. Çalışmanın sonucunda özellikle çeşme, sıbyan mektebi, meşrutalarda büyük oranda kayıplar olduğu, cami, mescit ve medreselerin ise birçok muhdes eke rağmen yine de özgün şemalarını korudukları görülmüştür. İmar faaliyetleri, değişen sosyo-ekonomik durum, yanlış kullanımlar, bakımsızlık, ihmal, bilinçsiz onarımlar koruma sorunlarının başında gelmektedir. Günümüze ulaşan bu miras belgelenerek günümüzdeki durumu tespit edilmiş, son doksan yılın bir muhasebesi yapılmış ve en doğru şekilde korunması, kullanılması için gerekli koruma planlarının oluşturulmasında yardımcı olacak bir kaynak oluşturulmaya çalışılmıştır."
