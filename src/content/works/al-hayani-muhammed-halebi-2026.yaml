abstract: "Bu araştırma, Hanefî fıkıh literatüründe önemli bir yere sahip olan Abdullah b. Muhammed el-Halebî, meşhur lakabıyla İbn Kudayb el-Bân (ö. 1096/1684) tarafından kaleme alınan Nefâihu'l-Ezhâr fî Keşfi'l-Esrâr ʿani'd-Dürri'l-Muhtâr adlı eserin belirli bir bölümünün incelenmesi ve tahkikli neşrini amaçlamaktadır. Çalışma, eserin Tahâret kitabındaki niyet bahsinden başlayarak Vitr namazı bölümüne kadar olan kısmını kapsamaktadır. Araştırma, müellifin ed-Dürrü'l-Muhtâr metnini açıklama yöntemini, mezhep içi görüşleri sunma ve tercih etme biçimini, fıkhî meseleleri usûlî kaideler ışığında ele alışını ortaya koymayı hedeflemektedir. Bunun yanında çalışmada yazma nüshalar tespit edilip karşılaştırılarak ilmî ölçütlere uygun bir metin oluşturulmuş; gerekli yerlerde açıklamalar, kaynak atıfları ve değerlendirmeler yapılmıştır. Bu yönüyle araştırma, Hanefî fıkıh mirasının önemli bir eserini gün yüzüne çıkarmayı ve çağdaş araştırmacıların istifadesine sunmayı amaçlamaktadır."
