abstract: "Bu çalışma, Cibuti Cumhuriyeti'ndeki İslami finans ve bankacılığı ve yayılmasını geciktiren engelleri tespit etmeyi amaçlamaktadır ve Cibuti Cumhuriyeti'nde İslami bankacılığın doğuşu ülkenin ekonomik dinamiklerini değiştirdi mi? Cibuti ekonomisi, son yıllarda yıllık ortalama yüzde 6,5 oranında güçlü bir büyüme kaydetti. İslami bankacılık varlıkları yıllık ortalama yüzde 20 oranında büyüyor. İslami finans, Cibuti'nin bankacılık pazarının yüzde 17'sini temsil ediyor. Yurt içi fiyatlar, 2017'de yıllık yüzde 3'lük enflasyon oranıyla nispeten istikrarlı. Cibuti'nin ülkeye iyi hizmet eden bir para kurulu var. ABD doları için sabit bir döviz kuru vardır. Dış uluslararası rezervler, üç ayın üzerindeki ithalatı karşılamasıyla rahat bir seviyede. İslami bankacılık sektörü istikrarlı bir şekilde büyüyor. 2017 sonu itibarıyla ülkede faaliyet gösteren 11 bankadan üçü İslami bankalardır ve pazar payları toplam bankacılık varlıklarının% 21'ini oluşturmaktadır. Genel olarak, finansal hizmetler GSYİH'nın% 13'ünü oluşturmaktadır. Bankacılık, varlıkların% 97'si ile Cibuti'nin finansal hizmetler endüstrisinin büyük çoğunluğunu oluşturmaktadır. Sigorta sektörü, varlıkların ilave% 2,5'ini oluştururken, mikrofinans kalan% 0,5'lik kısımdan sorumludur. Çalışmanın ışığında, bir dizi öneri çıkarıldı: İslami bankacılıkta ileriye dönük sürekli büyümeyi sağlamak için, İslami finans konusunda liderliğin taahhüdü ve halkın olumlu tutumu, gerekli düzenleyici çerçeve ve destekleyici kılavuzlar ile desteklenmelidir. İslami bankacılık araçları, ürünleri ve İslami finansman. Cibuti'nin İslami bankacılık sistemi, İslami standartların, prosedürlerin ve uygulamaların çapraz senkronizasyonundan büyük ölçüde faydalanacaktır."
