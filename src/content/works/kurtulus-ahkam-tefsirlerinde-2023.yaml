abstract: "Ahkâm tefsirleri, Kur'ân'ın hüküm ifade eden âyetlerini konu edinmektedir. Hz. Peygamber döneminde âyetin ne mânaya geldiği, hüküm ifade edip etmediği, bizzat Hz. Peygamber'den öğrenilip anlaşılabiliyordu. Bu anlama faaliyeti Hz. Peygamber'den sonra yedi harf ruhsatının da etkisiyle kırâat farklılıklarının ortaya çıkmasına ve devamında değişik mânalara gelmesine dolayısıyla da farklı hükümlere varılmasına sebep olmuştur. Bir giriş, üç bölüm ve bir sonuçtan oluşan bu çalışmada kırâat farklılıklarını esas alarak, el-Cessâs ve el-Kurtubî tefsirleri mukârene edilerek incelenmiştir. Giriş bölümünde çalışmanın konusu, amaç, yöntem ve kapsamıyla ilgili bilgiler verilirken istifade edilen belli başlı kaynaklar açıklanmıştır. Birinci bölümde kırâat ilmi ile ilgili temel bilgiler verildikten sonra kırâat ilminin tefsir ve fıkıh alanında yorum farklılıklarına etkisi ve her iki tefsirin müellifi hakkında özet bilgi de birinci bölümde yer almaktadır. İkinci bölümde el-Cessâs ve el-Kurtubî'nin eserlerinde tefsir, hadis, fıkıh, kelâm, dil ve tarih gibi faydalandıkları kaynakları ve müfessirlerin tefsir usûlü ve fıkıh usûlü ile ilgili kullandıkları metotları ve yaklaşımlarını ele aldık. Üçüncü bölümde ise müfessirlerin kırâatlere yaklaşımı ve buradan hareketle hüküm çıkarma tercihleri işlenmiştir. Sonuç bölümünde ise ulaşılan hedef, görülen eksiklikler ve araştırmacılara yapılan tavsiyeler yer almıştır."
