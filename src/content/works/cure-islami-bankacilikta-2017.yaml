abstract: "Murabaha; bir kimsenin sahip olduğu malı, alış fiyatı üzerine müşteriyle anlaşılan miktarda kar koyarak ve bu durumu müşteriye beyan ederek satmasıdır. Malın maliyetinin ve üzerine konulan kar miktarının müşteri tarafından bilinmesi şarttır. Murabaha akdi, daha önce taraflar arasında herhangi bir vaad işlemi söz konusu olmaksızın gerçekleştirilirse klasik murabahadan söz edilir. Ancak İslami finans kuruluşu aracılığıyla ve mal almak isteyen müşteriyle daha önceden taraflar arasında vaad işlemi gerçekleştirilerek murabaha sözleşmesi akdedilirse çağdaş murabahadan söz edilir. İslami bankaların gerçekleştirdiği bu çağdaş murabaha işlemlerinde uyulması gereken çağdaş murabaha standartları, AAOIFI Fıkıh Kurulu tarafından“İslami Standart 8 – Murabaha”adı ile yayınlanmıştır. Bu çalışmada, ilk olarak İslami bankaların çağdaş murabaha standartlarına uyarak bireysel çağdaş murabaha işleyişlerinin nasıl olması gerektiği açıklanmaya çalışılmıştır. Akabinde Türkiye'de Katılım Bankaları tarafından uygulanan bireysel çağdaş murabaha işlemleri yasal dayanaklarıyla birlikte ve tüm detaylarıyla ortaya konulmaya çalışılmıştır. Katılım Bankalarında çağdaş murabahanın işleyişi, çağdaş murabaha standartları ile mukayese de edilerek uyum sağlanamayan uygulamaların da tespit edilmesi amaçlanmıştır. İnceleme sonucunda, Katılım Bankalarının bireysel çağdaş murabaha işleyişlerinde farklılıklar olduğu ve bazı standartların da yasal sebepler nedeniyle uygulanamadığı görülmüştür. Standartlara tam uyum sağlanabilmesi için yasa koyucular tarafından bazı yasal değişikliklerin yapılması gerektiği sonucuna varılmıştır."
