abstract: "Çalışmada İslam Aile Hukukunda tefrik kavramı incelenmiş ve Osmanlı Devleti'nde tefrikin nasıl tatbik edildiği araştırılmıştır. Araştırmada kaynak olarak klasik fıkıh eserlerinden ve güncel olarak kaleme alınan tezler ve makalelerden istifade edilmiştir. Osmanlı Devleti'ne ait kadı sicilleri incelenerek tefrik türü boşanma davalarının genel bir portresi çizilmiştir. Tez iki bölümden oluşmaktadır. Birinci bölümde, semavi dinlerin, Türk Medenî Kanununun ve özellikle İslam hukukunun aileye, aile hukukuna ve boşanmaya bakışı hakkında bilgiler verilmiştir. İkinci bölümde tefrik konusu detaylıca işlenmiş olup mezheplerin yaklaşımları ve güncel olarak İslam ülkelerinde yürürlükte olan tefrik sebepleri ele alınmış ve Osmanlı dönemine ait kadı sicillerinden tefrik davalarına ilişkin örnekler verilmiştir."
