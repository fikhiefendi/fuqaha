abstract: "Tezimizin konusu“İsâ b. Ebân'ın Sünnet Anlayışı”nın incelenmesidir. Tez, bir giriş ve iki ana bölümden oluşmaktadır. Birinci bölümde, İsâ b. Ebân'ın hayatı, yaşadığı dönem ve genel olarak ilmi yönü ele alınmaktadır. İlmi yönü ile ilgili kısımda İsâ b. Ebân'ın hadis, fıkıh ve kelamî yönü değerlendirilmektedir. İsâ b. Ebân'ın tesir ettiği ve tesirinde kaldığı şahıslar, hocaları, talebeleri ve eserleri hakkında bilgi verilmektedir. Sünnetin hadis, kelam ve usûl alimleri tarafından tanımı yapılarak, Hz. Peygamber'in fiilleri, teşrii değeri açısından ele alınmaktadır. Tezin ikinci bölümünde ise, İsâ b. Ebân'ın sünnet anlayışı ele alınmaktadır. İlk dönem Hanefiler'de sünnet anlayışı, haber ve haberlerle ilgili hususlara geniş yer verilmekte, haber konusundaki ihtilaflar, kısımları ve dereceleri ele alınmakta, mütevatir haber; doğruluğu kesin olarak bilinen (zorunlu bilgi ifade eden), doğruluğu bir delil ile sabit olan (zorunlu bilgi ifade etmeyen) şeklindeki haberler ile meşhur haberlerin İsâ b. Ebân'ın sınıflandırması esas alınarak incelenmektedir. Âhâd haberlerle ilgili meseleler; bilgi değeri, amelin gerekliliği, delil olma yönü, kabul şartları ve reddini gerektiren sebepler açısından değerlendirilmektedir. Mürsel hadis, zıt haberlerden birini tercih sebepleri, sahabînin muhalif kaldığı haber-i vahidler, meçhulün haberi, ravilerin vehm ve hataları, ravi ve rivayetlerle ilgili meseleler ve haber-i vâhid-kıyas çatışmasında tercih sebepleri değerlendirilmektedir."
