abstract: "Kur'ân-ı Kerîm'de ayrıntılı bir şekilde anlatılan konuların başında nikâh ve talâk bahisleri gelir. Çalışmamızda ağırlıklı olarak bu konunun Kur'ân'da nasıl ele alındığı tetkik edilecektir Çünkü Kur'ân, insanın maddî ve manevî ihtiyaçlarının keyfiyetini en bâriz bir şekilde ortaya koyar. Örnek olarak sunduğu geçmiş kavimlerin yaptıklarından ibret alınmasını bekler. Giriş bölümünde nikâh ve talâk kavramlarının etimolojik tahlili ve bu konuyla ilişkin bazı kavramlar ele alınacaktır. Birinci bölümde ise Kur'ân-ı Kerîm'de nikâhtan nasıl bahsedildiğine, daha çok hangi yönlerine önem verildiğine, adı geçen bazı peygamberlerin hayatındaki evlilik kıssalarına ve özel olarak Hz. Muhammed (s.a.v.)'in evliliklerine değinilecektir. Daha sonra zaruret halinde talâkın mubah kılınmasıyla birlikte, talâkta nasıl bir yöntem izlendiği de açıklanacaktır. İkinci bölümde nikâh ve talâka dair âyetlerin tefsirine yer verilecektir. Bu bölümde ayetlerin sıralanması fıkhî tasnife göre olacaktır. İlgili ayetleri fıkhî tasnife göre incelediğimiz için, bu çalışmamız konulu tefsir çalışmasına örnek teşkil eder. Bundan dolayı konulu tefsir metodundan faydalanılacaktır. Konu ile ilgili farklı sûrelerdeki ayetler bir araya getirmek suretiyle sunulacaktır."
