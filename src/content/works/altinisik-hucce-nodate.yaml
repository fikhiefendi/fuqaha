abstract: "Hanefî mezhebinin müdevvini ve râvîsi olarak oldukça önemli bir yeri haiz olan ve H. 2. asrın önde gelen fakihlerinden sayılan İmâm Muhammed'in ehl-i rey olarak bilinen Kûfe ekolü ile ehl-i hadis olarak bilinen Hicaz ehli arasında yaşanan ihtilafları bir nebze de olsun göstermek adına kaleme aldığı bu eser, mukayeseli fıkhın ilk örneklerinden sayılmaktadır. el-Hucce 'alâ Ehli'l-Medîne adını verdiği bu eserinde Medîne ehlinin temsilcisi olarak kabul ettiği dönemin önde gelen alimlerinden ve Mâlikî mezhebinin kurucu imamı olan Mâlik b. Enes ile girmiş olduğu ilmi münazaralar sonucu ihtilaf edilen meselelerde muhataplarına yönelttiği eleştirileri ihtiva etmektedir. Söz konusu bu eleştiriler çalışmanın kaleme alınma sebebidir.“Şer'î Deliller Bağlamında el-Hucce 'alâ Ehli'l-Medîne Adlı Eserinde İmâm Muhammed'in İmâm Mâlik'e Yönelttiği Temel Eleştiriler”başlığını verdiğimiz bu çalışma, bir giriş, üç bölüm ve bir sonuçtan oluşmaktadır. Giriş kısmında, konunun önemi; tezin amaçları ve sınırları, tezde istifade edilen kaynaklar, konuların ele alınış ve aktarılış yöntemiyle literatüre ait genel bilgilere yer verilmiştir. Birinci bölümde; eseri bağlamında eleştirilerini irdelemeye çalıştığımız, asrının önde gelen alimlerinden olan İmâm Muhammed eş-Şeybânî ve İmâm Mâlik'in kısaca biyografilerine, ictihad usul ve yöntemlerine, mezhepteki konumlarına, hoca-talebe bilgilerine temas edilmiştir. Ayrıca eserin isminde yer verilecek derecede bir önemi haiz olan Ehl-i Medîne ve Amel-i Ehl-i Medîne kavramlarına bu bölümde değinilmiştir. Eserde işlenen konular ibadetler, muâmelât hukuku, aile hukuku, ceza ve ferâiz hukuku şeklinde klasik tasnif esas alınarak işlenmiştir. Bu haliyle konuların insicamına, tertip ve düzenine bağlı kalınamayacağı; ayrıca Şeybânî'nin eleştirilerini şer'î dayanaklar vasıtasıyla delillendirme eğiliminde olmasından hareketle söz konusu eleştirileri deliller çerçevesinde tasnif ederek serdetmeyi uygun gördük. Bu itibarla çalışmanın ikinci bölümünü, aslî deliller olan Kitap, Sünnet, İcmâ' ve Kıyas delilleri çerçevesinde yöneltilen eleştirilere hasrettik. Üçüncü bölümde de İslam Hukuku'nun fer'î/tâlî delilleri sayılan örf, sedd-i zerîa, istihsân, maslahat ve sahabe kavli gibi diğer deliller etrafında yöneltilen eleştirileri irdelemeye ve incelemeye çalıştık. Bütün bu mülahazalardan elde ettiğimiz değerlendirmeleri de sonuç bölümünde kısaca belirterek çalışmamıza nihayet verdik."
