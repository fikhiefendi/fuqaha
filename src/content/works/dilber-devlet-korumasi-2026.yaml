abstract: "Bu çalışma korunmaya muhtaç çocukların devlet koruması altına alınması sürecinde uygulanan Çocuk Evleri modelini aile birliği, devlet müdahalesi ve velayet kavramları çerçevesinde ele alarak, söz konusu uygulamayı İslam hukuku açısından değerlendirmeyi amaçlamaktadır. Çocuğun korunması meselesi hem İslam hukukunda hem de modern hukuk sistemlerinde önemli bir yer tutmakta olup, özellikle devletin çocuğa hangi şartlarda ve hangi sınırlar içinde müdahale edebileceği hususu tartışmaya açık bir alan oluşturmaktadır. Bu bağlamda çalışma Türkiye'de çocuk koruma sisteminin tarihsel gelişimini ortaya koyarak, güncel bir uygulama olan Çocuk Evleri modelini fıkhi bir perspektifle incelemektedir. Çalışmanın ilk bölümünde Osmanlı Devletinden Cumhuriyet dönemine uzanan süreçte çocuk koruma kurumlarının geçirdiği evreler ve bu alandaki hukuki düzenlemeler ele alınmıştır. Tanzimat öncesinde aile, vakıf ve mahalle merkezli koruma anlayışı; Tanzimat sonrası dönemde ise artan kurumsallaşma ihtiyacı ve devletin çocuk koruma alanına daha görünür biçimde müdahil olması incelenmiştir. Cumhuriyet döneminde sosyal hizmetlerin merkezileşmesi, çocuk koruma alanındaki mevzuatın gelişimi ve nihayetinde Çocuk Evleri uygulamasının ortaya çıkışı tarihsel bir bütünlük içinde değerlendirilmiştir. İkinci bölümde Çocuk Evlerinde kalan çocukların psikososyal durumları ele alınmış, kurumsal bakımın çocukların duygusal, sosyal ve kimlik gelişimleri üzerindeki etkileri incelenmiştir. Bu kapsamda çocukların bakım elemanları ile öz aileleri arasındaki ebeveynlik algıları, kurumsal bakım sürecinin çocukların toplumsal uyumuna etkileri ve toplumun Çocuk Evlerine yönelik farkındalık düzeyi değerlendirilmiştir. Böylece Çocuk Evleri uygulamasının hukuki boyutunun yanı sıra psikososyal boyutları da ortaya konulmuştur. Çalışmanın üçüncü bölümünde ise İslam hukukunda çocuğun korunmasına ilişkin fıkhi birikim ele alınmış; radâ, velayet, nafaka ve hidâne gibi kurumlar çerçevesinde çocuğun öncelikle aile içinde korunmasının esas alındığı gösterilmiştir. Bununla birlikte, aile korumasının yetersiz kaldığı durumlarda devletin velâyet-i âmme yetkisi kapsamında devreye girmesinin fıkhi meşruiyeti tartışılmıştır. Osmanlı uygulamaları ışığında devletin çocuğa yönelik koruyucu ve denetleyici rolü ortaya konulmuş, bu birikim temelinde Çocuk Evleri uygulaması fıkhi açıdan değerlendirilmiştir. Son olarak, Çocuk Evlerinde kurumsal bakımın problem alanları tespit edilerek, çocuğun üstün yararı, aile birliğinin korunması ve devlet müdahalesinin sınırları çerçevesinde bazı öneriler geliştirilmiştir. Çalışmada temel olarak mevzuat metinleri, sosyal hizmet düzenlemeleri, psikososyal araştırmalar ve fıkıh kaynaklarından yararlanılmıştır. Yapılan değerlendirmeler sonucunda, Çocuk Evleri uygulamasının zorunlu durumlarda bir koruma mekanizması olarak işlev gördüğü, ancak İslam hukukunun öngördüğü aile merkezli koruma anlayışının yerini kalıcı biçimde almasının fıkhi açıdan sorunlu olduğu tespit edilmiştir. Bu nedenle devlet korumasının geçici, denetleyici ve aileyi güçlendirici bir çerçevede yeniden ele alınması gerektiği sonucuna ulaşılmıştır."
