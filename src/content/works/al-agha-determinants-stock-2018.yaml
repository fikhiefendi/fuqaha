abstract: "Son yıllarda, İslami hisse senedi piyasaları, dünya hisse senedi piyasaları arasında önemli bir yere sahip olmuştur. Günümüzde ise, bu piyasalar uluslararası finans sisteminin ayrılmaz bir parçası hâline gelmiştir. İslami senedi piyasalarının yükselişe geçişi ve ahlaki prensipleri, Müslüman ve gayrimüslim ülkelerdeki farklı yatırımcıların ilgisini çekmektedir. Bu çalışma, İslami ve konvansiyonel senedi piyasalarının farklılıkları; getirilerin belirleyicileri, birlikte hareket ilişkisi ve piyasa performansı gibi farklı alanları göz önünde bulundurarak ortaya koymayı amaçlamaktadır. Çalışmada buna ek olarak, sub-prime krizinin İslami ve konvansiyonel piyasadaki etkileri de incelenmiştir. Araştırmanın örneklemi; USA, UK, Kanada, Japonya ve Endonezya olmak üzere 5 ülkenin konvansiyonel ve İslami piyasa endekslerinden alınan 10 endeksten oluşmaktadır. Çalışmada 2000 ve 2014 yılları arasındaki dönem baz alınmıştır. Sharpe oranı analizine göre bütün süreç boyunca, kriz öncesindeki süreçte de olduğu gibi, Endonezya hariç olmak üzere diğer ülkelerde konvansiyonel endeksler İslami endekslerden daha iyi performans göstermiştir. Kriz sürecinde ise İslami endekslerin (Birleşik Krallık hariç olmak üzere) bütün ülkelerdeki performansı, konvansiyonel endekslerden daha iyi sonuç göstermiştir. Bununla birlikte, kriz sonrası dönemde konvansiyonel endeksler, İslami endekslere göre daha iyi performans göstermiştir. Engle-Granger Koentegrasyon (Eş-bütünleme) Testi sonucuna göre, İslami ve konvansiyonel borsa arasında uzun vadede koentegrasyon bulunmamaktadır. Bununla birlikte Granger nedensellik analizine göre, USA, UK ve Japonya'da İslami borsalara doğru sadece tek yönlü nedensellik bulunmaktadır; bu da konvansiyonel borsaların kısa vadede İslami borsaları etkiledikleri anlamına gelmektedir. Diğer taraftan Endonezya ve Kanada'da, İslami ve konvansiyonel borsaların kısa vadede birbirini dengelediği bir Granger nedenselliği mevcuttur. Piyasa performansının belirleyicilerinin analiz sonuçlarına göre, İslami ve konvansiyonel borsa endekslerini etkileyen faktörler arasında istatistiksel farklılıklar bulunmamaktadır. Adımsal regresyon analizine göre ise, borsa performansının ana belirleyicileri döviz kuru, Gayrisafi Yurtiçi Hasıla ve petrol fiyatlarıdır."
