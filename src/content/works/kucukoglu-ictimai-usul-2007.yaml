abstract: "ctimâi usûl-i fıkıh teorisi Ziya Gökalp tarafından ortaya atılmıs birteoridir. Daha sonra slam Mecmuası'nda Halim Sabit ve Mustafa Seref bu teoriyidestekleyen yazılar yazmıslardır.ctimâi usûl-i fıkıh, fıkıh usûlünü sosyal bilimlerle temellendirmeyeçalısan bir teoridir. Bu teori örfü ayet ve hadisten sonra üçüncü temel unsur olarakele almıstır.Bu teoriye karsı zmirli smail Hakkı Sebilü'r-Resad Mecmuasında serimakaleler yazmıstır. zmirli smail Hakkı da usûl-i fıkhın günümüzeuyarlanmasını istemistir. Ama bunu yaparken klasik usûl-i fıkha baglı kalınmasınıistemistir.Usûl-i fıkıhta yapılmak istenen düzenlemelerin gündeme geldigigünümüzde, ictimâi usûl-i fıkıh teorisinin inceden inceye gözden geçirilmesigerekir."
