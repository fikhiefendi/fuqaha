abstract: "İnsanın toplumsal ilişkilerinden önemli bir tanesi olan komşuluk hem İslam hukuku hem sosyoloji hem de mimarlık alanlarında önemli bir mesele olmuştur. İslam'ın bilgi kaynaklarından Kuran-ı Kerîm ve hadislerde komşuluk önemsenmiştir. Dolayısıyla İslam hukuku alanındaki düşünürler bu kaynaklardan faydalanarak komşulukla ilgili meseleleri işlemişlerdir; komşuluk hakkı, irtifak hakkı ve şüf'a hakkı bu meselelerdendir ve çalışmada kısaca ne oldukları izah edilmiştir. İslam'daki komşuluk tanımları üzerinden geleneksel şehir dokularının oluşumu ve İstanbul'da bu oluşumun nasıl dönüştüğü araştırılmıştır. İstanbul'un tarihi süreci İslam dini olmaksızın tamamlanamayacağına göre önce İslam kültüründeki komşuluktan bahsedip sonra İstanbul'a yönelmek faydalı olmuştur. İstanbul'un şehir dokusunun seyrini görebilmek ve komşuluğun durumu anlayabilmek adına fetih öncesi, fetih esnası ve 16.yy'daki şehir strüktürü incelenmiştir. 19.yy'daki bazı imar düzenlemelerine, muhtarlık teşkilatının ortaya çıkışına, belediyeciliğin mahalle dokusuna etkisine, Müslüman ve gayrimüslim mahallelerine, mimarlık tarihimizdeki Batı etkisine, apartmanlaşmanın ülkemizdeki ilk örneklerine ve Turuk ve Ebniye Nizamnamesi'ne değinilmiştir. Osman Nuri Ergin'in türünün ilk örneği olan Mecelle-i Umûr-ı Belediyye adlı eseri sayesinde Osmanlı şehir düzeni, kanunlar ve nizamnamelerle bu düzenin değişimi ve yaşanmış bazı örnekler incelenmiştir. Bütün bunlar sayesinde Osmanlı'dan kalan şehir düzeninden günümüz şehrine geçişi, mahalle dokularındaki değişiklik ve dolayısıyla komşuluk ilişkilerinin dönüşümü daha anlaşılır hale getirilmiştir. Son olarak ise günümüz İstanbul'unu görebilmek adına hem kentsel sit alanlarından hem de yeni gelişme yerlerinden örnekler verilerek bu bölgelerdeki konut dokusu ve komşuluk ilişkilerine ışık tutulmuştur. Kentsel sit alanlarından Suriçi, Galata ve Üsküdar üzerinde durulmuş; yeni gelişme alanlarında ise toplu konutların ortaya çıkışı ve bazı imar durumları, daha sonra ise güvenlikli sitelerin artışı ve rezidansların doğuşu Çekmeköy, Ataşehir ve Maslak gibi bölgelerle örneklenmiştir. Bu çalışma, komşuluk konusunun İslam hukukundaki yerini anladıktan sonra tarihi bir süreç içerisinde İstanbul'da komşuluğun seyrini özetleyip günümüz İstanbul'undaki yapılı çevre düzeninde ve bu şehir hayatındaki insanî ilişkiler çerçevesinde komşuluğun durumunu tespit etmeyi hedeflemektedir. Bu durum tespiti sayesinde görülen bazı sorunları çözmek, devlet eliyle doğru şehirler planlamak, gelecek nesillere daha iyi şartlarda bir düzen bırakmak, mimari hatalardan geç olmadan dönmek ve daha sağlıklı komşuluk ilişkileri kurmak daha mümkün hale gelecektir."
