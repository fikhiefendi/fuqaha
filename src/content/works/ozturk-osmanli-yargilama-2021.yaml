abstract: "Çalışmada“şuhûdü'l hâl”müessesesinin Osmanlı yargılama hukukundaki yeri ele alınmıştır. Tarihte“şuhûdü'l hâl”ile benzer görevleri ifa eden heyetler mevcuttur. Bu heyetlerin teşekkülündeki nedenler müessesenin varlığını Osmanlı Devleti'nde de sürdürmesini sağlamıştır. Literatürde konuya ilişkin çalışmaların sınırlı sayıda olduğu görülmektedir. Araştırmada fıkıh, tefsir ve hadis kitaplarına, fetva ve sak mecmualarına, kanunnamelere müracaat edilmiştir. Öğretideki diğer çalışmalardan istifade edilmiş, başlıca veri kaynağı ise şer'iyye sicilleri olmuştur. Çalışmada bütünden hareketle parçaya ulaşan bir bakış açısı benimsenmiştir. Müessesenin bir parçası olduğu Osmanlı yargı teşkilatına ve kadı mahkemesine temas edilmiştir. Önceki heyetlerin yerine getirdiği vazifelerin Osmanlı yargı teşkilatında çeşitli görevlilere paylaştırıldığı görülmektedir. Bu görevlilerin vazifeleri tespit edilerek“şuhûdül hâl”in üstlendiği fonksiyonların ayırt edilmesi amaçlanmıştır. Osmanlı uygulamasında müessesenin en az iki kişiden meydana geldiği, bazı kimselerin isimlerinin kaydedilmesine öncelik verildiği gözlemlenmektedir.“Şuhûdü'l hâl”de toplumun farklı kesimlerinden kişiler bulunabilmektedir. Bu kişiler davanın konusu ve taraflarına bağlı olarak değişebilmiştir. Mahkemede hazır bulunarak yargılama faaliyetine ve diğer hukukî işlemlere şâhitlik eden“şuhûdü'l hâl”yargılamanın aleniyetini sağlamaktadır. Müessese aynı zamanda kadının bağımsız ve tarafsız hüküm vermesinde etkili olmuştur. Müessesenin fonksiyonlarının önceki uygulamalara kıyasla daha sınırlı ve spesifik bir hal aldığını söylemek mümkündür. Osmanlı pratiğinde“şuhûdü'l hâl”in üstlendiği fonksiyonların yargılamanın temel ilkelerine ilişkin olduğu sonucuna varılmıştır."
