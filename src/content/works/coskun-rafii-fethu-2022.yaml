abstract: "Râfiî el-Kazvînî, bugünkü İran topraklarında doğmuş ve tarihte kendisinden Alimu'l-'acem ve'l-Arab olarak söz ettirmiş Şâfiî bir alimdir. Mezhep içerisindeki dağınık görüşleri toplaması ve sahih olan ile şaz olan görüşleri birbirinden ayırıp mezhebin görüşünün belirlenmesinde önemli bir rol oynaması sebebiyle kendisine iki şeyten biri anlamına gelen“şeyhân”unvanı takdir edilmiştir. Râfiî, çok sayıda eser telif etmiş, bu eserler içerisinde en önemlilerinden birisi de hiç şüphesiz Gazzâlî'nin el-Vecîz'i üzerine yaptığı şerh çalışması Fethu'l-azîz'dir. Şâfiî Mezhebine ait olan görüşlerin aktarılıp zayıf ve sahih olan görüşleri belirtmesi, farklı mezhep imamlarının görüşlerini aktarıp delilleri tartışması mukayeseli bir fıkıh kitabı havası katmıştır. Râfiî, Fethu'l-azîz isimli eserinde özellikle Ebû Hanîfe'ye diğer imamlara nispetle daha fazla atıfta bulunmuştur. Çalışmamız, giriş, üç ana bölüm ve sonuç kısımlarından oluşmaktadır. Giriş kısmında araştırmamızın önemi, kapsamı ve yöntemi hakkında bilgiler verilmiştir. Birinci bölümde Râfiî el-Kazvînî'nin hayatı, mezhep içerisindeki konumu ve özelde Fethu'l-azîz olmak üzere diğer eserleri de tanıtılmıştır. İkinci bölümde ise okuyucularımıza tezimizin ana konusu olan üçüncü kısmı daha iyi anlamlandırabilmeleri için temel teşkil edecek İslam ceza hukuku ile ilgili bazı bilgiler verildi. Üçüncü bölümde ise tezimizin ana konusu olan Fethu'l-azîz'de Ebû Hanîfe'ye nispet edilen görüşlerin tespit ve tahlili yapıldı. Sonuç kısmında ise çalışma hakkında bilgi verilerek ulaşılan sonuçları bir veri halinde okuyucuların istifadesine sunuldu."
