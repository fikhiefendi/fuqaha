abstract: "Genis bir muhteviyatla Kur'an'ın anlasılmasına katkısı olan Kur'an ilimleri her dönemde, degisik alanlardan bilginlerin ilgi ve arastırmalarına konu olmustur. Bu arastırmalar bazen tüm konuları içine alacak sekilde çok genis tutulmus, bazen de birkaç konuyla sınırlı tutulmustur. Çok yönlü bir alim olan ancak esas itibari ile fıkıh usulü bilgini olarak bilinen İmam Sâtıbî de Kur'an ilimleri içinden belli temel konulara yer veren bilginlerden biri olmustur. Bu yönüyle bir fıkıh usûlü bilgininin Kur'an ilimleri konularına nasıl bir yorum getirdigi tezimizin temel hareket noktasını olusturmustur. Arastırmamız giris ve iki bölümden olusmaktadır. Giriste genel hatlarıyla Kur'an ilimlerinin dogusu ve tedvini, ulumu'l-Kur'an kavramı, bu alanda yazılan eserler gibi genel bir tarihçe üzerinde durulmustur. Birinci bölümde; Sâtıbî'nin hayatı, yasadıgı çevre, sahsiyeti, eserleri, hocaları ve ögrencileri hakkında özet bir bilgi verilmistir. ikinci bölümde ise Sâtıbî'nin isledigi her bir konu ile ilgili, arastırmacı açısından bir alt yapı olusturması düsüncesiyle genel bir bilgiye yer verilmistir. Konular öncelikle kavram düzeyinde ele alınmıstır. Farklı görüslere yüzeysel olarak deginilmis daha sonra da müellifin konuyla ilgili görüs ve düsüncelerine yer verilmistir. Her bölümden sonra da çok kısa bir degerlendirmede bulunulmustur. Sonuç bölümünde ise islenen konular ana hatlarıyla degerlendirilmekte ve bir sonuca varılmaktadır."
