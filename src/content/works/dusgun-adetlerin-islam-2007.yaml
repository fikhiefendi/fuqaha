abstract: "İnsanın ahlaki ve hukuki sorumluluğu ile yazılı hukuk kuralları eş zamanlı değildir. Yazılı hukuk kurallarından önce de insanların hak ve görevlerini belirleyen birtakım toplumsal düzen kurallarının varolduğu bilinmektedir. Her toplumun kendine has sosyal, kültürel, politik, ekonomik şartlarına uygun olarak oluşan ve gelişen bu kurallar, toplum düzen ve güvenliğini sağlamaya yardımcı olmaktadır. Örf ve adetler de düzeni sağlayan kurallardandır. Toplumun ortak değer ve inanışlarının ürünü olan örf ve adetler, nesilden nesile aktarılırlar. Toplumun ortak sosyal hafızasının ürünü olan bu kurallar, insanların yaşamlarını düzene koyar ve kolaylaştırır. Örf ve adetler, toplumdaki fonksiyonellikleri nedeniyle hukuk normları oluşturulurken hukuk tarafından her zaman dikkate alınmıştır. İslam hukukunda da örf ve adet, önemli kaynaklardan biri kabul edilmiştir. Bu çalışmamızda İslam öncesi dönemdeki bazı örf ve adetlerin Kur'an'a yansımasını ve bunun İslam hukukuna etkisini inceledik. Kur'an'ın İslam öncesi örf ve adetler konusunda kendi ilke ve hedeflerine göre tavır sergilediği ve sosyal alanda yapacağı bazı düzenlemeleri genel olarak örf ve adetler zemininde yaptığı sonucuna ulaştık. Buna göre Kur'an genel olarak, bireysel ve toplumsal bütünlüğe zarar vermeyen, toplumsal hayatı kolaylaştıran ve düzene koyan örf ve adetleri kabul etmiş, insana ve dolayısıyla topluma zarar veren örf ve adetleri ise düzenlemiştir. Kur'an'ın İslam öncesi dönemin uygulamalarını dikkate alması nedeniyle, örf ve adet İslam hukukunda önemli kaynaklardan biri kabul edilmiştir."
