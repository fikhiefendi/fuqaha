abstract: "Reformlar, onlarla bağlantılı sosyo-ekonomik değişiklikler ve savaşlar nedeniyle yirminci yüzyılın başında Osmanlı İmparatorluğu'nda aile kurumu ile ilgili konular -evlilik, boşanma, nafaka ve miras- gündemde idi. Toplumdaki aile hukuku ile alakalı sıkıntıları gidermek ve sorunlara cevap verebilmek maksadı ile Müslüman âlimler, hukukçular ve politikacılar için çalışmalar yapmaktaydı. Öte yandan, hukuktaki modernleşme ve hukukun toplumu kontrol aracı olarak kullanılması -ki bu sayede ulus-devletin kurulması, Osmanlı vatandaşının yaratılması ve yeni aile yapısının oluşturulması mümkün olabilmişti- Osmanlı hukuk kültürünü de değiştirmişti. Değişen hukuk kültürü ise İslam hukukunun diğer tüm alanlarında olduğu gibi aile hukukunda da değişiklikler yapılmasını gerektiriyordu. Aile Hukuku, geç dönem Osmanlı İmparatorluğu'nda arz ettiği öneme rağmen yeterince çalışılmamış bir konudur. Genel tarih yazımında, politik kurumlar, diplomatik olaylar ya da entellektüel akımlar görece daha çok yer almıştır. Öte yandan, yapılan çalışmalarda, ilerleme ve modernliğin Batı, durağanlık ve geri kalmışlığın Doğu ile özdeşleştirilmesi Osmanlı Aile Hukuku araştırmalarını bir ölçüde yanlış yönlendirmiştir. Bu çalışmanın ana amacı, 1917 Aile Hukuku Kararnamesi'nin hukuki, politik, sosyo-kültürel eksenlerini incelemek ve yenilenmiş Aile Hukuku hükümlerinin geç Osmanlı hukuk kültürü, devleti ve toplumu için uygun olup olmadığını değerlendirmektir."
