abstract: "Allah (c.c) her canlıyı kendi cinsinden bir eş ile birlikte yaratmış ve aralarında çekim oluşturacak duygularla donatmıştır. Yeryüzündeki ilk çift ile başlayan kıyamete kadar da devam edecek olan eşler arasındaki bu çekim, evlilik kurumunu doğurmuştur. Allah (c.c) kadınla erkeği fıtrat olarak farklı fakat birbirini tamamlayacak özelliklerde yaratmış ve aralarındaki birlikteliğin mutlu bir şekilde devamı için her birine ayrı sorumluluklar yüklemiştir. Eşlerin fıtrat özellikleri farklı olduğu gibi evlilikteki sorumlulukları da farklıdır ve sorumluluklarının bilincinde olmaları, sorumluluklarını yerine getirmeleri de evliliğin olmazsa olmazlarındandır. Sevgi ve muhabbetin devamlılığı için eşlerin sorumlulukları noktasında karşılıklı çaba göstermeleri gerekmektedir. Aksi takdirde ailenin dağılması kaçınılmazdır. Bu noktaya gelmiş karı koca ilişkilerinde tarafların nasıl davranacakları evlilik ve aile kurumu için çok önemlidir. Bu çalışmada öncelikle İslam hukukunda eşlerin karşılıklı hak ve sorumlulukları bağlamında; kocanın nâşize hanımını tedip etme konusunun amacı, önemi ve sınırlarına yer verilmiştir. Genel olarak eşlerin birbirlerine karşı hak ve sorumlulukları ele alınmıştır. Kadının nüşûzu halinde kocanın kadın üzerindeki te'dip hakkının; amacına, sınırlarına, kocanın aile içindeki sorumluluklarıyla bağlantısına ve bunun kadına şiddet kapsamında değerlendirilip değerlendirilemeyeceğine, çağdaş aile yapısının ve şartların kocanın te'dib hakkına olan etkisine değinilmiştir."
