abstract: "el-Cuveynî, \"mana\"ya en çok önem veren usûlcülerin başında gelmektedir. Ona göre usûlün \"mana\"yla ilintili yönünü temsîl eden başlıca delil, kıyâstır. el-Cuveynî, kıyâsla amel etmenin \"aklen\" câiz; \"seman\" vâcip olduğunu düşünür. O, \"Sahâbe icmâı\"nı, kıyâsın kaynak değerini temellendiren en kuvvetli delil olarak görmektedir. el-Cuveynî'ye göre münâsebe(t), kıyâsta manayı/illeti tespit eden en fonksiyonel yöntemdir. Ona göre muteber bir talîl için şu beş şartın gerçekleşmesi gerekir: 1. Asıldan illet olmaya elverişli birtakım \"mana\"ların istinbât edilmesi. 2. \"Mana\"ların, \"zann-ı gâlib\"le elde edilmesi. 3. \"Mana\"ların, aslın hükmüne münâsib olması. 4. Hükme münâsib olan bu \"mana\"nın iptâl edici sebeplerden/itirâzlardan sâlim olması. 5. Münâsib \"mana\"nın usûlu'ş-şerîaya uygun olması ve bununla çelişmemesi gerekir. el-Cuveynî maslahat, hikmet, makâsidu'ş-şerîa gibi konuları kıyâs bölümünde zikreder. O, münâsebeyi maslahat, hikmet ve makâsidu'ş-şerîayla özdeşleştirir. Ona göre bu kavramların ortak paydası, \"münâsib mana\" temelli olmalarıdır. el-Cuveynî, münâsib manayı, -maslahatı/hikmeti/makâsidu'ş-şerîayı- zarûrî, hâcî ve tahsînî maslahatlar şeklinde kategorize eden, bunlara ilâveten \"bedenî ibâdetler\" kategorisini kurgulayan ve bu konuları detaylı olarak ele alan ilk usûlcüdür. Keza, zarûriyyât kategorisine yaptığı atıflarla, müteâkiben öğrencisi el-Ğazâlî'nin sistematize ettiği \"din\", \"can, \"akıl\", \"nesil\" ve \"mal\" şeklindeki \"beş küllî/zarûrî mana\" formülasyonunun gelişimine öncülük etmiştir. el-Cuveynî, münâsib mananın, -maslahatın/hikmetin/makâsidu'ş-şerîanın-usûlü'ş-şerîaya uygun olmasının gerekliliği üzerinde ısrarla durur. O, geliştirdiği \"usûlu'ş-şerîaya uygunluk\" formülü sâyesinde kontrollü ve ölçülü bir münâsib mana, -maslahat/hikmet/makâsidu'ş-şerîa- anlayışı inşâ etmiş ve hukûkun nizâmını/istikrârını/emniyetini sağlamıştır."
