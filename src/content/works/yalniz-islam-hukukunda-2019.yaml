abstract: "Bu çalışmada; Müslüman'ın en önemli ve günlük hayatında en çok yer tutan ibadetine (namaz) maddî ve manevî bakımdan temizlik sağlayan abdest, özellikle de çoraplara mesh edip edilemeyeceği Hz. Peygamber (s.a.s)'in hadisleri doğrultusunda incelenmiştir. Araştırma sonucunda; günümüzde çorap adını verdiğimiz ayak giysilerinin hem tarih boyunca devirden devire hem de örften örfe değiştiğini ve bu değişimin ileride de devam edeceği öngörülmektedir. Bu doğrultuda tartışmaların ve görüş farklılıklarının Müslümanlar arasında ayrışmaya neden olmaması gerektiği ortaya çıkmaktadır. Kuşkusuz önemli olan ibadetin icrasıdır ve bunu sağlamak için İslamiyet'in cevaz verdiği her türlü kolaylıktan yararlanabilmektir. Mesh ile ilgili hadislerin tamamı incelendiğinde görülmektedir ki; Hz. Peygamber (s.a.s), nübüvveti boyunca yaşadığı toplumun örfinde bulunan tüm ayak giysilerine mesh etmiş ve mesh edenlere de cevaz vermiştir."
