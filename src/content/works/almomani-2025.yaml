abstract: "Bu çalışma, gayrimenkul mallarla ilgili hükümleri İslam Borçlar Hukuku çerçevesinde incelemeyi amaçlamaktadır. Çalışma, mal türlerinden birini bağımsız olarak ele alarak bu malın diğer mal türlerinden ayırt edilmesini ve özelliklerinin net bir şekilde ortaya konmasını hedeflemiştir. Zira bu tür mallar, bireylerin ve toplumların temel ihtiyaçlarını karşılayabilmek için elde etmeleri gereken mallardır. Gerek bireylerin birbiriyle ilişkilerinde gerekse birey devlet ilişkilerinde bu mallar çokça gündeme gelmektedir. Bu malların elde edilmesi ve üzerinde hukuki tasarrufların yapılmasında bir çok mesele hukukun kapsamına girmektedir. Bu çalışma ile İslam Hukuku açısından gayrimenkul mallar üzerinde mülkiyet edinme, üzerinde tasarruf yapma, zarar durumunda tazmin gibi hükümler ele alınmış dolayısıyla borçlar hukuku bağlamında oluşabilecek meseleler mümkün mertebe ele alınarak İslam gayrimenkul hukuku ile ilgili meseleler bütüncül olarak incelenmeye çalışılmıştır. Bu tez dört bölümden oluşmaktadır Birinci bölümde, malın tanımı, kısımları ve bu ayrımın önemi ele alınmış, böylece diğer bölümlere giriş niteliğinde bir temel oluşturulmuştur İkinci bölümde, gayrimenkul mallara ilişkin akitler incelenmiş; ivazlı akitler, teberru akitleri, tevsik (belgelendirme) akitleri, irfak hakları ve iştirak akitleri gibi sözleşme türleri ayrıntılı şekilde değerlendirilmiştir. Üçüncü bölümde ise, gayrimenkul malların zilyetliği (mülkiyetin fiili kullanımı) konusu ele alınmış; gasp edilen taşınmazın zilyetliği ve buna ilişkin hükümler, ikta veya hıma yoluyla edinim, şufa hakkı (ön alım) ve zamanaşımı yoluyla taşınmaz mülkiyetinin kazanılması gibi hususlar incelenmiştir. Dördüncü ve son bölümde, gayrimenkul mallara ilişkin miras, zekât, mehir, hul' (boşanma bedeli), davalar ve ihtilaflar gibi çeşitli fıkhi hükümler ele alınmıştır. Ayrıca çağdaş uygulamalara da yer verilmiş; istisna sözleşmesiyle finansman, müteahhitlik sözleşmeleri, kira finansmanı, ortaklıklar ve gayrimenkul üzerinde intifa hakkı senetleri (sukuk) gibi modern finansal uygulamalar değerlendirilmiştir."
