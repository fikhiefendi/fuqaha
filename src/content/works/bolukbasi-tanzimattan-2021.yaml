abstract: "Hz. Peygamber (sav) devrinden başlayıp hicri III. asra kadar en verimli dönemini yaşayan ictihad faaliyeti ileriki yüzyıllarda yavaşlayıp durduğu iddia edilse de aslında hükmü naslarda belirtilmeyen fıkhî sorunların nasların rehberliğinde çözümü konusunda İslâm hukukuna işlerlik kazandıran en önemli faaliyet olmuştur. İslâm hukuk tarihinde Tanzimat'tan sonra yaşananlar daha önce benzeri yaşanmamış hadiselerdir. Zira o güne kadar hiçbir İslâm âlimi veya Müslüman yazar İslâm hukukunu çağın sorunları karşısında yetersizlikle ve acziyetle ithama kalkışmamıştır. Bu yönüyle ele alındığında Tanzimat Dönemi İslâm hukukunun yaptırım gücünü kaybetmeye başladığı, bazı alanları Batı hukukuna bıraktığı zaman diliminin başlangıcı olması hasebiyle önemli bir kırılmayı ifade etmektedir. Tanzimat Fermanı'nı takip eden süreçte Batıcı ve bazı Türkçü aydınlar tarafından gündeme getirilen ister usûle ister fürûya ait meselelerin toplumun ihtiyacından ziyade Avrupa devletlerinin baskısı ve yön vermeleriyle Avrupa hukuk anlayışının ülkede hakim olması saikiyle gündeme getirildiği görülmektedir. Söz konusu ortamdan etkilenen Osmanlı bürokrasisi, birtakım aydın ve ulemâ, İslâm hukukuyla örtüşmesi zor veya mümkün olmayan öneriler ortaya atmışlardır. Gündeme getirilen önerilerin ortak amacının hukukî alanı dinden bağımsız bir hale getirmek olduğu görülmektedir. Bu sayede Avrupa hukuku ile uyumlu yeni hukukî düzenlemeler daha kolay hayata geçirilecektir. Geleneğe bağlı âlimler ise İslâm hukukuna aykırı olarak gördükleri söz konusu görüş ve önerilere karşı çıkmış ve İslâm hukukunun her devirde karşılaşılacak sorunlara çözüm getirebilecek enstrümanlara sahip olduğunu dile getirmişlerdir."
