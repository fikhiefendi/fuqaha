abstract: "İslâm hukukunda ölüm; haklar, borçlar, ibâdetler ve âile gibi hukukun pek çok alanı üzerinde doğrudan tesiri olan bir olaydır. Şahsın hayattayken îfâ etmediği ya da edemediği bazı yükümlülükler, ölümle birlikte çeşitli hukukî sonuçlar doğurur. Ölüm denildiğinde öncelikle tabiî ölüm akla gelse de hukuk sistemlerinde ayrıca hükmî ve takdirî ölüm olarak ifade edilen farklı ölüm çeşitleri de bulunmaktadır. Bu çalışmada, anılan ölüm çeşitleri, şahsın hukuku bağlamında ele alınmış ve İslâm hukukuna göre her biri açısından ölümün ibâdetler ve âile hukuku üzerindeki etkileri ehemmiyet arz etmektedir. Tezimizin bazı kısımlarıyla ilgili çalışmalar yapılmış olsa da konuyla ilgili müstakil bir akademik çalışmaya ihtiyaç duyulmuştur.“İslam Hukukunda Ölümün İbadetlere ve Aile Hukukuna Etkisi”başlıklı bu yüksek lisans tezinin hazırlanması uygun görülmüştür. Çalışmada şahsın ölümünün ibadetler açısından; namaz, oruç, zekât ve hâc gibi temel ibâdetler ile fıtır sadakası, kurban ve adak gibi mâlî nitelikli ibâdetlerin yanında nâfile ibâdetlerin terikeye ve geride kalanlara etkisi incelenmiştir. Ayrıca ölümün talâk, iddet, nafaka, mehir, nesep, velâyet, vesâyet, hidâne ve radâ gibi âile hukuku ile ilgili meseler üzerindeki etkisi klasik fıkıh literatürü ve çağdaş araştırmalar doğrultusunda değerlendirilmiştir."
