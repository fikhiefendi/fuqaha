abstract: "Dünyada İslami Banka ya da faizsiz banka olarak adlandırılan faizsiz bankacılık sistemi Türkiye'de ilk olarak Özel Finans Kurumları ismiyle faizsiz bankacılık prensipleriyle hizmet vermeye başlamışlardır. İslam dininde faizin yasak olması sebebiyle dini hassasiyeti olan insanlar ellerindeki tasarruflarını değerlendirmek, ekonomiye katmak için faizsiz bankaları tercih etmektedirler. Ülkemizde özel finans kurumları adıyla 1985 yılında faizsiz bankacılık başlamıştır. Kuruldukları yıldan 1999 yılına kadara Bakanlar Kurulu kararnamesi ile faaliyetlerini sürdürmüşlerdir. 1999 yılında 4389 sayılı Bankalar Kanunu kapsamına alınmışlardır banka statüsü kazanmışlardır fakat hukuki alt yapılarının daha sağlam olması 2005 yılında 5411 Sayılı Bankacılık Kanunu kapsamına alınarak olmuştur. Bu Kanunla isimleri Katılım Bankası olarak değiştirilmiştir ve bu kanun kapsamında faaliyetlerine devam etmektedirler. Katılım bankaları faizsiz bankacılık ilkeleriyle hizmet vermeye devam etmektedirler. Fon toplama ve fon kullandırma faaliyetleri İslam'ın yasak kıldığı faizden uzak durarak müşterine bu hizmetleri sunmaktadırlar. Çalışmada bankacılık kavramı, ülkemizde ve dünyada bankacılığın gelişimi belirtilmiştir. Faiz kavramı, faizsiz bankacılık sistemi ve faaliyetleri, faizsiz bankalar ülkemizdeki adıyla katılım bankalarının geleneksel bankalarla olan farkları karşılaştırılmıştır. Geleneksel ve katılım bankalarının performanslarını değerlendirmek için kullanılan SPSS, TOPSIS VIKOR ve CAMELS gibi yöntemlerinin kullanıldığı çalışmalar literatür taraması yapılarak incelenmiş tablo şeklinde sunulmuştur. Faizsiz bankacılığın ülkemizdeki tarihçesinden başlayarak kapanan faizsiz bankalara ve günümüzde faaliyet gösteren katılım bankaları hakkında bilgilere yer verilmiştir. Son olarak özel finans kurumlarının katılım bankasına dönüşümü ve sağladığı faydalar belirtilmiştir. Bankacılık sektörü içinde önemli bir yer edinen katılım bankalarının swot analizi yapılmıştır. Katılım bankalarının güçlü ve zayıf yanları, tehditleri ve fırsatları belirtilmiştir. Zayıf yanlara ve tehditlere çözümler bulunduğu takdirde katılım bankalarının gelişimi artacaktır. Günümüzde altı tane üçü özel sermayeli diğer üçü ise kamu sermayeli olmak üzere katılım bankaları faaliyetlerini devam ettirmektedirler."
