abstract: "İslâm hukukunun oluşumunda sahâbenin rolü yadsınamayacak derecede önemlidir. Çünkü sahâbe Hz. Peygamberle beraber yaşamış olduğu için Kur'ân'ın nuzûlüne şahit olmuş, Hz. Peygamber'in yaşantısını görmüş ve akıllarına takılan her soruyu anında Hz. Peygambere sorarak cevap alabilmiş böylece günümüze kadar bilgilerin aktarılmasını sağlamışlardır. Sahâbenin hepsi fıkıh bilgisine sahip olmakla beraber sahâbedeki her bireyin aynı derecede fıkıh bilgisine sahip olduğu söylenemezdi. Çünkü sahâbeden bazıları gece gündüz Hz. Peygamberle beraberken bazıları mÂişetle meşgul olduğundan ötürü Hz. Peygamberle fazla zaman geçiremiyordu. Bundan kaynaklı olarak da Hz. Peygamberle fazla zaman geçiremeyen sahabilerin ilmi birikimleri Hz. Peygamber'in yanında kalan sahabilerin bilgi birikimleri kadar geniş değildi. Sahabilerin içinde ise Hz. Peygamber'in eşleri, Hz. Peygamberle en fazla zaman geçiren onun sözlerine, fiillerine ve en önemlisi vahyin nüzulüne birebir şahit olan ve Hz. Peygamber'in birebir eğitiminden geçen kişiler olarak en fazla ilmi birikime sahip olanlardı. Zira gerek İslâm tarihi eserlerine baktığımızda gerekse hadis kitaplarına ve tefsir eserlerine baktığımızda sahâbenin ileri gelenlerinin Ümmü Seleme (r.a.)'ye ve bazen de diğer hanımlarına fetva sorduklarını görürüz. Bundan dolayı da Hz. Peygamber'in hanımlarının içinde fakihliği ile ön plana çıkan Ümmü Seleme'nin fıkhi kişiliğinin, fetvalarının ve dört mezhep tarafından delil olarak kullanılan rivâyetlerinin araştırılmaya değer olduğunu düşündüğümüzden ötürü böyle bir konuyu ele aldık. Tezimizde öncelikle Ümmü Seleme'nin hayatını kısaca ele alıp daha sonra onun rivâyetlerini ve rivâyetlerini aktarırken kullandığı fıkhi yöntemleri açıkladıktan sonra dört mezhep içinde hangi mezhebin Ümmü Seleme'nin rivâyetini delil olarak kullandığını ve akabinde de İslâm hukukuna olan etkisini ele alarak tezimizi sonlandırdık. Ümmü Seleme'nin birçok kaynakta rivâyeti bulunmakla beraber tezimizde Kütüb-i Sitte'deki ahkam rivâyetlerini ve değerlendirilmesini ele alıp dört büyük mezhep olan Hanefilik, Şafiîlik, Hanbelîlik ve Mâlikîlik mezheplerinden hangisinin Ümmü Seleme'den aktarılan hadisi delil alarak ne gibi hükümler çıkardıklarını ve İslâm hukukuna ne gibi yansımaları olduğunu açıkladık. Ümmü Seleme (r.a.) rivâyetleri ve verdiği fetvaları ile birçok fıkhi konuya ışık tutmuş olmakla beraber özellikle kadınların özel durumları hakkında birçok soruya cevap vererek fakihliğini ön plana çıkarmış ve bu sayede sünnetin ve hükümlerin gelecek nesillere aktarılmasını sağlamıştır."
