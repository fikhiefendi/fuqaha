abstract: "Bu araştırmanın amacı, Kastamonu ilindeki banka müşterilerinin İslami bankacılık ve finans uygulamaları hakkındaki algılarını bir anket uygulaması ile belirlemektir. Anketin örneklem kapsamındaki 275 katılımcıya internet ortamında ulaştırılmasıyla veriler elde edilmiştir. Toplanan veriler ile katılımcıların demografik özellikleri, İslami finans ve faizsiz bankacılık ürünleri hakkındaki düşünceleri istatistiksel olarak analiz edilmiştir. Veriler ile ilk önce frekans tabloları oluşturulmuştur. Ardından veriler çeşitli analiz yöntemlerine tabi tutularak önemli bulgular elde edilmiştir. Bulgulara göre; katılımcıların genel olarak İslami finans hakkındaki bilgi düzeyleri düşük seviyelerdedir. Murabaha ve Mudaraba katılımcılar tarafından en çok bilinen ürünlerdir. Katılımcıların banka seçimini etkileyen en önemli faktörler; bankanın itibarı, düşük işlem masrafları ve banka personelinin davranışlarıdır. Dini hassasiyet ise son sıralarda yer almıştır. Ayrıca müşterilerin İslami bankacılık hakkında şüpheleri bulunmaktadır."
