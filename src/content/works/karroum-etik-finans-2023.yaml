abstract: "Küresel finansal kriz, ülkeleri şoklara karşı daha güvenli alternatifler bulmak için uluslararası finansal sistemin temellerini sorgulamaya ve kusurlarını araştırmaya zorlamıştır. Geleneksel finans paydaşlarının finansman süreçlerinde şeffaflığın olmaması, daha etik bir sistemi teşvik eden alternatif finansal paradigmaların öne sürülmesini önermiştir. Bu gözlemin ardından uluslararası toplum birkaç yıl önce İslami finansa ilgi duymaya başlamıştır. Bu bağlamda, araştırmanın amacı Geleneksel Endeksler ile İslami Endekslerin performanslarının karşılaştırılmasıdır. Araştırma iki alt amaçtan oluşmaktadır. Birincisi İslami endekslerin ve geleneksel endekslerin performans farklılıklarının belirlenmesi, ikincisi ise, belirlenen makroekonomik değişkenlerin İslami ve geleneksel endeksler üzerindeki etkisinin analizidir. Birinci kısımda gelişmiş ülkeler, gelişmekte olan ülkeler ve sınır ülkeler olmak üzere 3 ayrı panel veri seti üzerinden 40 İslami endeks ve 40 geleneksel endeks arasında çeşitli finansal değerlerin karşılaştırılması hedeflenmektedir (Sharpe oranı, Treynor oranı ve Jensen alfa indeksi). Analiz, 2009 ile 2020 yıllarını kapsayan aylık verileri içermektedir. Zaman ile birlikte birim boyutunu da içermesi sebebiyle araştırmada parametre tahminleri için panel veri ekonometrisinden faydalanılmıştır. İkinci kısımda ise İslami ve geleneksel endeksler ile belirlenen makroekonomik göstergeler arasındaki ilişkilerin ayrı ayrı incelenip karşılaştırılması amaçlanmaktadır. Bu amaç kapsamında 2009 ile 2020 dönemine ait yıllık veriler kullanılmıştır. 52 adet ülke için 12 adet yıllık gözlem derlenerek 624 adet gözlem içeren bir panel veri çözümlenmesi yapılmıştır. Sonuçlar, İslami ve geleneksel endekslerin performansı arasında fark olmadığını ve makroekonomik değişkenlerin İslami ve geleneksel endekslerin performansı üzerinde benzer etkiye sahip olduğunu ortaya koymaktadır. Bu nedenle araştırmanın bulguları, alternatif bir yatırım seçeneği olarak İslami borsanın gelişimini daha fazla desteklemek için yatırımcılara ve karar verici mercilere konuyla ilgili bilgiler sunmaktadır. doldurulacaktır"
