abstract: "Nafaka, hayatın idamesi için gerekli olan harcamalardır. Yoksulluk ise toplumdan topluma örften örfe tanımı değişse de genel olarak mali yönden muhtaç olma halidir. Hem İslam Hukukunda hem de Türk Medeni hukukunda yoksul olan bireylerin nafaka hakkı korunmakta ve bu ihtiyacın kimler tarafından ve nasıl karşılanacağı çeşitli hükümlere bağlanmaktadır. Çalışmada yoksul kimselerin nafakası bağlamında İslam hukuku ve Türk Medeni hukukundaki hükümler ele alınmıştır. Akademik olarak her iki hukuk sisteminde karşılaştırma yapılmadan nafaka konusunu inceleyen çalışmaların yanında nafakayı her iki hukuk sistemi bazında karşılaştırma yapan çalışmalar da vardır. Ancak yaptığımız araştırmada yoksulluk bağlamında akraba sayılan kişilerin nafakasını detaylı karşılaştırma yapan çalışma göremedik. Bu nedenle yoksulluk bağlamında her iki hukuk sistemi tabanında nafaka hükümlerini araştırmayı uygun bulduk. Araştırma konumuz olan yoksulluk bakımından nafaka İslam hukukunda“hısımlık nafakası”başlığı altında, Türk Medeni hukukunda ise boşanan eşler arasında bakım nafakası kapsamında“yoksulluk nafakası”şeklinde ve diğer akrabalar arasında ise“yardım nafakası”şeklinde ele alınmaktadır. Her iki hukuk sisteminde ele alınan nafaka konusunun benzer ve farklı yönleri karşılaştırmalı olarak değerlendirme yapılarak kapsamlı bir araştırma yapılmıştır. İslam hukukunda eşler arasında nafaka evlilik birliği içinde yoksulluk şartı aranmaksızın kocanın karısına karşı mali yükümlülüğü, evlilik sona erince boşanan kadının kusurlu olmamaması şartıyla ve iddet süresiyle sınırlı olmak kaydıyla iddet nafakası şeklinde iken, Türk Medeni Hukukunda eşitlik ilkesi gereği evlilik birliği içinde karşılıklı sorumlu olup, evlilik birliği sona erdiğinde cinsiyete bakılmaksızın yoksul olan taraf lehine süresiz (bir süreye bağlı olmadan) nafaka söz konusu olmaktadır. Yakın akrabalar arasında sıralama farklı olmakla birlikte ebeveyn ve çocuklar arasında yoksul lehine yardım nafakası bulunmaktadır. İslam Hukukundan farklı olarak Türk Medeni Hukukunda evlatlık ile ebeveyni arasında da yoksulluk nafakası görülmektedir. Nafakanın kapsamı, başlaması, bitişi ve şartları çok uzak denemeyecek bazı farklar dışında her iki hukuk sisteminde de benzerlik göstermektedir."
