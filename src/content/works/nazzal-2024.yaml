abstract: "Bu araştırma, Ebu El-Ma'alî Abdulmelik bin Ali El-Bâbî El-Halebî (ö. 839 H.) tarafından yazılan“Ravzâ ve Menhec Hariç Şafii Fıkhında Furû' Fıkhının Muhtasarı”yazma eserinden Borçlar Hukukunun bir bölümünü çalışma ve tahkik olarak ele almıştır. Şafii fıkhına mensup dokuzuncu asırda yaşamış şahsiyetlerinden biridir. Konunun önemi yazarın kitabını özgün bir bilimsel düşünceye dayandırmasıdır. Şafiilere göre dayanak noktası sayılan Nevevî'nin iki kitabında (Ravzâ ve Menhec) yer almayan konu ve hükümlerin derlemesidir. Konunun önemi, müellifin Muâmelât hükümlerine ilişkin kendi döneminde meydana gelen ve daha önceki dönemlerde bahsedilmeyen olaylara da bakmış olmasından da anlaşılmaktadır. Müellifin izlediği yaklaşım, kitabı faiz bölümü, yasaklanılmış muâmelât bölümü, ürünler bölümü ve alıntı yapılan kaynağın ismine bağlılık gibi çeşitli fıkıh bölümlerine ayırıp, bu bölümdeki bir daldan bahsetmesidir. Şafiilerin bu konudaki görüşlerini zikrettikten sonra görüşlerden birini tercih etmektedir. Araştırmacının ulaştığı en dikkat çeken sonuçlardan biri çeşitli kaynaklara başvurduktan sonra makalenin yazarına atfedilmesinin doğruluğudur. Ayrıca, yazarın çağdaşı olan ed-Dav'ü'l-Lâmi' kitabının yazarının da belirttiği gibi, başlığının doğru olduğu anlaşılmaktadır. Araştırmada yazarın kaynaklarının fıkıh ve ilkeleri, Kur'an ilimleri, tefsir ve dil arasında farklılık gösterdiği, muhakeme ve itirazda yararlandığı kaynakların olduğu sonucuna da varılmıştır."
