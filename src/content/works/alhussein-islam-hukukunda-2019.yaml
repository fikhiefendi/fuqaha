abstract: "Büyük maksad (gaye) toplumsal adalette adaleti gerçekleştirmek. İslam fıkhının da arasında bulunduğu devletin bu konuda rolü vardır. Bunu fıkhın ve devletin, gidişatta rota ortaya koymak ve performansta doğru ilerlemeyi ve halklarının isteklerini gerçekleştirmek için açıkça belirtmesi gerekir Şer'i hükümler toplumsal adaleti gerçekleştirebilir mi ? Devletin bu İslam fıkhının ortaya koyacağı ve çerçeve içine alacağı rolü var mıdır? konudauygulamaya elverişli eksiksiz bir teoriyi temsil edebilir mi ? Şer'i hükümler esnasında tatbik ederek Allaha ibadet ettiğimiz önemli halkların ihtiyaçlarını karşılamak olması ve islam'ın bu anılmayı her zaman ve her yerde insanları şaşırtan bu duruma çözüm sunmasına güç yetirmesi 1- İslam sanatında toplumsal adaleti gerçekleştirme araçlarını açıklamak 2-Toplumsal adaleti gerçekleştirmek için islam fıkhını düzenleyen devletin rolünü açıkça ortaya koymak 3- Toplumsal sorunlardan büyük bir sorun için şeri çözüm sunmada katkıda bulunmak Araştırmacı konuya bir metottan çok metotlar izlemiştir. Bunlardan toplumsal adaletin dayanaklarını iyice incelemek ve devletin bunu gerçekleştirmedeki rolünü hedefleyen tümevarım metoduyla birlikte bu işten eksiksiz bir şekilde çıkmak için tümdengelim analiz metotlarını takip etmiştir. Araştırma Konusunun Bölümlendirilmesi: Konu giriş, gelişme ve sonuç dışında 3 bölüme ayrılır. Bu bölüm devletin zekat vergi ve vakıflardaki rolü bir diğeri devletin pazarlardaki kontrolü ve korunmasındaki rolümü açıkça ortaya koyması üçüncüsü adaletle beytul malın rolünün açıklanması 1-İslam devletlerinin islam fıkhında destekleri anında sosyal devleti gerçekleştirmek için gücüne göre çaba harcaması gerekir. 2- Halkların istekleri sosyal adaletin yerleşimi ile en doğru yönüyle Allahın kanunu dışında gerçeklemeyecektir. 3-zekat sosyal adaletin payandalarından en büyüğüdür. Pazarlar ekonomik dengeye bağlıdır.Pazarların iyileştirilmesi için gereklidir. Bu konuda toplumsal adaletin aslını koruyan fıkıhtandır"
