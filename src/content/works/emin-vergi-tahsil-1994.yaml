abstract: "ÖZET Devlet kamu harcamalarının kamu gelirlerinden faydalanır. Kamu gelirleri içinde en önemli payı vergiler almaktadır. Kamu gelirleri içinde vergilerin oranı ülkelerin ekonomik sistemlerine ve gelişmişlik seviyelerine göre değişmektedir. Genel olarak, gelişmiş ülkelerde vergi gelirlerinin kamu gelirleri içindeki payı %90-95 civarındayken, gelişmekte olan ülkelerde ise %70 civarındadır. Ülkemizde ise bu pay %80 civarında bulunmaktadır. Kamu gelirleri, çeşitli ekonomik sistemlerde farklı özellikler göstermektedir. Kapitalist ekonomik sistemde vergiler kişi yada kuruluşların gelirleri (kazançları) servetleri ve tüketimleri üzerinden alınmaktadır. Sosyalist ekonomik sistemde de vergiler büyük ölçüde üretilen mal ve hizmetlerin satış fiyatları ile maliyet değerleri arasındaki farklardan alınmaktadır. Değişik vergilerin yanısıra, borçlanmada sosyalist ekonomiler de önemli bir yer tutmaktadır. İslâm'ın ortaya koyduğu ekonomik düzende ise, gerek kapitalist ve gerekse sosyalist ekonomik sistemden farklı özellikler taşımaktadır, islâm'ın ortaya koyduğu ekonomik düzende başlıca kamu gelir türleri; zekât, cizye, haraç, ganimet, maden ve define vergisi ve gümrük ve geçiş resimlendir. Kapitalist ekonomik sistem içinde yer alan günümüz ülkelerinde kamu gelirlerinin en önemli bölümünü vergiler oluşturmaktarır. Bu ülkelerde vergiler, tarihi süreç içinde çeşitli usûllere göre tahsil edilmişlerdir. Başlıca vergi tahsil usûlleri: İltizam usûlü, ihale usûlü, halk temsilcileri eliyle tahsil usûlü, havale usûlü ve emanet usûlü'dür. Vergilerin etkin bir şekilde tahsili ile kamu gelirlerinin fonksi yonunu daha iyi bir şekilde yerine getirmesi mümkün olmaktadır. Bu nedenle tahsilatta etkinliğin sağlanması büyük önem taşımaktadır. Tahsilatta etkinliğin gerçekleşip gerçekleşmediğinin ölçülmesinde değişik yaklaşımlar kullanılabilir. Örneğin, tahsilat /tahakkuk oranı, bir önceki yıla göre tahsilat miktarındaki artış oranı ve bir birim verginin tahsili için yapılan harcamaların oranı vs. gibi.Tahsilatta etkinliğin sağlanmasına etki eden çeşitli faktörler bulunmaktadır.. Bu faktörler şöyle sıralanabilir: Vergi sistemi, vergi gayreti, vergi denetimi, vergi konuları, vergi tekniği, vergileme sınırı, vergi bilinci ve ahlâkı, vergi idaresi, vergi psikolojisi ve diğer faktörler. Tahsilatta etkinlik sağlanmasında bu faktörler üzerinde dikkatle durulması gereklidir. Adana Belediye'sinin 1989 yılı öncesi emlâk vergilerinin tahsil edilmesi ile ilgili uygulaması, vergi tahsilatında etkinliğin sağlanmasına yönelik olarak dikkatle incelenmesi gereken bir konudur. Bu uygulamanın diğer vergilerin tahsilatında da uygulanıp uygulanamayacağı ayrı bir çalışma konusu durumundadır."
