abstract: "Ill ÖZET DOKTORA TEZİ İSLAM HUKUK METODOLOJİSİNDE TEARUZU GİDERMEDE TERCİH YÖNTEMİ Zeki KOÇAK Danışman: Prof. Dr. Davut YAYLALI 2004 -SAYFA: 238 Jüri: Prof. Dr. Davut YAYLALI Prof. Dr Mustafa BAKTIR Prof. Dr. Niyazi USTA Prof. Dr. Hamza AKTAN Prof. Dr. Şamil DAĞCI Bu çalışma, İslam hukuk metodolojisinde yer alan“tercih yöntemi”mn, Hanefi hukuk mektebindeki yer ve hukukî değerini ortaya koymayı amaçlamaktadır. Bu bağlamda tezimizde hukuk, salt kurallar manzumesi olmaktan ziyade, sosyal bir yürürlük olarak da algılanmaktadır. Delile dayalı, hukuksal değerlendirmenin bir ürünü olan tercih, içtihat faaliyetinin farklı bir versiyonudur. Bunu ispat için hukukun kavramsal kaynaklarına ihtiyaç duyulduğu kadar, diğer yürürlük kaynaklarına da atıfta bulunulmaya çalışılmıştır."
