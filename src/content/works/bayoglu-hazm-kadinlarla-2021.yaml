abstract: "Bu çalışmada Zahirî mezhebini sistematize eden ve mezhebin ikinci kurucusu kabul edilen Endülüslü âlim İbn Hazm'ın taharet ve ibadet hayatı bağlamında kadınlara mahsus özgün görüşleri tespit edilerek Hanefi mezhebinin konuyla ilgili içtihatlarıyla mukayeseli bir şekilde incelenmektedir. Buna bağlı olarak kadınların ibadet hayatlarını doğrudan etkileyen hayız ve nifas gibi özel durumlara detaylı bir şekilde yer verilmekte ve bu durumların kadınların ibadetleri üzerindeki etkileri ele alınmaktadır. Bu tezde İbn Hazm ve Hanefiler'in fıkhî yaklaşımlarının ibadet uygulamalarına nasıl yansıdığı mezheplerin usulî dayanakları çerçevesinde mevcut delillerine dayalı olarak karşılaştırılıp değerlendirilmektedir."
