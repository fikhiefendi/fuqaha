abstract: "İslam hukuk usulünde fer'î delillerden kabul edilen istihsan, genel anlamda hukukun ihtiyaç duyduğu bir ilke ve anlayışı temsil eder. Bu nedenle istihsan, bütün hukuk sistemleri için gerekli bir hukukî mekanizmadır. İstihsan anlayışı, sahip olduğu esneklik özelliği ile, farklı zaman ve mekanlardaki hukuk sistemlerinde varlığını sürdürmüştür. Roma ve Talmud hukukunda bunun örnekleri mevcuttur. İslam hukuk tarihinde, hukukun gelişim gösterdiği dönemlerin, istihsanın çokça uygulandığı dönemler olduğu açıkça görülür. İstihsanın, İslam hukukunun gelişimine sunduğu katkının benzeri, Roma hukukunda da görülmektedir. Roma hukukundaki nesafet ilkesi ile istihsan, benzer hukukî mantığa sahiptir ve hukuk sistemi içerisinde oluşturdukları esneklik, hukukun canlı kalmasını temin eder. Başka hukuk sistemlerinde bu tür anlayış ve uygulamaların bulunması, hukukun bu tür uygulamara ihtiyacı olmasının en önemli delilidir. İstihsan, yerleşik genel kuraldan istisnâ olarak kabul görmekle birlikte, aynı zamanda dinin genel amaçlarına dayanarak yapılan bir ictihaddır. İstihsan yapılırken dinin genel amaçlarına ve küllî kâidelere dayanılması, istihsanın doğrudan makâsıdla olan ilişkisini ortaya koyar. Buna bağlı olarak istihsan, hukukun gayeci özelliğine doğrudan hizmet eden önemli bir hukukî uygulamadır. İslam hukukunda istihsanın uygulanmaması, İslam hukukunun hayatın içinde aktif olarak bulunmasına engel olmaktadır. Zira nassların sınırlı, olayların sınırsız olmasından dolayı, istihsan gibi uygulamalar olmaksızın, nasslarla hayat arasında bağlantı kurulamamaktadır. İstihsan, teknik anlamda hukukî bir uygulama olarak kullanılmasa da günlük yaşamın içinde, istihsan anlayışını gösteren birçok örnek mevcuttur. Bu durum, istihsana olan ihtiyacı ortaya koyduğu gibi, söz konusu ilkenin bir şekilde hayatın içinde yer aldığını göstermesi bakımından da önem taşır. Genelde hukukun, özelde ise İslam hukukunun canlılığını koruması, ilke ve uygulama olarak istihsanın, hukuk içinde işlevsel olmasıyla mümkündür."
