abstract: "Majlis Agama Islam Wilayah Persekutuan (Federal Bölge İslam Dini Konseyi) 2021 yılında 823,579 milyon RM zekat toplamış ve bunun yüzde 90'ını dağıtmıştır. Bu, Malezya'daki Eyalet Islam Dini Konseyleri arasında en yüksek zekat toplama oranlarından biridir ve MAIWP'nin zekat yönetimindeki verimliliğinin bir kanıtıdır. Geçmişte MAIWP hakkında birkaç çalışma yapılmış olmasına rağmen, MAIWP'nin zekat yönetimini fıkıh perspektifinden ele alan çalışmalar yetersizdir. Bu nedenle, bu konunun incelenmesine ihtiyaç vardır. Bu doğrultuda, bu araştırma MAIWP'nin zekat yönetimini özellikle zekat dağıtım uygulamaları açısından fikhi bir perspektiften incelemeyi amaçlamaktadır. Bu çalışma, diğer hususların yanı sıra, MAIWP'nin zekat alıcılarını yeniden tanımlaması, çeşitli zekat dağıtım yöntemleri, MAIWP adına yardım programlarını yürüten şirketler ve kurumlar ile zekat dağıtımıyla ilgili seçilmiş fikhi meseleleri kapsayacaktır. Araştırma, MAIWP'nin web sitesi, MAIWP ve PPZ'nin yıllık raporları, çeşitli Islam ülkeleri tarafından yayımlanan fetvalar ile klasik ve modern fıkıhçılarının yazılarını içeren veri toplama ve analizinden oluşan nitel bir yaklaşımı benimsemiştir. Ayrıca, MAIWP'nin ilgili departmanlarındaki yetkililer ve akademisyenlerle yarı yapılandırılmış görüşmeler yapılmıştır. Çalışma, MAIWP'nin yalnızca zekat toplamaya adanmış bir kuruluş olan PPZ'yi kuran öncü Eyalet Islam Dini Konseyi olduğunu ortaya koymuştur. Ayrıca, 2020 yılında MAIWP'nin zekat dağıtımının önemli bir kısmı, refah, ekonomi, tıp, vaaz ve topluluk geliştirme, koruma ve eğitim gibi yardım programları aracılığıyla gerçekleştirilmiştir. Çalışma, alimlerin belirttiği koşullara uyulması koşuluyla, zekat dağıtımının fayda (maslahah) veya zaruriyet (darürah) gibi nedenlerle geciktirilmesinin ve zekatın yatırıma yönlendirilmesinin mübah olduğunu bulmuştur. Ayrıca, araştırma, tamlik kavramının bireysel mülkiyet ötesinde toplu mülkiyete olanak tanıyan genişletilmiş bir anlayışını da önermiştir. Umulur ki, bu araştırma, konunun daha iyi anlaşılmasına katkıda bulunacak ve MAIWP ve ilgili yetkililere, İslam hukukuna uygun olarak zekât yönetimini iyileştirmelerine ve geliştirmelerine yardımcı olacaktır."
