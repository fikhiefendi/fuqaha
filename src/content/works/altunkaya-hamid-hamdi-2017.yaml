abstract: "Hamdî Hamîd-i Vânî el-Malatî'nin hayatı ve vahdet-i vücûd anlayışını sunduğumuz bu çalışmada; Malatyalı bir âlim, mutasavvıf ve şâir simayı ele alıp Zübdetü'l-İrfân fi Tahkîki'l-İtkân adlı eserinde yer alan vahdet-i vücûd risalesini inceledik. Vahdet-i Vücûd kavramı, İslam'ın ilk döneminden itibaren fiilen var olan, fakat isimlendirmenin sonradan gerçekleştiği kavramlardandır. Varlık üzerine söylenen sözler ile bu düşünceyi temellendiren ayet ve hadisler; vahdet-i vücûd kavramı henüz tedavülde yok iken de vardı. Istılahın İbnü'l-Arabî ile özdeşleşmesi ise, kavramın ilk defa onun tarafından kullanıldığı için değil, bu düşünceyi zirveye taşıyan isim olmasından ileri gelmektedir. Ancak ne var ki İbnü'l-Arabî'nin kimi şathiyyeleri, zamanın fıkıhçıları nezdinde tartışma konusu olmuş, sonraları vahdet-i vücûd olarak sistemleşecek olan bu düşüncenin reddine müncer olmuştur. İbn Arabî ile özdeşleşen bu düşünce, yaklaşık bin yıldır tartışılmakta, sistemin taraftarları ile muarızları arasındaki tartışmalar, kimi zaman amansız ithamlara sebebiyet vermektedir. Bazı kimseler vahdet-i vücûd'u panteizmle ilişkilendirerek İbnü'l-Arabî'yi tekfir etme cür'eti gösterebilmekte kimileri de onu Şeyh-i Ekber, hazret-i pîr diyerek yükseltmektedirler. Oysa İbnü'l-Arabî, şer'i ilimlerdeki uzmanlığı, riyazet ehli oluşu ve analitik düşünce kabiliyeti ile hemen bütün sûfî müellifler gibi multi-disipliner bir şahsiyet ve proaktif bir kişilik sergilemekte, keşfiyâtı, hissiyâtı ve şiirleri ile öne çıkmaktadır. Hamdî-i Vânî el-Malatî'nin 1918'de Malatya'da tamamladığı eserinde yer alan Vahdet-i Vücûd Risalesi, vasat bir yaklaşım geliştirmekte, ne İbnü'l-Arabî'yi sorgusuz kabul etmekte ne de reddederken maksadını aşan ifadeler kullanmaktadır. Netice olarak; o da İmam-ı Rabbânî gibi, İbnü'l-Arabî'nin derinliğini teslim etmekte ancak kimi şathiyyelerini tasvip etmemektedir."
