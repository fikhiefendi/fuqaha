abstract: "VII/XII. yüzyılın sonları ile VIII/XIV. yüzyıl başlarında yaşamış olan İmam es-Siğnâkî, kelam, fıkıh, nahiv gibi alanlarda eserler kaleme almış, dönemin öne çıkmış ilim adamlarından birisidir. Özellikle el-Hidâye üzerine yazdığı en-Nihâye şerhi hem el-Hidâye'ye yazılmış ilk şerh olması açısından, hem de İmam es-Siğnâkî'nin kendi fıkhi bilgisini bizlere sunması açısından çok önemli bir eserdir. Bu eser kendisinden sonra yazılmış hanefi eserlere de kaynaklık etmesi açısından da ayrı bir öneme sahiptir. Eserin bu öneminden dolayı kritik ve değerlendirmeye tabi tulması gerektiği ortadadır. Bu ihtiyacı bir ölçüde giderebilmek amacıyla bu çalışma yapılmıştır. Yaptığımız bu çalışma giriş ve üç ana bölümden meydana gelmiştir. Giriş bölümünde çalışmamızın amacı, planı ve yönteminden bahsedilmiştir. Birinci bölümde el-Merğînânî ile şarih es-Siğnâkî hakkında bilgiler sunulmuştur. İkinci bölümde en-Nihâye eseri ayrıntılı bir şekilde tanıtılmıştır. Üçüncü bölümde ise en-Nihâye eserinin Zekat ve Oruç kitaplarının edisyon ve kritiği yapılmıştır. Giriş bölümünde çalışmamızın amacı, planı ve yönteminden bahsedilmiştir. Çalışmamız sonuç ve kaynakça bölümleriyle tamamlanmıştır."
