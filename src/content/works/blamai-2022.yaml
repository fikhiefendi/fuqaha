abstract: "Hükümlerin bağlama gerçeği ve yerine uygulanmasında vazgeçilmez bir husus olan içtihatta, hükmün veya hükümlünün hüküm yeri olarak uygun bir yer olması gerektiği için, özel öncülün gerçekleşmesi önemli unsurlardan biridir. İşte müctehidin rolü, bu mükellefin gerçekleştirdiği belirli bir fiille ilgili yerleşik hüküm ile yerin uygun olup olmadığını veya bu mükellefin kendisini bu hükme elverişsiz kılan koşullar tarafından aldatılıp aldatılmadığını görmek için bu konuyu ortaya çıkarmak için bu konuyu ortaya çıkarmaktır. Ancak onun sağındaki hüküm, o fiil için yerleşik hükümden farklı oluyor. Bu, benzer görüntüler için kanıtlanmış olanlar dışındaki kararları hak eden birçok davada açıkça ifade edildi, çünkü bu görüntüler, çevrelerindeki koşullar nedeniyle kural ve ilkeleri ihlal etti. Tıpkı zina eden ve zina cezasının kendisine karşı yüz değnek olduğu, ancak bedeninin bu günahın hükmünü kaldıramaması gibi, o da bu hükümden dolayı o hükümden dışlanmıştır. Aynı şekilde, Ramazan ayında ailesiyle cimrilik yapıp oruç tutamayan, bir köleyi azad edecek ve altmış fakiri doyuracak bir şeyi olmayan kimse de öyledir. Hz Osman devrindeki başıboş develer, Allah onlardan razı olsun, aslına aykırı hüküm verilen meselelerin çoğu bunlardır ve bunların bir kısmı veya tamamı ileri gelenlerin meseleleri olarak adlandırılabilir ve hak ederler ve çevreleyen koşullara göre yargılanmalıdır. Hükmün farklı olabileceği bu durumlar, bizim bu çalışmada ele aldığımız şey, yani özel bağlamın gerçekleşmesi ile ortaya konmakta ve böylece genel kuralın kökeni veya anlamının incelendiği formların her biri ayrı ayrı incelenmektedir. İncelenmekte ve aslının anlamı ile uyumlu mu yoksa genel anlam kapsamında mı yoksa onu menşe veya kural çerçevesinden çıkaran koşullarla çevrili mi hala kökeninde olduğuna bakılmaktadır. Yapılan inceleme ve takipler sonucunda, özel vekâletnamenin yerine getirilmesinin birçok alanda içtihatın önemli bir gereği olduğu ve gönderilen faiz gibi delil ve kurallarla ilgili olarak birçok araştırmacı ile ilişkisi olduğu, bu hususun teyid edilmesi gerektiği öğrenilmiştir. Mevcudiyeti ve menfaat gibi görünen diğerleriyle dengelenmesi ve belirli veya yanıltıcı bir menfaat olup olmadığı, Baskın veya baskın olup olmadığı ve hükmün sonucunun bu şekilde değerlendirilmesi, yetkinin yanı sıra ruhsatın gerçekleşmesinin de dikkate alınmasını gerektirir. , gereksinimlerine bakmak için, bu çalışmada daha fazla açıklığa kavuşturulmuş olan azınlıkların içtihatlarının ve diğer şeylerin dikkate alınmasının yanı sıra, belirli görev süresinin gerçekleştirilmesini gerektirir. Hoşgörülü İslam Şeriatı, menfaat sağlamak ve yolsuzluğu perdelemek ve bu menfaat ve yolsuzluklardan mükellefe kolaylık sağlamak ve mükellefin mahcubiyetini ortadan kaldırmak üzerine inşa edilmiştir.Bu konuda çeşitli yollar izlenmiştir. Kolaylık getirmek ve mahcubiyetleri ortadan kaldırmak olan bu büyük gayesine ulaşmak için ve kısmî ve bütün şer'î delilleri okuyan kişi, onu, hukukçuların ve müçtehitlerin şer'î hükümleri inşa ettiren şeyle çok ilgili bulur. kolaylaştırma ve bu deliller ışığında kökleştirme ve bu kurallar arasında örneğin bunlarla sınırlı olmamak üzere, Zorluğun kuralı kolaylık getirir ve mesele dar ise genişler ve fitne galip gelir ve fıkhın fıkhı Peygamber, Allah onu kutsasın ve ona huzur versin ve hükümleri indirirken onun fıkhının, hükmün yerine veya hükmün kaynağı diyebileceğimiz şeye bakarak bu hedefe ulaşmada önemli bir rolü vardı. köktenciler özel yetkinin gerçekleştirilmesi olarak adlandırdılar. Ayrıca ümmetin içinden geçtiği birçok özel duruma yol açan hüküm vermede özel bir titizlik gerektiren olay ve belalar; Bu durumlar sıkıntıya ve mahcubiyete düştüğünden, eğer hükümler harfi harfine uygulanıyorsa ve şeriat, menfaat gözetmek ve fitneden korunmak üzerine kurulu olduğu için, Hz. Peygamber efendimizin şerefli ashabına ve çalışkan imamlardan salih seleflerimize."
