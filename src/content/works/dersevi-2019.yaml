abstract: "İslam âlimleri, kutlu şeriat konuları arasında önem verdiği mevzuların başında İslam fıkhı gelir. Zira fıkıhta ibadetler, mülkiyet hakları, aile hukuku, miras, helal, haram ve hayatın değişik alanlarına dair konulara büyük bir önem verilmektedir. Kimi âlimler, bu konuları ayrıntlı bir şekilde izah eden müstakil eserler yazmıştır. Taharet (temizlik), ve necasetten temizlik, en önemli ibadet konuları arasında yer almkaktadır. Önde gelen fakihler, bunların ayrıntlılarını ve ince meselelerini açıklamışlardır. Malum olduğu üzere Anadolu'da Şafii fakihlerin son büyük alimi olan Molla Halil el-İs'irdî (ö. 1834), ma'fuvvat konularına dair başlıbaşına güzel bir eser yazmış önde gelen İslam fıkhı alimlerindendir. Âlimler, kıymetli ve nefis olan bu esere şerhler yazmışlardır. Bu şerhler arasında Şeyh Mahmud ez-Zukaydî'nin yaptığı şerh, en yararlı ve en geniş kapsamlısı olması hasebiyle bunun tez çalışmamın temeli olmasını istedim. Tezi iki bölüme ayırdık. Birinci bölümü araştırmaya ayırdık. Bu bölüm, metin sahibi Molla Halil'in ve şahirin hayatını ayrıntılı bir şekilde incelemeyi içermektedir. İkinci bölümü ise tahkike ayırdık. Bu bölümde müellifin metodunu inceleyip metindeki kapalı kelimeleri açıkladık ve metinde adı geçen şahsiyetler hakkında bilgiler verdik. Molla Halil'in işlediği konulara sünnetten deliller getirdik. Aynı şekilde bu meselelerin alındığı kaynakları ve görüş sahiplerini belirttik. Müellifin kaynaklarını belirttik, kitapta geçen ve Şafiî âlimlerin isimlerini ve kitapları ifade eden sembolleri açıkladık."
