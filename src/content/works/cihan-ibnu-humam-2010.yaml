abstract: "İbnü'l-Hümâm, hicrî dokuzuncu yüzyılda yaşamış olan önemli bir Hanefî fıkıh âlimidir. Müellifin en önemli eserlerinden biri de, şüphesiz, Merğînânî'nin (593/1197) el-Hidâye adlı eserinin şerhi niteliğinde olan Fethu'l-Kadîr'dir.Bu eserini yazmaya 829 yılında başladığını ifade eden İbnü'l-Hümâm, el-Hidâye'yi yalnızca vekâlet bölümüne kadar şerh edebilmiştir. Eserin kalan kısmını ise Netâicü'l-efkâr fi keşfi'r-rumûz ve'l-esrâr ismi ile Kadızâde olarak bilinen Şemseddin Ahmed (988/1580) şerh etmiştir. Ancak neticede el-Hidâye'nin dörtte üçlük bir kısmı İbnü'l-Hümâm tarafından şerh edilmiştir.İbnü'l-Hümâm, şerhinde el-Hidâye'nin konu tertibini aynen muhafaza etmekle birlikte gerekli gördüğü noktalarda el-Hidâye'de yer almayan meseleleri aktarmaktan da kaçınmamaktadır. Aynı şekilde el-Hidâye'nin muhtasar bir metin olması sebebiyle Merğînânî'nin (593/1197) eserinde yer vermediği pek çok delil, İbnü'l-Hümâm tarafından zikredilmekte ve ihtiyaç duyulan noktalarda bu delillerin değerlendirmeleri de aktarılmaktadır. Her meselenin delilleri ile birlikte sunulması müellifin, eserinde, taassuba düşmeksizin mezhebini müdafaa çabası içinde olduğunu da hissettirmektedir.Diğer yandan İbnü'l-Hümâm şerhinde, el-Hidâye'de yer almamasına karşın pek çok meselede konu ile ilgili diğer mezheplerin ya da şahısların görüşlerine de yer vermektedir. Bu görüşlerin delillerini ve bu delillerin değerlendirmelerini de eserine dâhil eden müellifin, eserinin bir şerh çalışmasından ziyade mukayeseli bir fıkıh eseri hüviyetine sahip olduğu da rahatlıkla söylenebilir.Bu şekilde İbnü'l-Hümâm'ın eserinin tamamında hissettirdiği bu ilmî tavır Fethu'l-Kadîr'in literatürdeki mühim konumuna işaret etmektedir."
