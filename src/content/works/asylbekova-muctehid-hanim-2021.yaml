abstract: "Hz. Peygamber (s.a.v.) ve sahabe devrinde günümüzdeki gibi ilimlerin tasnifi olmadığı için, kendi beceriklerine, kapasitelerine göre dini bilgileri öğrenmeye çalışırlardı. Hz. Peygamber (s.a.v.)'den direk öğrendikleri için, onların aktardıkları rivayetler bugüne kadar gelen ilimlerin baş kaynağı olmaktadır. Sahabiler dünyevi ve uhrevi hayatını ilglendiren ilimleri öğrenmişlerdir. Bu ilimlerin başında da fıkıh gelmektedir. Hanım sahabilerden bazıları tefsir, hadis, akaid, dil bilgisi, tıbbi bilgiler gibi birçok alanda kendilerini göstermişlerdir. Fıkıh alanında da müctehid sayılan hanım sahabiler faaliyette bulunmuştur. Dinin hükümlerini doğru anlayabilme ve aktarabilme, bir meselenin çözümünü bulabilme kapasitesine sahib müctehid ve fakih sahabiler arasında hanım sahabilerin de yer alması sonraki nesillerde fakihe âlimelerin yetişmesine örnek olmuşlardır. Bunlar çok fetva veren, orta derecede fetva veren ve az sayıda fetva veren sahabiler olarak sınıflandırılmaktadır. Onlardan aktarılan rivayetler de fıkıh ilmindeki hükümlere büyük bir yarar sağlamaktadır. Bu çalışmada müctehid hanım sahabilerin hayatlarını, ilmi kişilğini, ictihad ve fetva örnekleri incelenmeye gayret gösterildi. Hanım sahabiler ağırlıklı olarak hangi konularda fetva verdiklerini ve görşlerinden hangi mezhebin etkilendiği bildirilmeye çalışıldı. Görüşlerini benimseyen mezheb imamlarının da görüşleri açıklanmaya çalışıldı."
