abstract: "Bu tez Mudarebe finansman yöntemine başvurma düzeyinin düşük olması sorununu, sebepler ve çözüm yolları açısından ele almaktadır. Özellikle de İslam ümmeti, üretim sektöründe yatırım düzeyinin düşük olmasından ve bireylerin ihtiyaçlarının ithalat politikası üzerinden sağlamasından açıkça muzdariptir. Bu durum yüksek para birimleri, ödemeler dengesizliği ve işsizlik oranlarının yükselmesi sonucunu doğurmaktadır. Bu sorunlar İslam toplumu içindeki ekonomik ve sosyal durumunun en önemli göstergeleri arasında sayılmaktadır. Bu tez temel finans yönetimi olarak mudarebeye başvurulmasını engelleyen sebepleri açıklamayı amaçlamıştır. Bu çalışmanın önemi Mudarebe sözleşmesinin İslam'da para kazanmanın Şer'i yollarından biri olduğunu ve bu sözleşmenin hem para sahibi hem de işçinin lehine olacak bir ekonomik büyüme gerçekleştirmesinin garantisi olmasından kaynaklanmaktadır. Çalışmada endüktif yöntem metodolojisi kullanılmıştır. Şöyle ki İslam bankalarındaki finansmanla ilişkili literatüre dayanılmıştır. Sonrasında İslam bankalarında Mudarebe finansmanının önündeki engeller ve çözüm yolları araştırmasında analitik yöntem kullanılmıştır. Bu çalışma bir dizi sonuca ulaşmıştır ve bu sonuçların en önemlisi şudur: Mudarebe yönteminin klasik iki taraflı fıkhi formatı, İslam bankalarındaki pratik uygulama için geçerli değildir. Çünkü bankacılık uygulamasının birçok kuralından yoksundur ve Mudariblerin (emek ve işini ortaya koyan tarafların) manipülasyonuna imkan vermektedir ve bu durum risk derecesini arttırmaktadır. Bu yüzden Mudarebenin acilen geliştirilmesine ihtiyaç vardır."
