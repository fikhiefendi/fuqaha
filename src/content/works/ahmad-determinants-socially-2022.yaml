abstract: "Sosyal, çevresel ve etik boyutları yatırım kararını değerlendirme sürecine dahil eden yatırım kararı sosyal sorumlu yatırım (SSY) olarak tanımlanmaktadır. Bu araştırmanın amacı, İslami finansal okuryazarlık, dini sorumluluklar, iş desteği, itibar ve algılanan riskin SSY davranışı (SSY'ye yönelik yatırımcı hedefleri) üzerindeki etkisini incelemektir. Ayrıca, ahlaki kurallarla birlikte planlı davranış teorisinin nitelikleri ve niyet aracılığı ile SSY'ye yönelik yatırımcıların karar verme davranışları da incelenmiştir. Kavramsal çerçeve, Türk ve Pakistanlı yatırımcıların algısına uygun olarak yeni bir araştırma planını gündeme getirmektedir. Bu araştırma için nicel veriler toplanmıştır. Türk ve Pakistanlı bireylerden veri toplamak için kapalı ve açık uçlu sorulardan ve Likert tipi ifadelerden oluşan yapılandırılmış anket formu kullanılmıştır. Bu çalışmada pozitivist araştırma felsefesi korelasyon tanımlayıcı araştırma tasarımı ile kullanılmıştır. Bu araştırma tasarımı, Cronbach Alfa'nın yanı sıra verilerin ortalama ve standart sapması ve doğrulayıcı faktör analizi (DFA) dahil olmak üzere tanımlayıcı istatistikleri de içermektedir. Çalışmanın hipotezini test etmek için Yapısal eşitlik modellemesi (YEM), Hayes süreci ve çoklu grup analizi kullanılmıştır. Her iki ülkede elde edilen veriler hipotezleri desteklemektedir. Türkiye'de davranışın tüm faktörler (İslami finansal okuryazarlık, itibar, iş desteği, algılanan risk ve dini yükümlülükler) tarafından öngörülebildiği sonucuna istatistiksel sonuçlar aracılığıyla ulaşılabilmektedir. Ayrıca, Pakistan'da, algılanan risk dışında tüm faktörler (İslami finansal okuryazarlık, itibar, iş desteği ve dini yükümlülükler) davranışı öngörebilmektedir. Niyetin ahlaki kurallar, algılanan davranışsal kontrol, Sübjektif kurallar ve tutum tarafından öngörülebildiği de gözlemlenmiştir. Ayrıca, niyet her iki ülkede de sosyal sorumlu yatırımları pozitif biçimde ve anlamlı düzeyde etkilemektedir. Hayes süreci aracılığı bulguları, niyetin her iki ülkede de PDT davranışları ile SSY davranışları arasında kısmen aracılık ettiğini göstermektedir. Çok gruplu analizin sonuçları, karar-verme sürecinde bu iki ülkenin bireyleri arasında anlamlı bir fark olmadığını göstermektedir. Çalışmanın sonuçları ve bulguları, Planlı Davranış Teorisi (PDT) konusundaki tartışmalara değerli katkılar sağlayacaktır. Aynı zamanda bu çalışma, muhtemel politik çıkarımlarında paydaşlara (hükümet, düzenleyici kurumlar ve SSY sağlayıcıları) sosyal sorumlu yatırımları teşvik etme verimliliğini artırma hususunda yardımcı olacaktır."
