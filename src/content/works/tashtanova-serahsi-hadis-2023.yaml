abstract: "Hanefî mezhebinin hadislere yaklaşımı Ebû Hanîfe'nin döneminden beri tartışma konusu olmuştur. Hadisçilerin yöntemlerinden birçok açıdan farklılık arz eden Hanefî usûlcülerin yöntemleri, onlar tarafına dönem dönem ağır suçlamaların gelmesine de neden olmuştur. Hanefî usûlcülerinin haber-i vâhidin kabulünde getirdikleri bir takım şartlar, özellikle hadisin muhtevasıyla ilgili olan mânevî inkıta şartı, hadisçilerin yönteminden ayrılan bazı hususlardandır. Hadisçiler tenkid faaliyetini daha çok hadisin senedi üzerinden yürütürken, Ehl-i rey olarak da tanınan Hanefî âlimleri, hadisin senediyle beraber içeriği üzerinde yoğunlaşmışlar ve dinin temel kaynaklarına uyumluluğuna dikkat etmişlerdir. Onların bu yaklaşımı daha sonra arz yöntemi olarak adlandırılmış ve Hanefîleri Ehl-i Hadisin yaklaşımından ayıran en önemli özellik olmuştur. Serahsî, Mebsût'ta çok sayıda haber-i vâhidin kendisinden daha kuvvetli bir delile muarız olduğu durumları işlemiştir. Yaptığımız inceleme sonucunda metin tenkidine tabi tuttuğu bu tür hadislerin sayısı 200 den fazla olduğu görülmüştür. Bu kadar hadisi değerlendirmek gücümüzü aşacağından her konuda 5 er örnek vererek toplam 40 hadisi inceledik. Ancak bazı konularda elimizde bulunan veri nispetinde bir, iki veya üçer örnek verdiğimiz de olmuştur."
