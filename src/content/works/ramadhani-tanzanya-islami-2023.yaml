abstract: "Genel olarak, İslami bankacılık ve finans literatüründe müşteri algısı ve İslam hukuku uyumuna ilişkin çalışmaların sayısı oldukça fazladır, ancak müşterilerin banka seçiminde kullanılan diğer faktörler hakkında Şer'i Uyuma verdikleri ağırlık konusunda daha çok araştırma yapılması gerekmektedir. Bu çalışma, İslami banka müşterilerinin bankalarının İslam hukukuna uygunluğunu nasıl algıladıklarını ve bu ayağın (İslam hukuku uyumluluğu) banka seçiminde diğer üç faktör/kriter ile karşılaştırıldığında müşterileri İslami bankaları tercih etmede ne durumda olduğunu analiz etmeyi amaçlamaktadır. Bu amaçla kullanılan kriterler müşterinin İslami bankacılık uygulamalarına ilişkin farkındalığı; İslam bankası hizmet kalitesi ile müşteri memnuniyeti ve özellikle Tanzanya Birleşik Cumhuriyeti'nde müşterilerin bir İslami banka seçiminde müşterilerin dikkate alacakları diğer kriterler/faktörlerden neler olduğunu analiz etmektir. Kesit niceliksel bir yöntem kullanılarak, İslami Banka ürünleri sunan beş (5) bankadan, kapalı uçlu bir anket kullanılarak, rastgele seçilen ve tanımlayıcı istatistiklerle analiz edilen 305 İslami banka müşterisinden oluşan bir popülasyondan veriler derlenmiştir. Sonuçlar, Tanzanya'daki İslami banka müşterilerinin, bankaların İslam hukukuna uygun olarak algıladıklarını ve İslami Bankaların müşteri seçiminde İslam hukukuna uygunluğun üst düzeyde olduğunu göstermektedir. Elde edilen bulgulara dayanarak, Tanzanya'daki İslami banka müşterilerinin, İslami bankalara en çok tercih etmeye faktörün İslami bankaların İslam hukuku uyumu konusunda olumlu bir algıya sahip oldukları sonucuna ulaşılmıştır. Diğer tüm faktörler daha görece geride kaldığı görülmüştür. Bu bağlamda, İslami bankaların farkındalık, güveni korumak ve sundukları hizmetlerin kalitesini gözlemlemek için dokümantasyona ve işlemlerin açıklığına olan bağlılıklarını artırmalarının müşterilerin memnuniyetini belirleyen önemli faktörler olduğu tespit edilmiştir."
