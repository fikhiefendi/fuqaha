abstract: "Genel olarak Afrika ve özel olarak Batı Afrika'da İslam kültür ve medeniyeti yüksek seviyede bu coğrafyada güçlü köklere sahip olduğunu bilinmektedir. Eski dönemlerde Gana İmparatorluğu (300-1100), Mali İmparatorluğu (1235-1670) ve Songay İmparatorluğu (1464-1591) dönemlerinde geniş sosyo-kültürel hareketler başlamış, bu bağlamda özelikle Mâliki mezhebi fıkıh eğitimi ve öğretimini ve altın ve tuz ticaret faaliyetleri artmıştır. Bilhassa Tinbüktü, Ceney, Gao bölgelerindeki eğitim ve ticaret merkezleri, sübyan mektepleri, camiler, mescitler, medreseler ve diğer eğitim kurumları kurulmuştur. Bu eğitim kurumlarında, eğitim - öğretim faaliyetlerinin neticesinde Batı Afrika'da çok büyük ve ünlü âlimler yetişmiştir. Bu âlimler ve dönemin kralları sayesinde din eğitimi, özellikle de Mâliki mezhebi din eğitimi Afrika'nın her bölgesine yayılmıştır. Bunun diğer sebebi de Batı Afrika, Kuzey Afrika, Mağrip, Mısır ve Tunus'ta âlimler ve sultanların arasındaki bilimsel ve siyasi ilişkilerin gelişmiş olması ve Batı Afrika ve Mağrip'te Mâlikî medreselerinin verdiği eğitimdir. Batı Afrika'da hicri beşinci asırdan itibaren, ilmi ilişkiler sonucunda Mâlikî mezhebi bölgeye hakim olmuştur; bu bölgedeki krallıklar için Mense Musa Askiya Muhammed ve Askiya Davut gibi hükümdarlar özel bir sembol haline gelmiştir. Mâlikî mezhebinin yayılmasında özellikle Gana, Mali, Songay, Kanem hükümdarları ve âlimleri büyük rol oynamıştır. Mâlikî fıkıh ilimleri medreselerde, mescitlerde ve özel mekânlarda mezhebi öğretilmiş, uygulamalarını da şeri hüküm ve fetvalarına vermişler. Bu bölgede halk âlimlere karşı saygı göstermeye önem verilmiştir; âlimler, toplum içinde önemli bir yere sahip olmuş, ayrıca da onlara konumları dikkate alınarak, devlette yüksek rütbeler verilmiştir. Bu şekilde Mâlikî mezhebi, öne çıkmış hükümdarların da uymuş olduğu resmi bir mezhep haline gelmiştir. Hatta o mezhebe mensup olduklarından dolayı övünmüşlerdir ve kendileri için bir onur ve şeref olarak görmüşlerdir. Bu eğitim faliyetleri, kurulan ilişkiler ve meydana gelen etkiler sayesinde Mâlikî mezhebi Batı Afrika'nın her yerinde öne plana çıkmış, hem hükümdar ve sultanlar hem de halk tarafından günümüze kadar en çok tercih edilen mezhep haline gelmiştir."
