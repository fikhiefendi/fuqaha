abstract: "Bankacılık sektöründe kredi riski en önemli risk kalemlerinden biridir. Sistemde geri ödemelerle meydana gelen aksaklıklar domino etkisiyle beklenmedik sonuçlara yol açabilir. Müşteri kredi talebiyle geldiğinde birçok kriter göz önüne alınarak müşteri değerlendirilir. Müşterinin işletme veya gerçek kişi olmasına göre bu değerlendirme süreçleri farklılık göstermektedir. Gerçek kişilerde kişinin geri ödeme kapasitesi, borcun vadesi, tutarı gibi ölçütler esas alınırken işletmelerde daha ayrıntılı bir dereceleme yapılmaktadır. Ayrıca bankaların kredi kullandırdığı sektörlerin dağılımı ve hangi sektörlerin kredi riski açısından farklılaştığını bilmek kredi riski yönetimi açısından önem taşımaktadır. Bu çalışmada banka grupları bazında sektörel krediler açısından kredi riskini etkileyen sektörlerde farklılık olup olmadığı araştırılmıştır. Bankacılık verileri BDDK web sitesinden aylık veri bülteninden toplanmış, makroekonomik veriler ise Türkiye İstatistik Kurumu (TÜİK) ve Merkez Bankasının Elektronik Veri Dağıtım sisteminden (EVDS) alınmıştır. Kredi riski ile ilgili üç model kurulmuştur. Bağımlı değişken tüm modellerde kredi riski göstergesi olarak takipteki alacakların toplam alacaklara oranının değişimi olarak alınmıştır. İlk modelde bağımsız değişkenler kredi değişimi ve makroekonomik değişkenlerdir. İkinci modelde bağımsız değişkenler ticari ve bireysel kredilerin ağırlıklı değişimi, üçüncü modelde ise bağımsız değişkenler sektör kredilerinin ağırlıklı değişimi ve makroekonomik değişkenlerdir. Modeller panel veri analizi ile test edilmiştir. Analiz sonuçlarına göre banka gruplarında sektör kredi değişimlerinin yanı sıra ticari ve bireysel kredilerde de farklılıklar bulunmuştur. Banka grupları için anlamlı çıkan sektörlerle ilgili bankalar kredi kullandırma noktasında farklı politikalar geliştirebilir."
