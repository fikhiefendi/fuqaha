abstract: "Bu çalışma, Çorum Hasan Paşa Yazma Eser Kütüphanesi'nde muhafaza edilen fıkıh alanındaki yazma eserleri konu edinmektedir. Kütüphanedeki 7857 yazma eserin 556'sı fıkıh literatürüne aittir. Mükerrer nüshalar da dikkate alındığında bu sayı 1000'in üzerine çıkmaktadır. İncelemeye konu olan eserlerden 129'u metin, 92'si şerh, 53'ü hâşiye, 3'ü ta'lik, 169'u risâle, 6'sı tercüme ve 19'u muhtasardır. Araştırmada Hasan Paşa Yazmaları (7268 eser) ele alınmıştır. Çorum'daki diğer koleksiyonlar İskilip Yazmaları (529 eser), Yazma Bağış ve Satın Alma (41 eser), Çorum Müze Müdürlüğü Yazmaları (12 eser) ve Çankırı Müze Müdürlüğü Yazmaları (az sayıdaki nüsha) şeklindedir. Çalışma iki bölümden oluşmaktadır. Birinci bölümde müellifleri tespit edilebilen eserler sırayla tanıtılmış; her müellif hakkında kısa biyografik bilgiler verilmiş, ardından kütüphanede eserleri muhtevâ ve fizikî özellikleriyle birlikte tanıtılmıştır. İkinci bölümde müellifleri tespit edilemeyen eserler konularına göre tasniflendirilmiştir. Eserlerin Türkiye'deki diğer nüshaları da tespite çalışılmış ve ilgili dipnotlarda kaydedilmiştir. Çorum Hasan Paşa Yazma Eser Kütüphanesi'nde muhafaza edilen fıkıh yazmaları, metin, şerh, hâşiye, ta'lîk, risâle, tercüme ve muhtasar türlerindedir. Müellifi tespit edilebilen nüshalar içinde Hanefî mezhebine mensup fakihlerin ağırlığı belirgindir. Şerh ve hâşiye geleneğinin en yoğun takip edildiği metinler Muhtasarü'l-Müntehâ, Menârü'l-envâr, el-Ferâizü's-Sirâciyye ve et-Telvîh olup, özellikle Muhtasarü'l-Müntehâ ve et-Tenkîhu'l-usûl çevresinde hâşiye faaliyetinin güçlendiği görülmektedir. Nüsha varlığı bakımından el-Ferâizü's-Sirâciyye, Dürerü'l-hükkâm, Şerhu'l-Ferâizi's-Sirâciyye ve Hâşiye alâ Şerhi Muhtasari'l-Müntehâ öne çıkmaktadır. Konu tasnifinde ferâiz, ibâdât, usûl-i fıkıh, muhâkeme, vakıf, ukûbât, fetâvâ, fetvâ âdâbı ve nevâzil mahiyetindeki fer'î risâleler belirgin bir yer tutmaktadır. Bu araştırma ile Çorum Hasan Paşa Yazma Eser Kütüphanesi'nde yer alan fıkıh literatürünün gün yüzüne çıkarılması ve ilmî çevrelerin istifadesine sunulması hedeflenmiştir. Böylece kütüphanedeki zengin mirasın tanıtılması sağlanmış ve fıkıh ilminin tedvîn ve intikal sürecine dair araştırmalara zemin hazırlanmıştır."
