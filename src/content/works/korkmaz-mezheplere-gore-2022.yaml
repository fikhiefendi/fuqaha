abstract: "İbadetler, bir dinin görünen yüzü olduğundan bu konu İslam hukukunda önemli bir yere sahiptir. Kulluğun bir gereği olarak yapılması gereken ibadetlerle mükellef olduğu halde ihmal eden kimseler için dünyevî ve uhrevî bazı caydırıcı müeyyideler mevcuttur. Bu çalışmada namaz, zekât, oruç ve hac ibadetlerinin inkâr ve ihmal edilmesi durumunda uygulanılması öngörülen müeyyideler hakkında eski ve yeni mezhep görüşleri ile son dönem bazı değerlendirmeler ele alınmıştır. Çalışmanın birinci bölümünde mükellefiyet ve ibadet bahsi ile ilgili genel bilgilere yer verildikten sonra namaz, zekât, oruç ve hac ibadetlerinin anlamı, önemi, farz oluşu, kimlere farz olduğu ve şartları ile ilgili bilgilere yer verilmiştir. İkinci bölümde ise namaz, zekât, oruç ve hac ibadetlerinin terk edilmesi durumunda mezheplerin öngördüğü dünyevî ve uhrevî müeyyideler delilleriyle birlikte aktarılmıştır. Ayrıca bu ibadetlerin terk edilmesi durumunda uygulanılacak uhrevî müeyyideler de naslar ışığında anlatılmaya çalışılmıştır. Son olarak irtidat konusu ele alınarak mürtetlere uygulanacak müeyyideler ile ilgili mezhep görüşlerine temas edilmiştir. Özetle, İslam inancında bir insanın öldürülmesi tüm insanlığın öldürülmesi gibi değerlendirildiğinden, ibadetleri inkâr etmediği sürece bir Müslüman asla öldürülmemiştir. Bu konuda oldukça geniş süre tanınarak o kişinin de cennete gitmesi konusunda nasihatler ve yönlendirmelerin her zaman öncelendiği söylenebilir."
