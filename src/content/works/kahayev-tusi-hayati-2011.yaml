abstract: "Ebû Ca`fer Muhammed b. Hasan et-Tûsî h. V. yüzyılda yaşamış en önemli Ca`ferî fıkıh âlimlerinden biridir. Onun Ca`ferî mezhebinin teşekkülündeki önemli katkılarının yanı sıra fıkıh usulünün oluşumunda ve gelişiminde önemli etkisi vardır. Hatta onu Ca`fer-i Sadık'tan sonra bu mezhebin ikinci imamı olarak değerlendirmemiz yanlış olmaz. Onun bu mezhepteki önemini bilmek için eserlerine bakmamız yeterli olacaktır. Usul ilmine olan katkılarını ise bariz bir şekilde el-`Udde adlı eserinde görmek mümkündür. O, bu eserinde mezhebine göre delil sayılan hususları işlemiş, delil olarak görmediklerini de eleştirerek bunları delil sayanlara cevap vermiştir."
