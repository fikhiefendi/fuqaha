abstract: "Bu çalışma İbrahim Halebî'nin Mültekâ isimli eserinin İbadetler bölümü, tahâret ve namaz özelinde Ebu Yusuf'a nispet edilen görüşlerin mezhep içerisindeki diğer imamlarla ihtilaf sebeplerini zikretme çalışmasıdır. Bu ihtilafların neticesinde, hükümler hususunda nasıl farklılıkların oluştuğu tespit edilmeye çalışılmıştır. Çalışma bir giriş ve üç ana bölümden oluşmaktadır. Giriş bölümünde konunun önemi, çalışmanın amacı, sınırları ve yönteminden bahsettik. Birinci bölümde Ebu Yusuf'un hayatından, eserlerinden ve çalışmamızda temel aldığımız Mültekâ isimli eserin müellifi İbrahim Halebî'nin hayatından ve eserlerinden bahsettik. Ayrıca içtihat, taabbudî ve ta'lîlî alan konularına değindik. İkinci bölümde ibadetler bölümü, tahâret özelinde tespit ettiğimiz görüşleri, kendi içerisinde başlıklar altında toplayarak görüş farklılıklarını Hanefi mezhebindeki kaynaklardan faydalanarak açıkladık. Üçüncü bölümde ise ibadetler bölümü, namaz özelinde tespit ettiğimiz görüşleri, kendi içerisinde başlıklar altında toplayarak görüş farklılıklarını Hanefi mezhebindeki kaynaklardan faydalanarak açıkladık. Sonuç bölümünde ise çalışmamızdan elde ettiğimiz görüş farklılıklarının sebeplerini açıkladık."
