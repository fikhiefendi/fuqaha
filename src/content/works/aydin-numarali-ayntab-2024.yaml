abstract: "Altı yüz seneden fazla süre yaşayan Osmanlı Devleti, üç kıtaya hükmetmiş, hüküm sürdüğü coğrafyalarda tarihi ve mimari yapıtların yanı sıra çok zengin bir arşiv hazinesi bırakmıştır. Osmanlı Devleti'nin anlaşılmasında ve anlamlandırılmasında önemli rol oynayan belge türlerinden biri de kuşkusuz Şer'iyye sicilleridir. Osmanlı Şer'iyye sicilleri, kadı veya kadı naibi tarafından yazılan çeşitli türden belgeleri içermektedir. Bu belgeler, Osmanlı Devleti'nin askerî, hukukî, ekonomik, dini ve idarî kurumları gibi birçok alanda değerli bilgiler içermektedir. Tezimizin temelini teşkil eden 1071-1073/1660-1663 26 numaralı Ayntâb Şer'iyye Sicili, üç senelik zaman dilimini kapsamaktadır. Çalışma, XVII. yüzyılda Ayntâb'ın içinde bulunduğu siyasal, sosyal, hukukî, ekonomik ve kültürel durumu hakkında bilgi edinmemizi sağlamıştır. Osmanlı halkının hayat tarzını, ticari hayatını, sosya-kültürel ve siyasi teşkilatını doğru olarak tespit etmemiz Şer'iyye sicilleri sayesinde mümkün olmaktadır. Şer'iyye sicilleri Osmanlı şehirleri ve Osmanlı Devleti'nin sosyal, kültürel yapısı olmak üzere siyasî, askerî, iktisadî ve beledî yapısıyla ilgili çalışma yapanların başvurdukları ana kaynaklardandır. Yaptığımız çalışma giriş ve üç bölümden oluşmaktadır. Çalışmamızın daha iyi anlaşılması için belgelerin transkripsiyonundan önce giriş kısmında Ayntâb isminin menşei, coğrafi konumu, yeryüzü şekilleri ve Osmanlı Dönemi'nde Ayntâb ile ilgili bilgiler verilmektedir. Birinci bölümde; kadılığın tanımı, kadılık müessesesi, kadının görevleri, Şer'iyye sicillerinin tanımı, tarihi kaynak olarak önemi ve içeriği ele alınmıştır. İkinci bölümde; defterin içeriği, Ayntâb'ın sosyal hayatı (evlenme, boşanma, nafaka, vekâlet, vasi tayini) ekonomik hayatı, (çarşı, pazarlar, hayvan fiyatları, alacak-verecek davaları, kiraya verme, mülk satışı), adli olaylar (hırsızlık, yaralanma, katl) ele alınmıştır. Bununla beraber sicilde adı geçen Ayntâb'e ait yer isimlerine (mahalle, kaza, nahiye, karye ve mezra) isimlerine değinilmiştir. Defterde geçen bazı yer isimleri mahalle (Akyol Mahallesi, Amu Mahallesi, Kürtünciyan Mahallesi, Kayser Mahallesi, Şehreküstü Mahallesi, Ehl-i Cefa Mahallesi, Kızılca Mescid Mahallesi, Seng-i Tavîl Mahallesi), kaza (Ayntâb Kazası, Kilis Kazası, Telbeşar Kazası, Rumkale Kazası), karye (Akpınar Karyesi, Arablar Karyesi, Bedirkendi Karyesi, Kızılhisar Karyesi, Mızmız Karyesi), mezra (Panek Mezrası, Kızılca Burc Mezrası), nahiye (Nehrü'l-Cevaz, Burc Nâhiyesi, Revanda Nâhiyesi). Üçüncü bölümde ise tamamen çalışma konusu olan sicilin transkripsiyonu ve özetleri bulunmaktadır. 26 numaralı sicilin özellikle son sayfalarında tahrip olmuş ve silik olan kısımlar fazladır. Tahrip olunan belgeler ve silik olunan yerler belgelerin okunmasını haliyle zorlaştırmıştır. Belgelerin bazı yerlerinde harfler okunmayacak kadar ufak, iç içe geçmiş ve üzerine mürekkep dökülmüştür. Bütün bunlara rağmen çalışmamızın tamamen doğru ve eksiksiz olduğu iddiasında değiliz. Elimizden geldiğince okumaya çalıştık. Çalışmanın asıl amacı, sicildeki verilere dayanarak 1660 ile 1663 seneleri aralığındaki Ayntâb'ın idarî, iktisadi ve sosyo-kültürel hayatı değerlendirilerek bölge ve şehir tarihine katkı sağlamaktır."
