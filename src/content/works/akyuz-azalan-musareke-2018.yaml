abstract: "Faizsiz bankacılığının ortaya çıkmasıyla beraber bu alanda kullanılabilecek çeşitli finansman yöntemleri geliştirilmiştir. Ortaklık temelline dayanan ve müşâreke yönteminin bir türevi kabul edilen azalan müşâreke (el-müşâreketü'l-mütenâkısa) de bu yöntemlerden biridir. Yöntemin normal müşârekeden farkı, kurulan ortaklığın peyderpey bitirilerek mülkiyetin bir taraftan diğer tarafa intikal etmesidir. Yöntemdeki amaç, finansman talep eden taraf ile sermayesini işletmek isteyen kesimi bir araya getirerek faizsiz bir şekilde bireylerin ve toplumun ihtiyaçlarını gidermektedir. Bu noktada sermayedarın amacı kâr ve sermayesini alarak ortaklıktan çıkıp yeni alanlara yönelmek iken; müteşebbisin amacı ise ortaklık konusu varlığa tek başına sahip olmaktır. Genelde konvansiyonel bankacılık ürünlerine özelde ise faizsiz enstrümanlara alternatif olarak kullanılabilecek olan azalan müşâreke proje, araç-gereç ve gayri menkul edinimi gibi alanlarda bireylerin ihtiyaçlarını karşılayacak bir finansman yöntemidir. Fıkhi olarak vaad, mürekkeb yapı, risk gibi konularda diğer finansman teknikleriyle ortak yönleri ve problemleri olsa da yapısı itibariyle şirket temelli olmasının getirdiği kendine has birtakım farklı yönleri mevcuttur. Tez, faizsiz finansman alanında kullanılabilecek bir enstrüman olan azalan müşâreke yöntemini iktisadi, sosyal ve fıkhi açıdan konu etrafında oluşmuş literatürden hareketle ele almakta ve kullanım alanları ve imkanını ortaya koymaya çalışmaktadır."
