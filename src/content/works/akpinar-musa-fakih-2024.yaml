abstract: "Bu araştırma, Osmanlı dönemi âlimlerinden Mûsâ Fakîh Efendi tarafından yazılmış olan Kavâidü'l-Kur'ân fî Tecvîdi'l-Kur'ân, diğer ismiyle Kavâidü'l-Kur'ân Ma'a Kavâ'id-i Küllî adlı yazma eserini incelemek ve değerlendirmek amacıyla hazırlanmıştır. Yazma eser iki ana bölümden oluşmaktadır. İlk bölümünde Hâcibzâde'nin Kavâ'idü'l-Kur'âni'l-Azîm adlı eserini çocuklara yönelik olarak ele alan müellif, eserin ikinci kısmını Kavâ'id-i Küllî olarak Kâsım b. Fîrruh eş-Şâtıbî'nin kıraat risalesini çocukların anlayacağı şekilde değerlendirmiş ve h. 1111 / m. 1699 yılında eseri tamamlamıştır. Mûsâ Fakîh Efendi'nin Türk çocuklarına yönelik yazmış olduğu Kavâidü'l-Kur'ân fî Tecvîdi'l-Kur'ân adlı eserin mükerrer iki nüshası vardır. Bu nüshalar Hacı Selim Ağa Kütüphanesi Kemankeş koleksiyonunda yer almaktadır. Okunabilir durumda olan bu nüsha nesih hattı ile yazılmıştır. Ana metin Osmanlıca olup giriş ve hâtime bölümleri ile bazı tecvid konularının girişleri Arapça olarak yazılmıştır. Eserin girişinde Türk çocuklarının tecvid öğrenimine yönelik olarak yazıldığı belirtilmiş ve bu nedenle sadece tecvid konuları ele alınmış, bazı kıraat âlimlerinin okuyuşları da zikredilmiştir. Bu çalışmada kıraat ve tecvid ilminin önemi ile Mûsâ Fakîh Efendi, Hâcibzâde ve Kâsım b. Fîrruh eş-Şâtıbî'nin hayatı ve eserlerine değinilmiştir. Ayrıca, Mûsâ Fakîh Efendi'nin Kavâidü'l-Kur'ân fî Tecvîdi'l-Kur'ân adlı eseri tahkik edilerek, Osmanlıca, Farsça ve Arapça kelimeler sözlükler yardımıyla açıklanmıştır."
