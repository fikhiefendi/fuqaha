abstract: "Mahmut b. Süleyman el-Kefevî,“Ketâib”adlı eserinin, Ebû Yusuf'la (ö. 182/798) başlatıp es-Saymerî (ö. 436/1044-5) ile bitirdiği yaklaşık üç asırlık dönemi kapsayan ilk altı ketîbesini, mütekaddimîn dönemine, diğer bir ifade ile mezhebin teşekkül dönemi fukahâsına ayırır. Dirase kısmında üç asırlık bu dönem,“Kişiler”,“Eserler”ve“İktibaslar”olmak üzere üç ana başlık altında incelenmiştir. Böylece, Hanefi mezhebinin hangi ilmî havzalarda, hangi zaman diliminde kimler kanalıyla yayıldığı, istatistiksel bilgiler, haritalar ve tablolar halinde sunulmuştur. Bu zaman zarfında oluşturulan mezhep literatürü ile nasıl bir“mezhep sistemi”teşkil edildiği hususu tablolar halinde gösterilmiştir. İktibas zengini bir eser olan“Ketâib”deki iktibasların hangi gerekçelerle yapıldığı örnekler üzerinden takdim edilmiştir. Çalışmanın ekinde Kefevi'nin Ketâib'inin ilk altı ketîbesinin tenkitli neşri sunulmuştur."
