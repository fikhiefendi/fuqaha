abstract: "Bu tez İslami Bankacılık dönüşümünün önünde engel teşkil eden sorunları aşma noktasında emin olma hususunda İslami Finans alanında çalışmalar yapan Libya Bankacılığının imkanlarını analiz etme üzerinden İslami Bankacılık Tecrübesi“Gerçeklik ve Kısıtlamalar”ışığında anlama ve tanımayı amaçlamaktadır. Bu kapsamda araştırma (Yönetimsel Kısıtlamaları-İnsan Kaynakları Kısıtlamaları, Şeri ve Medeni Kısıtlamalar, İslami Ürünlerle Bağlantılı Kısıtlamalar ve Altyapı İle İlgili Kısıtlamalar) olmak üzere dört ana sorun tespit etmiştir. Aynı şekilde bu çalışma Libya'nın doğusunda ve batısındaki bölgelerde henüz araştırma aşamasında olan banka yönetimlerinin çalışma tabiatının farklılık arz eden engelleri yenebilme ve baş edebilme çerçevesindeki araştırmalara cevap vermeyi de hedeflemektedir. Bu bağlamda araştırmacı İslami Finans sektöründe (Trablus – Bingazi – Beyza) gibi Libya illerinde faaliyet gösteren Cumhuriyet Bankası, Vahdet Bankası, Milli Ticaret Bankası ve as-Sahari Bankası olmak üzere dört farklı banka üzerinde yoğunlaşmıştır. Araştırmacı, memurlar, birim başkanları, müdürler, orta kademe idareciler üzerinden bilgi toplama aracı olarak anket formlarını kullanmıştır. Bu araştırmanın hedeflerini gerçekleştirmek için de araştırmacı, pratik ve nazariye tarafını hazırlamak için analiz yöntemini takip etmiştir. Bu çerçevede 189 adet anket formu görevlilere dağıtılmıştır. Akabinde Sosyal Bilimler İstatistik Programları (SPSS) yöntemini kullanarak bilgileri ve faraziyeleri incelemiştir. Araştırma birçok sonuca ulaşmış ve öneriler"
