abstract: "Adam çalıştıranın sorumluluğu konusu Türk hukukunda çokça işlenmiş olmasına rağmen, İslâm hukuku bakımından konunun farklı akit türlerindeki örneklerini kuşatan ve bunu modern hukukla mukayese eden bir yaklaşımla ele alan bir çalışmaya rastlayamadık. Türk hukukundaki çalışmalarda, oldukça sınırlı bir ölçüde ve genellikle de Mecelle üzerinden konu aktarılmaya çalışılmıştır. Ancak temel kavramlar üzerinde İslâm hukuk doktrininde de ortak bir kanaat bulunmadığından, yalnızca Mecelle'ye dayalı bu açıklamalar İslâm sorumluluk hukuku rejimini yansıtmak hususunda çeşitli açılardan yetersiz ve eksik kalmaktadır. Bu çalışmada hem İslâm sorumluluk hukukunun temel kavramları verilmekte hem gerekçeleriyle birlikte konuya dair teorik bir çerçeve çizilmekte; adam çalıştıranın sorumluluğu, çizilen bu teorik çerçeve içerisinde izah edilmektedir. Adam çalıştıranın sorumluluğu öncelikle mukayeseli olarak İslâm hukukunda ve Türk hukukunda konunun teorisi üzerinden ele alınmakta, sonrasında bu sorumluluğun doğduğu haller bölümünde verilen örnek olaylar üzerinden konu somutlaştırılmaktadır."
