abstract: "Namaz ibadeti, ibadetler arasında önemli bir yere sahiptir. Namazda yapılan bazı hatalar, namazın sıhhatine engel olabilmektedir. Bu hatalardan kayda değer bir kısmı ise kıraat hususundadır. Bu hatalara, okuyanın yanılması anlamına gelen“zelletü'l-kârî”denilmektedir. Namazda kıraat esnasında okuyucu, vakf ve ibtidâ, i'râb, harfler, ayetler ve kelimelerde değiştirme veya ekleme veyahut bunların telaffuzunda bazı hatalar yapabilmektedir. Hanefî fakihler, konuyu sistematik ve ayrıntılı bir şekilde ele almış, neredeyse tüm hataları kapsayacak şekilde incelemişlerdir. Bunun en önemli sebeplerinden biri, Hanefî mezhebinin doğuş ve yayılış coğrafyasının diğer mezheplere göre daha kozmopolit bir görünüm arzetmesi ve dolayısıyla karşılaştıkları problemlerin daha girift olmasından kaynaklanmaktadır. Namazda kıraat hataları diğer fıkıh mezheplerinde Hanefî mezhebinde olduğu gibi sistematik ve geniş olarak ele alınmamıştır. Diğer mezheplerde konu, lahn kapsamında ele almış ve hata yapanı“lehhân/lâhin”(okumada dil bilgisi ve i'râb hatası yapan) kavramı çerçevesinde incelemişlerdir. Namazda yapılan kıraat hatalarının, namazı bozup bozmayacağı hakkında fakihler bazı ölçütler tespit etmişlerdir. Bu hataların Hanefî mezhebinde namazın sıhhatine mâni olup olmaması iki temel yaklaşımla incelenmiştir. Ebû Hanîfe, İmâmeyn ve onların talebelerinden oluşan, kendilerine“mütekaddimîn”denilen fakihler, konuyu ihtiyat prensibi çerçevesinde belli kurallarla izah etmişlerdir.“Müteahhirîn”denilen ulemâ ise kıraatte bulunan kişi lehine örf ve maslahat kaynaklı, dinde kolaylık ve genişlik prensibini esas almışlardır. Bu çalışmada, namazda okuyucunun yaptığı kıraat hatalarına ve bunun özelinde namaz ibadetinin sıhhatine mâni olan kıraat hatalarının mahiyetine ve gerekçelerine değinilmiştir. Kıraat hatalarıyla günümüzde de çokça karşılaşıldığından çalışmanın bu sorunlara ışık tutması hedeflenmiştir."
