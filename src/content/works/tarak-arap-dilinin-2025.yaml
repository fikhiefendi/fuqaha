abstract: "Bu çalışma, Arap dilinin fıkhî ihtilaflardaki rolünü göstermeyi hedeflemektedir. Giriş bölümünde, Arapçanın tarihsel gelişimi ele alınarak, dilin İslâm'ın ilk asırlarında salt bir iletişim aracı olmaktan çıkıp dinî bilginin taşıyıcısı olma süreci analiz edilmiştir. Bu bağlamda Kur'an'ın“Arapça indirdiğimiz çelişkisiz Kur'an”ifadesinden hareketle, Arap dilinin gramatik yapısıyla fıkhî hükümlerin lafzî temelleri arasındaki sıkı ilişki işlenmiştir. Birinci bölümde, Ebu'l-Leys es-Semerkandî'nin (ö. 373/983) hayatı, ilmî şahsiyeti ve Muhtelefü'r-rivâye adlı eserinin hilâf literatüründeki konumu ele alınmıştır. Eserin sistematik, özlü ve delil odaklı üslubu incelenmiş; klasik hilâf geleneğindeki konumuna değinilmiştir. İkinci bölümde ise ibadete dair on üç ihtilaflı mesele,“Tanıtım–Ortak Delil–Görüşler–Değerlendirme ve Dilsel Analiz”başlıkları altında çözümlemeye tabi tutulmuştur. Kıraat farklılıkları, iʿrâb ihtimalleri, müşterek ve âm lafızlar ile bağlamsal (siyâk-sibâk) unsurların fıkhî yorumları nasıl şekillendirdiği somut örneklerle ortaya konmuştur. Elde edilen bulgular, aynı ayetten farklı hükümlerin türetilmesinde dilsel ihtimallerin önemli bir zemin teşkil ettiğini göstermektedir. Hanefî mezhebi başta olmak üzere farklı mezhepler içindeki görüş ayrılıklarının önemli bir kısmının Arap dilinin anlam çeşitleri ve gramer yapısı ile doğrudan ilişkili olduğu tespit edilmiştir. Çalışma, Arap dilinin yalnızca“kaynak okuma”değil, hukukî argümantasyonun mantığını kurma açısından da zaruri olduğunu göstermiş; ileri seviye dil hâkimiyetini ilmî istidlâlin ön şartı olarak temellendirmiştir. Gelecek araştırmaların muâmelât ve ukûbât sahalarını, farklı mezheplerin hilâf metinlerini ve dil ile hukuk arasındaki bağlantıyı kapsayacak şekilde genişletilmesi tavsiye edilmektedir."
