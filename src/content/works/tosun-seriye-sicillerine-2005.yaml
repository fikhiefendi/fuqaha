abstract: "02. Özet İhtiva ettiği sosyal, iktisadi, siyasi ve kültürel bilgilerle kent tarihi araştırmalarında çok önemli bir yere sahip olan kadı sicilleri, çoğunlukla söz konusu kaza merkezinde meydana gelen ve mahkemeye intikal eden her türlü hukuki anlaşmanın/anlaşmazlığın kayıtlarının tutulduğu defterler olmanın yanında, merkez-taşra arasındaki yazışmaları da bünyesinde barındırır. Bu çalışma, Trabzon İl Halk Kütüphanesi arşivinde bulunan 1901, 1902, 1903 ve 1904 numaralı Trabzon seriye sicillerindeki mülk satışlarını incelemektedir. Tez, giriş ve iki bölümden oluşmaktadır. Giriş bölümünde Trabzon tarihine kısaca değinilmiş akabinde Trabzon tarihiyle ilgili yapılan çalışmalar ve tezde izlenen yöntem üzerinde durulmuştur. Birinci bölümde İslam hukukunda bey (satım) akdinin yeri hakkında bilgiler sunulmuş daha sonra bu akdin sicillerde ne şekilde uygulandığı ayrıntılı örnekler verilmek suretiyle incelenmeye çalışılmıştır. ikinci bölümde 1901, 1902, 1903 ve 1904 numaralı Trabzon seriye sicillerindeki mülk satışları çeşitli başlıklar altında analiz edilmiş, bu şekilde toplumsal yaşamın bir parçası olan mülk satışlarının hangi şartlar altında gerçekleştiğine dair teferruatlı bilgiler verilerek o dönemdeki Trabzon'un sosyal ve ekonomik tarihiyle ilgili veriler elde edilmeye çalışılmıştır. Mülk satışı eksenli olarak bakıldığında, sosyal ve ekonomik tarih açısından çok önemli bir kaynak olan kadı sicillerinin, Osmanlı İmparatorluğu'nun taşra hayatının daha net olarak anlaşılabilmesini sağlayacağı görülmektedir. VI"
