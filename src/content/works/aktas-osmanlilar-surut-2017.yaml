abstract: "İslâm'ın ilk dönemlerinden itibaren uygulanan hukukî işlemlerin yazıya geçirilmesi faali-yeti, ilerleyen dönemlerde müstakil bir ilim dalının konusu haline gelmiştir.“İlm-i şurût”olarak isimlendirilen bu ilim dalı füru' fıkıh kitaplarında kitabü'ş-şurût başlığı altında incelenirken hicri üçüncü asırdan itibaren ilm-i şurûta dair müstakil eserler yazılmaya başlanmış ve bu konuda geniş bir literatür oluşmuştur. Belgeleme ilmi diyebileceğimiz şurût ilmi günümüzdeki noterlik müessesesinin İslâm hukukundaki adıdır. Osmanlı dö-neminde yazılan şurût eserlerine“sak mecmuaları”şurût ilmine de“sukûk ilmi”adı ve-rilmiştir. Sukûk ilmi Ali Haydar Efendi'nin yaşadığı dönemde“Tatbikat-ı Şeriyye”adını almıştır. Osmanlı döneminde telif edilen sak mecmualarını önceki dönem şurût eserlerin-den ayıran temel özellikler, sak mecmualarında şurût ilminin teorik tartışmalarına, belge düzenlenen meselenin fıkhî hükmü ile ilgili farklı görüşlere yer verilmemesi ve belgelerin dilinin Türkçe'ye dönüşmesidir. İlk örnekleri Arapça olan sak mecmualarının dili mah-kemelerde belgelerin Türkçe tanzim edilmeye başlamasıyla Türkçe'leşmiştir. Arapça'dan Türkçe'ye geçiş döneminde her iki dilde yazılan belgelere de yer verilmesi belgelerin uzunluklarının artmasına neden olmuştur. Bu dönemde yazılan eserlerde ağırlıklı olarak ilâm ve hüccetlere yer verilmiş, konuların tasnifinde farklı sıralamalar tercih edilmiştir. Bazı eserlerde fıkıh kitaplarının bölüm başlıklarına uyulmuş bazılarında ise farklı bir yol takip edilmiştir. Sonuç olarak bu çalışmada şurut ilminin tarihî gelişimine kısaca yer ve-rildikten sonra Osmanlılar döneminde şurut ilmi, ayrıntılı bir şekilde Tanzimat öncesi ve sonrası olmak üzere iki ayrı döneme ayrılarak anlatılacak, örnek olarak da Ali Haydar Efendi'nin eserleri incelenecektir."
