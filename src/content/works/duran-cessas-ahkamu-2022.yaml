abstract: "Tüm insanlığın dünya ve ahiret saadetini temin etmeyi hedef almış Kur'ân-ı Kerîm, inançlar, ibadetler ve insanlar arasındaki ilişkileri düzenleyen hükümlerle gelmiştir. İnsani ilişkilerin başladığı yer de ailedir. Şüphesiz ki aile insan için en ehemmiyetli ve vazgeçilmez kurumdur. Ailenin kuruluşu olan evlilik ise bütün değerlerin temeli olan dinin korunmasını sağlayan en önemli unsurlardandır. Evlilik prensip olarak ömür boyu sürdürülmek üzere kurulsa da ilerleyen süreçte üzüntü sıkıntı ve işkenceye dönüşebilmektir. Böyle durumlarda boşanma kaçınılmaz olabilir. İman etmiş kimseler için evlilik bağı kurulurken de çözülürken de Allah'ın hudutlarına riayet etmek gerekmektedir. Bu tezde İslam Hukuku'nda önemli bir yer kaplayan boşama hükümlerini ele alan Talâk Sûresi çalışılmıştır. Tezimizde Bağdat ve çevresinde yaşamış, Hanefi fıkhının önemli isimlerinden Cessâs'ın (ö.370) Ahkâmü'l-Kur'ân adlı tefsirinden ve Maliki mezhebini benimsemiş Endülüslü büyük alimlerden olan Kurtubî'nin (ö.670) el-Câmi'u li-Ahkâmi'l-Kur'ân adlı tefsirinden Talâk Sûresi mukayeseli olarak ele alınmıştır. Giriş bölümünde, araştırmanın konusu, kapsamı, amacı, yöntemi ve önemi açıklanmış; ardından tefsîr ve konulu tefsîr hakkında bilgi verilmiştir. Birinci bölümde, tezde esas alınan tefsirlerin yazarları ve eserleri hakkında bilgi verilmiş; Talâk Sûresi'nin tanıtımı yapılmıştır. İkinci bölümde, Talâk Sûresi'nde birbiriyle ilişkili ayetler ilgili konu başlıkları altında ele alınarak tefsir edilmiştir. Sonuç bölümünde, ulaşılan genel değerlendirmelere yer verilmiştir."
