abstract: "Usûl'ün birleşik köküne, furû'un ayrık dallarına dair mânaları içine alan bir yapı olarak tanımlanan beyân, İslâm Hukuku usulünde Kur'ân ve sünnet nass'larının mâhiyetlerini, birbiriyle ilişkilerini, şer'î derecelerini ve sünnetin Kur'ânı açıklaması görevi üzerinden şâri' Allah Teâlâ'nın makâsıdını tespit edip ortaya koymada anahtar vazifesi görmektedir. Çalışmamız bir giriş ve iki bölümden müteşekkildir. Giriş kısmında çalışmanın önemi, amacı, yöntemi ve kaynakları konusunda gerekli bilgilere yer verilmiştir. Birinci bölümde, fıkıh usûlü ilmi açısından beyân teorisi tüm yönleriyle incelemeye alınmıştır. Beyân'ın lugatte ve ıstılâhta içerdiği anlamları başta olmak üzere fukâha ve mütekkelimûn metodolojilerine göre tasnifi örnekleriyle derinlemesine tetkik edilmiştir. İkinci bölümde beyân'ın hass ve âmm lafızlar özelinde tatbiki yapılarak nasslar arasında mevcut olan muazzam bütünlük dikkatlere sunulmuştur. Bu bölümde hass lafız üzerinden mutlak-mukayyed arasındaki haml ilişkisi ve âmm lafız üzerinden âmm-tahsîs ilişkisi örnekleriyle incelenmiştir. Çalışmamız ulaştığımız sonuçları ve önerilerimizi içeren bir sonuç bölümüyle tamamlanmıştır. Anahtar Kelimeler: Beyân, Şâr'i, Allah, Hz. Peygamber, Kavl, Fiil, Takrîr, Hass, Âmm, Şâfiî"
