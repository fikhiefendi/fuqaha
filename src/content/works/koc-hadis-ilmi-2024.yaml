abstract: "Bu çalışmada oluşum döneminden itibaren şâz tabirinin ıstılahlaşma süreci hem muhaddislerin hem de Hanefî fakîhlerin kullanımları çerçevesinde incelenmiştir. Araştırma, hadis usûlünde son derece önemli bir yere sahip olan şâz kavramının mahiyetini ve geçirdiği süreci temsil eden konulara odaklanmaktadır. İsnad ve cerh-ta'dîl kurallarının yazılı hale getirilmesinden sonraki süreçte telif edilen muhtelif türdeki (ilel, sualât, rical, cerh-ta'dîl ve hadis usûlü gibi) eserler şâz kavramının ıstılahlaşma sürecinin anlaşılmasına ve tespitine katkıda bulunmuştur. Giriş kısmında araştırmanın konusu, önemi, amacı, yöntemi, kaynakları ve özgün değeri hakkında bilgi verilmiştir. Birinci bölümde mütekaddim hadis âlimlerinin şâz kullanımları incelenmiş ve ilgili kavramın temellerini oluşturan unsurlar vurgulanmıştır. Kavramı ilk defa kullandığı tespit edilen Şu'be b. Haccâc'dan başlanarak Hâkim en-Nîsâbûrî'ye kadar mezkûr ıstılaha yüklenen anlamların değerlendirildiği bu çalışmada muhaddislerin görüşleri mukayese edilmiştir. Buna ek olarak şâzla doğrudan ilişkili olan diğer hadis ıstılahları analiz edilmiştir. Ayrıca muhaddislerin şâz anlayışlarını temsil eden muhtelif örnekler sunulmuştur. Böylece yapılan farklı tariflerin pratik tezahürü ortaya konulmaya çalışılmıştır. İkinci bölümde Hanefî âlimlerin şâz kavramına yükledikleri anlamlar incelenmiş ve bu anlamların fıkhî hükümlere etkisi analiz edilmiştir. Bu bağlamda Ebû Hanîfe'den başlayarak Serahsî'ye kadar fukahânın rivâyet tenkidinde kullandığı şâz ifadeleri incelenmiştir. Böylece çalışmaya konu olan kavramın, Hanefîlerin sünnet anlayışındaki yeri tespit edilmeye çalışılmıştır. İlk bölüme paralel bir şekilde fukahânın şâz kullanımları da farklı başlıklar altında tasnif edilerek örnekler verilmiştir. Ayrıca Hanefî usul eserlerinde yer alan şâz kavramı ile doğrudan ilişkili kavramlar ele alınmış ve söz konusu kavramlar arasındaki irtibat incelenmiştir. Son olarak muhaddisler ve fukahâ olmak üzere iki ekolün şâz anlayışı mukayese edilerek bu konudaki ayrışmaları ve ortak noktaları tespit edilmeye çalışılmıştır. Neticede şâz kavramı özelinde hadis ıstılahlarının teşekkülü ve bu süreç içerisindeki farklı kullanımlar analiz edilmiştir."
