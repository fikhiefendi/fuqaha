abstract: "İslam hukuku, tarih boyunca kölelik müessesesinin muhafazasını teşvik etmemiş; aksine, mevcut şartlar içinde kölelik müessesesini sınırlamayı ve tedricen ortadan kaldırmayı hedeflemiştir. Sanayileşme ve modernleşme döneminde kapitalist ekonomik sistemlerin ortaya çıkmasıyla birlikte, köleliğin farklı biçimleri tezahür etmiş; bu da her çağda uygulanma vasfına ve potansiyeline sahip olan İslam hukukunun mevzubahis konuyu zaman şartların da değerlendirmesini gerekli kılmıştır. Günümüzde modern köleliğin tezahürleri arasında işçi sömürüsü ve organ satımı gibi uygulamalar yer almakta, bu eylemler bireyin onurunu, bedensel bütünlüğünü ve yaşamını doğrudan etkileyebilmektedir. Organ ticareti veya emek sömürüsü gibi uygulamalarda insan, ekonomik çıkar veya zorunluluklar üzerinden araçsallaştırılmakta; bu durum, İslam'ın öngördüğü adil ve güvenli yaşam anlayışıyla çelişmektedir. Organ ticareti ve emek sömürüsü gibi uygulamalar, makâsıdü'ş-şerîa kapsamında can, mal, nesil, din ve aklın korunması ilkelerinin ihlali anlamına gelmektedir. Dolayısıyla İslam hukuku bağlamında, modern köleliğin farklı görünüşleri değerlendiren bu tez, İslam hukukunun birey ve toplum güvenliğini korumaya yönelik çözüm üretebildiğine işaret etmektedir."
