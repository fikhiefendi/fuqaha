abstract: "Hanefî Fıkıh Literatüründe Öldürme Suçunun Maddî ve Manevî Unsurlarıyla İlgili Kavramların Gelişimi (Hicrî 4-9. Asırlar) Bu tezde, öncelikle Hanefî mezhebinde öldürme suçunun maddî ve manevî unsurları modern hukuk ve modern İslam hukuku metinlerinden istifade edilerek tespit edilmeye çalışılmıştır. Araştırmamızda öldürme suçunun maddî ve manevî unsurlarıyla ilgili kavramların oluşum ve gelişim seyrini kronolojik olarak inceleyen bir metot takip edilmiştir. Ayrıca Hanefî doktrininin daha iyi anlaşılmasını sağlamak maksadıyla ihtiyaç duyuldukça diğer hukuk ekollerinin görüşleri ve modern hukuk metinlerine başvurarak zaman zaman maddî ve manevî unsurlar mukayeseli olarak ele alınmıştır. Tezin giriş kısmında, Hanefî mezhebinde öldürme suçunun genel karakteristik özellikleri analiz edilmiş, ayrıca bu kısımda modern hukuk ve modern İslam hukuku eserlerinde yer alan maddî ve manevî unsurlara yer verilmiştir. Tezin asıl gövdesini oluşturan birinci ve ikinci bölümde maddî ve manevî unsurlar, öldürme türleri bağlamında analiz edilmiştir. Tezin iki bölüm olarak tasarlanmasında, Hanefî doktrinine özgü olan ve olmayan öldürme türleri ayrımı belirleyici olmuştur. Bu nedenle, diğer hukuk ekollerinde de yer alan amden öldürme, şibh-i amd yoluyla öldürme ve hata ile öldürme türleri birinci bölümde tetkik edilirken, ikinci bölümde Hanefî doktrinine özgü hata yerine geçen öldürme ve tesebbüben öldürme türlerinde maddî ve manevî unsurların analizi yapılmıştır."
