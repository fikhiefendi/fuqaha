abstract: "Bir mezhebin teşekkülü, yayılması ve toplum hayatında kökleşmesinde, mezhep imamları kadar onları takip eden fakihlerin ilmî katkıları da önemli rol oynamaktadır. Şâfiî fakihlerinden İbnü'l-Mehâmilî de bu isimlerden biridir. Hicrî 368/978 yılında Bağdat'ta doğan İbnü'l-Mehâmilî, burada yetişmiş ve 415/1024 yılında yine Bağdat'ta vefât etmiştir. Kendisi, Irak bölgesinin seçkin Şâfiî fakihleri arasında kabul edilmektedir. Bu çalışmada, Şâfiî mezhebinde önemli bir yeri olan İbnü'l-Mehâmilî'yi ve onun fıkıhçılığını kendi eserleri üzerinden incelemeyi hedefledik. Araştırma neticesinde kendisine nispet edilen on iki fıkıh eserine ulaştık; ancak bunların büyük kısmının günümüze tam olarak ulaşmadığını tespit ettik. Müellifin eksiksiz şekilde günümüze ulaşan en meşhur eserleri el-Lübâb ve el-Mukniʿ olduğundan, çalışmamızda onun fıkıh anlayışını bu iki eser çerçevesinde ele aldık. İbnü'l-Mehâmilî'nin Şâfiî mezhebinde Ashâbü'l-Vücûh arasında yer aldığı rivayet edilmiş, ayrıca ilm-i hilâf alanında da anılmıştır. Çalışmada öncelikle müellifin yaşadığı dönem, hayatı, hocaları, öğrencileri ve eserlerini ele aldık. Ardından onun el Lübâb ve el-Mukniʿ adlı eserlerinde yer alan bazı fıkhî görüşlerini değerlendirip bu eserleri etraflıca tanıttık. Netice itibarıyla İbnü'l-Mehâmilî'nin anılan eserleri bağlamında Şâfiî fıkhındaki konumunu ve ilmî katkılarını, akademik bir bakışla ele alarak müellifi ve eserlerini daha kapsamlı bir şekilde tanıtmaya çalıştık."
