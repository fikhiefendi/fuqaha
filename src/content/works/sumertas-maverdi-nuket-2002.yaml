abstract: "ÖZET“Mâverdî ve en-Nüket ve'l-Uyûn Adlı Tefsîri”isimli bu çalışmada Mâverdî (364*450/974-1058)' nin hayatı, eserleri ve tefsîri çeşitli yönleriyle ele alınıp incelendi. Çalışmanın amacı; on birinci asırdaki, Kur'ân'ı anlama usûllerinin ortaya konmasına yardımcı olmaktır. Burada, özellikle Kur'ân-ı Kerîm, tefsîr, hadîs, kelâm, fıkıh, lügat ve biyografi kaynakları ile Mâverdî hakkında yazılmış eserlerden ulaşabildiklerimiz gözden geçirildi. Çalışmamız bir giriş ve üç bölümden oluşmaktadır. Giriş kısmında; Mâverdî'nin hayatı, eserleri ve yaşadığı dönem çeşitli yönleriyle incelendi. Birinci bölümde; en-Nüket ve'l-Uyûn'un farklı özellikleri tanıtılarak kaynakları yönünden incelendi. İkinci bölümde; en-Nüket ve'l-Uyûn rivayet tefsîri açısından; üçüncü bölümde de dirâyet/re'y tefsîri açısından incelendi. Sonuç kısmında ise çalışmadan elde edilen sonuçlar anlatıldı."
