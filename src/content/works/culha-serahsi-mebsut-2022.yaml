abstract: "El-Mebsût, Şemsü'l Eimme İmam es-Serahsî'nin, zorlu hapis şartları altında, kitap ve defterlerinden mahrum olmasına rağmen öğrencilerine yazdırdığı 30 ciltten oluşan muhteşem bir eserdir. Fıkhın bütün konuları genel hatlarıyla ele alınmış olup Hanefî mezhebinin görüşleri yanı sıra bazı konularda diğer mezhep alimlerinin görüşlerine de yer verilmiştir. İşte diğer mezhep imamlarından İmam Şâfiî'ye atfedilen görüşlerin tespit ve tahkiki, tezimizin konusunu oluşturmaktadır. İmam Şâfiî'ye nispet edilen görüşleri incelememizin sebepleri arasında hem görüşlerin doğruluğunu tespit etmek hem de bazı görüşlerin İmam Şâfiî'ye ait olmadığı tezi bulunmaktadır. Tezimiz, el-Mebsût'un ibadetler bölümünün temizlik ve namaz konusu özelinde hazırlanmıştır. Tezimiz iki bölümden oluşmaktadır. Birinci bölümde temizlik konusu ele alınmış olup bu bölümde İmam Şâfiî'ye nispet edilen 41 görüş tespit edilmiştir. Bu görüşlerin tahkiki sonucunda 37'sinin doğru nakledildiği ve 4'ünün de hatalı nakledildiği anlaşılmıştır. İkinci bölümde ise namaz konusu ele alınmıştır. Namaz bölümünde İmam Şâfiî'ye nispet edilen 84 görüş tespit edilmiştir. Bu görüşlerin tahkiki sonucunda 71'inin doğru nakledildiği ve 13'ünün de hatalı nakledildiği anlaşılmıştır. Tezimizde, el-Mebsût'tan naklettiğimiz Şâfiî görüşleri, Hanefî görüşleri ile birlikte mukayeseli olarak sunulmuştur. Sonuç olarak tespitini ve tahkikini yaptığımız İmam Şâfiî'ye nispet edilen 125 görüşün hepsi, Şâfiî kaynakları aracılığı ile konunun altında ayrı bir başlık ile açıklanmıştır."
