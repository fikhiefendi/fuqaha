abstract: "Ta'zîr cezaları İslam ceza hukuku pratiğinin büyük bir kısmını teşkil eder. Bu sebeple, ta'zîr cezalarının takdiri niteliği vurgulanarak farklı görüşler ileri sürülmüştür. Ta'zîr cezalarının belirlenmesindeki takdir hakkının sınırsız olmadığını ileri sürenlerle keyfiliğin varlığını ileri süren yazarlar arasındaki gerilimin çözüm noktası ise siyâset-i şer'iyye kavramıdır. Bu çalışma kapsamında ta'zîr cezalarının özelliklerinin klasik literatür ve onun etkisinde gelişen modern eserlerdeki tasnifle incelenmesinin yerine, siyâset-i şer'iyye eserlerindeki ta'zîr cezalarıyla ilgili konuların gündeme getirilmesi amaçlanmıştır. İlk bölüm klasik ve modern literatüre bağlı olarak ta'zîr cezalarıyla ilgili temel konuları ihtiva etmektedir. Sonraki bölümde ise siyâset-i şeriyye kavramı, bu kavramın ta'zîr cezalarıyla ilişkisi ve siyâset-i şeriyye kapsamında takdir hakkının nasıl yorumlanması gerektiği gibi konular incelenmiştir. Ta'zîr cezalarını uygulamaya yetkili makam, bu cezaların esas özelliği olan takdirilik ve bu takdir hakkının sınırı meselesi bu bölümün en can alıcı başlıklarındandır. Bir hukuk tarihi çalışması olarak son bölüm ta'zîr cezalarının pratiğine odaklanma amacı taşımaktadır. Bu sebeple, son bölümde, 17. yüzyıl Osmanlı pratiğinden uygulama örnekleri önceki bölümlerdeki başlıklandırmaya bağlı kalınarak incelenmiştir."
