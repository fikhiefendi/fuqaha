abstract: "Bu çalışmada kolektif ictihad teorisi, tarihsel gelişimi ve meşruiyeti bağlamında ele alınmaya çalışılmıştır. Çalışmanın giriş bölümünde tezin amacı, yöntemi ve kaynakları üzerinden genel bir çerçeve çizilmiştir. Tezin birinci bölümünde konuya girizgâh mahiyetinde ictihad kavramı, tanımı ve fıkıh usûlündeki yeriyle birlikte incelenmiştir. Daha sonra ictihadla ilgili birçok konuyu etkilemesi sebebiyle ictihad eyleminin aşamaları ortaya konulmuştur. İctihad eylemindeki adımları ifade bu aşamalara dair usûl kitaplarında zikredilen ve tartışılan şartlar ve vasıflar incelenmiştir. Bunun akabinde ictihadın müctehidlerin sayısı bakımından türleri ele alınmıştır. Burada bireysel ve kolektif ictihadın tanımlarına yer verilmiştir. Ayrıca kolektif ictihada verilen çeşitli isimler de zikredilmiş, bu isimlendirmelerin sebeplerine değinilmiştir. İkinci bölümde kolektif ictihad teorisinin tarihî seyri ele alınmaya çalışılmıştır. Bu bağlamda teoriyi ortaya çıkaran oluşum süreci incelenmiş, hangi amillerin bu teorinin oluşumunu tetiklediği ortaya konmaya çalışılmıştır. Teorinin ortaya çıktığı kavramsallaşma süreci, bu teorinin ve fikrin ilk ortaya atıldığı makalenin tarihiyle başlatılmış, kolektif ictihad hedefiyle kurulan ilk müessesenin kuruluş tarihiyle bitirilmiştir. Ardından uygulamaya geçiş dönemi mercek altına alınmıştır. İslâm dünyasındaki kolektif ictihad müesseseleri ortaya konmuştur. Üçüncü bölümde kolektif ictihad teorisi etrafında sürdürülen meşruiyet tartışmaları ve arayışları incelenmiştir. Bu arayış ve tartışmalar naklî delillere dayanan ve aklî çıkarımlara dayanan istidlaller olmak üzere iki başlık altında ele alınmıştır. Naklî delillerin içerisinde konuyla ilgili âyet-i kerîmeler, Peygamber Efendimiz'den (s.a.v) nakledilen bir takım sözlü ve fiilî sünnetler ve son olarak râşid halifelerin uygulamaları ele alınmaya çalışılmıştır. Ardından aklî delil ve problemler mercek altına alınmış, toplam sekiz mesele deliller ve problemler olmak üzere iki ana başlık altında incelenmiştir. Deliller başlığı altında delil olarak öne sürülen hususlar, problemler başlığı altında ise eleştiri olarak zikredilen noktalar ele alınmıştır."
