abstract: "İnsan hakları, geçmişte olduğu gibi günümüzde de gündemde kalmayı başaran ender konulardandır. Bunun temel sebebi insan ile ilgili olmasıdır. Dolayısıyla insanın ve insana dair hususların varlığını sürdürdüğü sürece insan hakları hep olacaktır ve konuşulmaya devam edecektir. İslam dininin insanı merkeze alan bakış açısı, insanı onore etmekte ve yücelmektedir. Çünkü insan diğer canlı ve cansız varlıklarla mukayese edildiğinde varlıkların en şereflisi ve değerlisi olarak göze çarpmaktadır. Haksız şekilde hayatına son verilen bir kişinin ölümünü tüm âlemin yok edilmesiyle eş tutan İslam, insan ve insan hakları için olumlu bir bakış açısına sahiptir. Bu bakış açısı, sadece teoride kalmamış pratikte de kendini göstermiştir. Veda Haccı, Hz. Muhammed (s.a.v)'in hayatı boyunca yaptığı tek hacdır. Çünkü hayatı boyunca iki defa umre yapmış, bir defa da hac görevini yerine getirmiştir. Hac görevini yerine getiren Hz. Muhammed (s.a.v), orada bulunan ve hac farizasını yerine getiren yüzbinlerce Müslümana seslenmiştir. Hz. Muhammed (s.a.v) bu hac ibadetinden çok kısa bir süre sonra vefat etmiştir. Dolayısıyla yaptığı bu hacca“Veda Haccı”burada verdiği hutbelere de“Veda Hutbesi”denilmiştir. Her ne kadar orada bulunan Müslümanlara hitap edilmişse de hutbenin muhtelif yerlerinden geçen“Ey İnsanlar! ”hitabıyla tüm insanlık muhatap kabul edilmiştir. Dolayısıyla Veda Hutbesi sadece Müslümanlar için değil tüm insanlık için verdiği mesajlar hasebiyle evrensel bir mahiyettedir. Hutbe dikkatlice incelendiğinde yaşama hakkı, eşitlik hakkı, malın korunması ve mülkiyet hakkı, özel hayatın gizliliği, suçun bireyselliği hakkı, onur ve şerefin korunması hakkı, kadın hakkı gibi temel insan haklarının ele alındığı görülecektir. Yaklaşık bin dört yüz yıl önce insan hakları konusundaki bu dünyaya sesleniş, önemli ve değerlidir. Veda Hutbesi için“ilk insan hakları bildirisi”yakıştırması yerinde bir ifade olacaktır. Çünkü Veda Hutbesi'nden 583 yıl sonra Batı dünyasında insan hakları ile ilgili ilk gelişme 1215 tarihli Magna Carta'dır ki bu belge insan hakları konusunda Veda Hutbesi'nin çok gerisindedir."
