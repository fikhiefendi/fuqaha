abstract: "E-ticaret kavramı ile ilgili için detaylı bir çalışma sunmak. Bu tür ticaret uygulamalarında; uyulması gereken şer'i yükümlülüklere bağlı kalınarak، çağdaş İslami finans kaynaklarıyla kalkınmak amacıyla uygulamaların zamanımızda ne kadar etkili olduğunu araştırmak. İslami ekonomi finansında e-ticaret kullanımında etkili olan başlıca faktörlere ışık tutmak.İslami ekonomi finansında e-ticaret uygulamalarının özelliklerini açıklamak. Ayrıca İslami ekonomi alanında e-ticaret uygulamaları için gerekli olan araçları tespit ederken fıkhi hükümler ve İslam hukuku kurallarına bağlı kalınarak disiplinli İslami finans kaynakları sağlamak. E-ticaret uygulamaları kullanımından dolayı İslam ekonomisinin karşılaştığı en önemli sorun ve engelleri tespit ederken، e-ticaret uygulamalarının en önemli kullanım alanlara işaret edip istifade edilecek başlıca konuların altını çizmek. Bu çalışmamda; e-ticaret ile ilgili yapılan bir çok değişik çalışmaları ve konu ile ilgili telif edilen kitapları kapsamlı bir şekilde tarama yöntemini uyguladım. e-ticaret gerçeğini açığa çıkarmak، mekanizmasını irdelemek، geleneksel ticaretle karşılaştırmasını yapmak، İslami açıdan ticaret anlayışı konusunda analitik yaklaşım sergileyerek tezimi bir takım tavsiyelerle bitirdim"
