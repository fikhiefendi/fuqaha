abstract: "Şâkirü?l-Hanbelî, Osmanlı?nın son dönemlerinde yetişen önemli âlimlerden biridir. Şâkirü?l-Hanbelî?nin usûl alanında yazdığı ?Usûlü?l-Fıkhi?l-İslâmî? adlı eser, usûl kaidelerinin daha anlaşılır olması açısından önemli bir yere sahiptir. Bu araştırmada Şâkirü?l-Hanbelî?nin hayatı ve usûl eserindeki fıkıh anlayışı ortaya konuldu. Bu çalışma, bir giriş ve üç bölümden oluşmaktadır. Giriş bölümünde araştırmamızın sınırlarına, amacına ve yöntemine değinilmiştir. Birinci bölümde, fıkıh usûlü özetlenmiştir. İkinci bölümde, Şâkirü?l-Hanbelî?nin hayatı, eserleri, yaşadığı dönem, hocaları, öğrencileri ve ilmî kişiliği ele alınmıştır. Üçüncü bölümde, Şâkirü?l-Hanbelî?nin Usûlü?l-Fıkhi?l-İslâmî adlı eserindeki metodu incelenmiştir. Sonuç bölümünde ise kısa bir değerlendirme yapılmıştır."
