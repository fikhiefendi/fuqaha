abstract: "Türk Borçlar Kanunu'nda düzenlenen sorumluluk hukuku dar, geniş ve en dar anlamda farklı şekillerde tanımlanmaktadır. Sorumluluk hukukunun ilkelerini kusur, sözleşme ve kanun hükmü oluşturmaktadır. Sorumluluk hukukunda iki ayrı sınıflandırma yapılmaktadır. Bu sınıflandırmalardan ilki kaynak yönünden olup sözleşme içi ve sözleşme dışı olarak ayrılmaktadır. Diğer sınıflandırma ise, kusur yönünden olup kusura dayanan haksız fiil sorumluluğu ve kusura dayanmayan sebep sorumluluğu olmak üzere iki türe ayrılmaktadır. Kusura dayanan haksız fiil sorumluluğu konusunu haksız fiil oluştururken; kusura dayanmayan sebep sorumluluğu ise hakkaniyet sorumluluğu, tehlike sorumluluğu ve olağan sebep sorumluluğu çerçevesinde incelenmektedir. Bina ve yapı sahibinin sorumluluğu, Türk Borçlar Kanunu'nda kusursuz sorumluluk olarak düzenlenmektedir. Bina ve yapı sahibi, Türk Borçlar Kanunu'nun 69. maddesindeki düzenleme ile bina ile yapı eserinin yapım bozukluğu ve bakımındaki eksikler sonucu ortaya çıkan zararlardan sorumlu tutulmaktadır. İntifa ve oturma hakkı sahiplerinin sorumluluğu ise binanın ve yapı eserinin bakım eksiklikleri ile sınırlı tutulmaktadır. Bina ve yapı malikinin kusursuz sorumluluğunun yanında yapılan yapıların denetimleri de önem arz etmektedir. Yapı denetimi insanların yaşamlarını güvenli ve sağlıklı bir şekilde devam ettirilmesi için yapıların fen, sanat ve sağlık kuralları çerçevesinde yapılmasını temin eden kontrol mekanizmasıdır. Yapı denetiminin asıl amacı insanların temel ihtiyaçlarından birini karşılamak için nitelikli ve sağlıklı konutlar üretmektir. Sağlıklı ve nitelikli konutların üretimi proje ve uygulama aşamasında yasal mevzuatın ve gerekli koşulların tam olarak gerçekleştirilmesi ile mümkün olacaktır. Türkiye'deki yapılar, 4708 Sayılı Yapı Denetim Hakkında Kanun ve Yapı Denetim Uygulama Yönetmeliği çerçevesinde denetlenmektedir. Yapı Denetim Hakkında Kanun, özel bir kanun olup uygulamada ortaya çıkan sorunlardan da anlaşılacağı üzere, bu kanunla düzenlenmeyen birçok husus bulunmaktadır. Düzenlenmeyen hususlar hakkında Türk Borçlar Kanunu'ndaki düzenlemelerden faydalanılmaktadır. Hukuki sorumluluğun tespiti halinde tazminata hükmedilebilmekte ayrıca malik, sorumlulara karşı rücu hakkını kullanabilmektedir. Mevzuattaki eksikler, kanun ve yönetmeliklerde yapılacak düzenlemelerle giderilememiştir."
