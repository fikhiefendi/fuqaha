abstract: "Günümüzde birçok ülke İslami finans sektörüne merkez olabilmek için birbirleriyle yarışır duruma gelmiştir. Katılım bankacılığında diğer ülkeler ile yarış içerisinde olan Türkiye, bu konuda olumlu bir girişimde bulunarak 2015 yılında Ziraat Katılım Bankası ile devlet bünyesindeki ilk katılım bankasını faaliyete geçirmiştir. Bu girişimin Türkiye' nin 2023 yılı için dünyanın ilk on ekonomisi arasında olma hedefine katkı sağlayacağı düşünülmektedir. Bu çalışmada kamu katılım bankacılığının bankacılık sektörüne beklenen etkilerini ölçmek için Erzurum, Kars, Ağrı ve Erzincan illerinde çalışan personele anket uygulaması yapılmıştır.Elde edilen verilere Kruskal Wallis, Mann-Whitney U testi ile farklılık analizleri uygulanmıştır."
