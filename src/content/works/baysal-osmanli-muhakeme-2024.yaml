abstract: "İşkence, tarih boyunca var olmuş ve çeşitli amaçlarla kullanılmış bir uygulamadır. Yaralama sınırını aşan yerlerde bağımsız bir suç olarak, muhakemede bir sorgu vasıtası olarak, infaz safhasında bir araç olarak farklı şekillerde kullanılagelmiştir. Hukuk sistemleri kimi zaman bu uygulamayı yok sayarak örtülü bir şekilde uygulanmasına müsaade etmiş, kimi zaman hukuken tanıyarak meşru bir araç olarak kullanmış, kimi zaman ise bu uygulamayı bir yasak olarak kabul etmiştir. Batı'da özellikle aydınlanma sonrası dönemde bu uygulamanın yasaklanması yönünde ciddi adımlar atılmıştır. Günümüzde mutlak yasak kabul edilen bu uygulama sanığın sahip olduğu hakların başında gelmektedir. Çalışmamızda Osmanlı hukukunda muhakeme alanında, şüpheli/sanığın sorgulanması esnasında işkencenin yasaklılığı hususunu ele alacağız. Bu kapsamda ilk bölümde işkencenin tarihi, Batı'da ve İslam hukukunda bu husustaki gelişim, Osmanlı'da bu konuda kullanılan kavramlar, bu hususla ilgili temel kavramlar aktarılacaktır. İkinci bölümde klasik dönem, mevzuat, doktrin ve uygulama yönüyle ele alınacaktır. Son bölümde ise Tanzimat ve Tanzimat Dönemi'nin bu husustaki getirdikleri ferman ve kanunnameler aracılığıyla kronolojik olarak incelenecektir."
