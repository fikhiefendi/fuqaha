abstract: "Bu çalışmada, Aristoteles (M.Ö. 384-322)'in sistemli bir disiplin haline getirdiği ve bütün bilimlerde bir bilgi elde etme yöntemi olarak kullanılan mantıki kıyas ile İslam bilim adamları tarafında sistemli bir disiplin haline getirilen fıkhi kıyasın karşılaştırılması ve her iki kıyasın uygulanmasında elde edilen bilginin epistemik değerinin ortaya konulması hedeflenmektedir. Bu hedef çerçevesinde konuyu daha anlaşılır kılabilmek amacıyla her iki yöntemin yapısı, işlevi, koşulları, sonuçları ve epistemik değerleri ayrı ayrı incelendikten sonra karşılaştırılıp değerlendirilerek bilgi değerleri ortaya konulmaya çalışılmıştır. Mantıki kıyas ile fıkhi kıyas arasında yapılan karşılaştırmada her iki kıyasın birer akıl yürütme yöntemi, bilinmeyen olgu ve nesne hakkında yeni bir bilgi veya hükme ulaşma amacı, orta terim ile illetin üstlendiği görevler bakımında benzerlik arz ederken diğer yandan ilkeleri, formları, orta terim ile illetin öncüllerde aldığı konumları, kullanılma şekilleri, nitelikleri ve iki kıyasın ifade ettikleri epistemik değerler bakımından ise farklılık göstermektedir. Sonuç bölümünde ise karşılaştırma sonucunda ortaya çıkan bulguların yorumlanması ve bunların alana katkı sağlayan kazanımları değerlendirilmektedir."
