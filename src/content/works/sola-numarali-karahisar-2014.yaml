abstract: "Kadıların tuttuğu zabıtlar olan Şer'iyye Sicileri'ne, merkezden gelen resmi belgeler ve mahkemeye intikal eden meseleler kaydedilmiştir. Bu bakımdan Şer'iyye Sicilleri Osmanlı tarihinin önemli arşiv kaynakları arasındadırlar. 537 numaralı Karahisar-ı Sâhib Şer'iyye Sicili 1140-1142 (M.1727-1729) yılları arasında tutulan bir sicildir. Bu sicilin ihtiva ettiği belgeler dönemin ve bölgenin genel, iktisadi, askerî ve hukukî tarihi ile sosyo-kültürel yapısı ve idari teşkilatı hakkında bilgiler ihtiva etmektedir."
