abstract: "Bu tezin amacı, üst hakkını sona erdiren sebeplerin ve sona ermenin sonuçlarının ayrıntılı olarak belirlenmesidir. Bu sebeple çalışmamızda, başta Türk Medeni Kanunu olmak üzere Türk Borçlar Kanunu, İcra İflas Kanunu, Tapu Kanunu ve diğer ilgili yasal düzenlemeler incelenerek üst hakkının sona erme nedenleri ile bunun sonuçları tespit edilmiştir. Bu kapsamda, birinci bölümünde, genel olarak üst hakkına ilişkin bilgiler verilerek hukuki nitelendirmeler yapılmıştır. İkinci bölümde, üst hakkının sona erme nedenleri ele alınarak üst hakkının sona ermesine ilişkin Türk Medeni Kanunu'nda yer alan özel hükümler incelenmiş ve ayrıca eşyaya bağlı irtifak haklarının sona ermesini düzenleyen hükümler uygun düştüğü ölçüde uygulanmıştır. Bununla birlikte, üst hakkını sona erdiren hukuki işlemlerin icrası, münhasıran kişiye bağlı üst hakkında hak sahibinin ölümü, taşınmazların bölünmesi ve birleştirilmesi, üst hakkının cebri icra yoluyla sona ermesi ve ayrıca Tapu Kanunu'nun 35 ve 36. maddelerinin uygulanması sonucunda üst hakkının nasıl ve hangi şartlarda sona erdiği incelenmiştir. Üçüncü bölümde ise üst hakkının sona ermesinin sonuçları açıklanmıştır. Bu bölümde, öncelikle yapı mülkiyetinin yüklü arazi malikine geçmesi ve arazinin ilk hale getirilmesi konuları ele alınmıştır. Ardından yüklü taşınmaz malikine kalan yapılara ilişkin bedel ödenmesi sorunu ile üst hakkından faydalanan üçüncü kişilerin üst hakkının sona ermesinden sonraki durumu açıklanmıştır."
