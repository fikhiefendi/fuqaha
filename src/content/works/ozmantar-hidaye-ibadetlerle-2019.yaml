abstract: "Burhânüddîn el-Mergīnânî (v. 593/1197) Hanefi mezhebinin önemli fıkıh âlimlerinden birisidir. Bu âlimin el-Hidaye fi şerhi Bidâyeti'l-mübtedi isimli eserinde İmam Ebû Hanîfe'nin ve meşhur öğrencilerinin görüşleriyle birlikte yeri geldikçe bazı müctehidlerin görüşlerine de yer vermiştir. İmam Mâlik b. Enes (v. 179/795) de o müctehidlerdendir. Taharet, namaz, zekât, oruç, hac ve kurban gibi fıkhın önemli bir kısmını oluşturan ibadet konularıyla ilgili olarak el-Hidâye'de İmam Mâlik'e toplam kırk sekiz (48) görüş nispet edilmiştir. Bunlardan otuz beş (35) görüş Mâlikîlere ait fıkıh kaynaklarında bulunan bilgilerden farklı değildir. Diğer onüç (13) görüşle ilgili bilgilerin nispetinde ise bazı bilgi yanlışlıkları bulunmaktadır. Bu yanlışlıklar, müstensih hatalarından veya adı geçen müctehide ait olup -mezhebin racih görüşüyle uyuşmayan- görüşlerden birisinin naklinden ya da başka birtakım sebeplerden kaynaklanmış olabilir. Adı geçen esere ait bazı şerhlerde de sözü geçen hatalı bilgilerin olduğu gibi aktarıldığı tespit edilmiştir. Bu bakımdan bunların tesbit ve tahkiki ile ilgili çalışmalar yapmak önem arz etmektedir ve bazı çalışmalar da yapılmıştır. Bu tez de bu amaçla yapılan bir araştırmadır."
