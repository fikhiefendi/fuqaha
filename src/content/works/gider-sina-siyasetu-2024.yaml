abstract: "İlmü tedbîri'l-menzil, hane yönetimi, işleyişi ve düzeni ile ilgili iktisadi öncülleri inceleyen bir disiplindir. Oikonomia ise Yunanca oikos (hane) ve nemein (kural) kelimelerinden türetilmiş olup, hane yönetimi anlamına gelir. Alan kurucular nezdinde ilmü tedbîri'l-menzilin kökenleri Antik Yunan oikonomiasına dayanmaktadır. Bu doğrultuda İbn Sînâ, İbn Miskeveyh, Tûsî, Devvânî, Kâtip Çelebi, Kınalızâde, Taşköprîzâde gibi isimler ilmü tedbîri'l-menzil konulu eserler kaleme almışlardır. Oikonomia kavramını inceleyen bize ulaştığı bilinen en eski eser ise Xenophon'un Oeconomicus'udur. Oikonomianın Antik Yunan'dan, İslam düşünce geleneğine aktarılması tercüme faaliyetleri sonucunda gerçekleşmiştir. Oikonomianın, Bryson'a nisbet edilen Yunanca aslı günümüze ulaşmamış Kitâbü Brûson fî tedbîri'r-racul li-menzilih isimli Arapça tercüme üzerinden İslam düşünce geleneğine aktarıldığı ileri sürülmektedir. Bu kavramın İbn Sînâ'nın es-Siyâsetü'l-menziliyye'si vasıtasıyla İslam ilim geleneğine girmiş olması kuvvetle muhtemeldir. es-Siyâsetü'l-menziliyye altı bölümden oluşmaktadır. Bu bölümler sırasıyla; bütün insanlar için yönetim ve siyasetin gereği, kişinin kendisiyle alakalı siyaseti, gelir ve gider siyaseti, eşiyle ilgili siyaseti, çocuklarına yönelik siyaseti ve hizmetçilerine ilişkin siyasetidir. es-Siyâsetü'l-menziliyye'nin iktisadi analizi İbn Sînâ'nın ekonomi bilimine nasıl yaklaştığını göstermektedir. O, söz konusu risale ile iktisadi birçok meseleye değinmiştir. Bu konular arasında kazanç yollarının tanımlanması, insan kaynağının doğru kullanılması, belirli işlerde istihdam edilecek bireylerin yeteneklerine göre sınıflandırılması, gelir ve gider arasında dengenin kurulması, harcamaların denetlenmesi, tasarrufun gerekliliği, emeğin helal kazançla olan ilişkisi ve ticarette artan gelir ile risk arasındaki ilişki bulunmaktadır."
