abstract: "ÖZETncelemesini yaptığımız 18. yy. fetvalarına göre Osmanlı'da günlükhayat (Behcetü'l- Fetava) örneği konusu, Lale Devri olarak bilinen 1718-1730 yılları arasında Osmanlı'da şeyhülislam olarak görev yapmış olanYenişehirli Abdullah Efendi'nin, Behcetü'l- Fetava adlı eserinde yer alanfetvaları esas alınarak dönemin sosyal hayatının ortaya konulmasını ifadeetmektedir.Yenişehirli Abdullah Efendi'nin, zamanında vuku bulan hadiselerin,dini ve günlük hayatın izlerini taşıyan, soru-cevap şeklinde özel ifadeleriçindeki fetvaları önem arz etmektedir. Bu fetvalar, Osmanlı toplumunun LaleDevri'ndeki günlük hayat kesitini, inançlarını, gelenek ve göreneklerini, kültürve bilim seviyesini, savaşlarını vb. tarih kitaplarından daha muşahhasörneklerle ortaya koymaktadır. Şeyhülislam Abdullah Efendi'nin kitapbasımına ve çoğaltılmasına cevaz veren fetvası, ilim adamına ve dinadamına karşı saygılı olma konusundaki fetvası, din adamlarının kendiarzusuna göre fetva vermemeleri konusundaki fetvası, lale alım satımıhakkındaki fetvası, ran Rafizileri hakkındaki fetvaları ve gayrimüslimlerhakkındaki birçok fetvası hem devrin zihniyetini ortaya koyması açısındanhem de türk toplumunun bugününe ve istikbaline çareler üretmek isteyenleriçin önemlidir."
