abstract: "Tarih geçmişi incelerken güvenilir kaynaklara ihtiyaç duyar. Ne var ki her kaynak tarih bilimine aynı derecede güvenilir ve ayrıntılı bilgi sunamaz. Tarihle ilgili bir eserin güvenilir kaynaklara dayanması, ortaya konulacak eserin de o derece güvenilir olmasını sağlayacaktır. Güvenilirliğine ve kapsadıkları bilginin değerine göre Şer'iyye sicilleri tarihî kaynaklar içerisinde ilk sıralarda yer almaktadır. Ayrıca farklı konularda ayrıntılı bilgiler ihtiva etmeleri nedeniyle Şer'iyye sicilleri özellikle son yıllarda tarihçiler tarafından büyük bir ilgiyle karşılanmaktadır. Bu güvenilir kaynağın tarihçiler ve meraklıları tarafından irdelenmesi Osmanlı tarihinin geniş bir dönemi hakkında bazı ayrıntıların ortaya çıkarılmasını sağlayacaktır.Bu öneme binaen şer'iyye sicillerinden Kayseri'ye ait 133/2 numaralı ve (H. 1155/M. 1742) tarihli Şer'iyye Sicilinin transkripsiyon ve değerlendirmesi tezimizin konusunu oluşturmaktadır. Şer'iyye sicillerinin Osmanlı tarihi araştırmalarındaki vazgeçilemez yeri konumuzun önemini bir kat daha artırmaktadır. Bu tezin amacı Kayseri şehrinin siyasi, sosyal, kültürel ve iktisadi yapısının sicilde yer alan belgeler ışığında ortaya çıkarılmasına katkıda bulunmaktır. Bu amaçla öncelikle Osmanlı hukuk sistemi genel olarak incelenerek Şer'iyye sicillerinin Osmanlı hukuk sistemindeki yeri üzerinde durulmuştur. Daha sonra belgeler günümüz harflerine çevrilmiş ve özetlenmiştir. Değerlendirme bölümünde belgelerdeki bilgiler ışığında istatistikler çıkarılmış ve bazı genellemelere ulaşılmaya çalışılmıştır. Sonuç bölümünde ise 133/2 Numaralı sicil defterinden elde edilen bilgiler doğrultusunda değerlendirmeler yapılmıştır. Çalışma sonucunda Kayseri şehrinin XVIII. yy. mahalli profiline dair önemli bilgiler elde edilmiştir. Kayseri'ye ait incelenmemiş diğer defterlerin de incelenerek tarih bilimine kazandırılması, bütünlüğün sağlanması açısından bu konudaki çalışmaların her birini daha anlamlı hale getirecektir."
