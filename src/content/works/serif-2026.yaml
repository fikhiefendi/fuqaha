abstract: "• Giriş, üç bölüm ve sonuç: •Birinci Bölüm: Teorik girişler ve tanımlar: Bu bölümde harf kavramına, harf manaları kavramına, İmam Şafii'ye, onun mecmualarına, gelenekçilere ve modern dilbilimcilere bakacağız. bunların hepsi). •İkinci bölüm: Şu başlığı taşıyacaktır: Gelenekçilerin ve dilbilimcilerin Arap harflerinin anlamlarını modernistler tarafından incelenmesinde gramer çabaları ve iki noktayı içermektedir: birincisi: gelenekçilerin çabaları ve ikinci nokta: modernistlerin çabaları. •Üçüncü Bölüm: Uygulamalı Çalışma: İmam Şafii'nin Divanındaki Harflerin Anlamlarının Tezahürleri (Tek Anlamlar, Karmaşık Anlamlar ve Karmaşık Anlamlar) Çözüm • Kaynaklar ve referanslar •Gelenekselcilerin ve modern bilim adamlarının çabaları araştırılarak tek veya basit harflerin anlamları, karmaşık anlamlar ve karmaşık anlamlar ortaya çıkarılacaktır. • Tekil anlamlar her harfle ayrı ayrı ilişkilidir, örneğin edatların anlamları gibi: Birleştirmek, öteye gitmek anlamına gelir... çünkü her harfle ayrı ayrı ilişkilidir. Bileşik anlamlar, olumsuz harfler, bağlaçlar ve soru harfleri gibi bir grup harfle ilişkilendirilen anlamlardır. Karmaşık anlamlar, yani transformatörler, bağlantılar, dengeleyiciler ve tamamlayıcılar • Eskiler tek anlamlara ve bileşik anlamlara dikkat ediyorlardı Modern dilbilimciler ise karmaşık anlamlarla ve karmaşık anlamlarla ilgileniyorlardı. Gelenekçilerin yaklaşımı ile modernistlerin yaklaşımını birleştirip harflerin anlamlarını tek, bileşik ve karmaşık olmak üzere üç düzeyde ele alacağız."
