abstract: "Cam Tavan Sendromu, kadınların üst kademe yönetim pozisyonlarına ulaşmasını engelleyici davranışsal ve kurumsal önyargılardan kaynaklanan, görünmez, yapay engellerden biridir. Günümüzde çalışma hayatında aktif olarak bulunan kadın çalışanların sayısında gün geçtikçe daha da artış olmasına rağmen“üst düzey kadrolarda”yeterli sayıda görev alamadıkları gözlemlenmektedir. Bunun meydana gelmesinde birden fazla sebep olmakla birlikte günümüzde kadınların aşamadıkları bir“cam tavan”engeli ile karşı karşıya kaldıkları belirtilmektedir. Kadınlara karşı standartlaşmış tutumların ve bunların çalışma ortamına aktarılması, cinsiyete göre negatif ayrımcılık, iş yerlerindeki personellerin çoğunluğunun erkeklerin oluşturduğu sosyal ortamlara dahil olamama, erkek egemen düşünce şeklinin örgüt kültürüne olan etkileri ve bir mentöre sahip olunmadığından yeterli desteği alamama gibi nedenler, kadın personellerin önüne çıkan engeller olmakla beraber“cam tavan”sendromunu oluşturmaktadır. Katılım Bankacılığı, kâr esasına dayalı olarak faaliyet gösteren bir bankacılık sistemidir. Dünya'da ismi“İslam Bankaları”veya“Faizsiz Bankalar”olarak geçen finans kuruluşlarının Türkiye'de ki ismi“Katılım Bankacılığı”dır. Yapmış olduğumuz çalışmada, finans sektörünün önemli bir kısmını oluşturan Katılım Bankacılığı sektörüyle sınırlı tutulup, katılım bankasında çalışan kadın personellerin cam tavan algılarının belirlenmesi yönünde bir çalışma yapılmıştır. Cam tavan algısının var olması durumunda ise;“cinsiyet, yaş, medeni durum, eğitim düzeyi, çocuk durumu, meslek deneyimi”gibi değişkenlere bağlı olarak farklılık gösterip göstermediği belirlenmeye çalışılmıştır. Çalışma üç bölümden oluşmaktadır. Birinci bölümde kadınların tarihsel olarak iş hayatına katılımları, Dünya'da ve Türkiye'de kadın istihdamı konuları ele alınmıştır. İkinci bölümde kadın, yöneticilik ve cam tavan kavramları ele alınmıştır. Yine bu bölümde kariyer evreleri, kariyer engelleri kavramlarından bahsedilmiştir ve işsizlik oranları ele alınmıştır. Çalışmanın üçüncü bölümünde ise; veriler anket yöntemi ile toplanmış olup bu veriler“SPSS 23.0 programında”analiz edilmiştir. Alan araştırmasında, katılım bankasında çalışan kadın personellerin cam tavan sendromu düzeylerinde demografik değişkenlere göre farklılaşmalar belirlenmiştir. Sonuç olarak; bulgularla birlikte sonuçlar yorumlanmış ve konu hakkında öneriler sunulmuştur."
