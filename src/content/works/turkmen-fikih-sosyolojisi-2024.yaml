abstract: "Sözsüz iletişimde önemli bir yere sahip olan musâfaha karşılıklı tokalaşma olarak bilinirken, muânaka ise kişiler arasında kucaklaşma ve boynuna sarılma olarak ifade edilmektedir. Fıkıh sosyolojisi açısından musâfaha ve muânakanın incelendiği bu çalışma, çeşitli başlıklar halinde ele alınmıştır. Öncelikli olarak musâfaha ve muânaka kavramlarıyla ilintili olan kavramlar açıklanarak hangi durum ve zamanlarda yapıldığı ifade edilmiştir. Özellikle ilişkili olduğu selâmlaşma, sıla-i rahim ve seferîlik gibi kavramlar üzerinde durularak konunun genel çerçevesi çizilmiştir. Diğer bir başlıkta fıkhî açıdan musâfaha ve muânaka kavramı mahremiyet sınırları içerisinde ifade edilmiştir. Son olarak musâfaha ve muânakanın toplumsal hayata yansımaları, kişiye sağladığı faydaları ve zararları değerlendirmeye çalışıldı. Toplumsal hayatta kendine önemli bir yer edinen tokalaşma ve kucaklaşma halinin kültürümüzdeki yerine değinerek örneklemeler yapılmıştır. Çalışmamızda musâfaha ve muânaka kavramı geniş bir perspektiften incelenerek ve bölümlere ayrılarak anlaşılabilirliğin artırılması hedeflenmiştir."
