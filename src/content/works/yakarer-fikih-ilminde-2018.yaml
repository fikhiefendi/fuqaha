abstract: "Evlilik akdi taraflara bazı haklar verirken bazı sorumluluklar da yükler. Bu hak ve sorumlulukların bir kısmı eşlerin mal varlıklarıyla ilgilidir. Eşlerin evlilik öncesi sahip oldukları mal varlıkları, evlilik akdinin eşlere yüklemiş olduğu mali mükellefiyetler ile akit sonrası aile birliği esnasındaki mal varlığıyla ilgili haklar ve sorumluluklar konusunda hukuk sistemleri arasında bazı farklılıklar mevcuttur. Günümüzde Türkiye Cumhuriyeti sınırları içinde yaşayan Müslümanlar, bir taraftan dinlerinin gereği olan Fıkıh İlmindeki hükümlere uyarak hayatlarını sürdürmek isterken, diğer taraftan İsviçre Medeni Kanunu'ndan tercüme edilerek yürürlüğe girmiş, üzerinde bazı değişiklikler yapılarak uygulanmakta olan Türk Medeni Kanunu'nun düzenlemeleriyle de resmen sorumlu durumdadırlar. Eşlerin mal varlıklarıyla ilgili hak ve sorumlulukları açısından bu iki hukuk sistemini karşılaştırmalı şekilde ele almak bu tezin konusu olmuştur. Son dönemlerde Fıkıh yerine İslam Hukuku, Fakih yerine Hukukçu kavramı kullanılsa da bunların ayrı kullanılması gerektiğini düşünüp çalışmamızda Fıkıh, Fıkıh İlmi ve Fakih kavramları kullanılmıştır."
