abstract: "Bu çalışma Müslümanların azınlık olarak yaşadıkları Batı toplumlarında İslâm aile hukukunun uygulanma imkânlarını, özellikle İngiltere örneği üzerinden alternatif uyuşmazlık çözüm yolları bağlamında incelemektedir. Çalışmanın ilk bölümünde, İslâm hukukunun gayrimüslim ülkelerde tatbiki meselesi klasik fıkıh literatürü ve tarihsel tec-rübeler ışığında ele alınmakta; sulh, tahkim ve arabulucu-hakemlik kavramlarının aile hukukundaki yeri açıklanmaktadır. İkinci bölümde ise İngiltere'deki Müslüman toplu-lukların dinî ve hukukî ihtiyaçlarını karşılamak amacıyla ortaya çıkan şeriat konseyleri tarihsel, kurumsal ve işlevsel yönleriyle analiz edilmiştir. Bu kapsamda konseylerin ku-ruluş nedenleri, yapısal özellikleri, işleyişi, kamuoyu ve devlet nezdindeki tartışmalar, ayrıca konseylerin hukukî tanınırlığına ilişkin meseleler ayrıntılı biçimde değerlendiril-miştir. Üçüncü bölümde şeriat konseylerinde evlilik birliğinin kurulması ve sona ermesi süreçleri incelenmiştir. Dinî nikâh akdi, resmî tescil uygulamaları, boşanma türleri ve mehir, nafaka, hidâne gibi aile hukukuna dair meseleler İngiliz hukukundaki düzenleme-ler ve fıkhî prensipler çerçevesinde karşılaştırmalı olarak ele alınmıştır. Ayrıca konsey-lerin karar alma süreçlerinde başvurdukları fıkhî yöntemler, ictihad biçimleri, telfîk uy-gulamaları ve örfün rolü tartışılmıştır. Sonuç olarak İngiltere'deki şeriat konseylerinin Müslüman azınlıkların dinî kimliklerini muhafaza etme, ailevî uyuşmazlıkları çözme ve İslâm hukukunun pratikte yaşatılmasına katkı sağlama işlevleri tespit edilmiştir. Ayrıca bu kurumsal modelin, benzer sosyo-hukukî şartlara sahip diğer Batı ülkeleri ile Türkiye açısından uygulanabilir ve geliştirilebilir bir örnek teşkil ettiği ortaya konmuştur."
