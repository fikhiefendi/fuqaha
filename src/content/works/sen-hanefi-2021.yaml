abstract: "Bu çalışmada usûl-ı fıkıh ilminin önemli başlıklarından fâsid istidlâl konusu Hanefî usul düşüncesi bağlamında incelenmiştir. Diğer usul âlimlerinin aksine Hanefî usulcülere göre istidlâl; kitap, sünnet, icmâ ve kıyasın dışında başlı başına müstakil şer'î bir delil değil, nassın delâletine dayalı hükme ulaşma yöntemidir. Araştırma neticesinde Hanefî usulcülere göre istidlâlin, lafzî vaz'î delâlete dayalı hüküm istinbat etme yöntemi olduğu tespit edilmiştir. Onlara göre hitabın delâletinde mütekellimin irade ve kastına değil, sadece lafzın vaz'ına itibar edildiği anlaşılmıştır. Delâlet yöntemlerinin şer'î hükümlere ulaştırdığını dikkate alan Hanefîler, sahih-fâsid istidlâl ayırımı yaparak hitabın delâletinde ihtiyatlı bir tavır benimsemişlerdir. Bu nedenle Hanefî usulcülere göre ibare, işaret, nas ve iktizânın delâleti sahih istidlâl, bunların dışındaki delâlet yollarıyla yapılan istidlâl, fâsid istidlâl olarak kabul edilmiştir. Zira fâsid istidlâl olarak adlandırılan delâlet yöntemleri, lafzın delâletiyle sabit olmadığından sadece akla veya kıyasa dayandığından meskûtun delâleti kapsamında değerlendirilmiştir. Çalışmada Hanefîlere göre sahih-fâsid istidlâl, fâsid istidlâl çeşitleri, bu istidlâl çeşitlerinin fâsid istidlâl olarak değerlendirilmelerinin sebepleri, delilleri, Hanefîlerin fâsid istidlâl yöntemleriyle amel ettikleri yönündeki iddialar ve bu iddialara verilen cevaplar sistematik bir bütünlük içinde incelenmeye çalışılmıştır."
