abstract: "Bu çalışma, Arnavut âlimlerinden Vehbi Gavoçi'nin hayatını, eserlerini ve İs-lam dünyasına katkılarını incelemektedir. Gavoçi, Arnavut toplumunda önemli bir yere sahip olan ve İslam dininin yaygınlaşmasına katkıda bulunan bir âlimdir. Bu çalışmanın amacı, Arnavut toplumunda dini yaşamın şekillenmesi ve İslam dininin yaygınlaşması konularında katkı sunmuş örnek bir şahsiyeti tanıtmaktır. Çalışmada, gözlem ve tespitlere dayalı bir yöntem kullanılmıştır. Gavoçi'nin eserleri ve hayatını anlatan kaynaklardan veriler toplanmış ve akademik bir bakış açısıyla incelenmiştir. Çalışmanın giriş kısmında tezin önemi, amacı, yöntemi ve kaynakları hakkında bilgi verilmiştir. Birinci bölümde Vehbi Gavoçi'nin Hayatı, Etkisi, Hocaları ve Hizmetleri ele alınmıştır. İkinci bölümde Vehbi Gavoçi'nin eserleri ışığında ilmi ça-lışmaları ve İslam dünyasına katkıları incelenmiştir. Üçüncü bölümde, Vehbi Gavo-çi'nin fıkıh anlayışı ortaya konulmaktadır. Bu hedef kapsamında, özellikle güncel meselelere yaklaşımı örneklerle eşliğinde okuyucuya sunulmuştur. Çalışma sonucunda Gavoçi'nin İslam fıkhıyla ilgili eserlerinin ve fetvalarının, İslam hukukunun temel kaidelerini anlamada ve uygulamada önemli bir kaynak gö-revi gördüğü tespit edilmiştir. Ayrıca Gavoçi'nin fıkıh anlayışının, usul konularındaki yaklaşımlarının ve fıkhın pratik uygulamalarına dair görüşlerinin özgün yönleri ortaya konuşmuştur."
