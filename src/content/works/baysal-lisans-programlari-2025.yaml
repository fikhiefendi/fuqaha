abstract: "Bu araştırma, Türkiye'deki İlahiyat Fakültelerinde okutulan Kur'an-ı Kerim ve Tecvid derslerine ait ders bilgi paketlerinin sistematik ve karşılaştırmalı analizini gerçekleştirmeyi amaçlamaktadır. Kur'an-ı Kerim eğitimi, Hz. Peygamber döneminden itibaren İslam toplumunun eğitim geleneğinin temelini oluşturmuş ve tarihsel süreç içerisinde medreselerden günümüz üniversite sistemine kadar uzanan bir kontinüite içerisinde devam etmiştir. İlahiyat fakültelerinden mezun olan öğrencilerin mesleki hayatlarında karşılaştıkları yeterlilik farklılıkları, bu derslerin ders bilgi paketlerindeki tutarsızlıklardan kaynaklanmaktadır. Bu durum, Diyanet İşleri Başkanlığı ve Milli Eğitim Bakanlığı gibi kurumlarda görev yapacak mezunların mesleki donanımlarında farklılıklar oluşturmakta ve eğitimin niteliğini olumsuz etkilemektedir. Araştırmanın kapsamı, öğrenci kontenjanları açısından en yüksek beş üniversite ile sınırlandırılmıştır: Marmara, Atatürk, Süleyman Demirel, Necmeddin Erbakan ve Uludağ Üniversiteleri. Bu sınırlandırma, çalışmanın tutarlılığını ve isabetliliğini sağlamak amacıyla yapılmıştır. İnceleme, Arapça hazırlık, lisans zorunlu ve lisans seçmeli Kur'an-ı Kerim dersleri ile sınırlı tutulmuş, lisansüstü dersler çalışma kapsamına dahil edilmemiştir."
