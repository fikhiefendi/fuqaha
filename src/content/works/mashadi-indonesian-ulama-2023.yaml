abstract: "Endonezya'da birden fazla fetva kurumları bulunmaktadır. Bunlar Lajnah Bahtsul Masail Nahdlatul Ulama, Dewan Hisbah Persis, Majelis Tarjih Muhammadiyah ve Endonezya Ulema Meclisi gibi fetva kurumları mevcuttur. Endonezya Ulema Meclisi (MUI) de bir fetva kurumu olarak bu ülkedeki Müslümanlara rehberlik etme ve hükümet politikaları ile halk arasında arabuluculuk yapma sorumluluğuna sahip bir kuruluştur. Ayrıca bu kurum dini açıdan sorunları çözmek ve cevaplamak için kendi fetva komisyonu da vardır. Bu kurum Türkiye'deki Diyanet kadar önemli ve resmi bir görev yapmazsa da halk açısından gerçekten önemli görünmektedir. Bu çalışma, bir fetva kurumu olarak Endonezya Ulema Meclisini ve fetva yöntemlerini tanıtmaya odaklanacaktır. Özellikle sağlık alanındaki fetvaları da analiz edilecektir. Bu amaca ulaşmak için, çalışmamız iki bölüm ve sonuç kısmından oluşacak şekilde dizayn edilmiştir. Birinci bölümde Endonezya Ulema Meclisi'nin tanıtımı, ikinci bölümde ise sağlık alanındaki fetvalarını incelenmiştir."
