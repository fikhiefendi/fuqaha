abstract: "İslam tarihi boyunca âlimler; tefsir, hadis, fıkıh ve kelâm gibi çeşitli ilim dallarında çok kıymetli eserler yazmışlardır. Bu eserlerin bir kısmı günümüze ulaşmışken diğer bir kısmı tarihi süreç içerisinde muhtelif sebeplerden dolayı ortadan kaybolmuştur. Ne var ki günümüze ulaşan eserlerin bir bölümü henüz basılmadığından piyasada bulunmamaktadır. Dolayısıyla kütüphane raflarında yazma eser olarak tahkik edilip baskıya hazır hale gelmeyi beklemektedir. Bunlardan biri de Gurâbzâde Ahmed b. Abdullâh el-Hasûnî'nin İmam Ebû Hanîfe tarafından akaid/kelâm alanında telif edilen el-Fıkhu'l-ekber üzerine şerh olarak kaleme aldığı ed-Dav'u'l-ekser isimli kitabıdır. Çalışmamızda tahkiki yapılacak olan bu eser, Mâtürîdî kelâmı alanında yazılmış çok değerli bir kitaptır. O bakımdan tahkik edilerek ilim dünyasına kazandırılması önem arz etmektedir. Hasûnî, bu eserinde el-Fıkhu'l-ekber'in açıklamaya muhtaç yerlerini gayet anlaşılır bir üslupla izaha kavuşturmuş, her Mâtürîdî kelâmcı gibi temelde aklî ve naklî delilleri esas alan bir yöntem izlemiştir. Bu bağlamda Kur'an âyetlerinden ve nebevî hadislerden deliller serdetmiştir. İnanç konularında delil alınan nassların sübut itibariyle kat'î olmaları gerektiği genel kabulken Hasûnî, bazı konularda sübutu zannî olan âhâd haberlerden de deliller getirmiştir. Hatta yer yer zayıf hadisleri de delil olarak kullanmıştır. Ancak delil aldığı bütün hadislerin tetkikini yaparak sıhhat derecesini beyan etmiştir. Çok değerli olmasının yanında yenilik denilebilecek bazı nükteler içeren bu eserin tahkik edilmesinin ilim dünyasına katkı sunacağı düşünülmektedir."
