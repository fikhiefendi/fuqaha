abstract: "Son on yılda, Irak'taki İslami bankacılık sektörü, diğer mevcut banka türlerinin güçlü rekabeti karşısında dikkate değer bir büyüme ve giderek daha zorlu bir gelişme ile karşı karşıya kaldı. Bu çalışmanın temel amacı, Islam bankası hizmetleri ve ırak'ta müşteri memnuniyeti ve sadakat ile ilişkisi. Katılımcıların hizmetleri ve bunların memnuniyetleri ve kaliteleri üzerindeki etkileri hakkında fikirlerini sormak için bir anket çalışması yapıldı. Araştırma. Örneklem, Irak'tan 9 İslami bankayı kapsıyor (Kürdistan Uluslararası İslami Yatırım ve Kalkınma Bankası'nın %16'sı ve Cihan Bank İslami Yatırım ve Finansman'ın %11'i, ayrıca AlNahrain İslami'nin %13'ü, Nasik İslam Bankası'nın %7'si, %14'ü) Elaf İslam Bankası, ayrıca Irak İslami'nin %14'ü, Dijlah ve Furat Kalkınma ve Yatırım Bankası'nın %16'sı, İslami Bölgesel İşbirliği Bankası'nın sadece %2'si, son olarak Ulusal İslami'nin %7'si) yüzdesi. Ankete katılanların cinsiyetlerine göre %77'si erkek 162'si, %23'ü olan 48'i kadındır. 130 kişi evlidir ve bu oran yaklaşık %62'dir. Ve 80 katılımcı bekardı ve bu yaklaşık %38'dir. Ankete katılanların yaşlarına göre %42'si 21-30, %40'ı 31-40, %14'ü 41-50, %2'si ve %1'i 60 yaş ve üstü idi. Örneklem katılımcılarının eğitim düzeyine göre, %7'si ilköğretim, %10'u ortaöğretim, %14'ü lise, %20'si lisans altı, %27'si mezun, ayrıca %14'ü yükseköğrenim mezunudur. yüksek lisans sertifikası, Ph.D. sahipleri %5 idi. Sonuç olarak, araştırmada kullandığımız ölçeğin geçerliğini sağlamak için araştırmacı tarafından bu araştırmada dört bilgi bölümünde sınıflandırılan bir anket kullanılmış, güvenirliği Cronbach alfa katsayısı ile doğrulanmıştır ve 0.891 olarak bulunmuştur. Kabul edilebilir Cronbach alfa değerinin 0.70'den fazla olması gerektiğini söyleyen (Bland and Altman 1997) göre kabul edilebilir bir değer, test edilen madde sayısından etkilenen Cronbach alfa testine göre. Öte yandan, araştırmacı, yukarıdaki korelasyon tablosu sonucunda bulunan İslami banka hizmetleri ile müşteri sadakati arasında 0,01 düzeyinde (2-kuyruklu) anlamlı düzeyde güçlü bir ilişki olduğunu bulmuştur. 0,721** olan korelasyon düzeyi yüksektir, bu da“İş İslami banka hizmetleri ile müşteri sadakati arasında anlamlı bir ilişki vardır”şeklindeki ikinci hipotezin kabul edildiği anlamına gelir."
