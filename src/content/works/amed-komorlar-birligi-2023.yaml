abstract: "Komorlar Birliği'nde İslami Bankacılığın Gelişme Potansiyelinin İncelenmesi\" başlıklı bu çalışma, bölgedeki finansal sektördeki dönüşümleri anlamak ve Komorlar Birliği'nde İslami bankaların gelişme potansiyelini değerlendirmeyi, aynı zamanda İslami finans prensiplerine uygun bankacılık hizmetlerinin gelişimini teşvik etmek için önemli veriler sunmayı hedeflemektedir. Çalışma kapsamında, nicel araştırma yöntemlerinden korelasyon ve regresyon analizi kullanılmaktadır. Bu yöntemler, bankacılık sektörü ile ilişkili değişkenler arasındaki ilişkileri ve bu değişkenlerin birbirlerini nasıl etkileyebileceğini (tahmin edebileceğini) belirlemek amacıyla uygulanmaktadır. Verilerin toplanması için özellikle öğrenci nüfusu hedef alınmaktadır. Anketler, öğrencilerin İslami bankacılık hakkındaki bilgi düzeylerini, algılarını, beklentilerini ve finansal ihtiyaçlarını değerlendirmek için kullanılmaktadır. Araştırma, Komorlar Birliği finansal sisteminin İslami bankacılık açısından potansiyelini ortaya çıkarmayı ve bu alandaki büyümeyi teşvik etmek için öneriler sunmayı amaçlamaktadır. Sonuçlar, bankaların hizmet sunumunda ve ürün geliştirmede iyileştirmeler yapılmasına yardımcı olacak önemli bilgiler sunabilir. Bu çalışma, İslami bankaların Komorlar Birliği'ndeki gelişme potansiyelini anlamak ve sürdürülebilir kalkınma amacıyla bu alanda uygun stratejiler geliştirmek için önemli bir adımdır."
