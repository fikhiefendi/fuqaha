abstract: "İslam hukukunda kişinin kendisine tanınan hak ve yetkileri bilmesi, hem kanun önünde kendisini savunması açısından hem de dini mesuliyet açısından önem arz etmektedir. Çünkü İslam hukukunda kişinin yaptığı yanlış sadece dünya hayatını değil âhiret hayatını da ilgilendirmektedir. Bundan dolayı Müslüman yaşantısının her alanında mutlaka dinin emir ve yasaklarını dikkate almak durumundadır. Müslüman şahıs namaz, oruç gibi ibadetlerinde hassas davrandığı gibi içtimaî hayata ait fiil ve hareketlerinde de aynı hassasiyeti göstermek zorundadır. Çünkü sosyal hayatta yaptığımız yanlışlar kul hakkına taalluk etmektedir. Kul hakkının affı ise bizzat helalleşme yoluyla gerçekleşmektedir. Bu da her zaman mümkün olamamaktadır. İslam hukukunun bir bölümünü de ceza hukuku oluşturur. Ceza hukuku içerisinde ise had cezalarının ayrı bir yeri vardır. Çünkü, bu cezalarda hem Allah hakkının hem de kul hakkının bulunmasının ve ceza tespitinin bizzat kanun koyucu tarafından belirlenmiş olmasının etkisi vardır. İslam hukuku fevrî hareketleri, töre cinayetlerini ve her türlü kanunsuz müdahaleleri uygun bulmamış ve şahıslara ceza infaz yetkisi tanımamıştır. İslam ceza hukukunda yargılama esas kabul edilmiş, yargısız infazlar, münferit hareketler ise cezalandırılmıştır. Bunu yaparken de meşru müdafaa ve zaruret hali gibi mazeretleri göz önünde bulundurarak, şahsında mağdur olamamasını esas almıştır. Sonuç olarak söylemek gerekirse; İslam hukuku, Kur'an ve Sünnete dayandığı için, tek taraflı mağduriyete izin vermeyen, insan fıtratına, akla ve mantığa en uygun hükümler vazetmiştir."
