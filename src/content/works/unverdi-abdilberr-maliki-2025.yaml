abstract: "Endülüs coğrafyasında yetişmiş İslam alimlerinden olan İbn Abdilberr, içtihat derecesine ulaşmış bir fakih olmanın yanı sıra, hadis, tarih, edebiyat ve biyografi alanlarında eserler vermiş yetkin bir alimdir. Endülüs'ün merkezi Kurtuba'da eğitimine başlayan ve ömrünün sonuna kadar ilmi çalışmalarını sürdüren İbn Abdilberr, ilmî birikimini telif ettiği eserler ve yetiştirdiği öğrenciler vasıtasıyla sonraki nesillere ulaştırır. Zamanında ortaya çıkan bazı iç karışıklılar ve güvenlik nedeniyle farklı şehirleri dolaşan İbn Abdilberr, fıkıh ve hadis alanında tanınır olur. Döneminin yöneticileri kendisinden istifade etmek için, onun derslerine katılırlar. Toplum nezdindeki değeri ve fıkhî bilgisi nedeniyle kadılık görevine layık görülen İbn Abdilberr, farklı şehirlerde bu görevi yerine getirir. Yoğun ilmi çalışmalarda bulunan İbn Abdilberr, diğer İslam merkezlerinden Endülüs'e yapılan ilmi yolculuklar vasıtasıyla meşhur fıkıh ve hadis alimlerinin ilk kuşaklara ait eserlerini okuyan hocalardan ders ve icazet alır, böylece ehl-i hadis fakihler arasında kabul edilir. Mısır, Kayravan, Medine ve Bağdat okullarından etkilenen Endülüs Malikî ekolü, pek çok değerli fakih ve alim yetiştirmiştir. İmam Malik'in öğrencileri vasıtasıyla oluşup gelişmeye başlayan Endülüs Malikî ekolü, İbn Abdilberr ve onun gibi alimler vasıtasıyla içtihadı teşvik eden ve asli kaynaklara dönüşü temel alan kıymetli çalışmalara ev sahipliği yapmıştır. İbn Abdilberr, usulde takip ettiği mezhep Malikî sistematiği olmasına rağmen, eserlerinde farklı ekollerin görüşlerine de yer vermiştir. Bu durum onun, fıkhî görüşleri irdelemeden ve kaynaklarla irtibatlandırmadan körü körüne kabul etmeyen bir fakih olduğunu açıkça göstermektedir. Telif ettiği eserleri, yetiştirdiği öğrenciler, fıkhî görüşleri, mezhebin ilk kaynaklarına olan vukûfiyeti, içtihada değer verip taklidi eleştirmesi, onun Malikî fıkhındaki yerini göstermesi açısından önemlidir."
