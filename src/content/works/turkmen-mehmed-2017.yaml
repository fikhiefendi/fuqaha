abstract: "Mehmed Emîn el-Üsküdârî'nin hayatını ve Türkiye kütüphanelerinde yazma halde bulunan Nadratü'l-Enzâr fî Şerhi'l-Menâr adlı eserini konu edinen bu çalışma bir giriş, iki bölüm ve tahkîkli metin kısımlarından oluşmaktadır. Girişte, tezimizin amacını ve kapsamını anlattık. Birinci bölümde şerhi yapılan eserin asıl metni olan Menâru'l-Envâr fî Usûli'l-Fıkıh eserinin müellifi Ebu'l-Berekât'ın, yaşadığı dönemi ve hayatını genel bir çerçeveyle ele aldık ve Ebu'l-Berekât'ın eserini incelemeye çalıştık. İkinci bölümde Kayserizâde Mehmed Emîn el-Üsküdârî'yi tanıtmayı amaçlayarak, hayatını bütün yönleriyle ele aldık. Ardından çalışmamıza konu olan eseri ve tahkîk esnasında bağlı kaldığımız nüshaları tanıtmaya çalıştık ve tahkîk esnasında uygulamış olduğumuz metodu açıkladık. Tahkîkli metin kısmında ise eserin üç farklı nüshasını karşılaştırarak edisyon kritiğinin hakkını vermeye çalıştık. Anahtar Sözcükler: Mehmed Emîn el-Üsküdârî, Nadratü'l-Enzâr Fî Şerhi'l-Menâr, İslam Hukuku, Usûlü'l-Fıkh"
