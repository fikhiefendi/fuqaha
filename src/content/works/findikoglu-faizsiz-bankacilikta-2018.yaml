abstract: "Genellikle Müslüman kesimin finansman ihtiyaçlarının karşılanmasına yönelik olan, özellikle faizsizlik ilkesine dayanan İslami bankacılık sistemi faaliyet yapısından ve işleyişinden dolayı çeşitli risklere maruz kalmaktadır. Bu risklerin kontrollü bir şekilde yönetilmesine ihtiyaç duyan bu sistem, klasik bankacılık sistemine uygun olan risk yönetim sisteminden yararlanmaktadır ancak klasik bankacılık sistemine benzer risklerin yanında bir de İslami bankacılığın yapısından kaynaklanan Şeriat uyum riski, getiri oranı riski, öz kaynak yatırım riski ve yerinden edilmiş ticari risk gibi bir takım özel riskler de bulunmaktadır. Bu özel risklerin yönetiminde ve ölçülmesinde yardımcı olacak uygulamalara ihtiyaç duyulmaktadır. Klasik bankalara benzer risklerin yönetiminde ise İslami bankalar, kanunlarla belirtilen uygulamaları kendi yapısına uyarlamaktadır. Ancak tam olarak verim sağlanabilmesi için İslami bankaların risk yönetiminde özel olarak yararlanabileceği uygulamaların geliştirilmesine ihtiyaç duyulmaktadır. Bu tez de ilk olarak bankacılık hakkında bir araştırma yapıldıktan sonra İslami bankaların faaliyetleri hakkında bilgi verilip bu faaliyetler neticesinde karşılaştığı risklerden bahsedilmektedir. Daha sonra bu risklerin yönetiminde yardımcı olacak etmenler hakkında bilgi verilmektedir. Son olarak Türkiye'deki faizsiz bankacılık hakkında araştırmalar yapılıp bu bankaların ihtiyacı olan uygulamalar hakkında tartışılmaktadır."
