abstract: "Molla Hüsrev (1400?-1480), XV. yüzyılda Osmanlı Devletinde birçok alanda ilerlemenin olduğu bir devirde yaşamıştır. Yaşadığı dönemde Osmanlı ilmiye teşkilatına damga vuran isimlerin başında gelmiştir. Yetiştirdiği öğrencilerinin ve farklı ilim dallarında telif ettiği pek çok eserinin yanı sıra; müderris, kadı, kazasker ve müftü (şeyhülislâm) olarak önemli görevleri yerine getirmiştir. Fatih Sultan Mehmed'in“zamanın Ebû Hanîfesi”iltifatına mazhar olmuş ve onun huzurunda yapılan bazı ilmî tartışmalarda“reîsü'l-ulemâ”sıfatıyla karar mercii olmuştur. Osmanlı ilim geleneğinde çok yönlü bir âlim portresine sahip olan Molla Hüsrev, daha çok fıkıh ve usûl-i fıkıh alanlarında yazmış olduğu eserleriyle temayüz etmektedir. Ancak onun, tefsir, kelâm, mantık, Arap dili ve belâgatı ilim dallarında da çok sayıda eseri bulunmaktadır. Molla Hüsrev'in belâgat ilimlerine dair telif ettiği en kapsamlı eseri, bu çalışmaya konu olan Hâşiye 'ale'l-Mutavvel adlı eseridir. Eser, Sa'düddîn etTeftâzânî'nin el-Mutavvel şerhi üzerine hâşiye türünde kaleme alınmıştır. Molla Hüsrev'in, el-Mutavvel'i, bizzat Teftâzânî'nin öğrencilerinden Burhâneddîn Haydar el-Herevî'den okumuş olması; ayrıca hâşiyesinin Osmanlı'da elMutavvel üzerine ilk yazılan ve en çok istinsah edilen hâşiyeler arasında yer alması, esere ayrı bir önem kazandırmaktadır. Bu çalışmanın birinci bölümde, Molla Hüsrev'in yaşadığı dönem, hayatı, ilmî ve edebî şahsiyeti, Arap dili ve belâgati ile ilişkisi üzerinde durulmakta ve tespit edilebilen eserleri hakkında bilgi verilmektedir. İkinci bölümde, Hâşiye 'ale'l-Mutavvel etraflıca ele alınmakta ve çeşitli açılardan incelenmektedir. Son bölümde ise eserin, modern tahkik neşir esaslarına uygun olarak edisyon kritiği yapılmaktadır."
