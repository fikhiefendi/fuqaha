abstract: "IV ÖZET YÜKSEK LİSANS TEZİ EMREDİCİ HUKUK KURALI-YEDEK HUKUK KURALI AYRIMININ İSLÂM HUKUKU ACISINDAN DEĞERLENDİRİLMESİ Yasin KURBAN Danışman: Doç. Dr. H. İbrahim ACAR 2001-SAYFA: Jüri: Doç. Dr. H. İbrahim ACAR Prof. Dr. Asri ÇUBUKÇU Prof. Dr. Beşir GÖZÜBENLİ Pozitif hukuk doktrininde hukuk kuralları çeşitli açılardan tasniflere tabi tutulmuş ve kişilerin iradelerinin göz önünde bulundurulup bulundurulmayacağına göre emredici hukuk kuralı ve yedek hukuk kuralı olarak iki kısma ayrılmıştır. Emredici kuralların aksi kararlaştınlamazken; yedek kuralların aksi kararlaştırılabil- mektedir. Yapılan bu çalışma İslâm hukuk metodolojisinde böyle bir ayrımın mevcut olup olmadığım ve söz konusu ayrımla elde edilebilecek pratik faydaları tespit etmekten ibarettir."
