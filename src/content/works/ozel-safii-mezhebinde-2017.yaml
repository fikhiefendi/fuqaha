abstract: "İmâm Şâfiî'nin görüşleri kadîm ve cedîd olmak üzere iki kategoriye ayrılır. Kavl-i kadîm; 1. Muârızı bulunmayan sahîh bir hadîsle desteklendiğinde, 2. Kavl-i cedîd kendisine aykırı düşmediğinde ya da kavl-i cedîd'de bahsi geçen meseleye hiç temas edilmemesi durumunda, İmâm Şâfiî'nin mezhebi sayılıp ona nisbet edilir ve bu görüş doğrultusunda fetvâ verilir. Ancak mezkûr iki durum dışında kadîm ve cedîd görüşlerin çatıştığı her meselede müftâ bih olan görüş, kavl-i cedîd olup kavl-i kadîm'in Şâfiî'ye nisbeti sahîh değildir. Nevevî, Râfiî ile beraber“Şeyhayn”olarak anılmış ve mezhebin ikinci kurucuları olarak telakki edilmiştir. Şeyhayn'ın görüşleri ve eserleri mezhebin görüşünü belirlemede sonraki Şâfiî fukahâsının başvurusuna eksen teşkil etmiştir. Bu sebeple ikisinin tercîhleri esas alınmıştır. Nevevî, diğer Şâfiî fakîhlerinden şu üç özelliği ile temâyüz etmiştir: 1. Kavl ayrımınındaki tercîh faaliyetinin en önemli ismidir. Zira diğer Şâfiî fakîhlerin değil; onun tercîhi, mezhebin tercîhi olarak kabul edilmiştir. 2. Öteden beri aktarılan mezheb kanaatlerine hatta Şâfiî'nin nass'larına dahi aykırı ictihâdlar sergileyerek mezhebin makas değiştirmesine neden olmuştur. 3. Mezhepteki kaotik yapıyı senkronize bir yapıya kavuşturmuştur. Nevevî tarafından tercîh edilen yirmi altı kavl-i kadîm tespit edilmiştir. Ancak bunların tümü kavl-i cedîd'e aykırı kavl-i kadîm kategorisine dâhil değildir. Şâfiî, Kavl-i Kadîm, Kavl-i Cedîd, Nevevî, Tercîh, Fetvâ."
