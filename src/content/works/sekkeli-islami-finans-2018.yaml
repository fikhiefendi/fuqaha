abstract: "II. Dünya savaşı sonrası hızlı bir şekilde gelişen teknoloji ile birlikte tüm Dünya devletlerinin ekonomileri de buna paralel olarak büyümüştür. Finansal piyasaların ortaya çıkması ise reel sektörde yapılan ticaretten çok daha hacimli işlemlerin finansal piyasalar içerisinde yapılmasına olanak sağlamıştır. Ancak zaman zaman finansal piyasalar ile reel sektör arasında oluşan balon kontrol edilemez hale gelerek dünya çapında krizlerin oluşmasına neden olmaktadır. Son yıllarda ise bu krizlerin önlenebilmesi adına devletler alternatif olarak İslami finans yöntemlerine rağbet göstermeye başlamıştır. İslami finans yöntemleri, faiz içeren yöntemlerin aksine reel sektör ile paranın bağlantısını koparmadan işlem yapmaya olanak sağlayarak hem haksız kazancın önüne geçmiş hem de devletlere organik büyüme imkânı tanımıştır. Bu çalışmada İslami finans yöntemlerinin reel kesime etkileri nitel olarak yarı yapılandırılmış mülakat yöntemi, nicel olarak ise karşılaştırmalı analiz kullanılarak incelenmiştir."
