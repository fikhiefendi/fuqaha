abstract: "İçtihadın İslâm fıkhının en hayati organlarından biri olduğundan şüphe yoktur. Zira içtihad, İslâm fıkhının statikleşmesini, donuklaşmasını ve gelişmelerin gerisinde kalmasını önleyen; zaman, durum ve ihtiyaçlar doğrultusunda fıkha dinamizm kazandıran faaliyetin adıdır.İslâm'ın ilk yıllarında \"re'y\" terimiyle ifade edilen ictihad, Hz. Peygamber, sahabe ve tabiîn devrinde ilk örnekleri uygulanmış, daha sonraki dönemlerde de sistematik bir şekil alarak ve gelişerek kıyas, istihsan, istıslah vb. adlar altında, âyet ve hadislerden hüküm çıkarma vasıtası hâline gelmiştir. Sahabe Hz Peygamber'in (sav) vefatından sonra da tıpkı O hayattayken huzur ve gıyabında yaptıkları gibi içtihad faaliyetlerine devam etmişlerdir.Sahabe yaptıkları ictihadlarla İslam hukukuna daha tedvin edilmeden önce hür insani bir katkıyı (dirayet-rey) yapmıştır. Sahabenin ictihad ile ilgili uygulamaları, İslam hukukunun yenilenen ihtiyaçları dikkate alarak, çözümler getirebilen bir hukuk sistemi olduğunu göstermiştir. İctihad prensibinin yerinde ve etkin bir şekilde işletilmesiyle evrensel bir hukuk olan İslam hukuku, uygulanabilir bir duruma getirilecek, bütün zaman ve mekanların ihtiyaçlarını karşılayabilecek, gelişmeye elverişli bir hukuk sistemi olma özelliğini sürdürecektir."
