abstract: "Çoğunlukla tekâfül olarak adlandırılan İslâmî sigortada klasik akitlerle modern sigortacılık uygulamasını bir araya getiren değişik modeller uygulanmaktadır. Tezin amacı, tekâfülde dünyanın en önde gelen ülkelerinden biri olan Malezya'nın tekafül tecrübesini ve uygulamasını incelemek ve Türkiye için örnek alınabilecek yönlerini ortaya koymaktır. Tezde, uygulamadaki benzerliklere bağlı olarak ilk önce konvansiyonel sigortaya değinilmiştir. Tekâfül sigortacılığı ile ilgili temel bilgilere yer verilirken faiz ve garar gibi unsurlar da incelenmiştir. Malezya'daki tekâfül uygulamalarıyla ilgili fıkhî tartışmalar sunulmuştur. Malezya hukuk sisteminin modern hukuka, dolayısıyla da İngiliz hukukuna dayalı olduğu bilinen bir olgudur. Konvansiyonel ve İslâmî olmak üzere ikili bankacılık sistemi uygulanan Malezya'da, finansal sistemin Merkez Bankası'na bağlı olmasından dolayı iki sistem arasında uygulama benzerlikleri olsa da mevzuatta farklılıklar olduğu müşahede edilmiştir. Türkiye'deki hukuk sistemi ise karma bir yapıdadır ve İslâmî hukuk alternatifi sunulmamaktadır. Uygulama ve kararlarındaki referanslarını İslâmî hukuktan değil de dünyadaki farklı beşeri hukuk sistemlerinden alması gibi sebeplerden ötürü Malezya'nın tekâfül tecrübesinin Türkiye'ye aktarımı pek mümkün görünmemektedir. Malezya'da ise kanun ve hükümler İslâmî hukuktan referanslar almakta ve şerî mahkeme alternatifi sunulmaktadır. Tekâfül alanında Türkiye'nin hâlihazırda kurulan akit türlerinden faydalanarak yeni bir akit türü geliştirmesinin ve uygulamalarıyla kendi tecrübesini edinmesinin daha faydalı olacağı sonucuna ulaşılmıştır. Bu çerçevede, tezde bahsi geçen ve kullanılan diğer akitlere alternatif olabilecek vedîa modelinin yapılacak belli başlı bazı değişikliklerle Türkiye'de uygulanabilirliğinin araştırılması tavsiyesiyle çalışma sonlandırılmıştır."
