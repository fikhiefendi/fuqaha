abstract: "Osmanlı Devleti küçük bir beylik olarak kurulmuş kısa zaman sonra büyük bir imparatorluk haline gelmişti. Osmanlı Devleti'nin bu kadar kısa sürede büyüme sebepleri arasında merkeziyetçi yapısı, güçlü ordusu vb. yer alırken bunlar kadar önemli bir diğer sebep de Osmanlı Devleti'nin sosyal devlet anlayışına sahip olmasıydı . Osmanlı Devleti savaşlar, doğal afetler, salgın hastalıklar vb. sonucunda hayatını kaybedenlerin çocuklarının ihtiyaçlarının giderilmesi ve topluma kazandırılması için fonlar kurmuş ve bu fonlar daha sonra Eytâm Sandıkları olarak adlandırılmıştır. 1851 yılında kurulan Eytâm Sandığının temel amacı yetimlerin haklarını korumaktır. Kuruluşundan sonra yaygınlaşan Eytâm Sandıkları yetimlere kalan malların korunmasını ve işletilmesini sağlamaktadır. Bu sandıklardan din, dil, ırk ayrımı yapılmaksızın ihtiyaç sahibi olan herkes yararlanabilmiştir. Çalışmamızın amacı, 1898-1902 yılları arasında İzmir Tire'deki Eytâm Sandığından hareketle Eytâm Sandıkları hakkında bilgi vermektir. İncelediğimiz 1898-1902 tarihli şer'iyye sicili toplam 132 belge ve 116 sayfadan oluşmaktadır. Bu belgelerden hareketle Tire'de yaşayan Müslümanların yanında gayrimüslimlerin de bu sandıklardan yararlandıklarını görmekteyiz."
