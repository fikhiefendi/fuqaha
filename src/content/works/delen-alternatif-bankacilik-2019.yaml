abstract: "Dünyada önemli gelişimler kat eden faizsiz bankacılık; son yıllarda kamu bankalarının da bu sektöre girişi ile birlikte Türkiye'de daha geniş bir uygulama alanı yakalamıştır. Katılım Bankaları“faizsiz bankacılık”tanımlaması ile yaygınlaşmış ve neredeyse tüm dünyada önemli bir role bürünmüşlerdir. Finans sektörüne faizsiz bankacılık yapan finans kurumları adlandırması ile adım atan bu kuruluşlar, bankacılık kanununda yapılan değişiklik ile birlikte“Katılım Bankaları”olarak adlandırılmışlardır. Hali hazırda bulunan bankaların yanında bu kurumlara ihtiyaç duyulmasında birçok neden vardır. Fakat bu nedenlerin en başında bireylerin faizden uzak kalmak, faizsiz sistem içerisinde bankacılık işlemlerini yürütmek istemesi arzusu gelmektedir. Bu çalışmada bankalara alternatif olarak katılım bankacılığı, faizsiz bankacılık enstrümanları, ortaya çıkış ve gelişim süreçleri, sisteme dahil olmaları ve bu kurumların esas olarak Türkiye ekonomisine etkileri ortaya konmaya çalışılacaktır."
