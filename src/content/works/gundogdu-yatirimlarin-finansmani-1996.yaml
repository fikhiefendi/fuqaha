abstract: "ÖZET Failin yasaklanması Özel Finans Kurumları (ÖFK)'nın iktisadi mentalitesini oluşturmaktadır. Faizin yasaklanması bir kurumun yasaklanması değil aynı zamanda alternatif bir sistemin de önerilmesidir. Çağdaş ekonomi teorisi faiz kavramına, bu kavram gölgesinde kalan bütün anlamlan da yüklemiştir. İslami görüş, faktör fiyatlandırma ve paranın zaman değerinin, veya faiz ile kazanç arasındaki farkın faize dayalı sistemlerden farklılıklannı göstermektedir. İslam tarihinde mudarabe ve muşaraka akitleri, Ortaçağ Avrupası'nda ise bu akitlerin“Commenda”ve“Societas”olarak faizsiz bankacılık fonsiyonlannı yerine getirmişlerdir. Ancak, modern anlamda İslami Bankacılık 20. yüzyılın 2. yansında ortaya çıkarılmış ve İslam Konferansı ve İslam Kalkınma Bankası'nın kurulması yaygınlaşmalarını kolaylaştırmıştır. Türkiye'de 5 Özel Finans Kurumu faaliyet göstermekte olup, faaliyetleri 16/12/1983 gün ve 83/7506 sayılı Bakanlar Kurulu Kararnamesi 'ne uygun olarak yürütülmektedir. ÖFK'lan fon toplarken“Kar ve Zarara Kanlım Akdi”yaptıklanndan mevduat sahibine başlangıçta bir getiri taahhüt etmemektedir. ÖFK fonlan“Mevduat Sigorta Fonu”kapsamına girmezler. Bu, herhangi bir kriz anında da olsa, devlet desteği olmadan ayakta kalabilecek bir bankacılık sisteminin olabileceğini göstermesi açısından kayda değer bir özelliktir. TL katılma hesaplan, 1989 yılında toplam fonlann %54'ünü oluştururken bu oran yıllar itiban ile azalarak Kasım'95'te %14'e gerilemiş, dövizli fonlann toplam fonlar içindeki payı sürekli artmış ve Kasım '95 itibanyla %79'a yükselmiştir. Son iki yıldır pazar paylan gerileyen ÖFK'lann Haziran'95 itiban toplam mevduattaki pazar payı %2.66, TL Mevduatta ise pazar payı %0.93'e olarak gerçekleşmiştir. Buradan, her yeni kurulan bir ÖFK'nın pazarı büyütmediği ancak varolan pazarı paylaştığı anlaşılmaktadır. Devletin yüksek faizli bono çıkararak borçlanması, ÖFK' 1ar Hazine Bonosu, Devlet Tahvili vb. kağıtlara faizli işlem olmasından dolayı yatınm yapamaması ÖFK'lann TL fonlarının önemli bir bölümünü bankalara çekmektedir. Enflasyonist ortamdan dolayı bir kısım mevduat sahiplerinin de tasarruflarını dövize çevirmesi ÖFK mevduat yapışım TL'den dövize kaydırmıştır. ÖFK'lar topladıklan fonlan, üretim desteği, finansal kiralama veya kar-zarar ortaklığı şeklinde yaurımlann finansmanı için kullandırmaktadır. 1994 yılında toplam mevduatın %91'ne sahip 3 ÖFK, yatınmlara 14.9 trilyon TL'lik kaynak aktarmıştır. Plasmanlann %93'ünü üretim desteği (Murabaha), %5.1 finansal kiralama (Leasing), % 1.8 'i ise Kar Zarar Ortaklığı (Mudaraba-Muşaraka) oluşturmuştur. Ülke Ekonomisine gerek parasal gerekse moral olarak önemli kalkılan olan ÖFK'lar, değişik finansal enstrümanlaryla kredi maliyetlerini düşürücü etki yapmasının yanında, faizden dolayı bankalara gitmeyen atıl fonların ekonomiye kazandınlması, yabancı sermaye transferi, klasik bankalarla olan rekabet dolayısıyla hizmet kalitesinin artınlması ve istihdam vd. birçok konuda yadsınmaz katkılar sağlamaktadır. IX"
