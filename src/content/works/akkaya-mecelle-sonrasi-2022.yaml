abstract: "Osmanlıda Mecelleden sonra siyasal temelli sosyolojik problemleri halletmek için başta örfe dayalı içtihat terimi olmak üzere bazı usul-i fıkıh kavramlarına birtakım çevrelerce yeni anlamlar yüklenmiştir. Özellikle Ziya Gökalp ve Halim Sabit gibi entelektüeller İslami hükümleri diyanî ve kazaî şeklinde ikiye ayırıp kazaî alanı kamusal alanın vicdanı olarak gördükleri örf temelinde değerlendirmişlerdir. Diğer bir ifadeyle örfî hukuku şer'î hukukun tamamlayıcısı olmaktan çıkarıp alternatif bir kaynak olarak kabul ederek toplumsal hayata taalluk eden konulara dair hükümleri kamusal vicdanın belirlediği maruf olarak ele almışlardır. Kazaî alan olarak belirledikleri konularda geniş ölçekli bir değişim gösteren bu kişiler, seküler hukuk anlayışı yönünde siyasi kanadı derinden etkilemişlerdir. Yenilikçi harekete mukabil olarak aralarında İzmirli İsmail Hakkı vb. zatların bulunduğu bir grup entelektüellerde klasik fıkıh doktrininde var olan örf ve içtihat anlayışını savunmuşlardır. Bu dönemdeki fıkhî tartışmaların, siyasi yaklaşımlardan bağımsız olarak okunmasının imkânsızlığından yola çıkarak, doğru bir şekilde anlaşılması, günümüz içtihat ve örf anlayışlarının arka planını kavramak açısından büyük bir öneme sahiptir. Biz bu çalışmamızda daha önce inceleme konusu yapılmamış olan özel olarak Ziya Gökalp ve Halim Sabit gibi reformist aydınlar ve bunlara karşı reddiye olarak kaleme alınan makaleler çerçevesinde öne sürülen görüşleri ve bu görüşlerin klasik metodolojideki yerini inceleyeceğiz. Mecelle sonrası yürütülen fıkhî tartışmalar her iki tarafıyla günümüz ilim camiasında da varlığını sürdürmektedir. Bu nedenle yapacağımız çalışmanın çağdaş fikirlerin dayandığı ana damarları ile birlikte daha sağlıklı bir şekilde anlaşılmasına katkı sunacağını düşünmekteyiz. Bu çalışmamız bir giriş ve iki bölümden oluşmaktadır. Giriş bölümünde tezimizin konusu, kapsamı, amacı, yöntemi ve kaynakları ele alınacaktır. Birinci bölümde içtihat ve örf terimlerine klasik fıkıh anlayışında nasıl bir anlam verildiği üzerine durulacaktır. İkinci bölümde Ziya Gökalp ve takipçilerinin örfe dayalı yeni içtihat anlayışları ve bunlara mukabil olan İzmirli İsmail Hakkı gibi isimlerin görüşlerine yer verildikten sonra genel ve soyut bir şekilde ulaşılan sonuçların önemli olanlarından bahsedilecektir."
