abstract: "Aile toplumu oluşturan en küçük yapı taşı olarak insanlık tarihi boyunca varlığı devam eden bir müessesedir. İnsanın bir kısım maddi ve manevi ihtiyaçlarını kıvamında karşılayabilmesi ancak böyle bir müessesede gerçekleşebilir. Çünkü evlenmenin ferdî ve ictimâî birçok faydası bulunmaktadır. Bu sebeple İslâm hukukunda evlilik ve âile hayatına çok önem verilmiş; ailenin sağlam temeller üzerine kurulabilmesi için evlilik öncesi bazı hazırlık safhaları meşru görülmüştür. Nişan da bu safhalardan biridir. Nişanla ilgili konulara fıkıh kaynaklarında genellikle kitabu'n-nikâh ana başlığının başlangıç kısımlarında hıtbe ve nazar kavramları çerçevesinde yer verilmiştir. Son asırlarda yazılan ilgili eserlerde bu konular genellikle aile hukuku bölümü içinde görüşme ve nişan başlıkları altında incelenmiştir. Ahval-i şahsiye kitaplarında da özel olarak bu konulara yer verilmiştir. Ayrıca nişan ve nişanlanma konularında çağdaş çalışmalar da yapılmıştır. Nişanlılık döneminde yapılan evlenme akitleriyle ilgili olarak cemiyette bazı problemler görülmüş; böyle bir akdin sebepleri ve bu akdin problemli taraflarının incelenmesine yani konuyla ilgili müstakil bir akademik çalışmaya ihtiyaç duyulmuştur.“İslam Hukukunda Nişan ve Nişanlılık Sürecinde Yapılan Evlenme Akdi”başlıklı bu yüksek lisans tezinin hazırlanması uygun görülmüştür."
