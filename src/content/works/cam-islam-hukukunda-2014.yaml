abstract: "'İslam Hukukunda Yardımcı Üreme Teknikleri ve Taşıyıcı Annelik' adlı bu çalışma, giriş ve üç bölümden oluşmaktadır. Girişte araştırmanın konusu, önemi, amacı ve kaynaklarına ilişkin bilgiler yer almaktadır. Burada, yardımcı üreme teknikleri ve taşıyıcı anneliğin mahiyetinden bahsedilmekte, bu çalışmayla neyin hedeflendiği ve hangi kaynaklara başvurulduğu belirtilmektedir. Birinci bölüm; yardımcı üreme tekniklerine tahsis edilmiştir. Bu bölümde öncelikle yardımcı üreme tekniklerine başvurmayı gerektiren infertilite, sterilite ve bunların sebepleri üzerinde durulmaktadır. Sonrasında bu tekniklerin tarihçesi ve söz konusu tekniklere ilişkin etik tartışmalar ile bunların çeşitleri incelenmiştir. Bölüm, uygulamanın İslam hukukundaki yaklaşımlarına yer vererek sonlandırılmıştır. İkinci bölümde taşıyıcı annelik; tanım, tarihçe, çeşitleri ve başvurulma nedenleri bağlamında incelenmiş ve taşıyıcı anneliğe etik, psikolojik ve sosyolojik açılardan yöneltilen eleştirilere yer verilmiştir. Çalışmanın üçüncü bölümünde taşıyıcı anneliğin hukuki boyutu Sünnî ve Şiî yaklaşımlar ekseninde ele alınmış, uygulamanın maslahata uygun olup olmadığı taşıyıcı anneliğe dahil olan bütün taraflar açısından değerlendirilmiş ve konu nesep, velayet ve kira akdi gibi hususlar çerçevesinde işlenmiştir."
