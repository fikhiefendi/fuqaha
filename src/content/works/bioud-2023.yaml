abstract: "Makâsıd kavramı, İslam Fıkhında içtihadî yorum ve fetvaların verilmesinde önemli bir yere sahiptir. Bireylerin ve toplumların hayatı ile ilgili Şari'in buyruklarını anlamak ve O'nun muradına uygun hükümler üretmek, tüm fakihlerin görevleri kapsamındadır. Şari'in buyruklarını kavramak, kişiyi yüzeysel sonuçlardan uzaklaştırır ve nasların ruhuna uygun hükümler elde edilmesinde etkili olur. İslam'da, malların ve mülklerin elde edilmesi, korunması, mübadelesi, tüketilmesi ve infakı çok önemli bir yere sahiptir. Bu araştırma, mallarla ilgili bedelsiz harcamalardan yani infak odaklı faaliyetlerden kaynaklanan meşru amaçların tespit edilerek malların zekatının verilmesi, bağışlar yapılması, vakıfların kurularak sürekli mali yardımların icrası, diğer kişilere yönelik nafaka harcamalarının sırlarını ve hedeflerini öğrenmeyi amaçlamaktadır. Mali harcamaları kontrol altında tutmak ve Şari'in muradına uygun olarak en üst seviyede ve öncelikler belirlenerek yönlendirme yapmak önemli görülmüştür. Bununla birlikte, ihtiyaçları öncelik sırasına göre dikkate alarak harcamaları düzenlemek ve en iyi şekilde yönlendirmek gerekli olup, öncelik sırasına göre zorunlu ihtiyaçlar, sonra gerekli ihtiyaçlar ve en sonunda da tahsiniyat kabilinden olan refah kapsamındaki harcamaları esas alınarak icra edilmesi önemli görülmüştür. Çalışma, altı bölümden oluşmakta olup ilk dört bölümde konunun teorik yönü ele alınmıştır. İnfak etmenin hedeflerinin çeşitleri ve bunlara riayet etmenin faydaları, dereceleri ve gayelerin gerçekleştirilmesindeki kurallar ele alınmıştır. Son iki bölüm, mali infakların uygulama yönüne odaklanmıştır ve amaçların önceliklendirilmesinin etkilerini göstererek infak eylemleri ile ilgili sorunların formüle edilmesini merkeze almıştır."
