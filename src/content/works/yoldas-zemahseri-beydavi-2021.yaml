abstract: "Zemehşeri, el-Keşşaf tefsirinde fıkhi ayetlerini kısa olarak açıklamıştır. Açıklamalarında kendisinden önce yazılmış olan tefsirlerden yararlanmıştır. İtikatta bağlı olduğu Mutezile mezhebinin görüşlerine fikhi ayetlerinde yer vermemiştir. Kendisi ameli mezhepte Hanefi mezhebine bağlı olduğu anlaşılmaktadır. Mezhepler arasındaki ihtilaflı meseleleri açıklarken hem Hanefi mezhebinin hem de Şafii mezhebinin görüşlerini belirtmiştir. Beydavi de Enveru't-Tenzil ve Esraru'-Tevil tefsirinde fıkhi ayetleri kısa olarak açıklamıştır. Açıklamalarında kendisinden önce yazılmış olan tefsirlerden yararlanmıştır. Özellikle Razi'nin Mefatihu'l-Gayb ve Zemahşeri'nin (ö. 538/1144) el-Keşşaf tefsirlerinden yararlandığı anlaşılmaktadır. Beydavi, fıkhi ayetlerini ehl-i sünnet mezheplerinin görüşleri çerçevesinde açıklamıştır. Kendisi Şafii mezhebine bağlıdır. Ayetlerin açıklamalarında hem Şafii hem de Hanefi mezheplerinin delillerini vermektedir. Bazı yerlerde Şafii mezhebinin görüşünü verirken“bize göre”şeklinde vermektedir. Nesefi de Zemahşeri ve Beydavi gibi fıkhi ayetleri kısa olarak açıklamıştır. Açıklamalında kendisinden önce yazılmış olan tefsirlerden yararlanmıştır. Özellikle el-Keşşaf tefsirinden çok yararlanmış ve birçok yerde onun ibaresi el-Keşşaf'ın ibaresi ile aynı olmuştur. Nesefi, Hanefi mezhebine mensuptur. Mezhepler arasındaki ihtilaflı meselelerini verirken Hanefi mezhebine“bize göre”şeklinde verip Şafii mezhebinin görüşünü de karşı görüş olarak vermektedir. Genel olarak fıkhi ayetlerinin tefsirinde her üç müfessirinin açıklamaları kısa ve birbirine yakın olmuştur. Bununla birlikte her müfessirin kendine has ve özgü metodu vardır."
