abstract: "Bu tez ?The Message of the Quran? adlı eseriyle son zamanların en çokkonuşulan isimlerinden biri olan Muhammed Esed'i (1900-1992) tanıtmayı ve Esed'inmealdeki tutumunu ve ahkâm âyetlerine yaklaşım tarzını tespit etmeyi hedeflemektedir.Bu bağlamda onun bazı delil ve gerekçelerle başlangıçtan beri slam alimleri tarafındankabul edilen anlamlarından farklılık arzeden ahkâm âyetlerini çevirisine ve tefsirinedikkat çekilmiştir.Araştırma, bir giriş ve üç bölümden oluşmaktadır. Aynı zamanda birnci bölümolan giriş bölümü Esed'in hayatını, kişiliğini ve eserlerini kısaca, ?The Message of theQur'an? adlı eserini daha ayrıntılı bir şekilde tanıtmayı amaçlamaktır. kinci BölümdeMuhammed Esed'in ?Meal-Tefsirin? de yararlandığı kaynaklar ele alınmış, hadislere vesahabeden gelen rivayetlere karşı tutumu tespit edilmiştir.Üçüncü bölümde, Muhammed Esed'in kıssalara yaklaşımı, nasih ve mensuhhakkındaki görüşleri, kavramlara sözlükler desteğiyle anlamlar verişi vs. ortayakonulmuş ve Esed'in çeviri ve tefsir metodu tanıtılmıştır.Esed'in ahkam ayetlerini çeviri ve tefsirine ayrılan Dördüncü Bölümde iseEsed'in kabul ettiği gerekçe ve deliller üzerinde durulmuş, geçerlilik ve tutarlılıklarıdeğerlendirilmiştir."
