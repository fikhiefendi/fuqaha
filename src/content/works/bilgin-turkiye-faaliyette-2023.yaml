abstract: "Bankacılık sistemi içerisinde Katılım bankacılığı gün geçtikçe gelişen ve bankacılık sektörü içindeki payı giderek artan bir bankacılık türüdür. Ülkemizde 1983 yılında 'özel finans kurumu' kurulmasına izin verilmiş ve bu kurumlar 1985 yılında ilk faaliyetlerine başlamışlardır. Bankaların zaman geçtikçe yaygınlaşması müşterilerin talep ve beklentilerini de artırmıştır. Bankalar odaklarını müşteriye çevirmişlerdir. Özellikle bireylerin dini hassasiyetlerini ön plana çıkaran Katılım bankalarının yaygınlaşması, bu bankaların finansal açıdan iyi bir noktada olup olmadıklarını düşündürmektedir. Bu amacı yerine getirirken Türkiye'deki Katılım bankalarının etkinliklerini karşılaştırmak amaçlanmıştır. Bu amacı yerine getirirken Türkiye'deki kamu ve özel sermayeli Katılım bankalarının 2019, 2020 ve 2021 Aralık ayına ait toplam aktif, özkaynak, net kar, toplanan fonlar, şube sayısı, personel sayısı ve kullandırılan fonlar verileri ile bankaların etkinlik değerlendirilmesi yapılmıştır. Etkinlik değerlendirilmesi yapılırken Veri Zarflama Analizi yöntemi kullanılmıştır. Çalışma sonucunda etkinlik değeri en düşük olan bankanın Albaraka Türk Katılım bankası, en yüksek olan bankanın ise Ziraat Katılım Bankası olduğu sonucuna varılmıştır."
