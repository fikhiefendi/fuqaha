abstract: "Tarih, genel olarak rivayetler, destanlar ve geçmiş dönemdeki insanlardan günümüze intikal eden bulguların mantıksal bir çerçevede değerlendirilmesi sonucunda yazılırken, Şer'iyye Sicilleri, tarihi somut verilere dayandırıp, gelecek kuşaklara aktarılmasını sağlayan önemli kaynaklardandır. Çermik, 399 nolu Şer'iyye sicillinden de anlaşılacağı üzere Müslümanların, Hristiyanların ve kısmen de olsa Yahudilerin huzur ve güven içinde yaşadığı bir yerdir. Bir bakıma Osmanlı Devleti'nin sosyal yapısını örnekleyen bir şehir konumundadır. Çermik'te farklı dinlere mensup kişiler farklı mahallelerde yaşamış, sosyal ve ekonomik açıdan da oldukça sıkı ilişkiler içinde olmuşlardır. Müslümanlar genellikle ziraat, askerlik, tarım ve hayvancılık işleriyle uğraşırken; Hıristiyan dinine mensup olanlar ise ticaret ve sanat gibi ekonomik faaliyetler ile uğraşmışlardır. Bu çalışmamada 1330-1336(1912/1918) yılları arasında Çermik kazasının mahalleleri, köyleri, sosyal yapısı, ekonomik faaliyet alanları, o dönemde yaygın olarak kullanılan şahıs adları, şehir, kaza ve köylerde yaşayan dini gruplar ve bunlar arasındaki sosyal ilişkiler yansıtılmaya çalışılmıştır."
