abstract: "Bu araştırmada, Molla Hüsrev'in Hâşiye âlâ Envâri't-Tenzîl ve Esrâri't-Te'vîl adlı eserinin 168 - 249 Sayfaların tahkiki yapılmış ve bir inceleme yazısı eklenmiştir. Eser Beyzâvinin tefsiri olan Envâri't-Tenzîl ve Esrâri't-Te'vîl eserinin Hâşiyesi olup Fatiha suresi ve Bakara suresinin 1. Ayetinden 140. Ayetine kadar olan kısmını içermketedir. Eserin tahkikinde üç yazmadan faydalanılmıştır. Tahkikte İslamî Araştırmalar Merkezi'nin (İSAM) esaslarına uyulmuştur. Diğer nüshalardan daha titiz yazıldığı için ح ile gösterilen nusaha esas alınmıştır. Müellifin alıntı yaptığı eserlerin tespiti yapılmış, ayetler gösterilmiş ve hadisler tahriç edilmiştir. Eserde zikredilen gayr-ı ma'ruf isimler tanıtılmış ve eserlere müracat etmek isteyen araştırmacılar için kaynakçaya yer verilmiştir. Açıklanması gereken kelimeler ve eserler dipnotta izah edilmiş, imla kurallarına da riayet edilmiştir."
