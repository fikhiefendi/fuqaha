abstract: "ıu ÖZET Faizsiz Bankalar, mevduat toplanma ve fon kullandırma işlemlerinde geleneksel bankalardan farklılık gösterirler. Mevduat toplarken“Garantili Vedia”,“Mudarebe”ve“Vekalet”sözleşmelerini kullanırlar. Fon kullandırmada ise“Mudarebe”ve“Vadeli Alışveriş”sözleşmesi kullanırlar. Bu nedenle farklı muhasebe tavrına gerek duyulur ve mali tabloların sunuluşunda farklılıklar olur. Bu çalışmanın odak noktası merkezi Bahreyn'de bulunan İslam Bankaları ve Finansal Kuruluşlar için Muhasebe ve Denetim Teşkilatı tarafından yayınlamış bulunan muhasebe standartlarım incelemek ve Türk Özel Finans Kurumları'nın mali tabloları ve açıklamalarını l.nolu“Mali Tabloların Sunumu ve Açıklamaları”standardı ile karşılaştırmaktır. Ayrıca yine karşılaştırma amaçlı olarak, ve daha derin bir görüş sağlamak amacıyla dünyadaki ulaşabildiğimiz bazı diğer faizsiz bankaların mali tabloları da incelenmiştir. Türk Özel Finans Kurumlarındaki muhasebe yöneticileri, faizsiz bankaların finansal muhasebe ve raporlama konusundaki özelliklerini anlamadaki eksiklikleri nedeniyle, yayınladıkları mali tabloların yeterli bilgi sunduğunu düşünmektedirler. Ancak yaptığımız çalışma ortaya koymuştur ki, Türk özel Finans Kurumları arasında ve bazı diğer uluslararası faizsiz bankalar arasında karşılaştırma yapıldığında mali tablolarda terim birliği, yeterli bilgi derecesi, ve sunuş açısından farklılıklar vardır. Standard açısından Türk özel Finans Kurumları'nın mali tabloları ve açıklamaları yeterli olmamaktadır."
