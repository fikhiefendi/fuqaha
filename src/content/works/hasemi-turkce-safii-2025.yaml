abstract: "İlmihal kelimesi kişinin amelî ve dinî bilgileri pratik ve kolay öğrenmesini sağlaması anlamına gelmektedir. Bu bilgileri ihtiva eden eserlere de aynı isim verilmiştir. İlmihal eserleri Osmanlı döneminden günümüze kadar toplumun ameli ve dinî bilgileri kolayca öğrenmesini sağlayan baş ucu eserlerinden olmuştur. Ülkemizde halkın büyük çoğunluğu Hanefî mezhebine mensup iken, Doğu ve Güney Doğu bölgelerinde halkın çoğunluğu Şâfiî mezhebine mensuptur. İlmihal eserleri en çok Hanefî mezhebine göre yazılmışken Şâfiî mezhebinde yazılan ilmihal eserleri oldukça azdır. Hanefi mezhebinde yazılan ilmihaller, bu mezhebe mensup bireylerin dinî bilgi ihtiyacını karşılarken Şâfiî mezhebine mensup bireyler için ihtiyacı karşılamada yetersiz kalmıştır. Bu çalışmadaki temel amaç Türkçe yazılmış Şâfiî ilmihallerin üslup, konu dağılımı, güncel meseleleri ele alma bakımından incelenmesidir. Tez çalışmamızın sonucunda genel olarak Şâfiî ilmihallerinde sade ve anlaşılır bir üslup kullanıldığı, ibadet konularına ağırlık verildiği, kadın ve güncel meselelere yeteri kadar yer verilmediği tespit edilmiştir."
