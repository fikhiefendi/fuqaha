abstract: "İslam borçlar ve eşya hukukunun temel terimlerinden biri olan mal kavramının mahiyeti, bu kavramla ilişkili olan menfaat ve deyn kavramlarının mal kapsamında değerlendirilip değerlendirilemeyeceği, İslam hukuk mezhepleri arasında temel tartışma konularından olmuştur. Kaynaklarda mal kavramının mahiyeti, mal-menfaat ve mal-deyn ilişkisi; mal türleri ve bu ayrımlara bağlanan hukuki işlemlere ait yeterli malumat mevcut olmakla birlikte bunların toplu olarak Türk hukukçularına sunulması gerekmektedir. Zira İslam hukukunun kendine özgü sistematiğinden kaynaklı olarak mal kavramını ve mal türlerini, tek bir başlık altında bulmak mümkün değildir. Mevzubahis sorunlar hakkında günümüz İslam hukukçuları tarafından yapılan çalışmalar incelendiğinde Arapça kaynaklarda görülen zenginliği, Türkçe kaleme alınan çalışmalarda müşahede etmek mümkün değildir. Çalışma boyunca genel olarak –hususen birinci bölümde- Hanefi mezhebine ait fıkıh ve usul kaynakları incelenmiştir. Bu kaynakların yanında hem Arapça hem de -gerek Osmanlı döneminde gerekse sonraki dönemlerde- Türkçe yazılmış makale, tez ve kitaplar araştırılmıştır. Özellikle Mecelle ve Mürşidü'l-hayrân'ın ilgili düzenlemeleri mukayese edilmiştir. Yer yer bazı meselelerin pratikteki karşılığı için fetva ve mahkeme kararı örnekleri zikredilmiştir. Neticede mal kavramının maddi/cismani ve ekonomik unsurdan oluştuğuna ve buna bağlı olarak menfaat ve deynin mal olarak değerlendirilemeyeceğine kanaat getirilmiştir. Mal kavramının ekonomik değere sahip ayn, yani maddi/cismani varlığa sahip bir şey olduğu tespit edildikten sonra mal türleri, üç temel başlıkta toplanmış ve bu başlıklar hukuki değer taşımak, piyasada değer farkı olmaksızın mevcudiyet ve nakledilebilirlik olmak üzere genelden özele doğru sıralanmıştır."
