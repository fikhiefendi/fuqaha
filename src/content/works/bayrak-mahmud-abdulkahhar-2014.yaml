abstract: "Mahmûd b. Abdülkahhâr'ın Şerhu'l-Ma'fuvvât adlı eserindeki konuların mezhepler arası mukayesesi ve değerlendirilmesi“ adlı çalışmamızda, Ma'fuvvât kavramının anlamını netleştirip sınırlarını çizdikten sonra ilgili kavramları da verip Ma'fûvvât'ı somutlaştırmaya çalıştık. Çalışmamızı yapılandırırken, âyeti kerimeleri ve hadisi şerifleri temel kabul etmenin yanı sıra mezheplerin yorumlarından da yararlandık. Konumuz bir giriş ve iki bölümden oluşmaktadır. Giriş bölümü; araştırmanın konusu, amacı, önemi, yöntemi ve literatür değerlendirmesi kısımlarından oluşmaktadır. Birinci bölümde, çalışmamızın konusu olan ”Şerhu'l-Ma'fuvvât“ adlı eserin müellif'inin hayatını, ilmi kişiliğini, hocalarını, talebelerini ve eserlerini tanıttık ve Ma'fuvvât kavramının sözlük anlamını, kavramlaşma sürecini, tanımını, Ma'fuvvât kavramının irtibatlı olduğu bazı kavramları ve Ma'fuvvât'a dâir eserleri değerlendirip geniş bilgi vermeye çalıştık. İkinci bölümde, Ma'fuvvât konularının temelini oluşturan ”Necâset“ kavramının tahlilini yaptık. Ardından mezheplere göre necâset kısımlarını ele aldık. Daha sonra Şâfiî mezhebine göre yazılan ”Şerhu'l-Ma'fuvvât“ adlı eseri esas alarak çalışmamızın ana konusu olanMa'fuvvât konularının, önce ”Şerhu'l-Ma'fuvvât\"taki hükmünü belirttik. Ondan sonra da konularındört mezhebe göre mukayese ve değerlendirmelerini yapıp çalışmamızı sonuç ve değerlendirme başlığıyla tamamladık."
