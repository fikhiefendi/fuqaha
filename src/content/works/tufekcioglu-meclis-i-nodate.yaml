abstract: "Tanzimat'la ortaya çıkan modern devlet düzeninde geleneksel yapılar hayatiyetlerini devam ettirmek için yeni formlara bürünerek kurumsal değişiklikler geçirmişlerdir. Şerʻî kurumların kendisine bağlı olduğu bir tür bakanlığa dönüşmüş olan Meşihat de bu değişimden payını almıştır. Bu süreçte Meşihat bünyesinde kurulan meclislerden biri olan Meclis-i Tedkîkât-ı Şerʻiyye de şerʻiyye mahkemelerinde verilen kararların incelendiği bir kurum olarak kendini göstermiştir. Fransa hukuk sisteminden ilhamla ortaya çıkan nizamiye mahkeme sisteminde var olan yargı denetimine karşılık Meşihat'in öne sürdüğü alternatif Fetvâhâne ve Meclis-i Tedkîkât-ı Şerʻiyye'den oluşan ikili bir şerʻî temyiz modeliydi. Bu modelde yargı kararı öncelikle Fetvâhâne tarafından ilam üzerinden tetkik edilir, ardından Meclis-i Tedkîkât-ı Şerʻiyye tarafından olay incelemesi için tahkikat kısmına gönderilirdi. Bu iki kurum yargı kararlarına dair klasik fıkıh birikiminin uygulamasını gerçekleştirirken özellikle tahkikat aşamasında nizamiye mahkemelerini de sürecin bir parçası kılmaya çalışmıştır. Fetvâhâne ve bilhassa Meclis-i Tedkîkât-ı Şerʻiyye'ye ait defterler özelinde yapılan bu çalışmada itiraz edilen davalar itiraz konularına göre taksim edilerek ayrıntılı olarak incelendi. Tetkik ve tahkikat aşamaları özetlenerek itiraz hakkında şerʻî temyiz kurumlarının kararları değerlendirildi."
