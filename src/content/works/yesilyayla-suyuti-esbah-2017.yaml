abstract: "Fıkıh ilminin teşekkül etmesiyle birlikte fıkhî müktesebâtın farklı bakış açılarıyla etüt edilmesi sonucunda kavâid, fürûk, eşbâh ve'n-nezâir, nevâzil, vâkıat, fetvâ, şerh, hâşiye, muhtasar, manzume ve tehzîb gibi konuları ele alış tarzı, amaç ve işlevleri gerek muhtevâ yönüyle gerekse teknik açıdan birbirinden farklı yazım türleri ortaya çıkmış ve zamanla fıkıh ilmine dair zengin bir literatür meydana gelmiştir. Zaman içerisinde fakihlerin çalışmaları sonucu oluşan bu alt edebî türlerin, fıkıh ilminin dinamik yapısına işaret etmekle beraber, hükümlere ulaşmada büyük bir kolaylık sağladığını belirtmek gerekir. Fer'î mes'eleler arasındaki benzerlik ve farklılıkları konu edinen el-Eşbâh ve'n-nezâir ilmi de bu yazım türlerinden biridir. Bu çalışmada genelde kavâid edebiyatı, özelde ise el-Eşbâh ve'n-nezâir ilmi açısından önemli bir yer ihraz eden Celâleddin es-Süyûtî'nin el-Eşbâh ve'n-nezâir fi kavâid ve fürû'i fıkhi'ş-Şâfi'iyye isimli eseri incelenmektedir. Bu çerçevede ilmî açıdan velûd bir kişiliğe sahip olan Süyûtî'nin hayatı hakkında oldukça vecîz bilgiler verildikten sonra konumuzla yakından bağlantılı olması dolayısıyla kavâid terimi ve tarihsel gelişimi incelenerek kısaca ele alınmıştır. Birinci bölümde çalışmamızın asıl konusunu teşkil eden el-Eşbâh ve'n-nezâir ilminin gerek teorik gerekse pratik arka planı ele alınmış ve Süyûtî'nin eseri muhtevâ ve metod açısından incelenmeye tabi tutulmuş ardından aralarındaki farklılık ve benzerlikleri tespit etmek amacıyla aynı isimle yazılmış diğer çalışmalarla mukayese edilmiştir. Eserde geçen kaynak, ıstılah ve isimlerin incelendiği son bölümde Süyûtî'nin beslendiği fıkhî miras tespit edilmeye çalışılmış ve Şâfiî mezhebinde kavram ve ıstılahların gelişimi açısından önemli bir zamana tanıklık eden mezkûr eserde kavram ve ıstılahların gelişiminin izleri sürülmüştür."
