abstract: "Bu çalışma Hz. Peygamber'in uygulamış olduğu şer'î cezaları içermektedir. Hz. Peygamber yaklaşık yirmi üç yıllık tebliğ görevini gerçekleştirirken her zaman rahmet yolunu seçmiş, muhatabına yumuşak davranmıştır. Şahsî meselelerinde intikam duygusundan uzak durmuş affetme yolunu seçmiştir. Ancak toplumun düzeni için, hak ve hukuk adına Hz. Peygamber'in bazı cezalar uyguladığını görmekteyiz. Hz. Peygamber'in uygulamış olduğu bu cezalar Kur'an'da yer alan cezalar ve Allah rasûlünün dinin açıklayıcısı ve devlet yöneticisi vasfı ile uygulamış olduğu cezalardan oluşmaktadır. Cahiliye dönemi gibi sosyal adalet ve düzenin zayıf olduğu bir topluluğu, saadet asrına ulaştıran Hz. Peygamber'in uygulamaları günümüz toplumunda ahlaksızlıkların açıkça yaşandığı, cinayetlerin adam yaramalarının arttığı hak ve hukukun ihlalinin yaşandığı bir toplum için son derece önem taşımaktadır. Zira toplum düzenini bozan, kişi hak ve hürriyetlerini ihlal eden kimselere hak ettiği cezâ-i müeyyideleri uygulamadan, caydırıcı bir takım cezalar vermeden huzurlu bir toplumun olması mümkün değildir."
