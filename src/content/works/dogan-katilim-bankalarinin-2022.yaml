abstract: "Faizsizlik prensipleri doğrultusunda faaliyet gösteren katılım bankaları, bankacılık sektörü dolayısı ile ülkemiz ekonomisi açısından oldukça büyük önem arz etmektedirler. Faaliyet göstermeye başladığı günden itibaren günümüze kadar ciddi bir büyüme eğilimi gösteren katılım bankacılığı sektörünün, söz konusu büyümeyi sürdürebilmesi ve amaçlarına ulaşması için sağlıklı yürütülen denetim faaliyetine ihtiyaç duyulmaktadır. Ülkemizde faaliyet gösteren katılım bankalarının denetim faaliyetleri henüz faizsizlik prensipleri çerçevesinde gerçekleştirilmemektedir. Uluslararası alanda ise birçok ülkede faizsizlik prensipleri çerçevesinde faaliyet gösteren katılım bankalarının, finansal raporlama ve denetim standartları da faizsizlik prensipleri çerçevesinde düzenlenmiş bulunmaktadır. Bununla birlikte, ülkemizde faaliyet gösteren katılım bankalarının denetim faaliyetleri açısından da faizsizlik prensipleri doğrultusunda yürütülmesi adına Kamu Gözetimi Muhasebe ve Denetim Standartları Kurumu (KGK), 2019 yılında The Accounting and Auditing Organization For Islamic Financial Institutions (AAOIFI) tarafından yayımlanan denetim stadartlarının çevirisini yaparak, katılım bankalarının ihtiyari kullanımına sunmak üzere, Faizsiz Finans Denetim Standartlarını yayımlamıştır. Çalışmamızın amacı, AAOIFI tarafından yayımlanan söz konusu denetim standartlarını aktif olarak uygulayan ülkelerde faaliyet gösteren katılım bankalarının hem genel denetim standartlarına hem de Faizsiz Finans Denetim Standartlarına uyum düzeylerinde artış yaşanması durumunda finansal performanslarında da artış yaşanıp, yaşanmayacağının tespit edilmesidir. Böylece, ülkemizde faaliyet gösteren katılım bankalarının, KGK tarafından yayımlanan Faizsiz Finans Denetim standartları ile uyumlu denetim faaliyetlerini gerçekleştirmeye başlaması durumunda, finansal performanslarında artış yaşanıp, yaşanmayacağı konusunda öngörü oluşturulmaya çalışılmıştır. Çalışmamız dört bölümden oluşmakta olup, ilk üç bölüm konu ile ilgili teorik açıklamaları içermektedir. Dördüncü bölüm ise, ilk üç bölüm kapsamında teorik açıklamalarına yer verilen konuların çalışma amacımız doğrultusundaki etkisini inceleyen uygulamadan meydana gelmektedir. Uygulamada öncelikle, çalışma örneklemimize dahil olan katılım bankalarının denetim standartlarına uyum düzeylerinin tespit edilebilmesi amacı ile 2011- 2020 yılları arasında Durum Analizi (Case Study) Yöntemi kullanılmıştır. Uygulamanın ikinci aşamasında ise, durum analizi aracılığı ile denetim standartlarına uyum düzeyleri tespit edilen katılım bankalarının finansal performanslarının ölçülmesi için ilgili yıllar itibari ile TOPSIS (Technique for Order Preference by Similarity to Ideal Solution) Yöntemi kullanılmıştır. Çalışma sonuçlarımız doğrultusunda, AAOIFI tarafından yayımlanan Faizsiz Finans Denetim Standartlarını gönüllü (aşamalı) olarak uygulayan ve çalışma örneklemimize dahil olan katılım bankalarında, denetim standartlarına uyum düzeyleri arttıkça finansal performanslarında da artış yaşandığı tespit edilmiştir."
