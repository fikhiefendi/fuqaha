abstract: "İstisna akdi en genel haliyle bir kişinin, nitelikleri önceden belirlenmiş bir eseri imal etmesi için yapılan sözleşme anlamına gelir. Özellikle Hanefi fıkhında mülkiyeti nakleden akid türlerinden biri olarak görülür. İstisna akdi; hukuki niteliği, müstakil bir akid olup olmadığı, benzer akidlerle olan ilişkisi, akdin neyi konu aldığı, şartları ve bağlayıcı bir akid olup olmadığı hakkında, bilhassa Hanefi mezhebi içinde geniş tartışmalara konu olmuştur. Daha çok istisna akdinin klasik kaynaklarda nasıl ele alındığına yönelik olarak yapılan bu çalışmada, akdin teorik boyutu, analitik bir biçimde ortaya konmaya çalışılmıştır. Buradan hareketle, sayılan tartışma alanlarında oluşan sorulara cevaplar aranmıştır. İstisnaya, konusu ayn ve menfaatten oluşan, icare ve satım akidlerinin karması olan yeni bir akid türü olarak yaklaşılmasının, söz konusu tartışma alanlarına daha net cevaplar verebilecek bir yaklaşım tarzı olduğu görülmüştür. İstisna akdinin bağlayıcılığı meselesi ise, örfün istisna akdindeki yeri ve örfün değişkenlik özelliğiyle yakından ilgilidir."
