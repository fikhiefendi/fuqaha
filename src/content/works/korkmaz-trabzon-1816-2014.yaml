abstract: "Osmanlı mahkeme kayıtları da diyebileceğimiz şer'iye sicilleri; Osmanlı Hukuku'nun uygulamasını göstermesi ve bünyesinde çok çeşitli konularda kayıtlar bulundurması bakımından eşsiz öneme sahip belgelerdir. Bu çalışmada Trabzon şer'iye sicilleri arasında elimize ulaşan en eski ikinci tarihli defter olan ve 1560-1561 yıllarını kapsayan Trabzon'un 1816 numaralı şer'iye sicili hukuki açıdan bir tasnife ve değerlendirmeye tâbi tutulmuştur."
