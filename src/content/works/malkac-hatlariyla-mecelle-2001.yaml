abstract: "ÖZET Türk Hukuk tarihinde önemli bir yere sahip olan Mecellenin, özellikle hukuk sahasında kendi döneminde verdiği hizmetin ele alınması hukuk tarihi bakımından büyük önem arz etmektedir. Biz bu araştırmamızda ilk Türk Medeni Hukuku olan mecelle hakkında genel olarak bütün yönleri ile ilgili, kavram yerindeyse bir özet çıkarmaya çalıştık. Bunun yanında Mecelle hakkında bu özet bilgiyle yetinmeyip daha fazla bilgiye ulaşmak isteyenler ve Mecelle etrafında araştırma yapmak isteyenler için son bölümde Mecelle ile ilgili yapılan çalışmaların bibliyografyasını hazırladık. Bu bibliyografya kısmında yapılan çalışmaların kısaca tanıtımlarım da yaptık. Araştırmamız iki bölümden oluşmaktadır. Birinci bölümde, ana hatlarıyla Mecelle-i Ahkam-ı Adliye üzerinde durduk. Öncelikle Mecellenin hazırlanış sebeplerini ele alırken Tanzimat dönemi hukuki gelişmelerini ve kanunlaştırma hareketlerini inceledik. Bir medeni kanunun hazırlanmasında batı ülkelerinin etkisini ve bu medeni kanuna olan ihtiyaç gibi sebepleri ele aldık. Medeni kanunun kaynağı hususundaki farklı yaklaşımları, Mecellenin hazırlanışını ve yürürlüğe girişini, Mecelle Cemiyetinin kuruluşundan kaldırılışına kadar olan süreçten ve dayandığı kaynaklardan da bahsettik. Mecelleye yapılan tenkitleri, Mecelleyi tadil ve tamamlama çalışmalarını, özellikle kurulan komisyonları ele aldık. Bu bölümü ' Mecellenin yürürlükten kaldırılmasının nedenleri ile Arap dünyasındaki etkisini ve tatbikatını ele alarak bitirdik. İkinci bölümde ise, Mecelle-i Ahkam-ı Adliye üzerine yapılan çalışmaların bibliyografyasını hazırladık. Bu bibliyografya çalışmamızı Mecelle üzerine yapılan şerh çalışmaları ve müstakil çalışmalar şeklinde bölümlendirdik. Şerh çalışmalarını; genel şerh çalışmaları,genel hükümlerin(Kavaid-i Külliye) şerhleri ve Mecelleni belirli kitaplarla(Bablar) ilgili şerhleri diye sınıflandırdık. Yapılan müstakil çalışmaları ise; kitap çalışmaları ve makale, ansiklopedi maddeleri ve diğer mütalaalar şeklinde ayırdık. Genel olarak Mecelle üzerine yapılan çalışmaları elde etmede; İSAM Kütüphanesi, Marmara Üniversitesi İlahiyat Fakültesi Kütüphanesi, Beyazıt Devlet Kütüphanesi, İstanbul Üniversitesi Merkez Kütüphanesi ve Ankara Diyanet İşleri Başkanlığı Kütüphanelerinden ve koleksiyonlarından istifade ettik. Mümkün olduğunca Mecelle üzerine yapılan çalışmaların tümüne ulaşmaya gayret ettik. Ancak ulaşamadığız ve gözden kaçırdıklarımız çalışmalar olmuş ise mazur görülmemi umarım. Ulaştığımız bütün çalışmaların, Mecelle ile ilgili araştırma yapmak isteyenlerin neticeye daha çabuk ulaşabilmelerim sağlayabilmek için kısaca içeriklerini tanıtmaya çalıştık. Yazan belli olmayan bazı çalışmaların başına“YBD”rumuzunu koyduk."
