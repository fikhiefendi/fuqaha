abstract: "Dil, sistemli bir araçtır, insanların duygu ve düşüncelerini birbirlerine iletmelerini sağlar. Toplumsal hayatın temel ihtiyaçlarından biri olan iletişim, dil sayesinde tarihsel varlığını oluşturmuştur. Sosyal birer varlık olan dillerin birbirlerine etkileşimi sayesinde, eski dünya medeniyetleri, modern insana köklü, zengin ve evrensel bir miras bırakmışlardır. Her dilin kendine özgü unsurları, kuralları ve özellikleri vardır. Kökeni farklı dil ailelerine dayanan Arapça ve Türkçe dillerinin de kendilerine özgü yapıları, ortak ve farklı özellikleri mevcuttur. Elbette ki her dil kendine özgü bir yapıya sahiptir. Yeni bir dil öğrenen herkeste olduğu gibi ana dili farklı olan bireyler Arapça öğrenirken de çeşitli güçlüklerle karşılaşmaktadırlar. Bu durum Arapça öğrenen Türkler için de geçerlidir. Arapça hem köken hem de yapı bakımından farklı dil ailesine mensup bir dil olduğu için Arapça öğrenim güçlüğü daha fazla ön plana çıkmaktadır. Hedef dil, anadiliyle karşılaştırılmalı, aradaki farklar ortaya konulmalı ve böylece öğrencinin karşılaşacağı güçlükler saptanmalıdır. Arapça ile Türkçe arasında birbirine benzerlikler olduğu gibi farklılıklar da vardır. İki dil cümle açısından karşılaştırıldığında ortaya çıkan tespitlerin, hem dilbilim hem de dil öğretimi bakımından faydaları vardır. Benzerliklerin olması karşıtsal çözümleme teorisi görüşüne göre öğretimde kolaylık sağlamaktadır. Dolayısıyla, benzerlik ve farklılıklar ortaya konduktan sonra bu iki özelliğe göre öğretimi gerçekleştirmek verimli ve nispeten daha kolay olacaktır. Bu çalışmada, Arapça ve Türkçede fiilimsilerin özellikleri ve çeşitleri ele alınıp, benzer ve farklı yönleri karşıtsal çözümleme yoluyla ortaya konulmuş, ortak ve farklı yönleri tespit edilmeye çalışılmıştır. Karşıtsal çözümleme, anadili ile hedef dil arasındaki benzerlikleri ve ayrılıkları incelemektedir. Bu incelemeler hassaten farklılıklar üzerinde yoğunlaşmaktadır. Türkçenin ve Arapçanın unsurlarından fiilimsilerin, bu dillerin kendi mantıkları çerçevesinde incelenmesi daha sonra da karşılaştırmalı olarak ele alınıp değerlendirilmesi; dil öğrenim ve öğretim sürecinde ve diller arası aktarımda karşılıklarının daha düzgün ve anlaşılır ibarelerle ifade etmede fayda ve kolaylık sağlayacaktır."
