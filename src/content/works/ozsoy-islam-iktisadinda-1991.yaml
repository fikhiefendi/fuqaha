abstract: "- 348 - si olması itibariyle ve meşru ölçüler içinde kalınması şartıyla, devletin, ihtiyaçlarını kendi imkanlarıyla karşılayamayan vatan daşlarına karşılıksız olarak yardım etmekle yükümlü olduğu kabul edilirse, bu takdirde, devletin kamu kurumları vasıtasıyla vatan daşlarına verdiği bu negatif faizi devletin“yardımı' ve ”bağışı' olarak değerlendirmek mümkün olabilir. Kur 'an 'da fais ayetlerinin (Bakara, 275-6-8-9) hemen a- kabinde gelen,“Borçlu darda ise, varlığa kavuşuncaya kadar ona süre tanıyın; borcu bağışlamanız ise, bilseniz, sizin için daha hayır lıdır. ”(Bakara, 280) ayeti bu meseleye ışık tutabilir. 6. Sonuç ve özet Bu sonuncu bölümde ele aldığımız ve Avrupa'da yükselen kapitalizmin İslam Alemi 'ne sirayet ve nüfuzunun etkisi altında ortaya çıkan bu şüphelerin, özellikle 20. asrın başlarında İslâm Alemi 'nin yaşadığı mağlubiyet ve çaresizlik içinde, kapitalizmin hâkimiyetini peşinen kabullenme psikolojisi ile ortaya çıktıkları görülmektedir. Kur 'an 'da faizin kesin olarak yasaklanmış olması gerçeği karşısında faizin haram olmadığını iddia etme imkanını bu lamayan, fakat kapitalizmin hâkimiyetini kabullenme psikolojisin den de kurtulamayan söz konusu şüphelerin sahibi müellifler, tek yol olarak, Kur 'an 'da yasaklanan asıl faizin katlı ve fahiş rıesie faizi olduğu iddiasına sımsıkı sarılmışlardır. Bu iddia, teferruat taki bazı farklılıklara rağmen bu müelliflerin ortak noktası olmuş tur. Bunlara göre, günümüzde artık şartların değişmesi sebebiyle, faizin haram- kılınmasında en büyük sebep olarak gösterilen zayıfın ezilmesi olayının, ortaya çıkan banka ve büyük şirketlerde görülme-- 349 - diği ve bu sebeple, basit faizin haram kılınma sebebinin ortadan kalktığı, (99) o halde çok yaygın hale gelen ve vazgeçilmesi çok sor olan faizin devlet tarafından kontrol altında tutulan mâkûl ve ölçülü hadlerinin caiz görülmesi gerektiği savunulmaktadır. Buna ve rilecek tek cevap; faizin ödenme yönü ve şekli ne olursa olsun, her halükârda zulüm sebebi olduğunu ve aynı zamanda anaparanın üzerin deki ister riba, ister faiz, ister nema, ister gelir payı densin, az veya çok bütün fazlalıkların haram faiz olduğunu ifade eden şu ayettir:“Eğer tevbe ederseniz, anaparanız sizindir. Böylece ne haksızlık etmiş ne de haksızlığa uğramış olursunuz. ”(Bakara, 279) Şu halde faiz, ne çâredir ne de ondan müstağni olunamaz gibi bir zaruri hal söz konusudur. Keynes gibi 20. asra damgasını vurmuş bir iktisatçının faizi ekonominin sırtında büyük bir kambur olarak görmesi ve risk ihtiva eden yatırımları teklif etmesi ekono milerin ihtiyacı olan çözümün kâr-zarar ortaklığına dayanan yatırım biçimleri olduğu gerçeğini ifade etmektedir. Keynes 'in kapitalist dünya için teklif ettiği bu çözüm yoluna, inançları faizi kesin o larak reddeden müslüman toplumların daha çok ihtiyaç duyduğu muhak kaktır. Milletlerarası planda islam Kalkınma Bankası 'nı ve dünya nın birçok ülkesinde faaliyet gösteren İslâm Bankaları 'nı, Türkiye planında da Özel Finans Kurumları 'nı bu ihtiyacın ortaya çıkardığı sosyo- ekonomik bir vakıa olarak görmek ve bunların asıl fonksiyon ları olan kâr-zarar ortaklığının finansman metodu olarak daha fasla kullanılabilmesi için gerekli tedbirlerin alınması gerekir. (99) Uludağ, s. 236."
