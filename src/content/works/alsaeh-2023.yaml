abstract: "Bu Çalışma, Vakıfların Büyüklüğünü, Parasını Nasıl Yöneteceğini Ve Yatırım Yapacağını Ve Ekonomik Aktiviteye Katkısının Boyutunu Tanıyarak Ve Karşılaşılan En Önemli Sorunlar Ve Engeller Nelerdir Ve Bunların Çözümüne Yönelik Öneriler Sunarak, Libya'daki Vakıf Gerçeğine Işık Tutmayı Amaçlamıştır. Bu Hedeflere Ulaşmak Için, Bu Çalışma Teorik Açıdan Tümevarımsal Yöntemi Izlemiştir. Buna Ek Olarak Tarih Boyunca Vakfın Gelişimini Izlemek Için Tarihsel Yaklaşım Izlenmiş Olup, Bunun Yanı Sıra Vakıf Kurumunun Bazı Yetkilileriyle Yapılan Kişisel Görüşmeler Ve Bilgi Ve Veriler Yoluyla Olguyu Tanımlamak Ve Analiz Etmek Için Betimleyici Analitik Yöntem Kullanılmıştır. Ayrıca Çalışmanın Sonuçlarını Pekiştirmek Için Anket Formlarından Yararlanılmış Olup Bunun En Öne Çıkanları: Vakıflar Ve İslami İşler Genel Heyetinin Devlete Bağlı Olması, Vakfın Ekonomik Rolünü Bileşik Bir Etkiyle Olumsuz Etkilemiştir. Bu Nedenle Vakfın Ekonomik Yönü Pahasına Cami Inşa Etmek, Kuran Ezberlemek Ve Şeriat Ilimleri Öğretmek Gibi Vakfın Dini Yönüne Odaklanılmıştır Ve Ihmal Edilerek Heyet Mali Finansmanında Devlete Bağımlı Kalmış Ve Bu Da Ekonomik Rolünü Engellemiştir. Buna Bağlı Olarak Emlakları Ihmal Edilmiş Ve Yatırım Formülleri Geliştirilmemiştir, Vakıf Büroları Müdürlerinin Kendilerine Tanınan Yasal Ve Idari Yetkileri Kullanmamaları Sonucunda Esas Olarak Gelirlerini Toplamadaki Zayıflıktan Muzdarip Olduğundan, Neredeyse Kiralama Formülüyle Sınırlı Kalınmıştır. İdari Bağlılığının Birkaç Devlet Kurumuna Devredilmesi Nedeniyle Bürokrasi, Karmaşıklık, Idari Istikrarsızlık Ve Örgütsel Istikrardan Muzdarip Olan Idari Aygıtının Zayıf Verimliliğinden Bahsetmeye Bile Gerek Kalmadan, Bu Durum, Kurumun Işleyişinde Kafa Karışıklığına Ve Yalpalamaya Neden Olmuştur. Bunun Sonucunda Ise, Vakfedilen Gayrimenkul Ve Mülklerin Bir Kısmının Satışına Ve Kaybına Sebep Olunmuştur."
