abstract: "İbadetlerde kıyas konusu, Ebû İshâk eş-Şîrâzî (ö. 476/1083)'nin eseri el-Mühezzeb çerçevesinde incelenmiştir. Tezimizin amacı Şâfiî mezhebi açısından ibadetlerde kıyas yapmanın mümkün olup olmadığını; mümkün ise bunun hangi hâl ve şartlarda gerçekleştiğini somut örneklerle ortaya koymaktır. Tezin amacı doğrultusunda ilk önce Ebû İshâk eş-Şîrâzî'nin hayatı için tabakat kitaplarına bakılmıştır. Konunun iyi anlaşılabilmesi için ibadet ve kıyas kavramları için usul eserlerine özellikle Ebû İshâk eş-Şîrâzî'nin Luma'ı üzerinde durulmuştur. Çalışmada usul eserlerinde kıyas yömteminin alanı ile ilgili olarak yapılan tartışmalara değinilmiştir. Bu çerçevede mezheb müctehidlerinin görüşlerine bakılmıştır. el-Mühezzeb'de geçen kıyas örnekleri incelenmiştir. El-Mühezzeb'in ibadetler bölümünde kıyas yönteminin nasıl ve hangi ifadelerle kullanıldığı tezde araştırma konusu edilmiştir. Tezin hedefi doğrultusunda, Şâfiî mezhebinde muamelatta olduğu gibi ibadetler sahasında da kıyasın kullanılabileceği sonucuna varılmıştır. Ancak namazın sayısı, rekâtları, zekâtın oranı gibi ibadetlerde akılla kavranılamayan hususlarda, kıyasın gerçekleşmeyeceği de ortaya konmaya çalışılmıştır."
