abstract: "Hicri I. asrın son çeyreği ile II. asrın ilk çeyreği hadis ilminin tedvini ve tasnifin başlangıcı açısından önemli bir dönemdir. O dönemde yaşayan, hadis ilmine katkısı olmuş âlimlerin ve varsa eserlerinin tanınması önem arzetmektedir. Tabiîn dönemi önemli hadis âlimlerinden biri de Mekhûl ed-Dımeşkî'dir. Ülkemizde Mekhûl hakkında bir çalışmanın yapılmamış olması bir boşluk oluşturmaktadır. Bu boşluğu doldurmak üzere bu çalışmaya ihtiyaç duyulmuştur. Mekhûl ed-Dımeşkî ve Eseri adlı bu çalışmada, Mekhûl'ün hayatı, hadis rivayetindeki yeri incelenmiş ve günümüze ulaşmayan Kitabu's-Sünen fi'l-Fıkh adlı eseri inşa edilmeye çalışılmıştır.Çalışmamız bir giriş ve üç ana bölümden oluşmaktadır:Giriş bölümünde tabiin dönemi üzerinde durularak sahabilerden sonra İslamın bize ulaşmasında tâbiîn'in köprü vazifesi gördüğüne işaret edilmiş, tedvin dönemi ve tasnif döneminin ilk dönemlerinde tâbiîn'in önemi vurgulanmıştır. Yine giriş bölümünde çalışmanın önemi, amacı ve yöntemi kısaca açıklanmıştır.Birinci bölümde Mekhûl'ün ailesinden başlayarak vefatına kadar olan bütün bir hayatı ve ahlâkî kişiliği tespit edilebildiği kadarıyla ortaya konulmaya çalışılmıştır. Çocukluğu, ilk gençlik döneminde esir edilmesi, azad edilmesi, ilim yolculukları, ilmi yönleri ve ahlakî kişiliği tanıtılmaya çalışılmıştır.İkinci bölümde tâbiîliği, hocaları, ilim halkası, genel olarak talebeleri, talebelerinden öne çıkanlar, cerh ve ta'dîl açısından durumu, rivayetlerinin durumu, hadislerin rivayeti ile ilgili görüşü ve diyetlerle ilgili rivayetlerinin yakılması meselesi üzerinde durulmuştur.Üçüncü bölümde hadis edebiyatının tasnif türleri ve sünen türü eserler hakkında bilgi verildikten sonra Mekhûl'ün Sünen'inin inşasında takip edilen yol açıklanmış ve Sünen'in kitap başlıkları ve rivayetlerinin bu başlıklara göre dağılımı, rivayetlerinin müntehasına göre değerlendirilmesi, Ebû Dâvûd'un Sünen'iyle muhteva karşılaştırması birer tabloyla gösterilmiştir. Daha sonra Mekhûl'ün rivayetlerinin sonraki dönem eserlerine geçişte bir değişime uğrayıp uğramadığı sekiz örnek üzerinden incelenmeye çalışılmıştır."
