abstract: "Son dönem Osmanlı hukukçularından olan Ali Haydar Efendi'nin kaleme aldığı Dürerü'l Hükkâm Şerhu Mecelleti'l Ahkâm adlı eserin külli kaideler bölümünde yer alan maddeleri makasıd ve maslahat bağlamında ele alan bu tez çalışması üç ana bölümden oluşmaktadır. Birinci bölümde müellif Ali Haydar Efendi'nin hayatı ve eserleri anlatılmıştır. Ayrıca Mecelle ve külli kaideler ile ilgili yeterli açıklamalar yapılmıştır. İkinci bölümde şari'in tayin ettiği hükümlerin gayesi ve insanlar için nihai olarak sağladığı maslahatı konu edinen ve İslam hukukunda önemli bir yer tutan makâsıd ve maslahat başlıkları ana hatlarıyla ele alındı. Makâsıd ve maslahat kavram ve terim olarak incelendikten sonra, makâsıdın kendisine duyulan ihtiyacın önemi açısından kısımları üzerinde duruldu. Sonrasında maslahat ile zaruret-ihtiyaç ilişkisine kısaca yer verilerek ikinci bölüm tamamlanmıştır. Üçüncü bölümde ise ilk olarak eserin külli kaideler bölümünde yer alan makâsıda yönelik belli başlı kaideler tespit edilmiş ve bu kaideler bir kısım hükümler ve ilkeler başlığı altında incelenmiş ve birkaç örnekle izah edilmiştir. Sonrasında söz konusu maddelere dair müellifin yaptığı açıklamalar incelenmiş ve genel ilkelerden yola çıkılarak bu açıklamaların makâsıd ve maslahat bağlamında ne ifade ettiği ele alınmıştır."
