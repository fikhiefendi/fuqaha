abstract: "Bu tez Muhammed b. Hasan eş-Şeybânî'nin Kitâbu'l-Asl isimli eserinde istihsan metodunun nasıl uygulandığını konu edinen bir çalışmadır. Söz konusu eser Hanefî Mezhebinin temel fıkıh kaynaklarından olması sebebi ile önem arz etmektedir. Çalışma üç bölümden oluşmaktadır. Birinci bölümde İmam Muhammed'in biyografisi ve çalışmamıza esas aldığımız eseri Kitâbu'l-Asl'ın tanıtımına yer verilmiştir. İkinci bölümde islam hukukunda istihsan metodu ile ilgili genel bilgiler yer almaktadır. Üçüncü bölümde ise Şeybani'nin Kitâbu'l-Asl'ında yer alan istihsan örneklerine yer verilmiştir."
