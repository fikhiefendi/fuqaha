abstract: "Günümüzde yaşanan çevre krizinin temelinde, yalnızca ekonomik değil aynı zamanda düşünsel bir arka planın olduğu görülmektedir. Modern ekonomik yapının şekillenmesinde Aydınlanma Felsefesinin ortaya koyduğu doğa ve insan ilişkisinin önemli bir rol oynadığını söylemek mümkündür. Küreselleşen dünyanın, Aydınlanmanın etkilerinin görüldüğü Sanayi Devrimiyle birlikte hızlı bir ekonomik büyüme ve kalkınma sürecine girdiği, her ülkenin bu kalkınma sürecinden kendisine düşen payı alabilmek için tüm kaynaklarını seferber ettiği ve neden olduğu çevresel tahribatı dikkate almadığı görülmektedir. Bu anlayış 21. yy.'da ekonomik büyüme, kalkınma ve çevreden oluşan üçlü sarmalda tercih edilen tarafın ekonomik büyüme olmasına zemin hazırlamıştır. Bu durum iklim krizini, karbon emisyonlarında artışı, biyoçeşitlilikte azalmayı, su kaynaklarında kirlenmeyi, doğal kaynakların kapasitelerinin göz önünde bulundurulmadan kullanılmasını ve günümüzde etkileri bölgesel düzeyden çıkarak küresel düzeyde hissedilen çevresel tahribatı beraberinde getirmiştir. Yeşil ekonomi bu süreçte iklim kriziyle mücadelede çevre dostu ve hâkim iktisadi anlayışa alternatif karbonsuz bir ekonomi modeli olarak ortaya çıkmıştır. Küresel düzeyde değerlendirildiğinde Orta Doğu ve Kuzey Afrika ülkelerinin dünyadaki en önemli fosil yakıt üreticilerinden olduğu ve gelecekte çölleşme, su kıtlığı, artan plastik kirliliği ve iklim değişikliğinin yıkıcı etkileriyle karşı karşıya kalacağı görülmektedir. Bu durum hem iklim krizi ve karbon emisyonlarıyla mücadelede hem de yeşil ekonomiye geçiş sürecinde, Orta Doğu ve Kuzey Afrika ülkelerinin oynayacağı önemli rolü göstermektedir. Bu bağlamda, bu ülkelerin uygulamaya koydukları yeşil ekonomi politikaları ve emisyon azaltma stratejilerinin ortaya konulması oldukça önemlidir. Özellikle son yıllarda Orta Doğu ve Kuzey Afrika ülkeleri özelinde yenilenebilir enerji, sürdürülebilir tarım, sürdürülebilir şehir gibi yeşil ekonomi uygulamalarının teşvik edildiği ve bu stratejilerin ulusal vizyon raporlarında yer aldığı görülmektedir. Bu çalışmanın amacı; çevresel tahribatın düşünsel ve ekonomik yönlerini incelemek, yeşil ekonomi modelinin tarihsel sürecini ele almak ve seçilen ülkelerin uygulamaya koydukları yeşil ekonomi politikalarını, yeşil ekonomiye geçişte karşılaştıkları zorlukları ve yeşil ekonomiyi benimsemelerinde etkili olan faktörleri ortaya koymaktır. Ayrıca seçilen ülkeler için yeşil büyüme ile kişi başına düşen karbon emisyonları, kişi başına düşen gelir ve insani gelişim arasındaki ilişkiyi ekonometrik yöntemler kullanarak incelemektir. Bu kapsamda yeşil büyüme bağımlı değişken, kişi başına düşen karbon emisyonu, kişi başına düşen gelir ve insani gelişim bağımsız değişkenler olarak tanımlanmış, çalışmada panel veri yöntemi kullanılmıştır. 2010-2023 döneminin ele alındığı çalışmada; kişi başına düşen gelir değişkeninin katsayısı pozitif olsa da istatistiksel olarak anlamlı olmadığı, yeşil büyüme ile insani gelişim arasında ise anlamlı ve pozitif bir ilişki olduğu sonucuna ulaşılmıştır. İnsani gelişimde yaşanacak iyileşmelerin yeşil büyüme üzerinde olumlu etki yaratacağı ve çevresel sürdürülebilirliğe katkı sağlayacağı görülmektedir. Elde edilen diğer sonuca göre yeşil ekonomi ile İslâm ekonomisi arasında üretim, tüketim ve israf konularında var olan benzerlik, ilgili ülkelerin politika uygulamalarının başarılı olmasında önemli bir rol oynama potansiyeline sahiptir."
