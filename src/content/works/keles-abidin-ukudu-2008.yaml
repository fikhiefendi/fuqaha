abstract: "Hadisleri sonraki nesillere aktaran âlimler, Hz. Peygamber'in `Kim benim adıma yalanuydurursa cehennemdeki yerine hazırlansın.'1 sözünden hareketle, hadisleri naklederkenbüyük bir sorumluluk taşıdıklarının bilincinde olmuşlardır. Bu yüzden hadis rivâyetlerinebüyük özen göstermişlerdir. Buna rağmen bundan sonra çeşitli sebeplerle hadis uydurmagirişimlerinde bulunulmuş, bu girişimler büyük ölçüde başarılı olmuştur. Uydurulan buhaberlerin belirlenmesi elzem hale gelmiştir.Bu çalışmada `el-Ukûdü'd-Dürriyye fî Tenkîhi'l-Fetâva'l-Hâmidiyye'de geçen hadislerteker teker ele alınıp, her birinin diğer senedleri gösterilerek sıhhat durumunu belirtilmiştir.Tahrîc türü eserlerin artmasıyla hadislere uydurma sözlerin karışmasının büyük ölçüde önünegeçilmiştir.Tahrîcini yaptığımız eserde tesbit edilen altmış dört hadisin kırk üçünü makbul, onyedisini merdûd, dördünü ise hakkında hüküm verilemeyenler oluşturmaktadır.Fetvâ nitelikli bu kitaptaki zayıf hadis sayısının onun üzerinde olması oldukçaüzücüdür. Çünkü İslâm hukuku alanında çalışan âlimlerin, eserlerinde kullandıkları hadislerinsıhhat derecelerini bilmeleri ve ona göre hüküm vermeleri gerekir. Bu sebeple fakihlerinhadisçilerle koordineli bir şekilde çalışmaları gerekmektedir.Hadislerin güvenilirliğini ortaya çıkaran tahrîc çalışmalarının, basılarak tanıtılmasıhadis ilmi açısından oldukça faydalı olacaktır."
