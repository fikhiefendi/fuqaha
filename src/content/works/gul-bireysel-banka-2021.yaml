title: "Bireysel Banka Müşterilerinin Kişilik Özellikleri, Kredi Kartına Yönelik Tutumları, Kredi Kartı Tercihini Etkileyen Faktörler ve Aylık Kredi Kartı Kullanım Sıklıkları Arasındaki İlişkilerin İncelenmesi: Ankara İlindeki Katılım Banka Şubelerine Yönelik Bir Çalışma"
