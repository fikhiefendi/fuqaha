abstract: "Bu çalışmada, katılım şubelerindeki bireysel banka müşterilerinin kişilik özellikleri, kredi kartına yönelik tutumları, kredi kartı tercihlerini etkileyen faktörler ve aylık kredi kartı kullanım sıklıkları arasındaki ilişki incelenmiştir. Bu amaçla, Ankara ilindeki katılım banka şubelerinde araştırma kapsamında gerekli çalışmalar yapılmıştır. Ayrıca araştırmanın amacına uygun olarak 2020 yılındaki birinci ve ikinci dönemde ilk altı ayda kredi kartı kullanan bireysel banka müşterileri ile anket çalışması yapılmış ve kredi kartı kullanan bireysel banka müşterilerinin verdikleri cevaplar doğrultusunda değerlendirme yapılmıştır. Bankacılık sektörü müşterilerinin kredi kartı tutumları ve tercihlerini etkileyen faktörler arasında önemli bir yere sahip olan“kişilik özellikleri”, bu çalışma kapsamında değerlendirilmiştir. Özellikle rekabetin yoğun olduğu bir dönemde banka müşterilerinin günümüzdeki tercihlerinde doğru tespitler yapabilmesine yol göstermesi açısından, yapılan çalışma önemlidir. Bu çalışma, korelasyonel araştırma modeli niteliğini taşımaktadır. Korelasyonel araştırma yöntemi, değişkenler arasındaki ilişkilerin ortaya çıkması ayrıca çıkan sonuçların da doğru tahmin edilmesinde oldukça önem teşkil etmektedir. Değişkenler arasındaki ilişkiyi tespit etmek ve ilişkinin etki düzeylerini ortaya çıkarmak için değişkenler arasındaki ilişkiye ait yapısal eşitlik modellerinin doğrulanıp doğrulanmadığı araştırılmıştır. Kurulan yapısal eşitlik modelleri doğrulanmadan önce modellerde kullanılan ölçeklerin ölçme modellerinin doğrulandığı görülmektedir. Kurulan yapısal eşitlik modellerinin de doğrulandığı görülmektedir. Müşterilerin kişilik özelliklerinin kredi kartı tercihini etkileyen faktörler aracı değişken olarak kullanıldığında aylık kredi kartı kullanım sıklıkları üzerinde yüksek düzeyde negatif yönde bir etkiye sahip olduğu sonucuna ulaşılmıştır. Müşterilerin kişilik özellikleri, kredi kartı tutumları aracı değişken olarak kullanıldığında aylık kredi kartı kullanım sıklıkları üzerinde yüksek düzeyde negatif yönde bir etkiye sahip olduğu sonucuna ulaşılmıştır. Müşterilerin cinsiyeti, medeni durumu, ödeme aracı olarak öncelikleri, yaş, eğitim düzeyi, meslek, aylık hane geliri, kredi kartı ile yapılan aylık harcama miktarları, kredi kartı sayısı, haftalık kredi kartı kullanım sıklık algısı ve günlük kredi kartı kullanım sıklık algısı değişkenlerine göre kullanılan ölçeklerden elde edilen puanlar arasında anlamlı farklılıkların olduğu sonucuna ulaşılmıştır."
