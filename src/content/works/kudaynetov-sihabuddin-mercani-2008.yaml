abstract: "Said-Ali, Kudaynetov, Şihâbüddîn el-Mercânî'nin Usûl-i Fıkıh Anlayışı Hizâmetu'l-Havâşî li İzâhati'l-Ğavâşî adlı eseri bağlamında, Yüksek Lisans tezi, (Danışman: Prof. Dr. İbrahim Çalışkan), Ankara Üniversitesi, 2008, VII +155 s.Bu tez, bir Giriş ve iki Bölümden oluşmaktadır. Girişte tezin içeriği ve hazırlanmasında izlenen yöntem hakkında bilgi verdik.İlk bölümde, Şihâbüddîn Mercânî'nin kişisel yönü üzerinde durduk, onun hayatı ve ilmi yönü ile ilgili çeşitli hususlara değindik. Bu çerçevede Mercânî'nin hocalarını, öğrencilerini ve eserlerini belirttikten sonra, onun dönemindeki bazı siyasî ve ekonomik şartlardan bahsetmeye çalıştık. Bunun yanında Mercânî'nin şahsiyeti ve bazı itikadî görüşlerini arzettik. Mercânî'nin muhalifleri ve onların çeşitli yaklaşımları ile ilgili de bilgiler verdik. Bu bölümden maksadımız, sadece Mercânî'nin kim olduğunun anlatılması değildir. Çünkü Mercânî'nin düşünce yapısı ile yaşamış olduğu hayat arasında çok güçlü bir bağ vardır. İşte bu düşünceyle, Mercânî'nin yaşamış olduğu hayat ve geçirmiş olduğu dönemlerin, onun ilmî yönelişi üzerindeki etkisini tespit edebilmek için onun hayatından bahsetmeyi uygun bulduk.İkinci bölümde, Mercânî'nin Kitap, Sünnet, İcmâ ve Kıyâs bağlamında usûl-i fıkıh ile ilgili çeşitli görüşlerini ortaya koyduk. Buradaki ana hedef, Mercânî'nin fıkıh usûlü anlayışının belirlenmesi ve diğer usûlcülerden farklı olarak nasıl bir anlayışa sahip olduğunun tespit edilmesidir."
