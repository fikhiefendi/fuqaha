abstract: "Bu çalışmanın amacı sermaye piyasalarında işlem gören Katılım endeksi ile BİST 100 endeksinin kısa ve uzun vadeli ilişkilerini incelemektir. Sermaye piyasalarının genel durumu hakkında bilgi veren BİST 100 endeksi, Türkiye'de İslami prensiplere uygun bir şekilde faaliyet gösteren Katılım 30 Endekslerinin logaritmik değerleri arasındaki ilişkileri 2011-2020 yılları arasındaki iş günlerini kapsayacak şekilde haftalık veriler ele alınarak analiz edilmiştir. Bu çalışma üç ana bölümden oluşturulmuştur. Çalışmanın ilk bölümünde giriş, literatür taraması, çalışmanın kapsamı ve alt sınırlarına değinilmiştir. İkinci aşamada ise Katılım endeksinin tarihsel süreci, endeks kavramı ve İslami hisse senetlerine değinilmiştir. Üçüncü bölümde, Türkiye'deki ve Dünyadaki önemli endekslerden bahsedilmiş olmakla birlikte çalışmada kullanılan ölçütler ayrıntılı şekilde açıklanmıştır. Çalışmanın analizinde eş bütünleşme testi nedensellik testi ve birim kök testi uygulanmış olup hata düzeltme modeli aracılığıyla sonuçlar bulunmuştur ve bu sonuçlara göre veriler yorumlanmaya çalışılmıştır."
