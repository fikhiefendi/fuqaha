abstract: "Osmanlı tarihini aydınlatan ve birinci elden kaynak kabul edilen şer'iyye sicil defterleri büyük bir öneme sahiptir. Çalışma yaptığımız 1572No'lu Tekirdağ (Rodosçuk) Şer'iyye Sicil Defteri H.1033 tarihine ait olup 58 varaktan oluşmaktadır. Bu çalışmada öncelikle şer'iyye sicil defterlerindeki belge çeşitleri hakkında bilgi verilmiştir. Ardından Rodosçuk (Tekirdağ) tarihi ile ilgili bilgilendirme yapıldıktan sonra defterin değerlendirilmesi ve basit transkripsiyonuna geçilmiştir. Metnindeğerlendirilmesinde, tutulan kayıtlar teker teker incelenerek, kayıtların hangi konularda tutulduğu ve bu konuların tanımlarına yer verilmiştir. Yapılan incelemede tutulan kayıtlar, yakın olan konulara göre tasnif edilmiştir. Bunun yanı sıra Rodosçuk'a ait defterde adı geçen mahalle, karye ve kaza isimleri tablo haline getirilmiştir.Rodosçuk'un önemi coğrafî konumu açısından oldukça fazladır. İstanbul ve Edirne'ye yakınlığı, liman kenti olması, şehrin askerî ve ekonomik açıdan değerini bir kat daha arttırmıştır. Bu dönemde Müslüman ve gayrimüslimlerin beraberce yaşadıkları fakat genellikle ayrı mahallelerde bulunmayı tercih ettikleri, bununla beraber özellikle merkezi mahallelerde beraberce yaşadıkları tespit edilmiştir. Müslümanlarla Ermeni, Rum ve Yahudi toplulukların komşuluk haklarından doğan davalara, ortaklıklara, veraset, vekâlet ve satış konulu kayıtlara rastlanmıştır. Defterde Bey' (mülk alış ve satışı) işlemleri, ardından vakıf, miras, kefalet ve çeşitli idarî kayıtlar en fazla yer tutan konulardır. Bu çalışma 17. yüzyılda Osmanlı'nın arayış yıllarının başladığı, 1623'de IV. Murad'ın 11 yaşında tahta geçtiği ve annesi Kösem Sultan'ın saltanat naibesi olarak devlet yönetimini ele aldığı zaman diliminin başlangıcıdır. Osmanlı ve Tekirdağ (Rodosçuk) tarihinin aydınlatılması açısından bu defter araştırmacılar için çok önemli bir kaynak olacaktır."
