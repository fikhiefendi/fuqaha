abstract: "Şeyhîzâde Abdurrahman Efendi Osmanlı Devleti döneminde yaşamış değerli bir İslâm hukukçusudur. Görevini îfâ ettiği zaman içerisinde farklı hizmetlerde bulunmuş bir şahsiyettir. İlmi, irfanı ve üstün ahlakıyla tanınmış bir zattır. Vefat etmeden bir sene öncesinde bitirmiş olduğu Mecma'u'l-enhur adlı eseri, İbrâhim el-Halebî'nin Mülteka'l-ebhur isimli fıkıh kitabının en muteber şerhlerinden biri sayılmaktadır. Aynı zamanda Mecma'u'l-enhur adlı eser meşhur Mecelle kitabının kaynakları arasında yer bulmaktadır. Hanefî fıkıh metninin şerhi olan bu eser içerisinde Henefî Mezhebinin görüşleri ele alındığı gibi, diğer Mezheplerin görüşlerine de değinilerek mukayeseli bir fıkıh kitabı olarak tarihte yerini almıştır. Şeyhîzâde'nin Mecma'u'l-enhur isimli eserinin hadd ve kısas bölümlerinde İmam Şâfi'î'ye nispet edilen görüşler, ilk önce İmam Şâfi'î'nin el-Ümm adlı eserini asıl kabul ederek Şâfi'î mezhebinde yazılmış Mâverdî'nin el-Hâvi'l-kebîr, Cüveynî'nin Nihâyetü'l-matlab, İmrânî'nin el-Beyân, İbnü'r-Rif'a'nın Kifâyetü'n-nebîh, Nevevî'nin, el-Mecmû', Ravzatü't-tâlibîn, Demîrî'nin en-Necmü'l-vehhâc, Müzenî'nin el-Muhtasar, Şîrâzî'nin el-Mühezzeb ve Büceyrimî'nin Hâşiyetü'l-büceyrimî adlı eserleri müvacehesinde incelenmiş, netice olarak 110 adet isnad tespit edilmiştir. Bunların 64 tanesi hadd, 46 tanesi ise kısas bölümünde yer almaktadır. Hadd bölümündeki nispetlerin 41'inin doğrudan İmam Şâfi'î'ye ait olduğu görülürken, kısas bölümündeki 46 taneden 11'nin kendisine ait olmadığı tespit edilmiştir."
