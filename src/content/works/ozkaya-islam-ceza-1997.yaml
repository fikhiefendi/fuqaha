abstract: "Araştırma için seçilen konu hakkında Türkçe'de bundan önce herhangi bir çalışmanın yapılmamış olması, bu konunun içerdiği kavramların belli bir uyum ve sistematik içerisinde ele alınmasında bir takım zorluklan da beraberinde getirmiştir. Bu nedenle ilk olarak, diğer hukuk sistemlerinden yapı ve menşe itibari ile farklı olan İslâm Ceza Hukuku hakkında genel bilgiler verilmiş, yine bu doğrultuda suç ve ceza kavranılan ilerki bölümlere ışık tutması amacıyla irdelenmiştir. İkinci bölümde ise çalışmanın temel olarak ele aldığı pişmanlık kavramının (herne kadar kendisinden doğmuş ise de) tevbeden farklı değerlendirilmesi gerektiği vurgulanmış, böylece tevbe hukukî kapsam dışında bırakılmıştır. İslâm hukuku temel kaynaklarının Arapça olması sebebiyle, bu İM kavram söz konusu kaynaklarda tek başlık altoda sadece tevbe kelimesiyle ifade edildiğinden, Türkçede böyle bir ayrana gidilmesinin gerekçeleri verilmiş ve bu farklılığın daha açık görülebilmesi için suç işlemiş olan kişiden uhrevî ceza ile dünyevî cezanın düşeceğini söyleyen naslar ayrı başlıklar altoda örneklendirilmiştir. Dolayısıyla, pişmanlık olgusunun objektif verilerle tespit edilmesi gerektiğinin altı çizilmiştir. Ayrıca seküler ceza hukukundaki pişmanlık kavramıyla teori ve uygulamada bir karşılaştırmaya da gidilerek genel olarak bu bölümde İslâm Ceza Hukukunda pişmanlığın yeri belirlenmeye çalışılmıştır. Daha sonraki iki bölümde ise pişmanlığın cezalara olan etkisi incelenmiştir. Bu inceleme sırasında ise iki önemli husus sürekli gözetilmiştir. Bunlar: Pişmanlığın ceza üzerindeki etkisinin onun cezayı düşürmesi anlamında olduğu ve bu etkinin ancak suç neticelendikten sonra gündeme geldiğidir. İslâm Ceza Hukukunda bir takım suçlara verilecek olan cezalar Sâri tarafından belirlenirken diğerleri böyle değildir. Suçların bu tür bir tasnifi, pişmanlığın cezalara olan etkisini incelerken gözetilmesi gereken temel bir ayrım olmuştur. Çünkü cezalan Kuran ve Sünnetle doğrudan belirlenen suçlarda pişmanlığın etkili olacağı (veya olamayacağı) da doğrudan Kur'an ve Sünnet tarafından belirleneceği açıktır. Bundan hareketle cezalan belirlenmiş suçlarda pişmanlığın etkisi birer birer her suç için Kuran ve Sünnet ekseninde araştırılmıştır. Ancak cezalan belirlenmemiş suçlar olarak bilinen cürümlerde pişmanlığın etkisi İslâm Ceza Hukukunda cezanın gayesi ve farklı suç tasnifleri doğrultusunda genel bir teori ortaya konmaya çalışılmış, serî naslann üzerinde hüküm beyân etmediği noktalarda da yer yer modern ceza hukuk sistematiğinden istifâde edilmiştir. IX"
