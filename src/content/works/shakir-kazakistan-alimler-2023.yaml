abstract: "Bu çalışmada Kazakistan Müslümanları Dini İdaresi'ne bağlı Âlimler Konseyi'nin yapısı, Şeriat ve Fetva Daire Başkanlığı'nın Konsey ile ilişkisi, tarihçesi, çalışma usul ve esasları, amaçları, görevleri, sorulan sorulara cevap verme yöntemi, fetvada takip ettiği yöntemi, meclisleri, üyeleri ve yayın hizmetleri ele alınmış ve Konsey'in onayı ile karara bağlanan çoğu güncel ve azı da klasik olan ticaret ve zekât alanı ile ilgili meselelerin kararlarının fıkhî açıdan tahlili yapılmıştır. Bu değerlendirmeyi yaparken Konsey'in kullandığı delillerin konuyla alakasının hangi seviyede olduğu ve konuya yaklaşımı tespit edilerek fetvadaki orijinalliği ortaya konulmuştur. Ayrıca fetvada takip ettiği usulleri ve ilkeleri tespit edilmeye çalışılmıştır. Buna ilaveten verilen fetvanın farklı boyutlarını görebilmek için uluslararası fetva kurumlarının fetvalarına yer verilmiştir. Güncel fetvalarla ilgili ticaret ve zekât ile ilgili konuları seçmemizin nedeni iktisat alanına dahil edilebilecek fetvaları bir araya getirmektir. Zira ticaret alanındaki fetvalarda muâmelât ile ilgili iktisadi problemler incelenirken, zekât alanındaki fetvalarda ibâdet ile ilgili problemler incelenmektedir. Aynı zamanda iktisat günümüzde fıkhın ilgilendiği en güncel ve dinamik alanlardan birini oluşturmaktadır. Ele alacağımız konu daha önce çalışılmamıştır. Çalışmamızda esas alacağımız kararlar 2013 senesinden sonraki döneme aittir. Zira 2013 senesinden önceki fetvalar bireysel olarak verilmiş ve bir karara bağlanmamıştır. Bireysel olarak verilen bu fetvalar veri olarak korunmamıştır. Asıl fetvaların karara bağlanarak oluştuğu dönem 2013 senesi sonrası dönemdir. Çünkü 2013 senesinde fetva kurumu tekrar yapılanmaya gitmiş; bunun yanında fetva kurumundan bağımsız olarak Şeriat ve Fetva Daire Başkanlığı'nın fetvalarını denetleyen ve karara bağlayan Âlimler Konseyi kurulmuştur. Ayrıca Konsey toplumsal her türlü meselelere cevap verme yetkinliğine sahiptir. Bunun yanı sıra Kazakistan Fetva Kurulu 57 ülkenin üye olduğu Uluslararası Fıkıh Akademisi'nin de aktif üyesidir. Orta Asya'daki birçok fetva kurumuna çalışmalarıyla öncülük etmektedir. Şu ana kadar fetva kurulunun seri halinde üç cilt güncel meseleler ile ilgili fetvalar mecmuası yayınlanmıştır."
