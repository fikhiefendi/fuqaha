abstract: "Molla Hüsrev, klasik dönem Osmanlı hukukunda önemli yeri olan şahsiyetlerden biridir. Devletin düşünsel temellerinin atıldığı bir dönemde yaşamış olan Molla Hüsrev, Hanefi Sünni geleneğinin yerleşmesinde de önemli etkileri olmuştur. İslam hukukuna dair kaleme aldığı kısaca Dürer ve Gürer olarak bilinen eserleri, Osmanlı hukukunda pratik ve teorik açıdan büyük değer taşımaktadır. Uzun yıllar Osmanlı yargı kurumlarında kadıların başvurduğu kanun metni olma özelliği taşıyan bu eserler, aynı zamanda uzun yıllar boyunca medreselerde de okutulmuştur. Molla Hüsrev'in Dürer kitabı çerçevesinde fıkhi görüşlerini incelediğimiz bu çalışma, bir giriş ve iki bölümden oluşmaktadır. Giriş bölümünde Molla Hüsrev'in hayatı, eserleri ve Dürer adlı kitabı hakkında bilgilere yer verilmiştir. Birinci bölümde, Molla Hüsrev'in tercih ettiği görüşlerine kaynaklarıyla birlikte ulaşılmaya çalışılmıştır. İkinci bölümde ise tenkit ettiği görüşlere yine kaynaklarıyla birlikte yer verilmiştir. Molla Hüsrev, Osmanlı Devleti'nde önemli görevler almış ve tecrübeleri sonucunda Dürer adlı fıkıh kitabını meydana getirmiştir. Çalışmamızda Müellifin eserdeki referansları göz önünde bulundurulmuş ve görüşleri, objektif bir biçimde ortaya konmaya çalışılmıştır.Anahtar Sözcükler1.Molla Hüsrev2.Dürer3.Gürer4.Osmanlı Hukuku5.Hanefi-Sünni"
