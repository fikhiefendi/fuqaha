abstract: "İslam hukuku alimleri İslam hukukunun kaynaklarını doğru yorumlamak için kelimeleri ve sözleri kategorilere ayırmışlardır. Bu kategoriler İslam hukuku çalışmaları için o denli mühimdir ve neticeleri itibarıyla o kadar girifttir ki, bu kategorilerin şu veya bu şekilde neredeyse tüm kanun yapımlarında rol oynadıklarını görmekteyiz. Bu kategoriler sadece İslam hukuku kaynaklarının yorumlanmasında objectifliği sağlamakla kalmaz, aynı zamanda herbir mezhep içinde tutarlığı da sağlarlar. İslam hukuk çalışmalarında her ne kadar İslam hukukunun aslı ve onun siyasi ve sosyal alanlardaki etkileri konusunda birçok çalışma yapılmış olsa da, usûl-ı fıkhın önemli bir parçasını teşkil eden dil kategorilerinin kapsamlı bir analizden geçmesine ihtiyaç duyulmaktadır. Dil kategorilerini konu edinen mevcut çalışmalar, zaten Klasik Arapça metinlerinde var olan dil kategorilerini, değişen başarı oranlarıyla tekrar etmekten öteye gitmemektedir. Diğer bazı çalışmalar ise, bunun aksine, usûl-ı fıkha bir takım yabancı teorileri uygulamaktadır ve bu durum dil kategorilerinin ve onların kanun yapımındaki rollerinin anlaşılması hususunda bir takım problemlere yol açmaktadır. Bu eser, ilk kez, usûl-ı fıkh eserlerinde yer alan dil kategorilerinin açık bir teori (genel çerçeve) sunmadıklarına işaret etmektedir ve dil kategorilerinin bu teoriyi ortaya çıkarmada işe yarayacaklarını iddia etmektedir. Bunun da ötesinde, bu eser, dil kategorilerinin, usulcülerin bu eserde 'dilin içsel doğası' olarak isimlendirilen problemi aşmak için sarfettikleri entellektüel çabanın neticesinin ta kendisi olduğunu iddia etmektedir. Bu eser bir giriş ve dört ana bölümden müteşekkildir. Giriş kısmı (1. Bölüm) dil kategorilerine genel bir bakış sunmakta ve onların kanun yapımındaki öneminden bahsetmektedir. 2. Bölüm, diğer bazı şeylere ek olarak, 'pratik isim-verme şekli' olarak isimlendirdiğim isim-verme şekli ile aşılan dilin içsel doğasınını konu edinmektedir. Ebū el-Berakāt el-Nesefī'nin etkili eseri, Menār el-Envār, onun iki meşhur şerhi ve bir haşiyesi ile beraber Hanefi mezhebi içinde öne çıkan diğer bazı usûl-ı fıkıh eserlerine dayanarak, 3. Bölüm dil kategorilerinin kapsamlı bir analizini sunmaktadır. Buna binaen, bu kategoriler için yine bu bölümde bir teori inşa ediyorum ki bu teorinin, usülcülerin dil analizinin sonucunu (yani dil kategorilerini) anlamlı hale getirdiğini savunuyorum. Bu teori ışığında 4. Bölüm bu dil kategorilerini İslam Ceza hukukunda bir hukûkî mesele olan sirkat (hırsızlık)'a uygulamaktadır. 5. Bölüm bu dil kategorilerinin sirkata uygulanmasının dilsel bir analizini sunmaktadır. 6. Bölüm ise sonuç bölümüdür."
