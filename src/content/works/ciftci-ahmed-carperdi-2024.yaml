abstract: "İnsanlık için bir hayat modeli teşkil eden İslam dini, onlara yaşamlarının her alanında nasıl hareket edecekleri bağlamında belli birtakım düsturlar sunmuştur. Bunlardan bir tanesi de İslam'a göre hükümlerin belirlenmesidir. Bu hükümlerin tespiti, İslam'ın şer'î kaynakları çerçevesinde analizi yapılmaktadır. İslam'in temel kaynaklarından birincisi Kur'an, ikincisi ise Sünnet'tir. Bu asli kaynaklar, içerdikleri hükümleri açısından sınırlıdır. Diğer taraftan insanlık hayatında sürekli bir akış ve hareketliliğin olmasından dolayı yeni hadiseler ortaya çıkar ve bu olaylar için çözümler aranır. Bu çözümleri belirlerken, öncelikle Kurân ve Sünnet'te bulunan hükümlere başvurulur. Ancak sıkça karşılaşılan yeni meselelerde, mevcut delillerde açıkça hüküm bulunmamasıyla sonuçlanabilir. Bu durumda bireysel ictihadlar ortaya çıksa da yetersiz kalabiliyor. İşte bu noktada, İslamîn şer'î delillerrinde bulunan üçüncü kaynak olan icmâ ve diğer delillerin zorunluluğu ortaya çıkar. Bu hadiselerin çözümü ve bir hükmün belirlenmesi için ilkinde Kur'an ve Sünnet'te mevcut olan hükümler ışığında buna bir çözümün bulunulması gerekli kılmaktadır. Ancak çoğu zaman meydana gelen bu yeni meseleye var olan şer'î delillerde hükmü geçmemektedir. Bu durumda ferdi ictihadlar ortaya çıksa da bu yetersiz kalınmaktadır. İşte bu durum İslam'ın şer'î delillerinden üçüncüsü olan icmâı, zorunlu kılmaktadır. İcmâ Kur'an ve Sünnet çizgisinden sapmadan meydana gelen yeni meseler için çözüm üretici delillerden biri olarak yer almakta ve İslam kaynakları arasında önemli bir işleve sahip olduğu görülmektedir. Bu çalışmada, fıkıh başta olmak üzere tefsir, hadis, usul, gramer ve mantık gibi çeşitli ilim alanlarında derinleşen ve ömrünü ilimle geçiren Ahmed el-Çârperdî'nin hayatı, ilmi kişiliği ve icma konusundaki görüşleri incelenmiştir. Ayrıca, icmâ konusunda diğer usûl âlimleri ile olan ittifak ve ihtilaflarına da değinilerek bir değerlendirme yapılmıştır."
