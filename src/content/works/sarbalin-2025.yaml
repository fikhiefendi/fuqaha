abstract: "Âlim Kāsım'ın Risâlesi Üzerine“El-ʿArfu'n-Nâsim”(Kitabın Başından Tefsir Bölümünün Sonuna Kadar) İnceleme ve Tahkik Özet: Bu çalışma iki kısımdan oluşmaktadır: inceleme ve tahkik. İkinci kısım, fıkıh usûlünün çoğu konusunu kapsayan önemli ve kapsamlı bir metnin ilmî neşrini sunmaya odaklanmaktadır. Bu metin, Hanefî fıkıh usûlü âlimleri arasında yaygın olarak okutulan klasik bir ders kitabı olan İbn Habîb el-Halebî'nin Muḫtaṣarü'l-Menâr adlı eserine yazılmış bir şerhtir. Neşir işlemi ilmî tahkik kurallarına uygun olarak gerçekleştirilmiştir. Birinci kısım ise şârihin ve metnin müellifinin tanıtımını yapmakta, şârihin yorum yöntemini analiz etmekte ve şerhini aynı metne yazılmış diğer şerhlerle karşılaştırmaktadır."
