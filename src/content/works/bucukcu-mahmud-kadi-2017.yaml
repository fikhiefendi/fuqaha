abstract: "13. Yüzyılın ikinci yarısından 15. yüzyılın ikinci yarısına kadar Anadolu ve Rumeli topraklarında konuşulan Türkçe, Eski Anadolu Türkçesi olarak adlandırılmaktadır. Bu dönemde dinî ve edebî eserler yanında tıp, tarih, astronomi, coğrafya gibi bilim dallarını da içine alan çeşitli konularda eserler telif veya tercüme edilmiştir. Bu tezde Eski Anadolu Türkçesi döneminde yazılan ansiklopedik bir eser olan A'cebü'l-'Üccâb üzerine çalışılmıştır. Yazar Mahmûd bin Kadı-yi Manyas'ın belirttiği üzere eserin telif tarihi 1438'dir. Türkiye ve Türkiye dışındaki kütüphanelerde birçok nüshası bulunmaktadır. Eser yazarın 'makale' olarak adlandırdığı üç ana bölümden oluşmaktadır. İlk makale fıkıh, ikinci makale aritmetik, üçüncü makale hayvanlar, bitkiler ve madenler hakkındadır. Çalışmanın Metin bölümünde eserin Princeton Üniversitesi'nin dijital kütüphanesinde İslamî Yazmalar arasında 1010 seri numarası ile kayıtlı olan nüshasının çeviriyazısı bulunmaktadır. Çalışmanın Dilbilgisi bölümü, Ses Bilgisi ve Biçim Bilgisi olarak iki ana bölümden oluşmaktadır. Son bölümde ise Dizin yer almaktadır. Anahtar Sözcükler Eski Anadolu Türkçesi, Mahmud bin Kadı-i Manyas, 'Acebü'l- Üccab, Ansiklopedik Eserler"
