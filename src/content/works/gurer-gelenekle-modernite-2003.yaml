abstract: "Osmanlı İmparatorluğu' nun 121. şeyhülislâmı olan Musa Kâzım Efendi 1861 yılında Erzurum vilâyetinin Tortum kazasına bağlı Vihik (Pehlivanlı) köyünde bir çiftçi ailesinin çocuğu olarak dünyaya gelmiştir. Ailesinin aslen Balıkesirli olduğu tahmin edilmektedir. Memleketinde başlamış olduğu medrese eğitimini sırasıyla Erzurum, Konya ve Balıkesir'de sürdürmüş ve İstanbul'da Fatih medresesinde tamamlamıştır. İcazetnamesini XIX. yüzyılın meşhur ulemâsından Hoca Şakir Efendi'den alan Musa Kâzım Efendi saray bürokratlarıya kurmuş olduğu patronaj ilişkileri sayesinde Fatih dersiâmlığının yanısıra Darülfünun, Dârülmuallimîn, Mekteb-i Hukuk ve Galatasaray Mekteb-i Sultanîsi gibi İmparatorluğun en gözde eğitim müesseselerinde muallimlik görevlerinde bulunmuştur. Aynı şekilde Maârif ve Meşihat bürokrasisinde de önemli görevlere getirilmiştir. Serbest düşünce yapısının gelişiminde yakın dostu Ahmet Mithat Efendi'nin önemli etkisi olan Musa Kâzım Efendi yazarlık hayatına II. Abdülhamid döneminde, Ahmed Midhat Efendi'nin çıkarmış olduğu Tercümân-ı Hakikât gazetesinde başlamış, II. Meşrûtiyet döneminde Sırât-ı Müstakim, Teârüf-i Müslimin ve İslâm Mecmuası gibi dergilerde devam etmiştir. Milliyetçilik düşüncesine karşı olmasına rağmen İttihat ve Terakki Cemiyeti'ne mensubiyeti sebebiyle Türkçü fikir çevreleriyle de yakın ilişki içerisinde olmuştur. II. Meşrûtiyet döneminde en uzun süre şeyhülislâmlık makamında bulunma özelliğini taşıyan Musa Kâzım Efendi bu önemli görevini İttihat ve Terakki Cemiyeti'ne olan sadakatine borçludur. Aralıklı olarak beş defa getirildiği şeyhülislâmlığı sırasında İttihat ve Terakkî'nin politikaları doğrultusunda ilmiye teşkilâtında medrese ve tekke reformlarını gerçekleştirmiştir. Musa Kâzım Enendi 'nin İttihat ve Terakki ile olan ilişkisi II. Meşrûtiyet öncesine dayanmaktadır. İttihat ve Terakkî'nin idareci kadrosu içerisinde yer almışolan Musa Kâzım Efendi aynı zamanda da bu cemiyetin Meclis-i Âyân'daki sözcülüğü görevini yerine getirmiş ve onun dini propogandasını yürütmek üzere kurulan Hey'et-i İlmiye' sini yönetmiştir. Yine İttihat ve Terakki ile olan ilişkileri onu siyasî amaçlarla mason cemiyetine üye olmaya sevketmiştir. Nakşibendi tarikatinin bir üyesi olan Musa Kâzım Efendi 'nin yine İttihatçı olması sebebiyle Bektaşî tarikatine girmiş olduğu şeklindeki iddialar ise asılsızdır. I. Dünya Savaşı'nın Osmanlı Devleti'nin aleyhine neticelenmesi üzerine İttihat ve Terakkî kabineleri üyelerini yargılamak üzere kurulan mütareke dönemi Divân-ı Harbinde savaş suçlusu olarak yargılanmış ve neticede on beş yıl kürek cezasına çarptırılmıştır. Cezası padişah VI. Mehmed Vahideddin tarafından üç yıl geçici sürgüne çevrilmiş, sürgüne gittiği Edirne'de 10 Ocak 1920 tarihinde vefat etmiştir. II. Meşrutiyet öncesinde kaleme almış olduğu yazılarında daha ziyade felsefî konularla ilgilendiği görülen Musa Kazım Efendi bu yazılarında dinin insanın ferdi ve toplumsal hayatındaki rolü ile medeniyetin teşekkülü ve korunmasındaki etkilerini vurgulamıştır. Onun felsefî görüşlerini etkileyen faktörler Batılılaşma hareketleri ile birlikte Türkiye'ye girmeye başlayan din karşıtı modern felsefî akımlardır. Bu yüzden Materyalizm ve pozitivizm gibi felsefî akımlara karşı XIX. yüzyılda modernist bir tepki hareketi olarak ortaya çıkan Yeni kelâm hareketinin Türkiye'deki öncüleri arasında yer almıştır. II. Meşrutiyet dönemi İslamcılık akımının önemli temsilcilerinden olan Musa Kâzım Efendi' nin siyasî konularla ilgili yazılarında işlemiş olduğu asıl düşünce İttihat ve Terakki'nin dinsel açıdan meşruiyetini savunmak ve bu Cemiyet'in meşruti yönetimin getirilmesindeki rolünü vurgulamak olmuştur. Bunu yaparken de modern çağın birer ürünü olan demokrasi ve insan haklarının İslâm dini ile tam bir uyum içerisinde olduğunu ispatlamaya çalışmıştır. Kadın haklan konusunu özgürlük ve eşitlik kavramlarıyla bağlantılı olarak ele almış olan Musa Kâzım Efendi'nin kadın ve aile konularındaki fikirleri büyük ölçüde geleneksel bakış açısını yansıtmaktadır."
