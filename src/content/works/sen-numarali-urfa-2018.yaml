abstract: "Şer'iyye Sicilleri, kadıların görevleri icabı mahkemelerde verdikleri hükümleri, merkezden gelen belgeleri ve sorumlu oldukları yerlerdeki önemli hadiseleri kaydettikleri defterlerdir. Şer'iyye Sicilleri kadı ve naiblerin mahkemelerde hüccet, ilâm, ma'ruz, mürasele şeklinde kaydettikleri hükümleri, tayin beratlarını, buyruldu, tezkire, tahrirleri geçtikleri kaza, kasaba ve köylerde olan önemli olaylara dair kayıtları ihtiva etmektedir. Şer'iyye Sicillerindeki konular bir kaza idaresinde meydana gelebilecek her türlü olay ve düzenlemeler ile tarihi gerçekleri ihtiva eder. Şer'iyye Sicillerinden, o dönemin ekonomik, sosyal, kültürel ve hukuki durumunu, askerlikle ilgili bilgileri, savaş öncesi ve sonrası toplumsal olayları hakkında bilgi edinebilmekteyiz. Bu çalışmanın birinci bölümünde Urfa'nın tarihi, coğrafi konumu, adının kaynağı ile alakalı genel bilgilere yer verilirken ikinci bölümde şer'iyye mahkemelerinin tarihçesi, işleyiş tarzı ve mahkeme görevlileri hakkında bilgi verilmiştir. Çalışmamızın son bölümünde ise 206 numaralı Urfa şer'iyye sicilinin 1-186. sayfalarının transkripsiyonu ve değerlendirmesi yapılmıştır. 206 Numaralı defterden yararlanılarak Urfa'nın sosyal, kültürel, ekonomik, hukuki ve siyasi hayatı hakkında bilgilere varabiliriz."
