abstract: "Mezhepsel sürecin başlamasıyla birlikte dünyanın pek çok bölgesinde olduğu gibi Horasan bölgesinde köklü bir şekilde yerleşen ve varlığını halen güçlü bir şekilde devam ettiren Sünni mezheplerden biri olan Hanefilik, Ebû Hanife'nin ilim halkasında yetiştirdiği talebelerinin ilmi faaliyetleri ve bölge halkının örf ve âdetlerine verdikleri önem ve itibar sayesinde olmuştur. Bu bağlamda Abdullah ibn Mesud ile başlayan ve onun talebeleri ile devam eden süreçte Kûfe Ehl-i Rey ekolu İmam Ebû Hanife ile birlikte akademik fıkıh üretme merkezine dönüşmüş ve ilkelerini belirleyerek sistemli hale gelmiştir. Ebû Hanife ile oluşan bu akademide dünyanın pek çok bölgelerinden talebeler katılmış ve bu akademiden istifade ederek gittikleri yerlerde bu mezhebin ilkelerini yaymaya çalışmışlardır. Bu bölgelerden biri de Horasan bölgesidir. İfade edildiği üzere, Ebû Hanife'nin erken dönem talebeleri arasında yer alan Horasanlı talebeler vasıtasıyla bölgeye yayılan Hanefî mezhebi, yerleşik kültür ve âdetlere verdiği değer ve itibar sayesinde bölge halkı tarafından özümsenerek İslamiyet'i temsil eden bir mezhep haline gelmiştir. İslam'ın evrensel değerlerinin bölge halkının akl-i selimince onay görmüş âdetleri İslâmiyet'in amaç edindiği gâye ile doğru bir şekilde kanalize eden Hanefî mezhebi, bir taraftan müntesiplerinin te'lif ettiği eserlerle İslâm'ın doğru algılanıp yaşanması için kaynaklık ederken diğer taraftan bölge de oluşan devletlerin desteğini kazanmak suretiyle devletin resmi dairelerinde de yerini almış ve bu sayede Belh başta olmak üzere Horasan'ın birçok şehrinde Hanefi sistemine göre tedris olunan medreseler te'sis edilerek mezhebin yayılmasına hem evme hem de derinlik kazandırmıştır. Bu bağlamda yerleşen Hanefi mezhebi günümüzde de varlığını güçlü bir şekilde devam ettirmekte olup, mezhebin temel eserleri gerek Hukuk Fakültelerinde gerek Şeriyât Fakültelerinde ders kitabı olarak okutulmaktadır."
