abstract: "IÖzetYüksek Lisans TeziHukukû Açıdan Tevrat ve Kur'ân Hükümlerinin MukâyesesiHidayet DURNAFırat ÜniversitesiSosyal Bilimler EnstitüsüTemel İslam Bilimleri Ana Bilim Dalıİslam Hukuku Bilim Dalı2006; Sayfa: XII + 131Tevrat ve Kur'ân-ı Kerûm insanlığa yüce yaratıcı tarafından gönderilmiş iki ilâhikitaptır. Tevrat Hz. Musa aracılığı ile İsrailoğullarına, Kur'ân-ı Kerûm ise sonpeygamber Hz. Muhammed (s.a.v) aracılığı ile bütün insanlığa gönderilmiştir. Her ikiilahû kitap gayesi itibariyle insanlığın dünya ve ahiret mutluluğunu temin etmeyigözetir. Bu itibarla hukukû düzenlemeler de getirmişlerdir.Her iki ilahû kitapta gerek kamu hukuku, gerekse özel hukuk alanlarında birçokhüküm bulunmaktadır. Fakat bu hükümleri karşılaştırdığımızda Kur'ân-ı Kerûm'ingetirdiği hükümlerin hem bozulmadığı, hem de hukukun gayelerini gerçekleştirmeaçısından mükemmellik arzettiği görülmektedir. İslam hukukunun ana kaynağınınKur'ân-ı Kerûm olduğu, Tevrat'ın ise gerek metin, gerekse yorum itibarıyla bozulmayauğrayıp bu özelliğini kaybettiğini görmekteyiz. Hem Kur'ân-ı Kerûm hem de İslamHukuku evrensel nitelikte olmasına karşılık, Tevrat evrensel bir özellik taşımamaktaböyle bir iddiada da bulunmamaktadır."
