abstract: "Bu çalışma, İslam hukuk literatürünün önemli bir kısmını teşkil eden harâc ve emvâl kitaplarının klasik dönemde iyi bir örneği sayılan Ebû Ca'fer Ahmed b. Nasr ed-Dâvûdî'ye ait Kitâbü'l-Emvâl'i esas alarak, kamu maliyesinin belli başlı konularını incelemeyi ve bu konularda zaman içerisinde meydana gelen görüş farklılıklarını izlemeyi hedeflemektedir."
