abstract: "Araştırmamızın odak noktasını kripto varlık ekosistemi içerisinde önemli bir konuma sahip NFT'ler oluşturmuştur. Konu bağlamında altyapı sağlayıcıları olarak blok zinciri teknolojisi ve akıllı sözleşmeler hakkında teknik bilgiler verilmiştir. NFT'lerin İslâm eşya hukukuna göre“mal”olabilme niteliği; İslâm borçlar hukukuna göre ise NFT'lerin konu oldukları hukukî muameleler değerlendirilmiştir. Bu değerlendirmeler, mezhepler arasındaki farklı yaklaşımlar temelinde; konunun merî hukuktaki yansımalarını da gerektiği kadar içerecek şekilde yapılmıştır. Yöntemsel olarak tümdengelim ve literatür tarama metotları ile ilerleyen araştırmamızda, NFT'lerin hukukî niteliği konusunda kıyemî-menkûl ve içeriğine göre mütekavvim mal olduğu sonuçlarına ulaşılmış, konu oldukları hukukî işlemlerin bu niteliğe ve İslâm borçlar hukukunun genel ilkelerine göre değerlendirilmesi gerektiği bulguları saptanmıştır."
