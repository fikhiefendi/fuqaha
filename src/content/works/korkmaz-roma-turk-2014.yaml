abstract: "Tezin konusu“ Roma ve Türk Hukuku'nda İntifa Hakkının Hükümleri”dir. Tez giriş ve sonuç bölümleri dışında iki ana bölümden oluşmaktadır. Giriş Bölümü'nde, ius kavramı, Roma Hukuku'nda hakların sınıflandırması ve intifa hakkının bu sınıflandırma içindeki yeri, intifa hakkı kavramı, intifa hakkının özellikleri, konusu, çeşitleri konuları ele alınmıştır. Birinci Bölüm'de, Roma Hukuku'nda ''İntifa Hakkının Hükümleri'' incelenmiş, intifa hakkı sahibinin ve malikin hakları ve borçları ile hakkın korunması yolları ele alınmıştır. İkinci Bölümde ise, Türk Hukuku'nda ''İntifa Hakkının Hükümleri'' incelenmiş, Roma ve Türk Hukukları'nda“İntifa Hakkının Hükümleri”konusunda tespit edilen benzerlik ve farklılıklara yer verilmiştir. Sonuç Bölümü'nde, Roma Devleti'nin hukuk kurumlarıyla, bugün özellikle, Kıta Avrupa'sında bir çok özel hukuk sistemine ve bu sistem içersinde var olan ve gelişen özel hukuk kurumlarına kaynaklık ettiği, bu durumun, Türk Hukuku için de geçerli olduğu, bu paralelde, TMK'da intifa hakkına ilişkin yer alan birçok kurala Roma Eşya Hukuku'nda da rastlandığı, Roma Hukuku'nun, hukuk kurallarını etkileme gücü ile halen Çağdaş Hukuk içersinde yaşamına devam ettiği saptamalarına yer verilmiştir"
