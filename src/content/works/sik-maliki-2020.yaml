abstract: "Hz. Peygamber'in sünnetini tespit etmek ve maksadını göz ardı etmeden anlayıp nesilden nesile aktarmak, muhaddisler ve fakîhler başta olmak üzere İslam âlimlerinin en önemli hedefi olmuştur. Dolayısıyla sünneti tespit etme çalışmalarında haber konusu, her zaman gündemdeki yerini korumuştur. Mâlikî mezhebinde de İmâm Mâlik başta olmak üzere usûlcülerin hemen hepsi haber, hadis ve sünnet kavramları etrafında zuhur eden tartışmalara dâhil olarak kendi görüşlerini ortaya koymuşlardır. Söz konusu mezhepte genel itibariyle bakıldığında cumhûrun görüşlerine paralellik arz eden bir sünnet anlayışının hâkim olduğu görülmekle birlikte, bazı hususlarda birtakım farklılıkların olduğu da göze çarpmaktadır. Özellikle yaşayan sünnetin, habere takdimi meselesi son derece dikkat çeken bir konudur. Bu bağlamda“Medine ehlinin ameli”mefhumunun literatüre girmesi, Mâlikî mezhebine özgü bir anlayışın ifadesi olarak görülmüştür. Diğer taraftan klasik hadis usûlünde yer alan mursel, mudelles, mevkûf gibi hadis çeşitlerine dair kavramların, sünneti tespit etmedeki rollerine farklı bir bakışın olduğu göze çarpmaktadır. Zira Mâlikî mezhebinde önemli olan, kavramların teknik açıdan sünneti tespit edip etmemesi değil, bahsi geçen kavramlarla ifade edilen haberlerin yaşayan sünnete uygunluk arz edip etmemesidir. Bu itibarla Mâlikî mezhebinde metin ve muhteva tenkidinin son derece önemli olduğunu söylemek mümkündür."
