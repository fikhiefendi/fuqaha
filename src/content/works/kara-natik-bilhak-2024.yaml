abstract: "Zeydilik, Irak bölgesinde doğup ilk devletini Taberistan'da kurmuş ve bu bölgede İslâm dinini temsil eder olmuştur. Kuruluş sürecinde Zeydiler Mu'tezile ve Hanefîlikgibi pek çok mezheple etkileşim halinde olmuşlardır. Bu etkileşimle beraber yetişen önemli fakihlerin katkılarıyla Zeydi fıkhı gelişmiş ve sistematik bir hal almıştır. Bu fakihlerden biri de hicri 5. yüzyılda yaşamış Zeydi imam Nâtık-Bilhak'tır. Bu çalışmaya konu olan fakih, çok yönlü bir âlim olup önemli eserler kaleme almıştır. Bu eserler içinde en çok dikkati çekenlerden biri de fürû-i fıkıh alanında yazdığı et-Tahrîr'dir. Bu muhtasar eserinde Nâtık-Bilhak, kendinden önceki Zeydi imamların görüşlerine yer vermiş ve onları özlü bir biçimde aktarmıştır. Bu araştırmamızın amacı, adı geçen eseri üzerinden müellifin Zeydi fıkhındaki yerini ve önemini ortaya koymaktır. Yöntem olarak tabakat kitaplarından yararlanılarak müellifin hayatı ve onu etkileyen fakihler tanınmaya çalışılmış, ayrıca onun bize ulaşan eserleri hakkında genel bilgi verilmiştir. et-Tahrîr'in incelenmesinde örneklem olarak eserin Kitabu'l-buyû' bölümü tercih edilmiştir."
