abstract: "Tezde, Osmanlı Devleti'nin 1851 tarihli ceza kanunnâmesi, mer'i Türk Ceza Kanunu ile mukayeseli olarak incelenmektedir. . Osmanlı'da İslam hukuku ve örfi hukuk birlikte uygulanmıştır. Ceza hukuku alanında da had ile kısâs ve diyet gerektiren suçların yanında ta'zir türünden kanunnâmeler hazırlanmıştır. İslam hukuku kurallarına aykırı olmaması şartıyla bu kanunnâmelerin hazırlanması yöneticilerin yönetim yetkisi dahilindedir. Çalışmasını yaptığımız 1851 tarihli Kanûn-u Cedîd de bu şekilde hazırlanan kanunnâmeler arasında yer alır. Kanûn-u Cedîd, batılı tarzda ancak kanun tekniğinden uzak hazırlanmış ve fasıllarda madde başlıkları da yer almamıştır. 1839 Tanzimat fermanı ile mevadd-ı selase de denilen can, ırz ve malın güvence altına alınma sözü verildiğinden o sözün tutulması mahiyetinde ve 1840 tarihli kanunnâmenin eksiklerini de tamamlama amacıyla bu kanun hazırlanmıştır. Mukaddime kısmında maddelerin İslam hukuku kurallarına uygun olarak hazırlandığı belirtilmiştir. Kanunnâmede İslam hukukunda yer alan had ve kısas cezalarına atıf yapılmakla birlikte ağırlıklı olarak ta'zir alanında kalan suç ve cezalar düzenlenmiştir. Kanunnâmede fasıl başlıkları ve madde başlıkları bulunmamaktadır. Fasıllar ise mukdaddime kısmında değinilen konulara göre sıralı olarak gelmektedir. Yedi sene yürürlükte kalan bu kanun, klasik anlamda İslami kurallardan ilham alınarak hazırlanan son metindir. Yerini Fransa'dan iktibas edilen 1858 tarihli Ceza Kanununa bırakmıştır."
