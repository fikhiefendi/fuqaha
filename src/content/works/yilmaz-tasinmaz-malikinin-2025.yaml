abstract: "Çalışmamızın konusu Türk Medeni Kanunu m.730'da düzenlenen taşınmaz malikinin sorumluluğudur. Çalışma konusunun temel incelenme sebebi, uygulama alanının netleştirilmesi, bu çerçevede sorumlu olabilecek kişilerin kapsamının belirlenmesidir. Çalışmada sorumluluğun konusunu etkileyebilecek güncel konular da ele alınmış ve genel olarak sorumluluğa ilişkin tartışmalı hususlara yer verilmiştir. Çalışma üç bölüme ayrılmıştır. Birinci bölümde, sorumluluğun gelişimi, hukuki niteliği, uygulama alanı ve uygulama alanı bağlamında komşuluk hukuku ele alınmıştır. İkinci bölüm, taşınmaz malikinin sorumluluğunun şartları ve benzer kurumlarla karşılaştırılmasına ayrılmıştır. Üçüncü bölümde ise, taşınmaz malikinin sorumluluğu halinde başvurulabilecek hukuki imkânlara ayrıntılı bir şekilde değinilmiştir. Çalışma sonuç bölümü ile tamamlanmıştır. Çalışma sonucunda TMK m.730'un uygulama alanının komşuluk hukuku olduğu, maddenin amacının komşuluk ilişkilerini düzenlemek olduğu saptanmıştır. Bu çerçevede sorumlu olacak kişilerin kapsamında taşınmaz maliki ile sınırlı ayni hak sahipleri yanı sıra, fiili hakimiyete sahip komşuluk ilişkilerine sıkça dahil olan kişisel hak sahiplerinin de olduğu kabul edilmiştir. Sorumluluğun konusuna, komşuluk hukuku ilişkisi oluşturabilecek Tiny House gibi, taşınmazla bağlantılı taşınır yapılar da dahil edilmiştir. TMK m.730'un diğer sorumluluk türleri ile olan ilişkisi belirlenmiş ve yarışabileceği haller gösterilmiştir. TMK m.730'dan doğan hukuki imkânlar incelenmiş, özellikle aşkın kullanımın sona erdirilmesi davası ile elatmanın önlenmesi davası arasındaki ilişki açıklığa kavuşturulmuştur."
