abstract: "Türkiye'de katılım bankacılığı, finans sektöründe faizsiz bankacılık prensipleriyle hizmet veren bir yapı olarak kendine özgü bir yer edinmiştir. Çalışma, katılım bankalarının işleyişi, karşılaştığı zorluklar, müşteri algıları ve piyasa dinamikleri ile bu bankaların Bu çalışma, Türkiye'de faaliyet gösteren katılım bankacılığı ve mevduat bankacılığı sistemlerini 1985-2024 yılları arasındaki dönemde karşılaştırmalı olarak incelemektedir. Çalışmanın ana amacı, faizsiz bankacılık prensiplerine dayalı katılım bankacılığı ile faiz temelli geleneksel mevduat bankacılığı arasındaki temel farklılıkları ortaya koymak, finansal performanslarını değerlendirmek ve sektördeki gelişim trendlerini analiz etmektir. Araştırma sonuçları, katılım bankacılığının Türkiye'de son yıllarda önemli bir büyüme kaydettiğini, ancak halen toplam bankacılık sektörü içindeki payının %8 civarında olduğunu göstermektedir. Mevduat bankacılığı, sektör hakimiyetini sürdürmekle birlikte, katılım bankalarının özellikle kamu katılım bankalarının piyasaya girişiyle birlikte pazar paylarını artırdığı gözlemlenmiştir. Aktif büyüklük, toplanan fonlar ve kullandırılan krediler açısından katılım bankacılığı, mevduat bankacılığına göre daha hızlı bir büyüme oranı yakalamış durumdadır. Çalışmada ayrıca, sermaye yeterliliği, kârlılık, likidite ve aktif kalitesi gibi temel finansal performans göstergeleri karşılaştırılmıştır. Katılım bankalarının sermaye yeterlilik rasyolarının mevduat bankalarına kıyasla daha yüksek seyrettiği, buna karşın kârlılık oranlarının genellikle daha düşük olduğu tespit edilmiştir. Sonuç olarak, Türkiye'de katılım bankacılığının gelişme potansiyelinin yüksek olduğu, ancak bu potansiyeli tam olarak kullanabilmesi için ürün çeşitliliğini artırması, teknolojik altyapıya daha fazla yatırım yapması ve faizsiz finans konusunda toplumsal farkındalığı geliştirmesi gerektiği değerlendirilmiştir."
