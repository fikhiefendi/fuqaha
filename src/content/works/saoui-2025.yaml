abstract: "Bu çalışma, İslam toplumlarında sürdürülebilir kalkınmayı sağlama konusunda ekonomik medyanın rolünü tartışmaktadır. Çalışma, ekonomik medya kavramını ve İslam ülkelerindeki mevcut durumunu açıklamayı amaçlamakta, aynı zamanda ekonomik medyanın İslam toplumlarında alternatif ekonomiyi canlandırmadaki rolünü incelemeye çalışmaktadır. Ayrıca, ekonomik medyanın İslam ekonomisi ilkelerinin açıklığa kavuşturulmasına ve bunun finansal istikrar üzerindeki etkilerine olan katkısını araştırmaktadır. Çalışma, İslam toplumlarında sürdürülebilir kalkınmanın önündeki engelleri de ortaya koymaktadır. Araştırmada, betimleyici ve analitik bir yöntem izlenmiştir. Çalışma, konuya ilişkin literatür taraması yapılarak teorik verilerin toplanmasını ve bu verilerin araştırmada kullanılmasını amaçlamaktadır. Çalışmada, hedeflere ulaşabilmek için araştırma aracı olarak mülakatlar tasarlanmış ve mülakatlar, ekonomi ve medya alanlarında uzman kişilerle gerçekleştirilmiş, ardından analiz edilip sonuçlar elde edilmiştir. Çalışma, medyanın ekonomik farkındalık yaratmadaki önemini vurgulamış ve ekonomik medyanın sürdürülebilir kalkınmayı sağlamak için temel bir rol oynadığını ortaya koymuştur. Uzmanlar, ekonomik medya aracılığıyla İslam ekonomisi konusunda yapılan farkındalık çalışmalarının hala zayıf olduğunu ve medyanın, İslam dünyasında sürdürülebilir kalkınmayı sağlamak adına hâlâ zayıf bir rol oynadığını belirtmişlerdir."
