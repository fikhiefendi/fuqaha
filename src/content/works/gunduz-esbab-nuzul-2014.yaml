abstract: "Bu araştırmada, Kur'ân'ın nüzûl sürecinde kadınların rolü ele alınmıştır. Araştırmanın amacı, Esbâb-ı Nüzûl rivayetlerinden hareketle vahiy döneminde kadınların sebep oldukları hükümleri tespit ederek incelemektir. Bu bağlamda vahye, sebep ve konu olan ilgili kadınlar ele alınmıştır.Araştırma sonucunda, kadınların doğrudan veya dolaylı olarak sebeb-i nüzûl içerisinde yer aldıkları tespit edilmiştir. Bu kadınlar içerisinde, Hz. Peygamber'in eşleri yanında diğer kadınların da yer aldığı belirlenmiştir. Kadınlarla ilgili temel prensiplerin belirlendiği ve hukuksal konularda uyarıların yer aldığına işaret edilmiştir. Kur'ân'ın kadına değer verdiği ve haklarını gözettiğine vurgu yapılmıştır."
