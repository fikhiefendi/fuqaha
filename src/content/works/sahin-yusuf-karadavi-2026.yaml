abstract: "Bu çalışma, çağdaş İslâm düşüncesinin önemli isimlerinden Yusuf el-Karadâvî ile Murtazâ Mutahharî'nin kadın ve aile ilişkilerine dair görüşlerini karşılaştırmalı olarak incelemeyi amaçlamaktadır. Çalışmada, iki düşünürün kadın, aile, toplumsal roller, eğitim, hukukî haklar ve moderniteye ilişkin yaklaşımları kendi düşünsel arka planları içerisinde değerlendirilmiş; benzer ve farklı yönleri ortaya konulmuştur. Araştırmada, Karadâvî'nin Sünnî gelenek içerisindeki fıkhî ve makâsıd merkezli yaklaşımı ile Mutahharî'nin Şiî düşünce içerisindeki felsefî ve yorumlayıcı yaklaşımı esas alınmıştır. Tezde nitel araştırma yöntemi benimsenmiş, her iki düşünürün kadın ve aile konularını ele alan temel eserleri metin analizi yöntemiyle incelenmiştir. Ayrıca konuya ilişkin akademik çalışmalar, tezler ve makalelerden yararlanılarak karşılaştırmalı değerlendirmeler desteklenmiştir. Çalışma boyunca kadın ve aile meselesi, toplumsal statü, fıtrat anlayışı, aile yapısı, eğitim hakkı, toplumsal katılım ve hukukî düzenlemeler gibi başlıklar altında ele alınmıştır. Araştırma sonucunda, her iki düşünürün kadın ve erkeğin insanî değer bakımından eşit olduğu görüşünde birleştiği; ancak toplumsal roller, aile içi sorumluluklar ve moderniteye yaklaşım konularında farklı metodolojik temellere dayanan yorumlar geliştirdikleri görülmüştür. Karadâvî'nin daha çok klasik fıkhî mirası güncel şartlarla uzlaştırmaya çalışan bir yaklaşım benimsediği, Mutahharî'nin Şiî düşünce içerisindeki felsefî ve yorumlayıcı yaklaşımı esas aldığı tespit edilmiştir. Bu yönüyle çalışma, kadın ve aile meselesine dair farklı yorum biçimlerini karşılaştırmalı ve metodolojik bir çerçevede ortaya koymayı hedeflemektedir."
