abstract: "İslam hukukunda birçok hüküm içtihada dayalı olduğundan farklı görüşlerin ortaya çıkması kaçınılmazdır. Bu görüşlerin ele alınması, tahlili ve mukayesesi yeni problemlerin çözümüne ışık tutmaktadır. Yapılan bu çalışmada, Hanefî ve Şâfiî mezhepleri arasında zekât konusu ile ilgili yaklaşık elli ihtilaflı mesele incelenmiştir. Meseleler incelenirken Hanefî ve Şâfiî mezhepleri için muteber eserler kaynak alınmış, bunların dışındaki kitaplara ise ihtiyaç oranında müracaat edilerek iki mezhep arasındaki farklı görüşler tahlil ve mukayese edilmiştir. Bu çalışmada ele alınan meselelerden bazıları doğrudan naslarla, bazıları ise ya mezheplerin usulleriyle ya da fıkhî kaidelerle ilgilidir. Çalışma boyunca naslarla ilgili ihtilâfların; kimi zaman nasların sübutuna, kimi zaman nasların kapsamına, kimi zaman ise nasların farklı yorumlanmasına dayalı olduğu görülmüştür."
