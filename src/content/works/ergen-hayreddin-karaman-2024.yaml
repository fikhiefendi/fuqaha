abstract: "Hayreddin Karaman, İslâmî geleneğin çağın şartlarına göre yeniden yorumlanması için gayret eden önemli bir İslâm hukukçusudur. İslâm fıkhının dinamikliği için içerisindeki imkânları sonuna kadar kullanmaktan asla geri durmamıştır. Bu imkanlar içerisinde özellikle makasıd ve maslahat ilkesi ile zaruret prensibini kullanarak güncel meselelere çözüm önerileri getirmiştir. Karaman, içtihadın günümüz şartlarında mümkün olduğunu ve yeni problemleri yeni içtihatlar ile hükme bağlamayı hayati derecede zorunlu görmüştür. Asli ihtiyaçları zaruretten gören Karaman'ın Mecelle'nin“Hâcet umumi olsun hususi olsun zaruret menzilesine tenzil olunur”kaidesinin suistimale mahal vermeden nasıl tatbik edileceğine dair teorik açıklamaları ve pratik fetvaları bulunmaktadır. Hassaten zaruret prensibine dayanarak içtimai alanda vermiş olduğu fetvalar toplum tarafından ilgi ile takip edilmiştir. Tezde Karaman'ın zaruret prensibini fetvalarına nasıl yansıttığı ortaya koyulmaya çalışıldı. Bunun için literatür taraması yapılarak elde edilen bulgular analiz edilerek Karaman'ın müktesebatı, eserleri, çeşitli platformlarda yayımlanmış yazıları ve kendisi hakkında yapılmış ilmî çalışmalar incelendi."
