abstract: "Toplumun temeli olan aile, önemini asırlar boyu korumuş, hiçbir sosyal sistem ya da yaşam tarzı bu kurumu ortadan kaldırmamıştır. Aile, toplumla fert arasında bir aracı rolü görmüştür. Ailenin varlığı insanlığın tarihi kadar eski olmakla beraber onun yapısı, görev ve sorumlulukları itibariyle toplumdan topluma farklılık göstermiştir. Tezimizde Cahiliye dönemi aile yapısıyla ilgili hadiseleri ve hükümleri İslam hukukuyla bağlantılı olarak kronolojik bir şekilde incelemeye çalıştık. Yapılan araş-tırmalar, Cahiliye döneminde Hicaz topraklarında ataerkil ve kadının ikinci planda olduğu bir aile yapısı olduğunu göstermektedir. İslam'ın ortaya koyduğu aile yapısı ise, kendine özgü birtakım ilkelere sahip olan ve belki de Kur'an'ın hakkında en çok ayrıntı verdiği kurumdur. Bu da, aileye verilen önemin bir göstergesidir. Cahiliyedeki aile yapısından farklı olarak, İslam'da kurulan aile yuvası çok ciddi hukukî çerçeveye sahiptir. Evlilik (zevac) ve boşanma (talâk) konuları İslam hukukunda ayrıntılı bir şekilde ele alınmıştır. Yapılan bu çalışmada ise, özellikle Cahiliye dönemindeki evlilik ve boşanmaların İslamla beraber nasıl bir değişime uğradığı, ilga edilen, ibkâ edilen ve ıslah edilen yönleri incelenip bunların İslam hukukundaki hükümlere nasıl yansıdı-ğının tespiti hedeflenmiştir."
