abstract: "İslami bankacılık olarak da adlandırılan faizsiz bankacılık, günümüzde dünya çapında ilgi uyandıran yeni bir kavramdır. Son küresel finansal kriz finansal sistemdeki yetersizlikleri açığa çıkartmıştır. Sistemi daha güçlü kılmak için yeni fikirler ve çözümler için arayışa girilmiştir. Bu tezde finansal krizlerden kaynaklanıp, bankaların dayanıklılığını ve zayıflığını etkileyen temel sebepler incelenmeye çalışılmıştır. İslami bankaların içinde çalıştığı çevrenin daha iyi anlaşılması için İslami bankaların Türkiye'de ve dünyada sunduğu temel hizmetler, tarihsel süreç ve günümüzdeki durum incelenecektir.Bu çalışmanın odak noktası, teorik olarak faizsiz bankacılığa dayanan İslami bankalardır. İslami bankaların sahip olduğu en önemli farklardan birinin faiz oranının kullanılmaması olduğu açıklanmaktadır. Bu çalışmada klasik bankalar ve İslami bankalar tarafından karşılaşılan faiz oranı şokunun etkileri Vektör Otoregresyon (VEC) metodu kullanılarak analiz edilmektedir. Bu modellerin deneysel bulguları faiz oranının, hem İslami bankalar hem de klasik bankaların mevduat ve kredi miktarlarındaki değişimlerde etkili olduğu sonucunu doğurmaktadır."
