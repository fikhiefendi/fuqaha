abstract: "Bu çalışma, Mâverdî'nin en-Nüket ve'l-ʿUyûn adlı tefsirinde yer alan furûk örneklerini tespit ve tahlil etmeyi amaçlamaktadır. Araştırmanın temel problemi, Mâverdî'nin yakın anlamlı lafızlar arasında ne tür anlam farkları gözettiği, bu farkları hangi ölçütler üzerinden açıkladığı ve yaptığı ayrımların klasik dil malzemesiyle ne ölçüde örtüştüğüdür. Bu amaçla öncelikle terâdüf, tekârüb ve furûk kavramlarının mahiyeti ve birbirleriyle ilişkisi ortaya konulmuş; ardından en-Nüket ve'l-ʿUyûn taranarak Mâverdî'nin anlam nüansı belirttiği kavram çiftleri tespit edilmiştir. Çalışmanın inceleme alanı, lafızları farklı olmakla birlikte anlamları birbirine yakın olan mütekârib kavram çiftleriyle sınırlandırılmıştır. Tespit edilen örnekler metin merkezli ve karşılaştırmalı bir yöntemle ele alınmış; Mâverdî'nin yaptığı ayrımlar, tahlil aşamasında başta Râgıb el-İsfahânî, İbn Fâris, İbn Manzûr, Cevherî, Fîrûzâbâdî ve Ebû Hilâl el-Askerî olmak üzere klasik lügat ve furûk kaynaklarının verileriyle karşılaştırılmıştır. Araştırma sonucunda Mâverdî'nin, furûk alanında müstakil bir eser telif etmemiş olmakla birlikte, en-Nüket ve'l-ʿUyûn'da yakın anlamlı lafızlar arasındaki nüansları bilinçli ve işlevsel biçimde kullandığı tespit edilmiştir. Müellifin terâdüfü mutlak biçimde reddetmediği; buna karşılık ortak anlam alanında bulunan lafızlar arasında tam bir ayniyet kabul etmeyerek bunların kapsam, derece, kullanım, bağlam ve delâlet yönlerinden ayrılabildiğini ortaya koyduğu görülmüştür. İncelenen örneklerin büyük çoğunluğunda Mâverdî'nin yaptığı ayrımların klasik lügat ve furûk verileriyle uyumlu olduğu anlaşılmıştır. Çalışma bu yönüyle, Mâverdî'nin tefsirindeki lugavî-semantik yaklaşımın daha belirgin biçimde ortaya konulmasına ve furûkun klasik tefsir geleneğindeki uygulama biçiminin anlaşılmasına katkı sağlamaktadır."
