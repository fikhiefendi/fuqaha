abstract: "Hz. Peygamber (s.a.v.) döneminden sonra İslam Hukukunun temel kaynağı olan Kur'an ve Sünnet'in kabûlü hususunda ihtilaf olmamakla beraber nasları anlama, yorumlama ve özellikle de hadisleri tasnif noktasında farklı anlayışlar ortaya çıkmıştır. Hadislerin tasnifi döneminde gerek geniş gerekse dar anlamda hadislerin anlaşılıp değerlendirilmesi konusunda yoğun bir tartışma ortamı mevcuttur. Birtakım âlimler hadislerin sıhhat derecesini bir kenara bırakarak ondan çıkarılabilecek hükümlere yönelmişlerdir. Ehl-i Hadis içerisinden de bu gruba karşıt olarak hadislerin senet ve metinlerini önceleyen âlimler yetişmiştir. Bu kutuplaşma, bir dönem hadis ile fıkhın birbirinden bağımsız ilimler olduğunu düşündürmüştür. Ancak çok geçmeden bu ayrışmanın faydadan ziyade zarar getireceği anlaşılmıştır. Zîrâ İslamî ilimler bir bina, hadis ve sünnet bu binanın temeli, fıkıh da bu temelin üstünde yükselen gövdedir. Temele dayanmayan bina çökmeye, üzerinde bina olmayan temel de harabe haline gelmeye mahkûmdur.Çalışmamızın konusu olan Takiyyüddin İbn Dakîkü'l-Îd'in İhkâmü'l-Ahkâm adlı eseri ahkâm hadislerine dair bir derlemedir. Hadislerden sonra mezhep görüşlerinin de verildiği eserde Ebû Hanîfe'ye atfedilen görüşleri tespit ettik ve Hanefî kaynaklardan doğruluğunu araştırdık. İbn Dakîk altmış dokuz noktada yaptığı atıflardan dördünde doğru görüşü verememiştir.Sonuç olarak diyebiliriz ki, mezhepler hakkındaki görüşleri ana kaynaklarından gördükten sonra diğer eserleri okumak bizleri hatalı kanaatler edinmekten alıkoyacaktır. Ayrıca tek bir kitaptan bir şeyler öğrenmeye çalışmak pek sağlıklı olmamaktadır, mümkün oldukça ulaşılabilen bütün kaynaklar incelendikten sonra bir neticeye varılmalıdır."
