abstract: "Bankacılık sisteminin, bir ülkenin ekonomik büyümesine olan katkısınının yanı sıra ülkenin ekonomik gelişmesi üzerinde de önemli bir katkısının bulunduğunu söylemek mümkündür. Bankacılık sistemi, sadece iç tasarrufları ve yatırım finansmanını harekete geçirmedeki rolü ile değil aynı zamanda dış tasarruf ve yatırım finansmanınındaki rolüyle de ekonomik faaliyetlerin özünü oluşturmaktadır. Dolayısıyla bir ülkenin bankacılık sisteminin gelişmişliği ve derinliği ne kadar yüksek olursa o ülke ekonomisine katkısı o ölçüde yüksek olacaktır. Son yıllarda İslami bankacılığın göstermiş olduğu başarılar, İslamı bankacığın bankacılık sistemi içindeki önemini daha da arttırmıştır. Özellikle 2008 küresel finans krizi sonrasında İslami bankacılığın, küresel piyasalarda izlenen olumsuz gelişmelerden geleneksel bankacılığa oranla daha az etkilendiği gözlenmiştir. Bu bağlamda da İslami bankacılık sisteminin dünya bankacılık sisteminde önemli bir role sahip olduğunu söylemek mümkündür. Yemen ekonomisi, bölgesel ve uluslararası düzeyde farklı ekonomilere kıyasla daha küçük olmasına ve ekonomi içinde faaliyet gösteren finansal kuruluş sayısı sınırlı olmasına rağmen Yemen'deki İslami bankalar, dünya İslami bankalarının küresel kalkınmasından olumlu yönde etkilenmişlerdir. Yemen'de İslami bankacılık yeni olmasına rağmen Yemen İslami bankaları, Yemen bankacılık sisteminin toplam aktiflerinin yaklaşık % 32'sine sahip olarak hızlı bir büyüme göstermiştir. Bu çalışmada, 2006:1-2015:4 dönemi için çeyreklik veriler kullanılarak Yemen İslami bankalarının aktif büyüklüğü, mevduat büyüklüğü ve finansman büyüklüğünün Yemen ekonomisinin büyümesi üzerine olan etkileri analiz edilmiştir. Bu amaç doğrultusunda; Lee-Strazicich (2004) LM yapısal kırılmalı birim kök testi, Hatemi eşbütünleme testi, Hatemi asimetrik nedensellik testi kullanılmıştır. Sonuç olarak GDP ile İslami bankalara ilişkin bankaların aktif büyüklüğü, bankaların mevduat büyüklüğü ve bankaların finansman büyüklüğü arasında uzun dönemli eşbütünleşme ilişki olduğu belirlenmiştir. Buna karşın aynı serilere ait kısa dönemli bir ilişki olmadığı tespit edilmiştir."
