abstract: "İslami bankacılık, dünya ekonomisinde alternatif bir bankacılık sistemi olduğu için pek çok kesimin ilgisini çekmektedir. Ülkemizde ise bilinen ismiyle katılım bankacılığı faizsiz bankacılık hizmetleri prensibiyle yola çıkan ve İslami kurallara uygun olarak finansal ürünler sunan bir bankacılık sistemidir. Katılım bankalarının bankacılık sektöründeki toplam payı Ocak 2024 itibariyle %8,7'dir. Sektörde var olan pazar payını artırabilmesi ve konvansiyonel bankalarla rekabet edebilmesi için çeşitli alanlarda gelişim göstermesi gerekmektedir. Bu çerçevede müşteri portföyünü genişletecek yeni ürünler sunabilmesi son derece önemlidir. Aynı zamanda bu ürünlerin İslami esaslara uygun olarak tasarlanması ve konvansiyonel bankalarla rekabet edebilecek güce sahip özelliklerde olması gerekmektedir. Dünyada ve ülkemizde yaygın bir şekilde kullanılan kredi kartı bu çalışmanın diğer ana başlığını oluşturmaktadır. Konvansiyonel bankacılık sisteminde kredi kartı modern ve pratik bir ödeme aracı olarak işlev görmektedir. Aynı zamanda kredi kartı, kısa vadeli faizsiz kredi sağlayan bir enstrümandır. İslami bankalar, geleneksel kredi kartı ile benzer özellikler taşıyan ancak İslami prensiplere uygun olarak işleyen kredi kartı hizmeti verebilmek için alternatif ve uygulanabilir yöntemler aramaktadır. İslami kredi kartı piyasasının gelişimi, İslam ekonomisi ve finansman yaklaşımının piyasada kabulünü ve güvenini ifade etmektedir. İslami kredi kartlarının kullanımı ve yaygınlaşması, katılım bankalarının gelişmesi ve büyümesine kuşkusuz katkı sağlayacaktır. Hem İslami ilkelere uygun hem de konvansiyonel bankalarla rekabet edebilecek pazar odaklı murabaha tabanlı kredi kartı modelinin uygulamaya kazandırılması bu araştırmanın önemli hedeflerinden biridir. Bu hedef çerçevesinde çalışmanın temel amacı Z kuşağına (üniversite öğrencilerine) hitap edebilecek pazar odaklı murabaha tabanlı bir kredi kart model önerisi sunmaktır. Bu amaç doğrultusunda araştırmada nitel yöntem kullanılmıştır. Türkiye'de faaliyet gösteren katılım bankalarında çalışan ve alanında en az 5 yıl iş tecrübesi bulunan toplam 24 meslek uzmanıyla yarı yapılandırılmış görüşmeler gerçekleştirilmiştir. Elde edilen verilerin kodlanması ve analizi sürecinde MAXQDA nitel analiz programı kullanılmıştır. Sonuç olarak 4 önemli tema üzerinden konu detaylı olarak değerlendirilmiş ve katılımcıların konuya dair bakış açıları sunulmuştur. Bu temalar şu şekildedir: Katılım bankalarının işleyişi, katılım bankacılığında görülen mevcut problemler, müşterilerin İslami bankacılığı tercih nedenleri ve önerilen modele ilişkin deneyimler. Elde edilen bulgular ışığında literatüre yeni bir kavram olarak katkı sağlayacak Pazar odaklı murabaha tabanlı kredi kart model önerisi sunulmuştur."
