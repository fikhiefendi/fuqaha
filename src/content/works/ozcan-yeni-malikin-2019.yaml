abstract: "Kira sözleşmeleri günlük yaşamda en çok karşılaşılan sözleşme türlerindendir. Türk Borçlar Kanunu'nda adi kira, konut ve çatılı işyeri kirası ile ürün kirası düzenlenmiştir. O halde genel olarak kira sözleşmelerini üç farklı kategoride değerlendirmek gerekmektedir. 01.07.2012 tarihinde 6098 sayılı Türk Borçlar Kanunu kabul edilmiştir. Bu kanunun kabulü ile 818 sayılı Borçlar Kanunu yürürlükten kaldırılmıştır. 6098 sayılı TBK döneminden önce iki ayrı kanun düzenlemesi kira sözleşmeleri bakımından uygulanmakta idi. Bunlardan ilki 818 sayılı Borçlar Kanunu, bir diğeri ise 6570 sayılı Gayrimenkul Kiraları Hakkındaki Kanun idi. Ancak 01.07.2012 tarihinden itibaren ikili ayrım yerine kiraya ilişkin tüm hükümler tek çatı altına toplanmıştır. Kira sözleşmeleri, 6098 sayılı TBK m. 299- 378 arasında düzenleme alanı bulmuştur. Kira ilişkileri durağan bir yapıya sahip olmadığından kira ilişkisinin tarafları zamanla değişebilmektedir. Kira ilişkisinin tarafları ise kiracı ile kiralananı kiraya veren kişidir. Çalışmada öncelikle kira sözleşmesine ilişkin genel bilgiler verilecektir. Bunun devamında birinci bölümde kira sözleşmesinin sona erme nedenleri ile konut ve çatılı iş yeri kavramına değinilecektir. Esas konu olan yeni malikin ihtiyacına dayalı olarak kira ilişkisinin sona erdirilmesi ise TBK m. 351'de düzenlenmiş olup bu hüküm çerçevesinde değerlendirmeler yapılacaktır. Son olarak üçüncü bölümde ise kira sözleşmesinin sona ermesi nedeniyle açılacak olan tahliye davasında usul hukukuna ilişkin ne gibi sonuçlar olduğu değerlendirilecektir. Ayrıca bu çalışmada gerek Yargıtay'ın vermiş olduğu kararlar gerekse öğretideki farklı görüşler incelenerek, tüm bu incelemeler bağlamında sonuca varmak amaçlanmaktadır."
