abstract: "Bu araştırma, el-Bahru'r-râik şerhu Kenzi'd-dekâʾik adlı kitaba yazılmış olan Feyzü'r-râzık ʿale'l-Bahri'r-râik isimli haşiyenin ibadetler bölümünün edisyon kritiğidir. Ebü'l-Berekât en-Nesefî'nin (ö.710/1310) kendi telif ettiği el-Vâfî'nin muhtasarı olan Kenzü'd-dekâik, Hanefî fakihlerin itibar ettiği en önemli kaynaklardan biridir. Yıllarca medreselerde ders kitabı olarak okutulan ve üzerine çok sayıda şerh ve haşiye yazılmış bir eser olan Kenzü'd-dekâik üzerine fıkıh ilmindeki otoritesi bilinen Zeynüddin İbn Nüceym (ö. 970/1563), el-Bahrü'r-râik isimli bir şerh yazmış, bu esere de Hayrettin er-Remlî (ö. 1081/1671), Feyzü'r-Râzık ismiyle bir haşiye kaleme almıştır. Haşiyenin müellifi Hayrettin er-Remlî tefsir, hadis ve özellikle fıkıh ilminde yetkinliği kabul edilen, yaşadığı dönemin önde gelen şahsiyetleri arasında kabul edilen bir âlimdir. Engin fıkıh birikimi yanında muhaddis ve edip kimliğiyle de şöhret bulan Remlî'nin, bazı araştırmacılar tarafından“meselede müctehid”ve“muhakkik âlimlerin sonuncusu”şeklinde unvanlarla anıldığı göz önünde bulundurulduğunda haşiyenin değeri daha iyi anlaşılacaktır. Bu çalışma, giriş, iki ana bölüm ve sonuçtan oluşmaktır: Araştırmanın çerçevesi ve sınırları hakkında bilgi verilen giriş bölümünün ardından birinci bölümde müellifin biyografisi, ilmi kişiliği ve mezhebi ele alınmıştır. Ayrıca babasının notlarını derleyerek bu eserin oluşmasına katkı sunmuş olan Necmettin er-Remlî ile haşiyenin üzerine yazıldığı şerhin müellifi olan İbn Nüceym hakkında da kısa bir bilgi verilmiştir. İkinci bölümde“hâşiye, şerh ve metin”üçlüsünün kısa bir tanıtımı yapıldıktan sonra inceleme konumuzu teşkil eden Feyzü'r-Râzık'ın müellife aidiyeti, eserin nüshaları muhtevası, kaynakları ve bazı özellikleri ele alınmıştır. Yine bu bölümde eser, fıkhî açıdan değerlendirmeye çalışılmış ve son olarak müellifin bazı tercihlerine yer verilmiştir."
