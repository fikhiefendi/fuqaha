abstract: "İbnü'l-Hümâm (ö. 861/1457), Hicrî IX. asırda yaşamış usûlü'd-dîn, usûlü'l-fıkıh ve usûlü'l-lugayı çok iyi bilen, yed-i tûlâ sahibi çok yönlü, asırlara damgasını vurmuş velûd bir Hanefî fakihi ve müçtehididir. Usül, fürû, nevâzil türü eserlerin ve muhtasar metinlerin yazılarak mezheplerin sistematik hale gelmesi ve görüşlerinin istikrar bulmasından sonra mezhebe bağlılığın öne çıktığı bir dönemde; mezhep içi tercihleri, mezhep imamının görüşünün terk edilmesi ve mezhebe muhalif olan bir görüşün benimsenmesi hususlarında delilin götürdüğü yere gitmekten çekinmemiş ve özgün tercihler ortaya koymuştur. Müçtehit bir âlim olan İbnü'l-Hümâm, mezhebe değil hakka tabi olmayı şiar edinmiş ve mukallit müftüler için ortaya konulan mezhep içi tercih usullerine bağlı kalmamıştır. Bu çalışmada İbnü'l-Hümâm'ın Fethu'l-kadîr li'l-ʿâcizi'l-fakîr ve et-Tahrîr fî ʿilmi'l-usûl adlı eserleri esas alınarak aile hukuku alanındaki tercihleri ve mezhebe muhalif görüşleri incelenmiştir. Aynı şekilde kendisinden sonraki dönemlerde müellifin tercih ve görüşlerinin ne derecede benimsendiği ve sonraki âlimler üzerindeki etkisi de ortaya konulmuştur. Anahtar Kavramlar: Fıkıh, Mezhep, Meşâyih, İhtilaf, Tercih, İbnü'l-Hümâm."
