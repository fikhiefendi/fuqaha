abstract: "Çalışmamızda Muvatta'da yer alan bir grup mürsel hadisi isnâd-metin analizine tabi tutmak suretiyle irsâl-ittisâl konusunu, isnadların geriye doğru büyüme eğilimi gösterdiği ve isnâdların ıslâhı iddialarını incelemeyi amaçladık. Tezin ilk bölümünde Muvatta', nüshaları, Muvatta' metninin oluşum süreci hakkındaki bilgi ve iddialar deskriptif bir şekilde verildi; ancak Muvatta' metninin tarihlendirilmesi meselesiyle ilgili araştırma neticesinde ulaşılan değerlendirmelere de yer verildi. Araştırmanın ikinci bölümünde irsâl-ittisâl ve vasl konuları öncelikle usûl, ricâl ve diğer temel kaynaklar daha sonra bu meseleye yer veren modern çalışmalar ışığında ele alındı. Özellikle rivâyet tarihi açısından bu konunun nasıl anlaşılması gerektiği ve yapılacak değerlendirmelerin isnad teşekkülü hakkındaki düşünceleri nasıl etkilediği de işlenmeye çalışıldı. Tezin son bölümü olan üçüncü bölümde Muvatta'da tespit edilen mürsel rivâyetlerden Kütüb-i sitte'de mevsûl senedle yer alanlarından bir grup, isnâd-metin analizine tabi tutuldu. Bu analizde ilgili rivayetin, önce İmam Mâlik'in döneminde telif edilen, daha sonra ise Muvatta'dan sonra kaleme alınan eserlerde nasıl yer aldığı ortaya konuldu. Muvatta'da mürsel olmasına rağmen başka eserlerde de muttasıl senedle bulunan rivâyetlerin isnad-metin analizi yapılarak isnaddaki değişimin metni ne derece etkilediği tespit edilmeye çalışıldı."
