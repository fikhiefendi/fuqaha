abstract: "Bu çalışmada İslam miras hukukunda kadınların mirası ve Afgan Medenî Kanunu'yla karşılaştırılması hedeflenmiştir. Çalışmamız, giriş ve sonuç dışında iki bölümden oluşmaktadır. Birinci bölümde İslami miras hukukunun terminolojisi, İslam öncesi kadınların miras hukuku, mirasın tanımı, Afgan Medenî Kanunu'nun tanıtımı, mirasın meşruiyeti, koşulları, erkânları, sebepleri ve bunlarla ilgili terimler İslam hukuku ve Afgan Medenî Kanunun açısından açıklanmıştır. Ayrıca, genel olarak, bu bölümün sonunda bahsedilen materyaller, Afgan Medenî Kanunu ile karşılaştırılmıştır. İkinci bölümde, eşlerin miras durumu, öz kızlarının miras durumu, oğul kızlarının miras durumu, öz kız kardeşlerinin miras durumu, baba bir kız kardeşin miras durumu, ana bir kız kardeşinin miras durumu, annenin miras durumu ve nenenin miras durumu, İslam hukuku ve Afgan Medenî Kanunun açıklamalarına yer verilmiştir. Ayrıca her mirasçının miras durumu açıklandıktan sonra, o mirasçının miras durumunun Afgan Medenî Kanunu ile karşılaştırılmasına da yer verilmektedir. Bölümün sonunda Red ve Zevi'l-erhâm aracılığıyla kadınların mirasına da değinilmektedir."
