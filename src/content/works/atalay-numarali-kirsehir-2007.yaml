abstract: "Çalıstıgımız konu(H.1328?1332) (M.1910?1914) yıllarına ait 24 numaralı Kırsehir Ser'iyye Sicili'dir. Çalısmamızın basında Ser'iyye sicillerinin ortaya çıkısı, Osmanlı Ser'iyye Sicillerinin tarihi gelisimi, ser'iyye sicillerinin önemi ve kapsadıgı belgelerin konumuzla baglantılı olması nedeniyle Osmanlı Devleti'nin hukuki yapısını ser'î ve örfî hukuku ana hatlarıyla ele alarak izah etmeye çalıstık. Kırsehir'e ait ser'iyye sicillerinin incelenmesi ile mahalli tarihçilerin ihtiyaç duydukları malzeme, sayılabilir rakamlarla verilmektedir. Milattan önceki tarihlere kadar uzanan bir tarihin parçası olan Kırsehir en iyi dönemini Selçuklular döneminde yasamıstır. Bir sınır kenti olması nedeniyle devletlerarasında sürekli yönetimi degisen bir sehir olmustur. Osmanlılar döneminde ise güvenlik açısından huzurlu ancak gelismesi durmus bir il konumundadır. 24 numaralı Kırsehir Ser'iyye sicili 47 varak 94 sahife 157 aded belgeden olusmaktadır. Sicillerin hepsi müslüman halkın miras taksimi ile ilgili hususlardan olusmaktadır. O dönemde yasayan gayr-i Müslim halkla( Rum Ortodoks ve Ermeniler) bir sorun yasanmadıgı mahkeme kayıtlarından anlasılmaktadır."
