abstract: "“İmam Şafii'ye Göre Sahabe Kavlinin Kaynak Değeri”isimli bu çalışma üç ana bölümden oluşmaktadır. Birinci bölüm İmam Şafii'nin hayatı, eserleri, yaşadığı devrin siyasi ve ilmi bakımdan değerlendirilmesi, fikhında esas aldığı kaynaklar ile benimsemediği yöntemler hakkında bilgi verilmiştir. İkinci bölümde“Sahabe Kavli”kavramı üzerinde durulmuş; sahabe, sahabe kavli ve çeşitleri hakkında bilgi verilerek fakihlerin bunların kaynak değerine dair görüşleri ve gerekçeleri serdedilmiştir. Üçüncü bölümde“İmam Şafii'ye Göre Sahabe Kavli”incelenmiş, onun bu anlamda kullandığı kavramlar üzerinde durulmuş, eski ve yeni mezhebi çerçevesinde sahabe kavlinin hüccet oluşu, Kur'an, sünnet, icma ve kıyasla irtibatı örnekleriyle açıklanmıştır. Yine bu son bölümde Şafii'ye göre sahabe kavlinin çeşitleri ve her birisinin hükme kaynak oluşu, kıyastan önce gelen bir delil olup olmadığı, sahabenin İhtilaf ettiği konularda hangi ölçülere göre tercihte bulunacağı izah edilmiştir. Son olarak da onun ittiba ve taklidden maksadının ne olduğu fikhındaki ifadelerinden çıkarılarak açıklanmıştır. VI"
