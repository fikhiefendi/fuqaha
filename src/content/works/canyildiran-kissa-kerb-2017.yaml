abstract: "Mensur hikâye metinlerimizin ve bunların incelenip değerlendirilmesi hem eski edebiyatımızın daha iyi anlaşılması hem de günümüz sanatçısına kaynaklık etmesi açısından çok değerlidir. Bu düşünceden hareketle bu çalışmamızda mensur bir hikâye örneği olan ve döneminde de birçok insan tarafından asker ocaklarında ve kahvehanelerde okunan aynı zamanda“Gazavatnâme”ve“Menâkıbnâme”olarak isimlendirilebilecek bu eser üzerinde büyük bir istekle çalıştık. Battalnâme ve Danişmentnâme gibi dinî ve hamasî nitelikler taşıyan bu eseri edebiyatımıza kazandırmayı amaçladık. Türk hikâye geleneğinde de sözlü geleneğin getirdikleri ile birlikte İslamiyet'in etkisi açık biçimde görülmektedir. İslamiyet etkisi altında gelişen Türk destanlarında yapılan mücadele ve savaşların amacı İslamiyet öncesi destanlarınkinden çok farklıdır. Bu destanlarda maddi kuvvetle manevi kuvvet birleşir, bilhassa maneviyat ön plandadır. Kerbnâme'nin mensur 3 ciltlik nüshası Atatürk Kütüphanesi Muallim Cevdet yazmaları arasında bulunmuştur. Transkripsiyonlu metni ve incelemesi üzerinde çalışmış olduğumuz nüsha Muallim Cevdet K. 234'te kayıtlıdır. Hikâye Hz. Osman'ın şehit edilmesiyle başlar. Mervan bunu fırsat bilerek Hz. Osman'ı Hz. Ali'nin şehit ettiği iftirasında bulunur. Hz. Ayşe bu haberi duyunca üzüntüyle orduyu toplayıp savaşa gider. Ancak Said ibn Vakkas onu vazgeçirir. Bu kısımdan sonra Muhammed Hanefî hikâyeye dâhil olur. Birçok kimse onun zulmünden şikâyet ederek Hz. Ali'nin huzuruna gelirler. Hz Ali onun böyle şeyler yapmasına ihtimal vermez ve bir mektup gönderir. Mektupta kâfirlerden itibar görmediklerini zulümden şikâyet edenlerin de onlar olduğunu söyler. Hz. Ali'den onlarla savaşmak için izin ister Hz. Ali bunu kabul eder. Hz. Ali ona yardım etmesi için Kerb Gâzî'den yardım ister. Muhammed Hanefî ile Kerb Gâzî birlikte kâfirlere karşı cenge başlarlar. Anahtar Sözcükler Hz. Ali, Kerb Gâzî, Muhammed Hanefî, hikâye, dinî, hamasî."
