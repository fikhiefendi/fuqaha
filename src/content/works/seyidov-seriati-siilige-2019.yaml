abstract: "Ali Şeriati, çok yönlü bir düşünür olup, fikirleri ile kitleleri etkilemiş ve oluştur-duğu etki alanı İran sınırlarını aşmıştır. Bu nedenle onun, dine ve özellikle Şiiliğe dair düşüncelerinin İslam Mezhepleri Tarihi bağlamında değerlendirilmesi önem arz et-mektedir. Şeriati, Şia'nın en temel ilkesi olan imamet inancına dair genel Şii algısının dı-şında bir yorum getirmiştir. Çalışmamızda Şeriati'nin, imametin sınırlı bir dönemi esas aldığını ifade eden yaklaşımı Şiiliğe yönelik bir açılım arayışı olarak değerlendirilmiş-tir. Diğer taraftan Marksizm başta olmak üzere diğer modern ideolojilere ait düşünce-lerinden hareketle Şia'nın tevhid, adalet, gaybet ve intizar gibi temel ilkelerine dair geliştirdiği yorumlar da düşünürün Şiiliğe yönelik açılım arayışının yansımaları olarak ele alınmıştır. Bu noktada Şeriati'nin faaliyetlerinin, Şiiliği geleneksel donuk yapısın-dan kurtararak sosyal hayatın gerekliliklerine uygun bir hale getirme, bir başka ifadey-le Şiiliği sosyalleştirme amacı taşıdığı görülmektedir. Şeriati'nin yaşadığı dönemde (1933-1977) İran'daki siyasi hareketliliğin, Mark-sizm, Egzistansiyalizm gibi Batılı ideolojilerin Şeriati üzerindeki etkisi hesaba katılır-sa düşünürün fikirlerinin doğru anlaşılması için dönemin sosyo-politik koşullarının iyi bilinmesi gerekmektedir. Bu gerekliliğe binaen çalışmamızda İran'ın sosyo-kültürel ve dini yapısı ele alınarak Şeriati'nin yaşadığı dönemin siyasi, sosyal, kültürel ve dini ortamının genel çerçevesi çizilmeye çalışılmıştır. Bu bağlamda Şeriati'nin düşüncele-rinin netlik kazanması açısından onun muasırları arasında dine ve Şiiliğe yönelik farklı yaklaşım tarzı geliştiren Humeyni, Kesrevi ve Mutahhari gibi düşünürlerin fikirlerine genel hatlarıyla yer verilmiştir. Çalışmamızda çaba gösterilen hususlardan biri de coş-kulu bir üsluba sahip olan Şeriati'nin düşüncelerinin hissi çıkarımlardan uzak, akade-mik ilkelere bağlı kalınarak değerlendirilmesi olmuştur. Anahtar Kelimler: Şeriati, İran, Şiilik, İmamet, Açılım, Marksizm."
