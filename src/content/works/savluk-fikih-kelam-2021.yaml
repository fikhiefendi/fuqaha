abstract: "Bu çalışmamızda özellikle fıkıh usulü ilminde yer alan ibâha kavramını usul-ı fıkıh ve kelam ilişkisi bağlamında ele aldık. İbâha kavramı, fıkıhta kişinin bir eylemi işleyip işlememe hususunda mutlak anlamda serbestliğini ifade eder. Henüz erken dönemde ortaya çıkan dini hükümlerin şer'îliği-aklîliği tartışmasının zeminini oluşturan ibâha hükmü, özellikle şer'î bildirim öncesi insanların eylemlerinden sorumlu olup olmayacağı çerçevesinde tartışılmış ve bu mesele çerçevesinde mezheplerin hüküm teorisi şekillenmiştir. Husün-kubuh meselesinin en somut semeresi olan bu tartışmada mezheplerin aklın fonksiyonu ile ilgili görüşleri açıklığa kavuşmaktadır. Aklın dini hukukun oluşumundaki fonksiyonu ve sınırı ile ilgili en fazla veriyi şer'î bildirimin olmadığı toplumlarda eylemlerin hükmü ile ilgili tartışmada bulmaktayız. Can güvenliği, hürriyet ve mülkiyet gibi en temel hakların uhrevî sorumluluk getiren hukukî niteliğe sahip olabilmesi için şer'î bildirimin varlığını şart koşan Eş'arîler ile aklın doğası gereği bir takım hükümleri idrak edebileceğini savunan Mu'tezile arasında cereyan eden bu tartışma, Mu'tezilenin dini ispat/temellendirme gayesiyle ortaya attığı iddia ile gündeme gelmiştir. İbâha hükmü bu ciddi iddianın bir örneklemi konumundadır. Aslî (aklî) ibâha-şer'î ibâha tartışmasının lafzî bir tartışma olduğunu iddia edenlerin aksine ihtilafın arka planında yatan kelamî ilkeleri izah ederek konuyu analiz ettik. Eşyanın aslının mubah mı yoksa mahzur mu olduğu tartışması mülkiyet teorisi ile ele alınmaktadır. Bu durum füru' eserlere de yansımış olduğundan ibâhayı furu' fıkıhta mukabili \"milki\" açıklayarak ele aldık."
titleTranslation: {"en": "The analysis of concept of ibaha in the context of the relationship between jurisprudence and kalam"}
