abstract: "Toplumun çekirdeği olan bireyler arasında kardeşlik, anlayış ve hoşgörü ortamı meydana getirmek için doğru hükümler vermek hâkimlerin sorumluluğundadır. Hâkimlerin hükümlerini etkileyen en önemli hususlardan birisi şüphesiz ispat vasıtalarıdır. Özellikle, bu vasıtalardan karineler, zayıftan kuvvetliye doğru farklı şekillerde bulunabildiklerinden dolayı daha dikkatli bir şekilde değerlendirilmelidir. Karine konusu çeşitli açılardan çalışılmış bir konudur.“el-Mâverdî'nin el-Ḥâvî'l-Kebîr İsimli Eseri Esasında İslam Ceza Hukukunda Hadd ve Kısas Gerektiren Suçların İspatında Karine”konulu bir çalışmaya bizi sevk eden düşünce, hâkimin adaleti sağlamada esas alacağı ispat vasıtalarından karineyi, uzun zaman yargı faaliyetinin içinde hâkimlik sıfatıyla bulunan bir fakihin anlayışı çerçevesinde ele almaktır. Tez giriş, iki bölüm ve sonuçtan oluşmaktadır. Girişte araştırmanın konusu, sınırları, metodu ve kaynakları ele alınmaktadır. Birinci bölümde, Maverdî'nin Hayatı-Eserleri ve Şafiî Mezhebindeki Yeri ile Genel Olarak İslam Ceza Hukukunda Suç Kavramı ve İspatı ana başlıkları altında konuyla ilgili temel kavramlar işlenmektedir. İkinci bölümde ise Haddi ve Kısası Gerektiren Suçların İspatında Karine başlığı altında zina, kazf, sarhoşluk, hırsızlık, yol kesme, irtidat ve bağy suçlarının ispatında karine delilinin etkisi ele alınmakta, bir de kısası gerektiren suçların ispatında karinenin rolü üzerinde durulmaktadır. Sonuç bölümünde elde edilen önemli bulgular değerlendirilmektedir. Anahtar kelimler: Karine, Hadd, Kısas, Suçlar"
