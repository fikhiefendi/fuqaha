abstract: "Hanefî mezhebinde yazıldığı günden bu zamana kadar ilgi gören Meydânî'nin el-Lübâb fî Şerhi'l-Kitâb isimli kitabının Hanefî mezhebi tercih usulüne göre görüşleri ortaya konup mezhebe muhalif olan görüşlerinin inceleneceği bu çalışmanın giriş kısmında konunun önemi, amacı, yöntemi ve kaynakları ele alınmıştır. Birinci bölümde Meydânî'nin hayatı ve çalışmamızın konusu olan el-Lübâb fî şerhi'l-Kitâb isimli eser üzerinde durulmuştur. İkinci bölümde, el-Lübâb isimli eserin tahâret, namaz ve münâkahat bahisleri, mezhebin temel kaynaklarından istifade edilerek tercih usulü kurallarına göre incelenmiştir. Sonuç kısmında ise tezin yazım sürecinde elde ettiğimiz sonuçlar ortaya konulmuştur."
