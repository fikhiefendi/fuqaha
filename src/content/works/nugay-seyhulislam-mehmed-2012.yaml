abstract: "Sorulan dinî-hukukî meselelere cevap vermek anlamına gelen fetvâ, İslâmiyet'in doğduğu ilk asırdan itibaren günümüze kadar devam eden, toplumsal bir ihtiyacın sonucudur. Müslüman toplumlarda, toplumsal yapıda ortaya çıkan herhangi bir durum veya mesele, mutlâk surette fakîh önüne gelir ve bu meseleye fetvâ suretiyle cevap verilmektedir. Bu açıdan fetvâ kitapları, yazanın zamanında vukû bulan hâdiseleri yansıtmaktadır. Biz de bu çalışmamızda dönemin önemli âlimlerinden Şeyhülislam Mehmed Emin Ankaravî'nin önemli eseri Fetâvâ-yı Ankaravî'yi incelemeyi hedefledik.Fetâvâ-yı Ankaravî, XVII.yüzyılda Şeyhülislam Mehmed Emin Ankaravî tarafından klasik fetvâ kitapları sistematiğinde yazılmış meşhur ve mûteber bir fetvâ kitabıdır. Eser, Hanefî fıkhına dair yazılmıştır. Konular, `kitab' ve `fasıl'lara ayrılarak ele alınmıştır. İki ciltten oluşan kitap oldukça hacimlidir. Bu nedenle biz de çalışmamızı `aile hukuku' ile sınırlandırmayı uygun gördük.Tez; giriş, üç bölüm ve sonuçtan oluşmaktadır. Girişte fetvâ, incelenen eser ve tez hakkında bilgi verilmektedir. Birinci bölümde fetvâ ve iftâ müessesesinden bahsedilmektedir. İkinci bölümde yazarın hayatı, eserleri, ilmî kişiliğinden bahsedilmekte ve meşhur eseri Fetâvâ-yı Ankaravî ve bu eserdeki metodu hakkında detaylı bilgi verilmektedir. Üçüncü bölümde eserin aile hukuku bölümündeki fetvâlar incelenmektedir. Sonuçta ise genel değerlendirme yer almaktadır.Fetâvâ-yı Ankaravî, Osmanlı Devleti'nde gerek müftüler gerekse kadılar tarafından sıkça başvurulan bir fetvâ kitabı olmuştur. Kendinden sonraki eserlere de kaynak olma özelliği teşkil etmektedir. Bu eser Fetâvâ-yı Ankaravî hakkında Türkiye'de yapılan ilk çalışma olması nedeniyle birçok hata ve eksiklik bulunması muhtemel olup, en azından bundan sonra bu eser hakkında yapılacak çalışmalara bir giriş teşkil etmesini temennî ediyoruz."
