abstract: "Endonezya'nın İslam hukukuna dayalı dini mahkeme sisteminin dönüşümü, çeşitli ve gelişen bir toplumda sosyal değişim, hukuk ve adalet dinamikleri karşısında önemli bir çalışmadır. Bu araştırma, sömürge mirasından toplumda hala canlı olan yerel bilgeliğe kadar çeşitli hukuki gelenekleri içeren Endonezya'daki dini mahkemeler çerçevesinde İslam hukukunun nasıl adapte olabileceğini ve gelişebileceğini anlamayı amaçlamaktadır. Kullanılan araştırma yöntemi, özellikle dini mahkeme sistemi ve İslam hukuku ile ilgili mevzuatı incelemek için uygun olan normatif yasal araştırma yöntemidir. Bu yöntem teorik analiz, mevcut yasal kuralların yorumlanması ve yürürlükteki düzenlemelerin Endonezya'daki dini mahkeme sisteminde İslam hukukunun dönüşümünü ne ölçüde destekleyebileceğinin anlaşılmasına odaklanmaktadır. Araştırma, Endonezya'daki dini mahkeme sisteminin dönüşümünün sadece yapı ve prosedürdeki resmi bir değişiklik olmadığını, daha ziyade İslam hukukunun yargıya entegre edilmesine yönelik derin bir kararlılığı yansıtan bir dönüm noktası olduğunu ortaya koymuştur. Bu dönüşüm süreci evlilik, boşanma, miras, aile hukuku ve şeriat ekonomisi gibi İslam hukukunun çeşitli yönlerini kapsamaktadır ve bunların hepsi Müslüman vatandaşların dini öğretilerine uygun olarak yaşamları için sağlam bir temel oluşturmada önemli bir role sahiptir. Bu bağlamda, din mahkemeleri sadece kolluk kuvveti olarak değil, aynı zamanda başta ekonomik faaliyetler olmak üzere hayatın çeşitli alanlarında İslami ilkelere uygun olarak sürdürülebilirliğin ve adaletin sağlanmasında ön saflarda yer almaktadır. Bu nedenle, din mahkemeleri Endonezya'daki müslüman toplumların tüm yaşam yelpazesini kapsayan maddi adaleti gerçekleştirme çabasında önemli bir araçtır."
