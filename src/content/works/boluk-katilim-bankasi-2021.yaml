abstract: "Bu çalışmanın temel amacı; Türkiye'de faaliyet gösteren katılım bankacılığı müşterilerine internet ortamında sunulan e-hizmet kalitesi ile müşteri sadakati, algılan değer ve e-müşteri memnuniyeti arasında istatistiksel açıdan anlamlı bir ilişki olup olmadığını saptamaktır. Yapılan çalışmada ESQUAL e-hizmet kalitesi ölçeği kullanılmıştır. Bu ölçekte e-hizmet kalitesi; etkinlik, sistemin sürekliliği, yerine getirme ve gizlilik olmak üzere toplam dört boyuttan oluşmaktadır. Çalışma kapsamına Türkiye'de faaliyet gösteren katılım bankacığı müşterisi olan ve bu bankanın internet bankacılığı ve/veya mobil bankacılık hizmetlerinden yararlanan kişiler dahil edilmiştir. Araştırmada nicel yöntem kullanılmıştır. Hizmet kalitesi boyutları birden fazla olup bunlardan müşteri sadakati, algılanan değer ve müşteri memnuniyeti değişkenleri ile olan ilişkisini eş zamanlı olarak incelemek için çok değişkenli istatistiksel yöntemlerden birinin kullanılması gerekmektedir. Bu doğrultuda araştırmada, oluşturulan modeller çerçevesinde tüm değişkenler arasındaki ilişkinin eş zamanlı olarak incelenmesini sağlayan Yapısal Eşitlik Modellemesi (YEM) kullanılmıştır. YEM ölçüm modeli ve yapısal modeli kapsamaktadır. Çalışma neticesinde e-hizmet kalitesi ile müşteri sadakati, algılan değer ve e-müşteri memnuniyeti arasında istatistiksel açıdan anlamlı bir ilişki olduğu saptanmıştır. Araştırmada oluşturulan modeller kabul edilmiştir."
