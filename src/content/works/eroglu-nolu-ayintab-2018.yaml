abstract: "Osmanlı hukuk tarihinin en önemli kaynakları şüphesiz mahkemelerde tutulan yazılı belgelelerdir. Bu belgeler, ait oldukları yer ve dönem hakkında önemli bilgiler içerir. Mahkeme kayıtları kapsadıkları mukavele, senet, vakfiye, nafaka, vekâlet, vasiyet, miras davaları, tereke taksim kayıtları, nikâh ve mehir gibi belgelerle yerleşim birimlerinin sosyal yapısı, idarî şekli ve hukuk işleyişi hakkında ihtiva ettikleri bilgiler sayesinde geçmişi büyük ölçüde aydınlatır.Tezimizin konusu Gaziantep'in 96 nolu şer'iyye sicil defteridir. Bu defterde çok sayıda hukukî ve idari belge vardır. Çalışmamızda şer'iyye sicilleri seçmemizin amacı yöntem denemesi yaparak bu belgeler aracılığı ile Türk kültür tarihine kısmen dahi olsa katkıda bulunmaktır. Gaziantep'e ait tasnif edilen defter sayısı 174 olarak tesbit edilmiştir Bu sayının 126 ya ulaştığını iddia edenler de vardır. Gaziantep'e ait ilk sicil belgeleri Kanunî Sultan Süleyman dönemine ait olup H. 938/M.1531–1532 tarihinde yazılıp bir numaralı deftere kaydedilmiştir. Son sicil belgeleri ise H.1327/M. 1909-1910 tarihlerine ait olup 160 nolu deftere alınmıştır. 96 nolu defter, H.1153 ve 1154/M.1808-1809 tarihlerinde kaleme alınan şer'î mahkeme kayıtlarını kapsar. 5… sayfadan oluşan 96 nolu defterde…adet idari ve …adet de hukuki olmak üzere toplam 5…adet belge bulunur. Defter tasnif edilirken belli bir sıra takip edilmemiştir. Defterde bir taraftan miras, nafaka, vasi tayini, boşanma, alacak ve verecek gibi hukukî belgeler yer alırken diğer taraftan merkezden gelen nişân-ı şerîf, ferman ve buyrulduğu gibi idari belgeler yer alır. Biz, bu defteri çalışmakla bir nebze de olsa H. 1153-ile 1154 /M. …yıllarındaki Gaziantep'in idari, sosyal, kültürel ve ekonomik durumunu gün ışığına çıkarmayı amaçladık. Bunun dışında okuyuculara kolaylık olsun diye belgelerin transkripsiyonunu yaparken her belgenin başında o belgenin numarasını, konusunu, idari özelliğini, hicri tarihini ve kısa özettini zikrettik."
