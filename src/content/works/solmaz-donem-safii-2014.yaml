abstract: "İmam Şâfiî'nin (v. 204/820) el-Ümm ve er-Risâle adlı eserlerini rivayet eden Rebî' b. Süleyman el-Murâdî (v. 270/884), Şâfiî mezhebinde oldukça önemli bir görev üstlenmiş ve Büveytî ile Müzenî gibi İmam Şâfiî'nin önde gelen talebeleri arasında yer almıştır. Rebî' b. Süleyman el-Murâdî, el-Ümm ve er-Risâle'yi rivayet etmesi yönüyle mezhep içerisinde çok önemli misyon üslendiğinden, araştırılmaya değer bir şahsiyet olarak karşımıza çıkmaktadır. Bu çalışmada Rebî' b. Süleyman el-Murâdî'nin yaşadığı dönemin siyasî, kültürel, sosyal ve ekonomik gelişmelere değinilmiş olup bunun yanı sıra Rebî' b. Süleyman el-Murâdî'nin, İmam Şâfiî'nin ve talebelerinin biyografileri ile ilgili bilgiler verilmiştir. Çalışmada ayrıca el-Ümm ve er-Risâle'nin İmam Şâfiî'ye nispet edilmesinin yanlış olduğunu iddia eden bazı kimselerin görüşleri ele alınıp değerlendirilmiş ve bu iddialara cevap olacak mahiyette bir kısım deliller ortaya konulmuştur. Sonuç kısmında Rebî' b. Süleyman el-Murâdî'nin Şâfiî mezhebinde ne derecede önemli bir konuma sahip olduğu tespit edilmeye çalışılmıştır."
