abstract: "Batı ekonomik düşüncesinin amacı faizle borç vermektir. Likiditenin finansmanı ve yönetiminde kullanılan en önemli araç olarak kabul edilen tahvillerde bunu açıkça görmekteyiz. Faizin kendisi için en sakıncalı uygulamalardan kabul edildiği İslam İktisadı ise faizli tahvillerden son derece uzak durmaktadır. Bu özelliği de tahvillere alternatif olarak sukuku sunmasında açıkça görülmektedir. Sukuk, şeri hükümlere uygun olarak uygulanması halinde, İslami bankacılığın ilerlemesine ve gelişimine katkılarının yanı sıra gerçek bir ekonomik kalkınma da sağlayacağı aşikardır. Ancak ne yazık ki sukukun, pratik uygulamalarında ve günümüzdeki yaygın biçimlerinin çoğunda, özellikleri ve bunlardan kaynaklanan olumsuz ekonomik etkileri bakımından sukuku katılımı teşvik eden yapısından, klasik tahvil gerçekliğine benzeyen bir forma sokan şeri ihlallerinden ve hilelerden arınamamış olamadığını görüyoruz. Bu çalışma, yatırım sukuku ihracının yazılmaya başlandığı andan alım satım aşamasına ve oradan sukukun sonlandırılması aşamasına kadar meydana gelen bir grup şeri ihlal ve hileye ışık tutmak amacıyla yapılmıştır. Çalışmayı tamamlayabilmek adına, tümevarımsal metot ile mevcut yatırım sukuku uygulamalarında meydana gelen hileleri ve hukuk ihlallerini toplamak ve tahmin etmek, bunun yanında betimleyici metot ile de yatırım sukuku başvurularındaki şeri ihlal şekillerini ve hileleri açıklama noktasında faydalandık. Son olarak analitik yaklaşıma da hile ve ihlal şüpheleri içeren durumları şeri perspektiften analiz etmek ve bunların İslam şeriatine ne ölçüde uygun olduğunu veya onu ne ölçüde ihlal ettiğini belirleyebilmek adına başvurduk. Çalışmamız önemli bazı bulgular elde ederek sonuçlanmış olup bunlardan bazılarını şöyle sıralamak mümkündür: Yatırım sukuku uygulamalarında karşılaşılan faiz hilelerinden biri, sukuk sahiplerine belirli aralıklarla kârın belirli yüzdelerinin dağıtılması zorunluluğudur ki bu, sukuk operasyon yöneticisine teşvik şartıyla veya elde edilen kârın belirlenen yüzde altına düşmesi durumunda tahvil sahiplerine borç aldırma zorunluluğu ile uygulanmaktadır. Bir diğer nokta da sukuk sahiplerinin sermayesinin, amortisman aşamasında operasyon yöneticisinin sukuku nominal değerden satın alma rehni yoluyla garanti altına alınması ki bu durum da sukuk sahiplerini borç veren, yöneticiyi ise borçlu haline getirmesi ve bu yolla sukuk kârlarının kredinin faizi haline gelmesidir."
