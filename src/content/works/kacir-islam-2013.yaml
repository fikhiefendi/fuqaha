abstract: "Bu tezin amacı, klasik ve modern dönemde mali mükellefiyetlerdeki nisaplar hakkında ileri sürülen yaklaşımları delilleriyle birlikte ortaya koyarak değerlendirmeye tabi tutmaktır. Bu bağlamda klasik dönemde malî nisap başlığı altında zekât, fıtır sadakası, fidye, kurban, hac, kefaretler, diyet, hırsızlıkta el kesme, mihir ve nafaka olmak üzere on ana başlıkta ele alınmış ve bunların nass temelleri ile mezheplerdeki yansımaları ortaya konulmuştur. Yine modern dönemde nisap konusundaki yaklaşımlar ve bunların gerekçeleri zikredilmiştir. Hz. Peygamber (s.a.v.) döneminde nisapların eşit olup olmadığını tespit etmek için dinar ve dirhemin şerî?, örfî, gram ağırlıkları ve bunların nisap tespitindeki kriterleri ile o dönem hayvan ve hububat fiyatları üzerinde durulmuştur. Ayrıca nisabın bir senelik geçim kaynağı olması noktasında temel ihtiyaç, zengin ve fakir kavramları üzerinde durulmuştur. Metodolojik açıdan da sayısal ifade olan nisapların yorumlanma ilkeleri belirtilmiştir.Ulaştığımız sonuçlara göre, bütün malî mükellefiyetler aynı kategoride değildir. Naslarda net olarak tespiti yapılmış olan malî mükellefiyetlerde taabbudîlik hakim iken, diğerlerinde ise iktisadi şartlara göre takdir yapılmıştır. Bu nedenle evrensel boyutlu mükellefiyetlerdeki nisapların şahsa, topluma ve kriterlere göre değişkenlik arz eden zengin ve fakir gibi kavramlar üzerine bina edilmesinin doğru olmadığı kanaatindeyiz."
