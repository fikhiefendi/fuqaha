abstract: "Bu çalışma, İslami finansın Kamboçya'daki potansiyel rolünü, erken gelişimini şekillendiren zorluklar, fırsatlar ve sosyo-ekonomik koşulları inceleyerek araştırmaktadır. İslami finans küresel olarak büyümesine rağmen, Kamboçya henüz resmi bir Şeriat'a uyumlu sistem getirmemiş olup, bu durum birçok Müslüman'ın inançlarıyla uyumlu finansal hizmetlere erişememesine neden olmaktadır. Bu araştırma, paydaş bakış açılarını, kurumsal kısıtlamaları ve Malezya, Endonezya ve Tayland gibi ASEAN bağlamlarından çıkarılan dersleri analiz ederek bu boşluğu ele almaktadır. Bir tekafül temsilcisi, bir Müslüman topluluk lideri ve bir akademisyen olmak üzere üç kilit bilgilenden alınan yarı yapılandırılmış yazılı mülakatlar kullanılarak nitel bir desen benimsenmiş ve bu veriler ikincil kaynaklarla desteklenmiştir. Bulgular, iç güçlü ve zayıf yönler ile dış fırsat ve tehditleri değerlendirmek üzere bir SWOT analizi çerçevesinde incelenmiştir. Sonuçlar, İslami finansın uygulanabilirliğini destekleyen güçlü toplum talebi, etik motivasyon ve güvene dayalı ağlar olduğunu göstermektedir. Bununla birlikte, düzenleyici bir çerçevenin bulunmaması, düşük kamuoyu farkındalığı, sınırlı uzmanlık ve Şeriat'a göre yönetilen kurumların eksikliği gibi önemli engeller devam etmektedir. Finansal kapsayıcılık, kırsal ekonomik sektörler ve bölgesel iş birliği alanlarında fırsatlar mevcut olup, dış tehditler arasında düzenleyici belirsizlik ve küçük pazar büyüklüğü yer almaktadır. Çalışma, İslami finansın Kamboçya için uygulanabilir ve alakalı olduğu, ancak ilerleme kaydedebilmesi için düzenleyici açıklık, kurumsal taahhüt, kapasite geliştirme ve bölgesel ortaklıklar gerekeceği sonucuna varmaktadır. Bu araştırma, Müslüman olmayan çoğunluğa sahip ekonomilerdeki İslami finans literatürünün sınırlı olmasına katkıda bulunmakta ve etik ve kapsayıcı finansmanla ilgilenen politika yapıcılar ve finansal kurumlar için pratik içgörüler sunmaktadır."
