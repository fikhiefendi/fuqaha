abstract: "Bu tez çalışması ile Türkiye'deki katılım bankalarının kullandırdıkları fonların reel ekonomiye olan etkisi, Türkiye genelinde ve bölgesel bazda incelenmiştir. Tezin ilk amacı katılım bankaları tarafından kullandırılan fonların reel ekonomi üzerindeki etkilerini bölgesel düzeyde incelemektir. Bu amaç kapsamında bölgesel düzeyde kullandırılan fonlar ile gayri safi yurt içi hasıla, ihracat ve ithalat üzerindeki kısa ve uzun dönemli etkileri ortaya koyabilmek amacıyla; panel havuzlanmış ortalama grup tahmincisinden ve bölgeler arasındaki etkileşimin rolünü de dikkate alabilmek amacıyla; mekansal panel veri analizinden yararlanılmıştır. Analizlerden elde edilen bulgulara göre, kısa dönemde katılım bankalarının kullandırdıkları fonların ihracat üzerinde pozitif bir etkisi bulunurken, ithalat ve GSYH üzerinde anlamlı bir etkiye sahip olmadığı görülmektedir. Uzun dönemde ise kullandırılan fonların ihracat, ithalat ve GSYH üzerinde arttırıcı bir etki yarattığı ifade edilebilir. Bununla birlikte sonuçlar bölgesel düzeyde farklılık göstermektedir. Tezin bir diğer amacı, katılım bankalarının kullandırdıkları fonların reel ekonomi üzerindeki etkisinin Türkiye geneli için, ekonominin genişleme ve daralma dönemleri açısından nasıl farklılaştığının ortaya konulmasıdır. Bu amaç doğrultusunda Türkiye geneli için katılım bankalarının kullandırdıkları fonlar ile sanayi üretim endeksi, reel sektör güven endeksi, ihracat ve ithalat üzerindeki etkileri doğrusal olmayan Hansen Seo eşbütünleşme testi ve eşik değişkenli VECM (TVECM) modeli ile incelenmiştir. Analizden elde edilen sonuçlara göre, kullandırılan fon miktarının düşük olduğu rejimde, fon miktarında meydana gelen artış ithalat, ihracat ve reel sektör güven endeksini arttırırken; sanayi üretim endeksi üzerinde anlamlı bir etkisi bulunamamıştır. Kullandırılan fon miktarının yüksek olduğu rejimde, fon miktarında meydana gelen artış ithalat, ihracat, sanayi üretim endeksi ve reel sektör güven endeksini arttırmaktadır."
