abstract: "Bu çalışmanın amacı, Dünya'da uygulanmakta olan denizcilik finansmanı yöntemleri ve deniz sigortaları uygulamaları ile Türkiye'de uygulanan finansman yöntemleri ve deniz sigortalarını mukayese ederek aradaki farkları ortaya koymak ve sektörün gelişmesine katkı sağlayıcı tavsiyelerde bulunabilmektir. Denizcilik sektörü ve ekonomisi, Dünya ticaretinde oldukça önemli bir role sahip olup Dünya ekonomisi açısından da stratejik öneme sahip sektörlerden biridir. Bu sebeple çalışmada öncelikle denizcilik ekonomisi ve finansmanından bahsedilmektedir. Denizciliğin finansmanı ise denizcilik sektörü içerisinde oldukça önem arzeden bir husus olup, oldukça çeşitli finansman yöntemleri ile sektöre kaynak sağlayabilen bir uzmanlık alanıdır. Çalışmanın devamında Dünya'daki denizcilik finansmanı uygulamalarından bahsedilmekte ve hemen sonrasında Türkiye'deki uygulamalardan bahsedilmektedir. Bu bölüm altında, Türkiye'deki devlet teşvikleri ile alternatif finansman tekniklerinden de bahsedilerek Dünya'daki uygulamalar ile Türkiye'deki uygulamalar arasında karşılaştırmalara yer verilmiştir. Denizcilik sektörü açısından bir diğer önemli konu ise deniz sigortalarıdır. Denizcilik varlıklarının çeşitli risklere karşı güvence altında bulunması ve deniz varlıklarının çeşitli sorumluluklarının teminat altında bulunması, denizcilik piyasasının sürekliliğinin sağlanması açısından önemlidir. Çalışmanın devamında Dünya'daki deniz sigortaları uygulamaları konu edilerek deniz sigorta sektöründe bulunan unsurlar ve deniz sigortacılığının yapısından bahsedilmektedir. Bu bölümde, Türkiye'deki deniz sigortaları sektörü ile ilgili bilgilere de yer verilmekte olup, Dünya'daki ve Türkiye'deki sigortacılık ve finansman verileri özet tablolarla mukayese edilmeye çalışılmıştır. Denizcilik finansmanı ve deniz sigortaları açısından oldukça yeni ve ilgi gören bir yöntem ise İslami finansman ve sigortalardır. Çalışmada İslami finansman ve sigorta yöntemlerinden kısaca bahsedilerek bu yöntemlerin denizcilik sektöründeki uygulamalarından bahsedilmektedir. Denizcilik finansmanı açısından deniz sigortalarının yerinde olması, denizcilik sektörüne finansman sağlayan yatırımcılar ve finansal kuruluşlar için ön şart olarak görülmektedir. İlaveten, denizcilik sektörüne finansman sağlayan kuruluşların ipotek alacaklısı olarak kendilerine ait riskler de hem denizcilik sigortaları hem de deniz sigortaları açısından önemli bir husustur. Bu sebeple çalışmanın devamında denizcilik finansmanı açısından deniz sigortalarının öneminden bahsedilmektedir. Konu çalışma sonuç ve tavsiyeler bölümüyle nihayetlendirilmiştir. Çalışmanın, akademik ve profesyonel hayatta denizcilik finansmanı ve deniz sigortaları ile ilgilenmekte olanlara aydınlatıcı bir kaynak olacağı düşünülmektedir."
