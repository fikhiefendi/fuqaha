abstract: "Mezheplerin şekillenmesi, gelişim gösterip yayılması ve tedvin edilmesinde mezhep imamlarını takip eden fakihlerin etkisi şüphesizdir. Bu bağlamda, Hicrî IV. asır fakihlerinden biri olan Kudûrî, Irak'ta Hanefî mezhebinin önde gelen simalarından kabul edilir. Hadis ilminde de önemli bir yere sahip olan Kudûrî, öğrencileri tarafından“Sadûk”olarak nitelenmiştir. Kudûrî, mensubu bulunduğu Hanefî mezhebinin yanı sıra yaşadığı bölgede yaygın olduğu için bir o kadar Şâfiî mezhebine de vakıf olan çok yönlü bir âlimdir. Birçok eser kaleme alan Kudûrî'nin, 12.000 meseleyi ele aldığı“el-Muhtasar”adlı eseri mezhep içinde başvurulan bir eseridir. Çalışmamızın ilk bölümünde muasırları arasında adından sıkça söz ettiren ve yaşadığı asırda Hanefî mezhebinin önderi konumuna gelen Kudûrî'yi ele aldık. İkinci bölümde, el-Muhtasar'da İmâmeyn'in ittifak ettiği muâmelâtla ilgili meseleleri konu edindik. Kudûrî'nin, toplamda yirmi dokuz yerde bu ittifaklara değindiğini tespit ettik. Ancak kısa ve öz bir eser olması hasebiyle, delillerini zikretmediği hususları kaynağına inip detaylıca araştırıp ortaya koymayı amaçladık. Üçüncü bölümde ise, İmâmeynin ittifak ettiği ancak el-Muhtasar'ın metninde geçmeyen meseleleri, şerhlerine bakarak gün yüzüne çıkarmayı hedefledik. el-Muhtasar'da ittifak edilen meseleleri açıklarken, Kudûrî'den önce ve sonra yaşayan Hanefî fakihlerin eserlerine bakarak tümevarımsal bir metot izledik. Araştırmamız neticesinde İmâmeyn'in ittifak edip Ebû Hanîfe'den farklı görüşler ileri sürmelerinin sebeplerinin; kullanılan lafızların toplumun örfünde farklı anlamları ifade etmesi veya birden çok manaya ihtimalinin olması, hadislerin tercih ölçütleri ve naslara yaklaşım tarzlarından kaynaklandığı sonucuna vardık."
