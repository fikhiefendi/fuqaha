abstract: "İslam dini, aile müessesesine azami derecede önem vermiştir. Kur'ân ve sünnetin ahkam ve ruhuyla gelişen İslam hukukunda da aile kurumunun ahlaki ve hukuki bir zeminde varlığını sürdürmesi, İslam'da korunması hedeflenen değerlerden biri olan neslin muhafazasıyla ilişkilendirilmiştir. Bu bakımdan, nesillerin karışmadan devam edebilmesi için nesebin doğru şekilde tespit edilmesi son derece önem arz eden bir konu olarak karşımıza çıkmaktadır. Nitekim baba ile çocuk arasında nesep ilişkisi doğması için aranan temel şart, çocuğun nikâh akdine dayalı bir evlilik içerisinde doğmuş olmasıdır. Çocuğun nesebinin bilinmemesi, karı-kocanın evliliğinde sıhhat düşürecek bir unsurun bulunması veya boşanma sonrasında gerçekleşen doğum gibi farklı problemlerin ortaya çıktığı durumlarda ise nesebi tespit yollarına başvurulmaktadır. Klasik dönem İslam hukukçuları, nesebi tespit etmede şer'i dayanakları olan birincil ve ikincil yöntemler belirlemişlerdir. Bununla birlikte, günümüzde DNA parmak izi testi sayesinde nesep kesine yakın bir şekilde tespit edilebilmektedir. Bu bağlamda, klasik ve modern tespit yöntemlerinin değerlendirilmeye tabi tutulması, İslam hukukunun nesep tespitinde hangi esasları öncelediğinin anlaşılması açısından son derece önemlidir. Çalışmamızın ilk bölümünde, İslam'ın neslin korunmasına verdiği önem çeşitli açılardan ele alınmış, İslam hukukunda nesep olgusu naslar ve müçtehitlerin görüşleri çerçevesinde incelenerek çocuğun babaya nispet edilme şartları açıklanmıştır. Devamında İslam hukukunda nesebi tespit yöntemleri izah edilmeye çalışılmıştır. İkinci bölümde DNA parmak izinin, nesep tespitinde bir ispat vasıtası olarak kullanılabilirliği, şer'i deliller arasındaki konumu ve kabul şartları hakkındaki görüşlere yer verilmiştir."
