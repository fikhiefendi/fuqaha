abstract: "5./11. asır, Eşarilik ve tasavvuf ilişkisinin yoğun bir şekilde hissedildiği bir dönem olarak dikkat çekmektedir. Konu hakkında yapılan çalışmalarda özellikle bu dönem ve sonrasındaki sürece odaklanıldığı görülmektedir. Bununla beraber Eşarilik ve tasavvuf ilişkisi daha çok Eşʿarî kesim üzerinden ortaya konmaya çalışılmıştır. Bu durum ise meselenin tek boyutlu ele alınmasıyla sonuçlanmıştır. Oysa ki tarihi süreç göz önünde bulundurulduğunda her iki oluşum arasındaki bağlantıların kendi iç dinamiklerinin de etkisi altında daha öncesine uzandığı tespit edilmektedir. Dolayısıyla söz konusu ilişkinin çok yönlü bir mahiyete sahip olduğu anlaşılmaktadır. Araştırmada İslam Mezhepleri Tarihi disiplininin yöntemleri dikkate alınarak her iki oluşum arasındaki ilişkinin tarihsel süreci ortaya konulmaya gayret edilmiştir. Araştırma, bir giriş ve üç bölümden oluşmaktadır. Giriş kısmında Eşarilik ve tasavvuf olmak üzere her iki yapının kendi tarihi seyri hakkında genel bilgiler ele alınmıştır. Birinci bölümde öncelik olarak Tasavvuf grupları arasındaki ilişkilere yer verilmiştir. Menfî ve müspet olmak üzere sufî gruplar arasındaki farklı muhataplıklar Eşʿarîler'in tasavvufla ilişkisinin başlaması noktasında önemli bir husus olarak dikkat çekmektedir. Özellikle Bağdat Tasavvufunun Horasan bölgesinde yayılmaya başlaması kendi ilmî karakterini de bölge tasavvuf anlayışıyla bütünleştirmiştir. Tasavvuf içerisindeki kelamî söylemlerin yer almaya başlaması bu anlamda dikkat çekicidir. İkinci bölümde, her iki oluşum arasındaki ilişkide köprü görevi gören fıkhî ve kelamî unsurlar ele alınmıştır. Fıkhî anlamda Şafiîliğin gerek Eşarilik gerekse tasavvuf kanadında baskın bir kimlik olduğu görülmüştür. Sufi gruplar içerisinde etkin olan Şafiîliğin daha çok kelamî bir veçhe sahip olması ise her iki oluşum arasındaki ilişkide önemli bir etken olarak yer almaktadır. Bu şekilde Eşʿarîler'in tasavvufla ilişkisini tetikleyen ve bu süreçte etkisi olan faktörler tespit edilmeye çalışılmıştır. Üçüncü bölümde, diğer bölümlerde tespit edilen bulgular üzerinden Eşʿarîler'in tasavvufla ilişkisinin tarihsel süreci ortaya konularak meydana gelen etkileşimin sonuçları tespit edilmeye çalışılmıştır. Söz konusu ilişkinin nazarî ve sosyal olmak üzere farklı sonuçları olmuştur."
