abstract: "Bu araştırma,“İslâm'da Hakku't-Te'dîb”meselesini fıkhî bir nazarla ele alarak, Te'dîb'in İslâm hukukunda ferdlerin ve toplumun ıslahı namına ifa ettiği rola derinlikli bir ışık tutmaktadır. Allâh'ın adâletin teminatı olarak emrettiği, zulmü ise şiddetle yasakladığı; meşrû te'dîbin ise bu dengeyi temin etmek için kaçınılmaz bir vâsıta olduğunu izhâr etmektedir. Te'dîbin aslî gayesi, cezalandırmaktan öte, ferdin ve cemiyetin ıslâhıdır. Bu bakış açısıyla te'dîb, hata işleyen kişiyi irşad etme ve doğruya sevk etme işlevini görür; ilk adımda nasîhat ve rehberlik sunulur, sonra hatanın mahiyetine tevafuk eden zararsız bir ceza ile nihayete erdirilebilir. Araştırma, te'dîb hükümlerini âilede, eşler arasındaki münasebetlerde ve tedrîste derinlemesine inceleyerek, bu mefhumlarda İslâm hukukunun çizdiği hak ve sorumluluk çerçevesini teferruatlı bir biçimde izah etmektedir. Ayrıca, te'dîb tatbikatlarında merhamet ve şefkatin esas birer değer olduğunu vurgulamakta, te'dîbin asli gayesinin ıslâh niyeti olması gerektiği üzerinde durmaktadır. Şiddet ve sertlikten müberra olunduğu, bu sürecin yalnızca ıslâh amacına hizmet etmesi gerektiği belirtilmektedir. Araştırma, Meşrû te'dîb hükümlerine dâir câhiliyyeti ve tatbikattaki yanlış anlamaları, toplumdaki ferdlerin haklarıyla ilgili düşünceleri müzâkere etmektedir. Bu sebeple, tatbikatta te'dîble ilgili aşırılıkları izah etmeyi hedeflemekte, bu mevzûda erişilebilirliği kolaylaştırmak için çeşitli fıkhî kaynaklara dayanmaktadır. Ayrıca araştırma, İslâm hukukunda te'dîble ilgili hükümleri Kur'ân, sünnet, icmâ ve kıyâs gibi şer'î deliller üzerinden tetkik etmekte ve bu bağlamda Hanefî, Mâlikî, Şâfi'î ve Hanbelî mezheplerinin görüşlerini beyan etmektedir. Sonuç olarak, araştırma, te'dîb hakkının ferdin ve cemiyetin menfaatlerini dengeleyen insânî hududlar çerçevesinde tatbik edilmesi gerektiğini, onun belli şartlar dâhilinde meşrû bir hak olduğunu, İslâm mezheplerini de referans alarak izhâr etmektedir."
