abstract: "Gün geçtikçe enerjiye olan talep artmaktadır. Enerjiyi elde ettiğimiz kaynaklar yenilenebilir ve yenilenemeyen olmak üzere iki grupta sınıflandırılabilir. Sanayileşen dünyamızda iklim değişikliği ve çevre kirliliği problemleri baş göstermiştir İnsanların yaşamlarını devam ettirebilmeleri için enerji kaynaklarının çeşitliliğinin artırılmasında çalışmaların yapılması ve bir sonraki nesil için daha temiz, düşük karbon emisyonlu dünya bırakılmasında sürdürülebilir ve yenilenebilir enerji kaynaklarına eğilim kaçınılmaz oluyor. Bu durum bireysel hedeften çıkarak ulusal ve hatta uluslararası hedef haline gelmiş durumdadır. 2015 yılında Paris İklim Anlaşması imzalanmış ve bu kapsamda ülkeler enerji ihtiyaçlarını çevreyi kirletmeyecek, doğaya zarar vermeyecek kaynaklardan enerji elde etmeyi amaçlamıştır. Birçok ülke sıfır karbon emisyonu için kendilerine hedef yıl belirlemiştir. Bu hedef doğrultusunda yenilenebilir enerji kaynakları kullanımı geçmişe kıyasla daha fazla ehemmiyet arz etmektedir. Yenilenebilir enerji kaynakları doğada kendiliğinden var olan, doğanın sunduğu ve sürekliliği olan kaynaklardır. Güneş, rüzgâr, su vb. örnek olarak gösterilebilir. En yaygın olan yenilenebilir enerji kaynakları arasında Güneş Enerji Santralleri (GES), Rüzgâr Enerji Santralleri (RES), Jeotermal Enerji Santralleri (JES), Hidroelektrik Enerji Santralleri (HES), Biyokütle Enerji Santralleri, Dalga Enerji Santralleri bulunmaktadır. Yenilenebilir enerji kaynaklarının kullanılması için maliyeti yüksek olduğu bilinmektedir. Bu durumda devlet teşvikleri ve finansmanlar ile yatırım için önemli etmenlerdir. Yenilenebilir enerji kaynakları için devletin destek ve teşvikleri, katılım bankalarının ve konvansiyonel bankaların yenilenebilir enerji kaynakları finansmanı hususunda neler yaptığı, toplam kullandırılan fonların içinde yenilenebilir enerji kaynaklarının payı araştırılmıştır. Bu çalışmada yenilenebilir enerji kaynakları, katılım bankaları ve konvansiyonel bankalar tarafından bu projelerin nasıl finanse edildiği ve sonuçlar karşılaştırılarak incelenmesi amaçlanmıştır. Bu çalışmada kalitatif yöntemler kullanılmıştır. Katılım bankaları, katılım bankacılığı prensiplerine uygun yöntemler kullanılmakta olup yenilenebilir enerji finansmanında da katılım bankacılığı prensiplerine göre finansman yöntemleri kullanmaktadır. Bankalar yeşil krediler için yurtdışından da fon sağlayabilmektedir. Finansman yöntemlerinde farklılıklar ve benzerlikler olduğu saptanmış ve detaylıca açıklanmıştır."
