abstract: "Bu çalışma, içtihatta hükümleri temellendirmek için sıklıkla müracaat edilen yöntemlerden biri olan“usûl ile ta'lîl”yöntemini, bunun belirgin bir şekilde tespit edilebildiği erken dönem Hanefî Mezhebi kaynakları çerçevesinde, içerik ve gelişim süreci yönleriyle analiz etmeyi amaçlamaktadır. Söz konusu yöntem Irak bölgesinde başta Hanefîler olmak üzere farklı mezhep fakihleri tarafından sıklıkla kullanılmıştır. Fakihlerin bu kullanımında“usûl”kavramı ile genel fıkıh kaideleri, fıkhî hükümlerin, daha özelde ise mezhebin görüşlerinin dayandığı temel hukuk ilkeleri veya bunların fürua dair farklı meselelerin gerekçelendirilmesi için kullanılması kastedilmektedir. Çalışma, söz konusu kavram ve bunun ifade ettiği yöntemin içerik ve gelişim sürecini Hanefî Mezhebinde fıkhın hem teorik hem pratik konularıyla ilgili yaygın etkiye sahip eserler kaleme alan Cessâs (ö. 370/981), Kudurî (ö. 428/1037), Debûsî (ö. 430/1039) ve Serahsî (ö. 483/1090 [?]) örnekleri üzerinden inceleyecektir. Çalışmada adı geçen fakihlerin konuyla ilgili açıklamaları karşılaştırılarak benzerlik ve farklılıklar tespit edilecek, kavram ve yöntemin fıkıh öğretisi içindeki yeri, işlevi, etkisi ve gelişim süreci gösterilmeye çalışılacaktır.“Usûlün şahitliği ile ta'lîl”şeklinde de adlandırılan bu yöntemin öncüleri İmam Ebu Hanife ve öğrencisi İmam Muhammed olmakla birlikte bu yöntem Hanefîlerin etkisiyle diğer fıkıh mezhepleri tarafından da sıklıkla kullanılmıştır. Hanefî Mezhebi çerçevesinde yaptığımız incelemelerde söz konusu yönteme atıfların Mâveraünnehir Hanefîleri kaynaklarında VI. yüzyıldan itibaren belirgin bir şekilde azaldığı veya bunun tespitinin zorlaştığı gözlemlenmiştir. Bu araştırmada, söz konusu yöntem yukarıda tanımlanan anlamda usul ile hüküm arasındaki ilişki bağlamında mezhep öğretisinde hükümlerin gerekçelendirilmesi çerçevesinde tarihi gelişim süreci dikkate alınarak ele alınacak ve yöntemin fıkıh ilminin teorik inceleme alanı olan fıkıh usulüyle ilişkisi gösterilmeye çalışılacaktır. Çalışmada“usûl ile ta'lîl”in Hanefî kaynaklarındaki uygulamaları incelenecek, usul ve füru arasındaki ilişki tahlil edilecek, Hanefî mezhebi bağlamında“usûl ile ta'lil”in mahiyeti, kullanım sıklığı ve işlevi açıklanmaya çalışılacak, tarihi gelişim süreci adı geçen üç fakih ve Irak ve Maveraünnehir Hanefîlerinin yaklaşımlarındaki benzerlik ve farklılıkların analizi üzerinden gösterilecektir. Dolayısıyla çalışma fıkhın teorik ve pratik inceleme alanları olan usul ve füru ilimlerinde daha sonra kavâ'id-i külliye adını alacak olan temel hukuk ilkeleri ile ta'lîlin tarihi gelişimini incelemek suretiyle bunun hukuk düşüncesindeki kökenlerini göstermeye odaklanacaktır. Araştırmada Maveraünnehir ve Irak Hanefîleri arasında usul ile ta'lîl yöntemine yaklaşım farklılığı bulunduğunun gösterilmesi, bunun nedenleri ve anlamının açıklanması hedeflenmektedir. Konunun usûl-i fıkıh ilmiyle ilişkisi ve bu ilişkinin Hanefî mezhebi öğretisinde füru ta'lîllerindeki yansıması çalışmanın genel çerçevesi dahilinde cevaplandırılmaya çalışılacak sorulardandır. Cessas, Kuduri, Debusi ve Serahsi gibi fakihlerin eserlerinin bu çerçevede taranması yöntemin Irak Hanefîleri arasında etkin ve yaygın kullanımına işaret ederken, aynı durumun Maveraünnehir Hanefîleri için de geçerli olduğunu söylemenin zorluğunu, hatta zaman içinde tespitini zorlaştıracak derecede zayıfladığını göstermektedir. Bu durumun sebeplerini ve neticelerini ortaya koymak araştırmanın ulaşılmak istenen temel amaçları çerçevesine dahil edilmiştir."
