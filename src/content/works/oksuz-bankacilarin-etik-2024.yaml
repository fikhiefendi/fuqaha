abstract: "Neyin ahlaki olup olmadığı sorusunu inceleyen etik alanı ile ilgili tartışmalar uzun yıllardır yapılmaktadır. İş hayatında ahlaki sorunların değerlendirilmesiyle ilgilenen iş ahlakı sürdürülebilir ve şeffaf işletme faaliyetlerinin vazgeçilmez unsurudur. Bu bağlamda etik konumlar olarak idealizm ile görecilik arasındaki gerilim iş ahlakı literatüründe öne çıkar. Bu etik konumların, bankacılık gibi günümüz ekonomik sistemlerinde merkezi yere sahip bir sektörde çalışanlar arasında nasıl şekillendiğini incelemek gerekir. Bankacılar etik yaklaşımlarında idealizm eğilimi mi görecilik eğilimi mi göstermektedir? Katılım bankası çalışanları ile konvansiyonel banka çalışanlarının etik konumları arasında anlamlı bir farklılık bulunmakta mıdır? Bu sorular, çalışmanın odak noktasını oluşturmaktadır. Çalışmada etik tutumlar üzerinde bireysel belirleyicilerin etkisini ölçmeyi amaçlayan Etik Konum Ölçeği 5'in (EPQ-5) Türkçeye uyarlanması ve geçerlik ve güvenirliğinin sınanması amaçlanmıştır. Aynı zamanda, İstanbul'da faaliyet gösteren katılım bankası ve konvansiyonel banka çalışanlarının etik konumları karşılaştırmalı olarak analiz edilmiştir. Araştırma sonucunda katılım bankası çalışanları ile konvansiyonel banka çalışanlarının idealizm seviyelerinin farklılaşmadığı; görecilik düzeyleri arasında ise anlamlı bir fark olduğu tespit edilmiştir."
