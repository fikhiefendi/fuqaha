abstract: "Tezimizin başlığı, Türk Medeni Kanunu Kapsamında Haksız Yapı'dır. Çalışmamız giriş, üç ana bölüm ve sonuçtan oluşmaktadır. Giriş bölümünde haksız yapı ile ilgili Mecelle'de yer alan düzenlemeler incelenmiştir. Daha sonra ise 743 sayılı Medeni Kanun ile 4721 Sayılı Medeni Kanun'da yer alan haksız yapı ile ilgili düzenlemeler açıklanmıştır. Çalışmamızın birinci bölümünde haksız yapının tanımı yapılmış ve bir yapının haksız yapı olması için gerekli unsurlar açıklanmıştır. Bu bölümde son olarak haksız yapı, hukukumuzda yer alan benzer bazı müesseselerle karşılaştırılmıştır. Çalışmamızın ikinci bölümünde haksız yapının türleri ve bu türler içerisinde uygulamada sıkça karşılaşılan, kişinin kendi malzemesiyle başkasının arazisinde haksız yapı meydana getirmesine yol açan sebepler incelenmiştir. Çalışmamızın son bölümünde ise haksız yapı türlerine bağlanan hüküm ve sonuçlar incelenmiştir. Bu kapsamda arazi maliki, malzeme sahibi ve üçüncü kişinin sahip olduğu haklar, doktrin görüşleri ve yargı kararları çerçevesinde ifade edilmiştir. Çalışmamızın amacı hangi hallerde haksız yapının ortaya çıkacağını açıklamak ve bu kapsamda uygulanacak hükümleri tespit etmektir."
