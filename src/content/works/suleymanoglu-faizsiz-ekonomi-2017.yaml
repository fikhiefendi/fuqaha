abstract: "Dünya Ekonomisi geliştikçe iktisatçılar ekonominin birçok farklı konusuna değinmiş ve ekonomideki birçok sorunu çözmüşlerdir. Sosyalizm insanlara mutlak eşitlik sunacağını iddia ederken 20. ve 21. Yüzyıldaki uygulamaları bunun pek de mümkün olamayacağını gözler önüne sermiştir. Özellikle ABD ve SSCB'nin başını çektiği soğuk savaş döneminde ABD halkı çok daha refah içinde yaşamış ve girişilen bilim ve teknoloji yarışını da ABD kazanmıştır. O günden bugüne de kapitalizm dünyaya hakim olmuş ve sürekli güncellemeler ve müdahaleler geçirmiştir. Bu çalışma ister kapitalizme alternatif olarak ister kapitalizm 2.0 olarak görülsün asıl çabamız günümüzdeki eşitsizlikleri giderme çabasıdır. İslami ekonomi ile faizsiz ekonomi arasındaki farklılıklara dikkat çekilmiş. İslami ekonominin en önemli bankaları olan katılım bankalarının araçları açıklanarak katılım bankalarına yönelik eleştirilere yer verilmiş. Faizsiz bir ekonomiye geçilememe sebeplerine değinilmiş, geçilmesi halinde kalkınmaya yeni muhtemel etkilerinin ne olacağı üzerinde durulmuştur. Faizsiz bir ekonomiyi incelerken bazen uzay madenciliğine, bazen yapay zekâya, bazen dijital para birimlerine özellikle günümüzün yükselen yıldızı bitcoine, bazen de melek yatırımcılara ve araştırma geliştirmenin bir sonraki safhası olarak gördüğümüz yatırım geliştirmeye değinilecektir."
