abstract: "Yüksek enflasyon dönemlerinde tarihi maliyet esasına göre hazırlanan finansal tablolar, işletmelerin gerçek finansal durumunu yansıtmakta yetersiz kalmakta ve dönemler arası karşılaştırılabilirliği zayıflatmaktadır. Türkiye'de 2022 yılı sonu itibarıyla TMS 29 uyarınca enflasyon muhasebesi uygulama şartları oluşmasına karşın, BDDK bankacılık sektörü için bu uygulamayı ertelemiş; bu durum katılım bankalarının enflasyondan arındırılmış finansal görünümüne ilişkin bir bilgi boşluğu yaratmıştır. Bu çalışmanın amacı, Türkiye'de 2022 ve 2023 yıllarında faaliyet gösteren altı katılım bankasının (Kuveyt Türk, Albaraka Türk, Türkiye Emlak Katılım, Türkiye Finans, Vakıf Katılım, Ziraat Katılım) toplulaştırılmış solo finansal durum tablolarının TMS 29 uyarınca enflasyon muhasebesine göre düzeltilmesi ve bu düzeltmenin seçilmiş bankacılık rasyoları üzerindeki etkisinin ortaya konulmasıdır. Nicel araştırma yaklaşımının benimsendiği betimleyici ve karşılaştırmalı nitelikteki çalışmada, TÜİK TÜFE endeksleri kullanılarak toplulaştırılmış finansal durum tablosundaki parasal olmayan kalemler düzeltilmiş, net parasal pozisyon kâr/zararı hesaplanmış ve düzeltme öncesi ile sonrası tablolar karşılaştırmalı oran analiziyle incelenmiştir. Uygulama bulgularından elde edilen en temel sonuç, enflasyon muhasebesinin katılım bankası bilançosunu özkaynak tarafında yoğunlaşan, ancak varlık ve yükümlülük tarafında daha sınırlı etkiler oluşturan asimetrik bir yapıya dönüştürdüğüdür. Bu sonuçlar, nominal tabloların yüksek enflasyon ortamında finansal gerçekliği yanıltıcı biçimde yansıtabileceğini doğrulamaktadır. Çalışma, BDDK'nın erteleme kararının yeniden değerlendirilmesini, katılım bankacılığına özgü enflasyon muhasebesi uygulama rehberleri hazırlanmasını ve enflasyona göre düzeltilmiş tabloların kamuya açıklanan finansal raporlara ek olarak sunulmasını önermektedir."
