abstract: "Elektrik dağıtımı, depolanamayan bir enerji türünün güvenli, kaliteli ve kesintisiz şekilde nihai kullanıcıya ulaştırılmasını konu alan; kamu hizmeti niteliği baskın, doğal tekel yapısına sahip ve yoğun teknik risk barındıran bir faaliyettir. Bu özellikleri nedeniyle dağıtım süreci, kapsamlı bir hukuki düzenleme ve idari denetim mekanizması altında yürütülmektedir. Türkiye'de elektrik dağıtım hizmeti, özelleştirme sonrasında özel hukuk tüzel kişileri tarafından İHDS çerçevesinde ifa edilmekte olup, dağıtım şirketleri şebekenin işletilmesi, bakımı, arıza yönetimi ve kalite standartlarının sağlanması gibi geniş kapsamlı yükümlülükler üstlenmektedir. Elektrik dağıtım şirketlerinin özel hukuk sorumluluğu temel olarak akdi sorumluluk ve akit dışı sorumluluk kategorilerinde ele alınmaktadır. Akdi sorumluluk, bağlantı ve sistem kullanım anlaşmalarından doğan borçların ihlali neticesinde ortaya çıkmakta; elektriğin zamanında sunulamaması, kalite standartlarının karşılanmaması veya teknik yükümlülüklerin gereği gibi yerine getirilmemesi bu kapsamda değerlendirilmektedir. Akit dışı sorumluluk ise elektrik akımının yüksek tehlike içeren niteliği sebebiyle özellikle Türk Borçlar Kanunu 71. maddesi çerçevesinde tehlike sorumluluğu olarak ortaya çıkmaktadır. Bunun yanında, voltaj dengesizliği, aşırı gerilim ve benzeri kalite bozuklukları ile kullanıcıya ulaşan elektrik, hatalı ürün olarak nitelendirilmekte ve ürün sorumluluğu hükümlerini gündeme getirmektedir. Ayrıca Yargıtay uygulaması sebebiyle, yapı malikinin sorumluluğu bağlamında dağıtım şirketlerinin hukuki konumunun değerlendirilmesi de önem arz etmektedir. Bu çalışma, elektrik dağıtım şirketlerinin özel hukuk sorumluluğunu bütüncül bir perspektifle ele almakta ve sorumluluğun dayandığı hukuki temelleri karşılaştırmalı olarak incelemektedir. Akdi ve akit dışı sorumluluk ile ürün sorumluluğunun uygulama alanları değerlendirilmekte; tazminat rejiminin dağıtım faaliyetine özgü yönleri analiz edilmektedir. Böylelikle çalışma, dağıtım şirketlerinin sorumluluğunun kapsamını ve bu sorumluluğun doğurduğu hukuki sonuçları sistematik biçimde ortaya koymayı amaçlamaktadır."
