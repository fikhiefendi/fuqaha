abstract: "Bu tezin amacı katılım bankacılığında yaygın olarak kullanılan murabaha işlemlerindeki vekâlet uygulamasını müşteri perspektifinden incelemektir. Vekâletin kullanımının İslami finans prensiplerine uygunluğunu değerlendirmek ve bu süreçte müşterilerin farkındalıkları ile algılarını ölçmektir. Bu bağlamda, murabaha işlemlerinde vekâletin nasıl uygulandığı, müşterilerin bu uygulamaya ilişkin bilgi seviyeleri ve İslami finans prensiplerine uygunluk konusundaki farkındalıkları incelenmiştir. Yalnızca 110'unun katılım bankasından finansman kullandığını beyan ettiği 295 kişiyle gerçekleştirilen anket sonucunda finansman kullananların murabaha işlemlerindeki vekâlet uygulaması hakkında çelişkili cevaplar verdiği, yeterli bilgiye sahip olmadıkları ve bu yüzden yaptıkları işlemlerin fıkhî açıdan sorunlu hale gelme tehlikesinin bulunabileceği sonucuna varılmıştır. Yansız bir istatistiksel tahmin elde etmek için yeterli katılımcı sayısına ulaşılamamış olmakla birlikte finansman kullananlardan vekâlet verildiğinin farkında olanların %69'unun murabaha işlemindeki süreci genel hatlarıyla bilmesine, %74'ünün vekâleti malı satıcıdan katılım bankası adına alırken kullandığını ve %78'inin vekâlet işleminin önemli olduğunu ifade etmesine rağmen yaklaşık %62'sinin satıcı ile fiyatta anlaştıktan sonra katılım bankasına finansman için başvurdukları; %72'sinin murabaha işlemine konu olan gayrimenkulü veya taşıtı bankadan değil satıcıdan satın aldığını düşündüğü, üründe bir sorun çıkması durumunda müşterilerin %68'inin satıcıyla iletişime geçilmesi gerektiğini belirttiği tespit edilmiştir. Çalışmanın bulguları, mevcut durumda müşterilerin bir kısmının aslında satıcı ile fiyatta anlaşıp akdi kurduktan sonra katılım bankalarından finansman kullanması sebebiyle işlemin fıkhî açıdan mahzurlu bir hale gelme tehlikesinin bulunduğunu, müşterilerin vekâlet konusunda eksik bilgi ve farkındalığa sahip olduklarını, katılım bankalarının müşterilerini özel olarak vekâlet genel olarak murabaha işlemi süreci hakkında çok daha iyi bir biçimde bilgilendirmesini ve işlemlerin fıkhî açıdan doğru şekilde uygulanmasını temin edecek mekanizmaları kurmasının elzem olduğunu ortaya koymaktadır."
