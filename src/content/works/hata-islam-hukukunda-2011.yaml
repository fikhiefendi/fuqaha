abstract: "?İslam Hukukuna Göre Çocuk Düşürme? adlı tezimiz, günümüzde oldukça güncellik kazanmış konulardan biri olan ve hükmü merak edilen çocuk düşürmenin, İslam hukuku açısından incelenmesi amacıyla yapılan bir çalışmadır.Tezimiz, kısa bir giriş ve iki bölümden oluşmaktadır. Birinci bölümde, anne karnındaki çocuğun, yani ceninin mahiyeti ve hukukî durumu ile kendisine tanınan kişilik hakları ortaya konulmaya çalışılmıştır. İkinci bölümde ise, önce çocuk düşürmenin İslam hukukuna göre hükmü ele alınmış, daha sonra söz konusu suç, İslam ceza hukuku açısından incelenerek bununla ilgili düzenlenmiş olan cezalardan söz edilmiştir.Sonuç olarak, anne karnındaki cenine sınırlı hak ehliyeti tanındığı ve böylece insan kişiliğinin anne karnındaki doğum öncesi süreçten itibaren hukuken koruma altına alındığı belirtilmiştir. Diğer yandan, anne karnındaki ceninidüşürmenin, gebeliğin ilk günlerinden itibaren, belirli ve özel zorunlu durumlar dışında, İslam hukukuna göre suç olduğu ortaya konulmuştur."
