abstract: "İslâm hukukuna göre Şârî'in mükellefin fiillerine yönelik hitabına veya bu hitabın sonucuna hüküm denir. Hükümler mükelleften bir davranışı yapmasını veya yapmamasını istemesi ya da yapıp yapmamada serbest bırakması bakımından teklifi hükümler; mükellefin fiilleriyle başka şeyler arasında sebep, şart, rükün veya mani ilişkisi kurulması bakımından vaz'î hükümler olmak üzere ikiye ayrılmaktadır. Ayrıca hükümler daimî/esas olması veya geçici olması bakımından azîmet ve ruhsat kısımlarına ayrılır. İslâm hukukunda Allah'ın hitabına muhatap olarak yaratılan insanoğlu, dinî hükümlerle mükellef kılınmıştır. İnsan için asıl olan dinî sorumluluklarını sağlıklı bir şekilde yerine getirmesidir, ancak insan yaşarken bazen hasta olabilir ve bu hastalık kişinin mükellefiyetini etkiler. Buna göre tezimizin konusu İslâm Hukuku Açısından Hastalığın Hükümlere Etkisi olarak belirlenmiştir. Ehliyet ârızalarından biri olan hastalık; insanın normal hayatını yaşamasını engelleyen, onu ibadet ve günlük işlerini yapmaktan alıkoyan, kişinin fiziksel, ruhsal, dinî ve sosyal faaliyetlerine tesir eden bir acizlik durumudur. Hastalığın oluşmasında birçok etken olduğu gibi çeşitleri de hayli fazladır. Fıkıhta hastalık denilince en genel şekliyle fizyolojik hastalıklar ve ruhsal hastalıklar akla gelir. Fizyolojik hastalıklar, mutlak hastalık ve ölüm hastalığı (marazü'l-mevt) olmak üzere ikiye ayrılır. Ruhsal hastalıklar ise akıl hastalığı (cünûn) ve akıl noksanlığı (ateh) olarak ikiye ayrılmıştır. Tezimizde marazü'l-mevtle yakından ilgili olan kronik hastalıklar ayrıntılı olarak ele alınmıştır. İslâm hukukunda hastalık, hükümlerin uygulanmasında önemli ruhsat sebeplerinden biridir. Hastalık, başta ibadetler olmak üzere, muâmelât, aile hukuku ve ceza hukukunda birçok konuya etki ederek hükümlerin kolaylaştırılmasına, tehir veya ıskatına vesile olmaktadır. Tezimizde, hastalığın hükümlere etkisi kapsamlı bir şekilde ele alınarak bu hükümler tespit edilmeye çalışılmıştır."
