abstract: "Bu tez, iki İslam âlimi olan İmam Malik ve İmam Serahsi'nin -Allah onlara rahmet etsin- hayatlarını ve İmam Serahsi'nin El-Mebsut adlı kitabında aralarındaki ihtilafı ele almaktadır. yazılar. İkinci bölümde ise, Evlenme Kitabında yer alan iki imam arasındaki ihtilaf ve aralarında meydana gelen fıkhî ihlaller yer almakta olup, on iki mesele bulunmaktaydı. Köle için çok eşlilik, kölenin efendisinin izni olmadan evlenmesi, genç kızın evlenmesi, zimminin Müslümanla evlenmesi. Üçüncü bölümde ise, boşanma kitabında iki imam arasındaki ihtilafa yer verilmiş olup, on mesele bulunmakta olup, bu hususların en öne çıkanları hastanın boşaması, boşanan kadının rızasının hükmü, boşanma davasıdır. boşandığında geri almanın şahitliği ve aylarca ümmet sayısının hükmü. Tez ayrıca bir giriş, bir özet, bir içindekiler dizini, bir sonuç ve bir kaynak ve referans listesi içeriyordu . Anahtar: (Serahsi _ Malik _ anlaşmazlık _ evlilik _ boşanma)."
