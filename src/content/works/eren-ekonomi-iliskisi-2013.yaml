abstract: "Bu çalışmada din ve ekonomi arasındaki ilişki ele alınmış ve bu bağlamda dini değerlerin insanların iktisadî davranışları üzerinde etkili olup olmadığı incelenmiştir. Bu çerçevede ilk olarak İslam öncesinde Arabistan'ın genel ekonomik durumu ana hatlarıyla resmedilmiştir. Sonrasında İslam'ın temel olarak kabul edilen kaynakları Kur'an, Hadis (ve Sünnet), İcma ve Kıyas ele alındıktan sonra İslam'ın getirdiği değişimin oluşturduğu farklı ekonomik yapıya ilişkin genel bir değerlendirme yapılmıştır. Bu yapının zekât emri ve faiz yasağına, bunun haricinde ahiret inancı ve infak anlayışına sahip bireylerin varlığına dayandığı tespit edilmiştir. Akabinde infak kurumunun oluşum süreci ele alınmıştır. Bu sürecin belirli bir gelişim seyri izlediği, infakın direkt olarak emredilmediği, önce belirli anlatımlarla infak anlayışının temellerinin oluşturulduğu ve belirli bir seviyeye gelindikten sonra infakın bir emir olarak verildiği görülmüştür. İslam'da infakın, milli geliri artıran ve gelirin daha dengeli dağılımını sağlayan bir müessese olarak ele alındığı tespit edilmiştir. Çalışmadan dini değerlerin iktisadi davranışlar üzerinde önemli ve belirleyici bir etkiye sahip olduğu sonucu ortaya çıkmıştır."
