abstract: "Büyük muhaddis, fakîh İmam Buhârî (ö 256/869) ve en önemli eseri olan el-Câmi?u?s-Sahîh ile ilgili pek çok çalışma yapılmıştir. Ancak onun fıkhî yönünü ele alırken karşılaşılan problemlerden birisi onun ifadeleri arasında yer alan ?Kâle ba?du?n-nâs? kavramının anlamı ve muhtevası ile ilgili tartışmalardır. Yaptığımız araştırma neticesinde bu ifadenin, el-Câmi?u?s-Sahîh?te toplam yirmi beş (25) yerde geçtiğini tespit etmiş bulunmaktayız. Bunlar konu dağılımına göre şu şekildedir: 1 defa Zekât, 2 Hibe, 1 Şehâdet, 1 Vesâyet, 1 Talak, 1 Eyman ve?n-Nezair, 2 İkrâh, 14 Hiyel, 2 Ahkâm?da zikredilmiştir.Buhârî bu ifadesi ile muhataplarına yönelik küçük düşürücü bir tutum sergilememiş, dönemin üslubu gereği bu ifadeyi tercih etmiştir.Eleştiri konusu olan meselelerin hedefinde, genelde Ebû Hanîfe ve onun mezhebini takibeden Hanefî âlimlerinin tercih edilen görüşleri olduğu göze çarpmaktadır.Münakâşa konusu olan meselelerin genelinde, Buhârî ile rey ehli arasındaki ihtilaf, nassları anlama ve tevil farklılığından doğmaktadır. Ayrıca bu çalışmada bahsi geçen meselelere yönelik itirazların sebeplerine ve Buhârî?nin, eserinde, neden bu tür tartışmalara yer verdiğine ve buna bağlı olarak, daha birçok konuyla ilgili bilgi verilmiştir."
