abstract: "Şer'iyye sicilleri Osmanlı İmparatorluğu şehir tarihi araştırmaları için en önemli kaynaklardan biridir. Sicillerden hareketle Müslüman ve gayrimüslim cemaatler arasındaki ilişkiler, vergi talepleri, evlilik-boşanma, vasi ve nafaka tayini, narh kayıtları, asayiş ve askerî yükümlülükler gibi çeşitli meselelere dair fikir sahibi olunabilir. İmparatorluk dâhilindeki hemen her şehir ve büyük kasabalar için sicil tutulmuştur. Amasya özelinde 1624'ten 1866 yılına kadar toplam 95 sicil tespit edilmiştir. Bu çalışmada 1663-1665 yılları arasında tutulmuş olan 15 numaralı Amasya şer'iyye sicilinin transkripsiyonu ve değerlendirilmesi yapılmıştır."
