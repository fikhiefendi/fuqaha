abstract: "Mustafa Sabri Efendi, özellikle fikrî akımların ve siyasi çalkantıların yoğunlaştığı Osmanlı'nın son döneminde Şeyhülislâmlık yapmış, farklı siyasi görevlerde bulunmuş olması hasebiyle hem ehemmiyetli bir konuma hem de ortaya koyduğu çalışma ve eserleriyle de ilmi açıdan önemli bir yere sahip olmuştur. Hayatının önemli bir devresini sürgünde geçirmiş, uzun müddet kaldığı Mısır'da oluşan ıslah ve tecdîd hareketlerine karşı, içinde bulunduğu ortamın kendisine yüklediği bir tür misyon gereği, geleneksel algı ve anlayışı kalemiyle savunma durumunda kalmıştır. Bu bağlamda Muhammed Abduh, Musa Cârullah, Ferit Vecdî, Muhammed Heykel, Mahmud Şeltût ve Mustafa el-Merâğî gibi birçok âlimle giriştiği münakaşalar, onlara karşı yazdığı makale ve eserleri olmuştur. Haliyle tartışmaya medar olan birçok meseleyi muhtevi eserleri arasında bilhassa, Mevkıfu'l-Akl ve'l-İlm ve'l-Âlem min Rabbi'l-Âlemin ve İbâdihi'l-Murselîn isimli eseri oldukça önemi haiz olmakla birlikte, değişik sebeplerden dolayı ülkemizde belirli bir zaman tanınmamış veya gündeme gelmemiştir. Bu çalışmamızda başta Mevkıfu'l-Akl adlı eseri olmak üzere, kaleme aldığı diğer çalışmaları ve makalelerinden hareketle takip ettiği Kur'ân'ı okuma ve anlama biçimini, dolayısıyla dönemin Kur'ân algısını anlamayı ve ortaya çıkarmayı hedefledik. Bu çerçevede“Son dönemin Osmanlı Şeyhülislâmı ve onun şahsında temsil ettiği geleneğin modern dönem Kur'ân eksenli tartışmalar karşısında Kur'ân anlayışı ve algısı nedir?”sorusundan hareketle, Mevkıfu'l-Akl'i esas alıp, diğer çalışmalarıyla birlikte tüm eserlerini analitik bir yöntemle inceledik. Eserlerinde -üzerinde durduğu konular bağlamında- değindiği ayetlerin yorum niteliği taşıyan bölümlerini ve Tefsir geleneğimizdeki karşılığını mukayeseli olarak incelemeye çalıştık."
