abstract: "İmâmet/hilâfetin hükmü Müslüman bilginler tarafından ittifakla vacip görülmüştür. Çünkü imâmet/hilâfet kurumu hem dini hem de dünyevi maslahatlar için gerekli bir kurum olarak kabul edilmektedir. Hz. Peygamberin vefatından sonra halifenin kim olacağı hususunda sahabeler arasında tartışmalar yaşanmış olsada; hilâfetin gerekliliği veya dini boyutu, bu tartışmalarda söz konusu olmamıştır. Mezhepler arasında, fıkhi açıdan imâmet/hilâfetin hükmünün akla ve nakle dayandırma hususunda tartışmalar olduğu bilinmektedir. Ancak bunlar, fıkıh usûlü ilminin kendi iç dinamiği içindeki tartışmalardan öteye geçmemiştir. İmâmet/hilâfetin gerekliliği veya dini boyutu, 1924'e hilâfetin ilga edilmesinden sonra tartışılmaya başlamıştır. Bu tartışmalardan biride, Mısırlı bir kadı olan Ali Abdürrâzık ve yine Mısırlı bir âlim olan Muhammed Ziyâeddin er-Reyyis arasında geçmiştir. Abdürrâzık, hilâfetin dini bir gereklilik olmadığını ve dinde bunu gerekli kılan bir delilin bulunmadığını ileri sürmüştür. Reyyis ise, Abdürrâzık'ın bu görüşlerine karşılık imâmet/hilâfetin vücûbiyetini savunmuştur. Abdürrâzık, hilâfet hakkındaki görüşlerini, İslam'ın yalnızca dini bir davet olduğu ve Hz. Peygamberin siyasi bir kişiliğe sahip olmadığı, üzerine geliştirmiştir. Görüşlerini, daha çok İslam tarihinden bazı olayları örnek vererek temellendirmeye çalıştığı görülmektedir. Bunun yanında, imâmet/hilâfeti gerçekleştirmenin“caiz”olduğuna hükmeden mezheplerin de kendisi ile aynı görüşte olduğunu dile getirmiştir. Reyyis ise, Abdürrâzık'a İslam ümmetinin büyük bir çoğunluğunu oluşturan mezheplerin, imâmet/hilâfetin vücûbiyetine hükmetmiş olmalarını ileri sürerek karşı çıkmıştır. Aynı zamanda İslam'ın, dinî ve dünyevi bir düzen olduğunu ve Hz. Peygamberin bir devlet kurup bu devlete başkanlık ettiğini savunan Reyyis; İslam'da bir hükümetin gerekli olduğunu da ifade etmektedir. Reyyis, Hz. Peygamberin vefat etmesinden hemen sonra, ashabın bir halifeye biat etmiş olmasını, hükümetin gerekli oluşuna delil olarak göstermektedir. Aynı zamanda imâmet/hilâfet kurumu üzerine bir icmânın meydana geldiğini ve icmânın da şer'î bir delil olmasından dolayı imam/halife tayin etmenin farz-ı kifâye olduğunu söylemektedir. Çalışmamızda bu konu üzerinde durulacak, Reyyis ve Abdürrâzık'ın ileri sürdüğü argümanlara yer verilecek ve sonunda genel bir değerlendirme yapılacaktır."
