abstract: "Tez, Giriş, İki Bölüm (Birinci Bölüm: 'Klasik Dönem Hanefî Fıkıh Usûlü Literatüründe İlletin Tahsîsi', İkinci Bölüm: 'Klasik Dönem Hanefî Usûl Eserlerinde İlletin Tahsîsi Meselesinin Tahlili'), Sonuç ve Bibliyografya'dan oluşmaktadır. Tezde, klasik dönemde kaleme alınan Hanefî fıkıh usûlü eserlerinde ihtilaflı bir konu olarak karşımızda duran illet tahsîsi meselesi etraflıca ele alınmıştır. Bu bağlamda Hanefî fıkıh usûlü ilmine yön veren Hanefî fıkıh bilginlerinin illetin tahsîsi konusu ile ilgili görüşleri mukayeseli bir şekilde değerlendirilerek tahlil edilmiştir. Böylelikle illetin tahsîsi hakkında Kerhî, Cessâs, Debûsî, Serahsî ve Pezdevî gibi klasik dönem fakihler tarafından serdedilen görüşlerdeki benzerlik ve farklılıklar ortaya konulmuştur. Tezin Birinci Bölümü'nde illetin tahsîsi meselesinin usûl ilminin farklı konularıyla ilintili girift bir konu olduğu görülmüştür. İlletin tahsîsi meselesinin kavramsal çerçevesi kapsamında illetin tahsîsi bağlamında illet ve tahsîs kavramları incelenmiş, söz konusu meselesinin tard ve istihsan ile ilişkisi üzerinde durulmuştur. Tezin İkinci Bölümü'nde illetin tahsîsi meselesinde öne çıkan belli başlı ihtilaf noktaları ele alınmıştır. Burada söz konusu meselenin şekillenmesinde tarafların tahsîs anlayışlarının büyük payı olduğu görülmüştür. Bu bölümde ayrıca Debûsî'nin illetin tahsîsi konusunda kendine has yaklaşımı irdelenmiştir. Bunun yanında illetin tahsîsi meselesinin kelamî boyutu ele alınmış, illetin tahsîsi konusundaki ihtilafın asıl itibariyle kelâmî yaklaşım farklılığından kaynaklandığı görülmüştür. Son olarak illetin tahsîsi konusuna ilişkin olarak izah tarzındaki farklılık ele alınmış, söz konusu meselenin daha çok lafzî bir tartışma teşkil ettiği görülmüştür."
