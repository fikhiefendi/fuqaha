abstract: "Bu çalışmada Osmanlı âlimlerinden Ahizâde Abdulhalim Efendi'nin (v. 1013/1604) hayatı, eserleri ve“Mürşidetü'l-Ahyâr fî Beyâni Şürûti Sıhhati'l-Cumuati fi'l-Emsâr”adlı risâlesi konu edinilmiştir. Çalışmamız giriş ve üç bölümden oluşmaktadır. Girişte araştırmanın konusu, önemi ve amacı ile metodu üzerinde duruldu. Birinci bölümünde Ahizâde Abdulhalim Efendi'nin hayatına ve eserlerinin içeriğine dair bilgiler ile birlikte onun her bir eserinin yazma nüshalarının hangi kütüphanede bulunduğuna dair bilgilere yer verilmiştir. İkinci bölümde risâlenin içerik olarak değerlendirilmesi yapılmıştır. Risâlenin ele almış olduğu terimlere açıklık getirilerek müellifin konu hakkındaki görüşleri ortaya konulmuş ve bu risâlenin kaynaklarına ve yazma nüshalarının bilgisine yer verilmiştir. Çalışmanın son kısmını ise tahkiki yapılan risâlenin metni oluşturmaktadır."
