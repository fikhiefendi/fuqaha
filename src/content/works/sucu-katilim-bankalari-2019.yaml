abstract: "Bankacılık sektörü günümüzde dünyadaki tüm finansal sistemlerin merkezine yerleşmiş olup bu sistemlerde en önemli role sahiptir. Türk bankacılık sektörü de dünyadaki gelişmeler doğrultusunda hızlı bir ilerleme kaydetmiş ve finansal sistemin lokomotifi haline gelmiştir. Kuşkusuz finansal sistem içerisinde böylesine önemli bir yere sahip olan bankaların kârlılığı da yalnızca ilgili bankaların değil tüm ekonominin sürdürülebilir gelişme gösterebilmesi açısından çok önemlidir. Bu çalışmanın amacı Türk bankacılık sektöründe faaliyet gösteren mevduat ve katılım bankalarının finansal performansını etkileyen faktörlerin araştırılmasıdır. Bu kapsamda öncelikle bankacılık ile ilgili temel bilgiler ve banka türleri aktarılmış, daha sonra dünyada ve Türkiye'de bankacılık sektörünün tarihi ve son dönem gelişmeleri ele alınmıştır. Çalışmada ayrıca geniş kapsamlı bir literatür taramasına da yer verilmiştir. Son bölümde ise çalışmaya konu olan mevduat ve katılım bankalarının finansal performansını etkileyen faktörler 2005-2017 dönemine ilişkin makroekonomik göstergeler, sektöre özgü bir değişken ve bankalara özgü değişkenler kullanılarak oluşturulan altı farklı modelde dengeli panel veri analizi ile incelenmiş ve sonuçlar değerlendirilmiştir. Ulaşılan sonuçlara göre NPL oranı ve bankacılık sektörünün gelişmişlik düzeyi mevduat ve katılım bankalarının finansal performansı üzerinde negatif yönlü etkiye sahiptir. Diğer bağımsız değişkenlerin finansal performansa etkisi ise incelenen banka türüne ve performans ölçütü olan bağımlı değişkene göre farklılık göstermektedir."
