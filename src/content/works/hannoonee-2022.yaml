abstract: "Bu çalışma, h.896 yılında vefat etmiş olan Şemsuddîn el-Mısrî'nin Saf Sûresi'nin başından Mülk Sûresi'nin sonuna kadar olan kısmını içeren el yazmasının tefsirinin tahkik ve değerlendirmesini içermektedir. Bu el yazması, müellifin tefsirdeki ilmi metodundan dolayı kıymeti haiz bir eserdir. Müellif meşhur müfessirlerin metotlarından Rivayet, Dirayet ve İşari tefsir olarak bilinen bu üç temel metodu toplayarak eserinde kullanmıştır. (İşari tefsirinden alıntılar yaparken“ehlü'l-meânî”ifadesini kullanır. Müellifin tefsirinde Kıraat, Hadis, dilsel ve Fıkhi konuları kapsayan pek çok konuyu ele alması onun geniş ilmî kültüründendir. Söz konusu eser Kur'an ayetlerinin şerhinde, müfessirlerin ve alimlerin ifadeleri bakımından oldukça zengindir. Müellif, (eserde) manalarının delalet ettiği noktaları zikretmekle beraber onların okunma yollarını da göstermekte ve onları açıklarken hz. peygamberin hadisleriyle desteklemektedir. Müellif belagat, sarf ve nahivle alakalı dilsel meselelere çok önem verdiğinden dolayı; özellikle Kuran ayetlerini karşılaştırırken sözcüklerin hem sözlük anlamlarını açıklamış hem de onların lafzi ve delalet anlamlarını vermekten geri durmamıştır. Araştırmacı, müellifin hayatını ele alırken açıklayıcı tarih metodunu kullanmıştır. Aynı şekilde müellifin zikretmediği ya da eksik bıraktığı meseleleri eleştirel yöntem kullanarak tamamlamıştır. Tahkik kısmında ise tercihli metin yöntemini kullanmıştır. Bunu yaparken A) yazma eserleri karşılaştırıp şerhler arasındaki farkları ortaya çıkarmıştır. B) sahabe, tabiin, müfessirler, fakihler, muhaddisler ve dilcilere ait ifadelerin kaynaklarını dipnotlarda belirtmiştir. Müellifin kendi görüşlerini desteklemek için tıpkı dilcilere yaptığı gibi Kurtûbî ve Beyzâvî'nin eserlerinden de çokça alıntılar yapmış olmasına rağmen bunları bazen açıkça zikretmiş bazen zikretmemiş olması, bu çalışmanın en önemli sonuçlarındandır. Tıpkı azımsanmayacak derecede zayıf hadisi kullanması gibi bu durum da araştırmacıyı, bu görüşlerin izini sürmeye ve kaynakları dipnotlarda belirtmeye sevk etmiştir. Yukarıda geçen özelliklere ek olarak, tıpkı ayetlerin tefsirinin faydalarından bahsettiği gibi; lafızların, sözlük anlamlarına delaletlerinin yanı sıra onların arasındaki bağlama göre lafızların arasındaki delalet farklılıklarına da işaret etmesi, Makdisî'nin tefsirini diğerlerinden ayırmıştır. Onun kitabı kullandığı farklı metotlardan ya da çokça nakilde bulunması bakımından en kapsamlı tefsirlerden sayılabilir."
