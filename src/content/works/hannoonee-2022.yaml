title: "تفسير القرآن لشمس الدِّين محمَّد الشَّهير بالمصريِّ المقدسيِّ الشَّافعيِّ، أبو حامد من أوَّل سورة الصَّف إلى نهاية سورة الملك دراسةً وتحقيقاً"
