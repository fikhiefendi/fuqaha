abstract: "Bu çalışmanın konusu, rehin akdinin İslam hukuku ile günümüz Türk hukuku içerisindeki yeri ve muhtevasının belirlenmesidir. Çalışmamızda rehin akdi, ilkesel ve örneksel yöntem dahilinde İslam hukuku ve Türk hukukunda yer alan hükümler çerçevesinde ele alınıp mukayese edilmeye çalışılmıştır. İslam hukuku, Türk Medeni Kanunu ve özel kanunlarda düzenlenmiş olan rehinle ilgili hükümlerin, hukukî dayanakları ve ilkeleri bir bütün halinde ele alınmaya gayret edilmiştir. Özellikle rehin akdinin çeşitleri, kabz işleminin önemi ve tarafların rehin üzerinde tasarrufta bulunma işlemlerinden bahsedilmiştir. İslam hukuku ekolleri ile Türk hukukunun rehin akdi konusundaki yaklaşımları ve sistematiği, mukayeseli olarak işlenmeye çalışılmıştır. Bu çalışma süresince rehin akdiyle ilgili İslam hukuku ve Türk hukukunda düzenlenmiş olan kanun madde ve hükümlerine ilişkin yaklaşımlara ulaşılmaya çalışılmıştır. İslâm hukuku ve günümüz Türk hukukunda alacağa yönelik hakların, güvence altına alınmasını sağlayan ve mahiyeti itibariyle aynî bir temînât vasıtası olan rehin akdinin, incelenerek mukayese edilmesi amaçlanmaktadır. Temînât olarak verilen rehnin, iki hukuk sistemi içerisindeki yeri, mezheplerin konuya yaklaşımları ve pratikteki yansımaları, bunların aklî ve naklî gerekçeleri günümüz Türk hukuku kanun madde ve hükümleri bağlamında mukayeseli olarak ortaya konulmaya çalışılmıştır."
