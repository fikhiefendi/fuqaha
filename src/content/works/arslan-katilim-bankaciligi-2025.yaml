abstract: "Katılım bankacılığı, bireylerin bankacılık hizmetlerinde faizsiz işlem yapma olanaklarını ortaya koyan ve geleneksel finans modellerinden farklı bir yaklaşım sunan bir sistemdir. Bu model, özellikle İslami inançlara önem veren bireyler için cazip bir alternatif olarak değerlendirilmektedir. Bu araştırmada, bireylerin bu hizmet hakkındaki farkındalık düzeyleri ve dini inanç düzeylerinin katılım bankacılığı tercihleri üzerindeki etkisinin incelenmesi amaçlanmaktadır. Ayrıca, katılım bankacılığına yönelik algılanan fayda ve tutumun tercihler üzerindeki etkisi ele alınmıştır. Araştırma bulgularına göre, içsel dindarlık, İslami bankacılığa yönelik algılanan fayda ve İslami bankacılık bilgisi, tüketicilerin tutumları üzerinde anlamlı bir etkiye sahiptir. Buna karşın, dışsal dindarlığın tüketici tutumları üzerinde istatistiksel olarak anlamlı bir etkisinin olmadığı tespit edilmiştir. Ayrıca, İslami bankacılığa yönelik algılanan fayda ve İslami bankacılık bilgisi, tüketici farkındalığını etkileyen önemli faktörler olarak belirlenmiştir. Bunun yanı sıra, tüketici farkındalığı ile tüketici tutumu arasında anlamlı bir ilişki olduğu saptanmıştır."
