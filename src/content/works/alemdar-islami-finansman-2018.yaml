abstract: "Türkiye'deki faaliyet gösteren işletmelerin büyük bir kısmını Küçük Ve Orta Ölçekli İşletmeler (KOBİ) oluşturmakta ve dolayısıyla ülke ekonomisinde önemli bir paya sahip bulunmaktadırlar. KOBİ'lerin büyümesi, hedeflerine ulaşabilmek için ihtiyaç duyduğu finansal kaynakları doğru yerde, doğru zamanda ve uygun koşullarla alabilmesi, ülke düzeyinde yatırımların, üretimin ve istihdamın artmasına neden olacaktır. KOBİ'ler kısa veya uzun vadeli finansman ihtiyaçlarını çeşitli finansal araçlarla karşılamaktadır. Bu etkilerin nasıl olduğunu belirlemek için literatürde çeşitli araştırmalar olmakla birlikte, KOBİ'lerim gelişmelerinde İslami finansman yöntemlerinin etkilerinin belirlenmesi konusunda yapılan araştırmaların sayısı yok denecek kadar azdır. Bu nedenle, çalışmanın amacı, Türkiye'deki katılım bankalarının KOBİ'lerin gelişmelerine etkilerini incelemektir. Böylece, bu araştırma, literatürdeki boşluğun doldurulmasına ve bunun sonucunda da İslami finansman yöntemlerinin kullanılması yaygınlaştırılmasına katkıda bulunmayı amaçlamaktadır. Çalışmada, İstanbul Dudullu Organize Sanayi Sitesinde faaliyet gösteren 75 KOBİ'ye anket yöntemi uygulanmış ve veriler SPSS23.0 paket programı kullanılarak analiz edilmiştir. Yapılan analizler sonucunda, İslami finansman yöntemlerinin, KOBİ'lerin rekabet gücünün artırılması amacıyla yeni ürün ve yöntemler sunmaları, kullandırdıkları fonların etkinliğini sağlamaları, çalışmalarının KOBİ'lere katma değer sağlaması küçük ve orta ölçekli işletmelerin gelişimlerinde etkili olacağı görülmüştür."
