title: "حقوق الأطفال المولودين من أم إيزيدية ووالد داعش يالذين يعيشون بالمخيمات في القانون العراقي والشريعة الإسلامية"
titleTranslation: {"tr": "Irak ve İslam hukuku'na göre kamplarda yaşayan esir Ezidi anne ve IŞİD babadan doğan çocukların hakları"}
