abstract: "Çalışmanın amacı, DEAŞ örgütünün Sincar ve çevresindeki Ezidî yerleşim yerlerini işgali sonrasında Ezidî kadın ve kız çocuklarına yönelik cinsel saldırılar sonucu doğan ve bugün Suriye'deki Hol Kampı'nda esir hayatı yaşayan çocukların yaşadığı hukuki ve sosyal sorunları, şer'î, hukuki ve pratik perspektiflerden, çok katmanlı tümevarımsal metodolojiler çerçevesinde analiz etmeye dayanmaktadır. Bu tez, kamplarda tutulan bu çocukların uğradığı zulüm ve acıların sona erdirilmesi için İslam fıkhı çerçevesinde atılmış bir adım olarak değerlendirilmelidir. Şer'î açıdan yapılan incelemede, çocukların hem anneleri hem de babaları üzerinden nesep bağlarının ispatı, bakım ve eğitim haklarının korunması, nafaka yükümlülüğünün ebeveynlere veya onların yerini tutan kişilere yüklenmesi; bu mümkün değilse devletin bu yükümlülüğü üstlenmesi gerektiği sonucuna ulaşılmıştır. Ayrıca, çocukların ebeveynlerinin işlediği suçlar sebebiyle cezalandırılmalarının caiz olmadığı, İslâm şeriatına göre Ezidî kadınların köleleştirilmesi ve esir alınmasının meşru kabul edilemeyeceği tespit edilmiştir. Çalışmada, İslâm şeriatine aykırı olan aşırı fikirlerin ortaya çıkardığı tehditlere dikkat çekilmiş; bu fikirlerin binlerce insanın öldürülmesine ve kadim medeniyetlerin tahribine sebebiyet verdiği vurgulanmıştır. Ayrıca söz konusu aşırılıkların, çocukların kamplarda esaret altında kalmalarının başlıca sebeplerinden biri olduğu ve bu ideolojilerin, İslâm'a aşırılık isnat ederek dini karalamayı, Müslümanlar arasında mezhebî bölünmelere zemin hazırlamayı ve Müslüman toplumları dünya kamuoyundan tecrit etmeyi amaçladığı ifade edilmiştir. Bu çalışma, esaret altında bulunan kamp çocuklarının yaşadığı mağduriyetleri ele almakta ve onların topluma ve devlete karşı sahip oldukları hakları, fıkhî metinler çerçevesinde incelemektedir. Şer'î hükümlere göre, çocukların bakımı ve himayesi öncelikli olarak anne ve babaya yüklenmiş olup, ebeveynlerin çocuklarına nafaka sağlamaktan kaçınmaları büyük günahlardan (kebâir) kabul edilmektedir. Anne ve babanın bu yükümlülüğü yerine getirememesi durumunda, sorumluluk diğer yakın akrabalara intikal etmekte; onların da yetersiz kalması hâlinde ise bu yükümlülük devletin görev ve sorumlulukları arasında değerlendirilmektedir. Hukuki açıdan ise, Irak mevzuatına müracaat edilmiş; Irak Ahval-i Şahsiyye Kanunu, bu çocuklara nesep, nafaka ve miras haklarını tanımakta; Irak Vatandaşlık Kanunu ise, onlara Irak vatandaşlığını edinme hakkını sağlamaktadır. Irak Ceza Kanunu, çocuklara yönelik her türlü saldırıyı ve istismarı yasaklamakta; uluslararası hukuk normları ise kamp çocuklarının fakirliğinden yararlanılarak ağır işlerde çalıştırılmalarını ve çocukların silahlı çatışmalarda savaşçı olarak kullanılması veya lojistik destek gibi faaliyetlerde görevlendirilmelerini savaş suçları kapsamında değerlendirmektedir. Uygulamalı açıdan ise, Hol Kampı'nda görev yapan eğitimciler arasında dağıtılan 100 anket hazırlanmış ve toplanan veriler, Ezidî çocuklarının sosyal ve hukuki durumlarını tespit etmek amacıyla istatistikî programlar kullanılarak analiz edilmiştir. Ayrıca, yaşları 4 ila 12 arasında değişen çocuklara yönelik 100 doğrudan soru hazırlanmış; elde edilen sonuçlar, çocukların vatana dönme arzularını ve Irak vatandaşlığı edinme isteklerini açık bir şekilde ortaya koymuş, bununla birlikte çocukların aidiyet duygularını güçlü bir şekilde ifade ettikleri gözlemlenmiştir. Bu bulgular, söz konusu çocukların topluma entegre edilmesinin ve maruz kaldıkları olumsuz etkilerden arındırılmalarının zorunluluğunu ortaya koymakta; ayrıca, şer'î ve hukuki metinlerin analizinden hareketle, kamp hayatının doğurduğu zilletin ortadan kaldırılmasının ve kamp krizinin çözülmesinin, aksi takdirde bu durumun Irak'ın güvenlik yapısı üzerinde uzun vadeli etkiler doğurabileceğini göstermektedir."
