abstract: "Bir giriş ve üç bölümden oluşan çalışmamızda Ebû Zeyd ed-Debûsî'nin delil anlayışını, başta Taàvîmu'l-Edille olmak üzere, eserlerini inceleyerek ortaya koymaya çalıştık.Birinci bölümde, Debûsî'nin yaşadığı tarihi ortam, hayatı ve eserlerini ele aldık ve bize ulaşan eserlerini tek tek tanıtarak genel değerlendirmeler yaptık.İkinci bölümde, Debûsî'nin usûl sistematiğinde delil kavramı ve delil kavramıyla benzer kavramlar arasındaki ilişkiyi inceledik. Debûsî'nin eleştirdiği (delilin bulunmamasını delil kabuletmek ve yanıltıcı hüccetler diye değerlendirdiği taklit, ilham, istishâbu'l-hâl ve tard) delil getirme yollarını ve aklî hüccetleri bu bölümde ele aldık.Üçüncü bölüm de ise, Kitab, Hz. Peygember'den (s.a.s.) işitilen heber, mütevâtir haber ve icmâ ? olmak üzere kesin bilgi ifade eden şer ? î hüccetler ve müevvel âyet, tassîsin dışında kalan âmm lafız, haber-i vahid, Kıyas, illet (illete yapılan itirazlar ve illetin tahsîsi), istihsan, bizden öncekilerin şer ? îatları ve sahabe ve tâbiûn sözü gibi şer ? î delillere Debûsî'nin bakış açısını ortaya koymaya çalıştık."
