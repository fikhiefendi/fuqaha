abstract: "İslam aile hukukunun nikâh akdine bağladığı şahsi ve mali sonuçların, aynı hukuk sistemi içerisindeki durumunun incelenmesi ve Türk Medeni Kanunu ile mukayese edilmesi amacıyla yazılan tez çalışması, toplumun temeli olan aile yapısı içerisinde, taraflara haklar tanıyarak ödevler yükleyen evlilik birliğinin mahiyetine değinmiştir. Hak ve ödevlerin hem İslam hukuku hem günümüz hukuku bağlamındaki niteliğine yer vererek konuyu bir bütün halinde incelemeye çalışan bu çalışma, özellikle mali nitelikte olan nafaka ve mehrin tanımını yaparak bu kavramları hukuki kaynak, konu, kapsam ve bağlandığı sonuç bakımından ele almıştır. Bu çalışma neticesinde ilk olarak İslam hukukunun hukuki düzenlemeleri olan Kur'an, sünnet ve içtihatlar ile niteliği belirlenen nikâh akdinin, medeni hukuk anlamında bir medeni evlenme özelliği taşıdığı sonucuna varılmıştır. Aynı zamanda şekil ve şartları fıkıh ile belirlenen nikâh akdinin dini nitelikte olmadığı, bünyesinde yer almayan dini vasıfların, kamu düzeni düşüncesiyle bu akde yüklenmiş olduğu tespit edilmiştir. İslam aile hukuku kapsamında evliliğin şahsi ve mali nitelikteki hükümleri incelendiğinde 'kocanın üstünlüğü' ifadesinin eksik hatta doğru olmayan yorumlarının İslam hukuku ruhu ile uyuşmadığı anlaşılmıştır. Kadın ya da kocanın yaratılış itibariyle sahip oldukları farklı özellikler ya da yaşayan toplumun sosyal yapısı her iki tarafı da üstün hale getirebilecek durumdadır. Özellikle nafaka ve mehir gibi mali yükümlülüklerden kocanın sorumlu tutulması ve aile reisi olma vasfı insanı, kadına tanınan hakların yeterli seviyede olmadığı ve kadından beklenen görevlerin sayısının fazlaca olduğu fikrine götürse de İslam'ın kadın-erkek eşitliğini esas alan bir sistem olduğu öğrenilmiştir. Nikâh akdinin şahsi ve mali sonuçlarından her birinin Türk Medeni Kanunu'nda karşılığının olmadığı tespit edilmiş, mukayese edilebilecek olanların sayıca az olduğu sonucuna varılmıştır."
