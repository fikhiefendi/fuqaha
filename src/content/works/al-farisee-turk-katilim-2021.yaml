abstract: "Küresel ekonomi literatürüne giren faizsiz bankacılık sistemi, 70 yıl önce büyük bir başarıya imza atarak bir fikir olarak ortaya çıkmış ve bu başarı dünya çapında birçok İslami bankanın kurulmasına yol açmıştır. Ekonominin gelişmesi, bankacılık faaliyetlerinin genişlemesine yol açmış ve bankaların çokluğu ve artması ışığında, bankaların amacı artık kâr elde etmek değil; çalışmaya devam etmek olduğundan rekabet ortaya çıkmıştır. Bu nedenle güçlü ve zayıf yönlerini bilmek ve bir uyarı olan bankacılık güvenliği göstergesini bilmek için finansal tablolarını analiz etmek gibi performanslarını bilmek gerekmektedir. 2019 yılında ortaya çıkan, küresel ekonomiyi vuran ve finansal krizi yapan covid-19 virüsü, bu krizlerin en şiddetli olanlarından biridir ve bu krizin şiddeti finansal kurumlar, bankacılık sektörleri, ve bankacılık kurumları aracılığıyla gerçekleştirilen ticari işlemler ve borsalar gibi tüm dünya ekonomilerini etkilemesinden kaynaklanmaktadır. Bu kriz, ekonomik faaliyetlerin yavaşlamasına ve bankacılık sektöründe doğrudan veya dolaylı olarak ekonomik gerilemeye neden olmuştur. Bu çalışmada, Türk katılım bankalarının kâr performansı CAMELS sistemi kullanılarak değerlendirilmiştir. Türk katılım bankacılığı sektörünün Covid-19 virüsünün yayıldığı bu dönemde krizden ne ölçüde etkilendiğini öğrenmek için, katılım bankaları performansının finansal değerlendirme konusu birçok araştırmacı ve ilgilenenler için önemli bir konu olduğundan Albaraka Türk Katılım Bankası, Kuveyt Türk Katılım Bankası, Türkiye Finans Katılım Bankası, Ziraat Katılım Bankası, Vakıf Katılım Bankasının karlılığı değerlendirilmiştir. Türk ekonomisinin risklerle yüzleşebilecek finansal güce sahip olduğu için corona virüsü krizinden çok fazla etkilenmemiştir. Aynı zamanda sağlık, tekstil ve hazır giyim gibi sektörler Çin ve Avrupa ülkeleri yerine Türkiye'ye yönelmiştir. Bu nedenle Türk malı ve ürünlerine olan talep iki katına çıkmıştır. Böylece Türkiye en üst şeffaflık standartlarla krizin ürettiği etkilerin üstesinden gelip dış pazarların güvenini kazanmıştır."
