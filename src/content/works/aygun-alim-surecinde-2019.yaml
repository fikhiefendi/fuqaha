abstract: "Firmalar işe alım sürecinde iç kaynaklardan yararlanarak çalışanların beklentilerini karşılayıp onları örgütlerine bağlamasını amaç edinirler. Bu çalışmanın amacı da işe alım sürecinde kullanılan iç kaynakların çalışanların örgütsel bağlılığına etkisinin araştırmasını yapmaktır. Araştırmada“İşletme İçi Kariyer Fırsatları Algısı Ölçeği”ve“Meyer ve Allen Örgütsel Bağlılık Ölçeği”kullanılarak katılım bankasında çalışanların işletme içi kariyer fırsatlarına yönelik algıları ve örgütlerine olan bağlılıkları ölçülmek istenmektedir. 291 beyaz yakalı katılım bankası çalışanına anketler uygulandı. Elde edilen bulgular, işletme içi kariyer fırsatlarından yararlananların genel örgütsel bağlılıklarına, duygusal, devam ve normatif bağlılıklarına düşükte olsa bir etkisinin olduğu ortaya çıkmaktadır."
