abstract: "Kur'an ilimlerinden biri olan Kıraat ilmi Kur'an tarihi açısından, Kur'an'ın nüzul oluşu ile birlikte tezahür etmiş olması hasebiyle en kadim ilimlerden biri olma özelliğini taşımaktadır. Kıraat ilminin Kur'an'ın tefsirinde ve yorumlanmasında farklı kapılar aralanmasına sebebiyet vererek ilmî zenginlik sağlaması bu ilmin önemini bizlere göstermektedir. Çalışmamızda Kufe Kıraat Ekolünün öncüleri olan aynı zamanda dünya genelinde ve bilhassa ülkemizde tercih edilen Âsım kıraatı ile hem bir dil bilgini hemde on aşere imamından biri olan Kisâî kıraatlarını inceleyeceğiz. Usulde ve ferşte gerçekleşmiş olan bu kıraat farklılıklarını Kur'an'ın seb'ut tıval sureleri üzerinde detaylı şekilde göstereceğiz. Bakara, Al'i İmran, Nisa ve Maide sureleri üzerinde ise anlama etkisi olan kıraat farklılıklarını incelemeye çalışacağız. Tezimizin, Kıraat imamlarının önemli şahsiyetlerinden olan Âsım ve Kisâî hazretlerinin hem ilmi şahsiyetler olarak incelenmesi hemde kıraat farklılıklarının detaylı şekilde verilmesi ile kıraat ilmine ve dolayısıyla da tefsir ilmine katkı sağlayacağı kanaatindeyiz."
