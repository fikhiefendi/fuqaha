abstract: "Bu tez, Fars-Arap-Türk çocuk edebiyatlarının tarihsel gelişimini, başat yazar ve şairlerini, şiir ve hikâye örneklerinin imgelem farklılıklarını ve benzerliklerini inceliyor. Tezin amacı, bu üç ulusun sosyokültürel yapısını ele alan çocuk edebiyatının yapıtlarını karşılaştırmak, ve değerlendirmek. Tez, doküman analizi yöntemiyle hazırlanmış ve çeşitli kaynaklardan veri toplanmıştır. Araştırmanın verileri, çocuk kitapları, çocuk dergileri, İlkokul kitapları, elektronik kitap, dergi, web sayfaları vb, konuya dair yazılmış olan tezler, makalelerdir. Ayrıca, karşılaştırmalı çocuk edebiyatı, dünya çocukları arasında köprü iken, çeviri bilimi, onun ortaya çıkışına zemin hazırlamıştır. Yaratıcı çocuk edebiyatı özgün konularla gelişmiştir. Fars-Arap-Türk yapıtlarında benzer noktalar farklılıklardan daha fazladır. Her üç edebiyatta sosyokültürel değerler, vatan sevgisi, anne sevgisi, hayvan sevgisi, doğa sevgisi, nine sevgisi tema başlıklarıyla konu edilmiştir. Şiirlerde imgesel anlatımlar ve canlı örneklerle öne çıkarılmıştır. Fars edebiyatında; Abbas Yemînî Şerif, Nasır Kişaverz, Mustafa Rahmandust, Esedullah Şa'bânî, Efsane Şa'ban Nejad çocuk diliyle düşünceler görülmüştür. Arap edebiyatında şiirlerde canlı doğa tasvirleri yapılmakta eserlerde Allah inancı ifade edilmektedir. Ayrıca, Fatima Şerâfüddîn, Ya'kub Şârûnî ve Tağrid Neccâr gibi yazarlarla eserlerde gelenekler ve modernite konu edilmiştir. Türk edebiyatında da çocuğu eğlendiren, ona sanatçı duyarlılığı kazandıran yapıtlar ivme kazanmıştır. Gülten Dayıoğlu, çocuğu dramatik yaşamlarla tanıştırırken, Muzaffer İzgü, onu geleneklerle tanıştırır. Ayla Çınaroğlu, Aytül Akal ve Mavisel Yener ise, kedi, kuş, ağaç, böcek varlıkları şiirlerine dahil ettikleri tespit edilmiştir. Araştırmanın sonucunda, Fars çocuk edebiyatının felsefi ve derin anlamlı olduğu, Arap çocuk edebiyatının da öğüt verici üsluptan uzaklaşarak sosyokültürel değerlere yöneldiği, Türk edebiyatının ise kültürel yapıyı modern yaşamla yenileyerek, çocuğun öznesi olduğu yapıtlarda değerleri özgün temalar ve imgelerle işlediği belirtilmiştir."
