abstract: "Bu çalışma, İslam Ekonomisinde Yatırım konusuna ve kalkınma ve ekonomik reformla ilişkisine ışık vermeyi hedeflemektedir. Yatırım, genellikle milletlerin, kuruluşların ve kişilerin hayatında önemli bir rol oynamaktadır. Ayrıca yatırım toplumun en önemli kalkınma kaynaklarından biri olarak sayılır. Çalışma, 'İslam Ekonomisinde Yatırım Teşvikinin ekonomik reform üzerine olan etkisi nedir?' sorusunun oluşturduğu ana soruna cevap vermeyi amaçlamaktadır. Çalışma önemi bilimsel olarak; hem kamu hem de özel menfaatı sağlayacak ve dolayısıyla ekonomik reformu sağlayacak şekilde kişi ve kuruluşları, kendi paralarını çeşitli yatırım faaliyetlerine yönlendirip yatırmaya teşvik etmek suretiyle İslam ekonomisinin sağlanmasını amaçladığı hedeflerin niteliğiyle bağlıdır. Bu araştırmada İslam ekonomisinin uygulamaları sayesinde ekonomik sorunların derin çözümlenmesi amacıyla bu sorunlara büyük bir önem veren ekonomik araştırmalara ayak uydurmak isteğinin teşkil ettiği bu çalışmayı yazmak ana nedenlerine ışık verdim. Yatırım meselesi bilimsel ve işlevsel açıdan tartışmaya konulan ana meselelerden biri olarak sayılmaktadır. Çalışma metodu yoluyla araştırmada ele alınan biçimlerin önemlisinden bahsettim. Araştırmada tümdengelimli metodu kullanıldı. Bu yüzden bu konu ile ilgili çalışma, araştırma ile temel ve ikincil kaynaklardan doğrudan çıkarılan bilgilere temel bir şekilde dayanılmaktadır. Ayrıca İslam ekonomisi sayesindeki yatırım ile pozitif ekonomideki yatırım arasında mükayese yapmak ve İslam ekonomisindeki yatırım ile ilgili ekonomik teorileri tahlil edip pozitif ekonomideki olanlarla karşılaştırmak amacıyla tahlili ve karşılaştırıcı metod kullanılmaktadır. Araştırmayı birkaç önerileriyle sonlandırdım."
