abstract: "Bu tezin konusu 1839-1914 yılları arasındaki Süleymaniye kentinin ekonomik ve sosyal durumunu ele almaktadır. 1784 yılında şehrin temeli İbrahim Paşa el-Baban tarafından atıldıktan sonra el-Baban emirliğinin merkezi durumuna gelmiş insanlarda Kale Çolan' dan bu yeni kente taşınmışlardır. Kale Çolan bölgesi ekonomik, siyasî ve sosyal yönlerden iyi bir durumda olmadığından dolayı bu bölge tercih edilmiştir. Bu bölge Irak'ın kuzey doğusunda olup aynı zamanda İran'a da 45 km bir sınır komşuluğuna sahiptir. Bölge ticaret ve ekonomik açıdan çok önemli olmasına rağmen Osmanlı Devleti ile Safevî Devletinin sürekli bir çatışma içinde olmaları bölgenin ekonomik, siyasî ve sosyal durumunun bozulmasına sebep olmuştur. Süleymaniye kenti coğrafî açıdan dağlık bir bölgedir. Kent Şehrizor bölgesine açılır ve düz arazi oranı düşüktür. Fakat diğer bölgelerde durum farklı ve bu oran daha büyüktür. Bölgede Akdeniz iklimi hâkimdir. Süleymaniye kentini gelişim ve genişleme açısından ele aldığımız zaman bu kent, Melkendi Köyü kalıntıları üzerine yapılmış ve bu yüzden kentin ilk semtinin ismi Melkendi olmuştur. Bu kent, Birinci Dünya Savaşı başladığında yedi semtten oluşmaktaydı. Bu semtlerden birinde Yahudilerin yaşadığı bir semt de mevcuttu. Kent, idarî olarak çoğu zaman Musul vilayetine bağlıydı. Etnik açıdan baktığımızda da, iki sebepten dolayı farklı cins ve mezheplere ev sahipliği yapmıştır. Bu sebeplerden biri sınır üzeri bir kent olması, diğeri de Osmanlı Devleti egemenliği altında olmasıydı. Süleymaniye kenti de tıpkı Osmanlı devleti gibi farklı etnik ve mezhepsel bir yapıya sahipti. Fakat bu farklı grupların sayılarıyla ilgili elde resmî bir istatistik yoktur. Mevcut olan bilgilerde oryantalistlerin söyledikleri, bölgeyi ziyaret eden bilim adamlarının ve siyasetçilerin görüşlerinden ibaretti. Bölgenin sayımıyla ilgili net bilgiler verememişlerdir. Bilgi almak için o zamanın tek kaynağı olan Musul Salnâmesinde sunulan bilgiler net olmamakla birlikte aile sayıları ve kişilerden söz etmiştir. Süleymaniye emiri İbrahim Paşa, ısrarla Osmanlı bölgelerinden göçmen istemesine rağmen Batı İran' dan birçok aile burayı tercih etmiştir. Böylece Kürtlerin yanı sıra Yahudiler ve Kıldanlar da bölgeye yerleşmişlerdir. Dinî açıdan ele alındığında Müslümanlarla birlikte Yahudiler, Hristiyan ve bölgenin en az nüfuslu milleti olan Kakayılar da yaşamışlardır. Ancak nüfusun çoğunluğu Şafiî mezhepli Müslüman olduğu için camilerin sayısı oldukça fazlaydı. Ve bu camiler ibadet ve dinî özel işler için kullanılmıştır. Diğer dinlere mensup insanlar da her zaman özgür bırakılmışlardır. Kilise ve diğer ibadet yerleri ile ilgili de bilgiler vardır. Hatta kentin içinde birkaçının yeri de söylenmiştir. Ayrıca, din adamları toplum içinde çok önemli bir yere sahip olmuş ve devlet tarafından da desteklenmişlerdir. Tasavvuf, bölgenin en önemli göstergelerinden biriydi. Başta Kadirîler ve Nakşibendi olmak üzere birçok tarikat genel olarak insanları yönlendirmiştir. Bu durum da bölgenin sosyal yönünü geliştirerek kalkındırmıştır. Dinî gün ve olaylarda bu etki, net bir biçimde görülmüş ve her tarikatın mensubu bu özel günlerde birbirlerini ziyaret etmişlerdir. Bilim ve kültür açısından Baban prenslerinin çabalarıyla kent, her zaman eğitim ve kütüphaneler merkezi olmuştur. Süleymaniye kenti yetkilileri daima bilim ve bilim adamlarına karşı özel bir saygı göstermiş bu sebepten dolayı da bölgede birçok dinî okul eğitim hizmetlerini sunmuşlardır. Ancak bu okullar genellikle camilerde dinî eğitim veren kurumlardı. 1868 yılına kadar resmî olarak hiç bir okul bulunmamış ve bu tarihten sonra ilk devlet okulu resmî bir şekilde açılmıştır. Böylece eğitimde ileri adımlar atılmıştır. Bu okullarda Türkçe, Arapça ve Farsça dilleri yaygın olmakla birlikte gerektiğinde Kürtçe de kullanılmıştır. Bölge insanları farklı aile ve aşiretlere mensup oldukları için bu farklılık topluma da yansımıştır. Bu durum, kültür, sosyal hayat, gelenek ve göreneklerde de etkisini göstermiştir. Aşiret yapısı kentsel yapıya karışarak tesirini yavaş yavaş kaybetmiştir. Böylece kent sakinleri aşiret yapısından kurtulmuşlardır. Fakat kentin çevresi kendisini bu durumdan tamamen soyutlamamıştır. İşte bu yüzden bölgeyi ziyaret eden bilim adamları bölgeye aşiretler memleketi adını vermişlerdir. İnsanlar genel olarak yerleşik, göçebe, yarı göçebe olarak üçe ayrılmışlardır. Bunların arasında çok zor çatışmalar olmuş özelikle göçebeler her zaman kendilerini aşiret yapısı içinde bulmuşlardır. Göçebeler, yerleşim alanlarına saldırarak ev, mal ve mülklerine büyük zararlar vermişlerdir. Ayrıca ziraat alanlarını bozup hayvanlarını talan etmişlerdir. Bunun yanı sıra köylerde yaşayan köylüler her zaman köy ağalarının zulmüne maruz kalmışlardır. Bölgenin önemli aşiretleri Hemevand, Caf ve Nureddin aşiretleriydi. Bu aşiretler, daima Osmanlı devletiyle çatışmışlar ve Osmanlıların durumu sakinleştirme çabaları boşa gitmişti. Fakat bu aşiret yapıları içinde bazı önemli isimleri kendilerine çekmeleri bu aşiretlerin etkisini azaltmaya yetmişti. Bölge ekonomik olarak ziraat ve hayvancılıkla uğraşmıştır. Ziraat ekonominin bel kemiğini oluşturmaktaydı. Bu sebeple insanların çoğu bu işi yaparak günlük hayat ihtiyaçlarını karşılamışlardır. Ziraat ürünlerinin başını buğday, arpa, meyve ve tütün çekmiştir. Bazen de ziraat ticarî amaçlı yapılmıştır. Hayvancılık ekonomik gücün bir parçası olmuş ve bazı insanlar bu işi yaparak et, süt, deri üretmişlerdir. Sanayi alanına da büyük bir önem verilmiştir. Ancak bu sektörde kullanılan ham madde ilkel ve basit olmuştur. Bölgenin en önemli sanayi ürünü sabun olmuştur. Ve çoğu zaman bu üretim iç stok için kullanılmış bazen de başka bölgelere gönderilmiştir. Bir başka çalışma alanı da silah üretimi olmuştur. Bazı kaynaklar silah üretiminin çok gelişmiş popüler bir iş olduğunu söylemişlerdir. Söz konusu silah sektörü daha fazla silah onarımı şeklinde yapılmıştır. Ancak Irak'ın İngiliz işgalinden sonra bu çalışma alanı sınırlandırılmıştır. Çünkü İngilizler insanları bu çalışmalarına yasaklar koymuştur. Söz konusu ekonomi sektörünün gelişimi Osmanlıların on dokuzuncu yüzyılın ikinci yarısında (Bâbâniler dönemine nazaren) çok gelişmiştir. Ancak bölge, emniyet ve istikrar açısından en zor dönemini yaşamıştır. Bu tezin önemi ve amacı Kuzey Irak'ın en önemli kentlerinden biri olan Süleymaniye kentinin ekonomik ve sosyal görünümünü ortaya koymaktır. Çünkü bu kent, coğrafî konumu nedeniyle büyük bir önem taşımaktadır. Bundan dolayıdır ki bölge her zaman askerî ve siyasî olaylara sahne olmuştur. Tarih boyunca bölgede birçok çatışma olmuş ve kentin ekonomik ve sosyal yönlerini etkilemiştir. Fakat bu yön, yazar ve araştırmacılar tarafından çok ele alınmamıştır. Bu olaylar Süleymaniye toplumundaki fertlerin üzerinde derin etki bırakmıştır. Bu araştırma, Süleymaniye kentini 1839-1914 yılları arasında ekonomik ve sosyal yönden ele alan birinci elden bilimsel bir çalışma olmuştur. Araştırmacı bu çalışmayı benzeri çalışmalar için bir ön hazırlık olmasını diler. Bu tez iki bölüm ve bir önsözden oluşmaktadır. Araştırmacı, Süleymaniye kentinin coğrafî konumunu önsöz bölümünde ele almaktadır. Kent Irak'ın kuzeyinde yer almaktadır. Daha sonra kentin iklim ve hava durumu ele alınarak yılın dört mevsiminde belirgin olarak kışın soğuk, yazın kuru sıcak olduğunu belirtmiştir. Ayrıca, bölgenin yeryüzü iniş ve çıkışlarını ele alarak dağlık, ovalık ve derelerden oluştuğunu söylemiştir. Kentin ismi ile ilgili farklı beş görüş sunduktan sonra da bunlardan en uygun olanı kentin yapılış fikrine sahip olan ve uygulayan İbrahim Paşa'nın kendi dedesinin ismi olan Süleyman Paşa'ya atfen bu ismin verildiğini göstermiştir. Daha sonra araştırmacı, kentin sosyal yapısını ele alarak insanların farklı aşiret ve kabile mensubu olup farklı yerlerden gelerek Süleymaniye'ye yerleşmişlerdir. Kentin ekonomisi, ziraat ve hayvancılık olmakla birlikte bazı el emeği meslek dükkânlarından oluşmuştur. Böylece sanayi ve ticaretin kentin ekonomisindeki önemli yere sahip olduğunu da belirtmiştik. Birinci bölümde Süleymaniye kentinin dinî ve etnik yapısı ele alınmıştır. Başta kürtler kentin asıl sakinleri olarak tanıtılmış, nerden, ne zaman geldikleri ele alınmıştır. Bunların çoğu Babani aşiretine mensup iken bazıları da diğer bölgelerden gelmişlerdir. Ayrıca kentin bir başka bölümü de İran'dan gelip yerleşmişlerdir. Araştırmada Hıristiyanlara da yer verilmiş ve Irak'ın farklı yerlerinden kente geldikleri ve hepsinin Aşuri aşiretinden olduklarını da belirtmiştir. Araştırmada Musevilere de yer verilmiştir. Dinî yapıyla ilgili kentin büyük bölümü Müslüman-Sünnidir. Ayrıca tasavvuf tarikatlarına bağlı olan kent sakinlerinin ibadetleri için birçok camileri olmuştur. Hıristiyanlar dinî ibadetlerini özgür bir biçimde kiliselerde yapmışlardır. Museviler de bölgeye milattan sonra VI. yüzyılında gelmişler ve daha sonra kaldıkları yerler onların semtleri olmuştur. Musevilerin de dinî ibadetleri için özel yerleri vardı. Ayrıca bayram ve özel günlerde de bu yerlerde toplanıp kutlamalarını yapmışlardır. Ve aynı zamanda okul olarak da bu yerler kullanılmıştır. Bu bölümde eğitim kurumları ve coğrafî dağılım da ele alınmıştır. İkinci bölümde araştırmacı, kentin ekonomik oluşumunu, hayvancılık ürünlerini, sanayi ve hayvancılığı ele almıştır. Ziraat ve hayvancılık bölge ve kentin önemli ekonomi damarlarından sayılır. Halk bu iki alana çok önem vermiştir. Bölgede sanayi ilkel olsa da halk sanayiye önem vermiş ve artan ürünleri de çevre bölgelere gönderip başka ürünlerle değiştirmiştir. Söz konusu ticarî alışveriş de oldukça ilkel bir durumdaydı."
