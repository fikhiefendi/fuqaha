abstract: "Tahrîrât, kıraat rivayetlerinde meydana gelen isnâd merkezli problemleri tespit ederek doğru aktarım zincirleri inşa etmeyi temin eder. Modern dönemde tahrîrâtın kıraat ilminin bir alt disiplini olarak İbnü'l-Cezerî'nin (ö. 833/1429) en-Neşr fi'l-kırâ'âti'l-'aşr'ı yazması ve bu eser hakkında kaleme alınan çalışmaların ortaya çıkmasıyla varlık kazandığı öne sürülmektedir. Dolayısıyla en-Neşr'den önceki süreçlerde tahrîrât kabilinden bir araştırma alanının olmadığı ifade edilmektedir. Ne var ki bu yaklaşım kabul edilebilir durmamaktadır. Çünkü modern çalışmaların büyük bir kısmında tahrîrâtın ortaya çıkışını etkileyen faktörler, tarihsel süreç ve tahrîrâtın kıraat ilminin temel meseleleriyle olan ilişkisi tespit edilmeden böyle bir değerlendirmeye gidilmiştir. Dolayısıyla bu çalışmada sağlam temellere dayanan değerlendirmeler yapmak için ilk olarak yedi harf ve kurrâ kavramlarıyla ilk dönem mushafların istinsahından bölgesel kıraat birikiminin oluşmasına kadar kıraat ilminde isnâd olgusunun gelişimi tespit edilmiştir. Ardından tahrîrâtın kıraat ilmi rivayetlerini incelemede isnâd kritiğinin bir parçası olarak ele alınıp alınamayacağı tartışılmıştır. Bu çerçevede“Hz. Peygamber'den İbn Mücâhid'e (ö. 342/936) Tahrîrât: Teşekkül Dönemi”,“Te'lifât Döneminde Tahrîrât: Gelişim Dönemi”ve“İbnü'l-Cezerî ve Sonrasında Tahrîrât: Tekâmül ve Ekolleşme Dönemi”olmak üzere tahrîrât için bir dönemlendirme sunulmuştur. Bu dönemlendirme çerçevesinde İbn Mücâhid'den İbnü'l-Cezerî'ye kadar kaleme alınan kıraat eserlerinde“ricâl”merkezli incelemelerin, İbnü'l-Cezerî ve sonraki dönemde ise“eser”merkezli incelemelerin baskın olduğu tespit edilmiştir. en-Neşr ve en-Neşr'in ana kaynakları üzerinden İbnü'l-Cezerî'nin tahrîrât yöntemini inceleyen Bedâi'u'l-burhân gibi çalışmalarla“eser”merkezli incelemeler tahkim edilmiştir. Bu kapsamda İbnü'l-Cezerî'nin en-Neşr'de takip ettiği yöntemi eleştirel bir bakış açısıyla ele alan Mustafa b. Abdirrahmân el-İzmîrî'nin (ö. 1154/1741) Bedâi'u'l-burhân'daki“eser”merkezli incelemelerinde kıraat kitaplarının girişinde yer alan isnâd bahislerinin merkezî bir konum teşkil ettiği ortaya çıkarılmıştır. Mustafa el-İzmîrî'nin geniş bir literatürü incelemeye tabi tutmasının etkileri tahrîrât edebiyatına yansımıştır. Fakat Mustafa el-İzmîrî'nin ulaştığı sonuçların Osmanlı dönemi kıraat eğitim ve öğretiminde önemli bir yeri olan meslekler ve kürrâselerde karşılık bulmadığı görülmüştür."
