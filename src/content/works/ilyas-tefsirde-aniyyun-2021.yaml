abstract: "Modern dönemin bir ürünü olarak karşımıza çıkan Kur'ancılık söyleminin başta Hindistan, Türkiye, Mısır olmak üzere birçok İslam ülkesinde temsilcileri ve taraftarları bulunduğu görülür. Bu söylemin bayraktarlığını Hint alt kıtasında Kur'âniyyûn ile Türkiye'de ortaya çıkan Mealcilik ekolünün yaptığı anlaşılmaktadır. Her iki ekol temsilcileri, dinî konularda verilecek bir hükmün sadece Kur'an'dan çıkarılması gerektiğini iddia etmiştir. Bu nedenle Kur'an dışı, gelenek içerisinde yer alan rivayetler kıyasıya eleştirilmiştir. Bu eleştirilerden en fazla nasibini alan ise hadis-sünnet olmuştur. Bununla birlikte her iki ekolün modernizmin ve modern bilim anlayışının etkisiyle tabiat kanunlarına uymayan ayetleri rasyonel bir şekilde yorumlayarak çağın bilimsel verileriyle uyumlu hale getirdikleri görülmüştür. Geleneği ve sünneti yorumda belirleyici olarak kabul etmediklerinden özellikle Kur'an'da açıkça zikredilmeyen namazın vakitleri, rekât sayıları, zekâtın miktarı ve verilecek zamanı gibi meselelerde çok farklı görüşler ileri sürmüşlerdir. Ayrıca onlar, Kur'an'da zikredilmeyen hususlarda insana sınırları belirli olmayan ruhsatlar vermiş, bu noktada oldukça serbest bir tavır takınmışlardır."
