abstract: "Saîd b. Müseyyib, I. (VII.) yüzyılda Medine'de doğmuş, yaşamış ve vefat etmiş önemli bir tâbiî âlimdir. Hz. Ömer, Osman ve Ali gibi büyük sahâbilerin çoğuyla görüşerek onlardan rivayette bulunmuştur. Kibâr-ı tâbiîn ve Fukahâ-yi seb'a'nın öncüsü kabul edilen İbnü'l-Müseyyib,“Amel-i Ehl-i Medine”geleneğinin ve Ehl-i hadis ekolünün kurucularından sayılmaktadır. Üstün zekâsı ve güçlü hafızası sayesinde genç yaşta Medine'nin önde gelen âlimleri arasına girmiş, Mescid-i Nebevî'de kurduğu ilim halkasında Kur'ân ve sünnet merkezli fetvalar vermiştir. İsnad sisteminin yerleşmesine büyük katkı sağlamış,“er-rihle fî talebi'l-hadis”geleneğinin öncüsü olarak hadis için günlerce yol gitmiştir. Ayrıca cerh-ta'dîl faaliyetlerinin başlamasında da önemli rol oynamıştır. Araştırmada İmam Şâfiî'nin mürsel anlayışı konusunda iki yaygın yanlış görüş tespit edilmiştir. Birinci yanlış görüş,“İmam Şâfiî mürselleri hüccet kabul etmemekle birlikte Saîd b. Müseyyib'in mürsellerini bundan istisna etmiş ve onların tümünü mutlak hüccet saymıştır”şeklindedir. İkinci yanlış görüş ise“Saîd'in mürselleri de hüccet değildir ancak İmam Şâfiî bunları tercih vesilesi olarak kullanmıştır”şeklinde ifade edilmektedir. Bu yanlış görüşlere karşı, V. (XII.) asrın muhaddisi Beyhakî'nin sunduğu tutarlı görüş altı madde halinde özetlenebilir: İmam Şâfiî sadece sahîh muttasıl hadisin bulunmadığı durumlarda mürsele başvurmuş, Saîd b. Müseyyib gibi güvenilir râvilerden hadis alan tüm kibâr-ı tâbiîn'in mürsellerini değerlendirmiş, sadece mürsel kabul şartlarına uyan rivayetleri kabul etmiş, mürselle ihticâc konusunda kimseye ayrıcalık tanımamış, her mürseli özel olarak incelemiş ve daha kuvvetli deliller bulması durumunda Saîd'in mürsellerini bile terk etmiştir. Sonuç olarak İmam Şâfiî'nin Saîd b. Müseyyib'in mürsellerine yaklaşımı, iddia edildiği kadar basit ve kategorik değildir. Beyhakî'nin sunduğu örnekler, İmam Şâfiî'nin sahîh senetlerle gelen mürselleri bile reddettiğini göstermektedir. Bu durum, onun mürsel değerlendirmesinde sadece râvi güvenilirliğini değil, metnin içeriğini, diğer delillerle uyumunu ve fıkhî tutarlılığı da dikkate aldığını ortaya koymaktadır. İmam Şâfiî, Saîd b. Müseyyib'ten gelen mürsel rivayetlerden ancak mevsûl rivayetlere muvafık olanlarına itibar etmiş ve bunları genellikle takviye amaçlı kullanmıştır. Sahîh hadise veya daha kuvvetli delillere muarız olan mürselleri ise kabul etmemiştir. Bu yaklaşım, İmam Şâfiî'nin tüm büyük tâbiîlerin mürsellerini aynı metodolojik çerçevede değerlendirdiğini ve takviye şartlarını titizlikle uyguladığını göstermektedir"
