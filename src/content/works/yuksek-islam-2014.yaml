abstract: "Bu doktora çalışmamızda; Hicri III. asırda yaşayan Muhammed b. Cerîr et-Taberî'nin (d.224/838 - ö.310/923) kurduğu ve yaklaşık iki asır kadar devam ettikten sonra kaybolan Taberî mezhebi ele alınmaktadır. Bu mezhep, Cerîriyye mezhebi olarak da bilinmektedir. Bu itibarla çalışmamızın asıl konusu, mezhebin İslam hukuk tarihi sürecindeki genel durumunu, kurucusunun hayatını ve ona tâbi olan fakihleri tanıtmak; mezhebin fıkhî hükümleri oluşturmada yararlandığı usûlü ve kendine özgü fıkhî hükümlerini ortaya çıkarmaktır. Taberî, tarihçiliğinin yanı sıra tefsir, hadis ve fıkıh ilmi başta olmak üzere İslâmî ilimlerin hemen tamamında yetkin bir âlimdir. Taberî, usûl ve furûuyla müstakil bir mezhep kurmuştur. O ve öğrencileri bu mezhebe dair eserler yazmışlardır. Ne var ki bu eserler günümüze kadar ulaşmamıştır. Bu sebeple Taberî mezhebine ait bilgiler daha çok meşhur tefsirinden elde edilmiştir. Taberî mezhebi esas olarak ehlisünnet çizgisini takip etmiştir. Bunun yanında özgün görüşleri de bulunmaktadır."
