abstract: "Bu çalışma, Ürdün İslami bankaları için fırsatları ve zorlukları belirlemeyi amaçlamaktadır. Metodoloji: 01.08.2022-31.12.2022 tarihleri arasında tanımlayıcı kesitsel bir çalışma yapılmıştır. Amman şehrinde, Google modellerini kullanarak, çevrimiçi olarak, çalışma popülasyonu, İslami bankalarla çalışan müşterilerden oluşmaktadır. Çalışma örneklemi, veri toplama sırasında çalışmaya katılmayı kabul eden 169 müşteriden oluşmaktadır. Verilerin toplanmasında“Kişisel Bilgi Formu”ve“İslami Bankanın Karşılaştığı Fırsatlar ve Zorluklar Anketi”kullanılmıştır. Bulgular: Araştırmaya en fazla katılımcının 41-50 yaş arasında değiştiği, %76,3'ünün kadın, %69,2'sinin lise mezunu, %26,6'sının istihdam edildiği, %50,9'unun biraz memnun olduğu, %66,9'unun 5 yıldan az bir süredir İslami bir bankayla uğraştığı, %50,9'unun İslami Banka'nın tercih edilme nedeni olduğu belirtildi. Banka itibarı Araştırmaya katılan erkek katılımcıların likidite ve fırsatlar alt boyutunda daha yüksek, ortaöğretimi az olanların ise gelirinden biraz memnun olanların müşteri bilgileri alt boyutunda daha yüksek puanlara sahip oldukları belirlenmiştir. Diğer gruplarla karşılaştırıldığında fark istatistiksel olarak anlamlıydı (p≤0.05). Zorluklara gelince, hukukun alt boyutundaki zorluklar, bankacılık kontrol sistemi boyutu ve yaş grubu arasındaki zorluklar arasında önemli bir etki belirlenmiştir. Bankacılık denetimi alt boyutunda gelirleri diğer gruplara göre daha yüksek olup, aradaki fark istatistiksel olarak anlamlıdır (p≤0,05). Sonuç: Araştırmanın sonuçları, İslami bankaların müşteriler açısından karşılaştıkları fırsat ve zorlukların yaş, medeni durum ve eğitim gibi değişkenlerden etkilendiğini göstermektedir."
