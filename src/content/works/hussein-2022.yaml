abstract: "Bu araştırma, çalışma ve araştırm yönünden Arap mirasını ele almaktadır, 9. Ve 10. Yüzyılının alimlerinden olan Şemseddin Muhammed el-Mesri'nin (ölüm : 896 Hicri sonrası) tefsiri en önemli tefsirlerdendir.Yazar, yaklaşımında yukarıda bahsedilen tefsir yöntemiyle tefsir yöntemini izlemiştir, ek olarak düşünce ile tefsir, ama daha çok birinci yöntem kullanılmaktadır, bu tefsirin özelliği Kuran Kerim mucizeleri konusuna önem vermektir. O dönemin insanlarının ansiklopedik kültürünü gösteren bilişsel çeşitliliğin yanı sıra bir çok bilim içermektedir, en belirgin eleştireceğimiz konu ise Kurtubi'ye atıfta bulunmadan alıntılar almak, ayrıca kalbi etkileyen güzellikler çıkaran Mısırlıyı da bulabilirsiniz, El-Masri, Taha Suresi ve Enbiyaa süresinde geçen nezaket ve fıkraların birçoğundan bahsetmiştir, tüm bunlar yazarın kültürünü ve tefsirdeki yerini göstermektedir, Mısırlının yorumu, ayetlerin açıklanmasında sarf konuların sunumunu içeriyordu, tefsiri belaget açıklamaları ile desteklemiştir, Ayrıca kelimelerin açıklamaları ve sözlük anlamlarıyla da ilgilenmiştir, El-Masrî, yalnızca sözlük anlambilimini açıklamakla yetinmemiştir, aynı zamanda sözcüklerin bağlamlarına göre anlamsal farklılıklarını da genişletmiştir."
