abstract: "Bu çalışma, İslami ilimlerde uzman ve aynı zamanda İslam âlimlerinin önde gelen simalarından olan imam el-Gürânî'nin bazı fıkhî yönlerini ve içtihadî görüşlerini yansıtmak için hazırlanmıştır. Bilindiği gibi şer'î hükümleri derinlemesine bilmek, fıkhi görüşlere vakıf olmak, müctehidlerin delillerine muttali olmak ve şer'î delillerden istinbât etmeyi bilmek büyük bir önemi haizdir. Bundan dolayı bu çalışma, fıkhın önemli konularından olan biri olan“el-Ahvâlu'ş-Şahsiyye”ye dair büyük bir çaba sarf eden son dönemin önemli fakihlerinden imam el-gürânî'nin çalışmalarını konu edinmiştir. İmam el-Gürânî'nin“el-Kevserü'l-Cârî”adlı kitabında da görüldüğü üzere, kendisinin fıkhî bir şahsiyet olduğunu gösteren özgün görüşleri ve somut içtihatları bulunmaktadır. el-Gürânî, bu eseriyle cüzi meselelerde kendisinin de bir takım görüşleri olduğunu ve istinbât kudretini taşıdığını göstermiştir. El-Gürânî'nin tartışmalı bir şekilde ele aldığı ve yorumladığı ictihâdî meselelerden; muta nikâhı, şiğar nikâhı, nişanlısına bakmak, mehir ve miktarı, mehir olabilecek şeyler vb. konular öne çıkanlardır. Çalışmanın neticesinde imam el-Gürânîn görüşlerinin bir kaçı hariç çoğu zaman Şâfiî mezhebinin görüşleriyle birebir uyuştuğunu tespit ettik. Ayrıca İmamın, bazı meselelerde ictihada başvururken bazılarında ise sadece âlimlerin görüşlerini nakletmekle iktifa ettiğini gördük. Bu çalışmamızda mezkûr görüşler arasında eleştiri, analiz, tercih ve istinbât gibi yöntemlere başvurarak çalışmamızı“mukayeseli fıkıh”formatıyla hazırlamış olduk."
