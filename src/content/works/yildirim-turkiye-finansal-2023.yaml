abstract: "İşletmelerin orta vadeli işletme sermayesi ihtiyacının finanse edilmesinde alternatif ve yeni bir yöntem olarak gündeme gelen finansal kiralama; işletmelere veya gayrimenkul geliştirme firmalarına faaliyetleri için gerekli olan gayrimenkulleri edinme, tamamlama, yenileme veya genişletme imkânı tanıyarak ya da envanterinde bulunan gayrimenkuller karşılığı fon sağlayarak, faaliyette bulunulan sektöre, gayrimenkul sektörüne ve reel ekonomiye doğrudan katkı sağlamaktadır. Finansal kiralama ilişkisinin özünde, konu varlığın hukuki mülkiyeti ile ekonomik mülkiyetini ayırmak yatmaktadır. Türkiye'de orta vadeli kredi kullanımına çok yakın bir finansman yöntemi olarak 1985 tarihli 3226 Sayılı Kanun ile hukuki altyapısı oluşturulan finansal kiralama uygulamasına, hukuki altyapısı güçlendirilerek ve kapsamı genişletilerek 2012 tarihli 6361 Sayılı Kanun ile devam edilmektedir. Finansal kiralamanın bir türü olan sat ve geri kirala yöntemi ise, Türkiye'de ilk defa ticari gayrimenkul yatırımları ve konut ediniminin finansmanında İslami finansman modeli olarak 6361 Sayılı Kanun ile uygulanmaya başlanmıştır. Araştırmada; Türkiye'de gayrimenkul sektöründeki finansal kiralama ve sat ve geri kirala yöntemleri literatür taraması, mahkeme kararları, sektör temsilcileri ve aktörleri ile yapılan anket ve yüz yüze görüşme sonuçları çerçevesinde hukuki, ekonomik ve teknik yönlerden incelenmiş, bu yöntemlerin ayrı ayrı gayrimenkul yatırımlarının gelişimine etkisi irdelenmiş, sektör temsilcilerinin sektöre ilişkin beklentileri ile sektörün ihtiyaç ve eksiklikleri belirlenmiş, çözüm önerileri ortaya konulmuş ve Türkiye'deki mevzuata göre yapılmakta olan finansal kiralama sözleşmelerinin İslam Hukuku ile ilişkisi değerlendirilmiştir. Araştırma sonuçlarına göre, finansal kiralama uygulamalarının 6361 Sayılı Kanun'un yürürlüğe girdiği ilk yıllarda yaşanan likidite sıkıntısını aşmak amacıyla gayrimenkul piyasasına finans sağlama gerekliliğinin etkisi ile 2014-2018 yılları arasında önemli bir artış trendi yakaladığı, ancak bu ivmeyi sonraki yıllarda devam ettiremediği görülmektedir. Finansal kiralama yönteminin gayrimenkul ve konut finansmanında son yıllarda yaygın olarak kullanılamamasında; güncel ekonomik haraketliliğin sonucunda fiyatlar genel seviyesinde görülen yukarı yönlü ani hareketlerin yarattığı belirsizlik, mevzuatın yeterli görülmemesi, prosedürlerin/bürokrasinin fazlalığı ve bu prosedürlerin sürekli değişmesinin yarattığı belirsizlik ve güvensizlik, sektörün finansal hacminin kısıtlı olması, yöntemin amacına uygun kullanılmamasının özellikle katılım bankalarında yarattığı olumsuz algı, operasyonel maliyetlerin yüksekliği nedeniyle yaşanan fiyatlama sorunu, mortgage yöntemine göre vadenin kısıtlı (maksimum 5 yıl) ve faiz oranının yüksek olması, uygulanan vergisel avantajlarının yetersizliği ve indirimli katma değer vergisi (KDV) oranının uygulanmaması, yöntemin katılım bankacılığı (İslami finans) ilkeleri ile uyuşmayan yönlerinin olduğu inancı dolayısıyla yönteme sıcak bakmayan kesimin varlığı gibi hususların belirleyici olduğu değerlendirilmektedir. Sonuç olarak, genel olarak finansal kiralama, özel olarak sat ve geri kirala yönteminin gayrimenkul yatırımları ve bireysel hanelerin gayrimenkul ve konut ediniminin finansmanı için alternatif bir araç olarak kullanımının yaygınlaştırılması, sektör aktörlerinin teknik ve mali kapasitelerinin geliştirilmesi, uzun vadeli ve düşük maliyetli kendi kaynaklarını yaratabilme mekanizmalarının oluşturulması, insan kaynaklarının iyileştirilmesi, yöntemin bilinirliğinin artırılması ve bu anlamda mevzuat ve finansal anlamda adımlar atılması ile mümkün olabileceği öngörülmektedir."
