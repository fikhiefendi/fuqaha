abstract: "İslam düşünce tarihinde irade konusu temel olarak iki başlıkta incelenir: Birincisi Allah'ın iradesi, ikincisi ise insanın iradesidir. İlahi irade içerisinde insana ait bir iradenin varlığı meselesi kelamcılar arasında büyük tartışmalara neden olmuştur. Kelam ilminde ilahi irade, Allah'ın fiillerinde ve emirlerinde tamamıyla özgür ve hür olduğunu ifade etmekte olan bir yetkinlik olarak görülmektedir. İlahi iradenin insan iradesine bir tesiri olup olmadığı konusu tüm kelamcıların zihinlerini işgal etmiş sorgulamış ve bu konuda fikir beyan etmişlerdir. Bu durum, farklı kelam ekolleri arasında tartışmaya ve ilmi münakaşalara yol açmıştır. Tartışmalar sonucunda kelamcılar fikir ayrılığı ve ihtilafa düşmüşlerdir. Allah'a irade sıfatını nisbet etmekten kaçan Mutezile âlimleri, genel anlamda iradeyi, Allah'ın fiillerin maslahat ve mefsedet yönleriyle bilmesi şeklinde kabul etmiş, diğer taraftan bu görüşe karşı çıkan kelamcılar, ilahi iradenin ezeli sıfat olarak kabul edip Allah'ın mutlak kudret ve irade sahibi olması durumunu ispatlamaya çalışmışlar. İnsan iradesi de kelamcılar arasında ihtilaf konusu haline gelmiştir. Bazı kelamcılar insanın iradesini kabul ederken, bunların karşısında insanın hiçbir irade ve gücü olmadığını savunan kelamcılar da olmuştur. Bu çalışmanın giriş bölümünde İmam Cüveynî'nin hayatı, yaşadığı dönem, eserleri ve üzerinde yapılan çalışmalara yer verilmiştir. Birinci bölümde iradenin sözlük ve terim anlamları ve kelam ilminde ilahi irade ve insan iradesinin nasıl ele alındığı hakkında bilgi verildi. Tezimizin ana konusu teşkil eden ikinci bölümde ise Cüveynî'nin hem ilahi irade hem de insan iradesi konularını nasıl işlediği hakkında bilgi verildi."
