abstract: "Bu araştırmada kıyasın fer'i delillerle çelişmesini ve fakihlerinihtilaf etmeleri üzerine çalışılmıştır. Teâruz meselesi öncelikle dilaçısından ve istılâhî olarak ele alınmış, çeşitlerini, bölümlerini,şartlarını ve sebepleri açıklanarak usulcüler nazarında ne mânâya geldiğine ve onların bu meseledeki tercihlerine değinilmiştir.Bunun yanı sıra tercih kâideleri açıklanarak teâruz ile ihtilafarasındaki farklar ortaya konulmuştur. Bu araştırmada kıyasın rükunleri ve şartları açıklanmış, dil ve istilâhi bakımdan ele alınmış, kıyas ile amel edilmesinin ehemmiyetine değinilmiştir.Sahih ve fâsid kıyasa, celî kıyastan ve onun dışındaki kıyas çeşitlerinden ne kastedildiğine yer verilmiştir. Kıyasın delil oluşu ve kıyas karşıtlığı delilleriyle belirtilmiştir. Buna bağlı olarak usulcülerin de görüşleri zikrederek 'kıyas müstakil bir delil midir?' yoksa 'kıyas müçtehidin faaliyeti olarak mı telakki edilir?' sorularına yer verilmiştir. Kıyas ile fer'i deliller arasında teâruz işlenmiş. Aynı şekilde kıyasın, amelü ehli'l-Medîne'nin, mesâlih'i mürsele'nin, örf'ün, seddü'z-zerîa'nın ve şer'ü men kablena'nın tearuzu işlenmiştir. Bu noktadan hareketle teâruzun sadece bir delil ile olmayacağı aksine bütün delillerle gerçekleşeceğine ver verilmiştir. Son olarak tezde, sahâbenin kavli, dilsel ve istılâhi açıdan ele alınmıştır. Usülcülerde ve muhaddislerdeki sahâbe kavli tarifine ve sahâbenin kavli ile ulemânın kavli arasındaki ihtilaf açıklanarak iki târîf arasındaki farka da değinilmiştir. 'Kavlü's-sahâbi', 'ra'yü's-sahâbi' mevkuf hadîs', 'merfû hadîs' gibi bazı terimlerin de sahâbenin kavli ile ilişkili olabileği görülmüştür. Bu terimlere de tezde yer verilmiştir.Farklı bölümlerde fukahânın, sahâbî kavliyle kıyasta teâruz meselesine yer verilmiştir."
