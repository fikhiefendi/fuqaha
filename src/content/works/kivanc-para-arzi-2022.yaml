abstract: "Türkiye ekonomik anlamda çok zor bir dönem olan 1990'lı yıllardan sonra 2001 yılında kendi tarihinin en etkili ekonomik krizlerinden birini daha yaşamıştır. Bu kriz sonrasında ise siyasal anlamda yeni bir konjonktüre girmiş ve koalisyon dönemlerinden uzak tek parti iktidarını uzun yıllar tecrübe edeceği yeni bir devre başlamıştır. Finans piyasaları da, bu tezde inceleneceği üzere, oldukça önemli gelişmelerin yaşayacağı döneme girmiştir. 2005 senesinde Avrupa Birliği uyum yasaları çerçevesinde katılım bankalarının Bankacılık Kanunu kapsamına alınmasıyla mevduat güvencesine geçmiştir. Bu kararla katılım bankaları da Türkiye Cumhuriyet Merkez Bankası tarafından raporlanan para arzı verilerine katılmış, raporlamaların içerisinde yer almıştır. Bu sebeple katılım bankacılığı sektörü için yeni bir dönem başlamıştır. Bu çalışmada katılım bankalarının para arzına olan etkileri ve bu etkilerin 2015-2021 yılları arasındaki rakamsal değişimi analiz edilmiştir. Bu analizde para arzı tanımlarından olan M1-M2 ve M3 verileri kullanılarak, katılım bankalarının rakamları değerlendirilmiştir. Ortaya çıkan tablo; katılım bankacılığının tarihsel süreçte önünde çok önemli bir yolunun olduğu göstermektedir. Yapılacak ciddi atılımlar ile katılım bankacılığının para arzı üzerindeki etkisinin bugün geldiği noktadan çok daha yüksek yerlere çıkaracağı öngörülmektedir."
