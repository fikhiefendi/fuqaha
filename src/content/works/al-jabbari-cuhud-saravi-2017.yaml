abstract: "Bu Çalışma; Şaravi'nin tefsirinde, Bakara, Al-i İmran ve Nisa surelerinde bulunan dilsel farklılıkları beyan ediyor. Araştırmanın içeriği,muhtevası; dilsel farklılığın mefhumu, ortaya çıkışı,neşet etmesi, bu meselede ulemanin nerde durduğu ve ulemanin; dilsel farklılıkların varlığını destekleyen ve kabul etmeyen diye taksim edilmesi meseleleridir. Yine bu çalışma; dilsel farklılıkları sırasıyla, belli bir düzen ve program içerisinde ele alıp açıklamaktadır. Dilsel farklılıkların tefsirlere tesirini ve lugavi farkların sözlük/mu'cem yönünden ele alıp açıklamıştır. Ve bu çalışma , bu okuma; dilsel/lugavi farklar ve bu farkların Kuran ayetlerinin tefsirindeki ehemmiyeti hususunda Şa'ravînin konumunu izah etmektedir. Okumada/Çalışmada vasfedici ve açıklayıcı, çözümleyici bir yol izlenmiştir."
