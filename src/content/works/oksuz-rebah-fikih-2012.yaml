abstract: "Atâ b. Ebî Rebâh, yaşadığı dönem itibariyle toplum nezdinde önemli bir yer edinmiş tabiûn âlimlerindendir. Devletin, yaşadığı dönemde resmi olarak hac konusunda görevlendirdiği bir âlimdir. Hz. Peygamber'in mirasını sahiplenen sahabe ile kendisinden sonraki nesil arasında önemli bir görev üstlenmiştir: geçmişten aldığı bilgi birikimini geleceğe aktarmak.Atâ b. Ebî Rebâh, Mekke'de sahabenin önemlilerinden olan İbn Abbas'ın etrafında oluşan ilim meclislerinin altı önemli takipçisi öğrencilerinden biridir. Hocasının vefatı sonrasında onun ilim halkasının başına geçmiş, onun sözü ile fetva vermiş onun yolundan gitmiştir. Mekke'de İbn Abbas tarafından oluşturulan ilmi gelenek, silsilesinde hocasından sonra yer alan Atâ ve onun talebeleri ile devam etmiştir.Dersleri esnasında ve kendisine gelen soruları cevaplarken hadislerden, sahabe sözü ve uygulamalarından, yaşadığı dönemin uygulamalarından yararlanmıştır. Bunların yanında kendi görüşlerini de ortaya koyabilmiştir."
