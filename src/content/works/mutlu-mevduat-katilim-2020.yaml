abstract: "Banka, para, kredi ve sermaye alanlarına dahil olan her çeşit işlemleri yapan ve düzenleyen, özel veya kamusal kişilerle işletmelerin bu alandaki her türlü ihtiyaçlarını karşılama faaliyetlerinde bulunan bir ekonomik birimdir. Çok sayıda ve farklı sektörlerde bulunan müşterilere hizmet veren bankalar, yapılanmaları, işleyiş biçimleri ve faaliyet alanlarıyla birbirlerinden farklı isimlerle anılmaktadırlar. Katılım bankacılığı, mali sektörde faizsizlik düşüncesi ile çalışan, bu şartlara uygun olarak her türlü bankacılık işlemlerini gerçekleştiren kurum ve kuruluşlardır. Klasik bankacılık ise faiz oranı önceden belirlenmiş durumlarda fon fazlasını toplayarak, bankanın kendi belirlediği faiz oranı değerinden kimin fon ihtiyacı varsa kredi şeklinde kullandıran kuruluşlardır. Mevduat ve katılım bankacılığının karşılaştırılması: banka çalışanları üzerine bir araştırma başlıklı bu çalışma dört bölümden oluşmaktadır. Birinci bölümde bankacılığa genel bir bakış, ikinci bölümde mevduat ve katılım bankacılığı, üçüncü bölümde mevduat bankaları ve katılım bankalarının personel sayıları, aktif büyüklükleri, toplanan fonlar, kullandırılan fonlar, dönem kar-zararları açısından karşılaştırması, dördüncü bölümde ise derinlemesine görüşme yöntemi ile mevduat ile katılım bankaları çalışanlarının bakış açılarına yer verilecektir."
