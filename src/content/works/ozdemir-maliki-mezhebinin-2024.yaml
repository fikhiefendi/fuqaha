abstract: "Mâliki mezhebinin İslam Ceza Hukuku alanında cumhurdan ayrıldığı görüşlerini konu alan bu çalışma giriş, sonuç ve üç bölümden oluşmaktadır. Giriş kısmında tezin amacı, yöntem, kaynakları ve tez konusuyla ilgili kavramlar ele alınmıştır. İlk bölümde“İslam Ceza Hukuku Tanımı ve Tasnifi”başlığına ikinci bölümde“Had Cezası”başlığına, üçüncü bölümde“Kısas ve Diyet Cezası”başlığına, dördüncü bölümde ise“Ta'zir Cezası”başlığına yer verilmiştir. Çalışmanın giriş kısmında tezin konusuna, amacına ve istifade edilen kaynaklara değinilmiştir. İslam Ceza Hukukunun tanımını ve yaptırımlarını ortaya koymayı hedefleyen birinci bölümde İslam Ceza Hukukunun genel bir tanımı yapıldıktan sonra işlenen suçlara karşı İslam Ceza Hukukunda belirlenen yaptırımların tasnifi genel hatlarıyla ele alınmıştır. Çalışmanın ana gövdesini oluşturan,“Had Cezası”,“Kısas ve Diyet Cezası”ve“Ta'zir Cezası”başlıklı bölümlerde ise Mâliki mezhebinin, had, kısas ve diyet ve ta'zir suçlarında cumhur ile görüş ayrılığında bulunduğu suçların tespiti ve cezai yaptırımları ele alınmaya çalışılmıştır. Araştırmanın sonuç kısmında ise ulaşılan tespitlere değinilmiştir. Anahtar Sözcükler Had, Kısas ve Diyet, Ta'zir, Mâliki Mezhebi, Görüş Ayrılıkları"
