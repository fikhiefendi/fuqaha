abstract: "Bu tez, akid taraflarının rızasıyla ilgili akdin bağlayıcılığını doğrudan etkileyen önemli bir konu olduğu için, İslam hukukunda akid muhayyerliklerine ışık tutmayı amaçlamaktadır. Bu çalışma, Hanefi mezhebiyle sınırlıdır. Zira Hanefi mezhebi, akid ve hukuki konularda İslam dünyasında en çok uygulanmış ve yayılmıştır. Bu çalışma, akid muhayyerliklerini, şâri'tan mı yoksa âkid taraflarından mı türetildiklerine göre kaynakları açısından ayırmaktadır. Ayrıca, âkidin şart koşması veya bilgisizliği ve yahut bir kusur olup olmadığına bakılmaksızın, muhayyerliklerin sübût nedenlerini de dikkate almaktadır. Buna ilaveten akdî muhayyerliklerin her biri için ayrıntılı bir inceleme sunarak muhayyerliğin sözlük ve terim anlamlarını açıklamakla birlikte delillerini ve koşullarını da zikretmektedir. Bunun dışında muhayyerliğin akdî alanlarından ve muhayyerliğin sahibinden de bahsetmektedir. Muhayyerliğin etkilerinden bahsederek akdin sıfatlarını, eşyanın mülkiyetini ve eşyaların muhayyerlik sürecinde artmasını ve telef olursa malî yükümlülüklerini Hanefi mezhep imamlarının görüşlerini beyan ederek incelemekle beraber, konuyla ilgili fikir ayrılıklarını delilleriyle ayrıntılı bir şekilde ele almaktadır. Ayrıca akid feshedildiğinde ve muhayyerliğin ortadan kaldırıldığında muhayyerliği kullanma niteliğini ve muhayyerlik vadesini açıklamaktadır. Araştırmacı bu çalışmada muhayyerlik türlerini kategorize etmek ve düzenlemek için tanımlayıcı ve tümevarımcı bir metodoloji kullanmıştır. Hanefi mezhebi imamlarının görüşlerini Hanefi mezhebinin mu'temed kitaplarından nakletmiş ve o görüşlerin gerekçelerini inceleyip tercih ederek sırasıyla zikretmiştir."
