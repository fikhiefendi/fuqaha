abstract: "Bu araştırma, Türkiye'deki kamu politikasının etki yatırımcılarının davranışları üzerindeki etkilerini incelemek amacıyla gerçekleştirilmiştir. Araştırma, nitel araştırma yöntemlerinden biri olan yarı yapılandırılmış mülakat tekniği kullanılarak yürütülmüş ve elde edilen veriler tematik analiz yöntemi ile analiz edilmiştir. Çalışmanın örneklemi, Türkiye'de etki yatırımı alanında deneyim sahibi, farklı sektörlerde görev yapan yönetici pozisyonundaki bireysel ve kurumsal yatırımcılardan oluşmaktadır. Araştırma bulguları, etki yatırımlarının tercih edilme sebeplerinin ve kamu politikalarının bu tercihler üzerindeki rollerinin çeşitli temalar altında toplandığını göstermektedir. Katılımcılar, küresel eğilimler, yeni iş fırsatları, çevresel ve sosyal sorumluluklar, finansal destekler ve regülasyonlar gibi faktörlerin etki yatırımını tercih etmelerinde önemli olduğunu belirtmişlerdir. Özellikle Paris Anlaşması gibi çevresel faktörler ve ESG uyumu, etki yatırımları için belirleyici unsurlar olarak öne çıkmıştır. Ayrıca, İslami finans enstrümanları, etki yatırımcıları için çeşitli yatırım fırsatları sunarak, sosyal ve çevresel kalkınma hedeflerine ulaşmalarında önemli rol oynamaktadır. Bu sebeple İslami finans enstrümanlarının etkinliğinin artırılması ve yatırımcıların bilinçlendirilmesi gibi alanlarda öneriler sunulmuştur. Araştırma sonuçları, kamu politikalarının etki yatırımlarını teşvik etmesi için stratejik ve uzun vadeli planlamaların yapılması gerektiğini, finansal teşvikler ve destek programlarının önemini, regülasyonların öngörülebilirliğinin yatırımcı güveni açısından kritik olduğunu ortaya koymaktadır. Son olarak, etki yatırımlarının geleneksel yatırımlara göre daha rasyonel olduğu ve uzun vadede karlılık potansiyelinin daha yüksek olduğu tartışılmaktadır."
