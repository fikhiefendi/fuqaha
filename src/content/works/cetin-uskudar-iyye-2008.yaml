abstract: "Osmanlı tarihi araştırmalarında sosyal tarih açısından şer`iyye sicilleri şüphesiz büyük önem arzetmektedir. Bu çalışmada hüccetlerden müteşekkil Üsküdar 762 no.lu şer`iyye sicili esas alınarak, 1317-1318/1899-1900 yılları arasında Üsküdar'da sosyal hayat incelenmeye çalışıldı.Öncelikle sicil titizlikle okundu. Şer`iyye mahkemelerinde İslâm hukukunun câri olması ve hüccetlerin şer`iyye mahkemelerinde kaydedilmiş olması, değerlendirme aşamasında İslâm hukuku esaslarının temel alınmasına sebep teşkil etmiştir. Böylelikle defterde geçen kavramlar; ilgili başlıklar altında önce İslâm hukukuna göre açıklanmış, daha sonra deftere atıfta bulunularak sosyal açıdan değerlendirilmeye çalışılmıştır. Bu aşamada mümkün mertebe ilgili kaynak ve araştırmalardan istifâde edilmiştir.Tez giriş, iki bölüm, sonuç, kaynaklar ve araştırmalar ile eklerden müteşekkildir. Birinci bölümde sicildeki verilere ve sicilin kaydedildiği tarihe göre Üsküdar'da sosyal hayat, ikinci bölümde ise sicilin yeni harflerle metni bulunmaktadır. Sonuçta ise Üsküdar'ın çeşitli kesimden insanları ile oldukça renkli olduğu fikri ortaya çıkmıştır."
