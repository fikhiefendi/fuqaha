abstract: "İslam hukuku ilke olarak vahye dayalı bir hukuk sistemi olduğundan, aile hukukunun da temelini Kur'an ve Sünnet oluşturur. Yeni gelişen hadiseler de bu iki temel kaynak çerçevesinde çözümlenmeye çalışılır. Günümüzde Müslüman toplumların sosyal statülerinde ve yaşam tarzlarında meydana gelen değişim ile Batılı düşünce sistemleri, toplumları ve onların örgütlerinin etkisiyle oluşan yansımalar, Müslüman aile yapısı ile özellikle kadınların durumlarında değişiklikler meydana getirmiştir. Özellikle kadınların çalışma hayatına eskiden daha fazla yer alması, kadınların nafakaları ve mali yükümlülükleri konusunda önemli tartışmaların gündeme gelmesine ve bunun aile bütçesi üzerindeki etkisinin tartışılmasına sebep olmuştur. Muasır İslam hukukçuları, beşeri hukuk uzmanları ve özel olarak da Cezayirli hukukçular arasında bu konu halen ihtilaflı bir konu olmaya devam etmektedir. Bu tür bir problemin fıkhî ve hukukî açıdan araştırılmasına katkıda bulunmak için nafakanın anlamı, kadının eşiyle birlikte aile bütçesine yaptığı katkı, kadının mali yükümlülüğü gibi konularda ortaya çıkan sorunlara çözüm bulmak amacıyla böyle bir çalışma yapılmıştır. Araştırmada Cezayir Aile Kanunu ile ilgili genel bilgiler verilmiş, ardından nafakanın mahiyeti hakkında genel bir kavramsal tanım yapılmıştır. Daha sonra nafakanın çeşitleri, yükümlülüğün delilleri, kapsamı ve nafaka hakkını düşüren halleri ele alınmıştır. Özellikle çalışan kadının evlilik nafakası konusu incelenmiş, kadının çalışmasının meşruiyeti, şer'i kuralları ve kadının mali bağımsızlığı incelenmiştir. Ayrıca, evlilik nafakası ile ilgili özel durumlar, nikâh akdinde ca'li/ilave şartlar, ret, izin ve sükût durumunda nafakanın durumu ele alınmıştır. Bununla birlikte eşler arasında ortak mallar meselesi ve bütçeye katkıdan kaynaklanan hakkı, çalışan eşin aile bütçesinin desteklemesine katılmasının mali sonuçlarına temas edilmiştir."
