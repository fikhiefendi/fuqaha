abstract: "Kat mülkiyeti, günümüzde önem arz eden bir kurumdur. Bu kurum, tarihte birçok hukuk sisteminde ihtiyaç duyulan bir uygulama olmuş ve bu sebeple kendisine yer bulmuş bir kurumdur. Günümüzde ise ekonomik zorluklar, şehirlere göçler, konut sıkıntıları gibi sebeplerle bu kurumun önem derecesi artmıştır. Ülkemizde de kabul edilen kat mülkiyeti kurumunun sağlıklı bir şekilde uygulanabilmesi açısından kat maliklerine bazı haklar verilmiş, bunun yanında ise bazı yükümlülükler yüklenmiştir. Kat maliklerinin sahip olduğu hakların bir kısmı tek başlarına maliki oldukları yer ile ilgiliyken diğer bir kısmı da ortak yerlere ve yönetime ilişkin haklardır. Kat maliklerinin sahip oldukları hakların yanında bir de uymakla yükümlü oldukları bazı kurallar da mevcuttur. Bu kurallar birlikte yaşamanın bir gerekliliğidir ve bunlara uymamanın ciddi sonuçları olabilmektedir. Tezimizde kat maliklerinin sahip olduğu hakların ve uymakla yükümlü oldukları kuralların neler olduğundan bahsettikten sonra yükümlülüklere uymayan kat maliklerinin karşılaşabilecekleri yaptırımlar incelenmiştir."
