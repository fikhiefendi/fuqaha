abstract: "Para vakıfları Osmanlı İmparatorluğu'nda özellikle de Balkanlarda yaygın bir şekilde uygulanmıştır. Bu çalışmada Batı Trakya'daki para vakıfları finansal kurumlar olarak incelenecektir. Para vakıflarının ekonomik ve sosyal katkıları soruşturulacaktır. İslami finans yöntemleri ayrıca tanımlanacak ve günümüzdeki uygulamalarından bahsedilecektir."
