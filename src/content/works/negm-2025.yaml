abstract: "Bu çalışma, hadis âlimleri tarafından kullanılan“Asl”(köken, temel) terimini, ortaya çıkışı, dilsel ve ıstılahî anlamları ve hadis rivayetlerini değerlendirmedeki eleştirel kullanımları açısından ele almaktadır. Çalışma, bu terimin hadis ilimlerindeki önemini ortaya koymayı, eleştirmenlerin sözleri ışığında çeşitli çağrışımlarını açıklamayı ve terimin alt konularından biri olan“Sünen Ebû Dâvûd”kitabındaki“Bu konuda asıl olan (hadis)”terimine dair kapsamlı bir uygulamalı inceleme yapmayı hedeflemektedir. Çalışma iki ana bölüme ayrılmıştır: Birinci Bölüm: Teorik incelemeye ayrılmış olup,“Asl”teriminin tarihsel gelişimini, onu kullanan en meşhur âlimleri, ayrıca dilsel ve ıstılahî anlamlarını ve çeşitli çağrışımlarını (mutlak veya kayıtlı, ispat veya nefyederek) ele almaktadır. Ayrıca âlimlerin“aslı yok”dedikleri hadisin tanımı ve hükmü de bu bölümde açıklanmıştır. İkinci Bölüm: Uygulamalı bir incelemeye ayrılmış olup,“Sünen Ebû Dâvûd”da“Bâbda Asl”olarak nitelendirilen hadisler incelenmiş ve analiz edilmiştir. Bu hadisler fıkhî konularına göre tasnif edilmiş, her bir yerdeki terimin anlamı analiz edilmiş, fıkhî hüküm ve görüşler arasındaki tercihler açıklanmıştır. Araştırmacı, bu çalışmada tümevarımsal-analitik ve tasvirî-eleştirel yöntemi benimsemiştir. Metinleri toplamış, eleştirmenlerin sözleri ışığında analiz etmiş,“Asl”teriminin hadisler hakkındaki hükümlerini yönlendirmedeki etkisini çıkarım yaparak fıkhî hükümler çıkarmıştır. Bu çalışmanın önemi, araştırmacının bilgisine göre, hem teorik temellendirmeyi hem de uygulamayı birleştiren özel bir bilimsel çalışmada ele alınmamış hassas bir terimi ele almasıdır. Bu durum, bu tezi âlimler arasında yaygın olan hadis terimleri çalışmalarında niteliksel bir katkı haline getirmektedir."
