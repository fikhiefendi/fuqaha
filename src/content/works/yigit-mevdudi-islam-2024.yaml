abstract: "Ebu'l A'lâ Mevdûdî, İslâm düşünürleri denilince akla ilk gelen isimdendir. Yaşadığı çağda Müslümanların birçok sorusuna cevap, sorununa çözüm aramaya çalışmıştır. Birçok farklı konuda eser yazan Mevdûdî'nin, Müslümanların günümüzdeki en ehemmiyetli konularının ve sorunlarının başına yer alan İslâm ekonomisi alanında herhangi bir söz söylememiş olması düşünülemezdi. Mevdûdî, birçok alanda olduğu gibi İslâm ekonomisi alanında da birçok çalışmaya imza atmış bir düşünürdür. Mevdûdî gerek yazılı olarak; gerek telif ettiği kitap ve makaleleriyle, gerek konferans ve radyo programlarındaki demeçleriyle, İslâm ekonomisi alanında önde gelen isimlerden biri olmuştur. İş bu araştırmada, Ebu'l A'lâ Mevdûdî'nin günümüz ekonomik sistemini şekillendiren ideolojiler ve bu ideolojilerin ortaya çıkardığı küresel sorunlara dair değerlendirmeleri, İslâm ekonomisi alanındaki düşünceleri, bakış açısı, ne anladığı ve ne anlattığı, kullandığı kavramlar ve çözüme yönelik tespitleri tetkik edilmeye çalışılmıştır."
