abstract: "Bu çalışma, İslâm hukuk eğitiminin tarihsel gelişimini ve Ohin Medresesi özelinde fıkıh öğretim metodolojisini incelemektedir. Tez, fıkıh ilminin Hz. Peygamber döneminden Osmanlı sonrasına kadar geçirdiği evreleri sistematik bir şekilde ele alarak, medrese geleneğinin teorik ve pratik boyutlarını analiz etmektedir. Özelde ise Bitlis'in Mutki ilçesine bağlı Ohin Medresesi'nin kuruluşu, müfredatı, öğretim yöntemleri ve yetiştirdiği önemli şahsiyetler üzerinden bir saha araştırması sunmaktadır. Ohin Medresesi, 19. yüzyılın sonlarında Şeyh Fethullah Verkânisî (ö. 1317-1899) tarafından kurulmuş ve Nakşibendî geleneği ile Şâfiî fıkhını harmanlayan bir eğitim modeli benimsemiştir. Medresede temel İslâmi ilimlerin yanı sıra dil, mantık ve felsefe dersleri okutulmuş; fıkıh öğretimi, Gâyetü'l-ihtisâr, Minhâcü't-tâlibîn ve Fethü'l-muîn gibi klasik metinler üzerinden yürütülmüştür. Öğretimde birebir ders, ezber, müzakere ve yazma yöntemleri kullanılmış, icazet merasimleriyle öğrencilerin yetkinliği resmileştirilmiştir. Araştırma, medresenin toplumsal işlevine de değinmekte; halkın dinî ve hukuki sorunlarına çözüm üreten bir merkez olarak rolünü vurgulamaktadır. Tanzimat sonrası medreselerin gerilemesine rağmen Ohin'in gayrı resmî olarak varlığını sürdürmesi, geleneksel eğitim modellerinin dayanıklılığına işaret etmektedir. Sonuç olarak bu çalışma, İslâm hukuk eğitiminin tarihsel sürekliliğini ve Ohin Medresesi'nin bu süreçteki özgün katkısını akademik bir perspektifle ortaya koymaktadır."
