abstract: "İslam Hukuku hayatın bütün yönlerine ilişkin düzenlemelerde bulunan, ibâdât, muamelat ve ukubat olmak üzere üç kısma ayrılan kapsamlı bir hukuk sistemidir. Aile Hukuku ise bir yönüyle ibadat bir yönüyle muamelat kısmına dahil olmaktadır. İslam Aile Hukuku'nda evlilik öncesinden başlanılarak evlilik süresince ve evliliğin sona ermesine ilişkin bütün meseleler incelenmiş ve hükme bağlanmıştır. Ancak ülkemizde ikinci kez 22 Kasım 2001'de kabul edilen 4721 sayılı Türk Medeni Kanunu'na bağlı Aile Hukuku yasaları uygulanmaktadır. Bu iki hukuk sisteminde birtakım noktalarda benzerlikler bulunmakla birlikte, bazı noktalarda da çok ciddi farklılıklar bulunmaktadır. Türkiye'de yaşamakta olan Müslümanlar evlilik gibi hayatın bu derece içinden olan bir konuda böyle farklılıklar olduğu için pratikte çeşitli zorluklarla karşılaşmaktadırlar. Bundan dolayı konuyla alakalı olan farklılıkların bilinmesi büyük bir önem arz etmektedir. Bu tezde iki hukuk sisteminde aile hukukunun nikâh akdine ilişkin meselelerinde vermiş olduğu hükümlerle, bunların birleşen ve ayrılan noktaları tespit edilmiş ve değerlendirilmiştir."
