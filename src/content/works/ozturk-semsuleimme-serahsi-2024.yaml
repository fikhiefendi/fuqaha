abstract: "Hicrî 483 yılında vefat eden Serahsî, Hanefî mezhebinin en önemli âlimlerinden biridir ve en meşhur eseri el-Mebsût'tur. Bu eserinde, sahâbe, tâbiûn ve mezhep imamlarının görüşlerine geniş yer veren Serahsî, bu imamlar arasında İmam Şâfiî'nin görüşlerine de atıflarda bulunmuştur. Çalışmamızda, Şemsüleimme Serahsî'nin el-Mebsût adlı eserinin ibadetler bölümünde, özellikle zekât, oruç ve hac ile ilgili konularda İmam Şâfiî'ye nispet edilen görüşleri tespit ettik ve bu görüşlerin değerlendirmesini yapmaya çalıştık. İki ana bölümden oluşan bu çalışmada, ilk bölümde Serahsî ve İmam Şâfiî'nin hayatlarına yer verilmiş, onların ilmî birikimi ve mezhep içindeki konumları ele alınmıştır. İkinci bölümde ise, el-Mebsût'ta tespit ettiğimiz İmam Şâfiî'nin görüşlerine yer verilen 113 mesele beş alt başlık altında incelenmiştir. Bu kısımda, Serahsî'nin İmam Şâfiî'ye atfettiği görüşlerin gerçekten Şâfiî'ye ait olup olmadığı, bu görüşlerin Şâfiî'nin kavl-i kadîm mi yoksa kavl-i cedîd dönemine mi ait olduğu gibi sorulara cevap aranmaktadır. Ayrıca, bazı meselelerde Serahsî'nin İmam Şâfiî'ye iki farklı görüş atfettiği durumlar da ele alınmış, bu görüşlerin Şâfiî kaynaklarındaki karşılığı değerlendirilmiştir. Sonuç olarak, Serahsî'nin Şâfiî'ye nispet ettiği 113 mesele incelenmiş, bu görüşlerin %90'ının İmam Şâfiî'ye ait olduğu tespit edilmiştir. Kalan %10'luk kısmın ise doğrudan Şâfiî'ye aidiyeti doğrulanamamakla birlikte, Şâfiî mezhebi literatüründe bir karşılığı olduğu görülmüştür. Dolayısıyla Serahsî'nin İmam Şâfiî'ye nispet ettiği görüşlerde genel olarak bir tutarlılık sergilediği sonucuna ulaşılmıştır."
