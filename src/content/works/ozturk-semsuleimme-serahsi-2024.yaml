title: "Şemsüleimme Serahsî'nin “El-Mebsût”adlı Eserinde İmam Şâfiî'ye Atfedilen Görüşlerin Tespit ve İncelenmesi (İbadetler Bağlamında Zekât, Oruç ve Hac Özelinde)"
