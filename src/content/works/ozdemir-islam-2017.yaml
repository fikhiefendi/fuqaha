abstract: "Yirminci yüzyılın en kompleks tıp teknolojisi ürünlerinden transplantasyon tıbbının yaygınlaşmasıyla birlikte organ naklinin doğurduğu problemler etik ve dini boyutlarıyla Batı ve İslami biyoetik camiasının gündemini meşgul etmeye başlamıştır. İlgili literatüre İslami perspektiften katkı sunmayı hedefleyen bu araştırma, insan bedeni üzerinde tasarrufa ve organ bağışına dair klasik ve modern İslami bakış açılarını aktarmayı ve organ naklinin güncel problemlerini tartışmayı hedeflemektedir. Bu bağlamda ilgili çalışmada, şahsiyet ve mülkiyet haklarının yanı sıra İslam hukukuna has bir tasnif olan Allah hakkı-kul hakkı temelinde insan bedeni ve beden parçalarının hukuki statüsü, beden üzerinde tasarruf hakkının sınırları ve temel prensipler incelenmektedir. Bir sonraki adım olarak, esasında bedenin saygınlığı ve dokunulmazlığı gibi bazı ilkeleri ihlal anlamına gelen organ bağışı ve naklinin zaruret ve ihtiyaç gibi meşruiyet temelleri maslahat ilkesi bağlamında ele alınmaktadır. Yine organ nakline ilişkin pratik meseleler etik, hukuki ve dini boyutlarıyla tartışılmakta, özellikle de pek çok ihtilafa medar olan beyin ölümü ve anensefali durumunda nakil, hayat kurtarıcı olmayan yüz, alt-üst ekstremiteler, üreme organları gibi organ ve dokuların nakli konuları, nakilde yarar-zarar dengesi temelinde sorunsal olarak müzakere edilmektedir."
