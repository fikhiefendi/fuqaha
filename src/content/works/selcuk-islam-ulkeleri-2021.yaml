abstract: "Parasal birlik, döviz kurlarında birliğin sağlanmasını, sermaye hareketlerinde tüm kısıtlamaların kaldırılmasını, üye ülkeler arasında konvertibilitenin gerçekleştirilmesini ifade etmektedir. Konvertibilitenin korunacağı konusunda tam bir güvencenin sağlanmasıyla ve parasal birliğe üye ülkelerin milli paralarını birbirine çevrilmesinde her türlü banka giderlerinin ortadan kaldırılmasıyla gerçekleştirilir. Parasal birlik kavramı uzun zamandan beri tartışılsa da Avrupa Para Birliği'nin kurulması bu kavrama olan ilginin artmasına neden olmuştur. Avrupa ülkelerinin yaşadığı tecrübe ve üye ülkelerin bu konudaki bilgi birikiminin İslam ülkelerine aktarılması çalışmamızın ana konusunu oluşturmaktadır. Çalışmamızda D-8 ülkelerinin optimum para sahası olup olmadığını yani bir parasal birlik potansiyeli taşıyıp taşımadığını test etmek adına döviz kuru, enflasyon, faiz ve dış ticaret değişkenlerinin 2000 ile 2020 yılları arasındaki çeyreklik verileri kullanılarak analiz edilmiştir. D-8 ülkelerinin yaşadığı şokların birbirine benzeyip benzemediği Vektör hata düzeltme modeli (VECM), etki-tepki fonksiyonu ve varyans ayrıştırma analizi vasıtasıyla incelenmiştir. Elde edilen sonuçlara göre Malezya ve Nijerya'da Enflasyon, Faiz ve Ticaret'in Dolar'ın Granger nedeni olduğu tespit edilmiştir. Türkiye'de Dolar ve Faiz'den Enflasyon'a doğru bir uzun dönem nedensellik ilişkisi olduğu görülmüştür. Etki-tepki fonksiyonu ve varyans ayrıştırma sonuçlarını beraber incelediğimizde; D-8 ülkelerinin tamamı optimum para sahası açısından uygun olmadığı fakat D-8 içerisinde bir alt grup olarak düşünülebilecek Türkiye, Nijerya, Mısır ve Malezya'nın diğer D-8 ülkelerine oranla, ilgili değişkenlerinde meydana gelen şokların benzer olduğu tespit edilmiştir. Bu ülkeler her ne kadar coğrafi olarak birbirine yakın olmasa da tesis edilecek parasal birlikte şokların simetrik olma kriteri açısından optimum para sahasının gerekliliklerini yerine getirebilecektir."
