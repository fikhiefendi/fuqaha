abstract: "Fıkıh kitaplarımızda Ehl-i kitabile ilgili konular onların Müslümanlarla aynı toplumda yaşamalarından dolayı teferruatıyla incelenmiştir. Başta İmâm Şâfiî olmak üzere Şafiî mezhebi hukukçuları tarafından En'am suresi 156. ayetten hareketle sadece Yahudi ve Hıristiyanların Ehl-i kitab olduğu kabul edilmiştir. Bu doğrultuda Ehl-i kitab olarak kabul edilen Yahudi ve Hıristiyanların yanı sıra cizye verme hususunda onların hükmünde olan Mecûsi, Sabiî ve Suhuf sahipleri de Şâfiî mezhebi fıkıh kitaplarında ele alınmıştır. Ehl-i kitab ve onların hükmünde sayılanların kamu hukuku alanında hak ve sorumluluklarının neler olduğu, özel hukuk alanında hangi haklara sahip oldukları bu çalışmamızda araştırılmıştır. Şüphesiz İslâm dininin farklı coğrafyalara yayılmasıyla Müslümanların Ehl-i kitabla olan ilişkileri giderek önem kazanmıştır. İslâm uleması Müslümanların Ehl-i kitabla olan ilişkilerini dikkate alarak, onlarla olan münasebetleri belli başlı bazı hükümlere bağlamışlardır. Kur'ân-ı Kerîm'de ve Hz. Peygamber'in (s.a.v.) sünnetinde hakkında açık nas bulunmayan konularda ilim adamlarınca farklı yorumlara gidilmiştir. Bu farklı yorumlara binaen Şâfiî mezhebi fıkıh kitaplarında, Ehl-i kitabla ilgili özel ve kamu hukuku alanları ve devletlerarası hukuktaki hak ve sorumluluklarının tespiti için çaba sarf edildiği görülmektedir"
