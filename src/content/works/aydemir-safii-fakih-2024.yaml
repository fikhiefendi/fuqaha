abstract: "Selçuklu Devleti dönemi âlimlerinden, Begavî olarak tanınan Ebû Muhammed Hüseyin b. Mesûd b. Muhammed b. Ferrâ el-Begavî; tefsir, hadis, fıkıh ve kırâat gibi farklı alanlarda eserler telif edip tefsir, hadis ve kırâat alanındaki ilmî yetkinliği ile tanınmaktadır. Ancak fıkıh alanındaki konumu ileri düzeyde olmasına rağmen diğer alanlardaki kadar, özellikle akademik çevrede, yeterince bilinmemektedir. Begavî, İslâm hukukunun iki temel kaynağı olan Kitap ve sünnet hakkında eserler telif ettikten sonra fıkıh alanında et-Tehzîb fî fıkhi'l-İmâmi'ş-Şâfiî isimli eserini kaleme almıştır. Fıkhî görüşleri Şâfiî doktrini çerçevesinde şekillenen Begavî, zaman zaman Şâfiî mezhebine muhalefet etmiştir. Bu çalışmada akademik alanda yeteri kadar bilinmeyen Begavî'nin fıkıhçılığının ortaya konulması amaçlanmıştır. Çalışma, giriş ve üç bölümden oluşmaktadır. Giriş bölümünde çalışmanın amacı, önemi, yöntemi ve kaynakları hakkında teknik bilgiler verilmiştir. Birinci bölümde Begavî'nin hayatı, ilmî kişiliği ve ilmî kişiliğinin tarihi arka planı ele alınmıştır. İkinci bölümde Begavî'nin usûlî görüşleri incelenmiştir. Üçüncü bölümde ise Begavî'nin fıkhî görüşleri, Şâfiî mezhebindeki yeri ve ona yapılan eleştiriler tespit edilerek değerlendirilmiştir."
