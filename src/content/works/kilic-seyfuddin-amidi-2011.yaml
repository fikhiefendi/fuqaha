abstract: "Bu çalışma, hüküm çıkarma kaynaklarını, yöntemleri ve felsefesini inceleyen ?Fıkıh Usûlü? ilminin zirve bilginlerinden birisi olan Seyfüddîn Âmidî'nin el-İhkâm fî Usûli'l-ahkâm adlı eserindeki usûl-ü fıkh ile ilgili görüşlerini konu edinmektedir.Âmidî, hukuk felsefesi ve hilaf ilmi alanlarında özgün fikirleri ile yaşadığı asra damgasını vurmuş çok yönlü, seçkin, hukukçu bir şahsiyet ve değerli bir bilim adamıdır. ?Fıkıh Usûlü? (İslâm Hukuk Metodolojisi), Âmidî'nin en fazla emek verdiği alanlardan biridir. O, kendisinden önceki birikime dayanarak tespit ve teklifleriyle bu ilmin gelişmesine ve İslâm düşüncesine katkıda bulunmuştur.Fıkıh usûlü alanında kaleme aldığı iki eseri ile Âmidî, pratik hukuk çözümlemele-rinden bağımsız olarak soyut ve aklî temellendirmeye dayalı hukuk yöntemine önemli katkılarda bulunmuştur.Âmidî'nin, bugün İslâm hukuk metodolojisi alanında araştırma yapan her hukukçunun mutlaka müracaat etmesi gereken bir değer olduğu görülmektedir."
