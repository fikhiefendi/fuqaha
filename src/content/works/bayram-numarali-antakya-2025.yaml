abstract: "Çalışmamız 1222-1223 / 1807-1809 yıllarını kapsayan 11 Numaralı Antakya Şer'îyye Sicilini incelemektedir. XIX. asırda Antakya'nın sosyal, iktisadî ve kültürel hayatının tespit edilmesi amaçlanmaktadır. Antakya'nın Halep'e bağlı bir kaza olduğu ve Antakya'ya bağlı beş nahiye olduğu (Altınözi, Kuseyr, Cebel-i Akra, Süveyde, Şuğur) bilinmektedir. Ayrıca çalışmamızı kapsayan yıllarda farklı dine mensup, Müslim ve gayr-i Müslim halkın birlikte bir arada yaşadığı, nüfusun çoğunluğunu Müslümanlardan meydana geldiği ve bu iki topluluk arasında çalışmamızdaki davalarda yer alabilecek herhangi bir sıkıntı yaşandığı görülmemiştir. Bu durumda görüldüğü üzere barış ve huzur içinde yaşamlarını idame ettikleri belirlenmiştir. Bu çalışma, 11 Numaralı Antakya Şer'îyye Sicili Osmanlı Türkçesinden günümüz Türkçesine çevrilmesinde aslına sadık kalınmıştır. Sicil, basit transkripsiyon tekniği ile çevrildi. Sicilde yer alan Arapça ve Farsça tamlamalar dillerinin gramer kurallarına uygun olacak şekilde yazıldı. Defterde, elif harfi: (') işareti, ayın harfi: (') işareti, uzun a: â harfi, uzun u: û harfi, uzun i: î harfi kıllanıldı. Defterde yer alan 157 hükümün silik, üzeri çizilmiş ve mükerrer belgeler dışında transkribsiyonu yapıldı. Çalışmamızda özet tablosu verilmiş, bu tabloda defter hakkında bilgilere ulaşabilmek mümkündür."
