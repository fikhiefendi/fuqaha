abstract: "İslâm dini evrensel yapısı itibariyle kolaylıkla yaşanılabilir bir özelliğe sahiptir. Bu sebeple de İslam dini hükümlerinde kolaylık ilkesini her zaman göz önünde bulundurmuştur. Müslümanlar İslâm'ı yaşarken coğrafi, ekonomik, kültürel vb. farklı sebeplerle çeşitli zorluklarla karşılaşmışlardır. Bu zorlukları ise İslam'ın temel ilkeleri doğrultusunda aşmaya çalışmışlar ve İslam'ın kolaylık ilkesinden faydalanma yollarını aramışlardır. Tüm insanlar için geçerli olan bu zorluklardan biri de zaruret hâlidir. İslam dini zaruret hâlinde müntesiplerinin nasıl hareket edeceğini belirleyen bazı temel ölçütler koymuştur. İslam hukukçuları bu temel ölçütler ve sınırlandırmalarla ilgili çeşitli açıklamalarda bulunmuşlardır. Fakat insanların farklı şartlara sahip olmaları zaruretin miktar ve sınırlarını belirleme gibi konularda çeşitli farklılıklara sebep olmuştur. İnsanların istek ve ihtiyaçlarının son derece değişip çeşitlendiği günümüzde ise bu farklılaşma daha çok hissedilmektedir. İşbu çalışmayı hazırlamaktaki amacımız zaruret hâlinde kalan bir kimseye tanınan kolaylığın miktarı, sınırı ve belirleyici otoritenin kimliğinin ortaya konulmasıdır. Çalışmamızın birinci bölümünde zaruretin tanımını, şartlarını, çeşitlerini, hükmünü ve konuyla yakın ilgisi olan ruhsat, ikrah, meşru müdafaa, umumu'l-belva, ihtiyaç, kolaylık ilkesi, meşakkat, küllî kaideler ve maslahat kavramlarıyla bu kavramların zaruretle olan ilişkilerini inceledik. İkinci bölümde tezin ana konusu olan“zaruretin miktarını ve sınırlarını”ayet, hadis ve İslâm hukukçuların tespit edebildiğimiz görüşleri çerçevesinde inceleyip bir sonuca ulaşmaya çalıştık. Üçüncü bölümde ise ibadetler, helal ve haramlar; aile, borçlar ve ceza hukuku alanlarında zarurete dayalı verilen bazı hükümleri inceledik. Sonuç olarak zaruret hâlinin gerçekleşebilmesi için bazı şartların bulunması ve zaruret miktarıyla sınırlı kalması gerekir. Ancak her ne kadar zaruret hâli için bazı şartlar belirlense de bu şartların derecesi ve kişiyi zaruretten kurtaracak miktar için en belirleyici etken zaruret hâline düşen kişinin kendisidir. Kişinin bizzat kendisinin vicdani bir muhasebe yapıp kendisini zaruretten kurtaracak miktarı tespit etmesi gerekir."
