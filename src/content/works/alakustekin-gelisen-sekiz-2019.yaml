abstract: "Gelişen Sekiz İslam Ülkesi (Developing Eight, D-8) kapsadığı coğrafi alan itibariyle bölgesel olmaktan çok küresel bir oluşum özelliğine sahip olan; kuruluşunda Türkiye'nin başrolünü üstlendiği bir“kalkınmada işbirliği”organizasyonudur. Bu organizasyonda bulunan ülkeler; İran, Pakistan, Bangladeş, Malezya, Endonezya, Mısır ve Nijerya'dan oluşmaktadır. Bu çalışmada Gelişen Sekiz İslam Ülkesi(D-8)'ne üye ülkelerin kendi aralarında yapacakları ticari işlemlerde başka bir ülkeye ihtiyaç duymadan bu işlemleri gerçekleştirip gerçekleştiremeyecekleri analiz edilmiştir. Bu amaç doğrultusunda D-8 ülkelerinin toplam ihracat rakamlarının toplam ithalat rakamlarına bölünerek elde edilen karşılama oranı ile birbirlerine yeterli olup olmadığı incelenmiştir. Bu incelemeler sonucunda: Ayakkabı ve Şapkalar, Ağaç Ürünleri, Hayvan Derileri, Hayvansal ve Bitkisel Yağlar ve Asitler, Mineral Ürünler, Sanat ve Antika, Tekstil, Çeşitli Mobilyalar ve Ev Eşyaları ürün başlıklarında karşılama oranının birden büyük veya eşit olduğu gözlemlenmiştir. Diğer yandan; Enstrümanlar, Gıda Maddeleri, Hayvansal Ürünler, Kâğıt Ürünler, Kimyasal Ürünler, Kıymetli Madenler, Madenler, Makineler, Plastik ve Kauçuk, Sebze Ürünler, Silahlar, Taş ve Cam, Taşıma gibi ürün başlıklarında karşılama oranının birden küçük olduğu ve dolayısıyla D-8 organizasyonuna üye ülkelerin bu ürün başlıklarında tek başına yeterli olmadığı gözlemlenmiştir"
