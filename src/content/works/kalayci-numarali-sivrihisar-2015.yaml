abstract: "Osmanlı Devleti'nde kadıların verdiği hükümlerle, devlet merkezinden gelen ferman, emir ve tebliğlerin tutulduğu defterlere şer'iye sicili denir. Bu çalışma Osmanlı Devleti'nin mahkeme kayıtlarını kapsayan şer'iye sicillerinden Sivrihisar'a ait bir numaralı defterin çeviri yazısı hazırlanıp değerlendirilmesi amacıyla yapılmıştır. Ayrıca çalışmada şer'iye sicilleri ışığında yöre halkının sosyal, kültürel ve ekonomik durumu anlatılmıştır. Araştırmada şer'iye sicilleri hakkında kısa bilgiler verilerek bu serinin Osmanlı Tarihi'ndeki önemi de vurgulanmıştır. Çalışmaya destek olması bakımından Sivrihisar'ın kısa tarihi araştırılmış ve kültürel değerleri hakkında bilgi verilmiştir. Bir numaralı Sivrihisar şer'iye sicili toplam 237 sayfa olup 81–162. sayfaları arasında 227 adet hüküm bulunmaktadır. Bu hükümler arasında tereke, vasi tayini, vekâletname, vakfiye, borç ve alacak davaları, hırsızlık, adaletname, buyruldu ve şahitlik gibi konular yer almaktadır."
