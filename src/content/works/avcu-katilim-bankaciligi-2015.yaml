abstract: "Faizli bankacılık sisteminin ortaya çıkışı eski Yunan ve Mısır'a, çağdaş faizli bankaların ortaya çıkışı ise 12 yy. İtalya'sına dayanmaktadır. Faizsiz bankacılık sistemi fikri 1940'larda tartışılmaya başlanmış ve faizsiz banka kuruluşu 1963 yılında Mısır'da gerçekleşmiştir. Aslen Tevrat'a ve İncil'e göre de yasaklanan faiz, Kuran'ı Kerim'de de yasaklanmıştır. Ayrıca Hz. Peygamberimizin (SAV) faizi yasaklayan hadisleri bulunmaktadır. Tüm bunlar konvansiyonel bankacılığa alternatif arayışının ve tasarruf sahiplerinin katılım bankalarını tercih etmelerinin sebebi olmuştur. Diğer taraftan ülke ekonomimizin istikrarlı olması ve ekonomik büyümemizin dünya ortalamasının üstünde gerçekleşmesi, sermaye piyasalarındaki bu gelişimi desteklemiştir. Çalışmada, katılım bankacılığının kapsadığı hacmin toplam içerisindeki yeri araştırılmış, akabinde sukuk ve çeşitlerinin yapısı, işleyişi anlatılmıştır. Sermaye Piyasası Kurulu Kira Sertifikası Tebliği'nde düzenlenen sukuk,“Yatırım Sertifikası”olarak adlandırılabilir. Ülkemizde sukuk türleri; icara sukuk benzeri“Sahipliğe dayalı kira sertifikaları”, hibrit sukuk benzeri“Yönetim sözleşmesine dayalı kira sertifikaları”, murabaha sukuk benzeri“Alım satıma dayalı kira sertifikaları”, mudaraba/muşaraka sukuk benzeri“Ortaklığa dayalı kira sertifikaları”, istisna sukuk benzeri“Eser sözleşmesine dayalı kira sertifikaları”şeklindedir. Alternatif yatırım araçlarının getirileri hali hazırda bilinmektedir. Çalışmada, sukuk çeşitlerine yatırım yapılması halinde kazancın hangi seviyede olacağına yönelik sonuçlar, kıyaslama ve değerlendirme açısından önemlidir. Ülkemizde kira sertifikalarıyla başlayan bu süreçte, sermaye piyasalarının giderek derinleşmesi gerekmektedir. Ekonomimiz konvansiyonel bankacılığa bağlı olmakla birlikte, orta-uzun vadede sermaye piyasasının derinleşmesi yatırım ve kalkınma bankacılığında yeni fırsatları beraberinde getirecektir."
