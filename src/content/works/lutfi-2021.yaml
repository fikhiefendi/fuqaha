abstract: "Bu tez, idari yolsuzluk konusunu tartışmış ve aynı zamanda, türlerini, kavramını ve İslam hukukunda onu ele almak için gerekli araçları öğrenerek varlığının kökenini netleştirmeyi ve etkisini ve özelliklerini belirlemeyi, İslam dininin bu konudaki ilgisinin kapsamını ve bunun için etkili çözümler geliştirmeyi amaçlamaktadır, bu nedenle bu çalışma bir giriş ile geldi Ve üç bölüm ve bir sonuç. Girişte, çalışma sorununa değinilmişti: yolsuzluğun yaşamın çeşitli alanlarına etkisi ve İslam hukukunun bu konudaki konumu. Birinci bölümde idari yolsuzluğun tanımı, nedenleri, tarihçesi, özellikleri ve etkileri tartışılmış, birinci bölümde hukuki açıdan yolsuzluğun tanımı ve araçları tartışılırken, ikinci bölümde idari yolsuzluk kavramı ve bu kavramın tanımlanmasında benimsenen standartlar ve onu diğer yolsuzluk türlerinden ayıran özellik ve işaretler ele alınmıştır. Üçüncü konu ise idari yolsuzluğun nedenleri ve etkilerine değindi. İkinci bölümde ise kamu görevlisi ve kamu görevlisi anlayışı, görev ve hakları, konuşmanın birinci bölümde kamu görevlisi ve kamu görevlisi kavramı ve şeriatta yer aldığı, ikinci bölümde ise kamu görevlisinin görevleri ve şeriattaki haklarından bahsetti. Üçüncü bölümdeki tartışma, yolsuzlukla mücadelenin yolları ve çözümlerine ilişkin ilk bölümde olduğu gibi, yolsuzlukla mücadelenin yolları ve çözümlerine odaklanırken, ikinci bölümdeki tartışma Irak'taki eğitim kurumlarında idari yolsuzlukla mücadele ile ilgili olmuştur. Anahtar Kelimeler (Keywords in Turkish): Yolsuzluk, idari yolsuzluk, idari işlev, çözümler"
