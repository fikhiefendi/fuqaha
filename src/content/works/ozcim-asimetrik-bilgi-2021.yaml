title: "Asimetrik Bilgi Sorunu Çerçevesinde Katılım Bankaları ve Mevduat Bankalarının Karşılaştırmalı Analizi"
titleTranslation: {"en": "Comparative analysis of islamic banks and deposit banks within the framework of the asymmetric information problem"}
