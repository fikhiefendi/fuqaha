abstract: "Çalışmada amaçlanan, finans piyasasındaki asimetrik bilgi sorununun, katılım bankaları ve mevduat bankalarında karşılaştırmalı olarak hem banka bilançosuna ait değişkenler (çalışmada bu değişkenlere mikro değişkenler denilmektedir) hem de makroekonomik değişkenler doğrultusunda ekonomik istikrar ve ekonomik kriz dönemlerinde ayrı ayrı sınanmasıdır. Çalışmada mevduat ve katılım bankalarının takipteki alacaklarının bağımlı değişken olarak alındığı üç model kurulmuştur. Bu modellerin birincisi ve ikincisi mikro değişkenlerden yani bankaların bilanço kalemlerinden oluşmuştur. Üçüncü model ise makroekonomik değişkenlerden oluşmaktadır. Çalışma ekonomik kriz ve istikrar dönemlerinde asimetrik bilgi sorununun farklılaşacağı varsayımından hareketle doğrusal olmayan modellemelerden olan Markov rejim değişim vektör otoregresyon MSIAH-VAR yöntemi ile analiz edilmektedir. Çalışma, asimetrik bilgi sorunu çerçevesinde 6 hipotezin test edilmesine yönelik hazırlanmıştır. Analizlerden elde edilen bulgulara göre, asimetrik bilgi sorununun katılım bankalarında daha az olmasına yönelik hipotez makroekonomik ve mikro değişkenler açısından değerlendirildiğinde, katılım bankalarının mevduat bankalarından daha iyi olduğu söylenebilir. İkinci hipotez kriz dönemlerinde katılım bankalarının mevduat bankalarına göre daha istikrarlıolduğu iddiasıdır. Bu hipotezle ilgili olarak katılım bankalarınınözkaynaklarının daha güçlü olduğu görülmektedir. Üçüncü hipotez bağlamındakatılım bankalarının reel ekonomiye katkısının daha fazla olduğu sonucuna ulaşılmıştır. Dördüncü hipotezin sonucunda ise iki banka türünün özkaynak ve aktif değerleri karşılaştırıldığındakatılım bankalarının özkaynaklara daha bağımlı bir yapısı olduğu görülmüştür. Beşinci hipotez bağlamındapara politikası araçları ile katılım bankaları arasında asimetrik bilgi sorununun mevduat bankalarına göre daha fazla olduğu görülmüştür. Altıncı hipotez çalışmanın genel olarak bir değerlendirmesi olup bu hipotez çerçevesinde katılım bankalarının gerek istikrar gerek kriz dönemlerinde asimetrik bilgi sorununun daha az olduğu vurgulanmıştır."
