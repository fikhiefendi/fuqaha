abstract: "Tezin konusu, Medine'de Ravza-i Mutahhara yakınlarında Zeravan mahallesinde 1301/1884 yılında dünyaya gelen, 10 Ekim 1967 yılında İstanbul/Beykoz'da ebedî âleme irtihal eden, üstün ahlâkıyla temayüz etmiş birisi olarak Kur'an hâfızlığı ve medrese eğitimiyle öne çıkan, fıkıh, tefsir, hadis, siyer, akâid ve tasavvuf gibi dinî ilimlere vâkıf olan, şeriata sımsıkı bağlı kalan, tarihimizin yakın dönemine ilmî ve tasavvufî kişiliği ile unutulmayacak tesirler bırakan ve aynı zamanda ilmiyle âmil ender şahsiyetlerden birisi olan Hacı Osman Akfırat'ın hayatı, eserleri ve tasavvufî görüşleridir. Tez çalışmamız, girişle birlikte üç bölümden meydana gelmektedir. Giriş bölümünde araştırmanın konusu ile kaynakların değerledirilmesi ve 20. yüzyılda tarikatların durumu ele alınmıştır. Birinci bölüm Akfırat'ın hayatına tahsis edilmiş olup, onun doğumu ve hayatı, eğitimi, eserleri, vefatı, sosyal etkinliği ve tavsiyeleri, tarikat anlayışı işlenmiş, ayrıca bu bölümde Nakşibendiyye tarikatına ve onun kollarından olan Hâlidiyye'ye yer verilmiştir. İkinci bölümde Akfırat'ın tasavvufî görüşleri ana başlığı adı altında ibadet, ahlâk ve seyr-ü sülûkle alâkalı tahalluk kavramları, tahakkuka dair kavramlar ile tasavvufî meseleler incelemeye tâbi tutulmuştur. Sonuç bölümünde ise genel bir değerlendirme yapılarak faydalanılan kaynaklar kaynakçada belirtilmiştir. Ayrıca ekler bölümüyle de tezimizin desteklenip takviye edilmesi ve zenginleştirilmesi amaçlanmıştır. Takvâdan ve samimiyetten ödün vermeden İslâmî bir yaşam tarzını düstur edinen Akfırat, dinin zâhirî hükümlerine bağlı kalmaktan asla tâviz vermemiştir. Kur'an ve sünnete uymayan, zâhirle çatışan, bâtını sapıtararak bâtıla kayan sahte şeyhlerle etkin bir mücadele içerisinde olan Akfırat, sahte tarikatlar ve sahte şeyhler ile olan mücadelesini ortaya koyup onların sapık düşüncelerini ve yanlışlarını açığa çıkararak tarikatlarda ihtilâflı ve anlaşılamayan kapalı yönleri izah etmeye çalışmıştır. Bu yolda Akfırat Kur'an ve sünnetten ilham alıp tarikat büyüklerinin de menhecinden ve hayatlarından esinlenerek takip edilmesi gereken doğru yol neyse, onun beyanı için gayret göstermiştir."
