abstract: "Kur'an-ı Kerîm, ibadet, muamelât ve ukubâta dair pek çok ahkâma taalluk eden ayet ihtiva etmektedir. Kur'an-ı Kerim'de bulunan bu ayetler, kullar için elzem olan, dünyevî hayatlarını düzenleyen kural-kaide, emir-yasak ve tavsiyeler içeren ayetler bütünüdür. Yarattığı kulunu çok iyi bilen Yüce Allah'ın, kullarının maslahatını ve çıkarını gözeterek gönderdiği ilahî mesajları anlama- yorumlama ve yaşama, dünya ve ahiret saadeti için çok önemlidir. Saç ayaklarından biri olan bu üçlü taksimatın yanı sıra, diğer bir ayağı oluşturan ahlâk konusu da İslamî emirleri anlama ve yaşama bakımından ikincil bir öneme değil bilakis eşit bir öneme sahiptir.Tezimizde gerek ahkâm gerekse ahlâk iç içe geçmiş olarak ele alınmıştır. Zaten bu iki konuyu birbirinden ayırmak mümkün değildir. Kur'an'da yüzlerce, bazı âlimlere göre binlerce geçen ahkâm ayetlerinin ahlâken taşıdığı değer ve bu ayetlerin ahlâkî boyutları konunun önemini ortaya koymaktadır. Bu bağlamda amacımız, ahkâm ayetleri ile ilgili olarak günümüze kadar gelen tefsirleri derlemek, özetlemek değil, onlara sosyal açıdan bakabilmek ve ahlâkî ilkelerini çıkarabilmektir."
