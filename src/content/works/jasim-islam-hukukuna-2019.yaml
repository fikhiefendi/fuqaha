abstract: "Azınlık hakları, günümüzde insanların büyük bir bölümünün hakkında yeterli bilgiye sahip olmadığı önemli bir araştırma konusudur. İslam hukuku, Müslüman olmayan azınlıklara birçok haklar vermektedir. Ne var ki, azınlıkların yaşadıkları İslam ülkelerinde faydalanabilecekleri bu hakların neler olduğunu insanların çoğu bilmez. Irak Anayasasının bu konuda İslam hukukunun metodunu nispeten takip ettiği söylenebilir. İslam ülkelerinde yürürlükte bulunan anayasa ve düzenlemelerde de Müslüman olmayan azınlıkların sahip oldukları haklara geniş yer verilmiş, fakat bunlarla İslam hukuku arasında büyük farklar bulunmaktadır. Müslüman olmayan azınlıkların sahip oldukları hakları açıklayan konularda birçok bilimsel araştırma ve inceleme bulunuyor olsa da bizim çalışmamız, temelde bütün bu çalışmalardan faklıdır. Çünkü çalışmamız, Müslüman olmayan azınlıkların hakları ile ilgili Irak'ta yürürlükte bulunan mevcut anayasa ve kanunları İslam hukukuyla karşılaştırmalı bir şekilde incelemektedir. Ayrıca bu karşılaştırmalı çalışma, azınlık hakları konusunda yürürlükteki Irak kanunları ile İslam hukuku arasında bulunan farkları ortaya koymaktadır. Bunun yanı sıra çalışmamız, iki hukuk sistemini karşılaştırmakla yetinmeyerek konuyla alakası bulunan ve mutlaka değinilmesi gereken önemli pek çok hususu da ele almaktadır. Bu çalışma, önsöz, giriş, üç bölüm ve bir sonuçtan meydana gelmektedir. Ön söz'de konunun öneminden, konunun problemlerinden, çalışma boyunca karşılaştığımız zorluklardan ve bu konun seçmesınde etkili olan sebeplerin neler olduğundan söz ettik. Girişte ise hakk'ın tanımı ve mahiyetini fıkıh ve Irak'ta halihazırda yürürlükte olan yasalara uygun olarak vermeye çalıştık. Fıkhın sözlük ve fukahâ ıstılahındaki anlamları üzerinde durduğumuz gibi kanunun yürürlükteki yasalarda ve kullanımdaki sözlük ve terim anlamları üzerinde de durduk. Ardından azınlık kavramının fıkıh ve kanunlardaki sözlük ve terim anlamlarını karşılaştırmalı bir şekilde ortaya koymaya çalıştık. Birinci bölümde azınlık kavramını ve bu kavramın Kur'an ve Hadislerde geçen eş anlamlı kelimeleri inceledik. Ayrıca yürürlükteki kanunlarda azınlık kavramını, tanımlarını ve kapsamını ortaya koymaya çalıştık. İkinci bölümü ise, İslam hukukunda azınlıklarla muamelatın nasıl yapılacağına dair somut örneklere yer verdik. Bu örnekler, Hz. Muhammed (s.a.v)'in, Hulefa-i Raşidin'in, Sahâbenin azınlıklarla olan muamelata dair pek çok Örnek Bunlardandır. İkinci bölümde İslam hukukunda ve Irak yasalarında azınlık haklarını ayrıntılı bir şekilde inceledik. Üçüncü bölümde ise fakihlerin Müslüman olmayan azınlıkların haklarına dair görüşlerini inceledik. Ulemanın bu konudaki görüşlerini dört mezhebe göre ve ayrıntılı bir şekilde ortaya koymaya çalıştık. Ardından İslam hukuku'ndaki ve Irak'ta yürürlükte bulunan kanunlardaki azınlık haklarını karşılaştırmaya çalıştık. Bu konuyu öneminden dolayı ayrıntılı bir şekilde ele aldık. İslam hukukunda azınlıklara verilen haklardan, bu hakların nasıl korunduğundan ve yürürlükteki yasalardan hangi yönleriyle farklı olduğundan bahsettik. Bunu takiben Irak yasalarında bu hakların nasıl ele alındığını ortaya koymaya çalıştık. Bu bölümde İslam hukukunun genel olarak insan haklarının korunması, özel olarak ise azınlık haklarının korunması ve uygulanması konusunda sahip olduğu üstünlük ve bu konuda hiçbir hukuk sisteminin İslam hukukuyla Seviyesine Ulaşamadığı içinde ortaya koymaya çalıştık. Sonuç bölümünde ise araştırma boyunca vardığımız önemli sonuçları ortaya koymaya çalışarak çalışmayı bitirdik. Son olarak çalışmam boyunca sağlamış olduğu destekten ve yardımlardan dolayı danışman hocam Doç. Dr. Mehmet Selim ASLAN'a teşekkür ederim. Ayrıca çalışmam boyunca bana yardımı dokunan herkese de teşekkür etmeyi borç bilirim."
