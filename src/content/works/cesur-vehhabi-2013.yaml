abstract: "Vehhâbî Hareketi 18. yüzyılda Necid bölgesinde 1702-1792 yılları arasında yaşamış Muhammed b. Abdülvehhâb tarafından toplumdaki inanç, ibadet ve politik bozulmaların ıslahı için başlatılan bir harekettir. Çalışma üç bölümden oluşmaktadır. Öncelikle Vehhâbî Hareketinin ortaya çıktığı bölgenin tarihi, coğrafi, sosyal, politik ve dinî şartları ele alınmıştır. Vehhâbîliğin XVIII. yüzyıl ihya hareketleri ile ilişkisi, Muhammed b. Abdülvehhâbın hayatı, hocaları, talebeleri, harekete yöneltilen eleştiriler birinci bölümün konuları arasında yer almaktadır. İkinci bölümde Vehhâbî hareketine mensup ulemânın fıkıh meselelerinde hükme varırken takip ettikleri metot üzerinde durulmuştur. Ayrıca bu bölümde Muhammed b. Abdülvehhâbın fıkıh usulüyle ilgili fikirlerinin geçtiği eserler değerlendirilmiş onun ve takipçilerinin fıkıh usulü düşüncesi netleştirilmeye çalışılmıştır. Üçüncü bölümde Muhammed b. Abdülvehhâbın fürû-i fıkıhla ilgili eserleri ve yöntemi ele alınmıştır. Son olarak İbn Teymiyye, Muhammed b. Abdülvehhâb ve bazı Vehhâbî ulemâsından örnek fetvalar verilerek değerlendirme yapılmıştır."
titleTranslation: {"en": "Emergence of Wahhabi movement and formation of fiqh thought"}
