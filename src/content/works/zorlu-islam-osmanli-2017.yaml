abstract: "İslam ve Osmanlı hukukunda tıbbî müdahalenin hukuka uygun olması için gereken şartlar vardır. Bunlar: 1)Tıbbî müdahalenin niteliğine uygun olarak yeterli bilgi ve tecrübeye sahip bir sağlık personeli tarafından yapılması 2) Hekimin tedavi kastıyla hareket etmesi 3) Tıp biliminin verilerine göre gerekli ve bu verilere uygun tıbbî müdahalede bulunulması, 4) Hastanın, yasal temsilcisinin veya hâkimin iznidir. Osmanlı klasik döneminde kimlerin tıbbî müdahalede bulunabileceği üç şekilde belirlenmiştir. Bunlar: Darüşşifalarda usta-çırak usulü eğitim görenler, tıp medreselerinde eğitim alanlar ve özel hocadan tıp eğitimi alarak ehliyet sahibi olanlardır. Osmanlı devletinde bir de yabancı memleketlerden gelen hekimlere tıbbî müdahalede bulunma izni verilmiştir. Osmanlı klasik döneminde, günümüzde olduğu gibi diplomasız ve ehliyeti olmayan hekimler var olmuş, Osmanlı devleti halk sağlığını korumak adına bu kimselerle düzenli bir şekilde mücadele etmiştir. Osmanlıda hekimlerin denetlenmesine ilişkin olarak yapılan sınav usulü tanzimat dönemi ile birlikte terkedilmiştir. Yerini günümüzde olduğu gibi, hekimin diplomalı olup olmaması yönünde gerçekleştirilen durum tespitine bırakmıştır. Osmanlı devletinde önemli tıbbi müdahalelerde genel olarak hekim ile hasta arasındaki tedavi sözleşmesi ve hastanın aydınlatılmış onamı kadı ve şuhudül hal huzurunda alınmıştır. Bu belgelere rıza senetleri veya hüccetleri denir. Rıza senedi örnekleri incelendiğinde tam bir titizlikle tutulduğu, İslam ve Osmanlı hukukuna uygun olarak rıza vermeye ehil kişilerin rızaları alındığı görülmektedir. Örneğin çocuklar için velilerinden veya varsa vasilerinden, tam ehliyetsizler için kanuni temsilcilerinden, köleler için ise efendilerinden tıbbî müdahaleye rıza alınmıştır. Hatalı veya yanlış tıbbî müdahalede bulunan hekim veya sağlık personeli, cezai, idari, tıbbî etik sorumluluğu, medeni hukuk sorumluluğu şeklinde sorumluluk türleri ile karşı karşıya kalacaktır. Hekimin hukuki sorumluluğu da farklı sebeplerden kaynaklanabilir. Bu sorumluluk, sözleşmeden, haksız fiilden veya vekaletsiz iş görmeden kaynaklanabilir."
