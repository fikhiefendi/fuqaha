abstract: "İmam Mâlik'in Muvatta eseri meşhur hadis kitaplarından olup Mâlikî fıkhı ve usulünün birincil kaynağıdır. İmam Mâlik Muvatta'sında zikrettiği bazı hadis ve haberleri reddedip bunlarla ameli kabul etmemiş ya da tevil ederek zahirine göre amel etmemiştir. İmam Mâlik'in kabul edip kitabına dahil ettiği ve senetleriyle zikrettiği bu hadislerle amel etmemesi, ilim ehlinin bazıları tarafından hoş görülmemiştir. Bu tez de bir usul araştırması yaparak İmam Mâlik'in mevzubahis hadislerle ameli terk etmesinin altında yatan sebepleri açığa çıkarma ve İmam Mâlik'in sahih âhâd hadisler, mürsel hadisler, sahabe sözleri ve Medine ehlinin amelinin hüccet sayılması gibi konularda usulünün ne olduğunu ortaya koyma gayesiyle yazılmıştır. Bu minvalde İmam Mâlik'in zikredip kendisiyle amel etmediği hadis ve haberler incelenmiş ve bunların İmam Mâlik'in usulündeki konumu belirlenmiştir. Bu sayede İmam Mâlik'in zikretmesine rağmen tümden amel etmediği ya da tevil ederek zahiren amel etmediği haberlerdeki yöntem açığa çıkarılmıştır. Daha sonra amel etmemesine neden olan usulî sebeplere göre tasnif edilen hadis ve haberlerden örnekler getirilmiştir. Böylece çalışma, İmam Mâlik'in amel etmediği ve Mâlikî usulüyle çelişen hadislerdeki fıkhî delaleti ortaya koymuştur."
