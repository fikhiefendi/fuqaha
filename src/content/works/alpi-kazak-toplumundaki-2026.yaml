abstract: "Hukukun toplumsal bir kurum olması, onun sosyal hayatın dinamikleriyle sürekli bir etkileşim içerisinde bulunmasını gerektirir. Bu ontolojik bağ, hukukun toplumsal verileri işleyen sosyoloji biliminden beslenmesini zorunlu kılar. Zira hukuk, toplumsal ilişkilerin kurallar bütünlüğü içerisinde kodlanmış yansımasıdır. Toplumsal realitenin sürekli değişmesi, hukukun da donuk bir yapıdan sıyrılarak yaşayan bir organizma gibi kendisini çağdaşlaştırmasını ve yeni sosyal durumlara uyarlanmasını bir mecburiyet haline getirir. Kazak toplumunun sosyal yapısında önemli bir yer tutan örfi uygulamalar; evlilik, boşanma, çok evlilik, miras ve aile içi roller gibi temel konularda kendine özgü düzenlemeler ortaya koymuştur. Araştırma, bu örfi kuralların İslam hukukundaki karşılıkları ile hangi noktalarda örtüştüğünü, hangi yönlerden ayrıştığını ve toplumsal pratikte nasıl bir uyum sürecinden geçtiğini ele almaktadır. Nitel araştırma yöntemine dayanan tez, klasik fıkıh kaynakları, modern İslam hukuku literatürü ve Kazak örf-idari yapısına ilişkin etnografik ve tarihi kaynaklar üzerinden değerlendirmeler yapmaktadır. Elde edilen bulgular, İslam aile hukukunun birçok temel ilkesinin Kazak örfi hukuku tarafından benimsendiğini, ancak kültürel ihtiyaçlara ve toplumsal yapıya bağlı olarak bazı alanlarda farklı uygulamaların korunduğunu göstermektedir. Çalışma, İslam hukukunun esneklik tanıyan yönleri ile Kazak örfünün toplumsal sürekliliğini sağlayan unsurlarının karşılıklı etkileşim içinde günümüze kadar varlığını sürdürdüğünü ortaya koymaktadır. Araştırmamız giriş ve iki bölümden oluşmaktadır. Giriş bölümünde konunun amacı, kapsamı ve kullanılan yöntemlere ve Kazak topraklarında İslam'ın yayılış sürecine yer verilmiştir. Birinci bölümde örf ve âdet kavramları, çeşitleri, delil oluşu incelenerek delilleriyle anlatılmıştır. Akabinde Kazak toplumunun genel aile yapısı hakkında akrabalık ilişkileri, çocuk terbiyesi, büyüklere saygı, çok eşliliğin tarihsel uygulama biçimleri konuları ele alınmıştır. İkinci bölümde İslam hukuku ve Kazak örfündeki aileye dair uygulamalar mukayeseli şekilde değerlendirilmiştir. Önce eş seçimi meselesinden başlayıp, evlenme engelleri, evlenme öncesi yapılan merasimler, mehir ve başlık parasının farkı, nikah akdi ve türleri, düğün merasimleri nasıl uygulanır, ailede eşlerin rolleri, nafaka yükümlülüğü, aile hukukunda boşanma, İslam hukuku ve Kazak örfünde uygulanan boşanma türleri, iddet meselesi, miras taksimatıyla sıralanmıştır."
