abstract: "Tezimizde, 1917 tarihli Hukûk-i Âile Kararnâmesi başta olmak üzere Türk aile hukukunun tarihsel süreç içinde hangi merhalelerden geçtiğini araştırdık. Aile konusunu merkeze alarak ilgili hukuk normlarını ve yasalarını inceleyip ailenin kurulması, korunması, ayakta kalabilmesi için yapılması gerekenleri ele aldık. Aile ile ilgili toplumun her kesimince dikkat kesilen sorunlarını objektif bir bakış açısıyla değerlendirdik. Tezimiz genel hatlarıyla üç kısımdan müteşekkildir. Araştırmanın konusunu, amacını ve incelediğimiz kaynakları Girişte ele aldık. Birinci bölümde kavramsal çerçeve olarak aile, Türk ailesinin genel yapısı, günümüz ailesini tehdit eden sorunlar, Türk aile hukukunun gelişimsel sürecinin başlangıç noktası Hukûk-i Âile Kararnâmesi ve Kararnâmenin özellikleri; İkinci bölümde Hukûk-i Âile Kararnâmesinin yürürlükten kaldırılması akabinde yapılan taslak çalışmaları, Medeni Kanun'a uzanan süreç ve ilgili uluslararası antlaşmalar; Üçüncü bölümde Hukûk-i Âile Kararnâmesi ile Medeni Kanun'un aile meselesine yaklaşımını, günümüz aile politikaları, geçmişten günümüze hukuki düzenlemelerin serüveninde gelinen son nokta ele alınmıştır. Sonuç bölümünde çalışmamızda ulaştığımız neticelerden ve önemli gördüğümüz bazı mülâhazalarımızı sıralayarak tezimizi nihayete erdirdik."
