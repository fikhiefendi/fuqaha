abstract: "Alternatif bir model olarak katılım finans sistemi son dönemde Türk bankacılık sektörü ve sermaye piyasalarında kayda değer bir varlık ve fon büyüklüğüne erişmiş ve farklı kesimlerdeki piyasa katılımcılarının ilgisini çekmiştir. Ayrıca akademik düzeyde çok sayıda teorik ve ampirik çalışmaya konu edilmiştir. Dünyada giderek belirginleşen, temelinde ekonomik ve finansal başarısızlıkların yer aldığı model ve sistem arayışları konvansiyonel yaklaşım ve uygulamalarını gözden geçirmeye zorlamaktadır. Diğer bir deyişle, ekonomide ve modern finansta ana akım paradigma değişmektedir. Farklı düşünce sistematiğine sahip yaklaşımların her biri finansta yeni bir yapılanmaya ihtiyaç olduğunu ifade etmektedir. Bu bağlamda ilk makalede finansın değişen paradigması alternatif yaklaşımlar çerçevesinde incelenmiştir. Finansın yönünü değiştiren teorik ve uygulamadaki yaklaşımlar postmodern finans düşüncesi olarak kavramsallaştırılmış; etik, sosyal ve sorumlu finans, iyi finans, İslami finans, insani finans ve alternatif finans başlıkları altında kavramsal bir inceleme yapılmıştır. Ayrıca makalede katılım finans sistemi tanıtılmış, temel prensipleri ve uygulama alanları açıklanmıştır. Buna ek olarak, Türkiye'de katılım finans sisteminin geleneksel sistem içerisindeki işlevi ve gelecek perspektifi değerlendirilmiş ve tartışılmıştır. Sonuç olarak katılım finans sisteminin belirli sınırlılıklara sahip olmakla birlikte finansın değişen paradigmasıyla uyumlu, kendine özgü ve farklı bileşenleri barındıran bir model olma özeliği taşıdığı düşünülmektedir. İkinci makalede katılım pay piyasasında ampirik bir uygulama yapılmıştır. Makalede Borsa İstanbul Katılım 30 endeksinde yer alan pay senetleri kullanılarak postmodern portföy teorisine dayalı alternatif bir ağırlık belirleme stratejisi önerilmiştir. Makalede optimizasyon yöntemine dayalı iki farklı yaklaşım benimsenmiştir. Birincisi Modern Portföy Teorisiyle uyumlu Sharpe oranı maksimizasyonuna dayalı ağırlık belirleme yaklaşımıdır. İkincisi Postmodern Portföy Teorisiyle uyumlu Sortino oranı maksimizasyonuna dayalı yaklaşımdır. Her iki optimizasyondan elde edilen ağırlıklar kullanılarak Sharpe ve Sortino portföyleri oluşturulmuş ve portföyler getiri performansı açısından birbiriyle, eşit ağırlıklı portföyle ve pazar endeksi olarak analize dahil edilen Katılım 30 endeksiyle karşılaştırılmıştır. Sonuç olarak kullanılan tekniklerin alternatif bir yatırım stratejisi olarak uygulanabilir olduğu düşünülmektedir. Üçüncü makalede ise Borsa İstanbul'daki katılım ve konvansiyonel endekslerde volatilite tahminini içeren ampirik bir uygulama yapılmıştır. GARCH, TGARCH, EGARCH, APARCH ve EGARCH-M modellerinin kullanıldığı çalışmada model parametreleri tahmin edilerek yorumlanmış ve serilerin volatilite özelikleri incelenmiştir. Ayrıca örneklem dışı dönem için volatilite öngörümlemesi yapılmış ve tahmin modellerinin gün içi beş dakikalık verilerle hesaplanan gerçekleşen volatiliteyi açıklama gücü test edilmiştir. Bu amaçla regresyon denklemleri çözülmüş ve belirlilik katsayılarına (R-kare) göre gerçekleşen volatiliteyi en iyi tahmin eden modelin EGARCH olduğu görülmüştür. Ayrıca Katılım 30 endeksi için diğer endekslerden farklılaşan sonuçlar elde edilmiştir. Üç makaleden oluşan bu tez çalışmasının katılım finans sistemine ilişkin literatüre hem teorik hem de ampirik olarak katkı sunması beklenmektedir."
