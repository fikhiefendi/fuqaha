abstract: "Bu çalışmamızda dünyada yaklaşık 30 yıllık, dünyada ise faizsiz/islami bankacılık adında 60 yıllık geçmişi olan katılım bankacılığının kendilerine özgü yatırım araçları ve bu yatırım araçlarının dünyadaki örnekleri kaleme alınmıştır. Bilindiği üzere Türkiye'de son olarak devlet bankalarının da bu alana girmesiyle Ziraat Katılım Bankası ve Vakıf Katılım Bankası açılmıştır. Bu iki bankanın açılmasıyla birlikte Türkiye'de toplamda 5 adet katılım bankası sektörde yerini almıştır. 2019 yılında henüz kuruluş aşamasında olan Emlak Katılım Bankası A.Ş. bu pazara dahil olduğunda sayı 6 olacaktır. Geçtiğimiz yıllara oranla katılım bankaları faiz hassasiyeti olmayan diğer adı konvansiyonel olan bankaların içerisinde bulunduğu hacimde giderek artan bir ivme kazandığı söylenemez. Mevduat anlamında ise katılım bankaları toplam büyüklüğü bankacılık sektöründe %5 civarlarına gelmiştir. Bu çalışmada öncelikle katılım bankacılığının ne olduğu, ne anlamlar içerdiği, Türkiye ve dünyadaki tarihi, ilkeleri, hangi amaçlar doğrultusunda işlem yaptıkları, hedeflediği kitle ve yasal olarak Katılım bankacığının çerçeveleri incelenmiştir. İkinci bölümde katılım bankalarının faiz içermeden hangi ürünleri ne şekilde piyasada tuttukları incelenmiştir. Bankaların temel amacı fon toplamak ve topladıkları fonları dağıtmak olduğu için iki başlıkta bu konu incelenmiştir. Kullanmış oldukları ve müşterilerine sundukları ürünlerin neler olduğu konusu ise detaylı olarak ikinci bölümde kendine yer bulmuştur. Son bölümde ise tezin ana başlığında da yer alan Katılım Bankacılığı ürünlerinin veya yatırım araçlarının dünyada olup olmadıkları var ise ne şekilde uygulandıklarına yer verilmiştir. Bahsi geçen bu yatırım araçları ülkelere göre değişkenlik gösterdiği için ilgili ürünler ülke ülke incelenmiştir."
