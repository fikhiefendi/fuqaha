abstract: "Elimizde on iki nüshası bulunan Kazâbâdî'nin `Hâşiyetü'l-Usûl ve Ğâşiyetü'l-Fusûl ale'l ?Mukaddemâti'l-Erba`a adlı eseri üzerine yaptığımız bu çalışma giriş ve iki bölümden oluşmaktadır.Birinci bölümde hüsün kubuh meselesini ve bu konudaki mezheplerin görüşlerini ele aldık.İkinci bölümde Sadrüşşerîa'yı ve eserlerini tanıtıp `Mukaddemâtü'l-Erba'a' üzerine yazılan hâşiyeleri belirttik. Kazâbâdî'nin hayatı, öğrencileri ve eserleri hakkında da bilgi verdikten sonra Kazâbâdî'nin eserinin elimizde olan on iki nüshasını tanıtıp tahkîkli ana metinde geçen kısaltmaları verdik. Son alt başlıkta ise tezimizin asıl konusu olan Kazâbâdî'nin mezkûr eserinin on iki nüshasından müellif nüshasına en yakın tarihli nüshayı asıl nüsha olarak kabul edip ve bu söz konusu nüshaya dört nüshayı daha ekleyerek karşılaştırıp, farklılıkları tespit edip tercihlerde bulunduğumuz tahkîkli ana metni verdik. Tezimiz bibliyografya ile sona ermektedir."
