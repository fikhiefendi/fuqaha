abstract: "Bu araştırma, Suudi Arabistan Krallığı'ndaki iş geliştirme merkezlerinin durumuna ilişkin teorik literatür ve araştırmalarının yanı sıra küçük ve orta boy işletmelerini geliştirebilme imkanlarının kapsamını, iş geliştirme merkezlerinin başarı faktörleri ve küçük ve orta boy işletmelerin geliştirememesinin olumsuz etkilerini gözden geçirerek iş geliştirme merkezlerinin rolünü ve küçük ve orta boy işletmelerin büyümesi üzerindeki etkisini incelemeyi hedeflemektedir. Bu amaçla araştırmada, küçük ve orta boy işletmelerin büyümesinde iş geliştirme merkezlerinin rolü konusunda ihtisas raporları ve araştırma makalelerine refere edildi. Araştırmanın hipotezlerini test etmek için araştırmacı, hedef örneklemi temel alarak araştırmanın amaç ve hipotezlerine odaklı bir anket tasarladı. Araştırma örneklemi 202 bireyden oluşmakta ve SPSS istatistik programı yardımıyla tekrarlamalar, yüzdelik oranları ve aritmetik ortalamalar elde edildi ve tek örneklem testi yapıldı. Araştırma, iş geliştirme merkezleri tarafından sağlanan hizmetlerin Suudi Arabistan Krallığı'ndaki küçük ve orta boy işletmelerin büyümesine ve gelişmesine önemli ölçüde katkıda bulunduğu, ayrıca iş geliştirme merkezlerinin birçok proje için sağladığı yönetimin Suudi Arabistan Krallığı'ndaki küçük ve orta boy işletmelerin başarısına önemli ölçüde katkıda bulunduğu, küçük ve orta boy işletmelerin büyümesine ve gelişmesine önemli ölçüde katkıda bulunan İş geliştirme merkezlerinin başarısında hükümetin rolünün olumlu bir faktörün olması, COVID-19 salgını sırasında iş geliştirme merkezleri ile projeler arasındaki dijital ortamda çalışma zorunluluğundan dolayı Suudi Arabistan Krallığı'ndaki küçük ve orta boy işletmelerin büyümesi ve gelişmesi üzerinde olumsuz bir etki yarattığı, bunun nedeni, küçük ve orta ölçekli işletme sahiplerinin çoğunun iş geliştirme merkezleri ile iletişim kurmak için teknik yöntemlerin kullanımı konusunda teknolojik bir altyapıya sahip olmamaları ve uzaktan çalışmanın sahada çalışmadan tamamen farklı nitelikte olduğu, gibi birçok önemli sonuç elde etmiştir. Ayrıca bu araştırma, Suudi Arabistan Krallığı'ndaki bankacılık işlemlerine İslami Şeriat hükümlerine uyumun hakim olduğunu ve iş geliştirme merkezlerinin neredeyse buna istisnasız olmadığını ortaya koydu. Bu gözlem aynı zamanda, iş geliştirme merkezlerinin faaliyetlerinin, daha önce belirttiğimiz gibi şeriat şartlarına ve kontrollerine göre meşru olan katılım, spekülasyon veya kâr yüzdesi ile finanse edildiğinden caiz olduğunu teyit eder. Bu çalışmanın önemi, iş geliştirme merkezleri kurmanın önemini ve sundukları hizmetler ile faaliyete girmeden önce ve kurulduktan sonra projeler ve girişimlerle eşlik etmeleri küçük ve orta boy işletmelerin büyümelerindeki rolünü açıklamasından kaynaklanmaktadır."
