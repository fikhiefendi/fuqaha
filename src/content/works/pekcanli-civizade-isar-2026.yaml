abstract: "Bu çalışma, Osmanlı dönemi hicri 10. yüzyıl âlimlerinden Çivizâde Muhyiddin Mehmed Efendi'nin el-Îs̱âr li-ḥalli'l-Muḫtâr adlı eserinde, taharet, namaz ve oruç bölümleri özelinde İmam Şâfiî'ye nispet edilen fıkhî görüşlerin incelemesini konu edinmektedir. Çalışmada Hanefî mezhebine ait bir eserde İmam Şâfiî'ye nispet edilerek aktarılan görüşlerin tespit ve tahlili yapılmıştır. Nakillerin asli kaynaklara uygunluğu tespit edilmeye çalışılmıştır. Araştırma sonucunda, Çivizâde'nin İmam Şâfiî'ye nispet ettiği görüşlerin bir kısmının Şâfiî literatürüyle uyumlu olduğu, bir kısmının kısmi benzerlik taşıdığı, bir kısmının ise ulaşılabilen mevcut kaynaklarla uyumlu olmadığı tespit edilmiştir. Araştırma neticesinde her mezhebin kendi kaynaklarından öğrenilmesinin önem arz ettiği teyit edilmiştir."
