abstract: "Toplumların barış içinde yaşaması, bireyler arasında çıkan uyuşmazlıkların adil ve etkin bir şekilde çözülmesine bağlıdır. Bu doğrultuda, uyuşmazlıkların yargı yoluna başvurulmadan, karşılıklı rıza ve iyi niyet esasına dayalı olarak çözülmesini hedefleyen arabuluculuk hem modern hukuk sistemlerinde hem de klasik hukuk geleneklerinde önemli bir yere sahiptir. Bu tez, İslam hukukunda arabuluculuk kurumunu teorik ve pratik yönleriyle ele almakta; İslam'ın temel kaynaklarında arabuluculuğun yeri, dayanakları, ilkeleri ve uygulanabilirliği üzerine kapsamlı bir inceleme sunmaktadır. Çalışmanın ikinci bölümünde, modern hukuk açısından alternatif uyuşmazlık çözüm yöntemleri olan Arabuluculuk başta olmak üzere, Uzlaşma, Tahkim, Kısa Duruşma, Tarafsız Ön Değerlendirme Yöntemi, Arabuluculuk-Tahkim (Med-Arb), Vakıaların Saptanması Yöntemi, Müzakere ve Ombudsmanlık kavramları üzerinde duruldu. Ayrıca bu bölümde İslam Hukuku açısından alternatif uyuşmazlık uyuşmazlık yöntemleri olan, Arabuluculuk başta olmak üzere, Sulh, Tahkim, Hisbe Teşkilatı ve bu yöntemlerin birbirleri olan ilişkileri hakkında çalışma yapıldı. Üçüncü bölümde ise, İslam Hukukunda arabuluculuğun dayandığı deliller, arabulucuda bulunması gereken vasıflar, tarafları, konusu gibi araştırmalara yer verildi. Dördüncü bölümde, İslam Hukukuna göre arabulucuda bulunması gereken vasıflar, arabuluculuğun tarafları, arabuluculuğun taraflarında aranan şartlar, konusu, arabuluculuğun konusuyla ilgili şartlar, ceza ve tazminat konularında arabuluculuk, kısas üzerine fakihlerin görüşleri, sulhun geçerli olması için gerekli şartlar ve arabuluculuğun türleri ve uygulama alanları vb. konularda çalışmalar yapıldı. Beşinci bölümde, Hz. Peygamber, Sahabe döneminde ve geniş bir şekilde Osmanlı Hukuk Sisteminde olmak üzere arabuluculuk uygulamalarına yer verildi. Bu tezde ulaşılan temel sonuçlardan biri, İslam hukukunun bireyler arası ihtilafların çözümünde barışçıl, gönüllülük esasına dayalı ve toplumsal uzlaşıyı esas alan bir çözüm anlayışını benimsediğidir. Özellikle sulh ve ıslah ilkeleri, modern arabuluculukla büyük oranda örtüşmekte; bu yönüyle İslam hukuku, alternatif uyuşmazlık çözüm yollarının temellendirilmesinde önemli bir referans kaynağı sunmaktadır."
