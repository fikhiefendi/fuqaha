abstract: "Bu çalışma yoksulluk literatürü ışığı altında dünyada ve Türkiye?de yoksullukla mücadelede kullanılan tüm doğrudan mali tedbirleri incelemekte ve bu tedbirlerin gösterdikleri performansları Türkiye açısından analiz etmektedir. Ülke uygulamaları incelendiğinde yoksullukla mücadelenin birçok doğrudan mali tedbirin birlikte kullanılması ile yapıldığı tespit edilmiştir. Bu nedenle çalışmada doğrudan mali tedbirlerin tamamına yer verilmiş ve bu yöntemin mücadelenin daha iyi anlaşılmasına katkı yapacağı düşünülmüştür. Çalışmada tanımlayıcı çalışma yöntemi benimsenmiştir. Öncelikle dünyada ve Türkiye?de yoksullukla mücadelede kullanılmakta olan doğrudan mali tedbirler tespit edilmiştir. Doğrudan mali tedbirler kamusal mali tedbirler, sivil toplum kuruluşları, mikrokredi uygulamaları ve İslam ekonomisi şeklinde sınıflandırılarak incelenmiştir. Kamusal mali tedbirler ise kamusal sosyal harcamalar ve kamusal gelirler şeklindeki alt kalemlere ayrılmıştır. Doğrudan mali tedbirlerde uygulanan hedefleme mekanizmaları örneklerle beraber verilmiştir. Türkiye?de uygulanan tüm doğrudan mali tedbirler analiz edilmeye çalışılmıştır. Çalışmanın sonucunda, doğrudan mali tedbirlerin yeterli ve düzenli kaynakla, uzun dönemli, planlı, hedefleme mekanizmaları yoluyla ve birlikte kullanılması halinde yoksullukla mücadelede istenen başarıların sağlanacağı görülmüştür. Ayrıca doğrudan mali tedbirlere paralel olarak yoksulların istihdamla olan bağlantılarının sağlanmasının yoksulluk oranlarının düşürülmesine katkı yapacağı tespit edilmiştir. Yapılan bu analizler sonucunda en iyi politika önerileri sunulmaya gayret edilmiştir."
