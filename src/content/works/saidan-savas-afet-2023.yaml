abstract: "“Savaş ve Afet esnasında Doktorların Faaliyetleri ile İlgili Fıkhî Hükümler”başlıklı bu tez, savaş ve afet durumlarında doktorların ibadet ve işini İslam'ın zaruret kavramı çerçevesinde ele almaktadır. Tez, giriş, iki bölüm ve sonuç bölümlerinden oluşmaktadır. Giriş bölümünde, araştırmanın konusu, amacı ve önemi, konuyla ilgili yapılan çalışmalar ve teorik çerçeve hakkında bilgi verilmiştir. Teorik çerçevede zaruret kavramı ve zaruretlerin hükümlere etkisiyle ilgili fıkhî kaideler incelenmiştir. Birinci bölümde, savaş ve afet durumlarında doktorların ibadetle ilgili meseleleri ele alınmıştır. Yaralıların fazla olması gibi durumlar ve benzeri sebeplerle doktorların namazla ilgili meseleleri zaruret çerçevesinde tartışılmıştır. İkinci bölümde, savaş ve afet esnasında tedavi süreçleriyle ilgili tıbbi-etik konular, hangi etik ve dini çerçeveler içinde hareket etmeleri gerektiği üzerinde durularak tartışılmıştır. Çalışmanın sonucunu içeren bir bölümle birlikte tez tamamlanmıştır."
