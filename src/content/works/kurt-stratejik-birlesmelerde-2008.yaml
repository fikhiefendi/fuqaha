abstract: "Günümüzde işletmeler rekabetin giderek artması sonucu varlıklarını koruyabilmek için büyümeyi ve birleşmeyi tercih etmek durumunda kalmışlardır. İşletmeler arası işbirliğinin birleşme olarak adlandırılması için hem ekonomik hem de hukuksal yönden işletmelerin bir birlik haline gelmeleri ve aynı zamanda işletmelerin mal varlıklarının da birleştirilmiş olması gerekmektedir. Bu şekilde gerçekleştirilen stratejik birleşme, iki farklı kültüre sahip işletmenin tek bir işletme kültürü altında birleştiği uzun, zor ve yorucu bir süreçtir. Bu sürecin problemsiz tamamlanabilmesi için insan kaynakları yönetiminin tam ve eksiksiz yerine getirilmesi gerekmektedir.Bu çalışmanın asıl amacı 2005 yılında stratejik bir birleşme ile Türkiye Finans adı altında biraraya gelen Anadolu Finans ve Family Finansın birleşme sürecinde insan kaynakları yönetiminin etkinliğini ölçmektir. Tezde ileri sürülen 4 hipotezin doğruluğu istatistiksel olarak ispatlanmıştır. Birleşme sürecini yaşayan 424 çalışan tarafından doldurulan ve 20 sorudan oluşan ankete verilen cevaplar SSPS yazılımında incelenerek istatistiksel analizler yapılmıştır. Ayrıca İnsan Kaynakları bölümü yöneticisi ile yapılan geniş mülakat ta bilgi toplama açısından yararlı olmuştur. SPSS yazılımında anketin güvenilirliğini ölçmek için Cronbach Alfa testi, anket soruları arasındaki tutarlılığı ölçmek için korelasyon testi; kıdem, yaş, cinsiyet, ünvan gibi değişkenler bazında cevaplardaki değişkenliği ölçmek için Independent Samples T-Test ve One-Way Anova testleri yapılmıştır. Ayrıca Crosstab analizi yapılarak her soru için değişkenler bazında cevaplar detaylı incelenmiştir.Çalışma sonucunda çalışanların birleşme sürecinde insan kaynakları yönetimini başarılı buldukları ortaya çıkmıştır. Ayrıca sorulara verilen cevapların; kıdem, yaş, cinsiyet, ünvan gibi değişkenler bazında önemli ölçüde farklılıklar gösterdiği istatistiksel olarak kanıtlanmıştır."
