abstract: "Kur'ân'ın ve hadislerin ifade ettiği manaları doğru anlamak, dini doğru anlamak ve doğru uygulamak için önem arz etmektedir. Onları doğru anlamak için doğru yöntemlerin kullanılması gerekir. Bazı yöntemlerin doğruluğu üzerinde usûlcüler ittifak ederken, bazılarının doğruluğu tartışılmıştır. Tartışılan yöntemlerden biri de naslardan ters anlam (mefhûm-i muhâlif) çıkarılıp çıkarılamayacağıdır. Elimize ulaşan ve sonraki usûlcüleri etkileyen ilk Hanefî usûl eserinin yazarı olması ve aynı zamanda ahkâm âyetlerini inceleyen bir tefsirinin bulunması Ebû Bekir er-Râzî el-Cessâs'ın bu konudaki görüşlerini önemli kılmaktadır. Onun için bu tezde Hanefî fakihlerden Cessâs'ın mefhûm-i muhâlif anlayışı incelenmiştir. Tez üç bölümden oluşmaktadır: Birinci bölümde Cessâs'ın hayatı, yaşadığı dönemin özellikleri ve ilmi yönü; ikinci bölümde fıkhî mezheplerin sözün delâleti ile ilgili görüşleri, mefhûm-i muhâlif konusuna yaklaşımları ve bu konuda ileri sürdükleri deliller ele alınmıştır. Üçüncü bölümde ise Cessâs'ın mefhûm-i muhâlif anlayışı, bu anlayışının ahkâm âyetleri tefsirine yansıması, sonraki Hanefî usûlcülere etkisi incelenmiştir."
