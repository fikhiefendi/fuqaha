abstract: "İnsan hayatının hem madden hem de manen korunması insanın beslenmesi, yaşadığı ortamın güvenliği ve saldırı karşısında cânilerin cezalandırılmasının birlikte gerçekleşmesiyle mümkündür. Mâide Suresi?nde bunların hepsi de işlenmiştir. İnsan hayatının korunması için yeme içmenin çerçevesi belirlenmiş. Maide Suresinde ehli kitabın kadınları ve yiyecekleri de helal kılınıp bunun sınırlarının çizilmiş olduğunu görekteyiz.Mâide Suresi, insan hayatının devamı için evrensel kurallar koymuştur. Bu kurallar zaman üstüdürler. İnsanlığın ilk yaratıldığı günde esfeli safiline düşmesine sebep olan hastalıklarla, son dinin tamamlanması esnasında düşmesine sebep olan hastalıklar aynıdır. Mesela hased, kendini ayrıcalıklı görmek, günahta yardımlaşmak gibi hastalıklar bunun örnekleridir. Aynı şekilde insanın yükselmesine sebep olan kurallar da aynıdır. Bunlar da takva, iyilikte yardımlaşma, Allah için adaleti tesis etmek gibi kurallardır. Bu yüzden insan hayatı genel kurallar etrafında incelenmiştir.Suçların önlenebilmesi için suçluların gerekli şekilde cezalandırılması gerekir. Cezaların caydırıcı olmakla birlikte uygulanırken adaletli bir şekilde uygulanması gerekir. Mâide Suresi?ndeki hadd cezaları, şahsa göre değişmeyen, tamamen suçu yok etmeyi hedefleyen cezalardır. Bunlar kısas, hirabe ve hırsızlık cezalarıdır."
