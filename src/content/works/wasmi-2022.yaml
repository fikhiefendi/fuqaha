abstract: "Muhaddis, fıkıhçı ve zahid Ebü'l-Leys es-Semerkandi'nin tercümesi, biyografisi, ilmi derecesi ve güvenirlilik mertebesi açısından daha önceki araştırmacılar tarafından çok az da olsa cerh ve tadil olarak onun hakkındaki yazılanlar dışında onunla ilgili fazla araştırma yapılmamıştır. Bazı ilim ehli ve tarihçiler ona atıfta bulunmuş olabilir. Bunun nedeni, İslam ülkesinin vahşi Moğol istilasına maruz kalması sırasında Mâverâünnehir beldelerinde birçok ilmi kitabın kaybedilmesidir. Zira bu istila, İslam ümmetinin tüm kütüphanelerinin, hatta Bağdat'ın sistematik olarak yakılmasına neden olmuştur. Sadece Şam beldeleri, Mısır ve Mağrip bu eziyet verici fitneden kurtulabilmiştir. Yazarın yazılarındaki yaklaşımının derin nesnel çalışmaları nadir ve az bulunmaktadır. Bunların çoğunluğu da üniversitelerde akademik derece elde etmek için yapılan bilimsel araştırmalardır.“Tenbîhü'l-Gafilîn”kitabı birçok zayıf, uydurma ve diğer hadisleri içermektedir. Bu nedenle, sahih hadisi diğerlerinden ayırt edemeyenlerin okuması önerilmez. Tenbîhü'l-Gafilîn kitabı, zamanının nadir kitaplarındandır. Ayrıca konuları, Rabbani İrfan ekolünün sülûk ve tasavvuf divanlarında birinci sınıf teliflerden kabul edilmektedir. Bu kitapta ahlak mertebelerine, sülûk dereceleri ve zahidleri yetiştirme süreçlerine ilişkin kayıtların geniş bir bölümüne ulaşabiliriz. Hatta zühd talebelerine yönelik ilk tarikat eğitim müfredatı, ahlak ve tasavvuf okullarının birincil kaynağı bile hazırlanabilir. Kitap (bazı uydurma hadisler dışında) etkili bir eğitim ve vaaz yöntemi olarak kabul edilebilir. Materyalist teori, laiklik, ateizm ve çağdaş kuşakların rüzgarına kapıldığı tüm yıkıcı akımların planlarına karşı gaybi meşru süzgeçlerden biri olarak kabul edilebilir. Kitap, nesli parçalanma ve kayboluş uçurumuna doğru iten Batılı yeniliklere karşı ümmetin korunmasına katkıda bulunduğu gibi İslamofobi çağının sistematik koruyucu silahlarından da biridir. Müellif, hadis ve eseri ispat etmede fakihlerin yolunu tutmuş, rivayet edilenin sahih olması şartıyla müsamaha ve kolaylaştırıcılığa meyletmiştir. Bunu, elinde mevcut olan bölümü güçlendirmek adına mümkün olduğunca çok nakil için yapmıştır. Birçok durumda yazar, bölümün içeriğini ve amacını güçlendirmek için konuları alt bölümlere ayırmıştır."
