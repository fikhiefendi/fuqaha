abstract: "İslam fıkhının fürûatının usule yansımasından bazı ara kavramlar oluşmuştur. Hanefî fıkıh terminolojisinde ortaya çıkan fesad kavramı da bunların içerisindedir. Fesad hükmünün mülkiyet üzerindeki tesiri güncel birçok meselenin izahı konusunda önem arz etmektedir. Bu nedenle, çalışmamızda fâsid akitlerin mülkiyet üzerindeki etkilerini inceledik. Bu etkileri incelerken Hanefî mezhebini merkeze alarak, farklı açılardan analiz etmek suretiyle bu konuya bağlı mevzuların da zeminini tahkim etmeye çalıştık. Bu doğrultuda tezimiz; bir giriş, iki ana bölüm ve bir sonuçtan oluşmuştur. Giriş bölümünde tezimizin konusu, amacı ve önemi anlatılmıştır. Birinci bölümde Hanefî mezhebi ve diğer mezheplerin fâsid kavramı için tayin etmiş oldukları farklı anlamlara işaret edilmiştir. Zira Hanefîler bu kavrama daha ziyade sahih ile bâtıl arasında bir anlam alanı belirlerken cumhur bu kavramı doğrudan bâtılla özdeşleştirmiştir. Hanefîlerin böyle bir ara anlama müracat etmelerindeki en temel neden, bâtılın hem dünyevî hem de uhrevî olarak hükmü geçersiz kılmasına karşın fâsidin dünyevî hükümlerde geçerli olmasıdır. Bununla birlikte fâsid bir hükmün uhrevî sorumluluğundan kurtulabilmek için feshinin gerekli olduğunu da vurgulamışlardır. Yine bu bölümde bir ibadet veya muamelenin“fâsid”hükmüyle nitelenmesine sebep olan nehiy konusu izah edilmiş, nehyin fesada delaletiyle ilgili tartışmalara yer verilmiştir. Muâmelât alanında bir akdin özüne, ayrılmayan vasfına ve ayrılabilir/mücavir vasfına hüküm koyucu (şâri') tarafından yasak gelmesi durumunda nasıl bir etki gösterdiği, fıkıh mezhepleri tarafından ne şekilde değerlendirildiği açıklanmıştır. V Tezimizin ikinci bölümünde fâsid akdin mülkiyet intikaline sebep olup olmaması irdelenmiş, sahih akdin hükmü olan mülkiyet intikalinin yasak akitler için de geçerli olup olmadığı usul kuralları göz önünde bulundurularak tartışılmıştır. Fâsid satım akitleri sıhhat şartlarını taşımadığından dolayı mün'akid/geçerli sayılmaz. Mün'akid olmayan akitlerin de sahih olması düşünülemez. Bu sebeple önce satım akitlerinin in'ikad/geçerlilik ve sıhhat şartları ele alınmış, sonrasında da izahını yapmış olduğumuz sıhhat şartlarını taşımayan fâsid akitler açıklanmıştır. Fâsid akitler; hakkında örf oluşması sebebiyle sahihe dönüşebilmektedir. Ancak bütün örfler her fâsid akdi sahih hâle getirmez. Bu sebeple örfün etki edebildiği fâsid akitler açıklanmıştır. Bazı fâsid akitlerde toplumsal meşakkat oluşması sebebiyle sahih hâle gelebilmektedir. Bu bölümde fâsid akdin sahih hâle gelmesine etki eden meşakkat izah edilmiştir. Öte yandan devlet otoritesi tarafından onaylanan fâsid akitler de sahihe dönüşebilmektedir. Bu kısımla ilgili olarak günümüzde devlet otoritesi tarafından onaylanan fâsid akitlerin durumu açıklanmıştır. Son olarak, örf veya meşakkat vs. sebebiyle sahih hâle gelmemiş, fâsid olarak kalmış akitlerin mülkiyet değişimine sebep olup olmaması izah edilmiştir. Hanefî mezhebini merkeze almak suretiyle yaptığımız çalışmamızda konuyla ilgili fâsi d satım akitlerinin eşyanın özüne sahip olmaya/rakabe mülkiyetine sebep olduğu sonucuna ulaşılmıştır."
