abstract: "Cüveynî hicrî V. asırda yaşamış, Eş'arî kelâm ekolüne mensup bir âlimdir. Aynı zamanda, mütekaddim dönem Eş'arî kelâmının son âlimi ve müteahhir dönemin kendisiyle başlatıldığı Gazzâlî'nin hocasıdır. Kendisine kadar ulaşan ilmî geleneği hazmetmiş, yeniden yorumlamış ve mezhebinin gelişimine önemli katkılarda bulunmuştur. Böylece, mütekaddim dönemle müteahhir dönem arasında bir köprü vazifesi görmüştür. Düşünceleri klasik mantığın tanım anlayışına yakınlık gösteren Cüveynî, bilginin hakiki mânada tanımının yapılmayacağını savunmuştur. Ona göre bilgi ancak bölümleme yoluyla tarif edilebilir. Yani ne olduğu değil, ne olmadığı ortaya konabilir. Yaptığı bölümlemenin ardından bilgi 'kesin, vakıaya mutabık ve sürekli' bir inanç olarak ortaya çıkmaktadır. Bilgi temelde kadîm ve hâdis olmak üzere ikiye ayrılır. Kadîm bilgi Allah'a ait ezelî bir sıfatken hâdis bilgi insanın bir arazıdır. Hâdis bilgiyse zorunlu ve kesbî olmak üzere iki kısımdır. Bunlardan ilkinin elde edilmesinde insanın dahli bulunmamakta; ikincisiyse insanın çabasıyla elde edilmektedir. Bilgi özü itibariyle kesin ve zorunludur. Dolayısıyla kesbî ve zorunlu bilgi birbirinin mukabili değildir. Bilginin hasıl olması öncelikle Allah'ın dilemesine ve yaratmasına bağlıdır. Bilgi kaynakları her ne kadar zorunlu bilgiye ulaştırsalar da elde edilen bilginin zorunluluğu kaynakların kendi zatlarından kaynaklanmaz. Bunlar Allah'ın sürüp gitmesine izin verdiği âdet böyle devam ettiği için zorunludur. Adetullah'ın değişmesi durumunda bu bilgi kaynakları bilgi vermeyebilir. Dinin temeli olan Allah'ın varlığı, kelâmı ve bu kelâmının doğruluğu ancak akılla bilinebilir. Böylece aklı dinin temeline yerleştirmiştir. Allah'ın bilgisine ulaştıran nazar ise dinen vaciptir. Aynı şekilde, eşyanın iyiliği ve kötülüğü de ancak dinen bilinebilir. Böylece o ahlakın dini temelli olduğunu kabul etmiştir."
