abstract: "\"İslam Hukuku Açısından Nesep\" adlı tez, klasik fıkıh literatüründe yer aldığı şekliyle nesep hukukunu değerlendirmeyi amaçlayan bir çalışmadır. Ancak konu tüm fıkhi mezhepleri içine alacak şekilde ele alınmamış, Hanefî ve Şafiî mezhepleri ile sınırlandırılmıştır. Çalışmada ayrıca mümkün olduğunca Türk pozitif hukukunun ve tıp ilminin konuya bakış açıları da yansıtılarak bir değerlendirme ve tercih yoluna gidilmiş, bu bağlamda disiplinler arası karşılaştırmalı bir yöntem izlenmiştir. Çalışma giriş, üç ana bölüm ve sonuçtan oluşmaktadır. Birinci bölümde nesebin mahiyeti üzerinde durulmuş, nesebin tespit ve red yollarına yer verilmiştir. İkinci bölüm nesebin dinî ve hukukî sonuçları başlığını taşımaktadır. Bu bölümde gerek İslam hukuku gerekse Türk pozitif hukukunda nesebin etkisinin görüldüğü konular irdelenmiştir. Üçüncü bölüm ise neseple ilgili öne çıkan problemlere tahsis edilmiştir. Bu bölümde ilk olarak nesep tespitinde kullanılan çağdaş tıbbi teknikler ele alınmış, daha sonra modern üreme tekniklerine değinilmiş, bu tekniklerle dünyaya gelen çocukların nesebi belirlenmeye çalışılmıştır. Son olarak çalışmada ulaşılan sonuç ve tekliflere yer verilerek çalışma tamamlanmıştır."
