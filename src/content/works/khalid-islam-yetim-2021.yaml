abstract: "Bu çalışma, İslam'da yetim haklarını ortaya koymak amacıyla yapılmıştır. İslam dini yetimlere son derece önem atfetmiştir. Nitekim yetimlerin haklarını açıklamak ve onların işlerini düzenlemek üzere bir çok ayet nazil olmuş ve hadis varit olmuştur. Çalışmamız bir giriş ve iki ana bölümden meydana gelmiştir. Giriş bölümünde öncelikle araştırmanın konusu, önemi ve bu konuyu seçme gerekçemiz açıklanmış, sonra ise konumuz ile ilgili temel kavramların tarifi yapılmıştır. Birinci bölümde yetimlerin korunup gözetilmesi ile ilgili hususlar incelenmiştir. İkinci bölümde yetimin velayeti, mali hakları, yetim mallarının korunması ve üretilmesi, yetim malını yeme gibi konular ele alınmıştır. Tezin sonunda ise bu çalışmada ulaşılan belli başlı sonuçlar zikredilmiş ve konu ilgili bazı tekliflerde bulunulmuştur."
