abstract: "Araştırmanın amacı, öncelikler fıkhı kavramını ve İmam Cuveyni'nin (419-478/10281085) eserlerinde bu kavramın yerini incelemektir. Araştırmanın önemi, ileri gelen bazı fakihlerin düşüncesinde öncelikler fıkhının yeri üzerinde yapılan önceki çalışmalara akademik katkı yapmayı amaçlamasından yatmaktadır. Öncelikler fıkhı, terminolojide yeni gibi görünmesine rağmen, içeriği itibariyle fıkıh düşüncesinin temel işleyiş ilkelerinden biri, hatta belirli bir disiplinden bağımsız bir şekilde insan zihnin temel düşünce prensiplerinden biridir . Araştırma aynı zamanda, öncelikler fıkhında uygulamaya yönelik bazı kuralların belirlenmesi ve vurgulanmasını da amaçlamaktadır. Kavram İmam el-Cüveynî'nin eserleri çerçevesinde ele alınacaktır. El-Cüveynî özellikle usûl ve siyâset ilimlerinde önemli bir yere sahip olan“el-Ğıyasî”ve“el-Burhân”adlı eserlerinde kavramın modern kullanımındaki içeriğiyle ilişkilendirilebilecek ilke ve prensiplerden söz eder . Araştırma ayrıca, öncelikler fıkhının makâsıdu'ş-şerî'a, fıkıh usulü ve karşılaştırmalı fıkıh gibi içerik itibariyle yakın diğer fıkıh disiplinleriyle ilişkisini, benzerlik ve farklılıkları da göstermeyi hedeflemektedir . Çalışmada kavram özellikle, el-Cüveynî'nin öncelikleri belirlemeye verdiği önemi belirgin bir şekilde gösteren ve ilk onun tarafından geliştirildiği kabul edilen şer'î hükümlerin gerçekleştirmek istediği faydaların (maslahat) zarûrî, hâcî ve tahsînî şeklindeki üçlü derecelendirmesi çerçevesinde incelenecektir. Bu çerçevede el- Cüveynî'nin fıkıh öğretisinden ilkenin tatbikine yönelik hangi kuralların çıkarılabileceği sorgulanacaktır. Çalışmada konu, fıkhın bu yeni alanına, onun amacına uygun nitelikli bir katkıda bulunmayı amaçlayan bir yaklaşımla gerçekleştirilmiştir . Araştırma şu aşamalar izlenerek gerçekleştirilmiştir: (1) Öncelikler Fıkhı ile ilgili literatürün okunması, sonuçların karşılaştırılması ve çalışmada cevap aranacak soruların ve araştırmamın yönünü belirleyecek hipotezlerin tespiti. (2) El-Cüveynî'nin teorik eserlerinin okunması: Başta (el-Burhan, el-Varakât) ve temel konusu siyaset olmakla birlikte konumuzla ilgili önemli bilgiler içeren el-Ğıyâsî. (3) El-Cüveynî'nin أ“furû”eserlerinde öncelikler fıkhının uygulaması olarak değerlendirilebilecek meselelerin tespiti, tasnif edilmesi, ortak ve ayrışan yönlerin belirlenip analiz edilmesi. (4) Sonuçların araştırmanın başında belirlenen temel sorular ve hipotezlerle karşılaştırılması. (5) Araştırmanın sonuçlarının özetlenerek önceki araştırmaların sonuçlarıyla karşılaştırılması . Bu tezin hedeflediği akademik katkı şu şekilde özetlenebilir : • Modern bir kavram olmakla birlikte Öncelikler Fıkhı kavramının içerik olarak el-Cüveynî'in düşünce dünyasında neye karşılık geldiğinin gösterilmesi • Kavramın Makâsıd ilmi, Usul-i Fıkıh ve Karşılaştırmalı Fıkıh gibi diğer fıkıh dallarıyla olan ilişkisi belirlenmesi • Özelde Öncelikler Fıkhı çerçevesinde gelişmekte olan literatüre genelde el- Cüveynî'nin fikirleri, Fıkhı düşüncesi ve tarihi alanında yapılan araştırmalara katkı"
