abstract: "Bu çalışmada İmâm-ı Rabbânî Ahmed Sirhindî'nin, şerîat ve tarîkata dair görüşleri, en önemli eseri olan Mektûbât çerçevesinde incelenmeye çalışılmıştır. Şerîatı temel almış bir tasavvuf anlayışını benimseyen İmâm-ı Rabbânî'nin din, tarîkat ve hakikati bir bütünün parçaları olarak ele aldığı görülmektedir. İmâm, her fırsatta şerîat, tarîkat ve hakikatin birbirini tamamlayan unsurlar olduğunu dile getirmiştir. İmâm-ı Rabbânî, şerîat mı-tarîkat mı tartışmalarından arınmış, kitap ve sünnet ile temellendirilmiş bir tasavvuf anlayışını insanlar arasında hâkim kılmaya çalışmıştır. İçinde bulunduğu coğrafyada meydana gelen çalkantılar neticesinde İslâm esaslarının yerini bid'at ve hurafelerin aldığını gören İmâm, buna sebep olan fırkalara karşı büyük mücadeleler vermiş ve tecdid hareketini yaymaya çalışmıştır. İmâm, aklın ön plana çıkarılıp vahyi ve nübüvveti itibarsızlaştırmaya çalışanlar, Şîa propagandası yapanlar, tasavvufa şerîat esaslarına uymayan bazı inanç ve uygulamaları yerleştirerek meşru göstermeye çalışanlara karşı büyük mücadeleler vermiştir. İmâm-ı Rabbânî'nin Mektûbât'ı, her bakımdan büyük önem arz etmektedir. Mektuplarında Hz. Peygamber'e (s.a.v) tâzim, sünnete ittibâ, ashâb-ı kirâmın fazileti gibi birçok konuda eksik ve yanlış inanışları ortadan kaldırmayı amaçlamıştır. Müslümanları bid'atlardan sakındırmaya ve sünnet-i seniyyeyi uygulamaya teşvik etmiştir. Çalışmamızda bu konularla alakalı mektuplar da İmâm'ın şer'î ve tasavvufî hassasiyetleri çerçevesinde ele alınmıştır. Çalışmamızdaki esas gayemiz, İmâm-ı Rabbânî'nin Kur'ân ve sünnet çerçevesinde yapılandırdığı tasavvuf ile şerîatın irtibatını incelemektir. Şerîat- tarîkat arasındaki ayrılığı ortadan kaldırmayı amaçlayan İmâm, şerîata riayet konusunda dönemin bazı sûfîlerinin, şerîatı yok sayan bir tasavvuf anlayışını benimsemelerine ve meşrulaştırmalarına izin vermemiştir. Şerîatın şekilden ibaret olduğunu savunup, hakikatten uzaklaştırdığını iddia edenlere karşı, tasavvufun mahiyeti konusunda mektuplar yazmış ve hatalı olan sûfîleri eleştirmiştir."
