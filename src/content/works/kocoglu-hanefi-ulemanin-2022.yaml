abstract: "Birbirine eklemli olan iktidar ve ulemâ arasındaki münasebetin niteliği, var olan toplumun her alanındaki gelişimi dolayısıyla da refahı ile doğrudan ilgilidir. Zira İslâm toplumunda iktidarın temsilcisi halife, ilmin temsilcileri ise dini bilgiye sahip ulemâdır. Bu çalışma, Abbâsîlerin ilk asrında 133-236/750-850 Ebû Hanîfe ve talebelerinin devlet yöneticileriyle olan ilişkisini konu edinmektedir. Bu bağlamda ilk olarak, iktidar ve ulemâ kavramlarının kapsamı, iktidar-ulemâ arasındaki ilişkinin önemi, iktidar makamının icracısı olan halifenin seçilişi, meşrûiyeti, görevleri, ulemâya bakışı, idaresindeki âlimlerden istifadesi ele alınmıştır. Akabinde çalışma dönemini kapsayan ulemânın ilmi, siyasî, ekonomik durumları, iktidara yaklaşımları, yöneticilerle münasebetleri, özelde ise Hanefî ulemâsının iktidarla ilişkileri incelenmiştir. Toplum düzeninin sağlıklı zeminde devamını sağlama noktasında iktidar ve ulemânın birbirlerine muhtaç olduğunu, iki taraftan herbirinin zaman zaman diğerini kontrol etmeye çalıştığını, dinî değerleri önceleyen sultan/halifelerin ulemâya değer verdiklerini, yönetiminin kudretinin peşinde olan sultan/halifelerin ise güçlerine halel getirecek ulemâyı baskı veya kontrol altında tutmaya çalıştığı görülmüştür."
