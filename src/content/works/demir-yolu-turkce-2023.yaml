abstract: "Günümüz tefsir problemleri müfessirlerin Kur'an ayetlerini farklı yorumlamalarından dolayı ortak bir yorumda birleşememelerinden kaynaklanmaktadır. Bu yorum farklılıkları, başka konular olmakla birlikte genelde bilimsel tefsir, fıkhi konular, din devlet ilişkileri ve kıssalarla ilgili olmaktadır. Kur'an Yolu Türkçe Meal ve Tefsir adlı eser Diyanet İşleri Başkanlığı tarafından 2005 yılında basımı yapılmış güncel bir tefsir olmasından dolayı bu çalışmada bu tefsirin bahsedilen konulara yaklaşımları tespit edilmeye çalışılmıştır. Çalışma sırasında oluşturulan bölümlerin tarihi süreci özet olarak her bölümün girişinde ele alınmış, bölümlerin belirlenen konuları ile ilgili eser içerisindeki açıklamalara ulaşılmış, ulaşılan bu açıklamalar konu başlıklarına göre incelenmiş, konulara uygun yorumlar özetlenerek değerlendirilmiş ve bazı konular başka kaynaklarla da karşılaştırılarak o konuda sonuca ulaşılmıştır. Kur'an Yolu tefsiri bazı ayetlerin tefsirlerinde bilimsel tefsirden yararlanmış, ahkamın değişmesini kısmen kabul etmiş, çok eşlilik konusunda İslam'ın çok eşliliği getirmediğini, var olan bu uygulamayı düzene koyduğunu ifade etmiştir. İki kadının şahitliğinin birisi hatırlatıcı olmasından dolayı şahitlerin iki değil de bir tane olduğuna işaret etmiş, erkeklerin kadınlardan üstün değil, yaratılıştan farklı olduklarını belirtmiş, kadının mirastaki payını gelenekten uzaklaşmamıştır. Evlilerin zina cezasının bekarlarınki ile aynı olduğunu belirtmiş, recm cezasını tazir türünden bir ceza olarak görmüştür. Faizi fazlalık olarak açıklayıp yasaklığını ifade etmiş, kısasın gerekliliğini kabul etmiş, el kesme cezasının değişebilirliğini belirtmiştir. Kur'an Yolu tefsiri müslüman kadınların yabancılara karşı baş ve boyunlarının örtmelerini İslam'ın emri olarak görmüş, dış giysinin geçici bir tedbir olduğunu belirtmiş, yaşlı kadınlarda örtünün hafifletilmesini baş ve boyun olarak açıklamış, içki ve kumarın haram olduğunu belirtmiştir. Kur'an Yolu tefsirinin din devlet ilişkileri konusunda net bir açıklaması olmamış, bazı ayet yorumlarındaki çıkarımlardan eser içerisinde İslami bir devlet yapısının varlığına ulaşılmıştır. Kıssaların tarihte gerçekleştiğine uygun açıklamalar yapmış, kıssaların gayelerinin ders çıkarıp benzer yanlışlara düşmemek olduğunu ifade etmiş, kıssaların bazı yerlerinde Kitab-ı Mukaddes'ten alıntılar yapmıştır. Bu çalışmadaki varılan sonuçlarda Kur'an Yolu tefsirinin bahsedilen konularda zaman zaman gelenekten koparak kısmen modern yorumların etkisinde kaldığı görülmüştür."
