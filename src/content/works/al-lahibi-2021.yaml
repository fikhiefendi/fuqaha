abstract: "Elinizdeki bu tez, H. 552 yılında vefat eden usûlcü ve münâzaracı âlim Muhammed b. Abdilhamid el-Usmendî'ye ait“Bezlü'n-nazar fi'l-usûl”adlı önemli eserin ve müellifinin, Mısırlı Zeki Abdilberr ve Ahmed Ferid el-Mezidî gibi alimlerin tahkikleri haricinde, hak ettiği ilmî değerin verilmeden akademik camiada meçhul bırakılması, araştırmacıyı bu bağlamda müellifin hayat hikayesi, eserindeki usûl ile ilgili meselelerin ele alınışı, eserin ilmî değeri gibi konuları ihtilafa girmeden kısaca araştırmaya itmiştir. Usmendî kendi eserini münazara, cedel, kelam ilmi çerçevesinde kaleme almıştır. Bu da kendisinin fıkıh, fıkıh usulü, Arap dili grameri, kelam ve cedel ilimlerinde mahir olduğunu ve aklî-naklî delilleri yerinde ve ustaca kullandığını göstermektedir. Bununla beraber muhalif görüşü savunanların delillerini de zikrederek, aslında münakaşa ettikten sonra onlara verdiği cevaplar da, esasında onun alana hakim olduğunu ortaya koymaktadır. Bezlü'n-nazar fi'l-usûl eseri üzerinde duracak olursak, eserde birçok usûl konuları kısa bir şekilde ele alınmış, müellif tarafından bu konular ana iki kısımda kategorize edilmiştir. Birinci kısım da kendi içinde bölüm ve baplara ayrılarak, temelde usûl kitaplarındaki hakikat-mecaz, emir-nehiy, umum-husus, mutlak-mukayyed, mücmel-mübeyyen, haber, icma, nesih, istihsan, istishab, sahabe kavli, şer'u man kablena, Kur'ân, sünnet, icma, kıyas gibi konuları kabul edenler ve etmeyenlerin delilleri ile beraber ele alınmıştır. İkinci kısımda ise usûl ilgili spesifik konular incelenmiş, kitabın ağırlıklı bölümünü oluşturan bu kısımda ise konularla ilgili görüşler delilleri ile beraber tartışılmış, müellif tarafından münazara ve cedel ilmi çerçevesinde detaylıca ele alınmış, bütün bu konular araştırmacı tarafından detaylıca incelenerek önemli sonuç ve bulgulara ulaşılmıştır."
