abstract: "el-Hidâye, Mergînânî'nin Hanefî fıkhını incelediği bir eserdir. Bu kitapta miras hukuku hariç fıkhın bütün konuları yer almıştır. Eserde İmam Şâfiî'nin Hanefilerden farklı görüşlerine işaret edilmiştir. İmam Şâfiî'nin bu görüşlerini araştırmak için bu çalışma yapılmıştır. Tezde İmam Şâfiî'nin, anlatılan görüşe katılmadığı 201 mesele ele alınıp incelenmiştir. Çalışmamızda, Mergînânî'nin 155 yerde İmam Şâfiî'ye atfettiği görüşte isabetli, 46 yerde ise müftâ bih görüşe muhalefet ettiği görülmüştür. Tahlil edilen 201 görüş, Şâfiî kaynaklardan ilk olarak İmam Şâfiî'nin“el-Ümm”, Mâverdî'nin“el-Hâvi'l-Kebîr”, Şirâzî'nin“el-Mühezzeb”ve Şirbînî'nin“Muğni'l-Muhtâc”adlı eseri esas alınmıştır. Bu eserlede bulunmayan görüşler için diğer Şâfiî kaynaklarına müracaat edilmiştir. Ayrıca Hanefi mezhebinden özellikle Hidâye'nin şerhlerine de bakılmıştır."
