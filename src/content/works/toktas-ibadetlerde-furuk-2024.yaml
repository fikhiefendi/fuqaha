abstract: "Furûk-u fıkhiyye, fıkhî meselelerin sûreten benzer yönleri ile aralarındaki farkları araştıran ve ortaya çıkaran ilmin adıdır. Zamanla fıkhın bir alt disiplini olarak temayüz etmiştir. Çalışma h. 489 ile 558 yılları arasında Yemen'de yaşamış Şâfiî mezhebine mensup İmrânî'nin“el-Beyân”adlı eserinin, ibadetler bölümünde yer alan“Furûk-u fıkhiyye”meselelerinin tespit ve tahlilidir. Bu nedenle öncelikli olarak eserde yer alan furûk-u fıkhiyye ile alakalı örnekler incelenmiştir. Bir sonraki adımda furûk'un şartlarını taşıyan örnekler konu başlıklarına göre tasnif edilmiştir. Çalışmanın amacı Furûk-u fıkhiyye örneklerini tahlil ederek fıkıh melekesinin artması ve fıkıh mantalitesinin gelişimine katkı sağlamak. İslam hukuku mirasının daha iyi anlaşılmasını sağlamakla beraber İmrâni ve el-Beyân adlı eserinin daha iyi tanıtılmasını amaçlamaktadır. Çalışma, bir giriş ve üç bölümden oluşmaktadır. Giriş bölümünde araştırmanın konusu, amacı, kapsamı ve önemi hakkında bilgiler verilmiştir. Birinci bölümde İmrânî'nin yaşadığı toplumun ilmi ve siyasi durumu, müellifin hayatı, eserleri, hocaları hakkında izahatta bulunulmuştur. İkinci bölümde Furûk-u fıkhiyye'nin mahiyeti, önemi, kendisiyle ilintili olan kavramlar ve tarihsel süreçte geçirmiş olduğu evreler ele alınmıştır. Üçüncü bölümde el-Beyân eserindeki ibadetler konu başlığında ele alınan Kitabu't-taharet, Kitabu's-salât, Kitabu'l-cenâiz. Kitabu'z-zekât, Kitâbus-sıyam ve Kitabu'l-hac ile ilgili 60 furûk örneği incelenmiş ve tespit edilen her örneğin akabinde meselenin tahlili yapılmıştır. Eser geniş ve mufassal olduğundan bunların içerisinden sadece furûk-u fıkhiyye'nin ruhunu ve mantalitesini öne çıkaran meseleler ele alınmıştır. Yapılan incelemeler neticesinde Furûk-u fıkhiyye örneklerinin tespit ve tahlilini yapabilmek için nas ve dil bilgisinin yanında fıkıh melekesinin de olması gerektiği sonucuna varılmıştır."
