abstract: "“el-Cassâs'ın (ö. 370/917) Ahkâmü'l-Kur'ân'ında Kullandığı Hadislerin Kaynakları ve Değeri -Tahâretle ilgili Rivâyetler Örnekliğinde-”başlığını verdiğimiz bu çalışmada el-Cassâs (ö. 370/917)'ın Ahkâmü'l-Kur'ân'ında, Mâide suresinin 6. âyetini tefsir ederken tahâret başlığı altında kullandığı rivâyetler değerlendirilmiştir. Değerlendirmelerimiz neticesinde el-Cassâs'ın (ö. 370/917), ahkâm âyetlerini tefsir ederken konuyla ilgili birçok rivâyete yer verdiği, bu rivâyetlerin bazılarını muttasıl senedle, bazılarını munkatı' senedle bazılarını ise senedsiz olarak kullandığı ancak kaynaklarını belirtmediği tespit edilmiştir. Bu tespitlerden hareketle tasnif dönemi eserlerin daha sonraki yüzyılda yazılan eserlere nasıl ve ne kadar yansıdığının ve Hicrî dördüncü asırda yazılan eserlerin sened-metin açısından benzerlik ve farklılıklarının belirlenmesi amaçlanmıştır. Bu çerçevede Ahkâmü'l-Kur'ân'da bulunan rivâyetlerin, Abdürrezzâk es-San'ânî'nin (ö. 211/826-27) Musannef'i, İbn Ebî Şeybe'nin (ö. 235/849) Musannef'i, Kütüb-ü Tis'a, Tahâvî'nin (ö. 321/933) Şerh'u Meâni'l-âsâr'ı, İbn Hibbân'ın (ö. 354/965) Sahih'i, İbn Huzeyme'nin (ö. 311/924) Sahih'i, Dârekutnî'nin (ö. 385/995) Sünen'i içerisinde olup olmadığı araştırılmıştır. el-Cassâs'ın (ö. 370/917) söz konusu bölüm içerisinde kullandığı rivâyetler kaynak eserlerde bulunan rivâyetlerle ayrıntılı bir şekilde karşılaştırılmış ve rivâyetler konularına göre müstakil başlıklar altında toplanmıştır. İncelemelerimiz sonucunda söz konusu rivâyetlerin büyük çoğunluğunun sened ve metin farklılıklarıyla birlikte kaynak eserlerde yer aldığı görülmüştür."
