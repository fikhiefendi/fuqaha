abstract: "Şîa'nın en kabul gören kollarından biri olan hatta zaman zaman da Şîa ile eşanlamlı olarak kullanılan İmâmiyye ya da İsnâaşeriyye'nin usul yaklaşımını ele aldığımız“Klasik Dönem Şiî-İmâmî Fıkıh Usulü Anlayışı”isimli bu araştırma, Giriş ve dört bölümden oluşmaktadır. Giriş bölümünde tezin önem, amaç ve yöntemine ilişkin bilgilerin yanında İmâmiyye'nin teşekkül sürecinden ve Ebû Ca'fer et-Tûsî'ye kadar fıkıh usulünün kat ettiği aşamalardan söz edilmiş ve görülmüştür ki fıkıh usulü, XII. imamın gaybetini müteakip Usûliyyûn ekolüne mensup isimlerin gayretleriyle doğmuş, gelişmiş ve tekâmül etmiştir. Birinci bölümde İmâmiyye'nin haber anlayışı ve âhâd haberle ameldeki metodu ortaya konulmaya çalışılmıştır. Bu bölümdeki tespit ve değerlendirmeler çerçevesinde, Tûsî tarafından teorik olarak ortaya konulan gerek âhâd haberle amel etme metodunun ve gerekse de haberler arasındaki teâruzu giderme yollarının nesnel olmadığı, mezhebî kaygı ve sâiklerle hareket edildiği sonucuna varılmıştır. İkinci bölümde hitabın kısımları ve anlama delâlet şekilleri; üçüncü bölümde ise şer'î hükümler hakkında bilgi verilmiştir. Bu meyanda emir-nehiy; umum-husus; mutlak mukayyed; mücmel-mübeyyen; nâsih-mensûh lafzın anlama delâletinin kalıpları olarak kabul edilmiş, yükümlülük teorisi ise dört esas terim üzerine kurulmuştur. Buna göre, haram kabih kapsamında; mubah, mendup, vâcip ise hasen kapsamında yer almaktadır. Dördüncü bölümde ise kabul gören veya reddedilen delil ve yöntemler değerlendirmeye tabi tutulmuştur. Kıyas ve ictihad aynı içerik ve işleve sahip olan iki kavram olarak telakki edilmiş ve usulde bir yöntem olamayacağı belirtilmiştir. İcmâ ise imamların kavlini keşfetmede bir yöntem olması açısından müstakil değil, şeklî anlamda bir delil olarak kendine yer bulabilmiştir. Buna mukabil, Kitap, ahbâr, Hz. Peygamber'in fiilleri, istishâb muteber deliller olarak kabul görmüştür. ("
