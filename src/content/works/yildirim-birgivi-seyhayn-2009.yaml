abstract: "?Birgivî'nin Şeyhayn (Burhânüşşerîa ve Sadrüşşerîa) Savunması? isimli tezde Birgivî'nin Risâle fî reddi'l-ıslâh ve'l-îzâh isimli eseri çerçevesinde Burhânüşşerîa, Sadrüşşerîa, Kemalpaşazâde ve Birgivî arasında geçen tartışma aktarılmıştır.Tez, bir giriş ve üç bölümden oluşmaktadır. Giriş bölümünde tezin konusu, amacı, önemi ve tezde takip edilen yöntem belirlenmiştir.Birinci bölümde ?Reddiye kavramı ve Birgivî'nin ?Risâle fî reddi'l-ıslâh ve'-l îzâh? isimli eseri hakkında bilgi verildikten sonra tezde eserlerini incelenen müelliflerin biyografileri, konuya başlamadan önce araştırmacının zihninde bulunması ve konuyu anlamaya yardımcı olması için aktarılmıştır. İkinci bölümde Birgivî'nin risâlesindeki sıra takip edilerek, konu hakkında önce Burhânüşşerîa'nın ve Sadrüşşerîa'nın görüşleri verilmiştir. Sonrasında Kemalpaşazâde'nin bu iki müellife yöneltmiş olduğu eleştiriler aktarılmış ve son olarak da Birgivî'nin bu eleştirilere verdiği cevaplar (yani Birgivî'nin savunması) ile bu bölüm bitirilmiştir.Sonuç bölümünde de Kemalpaşazâde'nin eleştirileri ve Birgivî'nin savunması genel hatlarıyla değerlendirilmiştir."
