abstract: "Katılım bankaları günümüzde insanlar tarafından oldukça tercih edilmektedir. Bu tercihin altında yatan etmenleri başta dini inançlar olmak üzere ekonomik ve sosyal nedenler olmak üzere üç grupta toplayabiliriz. Özellikle inançları gereği ellerinde bulunan fonları faize yatırmak istemeyen faize duyarlı olan insanlar katılım bankaları aracılığı ile fonlarını değerlendirebilmektedir. Katılım bankaları bu özellikleri ile klasik bankaların hem alternatifi hem de tamamlayıcısı konumundadırlar. Dünyada başta körfez ülkeleri olmak üzere atıl fonların ekonomiye kazandırılması açısından 1960'lı yıllardan itibaren gelişme gösteren katılım bankaları ülkemizde de 1980'li yıllardan itibaren hızla gelişmeye başlamış ve günümüzde bu bankaların rakamları incelendiğinde klasik bankaların alternatifi konumuna ulaştıkları görülmektedir. Ancak katılım bankalarının müşterilerine sunduğu ürünlerin çeşitliliği ve bu ürünlerin kullanım koşulları incelendiğinde klasik bankalara göre oldukça sınırlı kalmaktadır. Bu da katılım bankalarının daha çok klasik bankaların tamamlayıcısı olmasına neden olmaktadır. Katılım bankaları bir ekonominin gelişme göstermesi açısından çok önemlidir. Reel ekonomi açısından çok önemli olarak görülen Küçük ve Orta Boy İşletmeler (KOBİ)'in klasik bankalardan finansman sağlama özelliği sınırlıdır. Ancak katılım bankaları sağladıkları ürünlerle reel ekonomi için can damarı olarak görülen Küçük ve Orta Boy İşletmeleri (KOBİ) klasik bankalara göre daha rahat finanse edebilmekte ve ülke ekonomisinin büyümesine katkı sağlamaktadır. Başta ülkemiz olmakla birlikle tüm dünya ülkelerinde atıl fonların ekonomiye kazandırılması ve ihtiyaç duyanlara aktarılması açısından katılım bankalarının teşvik edilmesi gerekmektedir."
