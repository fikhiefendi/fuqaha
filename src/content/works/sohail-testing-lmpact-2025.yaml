abstract: "Araştırma, COVID, Glasgow İklim Paktı, Ukrayna Savaşı ve ChatGPT Lansmanının G7, GCC, Türkiye ve Pakistan'daki konvansiyonel ve İslami hisse senedi endeksleri üzerindeki etkisini araştırmayı amaçlamaktadır. Yazarın bilgisine göre, bu dört olayı bir arada ele alarak etkilerini inceleyen ilk çalışmadır. Araştırmacı, bu dört olayın etkisini analiz etmek için olay çalışması metodolojisini kullanmıştır. Araştırmacı, elindeki verilerden yararlanarak, bahsi geçen olaylara bağımlı olmayan çeşitlendirme amacıyla ek bir tahmin yöntemi (DCC MGARCH) de kullanmıştır. Sonuçlar, G7 piyasalarının COVID'in küresel bir pandemi olarak ilan edilmesinden önce genel olarak negatif olduğunu göstermektedir. GCC endekslerinin çoğu COVID'e karşı istikrarlıydı. G7 piyasaları, Glasgow İklim Paktı'na genel olarak olumsuz tepki vermiştir. GCC endekslerinin çoğu ise GCP'ye karşı istikrarlıydı. G7 endeksleri Ukrayna Savaşı'na genelde olumsuz tepki verirken, GCC endeksleri Ukrayna Savaşı'na genel olarak istikrarlı kalmıştır. G7 ve GCC endekslerinin çoğu, ChatGPT Lansmanı'na karşı olumsuz tepki vermiştir. Dinamik Koşullu Korelasyon, G7 İslami ve Konvansiyonel hisse senedi endeksleri arasında orta düzeyde bir çeşitlendirme olduğunu göstermektedir. GCC İslami ve Konvansiyonel endeksleri arasındaki DCC ise 0.2'den düşüktür ve daha fazla çeşitlendirme imkanı sunmaktadır. Yatırımcılar, daha az riskle daha iyi getiri elde etmek için G7 ve GCC hisse senedi endeksleri arasında portföylerini çeşitlendirebilirler."
