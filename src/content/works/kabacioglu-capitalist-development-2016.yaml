abstract: "Günümüzde İslami sermaye yalnızca Türkiye'nin ekonomik, politik ve kültürel gündeminde merkezi bir yere sahip olmakla kalmayıp aynı zamanda güncel bir rol model olarak Ortadoğu'yu da etkilemektedir. İslami sermayenin çağdaş temsilcileri olan muhafazakar girişimciler, toplum içinde yükselen bir tabakayı oluşturmakta ve toplumsal ve siyasal alanın organizasyonunu ve ülkenin iktisadi, ahlaki ve kültürel yapılarını etkilemektedir. Bu bağlamda, Türkiye en güçlü İslami ekonomik örgütü olan MÜSİAD, 'İslami/muhafazakâr burjuvazi' içerisinde bu terimi tanımlaması, organize ve temsil etmesi ve kurumsallaştırması hasebiyle ayrı bir konuma sahip olup yapısal ve kültürel doğası gereği de en önemli tarihsel aktördür. MÜSİAD bir iş adamları derneği olarak İslami çıkar sunumunun taşıyıcısı konumunda olmasından ötürü günümüz Türkiyesinde İslamcı hareketin politik ekonomisinin gelişiminin tahlilinde büyük ilgiyi haketmektedir. Bu bağlamsal çerçevede bu tez, son dönemde Türkiye politik ekonomisinin dönüşümü sürecinde İslami çıkarların oluşumu ve temsilinin Türkiye'de modernleşen İslam'ın yaşamın sosyo-ekonomik, siyasal, kültürel ve dini yönlerine etki eden çok boyutlu bir olgu olduğu hususunu İslami bir işadamı derneği örneği üzerinden analiz etmiştir. Tez, Türkiye'de kapitalist gelişmenin dönüşümünü ve İslami sermayenin yükselişini sosyo-ekonomik, politik, kültürel ve dinsel yönlerle ilişkisi içerisinde inceleyerek böylesi bir iktisadi-etik-estetik dönüşümüne neden olan unsurları tarihsel ve kavramsal bir çerçevede tahlil etmiştir."
