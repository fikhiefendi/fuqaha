abstract: "KAHRAMANMARAŞ SÜTÇÜ MAM ÜN VERS TESSOSYAL B L MLER ENST TÜSÜTEMEL SLAM B L MLER ANAB L M DALIÖZETYÜKSEK L SANS TEZMEZHEPLERE GÖRE CEZA EHL YET VE GÜNÜMÜZHUKUKUYLA MUKAYESESÜmit KARSLIDANIŞMAN: Yrd. Doç. Dr. Nuri KAHVECYıl: 2006, Sayfa: 79Jüri: Yrd. Doç. Dr. Nuri KAHVECProf. Dr. H. Ezber BODURYrd. Doç. Dr. zzet SARGINKurallar bütünü olan hukuk insan hayatında vazgeçilmez bir öneme sahiptir.Hayatı anlamlandıran ve yaşanır kılan yine hukuktur. Bir toplumda hukuk kurallarınauyulduğu oranda huzur ve emniyettin varlığından söz edilebilir. Hukuk kurallarıinsanların geneli göz önünde bulundurularak konulmaktadır.rade ve ehliyet sahibi insan sorumluluk yüklendiği ölçüde hayattan lezzet alır veyaşamı o oranda anlam ve önem kazanır. Ceza ehliyetine sahip olan şahıslar yaşadıklarıtoplumlarda hukuk kurallarına uymak mecburiyetindedirler. Uymadıkları takdirdehukukun kendilerine uygun gördüğü müeyyidelere de katlanmak zorundadırlar. Suçişleyen birisi işlemiş olduğu suçtan dolayı cezalandırılacağını bilmeli ve ona göre hareketetmelidir. Ayrıca hukuka aykırı bir fiil gerçekleştiren kişi herhangi bir baskıya maruzkalmadan kendi hür iradesi ile bu fiili işlemiş olmalıdır.Suçlar mevcut toplum düzenini bozmaya yönelik davranışlar olarakdeğerlendirilmektedir. Toplum düzenini ve insanların menfaatlerini korumak için suçişleyen kişilerin gerekli cezalarla cezalandırılmaları gerekmektedir. Bu cezayı koyandauygulayanda devletin yetkili kurumları olmalıdır. Bu hak sadece ve sadece devlete aittir.Cezalar hukuka uygun olmalıdırlar."
