abstract: "Mer'i hukukta fiil ehliyeti başlığı altında düzenlenen ve İslam hukukunda eda ehliyetinin kapsamına giren hükümlerin İslam hukukundaki yerini görmeye çalışmak tezin temel amacıdır. Ehliyet kavramının ve bu kavramın daha başta vücub-eda, hak-fiil ehliyeti şeklindeki ayrımların içeriğini anlamak, fiil ehliyetinin mer'i hukukta nasıl sistematize edildiğini görmek ve fiil ehliyetinin her bir hukuk sisteminde nasıl derecelendirildiği ve her bir derecede her iki hukuk sisteminde hangi hükümlerin getirildiğini incelemek tezin asıl kapsamını oluşturmaktadır. İlk bölümde konu İslam hukuku bakımından ele alındı. İkinci bölümde mer'i hukukun fiil ehliyetine bakışı incelendi. Bu inceleme esnasında konulara müteradif olarak İslam hukukunun yaklaşımı belirtilmeye çalışıldı. Üçüncü bölümde fiil ehliyeti bakımından nasıl bir tasnife gidildiği bu tasniflerin gerektirdiği hükümler yine mukayeseye uygun biçimde ortaya konulmaya çalışıldı. Tezi hazırlarken konunun aslında çok geniş bir kapsamının olduğu bu geniş kapsam karşısında detaylara indikçe tezin amacından kopabileceği nazara alınarak, mer'i hukukta ve İslam hukukunda öne çıkan kaynaklar tespit edildi. Bu kaynakların dışına çıkmamaya özen gösterildi. Mer'i hukukta medeni kanunun değiştiği dikkate alınarak öncelikle öğretide yeni dönemde yazılan kaynaklara önem verilmekle beraber yapılan değişikliğin bir çok konuda öze dair olmayıp lafzi olduğu bilindiğinden önceki dönem kaynaklardan da istifade edildi. İslam hukukunda kaynak belirlemesi yapılırken kapsamın genişliği nedeniyle kaynaklarda mümkün mertebe sınırlamaya gidildi. Temel kaynaklara gidilirken mezhepler arasında denge korunmaya çalışıldı ise de Hanefi ve Şafii mezheplerinin kaynakları daha fazla tercih edildi. Modern zamanlarda yazılmış eserler ve ansiklopedik kaynaklarda ihmal edilmemeye çalışıldı. Her iki hukuk sisteminin netice itibariyle birbirine çok yakın ve benzer hükümler ihtiva ettiği görülmektedir. İslam hukukunda konu, insan hayatını ilk başlangıcından itibaren devrelere ayırıp, her bir devre için hükümler koyma yoluna giderek sistemleştirilmiştir. Mer'i hukukta ise önce konu ile ilgili kavramsal tanımlamalar yapılıp bu tanımlar çerçevesinde sistematize edildiği görülmektedir."
