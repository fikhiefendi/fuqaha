abstract: "Bu çalışmada Osmanlı'nın son dönem âlimlerinden Beyazıt dersiâmı ve Mektebe-i Hukûk muallimi Ermenekli Süleyman Sırrı Efendi'nin hayatı, eserleri ve ibadet bahisleri bağlamında fıkhî düşüncesi tesbit edilmeye çalışılmıştır. Tez üç ana bölümden oluşmaktadır. Birinci bölümde Süleyman Sırrı Efendi'nin hayatı ve eserleri incelenip tanıtımları yapılmıştır. Süleyman Sırrı Efendi'nin çok yönlü, velüd ve aktif bir ilim adamı olduğu müşâhede edilmiştir. İkinci bölümde Sırrı Efendi'nin fıkha dair eserleri incelenmiştir. Sırrı Efendi'nin Hanefî fıkıh metinlerine âşina olduğu gözlemlenmiştir. Özellikle Mecelle'ye olan hayranlığı sebebiyle el-Hidâye ve el-Eşbâh ve'n-Nezâir adlı eserlere yaptığı şerhlerde ki usûl kurallarını ve külli kaideleri kullanmaktaki mehâreti dikkat çekmektedir. Üçüncü bölümde Sırrı Efendi'nin fıkıh anlayışı tesbit edilmeye çalışılmıştır. Sırrı Efendi'nin müteşeddid denilebilecek seviye de Hanefî fakîhi olduğuna ve İmâm-ı Âzam'a olan ittibâsına şâhid olunmuştur. Hanefî fıkıh ve usûl metinlerine aşina olduğu ve bunun sonucu olarakta fıkhın furûu ve usûl meselelerine vâkıf olduğu müşâhede edilmiştir. Sırrı Efendi sahip olduğu bu ilmî birikimi talebeler yetiştirerek ve yaşadığı dönemin sorunlarına çözümler bulmak amacıyla geceli gündüzlü çalışıp eserler telîf ederek sonraki nesillere bırakmıştır."
