abstract: "?Muhammed Hanefî Cengi: Metin-Muhteva-Tahlil? adını verdiğimiz bu çalışmada Tursun Fakih'e ait cenk-nâmenin tenkitli metnini vererek eseri dinî ve tasavvufî edebiyat açısından tahlil etmeye çalıştık.Çalışmamız Giriş dışında üç bölümden oluşmaktadır. Giriş'te, Mu-hammed b. Hanefiyye'nin hayatı işlenerek konunun daha iyi anlaşılabilmesi için cenk-nâmeler hakkında genel bir değerlendirme yapılmıştır.Birinci bölümde cenk-nâme yazarı Tursun Fakih'in hayatı ve diğer cenk-nâme yazarları hakkında kısaca bilgi verilmiş ve Cenk-nâme dil, şekil ve üslup açısından incelenmiştir.İkinci bölümde Cenk-nâme'de yer alan dînî ve tasavvufî kavramlar tes-pit edilmiş ve tahlîli yapılmıştır.Üçüncü bölümde ise Cenk-nâme nüshalarının tavsifi yapılarak Cenk-nâme'nin tenkitli metnine yer verilmiştir."
