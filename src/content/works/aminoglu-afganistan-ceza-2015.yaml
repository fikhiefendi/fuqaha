abstract: "Bu çalışmada, Afganistan Ceza Kanunu'nda kısas ve had ile ilgili öngörülen tazirî cezalar, İslam Ceza Hukuku açısından değerlendirilmektedir. Çalışma, giriş ve üç bölümden oluşmaktadır. İlk olarak Afganistan Ceza Kanunu hakkında genel bilgiler verilmekte ve söz konusu ceza kanununu ortaya çıkaran amiller incelenmektedir. Çalışmanın, mukayeseli bir çalışma olması bakımından önce İslam Ceza Hukuku açısından had, kısas ve diyet konuları ele alınmaktadır. Ayrıca Afganistan Ceza Kanunu'nda had ve kısasla ilgili öngörülen tazirî cezalar incelenerek, özel olarak Hanefî fıkhı ve gerekli görüldüğü yerlerde de diğer mezheplerin görüşleriyle mukayeseler yapılmaktadır. Çalışmanın çıkış noktası, Afganistan'da Ceza Kanunu nasıl ortaya çıkmıştır? Afganistan Ceza Kanunu'nda kısas ve hadlerle ilgili cezalar nasıl ele alınmıştır? Afganistan Ceza Kanunu'nda taziren öngörülen cezalar, İslam Ceza Hukuku Açısından değerlendirildiğinde, benzer yönleri ve ayrıldığı noktalar nelerdir? gibi sorulardır. İşte bu soruların cevabı, özellikle 1919'dan itibaren çıkartılan nizamnameler, anayasalar ve ceza kanunları ile birlikte, diğer kaynaklar ve İslam hukukunun temel kaynakları araştırılarak, verilmeye çalışılmaktadır. Şimdiye kadar Afganistan'da bu konuyla ilgili özgün bir çalışmanın yapılmamış olması dolayısıyla tezimiz, bundan sonra yapılacak çalışmaları güçlendirecek bir araç olarak kullanılabilir. Anahter Kelimeler: Had, Kısas, Diyet, Tazir, Nizamnâme."
