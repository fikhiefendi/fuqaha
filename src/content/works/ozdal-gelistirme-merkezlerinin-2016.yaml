abstract: "Ulaşım, iletişim ve üretim teknolojilerinin günden güne gelişmesi, insanların ihtiyaçlarının farklılaşarak artması, üretilen mal ve hizmetlerin çeşitliliğinin artmasına ve dolayısıyla rekabetin artmasına ivme kazandırmıştır. Böyle bir ortamda özellikle KOBİ'lerin yola çıkması ve ayakta durması daha zor hale gelmiştir. KOBİ'leri destekleyecek modeller üzerinde dünyada ve ülkemizde çeşitli çalışmalar ve organizasyonlar yapılmıştır. KOBİ'leri desteklemek amacı ile ülkemizde 1990 yılında KOSGEB kurulmuştur. KOSGEB ülkemizde yeni işletme kuran girişimcilerimizi başarılı bir şekilde desteklemektedir. KOSGEB yeni işletme kuran girişimcilerin, kırılgan oldukları ilk yıllarını, başarılı bir şekilde geçirerek, kendi ayakları üzerinde durup, yoluna devam etmesi için finansal destekler sunmaktadır. Globalleşen dünyada girişimcilerin yeni ürün ve hizmetler üreterek, yeni pazar payları bulup başarılı olabilmeleri için, sistemli ve organizasyonel bir yapıya ihtiyaçları vardır. Bu yapıyı son zamanlarda ortaya çıkan, uygulamaları dünyada ve Türkiye'de büyük başarılar elde eden, girişimcilere önemli hizmet ve destekler sunan İŞGEM modeli ortaya koymuştur. İŞGEM modeli, KOSGEB ile işbirliği içerisinde çalışan sistemli bir yapıdır. İŞGEM bünyesinde barındırdığı girişimcilere çok uygun kiralar ile mekânlar sunar. Bu mekânlara işlik denir. Bu işlikleri gerekli makine ve teçhizat ile donatma konusunda; İŞGEM bünyesinde bulunan girişimcileri, KOSGEB doğrudan hibe ve faizsiz kredi destekleri ile desteklemektedir. Bu destekler ile işlikler birer işletme haline gelir. İŞGEM, bünyesinde barındırdığı işletmelere, danışmanlık, ortak ofis kullanımı ve pazarlama hizmetleri de sunar. Bu çalışmada İŞGEM'lerin ekonomik sisteme etkileri ve katkıları incelendi. İŞGEM'ler KOSGEB ile işbirliği içerisinde çalışarak, yeni işletmelerin kurulması ve istihdamın artması için girişimcileri destekleyen sistemli bir yapıdır. Yeni işletmelerin kurulması ile istihdam artar, işsizlik azalır, insanların satın alma gücü artar, üretim artar, üretimin artmasıyla birlikte bol miktarda bulunan mal ve hizmetlerin fiyatları düşer. Böylece ekonomide canlanma olur. Bu çalışmada model olarak, başarılı bir İŞGEM modeli olan Van İŞGEM incelendi. VAN İŞGEM bünyesinde bulunan, girişimci ve işletme çalışanlarından oluşan 50 kişi ile yapılan anketler neticesinde, girişimcilerimizin aldıkları hizmetler ve destekler incelendi. VAN İŞGEM modelinin kuruluşundan bu yana ekonomiye katkıları araştırıldı.Bu çalışmanın, mevcut İŞGEM'lere katkılar sunacağı ve yeni kurulacak İŞGEM'lere de yol gösterici olacağı düşünüldü."
