abstract: "Müteahhir dönem Hanefî usûl düşüncesinin en önemli temsilcilerinden kabul edilen Sadrüşşerîa'nın Tenkîhu'l-usûl isimli metni ve şerhi et-Tavzîh fî halli gavâmizi't-Tenkîh Osmanlı usûl düşüncesini şekillendiren eserlerden biridir. Bu eserler Osmanlı medreselerinde daha çok Teftâzânî'nin et-Telvîh ilâ keşfi hakâʾiki't-Tenkîh isimli hâşiyesi ile okutulmuştur. Osmanlı âlimleri de genellikle Telvîh'e hâşiye yazarak Tenkîh literatürüne katkı vermiştir. Kemalpaşazâde müderrislik yaptığı dönemde Telvîh üzerine kısmî bir hâşiye kaleme almış ve daha sonra Tenkîh'i de şerhetmiştir. Ancak şerh esnasında Tenkîh'in ibarelerine aktif müdahalede bulunarak metni yeniden üretmiş ve sayfa kenarlarına birçok not eklemiştir. Yeniden ifadelendirme, bilgiyi tashih etme, takdim-tehir, yeni konu ekleme, konu çıkarma, sistematiği değiştirme, örneği değiştirme ve illeti değiştirme gibi müdahaleler eserde öne çıkan değişikliklerden bazılarıdır. Müellifin, yaptığı bazı değişikliklerde Teftâzânî'nin Telvîh'te dile getirdiği eleştirileri de etkili olmuştur. Kemalpaşazâde şerhi oluştururken Tavzîh ve Telvîh'ten yararlanmış ve yer yer bu eserlerin ibarelerine de müdahale etmiştir. Her üç eserin ibarelerinde yaptığı değişikliklere sayfa kenarlarına yazdığı notlarla işaret etmiştir. Kemalpaşazâde, bazen sarih bazen zımnî bir şekilde bazen de sert bir üslupla Sadrüşşerîa ve Teftâzânî'ye eleştiriler yöneltmiştir. Bunun yanında kendi ilmi ve fikri çabasının mahsulü olduğunu ileri sürdüğü yorum ve katkılarını dile getirmiş ve bunlara yine sayfa kenarlarında işaret etmiştir. Çalışmamızda, Kemalpaşazâde'nin Tağyîrü't-Tenkîh adıyla meşhur olan et-Tavzîhu'l-musahhah şerhu't-Tenkîhi'l-münekkah adlı eserinin içerik analizi yapılmış; eserin ne gibi değişiklik, yorum ve eleştiriler ihtiva ettiği, temsil kabiliyeti yüksek örnekler üzerinden bir sınıflandırma yapılarak incelenmiştir."
