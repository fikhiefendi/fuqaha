abstract: "Tez, miras payının devrini konu edinir. Miras payının devri, mirasçı ya da mirasçı olma ümidini taşıyanların miras menfaatinden öncelenmiş biçimde istifade etmesini sağlayan hukuki kurumdur. Mirasın açılmasıyla birden fazla kişinin mirasçı sıfatını taşıdığı durumda, mirasçılar arasında tereke değerlerini konu alan elbirliği ile hak sahipliği kurulur. Dolayısıyla mirasçının, miras intikalinden tek başına ve efektif biçimde yararlanması en erken terekenin paylaşılmasıyla mümkündür. Gözlemlere göre, terekenin paylaşım zamanı çoğu durumda öngörülebilir değildir. Bu da mirasçının kendisine intikal eden mirastan pratikte faydalanamaması gerçeğini beraberinde getirir. Pek çok hukuk sisteminde miras payının devri, seçenek olarak mirasçıya sunulur. Mirasçı böylelikle, terekenin paylaşılmasını beklemeden miras menfaati devşirebilir. Miras payının devrine yüklenen misyon, temel olarak, mirasçının likit ihtiyacına erken kavuşmasıdır. Mirasçı, yasaların tanıdığı sınırlar içinde kalacak şekilde miras payının devrini konu alan sözleşmeler kurarak likit ihtiyacını karşılayabilir. Tez, bu misyonu göz ardı etmeksizin miras payının devri sözleşmelerinin başkaca amaçlara hizmet edip edemeyeceğini sorar. Bu doğrultuda, bugün için miras payının devri işleminin kredi temini sahasında yüksek potansiyel taşıdığı görülür. Miras payının kredi aracı olarak kabul görmesi, mirasçı ya da muhtemel mirasçının krediye ulaşma sahasını genişletebilir. Diğer yandan da kredi kuruluşunun, kredi karşılığında tereke değerlerinin maliki olması gündeme gelebilir. Miras payının devrini konu alan işlemler, aynı zamanda mirasın paylaşılması fazında da özel önem taşıyabilir. Paylaşma fazında tereke değerlerinin bütünlüğünü bozmadan özgülenmesi için miras payının devrinden yararlanılabilir. Yine, denkleştirme borcu gibi borçların miras payının devri ile ifası mümkündür. Tereke paylaşılmadığı sürece mirasçıların tamamı, tereke borçlarından kendi malvarlıklarıyla müteselsilen sorumludur. Paylaşma zamanın belirsizliği, sorumluluğun süresini de müphem kılar. Dolayısıyla mirasçı, sorumluluk alanını sınırlamak amacıyla da miras payının devri sözleşmesine başvurabilir. Tez çalışması, miras payını konu alan işlemlerin İsviçre-Türk hukuk sisteminde kredi temin etme aracı olarak kullanılma işlevinin bulunup bulunmadığını Alman hukukuyla karşılaştırmalı olarak ele alır. Bu çerçevede, miras açılmadan önce ve miras açıldıktan sonra kurulan devir sözleşmeleri ayrı ayrı ele alınmıştır."
