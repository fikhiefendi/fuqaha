abstract: "Bu çalışmada Amerika Birleşik Devletleri'nin Irak politikasını, 2000'li yıllarda ABD'nin bölgede aktif rol almasını ve Irak devletinin bu politikalar ile dönüşümü neoklasik realizm çerçevesinde incelenmiştir. Soğuk savaşın bitmesiyle değişen çift kutuplu uluslararası sistem düzeni değişime uğrayarak ABD'nin 2000'li yıllarda süper güç olarak bölgedeki değişiminde başlangıcı olmuştur. ABD Başkanlık seçimleriyle birlikte yeni Başkan George W. Bush'un seçilmesi dış politikadaki değişiminde kaynağı olmuştur. 11 Eylül saldırıları sonrasında ABD'nin güvenlik anlayışı değişime uğramış, saldırıların El-Kaide tarafından yapıldığını öne sürerek terörün Ortadoğu'dan kaynaklı ülkeler tarafından desteklendiği belirlemiştir. Başkan Bush yönetimi bu doğrultuda 17 Eylül 2002 tarihinde ABD'nin yeni“Ulusal Güvenlik Stratejisini”açıklayarak uygulamaya koymuş, Eski başkanlar George Herbert Walker Bush ve Bill Clinton döneminde başlayan Irak'a müdahale ve yaptırımlar Başkan Bush dönemimde 2003 yılında Irak'ın işgaliyle sonuçlanan boyuta ulaşmıştır. 2003 Irak'ın işgali ile başlayan süreçte Irak devletinin idari yapısında yeni yapılandırma çalışması yapılmış ve ülke“federal cumhuriyet”yönetimi şeklinde dönüştürülmüştür. Ancak Başkan Bush'un görev süresinin bitimiyle beraber 2008 yılında yapılan ABD seçimlerinde demokratların adayı Barack Obama başkan olarak seçilmiştir. Obama'nın göreve gelmesiyle birlikte, seçim kampanyalarındaki vaatleri içerisinde de yer alan ABD askerini Irak'tan çekme stratejisini ve Irak'ı Iraklılara bırakma politikasını uygulamaya almıştır. Amerikan askerinin çekilmesiyle başlayan süreçte, Irak'ta henüz tam olarak toplumsal birliğin sağlanamamasından dolayı etnik ve mezhepsel kutuplaşmalar ardından ise çatışmalar yaşanmıştır. Nuri el-Maliki'nin iki dönem başbakanlık yaptığı süreçte kutuplaşma ve çatışmalar artarak sürmüştür. Nuri el-Maliki döneminde İran ile olan yakınlaşması bölgenin daha çok İran eşgüdümlü dış politika izlemesine neden olmuştur. Mevcut Irak Başbakanı Haydar el-Abadi göreve gelmesiyle zirve noktaya ulaşmış olan çatışmalar, IŞİD'in kontrolüne geçirdiği birçok bölgeyi geri almak için ülke içi dinamiklerle ve ABD önderliğindeki uluslararası güçlerle uzlaşarak örgütün ele geçirdiği bölgelerden çıkarılarak kontrolün tekrar sağlanması yönünde politikalar uygulanmıştır. Çalışmanın sonuç bölümünde, ABD'nin 2000'li yıllarda Başkan Bush ve Başkan Obama'nın Irak'ta izlediği dış politikaları karşılaştırmalı olarak analiz edilmiştir."
