abstract: "Bu çalışma, XI. Yüzyılın sonları ile XII. Yüzyılın başlarında yaşamış olan Ebu Bekr İbnü'l-Arabî'nin Ahkâmü'l-Kur'an'ında hadislere yaklaşımını incelemeyi amaç edinir.Bu çalışmada, İbnü'l-Arabî'nin hayatı, eserleri ve hadis bilgisi çeşitli yönleriyle ele alınıp incelenmiştir.Birinci bölümde öncelikle İbnü'l-Arabî'nin kullanmış olduğu hadis terimleri tespit edilmiş, sonra naklettiği rivâyetlere kaynak gösterdiği eserler değerlendirilmiştir.İkinci bölümde ise, İbnü'l-Arabî'nin sünnet anlayışı ve şer'i deliller içerisinde Sünnet'in yeri hakkında bilgi verilmiştir. Yine, burada İbnü'l-Arabî'nin isrâiliyyâta yaklaşımı ve isrâiliyyât kaynaklı rivâyetlerden kabul veya reddettiği bazı örnekler kaydedilmiştir.Çalışma sırasında, Kur'ân, hadis, lügat ve biyografi kaynaklarından istifâde edilmiştir."
