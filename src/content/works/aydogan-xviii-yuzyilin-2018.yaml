abstract: "Osmanlı Devleti‟nde vakıf müessesi sosyal ve iktisadi olarak önemli roller oynamıĢtır. ġehirlerin manevi, ictimai ve ekonomik ihtiyaçlarına cevap vermek amacıyla kurulan vakıflar, toplumun ihtiyaçlarını karĢıladıkça rağbet görmüĢ ve zamanla sayıları artmıĢtır. Bir vakıf medeniyeti olan Osmanlı Devleti‟nin ekonomik yapısı üzerinde menkul vakıfları olan para vakıflarının önemli bir yeri vardır. Para vakıflarından kullandırılan kredilerle, halkın finansman ihtiyacı karĢılanmıĢtır. Osmanlı‟nın duraklama dönemi olarak gösterilen 18. yüzyılda artan savaĢ harcamaları ve kaybedilen savaĢlar sonucunda ödenmesine mecbur bırakılan tazminatlar nedeniyle devlet ekonomik bir darboğaza girmiĢ ve bu ekonomik darboğazdan imparatorluğun Ģehirleri de olumsuz yönde etkilemiĢtir. ÇalıĢmamızda 18. yüzyılda Osmanlı‟da ekonomik darboğazın Bursa eyaletinde yaĢayan halka yansımaları ve farklı meslek gruplarına etkileri analiz edilecektir. YaĢanan dönemde Osmanlı‟nın farklı devletlerle yaĢadığı siyasi ve iktisadi olayların Bursa ekonomisine etkisi, para vakıfları özelinde tartışılacaktır."
