abstract: "Finans sektörünün en önemli katılımcıları arasında yer alan bankalar, finansal sistemin işleyişinde ve istikrarında hayati bir rol oynamaktadır. Bu araştırmanın amacı, Türkiye'deki İslami bankaların ve Körfez Arap Ülkeleri İşbirliği Konseyi (KİK) ülkelerindeki İslami bankaların 2020 yılı finansal performanslarını değerlendirmektir. Bu kapsamda çalışma yılına ait, bankaların bilanço ve gelir tablosundan oluşan finansal tabloları kullanılmıştır. Finansal performans ölçütünün belirlenmesine yönelik çok kriterli karar verme stratejilerinden biri olan MULTIMOORA yöntemi kullanılarak finansal oranlar değerlendirilmiştir. Çalışmanın veri seti, her biri beş finansal göstergeden (sermaye yeterliliği, finansal kaldıraç, aktif kalitesi, likidite, karlılık) oluşan dokuz finansal oranda oluşmaktadır. Çalışmada, Türkiye'deki altı İslami bankanın tamamına ve KİK ülkelerindeki on yedi İslami bankaya ait finansal tablolar kullanılmıştır. Analiz sonuçlarına göre sonra Türkiye'de en iyi finansal performansa sahip İslami bankanın Vakıf Katılım Bankası, KİK'de ise Katar Uluslararası İslam Bankası olduğu tespit edilmiştir. İslami bankaların finans sektörü içerisinde rolünün daha iyi seviyelere çıkabilmesi için güçlü bir finansal yapısı olması gereklidir. Finansal performansın ölçülmesi ve değerlendirilmesi için yapılan analizler İslami bankaların sektör içinde durumlarının belirlenmesi ve karlılık, likidite, sermaye yeterliliği, aktif kalitesi, finansal kaldıraç açısından değerlendirilmesi sebebiyle önem arz etmektedir. Analizlerde kullanılan finansal oranlar, banka sayıları ve çalışma yılları değiştikçe farklı sonuçlara ulaşılabilir."
