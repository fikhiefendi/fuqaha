abstract: "Bu tez, Üsküdar Şer'iyye Mahkemelerine ait h. 1316-1317 (m.1898-1899) tarihli 759 numaralı şer'iyye sicilini konu edinmektedir. İlâmlardan oluşan bu sicil esas alınarak, 1898-1899 yılları arasında Üsküdar'ın ekonomik, sosyal, dinî-kültürel hayatı incelenmeye çalışılmıştır. Tez iki bölümden oluşup birinci bölümde sicilde yer alan bilgilerden hareketle Üsküdar, o dönem içerisinde çeşitli yönleriyle ele alınmıştır. İkinci bölümde ise 759 numaralı Üsküdar şer'iyye sicili'nin günümüz harfleriyle yazılmış metni yer almaktadır. Sonuç kısmında ise defterde yer alan bilgiler genel olarak değerlendirilmeye çalışılmıştır. Ekler kısmında, sicilde yer alan örnek sayfalar yer almaktadır. Son olarak tez, kaynakça ve özet kısmıyla sonlandırılmaktadır."
