abstract: "Bu çalışma, 1885-1887 (H. 1303-1305) yıllarına ait 153 numaralı 'Ayntâb Şer'iyye Sicili'nin transkripsiyonu ve değerlendirilmesini konu almaktadır. Çalışmanın temel amacı, incelenen dönem ekseninde 'Ayntâb özelinden hareketle 19. yüzyıl son çeyreği Osmanlı Devleti'nin idari, sosyal, kültürel ve ekonomik yapısını analiz etmektir. Birinci elden kaynak (ana kaynak) niteliğindeki bu sicil, yerel tarih yazımı ve genel Osmanlı çalışmaları için önemli veriler sunmaktadır. 153 numaralı 'Ayntâb şer'îyye sicilinde 194 dava tespit edilmiş ve bu davaların anlaşılması adına her bir dava için ayrı ayrı birer tablo oluşturularak davanın türü, konusu, özeti ve Hicri/Miladi tarihlerine yer verilmiştir."
