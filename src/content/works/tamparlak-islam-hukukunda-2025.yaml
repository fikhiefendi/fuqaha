abstract: "Muvâsât, yardım ve bildirim yükümlülüğünü bünyesinde barındıran önemli bir kavramdır. Toplumsal düzenin sağlanmasını, zor durumda olana yardım edilmesini ve ihtiyaç içinde olanın ihtiyacının giderilmesini amaçlar. Bu araştırmanın konusu olan muvâsât, pozitif hukukta yer alan yardım ve bildirim yükümlüğünden çok daha geniş bir içeriğe sahiptir. Bu nedenle yardım yükümlülüğünü içeren birçok fer'i meselenin hukukî gerekçesi olmuştur. Ayrıca ihmalî davranışların suç unsuru haline dönüşmesinde de bu yükümlülüğün gereği gibi yerine getirilmemesi yer almaktadır. Bu araştırma da yardım ve bildirim yükümlülüğünü yerine getirebilecek bireylerin sorumluluklarını, fer'i meseleler bağlamında analiz ederek kavramın ahlâkî boyutunun yanında hukukî bir nitelik taşıdığını da ortaya koymak amaçlanmıştır. Araştırmada klasik fıkıh kaynaklarının yanı sıra muasır çalışmalardan da faydalanılmıştır. Konu, analitik yöntem, nitel veri analizi ve mukayese yöntemiyle ele alınmıştır. Yapılan araştırma muvâsâtın İslâm hukuk literatüründe önemli bir yerinin olduğunu ortaya koymaktadır. Çünkü muvâsât toplumda dayanışmanın ve sosyal adaletin sağlanmasında önemli rol oynamaktadır. İslâm hukuku yardımlaşmayı yaygınlaştırmak suretiyle toplumdaki bütün bireylerin en azından temel ihtiyaçlarının karşılamasını amaçlamaktadır. Sonuç olarak muvâsât, İslâm hukukunda bulunduğu anlam içeriği, gayeleri ve hükümlere olan etkisi dikkate alındığında pozitif hukuk sistemine de günümüz problemlerini çözme noktasında ışık tutabileceği şeklinde bir tespitte bulunulabilir."
