abstract: "El- Hidâye, el-Merginani'nin Hanefi fıkhını anlattığı bir eserdir. Fıkhın bütün konuları genel hatlarıyla anlatılmıştır. Eserde İmam Şâfiî'ye ait görüşler farklı şekillerde aktarılmıştır. Bazen Şâfiî'nin doğrudan adı zikredilerek kendisinden alıntılar yapılmış, bazen Hanefilerin görüşü zikredilip Şâfiî de bu görüştedir denmiş, bazen de bir kavli de bu yöndedir gibi ifadeler kullanılmıştır. Bazı kere de sadece Hanefi görüşü aktarılarak Şâfiî'nin görüşüne hiç yer verilmeden Şâfiî'nin bu konuya muhalif olduğu zikredilmekle yetinilmiştir. İşte Hidaye'nin ibadetler bahsi özelinde hem İmam Şâfiî'ye atfedilerek aktarılan bu görüşleri tespit etmek hem de bir kısmının İmam Şafiye ait olmadığı tezinden yola çıkarak tespit ve tahkikini yapmak için bu çalışma yapılmıştır. Tezde el- Hidaye'nin ibadetler bahsi özelinde İmam Şafiî'ye ait 194 görüşü incelenmiştir. Üç bölümde incelemiş olduğumuz çalışmada Şâfiî'ye ait 39 görüşün yanlış olarak nakledildiği tespit edilmiştir. Tespit ve Tahkik edilen 194 fıkhi konu Şafi kaynaklarından hareketle açıklanmıştır. Fıkhın İbadetler bahsinde geçen birçok konu mukayese edilerek Hanefi ve Şâfiî mezheplerinin görüşleri hakkında bilgiler verilmiştir."
