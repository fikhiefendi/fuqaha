abstract: "Bu çalışma, İslam finans sisteminin faizsiz mikro finansman araçlarından biri olan Ar- Rahnu rehin modeli üzerinden, Malezya ve Endonezya'daki uygulamaların karşılaştırmalı analizini sunmaktadır. Ar-Rahnu sistemi, altın ve benzeri değerli varlıkların teminat gösterilmesi yoluyla faizsiz finansman imkânı sağlayarak, özellikle düşük gelirli bireyler, kadın girişimciler ve küçük işletmeler için alternatif bir finansal kaynak sunmaktadır. Çalışmada, her iki ülkedeki kurumsal yapılar, yasal düzenlemeler ve operasyonel farklılıklar detaylı biçimde incelenmiş; sistemin sosyoekonomik etkileri finansal kapsayıcılık, kayıt dışı borçlanmanın azaltılması ve kadınların ekonomik hayata katılımı bağlamında değerlendirilmiştir. Malezya örneğinde Ar-Rahnu'nun daha kurumsal, düzenlenmiş ve yaygın bir yapıya sahip olduğu; Endonezya'da ise daha çok yarı-formel ve yerel düzeyde uygulandığı gözlemlenmiştir. Bununla birlikte her iki ülkede de model, mikro düzeyde ekonomik dayanıklılığın artırılmasında etkili bir araç olarak öne çıkmaktadır. Bulgular, Ar-Rahnu'nun sadece finansal değil aynı zamanda toplumsal adalet, etik duyarlılık ve sürdürülebilir kalkınma gibi ilkeleri destekleyen çok boyutlu bir sistem olduğunu ortaya koymaktadır. Çalışmanın sonunda, sistemin etkinliğini artırmaya yönelik dijitalleşme, kadın girişimciliği teşviki ve finansal okuryazarlık gibi alanlarda politika önerileri sunulmuştur."
