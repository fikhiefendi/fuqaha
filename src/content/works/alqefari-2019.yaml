abstract: "Çalışmada, yazar Şeyh (Yusuf Efendi Zadeh), kişisel hayatı ve bilimsel durumu ve kitabın tanımı (Saheeh Al-Buhari'yi açıklamak için Najah Al-Qari ve Yusuf Efendi Zadeh'in ajansın kitabını açıklama yoluyla açıklama yönteminin tanıtılması amaçlanmıştır. Çalışmanın önemi, buhari'nin doğru olduğu açıklamalı kitabın; Araştırma Ajansın kitabındakilere endüktif yaklaşıma ve ardından konunun ihtiyaç duyduğu şeyin içeriğine neyin açıklayıcı analitik ve tümdengelimli yaklaşımına dayanıyordu. Çalışmanın sonunda, çalışmanın en önemli bulgularından ve önerilerinden bahsettim."
