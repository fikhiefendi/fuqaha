abstract: "Osmanlı dönemi para vakıfları, bölgesel finans sisteminin kendi dönemi açısından en önemli organizasyonlarından birisidir. Bu vakıfların fon kullandırma sistemleri ile günümüz katılım bankaları benzerlikler göstermekle birlikte para vakıfları ilgili dönemde sosyal dayanışma ve işbirliği gibi konularda da bölgenin gelişimine katkı sağlamışlardır. Ayrıca bu vakıflar, İslami değerler çerçevesinde yürütülen faaliyetlerinden dolayı, fon ihtiyacı olan tarafların haklarını koruyarak tefeciliğin ve faizin önüne geçmiştir. Dolayısıyla günümüz özel finans kurumlarının işleyiş sistemine çok yakın bir biçimde faaliyet gösteren bu vakıflar, aslında Osmanlı döneminde bir nevi banka görevi görmüştür. Bu çalışmada ise para vakıfları ile katılım bankalarının finansal açıdan ilkeleri, işleyiş sistemi ve fon kullandırma yapıları incelenmiş, örnek vakfiyeden hareketle benzerlikler ve farklılıklar genel değerlendirme ve yorumlamalarla günümüz finansal sistemi açısından açıklanmıştır."
