abstract: "Şafiî mezhebi müteahhir alimlerin kitapları incelendiğinde genellikle“el-Envar'ın hilafına”ifadesiyle karşılaşılır. Bahsedilen bu lafız ile ne kastedildiğini araştırmak üzere hazırlanan bu yüksek lisans tezi, Yusuf b. İbrahim Erdebilî'nin Şafiî mezhebinin yerleşik esaslarına muhalif olarak yaptığı ictihadların, hangi açılardan müteahhir alimleri tarafından zayıf olarak değerlendirildiğini tespit için yapılmıştır. Öncelikle Erdebilî'nin yaşadığı dönem, hayatı ve ilmî kişiliği hakkında bilgi verildi. Ardından, Şafiî mezhebine mensup bölgelerde hâlâ ilmî bakımdan değerli bir çalışma sayılan ve Şafiîlerin yaşadığı Kuzey Irak'tan Azerbaycan sınırındaki Erdebil'e kadar olan bölgede ders kitabı olarak okutulan el-Envar li Amali'l-Ebrar adlı eser hakkında bilgi verildi. İmam Şafiî'nin talebeleri ve içtihatlarının çeşitliliği mezhepte farklı görüşlerin ortaya çıkmasına neden olmuştur. Ancak bu durum âlimler nezdinde İmam Şafiî'nin Mısır'da kesinleştirdiği, usulu ve kaidelerine göre belirtilen, Nevevî ve Rafiî'nin ittifak ettiği meseleler ile ikisinin ihtilaf ettikleri durumda ise Nevevî'nin görüşünün öne alındığı ve son olarak müteahhir Şafiî muhakkiklerinin görüşü olan mutemed görüşün sabit hale gelmesine kadar devam etmedi. Erdebilî'nin Nevevî ve müteahhir Şafiî âlimleri dönemi arasında yaşaması, özellikle de bu dönemde Şafiî mezhebinin prensiplerinin netleşmesi sebebiyle onun mezhepte ittifak edilen usullere muhalif bazı içtihatları müteahhir Şafiî fakihleri tarafından zayıf kabul edilmiştir. Bu çalışmada, Şafiî mezhebi müteahhir fıkıh kitaplarında yer alan“el-Envar'ın hilafına”ifadesiyle müellifin mezhebe muhalif 38 görüşünü tespit edilmiş, öncelikle meseleyle ilgili Erdebilî'nin görüşü zikredilerek, aslında Şafiî mezhebinde mutemed görüşün ne olduğu izah edilerek, metinde zor anlaşılan bazı ifadeler açıklanmıştır. Ayrıca Erdebilî'nin bazı örnek içtihatları zikredilerek diğer dört mezheple karşılaştırmasını yapılmış mezhebe muvafık veya muhalif olma oranı tespit edilmiştir."
