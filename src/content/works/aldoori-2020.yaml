abstract: "İslam'de fınansal muhasebe sıstemının kendıne has bir özelliği vardır, kaynaklarını islami mevzuatın ana kaynakları olan kur'an-ı kerim ve Peygamber'in sünnetı, sahabelerın içtihatlarına. Ve Müslüman din adamlarının İslam hukukyla çelişmeyen fikileri ve edebiyatı dayandığı için; Dolaysıyla islam'daki finansal muhasebe sistmini öne çıkarmanın, onu ve özelliklerini tanmanın ve nesiller boyunca insanlığa sunduğu hizmeti tanmanın önemi budur. Ve nasıl yönetildiğini ve ülkelerin finans kurumlarının kontorollerine ve sınırlamaalarına ne ölçüde bağlı kaldıgını bilmek."
