abstract: "ÖZET İslam hukukunda hüküm başlığı altında iki temel konu vardır. Bunlardan biri teklifi hükümler diğeri ise vaz'i hükümlerdir. Vaz'i hükümler, İslam hukukuna göre, bir hükmün varlığı için ortaya konmuş birer yardımcı hükümdür. Teklifi hükümler ise, insanın yapmakla sorumlu olduğu fiilleri ile ilgilidir. Yapmak zorunda olduğu fiiller, zorunda olmadığı fiiller, yapmamakla sorumlu olduğu fiiller vb. bu gruba giren konulardır. Teklifi hükümlerin tespiti ve derecelendirilmesi için bazı şartlar vardır. Tezimizde biz bu şartlan, bu faktörleri inceledik. Teklifi bir hükmün derecelenmesini etkileyen Kur'an, sünnet ve fakihlerden kaynaklanan etkenleri ortaya koyarak konuyu işledik."
