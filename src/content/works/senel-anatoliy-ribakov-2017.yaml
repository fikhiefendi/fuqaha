abstract: "Çalışmamızın konusunu Sovyet döneminin önemli yazarlarından Anatoliy Naumoviç Rıbakov'un (1911-1998) Arbat Çocukları adlı üçlemesinin toplumsal gerçeklik bağlamında incelenmesi oluşturmaktadır. Sovyet yüzyılının ilk yarısına damga vuran İosif Stalin dönemini tüm gerçekliğiyle anlatan ilk yapıtlardan biri olması ve özellikle İ. Stalin ile ilgili ilk roman olarak değerlendirilmesiyle çok yankı uyandıran yapıt bu bağlamda tarihi, siyasi bir belgesel roman niteliği taşımakta, dönemin topluma yansımalarını ise Moskova'nın Arbat Sokağı'nda yaşayan sekiz gencin ve 1917 Ekim Devrimi'ni yapan devrimci kuşağın yaşamları üzerinden ortaya koymaktadır. SSCB'nin kuruluşundan yıkılışına kadar geçen süreç gerek dünya tarihi, gerekse Rusya tarihinde derin izler bırakmıştır. Özellikle İ. Stalin yönetimi döneminde yaşanan siyasi, ekonomik ve toplumsal gelişmelerin Sovyet tarihi üzerindeki etkisi çok büyük olmuştur. Çarlık Rusya'sının geleneklerinden ve geri kalmışlığından uzak, sanayileşmiş, yeni, ileri, aydınlık bir ülke ve toplum ideallerinden yola çıkılan bu süreçte ise toplumsal birçok soruna tanıklık edilmiştir. Yeni bir ülke yaratmanın heyecanı içindeki sosyalizme bağlı, dürüst ve idealist insanlar, inandıkları sistemin, kendilerini yok edecek bambaşka bir sisteme dönüştüğünü anlamanın hayal kırıklığını yaşamıştır. Dönem gerçeklerini yazarın kendisinin de yaşamış olması ise yapıtı otobiyografik bir zemine oturtmuştur. İyi bir eğitim alan, sosyalizme bağlı ve ülkesi için severek çalışmanın gururunu duyan yazarın yaşamı, dönemin diğer idealist insanları ve üçlemenin başkahramanı gibi hapishane, Sibirya sürgünü ve savaşla birleşmiştir. Tezimizin amacı 1933-1943 yıllarını içine alan Anatoliy Rıbakov'un Arbat Çocukları üçlemesini dönemin topluma yansımaları bağlamında incelemek, sosyalizmle birlikte yeni kurulan toplumun yaşadığı tüm çıkmazları roman kahramanlarının yaşamlarından yola çıkarak ortaya koymaktır. Anatoliy Rıbakov bu romanıyla, 1917 Ekim Devrimi'ni yapan devrimci kuşağın, devrimin ilk çocukları diye adlandırılan gençlerin ve yeni toplumun, İ. Stalin döneminde yaşadığı tüm çelişkilere açıklık getirmekte, Moskova'nın Arbat Sokağı'ndan, Sibirya'ya uzanan çok geniş bir coğrafyada Sovyet toplum yaşamına ışık tutmakta, dönemin topluma yansımalarını çok gerçekçi ve çarpıcı bir dille aktarmaktadır."
