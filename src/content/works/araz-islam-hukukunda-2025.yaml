abstract: "Bu çalışma,“İslam hukukunda ıskat”konusunu kapsamlı bir şekilde ele almayı amaçlamaktadır. Iskat, meşru bir hakkın, sahibinin rıza ve iradesiyle ortadan kaldırılması manasına gelen bir fıkıh terimidir. Iskat mahallini haklar oluşturmaktadır. Allah hakları, kullar tarafından ıskat edilemezken, sahiplerinin tasarruf yetkisi dahilinde olan kul hakları ıskat edilebilmektedir. Müşterek haklar ise belirli şartlarda ıskata konu olabilmektedir. İslam hukukuna göre ıskat yetkisi hakkın sahibine aittir. Bu yetki devletin veya üçüncü kişilerin müdahalesine karşı koruma altına alınmıştır. Bu çalışma ıskatın tanımı, kapsamı, meşruiyeti, rükünleri ve çeşitleri gibi konuları detaylı bir şekilde ele alarak, konuya sistematik bir bakış açısı kazandırmayı amaçlamaktadır. Çalışma, iki bölüm ve sonuçtan oluşmaktadır. Birinci bölümde ıskat hakkında kavramsal ve kuramsal çerçeve oluşturulmaya çalışılmıştır. İkinci bölümde, talâk, muhâlea, köle azadı, ibrâ gibi, her bir ıskat tasarrufuna müstakil başlıklar altında yer verilerek, konu bağlamında bunların özelliklerine değinilmiştir. Sonuç bölümünde ise temel bulgulara yer verilmiştir. Çalışmada Hanefî mezhebi esas alınmakla birlikte diğer mezheplerin görüşlerine de genellikle müracaat edilmiştir. Bu çalışma, ıskat konusundaki kavramsal karışıklıkları gidermesi, ıskatın İslam hukukundaki yeri ve önemini vurgulaması, ıskat tasarruflarının sistematik bir şekilde sınıflandırması, fıkıh eserlerinde ıskat tasarrufu olarak kabul gören hukuki işlemleri ayrıntılı şekilde ele alması açılardan önem arz etmektedir. Araştırmada ulaşılan temel bulguya göre, ıskata mahal olan haklar, İslam hukukunun korumayı amaçladığı genel kural ve yasaklara muhalif olarak, istihsânen kula tahsis edilmiştir. Bu haklar, genel hüküm ve yasakların uygulanmasına mâni oluşturmaktadır. Iskat neticesinde mâni zail olarak genel kural ve yasaklar devreye girmektedir. Bu nedenle ıskat edilen haklardan bir daha istifade edilememektedir."
