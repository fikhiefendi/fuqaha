abstract: "Bugün yaşadığımız tüm ekonomik buhranların ve bu buhranların yarattığı sosyal problemlerin temeli, bütün kurumları, ahlakı ve zihniyeti ile önce iktisadi yapıya ve sonra bireyden topluma tüm hücrelerimize kadar işlemiş olan kapitalizmdir. Kapitalizm, kitle üretim anlayışı ile güçlenmiş ve ihtiyaç sınırlarını aşan bu üretimin, tüketimin pompalanması yoluyla piyasada emilmesi, tüketim toplumunun ortaya çıkmasına neden olmuştur. İhtiyacın sınırlı olduğu, tüketimin de israf kavramı ile sınırlandırıldığı, faizin olmadığı ve zekatın bir adil bölüşüm mekanizması olarak sisteminde yer bulduğu İslam iktisadı, sözü edilen ekonomik ve sosyal problemlerin çözümünü kendi özünde barındırmaktadır. İslam ekonomisinde, adil bölüşüm, felaha erme, verimliliği ve üretkenliği artırma, birey ve toplum çıkarları arasında dengeye ulaşma gibi birtakım politika amaçları mevcuttur. Söz konusu politika hedeflerine ulaşırken bir politika aracı olan İslami finans, ribanın olmadığı, İslam'ın haram olarak nitelediği yollardan edinilmemiş kazançlardan oluşan, spekülasyon, bahis ve kumara dayanmayan, ticari bir işlemi içeren finansal ağ yapılarıyla sınırlıdır. İslami finans sektörü ise, günümüz ekonomik şartlarında, bir İslam ekonomisinin varlığını sürdürebilmesi için hayati önem taşımaktadır. Bu öneme atfen, dünya ve Türkiye örnekleminde faizsiz finansa ilişkin mevcut konjonktür ele alınmıştır. Türkiye'de katılım bankacılığına ilişkin SWOT Analizi yapılarak, katılım bankalarının güçlü ve zayıf yönleri ile, kendilerine dönük fırsat ve tehditler değerlendirilmiştir. Katılım bankaları, reel varlıklar üzerinden işlemlerini yürütmekle, daha riskten uzak bir yapı sergilerken, müşterilere bu nedenle daha az finansal enstrüman ve daha fazla bürokratik işlem sunmaktadır. Kendi alanlarına özgü akademik çalışmalar ve alan eğitimi ile işgücüne dahil olan mezunlar açısından da dezavantajlı bir konumdadırlar. İnançları gereği kendilerine başvurmuş KOBİ ağırlıklı, sadakatli müşteri yapıları ise en önemli güçlü yönlerinden biridir."
