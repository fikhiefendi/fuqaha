abstract: "Modern fıkıh araştırmaları kapsamında tartışılan alanlardan bir tanesi helal gıda konseptidir. Bu kavram çerçevesinde, kanatlı hayvanların beslenmesi, şoklanması, kesimi ve tüy diplerinin gevşetilmesi ve tüylerin yolumu gibi süreçler fıkhî açıdan tartışılmaktadır. Bu çalışmada, kanatlı hayvanların tüy diplerinin gevşetilmesi ve yolumu süreçleri incelenmiştir. Birinci bölümde, necaset ve çeşitleri değerlendirilmiş ve fukaha tarafından suyun hangi şartlarda necis kabul edildiği tespit edilmiştir. Bu bölümde sadece Hanefi fukahanın eserlerinden istifade edilmiştir. İkinci bölümde ise tüy diplerinin gevşetilmesi için uygulanan yöntemleri işlenmiştir. Bunlar, geleneksel usüle göre yolum, sulu yolum ve kuru yolum yöntemleridir. Çalışmanın bu bölümünde, uzmanların bu yöntemlerle ilgili yaptığı analizlerden ve bu alanda telif edilen eserlerden istifade edilmiştir. Tezin son bölümünde ise ilk iki bölümdeki bilgilerden hareketle kuru ve sulu yolum yöntemlerinin fıkhî hükümleri tespit edilmeye çalışılmıştır."
