abstract: "Bu çalışma, Ülkemiz literatüründe katılım bankacılığı olarak adlandırılmış olan İslami ve konvansiyonel bankaların yer aldığı Türkiye ve benzeri seçilmiş ülkelerde faaliyet gösteren bankaların kredi verme davranışlarının, bankalara özgü ve makroekonomik göstergelerle etkileşimini ölçmeyi amaçlamaktadır. Özellikle gelişmekte olan ülkelerde fon arzının ana kaynağı olan bu bankaların sağladıkları kredilerin, finansal hareketliliğin temel dinamiklerinden bir tanesi olduğunu ifade etmek mümkündür. Çalışmanın örneklemi, içlerinde Türkiye'nin de bulunduğu, bankacılık sektöründe hem İslami hem de konvansiyonel bankaların birlikte faaliyet gösterdiği seçilmiş 16 ülkeden oluşmaktadır. Literatürde hem İslami hem de konvansiyonel bankaların birlikte faaliyet göstermesi“Dual Bankacılık”sistemi olarak tanımlanmaktadır. Çalışmada 226 konvansiyonel 81 İslami olmak üzere toplam 307 bankanın 2009-2022 yılları arasındaki yıllık frekanslı verileri kullanılmıştır. Bankaya özgü ve makroekonomik dinamiklerin İslami ve konvansiyonel bankaların vermiş oldukları kredilere etkisinin ölçülebilmesi amacıyla, Driscoll-Kraay tarafından önerilen sabit etkiler (SE) tahmincisi kullanılarak Dengesiz Panel veri analizi gerçekleştirilmiştir. Çalışmada, kredilendirme düzeyi, mevduatın krediye dönüşüm oranı ve bankacılık sisteminin risk tutumunu gösteren değişken olan takipteki krediler oranının banka kredi davranışını simgeleyen bağımlı değişken olarak kullanılırken, çalışmanın bağımsız değişkenleri bankaya özgü değişkenler, makroekonomik değişkenler ve global etkisi hala hissedilmekte olan COVID-19'dur."
