abstract: "Osmanlı arşiv kaynakları arasında içerdiği çeşitli konular bakımında önemli bir kaynak olan şer'iyye sicilleri Osmanlı sosyo-ekonomik ve şehir tarihi araştırmacıları için ana kaynaklardır. Kadı ve yardımcısı naib tarafından mahkemede görülen davaların hükümlerini içeren ve aynı zamanda merkezden gelen emir, ferman, berat, buyruldu ve tezkire gibi belge suretlerinden oluşan kayıtlara şer'iyye sicilleri denmektedir. Sicil kayıtları incelenen şehrin, idari yapısı, mahalleleri, köyleri ve nahiyeleri hakkında bilgiler vermektedir. Aynı zamanda şehrin hem sosyal ve iktisadi yapısı hem de kültürel yapısı hakkında bilgi edinmek mümkündür. Tezimizde; H. 1027-1032 M. 1618-1623 yılları arası kayıtları kapsayan 2 Numaralı Bor Şer'iyye Sicilindeki veriler değerlendirilerek Karaman Eyaleti dâhilinde Niğde Sancağına bağlı Bor Kazasının defterde bulunan belgeler doğrultusunda idari yapısı, sosyal ve ekonomik durumu incelenmeye çalışılmıştır."
