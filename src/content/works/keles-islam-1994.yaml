abstract: "Sözlük anlamı itibariyle azmetmek ve ittifak etmek anlamına gelen icmâ' kelimesi, İslâm Hukukunun bir terimi olarak, eskiden olduğu gibi çağımızda da en çok kabul gören tarife göre“Hz. Peygamberin vefatından sonra müslüman müctehidlerin, herhangibir dönemde şer'î bir meselenin hükmü üzerinde ittifak etmesidir.”Hz. Peygamber döneminde icmâ' Rasûlüllah (S.A.V.)'in yegane teşriî otorite olması sebebiyle delil olarak kullanılmamış, ancak müslümanların zihnine, icmâ 'a İslâm Hukukunun kaynağı olarak başvurulacağı fikri iyice yerleştirilmiş, bunu sağlamak üzere de müslünalara iyi bir şûra ve istişare ruhu kazandırılmıştır. Bu ruhla hareket eden Sahabe nesli, icma'ı pratik olarak uygulamış ve yeni meydana gelen meselelerin çözümünde icmâ' müessesesi, kendisinden beklenen işlevi göstermiştir. Sahabeden sonra ise icmâ', ayet ve hadislerde açıkça ortaya konmuş bulunan hükümler üzerindeki gözcülük görevinin ötesinde yeni meydana gelen olaylara çözüm üretme müessesesi sıfatıyla ancak bölgesel olarak yahutta seneler on yıllar boyunca bazı ictihadlar üzerinde ittifak oluşması şeklinde gündeme gelebilmiştir. İslâm hukuk bilginlerinin ezici çoğunluğuna göre icmâ 'm oluşması mümkündür. Oluştuğu zaman da müslümanları bağlayıcı kat'î bir delil olur. İlim adamları, icmâ 'm İslâm Hukukunun kaynağı olduğunu isbat etmek üzere hem Kur'an-ı Kerim' den hem de Sünnetten pek çok delil göstermişlerdir. Gösterilen bu dililler içinde \"Ümeti Muhammed'in bir hata üzerinde birleşmeyeceğini ifade eden hadisten hareketle usulcüler, ümmeti Muhammed'in müctehidleri herhangi bir dönemde bir meselenin şer'î hükmü üzerinde görüşbirliğine vardıkları zaman onların bu ittifakı nın hata ollamayacağını söylemişlerdir.ws İcma'ın mutlaka nastan veya ictihad türlerinden bir delile dayanması gerekir. Buna icma'ın senedi veya müstenedi denir. İcma'ın senedinin sadece ayetler ve hadisler olabileceğini söyleyen azınlığa göre icma'ın yegane fonksiyonu, ayet ve hadislerde açıkça ortaya konmuş bulunan hükümleri pekiştirmek ve bu hükümlerin saptırılmalarını önlemektir. İcma'ın senedinin ictihad da olabileceğini savunan İslâm Hukuk bilginlerinin çoğunluğuna göre ise icma'ın büyük bir aktüel değeri vardır. Bu ilim adamlarına göre icma', İslâm Hukukunun doğru bir şekilde devamının garantisidir. Çağımızın haberleşme ve ulaşım imkanları, geçmişte icma'ın oluşabilmesi için gösterilen engelleri büyük ölüde problem olmaktan çıkarmıştır. Bu imkanlardan yararlanarak gereken organize sağlanabildiği takdirde zamanımızda icma' oluşabilir. Ancak zamanımızda da icma'ın oluşabilmesinin önündeki en önemli engellerden biri ictihad seviyesine ulaşmış yeterli ilim adamı yetiştirilememesidir. Bu problemin de ictihad için zorunlu olan çeşitli ilim dallarında uzmanlaşmış ehil elemanlardan oluşacak teşriî heyetlerle aşılabilmesi mümkündür. İslâm Hukukunun gelişmesi müslümanların problemlerine sağlıklı çözümler üretilebilmesi için icma 'a işlerlik kazandırabilecek bir müessesenin kurulması gerekmektedir. Böyle bir müessesenin kurulması halinde çoğu zaman icmâ' gerçekleşmese bile çoğunluğun görüşüyle bir çok çözümler üretilebilecektir."
