abstract: "Maliki mezhebi Baladi Sudan'da veya Batı Afrika'da önemli bir yere sahiptir. Bölgenin tümüne yayılmış ve tek hakim mezhep olmuştur. Bunun nedeni ise özellikle Tinbüktü fakihleri olmak üzere, bölge fukahasının sarf ettiği eğitim ve telif çabalarıdır. Araştırmamızın konusu, bu fakihlerin önemlilerindn birisi olup Maliki mezhebine hizmet konusunda çok kıymetli çalışmalara sahip olan,“Tinbuktu Âlimi”olarak meşhur olmuş Ahmed Bâbâ et-Tinbüktî ve nevâzil meselelerine yaklaşımıdır. Çalışmamız, doğumundan vefatına kendisinin biyografisini ele almakta; hayatının en önemli aşamalarından ve fıkıh ilmine katkılarından bahsetmektedir. Ayrıca araştırmamız, Ahmed Bâbâ'nın İslam Hukuku ve özellikle Mâlikî mezhebinde önemli bir yere sahip olan Nevâzil (yeni çıkan / güncel fıkıh problemleri) ile ilgili eserlerini incelemekte; telif nedenleri, içerikleri, kaynaklarını ele almakta bu konulardaki Ahmed Bâbâ'nın yaklaşımını ve metodolojisini değerlendirmektedir. Bu kapsamda öncelikle yeni fıkıh problemi tanıtılarak akabinde Ahmed Bâbâ'nın değerlendirmeleri verilmekte, ardından diğer fukahanın konuyla ilgili görüşleri aktarılmakta, son olarak konuyla alakalı günümüz meseleleri ele alınmaktadır"
