abstract: "Bu çalışma, İslam aile hukukunun toplumsal temellerini ve buradan hareketle talâk uygulamasını fıkıh, hukuk ve sosyoloji perspektiflerinden ele almaktadır. İslam hukukunda aile, yalnızca bireyler arasındaki bir akit değil toplumsal düzenin, ahlâkın ve adalet anlayışının şekillendiği temel bir kurumdur. Araştırmanın hareket noktası, fıkıh-hukuk-sosyoloji ilişkisinin özellikle boşanma olgusu üzerinden nasıl somutlaştığını anlamaktır. Nitel, karşılaştırmalı ve disiplinler arası bir yöntemin izlendiği bu çalışmanın ilk bölümünde, örf, maslahat, istihsan ve kazâî-diyânî ayrımı gibi ilkeler üzerinden fıkhın toplumsal yönü analiz edilmiştir. İkinci bölümde, evlilik, mehir, nafaka, iddet ve hulʿ gibi kavramlar klasik fıkıh literatürü ile sosyolojik kuramlar ışığında birlikte değerlendirilmiştir. Üçüncü bölümde ise talâk, Osmanlı şerʿiyye sicilleri ve 1917 tarihli Hukuk-ı Aile Kararnamesi temelinde incelenmiş boşanmanın tarihsel süreçte geçirdiği sosyolojik dönüşüm açıklanmıştır. Sonuç olarak bu çalışma, İslam aile hukukunun yalnızca normatif hükümlerden oluşan bir sistem olmadığını; toplumsal gerçeklikle sürekli etkileşim içinde gelişen dinamik bir hukuk geleneği sunduğunu göstermektedir. Talâk kurumu ise bu etkileşimin, fıkıh, hukuk ve sosyoloji arasındaki ilişkiyi görünür kılan en belirgin örneklerinden biri olarak öne çıkmaktadır."
