abstract: "Kâbe'nin Mekke'de yer alması ve kutsal kabul edilmesi sebebiyle Mekke İslâm öncesinde ve sonrasında Arap yarımadasında önemli bir konuma sahip olmuştur. Hz. Peygamber'in tebliğinden sonra, Müslümanlar ve müşrikler arasındaki mücadele sonucunda Müslümanlar Mekke'den Medine'ye hicret etmiştir. Fakat Mekke'ye olan ilgi, Kabe'nin orada olması sebebi ile değişmemiştir. Müslümanlar için büyük bir öneme sahip olan Mekke'nin ilmî yapısının önemli bir parçası olan kâdıların hadis ilmiyle ilişkilerini ve bu ilme katkılarını tespit etmek önem arz etmektedir. Bu sebeple Mekke'nin hicrî ilk üç asırda görev yapmış olan kâdıları incelenmiş ve 44 kâdı tespit edilmiştir. Tespit edilen bu kâdıların hadis ilmine olan katkılarını ortaya koyabilmek için hadis ilmiyle ilişkisi olanlar araştırılmış ve 20 kâdıya ulaşılmıştır. Bu kâdılar öncelikle hadis rivâyetindeki güvenilirlikleri bakımından taksim edilmiştir. Sonrasında ise beş zayıf râvi, kâdılık ve hadisçilikleri açısından öne çıkmış olan dört güvenilir râvinin cerh-ta'dil durumları, rivâyetleri, kâdılık ve fıkhî yetkinlikleri detaylı olarak araştırılmıştır. Hadis ilmiyle ilişkisi olan diğer 11 kâdı ise sadece cerh-ta'dil durumları açısından araştırılmıştır. Elde edilen bilgiler kâdıların hadis rivâyetiyle ilişkileri ve kâdılıkları olarak değerlendirmeye tabii tutulmuştur. Son olarak da râvilerin rivâyetleri üzerinden oryantalistlerin kâdıların hadis uydurmalarına dair iddiaları değerlendirilmiştir."
