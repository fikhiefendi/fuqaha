abstract: "Tez çalışmamız, Türk ve Irak hukukunda haksız inşaatı konu alan mukayeselibir çalışmadan ibarettir. Çalışmada haksız inşaat konusunda, Türk ve Irak hukukuarasında yapılan mukayesenin yanında, haksız inşaatın hükümleri konusunda İsviçre,Fransa, Mısır, Ürdün, Suriye, Lübnan hukuku, İslâm hukuku ve Mecelle'yedeğinilmiş ve bu hukuk sistemlerinde benimsenen farklı çözüm tarzları aktarılmıştır.Haksız inşaat, Türk Medenî Kanununda `Arazideki yapılar' kenar başlığıaltında 722?724 maddeleri arasında ele alındığı halde, Irak Medenî Kanunundataşınmaz mülkiyeti kazanma sebeplerinden biri olan insan fiili ile birleşme (el iltisakbi fiili'l insan) kenar başlığı altında, IMK. m.1117?1123 arasında düzenlenmiştir.Her iki hukukta da haksız inşaatın bir hali olan kendi malzemesiyle haksızinşaat, haksız inşaatın en yaygın hal olarak kabul edilmektedir. Öneminden dolayı,çalışmada haksız inşaatın bu hali özellikle ele alınmıştır.Tez çalışmamız bir giriş ve iki bölümden oluşmaktadır, girişte tez konusununtakdimi, önemi, sınırlandırılması ele alınmıştır. Birinci ve ikinci bölümde, her ikihukukta haksız inşaatın tanımı, haksız inşaat halleri, çekişme konusu olantaşınmazlarda haksız inşaat ve haksız inşaatın hüküm ve sonuçları incelenmiştir.Çalışma boyunca her iki hukuk sistemi arasında, haksız inşaatla ilgili, benzerlikler vefarklılıklar ortaya koyulmuş ve her iki hukuk sistemi ile ilgili görüşler sunulmuştur.İncelemelerimiz sırasında vardığımız kanaatler toplu bir şekilde çalışmalarımızınsonuç kısmında yer almaktadır."
