abstract: "Bu çalışmada dış ticarette kullanılan akreditifler ve bunların finansman formülleri ile akreditif finansmanın risk ve güçlüklerinin değerlendirilmesi amaçlanmaktadır. ifade edilen farklılıklar ve her birinin avantaj ve dezavantajları, çalışmanın amacına ulaşmak için Vakıf Katılım Bankası ve Garanti Bankası seçilmiştir. Araştırma sorusu İslami ve konvansiyonel bankaların dış ticareti finanse etmek için nasıl uygulanacağı ve hem İslami hem de konvansiyonel bankalarda akreditifli dış ticaretin finansmanında anlaşmanın yönleri ve farklılıklarıdır Neler olduğunu cevaplamaya çalışmıştır. Bu sorunun yanıtına ulaşmak için araştırmacı, araştırmacı tarafından tanımlayıcı ve karşılaştırmalı yaklaşım modelleri kullanılmıştır, fade edilen yaklaşımlarla, İslami ve konvansiyonel bankaların akreditiflerini düzenleyen aynı prosedürleri, kuralları ve yayınların izlenebilmesi sonuçlarına ulaşılmıştır. Buna ek olarak, ağırlıklı olarak murabaha sözleşmeleri kullanarak dış ticaretin finansmanın oluşumu sonucuna varılmıştır, İslami bankaların Mudaraba ve Murşaraka gibi dış ticarete yönelik her türlü İslami finansmanın önemle kullanılabileceği tavsiyesinde bulunmuştur, AraştırmaHükümetlerin ve merkez bankalarının kanun ve bülten geliştirirken İslami bankaların özelliklerini dikkate almalarını önerisinde bulunmuştur."
