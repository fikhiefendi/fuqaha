abstract: "Hz. Peygamber'in (s.a.s) eşlerinden,“Ümmü Seleme ve Sahihayn'daki Rivayetleri”adlı bu çalışmamız hanım sahabilerin hayatları ve hadis alanına yaptıkları katkıların ortaya konması bakımından önem arz etmektedir. İslam tarihinin önemli kadın şahsiyetlerinden biri olan Hz. Peygamber'in eşlerinden Ümmü Seleme hem ilk müslümanlardan biri olması hem de hicret sürecinde gösterdiği sabır ve fedakârlıkla öne çıkan bir hanım sahabidir. Kendisi Hz. Peygamber'in vefatından sonra da İslam toplumuna ilmi katkı sunmaya devam etmiştir. Ümmü Seleme'nin hayatı ve rivayetlerini konu edindiğimiz bu çalışmada, Ümmü Seleme'nin biyografik verileri kronolojik bir çerçevede sunulmuştur. Ayrıca Sahîh-i Buhârî ve Sahîh-i Müslim'de bulunan rivayetleri incelenmiş olup bu rivayetlerin tematik dağılımı ve fıkhi değerleri analiz edilmiştir. Elde edilen bulgular, Ümmü Seleme'nin sadece Hz. Peygamber'in hanımı olmakla kalmayıp aynı zamanda güvenilir bir ilim kaynağı ve aktif bir sahabî olduğu gerçeğini ortaya çıkarmıştır."
