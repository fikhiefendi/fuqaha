abstract: "Bu tez çalışmasında İslam Konferansı Örgütü'ne üye ülkeler ve Birleşik Krallıkta yer alan geleneksel ve katılım bankalarının karlılıklarının dinamikleri incelenmektedir. Öncelikle İslami-katılım bankacılık uygulamaları ürün, yönetişim ve risk yönetimi değerlendirilerek, 2007 ve 2013 yılları arasındaki 74 katılım bankası ve 354 geleneksel bankanın karlılıkları ampirik olarak analiz edilmiştir. Katılım bankaların yönetişim yapısı ve ürünleri ülke ve bölge bazında önemli oranda farklılık arz ettiği görülmektedir. Her ne kadar katılım bankalarının yönetişim yapısı geleneksel bankalardan farklılık gösterse de katılım bankaları kar-zarar ortaklığı ürünlerini yeterince kullanamamaktadırlar. Bunun yerine geleneksel bankacılık ürünlerinin benzerleri, örneğin murabaha (vadeli satış), İslam hukukunun izin verdiği ölçülerde adapte edilmektedir. Tezin ampirik kısmında banka makası (net faiz marjı) ve aktif karlılığı bağımlı değişkenler olarak kullanılmakta ve literatüre önemli bir katkı olarak alternatif dağıtım kanalları, finansal hizmetlerin ülke içinde yaygınlaşma oranları, temel malların fiyat endeksleri, katılım bankaları için murabaha harici varlıkların oranı gibi yeni bağımsız değişkenler kullanılmıştır. Dinamik panel veri yöntemleri ile yapılan analizler katılım ve geleneksel bankaların karlılık ve banka makası dinamiklerinin önemli oranda farklı olduğunu göstermektedir. Gerek banka makası gerekse aktif karlılığı, geleneksel bankalardan farklı olarak katılım bankaları için önceki yılların değerlerinden bağımsız gözükmektedir. Alternatif dağıtım kanallarının kullanımı ise her iki tür bankanın karlılığı için olumlu etki yapmaktadır. Bununla beraber, katılım bankalarının karlılıkları ile içinde bulundukları ülkenin İslami finans piyasalarının gelişmişliği arasında anlamlı bir ilişkiye rastlanmamıştır. Katılım bankalarının karlılığının murabaha dışı ürünlerin oranıyla doğru orantılı olduğu gözükmektedir. Ayrıca Türkiye özelinde katılım bankacılığı genelinde fetva standardizasyonu sağlanması gerektiği, katılım bankalarının etkinliklerinin geleneksel bankaların düzeyine çıkartılması gerektiği değerlendirilmektedir."
