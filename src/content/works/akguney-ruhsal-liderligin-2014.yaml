abstract: "ÖZET TEZİN BAŞLIĞI : Ruhsal Liderliğin Örgütsel Çıktılara Etkisi: Bankacılık ve Faizsiz Finans Sektörleri Arasında Karşılaştırmalı Bir Analiz YAZAR ADI : Erdal AKGÜNEY Günümüzde bireyselliğin giderek yaygınlaşması sonucunda sosyal ilişkiler yok denecek kadar azalmış, iş yerleri insanlar için sosyalleşmenin yaşanabildiği nadir mekânlardan birisi olarak tebarüz etmeye başlamıştır. Ayrıca ölüm ve ötesi ile manevi ve ahlaki değerler, üzerinde fazlaca durulup düşünülen konular haline gelmeye başlamıştır. Bu ve benzeri sebeplerle önemi artan ruhsallık konusu son yıllarda akademik dünyada da yoğun bir şekilde ilgi görmeye ve üzerinde giderek artan sayıda çalışmalar yapılmaya başlanmıştır. Modelimiz, yukarıda anılan ruhsallık çalışmaları kapsamında olmak üzere Fry (2003) tarafından geliştirilmiş olan, Ruhsal Liderlik Teorisi baz alınarak oluşturulmuştur. Anılan bu modelimiz Ruhsal Liderlik olgusunun Duchon ve Plowman'dan (2005) alınan Bireyin Ruhsal Esenliğinin aracılık etkisi altında Örgütsel Bağlılık ve Verimlilik alt bileşenlerinden oluştuğu varsayılan Örgütsel Çıktılar'a etkisi üzerine kurulmuştur. Bankacılık ve Faizsiz Finans Sektörleri bağlamında yürütülen çalışmamız kapsamında İstanbul ilinden elde edilen (geçersiz veriler sayılmazsa) 225 adet veri çeşitli analizlere tabi tutularak öncelikle modelin (Bireyin Ruhsal Esenliğinin aracılık etkisi de ayrıca incelenerek) her iki sektör için de geçerliliği saptanmaya çalışılmıştır. Sonrasında ise boyutların alt bileşenlerinin de birbirleriyle ilişkileri incelenerek etkilerin esas kaynakları ortaya konmaya çalışılmıştır. Veri analizlerinin son aşamasında ise tezimizin temel amacı olan Ruhsal Liderlik değerleri açısından Bankacılık ve Faizsiz Finans Sektörleri arasında bir farklılık olup olmadığı gösterilmeye çalışılmıştır. Elde edilen bulguların yorumlanarak değerlendirmelerde bulunulduğu son bölümde çalışmamızda karşılaşılan kısıtlar açıklandıktan sonra araştırmacılara ve yöneticileri önerilerde bulunulmuştur."
