abstract: "Biz bu tezimizde kadın erkek eşitliği problemi ve bunun fıkhi düşünceye yansımasını imkânlar ölçüsünde incelemeye çalıştık. Bu çalışmamıza kadın erkek beyninin fizyolojik ve biyolojik farklılığı ve bu probleme etkilerini inceleyerek başladık. Birinci bölümde ilk çağda kadının durumunu incelerken doğu ve güneydoğu Asya'da Çin'de Tibet toplumunda eski Türklerde Mezopotamya da Sümer'de Babil de Asur'da Anadolu da Hititler'de Hurriler'de ege bölgesinde mısır da Suriye ve Filistin'de İran'da roma da İslam'dan önce ortaçağ türk devletlerinde kadının sosyo kültürel yapısına konumuna baktık. Daha sonra Ortaçağda kadını incelerken Yahudilikte kadının konumunu Hristiyanlıkta kadının konumunu cahiliye döneminden İslam'a geçiş sürecinde kadının konumu cahiliye ve İslam da kadının konumuna ilişkin değerlendirmeleri irdeledik. İkinci bölümde ise İslam'da kadın erkek eşitliği probleminin fıkhi düşünceye yansımalarını ortaya koymaya çalıştık. Bu bağlamda klasik dönem müelliflerin görüşlerine ve çağdaş yazarların ortaya koydukları yeni yaklaşımları ele almaya çalıştık. Ne feminist iddiaların ve ne de kadın karşıtı söylemlerin her iki cinse de mutluluk veremeyeceği; yalnızca karşılıklı anlayışın hâkim olduğu bir arada yaşama fikrinin taraflara ve toplumlara mutluluk getireceğini kolaylıkla söyleyebiliriz. Çalışmamız neticesinde kadın ve erkeğin farklı fizyolojik, biyolojik ve psikolojik özelliklere sahip oldukları ve buna göre kadınla erkeğin eşit değil, farklı nitelikleriyle birlikte eşdeğer oldukları kanaatine ulaştık."
