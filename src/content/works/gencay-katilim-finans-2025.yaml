abstract: "İslami finansın gelişimiyle birlikte, ülkemizde hem İslami finansal ürünlerin çeşitliliği artmakta hem de bu ürünlere yönelik ilgi giderek yükselmektedir. İslami finans okuryazarlığı, farkındalık ve bireysel davranış gibi çeşitli parametreleri ölçmeye yönelik birçok çalışma mevcuttur. Ancak, İslami finans algı düzeyinin yatırım kararlarını nasıl şekillendirdiğine dair derinlemesine analizler nispeten sınırlı kalmaktadır. Bu çalışmanın temel amacı, bireylerin İslami finans algı ve bilinç düzeylerinin yatırım davranışlarını nasıl şekillendirdiğini anlamaktır. Araştırma, Isparta İl Müftülüğünde görev yapan on sekiz Diyanet personeli ile gerçekleştirilmiş olup, onların İslami finans konusundaki algılarının yatırım tercihleri üzerindeki etkisi analiz edilmiştir. Çalışmada nitel araştırma yaklaşımlarından fenomenoloji yöntemi benimsenmiş ve veri toplama tekniği olarak yarı yapılandırılmış görüşme kullanılmıştır. Bu kapsamda, katılımcılara yöneltilmek üzere beş demografik, beş algı ve beş davranış sorusundan oluşan bir mülakat formu hazırlanmıştır. Elde edilen bulgular betimleyici analiz yöntemi ile sistematik bir şekilde değerlendirilmiş ve detaylandırılmıştır. Çalışmanın birinci bölümünde, İslami finansın temel ilke ve kavramları, faizsiz finans araçları ve bu araçların kullanım alanları ele alınmıştır. İkinci bölümde ise, İslami finans algısı, bireylerin finansal okuryazarlık düzeyleri ve bu algının yatırım davranışlarıyla ilişkisi, mevcut literatür çerçevesinde değerlendirilmiştir. Ardından, saha araştırmasının bulguları bu bağlamda analiz edilmiştir. Araştırma sonuçları göstermektedir ki Diyanet personelinin büyük bir kısmı, İslami finans konusunda temel bilgilere sahiptir ve yatırım tercihleri, sahip oldukları algı ve bilinç düzeyleriyle büyük ölçüde örtüşmektedir."
