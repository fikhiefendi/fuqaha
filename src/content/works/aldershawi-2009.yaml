abstract: "Tezimde vakfın tanımı açısından; vakfedenlerin şartlarını, vakıf hükümlerini ve vakıf yöneticisinin muhalefet yetkisini inceledim. Tezi bir giriş ve iki bölüme ayırdım. Girişte vakfın tanımını, hükmünü, çeşitlerini ele aldım. Daha sonra vakfın şartlarına değindim ki bu, vakfın şartım ve vakfeden kişinin onu bir menfaat için vakıf etmesidir. Bu şartlar, vakıf edilenin bizzat kendisi ile olabileceği gibi ondan yararlananlarla ilgili de olabilir. Birinci bölümde vakfedenlerle ilgili sahih şartlardan bahsettim. Bunların fasit şartlardan ayrılan günlerine değindim. Buna göre sahih şart şeriate ve aktin gereğine aykırı olmamalıdır. Ayrıca Şeriati aykırı olan şartlardan ve vakıf edenin şart koştuğu haram, mekruh, mübah şartlardan da bahsettim. İkinci bölümde devlet ile vakıf arasındaki ilişkiyi anlattım ki vakıfları korumak ve kontrol etmek devletin görevidir. Daha sonra vakfın satışı, şeklinin değiştirilmesi, ondan istifade yolları, vakfın sınırlandırılması, masraflarının değiştirilmesi, tüm camilerin vakıflarının tek hesap ve tek idare altında birleştirilmesi gibi vakıfların tek çatı altında toplanması konularında vakıf yöneticisinin, vakıf edenlerin şartlarına muhalefet etme yetkisinden bahsettim. Ayrıca devletin,vakfı devletin bir parçası haline getirip vakıf mallarını devletin mallarına katması otoritesinden bahsettim. Sonuç olarak; vakıf yöneticilerine yönelik bazı tavsiyeler ile rehberlik sonuçlarıyla tezi tamamladım."
