abstract: "Bu araştırma, Nisâ sûresindeki ahkâm âyetlerini Ömer Nasuhi Bilmen'in Kur'ân-ı Kerîm'in Türkçe Meâl-i Âlîsi ve Tefsiri ile Muhammed ʿAlî es-Sâbûnî'nin Ravâʾiʿu'l-beyân tefsîri âyâti'l-ahkâm mine'l-Kurʾân isimli eserleri üzerinden mukayeseli bir yöntemle ele almaktadır. Çalışmanın temel amacı, ahkâm âyetlerinin bu iki eserde nasıl tefsir edildiğini ortaya koymak ve iki eserin benzerlikleri ile farklılıklarını tespit etmektir. Bu doğrultuda Nisâ sûresindeki ahkâm âyetleri; dilsel tahliller, nüzûl sebepleri ve fıkhî hükümler açısından iki eser özelinde tetkik edilmiştir. Nitekim elde edilen bulgular, söz konusu tefsirlerin yöntem ve içerik açısından pek çok ortak paydada buluştuğunu göstermektedir. Araştırma sonucunda Bilmen ve Sâbûnî'nin, ahkâma dair âyetleri birbirini teyit edici ve konunun farklı boyutlarını ortaya koyarak bütüncül bir bakış açısı sunan bir yaklaşımla tefsir ettiği saptanmıştır. Bilmen'in âyetlerin tefsirinde mezhepsel çeşitliliklere ihtiyaca binaen yer verdiği ve Hanefî mezhebinin görüşlerini öncelediği, Sâbûnî'nin ise mezheplerin görüşleri ile delillerini mukayeseli bir yöntemle verip bazen tercihlerde bulunduğu tespit edilmiştir."
