abstract: "Bankacılıkta türev ürünlerin kullanımı, 2019 yılında bankacılık sektörünün aktif büyüklüğü kadar büyüklüğe ulaşmıştır. Bankaların hem kaynak yapılarının çeşitlendirilmesi hem de yeni gelir getirici kaynaklar oluşturmak adına özellikle finansal türev ürünlerin kullanımlarında işlem hacimleri giderek artmaktadır. Çalışmanın temelini Katılım Bankalarının bankacılık sektörü içerisindeki payının daha artırılabilmesi için türev ürünlerin kullanımının teşvik edilmesi gerekliliği yaklaşımı oluşturmaktadır. Bu çalışmamız türev ürünlerin kullanımının Katılım Bankalarının finansal performanslarına etkisinin incelenmesi üzerine yapılmaktadır. Katılım bankalarının bilançolarının aktif kalemleri içerisinde yer alan türev ürünler dikkate alınarak, Katılım Bankalarının aktif kalitesi, sermaye yeterliliği, kârlılık ve likidite gibi finansal performans ölçütlerine olan etkisi incelenerek gelecek açısından bir perspektif oluşturulmaya çalışılmıştır. Türev ürünlerin kullanımının Katılım Bankaların finansal performansına etkisi sonuç itibariyle değerlendirildiğinde, çalışmada kullanılan CAMELS performans kriterlerinden aktif kalitesi, sermaye yeterliliği, kârlılık ve likidite kriterleri açısından bakıldığında olumlu sonuçlar ortaya çıkmıştır. Türev ürünlerin kullanımının artması ile katılım bankalarının aktif kalitelerinin ve sermaye yeterliliklerinin yükseldiği görülmektedir. Türev ürünlerin likidite ve kârlılık ölçütlerine olumlu etki etmediği ortaya konulsa da türev ürünlerin kullanımı diğer hazine işlemlerini tetiklediği, özellikle dış ticaret müşterileri kazanımı noktasında pozitif katkı sağladığı görülmektedir."
