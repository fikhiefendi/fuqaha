abstract: "Bu çalışmada İslam fıkhında avcılık ve av hükümleri Kur'ân, sünnet ve mezheplerin farklı görüşleri açısından incelenmiş ve İslam dininin avcılıkla ilgili ortaya koymuş olduğu hükümler tespit edilmeye çalışılmıştır.Av genel olarak İslam dininin izin verdiği bir eylemdir. Ancak dinî açıdan sağlıklı ve geçerli bir avlanmanın yapılabilmesi için av, avcı, av alet ve hayvanlarının taşıması gereken bir takım şartların yerine getirilmesi gerekir. Söz konusu şartlardan herhangi birinin yokluğu avın etinin yenemeyeceği sonucunu doğurur. Avlaklar açısından değerlendirildiğinde av mekânları harem dışı alanlar ve harem bölgesi olmak üzere ikiye ayrılır. Bu iki yerde yapılan avların farklı sonuçları olur. Devlet gerektiğinde av yasağı koyabilir. İslam dini genel olarak eşya ve hayvanlara merhametle yaklaşılmasını ister. Bundan dolayı zevk için ve ekonomik bir getirisi olmayan avlanmalara sıcak bakmaz. İslam dini her şeyde olduğu gibi avlanmada da israfı yasaklar ve tabiatı mümkün olduğunca tabii halinde bırakmayı tavsiye eder."
