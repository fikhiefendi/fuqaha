abstract: "Bu çalışma, tasavvufî yardımlaşma anlayışı ile Birleşik Krallık'taki“charity”modelini mukayeseli olarak incelemektedir. Tasavvuf ve fütüvvet temelli prensiplerden hareketle, geleneksel tasavvufî yardımlaşma müesseseleri olan vakıf, tekke ve Ahîlik yapılanmaları kurumsal boyutlarıyla ele alınmakta; bu tarihsel mirasın günümüz tasavvufî yardım organizasyonları açısından taşıdığı imkânlar ve kurumsal kapasite unsurları yeniden değerlendirilmektedir. Bununla birlikte Birleşik Krallık'ta“charity”modelinin, özellikle“charity shop”pratiği üzerinden görünürleşen gelir üretme kapasitesi ve modern operasyonel yetkinlikleri analiz edilerek karşılaştırmalı bir değerlendirme zemini oluşturulmaktadır. Elde edilen bulgular doğrultusunda çalışma, irfan ahlâkı ve tasavvufî yardım geleneğiyle bütünleşik, sürdürülebilir gelir üretme mekanizmasını kurumsal yapıya entegre eden hibrit bir“hayırsever dükkân”işleyiş modeli önermektedir."
