abstract: "Türkiye'nin iktisadî tarihi incelendiğinde, enflasyon ve paranın değer kaybetmesi durumlarına çok sık rastlanıldığı görülmektedir. Enflasyonist ortam, hem ekonomik açıdan belirsizliğe neden olmakta hem de diğer devletlerle rekabet etme gücünü azaltmaktadır. İktisadî açıdan dengesizliğin ve enflasyonist durumun varlığı ayrıca yabancı yatırımcının ülkeden çekilmesine neden olmakta, ileriye yönelik süreçte ise yatırım yapmasına engel olmaktadır. Böylece dış ticaret dengesi bozulmaktadır. Öte yandan kişiler arasındaki hukukî ilişkilerde para borçlarının vaktinde ödenmemesi ve alacaklıların mağdur olması gibi istenmeyen durumlar da gelişmektedir. Bu çalışma, küreselleşmenin ivmesiyle artan ve büyük ticarî ihtilaflara yol açan yabancılık unsuru taşıyan borç ilişkilerinde faiz meselesini milletlerarası özel hukuk disiplini çerçevesinde incelemektedir. Mevcut Türk milletlerarası özel hukukunda, faize uygulanacak hukukun açıkça düzenlenmemiş olması, tezin temel bilimsel sorunsalını oluşturmaktadır. Tez, yabancılık unsuru içeren faiz ihtilaflarını iki ana eksende derinlemesine analiz etmektedir: Akla gelen ilk mesele, uygulanacak hukuktur. Çalışma, öncelikle sözleşmesel ve sözleşme dışı borç ilişkilerinde faiz alacağına hangi hukukun uygulanacağını tespit etmeye odaklanmaktadır. Bu kapsamda faizin vasıflandırması yapılmakta ve kanunlar ihtilâfı kuralları ışığında uygulanacak hukuk belirlenmektedir. Diğer bir mesele ise yabancı hükümlerin icrası (tanıma ve tenfiz)dir. İkinci ve kritik eksen, faizle ilgili yabancı mahkeme kararlarının Türkiye'de tanınması ve tenfizi sürecini incelemektedir. Bu doğrultuda tezin özgün katkısı, özellikle Türk hukukunda kamu düzeni ilkesinin ve doğrudan uygulanan kuralların faiz meselelerine ne şekilde müdahale edeceğinin analizi ile ortaya konmaktadır. Zira yüksek faiz içeren veya faizi tamamen yasaklayan yabancı mahkeme kararlarının tenfizi, Türk kamu düzeni açısından en tartışmalı ve uygulaması zor meselelerdendir. Çalışma, karşılaştırmalı hukuktaki (İslam hukuku, Alman hukuku, İsviçre hukuku, İngiliz hukuku ve CISG) faiz düzenlemelerini inceleyerek uluslararası bir perspektif sunmakta ve ortaya çıkan normatif boşluğa somut çözüm önerileri getirmeyi hedeflemektedir. Sonuç olarak, bu tez, uluslararası ticarî güvenirliğin korunması ve yabancı yatırımın teşvik edilmesi açısından hayati öneme sahip olan faiz ihtilaflarının etkin ve öngörülebilir bir şekilde çözümlenmesine yönelik sistematik ve analitik bir rehber sunmaktadır."
