abstract: "İslam ülkesinde devletin idaresi altında bulunan vatandaşlar İslam'ı kabul edip, etmeme durumuna göre Müslüman ve Müslüman Olmayan olarak iki kısma ayrılırlar Modern devletlerde ise buna benzer çoğunluk-azınlık vb. gibi ayrımlar yapılmaktadır. Müslüman olmayan vatandaşlar da iki kısımda incelenir. Bunlar vatandaş sıfatında olanlar ki bunlara ?zimmi? denir. İslam ülkesinde devlet ile sulh yaparak onun vatandaşlığını ve kendisini korumasını kabul etmiş kimseye de ?zimmi? denir. Yabancı devlet vatandaşı olanlar ki bunlara da müste'men denir. Müste'men olan kimselerle anlaşmalarda ve sulh şartlarında belirtilen hususlara riayet edilir.İslam ülkesinin vatandaşı sayılan gayrimüslimlerin şeref ve haysiyetleri, hayatları malları ve namusları Müslümanlarınki gibi korunur. Onların hak ve sorumlulukları konusunda şu kaide geçerlidir; ?Müslümanların hakları onların da hakları, Müslümanların sorumlulukları onların da sorumluluklarıdır?. Yine onların seyahat, toplanma, ibadet, öğrenme, öğretme vb. haklarından istifade ederler. Bu tür haklarda eşitlik ilkesi hakimdir. Dini hükümlerle yakın irtibatından dolayı ?ahvali şahsiye? denilen ve asıl konumuz olan evlenme, boşanma ve miras gibi konularda ise kendi inançlarıyla baş başa bırakmak esastır. Eğer kendi mahkemelerinde yargılanmayıp İslam mahkemelerine müracaat ederlerse, İslam hukukuna göre hüküm verilir."
