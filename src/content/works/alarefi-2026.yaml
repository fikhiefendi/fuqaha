abstract: "This study aims to examine the impact of Islamic financial engineering on the economic growth in Türkiye over the period 2015–2023. The research evaluates the contribution of Islamic financing instruments particularly Sukuk, Murabahah, Mudarabah, and Shari'ah-compliant investment funds to GDP growth, investment attraction, and financial stability. A descriptive-analytical methodology was employed to analyze the theoretical and conceptual framework of Islamic financial engineering, combined with a quantitative approach using data extracted from annual financial reports of Islamic banks in Türkiye. Statistical analysis was conducted using the SPSS program to measure trends, assess variable interactions, and interpret the results scientifically. The findings reveal that Islamic financial engineering functions as an effective mechanism for supporting economic growth in Türkiye. Sukuk and Murabahah instruments play a significant role in financing infrastructure projects and stimulating main productive sectors, which positively affects GDP. The analysis also indicates potential contributions of Mudarabah and Islamic investment funds to entrepreneurship and financial stability; however, their influence remains constrained by regulatory barriers and inflationary pressures. The study concludes that strengthening the legal and institutional framework, along with further development of Islamic financial products, is essential to enhance the efficiency of the financial sector in promoting sustainable economic growth in Türkiye."
