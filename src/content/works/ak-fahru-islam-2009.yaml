abstract: "Tezimizde Pezdevî'nin“Kenzu'l- Vusûl ilâ Ma`rifeti'l- Usûl”isimli eserinin, ?elfâz? bahisleri çerçevesinde, Fıkıh Usûlü ilmine katkısını incelemeye çalıştık.Tezimizin birinci bölümünde Pezdevî'nin hayatı ve“Usûl”ü hakkında bilgi verdik. İkinci bölümde Pezdevî'den önceki Fıkıh Usûlü'nün gelişimi ve bu dönem alimleri hakkında bilgi verdik. Üçüncü bölümde elfâz bahislerini kıyaslayarak Pezdevî'nin katkısını ortaya koymaya çalıştık. Ayrıca tezimizin sonuna üzerinde çalıştığımız dört usûl eserinin muhtevasını tablo olarak ekledik.Tezimizin sonunda vardığımız sonuç; Fıkıh Usûlü'nün gelişim süreci Pezdevî ile kemale ermiştir. En tutarlı ve sistematik eseri o ortaya koymuştur. Bundan dolayı da günümüze kadar gelen Usûl anlayışı Pezdevî'nin eserinin üzerine inşa edilmiştir."
