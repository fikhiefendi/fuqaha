abstract: "İslam şeriatının temel kaynakları, Kur'an, Sünnet, icma ve kıyastır. Bu kaynaklar konusunda âlimler ittifak etmişlerdir. Ancak âlimlerin ihtilaf ettikleri bazı kaynaklar vardır. Bunlar da mesâlih-i mürsele, istihsan, örf ve öncekilerin şeriatı gibi kaynaklardır. Örf, geçmişten günümüze kadar fıkıh ve fıkıh usulü araştırmalarında büyük bir öneme sahiptir. Âlimlerin örfe olan ilgileri, ihtilaf konusu delillerden feri bir delil olmasından kaynaklanır ve bu konumu bakımından belirgindir. Örfün dikkate alınmasını gerektiren en önemli özelliği, İslam hukukunun bütün zaman ve mekânlarda salahiyet ve geçerliliğini sağlamasıdır. Örf, fakihler nezdinde şeri delillerden bir delil olarak sayılmaktadır. Onun üzerine farklı mezheplerde birçok fıkhi meseleler terettüp etmektedir ve ondan birçok fıkhi kaide doğmuştur. Müçtehit ve fakihlerin mezheplerine baktığımızda kendisinde örfün uygulandığı birçok meseleyi görürüz. İslam, örfün insanların çıkarlarını sağladığı ve şeriatın herhangi bir hükmüne aykırı olmadığı sürece, insanlara menfaati sağlamak amacıyla onu hükümlerin verilmesinden esas bir merci kılmıştır. Bu bakımdan, insanlar üzerindeki zorluk ve sıkıntıların kaldırılmasını sağlar, çünkü zorluk ve sıkıntılar insanların geleneğine uymadığı gibi Şeriatın amaçlarına da aykırıdır. Fakat gelenek ve görenekler tek tip bir formda değildir, iyi ve kötü olmak üzere ikiye ayrılır. Fıkhi hükümleri etkileyen örf, şeriatın maksatlarını gerçekleştiren örftür. Kötü ve fasit örflerin hükümler üzerinde hiçbir etkisi yoktur. Dolaysıyla iyi örfün önemi hukukçu, hâkim ve müftü tarafından tahsis edildiğinde veya kısıtlandığı zamanda ortaya çıkar. Hukukçu ve âlimlerde örfün hiçbir zaman Allah ile şari olmadığına dikkat edilmelidir. Şeriatın gelenek ve göreneklere uyması, ümmet için bir kolaylaştırma ve merhamet meselesidir. Aksi takdirde, hükmün kaynağı şeriatı indiren yüce Allah'tandır; yoksa hükmü içeren nassa muvafık gelen örf değildir. Eğer yüce Allah örfü tanıtmaya ve onunla ilgili hükümlerin oluşturulmasına izin vermişse, Allahtan alınan bu izin kaynaktır, örfün bizzat kendisi değil. İslam hukuku hükümlerinin bazılarıyla uyuşmazsa, insanların alışkanlıkları ve gelenekleri geçerli değildir. Örf, nefis ve akılları etkilemekte büyük bir rol oynar. Eğer insanın nefsi ve aklında yerleşmişse, artık yaşamın bir gereği olarak kabul edilir. Psikologların ifade ettikleri gibi, bir işi tekrar etmek ve onu sürekli uygulamakla özellikle bu örfün kaynağı hacet ise, sinir, nefis, akıl ve organlar bu işe alışmış bir hale gelir. Şariin örfe olan değeri, Kur'ân-ı Kerîm ve hadis-i şeriflerin naslarının, vahinin indiği zamandaki Araplar nezdinde yaygın kavram ve onlar tarafından bilinen manalara uygun olmasında açığa kavuşmaktadır. Usulculara göre örf, sebep, alaka düzeyini, metnin mastarı veya örfün dilsel anlamının ışığında, birkaç bölüme ayrılır. Zira örf, sebep ve alaka düzeyi ışığında kavli ve ameli olmak üzere ikiye ayrılır. Ameli örfün, hüküm, fetva verme ve sözleşmelerin etkilerini kısıtlama gibi bir yetkiye sahiptir. Aynı zamanda örf, kaynak olarak has ve umuma ayrılır. Şeriat kurallarına ve metinlerine uygunluğu açısından ise, sahih ve fasit şeklinde ikiye ayrılır. Örf, Kuran'ın metni, Sünnet veya icma gibi kendi başına var olan bağımsız bir kanıt değildir, ancak kuralın bir tezahürüdür. Fakihler arasında örfün dikkate alınması, aşağıdakileri içeren bir takım şartlar gerektirir: galip ve yaygın olması, eylem ve işlemlerin oluşturulduğu zamanda var olması, kanun ve yasalara kesinlikle aykırı olmaması gibi şartlara uymalı. Örfün önemine gelince, Fakihlerin örfe dayalı birçok hükmü verdikleri nakledilir. Bir kısmı, (Muhkem örf) ve (zaman geçimiyle hükümlerin değişmemesi inkâr edilmez) hükümleridir. Şeriat ayrıca, bu şeri metinlerin, teşrin geldiği zamandaki olağan anlamları ışığında anlaşılmasını gerekli kılmıştır. Bu durumun gereği olarak, o zamanda Araplarda yaygın olan yaygın olan örfle umumun tahsisinin yapılmasıdır. Bunula birlikte, bu mesele, tahsise salahiyeti olan örfün türü, kriterleri ve coğrafi sahası gibi bazı sorunları yaratmıştır. Bu nedenle, âlimler umama tahsis olacak örfün türü ve dikkate alabilmesi için gerekli olan şartları belirletmişler. Böylece, beşeri örfler İslam şeriat metinlerinin nasihi olmayacaktır. Âlimler tahsis edilebilecek örfün türünde ihtilaf etmişlerdir. Cumhur, tahsisi sadece semavi vahyin nüzulüyle paralel olan örf ile sınırlandırmıştır Diğerlerine göre ise, tahsis edilecek olan örf, vahiy nüzul zamanında umumun nassına karşılaştırmalı olduğu sürece kavli ve ameli örfü birlikte değerlendirmesi gerektiğini belirtmişlerdir. Ancak fakihler, nübüvvet zamanından sonra meydana gelen örfün umuma tahsis etmediği konusunda ittifak etmişlerdir. Buna binaen, şariden umuma has bir şeriat nassı geldiği sırada insanlara has bir örfü varsa veya umumun metininde birbirleriyle olan ilişkilerinde belirli bir örfe sahipse, cumhura göre, umumun nassı bu yaygın olan örfle tahsis edilemez. Hanefi ve Maliki âlimlerine göre ise,"
