abstract: "Soruşturma evresi, bir kimsenin kanunlarca yasak olan bir fiili irtikâp edip etmediğinin araştırıldığı sürece verilen isimdir. Muhakemenin üç evresinden biri olan soruşturma evresinde devlet görevlisi meydana gelmiş olayı ve olay mahallini inceleyerek mahkeme için deliller toplar. Bu sayede muhakemenin görülmesi mümkün hale gelir. İhtiyati tedbirler de soruşturma evresinde başvurulan bir takım önlemlerdir. Arama, yakalama, gözaltına alma, tutuklama gibi tedbirler sayesinde zanlının kaçması ya da delilleri karartması engellenmiş olur. Zanlı hakkındaki soruşturma sağlıklı bir şekilde yapılır ve sonuçta zanlı devlet görevlilerince mahkemeye teslim edilir. Bu çalışmada ihtiyati tedbirlerin İslam hukukundaki teorik boyutu ile Osmanlı hukukunda pratiğe yansıması incelenmiştir. Bu sayede hürriyeti sınırlandırıcı ve zanlıya haksız yere zulüm etme ihtimali niteliği taşıyan bu uygulamaların hangi şekillerde caiz görüldüğü ve ne gibi durumlarda söz konusu uygulamalara başvurulduğu ortaya konulmaya çalışılmıştır. Ayrıca ihtiyati tedbirlerin modern hukuktaki şekli olan koruma tedbirleri ile benzerlikleri yeri geldikçe ifade edilmiştir."
