abstract: "Bu tez, râşit halifeler döneminde konulan şer'î siyasi hükümlerin maslahat-ı mürsele prensibi ekseninde verildiği bilgisini muhtevidir. Bu çerçevede tez giriş, üç bölüm ve sonuç kısmından oluşmaktadır. Girişte tezin amacı, önemi, konusu, tezin yöntemi ve konuyla ilgili yapılmış çalışmalara değindik. Birinci bölümde maslahat-ı mürsele kavramını açarak mürsel maslahatların kaynaklık değerini, ölçütlerini, kısımlarını, derecelerini ve maslahat-ı mürsele'den kastın ne olduğunu deklare ettik. İkinci bölümde siyâset-i şer'iyye kavramını ele alarak İslam hukukundaki yerini, önemini, fıkhî delillerle olan irtibatını ve siyâset-i şer'iyye'ye uygun olarak verilen hükümlerin meşruiyetini izah ettik. Nitekim hukuk metinlerinin doğru analiz edilmesinde metodoloji kadar kavramların neyi ifade ettikleri de önem arz eder. Üçüncü bölümde maslahat-ı mürsele'nin, râşit halifeler döneminde ortaya çıkan siyasi olayların hükümlerine kaynaklık değerini inceledik. Râşit halifelerin, devlet başkanı olarak uygulamaları ve verdikleri hükümler, İslam hukukunun teşekkül sürecinde büyük rol üstlenmiştir. Erken dönemin daha iyi anlaşılabilmesi adına râşit halifeler döneminde yapılan içtihatların incelenip değerlendirmeye tabi tutulması büyük bir önemi haizdir. Bu noktada râşit halifelerin kendi dönemlerindeki siyasi görüşlerinde içtihat ettiklerini ve bu tasarruflarında maslahat prensibini gözettiklerini ortaya koymaya çalıştık. Sonuç kısmında ise ulaşmış olduğumuz hususları ifade ettik. Anahtar Kelimeler Râşit Halifeler, Maslahat-ı Mürsele, Siyâset-i Şer'iyye"
