abstract: "Bu çalışmayla 19. yüzyılın son döneminde Samsun bölgesinin dini, sosyal, ekonomik ve kültürel açıdan durumunun tespitine katkıda bulunmayı hedefledik. Samsun'la ilgili kırk üç adet şer'iyye sicil defteri bulunmaktadır. Bu defterlerden on üçü ile ilgili çalışma yapılmıştır. Diğerleri ise henüz çalışılmamıştır. Yaptığımız bu çalışmayla hem Samsun'un tarihine katkıda bulunduk hem de bu şer'iyye sicillerinden birini transkribe ederek ilim dünyasına kazandırdık.Çalışma 1782 numaralı ve 1888-1889 tarihlerini içeren Samsun Şer'i Mahkemesine ait şer'iyye sicil defterinin tahlilidir. Tez, giriş hariç iki bölümden oluşmaktadır. Giriş kısmında, araştırmanın problem ve önemi, veri toplama araçları, araştırmanın sınırlılıkları ile kullanılan yöntemler hakkında bilgi verilmiştir.Birinci bölümde şer'iyye sicillerinin tanımı ve Samsun mahkemelerinde tutulan şer'iyye sicil defterleri ve bunlar üzerinde günümüze kadar yapılan çalışmalar belirtildikten sonra, 1782 numaralı Samsun şer'iyye sicil defterinde geçen kayıtlardan yola çıkarak, Samsun'un 19. yüzyıl sonlarındaki sosyal, kültürel, ekonomik ve idari yönlerden değerlendirmesi yapılmıştır.Çalışmanın ikinci bölümünde asıl metnin latin harflerine traskripsiyonu yapılmıştır. Transkripsiyon yapılırken kayıt başlarında içerikle ilgili kısa özet verilmiştir. Sonuç kısmında incelediğimiz şer'iyye sicil defterinden çıkarılan sonuçlar kısaca belirtilmiştir.İncelediğimiz 1782 numaralı defterde iki yüz elli bir adet kayıt bulunmaktadır. Kayıtlar vekil, kefil, vasi ve nafaka tayini; alacak verecek davası, tereke taksimi, kamu görevlisi tayini ve vakıflarlarla ilgili hükümlerden oluşmaktadır. Tanzimat fermanı sonrası, Osmanlı hukukunda yapılan yenilikler sonucunda şer'i mahkemelerin görev alanları daraltılmıştı. Bu sebeple defterimizde aile hukuku ile ilgili kayıtlar bulunmaktadır. Cezai konularla ilgili kayıt bulunmamaktadır.Çalışma 1888-1889 yıllarını ve o yıllarda mahkemeye intikal eden olayları kapsamaktadır. Kayıtlar toplumun tamamını kapsayacak durumda değildir. Dolayısıyla elde edilen sonuçları toplumun tamamına genellememiz ve geneli ilgilendiren bir hükme ulaşmamız düşünülemez."
