abstract: "Dijital bankacılık uygulamaları, Türkiye'deki katılım bankacılığı sektöründe, finansal kurumlar ile müşterileri arasında önemli bir ara yüz olarak kilit bir rol oynamaktadır. Bu çalışma, Türk katılım bankalarının dijital platformlarının tüketiciler tarafından nasıl kullanıldığını kapsamlı bir şekilde incelemeyi amaçlamaktadır. Analiz, Türkiye Katılım Bankaları Birliği'nin (TKBB)“Veri Peteği”platformundan elde edilen, 2020 ile 2023 yıllarını kapsayan geniş verilerden faydalanacaktır. Bu veriler, mobil bankacılık uygulamaları aracılığıyla gerçekleştirilen işlem hacmi ve türleri, kullanıcı etkileşimleri ve tercih edilen finansal ürünler gibi metrikleri içermektedir. Ayrıca, uygulama mağazalarındaki kullanıcı geri bildirimleri, kullanıcı duygu ve davranışlarındaki eğilimleri ortaya çıkarmak için ileri Doğal Dil İşleme (NLP) yöntemleri kullanılarak analiz edilecektir. Araştırma, dijital uygulamaların finansal işlemler üzerindeki dönüştürücü etkisini değerlendirmeyi ve kullanıcı dostu özelliklerdeki iyileştirmeler ile güçlendirilmiş siber güvenlik altyapıları sayesinde benimsenme oranlarında önemli bir artış olduğunu varsaymaktadır. Kullanıcı yorumlarından elde edilen duygu analizlerini de içeren bu çalışma, analiz edilen dönemde müşteri memnuniyeti ve sadakatindeki değişimlere ışık tutmayı hedeflemektedir. Elde edilen bulguların, dijital bankacılık yenilikleri için stratejik planlamalar yapan bankacılık profesyonelleri ve akademisyenlere değerli rehberlik sağlaması beklenmektedir. Bunun yanı sıra, çalışma, kullanıcı deneyimini artırmada ve operasyonel verimliliği geliştirmede ileri teknolojilerin rolünü ele alarak, katılım bankacılığında dijital dönüşüm konusundaki akademik tartışmalara katkıda bulunmayı amaçlamaktadır. Kullanıcı geri bildirimlerinden faydalanarak daha sezgisel ve güvenli dijital platformlar tasarlama sürecinde belirli alanları tespit etmeyi hedeflemektedir. Bu çaba, müşteri odaklı yenilikçiliğin önemini vurgulamakla kalmayıp, dijital bankacılık benimseme oranları, müşteri memnuniyeti ve stratejik karar alma süreçleri arasındaki bağlantılarla ilgili literatürdeki boşlukları doldurmayı amaçlamaktadır."
