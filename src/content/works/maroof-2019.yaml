abstract: "Yusuf el-Erdebîlî'ye ait el'Envâr li-a'mâli'l-ebrar isimli eser, başta ilmi icazet almak isteyen âlimler ve fakihler olmak üzere âlimlerin geleneksel klasik medreseler ve camilerde ellerinden düşürmedikleri eserlerden biridir. Fakihler bu eseri el-Envârü'l-kebîr olarak isimlendirmişlerdir. Yüksek ilmi konumundan dolayı ifadelerini ilim taliplerine kolaylaştırmak için onun üzerine birçok haşiye yazılmıştır. Şirvânî ve Hâcî İbrahîm haşiyeleri de bunlardandır. Konumuz ise Haşiyetu Molâ Muhammed el-Kürdî ismi ile bilinen onun bir başka haşiyesidir. Türkiye Cumhuriyeti Bingöl Üniversitesi'nde devam eden iki senelik ders döneminden sonra oranın ilgili öğretim üyeleri birçok öğrenciye Haşiyetu Molâ Muhammed el-Kürdî eserini tahkik etme konusunu vererek bu eseri onların arasında bölüştürdüler. Danışman hocam Doç. Dr. İbrahim Özdemir, bu haşiyeden namaz bölümünü konu olarak çalışmamı önerdi ve kabul ettim. Ondan sonra bu eserin asıl yerini bilmediğim ve elimde istinsah edilen sadece bir nüsha bulunduğundan dolayı kütüphane, kaynaklar ve mahtûtların fihristlerinde ona dair bilgileri araştırdım. Bu araştırmanın sonucunda girişte zikredeceğimiz gibi Allah'ın yardımıyla dört diğer nüshasını da buldum. Eserin farklı nüshalarını bulduktan sonra onları okumaya başladık. Onlardan bir tanesini ( (أkarakteri ile belirledik ve onu bilgisayar ortamına geçirerek diğer nüshaları onunla karşılaştırdık. Tezimizi, tahkik ve dirase olmak üzere iki bölüme ayırdık. Dirase kısmında Molâ Muhammed el-Kürdî'nin ismini, nispetini, lakabını, künyesini, ailesini, aşiretini, eserlerini, ilmi hayatını, haşiyede izlediği yöntemi ve haşiyede beslendiği kaynakları ele aldık. Çalışmanın aslı olan ve tahkike ayırdığımız ikinci bölümde ise metnin tahkiki, ayet ve hadislerin kaynaklarını belirlemeye çalıştık. Bununla birlikte mümkün olduğunca söz konusu haşiyede yer alan âlim ve yerlerin biyografisini verdik ve kitabın başından sonuna kadar müellifin referans gösterdiği kaynakları dipnotta belirttik. Ondan sonra sonuç ve kaynaklara yer verdik."
