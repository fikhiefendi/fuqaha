abstract: "Tayland hükûmeti, Tayland'ın güney sınır illeri olan Patani, Yala, Narativat ve Satun illerindeki Müslüman toplumun dinî haklarını tanımak ve korumak amacıyla, özellikle aile ve miras alanlarında İslâm hukukunun uygulanmasına izin vermiştir. Bu izin, Tayland'ın Medeni ve Ticaret Kanunu hükümlerinden farklılıklar içermekte ve yerel mahkemelerde İslâm hukuku hükümlerinin uygulanmasıyla sonuçlanmaktadır. İslâm hukukunun uygulanması, Datok Yutitam olarak bilinen nâib hâkim, Asliye Mahkemesi'nde yapılan yargılamalarda önemli bir rol üstlenmesiyle gerçekleşir. Datok Yutitam, hâkim ile birlikte duruşmalara katılarak, özellikle aile ve miras hukuku davalarında İslâm hukuku çerçevesinde nihaî kararlar verir. Bu kararlar, hukukî geçerlilik kazanması için imzalanarak onaylanır ve bağlayıcı hale gelir. Bu uygulama, İslâm hukuku ile Tayland'ın Medeni ve Ticaret hukuku sistemlerinin birlikte nasıl işlediğini ve bu iki hukuk sistemi arasındaki etkileşimlerin mahkemelerdeki karar süreçlerine nasıl yansıdığını anlamak açısından büyük önem taşır. Bu çalışma, İslâm hukukunun çocuk ve aile mahkemelerindeki uygulanışını analiz ederek, İslâm hukuku ile Tayland hukuku arasındaki benzerlik ve farklılıkları ortaya koymaktadır. Ayrıca, Datok Yutitam'ın rolleri ve bu rollerin mahkeme süreçlerindeki etkileri de incelenmektedir. Çalışmanın temel amacı, İslâm hukukunun Tayland'ın güney illerindeki sosyal ve hukukî yapıyı nasıl şekillendirdiğini ve bu bağlamda Tayland'ın genel hukuk sistemi ile nasıl bir bütünlük içinde işlediğini ortaya koymaktır."
