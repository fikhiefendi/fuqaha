abstract: "Katılım bankacılığı İslam dini finans prensiplerine dayanan bir bankacılık sektörü olarak, İslam ülkelerinde ortaya çıkmıştır. Bu bankacılık türünün ortaya çıkış noktası faizsizlik prensibine dayanmaktadır. İslam dininin kutsal kitabı olan Kur'an-ı Kerim'de faiz haram olarak tanımlanan bir kavramdır. Batılı ekonomi akımlarında önemli ve esas rol oynayan faiz kavramı ekonominin işleyişini sağlayan bir faktördür, ancak İslam dinindeki faizsizlik prensibini kabul eden katılım bankacılığında sistemin işleyişi için faiz değil kâr payı kavramı kullanılmaktadır. Bu sayede dini endişelerinden dolayı tasarruflarını yatırım olarak kullanamayan kişilerin, tasarruflarının değerlendirilmesi ve yatırıma dönüştürülmesi amaçlanmaktadır. Dini endişelerin yanı sıra, politik ve ekonomik sebepler de katılım bankacılığının ortaya çıkış nedenlerindendir. Uluslararası düzeyde gelişme ve ilerleme gösteren katılım bankacılığı sektörü, Türkiye'de ortaya çıktığı tarihten itibaren popülerliği artan ve ilerleme gösteren bir bankacılık sektörü olmuştur. Finans sistemi bütün bankalar ve merkez bankaları dahil olmak üzere bir bütün halinde işleyen ve çeşitli kanallar ve işlemler ile bankaların birbirleriyle aktif olarak etkileşim içinde olduğu bir sistemdir. Bu etkileşim ile katılım bankalarının üzerinde faiz etkisi olup olmadığı bu çalışmada araştırılan bir konudur. Bunun yanı sıra katılım bankacılığında faiz yerine kullanılan kâr payı sisteminin kullanılmasının somut anlamda faiz kavramı ile benzer olması sebebiyle, katılım bankacılığında faiz etkisinin araştırılmasını gerektirmektedir. Bu çalışmada katılım bankacılığında faiz etkisinin araştırılmasının yanı sıra, katılım bankacılığının Türkiye'de neden kullanıldığı ve kişilerin katılım bankacılığının faiz etkisi hakkındaki davranışları Türkiye'de bankacılık sektörünü kullananlar arasından 127 kişinin dahil olduğu anket yöntemi ile araştırılmıştır. Geçmiş ve güncel verilerden yararlanılarak, katılım bankacılığının geleceği tartışılmıştır."
