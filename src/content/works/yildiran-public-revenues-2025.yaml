abstract: "Modern toplumlar, devletin sosyal, ekonomik ve siyasal alanlardaki rolünün giderek genişlediğine tanıklık ederken, devletlerin kamu hizmetlerini finanse etmek amacıyla gerekli mali önlemleri almaları meşru görülmektedir. Bu bağlamda, bu tez Türkiye'nin kamu gelir yapısını İslam iktisadı perspektifinden değerlendirerek, İslam kamu maliyesi teorisinin mevcut gelir kompozisyonuna yönelik öngördüğü dönüşümleri analiz etmektedir. Değerlendirme sonucunda iki reform seti önerilmiştir. İlk reform seti, devlet mülkiyetinde veya tasarrufunda bulunan varlıklardan, özellikle madenlerden elde edilecek yeni kamu gelirleri ile şirket varlıkları, gelirler ve finansal servet üzerinden tahsil edilecek zekattan oluşan yarı kamu gelirlerini kapsamaktadır. İkinci reform seti ise mevcut kamu gelir kaynaklarından tüketim ve kişisel gelir vergilerini, İslam kamu maliyesi literatürüne dayanan vergilendirme ilkeleri ışığında yeniden ele almaktadır. Nicel yöntemler ve temelde mikro veri setleri kullanılarak yapılan tahminlere göre, 2022 yılında Türkiye'nin toplam zekat potansiyeli 560,76-709,09 milyar ₺ (GSYH'nin %3,74-%4,72'si) aralığındadır. Madenler humusa tabi olduğunda ise, ek kamu/yarı kamu gelirleri toplamda 958,29 milyar ₺'ye (kamu bütçesinin %29,50'sine) ulaşmaktadır. Buna karşılık, tüketim ve gelir vergilerine ilişkin önerilen düzenlemeler nedeniyle 921,10 milyar ₺ (kamu bütçesinin %27,93'ü) kamu geliri kaybı öngörülmektedir."
