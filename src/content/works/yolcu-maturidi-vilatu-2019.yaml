abstract: "III. y.y.'da Mâveraünnehr Bölgesi'nde yaşamış olan Mâturîdî (ö. 333/944) Hanefi Mezhebi'ne mensup olan müslümanların itikadda imamıdır. Siyasi çalkantının yoğun olduğu, bâtıl fırkaların yaygınlık kazandığı bir dönemde Ehl-i sünnet itikadının Mâveraünnehr Bölgesi'ndeki en önde gelen savunucusu olmuştur. İlmî tartışmaların çok yoğun bir şekilde yapıldığı bir ortamda yaşayan Mâturîdî Ehl-i sünnet itikadını Ebû Hanîfe'nin çizgisinde savunmuştur. Ebû Hanîfe'nin itikada dair görüşlerinin yanında fıkıh usûlü ve furuuna dair görüşlerini de benimsemiş, geliştirmiş ve yetiştirdiği öğrenciler ve bıraktığı eserler ile kendisinden sonraki nesle taşımıştır. Günümüze ulaşan iki eserinden biri olan Te'vîlâtu'l-Kur'ân adlı eseri dirâyet tefsirinin ilk örneği olmasının yanında fıkıh usûlü ve meseleleri konusunda da oldukça geniş bir birikim sunmaktadır. Bu çalışmamızda Te'vîlâtu'l-Kur'ân adlı eserinde Mâide Sûresi içerisindeki fıkha dair görüşlerini inceledik. İki bölümden oluşan çalışmamızda İmam Mâturîdî'nin hayatı, eserleri, ilmî kişiliği ele alınmış ve Mâide Sûresi'nde ele aldığı fıkhî görüşleri Hanefi Mezhebi'nin görüşleri ile karşılaştırılmıştır. Hanefi Mezhebi ile hangi hususlarda aynı görüşü paylaştığı tesbit edilmeye çalışılmıştır."
