abstract: "Modern dönemlerde en önemli sorulardan birisi klasik mezhep fıkhının dinamizminin var olup olmadığı meselesidir. Son iki asırdır bir kısım aydınlar tarafından klasik mezhep fıkhının dinamik olmadığına dair ciddi iddialar ortaya atılmıştır. Ancak klasik mezhep müntesibi olan fukahanın özellikle devlet erkanı tarafından ortaya konan, ekonomik ve sosyal yaşamın dinamiği konumunda olan örfi hukuk konularına yaklaşımları ele alındığında fıkhın dinamizminin mevcut olduğu görülür. Ancak bunun yanında modern yaklaşımın kendilerine istinat ettiği yaklaşımları bulunan fakihler de yok değildir. Hanefi fukahanın kimisi dinamizmden taraf olarak örfi hukuk konularının şeri hukukla uyumlu olduğu konusunda inisiyatif alarak bir çaba içerisine girerken kimisi de uyum çabasına giren fukahayı mezhebin zahirine ve genel yaklaşımına aykırı bularak eleştirmiştir. Çalışmamız yüksek lisans seviyesinde olduğu için külli bir arka plan sunulamasa da dönemde yaşanan tartışmaların arka planlarına yer verilmeye çalışılmıştır."
