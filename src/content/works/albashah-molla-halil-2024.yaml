abstract: "10/16. yüzyılda yaşamış olan İbn Hacer el-Heytemî, fıkıh ve hadis başta olmak üzere muhtelif alanlarda oldukça önemli eserler kaleme almıştır. O, insanların umursamadan günahlara daldıklarını düşünerek bundan sakındırmak amacıyla ez-Zevâcir 'an iktirâfi'l-kebâir adlı kitabını yazmıştır. Bu kitabında İbn Hacer; âyet, hadis ve âlimlerin görüşlerine referansta bulunarak 467 tane büyük günah (kebâir) çeşidinden ayrıntılı bir şekilde bahsetmiştir. Sonuç kısmında da tövbe, Cennet, Cehennem ve şefaat gibi konuları incelemiştir. 18. yüzyılın son yarısı ile 19. yüzyılın ilk yarısı arasında yaşamış olan Molla Halil es-Siirdî, bazı tasarruflarda bulunarak İbn Hacer el-Heytemî'nin mezkûr eserini ihtisâr etmiştir. O, bazı detayları hazfederek kısaltmalara gitmiş, metne yaptığı dokunuşlarla birtakım büyük günahları bir başlık altında toplamıştır. Böylelikle büyük günahların sayısını 467'den 203'e indirmiştir. Bu çalışmamızda biz, Molla Halil'in Telhîsu'z-Zevâcir adlı yazma eserinin sondan yaklaşık üçte birlik kısmını tahkik ettik. Tahkik çalışmamız;“cinâyetler”(cinâyât),“ridde”,“haddler”(hudûd),“yeminler”(eymân),“şehâdetler”(şehadât) ve“sonuç”(hâtime) bölümlerini kapsamaktadır."
