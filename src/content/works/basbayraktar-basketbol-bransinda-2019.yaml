abstract: "Bu araştırmanın amacı; 16 yaşındaki erkek basketbolcuların denge ve esneklik becerilerinin müsabaka içerisindeki şut ve ribaund performanslarına nasıl bir etkisinin olduğunun incelenmesidir. Bu amaç doğrultusunda Galatasaray, Fenerbahçe ve İstanbul Büyükşehir Belediyesi spor kulüplerinde basketbol oynayan 16 yaşındaki toplamda 15 oyuncu ölçümlere katılmıştır. Her takımdan 5'er oyuncu ve takımının en skorer oyuncuları değerlendirmeye alınmıştır. Bu sporculara Eurofit test protokolününden denge ve esneklik testlerini uygulamaları istenmiştir. Daha sonra oyuncuların 8 hafta boyunca maç istatistikleri toplanmıştır. Elde edilen veriler SPSS program kullanılarak analiz edilmiştir. Sonuç olarak; Denge puanları ile hücum ve savunma ribaunt sayıları arasında anlamlı ilişki olmadığı (p>0,05) tespit edilmiştir Fakat Denge puanları ile 2 sayı, 3 sayı ve serbest arasında pozitif yönlü ve anlamlı ilişki tespit edilmiştir. Denge puanı yüksek olan oyuncuların 2 sayı, 3 sayı, serbest atış, serbest atışı sayıları da yüksektir. Esneklik puanları ile savunma ribaunt, hücum ribaunt, 2 sayı, 3 sayı, serbest atış sayı, isabet ve yüzdeleri arasında anlamlı ilişki olmadığı tespit edilmiştir."
