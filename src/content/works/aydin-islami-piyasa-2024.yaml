abstract: "Bu çalışma, İslami piyasa ahlakının oluşum sürecinde karşılaşılan sorunları ve bu sorunların helal gıda piyasasındaki yansımalarını incelemektedir. İslam ekonomisinin temel ilkeleri doğrultusunda, helal gıda üretimi ve tüketiminde ahlaki ve etik değerlerin korunması büyük önem taşımaktadır. Ancak, günümüzde helal gıda piyasasında bilgi eksikliği, dini ve fıkhi ihtilaflar, hukuki boşluklar ve ekonomik baskılar gibi çeşitli sorunlar mevcuttur. Üç temel bölümden oluşmakta olan bu tez çalışmasının ilk bölümde, piyasa, ahlak, piyasa ahlakı ve İslami piyasa ahlakı kavramları incelenmiştir. Bu kavramsal çerçeve, okuyucunun İslami piyasa ahlakının temel prensiplerini anlamasına yardımcı olacak teorik bir zemin sunmaktadır. İkinci bölümde, İslami piyasa ahlakının oluşumunda karşılaşılan sorunlar detaylandırılmıştır. Bu bölümde, toplumsal bilgi, ilgi ve bilinç eksikliğinin yanı sıra dini ve fıkhi ihtilafların, devletin hukuki boşluklarının ve ekonomik baskıların İslami piyasa ahlakının gelişimini nasıl engellediği tartışılmıştır. Ayrıca, bu sorunların nedenleri ve sonuçları analiz edilerek, İslami piyasa ahlakının oluşturulması için çeşitli önerilerde bulunulmuştur. Son bölümde, İslami piyasa ahlakının bir pratiği olarak helal gıda piyasası incelenmiştir. Bu bölümde, helal gıda piyasasının karşılaştığı zorluklar, özellikle üretim, tedarik ve tüketim süreçlerindeki ahlaki ve etik sorunlar ele alınmıştır. Helal gıda piyasasında yaşanan sorunlar, İslami piyasa ahlakının oluşum sorunsalları çerçevesinde değerlendirilmiş ve bu sorunların çözümüne yönelik öneriler sunulmuştur. Tez, İslami piyasa ahlakının hem teorik hem de pratik boyutlarını ele alarak, bu alanda daha etkili ve sürdürülebilir bir yapı oluşturulmasına katkı sağlamayı amaçlamaktadır."
