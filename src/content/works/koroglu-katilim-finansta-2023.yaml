abstract: "Küresel sistemin ekonomik olarak buhrana girilmesiyle birlikte yeni arayışlar ve yeni söylemler gündeme gelmektedir. Böyle bir havada gelişimini tamamlamış ve krizlerden olumlu etkilenmiş katılım finansa olan ilgi artmıştır. Bu çalışmada katılım finansın ilk çıkışından başlanarak gelişim süreci hakkında bilgiler verilmiş ve bu ilginin nedenine değinilmiştir. Türkiye'deki katılım finans üzerine çalışan kurumlar hakkında bilgi verilmiş ve katılım finans kuruluşlarının kullandırdıkları fonlar ayrıntılı biçimde açıklanmıştır. Ardından çalışmanın uygulama kısmında Türkiye'de aktif olarak faaliyetlerini sürdüren altı katılım finans kurumunun fon kullandırma performansları kıyaslanmıştır. Bu kıyaslamayı yapabilmek için çok kriterli karar verme tekniklerinden olan LOPCOW ve MAUT yöntemleri kullanılmıştır. LOPCOW yöntemi sonucunda; fon kullandırma tekniklerinden en önemlisi krediler başlığı altında yer alan murabaha, müsaveme, selem, teverruk ve istisna yöntemleri olarak saptanmıştır. Son olarak ise katılım finans kurumların fon kullandırma performansları MAUT yöntemiyle ölçülmüş olup, bu ölçüm sonucunda belirlenen 2013-2022 yılları arası 10 yıllık zaman dilimi için performansı en yüksek finans kurumu, Kuveyt Türk olarak tespit edilmiştir."
