abstract: "Bu çalışmamız Kur'ân-ı Kerîm'de yer alan bazı kelimelerinin etimolojik tahlili ve anlam analizine ilişkin bir çalışma olup belirli kelimelerin ve türevlerinin cahiliye şiirlerinde, Kur'an'ın nüzûl döneminde, İslâmî dönem şiirlerinde ve ilk dönem sözlüklerindeki anlam araştırmasını kapsamaktadır. Bunun yanında incelenen kelimelerin Kur'an bağlamında ıstılâhî mâna kazanıp kazanmadığına da değinilmiştir. Söz konusu kelimelerin gerek mastarları gerekse kendilerinden türemiş olan müştakları tek tek tesbit edilip, Kur'an'da kaç defa, hangi âyetlerde, ve ne anlamda kullanıldığına dair bilgi verilmiştir. Son olarak ülkemizde bir hayli fazla olan meâl çalışmaları içerisinden üç meâl arasında bu kelimelere tespit edilen mânaların verilip verilmediği konusunda mukâyese yapılmıştır ve varılan neticeler belirtilmiştir. Yapılan karşılaştırmalar, kelimelerin doğru anlaşılmasının ve Kur'an'ın doğru yorumlanması açısından önemini vurgulamaktadır. Bu tez, etimolojik ve semantik bir perspektifle Kur'an'daki kelimelerin derinlemesine bir analizini sunarak, metnin doğru anlaşılmasına katkı sağlamayı, meâllerin Kur'ân'ın anlam zenginliğini yansıtma noktasında eksik olduğunu ortaya koymayı hedeflemiştir. Çalışma, gelecekteki araştırmalar için bir temel teşkil etmekte ve Kur'an'ın zengin dil yapısını anlamada önemli bir kaynak oluşturmayı amaçlamaktadır."
