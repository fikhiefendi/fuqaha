abstract: "İslâm Âile hukukunda Hanefî mezhebinin görüşleri etrafında şekillenen fesâd kavramı bu tezde evlilikler kapsamında ele alınmıştır. Hiçbir sonuç bağlanmayan bâtıl nikâhların aksine fâsid nikâhların taraflar üzerinde sorumlukları bulunmaktadır. Çalışma ile bu sorumlulukları barındıran fâsid nikâhların şartlarına, hükümlerine ve sonuçlarına yer verilmiştir. Tarafların biri için yükümlülük, diğeri için hak ifade eden bu sorumluluklar bir çok mağduriyetin önüne geçmektedir. Bu nedenle konu eşler ve çocuk açısından incelenmiştir. Çalışma sırasında fâsid kavramını teorik olarak kabul etmeyen Cumhûr ulemânın pratikte bu kavramdan faydalandıkları ve benzer hükümler verdikleri tesbit edilmiştir. Aynı zamanda Medenî Hukuktaki geçersiz evlilik akidleri ile de günümüz hukukunun İslâm hukukundan etkilendiği noktalar tesbit edilmiştir."
