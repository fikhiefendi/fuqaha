abstract: "Hz. Peygamber'in hayatının çeşitli safhalarına duyulan ilginin bir neticesi olarak pekçok alanda onunla ilgili eser kaleme alınmıştır. Bu konuda en zengin telifat siyer ve megâzî literütürü içinde yer alır. Siyer ve megâzî literatürü dışında kalan diğer alanlarda yazılan eserlerde de Hz. Peygamber hakkında bilgiler bulunur. Bu alanlardan birisi de fıkıhtır. Fıkıh literatüründe yazılmış olan eserlerdeki siyer ve megâzî bilgilerini ortaya koyan kapsamlı bir ilmî çalışma henüz yapılmamıştır. Bu çalışmada fıkıh literatüründe önemli bir yeri olan Ebû Yûsuf'un Kitâbü'l-Harâc adlı eseri incelenmektedir. Ebû Yûsuf'un Kitâbü'l-Harâc adlı eseri öncelikli olarak vergiler konusunu ele alan bir fıkıh kitabıdır. Amacı doğrudan Hz. Peygamber'in hayatını ele almak değildir. Ancak çeşitli fıkhî konularla ilişkili olarak siyer ve megâzî bilgilerine de yer vermektedir. Bu araştırmada öncelikle Ebû Yûsuf'un Kitâbü'l-Harâc adlı eserinde yer alan Hz. Peygamber dönemi siyer ve megâzî rivayetlerinin tespiti yapılmıştır. Bu rivayetler kronolojik olarak sıralanmıştır. Ayrıca rivayetlerin Ebû Yûsuf'un eserinde hangi bağlamda zikredildikleri de ortaya konmuştur. Daha sonra tespit edilen bilgiler ve rivayetler siyer ve megâzî kitaplarıyla karşılaştırılmıştır. Çalışmanın daha kolay takip edilebilmesi için tablolar oluşturulmuştur. Karşılaştırma sonucunda elde edilen veriler ışığında rivayet farklılıkları ortaya konulmaya çalışılmıştır. Ulaşılan sonuçlar çerçevesinde Kitâbü'l-Harâc'da yer alan siyer ve meğâzî bilgilerinin, Ebû Yûsuf'un çağdaşı olan tarihçiler tarafından kullanılıp kullanılmadığı, ortaya çıkarılmaya çalışılmıştır. Bu araştırma Ebû Yûsuf'un siyer ve megâzî rivayetlerine eserinde ne şekilde yer verdiğini, ictihatlarında siyer ve megâzî bilgisini ne derecede kullandığını görmemize imkân tanımaktadır. Bu çalışma aynı zamanda Ebû Yûsuf'un siyer ve megâzî bilgilerini nasıl kullandığını değerlendirme imkânı da sunmaktadır."
