abstract: "Türk-İslam devlet geleneğini devam ettiren Osmanlı Devleti her alanda adalete önem vermekteydi. Şer'iyye sicillerini, kadıların tuttuğu mahkeme kayıtları, merkezden gelen ferman, emir ve beratlar oluşturmaktadır. Bu çalışma Çankırı Çerkeş'e ait beş numaralı sicil defterinin trankripsiyon ve değerlendirmesini içermektedir. Araştırma da kadılık kurumu ve şer'iyye sicil defterleri hakkında kısa bilgiler verilmiştir. Çalışma, Çerkeş'in kısa tarihi anlatılarak desteklenmiştir. Çerkeş beş nolu şeriye sicilinde yer alan konular tasnif edildikten sonra trankripsiyonu yapılmıştır. Beş numaralı Çerkeş şer'iyye sicili toplamda 66 pozdan oluşmaktadır. Hükümlerin içeriğinde vakıf, tereke, nafaka, vasi tayini, vekâlet, borç-alacak davaları, merkezden gelen emirler ve diğer kurumlarla yapılan yazışmalar vardır. Çalışmanın amacı; Çerkeş'in 19. Yüzyılın son çeyreğinin toplumsal ve hukuki hayatını gün yüzüne çıkararak yapılacak çalışmalara katkıda bulunmaktır."
