abstract: "Osmanlı araştırmalarında birincil kaynaklardan birisi olma özelliğini taşıyan şer'iyye sicilleri; toplumsal, iktisadi ve hukuki alanlarda önemli bilgiler içerir. Bu çalışmada Osmanlı yaşamına ilişkin çok değerli bilgiler içeren bu kayıtlar üzerinden 17. yüzyıl Galata ve İstanbul sicil defterlerinde geçen bey'bi'l-istiğlal akitleri hakkında bilgi sahibi olmak amaçlanmıştır. Bu amaç doğrultusunda ilk olarak İslâm hukukunda ribâ, karz ve hîle konuları açıklanmış daha sonra bey'ul-îne, muâmele-i şer'iyye, bey'i-bât, bey'bi'l-vefâ, bey'bi'l-istiğlal akitleri hakkında bilgiler verilmiştir. Bu bilgiler verildikten sonra 17. yüzyılda mahkeme defterlerinde geçen bey'bi'l-istiğlal akitleri; tarafların kimlik bilgileri, akitlerin geçtiği mahalleler, tarafların din ve cinsiyet açısından değerlendirilmesi, akde konu olan mebî türleri, kira oranları, para birimleri ve mahkemelerdeki anlaşmazlıklar başlıkları tahlil edilmiştir."
