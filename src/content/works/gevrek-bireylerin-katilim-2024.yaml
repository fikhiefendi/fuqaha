abstract: "İnsan hayatı boyunca pek çok eylemi gerçekleştirirken çeşitli risklerle karşılaşabilir. Edinilen varlıkların, yapılan yatırımların ve benzeri durumların getirdiği risklere karşı korunmak, geçmişten günümüze çeşitli yöntemlerle sağlanmıştır. Bu risk koruma çabalarının içinde önemli bir yere sahip olan sigorta kavramı, belirli bir prim(katkı) karşılığında oluşabilecek zararların tazmin edilmesini amaçlar. Ancak, konvansiyonel sigorta uygulamalarının İslam hukukuna aykırı yönleri bulunması, İslami hassasiyeti olan bireyler için riskten korunma ihtiyacını karşılayamamıştır. Bu bağlamda, İslam hukukuna uygun bir alternatif olarak ortaya çıkan tekâfül sigortası, yardımlaşma, dayanışma, katkı ve ortaklık prensibine dayalı bir sigorta türü olarak tanımlanabilir. İslami sigorta olarak da adlandırılan tekâfül, İslam hukuk kurallarına uygun bir şekilde işler. Bu sigorta türü, bireyler arasında dayanışma ve karşılıklı yardımlaşma prensiplerini esas alarak riskten korunmayı hedefler. Bu sayede, İslami hassasiyetlere sahip olan bireyler, geleneksel sigorta yöntemlerinden farklı bir çözüm bulma imkânına sahip olmuşlardır. Türkiye'de katılım sigorta sektörünün ilerlemesi, tekâfül sigortacılığının daha yaygın bir hale gelmesi açısından büyük bir öneme sahiptir. Bu bağlamda, bu çalışma, İslami sigorta sisteminin işleyiş prensiplerini ve geleneksel sigorta ile arasındaki farkları detaylı bir şekilde ele almaktadır. Buna ek olarak; bankasürans kavramı açıklanarak, tekâfül sigortasında bankasüransın rolü ve önemi üzerinde durulmuş ve pazar payı verileri tablolar ile desteklenerek açıklanmıştır. Son bölümde ise bireylerin tekâfül sigortası konusunda bilgi düzeylerinin ölçülmesi için anket uygulanmıştır. Araştırmamız, nicel araştırma deseni kapsamında yürütülmüştür. Nicel araştırma tekniklerinden biri olan anket yöntemi kullanılarak görüşmeler gerçekleştirilmiştir. Nicel araştırma, temel olarak sayısal verilerin toplanması ve analiz edilmesini gerektiren bir yöntem sunmaktadır. İslami finans kuruluşları, bu araştırma sonuçlarına dayanarak müşteri bilincini artırmak, kararsızlık ve belirsizlikleri gidermek için çeşitli stratejileri benimsemeleri gerektiği düşünülmektedir. Eğitim, bilgilendirme, şeffaflık, medya ilişkileri ve acentelerin eğitimi gibi alanlarda yapılan çalışmalar, şirketler için potansiyel müşterilere daha etkili bir şekilde ulaşmalarına, müşteri tabanını genişletmelerine ve sektörde daha rekabetçi bir konum elde etmelerine olanak tanıyabileceği gibi sektörde güvenin artmasına ve İslami sigorta ürünlerine olan talebin yükselmesine katkı sağlayacağı düşünülmektedir."
