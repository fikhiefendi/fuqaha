abstract: "Bu çalışma, islami mikrofinansın Somali'deki yoksulluğun azaltılmasındaki rolünü ele almaktadır. Bu doğrultuda çalışmanın amacı, ülkede yoksulluğun azaltılmasına ve ekonomik olarak gelişmesine yardımcı olacak bir yol olarak İslami mikrofinansı teşvik etmektir. Bunun nedeni, tamamen Müslümanlardan oluşan Somali toplumu tarafından faiz uygulanan geleneksel mikrofinansların uygulanamamasıdır. Çalışmada, islami mikrofinansın Somali'deki yoksulluğun azaltılmasındaki rolü üzerine ulusal ve uluslararası ilgili kurumların kitap, makale ve yayınları, raporları gibi birçok yazılı belge ve elektronik kayıt araştırılmış ve değerlendirilmiştir. Araştırmanın en önemli bulgusu, büyük finans kurumlarının ve bankaların öncelikli amacının yoksullara hizmet etmek ve onların gelirlerini iyi yönde etkilemek olmasıdır. Kurumlar, yoksulların finansal olarak dışlanması konusunu kısmen ele almaktadır. İslam hukukuna uygun çok çeşitli finansal ürün ve hizmetleri müşterilerinin, özellikle de aşırı yoksulların yararına kullanmazlar ve finansal hizmet ve ürün ihtiyaçlarıyla yoksulları hedeflemeye sınırlı özen gösterilmektedir. Çalışma, hükümetin Salaam Finansal Hizmetler ve Kah mikrofinans kurumları (K-MFI) gibi İslami mikrofinans kurumlarına izin veren bir çerçeve oluşturmasını önermektedir. Buna ek olarak, hükümet yoksullar arasında finansal kalkınmayı teşvik etmek için yeni stratejiler getirerek ve finansal faaliyetlerini kırsal alanlara genişleterek yoksulluğun azaltılmasına daha fazla katkıda bulunmalıdır. BM ve diğer STK'lar gibi bağışçı kuruluşların yoksulların yaşam standartlarını iyileştirmek için gelirlerini Şeriat ve hükümet politikası faaliyetleriyle uyumlu hale getirmeleri gerekmektedir."
