abstract: "Çalışmamızda Hz. ömer'in miras ilmindeki nakil edilen görüşleri ele alacağız, ayrıca çalışmamızda Hz. ömer'in miras ilimindeki kulandığı yönetimi aktıracağız. Hz. ömer'in miras ilmindeki bırkatığı izleri açıklamalanması ve Hz. ömer'in görüşlerinden diğer sahâbenin görüşlerine nasıl etkileniğini ortaya koyacağız . Daha sonra Hz. ömer'in miras ilmindeki görüşleri tâbiîn ve ehl-i sünnetin dört mezhebin aynı meselerde ki görüşlerini aktıracağız, bu görüşleri Hz. ömer'in görüşlerini ona kim katılıp katılmadığını yada değer sahâbe Hz. Ali bin Ebu Talib, Hz. Zeyd bin Sabit, ve Hz. Abdullah bin Mesud gibi görüşlerini alıp almadığını ortaya koymaktadır . Çalışmamızda, Peygamberimiz ve Hz. Ebu Bekir dönemindeki ve Hz. Ömer'in dönem'indeki miras ilimnideki ortaya çıkan yeni meseleri ele alacağız. Bu meselerinden; dedenin mirası, Ömeriyyeteyn Meselesi, Ömeriyye Meselesi . Hz. Ömer'in ve diğer sahâbe bazı meseleri görüşlerini ihatlaf olduğu için tabiîn ve ehl-I süünet dört mezhep kitaplarında aynı meselide farklı görüşleri rastlanmaktadır. Çalışmamızda kulandığımız yöntem şu şekilde bildirebiliriz: ilk önce meseleyi genel tantım yaparak sonra Hz. Ömerin görüşünü açıklayıp görüşüne katılan değer sahâbe ve tabiî de zekir edildi, daha sonra Hz. Ömerin görüşüne karşı çıkan sahâbe ve tabiîn görüşlerin açıklayarak dört mezhep görüşlerini aktarılmıştır, sonra dört mezhebin delillerini değerlendirmeyi ele alınmıştır."
