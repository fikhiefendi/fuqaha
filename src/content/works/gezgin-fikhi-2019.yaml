abstract: "Bu çalışmada klasik fıkıh literatüründe ribâ yasağı kapsamında incelenen sarf akdi ve bu akdin günümüz tezgâh üstü piyasalarda gerçekleştirilen altın mübadele işlemlerine yansıması değerlendirilmiştir. Altının hukuki mahiyetinin para olması nedeniyle sarf akdinin şartlarına riayet edilerek mübadele edilmesi gerektiği beyan edilmiş; bu kapsamda altının bir cevher olarak madenden çıkarıldığı andan itibaren kuyumcu vitrinine gelen süreç içerinde gerçekleştirilen mübadelelerin tamamı bu çalışmada incelenmiştir. Çalışma, bir giriş ve üç bölümden müteşekkildir. Giriş bölümünde çalışmanın konusu, önemi, amacı; konuların incelenme yöntemi ve kaynaklarıyla ilgili bilgiler yer almaktadır. Birinci bölümde iktisat ve fıkıh bilimleri açısından para kavramı, altının para olma niteliği ve altının sarf akdine konu olması gibi başlıklar değerlendirilmiştir. İkinci bölüm altının üretimine ve üretilen altınların kuyumculara arz süreçlerine tahsis edilmiştir. Bu kapsamda madenler, rafineriler, darphane, atölyeler, aracılar ve çantacılar olarak bilinen altın üreticilerinin mübadele yöntemleri ve bu mübadelelerin fıkhî değerlendirmesi yapılmıştır. Üçüncü ve son bölümde ise öncelikle kuyumculuk sektörü tanıtılmış; sonrasında bu sektörde yapılan peşin, vadeli ve çeşitli mübadelelerin fıkhî değerlendirmesi yapılarak çalışma tamamlanmıştır. Anahtar kelimeler: Altın, Kuyumculuk, İslam iktisadı, İslam Borçlar Hukuku"
