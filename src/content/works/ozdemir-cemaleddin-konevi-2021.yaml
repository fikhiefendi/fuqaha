abstract: "Bu çalışma Ebû Hanîfe'nin (ö. 150/767) Ebû Muhammed Abdullah Hârisî (ö. 340/951) tarafından derlenen Müsned'i üzerine yapılmış el-Mu'temed fî ehâdîsi'l-Müsned adlı ihtisar çalışmasının tahkikidir. Hicrî IV. (X.) asır muhaddis ve fakihlerinden Sebezmûnlu Hârisî Ebû Hanîfe Müsned'inde, kendisine kadar ulaşan senedleriyle birlikte Ebû Hanîfe'nin rivayetlerinden oluşan 915 hadisi bir araya getirmiştir. Bu eseri ihtisar eden VIII. (XIV.) asrın başkadılarından Cemâleddin Konevî (ö. 770/1369) çalışmasında hadisleri konulara göre tasnif etmiştir. Cemâleddin Konevî, Hârisî'nin Müsned'inde senedli olarak verilen hadislerin senedlerini hazf etmiş, manayı etkileyecek farklılıklar bulunmadığı müddetçe mükerrer rivayetleri de çıkarmıştır. Yer verilen mükerrer rivayetlerde ise sadece manayı etkileyecek farklılıklar zikredilmiştir. Tezin Türkçe bölümünde yazarın biyografisi ve eserinin önemi üzerinde durulmuş, Arapça bölümünde ise eserin tahkiki gerçekleştirilmiştir."
