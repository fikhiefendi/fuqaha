abstract: "Günümüzde sürdürülebilirlik kavramı hemen hemen her alanda kullanılmaya başlanmıştır. Peki, bu kavram tam olarak ne anlama geliyor, hayatımıza neden ve nasıl girdi? Bu çalışma öncelikle sürdürülebilirliği her yönüyle anlayabilmek adına Dünyada ve Türkiye'de tarihsel gelişimini, ilişkili kavramları ve sıklıkla kullanılan ölçüm yöntemleri ile raporlama standartlarını araştırmaktadır. İklim değişikliğinin finans sektörüne doğrudan veya dolaylı yoldan olumsuz etkilerinin yanı sıra finans sektörünün bu alanı fırsat bilerek hangi yöntemlerle sürdürülebilirliğe katkı sağlayabileceği değerlendirilmektedir. İslam dini ile sürdürülebilirlik benzer amaçları ve hassasiyetleri nedeniyle aslında ortak temele dayanmaktadırlar. Konunun İslami finansta ne derecede gündeme alındığı öncelikle Uluslararası İslami Kuruluşların sonrasında da Türkiye'deki Katılım Bankalarının konuya dair yaptıkları çalışmalarda incelenmiştir. Sektörde aktif büyüklüğü 2022 yılı sonunda yüzde 8,3'e yükselen ve 1,2 trilyon Türk lirasına ulaşan katılım bankacılığı, 2025 yılında sektör payını yüzde 15'e ulaştırmayı hedeflemektedir. Hızla büyüyen katılım bankacılığının Türkiye'deki tarihsel gelişimi ile hem sunulan özellikli ürünlerde hem de faaliyet raporlarında sürdürülebilirliğe dair yapılanlar anlatılmıştır. Bu çalışmanın amacı, benzer hassasiyetler ve hedefler nedeniyle İslam ekonomisi ile yakın ilişkisi olan sürdürülebilirliğin İslam ekonomisinde daha fazla ele alınmasını sağlayarak karşılıklı gelişimlerine katkıda bulunmaktır."
