abstract: "Hamd, her türlü nimetin sahibi, kullarını indirdiği kitap vesilesiyle bu nimetlerden haberdar eden ve daha nicelerini de vâdeden Allah'a (c.c.) mahsustur. Salat selam onun biricik peygamberi, indirdiği kitabı eksiksiz ve noksansız olarak en güzel şekilde bize ulaştıran efendimiz Hz. Muhammed sallallahu aleyhi vesellem'in ve onun âlinin ve ashabının üzerine olsun. en-Nüket ve'l-uyûn isimli tefsir, büyük İslâm âlimi, fakih, siyasetçi, imam Ebû'l-Hasan el-Basrî el-Mâverdî'nin (öl. 450/1058) telif ederek İslâm dünyasında kendinden önce gelen âlimlere hayırlı halef olduğunu gösterdiği güzide tefsiridir. İmam bu eserinde birçok Kur'ân ilmine yer vermiş ve böylece okuyucular için âzamî istifadenin elde edilmesini amaçlamıştır. Bu çalışmamızda ise bu ilimlerden biri olup Kur'ân'daki kapalılıkların giderilmesine vesile olan Müşkilü'l-Kur'ân ilmi incelenmektedir. Giriş ve üç bölüm olarak hazırlanan çalışmanın giriş bölümünde, çalışmanın konusu, kapsamı, amacı, önemi ve ilgili literatüre dair bilgiler verilmektedir. Böylece bu çalışmaya olan ihtiyaç tespit edilmeye çalışılmıştır. Birinci bölümde Mâverdî'nin hayatı, ilmî kişiliği, hocaları, talebeleri ve eserleri ile ilgili bilgiler verilmiş ve onun ilim dünyasındaki yeri ortaya konulmaya çalışılmıştır. İkinci bölümde Müşkilü'l-Kur'ân ilmiyle ilgi olarak bu ilmin ne olduğundan ana hatlarıyla bahsedilmiştir. Ardından bu ilmin doğuş süreci ve tarihi seyri anlatılarak kavramın okuyucunun zihnine iyice yerleşmesi amaçlanmıştır. Daha sonra müşkil sebeplerinin neler olduğuna değinilmiş ve bunların nasıl çözülebileceğine dair kaynaklarımızda verilen bilgiler aktarılmıştır. Son bölümde öncelikle Mâverdî'nin tefsirinde müşkil olarak görerek açıklamalarda bulunduğu âyetler tespit edilmiş daha sonra bunları Mâverdî'nin ne şekilde çözdüğü incelenmiştir. Bu incelemenin ardından Mâverdî öncesi döneme ait kaynaklar taranarak bu müşkil çıkarımının Mâverdî'nin kendi çıkarımı olup olmadığı tespit edilmiştir. Kaynakları Mâverdî'ye ait olan müşkil çözümlerinde ise onu bu çözüme vardıran saiklerin tespiti hususunda gayret gösterilmiştir. Ardından Mâverdî sonrası dönem ana hatlarıyla incelenerek yine Mâverdî sonrasında kendinden etkilenen müfessirler tespit edilmiştir. Aynı zamanda bu müfessirlerin de Mâverdî'den yaptıkları alıntılarda kaynak gösterip göstermediklerine bakılmış ve Mâverdî'nin getirdiği müşkil çözümleri üzerine farklı açıklamalar yapıp yapmadıkları tespit edilmeye çalışılmıştır. Sonuç kısmında Mâverdî'nin müşkilleri incelerken nasıl bir tutum izlediği, tefsirinde rivâyetlere ne kadar bağlı kaldığı ve bunlar arasında tercihte bulunup bulunmadığıyla ilgili değerlendirmeler serdedilmiş ve bu çalışmanın sonucunda varılan kanaatler ifade edilmiştir."
