abstract: "İbn Hazm'ın Sünnet Anlayışıİbn Hazm, Zâhirî ekolünün en ünlü simalarından biridir. Onun ortaya koyduğu usûl diğer mezheplerin ortaya koyduğundan oldukça farklıdır. Bu farklılığın en iyi görüldüğü alanlardan biri de sünnettir.İbn Hazm sünneti vahiy mahsulü kabul etmiş, Kur'an'ın her türlü eksiklikten korunduğu gibi sünnetin de korunduğunu iddia etmiştir. Hatta bu düşüncesini râvilerin rivayette bulunurken hata edemeyecekleri noktasına taşımıştır. İbn Hazm Hz. Peygamber'den rivayet edilen haberleri ister mütevâtir ister âhad olsun aynı derecede kabul etmiştir. Her ikisinin de ilim ifade edeceği ve ameli gerekli kılacağını ifade etmiştir. İbn Hazm, Hz. Peygamber'in sünnetini bağlayıcılığı açısından kavlî, fiilî ve takrirî olmak üzere üçe ayırmış ancak bunlardan sadece kavlî sünnetin vücub ifade ettiğini iddia etmiştir.İbn Hazm mutlak anlamda mana ile rivayeti, vahyi tahrif olarak nitelemiş ancak sünnetin manasını çok iyi bilen kişilerin mana ile rivayette bulunabileceklerini iddia etmiştir.Sünnetin sübutunu tespit için ileri sürülen ?Kur'an'a arz? ilkesine karşı çıkan İbn Hazm ?Umûmu'l-belvâ ve amel-i ehl-i Medine? prensiplerini de reddetmiştir.Sünneti Kur'an'ın beyanı olarak niteyen İbn Hazm Kur'an'ın sünnet tarafından nesh ve tahsis edilebileceğini savunmuştur. Senedi Hz. Peygamber'e dayanan icma'ın da aynı şekilde Kur'an'ı nesh edebileceğini iddia etmiştir.İbn Hazm sünneti de Kur'an gibi vahiy kabul ettiği için ikisi arasında bir tearuz bulunmadığını söylemiş ve tercih yoluna gitmemiştir. Her iki nalsa da amel edilmesi gerektiğini iddia etmiştir.Yukarıda ifade edilen sünnet anlayışının temelinde İbn Hazm'ın sünneti vahiy kabul etmesi ve zahirî yöntemi benimsemesi yatmaktadır. Ancak ortaya attığı deliller muhaliflerinin delilleriyle karşılaştırıldığında iddia ettiği gibi ?sünnetin tamamı?nın vahiy mahsulü olmadığı ortaya çıkmaktadır. Ancak İbn Hazm'ın çalışmamızda incelediğimiz sünnet anlayışı, sünnetin vahiyle münasebetini ifade etmek açısından çok önemli noktalara temas etmektedir."
