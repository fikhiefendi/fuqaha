abstract: "İslam dini, kesin bir şekilde faizi yasaklamış ve ekonomik yapıyı başka birtakım ilkelerle birlikte faizin olmadığı bir sistem üzerine tesis etmiştir. Bu nedenle, Müslüman toplumların uzun tarihi tecrübelerine bakıldığında faizsiz enstrümanlar kullanarak değişik ekonomik modeller ortaya çıkardıkları görülür. Günümüzde ise bu yasağı dikkate alarak faaliyet göstermeye çalışan faizsiz bankaların bu modellerden biri olduğunu (en azından bu potansiyeli taşıdıklarını) söylemek mümkündür. İslam dininin faizi yasaklaması, İslam ülkelerindeki ekonomik hayatın Batı ekonomik sistemleriyle uyumunu sağlayacak bir finansal kurumsallaşmayı engellemiştir. Dolayısıyla, İslam dünyası için, faizsiz bir düzen kurulması vazgeçilmez bir temel amaç haline gelmiştir. Ancak küresel düzeyde, faizin olmadığı yerde bankacılık, bankacılığın bulunmadığı yerde de finansal dünyanın bulunması olanaksızdır. Bu nedenle 1980'lerde yeni bir ekonomik model ortaya atılarak 'faizsiz bankacılık' kavramı ekonomi literatürüne kazandırılmıştır. Bankalar faaliyetlerini verimli bir şekilde devam ettirebilmeleri için bazı finansal analiz yöntemleri kullanmaları gerekmektedir. Çalışmada finansal analiz yöntemlerinden bankacılık sistemine uygun olan analiz yöntemi CAMELS Performans Değerleme Analizi yöntemi kullanılmıştır. CAMELS analiziyle bankalardaki risklerin ve problemlerin önceden belirlenerek ortaya çıkabilecek sorunların minimize edilmesi amaçlanmaktadır. Türkiye'de faaliyet göstermekte olan katılım bankaları; Albaraka Türk Katılım Bankası, Kuveyt Türk Katılım Bankası, Türkiye Finans Katılım Bankası, Ziraat Katılım Bankası ve Vakıf Katılım Bankasıdır. Bu bankaların 2013-2017 yılları arasındaki verilerinin CAMELS analizi yöntemine göre karşılaştırılmaları yapılarak performans değerlendirme sonuçlarına ulaşılmıştır."
