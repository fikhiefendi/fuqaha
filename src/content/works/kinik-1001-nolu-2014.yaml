abstract: "Osmanlı mahkemelerinde kadı veya nâibleri tarafından tutulan şer'iyye sicilleri, Osmanlı tarihçileri için birinci derecede öneme sahip kaynaklardır. Şer'iyye sicilleri, ait oldukarı bölgenin sosyo-kültürel, ekonomik, siyasi ve hukuki hayatıyla ilgili bilgileri ihtiva etmektedir. Bu sebeple şehir tarihlerine ait ilmi araştırmaların da kaynağıdır. Tez çalışmamız, 1001 No'lu (1299-1301/1882-1884) Bolu Şer'iyye Sicil Defteri'ne dayanmaktadır. Sicil defterindeki veriler doğrultusunda Bolu'nun o dönemdeki sosyo-kültürel ve ekonomik yapısını incelemeye çalıştık. Sicilde geçen, Bolu'nun kazaları, nahiyeleri, mahalleleri, köyleri, camileri, vakıfları ve medreseleri tablo şeklinde verilmiştir. Tereke kayıtları, nikahta kadına verilen mehirler, tarım aletleri, ev eşyaları, giyim, ziynet ve süs eşyaları liste şeklinde verilmiş, aile kavramı, evlenme ve boşanmadan bahsedilerek miras ve ceza hukukuyla ilgili bilgiler aktarılmıştır. Son olarak defterde geçen dava konuları tablo halinde verilip bu davalar 15 başlık altında toplanarak birer örnek metin verilmiştir."
