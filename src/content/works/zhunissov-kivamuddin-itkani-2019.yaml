abstract: "Fıkıh, kelâm, gramer ve matematik alanlarında eserler yazan Kıvâmüddîn el-İtkânî, hicrî VII. yüzyılın sonları ile VIII. yüzyılın ortalarında yaşamış Hanefî mezhebinin önde gelen çok yönlü âlimlerindendir. Hanefî mezhebinin en muteber metinlerinden biri kabul edilen el-Hidâye üzerine yazdığı Gâyetü'l-beyân, ilk yazılan şerhlerden olması açısından büyük bir önemi haizdir. Hanefî mezhebince kendi dönemine kadar teşekkül eden fıkıh birikiminden de faydalanarak yazmış olduğu eser, başta el-Hidâye şerhleri olmak üzere daha sonraki kaleme alınan bir hayli Hanefî eserine kaynak olmuştur. Taşıdığı önem nedeniyle eserin tanıtımının yapılıp incelenilmesi gerektiği âşikârdır. Bu ihtiyacı belli oranda gidermek maksadıyla bu çalışma yapılmıştır. Çalışmamız bir giriş ve üç ana bölümden oluşmaktadır. Giriş bölümünde araştırmanın amacı, önemi, sınırlandırılması, yöntemi ile kaynakları hakkında bilgi verilmiştir. İlk bölümde müellifin hayatı, ilmî kişiliği ve eserleri hakkında söz edilmiştir. İkinci bölümde önce eserin genel tanıtımına yer verilmiş, daha sonra çeşitli konu başlıkları altında eserin namaz bölümünün metot açısından tahlili ortaya konulmuştur. Üçüncü bölümde ise müellifin namaz bölümünde işlediği konuların bazıları muhtasar bir şekilde aktarılmıştır. Çalışma sonuç ve kaynakça ile son bulmaktadır."
