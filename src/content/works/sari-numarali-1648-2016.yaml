abstract: "Sosyal ve yerel tarih çalışmalarında başvurulacak en önemli kaynaklardan birisi mahkeme kayıtlarıdır. Osmanlı Devleti'nde oduğu gibi Kırım Hanlığında da kadılar tarafından tutulan bu siciller, ait oldukları bölgeye dair oldukça zengin veriler içermektedir. Kayıt altına alındıkları bölgede yaşayan halkın aile ve sosyal hayatını, gündelik uğraşlarını, giyim kuşamlarını, kullandıkları eşyaları, yeme içme kültürünü, mesleki hayatlarını, cemaat ve aşiret yapılarını ve yaşadıkları yerlerin isimlerini tespit etmemizi sağlar. Osmanlı Devleti'nin Karadeniz politikasının önemli bir ayağını oluşturan, günümüz Türkiye, Rusya ve Ukrayna ilişkileri açısından da dikkate değer bir bölge olan Kırım'ın siyasi, sosyal, ekonomik ve kültürel tarihinin aydınlatılması önem arzetmektedir. Kırım Hanlığına dair tarihsel bağların ve bölgenin kültürel mirasının ortaya çıkarılması amacıyla 3a ve 3b numaralı Kırım mahkemesi kadıasker defterleri Latin harflerine aktarılarak Yarımada'nın sosyal, ekonomik, idari, kültürel ve folklorik yapısı analiz edilmiştir. Kırım'da yer alan kaza, köy, mahalle, sokak, nehir ve zirai mevkiler gibi coğrafi yer isimleri tespit edilmiştir. 17.yüzyıl'ın ikici yarısında Kırım Yarımadası'nda yaşamış olan nüfusun sosyal, etnik, dini ve kültürel yapısının aydınlatılması temel amaçlar arasındadır. Bu çerçevede, Kırım nüfusunun dayandığı aşiret ve cemaat yapıları, farklı etnik gruplar, gayri müslimler, isimler, ünvan ve lakaplar, vakıf kurumları, meslekler, para birimleri, miras, aile hukuku ve kölelik gibi yapıların değerlendirmesi yapılmıştır."
