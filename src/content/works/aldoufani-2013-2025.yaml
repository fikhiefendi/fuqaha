abstract: "Bu çalışma, Libya'daki ticari bankalarda içsel faktörlerin finansal performans üzerindeki etkisini, 2013 tarihli ve 1 sayılı İslami şeriata uygun olmayan hizmetlerin yasaklanmasına ilişkin yasanın uygulanması bağlamında analiz etmeyi amaçlamaktadır. Çalışma, betimleyici analiz yöntemiyle 2015–2023 yılları arasında Cumhuriyet Bankası'na ait verileri inceleyerek, şu altı ana faktöre odaklanmıştır: öz sermaye, cari hesaplar, banka büyüklüğü, likidite, mevduat yapısı ve finansal kaldıraç. Sonuçlar, öz sermaye değişkeninin hem yasa öncesi hem de sonrası dönemlerde finansal performans üzerinde anlamlı ve pozitif bir etkisi olduğunu göstermektedir. Bu durum, söz konusu değişkenin temel bir belirleyici olarak istikrarlı etkisini yansıtmaktadır. Ayrıca, banka büyüklüğünün yalnızca yasa sonrası dönemde anlamlı bir etkisi olduğu bulunmuştur. Bu durum, şeriata uygun faaliyetlerdeki genişlemeye bağlanabilir. Diğer değişkenler (cari hesaplar, likidite, mevduat yapısı, finansal kaldıraç) her iki dönemde de anlamlı bir etki göstermemiştir. Çalışma, İslami bankacılık çerçevesinde finansal performansı artırmak için öz sermaye ve banka büyüklüğüne odaklanılmasını ve diğer faktörlere ilişkin politikaların geliştirilmesini önermektedir"
