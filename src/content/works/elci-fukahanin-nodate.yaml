abstract: "FUKAHÂNIN İHTİLAFINDA ARAP DİLİNİN ROLÜ Muhammed Tayyip ELÇİ İslam hukukunun temel kaynakları olan Kur'ân ve sünnetin dili, kendine özgü gramer yapısı, edebî sanatları, kelime ve anlam zenginliğiyle ön plana çıkan Arapçadır. Hükümlerin istinbatı sürecinde, bu dile ait kurallar etkin bir rol oynamaktadır. Nassların lügavî anlamları, gramer kuralları ve belâgat açısından farklı anlamlara ve yorumlara açık olması, fukahânın nassları farklı şekillerde anlamalarına ve yorumlamalarına neden olmuştur. Bu durum, farklı hükümlerin istinbat edilmesine zemin hazırlamıştır. Zira bir nassın içerdiği kelimenin vaz' edildiği anlamın tespiti, sarf ve nahiv ilimleri çerçevesinde kelimenin yapısı ve i'rabının belirlenmesi, ayrıca nassın belâgî ve edebî sanatlar açısından analiz edilmesi sırasında ortaya çıkan yorum farklılıkları, fukahâ arasında ihtilaflara sebebiyet vermiştir. Bu çalışma, fukahâ arasındaki ihtilaf sebeplerinden biri olarak dil kurallarının rolünü ele almayı amaçlamaktadır. Bu çalışma, bir giriş, üç ana bölüm ve bir sonuç kısmından oluşmaktadır. Giriş bölümünde fıkıh, fakih, Arap dili ve ihtilaf kavramlarıyla beraber Fıkıh ilminin tarihçesi, fukahâ arasındaki ihtilafın sebepleri ve doğurduğu sonuçlar üzerinde durulmaktadır. Birinci bölümde Arapça lafızların vazʻından kaynaklı ihtilaflar; lafzın lugavî manasının tespiti, lafzın menkul olup olmaması, umum ve hususu, müştereklik durumu, lafzın delaleti ve mefhumunun delaleti alt başlıkları altında ele alınmıştır. İkinci bölümde, Arap gramerinden kaynaklanan ihtilaf sebepleri“Sarf”ve“Nahiv”başlıkları altında ele alınmıştır. Bu bağlamda, i'rab farklılıkları, harflerin delalet ettiği anlamlara ilişkin ihtilaflar, hazf, istisna ve zamirin mercii gibi temel nahiv konuları çerçevesinde değerlendirilmiştir. Üçüncü bölümde ise Arap belâgatinden kaynaklanan ihtilaf sebepleri; hakikat ve mecaz, kinaye, emrin delaleti, nehyin delaleti ile ıtlak ve takyit başlıklarında ele alınarak değerlendirilmiştir. Çalışmada ele alınan konular örneklerle izah edilmiştir."
