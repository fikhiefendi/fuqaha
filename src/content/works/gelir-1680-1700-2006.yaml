abstract: "Suç, yasak bir fiilin yapılması veya yapılması gereken bir fiilin terk edilmesidir.Ceza, suç işleyen kimsenin yaşantısına, özgürlüğüne, mallarına, onuruna karşı devletinkoyduğu sınırlama anlamına gelmektedir.Ayntab işlenen suçlar ve bu suçlara karşılık Osmanlışehrinde,Kanunnamelerinde verilen cezalar, aynı zamanda slam hukukunun nasıluygulandığının da bir göstergesidir.Ayntab mahkemelerinde verilen cezalar arasında en şiddetli uygulama eşkıyalıkile suçlanan kimselere verilen idam cezalarıdır. Hırsızlık suçu ile suçlananlara verilencezalar, çaldığı malları geri vermeleri ve haps edilmeleri şeklinde gerçekleşirken zina ilesuçlananlara verilen cezalar, bazen mahalleden ihraç, bazen tazir, bazen de hapisşeklinde gerçekleşmiştir. Darp davaları ise kimi zaman davalı ve davacıların sulhyapması ile kimi zaman da diyet ya da kısasla sonuçlanmıştır.Şehirde meydana gelen suçlara ve cezalarına daha geniş bir çerçevedenbakıldığında; eğer işlenen suç toplumun genelini ilgilendiriyorsa, verilen ceza genellikleidam şeklinde olmuş; diğer suçlar için de daha hafif cezalar uygulanmıştır."
