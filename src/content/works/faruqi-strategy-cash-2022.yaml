abstract: "Badan Wakaf Indonesia (BWI), vakfın potansiyelini ve ekonomik faydalarını ibadet ve toplumun güçlendirilmesi yararına gerçekleştirme hedefi olan ulusal bir nazirdir. BWI, vakıf varlıklarının, özellikle para vakıflarının güçlendirilmesinde hayati bir rol oynamaktadır. Endonezya'daki büyük para vakfı potansiyeli, henüz tam potansiyeline ulaşılamamış olsa da, para vakfı modelinin ekonomik ve sosyal kalkınma için bir alternatif haline getirmek için bir fırsat olarak degerlendirilebileceği düşünülmektedir. Bu nedenle, bu araştırma BWI'nin Endonezya'daki mevcut ve potansiyel nakit vakıflarını optimize etme stratejisini bulmayı amaçlamaktadır. Kullanılan araştırma yöntemi, birincil ve ikincil verileri, bazı BWI yetkilileri ve web sitesiyle yapılan görüşmeden toplanan verileri ve ayrıca araştırmayla ilgili belgeler, dergiler veya güvenilir kaynaklar verilerini kullanan nitel bir araştırmadır. Araştırmanın sonuçlarına dayanarak, araştırmacılar Endonezya vakıf kurumunda para vakfının uygulandığı ve şu anda İslam Hukuku'na uygun olduğu ve İslami bankalar aracılığıyla mevduat ve yatırım şeklinde nakit vakıf toplamaya devam ettiği sonucuna varmışlardır. BWI'nin hedeflediği hedefe ulaşmak için BWI, Maliye Bakanlığı ve Din Bakanlığı ile işbirliği yapan Nakit Vakfı Bağlantılı Sukuk gibi çeşitli kurumlarla işbirliği içinde çeşitli programlar ve ürünler oluşturmuştur."
