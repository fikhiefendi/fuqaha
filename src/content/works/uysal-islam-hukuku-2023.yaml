abstract: "İslâm dini evliliği teşvik etmiş, boşanmayı hoş karşılamamıştır. Ancak evlilik birliğinin yürümesinin mümkün olmadığı durumda boşanma bir çözüm yolu olarak görülmüştür. İslâm hukukunda boşama (talâk) yetkisinin ilk olarak erkeğe tanındığı bilinmektedir. Ancak kadın, kendisine zina isnadında bulunan kocasından lanetleşme (li'an) ile ayrılır. Ayrıca geçimsizlik baş gösterdiği takdirde kadının, kocasına vereceği bir bedel (muhâlea) ile boşanabileceği de bilinmektedir. Bu durumlar haricinde kadına fena / kötü şekilde muamelede bulunulması durumunda kadının mahkemeye başvurarak boşanma talebinde bulunabilmesinin bir hak olduğu hususunu incelemeye çalıştık. Çalışmamızı dört ana başlıkta ele almayı tercih ettik. Bunlar, fiziksel fena muamele ve şiddetli geçimsizlik, manevî fena muamele ve şiddetli geçimsizlik, ekonomik fena muamele ve şiddetli geçimsizlik ve cinsel fena muamele ve şiddetli geçimsizliktir. Fiziksel şiddete maruz kalan, sürekli sözlü olarak rencide edilen, insanlık onuru zedelenen, gerekli ihtiyaçları bilerek ya da bilmeyerek (elde olmayan nedenlerle) yerine getirilmeyen, gayrı meşru ilişkiye zorlanan bir kadın, mahkemeye boşanma talebiyle başvurduğu takdirde ne gibi bir durumla karşılaşacaktır? Çalışmamızda ulaşmak istediğimiz netice, bu soruların cevabı niteliğinde olacaktır."
