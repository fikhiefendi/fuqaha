abstract: "İslam hukuku bütün zaman ve mekânlara uygundur ve uygun olmaya da devam etmektedir. İslam hukuku bünyesinde geniş ve esnek faktörleri barındırmaktadır. Kuşkusuz İslam âleminin İslam hukuk kurallarını hayata tatbik etmeye ve fıkıh ile amel etmeye ihtiyacı vardır. Bu ise hâkimlerin hüküm vermede işlerini kolaylaştırmak, dava meselelerinde tarafların davalarında dayandıkları hükmü kolay kılmak ve hüküm vermede kadıların verdikleri kararlar arasında birliği sağlamak fıkhın kanunlaştırılması ile daha kolay olmaktadır. Söz konusu olgu, âlimlerden oluşan bir heyetle herhangi bir mezhebe bağlı kalmadan mahza maslahatı gözetmekle yerine getirilebilir. Bu heyet, ciddi ve azimli uğraşla fıkıhtan istifade ettiği kanunu ortaya çıkararak Kur'an ve sünnete müracaat edip insanların sorunlarına cevap bulacaktır. Bu ise, egemen sistem, din ve hayat arasındaki çift başlılığı gidererek gönüllere sekînet ve huzur verecektir. Fıkhın birbirinden farklı hükümlerinden istifade etmek, Müslümanların gücüne güç katmakta ve onların önünü genişletmektedir. Ayrıca aslı itibariyle mübah olan şeylerden Allah tarafından kendilerine verilen mal ve hayattan mahrum olmamaktadırlar. Bütün bunlar zor ve ağır olan hükümlerden uzak durup tamamen Müslümanların maslahatını gözeterek kolay hükümlerle ortaya çıkar. Nitekim ayette \"Allah'ın ve sizin düşmanlarınızı ve onların gerisinde olup sizin bilmediğiniz, ama Allah'ın bildiklerini korkutup caydırmak üzere, onlara karşı elinizden geldiği kadar güç ve savaş atları hazırlayın\" (Enfal, 60) buyrularak içerden ve dışardan saldırılara maruz kalmış İslam coğrafyasında yaşayan Müslümanların hayatlarını kolaylaştırmak adına bu hususa riayet edilmelidir. Bu durum İslam hukukunu bütün zaman ve mekânlara uygun hale getirmektedir. Bu faktörlerden bir tanesi de müctehid fakihlerin zannî delillere dayanarak ortaya koydukları hükümlerdeki ihtilaflardır. Bu asır, İslam hukukunun hayatın her alanına hâkim olması açısından, asrın ihtiyaçlarını ve hukuk sisteminin taleplerini karşılayabilmesi için geniş bir kanunlaştırma hareketine tanık olmuştur. Aslında kanunlaştırmaya duyulan zaruri durum da böyle bir hareketliliği zorunlu kılmaktadır. Biz de şer'î hükümlerin kanunlaştırılmasının gerekliliğini ortaya koymak için bu çalışmayı ele aldık. Günümüz Irak Medeni hukuku farlı alanlarda olmak üzere büyük ölçüde fıkıh kurallarını almış ve bu kuralları İslam hukukunda olduğu gibi kanunlaştırmıştır. Bu uygulamayla kanun fıkıh kurallarında yaşanan ihtilafı dikkate aldığından herhangi bir eleştiri ya da itirazla karşılaşmamıştır. 1951 senesine ait 40 numaralı Irak medeni kanunu birbirinden farklı birçok alanda İslam hukukundan hükümler almıştır. Irak medeni kanunun Mecelle-i Ahkâm-ı Adliyeden etkilendiği görülmüştür. Daha sonra 1976 senesine ait 43 numaralı Ürdün medeni hukuku, bu hususta Irak medeni kanununu takip etmiştir. Daha sonraları ise diğer Arap ülkeleri birbirlerini izlemiştir. Mesela Sudan 1984, Birleşik Arap Emirlikleri 1985, Filistin ve Yemen 2012'de medeni muamele hukukunu kanunlaştırmıştır. Bu kaideleri biçim ve içerik bakımından karşılaştırmalı ve tenkit olan fıkhi- hukuki bir araştırmada ele aldık. Fıkhi kaideleri bilimsel ve nesnel olarak sınıflandırdık. Böylece tek bir başlık altında, tek bir konuyu oluşturacak şekilde kaideleri birleştirdik. Öyle ki bu kaidelerin hepsi akit teorisi gibi bir başlık altında toplanabilir. Bununla birlikte bazı kaideler birden fazla konunun altına girmektedir. Örneğin: \"Kelam ve te'vilin tefsiri\", \"İrade ve ifadeyle istidlal\", \"Örf\", \"İstishab\", \"Zarar\", \"İhtiyaç\", Kolaylık ve sıkıntının giderilmesi\", \"Zararın İzalesi\", \"Başkasının mülkünde tasarruf yetkisi\", \"Damân\", \"Tevabî ve İğtifâr\", \"Şart ve Manî\", \"Zan ve Tevehhüm\", \"Haram\", \"Telazüm\", \"İçtihad\", \"Şer'i Siyaset\", \"Müteferrika\" kaidesi gibi. Mali alışverişlere hükmeden ve kendisinden kurallar bütünü oluşturulan ve medeni hukuku etkilediğinden dolayı mali fıkhi kaideleri önceden zikrettik. Bu kurallar ışığında meydana gelen alışverişler ya hukuka uygunluk arz eder ya da sonradan ortaya çıkmış ve muasır olduğu için hukuka uygunluk arz etmez. Kurallar sayesinde siyasi hedefler, stratejiler, plan ve programlar çizilip belirlenmektedir. Kurallar alışveriş ve finansal yapıları destekler ve gözetler, meydana gelebilecek problemleri en güzel şekilde İslam hukuku ışığında çözüm üretir ve o sıkıntıyı gidermeye çalışır. Bu bağlamda kanunlaştırmanın en önemli ve faydalı kural ve kaidelerini zikrettik. Bununla birlikte araştırmada kanunlaştırma hareketinin tarihinden söz ettik. İslam ülkelerinde İslam hukuku alanında yapılan kanunlaştırma hareketini ve bunun neticesinde meydana getirilen kanunları ortaya koymaya çalıştık. Öte yandan İslam hukukunun kanunlaştırılması yönünde olumlu ve olumsuz görüş beyan eden İslam hukukçuların görüş ve gerekçelerini irdelemeye çalıştık."
