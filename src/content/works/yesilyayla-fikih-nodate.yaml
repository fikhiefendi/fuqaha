abstract: "Fıkıh usûlünün yakından ilgili olduğu alanların başında dil ilimleri gelmektedir. Dil ilimleri çeşitli kategorileri bünyesinde barındıran geniş yelpazeye sahip bir disiplindir. Bu kategorilerden birisini vaz' konuları oluşturmaktadır. En genel anlamıyla lafızların mânaya tayinini ifade eden vaz', usûlcülerin önem verdiği meseleler arasında yer almaktadır. Ancak usûlcüler, vaz' konusunu, sadece vaz' ilminin verilerini temel alarak incelememektedir. Nitekim usûl eserlerinde vaz' meselesi müstakil bir konu olarak ele alınmamaktadır. Bununla birlikte bu verileri, fıkıh usûlünün amacına uygun verilerle değerlendirmektedir. Bir başka ifadeyle vaz', üzerine inşanın devam ettiği bir süreç olarak değerlendirilebilir. Lafızlar bahsinde de bu sürecin işleyişi gözler önüne serilmektedir. Vaz' tartışmalarında farklı görüşler ortaya çıkmıştır. Bunların arka planında kelâm, dil ve mantık gibi ilimlerde ortaya çıkan ekollerin etkili olduğunu söylemek mümkündür. Bir başka ifadeyle vaz' meselesinde ekollerin benimsediği görüşler, hüküm istinbat sürecini etkilemektedir. Ancak bu süreçte etkili olan unsurlar sadece vaz' tartışmaları ile sınırlı değildir. Buna bağlı olarak isti'mâl/kullanım unsurunun fıkıh usûlü açısından merkezi bir konuma sahip olduğunu ifade etmek mümkündür. İsti'mâlin vaz' ile ortaya çıkan bir süreç olduğu dikkate alındığında vaz' ve isti'mâlin birbirini tamamlayan iki süreç olarak nitelendirilmesi mümkündür. Nitekim usûl eserlerinden hareketle isti'mâlin, genel anlamıyla vaz' kapsamında olduğu anlaşılmaktadır. Bu da iki unsuru, birbirinin tamamlayıcısı olarak ifade etmeye imkân tanımaktadır. Vaz' ve onun tamamlayıcısı olan isti'mâl unsurlarına bağlı olarak bu çalışmada daha ziyade“âm, has, müşterek”ve“hakikat, mecaz”ile ilgili meseleler genellikle vaz' cihetinden incelenmektedir. Böylece vaz' olgusunun fıkıh usûlü açısından nerede konumlandığı, hükümlere etki edip etmediği meselesi ortaya konulmaktadır. Elde edilen neticelerden en önemlisi, vaz' olgusunun fıkıh usûlü açısından hükümlerin temelini oluşturan önemli bir unsur olmasıdır. Ancak bu, hükümlerin her birinin muhakkak vaz'î bir dayanağının olması gerektiği anlamında değildir. Tamamen vaz' unsuruna dayandırılan hükümler bulunmakla birlikte isti'mâl unsurunun daha etkin bir rolünün olduğu söylenebilir."
