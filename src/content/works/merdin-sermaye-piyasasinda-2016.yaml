abstract: "Doğuşundan itibaren bankacılık, gelişimini sürdürebilmek adına yeni ve farklı araçlara ihtiyaç duymuştur. Konvansiyonel bankacılık uzun yıllar boyunca rakipsiz olarak bu alanda söz sahibi olmuş ve bu bağlamda ortaya çıkarılan ürünler de hep faize dayalı olmuştur. İslami bankacılığın doğuşu ile birlikte katılım bankacılığı da ortaya çıkmış ve zamanla faizsiz finansal sistemin vazgeçilmez bir unsuru haline gelmiştir. Katılım bankaları finansal ürünleri çeşitlendirme adına önemli avantaj olarak telakki edilmektedir. Günümüzde gerek fon toplama ve fon kullandırma, gerekse verdiği bankacılık hizmeti, ürün zenginliği ve güler yüzlü personelleri açısından katılım bankaları, ekonomik sektörün gelişmesine ülke ekonomisine katkı sağlamaya devam etmektedir. İslami prensiplere göre hareket eden katılım bankaları, özellikle son yıllarda gerek İslam dünyasında gerekse batılı finans piyasalarında görülen faizsiz sabit getirili yatırım araçlarının uygulanmasında önemli görevler üstlenmişlerdir. Dünya genelinde faizsiz finansman araçları hızla büyüme gösterirken, islami finans sisteminin önemli bir enstrümanı olan sukuka ilgi de her geçen gün artmaktadır. Katılım bankacılığının günden güne büyümesi ile birlikte faizsiz finansman araçlarına duyulan ihtiyaç ve talep neticesinde, artık ülkemizde de sukuk, en önemli faizsiz finansal enstrümanlardan biri haline gelmiştir."
