abstract: "İslami finans, dinî doktrinlere ve risk paylaşımı, faizin (Riba) yasaklanması ve varlığa dayalılık gibi etik ilkelere dayanmaktadır. Bu çalışma, İslami finansı hem geleneksel finansal sistemlere bir alternatif hem de finansal dayanıklılık açısından potansiyel olarak daha üstün bir model olarak konumlandırmaktadır. Bu temel ilkeler, özellikle geleneksel finansın daha riskli yapısıyla karşılaştırıldığında, daha yüksek bir sistemik istikrarın oluşmasına zemin hazırlayabilir. Bu çalışmanın temel amacı, kriz dönemlerinde İslami finansın nasıl kavramsallaştırıldığını ve uygulandığını değerlendirmek; küresel araştırma temaları ve kurumsal iş birliği ağları içerisindeki rolünü analiz etmektir. Çalışma, İslami yatırım ilkelerinin geçmiş ekonomik daralma dönemlerinde ne ölçüde dayanıklılık gösterdiğini ve bu ilkelerin finansal sistemlerde sürdürülebilirlik ve kapsayıcılık üzerine güncel tartışmalarla nasıl örtüştüğünü ortaya koymayı hedeflemektedir. Araştırma, Web of Science veri tabanından 2005–2024 dönemini kapsayan 377 hakemli makalenin analizine dayanan bibliyometrik bir yaklaşım benimsemektedir. Yazarlık ağları, atıf etkileri, ortak atıf kümeleri ve anahtar kelime eş-oluşumlarını haritalamak için VOSviewer ve Bibliometrix R paketi gibi araçlar kullanılmıştır. Betweenness, closeness ve PageRank gibi ağ merkezilik ölçütleri, alanın entelektüel yapısını bağlamsallaştırmaya, etkili akademisyen ve kurumları belirlemeye ve temel araştırma temalarının zaman içindeki evrimini izlemeye yardımcı olmaktadır. Analiz sonuçları, İslami finans literatürünün 2008 küresel finans krizinden sonra önemli ölçüde genişlediğini; Malezya, Birleşik Krallık, Kuzey Afrika ve Güney Asya'nın bu alanda güçlü bir liderlik sergilediğini ortaya koymaktadır. Beck, Kenourgios ve Al-Khazali gibi akademisyenler, geleneksel finans literatürü ile İslami perspektifler arasında köprü kuran merkezi figürler olarak öne çıkmaktadır. Tematik analiz, alanın hâlen İslami bankacılıkta performans, risk azaltımı ve yönetişim konularına odaklandığını; ancak son dönem çalışmaların İslami FinTech, yeşil sukuk ve Şeriata uygun sürdürülebilirlik uygulamaları gibi yeni ve yükselen temalara yöneldiğini göstermektedir. Özellikle ampirik bulgular, spekülasyon ve aşırı kaldıraç kullanımına yönelik yapısal sınırlamalar nedeniyle, İslami finansal kurumların 2008 krizinde geleneksel bankalara kıyasla daha dayanıklı olduğunu ortaya koymaktadır. Çalışma, İslami finansın belirsizlik dönemlerinde ampirik açıdan güçlü ve tutarlı bir kriz yönetimi çerçevesi sunduğu sonucuna ulaşmaktadır. Entelektüel gelişimi haritalandırarak ve ortaya çıkan araştırma temalarını belirleyerek, İslami finansı küresel finansal dayanıklılığın güçlendirilmesinde güvenilir ve giderek daha fazla önem kazanan bir model olarak konumlandırmaktadır. Etik yönetişim, sürdürülebilirlik ve sistemik risk yönetimine verdiği önem, İslami finansın daha istikrarlı ve kapsayıcı finansal piyasaların şekillenmesindeki artan rolünü vurgulamaktadır."
