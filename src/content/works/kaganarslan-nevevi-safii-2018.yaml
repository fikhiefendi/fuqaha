abstract: "Şâfiî mezhebinde müftâ bih olan tercihe/görüşe ulaşabilmek için Nevevî'nin tercihleri öncelikli önemi haizdir. Zira Nevevî, mezhebin kendinden önceki fıkıh birikimini adeta yeni bir düzenlemeye tabi tutmuştur. Bunu yaparken mezhep içerisinde zayıf görüşleri ayıklayarak, sahih olanları ortaya çıkarmaya çalışmıştır. Nevevî'nin bu tercihleri mezhep içerisinde genel olarak kabule mazhar olmakla birlikte kendisinden sonraki fukahâ tarafından kabul görmeyen ve tartışılan tercihleri de olmuştur. Kabul görmeyen bu tercihler çoğunlukla mezhebin genel görüşüne/müftâ bih olana aykırı görülmüştür. Nevevî'nin bu tercihleri genel olarak ihtiyârâtü'n-Nevevî olarak bilinen bireysel tercihleri olarak da kabul edilmiştir. Kabul görmeyen tercihlerinin tespitinde muteahhirûn (geç dönem) Şâfiî fukahâsından Başta“Tuhfe”ve“Nihaye”nin müellifleri olan İbn Hacer el-Heytemî ve Remlî olmak üzere eş-Şirbinî ve Zekeriya el-Ensârî gibi fıkahânın görüşlerine başvurduk. Özellikle İbn Hacer el-Heytemî ve Remlî'nin tercihleri geç dönem Şâfiî fukahâsı tarafından mezhepte umde kabul edilmiştir. Zira bunlar ikinci tahrîr/tenkîh (ayıklama) faaliyetinde bulunurak Şeyhân'ın (Nevevî ve Râfiî) tercihlerini yeniden incelemeye tabi tutarak değerlendirmişlerdir. Bu nedenle ikinci tahrîr faaliyetinde bulunan fukahânın tercihleri de Şehyân'ın tercihleri gibi mezhepte müfta bih olan görüşün tesbitinde önem arz eder. Araştırmamız bir giriş, üç bölüm ve bir sonuçtan oluşmaktadır. Birinci bölümde Nevevî'nin hayatı ve eserlerini ele aldık. İkinci bölümde tercihlerini ve Şâfiî mezhebindeki önemini, üçüncü bölümde geç dönem Şâfiî fukahâsı tarafından tartışılan ve kabul görmeyen tercihlerini işledik."
