abstract: "Bu tez, bir giriş ve üç bölümden oluşmaktadır. Girişte tezin önemi, sınırlandırılması, sunulması ve tez ile ilgili kaynakların değerlendirilmesi ele alınmıştır.Birinci bölümünde, feshin mahiyeti, feshin nikâh akdini sona erdiren durumlarıyla (tefrik vs.) ve gayr-i sahih nikâhlarla ilişkisi, İslam hukukçularının bâtıl ve fâsid nikâhlar üzerinde ihtilafları, gayr-i sahih nikâhların feshi ve doğurduğu sonuçlar hakkında bilgi verilmiştir.İkinci bölümde, nikâh akdinin feshinin gerektiren durumları açıklamaya çalışılmıştır. Feshi gerektiren durumlarında mezheplerin görüşlerini çoğu zaman mezhebe göre belirlenmiştir.Üçüncü bölümde, nikâh akdinin feshinin doğurduğu (mehir, iddet, iddet nafakası ve mesken gibi) sonuçları belirlenmeye çalışılmıştır."
