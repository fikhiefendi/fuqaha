abstract: "'Ulūmu'l-Ḳur'an'dan biri olan nesḫ meselesi, tefsir ilminin en tartışmalı konularından biri olmuştur. Bu çalışma h. 8. yüzyılın önemli şahsiyetlerden biri olan İbn Kes̠īr (ö.774/1373) ile h. 10. yüzyıla damgasını vuran Ebūʼs-Suʻūd'un tefsir eserlerinde nesḫ meselesini konu edinmektedir. Ebūʼs-Suʻūd (ö.982/1574) ve İbn Kes̠īr aralarında geçen 3 asırlık bir süreye rağmen nesḫ anlayışlarında ne gibi farklılıkların olduğu çalışmamız kapsamında değerlendirmeye alınmıştır. Ebūʼs-Suʻūd ve İbn Kes̠īr'in nesḫin tanımına ilişkin öne sürdükleri düşünceler ile bu düşüncenin tefsirlerine yansıma şekillerinin uyum içerisinde olduğu tespit edilmiştir. Ebūʼs-Suʻūd ve İbn Kes̠īr'in nesḫ edildiğini düşündüğü ayetlerin hangi ayetler olduğunun tespit edilmesi ile bu iki âlimin Kur'an da nesḫ meselesine dair yaklaşımları ortaya koyulmuştur. Bu bağlamda Ebūʼs-Suʻūd ve İbn Kes̠īr'in nāsiḫ olarak değerlendirdiği ayetlere, birkaç önemli müfessir açısından da bakılarak kısa bir mukayese yoluna gidilmiştir. Çalışmamızda Ebūʼs-Suʻūd ve İbn Kes̠īr dışındaki müfessirleri seçerken, onların tefsirlerinde atıfta bulundukları âlimlerden öncelikle yararlanılması öngörülmüştür. Ebūʼs-suʻūd 21 ayeti nāsiḫ, 19 ayeti mensūḫ kabul ederken, İbn Kes̠īr ise yine 23 ayeti nāsiḫ, 19 ayeti mensūḫ kabul etmektedir. Ebūʼs-Suʻūd ve İbn Kes̠īr'in nāsiḫ ve mensūḫ addettiği ayetlerde ve bu ayetlerin toplam sayısında bazı farklılıklar gözlenmiştir. Bu farklılıklar müfessirlerin, rivayetleri sahih ya da zayıf olma noktasında farklı değerlendirmelerinden kaynaklanmaktadır. Diğer taraftan ise dikkate aldıkları âlimlerin görüşlerinin etkisi altında kaldıkları da düşünülmektedir."
