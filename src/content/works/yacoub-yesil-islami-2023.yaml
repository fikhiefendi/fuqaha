abstract: "Bugün dünya kirlilik ve iklim sorunlarından mustarip olmakta, bu nedenle bu problemlere karşı sosyal ve mali kurumlar birlikte mücadele etmektedirler. Sosyal adaleti ve düzeni sağlamayı amaçlayan İslami finans, iklim sorunlarıyla mücadele etmek için her zaman en iyi çözümleri aramaktadır. Bu çalışmada, Malezya deneyimini bir model olarak benimseyerek, yeşil İslami sukukun yeşil projelerin finansmanındaki ve sürdürülebilir kalkınmanın sağlanmasındaki rolü incelenmektedir. Bu çalışma tamamen yeşil sukukun Malezya piyasası üzerindeki etkisinin analizlerine dayanmaktadır. Son olarak, çalışma, İslam ekonomisi ve finansının ekonomik, sosyal ve çevresel düzeylerde olumlu bir etki elde etme yeteneğini kanıtlamaktadır."
