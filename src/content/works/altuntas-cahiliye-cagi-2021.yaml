abstract: "İslam öncesi cahiliye toplumu ve Hz. Peygamber'in vefatına kadar olan dönemde İslam toplumunda kan davası töresini farklı yönleriyle olgusal olarak değerlendirmek bu çalışmanın kapsamını oluşturmaktadır. Araştırmamızda sosyal hayat, siyaset, hukuk, kültür, din ve benzeri birçok yönden kan davası töresi incelenmektedir. Güvenlik gereksinimi bağlamında toplumsal yapıdaki kurumların oluşumu ve şekillenmesinde kan davası töresinin önemi yanında hukuk, siyaset, ticaret gibi alanlarla olan yoğun ilişkisi de çalışma boyunca değerlendirilmektedir. Cahiliye toplumunda çok daha etkin olmakla birlikte İslami dönemde de törenin izlerini sürmek mümkün olmaktadır. Hz. Peygamber'in Medine toplumundaki pratiğinde kan davası töresi nedeniyle meydana gelen çatışmaları sonlandırmak ve yenilerinin tezahür etmesini önlemeye dönük özel bir çabanın varlığını görmekteyiz. İslami dönemde kan davası töresine yönelik geliştirilen yaklaşımın İslam öncesi dönemden her yönüyle farklılaşmış olmasa da kritik bazı farklılıkların geliştirildiğini görmekteyiz. Nihai olarak bu törenin sonlandırılmak istendiği görülüyor olsa da törenin güçlü kökleri nedeniyle varlığını sürdürmeye devam ettiği müşahede edilmektedir."
