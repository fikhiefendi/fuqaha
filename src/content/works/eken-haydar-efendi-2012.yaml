abstract: "Bu tez Ali Haydar Efendi'nin Dürerü'l-Hükkâm adlı eseri esas alınarak yapılan bir çalışmadır. Bu eser, İslam hukukunun medeni hukuk alanında ilk kanunlaştırma örneği olan Mecelle'nin en önemli şerhlerinden birisidir. Mecelle'nin değinmediği Hukuksal alanları tamamlamayı da hedeflemiştir. Osmanlı medenî hukuku sayılan Mecelle'nin ve genel hukuk çalışmalarının anlaşılması açısından büyük bir öneme sahiptir.Çalışma giriş ve iki bölümden oluşmaktadır. Birinci bölümde Ali Haydar Efendinin hayatı, hukuk alanındaki çalışmaları ve eserleri hakkında bilgi verilmiştir.İkinci bölümde ise, Dürerü'l Hükkâm'ın Kitâbü'l-Emânât bölümünün 762-787. maddeleri latinize edilmiştir. Bu bölümde ayrıca yazarın bu şerhi yazarken yararlandığı ve ismine atıfta bulunduğu eserlerin tesbit ve tahkîki de yapılmıştır."
