abstract: "Bu tez, Osmanlı hoşgörüsü/hoşgörüsüzlüğü fikrine/pratiğine dair tarihsel bilgiyi sorgulamayı amaçlamaktadır. Bunu ise daha çok Batı literatürü içerisinde, felsefe, tarih ve siyaset teorisi disiplinlerince tartışılan, felsefi hoşgörü teorileri, dinsel hoşgörü teorileri ve eleştirel hoşgörü teorilerinden faydalanarak yapmayı hedeflemektedir. Bunun için, söz konusu hoşgörü teorilerinin yardımıyla ortaya koyulan kavramsal-teorik çerçeve ve dinsel hoşgörü tartışmaları çerçevesi ile sınırlandırılacak Batı tarihi-Osmanlı tarihi karşılaştırması sonucu ortaya koyulacak metodolojik katkılar ile Osmanlı hosşgörüsü/hoşgörüsüzlüğü fikri/pratiği analiz edilmeye çalışılacaktır. Pek tabii, bu analiz yapılırken, ortaya koyulan teorik çerçeve ve metodoloji, Osmanlı düşünme biçimi dikkate alınarak tekrar formüle edilecektir. Kavramsal-teorik bir çerçevenin sunulmasının amacı, hoşgörü/hoşgörüsüzlük kavramlarının farklı dilsel kullanımlarını, semantiğini, koşullarını, gereklerini, seviyelerini, derecelerini ve formlarını aydınlatmaktır. Metodolojik katkı ise, genellikle Osmanlı hoşgörüsünün/hoşgörüsüzlüğünün özneleri olarak tartışılan gayri-müslimlerin yanı sıra, Osmanlı hoşgörüsü/hoşgörüsüzlüğü söz konusu olduğunda heretiklerin (Şiiler ve Şii eğilimli heterodoks tarikatlar) ve Sûfîlerin de en az gayri-Müslimler kadar önemli özneler olduğuna dikkat çekmek olacaktır. Diğer bir deyişle, Osmanlı hoşgörüsü/hoşgörüsüzlüğü deneyimi, söz konusu kavramsal-teorik çerçeve aracılığıyla analiz edilecek ve dinsel ?Öteki?nin sınırları Şii ve Şii eğilimli heterodoks tarikatlar ile Sûfîleri da içine alacak şekilde genişletilecektir. Söz konusu kavramsal-teorik çerçeveyi uygulamak ve metodolojinin geçerliliğini tartışmak için onaltıncı yüzyıl Osmanlı İmparatorluğu şeçilmiştir. Bu dönemdeki kanunlar (fetvâlar, fermânlar, Osmanlı ceza kanunu) ve hoşgörünün gereği (îcâbı) olarak tartışılan adâlet kavramı tarihsel bölümün temel araştırma konuları olacaktır. Bu çerçevede öncelikle Osmanlı'daki adâlet kavramının, nasıl kamu düzenini muhafaza etmek ve siyasi ve ekonomik istikrarsızlığı engellemek için toplumu düzenlediği tartışılacak, ardından ise, Osmanlı'daki hoşgörü/hoşgörüsüzlük fikrinin/pratiğinin, bir yönetim sanatı olarak adâlet anlayışının düzenleyici amacına hizmet ettiği ölçüde uygulandığı iddia edilecektir. Bu çerçevede, onaltıncı yüzyıl Osmanlı kanunlarında gayri-Müslimler ve heretiklere dair düzenlemeler ve konuyla ilgili ikincil yazın temel alınarak, Osmanlı hoşgörüsü/hoşgörüsüzlüğü sırasıyla horgören hoşgörü ve cezalandırıcı hoşgörüsüzlük olarak kavramsallaştırılacak ve tartışılacaktır."
