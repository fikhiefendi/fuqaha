abstract: "Bu çalışma, kendisini İslami şeriat hükümleriyle uyumlu ilk piyasa olarak tanımlayan Dubai Finans Piyasası'na uygulayarak İslami sermaye piyasalarının güçlendirilmesinde yasal yapının rolünü analiz etmeyi amaçlamaktadır. Bunu da yasama yapısının ve gelişmiş teknik ortamın piyasadaki Şeriata bağlılık seviyesinin yükseltilmesindeki etkisini açıklığa kavuşturarak ve değerlendirerek yapmaktadır. Çalışma, Dubai Finans Piyasasını ele alan literatürü tahmin ederek tümevarımsal yaklaşım, Dubai Finans Piyasasının yasal yapıyı, İslami finansal araçları ve teknik yapısını açıklamak için tanımlayıcı yaklaşım, Yasal yapının, İslami finansal araçlarının ve teknik yapının yasal bağlılığın güçlendirilmesindeki rolünü analiz ederek ve değerlendirerek analitik yaklaşımı kullanmaktadır. Çalışma, Dubai Finans Piyasasının yasal yapısının, mekanizmalar yönündeki teknik gelişimine rağmen, onun küresel bir İslami finans merkezi olma hedefine ulaşmakta yetersiz kaldığı sonucuna varmıştır. Bu da, onun yasal yapısının karışık olması ve hem haram olan geleneksel hem de İslami ürünlere ve araçlara hizmet etmesinden kaynaklanmaktadır. Halbuki İslami olmayan veya Şeriat ile uyumlu olmayan menkul kıymetler ve araçlara hizmetler sunmaktan alıkoyan bir kural olması için yasal yapının ayıklanması gerekmektedir."
