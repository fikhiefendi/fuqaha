abstract: "Bu tez, Ebüssuûd Efendi?nin ?İrşâdü?l-Akli?s-Selîm ilâ Mezâyâ?l-Kitâbi?l-Kerîm? adlı tefsirinde, esbâb-ı nüzûl rivayetlerine yaklaşımını konu edinmektedir.Bu tez, giriş ve üç bölümden oluşmaktadır.Giriş?te, araştırmanın konusu ve önemi ile araştırmanın amacı ile yönteminden bahsedildi.Birinci bölümde, önce Ebüssuûd Efendi?nin hayatı, ilmi kişiliği, eserleri ve tefsiri tanıtıldı. Daha sonra esbâb-ı nüzûlün tanımı, esbâb-ı nüzûlü bilmenin yolu ve esbâb-ı nüzûlü bilmenin önemi izah edildi. Son olarak da Ebüssuûd Efendi?nin esbâb-ı nüzûl kaynakları açıklandı.İkinci bölümde, müfessirin esbâb-ı nüzûl rivayetlerini takdim ederken kullandığı tabirler ve rivayetlerin isnadı incelendi.Üçüncü bölümde, müfessirin esbâb-ı nüzûlü nerede ve nasıl kullandığı, bu rivayetleri nasıl değerlendirdiği anlatılmaya çalışıldı. Tüm bu konular örneklerle izah edilerek müfessirin esbâb-ı nüzûl konusuna yaklaşımı açıklığa kavuşturuldu.ez, bir değerlendirme ile sonlandırılmıştır."
