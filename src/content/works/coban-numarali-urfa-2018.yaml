abstract: "Şer'iyye Sicilleri Osmanlı'da kadılar tarafından mahkemeye gelen davaların sonuçları ile birlikte deftere kaydedilmesiyle meydana gelen defterlerdir. Bu defterler, yerel tarih araştırmaları için son derece. önemli bilgiler içeren; değerli, döneminin sosyal, ekonomik ve kültürel hayatı hakkında araştırmacılara güzel fikirler verecek nitelikte kaynaklardır. Bu kaynaklar sayesinde araştırmacılar Osmanlı toplum hayatı hakkında son derece önemli ve eşsiz bilgilere ulaşabilmektedir. Urfa'da özellikle XIX. yüzyılda (ilki H. 1039 M. 1629) kaleme alınmış olan bu siciller Osmanlı'nın son döneminde Urfa tarihini aydınlatacak çok önemli bilgiler ihtiva etmektedir. Çalışmamızın kaynağını oluşturan 206/3 Numaralı Urfa Şer'iyye Sicili Urfa'nın XIX. yüzyılda toplumsal, ekonomik, siyasi ve dini hayatı hakkında araştırmacılara önemli bilgiler sunmaktadır. Çalışmamızda 206/3 numaralı Urfa Şer'iyye Sicili'ni transkribe edip değerlendirerek Urfa'nın tarihinie katkı sunacağımızı ümit ediyoruz."
