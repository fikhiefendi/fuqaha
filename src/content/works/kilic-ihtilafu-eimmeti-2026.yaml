abstract: "Geleneksel bağlamda Hilâf/Hilâfiyât ve furûk tarzı eser bölümleri veya müstakil eserler usul esas alınarak telif edilirken incelemekte olduğumuz eser tamamı ile fıkıh bablarına göre tertip edilmiş furû' konuları içerisinde dört mezhep imamının görüşleri serdedilmiştir. Eser birçok kere basılmış olmakla beraber 2002 yılı Beyrut baskısı olarak elimizde mevcut 2 cilt olup İbâdât, Muamelât ve Ahvâl-ı şahsiye konuları ele alınarak sadece ittifak ve ihtilaf edilen yönleri içermektedir. Bundan hareketle eser zamanında ve daha sonra intiba görmüş, eser ve müellife yapılan atıflar görülmüştür. Müellifin Abbasiler döneminde yaşadığı zaman diliminde ciddi görevleri üstlenerek vezirlik görevine kadar yükselmesi yanında vera', hakkaniyet, adalet ve dürüstlüğü ile de temayüz etmiştir. Her açıdan incelenerek ülkemizde tanıtımı hak eden kişiliğe sahip bir müellif olma özelliğini taşımaktadır. Tezimizde müellifi gerekli yönleri ile tanıtıp fıkıh geleneğinde hilâf konusuna değindikten sonra eser bağlamında müellifin Fıkhî görüş ve tercihleri varsa tespit edilip, bağlı olduğu Hanbelî Mezhebine ihtilaf ettiği hususla incelenerek tercihlerini etkileyen hususlara değinilecektir. Neticede birden fazla ilmi bilgi ve birikimle tarihe iz bırakmış dirayet ve nufûz sahibi bir ilim adamı ve eseri ülkemizde ilmi çalışmalara literatür olmasına katkıda bulunabileceği yönüyle faydalı olacaktır."
