abstract: "?Gürcistan Müslümanlarının Nişanlılık Ve Evlilik Uygulamalarının İslam Hukukundaki Yeri? adlı bu çalışma `giriş? ve `sonuç? dışında iki bölümden oluşmaktadır. Giriş kısmımda; Araştırmanın Konusu ve Amaç Araştırmanın Önemi ve Sınırları, Araştırmada ele alınan yöntem hakkında bilgi verilmiştir. Birinci bölümde; İslam?da aile kavramı, Gürcistan Müslümanlarında aile kavramı ve temel özellikleri, Gürcistan Müslümanlarında aile oluşumu, Gürcistan toplumuyla ilgili genel bilgiler, günümüz dünya toplumlarında nişan ve düğün adetleriyle ilgili bazı bilgiler, hakkında kısaca bilgi verilmiştir. İkinci bölümde; İslam hukukuna göre nişan ve Gürcistan Müslümanlarının günümüzdeki nişan uygulamaları, İslam hukukundaki nişanlılık ve evlilik hakkındaki hükümler ele alınmıştır. Bunun dışında Gürcistan?daki evliliğin İslam hukukuna uygun olup olmadığı, nişanlanmanın fıkıhtaki yeri ve nişanlanma akdi, Gürcistan Müslümanları arasında evlilik akdinin hukuki neticeleri, evlenmenin geçici ve sürekli engelleri, evlilik akdinin bozulmasının hukuki neticeleri incelenmiştir."
