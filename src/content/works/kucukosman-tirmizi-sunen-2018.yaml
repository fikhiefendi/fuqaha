abstract: "Küçükosman, Hasan, Tirmizî'nin Sünen'inde Hanefî Mezhebine Yaklaşımı, Yüksek Lisans Tezi, Danışman: Prof. Dr. Enbiya Yıldırım, 265 s. Bu çalışma Hadis tarihinin altın çağı olarak bilinen hicri üçüncü asırda yaşayan İmam Tirmizî'nin re'y düşüncesine ve ehline olan bakışını incelemektedir. Re'y düşüncesine karşı olan bir toplumda yetişen İmam Tirmizî'nin Sünen'i hocaları bağlamında incelenip bu irtibat aranmıştır. Zira bu dönem Re'y ve hadis ehlinin birbirlerine sert eleştirilerde bulunduğu bir dönemdir. İmam Tirmizî'nin hadis taraftarı olması ile beraber eseri fıkhi bilgilerle dolu olup farklı görüşleri içermektedir. Bu durumda kendisinin sadece hadisle fıkıh yapmadığını göstermektedir. Çalışmada ayrıca Hanefî Mezhebinin re'y düşüncesine yönelmesinin arkasındaki sosyolojik etmenler incelenmektedir. Re'y ve Hadis ehlinin arasının ayrılmasında düşünce farklılığının yanında sosyolojik ve siyasal sebepler de vardır. Bununla beraber Tirmizî'nin hocaları arasında Hanefîlerle bağlantısı bulunan râvîlerin olması da bu ayrımın her zaman ve zaminde aynı olmadığını göstermektedir. Tirmizî'nin bazı fıkhi düşüncelerinin de Hanefîlerle aynı olması da bu iki ekolün tamamen birbirinden ayrılmadığını ve haddi aşan ithamların genellenmemesi gerektiğini göstermektedir."
