abstract: "Hicri II. yy.dan itibaren fukaha arasında çeşitli görüş ayrılıkları sistemli bir şekilde ortaya çıkmaya başlamış, bu durum mezheplerin kurumsal bir yapıyla ortaya çıkmalarına zemin hazırlamıştır. İslam hukuk tarihinde günümüze intikal eden ve etmeyen çeşitli mezhepler ortaya çıkmıştır. Tarih boyunca fukaha belirli bir mezhebe tabi olmuştur. Ancak fukaha arasında zaman zaman bağlı olduğu mezhebi bırakıp, bir başka mezhebe geçme durumu da yaşanmıştır. İşte tezimiz, tarihsel bir olgu olarak fukahanın mezhep değiştirmesini ele almaktadır. Fukahanın mezhep değiştirmesinin sebep ve sonuçları, tarih boyunca en çok hangi mezhebe geçiş olduğu, mezhep değiştirme sonrası fukahanın görüş ve düşüncelerinde değişiklikler tezde ele alınan konulardandır."
