abstract: "Dünya hızla yaygınlaşan katılım bankacılığı, son yıllarda kamu bankalarının da faizsiz finans sektörüne girişi ile birlikte Türkiye‟de de gelişimini büyük bir hızla sürdürmektedir. Faizden uzak faaliyet gösteren katılım bankaları, İslami çerçevede finans sektöründe yer almakta ve diğer tüm bankalara bir alternatif niteliğinde bulunmaktadırlar. Ülke ekonomilerine ciddi katkıları olan bu kurumlar, insan yaşamından faizin olumsuz etkilerini ortadan kaldırmak ve faiz nedeniyle finans dünyasına katılmayan âtıl fonları sistem içerisine çekmeyi amaç edinmişlerdir. Bu tez çalışması, Türkiye ile seçilmiş ülkeler arasında karşılaştırmalı bir analize odaklanarak, katılım bankalarının ekonomik büyüme ve istikrarın sağlanmasında oynadığı önemli rolü incelemektedir. Ön bulgular, katılım bankalarının faize dayalı olmayan finansal modelinin, özellikle küresel finansal kriz dönemlerinde ekonomik istikrara önemli ölçüde katkı sağladığını ortaya koymaktadır. Bu bankalar, finansal kapsayıcılığı artırmada, sürdürülebilir kalkınmayı desteklemede ve ekonomik oynaklık karşısında dayanıklılığı artırmada çok önemli bir rol oynamaktadır. Ancak performans ve etki, farklı düzenleyici ortamlar, ekonomik gelişme düzeyleri ve kültürel faktörler nedeniyle ülkeler arasında farklılık gösterir. Bu çalışma, katılım bankacılığının ekonomik katkılarının kapsamlı bir şekilde incelenmesini sağlayarak mevcut bilgi birikimine katkıda bulunmakta ve böylece Türkiye ile diğer ülkeler arasındaki karşılaştırmalı çalışmalardaki boşluğu doldurmaktadır. Ayrıca, katılım bankalarının ekonomik büyümeyi ve istikrarı canlandırma potansiyelinin optimize edilmesine yönelik politika önerileri sunmaktadır."
