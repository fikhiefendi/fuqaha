abstract: "SİYASİ ANLAŞMAZLIKLARIN DÜZENLENMESİ VE TERCİHİ AÇISINDAN BÜYÜK FIKIH KAİDELERİ: UYGULAMALI ANALİTİK ÇALIŞMA ÖZET Fıkıh kaidelerinin en büyük amacı, fakihlerin vahiy kaynakları olan Kur'an ve Sünnet naslarından yaptıkları çıkarımları disiplin altına almak ve özetlemektir. Ancak bu kaideler –özellikle de büyük ve külli olanlar– sadece fıkhî hükümleri tertip etmenin ötesine geçerek, görüşler arasındaki ihtilafın düzenlenmesinde ve tercihlerin belirlenmesinde birer mihenk taşı haline gelmiştir. Bu kaideler; müftüler, kadılar, yöneticiler ve siyasiler tarafından uygulamada kullanılmış; onların tercihlerini şekillendirmiş ve karşılaştıkları meseleler arasında denge kurmalarına yardımcı olmuştur. Bu çalışma, büyük fıkıh kaidelerinin İslam devletindeki siyasî ihtilafları düzenlemedeki ve bu ihtilaflara ilişkin görüşler arasında tercih yapmadaki rolünü ortaya koymayı amaçlamaktadır. Bu doğrultuda, düzenleme ve tercih etme yönleri üzerinde durularak; gerek Nebevî ve Hulefâ-i Râşidîn döneminde gerekse fıkıh âlimleri arasında ortaya çıkan siyasî ihtilaf örnekleri analitik ve uygulamalı bir yöntemle ele alınmıştır. Böylece araştırma problemi olan kaidelerin etkinliğini ve siyasî ihtilafları düzenlemedeki rolünü ispatlamaya, ardından bu ihtilafları tedavi etmeye veya yönlendirmeye çalışılmaktadır. Konu, istisnaî durumlar olan ihtilaflarla ilgili olması ve fıkıh kaideleri ile ihtilaf arasında ilişki kuran çalışmaların azlığı nedeniyle ayrı bir önem taşımaktadır. Çalışmada, büyük fıkıh kaidelerinin siyasî ihtilafları düzenleme ve bu ihtilaflarda tercihte bulunma konusunda merkezi bir katkı sunduğu, bu rolün İslam'ın ilk dönemlerinden itibaren ve mezhep fakihleri nezdinde de var olduğu sonucuna ulaşılmıştır. Ayrıca, siyasî ihtilaf yalnızca iki taraf arasındaki fiilî duruş farkı olarak değil, aynı zamanda şer'î siyaset meselelerindeki içtihadî farklılıkları da kapsamaktadır."
