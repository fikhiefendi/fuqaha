abstract: "Katılım bankacılığı sistemi, Türkiye'de 1980'li yıllardan itibaren finansal yapının bir parçası hâline gelmeye başlamaktadır. Faizsiz bankacılık esaslarına dayanan bu sistem, geleneksel bankacılıktan farklı olarak kâr-zarar ortaklığı prensibini benimsemekte ve tasarruf sahiplerine alternatif bir finansman modeli sunmaktadır. Türkiye'de kurulan ilk katılım bankası, özel sermayeli bir kuruluş olan Albaraka Türk Katılım Bankası'dır. Buna karşın, kamu sermayeli katılım bankaları daha sonraki yıllarda faaliyet göstermeye başlamış ve katılım bankacılığı sektörünün gelişiminde önemli rol oynamaya başlamıştır. Türkiye'de faaliyet gösteren kamu ve özel sermayeli katılım bankalarının finansal performansı, 2018–2024 dönemine ait veriler üzerinden seçilmiş rasyolar ve panel veri analizleri ile karşılaştırmalı olarak incelenmiştir. Çalışmada net dönem kârının toplam varlıklara oranı (ROA), net dönem kârının özkaynaklara oranı (ROE) ve özkaynaklar/toplam varlıklar oranı temel göstergeler olarak kullanılmıştır. Analiz sonuçları, banka büyüklüğünün (lnTA) kârlılık üzerinde güçlü ve anlamlı bir etkiye sahip olduğunu, özkaynak oranının pozitif ve sınırda anlamlı, kredilerin aktifler içindeki payının ise negatif ve sınırda anlamlı olduğunu ortaya koymuştur. Banka bazlı değerlendirmelerde, Kuveyt Türk Katılım Bankası'nın hem ROA hem de ROE açısından sektör ortalamasının üzerinde performans sergilediği, Türkiye Emlak Katılım Bankası'nın ise son yıllarda kârlılığında kayda değer bir artış gösterdiği belirlenmiştir. Buna karşılık, Ziraat Katılım ve Albaraka Türk'ün kârlılık göstergelerinin düşük seyretmesi, aktiflerin kâra dönüştürülmesinde sınırlı verimlilik sağladıklarını göstermektedir. Özel sermayeli bankaların genel olarak kârlılık ve özkaynak etkinliği bakımından kamu bankalarının önünde olduğu, kamu bankalarının ise daha güçlü sermaye yapısına rağmen kârlılık oranlarında geride kaldığı tespit edilmiştir. Özkaynaklar/toplam varlıklar oranı incelendiğinde Vakıf Katılım ve Kuveyt Türk'ün güçlü sermaye yapılarıyla öne çıktığı, Ziraat Katılım gibi bazı bankaların ise dış finansman bağımlılığı nedeniyle daha kırılgan bir yapıya sahip olduğu görülmektedir. Yıl etkileri dikkate alındığında, 2019 yılı sektör genelinde kârlılığın gerilediği, 2022 yılında ise kamu bankalarının özel bankalara kıyasla daha yüksek performans sergilediği ortaya çıkmıştır."
