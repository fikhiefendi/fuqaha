abstract: "Dünyada ve Türkiye'de mensupları açısından büyük dinlerden bir tanesi İslam dinidir. İslam dininin beş temel esasından kabul edilen şartlardan bir tanesi de zekât ibadetidir. Zekât, mali ibadetler sınıfında yer alması itibarı ile kendi içinde farklı ve sektörel bazda özel durumlar barındırır. İnsanların yaşam dönemleri içinde tarım ve basit ticaret boyutundan üretim, sanayi ve tüzel kişilikleri bulunan şirketler, oransal anlamdaki önemlerini korumakta/arttırmaktadırlar. Şirketlerin varlıkları / kaynakları ile gelir / giderlerinin belirlenmesinde finansal tablolardan yararlanılır. Bu çalışmanın amacı şirketlerin finansal tablolarından yararlanılarak zekâta tabi, zekât matrahından indirilecek, zekât açısından özellikli ve zekâttan muaf olan hesap kalemlerinin belirlenmesi, hesaplanması ve muhasebeleştirilme sürecini incelemektir. Çalışma, şirketlerin sahiplerinin müslüman olmaları veya müslüman kimselerin ağırlıkta olması halinde zekât ödemesinin nasıl yapılacağı sorusunu gündeme alır. Bu noktada kendini zekât ibadeti ile sorumlu hissedenlerin İslam hukukçularının görüşleri bağlamında finansal tabloların zekât açısından nasıl yorumlanabileceği noktasında bir fikir oluşturmasına fayda sağlanması amaçlanmıştır. Çalışmanın en önemli çıktısı, şirketlerin sahip olduğu varlıkları elde ettiği kaynaklar ile gelir-giderlerin zekât muhasebesi açısından tek düzen hesap planında yer aldığı şekli ile Vergi Usul Kanunu ile karşılaştırmalı olarak değerlemektir. Zekâta tabi/tabi olmayan, zekât matrahından indirilecek hesaplar ve özellik arz eden finansal kalemler tespit edilmekte ve değerleme farkları ile ortaya koyulmaktadır. Bu teorik çalışma, örnek uygulama yardımı ile zekât matrahının belirlenmesiyle somut duruma getirilmektedir. Çalışmada aynı zamanda uluslararası Şer-i Muhasebe Standartları olan AAOIFI'ye göre de hesap yapılmakta ve önerilen hesaplarla karşılaştırılmakta ve yorumlanmaktadır. Sonuç olarak ise AAOIFI'ye göre yapılan hesaplamalar ile kıyaslandığında farklı bir tutar ortaya çıkmaktadır. Oluşan bu farkın sebepleri hesap bazında incelendiğinde ise duran varlıklarda olan, bir yıldan uzun sürede nakde çevrilmesi planlanan, arazi ve arsalar, taşıtlar, borç ve alacak kalemlerinin dâhil edilme durumundan kaynaklandığı gözlemlenmektedir."
