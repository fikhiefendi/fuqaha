abstract: "Arşiv belgeleri içinde önemli yer tutan şer'î siciller, dönemin kadısı tarafından kayda geçirilen vesikalardır. Çalışmamızın konusu olan şer'iyye sicili, 1821-1822 yıllarında Sivas eyaletinin idarî, sosyal, ekonomik yapısına dair değerli bilgiler taşıyor. Kapalı şehir modeline sahip Sivas'ın fizikî dokusunu vali sarayı, kadı binası, mahkeme binası gibi idarî binalar, çarşı ve pazarlar, konaklar ve evler teşkil ediyor. Evlerde haremlik-selamlık düzeni vardır, avlu gündelik hayatta çok önemlidir. Defterdeki tereke kayıtlan halkın yaşayışı, ekonomik, sosyal durumu hakkında aydınlatıcı bilgiler veriyor. Müsadere ve gaiplik, uygunsuz davranışlar sergileyen insanlara halkın tepkisi, merkez-taşra münasebetlerinde devletin bütünlüğü ve kişi haklarının korunmasına dair örnekler, âyânlığın ıslahı ile ilgili buyrultular sicilde yer alıyor. 1821'de İran'a, Mora'ya asker sevkıyatı, halktan sağlanacak lojistik destek, atamalar, azillerle ilgili buyrultular; devletin para politikasıyla ilgili belgeler, vergiler, diğer gelirler, resmî fiyatlar, rayiç bedeller, serbest fiyatlar, narh tespiti, esnaf grupları, tüccarların devletle münasebetlerine dair bilgiler bulunan sicilde sıraladığımız konulara dair ilginç örnekler mevcuttur."
