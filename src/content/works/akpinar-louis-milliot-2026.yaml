abstract: "Fransız oryantalist geleneği, Batı'nın İslâm hukuku algısını şekillendiren en güçlü yapılardan biridir. Sömürgecilik tecrübesi ve akademik kurumsallaşmayla gelişen bu gelenek, ağırlıklı olarak Mâlikî fıkhı ile Kuzey Afrika pratiğine odaklanmıştır. Louis Milliot ise geleneksel Fransız çizgisinden kısmen ayrılarak dört Sünnî mezhebi kapsayan genel bir giriş kitabı kaleme almıştır. Ne var ki eserde kullanılan örnekler ve saha gözlemleri yine Mâlikî geleneğinin izlerini taşımaktadır. Bu çalışma, Fransız oryantalizminin İslâm hukukunu nasıl ele aldığını Louis Milliot merkezinde incelemektedir. Metin merkezli analiz ve tarihsel bağlam okuması yöntemleriyle Introduction à l'étude du droit musulman adlı eserdeki kavram tercihleri, mezhep okuması ve kaynak kullanımı çözümlenmiş, tahlillerin hangi noktaları öne çıkarıp neleri gölgede bıraktığı tespit edilmiştir. Araştırmanın ikinci aşamasında François-Paul Blanc ve JeanPaul Charnay'ın eserleri incelemeye dâhil edilmiştir. İnceleme sonucunda Milliot'nun“ordre légal”kategorisi etrafında kurduğu çerçevenin geleneğin temsil sınırlarını belirlediği, Blanc'ın aynı çerçeveyi modern kanunlaştırmalarla genişlettiği, Charnay'ın ise içeriden eleştirel bir okuma geliştirdiği ortaya konmuştur. Çalışma ayrıca eserin 1953 tarihli ilk baskısı ile sonraki baskıları arasındaki katmanları tespit ederek incelemenin hangi katman üzerinden yürütüldüğünü belirginleştirmekte, kavram aktarımındaki anlam kaymalarını eserin kendi terimler sözlüğü üzerinden tablolaştırmakta ve Türk akademik literatürü ile Fransız oryantalist geleneği arasında doğrudan kurulmamış bir diyaloğu görünür kılmaktadır."
