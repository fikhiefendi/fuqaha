abstract: "Fakihler arasındaki görüş ayrılıkları zamanla zengin bir literatür oluşturmuş ve süreç içerisinde bu görüş ayrılıklarını delilleri ile birlikte konu edinen alan ilmu'l-hilaf ismiyle anılmıştır. Bu alanda fakihler, ihtilaflı fıkıh meselelerini delillendirirken ilgili görüşleri yeniden inşa etmek suretiyle kendi zihin haritalarını ortaya koyarak değerli bir ilmî miras bırakmışlardır. Bu çalışmada, fıkhın temel alanlarından biri olan ilmu'l-hilaf, genel özellikleriyle ele alınmaktadır. Bu çerçevede; ilk bölümde ilmu'l-hilaf'ın ortaya çıkışı ele alınmış, hilaf bir kavram olarak analiz edilmiş, ilgili olduğu terimler açıklanmış ve son olarak hilaf literatürü için bir taksim önerisi sunulmuştur. İkinci bölümde hilaf bir ilim olarak ele alınmış, ilimler tasnifindeki yeri belirlenmeye çalışılmış ve ilmu'l-hilaf'ın ilgili diğer ilimlerle ilişkisini tespit edebilmek adına; fıkıh usulü, cedel, ilmu'l-mezheb, bilgi felsefesi ve yöntem ilimleri ile olan ilişkisi incelenmiştir. Üçüncü bölümde cedel yöntemlerinin hilaf eserlerinde nasıl kullanıldığı örnekler üzerinden ortaya konulmuştur. Dördüncü bölümde ilmu'l-hilaf'ın İslam ilim geleneğindeki etkilerini belirleyebilmek adına; ilmu'l-hilaf'ın fıkıh eğitimindeki yeri, fıkıh diline etkisi, ilmu'l-hilaf'a yönelik farklı yaklaşımlar, hilaf alimleri için kullanılan ünvanlar, ilmu'l-hilaf'ın mezhep olgusu ile ilişkisi ve fıkıh tarihi yazımında ilmu'l-hilaf'a biçilen rol ele alınmıştır."
