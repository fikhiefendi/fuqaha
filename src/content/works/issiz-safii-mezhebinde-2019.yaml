abstract: "Bu çalışma Şâfiî mezhebinde ashâbü'l-vücûh müctehidleri konusunu ele almaktadır. Bununla beraber ashâbü'l-vücûh kavramı, ashâbü'l-vücûhun ortaya çıkışı ve hangi müctehidler oldukları tespit edilmeye çalışılarak, Şâfiî mezhebindeki bu müctehidlerin ilmî mertebeleri ve konumları ortaya konulmaya çalışılmıştır. Ashâbü'l-vücûh konusu klasik eserler bağlamında ele alınmıştır. Ashâbü'l-vücûh müctehidleri Şâfiî fıkhında büyük bir öneme sahiptirler. Çünkü bu müctehidlerin İmam Şâfiî'den itibaren var oldukları kabul edilmektedir. Dolayısıyla Şâfiî mezhebinin ortaya çıkışı ve gelişimi başta olmak üzere konumları ve ortaya koydukları görüşleriyle Şâfiî mezhebinde büyük bir rol ve etkiye sahip olmuşlardır. Şâfiî fıkhında büyük önem arz eden bu müctehidler, ilmi tabaka bakımından mutlak müntesip müctehidden sonra gelen, mezhep imamının usulüne bağlı kalan ve görüşleri mezhepte vech olarak kabul edilen müctehidlerdir. Sayı bakımından büyük bir tabaka olan bu müctehidlerin görüşlerinin hangisinin dikkate alınacağı konusu ise belli kurallara tabi tutulmuştur."
