abstract: "Ortadoğu'nun en büyük ekonomileri arasında yer alan İran, 1979 İslam Devriminin ardından İslam Cumhuriyeti'nin kurulması ve ülkede İslam Hukuku'nun uygulamaya geçmesi sonucunda yapısal olarak birçok alanda radikal değişimler geçirdi. Bu alanlardan biri olan ekonomi ve finansta, anaakım ekonomi anlayışına ait bazı uygulama ve enstrümanlar kaldırılarak İslam Hukuku'na uygun uygulama ve enstrümanlar ikame edilmiş ve ülkede İslami bankacılık ve finans rejimi tam anlamıyla uygulanmaya başlanmıştır. Bunun yanında yeni yönetimin ekonomiye bakışı sebebiyle Ortadoğu'nun en büyük menkul kıymetler borsası arasında yer Tahran Menkul Kıymetler Borsası da (Tehran Stock Exchange, TSE), devrim ve Irak-İran Savaşı nedeniyle âtıl kalmıştır. Ancak, son 20 yılda müesses nizamın kontrolü altında İran'da özelleştirmelerin artması, sermaye piyasalarının devletin desteği ile gelişmesi, kurumsallaşması ve sermaye piyasalarına yatırımın özendirilmesi menkul kıymet araçlarına olan ilgiyi artırmıştır. TSE, 2013-2021 yılları arasında, Ruhani hükûmetinin uyguladığı para, sermaye piyasası politikaları ve pozitif içsel ve dışsal gelişmeler ile yukarı yönlü volatildi. Ancak 2018 yılında ABD yaptırımlarının devreye girmesiyle beraber ülkede şiddetli bir enflasyon dalgasının tecrübe edilmesi ve yerel paranın paritelere karşı hızla değer kaybetmesi TSE endeksinin yukarı yönlü sert hareketleriyle sonuçlanmıştır. Buna ilave olarak hükûmet, yaptırımlar nedeniyle oluşan ekonomik zararı minimize etme motivasyonuyla TSE'ye yatırımcı çekmek için çeşitli teşvik politikaları uygulamıştır. Mezkûr gelişmeler doğrultusunda çalışmada para politikasının hisse senedi piyasası üzerindeki teorik ve ampirik etki 2013-2021 yılları arasındaki TSE fiyat endeksi ve parasal değişkenler ışığında titizlikle incelenmiştir. Auto Regressive Distributed Lag (ARDL) yöntemi kullanılarak yapılan ampirik çalışmada teori ve literatür ile uyumlu olarak M1 para arzının TSE fiyat endeksine pozitif, reel faizin ise negatif etkide bulunduğu tespit edilmiştir."
