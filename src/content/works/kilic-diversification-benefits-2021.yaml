abstract: "Bu çalışmanın amacı Türkiye'de yerleşik hisse senedi yatırımcılarının Türkiye ile en yüksek ticaret hacmine sahip ülkelerde çeşitlendirme getirilerini ölçmektir. Portföy çeşitlendirme getirileri 2 çeşit hisse senedi yatırımcısı açısından analiz edilmiştir: geleneksel hisse senedi yatırımcıları ve İslami hisse senedi yatırımcıları. Türk hisse senedi günlük getirilerinin seçilmiş hisse senedi getirileri ile arasındaki zamana göre değişen korelasyonları tahmin etmek için 22 Ocak 2008'den 22 Ocak 2021'e kadar olan 13 yıllık döneme ait hisse senedi günlük getirileri baz alınarak DCC çoklu GARCH yöntemi kullanılmıştır. Sonuçlar Türkiye'de yerleşik geleneksel ve İslami hisse senedi yatırımcıları için ticaret ortakları arasında en yüksek çeşitlendirme getirisi ABD hisse senetlerinin sunduğunu göstermiştir. Genel olarak, İslami hisse senetleri geleneksel hisse senetlerine göre ticari partner ülkeler ile daha düşük korelasyon göstermiştir. Türkiye ve Rusya volatilitesi en yüksek endeksler olarak kaydedilmiştir."
