abstract: "ÖZET İsviçre - Türk Borçlar hukuku kural olarak“Sözleşme Özgürlüğü”nü benimsemiştir. Sözleşme özgürlüğü bir kimsenin istediği kimseyle istediği şekil ve içerikte sözleşme yapabilmesini ifade eder. ( BK. md 19 ) Kanun koyucu bu çerçevede sözleşen taraflara edimlerin değerini de serbestçe belirleme hakkı tanımaktadır. Ne var ki kanun koyucu çeşitli düşüncelerle bu özgürlüğe sınırlamalar getirmiştir. Nitekim bir sözleşmede bir tarafın diğer tarafın zayıf halinden faydalanıp aşırı menfaat elde etmesi korunmamış ve zayıf durumda bulunan kimseye sözleşme ile bağlı olmama hakkı tanınmıştır. Türk Borçlar Kanununda bu hak 21. maddede düzenlenen“gabin”ile tanınmıştır.“Gabinin Unsurları ve Hukuki Sonuçları”başlıklı çalışmamız üç ana bölümden oluşmaktadır. Bu bölümlerde esasen gabinin dayandığı esas, hukuki niteliği, gabini oluşturan unsurlar ve gabinli sözleşmeye bağlanan hukuki sonuç üzerinde durulmuş ve bu hususlar doktrindeki görüşlerin yanı sıra Yargıtay ve Federal Mahkeme kararlarıyla desteklenmiştir. Gabin müessesi, tarihi gelişiminden de çıkarıldığı üzere sosyal gelişmelerle tamamen paralellik göstermiş, sosyal ve siyasi ideolojilerle birlikte ya sıkı şartlara tabi tutulmuş ya da serbest bırakılmıştır. İlk kez faiz alanında karşılaşılan gabine bugünkü mevcut anlamıyla Alman hukukunda rastlanmaktadır. Gabinin unsurları ise objektif ve sömürülen ve sömüren bakımından sübjektif unsurdur. Gabine uğrayanda bulunması gereken zayıf haller yani“hiffet, tecrübesizlik, müzayaka”halleri ise uygulayıcılar tarafından gittikçe daha geniş yorumlanmaktadır. Sömürülen tarafın sadece zayıf durumunun bulunması yetmemekte ayrıca karşı tarafın bu durumu biliyor olması gerekmektedir. Açık nispetsizlik hususunda ise bazı yabancı kanunların ve Mecellenin aksine kanunumuz belirli bir oran öngörmemiş ve hakime belirli etkenlerin ( Piyasakoşulları, ödemenin sağlamlığı..vb) yardımıyla bu nispetsizliği takdir hakkı tanınmıştır. Gabinli sözleşmeye bağlanan yaptırım ise“ iptale edilebilirlik ”tir. Buradaki“ ”iptal beyanı gerek kullanılışı gerekse hükümleri bakımından BK. md 31 'de ifade edilen irade sakatlığı halleri için kullanılan iptal beyanından farksızdır. Bu hak şekle bağlı olmadan tek tarafa varması gerekli yenilik doğurucu hak niteliğindedir. Gabine bağlanan yeni bir sonuç ise edimlerin değerinin yeniden belirlenerek sözleşmenin ayakta tutulmasıdır."
