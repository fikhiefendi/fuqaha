abstract: "Şer'iyye Sicilleri, Osmanlı adli mekanizmasının temel birimi kadılıklar (şer'i mahkemeler) bünyesinde günlük tutulan kayıt defterleridir. Bu defterlerde, merkezden gelen ferman ve berat gibi resmi evrakların suretleri yanı sıra mahalli olayların ele alındığı ve yerel mahkeme tarafından tutulan belgelerde yer almaktadır. Bu defterlerde kadının ya da naibin yetkisi kapsamında görülen adli ve resmi işlemlere dair karar ve kayıtlar, tarih sırasına göre kaydedilmiştir. Bu siciller; Osmanlı Devleti'nde devlet organları arası resmi muamelâtın işleyişine, bürokratik ve idari teşkilatlanma yapısına, özellikle şehir tarihi ve sosyo-ekonomik hayatı üzerine bizlere çok önemli bilgiler sunar. Bu açıdan siciller, Osmanlı tarih araştırmaları için başvurulan temel kaynaklar arasındadır. Bu çalışmada, 9 Numaralı Çankırı Şer'iyye Sicili (H. 1143-1145/ M. 1730-1733) incelenmiştir. Ayrıca 1730-1733 tarihleri arasında Çankırı'nın idari, sosyal, askeri kültürel ve ekonomik hayatının aydınlatılmasına katkıda bulunmak amacıyla 9 Numaralı Çankırı Şer'iyye Sicili transkripsiyon, tahlil ve tasnif edilmeye çalışılmıştır. Defterin içerdiği belge türlerinin büyük kısmı, merkezden livaya gönderilen emir mahiyetindeki resmi belgelerdir. Bunda devam eden, Osmanlı-İran savaşlarının etkisi olduğu söylenebilir."
