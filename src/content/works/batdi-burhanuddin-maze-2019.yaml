abstract: "Bu tez çalışmasının amacı, Buhara Hukuk Okulu âlimlerinden Burhânî'nin“el-Muhîtu'l-Burhânî”adlı eserindeki“furûk-u fıkhiyye”meselelerini“Kitâbu't-Tahâre”ve“Kitâbu's-Salât”özelinde tespit ve tahlil etmektir. Mezkûr eserin tamamı araştırmaya mevzu olup, çalışma alanı“Kitâbu't-Tahâre”ve“Kitâbu's-Salât”ile sınırlandırılmıştır. Çalışmada genel anlamda istikra (tümevarım) yöntemi kullanılmakla birlikte,“el-Muhîtu'l-Burhânî”de yer alan araştırmayla ilgili materyalin tespiti için belge tarama yönteminden de yararlanılmıştır. Araştırmanın seyri içerisinde tasnif, tespit, tahkik, tahlil, tenkit, tetkik ve tercih yöntemleri de kullanılmıştır.“el-Muhîtu'l-Burhânî”de furûk-u fıkhiyye meselelerine ve kavramlarına sıkça rastlanılmıştır. Eserde yer alan furûk meselelerinden 65 tanesi çalışmanın ikinci bölümünde tahlil edilmiştir. Tahlil sonuçlarına göre Ebu Hanife, İmameyn ve İmam Züfer başta olmak üzere Hanefi fakihlerin fıkhî tutarsızlıklardan kaçınmaya özen gösterdikleri, meseleleri birbirine kıyas ederken asıl ile ferʻ arasındaki nüansların tespitinde titiz davrandıkları sonucuna ulaşılmıştır. Burhânî, girift meseleleri karşılaştırmalı olarak ele alarak, meselelerin daha kolay anlaşılmasına ve mezhep içi ilkesel tutarlılığın oluşmasına katkı sağlamıştır."
