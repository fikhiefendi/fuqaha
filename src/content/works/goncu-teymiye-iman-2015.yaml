abstract: "Amelin imâna dâhilolup olmayacağına ilişkin tartışmalar hicrî 2.asırdan itibaren başlamış ve güncelliğini hiç yitirmeden devam edegelmiştir. Amelin, imanın tanımına dâhil olduğunu düşünenlerin önde gelenlerinden biri de hicrî 661 ve 728 yılları arasında yaşamış olan veİslâm âlemi üzerinde önemli etkiler bırakmış bir âlimolan İbn-i Teymiye'dir.İbn-i Teymiye ameli imandan sayma konusunda kendilerinden ilim almış olduğu hocalarının yolunu takip etmiş ve onların ameli imânâ dâhil ederken getirmiş oldukları delilleri daha sistemli bir şekilde ele alıp kuvvetlendirmiştir. Yaşadığı asırda sevenleri tarafından Şeyhu'l-İslâmlakabıyla da anılan İbn-i Teymiye, amelinimânadâhilolmadığını savunanlarla birçok münazaralarda bulunmuş, onların görüşlerini çürütmek ve savunduğu görüşün doğruluğunu ispat etmek maksadıyla birçok makâleler ve kitaplar kaleme almıştır. Bu çalışmamızda kökü çok eskilere dayanan bu tartışmaların en önemli aktörlerinden biri olan İbn-i Teymiye'nin bu anlayışını ve bu anlayışını ispat etmek için başvurduğu aklî ve naklî delillendirmeleri ele aldık. Bu konuyu işlerken doğal olarak İbn-i Teymiye gibi düşünen ilim adamlarının konuyla ilgili olan bir takım delillendirmelerine de özet olarak değindik. Konumuz İbn-i Teymiye özelinde olduğu için onun muarızlarının görüşlerine sadece özet olarak değinebildik."
