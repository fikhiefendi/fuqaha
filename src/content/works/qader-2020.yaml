abstract: "Nikah akdi, yüce Allah'ın yürürlüğe koyduğu en kutsal sözleşmelerden biridir. Bu akid, doğrudan cinsel birlikteliği ifade etmekle birlikte, taraflar (damat-gelin) ancak sahih bir evlilik akdinin kurulması sonucunda birbirine helal olabilirler. Aynı zamanda taraflar boşanırlarsa aralarındaki durum tekrar harama dönüşür. Bu nedenle İslam bu konuya özel ve benzeri görülmemiş bir önem vermiştir. Nitekim Kur'an'da nikah akdi büyük sözleşme olarak şöyle tarif ediliyor: وَإِنْ أَرَدْتُمُ اسْتِبْدَالَ زَوْجٍ مَكَانَ زَوْجٍ وَآتَيْتُمْ إِحْدَاهُنَّ قِنْطَارًا فَلَا تَأْخُذُوا مِنْهُ شَيْئًا ۚ أَتَأْخُذُونَهُ بُهْتَانًا وَإِثْمًا مُبِينًا {20}وَكَيْفَ تَأْخُذُونَهُ وَقَدْ أَفْضَىٰ بَعْضُكُمْ إِلَىٰ بَعْضٍ وَأَخَذْنَ مِنْكُمْ مِيثَاقًا غَلِيظًا {21} النساء،4], İslam, evlilik sözleşmesinin sürekliliğini esas alarak, bu bağın korunması ve sağlanması için uygun yasalar ve hükümler sistemi ortaya koymuş ve sahih bir evlilik sözleşmesi için bazı şartlar ileri sürmüş. Aslında evlilik insan uygarlığının en büyük direğidir. insanlığın kalıcılığını sağlamanın tek helal yoludur ve bununla birlikte insan ırkını sürdürebilen eşsiz bir sistemdir, Evlilik toplumları ahlaki ve psikolojik sapmalardan korumanın en iyi yoludur. Bu çalışmamız, bir giriş, bir önsöz ve dört bölümden oluşmaktadır. Giriş bölümünde araştırmanın önemi ve bu araştırmanın isteğe bağlı nedenleri hakkında kısaca bilgi verdikten sonra önsözde, dil açısından sözleşme, sağlık ve hükümsüzlük gibi konuları ele aldık. Daha sonra Irak hukuku çerçevesinde hukukçuların konu hakkındaki görüşlerine değindik. Ayrıca sağlıkla ilgili terimler, geçersizlik ve terimler arasındaki ayırımları ortaya koymaya çalıştık. Çalışmamızın birinci bölümünde, nikah akdinin inikad ve sıhhat şartları ve bunun sağlık ve geçersizlik üzerindeki etkisine değindik. Hemen ardından üç talep olarak ifade edilen nikah akdinin şartları, şartların yokluğu ve bunların sözleşmenin geçerliliği ve geçersizliği üzerindekietkisi üzerinde durmaya gayret ettik. ikinci bölümde, sağlık ve malullüğün yasal etkileri, üçüncü bölümde evlilik sözleşmesinin hükümsüzlüğü üzerindeki cezai etkiler ve dördüncü bölümde ise nikah akdinin geçersizliği sonucunda meydana gelen maddi etkiler (boşandıktan sonra çeyiz kararı, para tasarrufu ve dağılımı, yasal yaptırımlar) gibi konular üzerinde durduk. Ayrıca her bölümün sonunda da Irak hukukuna ait hukuki metinlerine yer vererek, bu yasal metinlerle şer'î hükümler karşılaştırmaya özen gösterdik. Araştırmamızın sonunda bizde hasıl olan düşünceleri sonuç bölümünde belirttikten sonra çalışmamız boyunca müracaat ettiğimiz kaynakları da kaynakça bölümünde belirttik. Insanın kıusursuz olamayacağı düşüncesinden hareketle bu çalışmamızın da kusurları olabileceğini ifade ederek, çalışmamızın kabul görülmesi ve bu alanda yapılacak çaışmalara mütevazi bir katkı sunmasını temenni diyoruz. Çalışmamız boyunca yardımlarını esirgemeyen kıymetli danışman hocam Doç. Dr. Mehmet Selim ASLAN'a teşekkür ederim. Ayrıca sürekli desteklerini sağlayan değerli hocam Dr. Kerim Hemin Balisani'ye ve eğitim hayatım boyunca üzerimde emeği olan tüm hocalarıma da teşekkürü bir borç bilirim."
