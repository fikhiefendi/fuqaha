abstract: "Sanayi Devriminin ve kapitalizmin çalışan kitleler açısından yarattığı olağanüstü zorluklara tepki olarak ortaya çıkan sendikal örgütlenmeler, gerek çalışma şartlarının düzeltilmesi gerek emekçi kesimin yaşam standartlarının artırılması amaçları doğrultusunda, tarihsel süreç içerisinde çeşitli faaliyette bulunmuşlardır. Bu kapsamda sendikalar, kimi zaman, ekonomik ve mesleki yönleri ağır basan fiillere girişmişler; yaşanan sorunların asıl kaynağının siyasi ve iktisadi düzen olduğunun farkına vardıkları vakit ise, politik veçheyi haiz eylemlere başvurmaktan kendilerini alıkoyamamışlardır. Buna karşın, istisnai durumlar haricinde, iki asrı aşkın zaman zarfında, dünyanın dört bir yanında benimsenen kapitalist ve neoliberal ekonomi politikaları, sendikal hak ve özgürlüklerin hukuk sistemlerinde ziyadesiyle sınırlı biçimde güvence altına alınması neticesini doğurmuştur. Bahse konu vaziyet ise, geçmişten günümüze, sendikal faaliyetlerde bulunan örgütlenmeler ve bireylerin devlet organlarıyla sıklıkla karşı karşıya gelmelerine sebebiyet vermiştir. Nitekim bu çalışmada da esasen, sözü edilen problemin özel bir yönüne yoğunlaşılmakta; insan haklarının korunması amacı doğrultusunda, Avrupa kıtasında akla ilk gelen yargısal organ olan Avrupa İnsan Hakları Mahkemesi ile bireysel başvuru yolu vasıtasıyla, on yılı aşkın zaman zarfında, ülkemizdeki temel hak ve özgürlük ihlallerinin giderilmesi misyonu ekseninde faaliyet gösteren Türk Anayasa Mahkemesinin sendikal hak ve özgürlüklere karşı temel bakış açısı, ortaya koyulmaya çalışılmaktadır. Bu bağlamda, hem neoliberal düzenlerle kaçınılmaz bir çatışma içerisinde olan hem de yoğun bir siyasi karaktere sahip bulunan sendikal haklara, anılan yargısal merciler tarafından ne gibi gerekçelerle, hangi düzeyde hukuki koruma sağlandığı sorusu, bu tezin ana konusunu teşkil etmektedir. Bu doğrultuda, sendika kurma ve sendika üyesi olma, toplu pazarlık veya grev benzeri sendikal hakları merkeze alan başvurular gündeme geldiğinde, bir yandan, söz konusu mahkemelerin hukuki tespit ve çıkarımlarının nelerden ibaret olduğu açıklanmakta; öte yandan, bu hukuksal değerlendirmelerin ardındaki politik ve iktisadi gerekçeler, elden geldiğince, gün yüzüne çıkarılmaya çabalanmaktadır."
