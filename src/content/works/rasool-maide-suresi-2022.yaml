abstract: "Mâide Sûresi, Müslümanların hayatını düzenleyen fıkhî konular başta olmak üzere, çeşitli konular ihtiva etmektedir. Yüce Allah (cc); Mâide Sûresi'nde başta yiyecekler, keffâretler ve hadlerin yer aldığı önemli birçok fıkhî hükmü bir araya getirdi. Dinî ve dünyevî işlerle ilgili hükümler başta olmak üzere fıhkî hükümlerin zikredilmesindeki temel maksat, onları anlamak ve onlardan istifade etmektir. Böylece bütün olumsuzluklardan uzak bir biçimde İslamî bir yaşam biçimininim oluşturulması amaçlanmaktadır. Bu çalışmada araştırmacı, cüzî hükümlerden hareketle genel ve nihaî hükümlere ulaşmak için öncelikle birtakım hükümler istihraç yöntemi uygulandı. Ayrıca sonuca ulaşmak için araştırmanın yol haritasında en kısa ve muteber yöntemleri takip edildi. Araştırmacı; dinin, aklın, canın, mal ve neslin korunması gibi müminler ve toplumdaki bütün kişilerin faydasına olan makasıd-ı şeriânın bütün nevilerinin zikrinden hareketle araştırmanın ilgili yerlerinde bunlara yer verdi."
