abstract: "“Maliki Fıkhında Namazın Hazırlık Şartları ve Delillerinin Değerlendirilmesi”başlıklı çalışmamızla öncelikli olarak Maliki fıkhında konuyla ilgili hükümleri tespit etmektir. Ayrıca bu konuda ortaya atılan bazı yanlış kanaatlerin Maliki mezhebi kaynaknaklarından referans göstererek tashih etmektir. Çalışmamız bir griş ve üç bölümden oluşmaktadır. Girişte Maliki mezhebinde konuyla ilgili görüşlerine yer verilen fakihler ile eserleri hakkında kısaca bilgi verildi. Birinci bölümde, taharet ve necaset konuları ile ilgili meseleler ele alınırken, ikinci bölümde setr-i avret ve namazın vakitleri konuları incelendi. Üçüncü bölümde kıble ve niyet konuları üzerinde duruldu. Çalışmamız esnasında elde edilen neticeler sonuç bölümünde sunuldu. Konuyu araştırırken konuyla alakalı yazılmış kitap, tez, makale gibi çalışmalardan bir literatür taraması yapıldı. Namaza hazırlık şartları hususunda fıkhi konular belirlenirken Mâlikî mezhebi ile sınırlı kalındı. Bununla birlikte, bu mezhebin kendi içindeki farklı görüşler ortaya konularak kısmen usul açısından da incelendi. Mâlikî mezhebi içindeki ihtilaflar ve bunların değerlendirmeleri de yapıldı. Bu konuda mezhebin usulü esas alındı."
