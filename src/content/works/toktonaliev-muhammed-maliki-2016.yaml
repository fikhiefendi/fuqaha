abstract: "Muhammed el-Mâlikî (1946-2004) XXI asrın başlarında yaşamış sufilerden biri olup birçok tarikatten icazet almış bir zattır. Daha küçük yaşındayken dinî eğitimini babasından almış. Ondan sonra Felâh ve Savletiye medreselerinde şerî ilimleri okumaya başlamış. Bu medreselerden mezun olduktan sonra doktora yapmak için Mısır'daki el-Ezher üniversitesine gitmiştir. Onun doktora tezinin konusu“el-Muvatta ve inâyetu'l-Ümmeti bihi”. dir. Seyyit Muhammed b. Alevî hazretlerinin babası Mekke'nin en büyük ve saygın âlimlerindendi. Hayatta iken hem Mekke Müftülüğü hem de Haremi Şerifte müderrislik görevini de yürüten Seyyid Alevî b. Abbas el-Maliki, yine dönemin tanınmış tasavvuf büyüklerindendi. Bu âilenin Mâlikî lakabıyla isimlendirilmesinin sebebine gelince, dedelerimden birisi Şerif Avn'i-Refîk Paşa'nın döneminde Mâlikî mezhebinin önemli fetva kürsüsüne geldiğinden beri bu âile Mâlikî lakabıyla anılmaya başlamıştır.“ Mekke'deki ilmi çalışmaları sırasında yine pek çok ülkeye ziyaretler yapmış, Kanada'dan, Endonezya'ya, Türkî Cumhuriyetlere, Bangladeş Pakistan, Kenya, Türkiye ve Yemen'e kadar birçok ülkeye gitmiş oralarda talebeleri, müritleri ve sevenleri ile birlikte olmuş, bu ülkelerde okullar ve medreseler açmıştır.Talebelerinin birçoğu Endonezyalıdırlar. Muhammed el-Mâlikî dönemin ehli-sünnet müdâfîsi olmuştur. Onun kaleme almış olduğu eserlerini birçok değişik dillere tercüme edilmiştir. Özellikle ”Mefâhim yecibü en tusehhah“ ve ”fehmu'n-Nusûs fî mencehi's-Selef\" adlı iki eseri birçok Ehl-i sünnet âlimleri tarafından rağbet kazanmıştır."
