abstract: "Deniz ürünleriyle ilgili fıkıh literatüründeki hükümlerin incelendiği bu çalışmada, konuyla ilgili mezhep alimlerinin verdiği hükümler delilleriyle incelenmiştir. Balıkçılık sektörünün devasa bir büyüklüğe ulaştığı günümüzde, İslam hukuku alanında deniz ürünleriyle ilgili müstakil bir çalışmanın olmayışı, İslam hukukunun bu alandaki hükümlerinin bir tez çerçevesinde ortaya konmasını gerektirmiştir. Bu çalışmada deniz ürünleriyle ilgili klasik kaynaklarda verilen hükümlerin ortaya konulması ve bu hükümlere kaynaklık eden bakış açılarına yer verilmesi amaçlanmıştır. Birinci bölümde gıdalarda helallik ve haramlık konusu, helal ve haramı belirlemedeki temel ölçütler; ikinci bölümünde ise deniz ürünlerinin ahkâmı kapsamında deniz avı kavramı incelenmiş ve deniz ürünlerinin avlanması, tezkiyesi, gıda olarak kullanılması, alım satımı ve takı olarak kullanılması gibi konulara yer verilmiştir. Üçüncü bölümde ise deniz ürünleriyle ilgili klasik ve modern dönemdeki fetvalara yer verilmiş ve bu fetvalara ilişkin değerlendirmeler yapılmıştır. Araştırmanın sonucunda, konuyla ilgili İslâm hukukçularının verdiği farklı hükümlerin, mezheplerin haram ve helal konusuna bakış açılarından ve nasları yorumlamadaki usullerinden kaynaklandığı görülmüştür."
