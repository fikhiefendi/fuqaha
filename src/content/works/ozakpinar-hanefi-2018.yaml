abstract: "Bu çalışma usûl sistematiği açısından Hanefî mezhebi ile diğer mezheplerin farklı görüşlere sahip olduğu mutlak ve mukayyed lafız anlayışı ve ıtlak ve takyid prensibinin Hanefî mezhebinde nasıl uygulandığını ortaya koymayı amaçlamaktadır. Araştırma bir giriş ve üç bölümden oluşmaktadır. Girişte araştırmanın konusu, kaynakların tespiti ve kullanılmasında takip edilen metod ve çalışmaya verilen ismin tercih sebeplerine yer verilmiştir. Birinci bölümde Kur'ân-ı Kerîm ve Sünnet'i dil ve ifade analizi ile inceleyen usûl ilmi açısından mutlak ve mukayyed kavramların mahiyetlerinin tespiti üzerinde durulmuştur. İkinci bölümde Hanefî mezhebinin ıtlak ve takyid anlayışı ve diğer mezheplerle aralarındaki anlayış farkı incelenmiştir. Üçüncü bölümde de Hanefî mezhebinin mutlak ve mukayyed lafızlara ilişkin kabul ettikleri prensiplerin fer'i meseleler üzerinde nasıl uygulandığı Şemsü'l-eimme Serahsî'nin el-Mebsût adlı eseri esas alınarak ortaya konmuştur. Uygulama örnekleri ile ilgili değerlendirmenin ardından bütün inceleme boyunca ulaşılan sonuçların bir araya getirildiği \"Sonuç\" ve \"Kaynakça\" ile araştırma son bulmuştur."
