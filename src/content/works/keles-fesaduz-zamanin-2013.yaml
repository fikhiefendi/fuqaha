abstract: "Tezimizin konusu Fesadü'z-Zamanın (Dinî Hassasiyetin Azalmasının) Ahkâmın Değişmesine Etkisidir. Çalışmamızda fesadü'z-zaman kavramının ilk defa ne zaman ortaya çıktığını vekavramın gelişim sürecini inceledik. Fesadü'z-zamanla ilişkili kavramları ele alarak bunların fesadü'z-zamanla olan bağlantılarını, benzerliklerini ve ayrıldığı noktaları tespit etmeye çalıştık. Hukukî konuların hemen her alanında kaynaklarda bolca örneğini bulduğumuz fesadü'z-zamanın hükümlerin değişimine nasıl etki ettiğini örneklerden hareketle sunarak bir usûl konusu olarak incelenmesi gerektiği kanaatinde olduğumuz kavramın usûl açısından hangi sonuçlara bağlanabileceği üzerinde durduk. Bu açıdan hükümlerin değişimine etkilerini değerlendirerek fesadü'z-zamanın kaynaklık değeri hakkında yorumlar yaptık. Son olarak fesadü'z-zamanın aktüel değeri başlığında güncel meselelerde nasıl bir işleve sahip olabileceğini göstermeye gayret ettik. Anahtar Kelimeler: Fesad, zaman, İslam Hukuku, bozulma, değişim, ahkâm, fıkıh, fetvâ, usûl, ahlâk"
