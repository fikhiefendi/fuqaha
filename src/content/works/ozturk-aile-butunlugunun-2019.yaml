abstract: "Bu çalışma, aile bütünlüğünün korunması kapsamında Diyanet İşleri Başkanlığı'na bağlı Aile ve Din Rehberlik Bürolarının İşlevi üzerine olup, bu kapsamda yürütülen çalışmaları tespit etmeye yöneliktir. Teorik ve uygulamalı kısımlarının tarama modeli ile yürütüldüğü bu çalışmada, Diyanet İşleri Daire Başkanlığı'nın özel izni ile Antalya İli Müftülüğü, Aile ve Dini Rehberlik Bürolarına 2014-2017 yılları arasında gelen ve kayıt altına alınmış, vatandaşların ailevi, sosyal, fıkhi ve benzeri konularda sormuş oldukları 652 adet danışan karteksinin araştırmaya konu olan envanter bilgileri istatistiksel olarak analiz edilmiştir. Elde edilen bulguların yorumlanmasında SPSS 24 analiz ve istatistik programı kullanılarak, yüzde(%) ve frekans(f) çözümlemeleri yapılmıştır. Araştırma üç bölümden oluşmaktadır. Birinci bölümde genel olarak aile yapısı, kavramsal ve politikalar açısından ele alınmış, aile kavramı ve Türkiye'de aile kurumu ile ilgili teorik bilgilere yerilerek Türkiye'de aile bütünlüğünün korunmasına dair kamu politikaları üzerinde durulmuştur. İkinci bölümde, Diyanet İşleri Başkanlığı'na bağlı Aile ve Dini Rehberlik Büroları'nın tarihçesi ve işlevleri ortaya konmuştur. Üçüncü bölüm de ise araştırma örneği olarak seçilen Antalya İli Aile ve Dini Rehberlik Bürosu'na ait istatistiki ve büro yetkilileriyle gerçekleştirilen mülakatla elden edilen bulgular ortaya konulup bu bulgulara dayanarak ulaşılan sonuçlar tartışılmıştır."
