abstract: "Suç ve cezaların kanuniliği ilkesi, Azerbaycan ceza kanununda bir ?ceza kanunu ve sorumluluğu ilkesi? olarak düzenlenmiştir. Buna göre, ceza sorumluluğunun, dolayısıyla suç ve cezai sonuçların (ceza ve güvenlik tedbirlerinin) tek kaynağı kanundur, başka bir deyişle, Cinayet Mecellesi'dir. Cinayet Mecellesi, Anayasa ve uluslar arası hukukun evrensel norm ve ilkelerine dayanır, dolayısıyla bunlara aykırı olamaz.Kanunilik ilkesinin temelini oluşturan suç teorisi, esasen iki kavram üzerine inşa edilmiştir. Bunlardan biri ?suç?, diğeri ise ?suç tipi? kavramlarıdır. Suçun maddi ve biçimsel bütün özelliklerinin düzenlendiği, başka bir deyişle, suçun genel tanımının yapıldığı 14. madde hükmü, esasen direktif (yönergesel) bir norm olup, kanun koyucunun suç ve ceza koyarken izlemesi gerektiği yolu göstermektedir. Maddenin ikinci fıkrası ise bir fiilin suç sayılabilmesi için sahip olması gereken asgari tehlikelilik derecesini belirlemektedir. Ancak bütün bunlar, Azerbaycan ceza hukukunda suçun maddi anlayışının kısmen de olsa benimsendiğini, dolayısıyla suçun sosyal tehlikelilik özelliğinden yola çıkılarak ceza sorumluluğuna gidilebileceği sonucunu doğurmaz. Ceza sorumluluğu, ancak suçun kanunda tanımlanan unsurları bütününü ifade eden ?suç tipi?ne uygun bir fiilin gerçekleşmesi ile ortaya çıkar.Bütün bunlarla beraber, Azerbaycan ceza hukukundaki Mecelle uygulaması, açık ceza normlarına olan ihtiyacı artırması nedeniyle yeniden gözden geçirilmeli, ceza hukuku, hukuk dışı kavramlardan arındırılmalıdır."
