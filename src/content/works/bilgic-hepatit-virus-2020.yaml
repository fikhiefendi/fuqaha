abstract: "Giriş: Bu çalışmada tedavi deneyimsiz ve tedavi deneyimli [Pegile-İnterferon±Ribavirin (PEG-IFN±RBV)] olup sonrasında nüks gelişmiş Hepatit C Virüsü (HCV) ile enfekte hasta grubunda, yeni geliştirilmiş bir Direkt Etkili Antiviral (DEA) ajan olan Ledipasvir/Sofosbuvir (LED/SOF) kombinasyon teavisinin etkinliği çalışılmıştır. Materyal ve Metod: İnönü Üniversitesi Turgut Özal Tıp Merkezi Gastroenteroloji Kliniğine 06.06.2016-23.05.2018 tarihleri arasında başvuran, 3-6 ay boyunca LED/SOF tedavisi alan, tedavi deneyimsiz (daha önce tedavi almamış) ve tedavi deneyimli (PEG-IFN±RBV) olup sonrasında nüks gelişmiş Hepatit C ile enfekte hastaların dosyaları incelenmiştir. Bulgular: Çalışmamıza 20 kadın (%44.4) 25 erkek, (%55.6) olmak üzere 45 hasta dahil edildi. Bu hastalardan 22'si daha önce PEG-IFN±RBV tedavisi alıp nüks etmiş olup, 23'ü tedavi deneyimsiz hasta idi. Hastaların yaşı, cinsiyeti, tedavi başlangıcındaki ve 6. aydaki aspartat aminotransferaz (AST), alanin aminotransferaz (ALT), alkalen fosfataz (ALP), gama-glutamil transferaz (GGT), total bilurubin, albümin, Uluslararası Düzeltme Oranı (INR), hemoglobin (HGB) ve trombosit (PLT) değerleri, tedavi başlangıcındaki, 1. ay, 2. ay ve 6. aydaki HCV-RNA düzeyleri incelendi. Tedavi öncesi HCV-RNA düzeyleri ile tedavi verildikten sonraki 1.ay, 2.ay ve 6.ay HCV-RNA düzeyleri birbirleri ile karşılaştırıldığında değerlerdeki azalma istatistiksel olarak anlamlı bulundu (p<0.05, p<0.05, p<0.05). Başlangıç ve 6. ay AST, ALT, GGT, albumin ve PLT sonuçları kendi aralarında incelendiğinde istatistiksel olarak anlamlı bulundu (p<0.05, p<0.05, p<0.05, p<0.05, p<0.05). Sonuç: HCV enfeksiyonunda tedavi deneyimli veya tedavi deneyimsiz hastalarda LED/SOF tedavisi güvenilir ve başarılı bulunmuştur."
