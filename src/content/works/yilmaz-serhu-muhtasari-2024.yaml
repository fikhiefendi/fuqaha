abstract: "İlimlerin ihtisaslaşma sürecinde önemli bir yeri olan tedvin faaliyeti fıkıh ilminde de gerçekleşmiş, Ebû Hanîfe'nin ders halkasında işlenen fıkhî meseleler öğrencileri tarafından kayıt altına alınarak mezhebin ve fıkıh ilminin ilk telifi üretilmiştir. Söz konusu faaliyetin sonucunda elde edilen eser fıkhın asıllarını ortaya koyma iddiası ile el-Asl şeklinde adlandırılmıştır. Süreç içerisinde sadece bir kitabın ismi olmanın yanı sıra el-asl, geniş bir anlam yelpazesine sahip olarak merkezî bir kavram haline gelmiştir. Kavramın kullanıldığı alanlardan biri fıkhın teorik zemininin inşa edildiği usûl-i fıkıh ilmi olup ilk defa Kerhî'nin kaleme aldığı risalede bu ilmin ilkeleri tesis edilmiş ve her bir ilkenin başına el-asl ifadesi getirilmiştir. Kerhî asılları yalnızca küçük risalesine hasretmeyip füru metni olan Muhtasar'ında da yoğun bir şekilde kullanmış ancak bu asılları sadece fıkıh meselelerine dair genel ilkeler şeklinde sunmamıştır. Kimi zaman konunun temellendirilmesi veya ferʿe hüküm veren asıl, kimi zaman da ihtilaf halinde tarafları temsil eden görüşlerin dayanağı olarak kabul etmiştir."
