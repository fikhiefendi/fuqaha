abstract: "Bu araştırmada yirminci yüz başlarına, tam olarak 1923-25 yıllarına ait MakedonyaŞeriye sicillerinden bazı örnekler incelendi. Bu dönem Osmanlı Devleti dağıldığı,Birinci Cihan Harbi sonrasında Balkanlarda birbiri ardına milli devletlerin ortayaçıktığı çok sancılı bir dönemdir. Burada dikkate değer olan husus, bütün Balkanlardave araştırmaya konu olan Makedonya'da Müslüman varlığın bir cemaat olarak ahvalişahsiyye denilen nikah, evlenme-boşanma, miras, tereke gibi hususlarda İslamîkurallara göre muamelatın yürütülmüş olması ve bu konudada İstanbul'da Meşihat-iİslamiyye'nin belirlediği ve Dustur'da yayınlanan Nizamname çevrçevesinde hareketedilmiş olmasıdır. Osmanlı sonrasına ait olan bu sicil kayıtları bir çok hususuntesbitine yardımcı olmaktadır.Osmanlı şehirlerindeki bütün mahkemelerde tutulmuş olan kadı sicillerinin inanılmazşekilde birbirine benzer bir uslupla yazıldığı, ortak bir terminoloji kullandığıbilinmektedir. 1923-24 tarihinde Manastır'da da bu özelliği görmek mümkündür.Bütün bu özelliklerin takip edilebilmesi için araştırmanın giriş kısmında önceyirminci yüzyılın başında Balkanlardaki Türk ve Müslüman halkın durumunu,İslamın buralardaki tesir ve izlerini kısaca anlatan bir bahis eklenmiş, ayrıca sicillerindil ve uslup özellikleri, muhtevasıyla ilgili bazı tesbitlerde bulunulmuştur. Giriştensonra konu ile ilgilenen araştırmacılara yardımcı olma üzere sicillerin tammetinlerinin verilmesi, ayrıca tıpkıbasımlarının eklenmesi de uygun görülmüştür."
