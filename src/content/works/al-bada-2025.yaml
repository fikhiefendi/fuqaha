abstract: "Bu çalışma,“Yapay Zekâ Kaynaklı Finansal İşlemlerin Düzenlenmesi – Fıkhî ve Analitik Bir İnceleme”konusunu ele almakta, finans alanındaki teknolojik gelişmeleri İslâm hukukunun temel ilkeleriyle ilişkilendirmektedir. Araştırmada yapay zekânın tanımı, türleri ve güncel uygulamaları, özellikle de akıllı işlemler (otomatik alım satım, finansal analiz, akıllı krediler ve akıllı sözleşmeler) incelenmiş, bu uygulamaların doğurduğu güncel fıkhî meseleler (ğarar, cehalet, ribâ ve sorumluluk) tartışılmıştır. Ayrıca yapay zekânın hukuken bağımsız bir taraf olup olamayacağına dair değerlendirmeler yapılmıştır. Çalışmada fıkhî-analitik bir yöntem benimsenmiş, teknik uygulamalar ile yerleşik fıkıh kuralları karşılaştırılmıştır. Ayrıca güncel örnekler üzerinden uygulamalı analiz yapılmıştır. Birinci bölümde yapay zekâ ve finansal işlemlerin kavramsal temeli ortaya konmuş, ikinci bölümde akıllı finans uygulamaları ve fıkhî riskler incelenmiş, üçüncü bölümde ise akıllı işlemler için genel ve özel fıkhî ilkeler tespit edilerek güncel örneklere uygulanmıştır. Araştırma, yapay zekânın bağımsız bir hukukî şahsiyet sayılamayacağını, işlemlerin sürekli şer'î denetime tabi tutulması gerektiğini ve şeffaflık, ğarar ve ribânın önlenmesi ile sorumluluğun garanti altına alınmasının zorunlu olduğunu vurgulamaktadır. Ayrıca, şeriata uygun akıllı sözleşme modellerinin geliştirilmesi ve böylece finansal teknolojinin şer'î maksatlara hizmet etmesi gerektiği sonucuna ulaşılmıştır."
