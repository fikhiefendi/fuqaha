abstract: "HI ÖZET Osmanlı Devleti' ndeki şer' i mahkemelerde hukuki bütün meseleler Hanefi mezhebi üzere halledilirdi. Aynı zamanda şehir ve kasabaların belediye işleri bugün ki noter gibi vekâletnameler, alım-satım muameleleri tanzimi de bunlara aitti. Hükümetin mahalli herhangi bir iş hakkında göndermiş olduğu fermanların infaz ve tatbiki de bu kadılar tarafından yapılmaktaydı. Elimizde çalıştığımız defter İstanbul Kadılığı 6 numaralı şer'iye sicilidir. Bu defterde hicrî 11 Cemaziye'1-ûlâ 1029 - 30 Cemaziye'l-ahire 1029 tarihleri arasında kayıtlar yer almaktadır. Çalışmamızda şer'iye defterinin transkripsiyonu yapılmış ve hüccetlerin özetleri çıkartılmıştır. Daha sonrada bunlara dayanılarak değerlendirme yapılmıştır. Defterimiz de İstanbul, Rumeli ve Anadolu Sancak ve kazalarına ait sosyal, ekonomik ve idari durumu gösterecek örnekler de mevcuttur. Arapça hüccetler orjinal haliyle konulmuştur. Bu defterde emlâk ve arazi alım-satımı, kiralanması, alacak-verecek davaları, cariye ile ilgili hükümler, vakıflara ait hükümler, evlenme boşanma, kefalet, ortaklık kurma, vekâlet, kısas, sulh vb konulara ait hükümler bulunmaktadır."
