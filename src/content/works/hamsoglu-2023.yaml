abstract: "Bu çalışma, affın sebeplerini ve hükümlerini belirlemenin yanı sıra, af kavramını açıklamayı ve vurgulamayı, fakihlerin mali işlemler bağlamında ibralarında af kavramı ile caizlik arasındaki karışıklığı gidermeyi amaçlamaktadır. Bu çalışma şu konuları ele aldı: (İslami sigorta, teminat mektupları ve banka havalesi işlemleri konularında). Çalışmada betimsel yaklaşım, karşılaştırmalı yaklaşım ve analitik yaklaşım arasında karma bir yaklaşım kullanılmıştır. Çalışma, af kavramının ve onun mubahlıkla olan ilişkisini, bazen seçme şansı olmadan mahcubiyetin ortadan kaldırılması anlamında, bazen de aslî mübahiyet anlamında ve her ikisi de ilahi af ve insan affı olarak bölünmesiyle sonuçlandırılmıştır. fıkıh dallarında fakihler arasında ihtilaf konusu olan hususlardır bunlar ve ve affın, affetme, uzlaşma, feragat ve beraat gibi çeşitli anlamları içerdiğini göstermiştir. Ayrıca Çalışma, riskin boyutu ve zamanı ile tazminat miktarının bilinmemesinin affedildiği İslami tekafül sigortası gibi pek çok detayında garar (aldatma) ve cehaletten yoksun olmayan çağdaş finansal işlemlerde affın önemini de göstermiştir. Çeşitli zararlar için banka teminat mektuplarının yanı sıra, garanti genişlemeye dayalı olduğu için, bir bağıştır ve kefil borçludur Çalışma ayrıca, ister karma fonlardan bağımsız İslami bankaların açılması, ister geleneksel şubelere bağlı İslami şubelerle işlem yapılması olsun, çeşitli bankacılık transfer işlemlerinde meydana gelen affın büyüklüğünü ve af açısından borçlu olunan borçlarda neler olduğunu da gösterdi. bankaya olan aidatlarda ve paranın zekatında yer alan af."
