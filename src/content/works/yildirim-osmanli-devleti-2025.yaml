abstract: "Bu tezde Osmanlı Devleti'nde İslam hukuku ve geleneksel normlara dayalı olarak uygulanan keşif ile Türkiye Cumhuriyeti Devleti'nde modern yöntemlerle uygulanan keşif müessesesi karşılaştırmalı bir bakış açısıyla ele alınmıştır. Keşif uygulamalarında her iki devletin hukuk sistemleri arasındaki farklılıkları ve benzerlikleri tespit etmek amaçlanmıştır. Ayrıca, ceza muhakemesine katkısı ile uygulama yöntemlerinin ortaya konulması hedeflenmiştir. Keşif müessesesinin Osmanlı Devleti'nden Türkiye Cumhuriyeti Devleti'ne geçiş sürecinde geçirdiği dönüşüm ile modern ceza muhakemesi sisteminde ne şekilde uygulandığı hakkında açıklamalar yapılmıştır. Bu çalışma, hukuk tarihine ve ceza muhakemesi hukukuna ilişkin literatür taraması, sicil belgelerinin incelenerek örnek uygulamalara yer verilmesi ve karşılaştırmalı analiz yöntemi ile hazırlanmıştır. Çalışma üç bölümden oluşmaktadır. İlk bölümde Osmanlı Devleti ceza muhakemesi hukukunda uygulanan keşfe dair yapılmış çalışmalar incelenmiş ve bu çalışmalardan faydalanılmıştır. Konunun ve uygulamaların daha iyi anlaşılabilmesi için sicillerden örnek uygulamalara yer verilmiştir. Sicillerden, 16., 17., 18. ve 19. yüzyıllarda başta İstanbul olmak üzere Konya, Harput, Amasya, Siirt, Trabzon, Urfa ve Kayseri'de ceza muhakemesine ilişkin keşfin gerçekleştirildiği tespit edilmiştir. Zaman ve mekân sınırlaması olmadan Osmanlı Devleti'nde uygulanan ceza muhakemesine ilişkin keşif örneklerine yer verilmiştir. İkinci bölümde ise Türkiye Cumhuriyeti Devleti'nde 01/06/2005 tarihinde yürürlüğe giren ve halen uygulanan 5237 sayılı Ceza Muhakemesi Kanunu'nda düzenlenen keşif müessesesine dair yapılan çalışmalar incelenmiş ve bu çalışmalardan yararlanılmıştır. Keşfin mevzuattaki yeri analiz edilmiş, Yargıtay kararları ile konunun daha iyi anlaşılması amaçlanmıştır. Üçüncü bölümde de her iki devletin ceza muhakemelerinde uygulanan keşif müessesesinin farklılıkları ve benzerlikleri karşılaştırmalı olarak analiz edilmiştir. Osmanlı Devleti ve Türkiye Cumhuriyeti Devleti ceza muhakemelerinde uygulanan keşif müessesesinin karşılaştırmalı olarak analizi ceza yargılamasının benzer ve farklı yönlerini anlayabilmek açısından büyük önem arz etmektedir. Çalışmayla bir kısım uygulamaların benzer nitelikte olduğu, bir kısım uygulamaların ise farklılıklar gösterdiği tespit edilmiştir. Bu çalışma, hem hukuk tarihi alanına katkı sağlayacak, hem de günümüz ceza muhakemesi hukukunda keşif uygulamalarının daha iyi anlaşılmasına yardımcı olacaktır. Osmanlı Devleti'nden Türkiye Cumhuriyeti Devleti'ne geçişte hukuki sürekliliği ve değişimi incelemesi açısından da ayrı bir öneme sahiptir."
