abstract: "Dini hassasiyeti yüksek insanların finans sisteminden uzak kalmaları nedeniyle bu kişilerin birikimleri atıl kalmıştır. Bu tasarrufların ekonomiye kazandırılması için faizsiz bankalar kurulmuştur. Dolayısıyla Faizsiz bankalar ticari bankalara alternatif değil tamamlayıcı rol üstlenmektedir.Faizsiz bankacılık ilk olarak 1963-1967 yılları arasında Mısır'da başlamıştır. 1971 yılında ilk faizsiz banka kurulmuştur.Türkiye'de faizsiz bankacılık kurulmasına ilişkin yasa 1983 yılında çıkmış ve ilk faizsiz banka özel finans kurumu adıyla 1985 yılında kurulmuştur.1999 yılında Katılım Bankaları'yla ilgili ilk düzenlemeler yapılarak Bankacılık Kanunu kapsamına alınmıştır. 2005 yılındaki düzenleme ile de isimleri Özel Finans Kurumu iken Katılım Bankası olarak değiştirilmiştir. Güvence Fonu da Tasarruf Mevduatı Sigorta Fonuna devredilmiştir.Katılım Bankalarının amaçları şöyledir, Dengeli Bir Finans Sistemi Kurmak: Sosyo- Ekonomik Hedeflere Ulaşmasını Kolaylaştırma Bankacılık Alanındaki Konumunu İlerletmek:Yeni Hizmetler Geliştirmek Toplumsal Hizmet ve DayanışmaKurulma nedenleri ise dini, sosyal ve ekonomik nedenlerdir.Katılım Bankalarının çalışma yöntemleri fon toplama ve kullandırma yöntemleridir. Fon toplama yöntemleri, özel cari hesaplar ve katılma hesaplarıdır. Fon kullandırma yöntemleri ise üretim desteği, kar zarar ortaklığı, leasing, faktoring, mal karşılığı vesaik alım satımıdır. Katılım Bankalarının 2006 yılı mali durumuna baktığımızda topladıkları fonların 11,237,284 TL, kullandırılan fonlarının 10,492,453 TL, aktif toplamının 13,729,720 TL, özkaynak toplamının 1,559,717 TL, net karının 391,041 TL , şube sayısının ise 355 olduğu görülmektedir. Bu değerler 2000'li yılların başlarına göre oldukça artış göstermiştir. Bu da fonların reel ekonomiye kazandırılması açısından oldukça önemlidir.Katılım Bankalarının çalışma prensiplerinden biri küçük mevduatları ekonomiye kazandırmaktır. Fon ihtiyacı olan insanlara fon sağladıkları için sermayenin tabana yayılmasına katkıda bulunurlar.Önceleri Katılım Bankaları daha çok küçük ve orta büyüklükteki işletmelere fon sağlamaktaydılar. Dolaysıyla gerekli şartları bünyelerinde taşımalarına rağmen borsadaki faaliyetleri açısından istenilen hedefe ulaşamamışlardı.Şuan da ise Türkiye Finans Katılım Bankası, Bizim Menkul Değerler aracı kurumu vasıtasıyla Dow Jones İslami Endeks Fonu ile sermaye piyasası işlemlerini yapabilmektedir."
