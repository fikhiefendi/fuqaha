abstract: "Gelişen teknoloji sonucu artan genetiği değiştirilmiş organizmalar, günümüz itibariyle hayatımızın büyük bir bölümünde yer almaktadır. Tükettiğimiz gıdalarda, kullandığımız ilaçlarda, giydiğimiz kıyafetlerde ve sayamayacağımız daha birçok alanda gen teknolojileri yoğun bir şekilde kullanılmaktadır. Özellikle artan nüfus ve buna paralel olarak artan gıda ihtiyaçlarının karşılanması adına ürünlerden kısa sürede daha çok verim alınması, raf ömrünün uzatılması gibi talep edilen yapısal niteliklerin istenilen seviyeye getirilmesi için ciddi çalışmalar yapılmaktadır. Ancak bu teknoloji, hâlihazırda yeni sayılabilecek bir teknoloji olduğundan, konuyla ilgi varsayımlar bireylerde birçok açıdan soru işaretlerine sebep olmaktadır. Bu konu İslâm dininin belirlemiş olduğu helâller ve haramlar çerçevesinde yaşamaya çalışan müslümanlar açısından da büyük önem taşımaktadır. Hayatımızda kaçınılmaz bir şekilde yer alan GDO'lara dair İslâmi açıdan genel ve kat'i bir hükme varılması zor olmakla birlikte kullanılan kaynak genlerin özellikleri, sağlığa dair etkileri, genetiğe müdahalenin fıtrata müdahale ile ilişkisi, istihâleye uğrama durumu, maslahatla ilişkisi açısından değerlendirilmelidir."
