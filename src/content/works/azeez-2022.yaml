abstract: "Bu tezin amacı imam Ebû Bekir Alâuddîn es-Semerkandî'nin Mizânü'l-usûl fî netâici'l-ukûl isimli eserinden hareketle fıkıh anlayışını ortaya koyup, fıkıh ve akâidle ilgili konulardaki görüşlerini tespit etmektir. Araştırma, Semerkandî'nin Usul ve furu konularındaki derin anlayışı ve fıkıh bilgisinin örneği olarak eserin birinci cildiyle sınırlandırılmıştır. Müellifin yaşadığı dönem, şahsi ve ilmi hayatı yazılırken betimleyici tarihsel metot kullanılmıştır. Semerkandî'nin eserindeki konuyla ilgili meselelerin bir araya getirilmesi, açıklanıp, yorumlanması, alimlerin görüşlerinin kıyaslanması, taassuptan uzak bir şekilde delile uygun görüşün tercih edilmesinde analitik tümevarım yöntemi tercih edilmiştir. Araştırmada ulaşılan neticelerden en önemlileri şunlardır: Semerkandî Hanefî olup, mezhebe hem usul hem de furu fıkıh konularında katkıları olmuştur. Hanefi mezhebine büyük hizmetleri olan birçok âlim yetiştirmiştir. Mîzânu'l- usûl isimli eserinde şer'î hükümleri istinbât ederken kitap, sünnet icmâ, kıyas gibi asli; örf, sahâbe kavlî gibi tebeî delillere dayanmıştır. Fıkhi görüşlerinin derinliği ve istinbât kuvvetine delalet eden görüşleri vardır. Zira müellif, furu fıkıh konularını usul ile irtibatlandırmıştır. Eser Semerkandî'nin içtihad ve fıkıh konularında istinbât etmenin şartlarından olan ihtilaflı konulardaki maharetine delalet eder. Muhaliflerle tartışırken kullandığı usul, delalet yönünü de açıklayacak şekilde sarih delilleri zikretmesi eseri diğer kitaplardan ayıran en önemli vasıflardandır. Müellif sadece Hanefîlerin görüşlerini vermekle yetinmemiş, başta Şâfiî olmak üzere diğer mezheplerin görüşlerini de vermiştir. Görüşler arasındaki tercihini delile göre yapmıştır. Akaid konularını Eş'arî ve Mâtürîdîlerin görüşleri delil getirerek açıklamıştır. Zaman zaman Ehl-i sünnete muhalif Mutezile ve diğer mezheplerin görüşlerine de değinmiştir. Müellifin kaynaklarının çeşitliliği, farklı fıkıh konularını çok geniş ve ayrıntılı bir şekilde tartışabilmesi, geniş bilgi birikimi ve ilmi yeterliliğine delalet eder. Aynı konuyla ilgili farklı görüşleri vermesi mezhep taassubunun olmadığını ve fetva konusundaki takvasını gösterir. Bütün bunlar onun zati hayatında tespit edilen hususlardır."
