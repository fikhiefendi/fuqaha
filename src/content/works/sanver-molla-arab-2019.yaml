abstract: "Bu çalışmada Molla Arab (ö. 901/1496)'ın şeyhülislamlık döneminde verdiği fetvaların derlenmesiyle ortaya çıkan fetva mecmuası tarihi bir metin olarak ele alınıp incelenmiştir. Bu mecmua şu ana kadar tespit edilen Osmanlı şeyhülislam fetva mecmuaları içerisinde en erken tarihli mecmua olma özelliğine sahiptir. Fetvanın unsurları, dili vb. biçimsel özellikleriyle XVI. yüzyıldan itibaren derlenen mecmualardan ayrılan bu mecmua Osmanlı fetva bürokrasisinin sistemli hale gelmeden önceki dönemini göstermektedir. Bu özelliğinden dolayı Molla Arab mecmuası fetva mecmuaları esas alındığında geçiş dönemi eseri olarak da nitelendirilebilir. Mecmuanın Osmanlıca-Arapça şeklinde iki dilli olması, fetvaların formu, cevapların uzunluğu ve konu başlıklarının sistemli bir şekilde verilmemesi geçiş döneminin izlerini yansıtan örneklerdir. Birincil kaynak üzerinden yapılan bu çalışmada mecmuanın Süleymaniye nüshası esas alınarak tamamı incelenmiştir. Molla Arab'ın hayatı, mecmuanın biçimsel özellikleri, fetvaların içeriği ve mecmuanın şahsiyeti bu çalışmanın ana bölümleridir. Mecmuanın şahsiyetini ortaya koyarken fetvalardaki tarihi figürler, mekan kullanımı, sosyal olaylar, ailevî mes'eleler ve iktisadî ilişkiler dikkate alınmıştır. Bu başlıklar altında verilen fetvaların mes'eleleri ve içerisindeki kavramlar yorumlanarak okuyucuya sunulmuştur. Bu çalışma neticesinde Osmanlı fetvası ve Osmanlı şeyhülislam mecmualarının XV. yüzyıldaki örneğini görmek mümkün olmuştur."
