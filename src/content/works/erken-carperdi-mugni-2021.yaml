abstract: "Yaşadığı hicri VI. Asra damgasını vuran Zemahşerî, Tefsîr ve Arap dili belagatında yazdığı eserlerle bu alanlardaki hâkimiyetini kanıtlamış bir İslam âlimidir. Özellikle nahiv ilminde yazdığı Mufaṣṣal ve Enmûzec adlı eserleri büyük bir kabul görmüş ve kendisinden sonra yazılan nahiv eserlerini oldukça etkilemişlerdir. Zemahşerî nahiv ilmine yeni başlayanlar için yazdığı Enmûzec'te nahvin kurallarını özetlemiş ve bu kuralları kısa örneklerle pekiştirmiştir. Eserinde herhangi bir tartışmaya yer vermeyen Zemahşerî, nahvi kaidelerin çoğunu Basra ekolüne göre belirlemiştir. Eserini, isim, fiil ve harf olmak üzere üç ana bölümde ele almıştır. Enmûzec, kısa ve öz ifadeleriyle nahiv âlimlerinin özen gösterdiği önemli bir eser olmuş ve üzerine yazılan şerhlerle günümüze kadar medreselerde okutulmuştur. Enmûzec, yazıldığı metod açısından da sonradan yazılan eserlere örnek teşkil etmiştir. Enmûzec'in metodunda yazılan eserlerden biri şüphesiz Çarperdî'nin Muğnî adlı eseridir. Ancak Muğnî hakkında yaptığımız araştırmada Muğnî'nin, Enmûzec'e bir şerh niteliğinde olduğunu, değiştirilen bazı ibareler, ek açıklamalar ve örneklerin dışında herhangi bir fark olmadığını tesbit ettik. Bu çalışmayla, söz konusu iki eser arasındaki muhteva ve metodolojik farklılıklar ve benzerlikler analiz edilmiştir."
