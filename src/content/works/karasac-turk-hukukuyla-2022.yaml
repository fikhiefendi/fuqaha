abstract: "Zorunlu geçit hakkı, kamu yoluna yeterli bağlantısı bulunmayan taşınmaz malikinin, taşınmazının kamu yoluna bağlanması için komşu taşınmaz malikine tazminat ödemek koşulu ile kendisine geçit sağlanmasını talep etme hakkı veren zorunlu bir haktır. Geçit ihtiyacı içinde olan taşınmaz maliki ile komşu taşınmaz malikinin anlaşarak ihtiyaç içinde olan taşınmaza geçit verilmesi, geçit sağlanmasının en doğal yoludur. Ancak tarafların anlaşarak bu hakkı kurması her zaman mümkün değildir. Yaşadığımız çağda kapitalizmin de etkisiyle mülkiyet hakkı günbegün önemini artırmaktadır. Bu nedenle kişilerin en çok değer verdiği haklardan olan mülkiyet hakkına yapılacak müdahalelerin titizlikle yapılması gerekmektedir. Bu noktada hukuk düzenlerinde de bir tarafın mülkiyet hakkını etkin bir şekilde kullanması sağlanırken, diğer tarafın mülkiyet hakkına müdahale etmeyi zorunlu kılan düzenlemeler yapılmaktadır. Çalışmada, KKTC Hukukunda zorunlu geçit hakkının; hukuki niteliği, kuruluşu, koşulları, taraflara getirdiği hak ve yükümlülükler ile sona ermesi Türk Hukuku ile karşılaştırmalı olarak incelenecektir."
