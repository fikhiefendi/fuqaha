abstract: "Oryantalizm, çok anlamlı bir olguyu ifade eden bir zihin dünyasına tekabül ettiği için, onun tek bir kavramsal ve anlamsal çerçevede sunulabilmesi oldukça zordur. Bu çalışmada biz, oryantalizmin niteliklerinden ve daha önce de ifade edilmiş anlamlarından hareketle onun ?ne? olduğunu ortaya koymaya çalıştık. Oryantalizmin bu çok yönlü özelliğinin yansıması olarak kimisi onu ?Bilimsel bir faaliyet? olarak nitelemiş; başkası ?ideolojidir? demiş; bir başkası da, özellikle 19. yy'dan sonra belirginleşen bir özelliği olan ?sömürgeciliğin bir aracı? olarak tanımlayabilmiştir. Kuşkusuz bu tanımlamaların her birinin gerçeklik tarafı vardır; ancak yukarda da ifade edildiği gibi oryantalizmin belirli bir kavramsal çerçeve içersinde sunulup anlamlandırılması onun eksik değerlendirilmesine yol açacaktır. Batı'da İslâm'a dair yapılan çalışmaların sadece İslâm hukukunu ilgilendiren kısmı bile dikkate şayan ciddi bir yekûna ulaşmıştır. Bu birikimin gün geçtikçe katlanarak artması gerçeği karşısında bu yapıyı önemseyip özümsemenin zorunluluğu da kendiliğinden ortaya çıkmaktadır. Bu yapının bir parçası yahut da bir düşünürün bu yapı içersindeki yeri, bütünle ilişkisi koparılarak ele alındığında, yapılmış olan değerlendirme, bütüncül bir değerlendirme sayılmaz. Herhangi bir konu veya şahsı inceleme konusu yapan kişinin somut mesele etrafında üretilmiş literatürü göz önünde bulundurması ve tartışma ortamına nüfuz etmesi gerekmektedir. Biz de bu çalışmamızda bu metodolojik yöntemi takip ederek oryantalizm ve onun İslam hukuk yorumunu Joseph Schacht özelinde ele aldık."
