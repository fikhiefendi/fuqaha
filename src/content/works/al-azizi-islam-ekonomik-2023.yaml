abstract: "Ekonomi ve finans bilimi, insanlık tarihi boyunca medeniyetlerde ve kültürde çok önemli bir yere sahip olmuştur; toplumların gelişimi, duraklaması ve çöküşü, ekonomi ve finans bilgisinin ve pratiğinin öneminin göz ardı edilemez. Zira birçok uluslararası veya iç savaşın nedenlerinden biri olarak da ekonomi ve finans gösterilmektedir. Farklı coğrafyalarda farklı ekonomik sistemlerin benimsenmesi ve bu deneme-yanılma süreciyle toplumların şekillenmesi, hem ekonomi ve finans bilimini hem de sosyoloji ve tarih alanlarını etkilemiştir. Dünya ve insanlık tarihinde, insanı ilgilendiren her alan ve bilim birbirleriyle ilişkilidir. Bu bağlamda, ekonomiyi etkileyen bir diğer alan ise teoloji olarak gösterilebilir. Her din ve öğreti, büyük veya küçük ölçekte olsun, etkili olduğu toplumlarda ekonomi ve finansı şekillendirmiştir. Türk ve Ortadoğu toplumları incelendiğinde, yaygın ve baskın olan İslam dininin ekonomik sistemini nasıl etkilediği de önemlidir. Bu araştırma, İslami ekonomik sistemi ve onun etkinliği etrafında dönmektedir. Araştırma içerisinde dünyaca tanınan dört küresel ekonomik sistem açıklanmış, bu sistemler İslami ekonomik sistemle karşılaştırılmış ve İslami bakış açısı genel olarak sunulmuştur. Araştırmada, İslami sistemde yasaklanan yöntemler ve nedenleri, İslam ekonomisinin prensipleri ve İslami finansman yöntemleri anlatılmıştır; ayrıca birçok ortaklık türünden bahsedilmiş ve avantajları tartışılmıştır. Küresel ekonomik kriz, İslam ekonomisi perspektifinden ele alınmıştır. Bu finansal krize çözüm olarak Batı medeniyetlerinin İslami çözümleri benimsemeye yönelmeleri ve mevcut tefecilik sistemini kınamaları, tüm ekonomik faaliyetlerin trajik sonuçları ve nedenleri üzerinde durulmuştur. Bu bağlamda, İslami ekonomik sistemin araçları, rüşvetleri, İslami sistemdeki sözleşmeleri ve ekonomik mühendisliği yasaklayarak bu küresel krizi nasıl önleyebileceği de tartışılmıştır. İslami ekonomik sistem, birçok Müslüman toplumda ekonomik sorunların çözümünde bir rol oynayabilir. Bu sistem, İslam'ın temel prensiplerine dayanır ve insanların adalet, eşitlik, sosyal refah ve ahlaki değerlere dayalı bir ekonomiye sahip olmasını hedefler. Mevcut ekonomik krizlerin çözümünde İslami ekonomik sistemin rolü şu şekillerde olabilir: Faizsiz Finans, Risk Paylaşımı, Sosyal Adalet, Etik Değerler, Reel Ekonomi"
