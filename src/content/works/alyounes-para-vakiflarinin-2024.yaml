abstract: "Vakıf, İslâm dinine has özelliklerden biri sayılmaktadır. İbadet, eğitim, terbiye, sağlık ve benzeri kurumların vakıf çatısı altında işletilmesi ile bu kurumların giderlerini de karşılayacak mekanizmalar kurması bakımından müslümanların hayatında büyük bir öneme sahip olmuştur. Osmanlılar, vakıf anlayışının gelişmesinde özel bir yere sahip bulunmaktadır. Bu yüzden Osmanlı Medeniyeti,“Vakıf Medeniyeti”olarak adlandırılmıştır. Özellikle para vakıflarına işlerlik kazandırılması Osmanlı iktisâdî ve sosyal sisteminin gelişmesinde büyük öneme sahiptir. Bir takım teberru şekilleri geçici olup faydaları onların tüketilmesiyle sona ererken, para vakıflarının faydası devamlılık arz etmiştir. Genel olarak vakıflar tek bir toplumsal veya hizmet alanını gözetirken, para vakıfları çeşitli şekilleriyle aynı anda çeşitli alanları gözetmiştir. Faydası sadece vakfedilen şeyle sınırlı kalmayıp bir bütün olarak toplumu ve vakıf kurumunu kapsayacak şekilde çeşitlidir. Ancak şer'î ve kanunî engeller, bu tür vakıfların işleyişinde bazı aksamalara sebep olmuştur. Günümüzde de meselenin özellikle hukukî yönden bir açıklığa kavuşturulamamış olması para vakıflarını kaybolma ve yok olma tehlikesiyle karşı karşıya getirmiştir. İslâm tarihi boyunca para vakıflarının şekilleri ve biçimleri, bazen örfün gereklerine ve bazen de insanların teamülüne ve çağdaş ihtiyaçlarına bağlı olarak gelişmiştir. Bu çalışma, para vakıflarının ortaya çıktığı ilk dönemden itibaren gelişimini incelemektedir. İlk olarak, mezhep fakihlerinin farazî sorulara verdikleri cevaplar şeklinde ortaya çıkan para vakıfları, zamanla yeni şartlar, şekiller ve amaçlar kazanmıştır. Çağın ihtiyaç ve zorunlulukları, para vakıflarını ilmî bir gerçeklik olarak kabul ettirmiştir. Bu yeni durum, Osmanlılar döneminde ülke sınırlarının genişlemesiyle birlikte hem maslahatın hem de örfün para vakıflarını uygulamayı gerektirmesinden sonra ortaya çıkmıştır. Osmanlı para vakıfları da ele alınarak vakfedenlerin amaçları, toplumun ve çağın ihtiyaçlarına göre para vakıflarının amaçlarına dikkat çekilmiştir. Ayrıca çalışma, para vakıflarının şekillerini, Osmanlı vakıflarındaki yenilenme noktalarını ve o dönemde Osmanlı Devleti'ne bağlı, içerisinde Arap coğrafyalarının da bulunduğu muhtelif beldelerde yayıldığı yerleri incelemiştir. Yine Osmanlı Devleti sonrasındaki para vakıflarını etkileyen gelişmelere de yer verilmiştir. Para vakıflarının mahiyetine uygun olarak risklerin azaltılması, idare şekil ve yöntemleri, yeniden canlanmaları ve faydalarının artırılması amacıyla modern idarî uygulamaların etkinleştirilmesine değinilmiştir. Ele alınan tüm konulara ilişkin uygulamalı örnekler verilerek meselenin hem teorik hem de pratik yönüne dikkat çekilmiştir. Bu tür vakıfların Araplar'ın ağırlıkta bulunduğu bölgelerde, özellikle Filistin coğrafyası'nda yayılmasına yol açan en önemli sebepler açıklanmıştır. Tüm bunların yanı sıra, sermayeden veya kâr getirisinden yararlanan, yani kendilerine vakfedilen taraflar da göz ardı edilmemiştir."
