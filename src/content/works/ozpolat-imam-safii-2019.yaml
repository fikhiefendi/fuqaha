abstract: "Özgürlük kavramı genel olarak tarih boyunca farklılaşmış, aynı şekilde İslam Tarihi boyunca olduğu gibi günümüz İslam dünyasında da. Kadına biçilen roller değişmiştir. Dünyada ve ülkemizde çok popüler hareket olan feminist hareketlerin değişen kadın algısı üzerinde etkisi olmuştur. İslam mezheplerine göre insan özgürlüğü ve insan özgürlüğü ile ilgili kavramlara yüklenen anlamlar farklılaşabilmiştir. Bu durum insan özgürlüğü açısından temel yaklaşımları etkilemiştir İmam-ı Şâfiî'nin düşünce dünyasında kadın özgürlüğü ve kadının konumuna dair düşüncesinin, kendi içinde yaşadığı toplumun örf adetlerinden etkilendiğini söylemek mümkündür. Ancak bunun kadınla ilgili İslam'ın yegâne yorumu gibi değerlendirilmemesi gerekir."
