abstract: "Bu araştırmada, fıkıh usulü yazma geleneklerinden mütekellim usul yöntemine göre eserlerini kaleme alan usulcülerin, fıkıh usulünün en önemli meselelerinden ictihad ve müctehid kavramları ile bunlarla bağlantılı konular etrafında geliştirdikleri teorik izah ve yaklaşımları ele alınmıştır. Mütekellim usulcüler ictihadı farklı şekillerde tarif etmişlerse de ortak noktalarını, ictihadın hakkında kat'î nass bulunmayan şer'î meseleler üzerinde olduğu, bu meseleler üzerinde ictihad faaliyetini yerine getirecek kişinin ictihad ettiğini söyleyebilmek için olanca gücünü harcaması gerektiği ve elde edilen bilginin zannîlik ifade ettiği algısı oluşturmaktadır. İctihadla benzer anlamları ifade etmek için kullanılan re'y, istidlâl, kıyas, istinbât ve tahrîc kelimelerinin ictihad kavramıyla yakından ilişkisi bulunmaktaysa da ictihadla karşılaştırıldıklarında ictihadın daha geniş, diğerlerinin ictihada göre daha dar çerçevede kaldığı görülmektedir. İctihad mekanizmasının süjesi müctehidin tanımına mütekellim usulcülerin bir kısmı değinmiş diğer bir kısmı değinmemişse de onlar bazen müctehid bazen de müftî olarak ifade ettikleri ictihad faaliyetini yerine getirecek kişinin belli vasıflara sahip olması gerektiğini belirtmişlerdir. Mütekellim usul eserlerinde sistematik bir şekilde müctehidleri sınıflandıran ifadelere rastlanılmamaktaysa da ictihad ehliyetini elde edebilmesi için müctehidde bulunması gerekli şartları belirttikten sonra bazı mütekellim usulcülerin bu sıfatların mutlak müctehid için geçerli olduğu ifadelerinden anlaşılacağı üzere kayıtlara geçmese de zihinlerinde müctehidlerin tabakalara ayrıldığı söylenebilir. Hakkında kat'î nass bulunmayan şer'î meseleler üzerinde ictihad faaliyetinde bulunulabileceğini ifade eden mütekellim usulcüler, aynı usul geleneği içinde yer almalarına rağmen ictihad neticesinde elde edilen hükümde isabet ya da hata edildiğini gösteren bir kriterin varlığı ya da yokluğu noktasındaki anlayışları sebebiyle ictihadın sonucu bakımından musavvibe ve muhattie olmak üzere birbirine zıt iki farklı yaklaşım sergilemişlerdir. İctihad mekanizmasının zayıflamasıyla ortaya çıkan problemlerin tartışılması ve gereğince tavır alınması zorunluluğu neticesinde ictihadın tecezzisi, tekrarı, başka bir ictihadla bozulup bozulamayacağı, müctehidin başka bir müctehidi taklidi, zamanın müctehidsiz kalması ve ictihad kapısının kapanmışlığı gibi meseleler üzerinde fikir beyan eden mütekellim usulcüler bu konuları genellikle İslâm hukukunun donuklaşmaması, gelişen toplumsal hayatın ortaya çıkan yeni problemlerinin çözülmesi, hükümlerin her dönem ve toplumda uygulanabilmesi için çözüm getirme çabası içinde değerlendirmişlerdir."
