abstract: "Fıkıh (İlmihal) ilmi, İslam'ın en önemli temel ilimlerinden biridir; hatta günlük hayattaki önemi düşünüldüğünde, en önemli ilimlerden biri olduğunu söylemek abartı olmayabilir. Fıkıh, hayatın her anına nüfuz ettiği ve sürekli değişen durumlara çözüm ürettiği için büyük bir öneme sahiptir. İslam dini, hayatın hiçbir alanını hükümsüz bırakmamış, her konuda doğrudan veya dolaylı olarak kurallar ve düzenlemeler getirmiştir. Tarih boyunca, her biri farklı özelliklere sahip birçok Fıkıh medresesi kurulmuştur. Bu medreselerden ilki ve en önemlilerinden biri, İmam-ı Azam Ebu Hanife'nin kurduğu medresedir. Bu medrese, seçkin fakihlerin bir araya gelerek hem mevcut hem de henüz ortaya çıkmamış meseleleri tartışmasıyla öne çıkmıştır. Bu özelliği, medreseye diğer fıkıh medreselerinden daha fazla değer kazandırmış ve fıkhi meseleler açısından zenginleştirmiştir. Fıkıh alanında yazılan eserlerin en önemlilerinden biri de fetva kitaplarıdır. Bu kitaplar, birçok meseleyi ve ayrıntıyı içerdikleri için büyük önem taşımaktadır. Bu nedenle, bu mübarek ilme hizmet etmek amacıyla bu kitap seçilmiştir. Kitap, ne çok eski ne de çok yeni sayılır; yakın çağda telif edilmiş olmasına rağmen, önceki dönemlere ait sağlam bilgilere dayanmaktadır. İmam Bezzazi'nin eseri ve İmam Remli'nin geniş ve zengin yorumlarıyla birleşince çok iyi bir kaynak ortaya çıkmıştır. Bu araştırma, İmam Remli'nin“En-Nüketü'l-i'Caziyye Ala'l-Fetava'l-Bezzaziyye”adlı eserini tanıtmayı amaçlamaktadır. Araştırma, iki bölüme ayrılmıştır: Birinci bölüm üç kısımdan oluşmaktadır: 1. Kısım: Genel araştırma, yöntem ve benzeri konuları içermektedir. 2. Kısım: Asıl eser olan“Fetava-bezzaziyye”nin genel tanıtımını yapmaktadır. 3. Kısım: Tahkik edilen eser olan“En-Nüketü'l-i'Caziyye”nin genel tanıtımını yapmaktadır. İkinci bölüm (Tahkik Bölümü) de üç kısımdan oluşmaktadır: 1. Kısım: Eserin üç nüshasının özelliklerini/tanıtımını yapmaktadır. 2. Kısım: Nüshaların örnek fotoğraflarını (ilk ve son sayfaları) içermektedir. 3. Kısım: Tahkik edilen metni (Ennes) sunmaktadır."
