abstract: "İslam Dünyasında Ehl-i Sünnet'ten sonra en çok mensubu bulunan Şia'nın çoğunluğunu İmâmiyye Şîası teşkil eder. İmâmiyye Şiası'nın en ayırt edici vasfı ise imâmeti inanç esasları (usûlu'd-din) içerisinde telakki etmesidir. İmâmet anlayışının temeli, Hz. Peygamber'in vefatın-dan sonra başlayan imâmet/hilafet tartışmalarına dayandırılmaktadır. Ehl-i Sünnet sırasıyla Hz. Ebû Bekir, Hz. Ömer, Hz. Osman ve Hz. Ali'yi meşru halife kabul ederken, İmâmiyye, Hz. Ali, Hasan, Hüseyin ve Hz. Hüseyin soyundan dokuz kişinin nas ve tayinle meşru halife/imam oldu-ğuna ve imâmetin kıyamete kadar bu soydan devam edeceğine inanmaktadır. Şîî düşüncede İmâmet meselesi zaman içerisinde yorumlanarak farklı boyutlar kazanmıştır. Özellikle Gaybet-i kübra (büyük gizlilik) döneminde imamın görevleri ve imama ait yetkilerin kullanımı konusunda değişik yaklaşımlar sergilenmiştir. İmâmet teorisine dayalı olarak geliştirilen velâyet-i fakih kav-ramı ve bu kavram çerçevesindeki tartışmalar 1979 İran İslam Devrimi ile birlikte daha da hız kazanmıştır. Bazı âlimler siyasi ıslahat ve devlet yönetimini de fakihin yetkisi dahilinde görür-ken, bazıları aktif siyasetin dışında kalarak velâyet-i fakihin siyasi alana kaydırılmasının dini temelden yoksun olduğunu belirtmişlerdir. Geleneksel Şîî düşünceden beslenen İran (Kum) ve Irak (Necef) merkezli bu tartışmalar halen güncelliğini korumaktadır. İran merkezli tartışmaların odağındaki isim Ayetullah Humeyni ve fikirleri hakkında çok sayıda araştırma yapılmış olmasına karşın, Irak merkezli tartışmaların son dönemdeki en büyük ismi Ayetullah Hûî ve düşünceleri konusunda aynı şeyi söyleyebilmek güçtür. Araştırmamızda Ayetullah Hûî'nin, hayatı eserleri, talebeleri, vakıf hizmetleri, fikirleri ve özellikle imâmet nazariyesine dayalı olarak on ikinci İma-mın büyük gaybeti/gizliliği döneminde İmamın yetkilerine ilişkin tasarruf bağlamında geliştirilen velâyet-i fakih konusundaki görüşleri incelenecektir."
