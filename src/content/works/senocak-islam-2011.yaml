abstract: "Bütün hukuk sitemlerinde birinci ya da ikinci derecede kaynak kabul edilen örfün hukukî süreçte üstlendiği rol fevkalade önemlidir. Çağımızda hızlı bir şekilde gerçekleşen toplumsal, siyasal, kültürel ve iktisadî değişim ve buna bağlı olarak yaşanan yeniden yapılanma bu önemi daha da artırmaktadır.Örfün hukukî konumunun doğru bir şekilde belirlenmesi, hukukçuya tanınan yorum alanının sınırlarının bilinmesi açısından önemlidir. Zira hukukçu, klasik metinlerde yer alan örfî hükümleri yorumlamada ve değişen olgu ve olaylara paralel olarak hükümleri yenilemede örfe müracaat etmektedir.İslam hukukunda ilk olarak furû-ı fıkıh kitaplarında (doğrudan hükümleri içeren eserler) yer alan örfün zamanla fıkıh usûlünün (İslam hukuk metodolojisi) ilgi alanına da girmesi İslam hukukunda hukukî bir asla dayanarak hüküm çıkarmada örfe sürekli olarak başvurulduğunu göstermektedir.Hem furû-ı fıkıh hem de usûl kaynaklarında önemli bir yere sahip olan örfü konu edinen ve onu, sorun çözecek bir konumda tekrar incelemeyi hedefleyen bu çalışma bir giriş ve üç bölümden oluşmaktadır. Birinci bölümde örf ve âdetin kavramsal boyutu, ilgili kavramlarla mukayese edilerek verilmiş, ayrıca örfün İslam hukuku yanında diğer hukuk sistemlerindeki yeri de araştırılmıştır. Bu bölümde örfün sahih olabilmesi için onda yer alması gereken şartlar da değerlendirilmiştir. İkinci bölümde örf-nass ilişkisi tarihselci ve geleneksel yönteme göre incelenmiş, ilgili yöntemlerin ilke ve esasları tespit edilip değerlendirilmiştir. Yine bu bölümde vahyin Cahiliyye âdetleri ile ilişkisi de incelenmiş, bu yolla nassın varlığı karşısında örfün ne anlam ifade ettiğini anlamak hedeflenmiştir. Üçüncü bölümde ise hükümlerin oluşması ve değişmesinde örfün rolü tespit edilmeye çalışılmıştır.Anahtar Kelimler: Örf, âdet, nass, hüküm, İslam hukuku"
