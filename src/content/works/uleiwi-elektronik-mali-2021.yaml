abstract: "ÖZET Elektronik Malı İşlemlerde Tahkıkül-Menatın Etkisi- (Teorik Ve Uygulamalı Bır Çalışma) Hasan Husseın ALULEIWI Doktora, İslam İktisadı Ve Hukuku Tez Danışmanı: Prof. Dr. Osama ALHAMWI Ocak- 2021-XIX + 238 sayfa Bu araştırma; Elektronik finansal işlemlerde, tahkîku'l-menâtın etkisini içeren, uygulamalı kökensel bir çalışmadır. Tahkîku'l-menât, illeti tesbit yollarının ilki sayılır. Pek çok müctehid çağdaş meseleler, nevâzil, finansal aktüalite ve pratiklerinde şer'î hüküm çıkarırken buna dayanır.Bu yöntemin önemi, kıyamet gününe kadar eskimeyecek olmasındadır. Nedeni ise; mefhumlar ile ıstılahlardaki dâimî yenilenme ve kökensel değişikliklerin gerektirdiği acil çözüm ihtiyacıdır. Böylelikle tahkîku'l-menât, ictihad için elzem bir yöntem haline gelir, her fakih ve müctehid, uygun bir alternatif üretmek, şeriatın geçerliliğini ve uyum esnekliğini özelde müslümanlara genelde tüm dünyaya isbat için tahkîku'l-menâtı kullanır. Çalışmamız; ictihadın tarifi, önemi, Hz. Peygamber (s.a.v) dönemindeki durumu, tahkîku'l-menât ile ilişkisi, tahkîku'l-menâtın illeti tesbit yöntemlerinin ilki olması hasebiyle“illetin”tarifi, konuya dahil olduğu için usulcülerin illete, illeti tesbite ve tahkîku'l-menâta dair görüşlerinin özeti ve çeşitleri ile başlar. Sonra, bu ıstılahın usuldeki tarifi ve ilişki içinde olduğu tenkîhu'l-menât, tahrîcu'l-menât, genel ictihad, tenzîlîictihad, makâsıdu'ş-şerîa, kıyas, istihsan, sedd-i zerâi', maslahat, örf, çözüme ulaşan meseleler, nevâzili çözmede fayda sağlayan tahrîcler, şerîat-ı garrâya mugayir olmayan yenilikler, kolaylaştırma ve zararı defetme ilkesinin izahı ile devam eder. Akabinde, Gazâlî ve onun gibi usul âlimlerinin ele aldığı tahkîku'l-menâtın illeti tesbit yöntemini, örneklerinin nerelerde bulunduğunu, dinî referansını, kaynağını, önemini, keyfiyetini ve uygulamada ulemânın zikrettiği kuralları beyan eder. Son olarak, bu mühim usulî ıstılahın Elektronik finansal işlemlerdeki yani sanal para. Anahtar kelimeleri: tahkîku'l-menâtın, Sanal para birimleri, elektronik banka cılık, elektronik ticaret."
