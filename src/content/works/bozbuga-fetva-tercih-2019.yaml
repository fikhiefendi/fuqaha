abstract: "Bu tez, XV ve XVI. yüzyıl Halvetî tarikatı Sünbüliyye kolunun kurucusu Sünbül Sinan Efendi'nin Risâle-i Tahkîkiyye adlı eserinin fetvâ usûlü açısından değerlendirilmesi amacıyla hazırlanmıştır. Çalışmamız giriş ve üç bölümden oluşmaktadır. Giriş bölümünde tezin konusu, önemi, amacı, hipotezi ve kaynaklara ait bilgiler yer almaktadır. Birinci bölümünde Sünbül Sinan'ın hayatı detaylı bir şekilde kaleme alınmış ve eserleri tanıtılmıştır. Eserler tanıtılırken kaynaklarda rastlayamadığımız Sünbül Sinan'ın vasiyetnâmesi de çalışmamızda zikredilmiştir. İkinci bölümde, Risâle-i Tahkîkiyye metninin tercümesi yapılmış, metinde geçen ayet numaraları belirtilirken hadislerin tahrîci de yapılmıştır. Akabinde Risâle-i Tahkîkiyye'de tasavvufî konulardaki açıklamalar tasnife tabi tutulmuştur. Son olarak üçüncü bölümde, Sünbül Sinan'ın Hanefî mezhebi fetvâ usûlünde tercih metotları ve tabakâtu'l-fukahâya yer verilmiştir. Sünbül Sinan'ın eseri de bu metot bağlamda değerlendirilerek incelenmiştir."
