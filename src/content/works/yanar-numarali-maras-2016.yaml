abstract: "Osmanlı Devleti'nde hükümdarın, adaletle yönetme idesinin merkezinde olması ve aynı zamanda siyasi egemenliği bütünüyle elinde tutması, hukuki pratiklerde belirleyici ve yönlendirici unsur olmuştur. Hükümdarı, bu paradigma temelinde mutlak siyasi otorite olarak gören teamül, herhangi bir ayrım gözetmeksizin toplumun her kesiminden şikâyetlerin devletin en yüksek idari ve adli karar organı olan Divan-ı Hümayun'a ulaşmasına imkân tanımıştır. Divan-ı Hümayun'a intikal eden meselelerin, burada görüşülüp karara bağlandıktan sonra, alınan kararların birer suretlerinin kayıt altına alınması anlayışına bağlı olarak süreç içerisinde Mühimme defterleri, Şikâyet defterleri, Name-i Hümayun defterleri, Ahkâm defterleri vs. defter serileri tutulmaya başlanmıştır. Bu defterlerden eyaletlere göre tanzim edilen Ahkâm defterleri, on yedi bölge esas alınarak tertip edilmişlerdir. Mora Ahkâm defteri (1716) haricinde defterlerin başlangıç tarihi 1742 yılı olup, defterlerin bir kısmı II. Meşrutiyet dönemine kadar varlığını sürdürmüştür. Belirtilen defterler arasında Maraş Ahkâm defterleri olarak 1155/1294-1742/1877 yılları arasını kapsayan toplam 6 defter bulunurken, söz konusu defterlerden I numaralı Maraş Ahkâm defteri, 1155/1164-1742/1751 tarihleri arasında Maraş eyaletine bağlı Malatya, Ayıntab (Antep), Kasr-ı Zülkadriye (Kadirli)'nin yanı sıra çalışma konumuzu teşkil eden Hısn-ı Mansur, Behisni, Kâhta, Gerger, Samsad gibi idari birimlere gönderilen hükümleri ihtiva etmektedir. Çalışmada tespit edilen toplam hüküm sayısı 203 olup, en çok hükmün gönderildiği idari birim 147 hükümle Hısn-ı Mansur'dur. İlgili hükümlerin şikâyet konuları ise asayiş problemleri şeklinde izah edebileceğimiz eşkıyalık ve gasp gibi meseleler, mali ve tarım politikalarına(tımar, mukataa, iltizam, malikâne) dair meseleler, vakıf müessesine ilişkin meseleler, miras meseleleri ve son olarak muhtelif meseleler şeklinde tasnif edilmiştir. Söz konusu hüküm muhtevalarının ilgili bölgenin sosyo-ekonomik ve kültürel yapısına dair önemli veriler sunmasının yanı sıra devletin idari ve adli yapısına ışık tutması, deftere pek çok araştırma sahası için önemli bir kaynak hüviyeti kazandırmaktadır."
