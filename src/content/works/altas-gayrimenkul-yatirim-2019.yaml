abstract: "Helal yolla biriktirilen tasarrufların atıl bırakılmadan piyasada dolaşması için üretime sevkedilmesi İslam iktisadında tavsiye edilen bir yaklaşımdır. Gerçek ya da tüzel kişilerin tek başına tasarruflarına üretime sevketmeleri tasarruf miktarının azlığı, girişim yetenek ve arzusunun olmayışı gibi sebeplerle mümkün olmayabilir. Bu yüzden bu tasarrufları bir araya toplayıp ticaret yapacak ya da ortaklık olarak işletecek bir ara kuruma ihtiyaç duyulur. Gayrimenkul yatırım ortaklıkları, faaliyetlerinde belli şartları yerine getirdiğinde tasarrufları İslam iktisadına uygun bir şekilde üretime sevkettiği ileri sürülen yapılardır. Bu çalışmanın amacı; yatırım ortaklıkları ve çeşitleri hakkında genel bir bilgi verdikten sonra konvansiyonel ve İslami gayrimenkul yatırım ortaklıklarının gelişimlerini, taraflarını, kurulma amaçlarını, faaliyetlerini, işleyişlerini, ortak ve farklı yönlerini inceleyerek tasarruf sahiplerine kullanabilecekleri bir yatırım aracı olarak GYO'ları tanıtmaktır. Türkiye'de GYO'ların İslam iktisadına uygunluğu için gerekli düzenlemeler mevcut olmadığından Dünyada farklı ülkelerde İslami GYO'lar için belirlenen düzenlemeler de bu çalışmaya dahil edilmiştir. Türkiye'deki GYO'ların faaliyetlerinin İslam iktisadına uygunluğu, Dünyada İslami GYO'lar için belirlenen düzenlemelere göre değerlendirilmiştir."
