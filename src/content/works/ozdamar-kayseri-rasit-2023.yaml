abstract: "Kayseri Raşit EfendiKütüphanesi'ndeki fıkıh ve usul-i fıkıh ile ilgili yazma eserleri konu edinen bu çalışma iki bölümden oluşmaktadır. Birinci bölümde kütüphanedeki fıkıh yazma eserleri müellifleriyle beraber tanıtılmaktadır. Eserler müelliflerin vefat tarihine göre tasnif edildikten sonra, her bir müellif hakkında kısaca bilgi verilmektedir. Ardından müellifin kütüphanedeki eseri, teknik özellikleri ve muhtevaları açısından incelenmektedir. İkinici bölümde müellifleri belli olmayan yazma eserler belirlenmiş, bunlar özellikleri, müellifleri ve muhtevaları açısından değerlendirmeye alınmıştır."
