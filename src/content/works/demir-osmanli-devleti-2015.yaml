abstract: "Osmanlı Devleti'nde yaşayan gayrimüslimlerin hukuki durumuna şer'i hukuk ve örf'i hukuk kaideleri kaynaklık etmiştir. İslam devleti ile gayrimüslimler arasında yapılan sözleşmeye zimmet sözleşmesi denirdi. Bu sözleşmeyi yapan gayrimüslimler, devletin tebaası haline gelir ve zimmi olarak adlandırılırlardı. Bu sözleşme iki taraf için de bazı borç ve alacaklar doğururdu. Zimmiler cizye ve harac ödemek, güvenliği tehdit etmemek karşılığında can ve mal güvenliği, din ve vicdan özgürlüğü, hukuki ve kazai ayrıcalıklar ile mabedleri için özel statü hakları elde ederlerdi. Osmanlı Devleti'ndeki zimmiler bazı hukuki meselelerin çözümü için şer'iyye mahkemelerine gidebilecekleri gibi kendi dini mahkemelerine de gidebilirlerdi. Bu ayrıcalık zimmilerin sahip olduğu din ve vicdan hürriyetinin bir gereği olarak görülmektedir. Osmanlı Devleti'nde zimmiler millet denilen gruplara ayrılmışlardır. Zimmiler ile yönetim arasındaki ilişki millet sistemi kapsamında yürütülmektedir. Devlet tarafından tanınmış zimmi milletler Rumlar, Ermeniler ve Yahudilerdir. Bu milletlere mensup zimmiler sosyal, kültürel ve ekonomik işlerini kendi aralarında görürlerdi. Ancak devletin denetim ve gözetimi her zaman milletlerin üzerinde olmuştur."
