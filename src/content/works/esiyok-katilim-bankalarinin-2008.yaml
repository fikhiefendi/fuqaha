abstract: "1970'lerden itibaren uluslararası finans piyasalarında ağırlığını hissettirmeye başlayan faizsiz bankacılık sistemi birçok ülkede atıl kaynakları harekete geçirmek suretiyle ekonomik kalkınmaya sağladığı katkılar nedeniyle benimsenmiş ve giderek yaygınlık kazanmıştır. Türkiye'de 1983 yılında Kanun hükmünde Kararname ile kurulmasına izin verilen ilk adıyla Özel Finans Kurumları yeni adıyla Katılım Bankaları Dünyada özellikle son yıllarda çok büyük bir gelişme kaydetmişlerdir. Ülkemizde Katılım Bankaları özellikle 2001 yılından sonra büyük bir atılım içerisine girmiş ve diğer ticari bankalar ile rekabet edebilir hale gelmişlerdir. Bunda 1999 ve 2001 yıllarında mevzuatta yapılan değişiklik ile Katılım Bankalarının Bankalar Kanununa tabi olması ve Katılım Bankalarının ticari bankalar ile eşit haklara kavuşmasının büyük etkisi bulunmaktadır.Katılım bankaları özel cari hesaplar ve katılma hesapları ( kar ve zarara katılma) yöntemiyle fon toplamaktadırlar. Katılma hesaplarında önceden belirlenmiş bir getirisi garantisi yoktur. TL, USD ve EURO bazında vadeli hesaplarda toplanan fonlar, Kurumsal Finansman Desteği, Bireysel Finansman Desteği, Finansal Kiralama ve kâr/zarar ortaklığı yöntemleriyle değerlendirilmektedir. Ticaretin ve sanayinin ihtiyaç duyduğu, hammadde, emtia, gayrimenkul, makine ve teçhizatın temini, katılım bankacılığı prensiplerine uygun olarak, yani mal alım satımının finansmanı yoluyla sağlanmaktadır. Ayrıca katılım bankaları gayri nakdi kredi ve kredi kartı, kiralık kasa hizmeti gibi diğer bankacılık hizmetlerini de sunmaktadırlar.Katılım bankaları kredi riski, ülke riski, operasyonel risk, sermaye yetersizliği ve likidite riskini faaliyetleri gereği üstlenirler. Katılım bankaları faizsiz bankacılık esasına göre çalıştıklarından faiz oranı riskini üstlenmezler. Döviz kuru riskini ise topladıkları mevduatın döviz cinsine ve vadesine göre kredi kullandırımı yaptıklarından kur riskini üstlenmezler. Katılım Bankaları kur riskini sadece uluslararası işlemler ve piyasalarda döviz alım satımı yaptıklarında üstlenmektedirler. Türkiye'de faiz bankacılık esasına göre çalışan kurumlar içinde tek tasfiye edilen İhlas Finans Kurumu A.Ş. tasfiyesine iten nedenler likidite riski, ortaklara kullandırılan krediler ve risk bilincinin oluşmaması olarak belirlenmiştir."
