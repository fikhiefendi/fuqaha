abstract: "Çalışmanın amacı, anadili Arapça olmayanların Arapça dil becerilerinin öğretiminde söylem analizini kullanmak; Arapça öğretiminde söylemin önemini ve rolünü izah ve Arapça-Türkçe arasındaki benzerlik ve farklılıkları tespit etmektir. Çalışma doğası, metot olarak teori ve pratiği bir araya getirmesi sebebiyle karşılaştırmalı ve tanımlayıcı analitik yöntemi kullanmayı gerektirmiştir. Söylem analizinin mahiyetini tanıma, söylemin unsurlarını ve yöntemlerini analiz etme ve bunları anadili Arapça olmayanların dil becerilerinin gelişiminde pratize etme konusunda tanımlayıcı yaklaşıma; Arapça ve Türkçe arasındaki benzerlik ve farklılıkları görmek ve bahsi geçen dil öğrencilerinin öğretiminde bunlardan yararlanmak için karşılaştırmalı yaklaşıma başvurulmuştur. Bu çalışma şu sonuçlara ulaşılmıştır: Anadili Arapça olmayanlara dil becerilerinin öğretiminde söylem analizinin kullanılması mümkündür. Bu, temel dört beceri (dinleme, konuşma, okuma ve yazma) üzerinde uygulamalı olarak yapılmıştır. Üç bilimin (Uygulamalı Dilbilim, Anadili Arapça Olmayanlara Dil Öğretimi, Karşılaştırmalı Analizi) bir araya getirilmesinin, Arapça bilmeyenlere yönelik eğitim sürecinin başarısı üzerinde büyük bir etkisi vardır. Çalışma buna binaen önemli birkaç öneride bulunmaktadır: Eğitim sürecinde genel olarak dilbilimi, özel olarak söylem analizi kullanılmalı; özellikle dilbilim ve söylem analizi kullanımına dayalı modern müfredat yazılmalı; dil öğretim sorunlarını çözmek ve kolaylaştırmak için Arapça ve Türkçe arasında karşılaştırmalı analizden yararlanılmalıdır."
