abstract: "İslâm hukukunun esas gayesi insanların dünyevî ve uhrevî maslahatlarını temin etmek, mefsedetlerden de uzak durmalarını sağlamaktır. Bundan dolayı şâriin vazettiği hükümler, hikmet ve maslahat merkezli olup kâinat bu ilkeler üzerine inşa edilmiştir. İnsanları gâi planın merkezi konumuna yerleştiren şâri', kâinatta amaçsız ve hikmetsiz hiçbir şey yaratmamış ve her şeyi bir hikmete mebni kılmıştır. İslâm hukukunun ana kaynakları olan Kur'an ve sünnetin doğru biçimde anlaşılıp yorumlanması, bu iki temel kaynaktan hüküm çıkarılması ve teâruz bulunan deliller arasında hangi ölçütlerin dikkate alınacağı gibi hususlar hakkında birtakım ictihadî faaliyetlere ihtiyaç duyulmuştur. Naslarda hükmü bulunmayan meselelerde mevcut olan hukukî boşluğu doldurmak için kıyas, istislâh, istishâb, istihsan gibi ictihadî yöntemlere başvurulmasının temel hedefi, kanun koyucunun maksatlarını anlamaya yöneliktir. Bu kapsamda ictihadın odak noktasını oluşturan makâsıdü'ş-şerîa konusunun önemi ortaya çıkmaktadır. İslâm hukukunun ana gayeleri, önem dereceleri açısından üçlü bir tasnife tabi tutulmuştur. Cüveynî'nin temelini attığı bu tasnif öğrencisi Gazzâlî tarafından daha sistematik hale getirilimiştir. Daha sonraki süreçte usûlcülerin takip ettiği bu tasnif zarûriyyât, hâciyyât ve tahsîniyyât şeklinde adlandırılmıştır. Çalışmamızda, makâsıd anlayışının tarihsel süreci ve İbn Kayyim el-Cevziyye'nin makâsıd ile alakalı görüşleri ele alınmıştır. Bu sebeple asıl amacımız makâsıdın tarihi süreç içerisinde nasıl bir gelişim gösterdiğini ve İbn Kayyim el-Cevziyye'nin makâsıda dair açıklamalarını tespit ve tahlil etmektir."
