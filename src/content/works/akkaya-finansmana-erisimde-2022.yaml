abstract: "İslami Bankacılık İslam'ın emirlerine uyan yasaklarından sakınan, Kur'an ve hadislerle çelişmeyen kâr-zarar ortaklığına dayanan finansal sistemdir. Faiz nedeniyle meydana gelen aşırı borçlanma dünyada büyük ekonomik krizlere zemin hazırlamaktadır. İslami finansal sistemlerin temelinde üretim ve ticaret olduğu için faizden kaynaklı ekonomik krizlerde bir nebze de olsa sistemi koruyabilmektedir. Bu nedenle İslami Bankacılık dünyada kendi içinde çok hızlı bir gelişme göstermiştir. Bu gelişme ışığında İslami bankacılık faaliyetleri hem artmakta hem de çeşitlenmektedir. Çalışmada ülkemizde Katılım Bankaları olarak faaliyet gösteren bu kuruluşların, üretim odaklı faaliyet gösteren firmalarla finansal ilişkileri ve Diyarbakır Organize Sanayi Bölgesinde faaliyet gösteren firmaların finansmana erişimde Katılım Bankacılığının rolü araştırılmıştır. Çalışmada veriler, yüz yüze yapılan anket yöntemi ile firmaların Katılım Bankalarının hangi finansman yöntemlerini kullandığı, karşılaştıkları finansal sorunların neler olduğu, firmaların Katılım Bankası algısı ve Katılım Bankalarının tercih nedenleri araştırılmıştır. Elde edilen veriler SPSS 26.0programı ile analiz edilmiştir."
