abstract: "Osmanlı Dönemi Sosyo-kültürel tarihi çalışmaları için önemli bir kaynak grubu olan şer'iyye sicilleri, aynı zamanda şehirlerin canlı hayatını göstermesi bakımından da yeri doldurulamayan bir öneme sahiptir. Çok zengin ve çeşitli belgeler ihtiva eden sicillerde; ferman, berat, mektup suretleri, i'lâm ve hüccetler, nikâh akitleri, boşanma ve adlî belgeler, vakfiye kayıtları, narh defterleri, şehir esnaf grupları ile esnaflık yapanların kefil ve taahhütlerini gösteren belgeler, şehrin mahalle listeleri ve alınan vergiler gibi kayıtlar mevcuttur.Bu çalışma, Balkan ve Birinci Dünya Savaşı yıllarının hemen öncesinde Sivas Eyaleti'nin sosyo-kültürel yapısını ortaya koymayı amaçlamaktadır. Bu nedenle şer'iyye sicilleri olarak adlandırılan ve dönemin kadısı tarafından kayda geçirilen vesikalardan öncelikle istifade edilecektir.Sivas Şehrinin Sultan İkinci Abdülhamit dönemine denk gelen on yılı (1900-1909) Anadolu'nun mihver şehirlerinden biri olan Sivas'ta Müslüman Türk insanın mütevazı ve hoşgörülü yaşantısı da görülebilecektir.Sivas, Türklerle birlikte Ermeni ve Rum'lardan oluşan Gayri Müslimlerin, şehrin bütün mahallelerinde huzur içinde yaşadığı, mahkemelere adi suçtan gelen davaların çok az bir yer tuttuğu bir şehirdir. Rum fırıncının, Ermeni demircinin, Türk bıçakçısının ve Kıptî at arabacısının mesleklerini icra ettikleri bir beldedir. Gayrimüslimlere ait yeni mabetlerin yapıldığı, eskilerin de devletin izni ile onarımdan geçtiği bir huzur adasıdır.Bununla birlikte, sorunların olmadığı bir devir de değildir bu dönem. Kafkasya'dan sığınan muhacir Çerkeslerde köleliğin görüldüğü, ?Memâlik-i Osmanî?nin çeşitli vilâyetlerinde şehrin evlatlarının şehit düştüğü, çok evlilikten zarar gören kadınların alacağı mehri için mahkemeye başvurduğu ve yine elden çıkan doğu vilayetlerden gelen muhacirlerin iskânının sorun olarak yaşandığı bir dönemdir."
