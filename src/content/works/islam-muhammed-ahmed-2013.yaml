abstract: "Kur'ân'ın nüzûlünden günümüze kadar Kur'ân'ı daha iyi anlayabilmek adına birçok tefsir çalışması yapılmıştır. 19. asırdan itibaren bu paralelde bilimsel, tasavvufî, fıkhî, konulu ve ictimaî edebî tefsirler yazılmış ve yazılmaya devam edilmektedir. Kur'ân'ın bir hidayet rehberi olduğunu ve onun beyan mucizesi bir kitap olduğunu kanıtlamak için yapılan tefsir çeşitlerinden birisi de ictimaî edebî tefsirdir. İctimaî edebî tefsir çalışmaları, 2/9. Asırdan itibaren ivme kazanan dil ve edebiyat alanındaki faaliyetlerin, Kur'ân'daki kelime, cümle, irâb, temsil, istiare gibi özelliklerini ortaya çıkarmak için gösterilen gayretler, dil ve edebiyat sahasını zenginleştirmiştir. Ebû Ubeyde'nin Mecâzu'l-Kur'ân, el-Esmâ'i'nin Luğatu'l- Kur'ân'ın nüzûlünden günümüze kadar Kur'ân'ı daha iyi anlayabilmek adına birçok tefsir çalışması yapılmıştır. 19. asırdan itibaren bu paralelde bilimsel, tasavvufî, fıkhî, konulu ve ictimaî edebî tefsirler yazılmış ve yazılmaya devam edilmektedir. Kur'ân'ın bir hidayet rehberi olduğunu ve onun beyan mucizesi bir kitap olduğunu kanıtlamak için yapılan tefsir çeşitlerinden birisi de ictimaî edebî tefsirdir. İctimaî edebî tefsir çalışmaları, 2/9. Asırdan itibaren ivme kazanan dil ve edebiyat alanındaki faaliyetlerin, Kur'ân'daki kelime, cümle, irâb, temsil, istiare gibi özelliklerini ortaya çıkarmak için gösterilen gayretler, dil ve edebiyat sahasını zenginleştirmiştir. Ebû Ubeyde'nin Mecâzu'l-Kur'ân, el-Esmâ'i'nin Luğatu'l- Kur'ân kitapları; Ferra, Kisâ'î, Ahfeş, Zeccâc gibi müelliflerin“Me'âni'l-Kur'ân”ismiyle maruf eserleri; Câhız'ın Nazmu'l-Kur'ân ve İbni Kuteybe'nin Müşkilü'l- Kur'ân; Abdulkâhir el-Cürcânî'(471 veya 474) nin“Delâilu'l-İ'caz”ve“Esrâru'l- Belâğâ”ve Zemahşerî' (528) nin“el-Keşşaf”adlı eserlerini bu bağlamda zikredebiliriz. 19. ve 20. yy.'da Batı âlemindeki bilimsel ilerleme ve keşifler neticesi, İslâm dünyasında geri kalmışlık kompleksi gibi sebeplerle edebî ictimaî ekol denilen tefsir çalışmaları son dönemde oldukça yaygınlık kazanmıştır. Biz, bu çalışmamızda edebî ictimaî tefsir metodu konusunda özet bilgi verdikten sonra İslâm dünyasında yapılan bu çalışmalara kısaca göz atmak suretiyle son dönemde edebî ictimaî tefsir alanında çalışma yapan ve tezimizin MUHAMMED AHMED HALEFULLAH, MUHAMMED ARKOUN, NASR HÂMİD EBÛ ZEYD VE HASAN HANEFÎ'NİN KUR'ÂN'LA İLGİLİ GÖRÜŞLERİNİN TEMELLERİ VE KAYNAKLARI II konusunu teşkil eden dört önemli ismin (Muhammed Ahmed Halefullah, Muhammed Arkoun, Nasr Hâmid Ebû Zeyd ve Hasan Hanefî) Kur'ân'la ilgili görüşlerinin kaynaklarını ve temellerini tespit etmeye ve açıklamaya çalıştık. Bu yazarlarımızın ele aldığı konular hakkında ve yaşadıkları dönemden günümüze kadar, bu düşünürler hakkında görüş bildiren müfessirlerin ve ilim adamlarının açıklamalarını vermeye gayret gösterdik. Çalışmamızın sonunda, tahlilini yaptığımız bu yazarlarımızın görüşleri, kaynakları ve temellerini referans alarak, edebî ictimaî tefsir metoduna taraf ve karşı olanların haklı gerekçelerini belirlemeyi hedefledik."
