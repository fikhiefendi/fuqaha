abstract: "ÖZET FETHU'L-KADÎR VE ET-TEFSÎRU'L-MÜNÎR ADLI ESERLERİN KUR'ÂN İLİMLERİ AÇISINDAN MUKAYESESİ Sıtkı KAYA Ondokuz Mayıs Üniversitesi Lisansüstü Eğitim Enstitüsü TEMEL İSLAM BİLİMLERİ ANA BİLİM DALI Doktora, Şubat/2026 Danışman: Prof. Dr. Mustafa KARA İnsanın, Kur'ân'ı anlama çabası hiç kesintiye uğramadan hep devam edegelmiştir. Bu alanda yazılan tefsirler ve yapılan çalışmalar Kur'ân'ın anlaşılmasında önemli bir yere sahip olmuş ve sonraki araştırmalara kaynaklık etmiştir. Mevcut tefsirlerin daha iyi anlaşılması adına bu tefsirlerdeki yorumların Kur'ân ilimleri açısından mukayese edilmesinin tefsir bilim dalına önemli katkılar sunacağı açıktır. Bu doğrultuda bu tez çalışmasında Şevkânî'nin Fethu'l-Kadîr adlı eseri ile Vehbe Zuhaylî'nin et-Tefsiru'l-Münîr adlı tefsiri Kur'ân ilimleri açısından mukayese edilmektedir. Tez, dört bölümden oluşmaktadır. Bu çerçevede Giriş bölümünde, araştırmanın konusu, problem durumu, amacı, önemi, özgünlüğü, kapsamı, yöntemi ve kaynakları konuları işlenmektedir. İkinci bölümde, araştırma ile ilgili literatür taraması yapılmaktadır. Üçüncü bölümde, Şevkânî ve Zuhaylî'nin hayatları, eserleri, yaşadıkları sosyo-kültürel çevre, tefsirlerinin kaynakları ve metotları incelenmektedir. Dördüncü bölümde, tezin temel çerçevesini oluşturan Fethu'l-Kadîr ve et-Tefsiru'l-Münîr adlı eserler, Kur'ân ilimleri açısından mukayesesi edilmektedir. Elde edilen neticeler Sonuç kısmında aktarılmaktadır. Bu araştırma neticesinde, Şevkânî ve Vehbe Zuhaylî'nin Kur'ân ilimleriyle ilgili değerlendirmelerinin çoğunlukla birbirine yakın olmakla birlikte bazı konularda farklı fikirlere sahip oldukları tespit edilmiştir."
