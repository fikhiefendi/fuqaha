abstract: "İpotek hem İslam hukuku hem de Türk Medeni Hukuk sistemlerinde borç ilişkilerinde önemli bir teminat şeklidir. Bu sistem, alacaklıların haklarını korumak amacıyla tescil gibi resmi işlemleri zorunlu kılarak hukuki güvenliği sağlamayı hedeflemektedir. İslam hukukunda ipotek, rehinle benzer temellere dayanırken, sadece gayrimenkul malları kapsayan bir teminat türü olarak şekillenmiştir. Türk medeni hukuku ise ipotek konusunda Batı hukuk sistemlerinden, özellikle İsviçre Medeni Kanunu'ndan etkilenmiş ve taşınmaz malların teminat olarak kullanılmasına ilişkin sistematik hükümler getirmiştir. Bu çalışma, her iki hukuk sisteminin ipotek kurumuna yönelik teorik çerçevesini ve tarihsel sürecini analiz etmiş ve uygulamaları göz önünde bulundurarak, bu hukuki kurumların nasıl şekillendiğini ve farklılaştığını ortaya koymaya çalışmıştır. Çalışmada Türk medeni hukukunda ipotek akdinin genellikle faizli borçlarla ilişkilendirildiği görülmüştür. Ayrıca Türk medeni hukukunda henüz doğmamış veya belirli bir şarta bağlı alacaklar için de ipotek tesis edilebildiği tespit edilmiştir. İslam hukukunda ipotek işlemlerinin şer'î kurallara uygun şekilde yapılandırıldığı, faizsiz bir borçlanma düzenini esas alarak adaleti ve ekonomik sömürünün önlenmesinin öncelendiği ortaya konulmuştur. İslam hukukçularından bazıları taşınmazın bir kısmı üzerinde ipotek tesis edilmesini caiz görmezken, diğer hukukçuların mülkiyetin bir kısmı üzerinde ipotek hakkı kurulmasına cevaz verdiği belirlenmiştir. İslam hukukunda ipotek edilecek malların helal ve mütekavvim olması, mevcut olmayan bir alacak üzerine ipotek kurulamaması borç miktarının ve ipotek konusu malın özelliklerinin açıkça belirlenmesi gibi şartlar İslam hukukunu ipotek konusunda Türk Medeni Hukukundan ayıran önemli noktalar olarak tespit edilmiştir."
