abstract: "Kadınla erkeğin karşılıklı hukuku, kadim tartışma konularından biridir. Ancak modern zamanlarda, toplumların sosyal ve kültürel yapılarında meydana gelen değişimler, düşünce dünyasına da değişiklikler, yeni akımlar getirmiştir. Kadının sosyal hayatta değişen konumuyla birlikte, feminist hareketlerin ortaya çıkışı ve yaygınlık kazanması; kadın hakları, kadın-erkek eşitliği, kadının sosyal statüsü gibi konuları gündemde ön plana çıkarmıştır.Bu ortam içerisinde, İslam'da kadın konusu da çokça tartışılır ve eleştirilir olmuştur. Günümüz ilim adamları, değişen sosyal ve kültürel şartlara göre, Kur'an âyetlerini yeniden anlamaya ve anlamlandırmaya çalışmışlardır. Biz de bu çalışmamızda, kadının hukukuyla ilgili belli başlı tartışma konuları üzerinde, klasik dönemde ve günümüzde yapılan yorumları bir araya getirerek, farklılıkları ortaya koymak ve objektif bir bakış açısı sağlamak amacını taşıdık.Nisâ Sûresi'ndeki ahkâm âyetlerinden, kadın erkek eşitliği ile ilgili güncel tartışmaları doğrudan ilgilendiren âyetleri esas aldık. Kadın ve erkeğin ontolojik eşitliği, çok eşlilik meselesi, ailede kadınla erkeğin statüleri ve karşılıklı hakları ile ilgili tartışmalar üzerine yapılan yorumları inceledik.Âyetlerin nüzûl (iniş) sebeplerinden hareketle, tartışma konularının tarihsel boyutlarına yer verdik. Farklı dönemlerdeki yorumları kendi gerekçeleriyle karşılaştırarak genel bir değerlendirme yapmaya çalıştık.Başta tefsirler olmak üzere, yakın dönemlerde ve günümüzde bu konulara mahsus olarak yazılmış kitaplara başvurduk. Hukuki bazı ayrıntılar için, metodolojik fıkıh kitaplarından yararlandık.Çalışmamız neticesinde, farklı zaman ve koşullarda yapılan yorumların zamanla değiştiğini ve bu değişikliklerde, içinde bulunulan sosyal ve kültürel şartların rol oynadığını görmekteyiz. Bu durum, bahsi geçen tartışma konularının, esasen göreceli konular olduğunu öne çıkarmaktadır. Bununla birlikte, farklı yorumları bir arada görmenin, bu konularda yapılacak araştırmalar için objektif bir bakış açısı sağlayabileceğini ümit ediyoruz."
