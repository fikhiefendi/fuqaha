abstract: "Fıkıh ahkamına dair eserlerin sayısı çok fazladır. Bunlar, insan hayatının hemen hemen her alanını tanzim eden eserlerdir. Namaz kılmaktan, oruç tutmaya; köle ahkamından evliliğe kadar çok çeşitli meseleleri içermektedir. Bu kitapları incelediğimiz zaman, bunları yazan âlimlerin farklı farklı metotlar takip ettiğini görmekteyiz. İşte bizim de ele aldığımız Mevkūfâtî Mehmed Efendi'nin Mültekā Tercüme ve Şerhi kitabının aile hukukuna dair bölümlerini incelerken şârihin bu mevzuları nasıl ele aldığını tetkik etmeye çalıştık. Mevkūfâtî, kitabı yazarken yeri geldiği zaman şerh ettiği metnin gerek âyet-i kerîme gerekse hadis-i şerif olan delilini getirmiş, yeri geldiği zaman mukadder suale cevap şeklinde açıklamalar getirmiş, yeri geldiği zaman izah etmeye çalıştığı meselenin zihinde daha iyi oturabilmesi için konu ile alakalı bir hâdise zikretmiş, bazen de mevzu ile alakalı külli kaideler zikretmiştir. Üç bölümden oluşan tezimizin ilk bölümünde Mevkūfâtî'nin hayatı, eserleri ve Osmanlı Devleti'ndeki şerh ve hâşiye geleneğine kısa bir bakış yaptık. İkinci bölüm de ise Mevkūfâtî'nin şerh yöntemi ile Alâüddin Haskefî'nin (ö.1088/1677) Mültekā üzerine yazdığı ed-Dürrü'l-müntekā isimli şerhinde ele aldığı yöntemi karşılaştırarak aralarındaki benzerlik ve farklılıkları ortaya koymaya çalıştık. Üçüncü bölümde ise Mevkūfâtî'nin Mültekā şerh ve tercümesi'nde ele aldığı yöntemi detaylı bir şekilde inceledik."
