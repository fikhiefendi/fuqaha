abstract: "Kuruluşundan beri nice imparatorlukların, nice kültür ve medeniyetin inkırâza uğradığı, fakat kendisi güçlenerek ve gelişerek günümüze kadar gelen ve halen gelişimini devam ettiren Hanefî mezhebi, kurucusu Ebû Hanîfe (ra.) ve talebeleri başta olmak üzere her zaman ve zeminde ilgi odağı ve araştırma konusu olmuştur. Biz de bu çalışmamızda Hanefî mezhebinin usûl ve ictihadlarının arka planını incelemeyi amaçladık. Hanefî mezhebini diğer mezheplerden ayıran temel özellikleri ve bu özelliklerin sebep ve sonuçlarını araştırdık. Örneğin, istihsan metodunu çokça kullanan Hanefî mezhebinin bu metodu niçin, nerelerde ve bu metodu kullanırken hangi sonuçları gözettiği gibi soruların cevabını bulmaya çalıştık. Hanefî mezhebinin genel karakteristiğini anlayabilmek için araştırmamızın kapsamını mezheplerin doğuş tarihlerinden başlattık. Bu süreçte mezheplerin bazı özelliklerinin onların yapısı ve usûlüyle ilgili olduğunu gördük. Bu yüzden tezimizi Hanefî mezhebinin“Yapısıyla ilgili temel karakteristiği”ve“Usûlüyle ilgili temel karakteristiği”olmak üzere iki bölümde inceledik. Yapısıyla ilgili temel karakteristiğinde Hanefî mezhebinin kuruluşuyla ilgili olan ve mezhebin usûlünün oluşumuna etki eden özellikleri araştırdık; usûlüyle ilgili temel karakteristiğinde ise bazı fer'î delilleri kullanma sebeplerini birtakım örneklerle inceledik."
