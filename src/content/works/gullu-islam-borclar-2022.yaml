abstract: "İslam hukukunda Iskat kavramı, bir hakkın ya da mülkiyetin, hak sahibine intikalinin söz konusu olmadan düşürülmesini ifade etmektedir. Iskat tasarrufunun konusuna baktığımızda, genel olarak hakların teşkil ettiğini görmekteyiz. Fakat İslam hukukçuları arasında hangi tür hakların ıskat kabul ettiği konusu tartışmalıdır. Genel kural olarak zimmette sabit olan deynin ıskatı caiz kabul edilirken, ayn üzerindeki mülkiyetin ise genel olarak ıskatı kabul edilmemektedir. Bununla birlikte ayn üzerindeki mülkiyetin başkasına nakledilmesi söz konusu olmaktadır. Bu ise temlik olarak değerlendirilmektedir. Iskat tasarrufunun hükmüne baktığımızda, bir kimsenin kendi hukuki alanını ilgilendiren bir işlem olması sebebiyle kural olarak, caiz ve mubah kabul edilmektedir. Fakat ıskat tasarrufunda bulunacak kişi için sırf zarar içeren bir işlem olmasından dolayı, tasarrufta bulunacak kişi için bazı şartlarda aramaktadır."
