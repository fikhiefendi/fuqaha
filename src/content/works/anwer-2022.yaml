abstract: "Tez“Şeyh Abdu'l-mu`tî el-burullusî'nin (ö. h. 1079) İ`râbu metni'l-âcurrûmiyye lihalli'l-elfâzi'l-`arabiyye Adlı Eserinin Tahkik ve Değerlendirmesi”başlığını taşımaktadır. Giriş bölümüne müteakip araştırmanın hedefleri yazılıp karşılaşılan önemli zorluklara değinildi. Sonrasında araştırma dört bölüm halinde tasnif edildi. Birinci bölümde İmam İbn Âcurrûm ve Şeyh Abdü'l-mu`tî el-burullusî'nin biyografik bilgileri aktarıldı. Ardından Şeyh Abdü'l-mu`tî el- burullusî'nin yaşadığı asır hakkında bilgi verildi. Bu bölüm iki kısma ayrılmıştır. İlk kısımda İmam İbn Âcurrûm'un biyografisi anlatıldı. Bu kısım da iki konudan oluşmaktadır: İlk konuda onun adı, künyesi, lakabı, nesebi, doğumu, ve vefatı işlendi. İkinci konuda onun ilim yolculuğu, alimlerin kendisi hakkındaki olumlu kanaatleri, akidesi, fıkıh ve nahivdeki ekolü, hocaları, talebeleri, eserleri, kitaplarında kullandığı yöntem ve üslubu, Âcurrûm'un Mukaddime'sinin değeri ve özellikleri anlatıldı. İkinci bölümde Şeyh Abdü'l-mu`tî el-burullusî el-mâlikî'nin biyografisi ve İ`râbu metni'l-âcurrûmiyye ele alındı. Bu bölüm iki kısma ayrıldı: Birinci kısımda Şeyh Abdü'l-mu`tî el-burullusî el-mâlikî'nin biyografisi işlemdi. Bu kısım da iki konudan oluştu: Birinci konuda müellifin hayatı, doğumu, yetişmesi ve vefatı anlatıldı. İkinci konuda müellifin ilim yolculuğu, alimlerin kendisi hakkındaki olumlu kanaatleri, hocaları, öğrencileri, ilimdeki yeri ve eserleri anlatıldı. İkinci kısımda İ`râbu metni'l-âcurrûmiyye ele alındı. Bu kısım iki konuya ayrıldı. İlk konuda yazmanın müellife aidiyeti tespit edildi. Bu yazma eseri i`rab yönünden diğer şerhlerden ayıran özellikleri açıklandı. İkinci konuda ise Müellifin yazma eserdeki yöntemi ve metnin i`rabını ele alış şekli açıklandı. Üçüncü bölümde Şeyh Abdü'l-mu`tî el-burullusî el-mâlikî'nin yaşadığı çağ ve eser tahkikindeki yöntemi ele alındı. Bu bölüm iki kısma ayrıldı. İlk bölümde Şeyh Abdü'l-mu`tî el-burullusî el-mâlikî'nin yaşadığı çağ anlatıldı. Bu kısım üç konuya ayrılmıştır bunlar, müellifin çağının siyasi, toplumsal, ekonomik ve ilmî yönlerden tasavvur edilmesidir. İkinci kısımda araştırmacının tahkik metodu ele alındı. Bu kısım da üç konuya ayrıldı: Araştırmacının tahkik yöntemi, yazma büshalarının özellikleri, yazma sayfalarından örnekler. Dördüncü bölümde tahkik edilmiş metin ve değerlendirmelerle tavsiyeleri içeren sonuç kısmı yer aldı."
