abstract: "Bu araştırmada fıkhın önemli konularından biri olan Vakıfla ilgili fıkıh kaideleri ele alınmış ve bunların tesbitinde tümevarım metoduna dayanılmıştır. Bu çerçevede fıkıh ve vakfın sözlük ve terim anlamlarının beyanı dahil birçok hususa işaret edilmiş daha sonra bu konuyla bağlantılı kaideler vakfın rükünlerine göre taksim edilmiştir. Birinci kısımda vakfedenle ilgili iki kaide zikredilmiştir. İkinci kısımda ise vakfedilen malla ilgili dört kaide işlenmiştir. Üçüncü kısımda ise mavkufu aleyhi yani kendisine vakıfedilen şahısla ilgili dört kaide ele alınmıştır. Dördücü kısımda ise vakfedenle ilgili bir kaide incelenmiştir. Ayrıca bu bölümlerin her birinde kaidenin dayandığı delil zikredilmiştir. Daha sonra her kaidenin altına giren uygulamalardan bahsedilerek konu detaylı bir şekilde ele alınmıştır."
