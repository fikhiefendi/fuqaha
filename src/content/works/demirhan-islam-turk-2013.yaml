abstract: "Kazâî boşanma, tek veya iki kişinin iradesinin yanında, hâkimin kararına ihtiyaç duyulan boşanma şeklidir. İslam Hukukçuları kazâî boşanmayı boşanma yöntemi olarak kabul etmiş, ancak hangi sebeplerin kazâî boşanmayı gerekli kılacağı hususunda ihtilaf etmiştir. Bu çalışmada İslam Hukukçularının benimsediği kazâî boşanma sebepleri ile Medenî Hukuktaki boşanma sebepleri çeşitli açılardan incelenmiştir. Ayrıca konunun insan ve toplum yaşamı üzerindeki ehemmiyeti açısından, pratikte en sık başvurulan boşanma sebepleri araştırılmıştır. Bu doğrultuda çeşitli araştırmalar incelenmiş, avukat ve psikologlarla görüşmeler yapılmıştır.İncelenen araştırmalar ve yapılan görüşmelerle günümüzde insanları boşanmaya iten sebeplerin tespitine çalışılmıştır."
