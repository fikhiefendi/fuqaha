abstract: "Türkiye'de İslam ekonomisi ve finansına yönelik çalışmaların, yirminci yüzyılın ortalarından günümüze kadar geçen süreçte önemi artmıştır. Bu araştırma ile İslam ekonomisi ve finansı çalışmalarının Türkiye'de izlediği sürecin ortaya konulması amaçlanmıştır. Araştırmanın birinci bölümünde İslam ekonomisi ve finansı alanında ilk çalışmaların nerede ve nasıl ortaya çıktığı ile Türkiye'de bu konuda yapılan çalışmaların ne zaman ve nasıl başladığı incelenmiştir. Ayrıca İslam ekonomisi konusunun hangi açılardan ele alındığından ve İslam ekonomisinin metodolojisinden, iktisat teorisinin gelişme merhaleleri açısından ele alınmasından ve ileri süreçte yeni iktisadi yaklaşımlara ilişkin bir takım düşünüler tarafından ileri sürülen öngörülerden bahsedilmiştir. İkinci bölümde İslam ekonomisi ve finansı ile ilgili çalışma yapan kişiler, vakıf ve dernekler, üniversiteler, bu alanda yazılan eserler ve düzenlenen kongreler ile seminerler ayrı başlıklar altında detaylandırılarak anlatılmıştır. Araştırmanın ikinci bölümünde literatürde yer alan çalışmalar incelenmiş, kaynak tarama yöntemi kullanılmıştır. Yapılan bu araştırmada, İslam ekonomisi ve finansıyla ilgili yapılan çalışmaların, akademik açıdan giderek artan bir seyir izlediği gözlemlenmiştir. İktisadi kurum ve kuruluşların da bu alana yönelik ilgi ve çalışmaları artmakta ve sadece İslam ekonomisi ve finansı çalışmalarına münhasır kurum ve merkezler kurulmakta olduğu tespit edilmiştir. Gerek akademik çevreler, gerekse özel kurum ve kuruluşlar arasında iş birlikleri oluşturulmakta, ortak organizasyonlar düzenlenmekte olduğu gözlemlenmiştir."
