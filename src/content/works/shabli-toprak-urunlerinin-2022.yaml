abstract: "Zekât, İslam'ın rükünlerinden olan önemli bir rükün, Müslümanları parçalanmaktan bertaraf olmaktan ve fakirliğin kendilerine ulaşmasından koruyan korunaklı bir sığınaktır. Bundan dolayı da bazı mal türlerinde vaciptir. Onlardan bir kısmı yerin çıkardığı meyveler ve ziraat ekinleridir. Bu çalışma, dört temel esasa dayanmaktadır. Onlardan zekâtın Mekke de mi Medine de mi farz kılındığıyla alakalı tarihi sorun ki bu sorunun dalları ikinci bir sorun oluşturmaya uzanıyor. O da:“Hasat günü onun hakkını verin.”ayetinin nesh olup olmama meselesidir. Üçüncüsü İmam Ebu Hanife'nin zekâtta nisabı belirlemede ayetin umumunun ahad hadislerle tahsis edilemeyeceği meselesidir. Dördüncüsü ise nassın kendileri hakkında varid olmamasına rağmen başka mal çeşitlerine genişlik sağlayan cumhurun yeşilliklerin zekâtını men etme görüşüdür. Araştırmacının görevi bu sorunlara çözüm üretmeyi amaçlamaktadır. Bu ise araştırmacının çalışmasında takip ettiği derin araştırma ve tümevarım yöntemiyle alimlerin tüm görüşlerini tahlil, tefsir, karşılaştırma, delil getirme, tenkit etme yöntemleriyle o delillerden bir sonuç çıkararak ve değerlendirerek araştırmanın dayandığı menhec çerçevesinde olur. Bunu kullanma sebebi araştırmacının hedeflediği bu iç içe girmiş düğümü çözmeye ve delillerle desteklenen neticeyi ortaya çıkarmaya ulaştırmasıdır ki o da nisaba ulaşmış yeşillik meyveler ve ziraat ekinlerinin zekâtının vacipliği meselesidir. Bu araştırma bir mukaddime ve üç fasıldan oluşuyor. Bu mukaddime konunun önemi, tercih sebebi, önceki yapılan çalışmalar ve araştırmanın haritası ve menheciyle alakalıdır. Birinci fasıl kendisinde yedi konu barındıran zekâtın tanımıyla başlayan, nerede farz olduğunu tespit eden ve Kur'ân-ı Kerimdeki delilinin münakaşasıyla başlayıp sünnetteki delillerle devam edip en sonda akli delillerle ortaya koyan fasıldır. İkinci fasıl beş konudan oluşmaktadır. İmam Ebu Hanife'nin ve cumhurun zekâtın kendilerinde farz olduğu meyveler ve ziraat ekinleri meselesini delilleriyle birlikte içermektedir. Üçüncü fasıl yedi konu içerir. Burada İmam Ebu Hanife ve cumhurun birbirine karşı sunduğu deliller, tercih edilen görüş ve bir hatime içerir."
