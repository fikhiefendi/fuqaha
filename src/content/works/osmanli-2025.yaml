abstract: "Pozitif ayrımcılık olarak bilinen ilke, kadınlara yönelik her türlü ayrımcılığı reddetmektedir. Bu ilke, Birleşmiş Milletler tarafından kuruluşundan bu yana kademeli olarak onaylanan özel önlemleri, 1948'deki İnsan Hakları Bildirgesi ve ardından gelen antlaşmalar, sözleşmeler ve protokoller gibi uluslararası tüzükleri içermektedir. Bu tüzükler, Birleşmiş Milletlerin ısrarına bağlı olarak sözleşmeye taraf olan ülkeleri yasayı uygulamaya mecbur etmektedir. Örneğin, 1979'daki kadınlara karşı her türlü ayrımcılığın ortadan kaldırılmasına ilişkin olan sözleşme ve ona bağlı 1999'daki Protokol, kadınlara pozitif ayrımcılığın ulusların ve halkların inanç ve geleneklerinden bağımsız olarak barış ve sağlıklı toplumlar yaratacağına inanmaktadır .Bu bağlamda, tüzük metinlerini incelediğimizde, bunların iki temel ilkeye dayandığını gördük: kadınlar için mutlak özgürlük ve hayatın her alanında erkeklerle tam eşitlik. Bu mevzuatların Batılı kadınların ve genel olarak toplumun gerçekliği üzerindeki sonuçlarını, özgürleşmenin ve bireyi merkeze almanın ve kadın-erkek çatışmasının belirgin bir özellik haline geldiği bu gerçekliği tasvir eden resmi istatistikler ve çalışmalar aracılığıyla analiz ettik. Araştırma ayrıca İslam hukukunda kadının statüsünü ve özgürlük ve eşitliğin bir parçası olan adalete dayalı olarak onlarla ilgili hükümleri de ele aldı. Uluslararası sözleşmelerdeki pozitif ayrımcılık, kadınların dinî ve toplumsal ayrımcılığa maruz kalmaları sonucu düştükleri sorunlara çözüm olarak getirilen, kadınlara adalet sağlamak ve daha önce yaşananları telafi etmek amacıyla alınan geçici tedbirlerdir. Bu çalışmada araştırmamızı üç bölüme ayırdık. İki başlıktan oluşan birinci bölümde, uluslararası sözleşmelerde pozitif ayrımcılık kavramının tanımını, nasıl ortaya çıktığını, amaçlarını, gelişim evrelerini ve bu kavramın İslam hukukunda neye tekabül geldiğini ele aldık. Ayrıca uluslararası sözleşmelerin tanımını, türlerini, bunlara bağlı kalma evrelerini, akdedilmelerinin geçerlilik şartlarını ve resmi ve gayri resmi uygulamalarını da inceledik. İkinci bölümün birinci ve ikinci başlıklarında İslam hukukunda pozitif ayrımcılık modelleri olarak nafaka ve mehri, hükümlerini, delillerini, hukuki amaçlarını ve genel hükümlerini ele aldık. Üçüncü başlıkta ise uluslararası sözleşmelerde nafaka ve mehri ele aldık. Üçüncü bölümde, kadın ve erkek arasında nafaka eşitliğinin sonuçları ve uluslararası sözleşmelerde kadın için çeyiz şartının bulunmaması ele alınmaktadır."
