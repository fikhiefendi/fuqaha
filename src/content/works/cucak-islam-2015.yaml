abstract: "Çalışmamızda İslâm'ın gayrimüslim azınlıklara sağladığı haklar ortaya konulmuş ve hangi din mensuplarının gayrimüslim azınlıklar statüsünü kazanabileceği üzerinde durulmuştur. Taharet, namaz, zekât gibi İslam hukukunda ibâdet olarak kabul edilen konularda Müslüman azınlıklara sıkıntı veren meseleler tek tek tespit edilerek değerlendirilmiştir. Âyet, hadis ve İslâm'ın genel prensipleri çerçevesinde ulaşılan çözüm yolları ve sonuçlar sunulmuştur"
