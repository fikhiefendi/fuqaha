abstract: "Kıssalar, Kur'ân'da önemli bir yekun oluşturmaktadır. Bu sebeple tefsir faaliyetlerindeki konumu da bu ölçüde mühimdir. Tefsir tarihi boyunca müfessirler kıssaların anlaşılması noktasında büyük çaba sarfetmişler ve kıssaları farklı yönlerden ele almışlardır. Çalışmamızda kıssaların ahkamla olan ilişkisi araştırmaya konu olmuştur. Kıssalardan ahkamın çıkarılabileceğini savunan mezheplerin müfessirleri tercih edilmiştir. Bu konuyu ele almamızın sebebi kıssalardan ahkama dair fikirlerin nasıl verildiğini göstermek içindir. Kıssalardan yola çıkarak müfessirler bazen yeni bir hüküm ortaya koymuştur. Fakat kıssaları daha çok içtihatlarını veya savundukları mezhebin görüşlerini desteklemek için kullanmışlardır. Kıssalardan yeni fıkhi fikirlerden ziyade, kıssayla kurulmuş olan ilişki çerçevesinde fıkıh meseleleri gündeme getirilmiştir. Ele almış olduğumuz dört kıssanın her birinde müfessirler dönemlerinde yaşanan olaylara ve etkilendikleri mezheplere yer vermişlerdir. Araştırmamızda dört kıssa ve üç müfessire yer verilmiştir. Mâtürîdî'nin fikir beyan ettiği âyetler incelememize konu olmuştur. Onun fikir beyan etmediği noktalarda Râzî ve Kurtubî'ye yer verilmemiştir."
