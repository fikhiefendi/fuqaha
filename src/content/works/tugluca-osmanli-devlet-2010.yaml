abstract: "Bu çalışmada, Osmanlı İmparatorluğu'nda 1683-1699 yılları arasında şikayet defterlerine yansıyan konular incelenmiştir. Daha önce şikayet mekanizması üzerine monografik bir çalışma yapılmamıştır. Bu yüzden burada şikayet mekanizmasının işleyişi üzerinde de durulmuştur. Bu tez iki ana bölümden oluşmaktadır. Tezin birinci bölümünde şikayet mekanizmasının işleyişi, ikinci bölümünde ise şikayet konuları ele alınmıştır.Bu bağlamda I. bölümde öncelikle şikayet hakkı ve bu hakkın Osmanlı öncesinde kullanımını inceledik. Bu hakkın kullanımı için oluşturulmuş müesseselere değindik. Daha sonra Osmanlı imparatorluğu'nda şikayet mekanizmasının işleyişini inceledik. Öncelikle şikayet kabul eden mercileri sırasıyla ele aldık. Burada Osmanlı'nın merci sayısını artırdığını gördük. Osmanlı, şikayet kabul eden merci sayısını artırarak daha işlevsel ve yaygın bir ağ şeklinde çalışan mekanizma teşkil etmiştir. Daha sonra şikayetin iletim kanalları, mekanizma içerisinde rol alan kişiler ve bu kişilerin rollerini inceledik. Son olarak bu mekanizmanın işlevleri üzerinde durduk. Şikayet mekanizması, idari denetime, hukukun yeniden üretimine, toplumsal, ekonomik ve siyasal sürekliliğe katkı sağlamak gibi temel fonksiyonlarının yanında mahkeme kararlarının kontrolünü de sağlamıştır. Ayrıca şikayet mekanizması çeşitli zamanlarda siyasi faaliyetlerde bir araç olarak da kullanılmıştır.II. bölümde ise defterlerin içeriğini inceledik. Defterlerde dört temel konu belirlendi. Bunlar, adli yargı konuları, vergi vakıf ve savaştır. Bunların haricinde defterde tüccar, esnaf, zanaatkârlar, seyyid, gayrimüslim ve mahalli görevlilerle ilgili konular da yer almıştır. Savaş konusunda reaya ve askerî zümreler, askerî ve malî yükümlülüklerle ilgili sorunlarla gündeme gelmiştir. Savaşın şikayet mekanizmasının işleyişinde olumsuz bir tesirinin olup olmadığı da sorgulanmıştır. Adli yargı konularında kişisel hukuk ve ceza hukukuyla ilgili davalar, yüksek oranda yer almıştır. Vergiyle ilgili temel şikayet konuları da yetki çatışması, kanunsuz vergi toplama ve düşük vergi ödemeleriyle ilgili olmuştur. Vakıf konusundaki şikayetler ise vakfın yönetimi, gelirleri ve çalışanlarıyla ilgilidir. Diğer konulardaki şikayetlerin de temelde adaletsizliğe dayalı sorunlardan kaynaklandığı görülmüştür. Bütün bu konularda, taraflar haklarını ararken ya da devlet adaleti yerine getirmeye çalışırkan referans kaynağı olarak ?şeriat ve kanun?a dayanmıştır."
