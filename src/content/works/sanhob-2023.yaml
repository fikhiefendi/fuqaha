abstract: "Bu çalışma, parayı, işlevlerini ve türlerini ele alıp modern para sistemlerini inceleyerek, birleşik İslami para biriminin İslam ülkeleri arasında ekonomik birliğin kurulması üzerine etkisine ışık tutmayı amaçlamaktadır . Bu durum, küresel para olgusunun incelenmesi, doların küresel ekonomi üzerindeki hakimiyeti ve etkisi irdelenerek açıklığa kavuşturulmuştur. Bu çalışma aynı zamanda birleşik para birimi oluşturma yolunun İslâm ülkelerinin parasal entegrasyona katılmasından geçtiğini göstermiştir. Bu çalışma, ekonomik ve parasal birleşme ile ilgili literatüre yer vermiş, betimleyici ve analitik bir yaklaşımla çeşitli ülke deneyimleriyle desteklenmiştir. Çalışma şu sonuca varmıştır: Paranın gelişimi, kültürel ve medeni değişimle ilişkilidir. Eleştiri terimi, koşulların, özelliklerin ve işlevlerin yerine getirildiği her şeyi ifade eder. İslam ülkeleri ekonomik ve parasal entegrasyon unsurlarına sahiptir. Bunlardan en önemlileri düşünce, inanç ve din birliği, coğrafi konum yakınlığı, doğal ve beşerî kaynaklar zenginliğidir. İslâm ülkeleri arasındaki para birliği onlara ekonomik, siyasi ve sosyal faydalar sağlayacaktır. Birleşik para birimi oluşturmak için, önceki gereksinimleri uygulamak ve koşulları sağlamak gerekir. Paralel para birimi oluşturmak şimdiye kadar ortaya atılan en iyi tekliflerden biridir. İslâm ülkeleri arasındaki ortak para birimi, iki para biriminin kullanılmasını ilişkilendirir. Bunlar; ülkelerin iç ve dış ticaret işlemlerinde altına bağlı bir para birimi diğeri ise, bireylerin işlemlerinde kullanması için çıkarılan yerel para birimidir. İslâm ülkeleri arasında paralel para birimiyle işlem yapmak takas odası aracılığıyla gerçekleşir. Ortak para birimi ülkeler arasında gerektiği gibi kullanılsa ve uygun koşullar sağlansa da bireylere dağıtılır ve tüm yerel para birimleri piyasadan kaldırılır. İslam ülkeleri, içinde bulundukları darboğazlardan, ekonomik sıkıntılardan, acizlik ve aşağılanma durumundan kurtulmak için tek çare olarak İslâm hukukuna başvurmalı ve onu uygulamalıdır."
