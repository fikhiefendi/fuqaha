abstract: "Bu çok önemli bir konuyla ilgili bir mesajdır; Alimlerin her zaman üzerinde konuştukları, üzerine mektup ve kitapların yazıldığı, her mezhep ve mezhepten tenkit, tahlil ve çıkarımlarda bulunulan bir konudur. Tevessül konusu çağlar ve asırlar boyunca İslam düşünce tarihinde geniş bir yer kaplamış ve Şeyh İbn Teymiyye el-Dimashqi al-Harani'nin yaşadığı dönemde olması nedeniyle belki de sekizinci asırda bu konuda en büyük paya sahip olmuştur. Ehl-i Sünnet ve'l-Cemaat'ine göre bu konuda yazan ve özel yöntemleri ile cevap verdiği yönler vardı."
