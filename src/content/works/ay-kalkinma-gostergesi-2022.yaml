abstract: "Ekonomi kavramı, insanlığın ortaya çıkışından günümüze varlığını sürdüren bir realitedir. İnsanlar, en temel güdülerinden olan hayatta kalma dürtüsüyle birbirleriyle olan etkileşimlerinde en ilkel formdan en güncel forma kadar bu realiteyi yaşamışlardır. Bu çalışmanın temel amacı İslamilik Endeksi'nin (Islamicity Index) bir kalkınma göstergesi olarak kullanılabileceğinin sınanmasıdır. Bu amaç kapsamında İslamilik Endeksi'nin temel yapısının analiz edilmesi, coğrafi bölgeler ile ilişkisinin analiz edilmesi, diğer ekonomik sınıflama türleriyle karşılaştırılmasının yapılması gerçekleştirilmiştir. Bu araştırma kapsamında hem parametrik hem de parametrik olmayan araştırma yöntemleri kullanılmıştır. Bu yöntemler, korelasyon analizleri, fark testleri ile kümeleme analizleridir. Araştırma dönemi 2000 ile 2020 yılları arasındadır. Araştırma sonuçları, İslamilik Endeksi değerlerinin kıtalar bağlamında farklılık gösterdiği, ülkelerin homojen ve heterojen niteliklerini belirlemede etkili olduğu ve bir kalkınma göstergesi olarak kullanılabileceği gösterilmiştir."
