abstract: "Ignaz Goldziher, geçtiğimiz asrın yetiştirdiği en önemli müsteşriklerdenbiridir. Goldziher'in slam'ın ana kaynaklarına yönelik kaynak kabuledilebilecek tarzda araştırmalarda bulunması, bizim yüksek lisans tezi olarakGoldziher'in slam hukuku kaynaklarına bakışını çalışmamıza nedenolmuştur.Tezimizde asıl ulaşmaya çalıştığımız hedef Goldziher'in Kuran veSünnet başta olmak üzere cma, Kıyas ve Yabancı Kültürlerin Etkisikonularındaki görüşlerini ortaya çıkarıp bu görüşlerini değerlendirmekti.Goldziher, Kuran'ın ilahi vahiy ile gelen bir kutsal kitap olduğunu kabuletmemektedir. Onun savunduğu görüş, Kuran'ın slam'ın Peygamberi olarakortaya çıkan Muhammed'in kendinden önce gönderilen dinlerin ve çeşitlikültürlerin öğretilerini meczederek Kuran'ı yazdığıdır. Bunun için Kuran'ındiğer dinlerin kopyası olduğunu iddia etmektedir.Yine Goldziher, Sünnet konusunda da çarpıcı iddialardabulunmaktadır. Ona göre bize kadar gelen hadisler aslında Peygamberinsözleri değil, Arap kültürüdür. nsanların Sünnet olarak inandığı esaslar,aslında günümüze kadar yaşaya gelen adetlerdir.Goldziher, slam hukuk kaynaklarına, klasik eserlerde kaynak olaraknitelendirilmeyen yeni bir esas daha ilave etmektedir. Bu yeni kaynak dayabancı kültürlerin slam'a ve slam hukukuna etkileridir. Goldziher, slam'ınve onun hukukunun değişik din ve kültürlerin etkisiyle oluştuğunu iddiaetmektedir.Çalışmamızda, Goldziher'in bütün bu iddialarını slam hukukukaynaklarıyla karşılaştırarak inceledik. Bunun sonucu olarak da Goldziher'iniddialarının aksine Kuran'ın ilahi bir vahiy olduğunu, Peygamberin sahihhadislerinin günümüze kadar ulaştığını, slam'ın diğer din ve kültürlerintaklidi, birleşimi olmadığını ortaya koymaya çalıştık."
