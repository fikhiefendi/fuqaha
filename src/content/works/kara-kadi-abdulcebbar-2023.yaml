abstract: "Bu çalışmada ünlü mu'tezilî kelâmcısı Kâdî Abdülcebbâr'ın lafız-mânâya yönelik dilbilimsel görüşleri ele alınmıştır. Müellif, lafız ve mânâya yaklaşımında kelimelerin cümle içerisinde gerekli şartları taşıması halinde tam bir anlam ifade etmesini delâlet kavramıyla isimlendirmektedir. Ona göre Arap dilinde lafız, sadece harf ve sesten oluşması nedeniyle edebi değere sahip değildir. Kâdî Abdülcebbâr, dilsel tartışmaları ele alırken hareket noktası olarak dilin kökeni meselesini önemsemiştir. Ona göre dilin kökeni insanların toplu uzlaşması neticesi oluşan bir mekanizmadır. Bu nedenle dilin kökeninin ilâhi bir öğretiye dayandığı düşüncesini reddetmektedir. Dildeki lafızların ilk anlamlarının saptanmasında toplumsal uzlaşıyı savunan Kâdî Abdülcebbâr, kelimelerin mecâzlı ya da yeni anlamlar kazanmasını tabii karşılamaktadır. Kâdî Abdülcebbâr'ın dilin kökenini toplumsal uzlaşıya dayandırdığı temel düşüncesini Kur'ân'ın yaratılması, Allah'ın sıfatları, ilâhi kelâmın anlaşılması ve yorumlanması, dilsel kıyas gibi meselelere yaklaşımına bariz bir şekilde yansıdığını görmekteyiz. Sözgelimi ilâhi kelâmın anlaşılması hususunda müteşâbih âyetlerin anlamlarının anlaşılamazlığını kabul etmemektedir. Ona göre Allah'ın kullara anlamı kapalı kalması için bir vahyi göndermesi düşünülemez. Diğer taraftan nesnelerin isimlerinin belirlenmesinde beşerî iradeye bir özgürlük tanıdığı gözlemlenmiştir. Bu konudaki düşüncesi onun dilin kökenine dair yaklaşımını detaylı olarak anlamaktan geçmektedir."
