abstract: "Bu araştırma;“ Veren el, alan elden üstündür ”hadisinin sened, metin ve içerik bakımından değerlendirilmesi maksadıyla yapılmıştır. İnceleme sırasında öncelikle ilgili hadisin tarama havuzumuza giren kaynaklardaki sened ve metinlerine ulaşılmış; neticedeyse 12 farklı sahâbî râviden toplam 78 rivayeti bulunduğu belirlenmiştir. Elde edilen verilere göre ilgili hadis metinlerinin 2 veya 3 farklı bağlama (sebeb-i vürûd ) ait oldukları saptanmıştır. Hadisin anlaşılmasında anahtar sözcük sayabileceğimiz“yed-i ûlâ”öbeği ile“verme pozisyonuna sahip kimse”;“yed-i süflâ”öbeği ile de“imkânsızlık yüzünden başkalarından bir şeyler istemek durumunda kalan kimse”anlamlarının kastedildiği kanaatine varılmıştır. Ayrıca sözü edilen hadisin muhtevası ile tasadduk, cömertlik, cimrilik ve dilencilik kavramları arasında irtibat kurulmuştur. Klasik hadis literatüründe ağırlıklı olarak zekât, sadaka, bağış gibi maddi paylaşım yollarıyla ilişkilendirilen bu hadisin, bazı güncel yorumlara da konu edilebileceği görülmüştür."
