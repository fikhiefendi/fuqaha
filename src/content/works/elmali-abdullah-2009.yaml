abstract: "Abdullah b. Mes'ûd ilk Müslümanlardan olup, Müslüman olduktan sonra hayatını Peygamber'e hizmet etmeye, gece-gündüz onunla beraber bulunmaya çalışmış bir sahabidir. İlmi yeteneği Peygamber tarafından da tespit ve takdir edilmiş bu sahabinin İslam hukukunun oluşum sürecinde çok büyük katkıları olmuştur.Bu düşünceden hareketle yaptığımız çalışmamız giriş ve iki bölümden oluşmaktadır.Giriş bölümünde Peygamber ve Sahabe dönemlerinde fıkhın durumunu ve kaynaklarını ele aldık.Birinci bölümde, İbn Mes'ûd'un hayatını inceledik. Bu bağlamda onun yetişme süreci, gerek Peygamber dönemi, gerekse dört halife döneminde üstlendiği resmi görevleri ve halifelerle ilişkileri üzerinde durduk.İkinci ve son bölümde ise İbn Mes'ûd'un hüküm verirken izlediği metodu tesbit edip, bu metodun pratikteki uygulamaları olan, verdiği hükümleri sistematik olarak sunduk."
titleTranslation: {"en": "Abdallah b. Mas?ûd as a scholar of Islamic Law"}
