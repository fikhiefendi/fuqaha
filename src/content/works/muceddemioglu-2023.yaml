abstract: "Araştırmacı bu tezde, göçmenlere ve mültecilere yönelik zorbalık meselesini ele alacak ve bu sorunu İslam hukuku ve yasalarıyla nasıl çözebileceğini inceleyecektir. Ayrıca, zorbalık konusu okullarda ve öğrenciler arasında incelenen bir konu olduğu için, bu çalışma bu araştırmalarla karşılaştırmalar yapacak ve göçmenlere ve mültecilere yönelik zorbalık arasındaki farklara dikkat çekecektir. Bu amaçla, zorbalığın tanımı, unsurları, nedenleri ve sonuçları ile genel etkenleri hakkında bilgi sunulacaktır. Aynı zamanda, göçmenler ve mültecilerin tanımı ve üzerlerindeki zorbalık türleri, anketler ve medyada yer alan verilerle ele alınacaktır. Tezin ikinci bölümünde, bu sorunun İslam hukukuyla nasıl ele alınabileceği incelenecek ve Kur'an'da şiddet olaylarının tedavi edilmesine yönelik ayetlere vurgu yapılacaktır. Ayetler, insanlar arasındaki kardeşlik ve eşitlik çağrılarını içermektedir ve bu ayetler tek başına yeterlidir. Sonrasında, İslam peygamberi Hz. Muhammed'in hadisleri gözden geçirilecek ve tüm insanlar arasında eşitlik ilkesine vurgu yapan hadisler öne çıkarılacaktır. Ayrıca, ırk, renk, boy veya kısa boyluluk gibi özellikler nedeniyle insanlara hakaret etmek, küçümsemek veya ayrımcılık yapmak yasaklanacaktır. Ayrıca, sahabe dönemindeki çabalar ve alınan kararlar da ele alınacak ve İslam hukukundaki suçlar, cezalar ve zorbalıkla ilgili düzenlemeler gözden geçirilecektir. Sonraki bölümde, modern düzenlemeler ve toplum kuruluşları tarafından uygulanan tedavi programları ele alınacak ve elde edilen sonuçlar ve öneriler sunulacaktır. Başarım ancak Allah'tandır. Yalnız O'na tevekkül ettim ve O'na yöneldim."
