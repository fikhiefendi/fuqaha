abstract: "Bu çalışma, XVII. yüzyılın önemli İslâm âlimlerinden biri olan Ali el-Kârî'nin, (ö. 1014/1605) fıkıh bâblarına göre telif edilmiş ilk eserlerden sayılan Muvatta'ın Şeybânî nüshasına yazdığı şerh üzerinde deteylı bir inceleme sunmaktadır. Söz konusu eser, bu nüshaya yazılan ilk şerh olması bakımından Hanefî mezhebi açısından büyük önem taşımakta; aynı zamanda Muvatta' üzerine yapılan ilk Hanefî şerh olması yönüyle de özgünlük arz etmektedir. Çalışmada Ali el-Kârî'nin hayatı, eserleri ve İlim dünyasındaki yeri genel hatlarıyla ele alınmıştır. Özellikle Muvatta' şerhi üzerine yoğunlaşan bu çalışma; şârihin eseri kaleme alma amaçlarını, kullandığı yöntemleri ve ortaya koyduğu orijinal görüşleri tesbit etmeyi hedeflemektedir. Ali el-Kârî'nin Muvatta'ı şerh ederken benimsediği yöntem ve teknikler, günümüz İslâm hukuku çalışmalarına da ışık tutmaktadır. Ali el-Kârî'nin şerhi, hadis metinlerinin tefsiriyle sınırlı kalmayıp; fıkıh, usûl ve tefsir gibi birçok İslâmî ilimlere dair kapsamlı bilgiler içermektedir. Şârihin bu bilgileri hangi kaynaklardan elde ettiği, çalışmasında hangi âlimlerin görüşlerine yer verdiği gibi sorular, çalışmanın bir diğer önemli boyutunu oluşturmaktadır. Bu çalışma neticesinde şârihin şerh metodu ve özgün yönleri ortaya konularak Ali el-Kârî'nin ilmî kişiliğinin ve Muvatta'ın Şeybânî rivâyetinin daha iyi anlaşılmasına katkı sağlanmıştır. Ayrıca, bu çalışma aracılığıyla dönemin şerh yöntemine dair genel bir bakış sunulmuştur. Şârihin, eserinde naklettiği görüşleri ve eserdeki özgün fikirleriyle İslâm hukuk ve düşünce dünyasına katkılarda bulunduğu değerlendirilmektedir. Çalışma neticesinde elde edilen bulgular sonuç kısmında sunulmuştur."
