abstract: "Bu tez gelişmiş ve gelişmekte olan ülkelerde piyasa etkililiğini sosyal ve yapısal olmak üzere türlü değişimler şeklinde farklı ekonomik sistemlerde analiz etmektedir. Merkezi planlı ekonomi, piyasa ekonomisi, geleneksel ekonomik sistem ve karma ekonomi olmak üzere mevcut ekonomik sistemler anlatılmakta, bunun yanı sıra, kapitalizm, sosyalizm, faşizm, kommunizm türleri ve genel felsefeleri, yarar ve zararlarıyla kıyaslanarak incelenmektedir. Öncelikle, her ekonomik sistem bağımsız olarak incelenmekte ve sonrasında diğer ekonomik sistemlerle karşılaştırılarak kıyaslanmaktadır. Araştırma kapsamında Islam ekonomisine de değinilmiş, belirgin özellikleri ile ele alınmış ve karşılaştırılmıştır. Bu tezin asıl amacı mevcut ekonomik sistemleri, avantaj ve dezavantajlarını nedenleriyle birlikte açıklayarak insanlık tarihinin geçmiş olduğu süreçte ve günümüz ekonomisinde yaşanmış ve yaşanmakta olan sorunlara bu tarihsel sürecin bir parçası olarak asıl çözüm önermektir. Analizler yapılırken çağdaş manzaranın arka planı, genel bilgilerini sağlamak amacıyla nüfus, icat ve buluşlar için göstericiler, intihar oranı, intihar oranı ve meslek ilişkisi, doğurganlık oranı, bebek ölüm oranı, cinayet, işsizlik ve evsizlik oranları da incelenmiştir. Incelemelerin makro düzeyde yapılması nedeniyledir ki, bir sıra ülkelerin göstericilerinin analizi mevcut ekonomik sistemlerin karşılaştırmalı mukayesesi ve ayrıntılı tanımlanmasına olanak sağlamıştır. Analizler sonucu ulaşılan kanaat tarihi gelişim sürecinin bir parçası olarak kaçınılmaz olduğu öngörülen bir ekonomik sistemin kapitalizm sonrası süreçte ortaya çıkarak gelişmekte olacağı ve insanlık tarihinin ilim ve bilim noktasında zirveye ulaşacağı bir dönemi kapsayacağı vi yönündedir. Bu sistemden merkezi özelliği kapital olan kapitalizmden, asıl amacı toplumun yararı için bazılarının zararına gözlerini kapatan sosyalizm ve komunizmden farklı olarak temel değer olarak insanı (human) aldığı için humanizm diye bahs edilmekte. Humanizm olarak belirlenmiş bu ekonomik sistem insani değerler ve adaleti temel almaktadır. Bu ekonomik sistemin asıl amacı birisi için her kesin ve her kes için birisinin çalışıyor olması. Ana felsefesi“hepimiz birimiz, birimiz hepimiz için”olan bu ekonomik sistem yalnız yüksek teknoloji ve bilim sonucu olarak sivil bir toplumda gerçekleşmektedir. Bu tezde gelişmiş ve gelişmekte olan ülkeler için uygun olarak iki farklı model önerilmiştir. Mevcut ekonomik sistemlerin karşılaştırmalı analizi avantaj ve dezavantajların nedenlerini ortaya çıkarmanın yanı sıra aynı noktada avantaj olarak görünen özelliğin ikinci dereceli etken sonucu aynı zamanda sistem için dezavantaj olarak görüne bildiğini de denetlemiştir. Bu nedenle özellikler“direct reason”direk neden ve“secondary effect”ikincil etki olarak ele alınmış ve sonuç itibarile diğer ekonomik sistemlerin artı ve eksileriyle kıyaslanarak kaçınılması imkansız bir sürecin doğru yönetile bilmesi için humanizm dediğimiz ekonomik sistem çözüm olarak önerilmiştir. Bir zamanlar için ülkenin ekonomik düzeydeki başarısının ölçüsü diğer makro göstericilerin yanı sıra gayri safi yurtiçi hasılaydıysa, günümüz itibarile dünya ekonomisi ekonomik verimliliği mutluluk ve refah oranları olarak nitelendiriyor. Bu nedenle araştırma sırasında toplumsal ve yapısal değişimlerin tetikleyici unsuru olarak mutluluk ve refah oranları farklı ülkeler için kıyaslanmıştır. Mutluluk ve refah oranlarının humanizm dediğimiz ekonomik sistemde zirve yapacağı öngörülmüştür."
