abstract: "Ebu'l-Hüseyin el-Kudûrî'nin (v. 428) kaleme aldığı el-Muhtasar adlı eseri İslam Hukuku alanında önemli bir konuma sahiptir. el-Muhtasar üzerine yüzden fazla çalışma yapılmıştır. Bu çalışmaların tamamına yakını yazma eser halindedir. Bu eserlerin en önemlilerinden biri, kendisinden sonra yazılanlara kaynaklık etmesi açısından ez-Zâhidî'nin (v. 658) Müctebâ'sıdır.el-Muhtasar'da kısa ve öz alarak anlatılan hükümler Müctebâ'da ayrıntıları ile ele alınmıştır. Kitapta her hükmün kaynağı (müellif/ kitap), isim veya rumuzuyla gösterilmiştir. Eserde el-Muhtasar'dan farklı olarak diğer mezheplerin görüşlerine de yer verilmiştir.Çalışmamız dirase (araştırma) ve tahkik (edisyon kritik) bölümlerinden oluşmaktadır. Birinci bölümde müellif ve şârihin hayatından, hocalarından, öğrencilerinden ve eserlerinden bahsedilmiştir. İkinci bölümde ise, Müctebâ adlı eserin Kitâbü'n-nikâh bölümünün edisyon kritiği sunulmuştur. Metin, eserin Konya ve Manisa Kütüphaneleri'nde bulunan dört nüshası karşılaştırılmak sureti ile oluşturulmuştur. Eserde geçen ayet, hadis, şiir, Farsça ibareler, kitap ve şahıs isimleri hakkında dipnotlarda açıklamalarda bulunulmuştur."
