abstract: "Zina suçu ailenin doğal temellerinde meydana gelen bozulmalar karşısında toplumun hissettiği tedirginliği ifade eder. Ne zaman ki bir kimsenin bir kadınla cinsel ilişkiye girilirse, ailevi yükümlülük ve ödevler ihlal edilmiş olur. Zina günümüzde artık eski toplumlarda olduğu gibi ölüm cezasını gerektiren en ağır suç olarak kabul edilmemektedir. Bundan dolayıdır ki, Kur'an'ın yanı sıra Kongo ceza hukukunun toplumsal düzenle çatışma içine girmeleri halinde cinsel sapmaların çeşitlilik ve çokluğu karşısında öngördükleri yaptırımlar sorgulanmaktadır."
