abstract: "İslam idare hukukunda ilk defa Şafii fakihi Maverdi (ö. 1058) tarafından kullanılan Ahkâm-ı sultaniye terimi hakkında nass bulunmayan konularda hükümler vaz etmek ve hakkında nass bulunan konulardaki hükümleri de uygulamak için İslam idare hukukunda başvurulan bir yöntemi ifade etmektedir. Başka bir deyişle Ahkâm-ı sultaniye, devlet başkanı, devletin esas teşkilâtı, idarî, malî, adli yapısı ve işleyişiyle ilgili ihtiyaç duyulan bazı yeni hükümlerdir. Ahkâmü's-sultâniyye, aynı zamanda söz konsu hükümleri konu alan hukuk dalının ve bu alanda yazılmış ilki Mâverdî'ye, ikincisi Ebu Ya'la el-Ferra'ya (ö. 1066)'ya ait iki kitabın da adıdır. Abbasi Halifeliğinin siyasi-askeri yetkilerini devrettiği Şii Büveyhi hanedanının yıllarda tam adı el-Ahkamü's-sultaniye ve'l-velayatü'd-diniyye olan eserini Abbasi Halife'sinin isteği doğrultusunda yazmıştır. Bu eserini yazmadaki asıl amacının siyasi gerçekliğe meşruiyet kazandırmak olduğu anlaşılıyor. Ahkâmü's-sultâniyye'nin Hicri V/ Miladi XI. yüzyılda ortaya çıkışını konu alan tezimiz giriş ve iki bölümden oluşmaktadır. Girişte, İslam dünyasının Hicri V. asırdaki dini, siyasi, iktisadi ve kültürel durumu anlatılmış, doğu islam dünyasında dini liderliği elinde bulunduran Abbasi Halifeliği ile siyasi ve askeri gücü elinde bulunduran Büveyhiler (945-1055) ve onların halefi Büyük Selçuklular (1040-1157) arasındaki ilişkiler üzerinde durulmuştur.“Ahkam-ı Sultaniye'nin Ortaya Çıkışı ve Tarihsel Gelişimi”başlığını taşıyan birinci bölümde, bölümün girişi mahiyetinde İslam siyaset düşüncesi ve devlet geleneğine değinildikten sonra ahkam-ı sultaniye terimi ve ve çoğu kez onunla eşanlamlı olarak kullanılan 'siyaset-i şeriye' üzerinde durulmuş ve ikisi arasındaki fark belirtilmiş, ilk Ahkam-ı Sultaniye kitabı ve yazarı Maverdi tanıtılmış ve ahkam-ı sultaniye literatürünün ortaya çıkış sebepleri incelenmiştir.“Ahkam-ı Sultaniye'nin İslam İdare Hukukundaki Yeri ve Önemi”başlığını taşıyan ikinci bölüm ise sırasıyla şu üç alt başlıktan oluşmaktadır: Ahkam-ı Sultaniye'nin Teşrî Kaynakları, Ahkam-ı Sultaniyenin Meseleleri ve Konuları ve Ahkam-ı Sultaniye ve Makasıdü'ş-Şeria."
