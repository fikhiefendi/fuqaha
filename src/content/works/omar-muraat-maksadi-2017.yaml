abstract: "Kitab ve Sünnette Adalet İlkesinin Gözetilmesi konu edinen bu çalışma، giriş ve dört bölümden oluşmaktadır. Giriş bölümünde, adalet ve maksat kavramlarını lügat ve ıstılah açısından tarif ettim ve adaletle ilgili müteradif kavramlar ile Kur'an ve sünnetin adalet yaklaşımına yer verdim. Sonra adaleti، mekasıdü'l-hamse (beş maksat) bağlamında açıkladım. Birinci bölümde, Kitab ve sünnette adalet ilkesinin gözetilmesini، ilahi yönüyle ele aldım ve ister sevapta ister cezada olsun“hiç kimsenin bir başkasının yükünü yüklenmeyeceği”şeklindeki ilahi kaideyi tespit ettim. Daha sonrasında öldürme, zina, içki içme، hırsızlık, riddet (dinden dönme), hirabe (yol kesme), kazif (iftira) ve bağy (ayaklanma) suçlarıyla ilgili ceza hukukunda sabit olan maksatları, Kur'an'ın ve günümüzün bakış açısıyla ele aldım ve bu had cezalarını، cahiliye dönemi Arap düşüncesi ile Yahudi düşüncesinden ayırdım. İkinci bölümde، Kitap ve sünnette adalet ilkesinin gözetilmesini, kazai yönüyle ele aldım. Bununla ilgili olarak yargının bağımsızlığı, hâkimliğin şartları, insanların zan ve şüpheyle suçlanamayacağı ve şüphelinin suçunu ikrar etmesi için işkence ve hakaret yoluyla zorlanamayacağı gibi konulara yer verdim. Üçüncü bölümde, Kitab ve sünnette adalet ilkesinin gözetilmesini, kapitalist ve sosyalist anlayışa nazaran ölçülülük، itidal ve ılımlılık esasına dayalı bir düzen olan İslam iktisadı açısından ele aldım. Burada zekât, sadaka، cizye, haraç, öşür, vergiler, ganimet, fey, meşru olan ve olmayan akitlerle ilgili açıklamalar yaptım. Dördüncü bölümde, Kitab ve sünnette adalet ilkesinin gözetilmesini، siyasi açıdan inceledim. Buna göre devletin ayakta kalması için gereken ve yöneticiliğin şartlarından biri olan adalet ile savaş, savunma ve barış durumunda Kur'an ve sünnetin belirlediği adaleti açıkladım. Konuyu, Kur'an ve sünnetin siyasette öngördüğü en büyük maksatlardan olan eşitlik ve istişareyi merkeze alarak değerlendirdim. Son olarak önemli gördüğüm neticelerle bu çalışmayı bitirdim."
