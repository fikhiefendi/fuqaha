abstract: "Kısas öldürme veya yaralama suçunu işleyen kişiye misliyle mukabele edilmesi anlamına gelmektedir. Kur'ân-ı Kerîm'de kısas emredilmiştir. Hz. Muhammed (s.a.v) de bizzat kısası uygulamıştır. Çalışmamızın konusunu kısas ile ilgili Kütüb-ü Sitte'de yer alan hadis rivayetleri ve değerlendirmesi oluşturmaktadır. Konu ile ilgili hadisler isnad ve metin açısından ele alınmıştır. Kütüb-ü Sitte'de yer alan kısas ile ilgili bütün rivayetlere tezimizde yer verilmiştir. Hadis iki kısımdan oluşmaktadır: İsnad ve metin. İsnad kısmında hadisi rivayet eden raviler bulunmakta, metin kısmında ise Hz. Muhammed (s.a.v)'in söz, fiil ve takrirleri yer almaktadır. İsnadda bulunan bütün raviler güvenilirlik yönünden incelenmiştir ve ravilerin güvenilir olduğu tespit edilmiştir. Kısas ile içtihadlara başlıklar halinde yer verilmiştir. Kısasın kişilerin suçlarının karşılığını misliyle almaları noktasında caydırıcı bir müeyyide olup hükmünün Kur'ân-ı Kerîm ve sünnet ile sabit olduğu ve kısas ile ilgili rivayet edilen hadislerin sahih olduğu sonucuna ulaşılmıştır."
