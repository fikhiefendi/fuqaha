abstract: "Şer'î deliller, fıkıh usulü ilminin en önemli konularındandır ve delillerden hüküm elde etme yöntem ve metotlarını incelemesi bakımından fıkıh usulünün de temelini oluşturur. Şer'î delillerin kitap, sünnet, icmâ ve kıyasla sınırlı olmadığı, İslam âlimleri tarafından kabul görmüştür ve her fıkıh doktrini bu dört aslî delil dışında bazı deliller geliştirmiştir. Kimi usulcüler söz konusu dört delil dışındaki bütün delilleri istidlâl çatısı altında toplamaya çalışmıştır. Daha çok mütekellimîn usulcülerinin sergilediği bu tavır, istidlâlin geniş yelpazeli kullanımını yansıtır. Dört temel şer'î delil dışındaki delillerin neler olduğu tartışmalıdır. Bu nedenle istidlâlin mahiyeti, işlevi ve kapsamına ilişkin usulcüler arasında birtakım farklılıklar bulunmaktadır. Âmidî de, dört şer'î delil dışındaki delilleri istidlâl çatısı altında ele alan usulcülerdendir. Ona göre istidlâl, nas, icmâ ve kıyasın kullanılamadığı durumların tamamını kapsayan şemsiye bir kavramdır. Buna göre o, istidlâlin kapsamını kıyas dışındaki aklî çıkarımların tamamını kuşatacak şekilde geniş tutmaktadır. Bu çalışma Seyfeddin el-Âmidî'nin istidlâl tasavvurunu yaptığı taksim ve tasnifi esas alarak ortaya koymayı amaçlamaktadır. Onun istidlâle yönelik tavrının ortaya konulması ve böylece bahse konu meseleye yaklaşımının netleştirilmesi hedeflenmektedir. Bu amaçla Âmidî tarafından şer'î delil olarak sayılan istidlâl üzerinde durularak, meselenin farklı cihetlerde irdelenmesi gaye edinilmiştir. Böylelikle istidlâlin, onun usul düşüncesindeki konumu ve icra ettiği fonksiyon netleştirilmeye çalışılmıştır. Bu çerçevede öncelikle istidlâl kavramının mahiyeti ortaya konulmuş ve tarihsel gelişimi de dikkate alınarak mahiyeti ile ilgili yapılan tartışmalar zikredilmiştir. Bu bağlamda istidlâlin diğer disiplinlerdeki kullanımları mukayeseli bir şekilde ele alınmaya çalışılmıştır."
