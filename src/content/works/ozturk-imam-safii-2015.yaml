abstract: "İslam Hukuk Metodolojisi olarak ifade edebileceğimiz 'fıkıh usulü'nde istihsan delilinin önemli bir yeri bulunmaktadır. Zira istihsanı şer'î bir delil olarak kabul edip onunla birçok meselede hüküm verenler olduğu gibi istihsanı delil olarak kabul etme bir tarafa ona şiddetle karşı çıkanlar da olmuştur. Bu çalışma, istihsana şiddetle karşı çıkan İmam Şâfiî'nin 'ibtâlü'l-istihsan'ına karşı erken dönem Hanefî usulcülerinin Şâfiî'ye nasıl cevap verdiklerini ortaya koymak üzere hazırlanmıştır. Çalışmamız giriş, üç bölüm ve bir sonuçtan oluşmaktadır. Giriş bölümünde araştırmanın amacı, önemi, metodu ve kaynaklarından bahsedilmiştir. Birinci bölümde istihsan kavramının hakikat ve mahiyetini ortaya koyacak konular ele alınmıştır. Bu bağlamda öncelikle istihsanın lügat ve terim anlamı ile istihsanın gelişimi, daha sonra da istihsanın çeşitli hukuk ekolleri yanındaki delil değeri ve istihsanın kısımları ele alınıp incelenmiştir. İkinci bölümde, İmam Şâfiî'nin hayatı, fıkıh usulündeki yeri, Şâfiî'ye göre İslam Hukuku'nun kaynakları ve İmam Şâfiî'nin 'ibtâlü'l-istihsan'ının analizi üzerinde durulmuştur. Üçüncü bölümde erken dönem Hanefî usulcüleri diyebileceğimiz Kerhî, Cessâs, Debûsî, Pezdevî ve Serahsî'nin istihsan anlayışı ile İmam Şâfiî'nin 'ibtâlü'l-istihsan'ına karşı verdiği cevaplar ortaya konulmuştur. Çalışmamız, elde ettiğimiz verilerin değerlendirildiği sonuç bölümüyle tamamlanmıştır."
