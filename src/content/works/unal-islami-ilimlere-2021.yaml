abstract: "Siyaset insanların toplum halinde yaşamaya başlamalarıyla birlikte ortaya çıkmıştır ve insanlık tarihi kadar eskidir. İslam inancında insanlık ile birlikte din de başlamıştır. Din ve siyaset arasındaki ilişkiler insanlık tarihinin her döneminde birbirleri ile ilişkili olmuş ancak bu ilişki ve etkileşim yer ve zamana göre farklılıklar göstermiştir. Aynı durum İslam ve siyaset için de söylenebilir. İslam düşüncesinde insan bilen ve akleden bir varlık olarak sadece Tanrıyla değil toplum ve doğa ile ilişkisine dair sorumlulukları olan bir varlık olarak kabul edilir. İslam bu ilişkileri ontolojik bir düzeyde varoluşsal bir mesele olarak görür. Modern toplumlarda siyaset ve din ayrı alanlara özgü disipliner alanlar olsa da siyasi düşünceler tarihi bu ikisi arasındaki ayrımların ne ontolojik ne de epistemolojik düzeyde net olmadığını gösterir. Söz konusu İslam düşünce gelenekleri olduğunda siyasetin bu geleneklerin hepsi içinde önemli bir mevzu olduğu görülmektedir. İslam düşünürlerinin siyasete dair fikirlerinde insan, akıl ve irade sahibi özgür bir bireydir ve bundan dolayı da sorumluluk sahibidir. İnsan yaptıklarından ve yapmadıklarından sorumludur. İslam'da birey iyiliği emredip kötülükten nehyetmekle sorumludur. Bu çalışmada, İslam siyaset düşüncesinin içinde yer aldığı fıkıh, kelam, ahlak, tasavvuf, siyasetname ve felsefe alanlarındaki klasik kaynaklarda siyaset düşüncesi incelenmeye çalışılmıştır. Bu çalışma İslam'ın siyasal (devlet, yönetim, vb) öğretilerinin bu ana akım disiplinler içinde bile bir çoğulluğu barındırdığı ve tek tip bir yaklaşımın mümkün olmadığını göstermeyi amaçlamaktadır."
