abstract: "Hz. Peygamber'in (s.a.s.) vefatının ardından birçok âlim, Kur'ân, sünnet ve bu iki kaynaktan beyân edilen hükümleri anlama amacıyla çeşitli usûlî yaklaşımlar geliştirmiştir. Bu bağlamda erken dönem İslâm düşüncesinde önemli bir yer edinen İmam Şâfiî (ö. 204/820), er-Risâle adlı eserinde“beyân”kavramı etrafında şekillendirdiği sistematik yaklaşımıyla dikkat çekmektedir. Bu çalışmada, onun beyân nazariyesi ile sünnet arasındaki ilişki, doğrudan kendi metinlerine dayanarak analiz edilmiştir. İmam Şâfiî beyânı doğrudan tanımlamasa da ifadelerinden beyânın, mütekellimin muhatabına muradını açıklaması; bu bağlamda da Allah'ın muradını kullarına izharı anlamına geldiği anlaşılmaktadır. Tanım gibi görünen bazı açıklamaları ise kavramın kapsamını ortaya koymaya yöneliktir. Eserinde beyânın kısımlarını farklı yerlerde farklı şekillerde taksim etmesi bir tutarsızlık olarak değil, kimi yerlerde özet, kimi yerlerde ayrıntılı bir sunum yapmış olmasıyla açıklanabilir. Beyân taksimine icmâyı dahil etmemesinin gerekçeleri de bu çerçevede değerlendirilmiştir. Sünnetin otoritesini temellendirirken Şâfiî, onun vahiy olup olmamasından ziyade, itaatin ilahî bir buyruk oluşunu esas alır. Bu yaklaşım, sünneti bağlayıcılığı açısından Allah'ın muradını açıklayan bir araç olarak konumlandırdığını göstermektedir. Arap dili vurgusu ise etnik değil, Arapçaya vukufiyetle ilişkilidir. Şâfiî, arz hadisini reddetmiş olsa da Kur'ân'a arz uygulamasını tümüyle reddetmemiş, itirazını sünnetin beyân fonksiyonu göz ardı edilerek yapılan anlayışa yöneltmiştir. Bu çerçevede, onun sünnete atfettiği rol incelenmiş; söz konusu yaklaşımının, sünneti Kur'ân'la aynı düzeyde konumlandırmak anlamına gelip gelmediği sorusu, kendi ifadeleri ışığında değerlendirilmiştir. Son olarak, nesih anlayışı da beyân nazariyesi çerçevesinde ele alınmış; görüşlerinin bu sistematikle çeliştiği yönündeki eleştiriler, metodolojik gerekçeler ışığında değerlendirilmiştir."
