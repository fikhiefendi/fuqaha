abstract: "İslâm Hukuku, canlı ve yürürlükte olan bir hukuk sistemidir. Bunu naslara dayalı olarak yapılan içtihatlarla gerçekleştirmiştir. Mecelle'de ifade edildiği gibi“Zamanın değişmesiyle, hükümlerin değişmesi inkar edilemez.”Delilini bilmeksizin başkasının hüküm ve re'yi ile amel etmek anlamına gelen ve içtihadın tam zıddı olan taklit, bilginlerin çoğu tarafından hoş görülmemiştir. Farklı görüş ve hükümleri birleştirmek anlamına gelen telfik ise VII. asır'dan itibaren usûlcüler arasında tartışılan bir konu olmuştur.İslâm Hukukunda içtihada dayalı bir mesele olan telfik, genellikle fıkıh usûlü kaynaklarının taklit bölümünde ele alınmıştır. Aynı zamanda özel risâlelere de konu olmuştur.Çalışmamız üç bölümden oluşmaktadır. Birinci bölümde, taklidin tanımı, taklidin uygulama alanı ve taklidi caiz görüp görmeyenler ve gerekçelerini ele aldık. İkinci bölümde, içtihatta ve taklitte telfiki inceledik, üçüncü ve son bölümde ise İslâm Hukukunda telfik, İslâm Hukuk ekollerinin telfike bakışı ve sakıncalı olan telfikin ne olduğu üzerinde durduk."
