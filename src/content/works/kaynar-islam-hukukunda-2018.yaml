abstract: "Araştırmamız bir giriş, iki bölüm ve sonuçtan oluşmaktadır. Bir ve ikinci bölümlerde malın tanımı ve buluntu ile ilgisi olan kısımları ile mülkün tanımı, çeşitleri ve mülk edinme yollarından bahsedilmiştir. Bulunan bir şeyin lukataya konu olabilmesi için o malın mütekavvim, menkul ve sahipli olması gerekir. Tazmin açısından ise mislî ve kıyemî mal olabileceğinden bahsedilmiştir. İlana etkisi açısından ise tüketilen ve kullanılan mal ayrımına tâbi tutulmuştur. Ayrıca buluntu malın tanımı, mahiyeti ve rükünleri olan iltikat (buluntu malı yerden alma işlemi) ve mültakit (buluntu malı yerden alan kişi) ele alınmıştır. Buluntu malın yerden alınmadığında zâyi olma riski bulunduğunda o malın alınmasının farz olduğundan ve zâyi olma riski yoksa iltikatın yâni yerden alma işleminin mübah olduğundan bahsedilmiştir. Ayrıca mültakitin hukûkî şahsiyeti, görevleri, hakları vb. konulardan bahsedilmiştir. Buluntu malı alan kimsenin neleri yapması gerektiğinden, hangi durumlarda malın emanet hükmünde olduğu hangi durumlarda gasp olup tazmin edilmesi gerektiğinden bahsedilmiştir. Üçüncü bölümde ise üçüncü rükün olan lukatadan (buluntu mal), süresi içinde sahibi bulunamayan mallara yapılabilecek işlemlerden ve günümüzde bazı kurumlarda lukata uygulamasından bahsedilmiştir. Araştırmada genel olarak dört mezhebin klasik kaynaklarından yararlanılmış ancak ağırlıklı olarak Hanefî mezhebine yer verilmiştir."
