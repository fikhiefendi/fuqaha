abstract: "Bu çalışmanın temel amacı, Türkiye'de özellikle 1980 sonrası yaşanan toplumsal değişim sürecinde din – ekonomi ilişkisinin farklılaşmasıyla gözlemlenen çatışma alanlarını, modern yapıya uygun meşrulaştırma çabalarını ve değişimleri kaynaklarıyla birlikte anlamaya çalışmaktır. Modernite ve sekülerleşmenin sonucu olarak dinin bireyler ve toplumsal hayattaki etkisi biçim ve içerik olarak farklılaşıyor. Bu farklılaşma bir taraftan dinin toplumsal hayattaki etkinliğinin daha da arttığı şeklinde yorumlanıyor, bir taraftan da dinsel olanın görünürlüğünün artışı paradoksal olarak dinin toplumsal hayattaki etkinliğinin zayıflaması olarak yorumlanıyor. Bu süreç dindar bireyin ekonomik faaliyetlerinde de etkisini gösteriyor. Ekonomik alana dair dini bağlılığının getirdiği bir takım ilke ve tutumları benimsemiş birey ekonomik alanda faaliyet gösterirken çatışmalar ve çelişkiler yaşayabiliyor. Bireylerin kararlarını dini bağlılıklarının mı yoksa ekonominin rasyonel ilkelerinin mi şekillendirmesi gerektiği bu çelişkiyi yansıtıyor. Ayrıca, modernite ve sekülerleşme bireylerin modern kurumlara uygun şekiller almasına sebep olurken toplumsal hayatın merkezinde yer alan ekonomik alanın temel özellikleri ve varsayımlarının bireylerin zihin dünyasını ve toplumsal alanı şekillendirmesi de bireyleri özerk bir doğaya ve işleyişe sahip olarak kavranan ekonomi kurumuna uygun şekiller almaya yönlendiriyor. Aynı zamanda dini ve ekonomik alanın genel eğilimini oluşturan bireycilik fikrinin etki alanını artırması bireylerin gittikçe toplumsal olandan uzaklaşmasına da sebep olarak, toplumsal problemlerim çözümünü güçleştirirken bireyleri de mevcut yapılara uyum sağlamaya yönlendiriyor. Modernleşme, bireycileşme, sekülerleşme tezi, iktisat, iktisat tarihi ve İslam iktisadına ilişkin tartışmalar bu tezin teorik çerçevesini oluşturuyor. Din ve ekonomi ilişkisini konu edinen saha çalışmalarından elde edilen bulgulardan faydalanılarak konu bireylerin bakış açılarından yorumlanıyor. Sonuç olarak; dindar bireylerin ekonomik alanda yaşadıkları çelişkilerini çoğunlukla ekonomik hayatın gereklerine uyum sağlayarak çözümledikleri görülmektedir."
