abstract: "İbnü'l-Münzir künyesiyle tanınan, 241/855 ile 318/930 yılları arasında yaşamış Ebû Bekr Muhammed b. İbrâhîm b. Münzir en-Nîsâbûrî; fıkıh tarihinde sahibu'l-hilâfiyât olarak temayüz etmiş bir fakihtir. Hilâf ilminin öncüsü olan İbnü'l-Münzir, icmâ ile ihtilâf edilen fıkhî meseleleri ve mukayeseli fıkhı en kapsamlı şekilde ele alan ilk kaynakların sahibidir. İbnü'l-Münzir, fıkhî içtihatlarında kitap, sünnet, icmâ, sahâbe kavli, kıyas, istishâb, nazar ve ekallu mâ kîl gibi şer'î delilleri kullanmış olmakla beraber ehl-i hadîs çizgisini takip etmiştir. Deliller arası teâruzun giderilmesinde muhaddislerin metodunu uygulamıştır. Yöntem olarak bir mezhebe bağlanmayıp bütün mezheplerden istifade etme yolunu benimsemiştir. Bu çalışma, imam İbnü'l-Münzir'in daha iyi tanınmasını ve fıkıh düşüncesini tespit etmeyi amaçlamaktadır. Bu çalışmada \"İbnü'l-Münzir'in hayatı, ilmî kişiliği ve İslâm Hukuk tarihindeki konumu\" bölümünde, bunlara ilişkin konuların tespiti ve izahı üzerinde durulmuştur. \"İbnü'l-Münzir'in usûlî görüşleri\" bölümünde, fıkıh usûlüyle ilişkisi, kullanmış olduğu şer'î deliller, istinbât metodu, nasların teâruzunda takip ettiği metot, usûlünün karakteristik yapısı ve bunlarla ilgili öne çıkan konular hakkındaki tespit ve değerlendirmeler konu edilmiştir. \"İbnü'l-Münzir'in fıkıh anlayışı\" bölümünde ise, fıkhının karakteristik yapısı, \"kitabu't-tahâret\" örneği üzerinden usûlüne bağlılığı ve diğer müctehidlere muhalif görüşleri gibi konular ele alınmıştır. Çalışmada, İbnü'l-Münzir'in mutlak ictihad ehliyetine sahip olduğu, bazı konular haricinde çoğunlukla Şâfiî usûl anlayışıyla hareket ettiği, azımsanmayacak derecede cumhura muhalif fıkhî görüşlerinin olduğu sonucuna varılmıştır. Fıkhî tercihleri yapma konusunda, hadislerin sıhhatini, ayrıca icmâ ve ihtilâf konularını çok önemsediği, âyet ve hadislerle amel etme noktasında onların zâhir ve umûm yönlerini öne çıkardığı tespit edilmiştir. Anahtar Sözcükler İbnü'l-Münzir, Mezhep, Fıkıh Usûlü, Müctehid, Fıkhî Görüş, İlm-i Hilâf"
