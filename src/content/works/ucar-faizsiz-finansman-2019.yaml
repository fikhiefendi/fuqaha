abstract: "Bu çalışmanın temel amacı, faizsiz finansman modellerine yönelik tüketici eğiliminin/davranışının Planlı Davranış Kuramına (PDK) göre geçerliliğini test etmektir. Ayrıca çalışma, faizsiz finansmana yönelik tüketici eğilimlerine dair gerek Türkiye'de gerekse Müslüman nüfusun yoğun olarak yaşadığı ülkelerde yapılan çalışmalarda geçen hipotezlerin de geçerliliğini PDK'ye göre test etme amacındadır. Bunun için öncelikle kuramın temel değişkenlerinden tutum, öznel norm ve algılanan davranışsal kontrol değişkenleri ilgili literatürdeki çalışmalara göre yeniden tanımlandı. Tanımlanan bu değişkenler, ankete bölümler halinde dahil edilerek ki-kare testine göre analiz edildi. Daha sonrasında, anketin ilgili bölümlerine Cronbach Alfa testi uygulanarak analize tabi tutuldu. Toplam da 235 kişilik olan araştırmanın sonuçlarına göre, PDK'nin değişkenlerinden tutum değişkeninin faizsiz finansman modellerine yönelik tüketici davranışını belirlediği tespit edilmiştir. Bunun yanı sıra, öznel norm değişkenini tanımlayıcı faktörlerden“faizden kaçınma”faktörü de bu finansman yöntemlerine yönelik tüketici davranışını ön gördüğü gözlenmiştir. Fakat ki-kare testine göre öznel norm ve algılanan davranışsal kontrol değişkenleri tüketici davranışı üzerinde tutarlı sonuçlar vermemiştir. Ayrıca, spesifik olarak Türkiye örnekleminde, PDK kullanılarak faizsiz finansman modellerine yönelik tüketici davranışı konusunda literatürde benzer bir araştırmaya rastlanılmamıştır. Bundan ötürü çalışmanın özgün olduğunu söylemek mümkündür."
