abstract: "Aile hukuku, bir hukuk araştırmacısının aşina olması gereken önemli bir konudur. Çünkü aile hukukunda evlilik ve boşanma gibi temel meseleler vardır. Burada nafaka, itaatsizlik, muhalefet, emzirme, velayet vb. konular ele alımıştır. İnsancıl ve gerçekçi bir bakış açısıyla, bireyin en iyi ilgisinin mevzuatı ihlal etmeden temel olduğudur. Yasal ve şeriat açısından bazı konular karşılaştırılmıştır. Bu araştırmanın önemi, dini inançların zayıflığı, şer'î hükümlere olan uzaklık ve kasıtlı olarak görmezden gelinen aileyle ilgili son derece hassas ve mühim konuları ele almasıdır. Araştırmada konuyla ilgili dört mezhep hukukçusunun (Hanafi, Şafiîi, Maliki ve Hanbali) sözleri genel olarak naklediliş sadece Ebu Hanife'nin sözleri tafsilatıyla ve tartışmalarla birlikte verilmişştir. Çünkü Hanefi içtihadı, dini, halkın çıkarlarını kolaylaştırma, bireyi ve aileyi korumak için geliştirilen meşru amaçları belirleme, bireyin ve ailenin çıkarları ile İslam dininin adaletini açıklığa kavuşturma gibi hususiyetleri içermektedir. İşte bu çalışma Hanefi fıkhının bu yönüyle Irak pozitif hukukunu karşılaştırarak hukuki açıdan bu sorunları çözmek için insanları insani ve gerçekçi düşünmeye yönlendiren bir dizi çözüm önermektedir. Anahtarlı kalimalar :karısı için nafaka .Zarar .Uyuşmazlık .ınsan yönü . hanefi fıkhı"
