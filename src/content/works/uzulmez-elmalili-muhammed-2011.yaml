abstract: "Hamdi Yazır Elmalı'da 1878 yılında doğmuştur. İlk eğitimini Elmalı'dan alan Hamdi Yazır, daha sonra İstanbul'a gitmiş ve orada Kayseri'li Hamdi Efendiden icazet alarak eğitimini tamamlamıştır. Mektebini Nüvvabı birincilikle bitiren Hamdi Yazır'ın çeşitli memurluklarda bulunmuş, farklı düzeyde medreselerde mantık, felsefe, hukuk, hukuk usulü ve evkaf dersleri vermiştir.Antalya mebusu olarak Meclis-i Mebusan'a giren Hamdi Yazır Ferit Paşa Hükümetinde Evkaf Nazırlığında bulunmuş, vakıflar hakkında bir de kitap telif etmiştir.Kazandığı ilmi birikim ve tecrübe ile hayatının son döneminde kaleme aldığı ? Hak Dini kur'an Dili? adlı tefsir çalışması edebiyattan,/ belagattan felsefeye/ kelama, hadisten fıkıha, İslam Tarihine, mezhepler tarihine, sosyolojiye varana kadar bir çok ilim dalına vakıflar.Doğru metodla ve disiplinli çalışıldığı takdirde fıkıh her çağın ihtiyaçlarını karşılayabileceğini savunan Hamdi Yazır, yeri geldiği zaman tefsirinde kendi özel düşüncesini söylemekten çekinmemiştir.Her teceddüdün tekamül anlamına gelmeyeceğini çok iyi bilen merhum, muhkem nasslar karşısında içtihadın toplumu helake sürükleyici bir felaket olacağını hatırlatmıştır.Elmalılı, HAnifilerin metodunu benimsemiş olmakla beraber zaman zaman bu çizginin dışına çıktığı da olmuştur. Biz çalışmamızda bunu örneklerle açıklamaya çalıştık."
