abstract: "Bu çalışma, Endonezya'daki zekât kurumlarının şeffaflığını ve verimliliğini artırmada finansal teknolojinin (fintek) dönüştürücü rolüne derinlemesine inmektedir. Fintek'in ortaya çıkışı, hayırsever bağışlar da dahil olmak üzere çeşitli sektörlerde devrim yaratmıştır ve zekât kurumları üzerindeki etkileri derindir. Bu araştırmanın temel amacı, fintek'in şeffaflık üzerindeki etkisini ve fintek'in zekât kurumlarında şeffaflığı nasıl artırdığını anlamaktır. Kullanılan araştırma metodolojisi, Endonezya genelinde çeşitli zekât kurumlarından katılımcılarla yapılan görüşmelerin kapsamlı bir analizini içermekte olup, elde edilen veriler NVIVO kullanılarak analiz edilmektedir. Araştırma bulguları, finansal teknolojinin (fintek) Endonezya'daki zekât kurumlarının faaliyetlerini yeniden şekillendirmede bir aracı rolü üstlendiğini ortaya koymaktadır. Fintek, görünürlüğü artırarak, bağışçı katılımını geliştirerek, verimliliği artırarak ve sürekli iyileştirmeyi teşvik ederek zekât kurumlarının işleyişinde devrim yaratmıştır. Zekât kurumları fintek araçlarından yararlanarak raporlama mekanizmalarını iyileştirebilmekte, girişimlerin etkisini izleyebilmekte ve sürekli iyileştirme kültürünü teşvik edebilmektedir. Bu teknoloji entegrasyonu sadece operasyonel verimliliği artırmakla kalmamakta, aynı zamanda zekât kurumları içinde bir yenilikçilik ve uyarlanabilirlik kültürü yaratmakta ve sonuçta hizmet ettikleri topluluklara fayda sağlamaktadır. Bu çalışma, fintek'in zekât kurumları üzerindeki dönüştürücü etkisini açıklığa kavuşturarak mevcut literatüre katkıda bulunmaktadır. Şeffaflık, verimlilik ve paydaş katılımının önemini vurgulayarak, araştırma, fintek'in sosyal refah girişimlerini optimize etmek için bir katalizör olarak nasıl hizmet ettiğini ortaya koymaktadır. Bu çalışmada sunulan içgörüler, teknolojinin zekât kurumlarında şeffaflığı ve etkinliği artırmadaki evrilen rolüne ilişkin benzersiz bir bakış açısı sunmaktadır; böylece gelecek araştırmalara ve hayır kurumları alanındaki stratejik ilerlemelere öncülük etmektedir."
