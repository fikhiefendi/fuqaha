abstract: "Bu çalışmanın birinci bölümünde, hakim kavramı, hakim kavramının tarihçesi, hakimin vasıfları, hakimlerin mesleğe kabulü için gerekli koşullar, ceza muhakemesinde karar mercii görevi yapan hakimlerin taşıması gereken vasıflar, hakimin vasıflarına ilişkin Mecelle-i Ahkam-ı Adliye'deki düzenlemeler ve uluslararası belgeler incelenmiştir. Çalışmanın ikinci bölümünde ise, hakimin vasıfları ile bağlantılı olarak, hakimin yasaklılığı ve hakimin reddi kavramları incelenmiş, uygulamadan ve içtihatlardan örnekler verilmiştir. Çalışmada özellikle, hakim olma koşulları, hakimin bağımsızlığı yönünden yürütmenin etkileri ve 6545 sayılı kanun ile kurulan“Sulh Ceza Hakimlikleri”nin Ceza Muhakemesi Kanununun sistematiğine uygunluğu yönünden uygulamada ortaya çıkan sorunlar ve çözüm önerileri yer almıştır."
