abstract: "Geçmişten günümüze değin Kur'ân-ı Kerîm'i farklı yönlerden inceleyen birçok ilim ve bu ilimlere dair çok sayıda eser kaleme alınmıştır. Bu ilim dallarından biri de Kur'an'ı Kerim'in i'câzıdır. İ'caz, muhatabı benzerini meydana getirmekten aciz bırakmak olup bu alanda birçok eser kaleme alınmıştır. Farklı çeşitleri olan İ'cazın ilk göze çarpan türü belagat yani me'ânî, beyân ve bedî' ilimlerine yönelik verilen benzersiz örneklerdir. İ'cazın bu yönüne dair yazılan eserlerin en önemlilerinden biri de çalışmamızın konusu olan İmam Şevkânî'nin Fethu'l-Kadîr: el-Câmi' Beyne Fenneyi'r-Rivâye ve'd-Dirâye min 'İlmi't-Tefsîr isimli tefsirin İ'cazın çeşitlerinden biri olan belâgatın meani kısmına yönelik dair verdiği örneklerdir. Çalışmada Tümevarım ve Mukayeseli Yöntem takip edilerek eserde yer alan me'ani meseleleri ile belâgatın me'ani yönüyle ele alınan kıraat farklılıkları tespit edilerek alanda yazılan diğer eserlerle karşılaştırıldı. Çalışma giriş, iki ana bölüm, sonuç bölümünden oluşmuş olup İmam Şevkânî'nin hayatı, İlmü'l-Me'ani konuları işlenmiş, Kur'ân Kıraatleri Belâgatın meani açısından yorumlama yapılmıştır."
