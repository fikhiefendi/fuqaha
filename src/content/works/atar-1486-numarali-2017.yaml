abstract: "Osmanlı Devleti'nde mahkemelerde verilen kararlar ve tutulan kayıtlar şer'iyye sicillerinde toplanmıştır. Bu siciller yerel tarih açısından önemli veriler sağlamaktadır. Siciller incelendiğinde bir bölgenin sosyal, ekonomik, idarî ve hukukî yönü ortaya konulabilmektedir. Bu çalışmada Lazistan Sancağı'nın Atina Kazası'na ait 1909-1912 tarihlerini kapsayan 1486 numaralı Rize/Pazar şer'iyye sicili tanıtılmış, Atina Kazası mahkeme kayıtları aile yapısı, idarî, sosyal ve iktisadi yönden sınıflandırılarak bunun üzerinden Rize/Pazar'ın sosyo-ekonomik hayatına dair değerlendirmeler yapılmıştır. Defter 89 varak, 176 sayfadan oluşmaktadır. Defterin transkripsiyonunu yaparken sayfa numaraları takip edilmiş tarafımızdan verilen numaralandırılma da ise öncelikle belge numarası esas alınmış, ikinci olarak hüküm numarası verilmiştir. (2. Sayfa, 2. Hüküm). s. 2 h. 1, s. 2. h. 2, .... vb. şekilde gösterilmiştir. Defterde yer alan belge çeşitlerinin çoğunu hüccetler oluşturmaktadır. Çalıştığımız şer'iyye sicilinde siyah ve bozuk olarak karşılaşılan okunamayan kelimeler (…) işareti ve şüpheli okunanlar (?) işareti ile gösterilmiştir."
