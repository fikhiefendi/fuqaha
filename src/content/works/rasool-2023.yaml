abstract: "Bu çalışmada İslam hukuku ve pozitif hukukta yoksulluk sorunu ele alınması incelenmiştir. Yoksulluk kavramı, nedenleri ve sonuçları ile fakirlikle mücadele konusunda şer'î ve kanunî öneriler araştırmanın konusuna dahildir. Tefsir, fıkıh ve hadis kitapları ile hukuk, iktisat ve sosyoloji kitaplarında yapılan taramalarda çalışmanın amaçlarına ulaşmak için araştırma için zorunlu olan betimleyici yöntemin hem analitik hem de tümevarım türleri kullanılmıştır. Çalışmada ortaya çıkacak soruları teorik bir yapı içinde cevaplarken ve bilgileri analiz edip aralarındaki bağlantıya ulaşırken de aynı yöntemler kullanılmıştır. Araştırmada ulaşılan sonuçlardan önemlileri şunlardır. Yoksulluk, toplumlarda bir saplantı, bireysel ve toplumsal düzeyde kaygı uyandıran bir sorundur. En ciddi ve karmaşık konulardan biridir. Fakirliğin birçok sebebi vardır. Şer'îtın fakirliğin sebebi olarak gördüğü hususlardan bazıları şunlardır: Zekatı ihmal etmek, kara borsa, tefecilik, israf ve tekelcilik. Pozitif hukuk açısından bakıldığında ise fakirliğin sebepleri arasında şunlar sayılabilir: Kapitalist sistemin hakimiyeti, cehalet, para politikası, kır-kent eşitsizliği, çatışma ve savaşların varlığı. Fakirliğin fert, aile ve toplum üzerinde ciddi etkileri vardır. Fakir toplumlar milli gelirlerini kalkınma ve yatırım projelerine yatırmak yerine öncelikle karınlarını doyurma sorununa odaklanırlar. Dolasıyla toplum ve devlet halledilmesi zor bir kısır döngü içerisinde kalır. Bu sebeple Şeriat, yoksulluk sorununu çözmek için bazı pratik önlemler önermiştir. Önerilerden bazıları Allah'a imanı kuvvetlendirmek, dua etmek, günahlardan ve haddi aşmaktan sakınmak gibi ahlaki yönle ilgilidir. Bazıları ise hicret, sürgün, yurdu terk etme pahasına da olsa rızkı temin etmek için ciddiyetle çalışkanlıkla ilgilidir. Bunlar arasında Müslüman toplumlarda düzenli olarak zekat verme zorunluluğu, krizlerle başa çıkmak için sadakayı teşvik, İslami vakıfları harekete geçirme, mirası şeriatta belirtilen paylara göre bölme, meşru ticaretle uğraşma, haram olan tefecilik ve bunun sonucunda ortaya çıkan ağır zararlar yerine, kefaret ödeme ve masrafları üstlenme, akrabalar ve İslam ümmetinin birliğini güçlendiren her türlü toplumsal dayanışma ihtiyacı sayılabilir. İstihdam olanaklarının artırılması, küçük projeler düzenlenmesi, yoksullara mesleki eğitim ve kredi verilmesi, vergi muafiyeti ve adli yardım sağlanması, cehalet ve cehaletin ortadan kaldırılması için teşvikler verilmesi pozitif hukuk açısından ileri sürülen alternatiflerdir. Çalışma, şer'î kanunların pozitif hukuku denetlemesi şartıyla yoksulluk sorununu çözme stratejileri açısından İslam hukukunun önerileri ile pozitif hukukun önerilerinin birleştirilmesinin gerekliliğini tavsiye etmektedir."
