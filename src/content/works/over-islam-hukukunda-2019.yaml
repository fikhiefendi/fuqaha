abstract: "“İslam Hukukunda Yarışma ve Ödül”adlı bu çalışmada araştırmacının ve insanın bilmek istediği ve günümüzde hakkında müstakil bir Türkçe eser bulunmayan İslam Hukukunda Yarışmanın ve Ödülün hükümleri,delilleri ve günümüzdeki yarışmaların hükümlerini bilmek için bu meseleyi ele aldık. İslam Hukukunun bu asra uygun olmadığını söyleyenlere karşı da bu araştırma bir delil olmaktadır. İslam dinin beden eğitimine ve spora önem vermediğini iddia edenlere karşı da bir cevap oluşturmaktadır. Tezimiz beş ana bölümden oluşmaktadır. Birinci bölümde İslam Hukukunda Müsabakanın tanımı, meşruiyeti; kitap, sünnet, icma delilleri, bu konu hakkında yazılmış tez, kitap, çalışmalar, eserler ve uluslararası fetva kurullarının vermiş olduğu fetvalar, bulgular ortaya konmuştur. İkinci Bölümde Yarışma Akdinin rükünleri, şartları, ödülün verilmesi, akdin bağlayıcılığı ve iptal sebebleri üzerinde durulmuştur. Üçüncü Bölümde hayvanlarla, araçlarla, koşu yoluyla yarışma, güreş, boks, judo, karete, ağırlık kaldırma, yüzme, bilim ve kültür yarışmaları, top ile oynanan müsabakalar ve iki kişiyle oynanan oyunlara genişçe yer verilmiş ve bunlar hakkında bölüm sonu değerlendirmesi yapılmıştır. Dördüncü Bölümde ise Atış Akdi, tarifi, rükünleri, şartları, kısımları, isabet, iki grup arasında mücadele ve atış akdinin iptal sebebleri ortaya konmuştur. Beşinci bölümde ise İslam Hukukunda Ödülün tarifi, meşruiyeti, amacı, ödülle ilgili şer'i kurallar, ödül çeşitleri ve sunuş şekli üzerinde durulmuş ve genel bir değerlendirme yapılmıştır. Sonuç olarak İslam Hukukunda yarışma ve ödüllerin hükümleri, ödül ve yarışma türleri, bunların rükünleri ve şartları hakkında bilgi sunduk. Müsabaka hususunda Allah Resulü'nün (sav) yarışlara katıldığı, katılanları teşvik ettiği, bizzat Efendimizin güreş tuttuğu ve İslam dîninin müsabakalara çok önem verdiği hususları üzerinde durduk. Çünkü İslamiyet insanın bedenen, zihnen ve ruhen cihada hazır bulunması gerektiğini ve kumara bulaşmadığı müddetçe yarışma ve ödülü teşvik ettiğini delilleriyle ortaya koyduk. Bu araştırmamız, İslam dininin beden eğitimi ve spora gerekli önemi vermediğini iddia edenlere karşı da bir cevap niteliği taşımaktadır."
