abstract: "Araştırma \"Giriş\" bölümü ile birlikte beş bölümden şekillenmektedir. Birinci Bölüm'dearaştırmanın problemi, önemi, amacı, yöntemi,sınırlılıkları ve önceki çalışmalar ile ilgili hazırlık mahiyetinde bilgiler verilmiştir. İkinci Bölüm'defıkıh ve siyaset tecrübesine değinilerek sonraki bölümlerin temalarına yönelik siyasi ve kültürel bir zemin oluşturulmuştur. Üçüncü Bölüm'defıkhi dönüşümü gerçekleştiren reformlara yer verilmiştir. Amaç bir sonraki bölümde ele alınacak fıkıh alanındaki ilmî değişim ve dönüşümleri daha iyi anlamlandırabilmek ve kıyasta bulunabilmektir. Dördüncü Bölüm'de Tanzimat Dönemi medreselerinde ve diğer eğitim kurumlarında gerçekleştirilen fıkıh eğitimi ele alınmıştır. Özellikle yeni kurulan müesseseler ve gerçekleştirilen ıslahatlar fıkhi açıdan incelenmiş ve oluşan müfredattaki fıkıh dersleri analiz edilerek bir bakış açısı oluşturulmak istenmiştir. Yanı sıra fıkıh mesleğinin nasıl icra edildiğine dair kanaat elde edilebilecek tarzda iftâ ve kazâ teşkilatlarının görev ve sorumlulukları değerlendirilmiştir. Araştırma varılan sonuçların ifadesi olan \"Sonuç ve Öneriler\" bölümünün ardından \"Kaynakça\" ve \"Ekler\" ile tamamlanmıştır."
