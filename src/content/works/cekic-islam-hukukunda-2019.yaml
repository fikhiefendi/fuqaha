abstract: "“İslam Hukukunda Mahremiyet ve Sosyal Medya”adlı tezimizde, İslam hukukundaki mahremiyet sınırları çizilmiş ve bu sınırların ne kadarının sosyal medyada ihlal edildiği ortaya çıkarılmaya çalışılmıştır. Gerçekleşebilen bu ihlaller sonucunda fert ve toplumun üzerine düşen sorumluluklar ile hukuki yaptırımlar ele alınmıştır. Birinci bölüm, konuyla alakalı kavramları içermektedir. Mahremiyet olgusuyla ilişkili kavramlar açıklanmış ayrıca sosyal ağ siteleri hususunda önemli aktarımlar yapılmıştır. İkinci bölümde mahremiyetin İslam hukukundaki boyutları beden, mesken, bilgi, mahremiyeti kapsamında değerlendirilmiştir. Günlük yaşamdaki ibadetlerin mahremiyetle ilgisi de ele alınmıştır. Bu bölüm, İslam hukukundaki alanı belirlenen mahremiyetin nasıl ve ne şekilde olursa ihlalinin söz konusu olacağına dair hareket noktası olmuştur. Üçüncü ve son bölüm mahremiyetin sosyal medyada ne kadar yitirildiğinin ve bunun sonucunda hukuki zeminde neler yapılması gerektiğinin ortaya çıkarılmaya çalışıldığı bölüm olmuştur. Bu bölümde sosyal medyanın beden, mesken, bilgi, aile ve ibadet mahremiyetine etkilerini değerlendirirken yer yer güncel olaylara başvurulmuştur. Ayrıca söz konusu konuların fıkıh kitaplarının ilgili bölümlerinde yer alması gerektiği vurgulanmıştır."
