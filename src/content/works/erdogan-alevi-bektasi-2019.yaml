abstract: "Alevîlik ile ilgili en çok konuşulan ve merak edilen meselelerin başında Hak Muhammed Ali inancı gelmektedir. Bu noktaya ışık tutma sadedinde bu araştırmanın konusu Alevî-Bektâşî Klasiklerinde Hak Muhammed Ali inancıdır. Tez giriş, üç ana bölüm ve sonuç kısmından oluşmaktadır. Birinci bölümde Alevî-Bektâşî Klasiklerinde Hak inancı ve bu inancın Alevîliğin diğer kaynakları ile günümüz Alevîlerindeki yansımaları, benzerlik ve farklılıkları işlenmiştir. Hakk'ın konumu, tevhid inancı, vahdet-i vücûd anlayışı, devir-tenâsüh anlayışı, Allah'ın nitelikleri, Allah sevgisi vb. başlıklar altında konu incelenmiştir. İkinci bölümde ise Alevî-Bektâşî Klasiklerinde Nübüvvet inancı ana başlığı altında genelde peygamberlik inancı, özelde ise Hz. Muhammed inancı yer almaktadır. Bu bölüm, nübüvvet anlayışı, Hz. Muhammed'in konumu ve peygamberliği, nitelikleri, şefaati, sevgisi, batınî konumu vb. başlıklardan oluşmaktadır. Üçüncü bölümde de Alevîliğin vazgeçilmezi olan Hz. Ali, Klasikler çerçevesinde ele alınmıştır. Bu bölümde Hz. Ali'nin önemi, velâyeti, Ehl-i Beyt ve Hz. Ali sevgisi, batınî yönü itibariyle; Hz. Ali'nin tanrısal yönü, Muhammed-Ali özdeşliği, kırklar cem'i ve mi'raç vb. konulara değinilmiştir"
