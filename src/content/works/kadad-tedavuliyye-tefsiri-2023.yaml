abstract: "Bu çalışma, modern dil teorilerinden biri olan“tedavuliyye teorisi”ni Ebüssuûd el-İmâdî'nin (v. 982) İrşâdü'l-ʿakli's-selîm tefsiri kapsamında ele almakta ve tedâvuliyye teorisinin İslam Arap geleneğindeki çeşitli dil konularıyla benzerlik ve farklılıklarının incelenmesini hedeflemektedir. Ayrıca mezkûr teori bağlamında âlimlerimizin Kur'an okumalarındaki uygulamalarına ve bu uygulama için gereken araçlara dikkat çekmektedir. Çalışma; giriş, dört bölüm ve sonuçtan oluşmaktadır. Birinci bölümde araştırmaya konu olan İrşâdü'l-ʿakli's-selîm eseri, müellifi ve ana hatlarıyla tedâvuliyye teorisi ele alınmıştır. İkinci bölümde Batı dillerinin, Arap diliyle arasındaki benzer yönlerle ilgili sözlü fiil teorisi ele alınarak Ebüssuûd'un tefsirinden örnekler verilmiştir. Üçüncü bölüm, bu konunun Ebüssuûd söz konusu tefsirindeki tartışma biçimi, araçları ve delilleri üzerinde durmaktadır. Dördüncü ve son bölümde ise modern tedâvuliyye kavramının boyutları ve kavramları ile İslam geleneğindeki Arap belagati ve nahvi ile benzer ve farklı özelliklerin tespitine ve müellifin bunu işleyiş tarzına yer verilmiştir."
