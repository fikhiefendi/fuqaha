abstract: "İslam ve Yahudi hukuku, hukukun birçok alt dalı bakımından karşılaştırmalara konu olmuştur. Ancak her birimizin neredeyse her gün kurduğu mali sözleşmeleri içerisine alan özel borç ilişkileri bağlamında henüz bu iki hukuk sistemi mukayese edilmemiştir. Bu çalışmanın konusu bu iki hukuk sisteminin satış, tüketim ödüncü, kullanım ödüncü, emanet, kira, hizmet, bağışlama, kefalet ve vekalet sözleşmelerine ek olarak rehin ve faiz bağlamında karşılaştırılmasıdır. Kapsamı sınırlamak adına İslam'da dört Sünni mezhep, Yahudilikte ise Ortodoks Yahudilik baz alınmıştır. Bu çalışmanın amacı iki hukuk sisteminin özel borç ilişkilerini nasıl ele aldıklarının ortaya konması, benzerlik ve farklılıkların belirlenmesi ve bu benzerlik ve farklılıklara yol açan sebeplerin tespitidir. Bu amacın gerçekleştirilmesi adına ilk bölümde Yahudi hukuku Tevrat, Talmud, Tosefta, Midraşlar, hukuk kitapları, Tevrat tefsirleri ve Yahudi hukukuna dair diğer eserlerden yararlanılarak işlenmiştir. İkinci bölümde ise dört Sünni mezhep olan Hanefî, Şâfiî, Mâlikî ve Hanbelî mezheplerinin önde gelen fıkıh eserleri bağlamında İslam hukuku ele alınmıştır. Son bölümde ise karşılaştırma ve değerlendirme yapılmış, elde edilen bulgular aktarılmıştır. Bu çalışma sonucunda Yahudi hukukunun özel borç ilişkileri bağlamında tarafları daha özgür bıraktığı, Tevrat'a aykırı bile olsa taraflara sözleşme içeriğini özgürce belirleme imkânı verdiği, İslam hukukunun ise Kur'an ve sünnetin koyduğu esaslardan çıkılmasına izin vermediği görülmüştür. İslam hukukunun hükümlerinin evrensel nitelikte olduğu, Yahudi hukukunun ise birçok meselede hükümleri Yahudilere hasrettiği gözlemlenmiştir. İki hukuk sisteminin de sözleşmelerin düzenlenmesinde örfe sıkça atıf yaptığı müşahede edilmiştir. Bütün bunların yanında sözleşmelerin hükümleri bakımından iki hukuk sisteminin pek çok benzerlik ve farklılığı ortaya konmuştur."
