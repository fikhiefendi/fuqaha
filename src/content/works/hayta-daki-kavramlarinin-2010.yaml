abstract: "Gelenekler, bir toplumun başta gelen ayırt edici vasıflarıdır. Evrensellik iddiası taşıyan İslam dininin bu olgudan müstağni kalmadığı; beşerî tecrübeyi ve geleneği önemsediği söylenebilir. Şöyle ki, o, bir yandan inanç esasları ve ahlak gibi sabiteler ortaya koyarken, bir yandan da birçok meselede sınırlar sabit kalsa da içeriği zamana ve zemine göre değişebilen dinamik hükümler ihdas etmiştir.Ma'rûf, (örf) dinin geleneğe dayandığına güzel bir örnek oluşturmaktadır. Zira Kur'an'da farklı bağlamlarla 39 yerde geçen ma'rûf kavramı özellikle aile hukuku alanında dine uygunluk (meşrû) anlamına geldiği gibi, toplumsal örf ve geleneğe uygunluk manası da taşımaktadır. İlgili âyetler bu açıdan değerlendirilirse, bu, İslâm hukukunun örf kaynağının da güçlü argümanı olur ve bu bağlamdaki konular da örfün Kur'an'daki örneklerini oluşturur.Ayrıca Fıkıh bilginleri ilgili âyetleri ve konuları işlerken doğrudan veya dolaylı olarak örfe atıf yapmışlar ve hükümleri ispat sadedinde örfü tâli bir delil olarak kullanmışlardır. Dahası, Örf, Mecelle ve Aile Hukuku Kararnamesinde olduğu gibi, hukuk sistemindeki bir yasa maddesine de gerekçe olmuştur."
