abstract: "Allah'ın (c.c.) insanlara bahşettiği en büyük nimetlerden bir tanesi de şüphesiz dildir. Dil, insanların birbirlerini anlaması, düşündüklerini en güzel ve doğru bir biçimde aktarması için eşsiz bir kaynak ve araçtır. Var olan düşünceleri doğru aktarmak, aktarılmış olan düşünceleri doğru analiz edip sentezlemek için dilin bizatihi kendisine vakıf olma kaçınılmazdır. Her toplum, dilsel kültür ve miraslarını doğru bir şekilde sonraki nesillere aktarmak için dil kuralları vazetmişlerdir. Müslümanlar için en önemli miras olan Kur'an ve Peygamber'in (s.a.s.) hadisleri doğru anlaşılsın, tahrife uğramasın ve sonraki nesillere korunmuş bir halde aktarılsın diye âlimler tarafından Arap dili grameri vazedilmiştir. Arap dili gramerinin vazedilmesi, Peygamber efendimiz (s.a.s.)'in“Cevâmiu'l-kelim”diye bilinen veciz sözlerinden ilham alınarak meydana getirilen küllî kaidelerle başlamıştır. Kapsayıcı, açık, veciz ve kolay kılıcı özelliklere sahip küllî kaideler, dil ekollerinin birçok konuda ihtilaf etmelerinde rol oynamıştır. Küllî kaideler, gramer ilmiyle uğraşan kişinin, delilleri süzgeçten geçirmesine olanak sağlar. Hatta bu kaidelerin bir kısmı bazen nahiv ve sarf ilimlerinin delilleri olarak gösterilmektedir. Nahiv usûlü, ilm-i hilaf ve nahiv ilmi eserlerinin birçoğunda ya özel başlık altında ya da atıfta bulunarak küllî kaidelerin önemine dikkat çekilmiştir. Bunu en iyi başaran âlimlerden biri de kendisinden önceki dil ekollerini taklit etmeyip“takrîr ve tahkîk”yolunu benimseyen İbn Mâlik'tir. İbn Mâlik, küllî kaideleri Elfiyye eserinde uygulayıp, bazen bunlara atıfta bulunması bu kaideleri daha da önemli kılmaktadır. Bu minvalde birden fazla çalışma ve eser olmasının yanında bunların birçoğunun konu açısından dar tutulması, örneklerle izah edilmemiş olması, mezkûr konu üzerine tez çalışması yapmamıza etki eden unsurlardandır. Bu öneme sahip küllî kaidelerin ve bir o kadar önemli olan Elfiyye eserinin daha iyi anlaşılması amaçlanmıştır. Bu bağlamda Elfiyye başta olmak üzere birçok klasik eser, tezler ve makaleler detaylı bir şekilde araştırılmış olup çalışmada metin analizi yöntemi kullanılmıştır."
