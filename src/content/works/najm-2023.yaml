abstract: "Fakihler arasında oluşan ihtilaflar, Hz. Peygamber ve sonrasında Müslümanların takip ettikleri içtihadın sonucudur. Nasların birçok manaya delalet edebilecek bir yapısı bulunmaktadır. Aynı şekilde anlama ve kavrama kişiden kişiye farklılık gösterebilmektedir. Nasları anlama hususunda ihtilaf olduğu için fakihlerin görüşleri arasında da ihtilaf bulunması tabidir. Ebû Hanîfe'nin cumhura muhalefet ettiği bazı konular da bu ihtilaflardandır. Bu araştırmada Ebû Hanîfe'nin cumhur alimlere mahalefet ettiği fıkhi konular incelenmiştir. Araştırmanın önemi, ilk ve en eski fıkıh mezhebinin kurucusu olarak bilinen İmam Ebu Hanife'nin görüşlerinin zikredilmesi, İslam fıkıh mirasının zenginleşmesine katkıda bulunması ve Ebû Hanîfe'nin cumhura muhalefet ettiği konularda dayandığı esasların açıklanması sebebiyledir. Aynı şekilde her çağ ve dönemde mükelleflerin suçları ve had hükümlerini bilinmesi, hadlerle ilgili kullanılan sözcük ve hükümlerin detaylı bir şekilde bilinmesine bağlıdır. Araştırmanın hedeflerini gerçekleştirmek için İmam Ebû Hanîfe'nin ilmi ve şahsi hayatı açıklanırken betimleyici tarihsel metot uygulanmıştır. Ebû Hanîfe'nin cinayet ve had konularında cumhura muhalif görüş beyan ettiği konuların tespit ve tahlili, her görüşün delillerin zikredilmesi ve sonrasında delil ve şer'î mashlata uygun görüşün tercih edilmesinde analitik tümevarım yöntemi kullanılmıştır. Bütün bunlar, dört mezhebin muteber kitapları ve konuyla ilgili muasır fıkıh ansiklopedilerine dayanılarak yapılmıştır. Araştırmada ulaşılan neticelerden önemlileri şunlardır: İmam Ebu Hanife tıpkı diğer âlimler gibi kendi reyine taassup derecesinde bağlı bir alim değildir. Ebû Hanîfe'nin cumhura muhalefet ettiği hususlar, şer'î delile uygun olarak yapılan tercihlerle ilgilidir. Ağır bir alet kullanarak öldürme ve boğmayı, ateş ve demir gibi kasten öldürmeye delalet edecek şekilde deri ve cildi yaran aletlere hasretmesi Ebû Hanîfe'nin cumhura muhalefet ettiği konulardandır. Daru'l-harbte Müslüman bir kişiyi öldüren için İslam'ı ve daru'l-İslam'da yaşamayı şart koşması da cumhura muhalefet ettiği konulardandır. Cumhur ise bu durumda sadece Müslüman olmayı şart koşmuştur. Ebû Hanefe'ye göre irtidat eden kadın da öldürülmeyip, Müslüman olup, tövbe edinceye kadar hapsedilir. Özetle fakihler arasındaki ihtilaf, İslam hukukunun esnekliğinin ve her zaman ve her yerde geçerli olduğunun delilidir."
