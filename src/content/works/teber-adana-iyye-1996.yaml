abstract: "Bulunduğu konum itibariyle her zaman jeopolitik bir öneme sahip olan Adana ili tarih boyunca pekçok medeniyete şahitlik yapmıştır. Adana, Osmanlı egemenliğine girdikten sonra 1867 yılında Eyalet olmuştur. Ele aldığımız 1150-1160/1737-1747 yıllan arasında Sancak olan Adana zanâtkârlarıyla, ticaretiyle, reâyasıyla canlı bir sosyo ekonomik hayat arzetmektedir. Osmanlı toplumunun bir parçası olan Adana toplumu sosyal hayat bakımından Türk toplum hayatının özelliklerini, örf, âdet, gelenek ve kültür normlarını canlı bir şekilde yaşatmaktadır. Yerleşim birimlerinin özelliğine göre genelde şehir ve köy hayatı şeklinde iki ayrı hayat tarzı görülmektedir. Bu bakımdan köy ekonomisi orman, tarım ve hayvancılığa bağımlı iken; şehir ekonomisi ticaret, sanat ve el emeğine dayanmaktadır. Adana şehir ekonomisinde canlı bir ticaretin ve gelişmiş örgütlü esnaf teşkilatlarının varlığım müşahade ediyoruz. Bu dönemde rastladığımız dikkat çekici bir uygulama da devletin sık sık buyruklarla halkın yaşam standardını koruyucu, ihtikârı önleyici narhlar koymasıdır."
