abstract: "Ahbâru'l-Kudât eserleri, İslam Muhâkeme Hukuku literatürü arasında yer alan ve kadıları yaşadıkları dönem ve bölgelere göre ele alan eserlerdir. Bu eserler aynı zamanda başta Hulefâ-yi Râşidîn dönemi olmak üzere, ilk üç asır hukuk tatbikatını aktarmaları bakımından da oldukça önemli bilgiler ihtiva etmektedir. Mezheplerin henüz teşekkül etmeye başladığı bu dönemdeki ilk hukukî uygulamalar sonraki dönemler için bir örneklik oluşturmuş, kadı hükümleri de mezheplerin doktriner bir yapı kazanmasına etki etmiştir. Çalışmada, hicrî ilk üç asır Ahbâru'l-Kudât eserlerinde aktarılan kadı hükümleri içerik ve söylem analizi yöntemleri ile incelenmiştir. Fıkıh tarihinin ilk üç evresini kapsayan ve Hulefâ-yi Râşidîn ve Emevîler dönemleri ile Abbasîler'in ilk dönemlerini de kapsayan hicrî üçüncü asrın sonu sınır olarak belirlenmiştir. Bu kapsamda Ahbâru'l-Kudât eserlerinden günümüze ulaşmış ilk eser olan Muhammed b. Halef Vekî'in (öl. 306/918) Ahbâru'l-Kudât'ı Muhammed b. Yûsuf el-Kindî'nin (öl. 350/961) Mısır kadılarına dair eseri Ahbâru Kudâtı Mısr eseriyle de mukayese edilerek detaylı bir şekilde incelenmiştir. Bu çalışmada kadı hükümleri, şehir/bölge ve dönemler çerçevesinde irdelenerek fürû'-i fıkıh konularına göre tasnif edilmiştir. Ayrıca hükümlerin tarihsel süreç içerisindeki değişiminin ortaya konulması-ilgili eserlerdeki verilerin imkân vermesi ölçüsünde- çalışmanın hedefleri arasındadır. Kadıların birbirleriyle (yatay) ve kendilerinden önceki kadılarla (dikey) ilişkileri de incelemeye tabi tutulmuştur."
