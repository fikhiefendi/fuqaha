abstract: "Hicri 587 yılında vefat eden Kâsânî Hanefî mezhebinin önemli âlimlerinden birisidir. Bu âlimin en önemli eseri Bedâiʿu's-Sanâiʿ'dir. Kâsânî bu eserinde Ebu Hanife, İmam Muhammed, Ebu Yusuf ve bazen de İmam Züfer'in görüşlerinin yanında diğer mezhep imamlarının görüşlerine de yer vermektedir. İmam Şâfiî'nin mezhebi de bunlardan bir tanesidir. Bu çalışmamızda Kâsânî'nin Bedâi adlı eserinde ibadetler bölümünde İmam Şâfiî ve Şâfiî mezhebine nispet ettiği görüşlerini Şâfiî mezhebi kaynaklarından tespit ve tahkik etmeye çalıştık. Bu çalışmamız beş bölümden oluşmaktadır. Birinci bölümde temizlik kapsamında değerlendirilen abdest, suların kısımları, mestler üzerine mesh, gusül, istincâ, teyemmüm ve kadınların özel halleri olan âdet ve lohusalık konuları, ikinci bölümde namaz ve cenaze, üçüncü bölümde zekât ve oruç, dördüncü bölümde hac ve umre, beşinci bölümde literatürde ibadet kapsamında değerlendirilen itikâf, yeminler, yiyecekler, hayvan kesimi ve avlanma, kurban, adaklar, keffâretler, içecekler ile helaller ve haramlar konuları ele alınmıştır. İmam Şâfiî'ye veya Şâfiî mezhebine nispet edilen konular hakkındaki görüşler Şâfiî fıkıh kitaplarına müracaat edilerek tespit edilmeye çalışılmıştır. Nispetinde isabet edildiği yerde râcih (yani müftâ bih) olan görüşün nakledildiği, isabet edilmediği yerde eğer nakledilen görüş mezhepte zayıf ise görüşün zayıf olduğu, nakledilen görüşün nispeti hatalı ise görüşün hatalı olduğu belirtilmiştir. Sonuç olarak Kâsânî bu eserinin ibadetler bölümünde İmam Şâfiî'ye veya Şâfiî mezhebine 512 görüş atfetmiş olup bunlardan 451 tanesinde râcih görüşü nakletmiş, 37 tanesinde zayıf görüşü nakletmiş, 24 tanesinde de hata etmiştir."
