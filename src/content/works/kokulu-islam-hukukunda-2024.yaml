abstract: "İsticrâr akdi, genel olarak insanların ihtiyaçlarını peyderpey almalarını ve alım sürecinin sonra ermesinin ardından satıcı ile hesaplaşmasını konu edinen bir akittir. İsticrâr akdinin; belli bir meblağın satıcıya alım süreci başlamadan önce verilmesini konu edinen ön ödemeli isticrâr ve paranın alım sürecinin sonunda verilmesini konu edinen sonradan ödemeli isticrâr şeklinde iki çeşidi ve farklı uygulama biçimleri bulunmaktadır. İcap ve kabulün her defasında zikredilmemesi, vade tarihinin bilinmemesi, semenin takdir edilmemesi, hesaplaşma vaktinde malların mevcut olmaması gibi problemleri bünyesinde barındırması sebebiyle tenkit edilen isticrâr akdinin cevazı hususunda ihtilaf bulunmaktadır. Birçok problemi barındırmasının yanında isticrâr akdi, özellikle enflasyonun yüksek olduğu dönemlerde kendisine uygulama alanları bulmuş ve insanların teamüllerinde yer edinmiştir. İsticrâr akdinin uygulanabilir olması ve hatta günümüzde uygulanıyor olması, akdin incelenmesini önemli kılmaktadır. Bu araştırma, isticrâr akdinin isimlendirilmesini, çeşitlerini ve uygulama biçimlerini kurulması için gereken şartlarını, bünyesinde barındırdığı ve akdin cevazı açısından problem teşkil eden unsurlarını, klasik akit teorisindeki konumunu, diğer akitlerle ilişkisi ve günümüzde yer edinen uygulamalarını konu edinmektedir. Tez, bir giriş ve iki ana bölümden meydana gelmektedir. Giriş kısmında araştırmanın konusu, amacı, kaynaklarına ilişkin bilgilere yer verilmiştir. Birinci bölümde isticrâr akdinin fıkhî niteliği ele alınmış olup teorik arka planı kurgulanmıştır. İkinci bölümde ise öncelikle enflasyonun yüksek olduğu dönemlerdeki kullanımına değinilmiş, ardından günümüze yansıyan güncel örnekleri ele alınarak isticrâr akdinin pratik kısmı incelenmiştir. Bu noktada isticrâr akdinin uygulaması olarak zikredilen bazı örnekler de eleştiriye tabi tutulmuştur."
