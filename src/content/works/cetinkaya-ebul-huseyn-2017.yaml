abstract: "Bu çalışma, hicrî V. Asırda Bağdat'ta yaşamış Hanefî fakihi Ebu'l-Huseyn el-Kudûrî'nin et-Tecrîd adlı eseri çerçevesinde Hanefî fıkıh usulünde şer'î delilleri tespit etmek amacıyla yapılmıştır. Kudûrî, et-Tecrîd adlı eserinde Hanefî fıkıh usulünde, hüküm istinbatında yararlanılan Kitab, sünnet, icma, sahabe kavli, kıyas, istihsan, önceki şeriatler, örf, ıstıshab, maslahat ve ihtiyata yer vermiştir. Araştırma, giriş ve dört bölümden oluşmaktadır. Giriş bölümünde tezin amacı, önemi, yöntemi ve kaynakları hakkında bilgi verilmiştir. Birinci bölümde Kudûrî'nin hayatı, eserleri, yetiştiği çevre ve Hanefî mezhebi içindeki yerinden bahsedilmiştir. İkinci bölümde şer'î delillerin ilk ikisi olan Kitâb ve sünnet ele alınmıştır. Bu bölümde Kur'an ve sünnet lafızlarından hüküm çıkarmak için yararlanılan metodlar ve sünnetin sübutu ile ilgili ahad haberi kabul ve tercih şartları incelenmiştir. İcma ve kıyas delillerinin ele alındığı üçüncü bölümde icmanın bütün türleriyle deliller hiyerarşisindeki yeri tespit edilmeye çalışılmıştır. Aynı zamanda bu bölüm kıyas metodunun ve kıyasın unsurlarından illet ile ilgili tartışmaların fer'î örnekler üzerinde gösterildiği bölümdür. Dördüncü bölümde ise istihsan, sahabe kavli, önceki şeriatler, örf, ıstıshab, maslahat ve ihtiyat delillerinin fıkıh usulündeki yeri fer'î örnekler üzerinden ele alınıp gösterilmeye çalışılmıştır. Bu çalışmayla hem usul ile füru arasındaki ilişki, fer'î meselelerden örneklerle ortaya konmuş hem de Cessâs sonrasında Irak'taki Hanefî fıkıh usulünün gelişimi gözlemlenmeye çalışılmıştır. Anahtar Kelimeler: Kudûrî, Tecrîd, Hanefî, usûl-i fıkıh, şer'î delil"
