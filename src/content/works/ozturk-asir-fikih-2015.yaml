abstract: "Bu çalışma ilk beş asır fıkıh usûlü literatüründe şer'u men kablenâ incelemelerini ele almayı ve bu konu özelinde eserlerin taşıdıkları özellikleri tespit etmeyi hedeflemektedir. İki bölümden oluşan bu araştırmanın birinci bölümünde, ilk beş asır usûl eserlerinde konunun ele alınış biçimi, bu konu çerçevesinde ele alınan tartışmalar ve şer'u men kablenâ'nın delil değeri hakkındaki görüşler takdim edilmeye çalışılmıştır. İkinci bölümde ise, birinci bölümde elde edilen malumata dayanarak, alimlerin şer'u men kablenâ incelemeleri çeşitli açılardan değerlendirilmiştir. Bu eserlerde şer'u men kablenâ ile ilgili tartışmaların özellikle, Kur'an ve Sünnet'te ne neshine ne de geçerliliğine dair bir delil bulunan önceki şeriatlara ait hükümlerin bağlayıcılığı noktasında düğümlendiği görülmektedir. Şer'u men kablenâ'nın bağlayıcılığı ile ilgili biri olumlu, diğeri olumsuz olmak üzere iki temel görüş ortaya çıkmaktadır. Zira her iki görüşü destekeyen naklî ve aklî deliller bulunmaktadır. Bu çalışmada, alimleri görüşlerden birini tercihe sevk eden âmiller belirlenmeye çalışılmıştır. Son olarak, ilk beş asır zaman aralığında bir delil olarak şer'u men kablenâ'nın gelişim seyri ortaya konulmaya çalışılmıştır."
