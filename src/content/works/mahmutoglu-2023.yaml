abstract: "Davranışsal ekonomi bilimi, sosyal psikoloji biliminden faydalanarak, serbest piyasada insanın her zaman rasyonel davranışı prensibi ve toplumun farklı kesimlerinin arasında dengeyi hedeflemeden bireysel yarara odaklanma prensibi gibi Geleneksel Ekonominin temel ilkelerinden olarak kabul edilen bazı hataları düzeltmeyi başarmıştır.Çalışma, kişinin ekonomik davranışını etkileyen, duygularını kontrol ederek mantıksız hale getiren birçok bilişsel önyargıyı inceledi. Davranışsal ekonomi, bireyin ve toplumun çıkarlarına hizmet edecek kararların kalitesini düzeltmeye ve iyileştirmeye yönelik mekanizma ve uygulamalarıyla ortaya çıkmıştır.Çalışma İslam Hukuku, insanlara yararlı olan hukukun kaynağının her şeyi bilen Yüce Allah olduğunu kabul ederek batıyı bu konuda geçmiş olduğunu göstermiştir. Öyle ki, Müslüman insanlardan ve onlar için faydalı olanlardan haberdar olan İlahi bir kaynaktan elde edilen olgun Ekonomi ışığında kararlar alabilmektedir, ayrıca Kur'an-ı Kerim ve Sünnet, insanın bilişsel önyargıları olduğunu ve bunlarla baş etmeyi ve olumsuz etkilerinden kaçınmak gerektiğine vurgulamıştır. İslam Ekonomi uygulamaları zaruretler, ihtiyaç ve isteklerden oluşan üç tüketim düzeyi aracılığıyla İslam hukukunun hedeflerine ulaşmayı amaçlamaktadır. Aynı zamanda, yoksulun zengininin parasında hakkı olduğu ve ekonomi kararların etkisi ölüm sonrasına kadar devam ettiğini öngörmektedir. Araştırma aynı zamanda Batılı bilim adamlarının bilişsel önyargıların tüm yansımalarına çözüm bulamadığını da gösterdi. Araştırma ayrıca davranışsal ekonominin İslam ekonomisine diğerlerine göre daha yakın olduğu, toplumun kesimleri arasında dengeyi ve daha yüksek insani değerleri sağlamak için mekanizmalarından yararlanmak mümkün olduğu sonuçları ile sonuçlandı."
