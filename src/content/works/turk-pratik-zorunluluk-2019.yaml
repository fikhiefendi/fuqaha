abstract: "İslam hukuk tarihi boyunca, ilk devirlerden beri ictihadların bir araya getirilmesi ve siyasi otorite eliyle resmileştirilmesi çabaları söz konusudur. Bununla birlikte ülke sathında geçerli olmak üzere ayrıntılı ve kapsamlı bugünkü anlamda kanun niteliğini taşıyan hukuk normlarının devlet tarafından resmen ilan edilmesi Osmanlı'nın son döneminde gerçekleşmiştir. Kanunlaştırma hareketlerinin ürünü olan bu kanunlar İslam hukuk tarihi bakımından da bir dönüşümü ifade eder. Kanunlaştırmanın temel fonksiyonu uygulanacak normların belirlenmesi, bu normların standart hale getirilmesi ve bu normlar bütününün vatandaşlara bildirilmesidir. Bu fonksiyonları karşılayan“hukuk güvenliği”ilkesinin kanunlaştırma ile diyalektik ilişkisi tezimizin ana teması olacaktır. İslam hukukunda hukuk güvenliğini gerçekleştirecek türlü kurumlar var olmuş, farklı teamüller, yöntemler uygulanmıştır. Netice olarak günümüz dünyasında hukuk güvenliğinin sağlanmasına hizmet eden kanunlaştırma bu noktada fonksiyonel bir vasfı haiz olup genel geçer bir zorunluluk haline gelmiştir."
