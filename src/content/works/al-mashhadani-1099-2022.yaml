abstract: "Bu tez (H. 1099 yılında hayatta olan) âlim Abdülkadir Çelebizade el- Hanefi'nin“Fakihlerin Faydaları”adlı kitabının، temizlik bâbından nafaka bâbına kadar olan kısmının analizini içermektedir. Bu kitap، Hanefi fıkhında büyük bir öneme sahiptir ve temizlik babından hileler babına kadar bütün fıkhî bâbları kapsayıp، bunlarda önemli bir fetva bulunmayan bâb neredeyse bulunmadığından fıkhi fetvalar konusunda temel bir referans kabul edilmektedir. Aynı şekilde، İmam Ebu Hanife rahimehullahın öğretisinin ve fetvalarının günümüze ulaştığı en eski ve en nadir kitaplardan sayılmaktadır. Bu çalışmanın araştırma bölümünde Allâme Abdulkadir Çelebizade el-Hanefî'nin ilmî şahsî kişiliği incelenirken betimleyici- tarihsel yaklaşım izlenmiştir. Metnin analiz edildiği bölümde; metnin yazımı ve harekelendirilmesi، nüshaların karşılaştırılması ve farklarının tespit edilmesi، meselelerin geçtiği yerlerin ve ifadelerin kimlerden alındığının tespit edilmesi ve dipnotlarda belirtilmesinde ise inceleme ve araştırma metodu izlenmiştir. Bu çalışmadan çıkan sonuçlar şunlardır: a) Müellif، önemli Hanefi alimlerinin fetvalarının arasından en bariz olanlarını kitabında toplamıştır. b) İmam Hanefî ve onun takipçileri، Semerkandî، Tahavî ve onların dışındaki farklı dönemlerde yaşamış farklı mezhep alimlerini eserinde toplamıştır. c) Okuyan kişinin okumasını ve öğrenmesini kolaylaştırmak için farklı fıkhi meselelere göre bir şekilde sınıflandırıp kitabında toplayıp muğlak ifadeleri kolaylaştırarak düzenlemiştir. d) Aynı şekilde müellif nafaka bâbından; fakihler ve hukukçular için çağdaş kanunlara uygulanması mümkün olabilen; o dönemin devletinde dil ve metodu iyi olan Hanefi fakihleri tarafından kullanılan önemli fetvalardan pek çoğunu miras bırakmıştır."
