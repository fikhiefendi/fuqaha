abstract: "İnsanlar arasındaki anlaşmazlıklar ilk dönemlerden itibaren varolagelmiş, barış ortamı herkesin gönlünde yer etmesine rağmen insanlık savaş kavramından ayrı kalamamıştır. Bireyler arasında olduğu gibi, devletler arasında da çeşitli tesir ve sebeplerden dolayı şavaşa varan veya daha küçük çaplı sayısız anlaşmazlıklar ve ihtilâflar ortaya çıkmıştır. İnsanlığın ortak tecrübelerine dayanan ve büyük ölçüde Avrupa kaynaklı olan bu günkü Devletler Hukûku, devletlerin devletlerle olan ilişkilerini düzenlerken meydana gelebilecek anlaşmazlıkların çözümüne yönelik çareler getirmeye çalışmıştır. Teoride çok parlak çözüm yolları dile getirilirken, pratikte durum hiç de istenilen boyutlarda gerçekleşmemiştir. Bunun temelinde büyük bir problem yatmaktadır: Müeyyideden mahrum oluşu. Günümüz hukûkunda durum böyleyken, İslâm hukûku anlaşmazlıklarda devamlı barışı ön plana çıkarmaya çalışır. Hedef, bütün insanlığın din, dil, ırk, millet ve devlet ayırımı gözetmeksizin barış içerisinde yaşaması yani“Dünya Barışı”dır. Anlaşmazlık hali ise, bu hedefi engelleyecek güçlerin çıkması halinde ortaya çıkar ve istenmeyen durum gereken çarelere başvurularak bertaraf edilmeye çalışılır. Bu faaliyetin tek kelimeyle ifâdesi“Cihâd”dır. İslâm'a göre devlet; nihâi hedefi bütün dünyada Allah'ın irâdesini ve adâleti tahakkuk ettirmeye vesile olan bir düzenlemeyi ifade eder. Dolayısıyla bütün gayretler mezkûr hedefin gerçekleştirilmesine yönelik olacaktır. Bu doğrultuda anlaşmazlık kavramı ve bunun doğuracağı savaş hali, İslâmî tebliğe engel olan, İslâmın öngördüğü prensiplere ters düşen her türlü tutum ve uygulamayı ifade etmektedir. Dolayısıyla anlaşmazlık ve savaş sebebi sayılacak problemler müslümanlar tarafından değil, muhâlif taraflardan kaynaklanır. İslâm Devletler Hukûkunu günümüz hukûkundan ayıran en büyük özellik, maddî müeyyideler yanısıra manevî müeyyideler getirmesi ve bunu çok sıkı bir şekilde uygulamasıdır. Maddî müeyyideleri; a) Haksızlık, adâletsizlik ve zulüm gibi durumlara en kısa zamanda ve en etkili yollarla karşı koyulması ve bunun müslümanlara“el-emru bi'l-ma'rûf ve'n-nehyü ani'l-münker”prensibiyle önemli bir görev olarak yüklenmesi. b) Devletler Hukûkunun temeli olarak gösterilen“Ahde vefâ”konusu, bir çok Kur'an ve sünnet nassıyla vurgulanırken, andlaşmalarına aykırı davrananlarla mücâdele edilmesi konusunda gelen kesin emirler. c) Müslümanlararası anlaşmazlıklarda, adâletsizlik ve zulümde haddi aşan tarafların diğer müslümanlarca te'dip edilmesi, bu tutumlarında inat eden tarafla gerekirse en şiddetli yollar denenerek mücâdele edilmesine dair emirler şeklinde sıralamak mümkündür. Manevî müeyyideler kendini daha çok ahde vefâ, adâlet, eşitlik ve haklara riâyet gibi alanlarda gösterir. Bu ve benzeri konularda hassâsiyet gösterenlerin âhiret mükâfatıyla müjdelenmesi, aykırı davrananların ise şiddetli cezâlar ile tehdit edilmesi, dolayısıyla insanların ve özellikle idârecilerin bu gibi uygulamalardan şiddetle sakındırılması manêvî müeyyideler arasında sayılabilir. Devletlerarası münâsebetlerde normal ve sürekli halîn barış olduğunu kabul eden, savaşın bizâtihi çirkin ve ancak zarûret gereği başvurulan geçici bir durum olarak değerlendiren İslâm, bir anlaşmazlık halinde öncelikle barış yollarının denenmesi gerektiğini, yapılan gayretlere rağmen bunda başarılı olunamaması halinde zulmü, adâletsizliği, haksızlığı ortadan kaldırma amacıyla savaş yoluna mürâcaat edilebileceğini kabul etmektedir. Harbî denilen gayr-i müslim düşmanlarla bir anlaşmazlık çerçevesinde karşı karşıya gelindiğinde, onlarla mürâveze, mütâreke, musâlaha, muâhede, müsâleme, muvâdaa ve mühâdene terimleriyle ifade edilen barış esaslı yollar denenerek uzlaşma çareleri aranabilir. Bu kavramlar birbirine yakın anlamlar taşısalar da, bağlayıcılık, süreli yada süresiz oluş ve sonuçları itibarıyla birbirlerinden farklı kullanımlara sahiptirler. Bir barış andlaşmasını, diğer ifadesiyle musâlahayı hazırlayan sebeplerin başında bir tarafın teslim olması veya boyun eğmesi gelmektedir. Ancak İslâm Hukûkuna göre müslümanlar kuvvet kullanılması gereken durumlarda dahi tebliğ esasını ön planda tuttukları için, mal-mülk ve zenginliklere tamâ ile değil İslâmın tanıtılması yayılması için mücâdele etmelidirler. Dolayısıyla müslümanların galibiyeti, savaşa dahi gerek duyulmadan karşı tarafın müslümanlığı kabul etmesi, kendi dinlerinde kalmayı tercih etmeleri halinde cizye vermeyi kabullenmeleri, her iki şıkkın da reddedilmesi halinde kendileriyle savaşılarak güçsüz bırakılmaları şekillerinden biriyle gerçekleşir. Bütün şıkların doğurduğu bir takım sonuçlar vardır ve müslümanlar bu şartlara eksiksiz uymak zorundadırlar. Diğer sebepler ise; mağlup tarafın galip ülke sınırları dahilinde yaşamayı kabullenmesi, hiç bir zorlama olmaksızın bir diğer devletin himâyesinin kabulü, müslümanlar açısından bir zarûret veya maslahatın bulunması, diplomasi yollarının denenmesi, her iki tarafın andlaşma yapmaksızın ve barış süresini belirlemeksizin savaşı bırakmaları şeklinde sıralanabilir. Yapılan bir barış andlaşmasında bazı unsurların bulunması gereklidir. Bunlar; tarafların rızâsı, andlaşma metninin yetkili makamlarca imzâ ve tasdik edilmesi, musâlahanâme yani yazılı bir andlaşma metninin olması, musâlahanın ne kadar süreyle yürürlükte kalacağının belirtilmesi gibi şartlardır. Musâlaha yapma yetkisi, öncelikle devlet başkanına aittir. Eğer devlet başkanı kendi yerine andlaşma yapmayla yetkili bir vekil tayin etmişse, bu kişi veya kişiler barış andlaşmaları yapıp imzalayabilirler. Bir barış andlaşması, andlaşma süresinin tamamlanmasıyla, düşman tarafın andlaşmaya ters davranışlar içine girmesiyle, yine düşman tarafın ihânet edeceğine dair kuvvetli delillerin ortaya çıkmasıyla, taraflar arasında beklenmedik bir savaşın patlak vermesiyle, karşılıklı tarafların anlaşarak andlaşmayı feshetmeleriyle sona erebilir. Eğer karşı tarafın andlaşmayı ihlâli söz konusuysa, İslâm devletince tek taraflı olarak andlaşma feshedilebilir. Ancak müslümanların bunu karşı tarafa bildirmeleri ve dört aylık bir mühlet tanımaları gerekecektir. Milletlerarası anlaşmazlıkların çözümünde kullanılan barış yollarıyla ilgili İslâm'ın kabul ettiği ve hatta emrettiği barış yollarını şu şekilde sınıflandırmak mümkündür; A. Anlaşmazlıkların diplomatik yollarla çözümü a) Görüşmeler-müzâkereler b) Dostça girişim c) Arabuluculuk B. Anlaşmazlıkların milletlerarası teşkilâtlarca çözümü C. Anlaşmazlıkların yargı yoluyla çözümü a) Tahkîm b) Adâlet Divanı Bu yollarla ilgili söylenebilecek en önemli nokta, bunların uygulanmasının büyük ölçüde ihtiyâri oluşudur. Anlaşmazlık halindeki ülkeler barışı istemeleri halinde bu yollardan birine mürâcaat ederek, içinde bulundukları duruma son verebilirler."
