abstract: "Toplumun temel öğesi sayılan aile ile ilgili konulara İslâm hukukunda geniş yer verilmiştir. Bu konular içerisinde İslâm hukukunda ailenin korunması için dolaylı ya da doğrudan birçok tedbirin alındığını görmekteyiz. Tedbirler içerisinde evlenecek kişilerin görüşmesi, evlilikte kızın rızasının alınması, evlenecek kişiler arasında denkliğe dikkat edilmesi, zina ve alkollü maddelerin yasaklanması, ailede problem yaşanması halinde eşlere nasihat edilmesi, aile meclisinin kurulması gibi konuları sayabiliriz. Çalışmamızda bu konuları, ailenin kuruluşunda, ailenin devamına ilişkin ve sarsılan ailelere yönelik İslâm'ın ailenin korunması için aldığı tedbirler şeklinde sınıflandırarak açıkladık. Konularımız içerisinde yeri geldikçe toplumumuzda yapılan güncel istatistiksel bilgiler verilmiş, Osmanlı Hukûk-ı Âile Kararnâmesi ve ülkemizde geçerli olan meri kanunlarla konu karşılaştırmalı olarak işlenmeye çalışılmıştır."
