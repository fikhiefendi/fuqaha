abstract: "İnsanlar parayı kullanmaya ve biriktirmeye başladığı dönemlerden itibaren ellerinde olan birikmiş parayı değerlendirme yoluna gitmişlerdir. Bu birikimlerin değerlendirilmesi ise dönemler içinde farklılık göstermiştir. İlk zamanlar tüccarlara veya saraya emanet edilen paralar zamanla kredi veren kişiler tarafından kullanılmaya başlanmıştır. Bu faaliyetlerin yaygınlaşması ile bankacılık ve faiz uygulamaları da yaygınlık kazanmıştır. Faiz uygulamaları toplumsal anlamda din engeline takılınca alternatif arayışlarına gidilmiş ve bu sayede faizsiz bankacılık modelleri geliştirilmiştir. Hazırlanan çalışmada insanların faizsiz bankacılık modellerini tercih etme nedenleri tespit edilmeye çalışılmıştır. Bu bağlamda, çalışma sonucunda katılım bankası yatırımcılarının katılma hesapları seçimini etkileyen 3 önemli faktör olan tutum, sübjektif normlar ve dindarlık ölçekleri önemli derecede etkiledikleri görülmüştür. Ayrıca katılım bankası yatırımcıları faiz hassasiyetine sahip oldukları için konvansiyonel bankacılığın alternatifi olan katılım bankaları yatırımcılar için büyük önem taşımaktadırlar. Son yıllarda gelişen İslami finanslar birlikte katılım bankaları da dünya da ki gelişmeyle doğru orantılı bir şekilde ülkemizde de önemli mesafeler kat etmiştir ve etmeye de devam edecektir. Türkiye'de kamu katılım bankalarının kurulması da bu durumun en büyük göstergesidir. Hızla büyüyen katılım bankaları ülke ekonomisine de büyük fayda sağlayacaklardır."
