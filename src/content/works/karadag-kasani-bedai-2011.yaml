abstract: "Hicri 587 yılında vefat eden Kâsânî Hanefî mezhebinin önemli fakihlerinden birisidir. Bu fakihin en önemli eseri Bedai`s-Sanai`'dir.Kâsânî bu esrinde kendi mezhebinin görüşlerini vermekle beraber diğer mezhep imamlarına da atıfta bulunmuştur. Kâsânî'nin atıfta bulunduğu mezhep imamlarından biri de İmam Mâlik'tir. Bu çalışmamızda Kâsânî'nin İmam Mâlik'e atfettiği görüşleri ibadetler özelinde tahkik ettik.Bu çalışmamız iki bölümden oluşmaktadır. Birinci bölümde temel ibadetler olarak değerlendirilen namaz, zekât, oruç ve hac konuları işlenmiştir. İkinci bölümde yine ibadetler kapsamında değerlendirilen temizlik, itikâf, av ve kurban, kefaretler ve haramlar ve helaller konuları işlenmiştir.Sonuç olarak Kâsânî bu eserinin ibadetler bölümünde İmam Mâlik'e 121 görüş atfetmiş olup bunlardan 93 tanesinin nisbetinde isabet etmiş olup, 28 tanesinde hata etmiştir."
