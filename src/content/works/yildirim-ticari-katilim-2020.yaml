abstract: "Varoluşundan beri çeşitli risklere maruz kalan insan kendini sigorta ile ekonomik güvence altına alarak korumaya çalışmıştır. 14.yy'dan itibaren uygulanmaya başlanan ticari sigorta bazı fıkhî mahzurlardan dolayı eleştirilere maruz kalmıştır. Bu nedenle 20.yy'da Müslümanlar ticari sigortaya alternatif olarak katılım (tekâfül) sigortasını uygulamaya başlamışlardır. Bu noktada söz konusu iki sigorta türünün meşruluğu tarihi süreç içerisinde farklı bakış açılarıyla ele alınmıştır. Ancak biz çalışmamızda söz konusu sigorta sözleşmelerini daha çok taraflar perspektifinden ele almaya çalıştık. Bu açıdan ticari sigortada ve katılım sigortasında tarafların kimlerden oluştuğu ve taraflar arasında nasıl bir akit yapıldığı araştırmamız boyunca tespit edilmeye çalışılmıştır. Bu kapsamda çalışmamız üç bölümden meydana gelmektedir. Birinci bölümde ticari sigorta ve katılım sigortasının kavramsal çerçevesi ve tarihi gelişim aşamaları ele alınarak, ilk bölüm ile ikinci ve üçüncü bölümün temelleri atılmıştır. İkinci bölümde ticari sigortanın tarafları arasındaki fıkhî ilişki, üçüncü bölümde ise katılım sigortasının tarafları arasındaki fıkhî ilişki incelenmiştir. Birinci bölüm farklı disiplinlerden elde edilen verilerden faydalanılarak oluşturulmuştur. İkinci bölümde konu bağlamında karşıt düşüncelere yer verilmiş birbirine muhalif olan düşünceler karşılaştırmalı olarak ele alınmıştır. Üçüncü bölümde ise tümevarım ve karşılaştırma yöntemlerinden faydalanılarak konu aydınlatılmaya çalışılmıştır. Tartışmalar hususundaki şahsi fikrimiz ise bölüm sonlarında ifade edilmiştir."
