abstract: "Bu çalışma ile nesih teriminin bütün manalarının ve nesih teorisinin tarih boyunca gelişim ve değişiminin fıkıh usûlü literatürü sınırları gözetilerek ve Gazzâlî merkezli olarak ortaya koyulması amaçlanmıştır. Gazzâlî İslam ve batı dünyasınca en çok tanınmış âlimlerden birisidir. O İslam dünyasında güçlü zekâsı, kuvvetli hafızası ve hızlı kavrayışı ve fesahati ile meşhur olmuştur. Mustasfâ ve Menhûl isimli kitapları ile de fıkıh usulünde bir otoritedir.Bu çalışma esnasında neshin klasik dönem sözlüklerinde ?birbirinin arkasından gelen her şey diğerini neshetmiştir? tanımını farkettik. Bu kelime ardından gelme ile ilintili bütün ifadeleri ?ilga, değiştirme, taşıma, kopyalama gibi- kapsayan bir kelimedir. Fakat Bakara suresinde ki nesih ayetinde ?? ????. İfadesi hem arkasından gelme, getirme hem de bağlamı itibarıyla ilga, yok etme manasına gelmektedir. Âyet kavramı da hem din hem de Kur'ân-ı Kerimden bir parça manasına geldiği için, neshi kabul edenler ya da inkar edenler bu ayeti iddialarına delil gösterebilmişlerdir. Bu iki grup arasında uzlaşmaz bir ayrılık varmış gibi görünsede aslında neshin geniş manasından dolayı bir yanlış anlama söz konusudur.Bu çalışma neticesinde tespit edilen hususlar şunlardır.Bütün akademisyenler tarafından iyice anlaşılması gerekir ki ?Nesih ve ilga farklı kavramlardır?. Neshin Türkçe'de ilga olarak anlaşlıması ve ingilizce'ye abrogation olarak çevrilmesi hakikatin önüne beton duvarlar örmekte ve gerçeğin anlaşılmasını engellemektedir. Nesih kelimesinin içerisinde ilga manasının da olması neshin ilga demek olduğu manasına gelmez.Kuranda nesih vardır, fakat ne geçerliliğini yitirmiş bir hüküm ne de Kur'ân-ı Kerimde iken silinmiş bir kelime vardır. Çünkü bunları gerektirecek ayetler arasında bir tenakuz yahut ihtilaf yoktur olamaz.Bugün dâhil olmak üzere klasik âlimler ile modern akademisyenler arasındaki nesih tartışması, Bakara suresindeki nesih kavramının bağlamından yanlış anlaşılması ve kimi akademisyenlerin geleneği anlamak yerine inkâr etmeyi çağdaşlığın gereği gibi algılamalarındandır."
