abstract: "İllet fıkıh usulünün en önemli konularından birisidir. Bu nedenle hükümlerdeki illetin belirlenmesi İslam Hukukçularının en önemli uğraşlarından biri olmuştur. Biz de bu tezimizde Hakim et-Tirmizî'nin İlelü'l-İbadât adlı eserini tahkik etmek istedik. Üç bölüme ayırdığımız çalışmada ilk olarak müellifin hayatı ile yaşadığı devri tanıttık. İkinci bölümde eseri tanıttık. Üçüncü bölümdeyse eserin tahkikli metnini verdik."
