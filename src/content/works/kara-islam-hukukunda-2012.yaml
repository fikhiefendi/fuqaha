abstract: "İslâm hukuku literatürü incelendiğinde, alım-satım akitleriyle ilgili hükümlerin ele alındığı bölümlerde bir alım-satım akdi yapılırken alınan mal ile malın bedelinin (semen) peşin ya da vadeli olması meselesinin de özenle incelendiği ve bu akitlerde mebi'in ve semen'in peşin yahut vadeli olması bakımından dört durumun ortaya çıktığı görülmektedir: Her ikisi peşin; Mal peşin bedel veresiye; Mal veresiye bedel peşin; Her ikisi de veresiye. Birinci şekil, insanlar arasında en çok gerçekleştirilen muamele olup bu muamelenin caiz olduğu hususunda alimler ittifak etmişlerdir. İkincisinin de Kur'an ve Sünnet'te caiz olduğuna işaret eden açık ifadeler vardır. Üçüncüsüne ise Hz. Peygamber tarafından bir takım tedbir ve ta'dillerle izin verildiğini görmekteyiz. Son olarak dördüncü şeklin ise (ki bu suret bizim de konumuzu teşkil etmektedir) hadislerde yasaklandığını görmekteyiz. İşte bu dördüncü şekil olan hem semenin ve hem de mebî'in veresiye olduğu muameleler fıkıh literatüründe ?bey'u'd-deyn bi'd-deyn? diye ifade edilmektedir. ?Bey'u'd-deyn bi'd-deyn? konusundaki tartışmalar ise ?bey'u'l-kâlî bi'l-kâlî? hadisi etrafında cereyan etmektedir. Araştırmamızda ?bey'u'd-deyn bi'd-deyn? konusuna dayanak teşkil eden mezkur hadisi ele alarak bu hadisin kapsamını, yani hangi tür muameleleri kapsadığını ve bu muamelelerin caiz olup olmadığı hususundaki İslam hukuk bilginlerinin görüşlerini vermeye çalışacağız."
