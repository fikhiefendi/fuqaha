abstract: "Bu çalışmada Mesâil-i Fıkhiye adlı eserin 55a-107a varakları arasında dil incelemesi yapılmıştır. Mesâil-i Fıkhiye'nin telif tarihi belli değildir. Eserin Türk Dil Kurumu El Yazması ve Nadir Eserler Veri Tabanı Kitaplığında, Yz. A307 numarada kayıtlı bulunan nüshası üzerinde çalışılmıştır. Bu nüsha hicri 1113, miladi 1701 yılında istinsah edilmiştir. Çalışma“Giriş – İnceleme – Metin – Dizinler – Tıpkıbasım”olmak üzere beş bölümden oluşmaktadır. Giriş bölümünde ilk olarak fıkıh terimi ve fıkhın Osmanlı Devleti'ndeki yeri hakkında bilgi verilmiştir. Ardından eserin müellifi, telif tarihi, yazılış sebebi ve nüshaları gibi esere dair hususiyetler tanıtılmıştır. İnceleme bölümünde yazılış özellikleri ve ses olaylarına yer verilmiştir. Metin bölümünde eserin çeviri yazılı bir şekilde yeni yazıya aktarımı yapılmıştır. Dizinler bölümünde eserde yer alan kelime ve eklerin dizinine yer verilmiştir. Tıpkıbasım bölümünde eserin tıpkıbasımı mevcuttur. Klasik Osmanlı Türkçesi dönemine ait olan Mesâil-i Fıkhiye adlı eserde dudak uyumuna girmiş, girmemiş ve ikili şekilli kelime tabanları ve ekler bir arada bulunur. Buna dayanarak eserin dudak uyumu sürecinin geçiş döneminde olduğu söylenebilir."
