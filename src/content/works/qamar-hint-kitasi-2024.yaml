abstract: "Bu çalışma, Hint Alt Kıtası'ndaki fıkhî faâliyatlarini inceleyen bir araştırmadır. İslâm hukuku, fıkıh adıyla anılan özel bir ilim dalıdır ve hem Kuran hem de Peygamberimiz Muhammed'in (s.a.v.) sünneti ile ilgili hem de insan hayatının geniş yelpazesiyle ilgilidir. Aynı zamanda fıkıh, Allah ve insanla da ilişkilidir. Bu sebeplerle İslâm hukuku, Asya, Avrupa ve Afrika'nın büyük bir kısmında bin yılı aşkın bir süredir uygulanagelmiş ve farklı kültürler ve bölgelerle etkileşime girerek değişen sosyal ve ekonomik koşullara uyum sağlamıştır. Bu durum, Müslüman dünyasındaki düşünürlerin ilk andan itibaren İslâm hukukuna olan ilgisini artırmıştır. Hit Alt Kıtası'nda İslâm ilimlerinin etkisiyle birlikte başlangıçta hadîs ilmine daha fazla ağırlık verilmiştir. Özellikle Sind ve Gucerât bölgelerinde bu şekilde gerçekleşmiş, ancak daha sonra fıkh âlimleri de ilgi görmeye başlamıştır. Bu dönemde, el-Fetâva't-Tatarhâniyye, el-Fetâva'l-Hindiyye, yargılama hukuku konusunda Sinvânü'l-Kadâ ve Unvânü'l-İftâ gibi önemli eserler ortaya çıkmıştır. Ayrıca, usûl-i fıkıh konusunda Müsellemü's-Sûbût ve onun şerhi Fevâtîhu'r-Rahamût ve Nûrul-Envâr gibi eserler de dikkat çekmiştir. Bu eserlerin bir kısmı fıkh ansiklopedisi olarak adlandırılabilir. İslâm dünyası, Hint Alt Kıtası'ndaki İslâm hukukçularının hizmetlerini takdir etmiş ve Arapçanın yanı sıra Urduca dilinde de İslâm hukukuyla ilgili önemli çalışmalar yapılmıştır. Muhammed İshâk Battî'nin Fukahâ-yı Hind adlı Urduca kitabından da bu ilgi açıkça anlaşılmaktadır. Hint Alt Kıtası'ndaki İslâm hukukçularının ve ilim adamlarının İslâm hukukuna olan bu özel ilgisi, bu bölgenin İslâm hukuku alanındaki konumunu anlamak için Türkiye'de bir araştırmanın yapılmasını gerektirmiştir. Bu yüksek lisans tezi, bu ihtiyacı karşılamaya yöneliktir. Nitel araştırma yöntemiyle gerçekleştirilen bu çalışma, İslâm hukuku alanında Hint Alt Kıtası'ndaki 1857 sonrası fıkıh faâliyetlerinin incelenmesine odaklanmakta ve İslâm hukukçularını tanıtmayı ve yaklaşımlarını ortaya koymayı amaçlamaktadır."
