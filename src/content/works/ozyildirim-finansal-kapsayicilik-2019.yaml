abstract: "Küresel anlamda bakıldığında, finansal hizmetlerin erişilebilirliği, kullanılabilirliği ve kullanımı açısından en önemli kuruluşlar bankalardır. Politika yapıcıların önemli önceliklerinden birisi bankalar aracılığıyla oluşturulan finansal piyasayı daha kapsayıcı hale getirmek, tüm yetişkinlerin erişebildiği ve tasarruflarını finansal piyasalar aracılığıyla kullandığı kapsamlı bir finansal piyasa oluşturmaktır. Çalışmada Sarma (2008) tarafından geliştirilen yetişkin bireylerin finansal hizmetlere ne ölçüde eriştiklerini ve kullandıklarını ölçen mevduat ve katılım bankacılığı verilerini esas alan finansal kapsayıcılık endeksi Türkiye için illere göre hesaplanmıştır. Bu endeks 0 ile 1 arasında değerler almakta, 0 değeri finansal kapsayıcılığın dışında kalındığını, 1 ise finansal kapsayıcılığın tam olarak sağlandığını göstermektedir. Çalışma kapsamında Türkiye'nin 2011-2017 yıllarını kapsayan 81 ili için finansal kapsayıcılık endeksi oluşturulmuştur. Yine aynı yöntem ile Türkiye'nin 2007-2017 yıllarını kapsayan 81 ili için katılım bankacılığının finansal kapsayıcılığı da hesaplanmıştır. Finansal sistemin boyutlarının gösterildiği endeks değerlerinde bölgeler arasında büyük farklılıklar olduğu saptanmıştır. Oluşturulan endeks değerlerinin ekonomik büyüme ile arasında nasıl bir ilişki içinde olduğu Kantil Regresyon yöntemiyle detaylı olarak incelenmiştir. Bulgular düşük kantil bölgelerinde istatistiksel olarak anlamlı bir ilişkinin bulunduğunu, yüksek kantil bölgelerinde ise anlamlı fakat negatif bir ilişkinin bulunduğunu ortaya koymuştur."
