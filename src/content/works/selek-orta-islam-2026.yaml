abstract: "Bu çalışmada, 11-14. yüzyıllar arasında Buhara bölgesinde ilmî, siyasî ve sosyal hayatta önemli bir yere sahip olan Burhân ve Mahbûbî aileleri ele alınmıştır. Hanefî mezhebinin Mâverâünnehir bölgesindeki gelişiminde etkili olan bu ailelerin ilmî faaliyetleri, yetiştirdikleri âlimler, eğitim kurumlarıyla ilişkileri ve toplum üzerindeki etkileri incelenmiştir. Araştırmada özellikle ailelerin Buhara’daki dinî otoritenin şekillenmesindeki rolleri, sadr makamı üzerinden değerlendirilmiştir. Ayrıca Moğol istilası sonrası değişen ilmî ve siyasî şartlar çerçevesinde bu ailelerin ilmî mirası ve mezhep geleneğine katkıları ortaya konulmuştur. Çalışmada klasik tabakat, tarih ve biyografi kaynaklarının yanı sıra modern araştırmalardan da yararlanılmış; Burhân ve Mahbûbî ailelerinin Hanefî düşünce tarihindeki yeri bütüncül bir bakış açısıyla değerlendirilmiştir. Böylece Buhara’nın ilmî mirasının anlaşılmasına ve Hanefî mezhep tarihine katkı sunulması amaçlanmıştır. Çalışmamız giriş ve iki bölümden oluşmakla birlikte, giriş kısmında araştırmanın konusu, amacı, kapsamı, yöntemi ve kaynaklarına dair bilgiler yer almakta olup bölümlere geçmeden önce Buhara’nın sosyo-politik ve kültürel yapısı ile “sadr” unvanının dinî ve siyasî otorite açısından taşıdığı anlam incelenmiştir. Birinci bölümde Burhân ailesi ve mensupları, ikinci bölümde ise Mahbûbî ailesi ve mensupları incelenmiştir."
