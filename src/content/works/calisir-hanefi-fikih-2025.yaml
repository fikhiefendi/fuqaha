abstract: "Fıkıh usûlünün konusu olan şer'î hüküm birtakım kavramlar üzerine temelledirilmektedir. Bunlardan biri de hükmün varlığının bir yönüyle kendisine bağlandığı şart kavramıdır. Çalışmanın amacı bu kavramı Hanefî bakış açısıyla şer'î / vaz'î bir hüküm olarak usûl-fürû-i fıkıh ilişkisini dikkate alan bir yaklaşımla incelemek ve bu çerçevede yürütülen hukuk mantığını ortaya koymaktır. Araştırmada literatür taraması yapılmıştır. Tezin birinci bölümünde şart kavramının şer'î / vaz'î yönünü ortaya koyabilmek için öncelikli olarak şer'î hüküm teorisi genel hatlarıyla ele alınmış; hükmün tanımı, tasnifi ve kaynakları incelenmiştir. Akabinde fukâha metoduyla yazılan usûl literatüründe şart ve ilgili kavramların analizi ve tasnifi yapılmıştır. İkinci bölümde de şartla ilgili usûl meseleleri Hanefî hukuk bakış açısıyla bir araya getirilerek incelenmiştir. Üçüncü bölümde ise teorik düzlemde işlenen şartla ilgili usûl kâidelerinin fürû-i fıkıhta nasıl tatbik edildiği ve yorumlandığı fer'î örnekler üzerinden mülahaza edilmiştir. Sonuç olarak usûlde farklı bağlamlarda birçok meselenin içerisinde ele alınan şart kavramına dair birtakım kâideler tahric edilmiştir. Tahric edilen bu kâidelerin bazısının fürû-i fıkıhta şer'î gayelerin tahakkuku doğrultusunda esnetilirken bazısının katı bir şekilde tatbik edildiği ve bazılarının da dilin vaz'ının gereğiyle sınırlandırıldığı görülmüştür. Son tahlilde ortaya çıkan bu farklılık usûl-fürû arasında bir çelişki değil bilakis hukuk mantığı içerisinde tabii bir durum olarak yorumlanmıştır."
