abstract: "Bu tezde, Osmanlı hukuk tarihinin en kapsamlı kodifikasyonlarından biri olan Mecelle-i Ahkâm-ı Adliyye'nin şerh geleneği içindeki yeri incelenmekte; bu bağlamda Gelibolulu Mehmed Rifat Efendi'nin Tevâfukât-ı Kavâid-i Külliye adlı eseri detaylı biçimde ele alınmaktadır. Çalışmanın temel amacı, eserin Mecelle'de yer alan küllî kaidelerle kurduğu ilişkiyi, bu kaideleri yorumlama yöntemini ve şerh geleneğine özgün katkısını ortaya koymaktır. Birinci bölümde müellifin hayatı, görevleri ve ilmî kişiliği ile birlikte, Mecelle'nin hazırlanış süreci ve bu sürecin toplumsal-siyasal bağlamdaki etkileri ele alınmıştır. Ayrıca Mecelle'ye dair şerh literatürü de değerlendirilmiştir. İkinci bölümde, araştırmanın merkezinde yer alan Tevâfukât-ı Kavâid-i Külliye eseri yapısal ve yöntemsel olarak analiz edilmiştir. Eserdeki küllî kaidelerin Mecelle maddeleriyle ilişkisi sistematik biçimde incelenmiş, bu irtibatlar tablo ve örneklerle ortaya konulmuştur. Bazı maddelerin farklı kaynaklarla karşılaştırılması, çalışmanın özgün yönlerinden birini oluşturmaktadır. Araştırmada klasik metin çözümleme teknikleri ile güncel hukuk metodolojisi bir arada kullanılmış; Osmanlı Türkçesinden çağdaş akademik dile aktarımlar titizlikle gerçekleştirilmiştir. Müellifin kimliğiyle ilgili sınırlı veriler, aynı isimli farklı şahıslarla karışıklık ihtimali ve maddelerin numaralandırılmasındaki bazı belirsizlikler, çalışmanın bazı bölümlerinde ayrıntılı çözümlemeleri zorunlu kılmıştır. Sonuç olarak bu tez, Mecelle şerh geleneği içinde özgün bir yeri olan Tevâfukât-ı Kavâid-i Külliye adlı eserin hem klasik fıkıh anlayışı hem de Osmanlı hukuk sisteminin yorumlayıcı pratiği açısından önemli bir kaynak niteliği taşıdığını ortaya koymaktadır."
