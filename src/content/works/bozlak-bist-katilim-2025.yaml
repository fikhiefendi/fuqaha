abstract: "Bu çalışma, Türkiye'deki İslami hassasiyeti olan yatırımcılar için yastık altında tutulan âtıl birikimlere karşı Borsa İstanbul Katılım Endeksleri aracılığıyla hisse senedi yatırımının potansiyelini araştırmaktadır. Doküman taraması yöntemiyle elde edilen bulgular, İslami yatırımcıların dini inançlarının finansal kararlarında merkezi bir rol oynadığını ve faizsiz yatırım araçlarına yönelik önemli bir talep olduğunu göstermiştir. Ancak, finansal sisteme güvensizlik, enflasyon endişesi, İslami yatırım araçlarına dair bilgi eksikliği ve düşük finansal okuryazarlık gibi nedenlerle önemli bir tasarruf kesiminin hala yastık altında tutulduğu tespit edilmiştir. BIST Katılım Endeksleri, İslami finans prensiplerine uygun yapısı ve potansiyel faydaları ile yastık altı birikimlere karşı cazip bir alternatif sunmaktadır. Çalışma, İslami yatırımcıların katılım endekslerine yönelik farkındalık ve bilgi düzeylerinin artırılması, finansal okuryazarlığın geliştirilmesi ve finansal sisteme olan güvenin güçlendirilmesinin bu potansiyelin realize edilmesi için kritik öneme sahip olduğunu vurgulamaktadır. Ayrıca, politika yapıcılar ve finansal kurumlar için bir dizi öneri sunularak, İslami finans piyasalarının geliştirilmesi ve âtıl birikimlerin ekonomiye kazandırılması hedeflenmektedir."
