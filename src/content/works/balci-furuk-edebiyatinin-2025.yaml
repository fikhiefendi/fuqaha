abstract: "Furûk,“Birtakım tekniklerle eş anlamlı (müterâdif) ve yakın anlamlı (mütekârib) kelimeler arasındaki nüansları tespit ederek her bir kelimeye diğerine karşı özel bir kimlik belirleyen ilim dalı”olarak tanımlanmaktadır. Daha vecîz bir ifadeyle ise furûk,“lafızları farklı, anlamları yakın kelimeler arasındaki nüansların tespiti”demektir. Çalışmamızda, bir Kur'ân özelliği ve gerçeği olarak değerlendirilen furûkun ulûmu'l-Kur'ân'daki yeri tespite çalışılmıştır. Bir başka deyişle,“Furûk, bir Kur'ân ilmi olarak kabul edilebilir mi? Eğer kabul edilebilirse, bu ilim mevcut Kur'ân ilimlerinden biri altında mı değerlendirilmeli, yoksa (müstakil) bir Kur'ân ilmi olarak mı ele alınmalıdır?”sorularına cevap aranmıştır. İlk bölümünde genel hatlarıyla furûk ilminin incelendiği çalışmamızda ikinci bölüm tamamen bu konuya hasredilmiş olup üç ana başlıkta ele alınmıştır.“Bir ilmin evvela pratiği sunulur, sonra da nazariyâtı oluşur”anlayışıyla, ilk olarak furûkun tefsirlerde (pratik olarak) işlenişi incelenip tefsirlerden furûk örnekleri sunulmuş; ikinci olarak da furûka ulûmu'l-Kur'ân eserlerinde (nazarî olarak) yer verilip verilmediği araştırılıp yer verildiyse nerede, nasıl ve ne ölçüde yer verildiği ortaya konulmuştur. Üçüncü olarak ise furûkun diğer Kur'ân ilimleriyle münâsebeti incelenip onlar karşısındaki konumu netleştirilmiş, akabinde de Kur'ân ilmi olma imkânı çerçevesinde“Kur'ân ve ulûmu'l-Kur'ân”ile“Arap dili ve furûk”açılarından çeşitli argümanlar sunulmuştur. Böylelikle furûkun; Kur'ân ilmi olarak kabulünün önünde herhangi bir engelin bulunmadığı, Kur'ân ilmi olma noktasında her türlü vasfı hâiz olduğu ve dâhi Kur'ân ilmi olarak kabulünün ilmî bir ihtiyaç ve gereklilik olduğu ortaya konularak ulûmu'l-Kur'ân literatüründe (müstakil) bir Kur'ân ilmi olarak yerini alması gerektiği savunulmuştur."
