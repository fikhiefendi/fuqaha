abstract: "?İcmâın Senedi ve İbnü'l-Münzir'in el-İcmâ AdlıEserinde İbadetlerle İlgili Zikredilen İcmâların Sened Açısından Tespiti? isimli tezimiz ?Sonuç? bölümü hariç üç bölüm ve bir ?Giriş? kısmından oluşmaktadır. Girişkısmında icmâ delili, genel hatlarıyla ele alınmıştır. Birinci bölümde ?el-İcmâ? adlı eserin müellifi olan İbnü'l-Münzir'in hayatıve ilmi kişiliği hakkında derlenen bilgilere yer verilmiştir. İkinci bölümde önce genel anlamda sened kavramıüzerinde durulmuş, daha sonra özel olarak icmâın senedi ve icmâa sened olabilecek deliller ayrıbaşlıklar altında işlenmiştir. Üçüncü bölümde ?el-İcmâ? adlıeserde ibadetlerle ilgili zikredilen icmâaların senedleri üzerinde durulmuş, ilgili mezheplerin belirlenen eserleri çerçevesinde bu senedler tespit edilmeye çalışılmıştır. Sonuç kısmında ise bu çalışmada ulaşılan sonuçlar maddeler halinde belirtilmiştir."
