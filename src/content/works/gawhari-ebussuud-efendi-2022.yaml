abstract: "Tezimizin konusunu, Osmanlı şeyhülislamlarından müfessir ve hukukçu Ebüssuûd Efendi'nin (982/1574) İrşâdü'l-akli's-selîm isimli tefsirinin IV. cildinde yer alan hadislerin tahric ve değerlendirilmesi teşkil etmektedir. Esasında Hz. Peygamber'in (s.a.v) sünneti, Kur'an-ı Kerim'in fiilî bir tefsiri mesabesindedir. Bu bağlamda Kur'an'ın tefsirinde rivayetlerden bigâne kalınması mümkün değildir. Her ne kadar tarihsel süreçte metodolojik farklılık sebebiyle rivayet tefsiri şeklinde müstakil bir tür ismi ortaya çıkmışsa da bu kategoriye dahil olmayan tefsirlerin de Rasulullah'tan nakledilen haberlerden yani rivayetlerden istifade etmemesi mümkün değildir. Tefsirlerde kullanılan rivayetler incelendiğinde oldukça farklı tablolar karşımıza çıkabilmektedir. Özellikle tefsirde İsrailiyat kullanımı, bilginin Rasulullah'a aidiyetinin tespiti noktasında göz önünde bulundurulması gereken bir durum olarak öne çıkmaktadır. Ebüssuûd Efendi de tefsirinde rivayetleri kullanmıştır. Telifinden sonra yazılan tefsir kaynakları üzerinde önemli etkisi olan İrşâdü'l-ʿaḳli's-selîm'de yer alan rivayetlerin tespit ve tahrîci önem arz etmektedir. Eserin dördüncü cildini ele aldığımız bu çalışma giriş ve iki bölümden oluşmaktadır. Girişte Ebüssuud Efendi'nin hayatı, ilmi kişiliği, hocaları, öğrencileri ve eserleri hakkında bilgi verilmiştir. Birinci bölümde Enfal ve Tevbe sureleri, ikinci bölümde ise Yûnus, Hûd ve Yûsuf surelerindeki rivayetlerin tahrîc ve değerlendirilmesi yapılmıştır."
