abstract: "Allah, hiçbir kuluna gücünün yetmediği bir sorumluluk yüklememiştir. Kadın ve erkek de gerek fıtrat itibariyle ve gerekse fizyolojik yönlerden birbirinden farklı yaratılmıştır. Ayrıca toplum içinde kadın ve erkeğin üstlendikleri roller de birbirinden farklıdır. Bu yüzden Allah kadınları bazı durumlarda ibadetlerden muâf tutmuştur. Bu çalışmada kadınlara ibadetlerde tanınan muâfiyetler delilleriyle incelenmiştir. Araştırmada öncelikle dört mezhebin klasik fıkıh eserlerine başvurulmuştur. Daha sonra günümüzde yazılmış fıkıh eserlerinden istifade edilmiştir. Çalışma, üç bölümden oluşmaktadır. Birinci bölümde; kadının yaratılışı ve değişik toplumlarda kadının yeri anlatılmıştır. Ayrıca, İslam öncesi ve sonrasında kadının toplumdaki konumuna yer verilmiştir. İkinci bölümde; mükellefiyet ve muâfiyet kavramları açıklanmıştır. Kadın ve erkeğin Allah katında kullukta eşit oldukları ayetlerle ifade edilmiştir. Son bölümde ise, kadınlara taharet, namaz, oruç, zekat ve hac ibadetlerinde tanınan muâfiyetler Kur'an ve sünnetteki delilleriyle açıklanmıştır."
