abstract: "Finansal sistemlerin temel fonksiyonu; tasarrufların, yani mal ve hizmet harcamalarından geriye kalan gelirlerin, yatırımlara dönüşmesine başka bir ifade ile mal ve hizmet üretimi için gerekli olan varlıkların satın alınmasına yardımcı olmaktır. Birçok çeşitliliğine rağmen, hepsinin altında yatan temel uygulama ise çok kolay ve akla yatkınmış gibi görünen faizli borç ilişkisidir. Bilindiği gibi küçük tasarruf sahiplerinden kısa vadeli olarak alınan faizli borçların, uzun vadeli olarak yatırımcılara yine faizli şekilde borç verilmesi ve aradaki farktan gelir elde edilmesi ticari bankacılığın temelidir. Katılım bankaları faizli araçlar kullanmadıkları için, ağırlıklı olarak mal alım ve satımına dayanan, riski az olan murabaha finansmanını kullanmaktadırlar. Bu çalışmada, öncelikle ortaklıklara vurgu yapılmış günümüzde yaygın olarak kurulan şirketler ele alınmış ve bu şirketlerin özelliklerinden bahsedilmiştir. Bir ortaklık türü olan mudarabaya (emek-sermaye ortaklığı) ilişkin fikhi bir perspektife sahip olmak ve mudarabanın İslam'daki yerini detaylı analize tabi tutmak amacıyla mezheplerin meşhur fıkıh kitaplarından istifade edilmiştir. Daha sonra katılım bankacılığı çerçevesinde mudaraba ortaklığının nasıl uygulandığı, mevcut durumu ve sorunları anlatılmış ve bunun sebepleri analiz edilmiştir. Nihai olarak, katılım bankacılığının temel felsefesini oluşturan mudarabanın mevcut katılım bankaları tarafından kullanımının nasıl yaygınlaştırılacağına ilişkin potansiyel modellerden bahsedilmiş ve bazı öneriler sunulmuştur."
