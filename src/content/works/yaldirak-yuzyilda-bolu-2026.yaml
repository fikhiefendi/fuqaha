abstract: "XIX. yüzyıl Osmanlı Devleti taşra idari yapısı içinde değişiklikler olmakla birlikte Bolu sancağı Kastamonu eyaletine/vilayetine bağlı bir sancaktı. Bolu, İstanbul ile Anadolu'yu birbirine bağlayan yol üzerinde yer alan önemli bir merkezdi. Buna bağlı olarak ticari bir canlılığa sahipti. Bu dönemde Bolu'ya, ticaret amacıyla şehir dışından pek çok kişinin gelip ikamet ettiği görülmektedir. Literatürde Bolu'nun XIX. yüzyılının belirli dönemlerini ele alan çalışmalar mevcuttur. Ancak şimdiye değin Bolu tarihinin XIX. yüzyılını bir bütün olarak ele alan müstakil bir çalışma yapılmamıştır. Bu çalışmada Bolu'nun XIX. yüzyıldaki idari, sosyal ve iktisadi yapısı Osmanlı arşiv kaynakları temel alınarak incelenmiştir. Çalışma, üç bölümden oluşmaktadır: İdari yapının ele alındığı birinci bölümde; XIX. yüzyıl boyunca Bolu'da yürürlüğe konulan idari uygulamalar, idari taksimat, muhtarlık ve belediye teşkilatının kuruluşu ele alınmıştır. Ayrıca idari yapıyla ilgili olarak meydana gelen siyasi ve sosyal hadiselere yer verilmiştir. İkinci bölümde XIX. yüzyılda Bolu'daki demografik yapı, aile yapısı, eğitim, tarikatlar, afetler, salgın hastalıklar, ulaşım ve haberleşme başlıkları altında sosyal yapı incelenmiştir. İktisadi yapının ele alındığı üçüncü bölümde ise Bolu şehir merkezinde icra edilen meslekler ve kırsalda sürdürülen tarım, hayvancılık ve ormancılık faaliyetleri üzerinde durulmuştur. Çalışmada kullanılan başlıca arşiv kaynakları arasında; nüfus ve temettuat defterleri, şer'iyye sicilleri, vakıf esas defterleri ve ele alınan konulara ilişkin perakende evrak yer almaktadır."
