abstract: "Bu çalışma, XVI. yüzyılın ortalarındaki hukuki düzenlemelerden hareketle Ebussuûd Efendi'nin Osmanlı Devleti'nde kanunlaştırma sürecindeki rolünü ele almaktadır. Özellikle Rumeli kazaskeri ve şeyhülislam olarak görev yaptığı dönemde Osmanlı hukuk sistemine önemli katkılar sunmuştur. Osmanlı Hukukunda içtihat hukukundan kanun hukukuna geçiş süreci Ebussuûd Efendi'nin hukuki yaklaşımları ve çabalarıyla hız kazanmıştır. Dönemin ihtilaflı hukuk konuları kanun niteliğindeki düzenlemelerle çözülmüş, mezhep içi ve mezhepler arası tercihler kullanılarak uygulamadaki birçok sıkıntı giderilmiştir. Ebussuûd Efendi'nin öne çıkan başarılarından biri, Budin Kanunnamesi'nin mukaddimesindeki fetvalarıyla örfi arazi hukuku esaslarını şerî bir çerçevede birleştirmesi ve Maʻrûzât'taki fetvalarıyla şer'î hukuku kanuni düzen içinde yerleştirmesidir. Ebussuûd Efendi'nin padişaha arz ettiği meseleler ve tercihleri, bu çalışmanın odak noktalarından birini oluşturmaktadır. Bu süreçteki en değerli eserlerinden biri olan Maʻrûzât, Hanefî mezhebinin esahh-ı akvâl prensibine dayanarak hazırlanmış ve mezhep içi ve mezhepler arası tercihlerle şer'i meselelerin çözümlenmesine katkı sağlamıştır. Ebussuûd Efendi'nin derin fıkhi anlayışı, geniş hukuki bilgi birikimi ve sosyal ihtiyaçlara duyarlılığı Osmanlı hukukunun şekillenmesinde etkili olmasını sağlamıştır."
