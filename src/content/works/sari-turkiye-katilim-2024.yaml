abstract: "Bu doktora tezi, Türkiye'de faaliyette bulunan katılım bankaları ile konvansiyonel bankaları, müşterilerine kullandırdıkları finansmandan dolayı maruz kaldıkları riskleri yönetme bakımından karşılaştırmaktadır. Türkiye'de İslami bankacılık faaliyetleri katılım bankası adı altında yürütülmektedir. Katılım bankalarının çalışma usullerinin konvansiyonel bankalardan farklılaşması, katılım bankalarının risk yönetiminin de farklılaşmasına neden olmaktadır. Katılım bankalarının risklerden korunma araçlarının konvansiyonel bankalara kıyasla kısıtlı olması, katılım bankalarının risk yönetiminin konvansiyonel bankalardan farklılaşmasının bir diğer temel nedenidir. Katılım bankaları ve konvansiyonel bankaların kredilerin takibe dönüşüm oranlarını etkileyen makro değişkenler ve mikro değişkenler her iki banka türünde oldukça farklılaşmaktadırlar. Katılım bankalarının çalışma prensiplerinden olan varlığa dayalı finansman ilkesi; katılım bankalarına doğal bir riskten korunma imkanı sağlayarak risk yönetimini kolaylaştırmaktadır. Bu tezde makro ve mikro değişkenlerin katılım bankaları ile konvansiyonel bankaların risk yönetimini nasıl etkilediği kantil regresyon yöntemi kullanılarak tespit edilmiştir."
