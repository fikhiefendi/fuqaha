abstract: "Katılım bankaları, İslami finans sistemi içerisinde faizsiz bankacılık esaslarına göre faaliyet gösteren ve dijitalleşme süreciyle birlikte hızla gelişen finansal kuruluşlardır. Finans piyasasında önemli bir yeri olan bankaların finansal performans değerlerinin devamlı kontrol edilmesi kaçınılmaz olup yapılan analizler sayesinde bankalar müşterilerine finansal performansları ve kârlılıkları hakkında bilgi sağlayabilmektedirler. Bu çalışmanın amacı, Türkiye'de faaliyet gösteren katılım bankalarının finansal performanslarını TOPSIS yöntemi kullanarak değerlendirmektir. Çalışma bankaların finansal verilerinin kullanıldığı 2019-2024 yıllarını kapsayan analizleri içermektedir. Araştırma kapsamında, bankacılık sisteminde özel ve kamu sermayeli olarak toplam 6 adet katılım bankasının finansal performansları ölçülmüş ve belirtilen dönemde hangilerinin en iyi ve kötü performansa sahip olduğu belirlenmiştir. Araştırma sonuçlarına göre, en iyi performansa sahip banka Kuveyt Türk Katılım Bankası iken, en düşük performansa sahip banka Albaraka Türk Katılım Bankası olarak tespit edilmiştir. Katılım bankalarının dijitalleşme sürecinde performanslarını arttırmaları, kazanç olarak geri dönüşünü almalarına ve varlıklarına değer katmalarında faydalı olacaktır."
