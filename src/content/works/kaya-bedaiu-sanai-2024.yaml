abstract: "Bu tez, Hanefi mezhebinin önemli fıkıh kitaplarından biri olan Bedâiü's-Sanâi' fi Tertîbi'ş-Şerâi' adlı kitap özelinde aile hukuku alanında ihtiyata dayalı hükümleri konu edinmektedir. Genel Fıkıh literatüründe sıklıkla atıf yapılan ihtiyat kavramı, şüpheli ya da belirsiz durumlarda hukuki ve dini sorumluluktan kesin çıkmayı sağlayan bir davranış sergilemenin lüzumunu ifade eden bir fıkıh kaidesini temsil etmektedir. Dini hükümlere konu olan hemen her meselede kendisine yer bulan ihtiyat, özellikle ibadetler ve aile hukuku meselelerinde biraz daha ön plana çıkmaktadır. Aile hukukunun son derece hassas bir alan olduğu dikkate alındığında bunun tabii olduğu anlaşılmaktadır. Konunun adı geçen eser özelinde ele alınması sınırlandırma gereğindendir. Konu iki ana bölüm halinde ele alınmıştır. Birinci bölümde eserin müellifi hakkında bilgi verilmiş, eserin tanıtımı yapılmıştır. İkinci bölümde ise nikah ve boşama şeklinde iki ana başlık halinde ele alınmış ihtiyati hükümler incelenmiştir. Çalışmada ulaşılan önemli sonuçlardan biri şu olmuştur: İslam hukuku bilginlerinin ihtiyata bu denli önem atfetmelerini haklı kılan sebepler vardır. Bunlar da ilmi gerekçelere dayanmaktadır."
