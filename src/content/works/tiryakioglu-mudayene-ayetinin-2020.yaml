abstract: "İnsanların gerek bu dünya gerekse ahiret mutluluğunu hedefleyen Kur'ân-ı Kerim her alanda olduğu gibi ticari ve sosyal hayata dair ilkeler ortaya koymuştur. Bu çalışmada Kur'ân'ın en uzun ayeti olan ve borç ilişkilerini düzenleyen müdayene ayeti incelenmiştir. Ayetteki hükümlerin günümüz Türk Borçlar Hukuku ve ona kaynaklık eden Roma Borçlar Hukuku ile benzer ve farklı yönleri üzerinde durulmuş ve ülkemizde yürürlükte bulunan kanunlar ve uygulamalar ile bazı mukayeseler yapılarak günümüz Türk Borçlar Hukukuna ve sosyal hayattaki uygulamalarına etkileri incelenmiştir. Yapılan çalışmada ayetteki hükümlerin birçok noktada ülkemizde yürürlükte bulunan kanunlarla benzerlik taşıdığı, Kur'ân'ın ticari ve sosyal hayata dair evrensel çözümler getirdiği görülmüştür."
