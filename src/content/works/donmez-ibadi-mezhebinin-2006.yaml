abstract: "İslam'da ortaya çıkan ilk mezhep olan Hâricûler ve onlardan ayrılan İbâdiye, İslammezhepleri tarihinde ele alınan bir çok görüşün ilk temsilcileri olmuşlardır. İbâdiyekelâmû görüşlerde bazı noktalarda Mutezileye benzerken, bazı noktalarda Sünnûlerebenzer. İbâdiye Kur'ân, sünnet, icmâ ve kıyası İslam hukukunun bir kaynağı olarakkabul ederler. Bu dört ana delile ek olarak cumhurun delil olarak kullandığı şeyleri dekullanmışlardır. Mezhebin ilk imamı olan Câbir b. Zeyd rey'e önem vermiştir. İçtihadmetodunu kullanarak mezheplerini geliştirmişlerdir. Fıkıh açısından cumhurdan ayrıbazı görüşleri olduğunu görüyoruz."
