abstract: "Faizsiz bankacılık uygulamaları genel olarak İslâmî bankacılık olarak da bilinir. Bu uygulamaların temel özelliği geleneksel bankacılık uygulamalarından farklı olarak faize yer vermemeleridir. Katılım bankalarının kuruluş amaçlarının başında özellikle dinî duyarlılıkları nedeniyle faizden uzak kalan insanların ekonomiye katılmayan atıl tasarruflarını ekonomiye kazandırmak gelmektedir. Dünyada ilk katılım bankası uygulamasına 1972 yılında Kahire'de“Nasser Social Bankası”örneğine rastlanılmaktadır. Türkiye'de ise söz konusu bankaların kuruluş çalışmalarının 1983'lerde başladığı ve 1985 yılında ilk özel finans bankası Albaraka Türk Finans Kurumu'nun faaliyete geçtiği bilinmektedir. Türkiye'de özel finans kurumları, 2005 yılında yürürlüğe giren 5411 sayılı Bankacılık Kanunu ile“katılım bankaları”olarak adlandırılmış ve Özel Finans Kurumları Birliği'nin unvanı da“Türkiye Katılım Bankaları Birliği”olarak değiştirilmiştir. Türkiye'de 9 tane katılım bankası kurulmuştur. Bunların 6 tanesi günümüz de faaliyetlerini sürdürmektedir. Bu çalışmanın amacı, Türkiye'de Katılım Bankalarının sorunlarını irdelemek ve çözüm önerileri sunmaktır. Çalışma yöntemi olarak kaynak taraması tercih edilmiştir. Çalışmanın kapsamı, Türkiye'de başlangıcından günümüze bankacılık sektöründe görülen katılım bankalarıyla sınırlı tutulmuştur. Çalışmada, katılım bankalarının genel olarak insanların elinde bulunan pasif tasarrufların yatırıma dönüştürülmesi amacıyla ekonomiye aktif olarak transferini sağlamak gibi önemli bir ihtiyaçtan doğduğu görülmüştür."
