abstract: "Hukukî olarak bir vakıf tasarrufunda dört unsur mevcuttur. Bir vakfın kurulabilmesi için mutlaka vakfeden (vâkıf) bir kimse, vakfedilen belirli bir mal (mevkûf), malların vakfedildiğine dair irade beyanı ve vakıf malların menfaatinin tahsis edildiği bir gaye (mevkûfun aleyh) var olmak zorundadır. Bu çalışma vakıfta gaye unsuruna odaklanmakta ve gaye unsuruyla ilgili hukukî meseleleri Hanefî mezhebi çerçevesinde ele almaya çalışmaktadır. Bu meseleler ele alınırken Hanefî mezhebinde vakfın \"sadaka mevkûfe\" şeklinde bir sadaka türü olarak tanımlandığı, bu tanımın vakıf ahkâmının bir çok veçhesine yön verdiği ve bu kapsamda vakfın amaç ve gayesinin de hukukî olarak sadakanın ruhuna uygun cihetler olması gerektiğine vurgu yapılmıştır. Anahtar Kelimeler : Hanefi, Vakıf, Hukuk, Gaye"
addedAt: 2026-09-24
