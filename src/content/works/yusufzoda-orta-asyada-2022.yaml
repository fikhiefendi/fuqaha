abstract: "Bu çalışmada, İslami bankacılıkta finansal gelişme ve ekonomik büyüme arasındaki nedensellik ilişkisi, gelişmekte olan piyasalar içerisinde yer alan Orta Asya ülkeleri için, Kazakistan örneğinde Toda Yamamoto Nedensellik testi ve Frekans Alanı Nedensellik Testi ile 2010-2020 dönemi icin analiz edilecektir. Bu çalışmada İslami bankacılık gelişimi ile ekonomik büyüme arasındaki nedensellik ilişkisi Toda Yamamoto nedensellik testi ile test edilmiştir. Nedenselliğin geçici ve kalıcı etkilerinin varlığının tespiti bağlamında, Breitung ve Candelon(2006) tarafından geliştirilen kısa, orta ve uzun dönem ayrımı yapılarak nedensellik analizini sağlayan Frekans Alanı Nedensellik testi kullanılmıştır. Bu çalışmada Kazakistan ekonomisinde İslami bankacılığın gelişimi ile büyüme arasındaki nedensellik ilişkisi aylık verilerle 2010:1–2020:04 dönemi için incelenmiştir. İslami bankacılığının gelişimi için İslami bankalarının özel sektöre verdiği krediler kullanılmıştır. Analizde, Kazakistan istatistik kurumu ve İslami bankaların veri tabanlarından elde edilecek ikincil veriler kullanılmıştır. Veriler Kazakistan Cumhuriyeti Stratejik Planlama ve Reformları Ajansı Ulusal İstatistik Bürosu'ndan, BDT'deki ilk İslam bankası olan İslam Bankası Al Hilal JSC (Al Hilal Bank) - Kazakistan'ın yıllık raporlarından ve İslam Bankası Zaman-Bank JSC'nın aylık raporlardan, Kazakistan Cumhuriyeti Ulusal Ekonomi Bakanlığı İstatistik Komitesi veri tabanlarından elde edilmiştir. Çalışmada üç bölüm mevcuttur. İlk bölüm, kavramsal çerçeve başlığı altında; iktisadi büyümenin kavramı, tanımı, olçülmesi, belirliyici faktörlerleri, geleneksel büyüme teorileri, modern büyüme teorileri, finansal entegrasyon ve ekonomik büyüme teorisi konularını içermektedir. İkinci bölümde, teorik çerçeve başlığı altında; Orta Asya Türk Cumhuriyetlerinde finansal ve ekonomik gelişimleri, islami bankacalığın gelişimi konulara yer verilmiştir. Üçüncü bölüm ise, uygulama başlığı altında; ampirik uygulamaya ait veri seti ve model, yöntem ve ekonometrik analiz sonuçlarından oluşmaktadır."
