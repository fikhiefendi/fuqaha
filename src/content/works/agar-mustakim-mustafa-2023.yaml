abstract: "Bu çalışma, XII/XVIII. yüzyılda yaşamış Müstakîm Mustafa Niyâzî'nin (ö. 1185/1771) tasavvuf alanında kaleme aldığı Sohbetü'l-Gâye isimli eserinin günümüz alfabesine aktarımını ve değerlendirilmesini içermektedir. Müellif hakkında fazla malûmat bulunmamaktadır. Çalışmamız, giriş, iki ana bölüm, bir ek ve sonuç kısmından oluşmaktadır. Giriş kısmında Müstakîm Mustafa Niyâzî ile ilgili bilgi veren klasik kaynaklar ve modern çalışmalara yer verilmiştir. Akabinde tezin konusu, önemi, amacı ve yöntemine değinilmiştir. Birinci bölümde Müstakîm Mustafa Niyâzî'nin yaşadığı dönem, hayatı, eserleri, tarikatı ve silsilesine yer verilmiştir. İkinci bölümde, evvela Sohbetü'l-Gâye isimli eserin yazma nüshaları tanıtılmış, ardından eserin içinde yer alan, gerekli görülen ve en çok işlenen konular ele alınmıştır. Ek kısmında, Sohbetü'l-Gâye isimli eserin günümüz alfabesine aktarımı verilmiştir."
