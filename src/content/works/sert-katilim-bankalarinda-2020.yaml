abstract: "Son dönemlerde yaşanan küresel finansal krizlerin de etkisiyle katılım bankacılığı sisteminin önemi giderek artmaktadır. Özellikle 2008 yılında yaşanılan ABD ve Avrupa merkezli ekonomik kriz, finansal kesimde geleneksel bankacılığı ciddi manada tartışılır duruma getirmiştir. Diğer taraftan doğrudan reel işlemlerin finansmanıyla ilgilenen, spekülasyona kapalı yapısıyla dikkat çeken katılım bankacılığı popülaritesini artırmıştır. Bu bakımdan müşterilerin katılım bankacılığı sistem ve faaliyetlerine yönelik reaksiyon ve davranışlarını ölçmek, müşterilerin katılım bankacılığına yönelik algı ve yargılarını bilmek, katılım bankacılığının gelişimi açısından önemlidir. Katılım bankacılığı kavramı 2005 yılında yapılan 5411 sayılı bankacılık kanunu ile Türkiye'de mevzuata girmiştir. İslami bankacılığın Türkiye'deki geçmişi ise 1983'lü yıllara dayanmaktadır. Katılım bankacılığı 2005 yılında yapılan yasal düzenlemelerin de etkisiyle büyüme hızını yükseltmiştir ve günümüzde Türkiye ve Dünya'da daha fazla araştırma, daha fazla incelemenin konusu olmuştur. Çalışmamızda katılım bankacılığının ve katılım bankalarınca sunulan hizmetlerin müşteriler nezdinde oluşturduğu algı ölçülmeye çalışılmıştır. Bu minvalde Aksaray ilinde 415 kişi üzerinde bir anket çalışması yapılmıştır. Aksaray ilinin mevduat varlığı açısından iller bazında üst sıralarda olması ve Aksaray'da katılım bankaları açısından daha önce böyle bir çalışmanın yapılmamış olması, uygulamada bu ilin seçilmesinde etkili olmuştur. Anket çalışmamız iki bölümden oluşmuş olup çalışmamıza Szczepanowicz'in (2011) çalışması kaynaklık etmiştir. Sahada uygulanmış olan anketin sonuçları çıkartılıp analiz edildiğinde İslami bankalarla çalışan, çalışmayan ve kararsız olan tüm katılımcıların verdikleri cevaplarda kısmi farklılıklar tespit edilmiştir. Geleneksel bankacılığın tamamlayıcısı veya alternatifi olarak da değerlendirilen İslami bankacılığın, insanlar tarafından yeterince bilinmediği, Müslüman kesimin faiz hassasiyetinin çok zayıf olduğu ve faiz konusunda kabullenilmiş bir çaresizliğin bulunduğu söylenebilir."
