abstract: "Fıkıh alimleri Kitap, Sünnet ve icma' delillerinden mükellefin fiillerinin şer'î hükümlerini ortaya koymaya çalışırken, fıkıh usulü de deliller ve hükümlerin niteliklerini, bu delillerden söz konusu hükümlerin nasıl çıkarıldığını veya nasıl çıkarılacağını, hitabın bu hükümlere delaletinin şekillerini tesbit etmeye çalışmıştır. Dolayısıyla fıkıh usulünün ele aldığı önemli konulardan biri de hitabın hükme delalet şekilleridir. Bu çalışma usulcülerin, hitabın hükme delalet şekillerinden mefhûmun delaletini nasıl ortaya koyduklarının gelişimini konu edinmiştir.Giriş ve üç bölümden oluşan çalışmamızın birinci bölümünde hitabın delaletine dair kavramsal çerçeve tanıtılmaya çalışılmış; bu bağlamda delalet, delil ve medlûl kavramları ile hitabın delalet şekillerinden mantûkun delaleti incelenmiştir. Mantûkun sarih delaleti başlığı altında nass ve zahir, gayr-i sarih delaleti başlığı altında da işaretin delaleti, imânın delaleti ve iktizanın delaleti kavramları işlenmiştir.İkinci bölümde başta mefhûm kavramı üzerinde durulmuş, sonra da mefhûmun kısımlarından, Hanefî usulcülerin nassın delaleti, diğer usulcülerin ise fahve'l-hitap veya mefhûmu'l-muvafaka dedikleri delalet türü ve kısımları ile ilgili kavramlar incelenmiştir.Çalışmamızın üçüncü bölümünde ise mefhûmun diğer bir türü olan ve geçerli bir delalet şekli olup olmadığı konusunda usulcüler arasında derin tartışmalara konu olan mefhûmu'l-muhalefe, türleri, hücciyeti, buna dair ileri sürülen gerekçeler ve alakalı diğer konularla ilgili kavramlar ele alınmıştır."
