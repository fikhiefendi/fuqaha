abstract: "?İslâm Hukukunda Öşür ve Delilleri? başlıklı tezimizde zirâî ürünlerin zekâtı incelenmiştir. Tezimiz bir giriş ve iki bölümden oluşmaktadır. Giriş bölümünde konunun önemine dikkat çekilmiştir.İlk bölümde genel olarak zekât ibadeti ve şartları tartışılmış, konuyla alakalı bilgiler açık ve net ifadelerle açıklanmıştır.İkinci bölümde öşür konusu ele alınmıştır. Öşürle alakalı ilk dönemlerdeki tatbikat üzerinde durulmuş, günümüz topraklarına uygulanabilirliği tartışılmıştır.Özellikle İslâm arazi yapısı üzerinde durularak; ilk dönem öşür ve haraç toprakları tanımları yapılmış, günümüzde Müslümanların yaşadıkları ve sahip olduğu toprakların öşür toprağı olduğuna kanaat getirilmiş ve ispatlanmaya çalışılmıştır.Çalışmamızda konuyla alakalı mezheplerin görüşleri delilleriyle birlikte sunulmuş, yeri gelince çağdaş âlimlerin konuya bakış açıları belirtilmiş ve değerlendirme yapılarak bir sonuca ulaşılmıştır.Yöremizde yetişen zirâî ürünlerin zekâtının gerekli olduğu ve ne oranda zekât verileceği tespit edilmiştir."
