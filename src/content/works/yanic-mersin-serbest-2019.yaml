abstract: "Bilim ve teknoloji alanındaki gelişmelere ve dünyanın küreselleşme sürecine bağlı olarak dış ticaret alanında liberal anlayış hız kazanmıştır. Özellikle ulaşım ve iletişim alanında yaşanan ilerlemeler, uluslararası ilişkileri ve ticareti geliştirmiştir. Ülkeler ticaret hacimlerinde artış sağlamak için birçok uygulamalar ortaya koymaktadır. Bu bağlamda Serbest Bölgeler dış ticareti desteklemeyi amaçlayan bir uygulama olmuştur. 1980'den itibaren Türkiye'nin ekonomi anlayışında dışa dönük ekonomi politikası benimsemesiyle Serbest Bölgeler sözü edilen ekonomik sistemin dikkate değer araçlarından biri olmuştur. Serbest Bölgeler Türkiye'nin dış ticaret hacmini, yabancı sermaye yatırımlarını ve istihdamını arttıran en büyük unsur haline gelmiştir. Çeşitli sebeplerle ülkelerinden ayrılan ve ülkelerindeki iç savaş ortamından kaçan Suriyeliler, daha göç sürecinin başında, 2014 yılında Mersin'i yatırım yaptıkları bir merkeze dönüştürmüşlerdir. Yalnızca 2014 yılı içinde 170 şirket kurmak suretiyle, Mersin'i sözü edilen yıl içinde en fazla yabancı şirket kurulan iller arasında üçüncü sıraya yükseltmişlerdir. Mersin Serbest Bölgesi'nde Mayıs 2019 sonu itibariyle faaliyette bulunan Suriyeli ortaklı firma sayısı 49 olarak tespit edilmiştir. Bu da bölgede bulunan firmalar içinde %11.7'lik bir orana tekabül etmektedir. Mersin Serbest Bölgesi'nin, Mersin limanından da faydalanarak ihracata yapılan yatırımlarından dolayı hem“Serbest Ticaret Bölgesi”hem de“Serbest Üretim Bölgesi”kurmaya elverişli olabileceği düşünülmektedir."
