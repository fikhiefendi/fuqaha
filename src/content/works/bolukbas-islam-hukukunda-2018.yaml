abstract: "İslâm hukukunda edâ ve kazâ mükellefin sorumluluklarını yerine getirmesi hususunda büyük önem arz etmektedir. Edâ ve kazâ mükelleften talep edilen görevi hangi şartlarda ve nasıl yapacağını ifade eder. Bu kelimeler Fukaha metodunda emir, mütekellimîn ekolünde hüküm başlığı altında değerlendirilmiştir. Edâ ve kazâ kelimeleri terim anlamında, Mâlikî, Şâfiî ve Hanbelî mezheplerinde ibâdetler alanına has iken, Hanefîlerde muâmelât ve ukûbât kısımlarına da şâmildir. Bu terim anlamlarında kullanımlarının yanı sıra furû fıkıh kitaplarında edâ ve kazâ sözlük anlamlarıyla kullanılmıştır. Bu çalışmada Kur'ân ve Sünnette bu kelimelerin hangi manada kullanıldıkları ve mezheplerin usûl eserlerinde edâ ve kazâ kavramlarının nasıl tarif edildiği, kapsamları ve kısımları hakkında bir inceleme yapılmıştır. Üç bölümden oluşan bu araştırmada edâ ve kazâ ile ilintili olan îfâ ve iâde kelimelerinin Kur'ân'da sünnette ve usul-i fıkıhta kullanımlarına yer verilmiştir. Ayrıca edânın emir, hüküm, kudret ve vakit ile ilişkisi ortaya konulmaya çalışılmış, mezheplerin edâ ve kazâya dair benimsedikleri usûl esasları örneklerle açıklanmıştır. Metodolojiye dair tespit edilen esaslar mezheplerin furu' fıkıh kitaplarını nasıl etkilediği araştırılmıştır. Bu sebeple edâ ve kazânın fer'î meselelerdeki kullanımları hakkında genel bir değerlendirme yapılmıştır. Araştırmanın neticesinde ekollerin edâ ve kazâya dair usûl alanında farklı yaklaşımlara sahip olduğu tespit edilmiştir. Edâ ve kazâya dair metodoloji alanındaki ihtilafların büyük bir çoğunluğunun söz konusu kelimelere yaklaşım farklılıklarından kaynaklandığı anlaşılmıştır. Bazı örnekler müstesna olarak teorik boyuttaki ihtilafın, furû fıkıhta pratiğe yansımadığı görülmüştür."
