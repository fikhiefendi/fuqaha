abstract: "Bir ülkedeki yargı teşkilatı, o ülkede adaletin sağlanması ve yargı kuvvetinin yerine getirilmesi için faaliyet gösteren örgüttür. Bu itibarla, yargı teşkilatını analiz etmek, o ülkenin hukukî yapısı ile ilgili çok önemli bilgiler sunmaktadır. Bu çalışmanın hedefi 2002'de kurulan Afganistan İslâm Cumhuriyeti'nin yargı teşkilatını ayrıntılı bir biçimde ele almak ve bu teşkilatı geliştirecek bazı teklifler sunmaktır. Türkçe, Arapça, Farsça ve İngilizce kaynaklara dayanan bu çalışmada Afganistan İslâm Cumhuriyeti Yargı Teşkilatı; iki genel bölüm şeklinde ele alınmıştır."
