abstract: "Yeryüzünde Bozgunculuk Çıkarmaya Dair Âyetlerin Tefsir-İslâm Hukuku Çerçevesinde İncelenmesi Bozgunculuk ilk insandan bu yana insanın varlığı ve birbirleriyleilişkisi çerçevesinde ortaya çıkan bir olgu olmuştur. Toplum farkı gözetmeksizin her zaman ve zeminde ortaya çıkan bozgunculuk fiili ve bizzat bozgunculuk olgusu Kur'ân-ı Kerîm'de farklı biçimlerdeçeşitli kelimelerle ifade etmiştir.Kur'ân-ı Kerîm'de yer alan bozgunculukla ilgili fiilleri“bağy kavramı”altında değerlendirmek mümkündür. Kelime olarak değerlendirildiğinde bağy kendi içinde birden fazla anlamı barındırmakla birlikteöne çıkan anlam“haddi aşmak”şeklindedir. İslam hukukunda“devlete baş kaldırmak”ve“isyan”anlamlarında da kullanılan bağy tezimizin konusunu teşkil etmektedir. İsyan fiili sadece devletle ilgili olmayıphem devleti hem de toplumu ilgilendirmektedir. Araştırmamızın birinci bölümünde bağy konusunu daha iyi anlamak için bu kelimenin ve eş anlamlılarının ihtiva ettiği manaları sözlüklerden derledik ve Kur'ânayetleri üzerinden inceledik. Siyasi bağye işaret ettiği düşünülen Hucurât sûresinin 9. ve 10. âyetlerininyorumlarını genel nitelikli önemli tefsirler üzerinden vermeye çalıştık. İkinci bölümde ise bu âyetlerin klasik dönem ahkâm tefsirleri ve fıkıh eserlerindeki yorumuna mezhepler etkisinde yer verdikten sonra modern dönemde ahkâm tefsirlerinde ve fıkıh eserlerinde konunun nasıl anlaşıldığına temasettik. Bağy konusu ekseninde Kur'ân'daki ahkâm âyetlerini özel olarak ele alan müfesirlerin ne derece mezheplerin etkisinde kaldıklarını, ahkâm tefsirlerinin fıkıh eserlerinin üslûp ve yöntemlerini eserlerine ne kadar yansıttıklarını da ortaya çıkarmayı hedefledik."
