abstract: "İslam hukuku ve Osmanlı uygulamasında Devlete İsyan (Bağy) suçu konulu tezimde özet olarak şu hususlara değinilmiştir:İslam ceza hukuku sistemi içinde devlete isyan suçu, adi suç-siyasi suç ayrımı içinde siyasi suç olarak nitelendirilmektedir. Fukahanın ekserisine göre, cezası Kur'an-ı Kerim'de gösterilmektedir. Hanefiler devlete isyan suçunu, meşru devlet başkanına karşı haksız bir şekilde başkaldırmaktır şeklinde kısa ve öz olarak tarif etmişlerdir.Bağy suçunun oluşabilmesi için öncelikle suçun kanuni bir hükümle yasaklanması, suç filinin oluşması suçlunun suçtan sorumlu tutulabilmesi ve hukuka aykırılık unsurunun bulunması gerekmektedir. Devlete isyan suçu işleyen baği'lerin (isyancıların) hem cezâi, hem hukukî sorumlulukları bulunmaktadır.Osmanlı hukuk sisteminde, devlete isyan suçu ile ilgili düzenlemelerde, fıkıh kitaplarında belirtilen hükümler korunmuş olmakla birlikte, yasama faaliyetinin oldukça geniş olduğu bir alandır. Çoğu zaman yollanan adaletnamelerle asayiş sağlanmaya çalışılmış, bazen de şiddetli bir bastırmacı siyaset izlenmiştir. Özellikle ?kardeş katli meselesi, İslam Hukuk Sistemi açısından oldukça tartışmalı bir konu olma özelliğini korumaktadır.Günümüz ceza hukukunda devlete isyan niteliğindeki suçlar, Anayasa ile güvence altına alınmış ve cezalandırılmıştır.Sonuç olarak; devlete isyan suçu gerek İslam hukuku gerek Osmanlı hukuku ve gerekse günümüz hukuku açısından önemle mütalaa edilmiştir. Bu önem devlet kavramına verilen değerden kaynaklanmaktadır.Suç ile ceza arasındaki hassas dengenin korunması ve cezalandırma ile güdülen gayenin gerçekleşmesi için hukuk kuralları tarihi gelişim içinde bir takım değişikliklere uğramıştır."
