abstract: "Çalışmamız bir giriş ve beş bölümden oluşmaktadır. Giriş bölümünde Çermik'in coğrafi yapısı ile tarihi süreci ele alınmıştır. Bu kısımda İslam öncesi Çermik'in kaba hatlarıyla tarihi ile İslam dönemi ve Osmanlı öncesi dönemi tarihi ele alınmıştır. Birinci bölümde Çermik'in Osmanlı topraklarına katılmasıyla birlikte idari taksimatı, özel statüsü nedeniyle yurtluk ve ocaklık olarak yönetilmesi, Çermik Beyleri ve idari yükümlülükleri, Tanzimat'ın getirdiği yeniliklerin Osmanlı taşrasında etkileri ile Çermik'te yurtluk ocaklık düzeninde meydana getirdiği değişimler ele alınmıştır. İkinci bölümde Çermik'in sosyal alt yapısını oluşturan fiziki mekanları, vakıf eserleri, ibadethaneleri, han ve hamam gibi yapıları ele alınmıştır. Osmanlı yenileşmesinin yansımalarından olan hükümet konağı ve hapishane gibi bazı hususlar da bu bölümde incelenmiştir. Üçüncü bölümde Çermik'in merkez kazası ile mahalleleri ve köyleri ile nüfus ve demografik yapısı incelenmiştir. Ayrıca Çermik'teki eğitim ve öğretim kurumları ile bu çerçevedeki eğitim hayatı ele alınmıştır. Dördüncü bölümde Çermik'in sosyal yapısı çerçevesinde kazadaki Müslüman ve gayrimüslimlerin birbirleriyle ilişkileri, toplumsal olaylar, günlük hayatta karşılaşılan gasp, cinayet, hırsızlık gibi olaylar ile evlilik, boşanma, nafaka ve miras gibi meseleler ele alınmıştır. Beşinci ve son bölümde ise Çermik'in iktisadi yapısının temel taşları ele alınmıştır. Osmanlı öncesi Akkoyunlular döneminden kalan kanunnameler ve vergi uygulamaları, Osmanlı dönemi vergi uygulamaları ile toprağın tasarruf şekilleri, voyvodalık, ziraat, tarım, ticaret, meslek ve zanaatlar ile Çermik'te başta arsa ve mülk satışları olmak üzere yapılan alışverişler belgeler ışığında ele alınarak incelenmiştir."
