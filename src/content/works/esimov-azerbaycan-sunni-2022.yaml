abstract: "Bu çalışmanın amacı, Azerbaycan'ın güneyinde bulunan Astara şehrine bağlı Penser köyünde yaşayan Sünnî ve Caferîler arasındaki ilişkileri, dini hayatları ekseninde ortaya koymak ve bu ilişkinin farklı yönlerini değişik tezahürlerle ortaya çıkarmayı amaçlamaktadır. Bu çalışmada mülakat ve anket teknikleri kullanılmıştır. Araştırma bölgemiz olan Penser köyü Hazar denizinin kıyısında olup, Astara iline bağlı şehir merkezinden yaklaşık 20 km uzaklıkta yerleşmektedir. Penser köy halkı, mezhep olarak Sünnî ve Caferî mezheplerden oluşmaktadır. Sünnî çevreler, itikadi anlamda Eş'arî olup fıkhî konularda Şafiî mezhebine bağlıdırlar. Köydeki Caferî toplulukların dinî hayatının merkezinde Caferî fıkhı bulunmaktadır. Çalışmamız giriş ve üç bölümden oluşmaktadır. Giriş bölümünde, problem durumu, amacı, kullanılan metot, zamanlama vb gibi konular üzerinde durularak bilgiler verilmiştir. Çalışmamızın ilk bölümünde Azerbaycan'daki Sünnî ve Caferîlerin tarihi ele alınıp bilgiler verilmeye çalışılmıştır. Daha sonra bu bölümün sonunda günümüz Azerbaycan'ında İslam üzerinde durulmuştur. İkinci bölümde ise, Azerbaycan'ın Astara İline bağlı Penser köyü hakkında bilgiler üzerinde durduktan sonra Astara şehrinin genel özellikleri, Penser köyünün cağrafi durumu, demografik yapısı, ortak sosyal mekanları, araşatırma grubunun genel özellikleri gibi konular ele alınarak bilgiler verilmeye çalışılmıştır. Araştırmamızın üçüncü bölümü olan ana bölümde ise, Penser köyündeki dinî hayat ekseninde Sünnî ve Caferî ilişkileri ele alınmıştır. Bu çerçevede köyde yaşayan Sünnî ve Caferî çevrelerin yaşadıkları dinî hayatın inanç ve ibadet boyutlarıyla ilgili bilgiler verilmiştir. Yine bu bölümde Caferîlikte diğer inanç esasları ile halk inançları ve batıl inançlar üzerinde durulmuştur. Son olarak ekler kısmında görüşme yaptığımız kişilerin listesi, mülakat ve anket soruları, Astara ve Penser köyünü gösteren haritalara ve araştırma bölgemiz olan Penser köyüyle ilgili resimler verilmiştir."
