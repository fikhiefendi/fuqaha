abstract: "Bu çalışmada hicrî ikinci asırda rivayet üslubunun fıkıh tartışmalarının yoğun olduğu el-Hucce alâ Ehl-i Medîne adlı eser özelinde nasıl bir şekil aldığı incelenmiştir. Bu bağlamda sened kullanımı, rivayetlerin ittisâli, râvilere yapılan atıfları, mürsel rivayetlerin kullanımı gibi hususlar ele alınmıştır. İmam Muhammed'in hoca-öğrenci ilişkilerinin de göz önünde bulunduğu çalışmada İmam Muhammed'in ilişkilerinin hadis birikimine ve bu birikimi aktarmadaki etkisine de temas edilmiştir. Hicrî ikinci asırda telif edilen ve fıkıh ve hadis içeriklerini bir arada içeren eserlerle de rivayet üslubu açısından mukayeseye gidilmiştir."
