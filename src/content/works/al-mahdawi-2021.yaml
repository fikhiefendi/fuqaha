abstract: "Elinizdeki“Narh Sisteminin İslam Hukuku Açısından Ele Alınışı ve Devlet Başkanının Bu Konudaki Yetkisi (Abbasiler Devleti Örneği)”başlıklı bu tezimiz, özellikle günümüz toplumunun gündemindeki aktüel bir konudur. İslam dininin birey ve toplumun maslahatını korumak için geldiği açıktır. Bu da, insanoğlunun faydalı ve zararlı olan dünya-ahiret ile ilgili muamelelerinin, kısaca hürriyet prensibi esasında gerçekleştirilmesi ile mümkündür. Özellikle, kanun çerçevesinde yapılan alış-veriş akitleri bunun örneğidir. Alış-veriş akitlerindeki hürriyet prensibini, satıcının kendi menfaati için yanlış yönde kullanması, veya satıcının kendi kârı için toplum ihtiyacını gelir kaynağına çevirmesi, yine toplumun temel gıda temini konusundaki düzenin bozulması konusunda, İslam hukuku devlet başkanına toplumun ihtiyacını giderme ve bu konudaki düzeni koruma yetkisi vermiştir. Toplumun temel ihtiyacı olan alım-satım konusundaki İslam hukukunun tutumu, birey ve tüzel kişiler seviyesindeki kişiler seviyesindeki satış kurumlarının toplumun karşılayamadığı fiyatlandırma veya ihtikarlandırma politikalarını dizginleme, bu tür durumlarda alım-satım hürriyetini sınırlandırma, kendi toplumunun ihtiyaçlarını karşılama, vatandaşını herhangi bir mağduriyete uğratmama amacında, devlet başkanına tam yetki verme şeklinde olmuştur. Bu tezde, narh sistemini Abbasiler Devleti örneğinde detaylı bir şekilde ele alınmış, İslam iktisadının temellerinin oluşturulduğu devlet olması açısından, Abbasîler Devleti'nin ticarî konularını ihata eden her mesele incelenmiş, İslam ahkamının gündelik hayatla paralel kesiştiği iktisat ve ihtisap konuları ile yakınlığı araştırılmış, önemli bulgu ve sonuçlar elde edilmiştir."
