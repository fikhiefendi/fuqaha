abstract: "Elinizde bulunan bu araştırma: (TARİKU'L-İHTİDA' Bİ-AHKAM EL-İMAME VEL- İKTİDA LİL-ALLAME EŞ-ŞEYİH AHMED BİN ABDULMUN'İM BİN YUSUF BİN SİYAM EL-DEMENHÜRİ DİRASETEN VE TAHKİKEN) başlığı altındadır. Bu araştırma önemli bir hususa işaret etmektedir. Ebu Hanife mezhabindeki namazın imam ve me'müm olma hükümleri içermektedir. Müellif bu konuyla ilgili en önemli meseleleri zikretmektedir, imam ve me'müm ile ilgili tüm hükümleri açıklamaktadır. Müellif, Bölümleri kitabın giriş kısmındaki belirtiği gibi sırayla sunmaktadır. Meseleleri sunma metodünü İmam El-Heskefi'nin el-Durru'l-Muhtar'da sunulduğu gibi konuları sunmuştur. Bölümlerin düzenlemeside onun ve mezhebi bir çok alim tarafından Hidayet eserindeki gibi düzenlenmiştir. Müellif bu eseri bölüm şeklinde yazıp bahsetmek istediği her konuyu bölümün başında özel bir başlık koymuştur. Tüm meselelerde konuların düzenini dikkat ederek tanımlamalar, bölünmeler ve şartları gerektiği kadar açıklamıştır, gerekli yerlerde ihtilaflardan da bahsetmiştir. Müelif, tüm akli ve nakli bilimlerinde bilgin olan bu zat parlak bir âlim ve uzmandı. Kendi zamanında El-Ezher'in şeyhidi. çeşitli ilimlerden 40'tan fazla eser bırakmıştır. Bu nedenle büyük önem taşımaktadır. Bu araştırmada, giriş ve ekler, yazarın hayatı ve kıtabın yazma metodünü yazdıktan sonra eserde bulunan tüm meseleri tahkik edip elimde olan her iki nushayı karşılaştırarak inceledim. Son olarak içindekiler listesi, ve sonuç ve tavsiyeler yazılmıştır."
