abstract: "Sosyal güvenlik sistemi, toplumu oluşturan tüm fertleri, bütün hayatları boyunca ilgilendirdiği için sosyal politikanın en geniş kapsamlı vasıtasını oluşturmaktadır. Gerçek olan da şudur ki; gündemden hiç düşmeyen“Sosyal Güvenlik Reformu”tartışmaları sadece Türkiye'ye özgü değildir. Dünya genelinde sosyal güvenlik konusu ciddi ekonomik sorunlardan biri olarak görülmektedir. Ülkemizdeki sosyal güvenlik sisteminin sorunu, gelişmiş ülkelerdeki nüfusun yaşlanması ve hayatta kalma beklentisinin yükselmesi gibi demografik değildir. Temel sorun genç bir toplum olmamıza rağmen aktüeryal dengelerin yeterince gözetilmemesi, kurumsal yetersizlik ve mevcut kaynakların yanlış alanlara aktarılması, sosyal ve ekonomik dengelerin bozulmasına neden olmuştur. Ülkemizde sosyal güvenlik kurumlarının finansmanı, prim biriktirme yöntemine dayanmaktayken, yaşanan dengesizlikler nedeniyle biriken fonlar erimiş ve sistemin finansmanı fiilen dağıtım yöntemine dönmüştür. Çok ciddi şekilde yanlış ve çarpık kurgulanmış bu sistem sonucunda emekli aylıkları ve muhtaç yaşlılara verilen sosyal yardımlar düşük seviyelerde kalmıştır. Dünya genelinde derinleşen ekonomik kriz ve küreselleşme süreci, beraberinde işsizliğin artmasına, insanların yoksullaşmasına ve refah düzeyinin düşmesi sebebiyle gelecek kaygısının artmasına neden olmuştur. Bireylerin emeklilik dönemlerindeki hayat standartlarını yükseltmek için ilave gelir arayışları, sosyal güvenlik sisteminin tamamlayıcısı olarak bireysel emeklilik sistemini bir model olarak ortaya çıkarmıştır. Gönüllülük esasına dayanan ve fonlama yöntemi ile finanse edilen bireysel emeklilik sisteminin kurulması çerçevesinde 4632 sayılı Bireysel Emeklilik Tasarruf ve Yatırım Sistemi Kanunu 7 Nisan 2001 tarihinde Resmi Gazetede yayınlanarak yürürlüğe girmiş ve 27 Ekim 2003'ten itibaren de üye kaydetmeye başlamıştır. Bireysel emeklilik, devletin sağladığı sosyal güvenliğin yanında, kişilerin emekliliğe yönelik birikimlerini artırmak ve kişilere emeklilikte düzenli gelir sağlamak amacıyla kurulmuş, özel şirketlerce yönetilen bir sistemdir. Bilindiği üzere ülkemizde faize duyarlı kesime yönelik bankacılık sistemi yıllar önce oluşturulmuş ve uygulamaya sokulmuştur. Katılım bankaları bankacılık sisteminde yüzde 5-6 civarında bir pay almaktadır. Bireysel emeklilik sisteminde bugüne kadar faize duyarlı kişiler 2010 yılına kadar sistemden yararlanamıyorlardı. Bir taraftan bu kişiler mağdur edilmekte öte yandan da bireysel emeklilik ile ilgili mevcut potansiyelin ortalama yüzde 15'lik kısmından şirketler; sektör, dolayısıyla ülke yararlanamıyordu. 2008 yılında fon içeriklerinde yapılan değişiklik ile kişilerin sisteme katılmalarının önü açılmış oldu. Çalışmanın ana temasını oluşturan bireysel emeklilik sistemini detaylandırmadan önce, sosyal güvenlik kavramı ve sistemiyle emeklilik uygulamaları hakkında bilgi verilmesi yararlı olacaktır. Bireysel emeklilik sisteminin yapısı ve temel özellikleri incelendikten sonra yurtdışındaki çeşitli uygulamalara yer verilecektir."
