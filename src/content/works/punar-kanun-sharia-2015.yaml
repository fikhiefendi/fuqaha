abstract: "Bu çalışma Osmanlı toprak hukukunun şerʿi karakteri sorunsalına, toprak üzerindeki mülkiyet haklarının idaresini şeyhülislamların verdiği toprak fetvaları ışığında inceleyerek muhtemel cevaplar aramaktadır. Ayrıca bu tez toprak üzerindeki mülkiyet haklarının tarihsel süreç içerisindeki seyrini de bu fetvaların gözünden takip etmektedir. Daha ilk başından beri Osmanlı toprak hukukunda ulema merkezî bir role sahipti. İlk toprak kanunları ya onların danışmanlığında veya direkt olarak onlar tarafından hazırlanmıştı. Bu bağlamda, ulemanın başı olarak şeyhülislam ve onun fetvaları toprak meselelerindeki en önemli kaynak türüdür. Osmanlı toprak sisteminin arkasındaki zihniyet muhtemelen bu mantık çerçevesinde ilk defa Ebussuud tarafından şeriat merkezinde ortaya konulmuştu. Daha sonraki şeyhülislamlar da Ebussuud'un bu söylemine sadık kalmış ve toprak hukukunu bu temel üzerinde inşa etmişlerdi. Ancak yeni şartlar sonraki şeyhülislam fetvalarında toprak üzerindeki mülkiyet hakları bakımından bazı ufak olmakla beraber önemli değişiklikleri zorunlu kılmıştı. İşte bu değişimleri takip etmek toprak hukuku konusundaki Osmanlı zihniyeti hakkında bazı ipuçlarını ortaya çıkarmaktadır. Bu tezin yaptığı iş tam olarak Ebussuud'un 1542 Budin Kanunnamesindeki ilk kapsamlı açıklaması ve toprak hukuku alanında Yeniçağ Osmanlı'sının en kapsamlı başarısı olan Kanunname-i Cedid (1674) arasındaki şeyhülislam toprak fetvalarını inceleyerek bu ipuçlarını yakalamak ve bu ipuçları üzerinden Osmanlı hukuk tarihindeki şeriat-örf tartışmasına toprak bağlamında cevaplar üretmektir. Bahsi geçen dönem içerisinde (1542-1674), Ebussuud'un söylemlerine sadık kalma bağlamında Hocazade Esad Efendi gibi bazı fetva mecmualarında sapma eğilimleri görülmektedir. Ancak bu minvaldeki fetvaların etki süresi kısa olmuş ve sonradan Kanunname-i Cedid nezdinde yok hükmüne geçmişlerdir. Sonuç olarak, Osmanlı toprak hukuku Ebussuud'un şerʿi söylemi çerçevesinde standartlaşmıştır. Bu tezin argümanı ise Ebussuud öncesi dönem ve sonraki sapma eğilimi de dahil olmak üzere bütün Osmanlı toprak hukukunun başından beri şeriat çerçevesinde şekillendiğidir ki bu tezin kullandığı tüm birincil kaynaklar fetvalardaki detaylar bunu destekler niteliktedir."
