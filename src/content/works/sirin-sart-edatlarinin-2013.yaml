abstract: "Nahiv ilminin İslami ilimlerle özellikle, Usûl-i fıkıh ilmi ile sıkı bir irtibatı vardır. Çünkü Arapça dil kurallarını iyice kavramak, Arapça herhangi bir metni, Kitap ve Sünneti doğru anlayıp yorumlayabilmenin ön şartıdır. Şart konusu, Nahiv ilminin en önemli konularındandır. Nahivciler şart edatlarını isim ve harf olarak ele aldıkları gibi, âmil olanlar ve âmil olmayanlar diye ayırarak incelemişlerdir. Usûl-i fıkıh ilmi, mana harfleri bölümünü titizlikle ele alıp, bu arada şart edatlarını pratik hayattan örneklerle izah etmiştir. Nahiv ve Usûl-i fıkıh?daki şart kavramı bazı noktalarda örtüşür, bazı noktalarda ayrışır. Nahivciler, edatları incelerken onların kelime olmaları ve i?rab? taki etki yönlerini ön plana çıkarmışlardır. Usulcüler ise, edatların daha ziyade mana ve delalet yönlerini irdelemişlerdir. Çünkü delillerden hüküm çıkarma eyleminde lafzın manaya delalet yönü çok önemlidir. Usulcüler, edatlardan muamelelerde en çok kullanılanların üzerinde durmuşlardır. Nahivciler ise bütünlüğü bozmamak için hepsini detaylarıyla incelemişlerdir. Nahiv?deki tartışmaların bir kısmı Usûl-i fıkıh ilmini de etkilemiştir. Bundan dolayı Usûl-i fıkıh?daki bir kısım tartışmaların çözümünde Nahiv kurallarından yararlanılmıştır. Anahtar Kelimler : Nahiv, Usûl-i fıkıh, Şart edatı, Lafız, Mana, Delalet"
