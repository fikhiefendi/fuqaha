abstract: "Modern araçlarla yapılan akitler günümüzde hayatın her alanında karsımızaçıkmaktadır. Bu araçlarla kurulan akitler, Pek çok noktada kolaylıklar sağlamaklaberaber, pek çok noktada da riskler tasımaktadırlar. Bu risklerinin aza indirilmesiiçin bu akitlerin kurulusunun iyice bilinmesi gerekir. Modern araçlarla kurulanakitler, ?slam hukukunda sahih bir akdin tasıması gereken özellikleri tasıdıklarımüddetçe, sahih olarak kurulmus kabul edilir.Tasıması gereken hususlar kısaca; akit ehliyetine sahip olana tarafların - butaraflar bizzat asli kisiler olmak zorunda değildir. Asli tarafları temsil eden baskalarıveya da bu iki tarafı temsil edecek bir bilgisayar programı da olabilir- bulunması, butarafların icap ve kabullerinin bir birlerine sağlam bir sekilde ulasması ve butarafların üzerinde anlasma yapacakları sağlam bir konunun bulunup bu konunun?slam hukukunda belirtilen sartlara uygun olmasıdır. Bu hususlar gerçeklestiktensonra, akdin ne isimle veya ne sekilde kurulduğu, akit serbestisi çerçevesinde kabuledilir.Modern araçlarla akitlerin kuruluslarına baktığımızda, bu sartların yerinerahat bir sekilde getirilebileceğini görüyoruz. Öyleyse bu aletlerle akitlerkurulduğunda bu esaslara dikkat edilmeli ve akdi fasit eden kusurlardan kaçınmayadikkat edilmelidir."
