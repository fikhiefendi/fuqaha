abstract: "Dini, ekonomik ve sosyal sebeplerle yirminci yüzyılın ikinci yarısında faizsiz finansman araçları ortaya çıkmıştır. İslamiyet'in erken dönemindeki uygulamalar esas alınarak ve geleneksel finansman araçlarının İslami hükümlerle uyumlaştırılması ile oluşturulan faizsiz finansman araçları, geleneksel finansman araçlarıyla birlikte tasarrufların yatırımlara dönüşmesine yardımcı olurken dini hassasiyetleri sebebiyle finansal piyasalarda yer almayan yatırımcılar için iyi bir alternatiftir. Faizsiz finansman araçlarının etkin bir şekilde kullanılacağı alanlardan biri tarımsal üretimdir. Faizsiz finansman araçları, yapısı itibariyle tarımın finansmanı için uygun özelliklere sahiptir. Tarımsal üretimin finansmanı, tarımın kendine has yapısı ve sektörün içinde barındırdığı riskler sebebiyle üzerinde önemle durulması gereken bir konudur. Sektörün her kesimine ulaşabilmek ve tarımsal üretimin karakterine uygun hareket edebilmek adına faizsiz finansman araçlarının tarımın finansmanında kullanılması gerekmektedir. Bu tezde tarımın dünyadaki ve Türkiye'deki durumuna değinilip, tarımın finansmanında kullanılan mevcut finansman yöntemlerinden bahsedildikten sonra yeni bir alternatif olarak faizsiz finansman araçları tanıtılmaya ve uygulamaya yönelik öneriler sunulmaya çalışılmıştır. Her bir finansman aracına ilişkin muhasebe kayıtları da yapıldıktan sonra tezin son bölümünde faizsiz finansman araçlarının doğru bir şekilde uygulanabilmesi konusunda önem taşıyan hukuki düzenlemeler incelenmiştir. Tezde faizsiz finansman araçlarının, emek yoğun ve düşük sermaye ile çalışan tarım üreticileri için uygun finansman araçları olduğu sonucuna ulaşılmıştır. Ancak Türkiye'deki faizsiz finansman sistemiyle tarımsal üretimde etkin bir faizsiz finansman mümkün değildir. Bu sebeple tezde sunulan önerilere uygun bir faizsiz finansman organizasyonunun kurulması önem taşımaktadır. Ayrıca faizsiz finansman mevzuatı geleneksel finansman ile faizsiz finansmanın arasındaki farkı ortaya koyma ve finansman araçlarının uygulanmasına ilişkin yol gösterme konularında eksiktir."
