abstract: "Çalışma, Hanefi ve Şafii mezheplerinde illet kavramı ve şartlarındaki farklılıkların fıkhi hükümler üzerindeki etkisini açıklamayı amaçlamaktadır. Çalışma, tümdengelim, tümevarım ve analitik yöntemlerin her birini kullanarak, iki mezhep arasındaki illet kavramındaki anlaşma ve farklılık noktalarını ortaya koymuştur. Sonuç olarak, iki mezhebin çoğunluğunun illetin bâis değil, muarrif vasıf olarak tanımlanmasında hemfikir olduğunu ortaya koymuştur Çalışmada ayrıca Hanefi mezhebine göre illetin, müessir bir vasıf olarak anlatılması durumunda Şafiilere göre anlamının daha geniş olduğu, illetin münasib bir vasıf olarak anlatıldığı takdirde ise bunun tam tersi olduğu tespit edilmiştir.Çalışmada, iki mezhep arasında tartışılan ve üzerinde anlaşılan illet şartları ele alınmıştır. En sonunda, illet kavramı ve bazı şartlarındeki iki mezhebin farklılıklarının pratik etkisini sundu ve sonuç olarak, iki mezhep arasında birçok fıkhi meselede farklılığa yol açan en önemli temel meselenin, Hanefilerin delilin etkili olmasını şart koşmaları, Şafiilerin ise bunu şart koşmamaları olduğunu tespit etti."
