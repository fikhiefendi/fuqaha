abstract: "Ceza muhakemesinde, tarafların iddia ettiği vakaların ispatı amacıyla en sık başvurulan delillerin başında tanık delili gelmektedir. Bu çalışmada, tanık delilinin İslam ceza muhakemesi hukuku ve yürürlükteki (merî) ceza muhakemesi hukukundaki yeri ayrı ayrı ele alınarak, bu iki hukuk sisteminin böylesine önemli bir ispat vasıtasını kendi iç dinamikleri çerçevesinde nasıl düzenledikleri ve hangi değeri atfettikleri ortaya konulmaya çalışılmıştır. İslam ceza muhakemesi hukukunda, âlimlerin çoğunluğuna göre şahit delili kesin delil olarak nitelendirilmektedir. Bu, İslam hukuku doktrininde güvenilir şahitler tarafından usulüne uygun olarak yapılan şahitliğin hâkimi bağlayıcı nitelikte olduğu ve hâkimin buna göre hüküm vermek zorunda olduğu anlamına gelmektedir. İslam hukuku şartlarına uygun olarak sunulan şahit delilinin hâkimi bağlayıcı niteliği, şahitlik yapabilme şartlarının titizlikle belirlenmesine ve hatta şahitlerin güvenilirliğinin araştırılması amacıyla tezkiye kurumunun oluşturulmasına yol açmıştır. Yürürlükteki ceza muhakemesi sisteminde ise tanık delili, takdiri deliller arasında yer almaktadır. Bu nedenle, hâkim, yargılama sırasında alınan tanık ifadeleriyle bağlı olmayıp, yargılama sonucunda vereceği hükmü serbestçe oluşturabilir. Bununla birlikte, hâkim, dava sonucunda açıkladığı kararında hangi delillere neden itibar ettiğini veya etmediğini gerekçeleriyle birlikte açıklamakla yükümlüdür."
