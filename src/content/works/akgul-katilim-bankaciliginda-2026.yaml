abstract: "Katılım Bankacılığında Bireysel Finansman Yöntemleri: Fıkhi Dayanaklar ve Güncel Sorunlar isimli çalışmamız, katılım bankacılığının konvansiyonel bankacılık işlemlerine alternatif olduğu alanlardan biri olan bireysel kredilerin İslam hukuku açısından tahlil edilmesini amaçlanmıştır. Bu çalışma üç bölümden oluşmaktadır. İlk bölümde bankacılık konusu ele alınmış, konunun sınırlarının belirlemesi açısından iki ana başlıkta tasnif edilmiştir. Çalışmanın ilk başlığında genel hatlarıyla bankacılık hakkında bilgi verilmiş, bankacılık kavramı ve türleri incelenmiştir. İkinci başlıkta ise katılım bankacılığı kapsamlı bir şekilde aktarılmaya çalışılmıştır. Bu bölümün devamında da kurumun işlem türlerine odaklanılmış; fon toplama ve kullandırma yöntemleri, diğer bankacılık hizmetleri, yatırım faaliyetleri ve kredi işlemleri hakkında malumat verilmiştir. Çalışmanın ikinci bölümünde katılım bankacılığında kredi konusu ele alınmıştır. Bu konu beş temel başlık altında tahlil edilmiştir. Bölümün girişinde krediler hakkında temel bilgilere yer verilmiştir. Müteakiben katılım bankacılığındaki bireysel kredi ürünleri incelenmiştir. Üçüncü başlıkta katılım bankacılığında bireysel kredi türleri; kredi kartları ve tüketici kredileri şeklinde bir tasnife tabi tutulmuştur. Bölümün son iki başlığında ise bireysel kredilerin kredilendirme süreci ve özellikleri ele alınmıştır. Çalışmamızın üçüncü bölümünde katılım bankacılığında uygulanan bireysel kredi işlemleri, İslam hukuku açısından tahlil edilmiştir. Altı ana başlıktan oluşan bu bölümün ilk başlığında katılım bankacılığının bireysel kredi işlemlerinde kullandığı akit ve finansman araçları incelenmiştir. Bu başlıkta klasik kaynaklarda yer alan akitlerin İslam hukukuna uygun yeni formülleri aktarılmış ve bunların bireysel kredilerde nasıl kullanıldığı ya da kullanılması gerektiğine dair yöntemler açıklanmaya çalışılmıştır. Bununla birlikte katılım bankaları tarafından mevcut durumda uygulanmayan fakat fıkhî açıdan tatbik edilmesine engel bulunmayan akitlere de yer verilmiştir. İkinci başlıkta katılım bankacılığının bireysel finansman yöntemlerinde başvurulan akitlerde; ribâ, garar ve cehalet gibi akdi fesada uğratan temel sorunlar incelenmiştir. Söz konusu fıkhî sorunların çözümüne dair önerilerde bulunulmuştur. Bu iki başlık bölümün temel mevzusunu oluşturmakla birlikte konunun İslam hukuku açısından bütüncül bir şekilde kavranabilmesi için bireysel kredilerin para ile ilişkisi, bu kredilerdeki hiyel, zaruret ve dârülharp meseleleri de müstakil başlıklar altında incelenmeye çalışılmıştır."
