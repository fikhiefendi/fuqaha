abstract: "ÖZET Şer'iyye sicilleri Osmanlı tarihi hakkında içinde barındırmış olduğu önemli bilgiler açısından Osmanlı tarihinin en önemli kaynaklarından birisidir. Şer'iyye sicilleri sayesinde sicilin tutulduğu senelerde toplumun sosyal durumu, ekonomik durumu askeri ve adli durumu hakkında bilgi edinilmektedir. Aynı zamanda Şer'iyye Sicillerinde yer alan mekan isimleri de öğrenilebilmektedir.Mesela o yerleşim yerinde hangi mahalle ve köylerin, şehir ve kasabaların yer aldığı rahatlıkla tesbitedilebilir. Osmanlı tarihinde kadılar İslam Hukuku ve örfi Hukuk kuralları doğrultusunda kararlarını şekillendirmektedirler.Osmanlı hukukunda ekseriya Hanefî mezhebi hukukçularının görüşleri dikkate alınmıştır. Fakat yeri gelince Şafii mezhebi hukukçularının ve dğer mezheb hukukçularının da fetvalarından yararlanılmıştır. Çalışmamızın konusu olan“28 Numaralı Kütahya Şer'iyye Sicili ”ile sicilin tutulduğu dönem itibariyle Kütahya ve çevresinin; örf ve adetleri gelenekleri, yer isimleri, şahısların kullandığı isim ve unvanlar, toplumun fikir yapısı Müslüman olmayanlarla olan münasebetlerine ulaşılabilir. Şer'iyye sicilleri ile aile hukuku ve miras hukukunun tafsilatına inilebilr.Mesela insanların geriye bıraktığı miraslar o şahsın ekonomik gücünü gösterir."
