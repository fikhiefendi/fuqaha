abstract: "ÖZET Son dönem İslam hukukçularından Mustafa Saîd el-Hınn, köklü bir ilim geleneğine sahip olan bir ailenin çocuğu olarak 1922 yılında Suriye'de doğmuştur. İlk eğitim-öğretim sürecini Suriye'deki resmi okullarda tamamlamış, bir taraftan da klasik medrese usulüne göre İslâmî ilimleri tedris etmiştir. Mustafa Saîd el-Hınn lisans öğrenimi için Mısır'a gitmiş ve Câmi'atu Ezher Külliyetü'ş-Şerîâ'ya kaydolmuştur. 1955 yılında Dımaşk Üniversitesinin bünyesinde Külliyetü'ş-Şerîâ açılınca Ezher diplomasına sahip olan bir kişi olarak el-Hınn, kurum bünyesine atanan ilk hoca olmuştur. 1955-1962 yılları arasında Câmi'atü Dımaşk Külliyetü'ş-Şeri'â'da mukayeseli fıkıh, hadis ıstılahları ve fıkıh usulü gibi dersler vermiş, 1962-1966 yılları arasında da Riyad, Cami'âtü'l-İmam Muhammed b. Su'ûd el-İslâmiye Külliyyetü'ş-Şeri'â ve Külliyyetü'l-Lügati'l-Arabiyye'de hocalık yapmıştır. Sonrasında Ezher Üniversitesine giderek doktora eğitimine başlamış ve Dr. Mustafa Abdulhâlık'ın danışmanlığında kendisine esas şöhreti kazandıran eserlerinden biri olan“Eseru'l-ihtilâf fi'l-kavâ'idi'l-usûliyye fi ihtilâfi'l-fukahâ”başlıklı doktora tezini 1971 yılında tamamlamıştır. Ezher üniversitesinde doktora eğitimini tamamladıktan sonra Dımaşk Üniversitesi Şerîâ Fakültesine öğretim görevlisi olarak tayin edilmiş ve emekli olduğu 1983 yılına kadar bu kurumda hizmetine devam etmiştir. Başta fıkıh usulü olmak üzere İslâmî ilimlerin pek çoğunda sayısız eserlere imza atan ve yüzlerce öğrencinin yetişmesine hizmet eden Mustafa Saîd el-Hınn, 1 Şubat 2008 tarihinde Suriye'de vefat etmiştir."
