abstract: "İslam hukukçularının furû' meselelerde ihtilaf etmelerinin birçok sebebi vardır. Bu sebeplerden biri de lafız ekseninde oluşan ihtilaflardır. Lafız üzerinde meydana gelen ihtilaflar füru' fıkıhta birçok ihtilafı beraberinde getirmiştir. Hemen her lafız çeşidinin İslam hukukunda meydana getirdiği etkileri mevcut görünmektedir. Konunun önemine binaen usul kitaplarımızda her bir lafız çeşidi üzerinde ayrı ayrı durulduğu gibi furu' fıkıhta meydana getirdiği önemli etkileri de fıkıh kitaplarımızda yer almıştır. Bu çalışmada, İslam hukuk metodolojisinde farklı bir öneme sahip olan ve furu' fıkıhta da önemli sonuçlar meydana getiren“Müşterek Lafız”üzerinde durulmuş, müşterek lafzın meydana gelme sebepleri, fıkıh kültüründe meydana getirdiği ihtilaflar üzerinde incelemeler yapılmıştır. Ayrıca müşterek lafız ekseninde oluşan ihtilâflardan bahsedilirken Hanefî, Mâlikî, Şafii ve Hanbelî mezheplerinin görüşlerine de yer verilmiştir."
