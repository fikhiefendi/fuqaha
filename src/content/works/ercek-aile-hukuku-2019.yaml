abstract: "İslam hukuku, aile gibi toplumda önemli bir yere sahip olan müesselere çok önem vermiş ve bu alanda gerekli düzenlemeleri yapmıştır. Fukaha İslam hukuku ile ilgili pekçok eser kaleme almıştır. Vehbe ez-Zühaylî de bu alanla ilgili el-Fıkhü'l İslâmî ve edilletüh adlı eseri yazmıştır. Bu çalışmada son dönem İslam hukukçularından Vehbe ez-Zühaylî'nin bu eserinde geçen aile hukukuna dair Hanefîler ile Şafiîlerin ihtilaf ettikleri konular, ihtilaf sebepleri ve Hanefiler ile Şafiilerin ihtilaf ettikleri noktalarda Zühaylî'nin tercihleri ele alınmıştır. Hanefi ve Şafiî mezheplerin ihtilaf etmelerinin temel sebepleri, hüküm istinbat etmede farklı delillere başvurmaları ve nasları farklı yorumlamalarıdır."
