abstract: "1934 (Hicri 1190-1193-M.1777-1780) numaralı Trabzon Şer'iyye Sicili'nin Transkripsiyon Metni ve Analizi isimli bu tez çalışmasının amacı daha sonra yapılacak olan Osmanlı Devleti ve Trabzon konulu çalışmalara katkı sağlamaktır. Osmanlı Devleti ile ilgili yapılan çalışmalarda başvurulan birinci elden kaynakların en önemlilerinden biri de şer'iyye sicilleridir. Bu kaynaklar tutuldukları dönem ile ilgili güvenilir ve zengin bilgiler içermektedir. Trabzon ile ilgili de birçok şer'iyye sicili bulunmaktadır. Tez çalışması giriş ve üç bölümden oluşmaktadır. Giriş kısmında şer'iyye sicilleri ve kadı hakkında bilgi verildikten sonra defter-kaynak tahlili yapıldı. Birinci bölümde Trabzon tarihi, Osmanlı Devleti'nin Trabzon'u fethi ve Osmanlı döneminde Trabzon idari yapısı hakkında bilgi verildi. İkinci bölümde teze konu olan şer'iyye sicili konuları türlerine göre başlıklar altında toplanarak her konu ile ilgili örnek hüküm özeti verildi. Ayrıca şer'iyye sicili konu dağılımı ile ilgili genel bir değerlendirme yapıldı.Üçüncü bölümde ise 1934 numaralı Trabzon Şer'iyye Sicili transkripsiyon metnine yer verildi. Transkripsiyon metninde her hükmün başına konu ve özet kısmı eklendi."
