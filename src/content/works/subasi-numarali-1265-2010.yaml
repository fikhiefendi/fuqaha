abstract: "1848-1850 (H.1265-1266) yıllarına ait olan ? 60 Numaralı Tokat Şer'iyye Sicil Defteri? nin çevirisi yapılarak, defterde yer alan belgeler doğrultusunda söz konusu döneme ait Tokat'ın idari ve sosyo-ekonomik yapısı üzerinde durulmuştur.Üzerinde çalıştığımız tez üç bölüme ayrılmıştır. Önce giriş olarak ele aldığımız bölümde; Şer'iyye Sicilleri, Osmanlı hukukunun tarihi gelişimi, yargı sistemi ve mahkeme görevlileri hakkında bilgiler verildi. Ayrıca sicillerle ilgili daha önce yapılmış olan çalışmalara yer verilmiştir.Birinci bölümde, XIX. yüzyıl ortalarında Tokat şehri hakkında genel bilgiler verildi. Şehre ait sosyal, kültürel ve ekonomik hayat ve idari yapısı hakkında da mevcut bilgiler aktarılmıştır.İkinci bölümde, çalışma yapılırken hangi yöntem ve materyallerden yararlanıldığı üzerinde durulmuştur. Defterin değerlendirilmesi yapılarak tanıtılması ve belge çeşitleri hakkında açıklamalar yapılmıştır.Üçüncü ve son bölümde ise, 60 Numaralı Tokat Şer'iyye Sicili'nin metnine yer verildi. Defterden yararlanılarak hazırlanan bir sözlük çalışması da ilave edildi."
