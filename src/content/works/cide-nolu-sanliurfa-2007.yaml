abstract: "Çalıstıgımız dönem (H.1272-1282/M.1856-1865) yıllarına ait 205 Numaralı Urfa Ser'îyye Sicili'dir. 205 numaralı Urfa Ser'îyye Sicili tek bir sicil olmasına ragmen uzun olmasından dolayı iki kisi tarafından çalısılmıstır. Bizden önce sicilin ilk kısmını Songül KORKMAZ çalıstıgından, karısıklıgı önlemek için, sicili 205/2 olarak adlandırdık. Ser'îyye Sicilleri Osmanlı Tarihi için birinci el kaynaklardır. Tezimizin amacı Osmanlı'nın bir parçası olan Urfa'nın o dönemdeki siyasi, kültürel, ekonomik, sosyal vb. durumunu ortaya çıkarmaktır. Çalısmamızın giris kısmında Osmanlı Devleti'nin hukuku yapısı ve Ser'îyye Sicilleri hakkında bilgi verdik. Tezi 3 bölüme ayırdık. lk bölümü, belge özetleri ve belgelerin transkripsiyonuna kullandık. 2. bölümde ise belgelerde geçen konuları ele aldık. 3. Bölümde ise Urfa hakkında, belgelerden ve baska eserlerden de yararlanarak, bilgi vermeye çalıstık. Tarihi çok eski dönemlere dayanan Urfa, her sehir gibi ülkenin genel durumundan etkilenmistir. Fransız ihtilalinden sonra milliyetçilik akımları baslamıstır. Bu durumdan en fazla imparatorluklar etkilenmistir. Özellikle birçok ırk ve dini toplulugu bünyesinde bulunduran Osmanlı, Balkanlar'da bu ırkçı ayaklanmalarla ugrasmak zorunda kalmıstır. Ancak Urfa'ya baktıgımızda, halkların bir birileriyle ve sistemle barısık yasadıgına sahit olmaktayız. Herkes dini yasantısında serbesttir. Osmanlı, vatandas olarak herkese esit davranmıstır. Geçim kaynagı, tarım ve hayvancılıga baglıydı. El sanatları da geçim kaynakları arsında bulunmaktadır. Ticaret diger bir geçim kaynagı olmustur. Osmanlı Devleti ticareti gelistirmek için, tüccarlara özel imkânlar da saglamıstır."
