abstract: "Peygamberimizin eşlerine ait fıkhî hükümlerin incelenmesi, Müslümanların ve daha özel olarak Müslüman kadınların hayatları açısından önem taşımaktadır. Bu konunun açıklanması ve izahı sadedinde birçok eser telif edilmiş olup, biz de bu çalışmamızda özellikle kadınların hayatına dair fıkhî hükümleri açıklamada bu önceki çalışmaları takip ederek, örtünme, kadınların avreti, hayız gibi konulara açıklık getirmeye çalıştık. Bu konudaki hareket noktası, özellikle ümmehatü'l-mü'minin tarafından Peygamberimize tevcih edilen sualler ve onun bu sorulara verdiği cevaplar olmuştur. Bu çerçevede, konuya dair ayet ve hadis naslarının doğru anlaşılmasına, önceki çalışmaların çizgisinde bir mütevazı katkı sunmayı hedefleyen tezimiz, günümüzde konu hakkında zihinlerde oluşan bazı istifhamlara da cevap teşkil etme amacındadır."
