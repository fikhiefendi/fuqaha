abstract: "Nesh, şer'i bir hükmün daha sonra gelen şer'i bir hükümle kaldırılmasıdır. Kavram mahiyeti ve içeriği gereğince çok tartışılmıştır. İslam düşünce tarihinde nesh olayının kabul edenler olduğu gibi kabul etmeyenlerde vardır. Her iki görüş sahipleri de bir takım argümanlar sunmuştur. İbn Hazm, Endülüs fikir hayatında yetişmiş özgün isimlerden biridir. İbn Hazm da İslam şeriatında nesh olayının gerçekleştiğini savunmaktadır. İbn Hazm neshi, Allah'ın mutlak iradesinin bu şekilde tecelli etmesiyle açıklamaktadır."
