abstract: "Faizsiz bankacılık sistemi, son yıllardaki gelişimi ile geleneksel bankacılık sisteminin tamamlayıcısı olmuştur. Dini inançları gereği faize duyarlı, potansiyel yatırımcılar faizsiz bankacılık sistemi ile finansal piyasalara yatırım yapma imkânı bulmuştur. Bu yeni yatırımcılarla beraber, finansal sistem daha homojen bir yapıya kavuşmuştur. İslami finans sistemi, geleneksel finans sisteminden farklı faiz getirisi olmayan yatırım ürünleri de oluşturmaktadır. Bunlardan birisi olan sukuk, Türkiye finans piyasasında kira sertifikası olarak bilinmektedir. 1980' li yılların başından itibaren dünya piyasalarında ihraç edilmeye başlayan sukukun ihraç değerleri hızla artarken, son birkaç yılda, Türkiye piyasalarına da girmiştir. Bu çalışmada İslami finans sistemi ve sukuk tanıtılmaya çalışılmış ayrıca ki-kare analiz yöntemi kullanılarak sukukun ihraç değerlerinin Türkiye finans sektöründeki bilinirliği tespit edilmeye çalışılmıştır. Elde edilen bulgular Türkiye finans sektörü çalışanlarının sukukun ihraç değerleri hakkında yeterli düzeyde bilgi sahibi olmadıklarını göstermektedir."
