abstract: "ÖZET“İslâm Hukukuna Göre Boşamada İrade ve Beyan Uygunluğu”isimli Yüksek Lisans Tez çalışmasında evlilik sözleşmesinin ortadan kaldırılması olan boşamayı ele aldık. Genel olarak tek taraflı irade beyanıyla meydana gelebilen ve bir ıskat tasarrufu olarak kabul edilen boşamada irade ve beyan uygunluğunu ve bunun sonuca tesirini inceledik. Amacımız, konu hakkında klasik kaynaklarda bulunan bilgileri doğru şekilde anlamak, yeni bir sistem içerisinde ele almak ve mukayese imkanı sunmaktır. Çalışmamızın giriş bölümünde boşamanın tanımını, boşama yetkisine sahip olanları, tarafların ehliyetini ve boşamanın geçerliliğini kısaca belirttik. Geçerli bir boşamanın ortaya çıkış ihtimallerini farklı görüşlere de yer vererek üç başlık altında ele aldık. Bunlar, boşamanın tek taraflı irade beyanıyla olması, boşamanın mahkemede olması ve boşamanın şahitler huzurunda olmasıdır. Birinci bölümde boşamanın çeşitlerini farklı açılardan ele aldık. Bu bölümde, dönülebilir olup olmamasına göre, sünnete uygunluğuna göre, hükmünün gerçekleştiği an itibariyle ve mükellefin sorumluluğu itibariyle olmak üzere boşamanın çeşitlerini inceledik. Bilhassa bid'î boşamanın geçerliliğini, İslâm hukukçularının farklı görüşlerini de gözönüne alarak incelemeye çalıştık. İkinci bölümde“boşamada irade ve beyan uygunluğunu”inceledik. Bu bölümün birinci başlığı altında, niyetin tanımını, önemini tasarruflardaki rolünü ve boşamadaki etkisini inceledik. İkinci başlık altında boşama iradesini beyan şekillerini ve bu konulardaki farklı görüşleri ele aldık. Üçüncü başlık altında irade ve beyanın birbirine uygun olabilmesi için gerekli şartları, irade ile beyanın birbirine uymadığı veya iradenin oluşumunda sakatlandığı bazı halleri araştırdık. Bu bölümün dördüncü başlığı altında ise daha ziyade irade ve beyanın birbirine uygun olmaması halinde veya irade beyanına aykırı bir durum ortaya çıkması halinde söz konusu olan diyâneten ve kazaen hüküm vermeyi tanıttık. Hanefiler hariç tutulacak olursa İslâm hukukçularının pek çoğu, boşama beyanının geçerli olabilmesi için gerçek anlamda boşama iradesinin bulunmasını şart koşarlar. Hanefiler ise boşamada irade ile beyan arasındaki uygunluk şartını her zaman aramazlar. Ayrıca, İslâm hukukçuları, boşama yetkisine sahip olan şahsın tek taraflı irade beyanıyla boşama meydana getirebilmesi için hukuki işlem meydana getirebilme ehliyetine sahip olması şartını ararlar. IX"
