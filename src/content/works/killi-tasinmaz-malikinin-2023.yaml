abstract: "Taşınmaz kavramı günlük yaşantımızda olduğu gibi hukuk sistemimizde de önemli bir yere sahiptir. Nitekim sorumluluk da hukuk sistemlerinde zamanla gelişmekte ve kapsamı gün geçtikçe genişleyen bir kavram olarak karşımıza çıkmaktadır. Bu durumun ortaya çıkmasında teknolojide yaşanan gelişmelerinde payı büyüktür. Çalışma konumuzun lafzında yer alan bu iki kavram taşınmaz maliklerinin mülkiyet hakkına sahip olması sebebiyle birtakım hukuki süreçlerle karşılaşıp karşılaşmaması noktasında belirleyici olmaktadır. Ancak incelenen konu kanunun sistematiği bakımından öğreti ve yargı kararlarında da yer aldığı üzere komşuluk hukuku bağlamında söz konusu olan yasal kısıtlamalar doğrultusunda irdelenmiştir. Çalışmamızın ilk bölümünde konunun incelenmesinde önem arz eden mülkiyet ve sorumluluk kavramları ile taşınmaz malikinin sorumluluğunun tarihi gelişimi ve buna ilişkin hukukumuzdaki düzenlemelerden bahsedilmiştir. İkinci bölümde taşınmaz mülkiyetinin yasal kısıtlamalara aykırı kullanılması halinde malikin sorumluluğu (TMK m. 730/f. I) ve üçüncü bölümde ise taşınmaz mülkiyetinin yerel âdete uygun ve kaçınılmaz taşkınlık şeklinde kullanılması halinde malikin sorumluluğu (TMK m. 730/f. II) incelenmiştir. İkinci ve üçüncü bölümler de sorumluluğun hukuki niteliği, hükmün uygulama alanı, sorumluluğun doğabilmesi için bulunması gereken şartlar, sorumluluğu ortadan kaldıran haller, sorumluluğa ilişkin açılabilecek davalar, bu davaların tarafları, ispat yükü, süreleri ile görevli ve yetkili mahkeme incelenmiştir. Yine ikinci bölümde malikin sorumluluğunun bazı sorumluluk halleriyle karşılaştırılmasına üçüncü bölümde ise TMK m. 730/f. I ile TMK m. 730/ f. II'nin karşılaştırılmasına yer verilmiştir."
