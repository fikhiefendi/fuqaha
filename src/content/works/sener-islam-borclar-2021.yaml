abstract: "Blokzincir teknolojisi gelişmekte olan yapay zekâ, makine öğrenimi, nesnelerin interneti gibi yazılım ve donanım teknolojilerinin önemli bir alanını teşkil etmektedir. Blokzincir teknolojisiyle ilke olarak merkeziyetsiz güvenli depolama, doğrulama, iletişim ve bilgi ya da değer aktarımı sağlanmış ve üzerinde kurulabilecek birçok uygulamaya kapı aralamıştır. Bu uygulamalardan günümüzde belki de en önemlisini blokzincir 2.0 olarak tabir edilen akıllı sözleşmeler oluşturmaktadır. Bu çalışmada, akıllı sözleşmelerin üzerinde kurulduğu blokzincir teknolojisi ve Ethereum özelinde akıllı sözleşmelerin teknik işleyişi açıklanacak ve borçlar hukuku açısından analiz edilecektir. Bu analiz; sözleşme serbestisi, sözleşmenin kuruluşu, sözleşmenin tarafları, sözleşmelerde şekil şartları ve sözleşmelerde irade bozukluğu özelinde Türk Borçlar Hukuku ve İslam Borçlar Hukuku açısından yapılacaktır. Akıllı sözleşmeler sağlık, yönetişim, devlet hizmetleri, sigorta gibi birçok alanda uygulama potansiyeline sahiptir. Özellikle bankacılık, finansal işlemler, ticaret, İslami Bankacılık ve İslami Finans alanları uygulamada öncelik kazanacaktır. Akıllı sözleşmelerin yaygınlaşması veya hukuki düzenleme yapılması sonucunda konunun İslam Hukuku açısından hükmünün ve fetvasının verilmesi gerekecektir. Bu bakımdan akıllı sözleşmelerin, genelde borçlar hukuku özelde ise sözleşme hukuku açısından incelenmesi önem arz etmektedir."
