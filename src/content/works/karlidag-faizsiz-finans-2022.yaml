abstract: "Yakın zamanda özellikle İslam Hukukuna uygun yönetimlerin olduğu ülkelerde Faizsiz Finans Muhasebe işlemleri geliştirilmiştir. Bu standartlar uygulama aşamasında normal finans ve muhasebe sisteminin dışına çıkarak yeni bir uygulama sunmaktadır. Ancak bu yeni sistem uygulama aşamasında tüm ülkelerde uygulanması önerilen Uluslararası Muhasebe Standartları ile bazı yönleri ile ayrışmaktadır. Bu durum Uluslararası Muhasebe Standartları ile uyumlaştırma sürecinin başlamasına sebep olmuştur. Böylece Faizsiz Muhasebe Standartları geliştirilmiştir. Çalışmamız bu noktada önem kazanmaktadır. Çalışmamızın amacı; Faizsiz Muhasebe Standartları ile Uluslararası Muhasebe Standartlarının karşılaştırmasını yaparak Mali Müşavirlerin bu standartları tanıma noktasında algısını ölçmek ve çözüm önerileri getirmektir. Türkiye'de faaliyet gösteren katılım bankaları bu standartları uygulamakta daha fazla ön plana çıkmaktadır. Özellikle İslami Finansal Kuruluşlar Muhasebe ve Denetim Organizasyonu Kurumu (AAOIFI = Accounting and Auditing Organization of Islamic Financial Institutions) muhasebe standartları, Uluslararası Muhasebe Standartları Kurumu'nun (IASB = International Accounting Standards Board) hem Faizsiz Bankacılık Standartları hem de Uluslararası Muhasebe Standartlarının uyumlaştırılması için çabalar sarf etmiştir. Çalışmamızda önceden hazırlanmış anket soruları ile İslami ilkelere uygun olarak hazırlanmış olan Faizsiz Finans Muhasebe Standartlarının TRB1 Bölgesinde (Malatya, Elâzığ, Bingöl ve Tunceli) faaliyet gösteren S.M.M.M. ve Y.M.M.'lerin Faizsiz Finans Muhasebe Standartları üzerindeki algısını değerlendirip var olan bilgilerin korunması, güncel tutulabilmesi için eksiklerin tespitini yapıp bu eksiklerin giderilmesine katkı sağlayacak bilgilere ulaşmaya çalışılmıştır. Bu çalışmanın Muhasebe literatürüne, finans literatürüne ve muhasebe eğitimlerine katkı sunacağı umut edilmektedir."
