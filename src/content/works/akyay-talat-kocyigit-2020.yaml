abstract: "Yüce Allah insanı yaratıp onu imtihana tabi tutmak için dünyaya göndermiş; insana sorumluluğunu öğretmek için kutsal kitaplar ve kitaplardaki hayat modelini uygulamalı olarak göstermek için de peygamberler göndermiştir. Peygamberler ise hem Allah'ın mesajlarını insanlara duyurarak tebliğ etmişler, hem bu mesajları insanlara açıklayarak tebyin görevini yerine getirmişler, hem de ilahi mesajların uygulamasını göstererek temsil görevini yerine getirmişlerdir. Peygamberimiz de aynı şekilde hayatı boyunca Allah'ın (c.c) emir ve yasaklarını insanlara tebliğ ve tebyin etmiş ve insanlığa rol model olmaya çalışmıştır. Peygamber efendimiz hayatta iken ashaptan gelen sorulara cevap verip gerekli açıklamaları yapıyordu; vefatından sonra gelen sorulara ise sahabe ve tabiinden o konuda yetkin olanlar cevap verip açıklamaya çalıştılar. Tabiun döneminde tefsirle ilgili rivayetler, hadisler tedvin edilirken onların içinde ayrı bir bölümde yer alıyordu. Tabiinden sonra tefsirle ilgili rivayetler müstakil eserlerde yer almaya başladı ve gelişerek devam etti. Bu çalışmamızda tefsir ekolleri, Ahkâm ayetleri ve Ahkâm tefsirleri, Ankara Üniversitesi Hadis Anabilim Dalında görev yapan Prof. Dr. Talat Koçyiğit'in: Hayatı, tahsili, hocaları, çalıştığı yerler, eserleri ile eserlerindeki zina ilgili kavramlar ve tefsirindeki ahkâm ayetlerinden: zina, zina iftirası (Kazf) ve lanetleşme (lian) ile ilgili ayetlere yaklaşımı değerlendirilecektir."
