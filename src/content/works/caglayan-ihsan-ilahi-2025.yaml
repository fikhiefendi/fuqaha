abstract: "İhsan İlâhî Zahîr, 1945 Siyâlkût doğumlu Sîtîlerin Şeyh koluna mensup bir düşünürdür. Tahsil hayatına küçük yaşta Kur'an ezberiyle başlayan Zahîr, Câmia İslâmiye Medresesi'nden mezun oluncaya kadar sürdürdü. Zahîr, muhaddis hadis, mantık ve felsefe dersleri aldı. Farsça, Urduca ve Arapça bilen Zahîr, lisans eğitimi için Medine İslâm Üniversitesi Külliyyetü'ş-Şerîa Fakültesi'nde bulundu. 1972 yılında Pakistan'a döndü. Zahîr'in dinî görüşlerinde Siyâlkût ve Faysalâbâd şehirlerindeki selefi düşüncenin büyük bir etkisi vardır. O, ailesinin ekonomik durumunun iyi olmasından dolayı herhangi bir resmi görev almadı. Ancak misafir hoca olarak yurt dışında çeşitli dersler verdi. Zahîr, dinî faaliyetler kapsamında ağırlıklı olarak halka yönelik vaaz-hutbe ve Vifâku'l-ulemâ Siyâlkût adlı selefi bir organizasyonun genel sekreterliğini yaptı. Bu bağlamda onun en eski selefi merkezlerinden Câmi Mescid Ehl-i Hadîs Çinyânvâlî'de verdiği cuma vaaz ve hutbeleri önemlidir. Ayrıca Ehl-i Hadîs, el-İtisâm ve Tercümânü'l-hadîs gibi dergilerin yayımcılığını da üstlenen Zahîr'in mezhepler ve fırkalarla ilgili iki yüz bin civarında eser içeren çok zengin bir koleksiyonu vardır. Zahîr, 1972-77 yılları arasında Muhammed Asgar Han'ın başkanlığını yaptığı Tahrîk-i İstiklâl partisinde aktif siyaset hayatına başladı ve 1977 seçimlerinde milletvekili adayı oldu; fakat partisiyle yaşadığı anlaşmazlık nedeniyle partiden ayrıldı. 1977'de danışma kuruluna seçilen Zahîr'i, Hanefîlik ve Diyobendîler ile birlikte hareket ettiği için Ziyâülhak'ı şiddetle eleştirdiğinden bu görevinden ayrılmıştır. Ülkesindeki Ehl-i Hadis çevreleriyle de ters düşen Zahîr, 1981'de Cem'iyyet-i Ehl-i Hadîs-i Pâkistan isimli yeni bir grup kurmuş ve görüşlerini yaymak için çeşitli ülkelere seyahat etmiştir. Evli ve sekiz çocuk sahibi Zahîr, 1987 tarihinde uğradığı bombalı suikast sonucu yaşamını yitirmiş ve Medine Bakî Mezarlığı'na defnedilmiştir. Zahir, mutaassıp selefi düşünceye sahip bir Müslüman düşünür olarak çalışmalarında ağırlıklı olarak Kitap ve Sünnet'i esas almaktadır. O, selefi bir tutum takınarak klasik din anlayışlarından tasavvuf ve bazı alt kollarıyla birlikte Şia'yı; çağdaş din anlayışlarından ise Kâdiyânîlik ve Birelvîlik hareketleri aleyhine hakkında müstakil eserler yazacak ölçüde çalışmalar yürütmüş ve bunların tamamının İslâm dışı olduğunu söylemiştir. Onun klasik ve çağdaş Müslüman anlayışlarına bu denli sert bir tutum takınmasında savunduğu selefi fikirlerin büyük etkisi olduğu görülmektedir. Çalışmada, sadece Zahîr'in eleştirisine konu olan dinî akım ve hareketler konu edilmiş; kaynak olarak ise ağırlıklı olarak Zahîr'in eserleri kullanılmıştır. Araştırmanın yöntemi, sosyal bilimler veri toplama teknikleri ve analiz olarak tümevarım metotu esas alınmıştır."
