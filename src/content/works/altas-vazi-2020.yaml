abstract: "Bu tezin amacı, fıkıh usulü ilminde bir şer'î hüküm tasnif türü olarak teşekkül etmiş olan vaz'î hükmü, sebep hükmü ışığında, metodolojik açıdan tahlil etmektir. Bu amaç doğrultusunda, çalışmaya esas teşkil eden ilk bölümde, şer'î hüküm hakkındaki tanımlara, temel kavramlara ve hüküm tasnif türlerine; ikinci bölümde ise usûl alimlerinin vaz'î hüküm ve sebeb hükmü hakkındaki düşüncelerine yer verilmiştir. Tez, genel itibariyle tasvir edici yöntemle çalışılmış olmakla birlikte, gerekli görülen yerlerde, nakledilen görüşlerin değerlendirilmesi ve tenkidi yoluna da gidilmiştir. Usûl ilminin bilhassa h. 5.y.y ile 7.y.y arasında telif edilmiş kaynaklarından elde ettiğimiz bilgiler bizi, sebebin, vaz'î hüküm tasnif türünün merkezî kavramı olduğu sonucuna ulaştırmıştır; öyle ki, sebep hükmünü anlamadan ve usûlcülerin onun hakkındaki tartışmalarını bilmeden bu tasnif türünü metodolojik açıdan tahlil edebilmek oldukça zor görünmektedir. Vaz'î hüküm, bir teori olarak Şâri'in dünya hayatının akışı içinde süregelen bir takım olgu, olay, fiil ve beşerî münasebeti şer'î/ teklifî hükümlerin varlığı için sebep kıldığını düşünen ve tüm bu durumlarla belli- başlı şer'î hükümler arasında mantıksal bir zorunluluk (îcâbiyet) ilişkisi bulunduğunu iddia eden usûlcülerin bu düşünceleri ve iddiaları etrafında şekillenmiştir. Sebep hükmü bu teoride, şer'î hükümlerin -diğer vaz'î hükümlerden farklı olarak- asıl varlık gerekçesi (mûcib sebep) olarak görülmektedir. Yani sebep, vaz'î hüküm teorisinde ayrı bir yere ve öneme sahiptir. Dolayısıyla tüm bu tespitler ışığında, sebep hükmü için,“vaz'î hüküm teorisinin aslî unsurudur”demek yanlış olmayacaktır."
