abstract: "Bu tezin temel amacı, Türkiye'nin zekât potansiyelini tespit ederek elde edilen potansiyel değerin gelir dağılıma uygulanarak olası etkilerini göstermektir. Gelir dağılımındaki eşitsizlik, kamunun en önemli problemlerinden olup iktisadi ve sosyal problemlere yol açmaktadır. Bu problemlerin çözümünde yeniden gelir dağıtımı sistemlerinin analiz edilmesi önem arz etmektedir. İslam açısından dini bir vecibe olan zekât, aynı zamanda servetin toplum genelinde düzenli dağılmasını sağlayan ve toplumsal refahın oluşmasında pay sahibi olan bir müessese şeklinde öne çıkmaktadır. Çalışmada ilkin zekât ve gelir dağılımı teorik olarak incelenmiş, zekâtın gelir eşitsizliğine etkileri konusunda literatür taraması yapılmıştır. Analiz bölümünde Türkiye'nin 2025 yılına ait verileri kullanılarak farklı metotlarla zekât potansiyeli hesaplanmaya çalışılmıştır. Gayrisafi Yurt İçi Hasıla, Eşdeğer Hanehalkı Kullanılabilir Fert Geliri ve Forbes servet verilerinden bu kapsamda yararlanılmıştır. Elde edilen potansiyel zekâtın gelir dağılımına etkisinin ölçülmesi için bu değerler, TÜİK tarafından yayınlanan son on yıllık gelir dağılımı istatistiklerine uygulanmıştır. Bu simülasyonda gelirden en az pay alan gruplara zekât aktarımı yapılarak olası sonuçlar analiz edilmiştir. Yapılan incelemede zekâtın düzenli bir şekilde aktarılması neticesinde gelir adaletsizliğinde azalma meydana geleceği değerlendirilmiştir."
