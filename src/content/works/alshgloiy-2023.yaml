abstract: "Bu araştırmada çağdaş gelişmeler ışığında Müslüman kanınla ilgili hükümler İslam fıkhı açısından dört mezhebe göre incelenmiştir. Çalışma, Kur'ân, sünnet ve diğer şer'î kaynaklara dayanarak güncel sorunlarla ilgili tercih edilen görüşleri tespit etmeyi amaçlamaktadır. Çalışmanın önemi, araştırmada ele alınan konuların hassasiyetinden kaynaklanmaktadır. Delilsiz fetvaların çok olduğu bir dönemde şer'î hükmün açık ve net olarak bilinmesi büyük önemi haiz olup, bu mesele çağımızın sorunlarındandır. Tesettür, miras konuları, kadınların çalışması, seçimlere ve siyasi hayata katılması, bu görevlerin kusur ve ihmalin sonuçları olarak fitne, fesat ve toplum değerlerinin kaybı günümüzde kadınlarla ilgili cevaplanması gereken sorulardandır. Tarihte kadının konumu ortaya konulurken betimleyici tarihsel metot kullanılmıştır. Müslüman kadının hükümleriyle ilgili görüş ve nasların şer'î ve hukuk kitaplarındaki çağdaş gelişmeler ışığında incelenmesi ve konuyla ilgili mezheplerin görüşlerinin kıyaslanarak tahlil edilmesinde analitik tümevarım yöntemi tercih edilmiştir. Araştırmada ulaşılan neticelerden önemlileri şunlardır: Kadını dünyevî ve maddî çıkarları için sömüren diğer hukuk sistemlerinin aksine, kadınlara ilk defa adil davranan, onlara tüm hak ve görevlerini veren İslam dinidir. Okullar, fabrikalar ve halka açık yerlerde kadın ve erkeklerin karışması istenmeyen sonuçlar doğurabilir. Müslüman kadınların karşılaştığı en önemli zorluklar arasında kadının evden çıkma ve çeşitli işlerde çalışma hakkı yer almaktadır. Şeriat, kadının bu alanlarda çalışmasına müsaade etmiştir. Kadın çalışma hayatında başarısını kanıtlamış, hatta bazı alanlarda erkekleri geçmiştir. Ancak bütün bu hakların kullanılması, yapılan işin şeriatın şartlarına uymasına bağlıdır. Eğer bu şart yerine gelmezse kadın, asli görevi olan nesil yetiştirme vazifesini ihmal edebilir. Siyasete katılım hakkında gelince kadın, şer'i kanunlara uygun olduğu müddetçe erkekler gibi siyasi makamları talep edebilir. Ancak bu konuda kadın ve erkeklerin karma bir şekilde çalışmaması gerekir.. Araştırmacı, kadının batılı laik akımlara kapılmaması için dini ve milli kültür bilincini artırmayı önermektedir. Aynı şekilde kadının eğitim ve nesil reformu sürecinde çok önemli ve merkezi bir rolü olduğu konusunda reformcular, vaizler ve düşünürleri, uyarmak gereklidir."
