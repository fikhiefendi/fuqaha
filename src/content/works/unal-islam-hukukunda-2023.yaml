abstract: "Aynî haklar, hak sahibine eşyayı kullanma, eşyadan yararlanma ve eşya üzerinde tasarrufta bulunma yetkilerini vermektedir. Bu yetkilerin tamamını içerisinde bulunduran aynî hak mülkiyet hakkıdır. Bu yetkilerin bir kısmını sağlayan haklar ise sınırlı aynî haklar olarak ifade edilir. Sınırlı aynî hakların bir türü de irtifak haklarıdır. İrtifak hakları, hak sahibine eşyanın menfaatinden yararlanma yetkisi verir. İrtifak hakları menfaat mülkiyeti kapsamında değerlendirildiği için“milk”kavramı içerisinde yer alır. İrtifak hakları, fıkıh kitaplarında“irfak”,“hukuk”ve“merâfık”kavramları ile ifade edilmiştir. İrtifak hakları, eşyaya bağlı irtifaklar ve şahsa bağlı irtifaklar olmak üzere ikiye ayrılırlar. Eşyaya bağlı irtifakların en çok görülen türleri şirb hakkı, mecra ve mesil hakkı, geçit hakkı ve üst hakkı olarak karşımıza çıkmaktadır. Bununla birlikte eşyaya bağlı irtifaklar bu haklarla sınırlı değildir. Farklı türlerde eşyaya bağlı irtifak hakkı kurulması mümkündür. Şahsa bağlı irtifaklar intifa ve süknâ hakları ile düzensiz kişisel irtifaklardır. Başta kira sözleşmesi olmak üzere menfaat mülkiyetinin devrini sağlayan diğer hukuki işlemler nedeniyle, İslâm hukukunda, müstakil olarak intifa ve süknâ hakkı tesisine ihtiyaç duyulmamıştır. Bununla birlikte düzensiz kişisel irtifakların kurulduğu görülmüştür. İrtifak hakkı olmamasına rağmen, bazı yazarlar tarafından irtifak hakkı olarak değerlendirilen birtakım haklar bulunmaktadır. Bu hakların başında kat irtifakı, komşuluk hakkı ve şefe hakkı gelmektedir. Kat irtifakı, gerçek anlamda bir irtifak hakkı değildir. Bu hak,“hakku't-temellük”kavramı kapsamında değerlendirilebilir. Komşuluk hakkı, mülkiyeti kısıtlayıcı bir neden olmakla birlikte irtifak hakkı olarak değerlendirilemeyecektir. Komşuluk hakkının irtifak haklarından farkları bulunmaktadır. Şefe hakkını, şirb hakkı gibi gören yazarlar bulunmaktadır. Ancak her iki kavram arasında çok fazla fark bulunmaktadır. Şefe, ibâha yetkisi sağlamaktadır. Dolayısıyla şefe bir irtifak hakkı değildir."
