abstract: "Hadis/Sünnet, Peygamberimiz'in (s.a.v.) anlamlı sözleri ve örnek uygulamaları olmaları sebebiyle, her zaman müslümanların alakalarına mazhar olmuştur. İslam'ın Kur'an'dan sonra ikinci kaynağı olan Hadis/Sünnet'in sübut ve sıhhat problemi İslam alimlerini başlangıçtan günümüze değin meşgul etmiştir. Günümüzde de, bazı tenkidler art niyetli olmakla beraber, bu problem geçerliliğini aynı tazelikte korumaktadır. Günümüzde Peygamber'in (s.a.v.) had uygulamaları ile ilgili hadisler, bu tartışmalardan en çok nasiplenen hadislerin başında gelmektedirler. Bu çalışmamızda, Peygamber (s.a.v.) döneminde uygulanan had cezaları ile ilgili hadisleri tesbit edip, hadis ilmi açısından sened ve metin tahlillerini yapmaya gayret ettik."
