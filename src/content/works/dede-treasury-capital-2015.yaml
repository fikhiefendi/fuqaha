abstract: "Katılım Bankalarının son 10 yılda 10 kattan fazla büyümesi ve sektör payını hızlıca arttırması sonucunda, bu alanda ki bilimsel çalışmaların sayısında hızlı artış görülmüştür. Ancak dünyadaki İslami finans uygulamalarının birçoğunun ülkemizde uygulanmadığı ve bu alanda yapılan bilimsel çalışmaların sektör içinden yapılmadıkça uygulamaya yönelik çok kısıtlı kaldığı ve şu ana kadar yapılan bilimsel çalışmaların benzer şeyleri tekrar ettiği gözlemlenmiştir. Dolayısı ile bu çalışmanın amacı spesifik olarak Katılım Bankalarında hazine ve sermaye piyasası ürünlerini tanıtarak bu alanda uygulamaya yönelik az olan yazılı kaynak sayısını arttırması amaçlanmıştır. Katılım Bankalarında ki hızlı büyüme sonucunda hazine ve sermaye piyasası ürünleri önem kazanmıştır. Bu ürünler içinde, yönetilecek fon miktarının büyümesi, müşteri talepleri, riski azaltmak ve aktif pasif yönetimini kolaylaştırmak için geliştirilen kira sertifikası çok önem kazanmıştır. Bu ürün İslami finans sektörüne bir canlılık ve yenilik getirdiğini ve hazine/sermaye piyasası alanında çok yoğun şekilde kullanıldığını yapılan çalışmalar ile gösterilmektedir. Bu ürüne dayalı çıkarılan yatırım fonlarının da kira sertifikası kadar sektörde önemli olacağı tahmin edilebilir. Hâlihazırda kullanılan diğer hazine ürünler ise, sektörün büyümesi ile o ürünlerdeki işlem hacmini çok hızla artış göstermiştir."
