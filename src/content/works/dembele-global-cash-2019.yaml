abstract: "Aşırı boyutlara varan fakirlik, Müslüman toplumun olarak karşılaştığı problemler listesinin başlarında gelmektedir. Bu sorunun Müslüman toplumun değerleri ve kültürleri bağlamında çözülmesi için akademik bir yaklaşıma ihtiyaç duyulmaktadır. Bu çalışma, çağdaş sosyo-ekonomik problemlere İslami yaklaşımlar getirerek, Müslüman ülkelerde yoksulluğun azaltılmasında rol oynayacak pratik çözümlere ve bilgi üretimine katkı yapmayı hedeflemektedir. İslam, ilk devirlerinden bu yana ekonomik meselelere ciddi bir önem atfetmiştir. Bunların arasında Para Vakfı, ümmetin tarih boyunca karşılaştığı sosyo-ekonomik problemlerin üstesinden gelmesine aracı olarak, İslam ekonomisinin en önemli çözümlerinden birisini teşkil etmiştir. Böyle olduğu halde, bugünlerde Para Vakıflarının rolü Müslüman toplumun sosyo-ekonomik yaşamında gittikçe küçülmüştür. Müslüman toplumlarda vakıf sisteminin rolünün azalmasındaki çeşitli faktörleri incelemek ve günümüzde bu anlamdaki uygulama fırsatlarını değerlendirmek bu çalışmanın iki temel amacını oluşturmaktadır. Birçok araştırma ve akademik çalışma yapan paydaşlar konuya önemli katkılar yapmasına rağmen, toplumsal problemlerin çözülmesi adına para vakıflarının kullanımı ve dünya çapında bu yöndeki eşgüdümlü çabalar yaygınlaşmamıştır. Bu nedenle, bu çalışma söz konusu boşluğu doldurulması için katkı yapmayı hedeflemektedir. Ayrıca bu çalışma, içerik analizi ve meta-analiz yöntemlerini kullanarak mevcut para vakfı yatırım modellerini eleştirel olarak incelemekle birlikte, Müslüman toplumlardaki yoksulluk problemini çözmek adına uluslararası bir para vakfı modeli ortaya koymayı amaçlamaktadır"
