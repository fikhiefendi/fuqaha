abstract: "Bu çalışmada; Kur'ân-ı Kerim'in âyetleri ışığında zekât, sadaka ve faizin toplumsal boyutu ele alınmıştır. Zekât ve sadaka fakirler ile zenginler arasında sosyal ve ekonomik mesafeyi daraltırken, faiz ise tam tersi bir duruma sebep olabilmektedir. İnfâk ve sadaka anlayışının yaygın olduğu bir toplum; finansal açıdan desteklendiği için daha huzurlu ve mutlu olabilirken, faizin yaygın olduğu toplumda ise fakir ve muhtaç kesim daha huzursuz ve mutsuz olabilmekte, dolayısıyla toplumsal kargaşa ve ihtilaller meydana gelebilmektedir. Semavî veya beşeri tüm dinlerde paylaşma, yardımlaşma ve dayanışma çokça önemsenmektedir. İslamiyetten önce cahiliye Arapları arasında infâk ve sadaka anlayışı mevcut olduğu, Hz. Muhammed'den (s.a.s) önceki peygamberler döneminde de zekât ve sadakanın emredildiği ve çokça önemsendiği araştırmamızdatespit edilmiştir. Zekât, sadaka ve faize işleyişleri açısından bakıldığında günümüzde daha girift bir hal aldıkları görülmektedir. Dolayısıyla bu çalışma; zekât, sadaka ve faizin toplumlar üzerindeki etkisini tarihi verilerden hareketle araştırması açısından ve günümüz dünyasında infâk, sadaka, zekât ve faize dair düşünce ve anlayışları arz etmesi bakımından oldukça önemli sayılabilir. Bu çalışma, Kur'ân-ı Kerim'de zikredilen zekât, sadaka ve faiz âyetlerine müfessirlerce yapılan yorum ve açıklamaları aktarması yönüyle ve Hz. Muhammed (s.a.s), Dört Halife, Emeviler, Abbasiler, Selçuklu ve Osmanlı döneminde zekât, sadaka ve faizin nasıl uygulandıklarını tarihsel süreç içerisinde ele alması bakımından önem taşıdığı söylenebilir. Bu çalışmada Taberi, Begavî, İbnu'l Cevzi, İbn-i Kesir, Elmalılı, Seyyit Kutup, Ömer Nasuhi Bilmen, Said Nursi ve Sabunî gibi birçok müfessir ve İslam âlimlerinin zekât, sadaka ve faize dair görüş ve düşünceleri aktarılmıştır. Bu yönüyle çalışmamızın dirayet ve rivayet tefsirlerini harmanlaması bakımından önem taşıdığı söylenebilir. Çalışmanın son bölümünde zekât, sadaka ve faizle ilgili alanında uzman olan 13 akademisyenin görüş ve düşüncesi aktarılmış olup sistematik bir saha araştırması yapılmıştır. Çalışmamızın tüm bu yönleriyle oldukça önem arz ettiği düşünülmektedir."
