abstract: "Tez, giriş kısmı ve dört bölümden oluşmaktadır. Giriş kısmında, çalışmanın önemi, amacı, sınırlılıkları hakkında bilgi verilmiştir. Birinci bölümde, ehliyet konusunun İslâm hukukundaki mahiyetine, vücub ve eda ehliyeti kavramlarına, kişide ehliyetin tam ve eksik olması ile ilgili konulara değinilmiştir. İkinci bölümde ise, kişinin, cenin halinden itibaren, hayatın çeşitli evreleri olan doğum, çocukluk, ergenlik ve rüşd çağı da dahil olmak üzere, hangi şartlarda vücub ve eda ehliyetine sahip olup olmadığına değinilerek çeşitli durumları incelenmiştir. Üçüncü bölümde ise, ehliyeti daraltan ve ortadan kaldıran sebepler başlığı altında, çocuk olma, akıl hastalığı, uyku, bayılma, unutma, kölelik, ölüm hastalığı, hayz ve nifas hali gibi semavi ehliyet arızalarıyla; bilmezlik, sarhoşluk, hezl, sefeh, sefer ve ikrah gibi müktesep ehliyet arızaları, Hanefî, Şâfiî, Hanbelî ve Malikî mezhebi görüşleri çerçevesinde incelenmiştir. Tez konumuzun esasını teşkil eden dördüncü bölümde ise, başlıklar halinde, semavi ve müktesep ehliyet arızalarının, nikâh akdi ve talâk üzerindeki etkileri ele alınmıştır. Bu bölümde ehliyet arızalarının, nikâh akdi ve talâk üzerindeki etkilerinin, mezheplere göre hükümleri ele alınmış; klasik dönem İslâm âlimleri ile günümüz İslâm âlimlerinin konuyla ilgili görüşlerine yer verilmiştir. Konular incelenirken Hanefî, Şâfiî, Mâlikî ve Hanbeli mezhebi görüşleri çerçevesinde kalınmaya dikkat edilmiştir. Çalışmada mümkün olduğunca mezheplerde kabul gören görüşlere yer verilmeye çalışılmıştır. Çalışmada ayrıca günümüz problemlerinden ehliyet arızaları başlığı altında incelenmesi mümkün olabilecek türden olan, internet bağımlılığı, sanal sosyal ortamlarda etkin ve saygın olma güdüsü ile oyun bağımlılığı vb. durumlara da kısaca değinilmiştir."
