abstract: "İllet, Hanefi kıyas teorisinin en önemli kısmını oluşturmaktadır. Hanefî illet teorisine ilişkin yapılan bazı araştırmalarda illet konusunun tamamı değil, belli bazı yönleri ele alınmış ve çoğu zaman yüzeysel değerlendirmelerle yetinilmiştir. Ayrıca Hanefî mezhebinin Irak ekolü ile Semerkant ekolü usûlcülerinin yaklaşımlarının mukayesesine yer verilmemiştir. Sonuçta Hanefi mezhebinin illet teorisi bütün yönleriyle ele alan bir çalışma ortaya çıkmamıştır. Bunun yanında ilgili çalışmalarda Hanefî mezhebinde illetin mahiyeti ve tavsîfine ilişkin bazı belirsizlikler olduğu iddia edildiği gibi, bazen, illetin mahiyeti hakkında birbirinin zıddı terim ve sıfatlar Hanefî usûlcülere izafe edilmiştir. Bu çalışmada Hanefi illet teorisinin bütün yönleriyle ortaya konulması ve illetin tarifi ve tavsîfi hususunda öne sürülen belirsizliklerin giderilmesi hedeflenmektedir. Araştırmamızda mezhep içerisinde bir hükmün farklı vasıflarla ta'lîlin imkânı konusuna yer verilmiştir. Kurucu imamların fer'î bir hükmü gerekçelendirdikleri vasfın günümüz açısından değişime açık olma konusuna yer verilmiştir.“Hanefî Usûlünde İllet Teorisi”başlıklı bu araştırma, Irak ve Semerkant ekolünün illetle ilgili yaklaşımlarını gerekçeleriyle birlikte ortaya koymayı hedeflemektedir. Hanefî usûlünde illet teorisinin temelini oluşturan tesirin tespiti ve çeşitleri, buna bağlı olarak geliştirilen mülâeme yaklaşımında bazı belirsizlikler bulunmaktadır. Bu araştırma da tesir, müessir vasıf ve mülâeme teriminin tarihi süreci izlenerek mevcut anlayışlar arasındaki farklılıklar ve gerekçeleri incelenmiştir. Böylelikle illet teorisinin ana meseleleri açıklanarak konuyla ilgili sonraki araştırmalara katkı sunmak istenmiştir. Hanefî illet teorisine ilişkin yapılan araştırmalarda, Hanefîler tarafından yöntem olarak takrir edilen mülâeme ve tesirin şart kılınmasının gerekçelerine tesadüf edilmemiştir. Bu araştırmada illet teorisine etki eden diğer Hanefî fıkıh esasları çerçevesinde mülâeme ve tesirin neden şart kılındığı incelenmiştir."
