abstract: "Bu çalışma, Libya ticari bankalarının tefecilik işlemlerinin yasaklanmasından önce ve tefecilik işlemlerinin yasaklanmasından sonraki finansal performansının etkisini ortaya koymayı ve bunun, Libya ticari bankalarının finansal pozisyonlarını desteklemedeki etkinliği üzerindeki etkisini her iki açıdan tespit etmeyi amaçlamaktadır (iç kaynakların toplam kaynaklara oranı ve kaynaklardaki değişim oranı (kişisel kaynakların toplam mevduata oranı) ile işletmenin finansal performansında tefecilik işlemlerinin yasaklanması sonrasında finansal performansta iyileşme veya düşüş olup olmadığının belirlenmesidir. bankalar inceleniyor. Çalışmada, tefecilik ve mali performansa ilişkin yazılı literatürün değerlendirilmesi yoluyla tümevarımsal yaklaşım kullanılmış, ardından mali işlemlerin önlenmesine ilişkin 2013 tarihli (1) sayılı Kanun'un teorik çerçevesi kullanılmıştır. Çalışmada, çalışmanın teorik ve pratik yönlerinde veri toplama, analiz ve yorumlamanın tüm aşamalarında analitik yaklaşım kullanılmıştır. Bu çalışmada istatistiksel yazılım paketi kullanılarak analitik yaklaşımın bir parçası olarak istatistiklere güvenilmiştir. Çalışmaya konu olan bankalar için tefecilik işlemlerinin yasaklanmasının etkisini test etmek amacıyla, çalışmayı oluşturan değişkenlerin on yıllık hareketinin betimleyici bazı analiz araçları kullanılarak betimleyici bir yazılımdan yararlanılacaktır. Çalışma, tefecilik işlemlerinin yasaklanmasının, tefecilik işlemlerinin yasaklanmasından sonra ticari bankaların aktif büyüklüğünün gelişimini arttırdığı da dahil olmak üzere bir dizi önemli sonuca ulaştı. Sonuçlar, bankacılık büyüme büyüklüğünün ve yatırım varlıklarının büyüklüğünün yasaklama sonrasında değişmediğini gösterdi. tefecilik işlemleri ve tüm kârlılık göstergeleri de yasağın öncesindeki durumun sabit kaldığını gösterdi. Çalışma, bankaların tefecilik işlemlerini yasakladıktan sonra nakit likidite yönetimini yatırımlara yönlendirerek dengelemeleri ve gelir oranlarını artıracak yeni yatırım yöntemleri geliştirmeleri konusunda çalışmaları gerektiği gibi bir dizi önemli öneriyle sonuçlandı. ve harcamalarını sınırlamaya çalışmanın yanı sıra bankacılık hizmetlerini çeşitlendirmeye yönelik çalışma ihtiyacı."
