abstract: "Bu çalışmada, Zerkeşî'nin Hanefîlere atfettiği görüşler istinbât yöntemleri özelinde ele alınmış, tespit ve tahkik edilmiştir. Çalışma iki bölümden oluşmaktadır. Birinci bölümde Zerkeşî'nin hayatı ve ilmî kişiliği ele alınırken, ikinci bölümde ise istinbât yöntemleri bağlamında Hanefîlere yaptığı nispetlerin tespit ve tahkiki yapılmıştır. Müellif istinbât yöntemleri bağlamında Hanefîlere 99 nispette bulunmuş, bu atıfların 88'inde isabet etmiş olup, 11 nispette ise hata etmiştir."
