abstract: "Tarih; yazılı, sözlü ve kalıntı şeklindeki kaynaklara dayanarak geçmişe ışık tutan bir bilimdir. Tarihin en önemli yazılı kaynaklarından biri de Şer?iyye Sicilleridir. Şer?iyye sicilleri, Osmanlı Devleti?nde kadıların verdiği hükümleri ve yazıya geçirilen diğer kayıtları içerirdi. Bir bölgenin kadısı her olayı, bir şahitliği, bir hibeyi, bir ikrarı müracaat üzerine kayıtlara geçirirdi.Şer?iyye Sicilleri, Osmanlı Devleti?nin tarihi açısından en önemli kaynaklardan biridir. Osmanlı Şer?iyye mahkemelerinde tutulan bu kayıtlar, o dönemdeki hukuki, ekonomik, dinî, askerî ve idari uygulamalar hakkında bize ışık tutmaktadır. Ayrıca bu devletin yıkılmasından sonra yerine kurulan devletlerin tarihini Şer?iyye Sicillerini incelemeden doğru bir şekilde anlayamayız.Develi, Akdeniz ve İç Anadolu bölgeleri arasında bir köprü konumunda olması hasebiyle stratejik bir konuma sahiptir. O dönemlerde Develi?de Müslüman ve gayrimüslim halkın birlikte yaşadığı mahalleler mevcuttu. Aynı zamanda Develi tarih boyunca bir çok medeniyete tanıklık etmiştir.Şer?i mahkemelerde Müslümanlar gayrimüslimlere, gayrimüslimler de Müslüman halka şahitlik ve vekillik yapıyorlardı. 19. yüzyılda Müslüman halk genellikle tarım ve hayvancılıkla uğraşırken, gayrimüslim halk ise ticaret ve zanaatla geçimlerini sağlıyorlardı."
