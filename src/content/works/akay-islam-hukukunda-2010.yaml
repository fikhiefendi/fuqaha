abstract: "İslam dinine göre yüce Allah'ın eliyle yaratılan ve Allah'ın ruhunu taşıyan ilk insan Hz. Âdem, engelli değildi. Fakat onun, cennet yurdundan dünya gibi meşakkatli bir âleme intikaliyle dünyada doğan çocukları için aynı şeyler söylenemez. Dolayısıyla `engelli', `özürlü', `sakat' ve `özel ihtiyaç sahipleri' gibi kavramlarla ifade edilen ve araştırmamıza konu olan bu özel insanların tarihi, insanlık tarihinin ilk dönemlerine kadar gider. Çeşitli nedenlerle engelli durumuna düşen bu insanlar, adaletin, hakkın ve hukukun hâkim olmadığı tüm zaman dilimlerinde çok büyük acılar çektiler. Bu acılar yakın bir tarihe kadar da devam etti.Fakat son bir asırdır demokrasi, özgürlük, insan hakları gibi gün geçtikçe önemi artan konular, toplumsal bir boyut kazanmıştır. İnsanlık adına sevindirici olan bu gelişmelerle birlikte engelli bireylere bakış açısı da pozitif yönde ivme kazanmıştır.Ancak dünya genelinde 500 milyon engelli insanın yaşadığı düşünüldüğünde insanlığın bu önemli konuda daha alacağı çok yolun olduğu görülmektedir. Ayrıca insanın kendi eliyle sebebiyet verdiği savaş, terör, trafik, alkol, uyuşturucu, iş kazalarının yanında, deprem, sel, yangın gibi doğal afetler düşünüldüğünde bu konunun dini, sosyal, ekonomik, siyasi ve hukuki boyutlarının sürekli gündemde tutulması ve çözümler üretilmesi gerekliliği apaçık ortadadır.İşte biz de bu çalışmamızda, temelde bir insan hakları meselesi olan böylesi önemli ve güncelliğini hiç yitirmeyen bir konuyu, engellilik tarihini de göz önünde bulundurarak, İslam hukuku açısından incelemeye gayret gösterdik.Biz bu çalışmamızda; islam hukukunun iki asıl kaynağı olan Kur'an ve sünnetin engellilere bakış açısı nedir? Kur'an, engelli Peygamberlerden söz etmiş midir? Hz. Muhammed (s.a.) dönemindeki engelli sahabeler nasıl muamele görmüşlerdir? Kur'an ve sünnete göre engelli olmanın sebepleri nelerdir? Engellileri ilgilendiren usulî ve fıkhî kurallar onlara ne gibi kolaylık ve yükümlülükler getirmiştir? İslam hukuk âlimleri engellilerden bahsetmişler midir? gibi merak edilen sorulara cevap aramaya çalıştık."
