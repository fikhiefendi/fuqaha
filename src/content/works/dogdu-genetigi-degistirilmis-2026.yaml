abstract: "Genetiği Değiştirilmiş Organizmalar (GDO), laboratuvar ortamında biyoteknolojik yöntemler kullanılarak bir canlının genetik dizilimine farklı bir canlıdan alınan genlerin aktarılmasıyla elde edilen yeni formları ifade etmektedir. Tarım ve gıda sektörlerinde yoğun bir kullanım alanına sahip olmakla birlikte; sağlık, endüstri, sanayi vb. alanlarda da kullanım alanları mevcuttur. GDO kullanımında, az alandan çok ürün elde etme, dayanıklılık, iklim koşulları, çeşitli zararlı böcek ve hastalıklarla mücadele vb. amaçlanmaktadır. Hızla artan dünya nüfusu ve gıda talebi, tarımsal verimliliği artırmak ve maliyetleri düşürmek amacıyla GDO teknolojisinin yaygınlaşmasına zemin hazırlamıştır. Son yıllarda birçok alanda artış gösteren ve Dünya üzerinde belli başlı bir alana sahip olan GDO, ekolojik denge ve insan sağlığı üzerindeki olası riskleri de beraberinde getirmektedir.“Genetiği Değiştirilmiş Organizmaların (GDO) İslâm Hukukuna Göre Değerlendirilmesi”başlıklı bu tez çalışmasında, genetik müdahaleler sonucunda elde edilen ürünlerin, İslâm hukuku prensipleri çerçevesinde fıkhî statüsünün (helâl ve haramlık boyutu) belirlenmesi amaçlanmıştır. Araştırma neticesinde; GDO' nun tanımına, en yaygın kullanım alanlarına, yararlarına ve zararlarına, İslâm dîni açısından helâl, haram, istihâle ve istihlâk gibi fıkhî kurallar bağlamında değerlendirilmesi yapılarak, bu ürünlerin insan sağlığına etkileri ve dîni meşruiyeti konusunda toplumun bilinçlendirilmesi amaçlanmıştır."
