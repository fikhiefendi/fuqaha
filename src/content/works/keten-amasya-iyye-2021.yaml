abstract: "Bir şehrin tarihi incelenirken akla ilk gelen kaynaklardan biri, Osmanlı mahkemesinde kadılar tarafından tutulan ve birinci elden kaynaklar olma özelliği taşıyan Şer'iyye Sicilleri'dir. Şer'iyye Sicilleri XV. yüzyılın ikinci yarısından itibaren, XX. yüzyılın ilk çeyreğine kadar tutulmuş olup birçoğu günümüze kadar ulaşmıştır. Amasya Şehri'nin 1652-1654 yılları arasındaki sosyal ve ekonomik yapısını incelediğimiz bu çalışma, 10 No'lu Amasya Şer'iyye Sicili temel alınarak hazırlanmıştır. Nitekim sicilde yer alan kişiler arası anlaşmazlıklar, alacak - verecek ilişkileri, miras ve tereke kayıtları, alım - satım işlemleri, kişiler arası ilişkiler, fiyat tespiti ve daha birçok hukuki konu incelenerek, söz konusu yıllarda Amasya'nın sosyal ve ekonomik yapısı ortaya koyulmaktadır. Sicilde yer alan kayıtlardan yola çıkılarak 1652-1654 yılları arasında Amasya'da mevcut olan sosyal ve ekonomik yaşama dair bilgilerin yansıtılmaya çalışıldığı bu çalışmada, 1650'li yılların başında Amasya'da yaşam sürdüren insanların hayat tarzı ve yaşam standartları, kişiler arasında yaşanan olumlu ve olumsuz ilişkiler ile hukuki yükümlülüklerin ayrıntılı şekilde yansıtılması amaçlanmaktadır. Çalışmanın Giriş Bölümünde; Amasya'nın tarihi arka planı ve Osmanlı dönemi Amasya'sının genel durumu, Osmanlı mahkemesi ve mahkeme görevlileri ile sicilde yer alan belge türleri hakkında bilgiler verilmektedir. Birinci Bölümde; 1652-1654 yıllarında Amasya şehrinin sosyal yapısına, şehrin idari birimleri olan mahalle ve köy yaşantısına, kent ve kırsal arasındaki ilişkilere, aile yapısı ve adli konulara yer verilmektedir. İkinci Bölümde; incelenen dönemde mevcut olan ekonomik yapı kapsamında alım-satım işlemleri, borç-alacak ilişkileri, miras ve hibe işlemleri, yiyecek ve eşya fiyatları ile fiyatlar arasında meydana gelen dalgalanmalara yer verilmektedir."
