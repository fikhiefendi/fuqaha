abstract: "Bu çalışmada, 600 yıl boyunca Asya, Avrupa, Afrika'da hüküm sürmüş olan Osmanlı Devleti'nde adalet kavramını ve İslâm hukukunun uygulanışı hakkında Avrupalı seyyahların yorumunu göstermek amaçlanmıştır. Özellikle siyasi ve ekonomik gücünün arttığı yıllardan itibaren Osmanlı Devleti, Avrupa için büyük bir merak konusu olmuştur. Birçok Avrupalı seyyah Osmanlı Devleti'ni görmek için buraya gelmiş ve çeşitli değerlendirmeler yapmıştır. Bu görgü tanıklarının mektupları, günlükleri, anıları, Osmanlı Devleti'nin sosyal ve kültürel hayatı ile ilgili bize ışık tutmaktadır. Evliya Çelebi, Latifi gibi Osmanlı'yı anlatan yerli seyyahlar, değerli eserler vermişse de bunların sayısı azdır. Bu alanla ilgili seyahatnamelerin çoğu Avrupalı seyyahlar tarafından kaleme alınmıştır. Bu çalışmada, Hans Schiltberger, Pero Tafur, Caterino Zeno, Gabriel de Luetz, Baron d'Aramon, Ootgeer Giselijn van Busbeke, Hans Dernschwam, Stephan Gerlach, Crailsheimli Adam Werner, Jean Thevenot, Lady Mary Wortley Montagu, Christoph Wilhelm Lüdeke, Antonie Olivier, George William Frederick Howard ve Edmondo De Amicis adlı seyyahların hayatları ve seyahatnameleri hakkında bilgiler verilmektedir. Ayrıca, bu kişilerin Osmanlı Devleti'nin adaleti ve uyguladığı İslâm Hukuk sistemi hakkındaki gözlemleri sunulmaktadır."
