abstract: "Hz. Peygamber'in vefatından sonra Müslümanlar, başta imâmet meselesi olmak üzere pek çok konuda ayrılığa düşmüşlerdir. İlk üç halife dönemini kapsayan bu ihtilâfların en fazla yaşandığı dönem şüphesiz Hz. Ali'nin hilâfeti dönemi olmuştur. Hz. Osman'ın şehit edilmesiyle başlayıp Cemel ve Sıffîn savaşları ile ilerleyen bu süreçte imâmet-siyaset temelinde yaşanan bu ihtilâflar, Hz. Ali döneminde sahabe kanının dökülmesine varacak kadar ileri bir noktaya ulaşmıştır. Bu çalışmada, İslam Mezhepleri Tarihi'ne önemli derecede etki eden bu dönemin daha yakından, bir Mezhepler Tarihi müellifinin gözünden incelenmesi hedeflenmektedir. Endülüs medeniyeti içerisinde yetişmiş ve birçok ilim dalında yetkin bir kaleme sahip olan İbn Hazm'ın bu dönem hakkındaki tespitleri oldukça dikkat çekicidir. İbn Hazm, el-Fasl fi'l-milel ve'l-ehvâʾ ve'n-nihal adlı eserinde, Hz. Ali döneminde meydana gelen hadiselerin, yalnızca dini anlamda değil, sosyokültürel ve siyasi anlamda da insanları birbirinden ayıran olaylar olduğunu belirtir. Hz. Ali'nin imâmet iddiasında haklı olduğunu gerekçeleriyle açıklamakla birlikte, ona karşı savaşan Hâricîler hakkında da derin tahliller yapmıştır. İlk defa siyasi bir hadiseyi nas ile dini bir kisveye büründüren bu grubun nasıl bir zihniyete, hangi tavır ve davranışlara sahip olduklarını ayrıntılı olarak anlatmıştır. Cemel Savaşı'na iştirak edenlerin durumlarını değerlendirirken ise onların Sıffîn'de Hz. Ali'ye karşı savaşmayı haklı gören kimselerden farklı olduklarını belirtmiş; Muâviye'nin Hz. Ali ile savaşma nedenini açıklayarak onun hata yapan ve hatasından dolayı bir sevap alan müçtehit konumunda olduğunu ifade etmiştir."
