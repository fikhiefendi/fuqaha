abstract: "Artan küresel çevre krizleri, enerji güvencesizliği ve iklim dirençliliği gereklilikleri, döngüsel ekonomik modellere ve yenilenebilir enerji sistemlerine geçişin aciliyetini hızlandırmıştır. Bu tez, finansal sistemin bu tür dönüşümleri mümkün kılmadaki bütünleyici rolünü incelemekte ve özellikle Türkiye'nin gelişen sürdürülebilirlik stratejilerine odaklanmaktadır. Yeşil finansmanı yalnızca bir finansman aracı olarak değil, aynı zamanda sürdürülebilir kalkınmanın sistemik bir itici gücü olarak konumlandıran çalışma, finansal yeniliğin ekolojik ve sosyo-ekonomik dönüşümle kesişimini analiz etmektedir. PRISMA 2020 yönergelerine göre seçilmiş 45 hakemli çalışmanın sistematik literatür taraması yoluyla, döngüsel ekonomi girişimlerinin uygulanabilirliğini şekillendiren kurumsal, finansal ve sektörel faktörler belirlenmiştir. Finansal sürdürülebilirlik, yeşil tahviller, sürdürülebilirliğe endeksli krediler ve İslami finans modelleri gibi yenilikçi araçlar tutarlı politika çerçeveleri ve sektörler arası eşgüdümle uyum içinde kullanıldığında en yüksek seviyeye ulaşmaktadır. Yenilenebilir enerji ve biyoekonomi sektörleri, özellikle güçlü yönetişim ve harmanlanmış finansman ekosistemlerine sahip bölgelerde, döngüsel ilkelerle yüksek uyum göstermektedir. Araştırma, sürdürülebilir dönüşümlerin etkili olabilmesi için kamusal katılım ve toplumsal farkındalığın kritik önemini vurgulamaktadır. Geniş çaplı toplumsal katılım olmadan, finansal ve politik önlemler dönüştürücü etki yaratmada yetersiz kalabilir. Sonuç olarak, tez; Türkiye ve küresel toplum düşük karbonlu, dirençli bir geleceğe yönelirken, uyarlanabilir finans, etkin yönetişim ve katılımcı çerçeveleri bir araya getiren çok boyutlu bir sürdürülebilirlik yaklaşımını savunmaktadır."
