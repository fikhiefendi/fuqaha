abstract: "Bu çalışmada İslam Hukuku ve Türk Medeni Hukuku'nda eşlerin aile içi rollerini incelemek amaçlanmıştır. Aile kurumu tarih boyunca varlığının korunması ve toplumun sürekliliğinin sağlanması noktasında önemini korumuştur. Aile kurumunun korunması sadece şifahi olarak değil hukuk kurallarıyla da sağlanmaya çalışılmıştır. İslam dini ilk vahyin geldiği cahiliye toplumunda mevcut olan birçok sistemi değiştirdiği gibi aile kurumunda da gerekli düzenlemeleri sağlamıştır. İslam hukukunda aile hukuku İbâdât ve Muamelat kısımlarında yer almaktadır. İslam Aile Hukuku'nda evlilikle ilgili olarak nişanlılık döneminden itibaren evlilik süresince ve boşanma dahil olmak üzere bütün konulara dair hükümler belirlenmiştir. Bu durumda İslam hukukunda bireylerin haklarının sadece alışveriş gibi konularda değil sosyal bir yapı olan aile kurumunda da korunduğunu görmek mümkündür. Türkiye'de 22 Kasım 2001'de kabul edilen ve 1 Ocak 2002'de yürürlüğe giren 4721 sayılı Türk Medeni Hukuku'nda belirtilen hukuki normlar uygulanmaktadır. Bu iki hukuk sisteminin benzer ve farklı hususları mevcut olmakla birlikte Müslümanlar için pratikte bazı zorlukları da beraberinde getirmektedir. Bu zorlukların temelinde Türk Medeni Hukuku'nun eşitlik ilkesi çerçevesinde yapılan değişiklikleri etkilidir. Nitekim İslam Hukuku'nda eşitlik ilkesinin aksine adaletçi ve hakkaniyetçi bir yaklaşım mevcuttur. Bu çalışma aile kurumunun sağlıklı bir şekilde işleyişi için mevcut iki hukuk sisteminde yer alan ve eş rolünden kaynaklanan hak ve sorumlulukları birbirinden ayırt etme ve pratikte uygulama adına önemlidir."
