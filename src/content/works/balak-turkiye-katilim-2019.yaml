abstract: "Bankacılık, çok eski bir geçmişe sahiptir. Ortaya çıkışındaki koşullar, koruma, saklama, tahsil etme, ticaret, arttırma ihtiyaçlarına bağlı olarak oluşmuştur. Ortaya çıkışındaki MÖ 3500 yılları kesin ve yeterli bir sistem üzerine alınmamış olması, kompleks bir banka sisteminin var olmayışından kaynaklansa bile bankacılığın temelinde yatan prensipler bu dönemde katlanarak gelişime uğramıştır. Katılım Bankacılığı, kısa dönemli bir tarihe sahip, İslami düsturları kendisine temel alan finans sistemidir. Ülkemiz içerisindeki kabul ediliş ve hızlı bir pansuman yaparak eksiklikleri gidermiş olması, tüm dünya ekonomisi açısından da temsili sayılacak bir durumdur. Bütün bunlar göz önünde bulundurularak, bankacılık sistemi, katılım veya faizsiz bankacılığın gelişimi, tarihi ve sistemleri açıklanmış, Türkiye koşullarındaki büyüme oranları bankaların nezdinde açıklanmıştır."
