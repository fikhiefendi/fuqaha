abstract: "Nafaka, temelini sosyal yardımlaşma ve dayanışmanın oluşturduğu bir kavramdır. Kişinin bakmakla yükümlü olduğu fertlere karşı yaptığı infaktır. Böyle bir infak nafaka ile mükellef olan şahıs ile nafaka alacaklısının arasındaki dayanışma ve yardımlaşma bağını kuvvetlendirir. Sosyal bir olgu olan yardımlaşma ve dayanışma nafaka kavramı ile hukuki bir kimliğe bürünür ve hukuki bir yaptırım haline dönüşür.Araştırmanın konusu eşin nafakasını düşüren hallerdir. Çalışmanın temelini klasik fıkıh eserlerinde yer alan ictihadlar oluşturduğu için araştırma ile ilgili bilgi toplamaya bu kaynaklardan başlanmış, daha sonra konu ile ilgili günümüzde yapılmış çağdaş araştırmalar incelenmiştir. Elde edilen bu bilgiler yeniden tasnif edilerek değerlendirilmiş ve konu ile ilgili ilkeler tespit edilip isabetli görüşlere ulaşılmaya çalışılmıştır. Bazı hususlarda Medeni Kanundan da istifade edilmiştir.Araştırmanın amacı eşin nafakasının Hanefi, Şafii, Maliki ve Hanbelî mezheplerine göre hangi durumlarda sakıt olacağı(düşeceği) ile ilgili hükümleri tespit etmektir. Ayrıca ihtilaf olan yahut farklılık arz eden hususlarda diğer mezheplerin görüşlerine de yer verilerek eşin nafakasının sakıt olma durumu farklı açılardan da incelenip bu hususlarda tercih edilen görüşler beyan edilmiştir.Araştırmanın sonucunda, kadının evlilik birliğinin yükümlülüklerini yerine getirdiği sürece nafaka hakkının devam edeceği, bu yükümlülükleri kasten yerine getirmemesi veya itaatsizliği durumunda nafakasının sakıt olacağı tespit edilmiştir."
