abstract: "İşârî tefsirler, şer'i açıdan kabulü ve Kur'ân'ın manasını gerçekten aktarması bakımından tarih boyunca din bilginleri tarafından tartışılagelmiştir. Yine bu tefsir metodu mutasavvıfların keşif ve ilhamına dayalı olması ve nesnel bir şekilde ortaya koyulamaması yönünden eleştirilere maruz kalmıştır. Belirli şartları barındırması durumunda işârî tefsirin kabul edilebileceği görüşü vasat bir görüş olarak karşımıza çıkmaktadır. İşârî tefsirlerde tahareti incelediğimiz bu çalışmada, taharetle ilgili ayetlere ne tür yorumlar getirildiğini ortaya koyduk. Araştırmamızda kullandığımız temel metot tarama metodudur. İslam'ın temizliğe verdiği önemi, işârî tefsirlerin taharete yaptığı vurguda da bulmak mümkündür. İslam'da abdest, gusül, teyemmüm, zekât gibi kavramlar da temizliğin ne kadar değerli olduğunu göstermektedir. İşârî tefsirlerde taharete yapılan işârî yorumları tek tek ele alıp değerlendirdiğimiz bu çalışmada, birbirinden çok farklı ve birbirinden daha zengin manaların verildiğini gösterdik. Yapılan bu açıklamaları tabi tuttuğumuz değerlendirmelerin sonucu, büyük bir kısmının dinin özüne aykırı olmadığı, mananın zahirini görmezden gelmediği ve kabul edilebilir olduğudur. Bununla birlikte bunun aksi niteliğinde bir takım işârî yorumların varlığını da gözler önüne serdik."
