abstract: "Son dönemde gerek dünyada ve gerekse de ülkemizde hızlı bir şekilde büyüyerek önemli bir bankacılık alanı olarak kendine yer edinen katılım bankacılığında, geleneksel bankacılıktan farklı bazı ilke ve kurallar bulunmaktadır. Bu durum katılım bankacılığında kullanılan ürünlerin farklılaşmasına ve kaynak çeşitliliğinin geleneksel bankalara göre sınırlı olmasına yol açmaktadır. Bu çalışmada katılım bankacılığındaki İslami kural ve sınırların, katılım bankacılığı sektörünün kaynak yapısı ve maruz kaldığı likidite riski üzerindeki etkilerinin neler olduğu ortaya konulmaya çalışılmıştır. Bu kapsamda, öncelikle katılım bankacılığında kullanılan fon toplama ve kullandırma yöntemleri açıklanmış, katılım bankacılığındaki likidite riski yönetimi usul ve esasları ortaya konmuştur. Ayrıca, katılım bankacılığı ve mevduat bankacılığı sektör bilançoları, bilanço yapıları ve vade yapıları itibarıyla karşılaştırılarak farklılıklar değerlendirilmiştir. Son olarak Türk katılım bankacılığı sektörünün likidite durumu İran, Malezya ve Sudan'la karşılaştırılmıştır. Mevduat bankalarının ve katılım bankalarının bilanço yapılarının karşılaştırılması sonucunda; bilanço yapıları arasında önemli bir farklılık bulunmadığı, bununla birlikte para piyasası işlemleri, menkul kıymet ödünç piyasası işlemleri, ters repo işlemleri ve TCMB'ye borçlar gibi bazı ürünlerin mevduat bankalarınca sınırlı seviyede kullanılmaktayken katılım bankalarınca kullanılmadığı, bunun yanı sıra menkul kıymetler portföyünün ve repo işlemlerinden sağlanan fonlar kaleminin bilanço içindeki ağırlıklarının katılım bankalarında mevduat bankalarına kıyasla belirgin bir şekilde düşük olduğu gözlemlenmiştir. Yapılan likidite GAP analizi neticesinde ise katılım bankalarının mevduat bankalarından bir aya kadar vade diliminde olumsuz, diğer vade dilimlerinde olumlu ayrıştığı görülmüştür. Son olarak, Türk katılım bankacılığı sektörünün likidite düzeyinin, dünya İslami bankacılık sektörü ortalamasına kıyasla oldukça yüksek seviyede olduğu anlaşılmıştır."
