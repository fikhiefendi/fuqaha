abstract: "Türkiye'de katılım bankacılığı devlet destekli üç katılım bankasının açılmasıyla birlikte yeni bir ivme kazanmıştır. Özellikle faiz hassasiyeti olan kişi ve işletmelere hitap eden katılım bankaları, yurtdışından Türkiye'ye gelen ve aynı dini hassasiyetlere sahip kişiler tarafından da tercih edildiği gözlenmektedir. Türkiye, son yıllarda özellikle Orta Doğu'da yaşanan Arap baharı ve Suriye'deki iç karışıklıkların yanında, eğitim, sağlık, yatırım vb. nedenlerle de Arap ülkeleri kökenli kişilerin yoğun göçünü almaktadır. Bu araştırmada Arap ülkeleri kökenli müşterilerin Türkiye'de katılım bankalarını tercih etme nedenlerinin incelenmesi amaçlanmıştır. Amaç doğrultusunda araştırmacı tarafından hazırlanan kişisel bilgi formu ve Apil (2009) tarafından geçerlik ve güvenirlik çalışması yapılmış olan“Katılım Banklarının Tercih Sebepleri Ölçeği”, Marmara Bölgesi'ndeki katılım bankalarından hizmet alan Arap ülkeleri kökenli 396 kişiye çevrimiçi anket şeklinde uygulanmıştır. Elde edilen veriler bilgisayar ortamında SPSS 22.0 programı aracılığıyla analiz edilmiştir. Araştırma sonucunda; Arap kökenli kişilerin Türkiye'deki katılım bankalarını tercih etmelerinin en önemli nedeninin“dini/ çevresel motivasyon”olduğu, bunu sırasıyla“hizmet/ürün kalitesi”,“imaj ve güven”, son olarak ise“personel kalitesi”takip etmiştir. Araştırmada katılımcıların tanımlayıcı özelliklerine göre katılım bankası tercih sebeplerinin aylık gelir düzeyi, aslen nereli oldukları, müşteri türüne (bireysel, şirket ve bireysel), hizmet alınan bankanın bulunduğu il'e, katılım bankaları ile birlikte geleneksel bankalarla da çalışma durumuna göre farklılık göstermediği belirlenmiştir. Katılımcıların, yaşlarına, medeni durumlarına, cinsiyetlerine, eğitim durumlarına, birden fazla ülkenin vatandaşı olma durumuna, Türkiye'de bulunma şekillerine, katılım bankaları ile çalışma geçmişlerine, kaç ayrı katılım bankası ile çalışılma durumuna ve katılım bankasının kendi dillerinde hizmet vermelerine verdikleri öneme göre katılım bankası tercih sebeplerinde farklılaşmaların olduğu saptanmıştır. Sonuç olarak katılımcıların katılım bankası tercih etmelerindeki en önemli sebebin dini hassasiyetler, dini çevresel motivasyonun olduğunu göstermektedir. Eğitim düzeyi yükseldikçe katılım bankası tercihinde personel kalitesi ve dini çevresel motivasyonun etkisinin azaldığı sonucuna ulaşılmıştır. Katılım bankalarının banka politikalarını, bu müşterilerin çalışmada bahsi geçen ihtiyaçları ve arzularına yönelik şekillendirmesinde bu çalışmanın yol gösterici nitelikte olması hedeflenmiştir. Ayrıca ilgili literatüre katkı sağlayacağı öngörülmüştür."
