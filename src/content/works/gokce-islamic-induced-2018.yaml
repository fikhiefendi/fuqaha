abstract: "Bu tez, İslam Hukuku kapsamında kürtajı kökeni ve sonuçları açısından incelemeyi amaçlamaktadır. Bu bağlamda, bu tez, klasik ve modern İslam hukukçularının kürtaj hakkındaki görüşlerinde bir farklılık olup olmadığını araştırmakta ve kürtajın kadının mı yoksa çocuğun mu yaşam hakkı olduğunu incelemektedir. Bu konular üç ana başlık altında ele alınmaktadır. İlk bölümde, İslam hukukuna ilişkin kural ve düzenlemelerde bir değişikliğe duyulan ihtiyaç değerlendirilmekte ve Müslüman hukukçuların kürtaj alanına yönelik temel tutumlarının bir açıklaması sunulmaktadır. İkinci bölümde, İslam hukukunun temel kaynakları olan Kur'an ve Sünnet'te kürtajın nasıl ele alındığı incelenmiştir. Daha sonra konu, klasik ve çağdaş İslam alimlerinin fikirleri çerçevesinde tartışılmıştır. Ayrıca, zina ve tecavüzle sonuçlanabilecek gebeliklerde ceninin kürtajla alınabileceğine dair İslam yargısının görüşleri tartışılmaktadır. Son bölümde ise bedenin özerkliği ve kürtaj tercihine ilişkin söylemsel çatışma değerlendirilmektedir. Ayrıca bu bölümde Müslüman ülkelerin kürtaja nasıl baktıkları ve nasıl uyguladıkları hakkında bilgi verilmekte ve kuruluşların kararlarından bahsedilmektedir. Bu araştırmanın bir sonucu olarak, ceninin haksız yere öldürülmesini yasaklayan ayetlere dayanarak erkek üreme hücrelerinin dişi üreme hücreleriyle birleştiği andan itibaren gebeliğe müdahalenin caiz olmadığını söyleyebiliriz. Translated with DeepL.com (free version)"
