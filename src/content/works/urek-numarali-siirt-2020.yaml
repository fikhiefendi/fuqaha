abstract: "Bu tezin konusunu oluşturan 421 Numaralı Siirt Şer'iyye Sicil Defteri emsallerinde olduğu gibi, Osmanlı İmparatorluğu tarihinin sosyal, iktisadi, idari, hukuki ve kültürel yönlerini ortaya koyan önemli kaynaklardan birisidir. Defterin muhteviyatı (H.1311-1327/M.1893-1909) 16 yıllık sürede mahkemeye intikal etmiş birçok konuyu kapsamatadır. Enlenme-boşanma bunlara bağlı olarak mehir-talak, hüccet, i'lam, tevkil vekâleti, vakıf mallarının korunması ve merkezden gelen emirnameler gibi zengin bir içeriğe sahiptir. Çalışmamızın değerlendirme kısmı dört bölümden oluşmaktadır. Birinci bölümde, idari durum; defterde geçen mahalleler, köyler, nahiyeler ve vilayetler üzerinde durularak açıklanmıştır. İkinci bölümde, sosyal durum; Siirt'e olan önemli kişiler ve görevleri ile vakıflar üzerinde durulmuştur. Üçüncü bölümde, sosyal hayat; aşiretler ve Siirt'in kozmopolit yapısı üzerinde durulmuştur. Dördüncü bölümde ise Şer'iyye Sicilimizdeki vekâletler sınıflandırılarak değerlendirilmiştir. Siirt, kozmopolit yapısı ile Osmanlı'nın bir yansıması şeklindedir. Kürt, Türk ve Araplardan oluşan Müslümanlar ile Süryani, Keldani, Ermeni ve Rumlardan oluşan Gayrimüslimlerin farklı dil, din ve ırkların bir arada ve kardeşçe yaşadığı, bu ayrılıklarını kültürel zenginlik olarak kabul ettiği şehirlerden biridir. Şer'iyye Sicillerinin tüm bu zengin içeriğiyle sadece tarih için değil aynı zamanda coğrafya, iktisat, sosyoloji, hukuk ve askeri konuları için de birinci elden kaynaktır."
