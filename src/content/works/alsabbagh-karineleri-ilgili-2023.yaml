abstract: "Hakikat; adaletin inceleme ve delillendirme suretiyle ulaştığımız yitik yanıdır. İslam hukuku; üzerinde anlaşmazlık bulunan olaylara dair çeşitli emare ve delillerden hareketle çıkarımda bulunulmuş bazı araçları, hükümleri yoluyla irdelemiştir. Bu araçlar, karineler ismiyle bilinmekte olup karineler bir şeye, o şeyde kullanılmaksızın delalet eder. Bir diğer ifadeyle karineler, bilinenden hareketle bilinmeyen hakkında çıkarımda bulunulmasını sağlayan delillerdir. İslam hukukçuları nezdinde karine; ortaya çıkarılması istenen duruma eşlik eden, o durumla beraber bulunan emarelerden hareketle çıkarımda bulunmak suretiyle kişiyi bilinmeyene ulaştıran emare anlamına gelmektedir. Bu emarenin var olmaması durumunda sözü edilen bilinmeyene ulaşılması da mümkün değildir. Hz. Yusuf (as) kıssası ile ilgili“Eğer (adamın) gömleği önden yırtılmışsa kadın doğru söylemiştir, adam yalancıdır.”ayet-i kerimesinde yer alan karine buna örnek olarak verilebilir. Bir diğer örnek de Hz. Peygamber'in (sa) şu sözünde görülmektedir:“Çocuk yatak sahibinindir. Zina edene ise mahrumiyet vardır.”Çeşitli hadiselerde var olup sahabilerin İslam hukukuna dair hükümlerin çıkarımında istinat ettikleri daha başka karinelerin de örnek olarak sunulması mümkündür. Buradan hareketle suç mahallinden alınan kan ve saç teli gibi örnekler üzerinde yapılan DNA profillemesi (kimliklendirmesi) veya laboratuvar analizleri, ses veya görüntü kayıtlarının kullanılması gibi çağdaş araçlara istinat edilmesinin mümkün olduğu söylenebilir. Ayrıca çeşitli suçların ortaya çıkarılmasında polis köpeklerinin kullanılması da imkân dâhilindedir. Zira bu yöntem de suça işaret eden veya suç hadisesine eşlik eden karinelerden sayılmaktadır. Eski ve yeni tüm karineler, kanıtlamanın hakikate ulaştıran, adaleti sağlayan asli araçlarından gaye ve anlam bakımından farklı değildir. Herhangi bir çelişki içermeyen karinelerin görmezden gelinmesi, hukukun zayi edilmesi ve ortadan kalkması anlamına gelmektedir. İslam Hukuk Konseyi tarafından alınan kararlar bu yöndedir."
