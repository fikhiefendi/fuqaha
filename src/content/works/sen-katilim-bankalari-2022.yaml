abstract: "Çalışmanın amacı Türkiye'de faaliyet gösteren katılım bankacılığı kar payları ile ticari bankalar mevduat faiz oranlarının birbiriyle olan ilişkisinin incelenmesidir. Katılım bankacılığının tarihi Türkiye'de 1983 yılından itibaren başlamaktadır. O yüzden katılım bankaları, ticari bankaların aksine hâlen yeni sayılabilecek bir bankacılık türü olarak değerlendirilebilir. Katılım bankacılığının Türkiye'deki tarihi serüveni incelendiğinde sürekli gelişmekte olan bir bankacılık sistemi olduğu görülecektir. Bu gelişim doğrultusunda akademik anlamda da katılım bankacılığının birçok yönüne dair çeşitli çalışmalar yapılmıştır. Bu çalışma ise katılım bankacılığı kar-zarar ortaklığı sistemi içerisinde yer alan kar paylarına yöneliktir. Kar payları ile mevduat faizlerinin ilişkisine odaklanılmıştır. 1999-2019 yılları arasındaki mevduat faizlerinin yıllık ağırlıklı ortalamalarıyla kar paylarının yıllık ağırlıklı ortalamalarının kullanıldığı çalışmada veriler ARDL Sınır Testi ile incelenmiştir. Çalışmada ARDL Sınır Testi kullanılarak iki farklı data seti kurulmuştur. İlk kurulan data setinde kar payları bağımlı değişken iken mevduat faizleri bağımsız değişken olarak ele alınmıştır. Kurulan model sonucunun daha kapsamlı ve daha doğru analiz edilebilmesi için mevduat faizlerinin bağımlı değişken, kar paylarının ise bağımsız değişken olduğu ikinci bir data seti kurulmuştur. Çalışma sonucunda mevduat faizlerinden kar paylarına doğru anlamlı ve pozitif bir etkinin olduğu saptanmıştır. Buna karşın kar paylarından mevduat faizlerine doğru anlamlı bir etki olmadığı gözlenmiştir. Diğer bir deyişle kar payları mevduat faizlerinden etkilenirken; mevduat faizleri kar paylarından etkilenmemektedir. Çalışma sonucunun sebepleri literatür yardımıyla incelenmiştir. Buna göre katılım bankalarının Türk Bankacılık Sektörü içerisindeki payının hayli düşük olması ve katılım bankacılığı sistemi içerisinde murabaha yönteminin yüksek bir payının olması kar paylarının mevduat faizlerinden etkilenmesi sonucunu doğurmalıdır."
