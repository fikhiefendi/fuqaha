abstract: "Bu çalışma, sahâbe uygulamasının Hanefî usûl düşüncesindeki yeri ve işlevini, Ebû Bekir el-Cessâs'ın el-Fusûl fi'l-Usûl adlı fıkıh usulü eseri üzerinden incelemeyi amaçlamaktadır. Çalışmada, sahâbe uygulamasının yalnızca fer'î bir delil olarak değil, usûl teşekkülüne katkı sunan kurucu bir unsur olarak ne ölçüde başvurulduğu araştırılmıştır. Bu bağlamda, sahâbe uygulamasının Cessâs'ın usûl sistematiğinde nasıl kullanıldığı, hangi delil türlerinde ve hangi usûl ilkelerinde ona dayanak teşkil ettiği tespit edilmeye çalışılmıştır. Tezin ilk bölümünde, sahâbenin İslâm hukukundaki epistemolojik konumu ve Hanefî usûlünde şekillenen sahâbe algısı ele alınmıştır. Bu çerçevede öncelikle Cessâs'ın sahâbe anlayışı bağlamında sahâbe uygulamasına yüklediği anlam analiz edilmiştir. Ayrıca, sahâbe uygulamasının kavramsal sınırları,“sahâbe kavli”,“sahâbe icmâı”ve“Medine ehlinin ameli”gibi benzer kavramlarla olan ilişkileri üzerinden detaylandırılmış; böylece sahâbe uygulamasına dair kapsamlı bir teorik çerçeve sunulması amaçlanmıştır. İkinci bölümde ise, bu teorik çerçeve temelinde, sahâbe uygulamasına Cessâs'ın el-Fusûl adlı eserinde hangi bağlamlarda başvurulduğu ve bunlara hangi usulî kaidelerinin bina edildiği incelenmiştir Cessâs'ın eserinde takip ettiği usûl tertibi esas alınarak, umum–hâss, beyan, emir–nehiy, nesih, haber, icmâ, içtihad ve kıyas gibi temel usûl başlıkları altında sahâbe uygulaması ile yapılan temellendirmeler tespit edilmiş; bu temellendirilmelerin ilgili ilke bağlamında nasıl anlamlandırıldığı metin içi analiz yöntemiyle ortaya konmuştur."
