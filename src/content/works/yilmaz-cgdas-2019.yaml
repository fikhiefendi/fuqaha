abstract: "Tarihi süreç içerisinde sosyal değişim olgusu kaçınılmaz bir durumdur. Bu açıdan bakıldığında hukukla sosyal değişim arasında yakın bir bağın olduğu inkâr edilemez bir gerçektir. Bu bağlamda İslam hukuku açısından büyük bir öneme sahip olan hak ve adalet gibi kavramların yer aldığı bir toplumun tesisi için bunlara hizmet edecek olumlu sosyal gelişmeler her zaman kabul görmüştür. Bunun sebebi İslam hukukuna kaynaklık eden İslam dinidir. Çünkü İslam insan ve toplum faydasına olan hertürlü faaliyeti teşvik etmiş, kendi müntesiplerini de bu hedeflere yönlendirmiştir. Ayrıca evrensel olan İslam dini değişmekte olan dünyanın dinamik oluşuna ayak uydurarak dinamik olmakta, buna bağlı olarak da İslam hukukununda dinamik olmasını gerektirmektedir. Bu çerçeveden hareketle kötü niyetli olmamak şartıyla ve İslam'ın temel prensipleriyle çelişmeyen, hukuka hizmeti hedef edinen, İnsanların hak ve hukuklarını koruyan gelişmeler İslam dinince de kabul görmüştür. Toplumun olduğu heryerde bu toplumun bireylerini idare edecek hukuk kuralları da var olagelmiştir. Bu hukuk kurallarını incelediğimizde bu kuralların dayandıkları iki orijin karşımıza çıkmaktadır. Bunlardan birisinin İlahi iradenin esas alındığı vahiy destekli hukuk, diğerinin ise sadece insanların akılları ve derin tecrübeleri sonucunda şekillendirdikleri hukuk olduğunu görmekteyiz. Her iki şekliyle de hukuk, toplum düzenini bozmaya çalışan kişi ya da kişilere karşı fert ve kamu vicdanını rahatlatmak, toplumda fertlere gerekli güvenliğin sağlanması amacıyla ortaya konulmuş olan kurallar olduğu görülür. Bu çalışmamızda günümüz Çağdaş Türk hukukundaki ispat vasıtalarını İslam hukuku açısından bir değerlendirmeğe tabi tuttuk. Bu bağlamda insanların haklarını ortaya çıkartacak delilleri, İslam'ın ana naslarıyla çelişmediği sürece İslam hukukunca da kullanılabilirliğini İslam nasları çerçevesinde ortaya koymaya çalıştık. Örneğin adli tıp, tüm dünyada olduğu gibi ülkemizde de en hızlı gelişimi göstermiş, bireysel ve toplumsal yarar sağlayan bir vasıta haline dönüşmüştür. Ayrıca tıp ve teknoloji alanlarındaki gelişmelere bağlı olarak birçok hukuki davalarda kan, saç, parmak ve koku izi gibi biyolojik deliller ile ses kaydı, fotoğraf ve kamera kaydı gibi teknik deliller günümüz hukukunda delil olma açısından oldukça işlevsel hale gelmişlerdir. Günümüz Çağdaş Türk hukuku da bu gelişmeleri göz ardı etmemiş, bilim ve tekniğin gelişimiyle hukuka yardımcı olacak şeyleri hukuki davalarda hakların tespiti için bir vasıta olarak kullanmıştır. Biz de bu vasıtaları İslam hukuku açısından değerlendirip çalışmamızda ortaya koymaya çalıştık. Günümüz Çağdaş Türk hukukunda kullanılan bu tür ispat araçlarının İslam hukukunda da kullanılabilirliğini değerlendirmeği hedefledik."
