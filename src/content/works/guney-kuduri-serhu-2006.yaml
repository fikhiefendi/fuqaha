abstract: "KUDÛRÃ'NİN ?ŞERHU MUHTASARİ'L-KERHÃ? ADLI ESERİNİN `SİYER'BÖLÜMÜNÜN EDİSYON KRİTİĞİNecmeddin GÜNEYDöneminde Hanefû mezhebinin Irak'taki en önemli temsilcisi olan Ebu'l-Hasenel-Kerhû'nin (260-340/874-952) `el-Muhtasar' adlı eseri, Hanefû mezhebinde ilk muhtasarfıkıh kitaplarındandır. Üzerine çok sayıda şerh yazılan bu eser, günümüze ulaşamamış ancakHanefû fakûhi Ebu'l-Huseyn el-KudÃ»rû'nin (362-428/973-1037) `Şerhu Muhtasari'l-Kerhû' adlıoldukça kapsamlı şerhi ulaşmıştır. Yazma halindeki bu şerh, ilk dönem Hanefû literatürününaksine, oldukça müdellel olmasıyla dikkat çekmekte; günümüze ulaşamamış veya ancakkısmen ulaşabilmiş birçok ilk dönem kaynağından alıntılar içermektedir.Bu tez çalışmasında, eserin en uzun bölümlerinden biri olan ve iç bütünlüğe sahipmüstakil bir `kitâb' niteliğine sahip olan `Kitâbu's-Siyer'in tenkitli neşrini ortaya koyduk.Araştırmanın İkinci Bölüm'ünde, Kerhû'nin günümüze ulaşamamış olan el-Muhtasar'ıüzerine yapılan çalışmalar ve özellikle KudÃ»rû'nin `Şerhu Muhtasari'l-Kerhû'si tanıtılmayaçalışılmış; tahkik ettiğimiz bölümle irtibatı sebebiyle siyer konusundaki fıkıh edebiyatına birgiriş yapılmış; Şerhu Muhtasari'l-Kerhû'nin eldeki yazma nüshaları tek tek tavsif edilerek,`siyer' bölümünün tahkikinde takip edilen yöntem ortaya konmuştur.Tahkik kısmında ise, eldeki üç nüshanın mukabelesi sonucu ortaya çıkan metin, uygunparagraf düzeni ve gerekli noktalama işaretleriyle birlikte, konulan tahkik kriterleriçerçevesinde gün yüzüne çıkarılmıştır."
