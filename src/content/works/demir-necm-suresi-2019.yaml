abstract: "Necm Suresi içerisinde secde ayeti barındırarak inzâl olan ilk suredir. Kerim Kitabımız'ın elli üçüncü suresidir. Mekkî sûrelerdendir. Bu sûre Efendimiz'in en önemli mûcizelerini anlatması bakımından önemlidir. Özellikle İsra hadisesini ve ondaki Efendimizin konumunu daha detaylı görmekteyiz. Necm Suresi Efendimiz'i her konuda desteklemiştir. Özellikle her söylediğinin vahiy olması Efendimiz'e ayrı bir değer ve konum ortaya çıkarmıştır. Âlusi ve İbn Âşur, ikisi de hem dirâyet hem de rivayet tefsirini birbirine mezc etmiş müfessirlerdir. Yaşadıkları coğrafya itibariyle şarkın ve garbın düşünce sistemini aktarmaya çalışmışlardır. Biz de hem klasik hem de modern anlamda düşünceleri göstermeye çalıştık. Surenin tefsirini yapmadan önce, giriş bölümünde tefsirin önemini ve ona olan ihtiyacı anlattıktan sonra neden Necm Suresini tercih ettiğimizi anlatmaya ve farklı kaynaklardan yararlanarak ayetlerden elde edeceğimiz çıkarımları açıklamaya çalıştık. Ulemanın genelde ittifak etmelerinin yanında yirmiye yakın ayette rivayetleri farklı yorumladıklarını gördük. Garanik hadisesinde Efendimiz her yönüyle desteklenmiş ve müşriklerin itham ve fitneleri boşa çıkarılmıştır. Şahsi sorumluluk ilkesi surede işlenmiş ve hiçbir kimsenin değil bir kimsenin yaptıklarından sorumlu olmadığı serdedilmiştir. Kur'an'ı Kerim'in nüzûlünün üzerinden asırlar geçse de ''Hala diri ve yeni nâzil olmuş gibi canlıdır.'' kuralı anlatılmaya çalışılmıştır. Âyetler karşılaştırılarak mukarren metod uygulanmaya çalışılmıştır. Çok fazla îrabî tahlillere girmeden yanlız manaya odaklandı. Çok fazla başlık kullanmadan ana konuya dikkat çekildi. Müfessirleri ve tefsirleri tanıtmama nedenimiz, daha çok ayetlerin çıkarımlarını açıklamaktır. Bu çalışmayı tefsir mev'zui tarzında düşünerek yaptık. Tefsirlerde genelde aradığımız hususları almaya çalıştık."
