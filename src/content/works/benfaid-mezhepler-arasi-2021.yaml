abstract: "Fakihler, Kur'an-ı Kerim ve sünnet naslarını anlamada farklılık göstermişlerdir. Bunun bir sonucu olarak da dört mezhebin de içinde olduğu farklı mezhepler ortaya çıkmıştır. Her belde halkı muamelelerinde bu mezheplerden birisinin görüşlerini esas almıştır. Ardından dini hükümlerin kanunlaştırma dönemi gelmiş ve hükümler kanun maddeleri halinde düzenlenmiştir. Bu kanunlaştırma başlıklarından birisi de şahsi haller kanunudur. Çalışmanın konusu; şahsi haller kanununda yer alan \"nikâh konusundaki beşeri kanunların mezheplerin görüşleri ile karşılaştırması olarak belirlenmiştir. Bunun için dört ülke belirlenmiş ve o ülkelerin mensup olduğu mezhepler esas alınmıştır. Libya şahsi haller kanunu, Mâliki mezhebi ile karşılaştırılmış, Mısır, şahsi haller kanunu, Hanefi mezhebi ile karşılaştırılmış, Katar şahsi haller kanunu, Hanbeli mezhebi ile karşılaştırılmıştır. Çalışma iki bölüme ayrılmış ve birinci bölümde; fıkhî ihtilaf kavramı, kanun ve bunların ortaya çıkışları ele alınmıştır. İkinci bölüm de ise konu ile alakalı fakihlerin ihtilaf ettikleri konular incelenmiş ve bunlar yukarıda bahsi geçen ülkelerin kanunları ile karşılaştırılmıştır. Çalışmada on konu ele alınmıştır. Her bir konuda önce üç mezhebin ihtilaf ettikleri noktalar ayrı ayrı belirtilmiş sonra ülkelerin konu hakkındaki kanun maddesi ayrı ayrı aktarılmış, son olarak da her ülkenin kanun maddesi ile mezhep görüşü karşılaştırılmıştır. Çalışma, ulaşılan sonuçların yer aldığı sonuç bölümü ile tamamlanmıştır. Bu sonçlar arasında en önemlisi şudur: İslam fıknının, şahsi haller kanununun nikâh bölümü üzerinde etkisi olduğu görülmüş ve her ülkenin ülkedeki yaygın mezhep anlayışından etkilendiği ancak bu etki maslahat bulunması durumunda diğer mezhep görüşlerini almaya en teşkil etmedigi görülmüştür."
