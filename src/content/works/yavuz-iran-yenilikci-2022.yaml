abstract: "Kaçar hanedanının son zamanları ile Pehlevîler dönemi, İran'da dini alanda yenilikçi düşüncenin kurulmaya başladığı zamanlardır. Bilhassa meşrutiyet dönemi sonrasında dînî sahada yenilikçi fikirler gündeme gelmeye başlamış, modernist düşünürlerin eleştirileri ulema sınıfını da etkilemiş, ilk defa Şerîat Sengelecî ve Ali Ekber Hakemîzâde gibi ulema sınıfına mensup olan ve Ahmed Kesrevî gibi bu gruba son derece yakınlığı bulunan isimler tarafından, Şîa'nın temel kabullerine, geleneklerine ve Şiî din adamlarına dikkat çekici eleştiriler getirilmiştir. Bu çalışmada, 20. Yüzyıla kadar İran'da Şiî düşüncenin kısa bir seyri verildikten sonra bahsi geçen isimlerin hayatları, eserleri, Şîa'ya yönelttikleri eleştiriler ve bu yolla yenilikçi dînî düşünce üzerinde nasıl bir etkiye sahip oldukları ele alınmıştır."
