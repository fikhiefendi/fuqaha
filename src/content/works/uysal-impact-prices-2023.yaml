abstract: "Çalışma, bir ekonominin petrol ticareti pozisyonu, petrol fiyatları, döviz kurundaki değer kaybı ile geleneksel ve İslami hisse senedi piyasasının performansı arasında bir bağlantı bulmaya çalışmaktadır. Çalışma bunu yapmak için yaygın olarak kullanılan iki ekonometrik model kullanmaktadır. Bunlardan biri kuantil bağlantılılık yaklaşımı, diğeri ise dalgacık tutarlılığıdır. Dalgacık tutarlılığı ikili korelasyonların daha derinlemesine anlaşılmasını sağladığından, cevaplarımızı burada buluyoruz. İthalatçı ve ihracatçı ülkelerin ikamesi olarak Rusya ve Türkiye seçilmiştir. Çünkü her ikisi de Doğu ve Batı arasında sıkışıp kaldıkları için uluslararası arenadaki konumları oldukça benzerdir. En önemlisi; her ikisi de son yıllarda yüksek döviz kuru değer kaybıyla karşı karşıya kalmıştır ve her ikisi de İslami endekslere sahiptir. Sonuçlar, beklenenden farklı olarak, ülkenin petrol ithal ettiği durumlarda petrol fiyatlarının hisse senedi piyasalarını etkilemediğini göstermektedir. Ancak ülke Rusya gibi petrol ihraç ediyorsa, petrol fiyatları döviz kuru ve hisse senedi piyasaları ile doğrudan korelasyona sahiptir. Döviz kurundaki değer kaybının her iki ülkenin hisse senedi piyasaları üzerinde yüksek korelasyon gösterdiği tespit edilmiştir. Değişkenler arasındaki bağlantıyı etkileyebilecek uluslararası politikalar ve ekonomik koşullar da dikkate alınmıştır. Bu çalışmanın sonuçları petrol ticareti, döviz kuru, geleneksel borsa ve İslami borsa arasındaki ilişkiyi daha iyi anlamamızı sağlamaktadır."
