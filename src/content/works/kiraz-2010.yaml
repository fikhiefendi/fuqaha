abstract: "Bu araştırmanın inceleme kısmı: İmȃm Ȃzam Ebȗ Hanȋfe ile Ebȗ Muhammed Abdullah b. Muhammed El-Hȃrisȋ'nin dönemi, şahsi ve ilmi hayatlarını, Ebȗ Hanȋfe ve Müsnedine yapılan eleştirileri ve El-Hȃrisȋ'nin Müsnedi'nde ele aldığı hadisleri içermektedir. Bu kitabın tahkik kısmı ise: Raflarda bulunan İslȃmî yazma eserlerden biri olan Müsned'den kolay bir şekilde yararlanabilmek için onun hadislerini tahrȋc ve hükümlerini belirlemeyi içermektedir. Yaptığım bu çalışma sonucunda ulaştığım sonuçlardan en önemlilerinin birkaçı şu şekilde özetlenebilir. •İmȃm Ebȗ Hanȋfe büyük bir imamdır. Fıkıh ilminde onun eşi ve benzeri yoktur. Ayrıca cerh ve ta'dȋl konusunda da çok büyük bir âlimdir. Ahkâm hadislerinde ve Hocası Şeyh Hammâd'dan rivayet ettiği hadislerde hȃfızdır. O, zamȃnının en büyük hadis ȃlimi olmamasına rağmen, hadis ilminde güvenilir bir ȃlimdir. •Bu Müsned'de Ebȗ Hanȋfe'den gelen hadislerin çoğu sahih hadislerdir. •Ebȗ Hanȋfe'nin rivayet ettiği zayıf hadisler, Ebȗ Hanȋfe'den dolayı değil kendisinden sonraki rȃvȋler sebebiyledir"
