abstract: "Bankacılık sektörü içerisinde oldukça önemli bir yer tutan katılım bankacılığı gün geçtikçe önemini arttırmakta ve rekabet açısından diğer bankaların karşısına önemli bir güç olarak çıkmaktadır. Bu nedenle, gelecek dönem en önemli müşteri potansiyeline sahip olan üniversite öğrencilerinin katılım bankacılığına ilişkin görüşlerini öğrenebilmek, katılım bankacılığı işleyiş süreçlerine göre bilgi düzeylerini öğrenebilmek tercih nedenlerini ortaya çıkartmak açısından önemli olacağı için hem katılım bankaları açısından hem de diğer bankaların rekabet stratejileri geliştirebilmesi açısından önem arz etmektedir. Araştırmada veri toplama aracı olarak anket kullanılmıştır. Anket toplamda 3 bölümden meydana gelmektedir. Anket formunda toplamda demografik sorular ile birlikte 31 ifade bulunmaktadır. Katılım bankaları faaliyetlerine yönelik faktörlerin belirlenmesinde Gökçen ve Gönen tarafından 2017 yılında geliştirilen ölçek ve katılım bankacılığı işleyiş süreciyle ilgili bilgi düzeyi faktörlerinin belirlenmesinde Gelir tarafından 2016 yılında geliştirilen ölçek kullanılmıştır. Araştırmada çalışma evrenini seçilen birer vakıf üniversitesi ve devlet üniversitesinde okuyan üniversite öğrencileri oluşturmaktadır. Örneklemin seçilmesinde kolayda örnekleme yönteminin kullanılması tercih edilmiştir. Anket formlarının geri dönüşünde gerekli incelemeler yapıldığında 275 kişinin yanıtlarının analize dahil edilmesine karar verilmiştir. Araştırma sorusu olarak belirlenen“Üniversite öğrencilerinin katılım bankacılığı üzerindeki görüşleri hangi yöndedir?”sorusuna cevap verilmeye çalışılmıştır. Analiz sonuçlarına göre üniversite öğrencilerinin bilgi düzeyleri ve görüşleri arasında pozitif yönlü zayıf bir ilişkinin varlığı tespit edilmiştir."
