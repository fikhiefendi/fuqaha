abstract: "Bu doktora tezi, İslami bankacılık müşterilerinin ve geleneksel bankacılık müşterilerinin tüketici etik algılarını Prospect Teorisi bağlamında karşılaştırmaktadır. Çalışmanın amacı, İslami bankacılık müşterilerinin ve geleneksel bankacılık müşterilerinin etik algılarındaki farklılıkları ortaya koymak ve bu farklılıkların tüketici davranışlarına olan etkilerini incelemektir. Tezin teorik çerçevesi, Prospect Teorisi ve Muncy-Vitell Tüketici Etik Modeli üzerine kurulmuştur. Araştırmada, İslami ve geleneksel bankacılık müşterilerinin etik algıları anket yöntemiyle toplanan verilerle analiz edilmiştir. Bulgular, İslami bankacılık müşterilerinin etik değerler konusunda daha duyarlı olduklarını ve risk algılarının etik davranışları üzerindeki etkisinin belirgin olduğunu göstermektedir. Ayrıca, çalışmada İslami bankacılık ilkelerinin (riba, gharar, helal) ve sosyal adalet vurgusunun tüketici davranışlarına olan katkıları ele alınmıştır. Sonuç olarak, İslami bankacılık müşterilerinin etik algıları ile geleneksel bankacılık müşterilerinin etik algıları arasında önemli farklılıklar bulunmaktadır. Bu farklılıklar, bankacılık hizmetlerinin pazarlanmasında ve yönetiminde dikkate alınması gereken önemli unsurlardır."
