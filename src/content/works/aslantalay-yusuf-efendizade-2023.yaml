abstract: "'İnâyetü'l-meliki'l-mün'im li-şerhi Sahihi Müslim, XVIII. yüzyıl Osmanlı alimlerinden Yusuf Efendizâde Abdullah Hilmi'nin Buhârî'ye yazdığı Necâhu'l-Kârî liSahîhi'l-Buhârî adlı şerhten sonra hayatının son dönemlerinde kaleme aldığı fakat tamamlamaya ömrünün yetmediği kıymetli bir eserdir. Müellif bu eserini, İmam Mâzerî'nin el-Mu'lim bi Fevâidi Müslim, Kâdî İyâz'ın İkmâlü'l-Muʿlim bi fevâʾid (fî şerhi Sahîh)i Müslim, İmam Nevevî'nin el-Minhâc fî şerhi Sahîhi Müslim b. el-Haccâc ve Kurtubî'nin el-Müfhim li mâ Eşkele min Telhîsi Kitâbi Müslim adlı eserleri başta olmak üzere hadis alanındaki temel kaynaklardan istifade ederek kaleme almıştır. Bu bakımdan eser ilmî mirasımızın aktarılmasına sağladığı katkı ve ilim dünyasına kazandıracağı faydalar bakımından tahkik edilmeye değer görülmüştür. Bu çalışmada eserin Kitâbü't-tahâre, Kitâbü'l-hayz ve Kitâbü's-salât kısımları tahkik edilerek, Yusuf Efendizâde'nin hayatı, ilmî kişiliği hakkında bilgi verilmiş ve şerhinde takip ettiği yöntem ortaya konmaya çalışılmıştır."
