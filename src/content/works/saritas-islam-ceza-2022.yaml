abstract: "Müslümanların Batı'ya karşı zayıf düştüğü, kapitalist sistemin ve Batılı“değerlerin”egemen kılınmaya çalışıldığı günümüzde İslâm dini ile ilgili birçok konu ve meseleler Batı'nın tenkitlerine maruz kalmıştır. Bu eleştirilere karşı cevap bulmaya çalışan bazı araştırmacılar, yerine göre gelenekte hiç problem teşkil etmemiş olan hükümleri, savunma psikolojisinin hâlet-i rûhiyesi ile farklı değerlendirmişler ve bu hükümlere, Batı'nın itirazlarına maruz kalmayacak bir şekilde bazen zorlama cevaplarda bulunmuşlardır. Bu tartışmalar arasında genelde ceza hukukuyla, özelde irtidad cezasıyla ilgili meseleler de nasibini almıştır. Biz de bu araştırmamızda geçmişte bir sıkıntı teşkil etmemiş, fakat günümüzde tartışmaya açılmış olan irtidadın cezasını had ve ta'zîr cezaları bağlamında incelemeye çalıştık. Bunun için evvelâ İslâm ceza hukukuna genel bir giriş yaptık ve had ve ta'zîr cezalarını tanıtmaya gayret ettik. Buna müteakiben nass bağlamında irtidadın cezasını tahlil ettikten sonra kadim fukahanın bu konu hakkındaki görüşlerini tespit etmeye çalıştık. Bilâhare muasır araştırmacılarından kimin, hangi görüşü, neye dayanarak benimsediğini, uygun düşündüğümüz bir tasnif çerçevesinde tetkik ettik ve bunun sonunda tezimizin genel değerlendirmesini de yaparak bu çalışmamızı bir neticeye bağlamaya çalıştık."
