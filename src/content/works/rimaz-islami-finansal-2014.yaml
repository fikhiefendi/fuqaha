abstract: "Günümüzde dünya ekonomisinin büyük bir yüzdesini faizli finansman araçları(Tahvil, Bono gibi) oluşturmaktadır. Bu araçların özellikle son yıllardaki krizlerden sonra çok da iyi çalışmadığı yatırımcılar tarafından tesbit edilmiştir. Son yıllarda İslami Finansman Araçlarına(Sukuk) olan ilgi günden güne artmaktadır. Bu araçlar sadece gerçek projelerde kullanılırken, geleneksel menkul kıymetler, ekonomiye katkı sağlamayan yapay işlemlerde de kullanılmaktadırlar. Tezde temel olarak Finansal Araçlar ve İslami Finansal Araçlar kavramı ayrıntılı olarak ele alınıp,TFRS 7, 9 çerçevesinde İslami Finansal Araçların nasıl muhasebeleştirilip ve raporlanacağını, uygulama örnekleriyle ayrıntılı şekilde anlatmaya çalışılacağız. Anahtar Sözcükler 1.Finansal Araçlar 2.İslami Finansal Araçlar(Sukuk) 3.SPE 4.Yükümlü 5.Sukuk Yatırımcıları 6.Mudaraba 7.Muşaraka 8.İcara 9.Selem 10.İstisna 11.Murabaha"
