abstract: "Kaynaklara bakıldığı takdirde irtidat meselesinin mahiyeti hakkında tartışmalar olduğu görülmektedir. Kimi âlimler naslardaki rivayetlerden dolayı mürtedin öldürülmesi gerektiğini savunurken kimi âlimler de düşünce özgürlüğüne aykırı görülmesi sebebiyle karşı çıkmıştır. Bu çalışmada öncelikle irtidadın ceza hukuku sahasına girmesi sebebiyle suç kavramı işlendi. Ardından irtidat kavramı incelenerek, cezasına dair delillerle beraber değerlendirildi. Klasik kaynaklarda irtidada verilen cezanın ne olduğu, o cezanın bugün nasıl anlaşıldığı işlendi. Sonrasında ise düşünce özgürlüğü bağlamında ele alınıp alınamayacağı meselesi tartışıldı. Bu bağlamda da düşünce ve inanç özgürlüğü açısından ayrı ayrı irtidat meselesi ele alındı. Öncelikle irtidada verilen cezanın düşünce özgürlüğü bağlamında değerlendirilmesi yapıldı ardından da İslam'da düşünce özgürlüğü olup olmadığı irdelendi. Bu mesele de önemine binaen İslam Hukuk doktrininde başlığı altında düşünce ve inanç özgürlüğü ayrı ayrı işlendi. Bu meseleler tartışılırken, bu minvalde kaleme alınmış Arapça eserler, makaleler, tercüme eserler kaynak olarak kullanıldı. Genel hatlarıyla verilen tüm kaynakçalar incelendi ve öyle kaynak gösterildi."
