abstract: "Tekafül sigortacılık sistemi İslami esaslara göre çalışmaktadır. Tekafülde faiz, kumar ve şüphe yoktur. Tekafül sigorta sisteminde yer alan sigorta şirketleri toplanan primleri faizsiz yatırım araçlarına yatırmakta ve İslami koşulları dikkate alarak faaliyetlerini yürütmektedirler. Tekafül sigortacılığı ülkemizde gelişmekte olan sigorta türüdür. Dayanışma ve yardımlaşma esasına dayanmaktadır. Türkiye'de sigorta sektörünün gelişmesi açısından tekafül sigortacılığının gelişmesi ve yaygınlaştırılması büyük önem taşımaktadır. Bu çalışmada; tekafül sigortacılık sisteminin çalışma prensipleri ve konvansiyonel sigorta ile arasındaki farklılıklar incelenmiştir. Sigorta pazarlaması kavramı açıklanarak, pazarının özelliklerine değinilmiş ve geleneksel sigortacılık ile karşılaştırması yapılmıştır. Son bölümde ise pazarlama ve dağıtım faaliyetini gerçekleştiren acenteler hedef alınarak teknik personeller ile anket uygulaması gerçekleştirilmiş ve tekafül sigortasının bilinilirlik düzeyinin ölçülmesi hedeflenmiştir."
