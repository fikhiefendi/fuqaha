abstract: "İslam aile hukukundaki temel konulardan birisi olan muharremât yani kendileri ile evlenilmeleri yasak olan kişilerdir. Muharremât ifadesi kendileri ile evlenme yasağı olan kadınları ifade etmekle beraber kadın açısından bakıldığında aynı konumdaki erkekler de bu kapsamın içerisine girmektedir. Evlenme yasağı sürekli olabileceği gibi geçici de olabilir. Tez çalışmamızda evlenme, evlilik dışı ilişki (zina) ve şehvetle bakma ya da dokunma sonucunda karşı tarafın belirli akrabaları ile evlenme engeli oluşturan“Hürmet-i Musâhere”konusu ele alınmıştır. Çalışmamız bir giriş ve iki bölümden meydana gelmektedir. Giriş bölümünde konunun önemi, amacı, sınırlandırılması ve konuya dair literatür çalışmalarına yer verilmiştir. Birinci bölümde evlilik teriminin kavramsal çerçevesi ortaya konulmuş olup bu bölümde nikâhın anlamı ve tanımı, hükmü, evliliğin kurulmasına dair şartlar, akrabalık kavramı, çeşitleri, akrabalığı oluşturan durumlar ve evlenme engelleri ele alınmıştır. Çalışmamızın ikinci ve son bölümde ise,“Hürmet-i Musâhere”kavramı üzerinde durulmuştur. Bu kapsamda öncelikle evlenme engeli bulunan hısımlardan bahsedilmiş, sonra hürmet-i müsâhereyi meydana getiren durumlar ele alınmış, bu konudaki görüş ve delillere yer verilmiş ve daha sonra bu görüş ve deliler değerlendirilmiştir. Çalışmamız, vardığımız netice ve önerilerimizi içeren bir sonuç bölümüyle tamamlanmıştır."
