abstract: "Bu çalışmada, Ehl-i Sünnet kelâmının iki ana ekolü olan Mâtürîdîlik ve Eş'arîliğin temel doktrinleri, bu ekollerin Hicri V. yüzyıldaki önemli temsilcilerinden Abdülkāhir el-Bağdâdî 429/1037) ve Ebü'l-Yüsr el-Pezdevî'nin (ö. 493/1100) Usûlü'd-Dîn adlı eserleri merkezinde karşılaştırmalı olarak incelenmiştir. Araştırmanın amacı, her iki alimin epistemoloji, ilahiyat, kader, nübüvvet ve iman gibi temel kelâm konularındaki görüşlerini analiz ederek, Mâtürîdî ve Eş'arî gelenekleri arasındaki ortak ve farklı yönleri ortaya koymaktır. Araştırmada nitel araştırma yöntemlerinden doküman incelemesi tekniği kullanılmıştır. Yapılan incelemeler sonucunda, her iki ekolün de tenzih ve büyük günah sahibinin durumu gibi Ehl-i Sünnet'in genel çerçevesini belirleyen konularda ortak bir duruş sergiledikleri tespit edilmiştir. Buna karşın tekvin sıfatı, kelâm sıfatının mahiyeti, kesb teorisi ve ilâhî fiillerde hikmet gibi teknik konularda belirgin farklılıkların olduğu görülmüştür. Bu farklılıkların temelinde, Mâtürîdîliğin ilâhî hikmet ve akla verdiği öncelik ile Eş'arîliğin mutlak ilâhî irade ve kudreti merkeze alan yaklaşımının yattığı sonucuna varılmıştır. Bu tez ile iki büyük Sünnî ekolün, ortak bir zemin üzerinde yükselen ancak farklı metodolojik hassasiyetlere sahip iki özgün rasyonel sistem olduğu ortaya konulmuştur."
