abstract: "Fıkıh ve Usulü Fıkıhtaki yetkinliğiyle döneminde temayüz etmiş olan Şehâbeddin Karâfî'yi tanıtmak, Telif etmiş olduğu Envâru'l Burûk fî Envâi'l Furuk adlı eseri ve furuk kitaplarının temel özelliklerini izaha çalışmak, son olarak da Karâfî'nin bu eseri bağlamında Makâsıd Düşüncesini incelemektir. Karâfî'nin makâsıd düşüncesi incelendiğinde, küllî kaidelere riayet edilmesi son derece önemlidir. O, küllî kaideleri makâsıd odaklı olarak ele almıştır. Maslahata dair görüşlerinin yanısıra özellikle de el-maslahatü'l-ulyâ/yüksek maslahat teorisini öne sürerek maslahatın alanını genişletmesi, kendisinden sonraki ilim adamlarını etkilemiştir. Ona göre maslahat, makâsıdın kısımları olan zarûriler, hâcîler ve tahsînîlerin hepsinde delil olarak kullanılabilir. Ayrıca sedd-i zerâi' ve mürsel maslahat delillerini de makâsıd teorisi içerisinde değerlendirdiği görülmektedir."
