abstract: "Tarihin her döneminde, kendi akranlarına göre daha çok öne çıkmış kişiler olmuştur. Bunlardan biri de Şeyhülislam, Feyzullah Efendi'dir. Feyzullah Efendi, âlim olmanın yanında tasavvuf ehli olma kişiliği ile de tanınan bir zat olup, Osmanlı'da Şeyhülislam görevini de yapmıştır. Hayatının sonunda bir takım nahoş muamelelere maruz kalmıştır. Böyle bir alimin bir takım gerekçelerle sürülmesi, aşağılanması ve sonuç itibari ile öldürülmesi çok elem vericidir. Söz konusu âlim; hadis, fıkıh ve başka alanlarda da eserler yazmıştır. Bunun dışında bir de Arapça olan bir şecere de telif etmiştir. Biz de bu şecereyi tez konusu olarak seçtik. Bu çalışmanın böyle bir âlimin tanınmasında ve eserlerinin bilinmesinde bir pay alacağını ümit ediyoruz."
