abstract: "Bu tezin amacı, dövme ile alakalı Hz. Peygamber'den (s.a.v.) gelen rivayetler ışığında fıkıhta dövmenin illetini ve buna bağlı olarak hükmünü tespit etmektir. Bu amaç doğrultusunda klasik fıkıh eserlerinden ve hadis şerhlerinden yararlanılmıştır. Çalışma toplamda üç bölümden oluşmaktadır. Tezin birinci bölümünde dövme hakkında etimolojik ve tarihi bilgilere yer verilmiştir. Dövmenin insanlık tarihi kadar eski olduğu, geçmişte ve günümüzde birçok millet tarafından güzelleşmek, kötü ruhlardan korunmak, bir gruba ait olmak, nazardan korunmak, dini sembolleri vücutlarında taşımak gibi hedefler doğrultusunda yaptırıldığı saptanmıştır. Çalışmanın ikinci bölümde klasik fıkıh eserlerinde mezheplerin farklı görüşlerine ve alimlerin hadis şerhlerindeki görüşlerine yer verilmiştir. Tezin üçüncü bölümde ise dövme yasağının muhtemel illetleri ayrı bir başlık altında ele alınmıştır. Yapılan araştırmalar neticesinde, dövmenin klasik ve çağdaş dönem fakihlerinin büyük çoğunluğu tarafından tedavi maksatlı uygulanmasına cevaz verilmekle birlikte; yaratılışı değiştirme, fıtratı bozma, insanın saygınlığını zedeleme, bedene zarar verme ve güzelleşme isteğinde haddi aşma gibi nedenlere binaen hükmünün haram olarak ortaya konduğu belirlenmiştir."
