abstract: "Tezimiz, usul tarihi açısından Şâfiî'den sonra mütekellim usulünü derinleştirip sistemleştiren ve kendinden sonraki usulcüler üzerinde ciddi etkisi bulunan Bâkillân'i'nin et-Takrîb ve'l-İrşâd es-Sağîr adlı eseri çerçevesinde tahsîs kavramını işlemektedir. Bu çerçevede Bâkillânî'nin tahsîs kuramını belirleyen âmm, hâss ve muhassis kavramlarının tahlilini yapmaktadır. Bu tez, kavramlara yüklenen anlamlar ile ilgili farklı ekoller arasındaki tartışmaları Bâkillânî'nin bakış açısıs ile tahlil edip sunmaktadır.Tezimiz, Giriş ve üç bölümden oluşmaktadır. Giriş'te çalışmamızın kapsam ve yöntemini ele aldık. Çalışmamızın konusu olan Bâkillânî ve et-Takrîb adlı eseri hakkında kısa bilgi verdik.Birinci bölümde, âmm kavramı incelenmiştir. Bu bölüm kapsamında Bâkillânî'nin usulünde âmm kavramının lafzın anlam aralığına giren iki ve daha fazla varlığı kapsayan kelime olarak tanımladığı ortaya konulmuştur. Âmm lafzın bu varlıklardan hangisini kapsayıp hangisini kapsamadığının ise ancak karine ile ortaya çıkabileceği anlaşılmıştır.İkinci bölümde tahsîs konusu tartışılmıştır. Netice itbariyle Bâkillânî'nin tahsîsi, mütekellimin lafızdan irade ettiği varlıklar ile dışarıda bıraktığı varlıkların hangileri olduğunun beyanı olarak gördüğü ortaya konmuştur.Üçüncü bölümde ise tahsîs edici deliller incelenmiştir. Bu bölümde Bâkillânî'nin tahsîs edici delilleri iki kısma ayırdığı ortaya konmuştur. Birincisi, cümle yapısından anlaşılan istisnâ, şart gibi muttasıl delillerdir. İkincisi ise cümleden bağımsız müstakil deliller olan akıl, sünnet, icma, kıyas gibi munfasıl delillerdir."
