abstract: "Herhangi bir ülkenin bankacılık kanunu gereği, mevcut bankacılık sisteminin bir parçası olduğu için zorunlu olan konvansiyonel ve İslami bankalar ile merkez bankası arasında bir ilişki vardır. Bankaların faaliyetleri para politikasından etkilenir. Merkez bankasının devletin para otoritesi olarak temel amacı, fiyat istikrarını sağlamaktır. Aynı zamanda parasal otoritelerin konvansiyonel ve İslami bankalara uyguladığı para politikası, finansal kaynakları harekete geçirmek ve ülke ekonomisine hizmet eden verimli yatırımları finanse etmek için bu kaynakları çekerek onları kalkınma hizmetine sokmada büyük rol oynamaktadır. Genel olarak gelişmekte olan ülkeler ve özelikle Yemen kalkınma sürecinde fon kaynaklarının azlığı sorunu ile karşılaşmaktadır. Yemen'deki savaşın neden olduğu ekonomik kriz nedeniyle, çeşitli ekonomik dengesizliklerden ötürü tasarrufların kredilere dönüştürülmesinde yetersizlikler ortaya çıkmaktadır. Ekonomik istikrar sürecine hizmet etmek ve Yemen'de ekonomik kalkınmanın gerçekleşmesine katkıda bulunmak için bankacılık sektörü harekete geçirilmelidir. Yemen ekonomisinin istikrarı ve ekonomik büyümenin sağlanması için kalkınma planlarını ve programlarını finanse edebilecek kaynaklar sağlanmalıdır. Bu çalışmada, banka kredileri ile seçilmiş bazı makroekonomik değişkenler arasındaki dinamik ilişkileri test etmek için kullanılan yöntemler sunulmuştur. Bu çalışma, banka kredisi ve bağımsız değişkenler arasındaki dinamik ilişkiler Johansen Koentegrasyon testi ve Granger nedensellik yöntemleri yardımıyla Ocak 2001- Ocak 2015 aylık veriler kullanılarak gerçekleştirilmiştir."
