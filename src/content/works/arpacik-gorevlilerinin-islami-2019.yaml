abstract: "Bu çalışmanın amacı TRB1 bölgesinde görev yapan din görevlilerinin katılım bankacılığına bakış açısına ilişkin sonuçlara ulaşmaktır. Bu amaçla TRB1 Bölgesinde yaşayan din görevlileri arasında örnek kütle seçilmiş bu örnek kütle üzerinde anket tekniği uygulanarak veri toplanmıştır. Bu veriler faktör analizi ile analiz edilmiştir. Yapılan faktör analiz sonucunda 15 değişkenin 3 faktörde toplanması uygun bulunmuştur. Bu faktörler önem sırasına göre göz önünde bulundurularak katılım bankacılığı tercihleri, katılım bankacılığıyla işlem yapma, faize ilişkin işlemler olarak isimlendirilmiştir. Araştırmanın sonucunda din görevlilerinin demografik özellikleri ile katılım bankacılığına bakış açıları arasında önemli farklılıklar tespit edilmiştir. Din görevlileri ihtiyaç halinde Katılım Bankalarının tercih edilebileceğini ancak yapılan işlemlerin İslami kurallara uygun olmadığını ve yapılan işlemlerin faizli işlemlere yakın olduğunu belirtmişlerdir. Geleneksel bankaların alternatifi olarak değerlendirilen katılım bankacılığının din görevlileri tarafından yeterince bilinmediği ve İslami finans algılarının zayıf olduğu anlaşılmaktadır. Bu nedenle katılım bankacılığı konusunda din görevlilerinin bilgilendirilmesi, onların görüşleri alınarak en uygun İslami bankacılık modelinin oluşturulması gerektiği kanaati hasıl olmuştur."
