abstract: "Devletler arası ilişkiler ve Arap kabileleri arasında elçi gönderme, İslam'dan önce bir örf ve gelenek halinde mevcuttu. İslam bu örfü ıslah ederek onaylamıştır. İslam'ı komşu devletlere ve Arap yarımadasındaki emirliklere tebliğ etmek için Hudeybiye anlaşması iyi bir fırsat olmuştur. Peygamber (s.a) Hudeybiye'den döndüğünde komşu devlet başkanlarını ve Arap yarımadasındaki emirleri İslam'a davet etmek için onlara elçiler ve mektuplar göndermiştir. Bu çalışmadaki amaç, Peygamber'in (s.a) bu hususta diplomatik faaliyetlerini incelemek, gönderdiği elçilerin kimliğini belirlemek, İslam'a davet edilen devletler ve emirliklerin bu davete verdikleri tepkileri tespit etmek, bu diplomatik faaliyetlerin İslam'ın uzaklara yayılması ve Medine devletinin güçlendirilmesi için ne kadar etkili olduğunu ortaya koymaktır. Bununla birlikte bu diplomatik faaliyetlerden elde edilen fıkhî sonuçlar da bu çalışmanın amacına dahildir. Bu çalışmada sadece Peygamber (s.a) tarafından devletlere ve emirliklere gönderilen elçilerden söz edilmektedir. Çalışmamızda amaca ulaşmak için kadim ve modern kaynaklara başvurulmuş olup çalışmamızla ilgili önemli temel kaynaklar hadis, siyer, İslam tarihi ve fıkhî eserlerdir. Kaynaklar tarandığında Peygamber (s.a) tarafından Bizans, Mısır, Pers, Habeşistan gibi devletlere ve Arap yarımadasındaki emirlikleri İslam'a davet etmek için sahabeden bilgin, sabırlı ve cesur on beş kişi gönderildiği anlaşılmaktadır. Bu elçilerden on dördü devletlerin ve emirliklerin yetkililerine ulaşmışlar ve Peygamber'in (s.a) mektuplarını onlara teslim edip mesajını aktarmış; sadece bir tanesi görevini tamamlayamadan yolda şehit edilmiştir. Bazı devlet ve emirliklerin yetkilileri, o zamanki elçi dokunulmazlığı örfüne riayet edip elçilere iyi davranmışlar; diğer bazıları ise bu dokunulmazlık örfüne saygı göstermeyip elçilere kötü davranmışlardır. Bu elçilerin daveti sayesinde bazı devlet başkanları Müslüman olup İslam'ı kabul ettiklerini beyan etmişlerdir. Arap yarımadasındaki emirlerin çoğu ve bu emirlerin bağlıları da Müslüman olmuşlar; İslam'ı kabul etmeyen Yahudi, Hıristiyan ve Mecûsîlere ise cizye tayin edilmiştir. Böylece bu elçilerin davetiyle savaşsız bir şekilde İslam dini yayılmış ve İslam devletinin egemenlik alanı genişleyip güçlenmiştir. Bu çalışmada İslam'da elçinin dokunulmaz olduğu ve elçi öldürmenin savaş ilanı anlamına geldiği tespit edilmiş; ayrıca gayrimüslim devlet ve milletlerin, savaşmadan önce elçi vasıtasıyla İslam'a davet edilmesinin İslam devletinin görevi olduğu ortaya konmuştur."
