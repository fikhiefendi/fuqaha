abstract: "Tezimize adını veren bu eserin aslı, fıkıh açısından tenâkuz konularını ele almaktadır. Bereketzâde İsmail Hakkı, yaşadığı dönemin siyasi ve sosyal olaylarını edebi ve hukuki kimliğiyle yakından müşahade etmiş ve bunları mümkün olduğunca eserlerine yansıtmış biridir. Bereketzâde İsmail Hakkı (1851-1918), hukukçu kimliğinin de etkisiyle, o günün şartlarında bütün adliye memurları için istifade edilebilecek bir kaynak olması düşüncesi ile bu kıymetli eseri“Tenâkuz-ı Fıkhî”ismi ile tercüme etmiştir. Onun hukukçu kimliğinin yanında aynı zamanda dil hususundaki dikkat ve titizliğini bu eserde de görmek mümkündür. Çalışmamızda öncelikle Bereketzâde İsmail Hakkı'nın hayatı, eserleri ve fikir dünyası tanıtılmış, Osmanlı son dönem hukuk sistemi kısaca incelenmiş, dönemin yargılama hukukunda tenâkuzun yeri ve Bereketzâde'nin bu konudaki görüşleri değerlendirilmiştir. Bu çalışmada Osmanlı Mahkemeleri ve kadıların durumu ile yaşanan değişimleri yakından inceleme ve tespitlerimizi kısaca yansıtma fırsatı bulunmuştur. Günümüz İslam Hukuku literatürüne, ilgili bir eserin argümanları ile katkıda bulunmak hedeflenmiştir."
