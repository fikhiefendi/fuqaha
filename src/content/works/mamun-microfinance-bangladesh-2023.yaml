abstract: "Bangladeş'te, geleneksel modelleri ve faizsiz çerçeveleri izleyen mikrofinans yoluyla yoksulluğu azaltmaya yönelik girişimler nispeten yenidir. Bu çalışma, geleneksel ve faizsiz mikrofinans kurumlarının (IFMIF'ler) sağladığı operasyonel farklılıkları ve kolaylıkları değerlendirmek amacıyla yapılmıştır. İkinci olarak, bu çalışma, 2010'dan 2020'ye kadar olan verileri ve sıradan en küçük kareler tahmin yaklaşımını kullanarak geleneksel ve IFMIF'lerin Bangladeş'teki yoksulluğun azaltılması üzerindeki etkisini araştırdı. Bu araştırma dört yoksulluk göstergesini dikkate almaktadır: mikro kredi kullanımının etkisini tahmin etmek için üst yoksulluk oranı, aşırı yoksulluk oranı, bebek ölüm oranı ve temel sanitasyon oranı. Sonuç, faizsiz mikro kredi ödemesinin hem üst yoksulluğu hem de bebek ölüm oranlarını azaltmaya yardımcı olabileceğini, ancak aşırı yoksulluğun ortadan kaldırılmasında bunun tersi bir sonucun bulunduğunu ortaya koydu. Geleneksel mikrofinans kurumlarının kredi kullandırımı, üst yoksulluk düzeyi üzerinde olumlu bir etkiye sahiptir. Ek olarak, IFMFI'lerin temel sanitasyon oranını artırmada olumlu bir etkisi vardır, ancak geleneksel MFI'lerin temel sanitasyon üzerinde olumsuz etkileri vardır. Buna karşılık, IFMFI'nin kredi ödemesi, Bangladeş'teki geleneksel mikrofinans kurumlarına kıyasla yoksulluğun azaltılması üzerinde daha iyi bir etkiye sahiptir. Son olarak, bu çalışma, bu araştırmanın akademisyenler, politika yapıcılar, hükümet ve diğer paydaşlar arasında Bangladeş'te IFMI'nin kredi ödemesi yoluyla yoksulluğu azaltmak için devrim niteliğinde bir görüş getireceğine inanıyor."
