abstract: "İnsan üzerinde gerçekleştirilen tıbbi araştırmalar tıp tarihi boyunca önemini her zaman korumuştur. İnsanlar üzerinde gerçekleştirilen tıbbi araştırmalar tıpta klinik araştırmalar olarak isimlendirilmektedir. Klinik araştırmalar gözlemsel ve girişimsel olarak gerçekleştirilebilmektedir. Bu araştırmaların kapsamına insanlara doğrudan müdahale içerdiği için sadece girişimsel klinik araştırmalar girmektedir. Klinik araştırmalar, COVID 19 virüsü hatta pek çok hastalığın ve tedavilerinin keşfedilmesi gibi çeşitli amaçlara hizmet etmektedir. Bu açıdan insanlık için önemi yadsınamaz. Ancak bu öneminin yanı sıra insanlar üzerinde gerçekleştirilmesi bakımından insanların maruz kalabileceği risklerin de olması sebebiyle konu İslam hukukunu da ilgilendirmektedir. Bu sebeple bu tez içerisinde klinik araştırmaların tıp içerisindeki konumuna ve önemine değinildikten sonra tıp etiği ve pozitif hukuk açısından gerekli görülen klinik araştırma ilkelerinin İslam hukuku açısından incelemesi gerçekleştirilmiştir. Ayrıca Türk ceza hukuku ile karşılaştırmalı bir yöntem izlenerek İslam ceza hukuku açısından klinik araştırmaları gerçekleştiren sorumlu araştırmacının klinik araştırmaları gerçekleştirirken uyması gereken ilkelere uymadığı durumlarda ortaya çıkabilecek suçlar ve cezaları incelenmesi amaçlanmıştır. Bu amacı gerçekleştirebilmek için tıp tarihi ve etik anabilim dalı öğretim üyeleri ile görüşmeler gerçekleştirilmiş konuya dair önerilen kaynaklar taranarak döküman analizi yöntemiyle de sonuçlar teze yansıtılmıştır. Araştırmamız sonucunda İslam'ın araştırmayı teşvik eden yaklaşımına hastalıklara tedavi bulma konusunda hekimlerin de muhatap olduğu söylenebilir. Bu açıdan bir araştırma olan klinik araştırmaların da ilkelerine uyulduğu, belirli bir zaruret gözetilerek ve insanları koruyucu önlemler alındıktan sonra gerçekleştirilmesinin İslam hukukunun da bu araştırmaları meşru kabul etmesinin şartı olduğu neticesine ulaşılabilir. Ancak bu ilkelere uymayarak bir araştırma gerçekleştiren sorumlu araştırmacı ise İslam hukukunun ayrımlarından kısas, diyet ve tazir suçlarını işlemiş ve cezalarına muhatap olacağı bir gerçektir."
