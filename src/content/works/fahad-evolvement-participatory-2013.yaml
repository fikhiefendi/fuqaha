abstract: "Bankacılık sektörüyle karşılaştırıldığında oldukça kısa bir geçmişe sahip olan Katılım Bankaları, mali sektördeki gelişmelere bağlı olarak son yıllarda hızlı bir büyüme sürecine girmiştir. Para ticareti yerine mal ticaretine dayalı işlemlerin esas alındığı bu kurumların kavram olarak ifade edilmesinin, tarihsel gelişiminin, hukuki yapılarının, fon kaynakları ve kullanımlarının, ekonomiye katkılarının, Türkiye?deki faaliyet ve büyüklüklerinin yanı sıra Türkiye'deki kriz süreçlerinde alınan önlemler önem arz etmektedir. Sermayenin küreselleşmesinin de etkisiyle, uluslararası mali piyasada daha yakından incelemeye alınan bu kurumlar kalkınmakta olan ülkelere yeni imkanlar sunmakta ve bir yandan faiz kaygısıyla tasarruflarını ekonominin hizmetine sunmayan kesimlerin tasarruflarını ekonomiye kazandırırken diğer yandan da yatırımcıların fon temin edebilecekleri kurumlar işlevini görerek yatırım ve tasarruf sahipleri arasında aracılık görevini yerine getirmektedirler.Bu çalışma ile Katılım Bankacılığı kavramı, temel ilkeleri, uygulamaları, faaliyetleri ve Türkiye'de yaşanan kriz dönemlerindeki gidişatları ortaya konulmaya çalışılacak ve Türkiye?deki finansal gelişimleri irdelenecektir."
