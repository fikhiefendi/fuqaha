abstract: "ÖZET İslâm Hukukunun temel kaynakları: Kitap (Kur'an) ve Sünnet'tir. Hz. Peygamber'in vefatından sonra, Kitap ve Sünnet'te hükmü bulunmayan meselelerle karşılaşan müslümanlar, yukarıda adı geçen kaynaklarm yanında bir takım yöntemler kullanarak bu meseleleri çözmeye çalışmışlardır. Bu yöntemler, icma, kıyas, istihsan, istislah, şer'ü men kablena... vb.dir. İslâm hukuk bilginleri Kitap ve Sünnetin dışında İslâm Hukukunun başka kaynağa ihtiyaç duyup duymadığım tartışa gelmişlerdir. Büyük çoğunluk, Kitap ve Sünnetin yanında başka kaynağın kullanılmasını kabul etmişlerdir. İlk temsilcisi Dâvud b. Ali olan Zahirî Mezhebi, İslâm Hukukunun bilgi kaynaklarını; Kitap, Sünnet, İcma ve Delil ile sınırlandırmıştır. Başka kaynaklarm kullanılmasını kabul etmemiştir. Bu çalışmada, bu ekolün ikinci ve en önemli imamı saydan İbn Hazm'in kıyasa bakışı ile İslam Hukuk metodolojisi açısmdan kıyas karşılaştırmalı olarak ele alınmıştır."
