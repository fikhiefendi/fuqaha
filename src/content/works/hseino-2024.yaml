abstract: "Araştırmanın amacı, hizmet şirketlerinde İslami iş ahlakının rekabet avantajı üzerindeki etkisini bilmek ve Türkiye'de faaliyet gösteren hizmet şirketlerinde İslami iş ahlakının uygulanma düzeyini belirlemek, ayrıca Türkiye'deki hizmet şirketlerinin rekabet avantajını değerlendirmek ve Türkiye'deki eğitim hizmetleri şirketlerinin yönetimine rehberlik edecek sonuçlara ve tavsiyelere ulaşmaktır. İslami iş ahlakına aktif olarak dikkat edilmesi. Betimsel analitik yöntem kullanılmış ve anket kullanılmıştır. Araştırma örneklemi, Türkiye'deki öğrenci hizmetleri şirketlerinde çalışan 82 kişiden oluşmuş ve sonuçlar SPSS programı ile analiz edilmiştir. Araştırma, Türkiye'deki öğrenci hizmetleri şirketlerinde İslami iş ahlakını uygulamak ile rekabet avantajını elde etmek arasında istatistiksel olarak anlamlı bir ilişki olduğunu ve Türkiye'deki öğrenci hizmetleri sektöründe yüksek düzeyde İslami iş ahlakının var olduğunu ortaya koymuştur."
