abstract: "Hilâfet tarihi, İslâm kurumları tarihinde merkezî bir konum teşkil etmektedir. Bu öneminden dolayı hilâfet kurumu, pek çok sahada üzerinde birçok çalışmanın yapıldığı bir konu olmuştur. Hilâfet literatürünün başında ise şüphesiz Ebu'l-Hasan el-Mâverdî gelmektedir. Yaşadığı dönemin şartlarının, halifenin yanında ve hizmetinde olan Mâverdî'nin hilafet görüşlerini etkilediği görülmektedir. Mâverdî, Büveyhî emirleri vesayeti altında olan Abbâsî hilâfetinin savunmasını yapmıştır. Benzer şekilde hilâfet kurumunun savunulduğu diğer bir dönem ise XIX. yy Osmanlı hilâfeti dönemidir. Bu dönemde ise halifenin yanında ve hizmetinde olan ve İslâmî kaynaklardan faydalanarak pek çok konuda olduğu gibi hilâfet konusunda da yol gösterici olan kişi Ahmed Cevdet Paşa'dır. O da dönemin şartlarına binâen hilâfet savunması yapmıştır. Bu tezde bu iki şahsiyetin halifenin yanındaki konumları ve dönemlerinin şartları dikkate alınarak hilâfet görüşleri karşılaştırılmıştır. Böylelikle ulema-siyaset ilişkisi çerçevesinde hilâfet kurumu algısındaki değişen ve değişmeyen unsurlar ortaya konmaya çalışılmaktadır."
