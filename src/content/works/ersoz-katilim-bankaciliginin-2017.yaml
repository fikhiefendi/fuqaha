abstract: "Ekonomik yapının içinde hızlı bir büyüme potansiyeli gösteren katılım bankacılığı kavramının tanımlanması ve Türkiye'de faaliyet gösteren katılım bankalarının kullanıldığı finansal araçların incelenmesidir. Katılım bankacılığı kavramı doğuşu ve tarihsel gelişimi başlığı altında kavram olarak tanımı, temel ilkeleri, amaçları incelenmiştir. Katılım bankacılığını ortaya çıkaran nedenler, katılım bankalarının genel özellikleri ve faizsiz bankacılığın çalışma ilkeleri altında kar veya zarara katılma, faizsizlik ilkesi, reel sektörü finanse etme ve katılım bankalarının fon kaynakları ile faizsiz bankacılıkta başlıca fon kullandırma yöntemleri detaylı bir şekilde ele alınmıştır. Katılım bankalarının kullandığı fon toplama yöntemleri ve finansal araçları ele alınmıştır. Çalışmamı katılım bankalarının geleceği hakkındaki önermelerle sonuçlandırılmıştır."
