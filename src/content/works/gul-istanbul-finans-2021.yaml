abstract: "Finans merkezleri fon arz ve talebinin oluştuğu günümüzdeki en gelişmiş merkezlerdir. Bununla birlikte finans merkezi olmak için bazı gerekli nitelikler olduğu da tespit edilmiştir. Nitelikli işgücü, ekonomik istikrar, fiziksel altyapı ve hukuk sistemi bu gerekli niteliklerden bazılarıdır. Bu çalışmada İstanbul'un bir finans merkezi olmak için gerekli nitelikleri taşıyıp taşımadığı araştırılmıştır. Bunun için literatür taraması yöntemi kullanılmıştır. Finans merkezi kavramından sonra İslami finans kavramına değinilmiş, tarihçesi, gelişimi ve ülkemizdeki gelişim aşamaları aktarılmıştır. İstanbul'un bir finans merkezi olduktan sonra aynı zamanda bir İslami finans merkezi olup olamayacağı konusu da açıklanmıştır. İslami finansın portföy büyüklüğü olarak en gelişmiş merkezi olan Londra Finans Merkezi ile birlikte gelişmekte olan Malezya ve Astana ile ilgili de bilgi verilmiştir. İstanbul Finans Merkezi'nin küresel ölçekteki finans merkezleri ile rekabet edebilmesi için yasal altyapı çalışmalarının yapılması gerekliliği tespit edilmiştir. Finans merkezi kavramının sadece bir bina ya da tesis yapmakla sınırlı olmadığı, siyasi, hukuki, sosyal ve kültürel birçok alanda reformlar ve gelişmeler ışığında ancak bir finans merkezi statüsü kazanılabileceği anlaşılmıştır."
