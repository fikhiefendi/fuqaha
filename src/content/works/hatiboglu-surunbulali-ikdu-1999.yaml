abstract: "65 Şu halde mukallid, delîle vakıf olup tedkîk ve tetebbûatta bulunma istidadından mahrum olduğu için hükmün deliline değil de meseleye hükmü veren âlime i'timâd edip tâbi olmaktadır. Buna göre mukallidin, tâbi olduğu âlime veya mezhebe mücerred hüsn-i niyyetiyle bağlandığı söylenebilir. Taklidle alâkalı meselelere, İslâm'ın ilk asırlarında ihtiyaç duyulmadığı için ulemâ tarafından temas edilmediğini bilmekteyiz. Avamın muayyen bir âlime bağlı kalmaksızın karşılaştığı meselenin hükmünü bir defasında bir âlime diğer bir defasında da başka bir âlime sormak suretiyle amelede geldiği bilinen bir husustur. Araştırabildiğimiz kadarıyla taklîd mevzuunda, mütekaddimînden daha ziyâde müteahhirîn âlimleri, usül âlimlerinden daha çok ta fakihler eserler kaleme almışlardır. Bu hususa, usül ve fürü' eserlerinin haricinde müstakil risalelerde de temas edilmiş, ekseriyetle de telfîkla beraber ele alınmıştır. C. Telfîk: Telfîkın lügat mânası,“kumaşın iki kenarını birleştirip dikmek”184 demektir. Ayrıca, telfîk;“uydurmak, tezyin etmek, vâsıl olmak, iltihâk etmek, anlamamak, elde edememek, eli boş dönmek vb.”mânalara da gelmektedir. Bu kelime lügatta, en çok eşya veya işleri bir araya getirmek veya birbirlerine münâsib hale getirmek“ gibi mânalarda kullanılmıştır. Fakihlere göre telfîk, ”farklı şeyleri birleştirmek“ mânasına gelmektedir. Usûl ulemâsına göre ise telfîk, ”taklîd yolu ile bir mes'ele veya amel üzerinde iki veya daha fazla mezhebin farklı hükümlerini birleştirerek elde edilen hükümle amel etmeyi ifâde etmektedir.“185 Telfîkla meydana getirilmiş hükme, müleffak hüküm denir. Telfîkın mâna ve mâhiyetini ifâde eden tesbitleri verdikten sonra, bu mevzunun iki kısımda ele alındığını ve aralarında bazı farkların bulunduğunu ifâde edelim. Bunlardan birincisi; ictihâd yapılmak suretiyle veya ihtilâf edilip de üzerinde iki görüşte icmâ' meydana gelen bir hususta daha sonra üçüncü bir görüşle vücuda gelen telfîk nevidir. İkincisi ise, taklîdde telfîk olup hicrî yedinci asırdan itibaren mevzu edilmiştir. Telfîk mes'elesi, usûl-i fıkıh kitaplarının taklîd bahsinde, fıkıh eserlerinin ise muhtelif kısımlarında ele alınmıştır. Ayrıca, ya sadece telfîktan veya taklîdle beraber telfîktan bahseden risalelerde kaleme alınarak tedkîke çalışılmıştır. Telfîk hakkında, usûlden daha ziyâde fürû'a dair te'liflerin bahsettikleri de bilinen bir başka husustur.186 {?SOM NOASYLHVWpOa flTO!MHraJL3«ÎK»raS5IflA ”31 184. Bkz. Zemahşerî, a.g.e., s. 570. 1. Bkz. Muhammed b. Abdilazîm, el-Kavlü's-sedîd fi ba'dı mesâili'l-ictihâdi ve't-taklîd, (trc. Hayreddin Karaman), s. 197.. 186. Bkz. Senhûrî, et-Telfîk beyne ahkâmi'l-mezâhib, (trc. Hayreddin Karaman), s. 227.64 Eserin kısaca tanıtımı maksadıyla arzettiğimiz bu ifâdelerden sonra, tez çalışmamızın mühim bir kısmını teşkil eden risalenin tercümesi esnasında isimleri sık sık geçecek olan iki asıl tabir hakkında hülâsa bir ma'lûmat vermeyi münâsip gördük. Bunlar, taklîd ve talfîk kelimeleridir. Şimdi, bunlar hakkında ayrı ayrı kısa bir değerlendirmede bulunacağız. B. Taklîd: Taklîd kelimesi lügatta,“kılıç takmak ve bir kimsenin omuzuna kılıcın askısını yerleşitirmek”180 mânalarına gelmektedir. Taklîd,“hak olsun bâtıl olsun bir şeyi boyundaki gerdanlık gibi yapmaktır.”181 şeklinde de ta'rîf edilmiştir. Fıkıh usûlüne göre taklîd,“delilsiz olarak bir sözü kabul etmek”,“sözü, şer'î delillerden birisi olmayan ve bu delillere dayanmayan bir kimsenin kavliyle amel etmek”veya“kat'î bir delil olmaksızın sözü, şer'î dört delilden birisi olmayan bir şahsın sözüyle amel etmektir.”182 gibi birbirlerine oldukça yakın şekillerde ta'rif edilmiştir. Yukarıda verdiğimiz ta'riflere göre bir şahsın -müctehid veya mukallid olsun- Kur'ân-ı Kerîm, sünnet-i şerîfe, icmâ'-ı ümmet ve kıyâs-ı fukahâ gibi dayandığı delil veya delilleri bilmeksizin onun görüşüyle amel etmeye taklîd, amel edene de mukallid denilmektedir. Taklîd edilen şahıs veya hüküm yönünden taklîd; vâcib (farz), caiz ve haram kısımlarına ayrılmaktadır.183 Buna göre: Vâcib olan taklîd; hatadan korunmuş olanı taklîddir ki, bu da hak ile gönderilen Peygamber Efendimiz (s.a.s.)'dir. Bu nev'î taklîdin, hakikatte taklîd olmadığı zira, şerî'atta taklîd denilince, hakikatini bilmeden başkasının sözünü kabul etmenin anlaşıldığı, Rasûlüllah (s.a.s.)'ın kavlinin, fiilinin veya takririnin ise hüküm için esas ve delil teşkil ettiği âlimler tarafından ifâde edilmiştir. Taklîdin bu kısmına“taklîd-i örfî”de denilir. Caiz olan taklîd; müslümanların, din âlimlerini amelde veya i'tikâdda taklîd etmeleridir. Amelde taklîd, icmâ' ile sabit olup, makbul ve mu'teberdir. İ'tikaddaki taklîdde ise ihtilâf vardır. İ'tikâdî hususlara inanmakta her mükellefin eşit olduğu söylenmiş, i'tikâdın aslı da akılla bilinmesi mümkün olan yerde araştırmak ve delil getirmektir, denilmiştir. Kelâm âlimlerinden bir kısmı, her mükellefin, i'tikâdî hususların aslını bilmesinin mümkün olmadığını ifâde ederek îmân mevzuunda da taklîdin caiz olduğunu söylemişlerdir. Bazıları da caiz olmadığı kanâatindedirler. Dînî hususlarda taklîd denilince, taklîdin bu kısmı kastedilir. Haram olan taklide geline; bâtıl yerlerde ve dinen yasak olan hususlarda babaları ve büyükleri taklîd etmektir. 1. Bkz. Zemahşerî, Esâsü'l-belâğa, s. 519; Karaman, Hayreddin, islâm Hukukunda îçtihâd, s. 195. 18 K Bkz. Îbnü'l-Hümâm, et-Tahrîr, III. 340; eş-Şürünbülâlî, el-Ikdü'1-ferîd, Süleymâniye, Um.Ktb., nr. 214, vr. 48^; Kahraman, a.g.e., s. 195 1. Bkz.-eş-Şürünbülâlî, a.g.e., Süleymâniye, Um.Ktb., Hacı Beşir Ağe, nr. 214, vr. 49a. 183. Bkz.“ ”“ vr. 49a; Şah Veliyyul- lâh, 'Ikdü'1-cîd fî ahkâmi'l-ietihâdi ve't-taklîd, (trc. Hayrettin Karaman), s. 202 vd.65 Şu halde mukallid, delile vakıf olup tedkik ve tetebbûatta bulunma istidadından mahrum olduğu için hükmün deliline değil de meseleye hükmü veren âlime i'timâd edip tâbi olmaktadır. Buna göre mukallidin, tâbi olduğu âlime veya mezhebe mücerred hüsn-i niyyetiyle bağlandığı söylenebilir. Taklîdle alâkalı mes'elelere, İslâm'ın ilk asırlarında ihtiyaç duyulma