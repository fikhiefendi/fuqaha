abstract: "Ser'iyye Sicilleri, Osmanlı Tarihinin önemli yazılı kaynaklarındandır. Bu çalısma, M. 1759- 1760 (H: 1173-1174) yılları arasındaki Trabzon tarihinin ekonomik, hukuki, idari ve sosyal yönlerine ısık tutmak amacıyla yapılmıstır. Osmanlı dönemindeki Trabzon arastırılırken, Ser'iyye Sicilleri incelenmeden yapılan çalısmalar büyük oranda eksik kalacaktır. Bundan dolayı, yapılan çalısmada; Ser'iyye Sicillerinin tanımı, önemi, ihtiva ettigi belge çesitleri gibi konular hakkında da kısa bilgiler verilmistir. Bu çalısmada, 1924/110 numaralı Trabzon Ser'iyye Sicil Defterinin transkripsiyonu ve tahlili yapılmıstır. Defterde 310 belge bulunmaktadır. Çalısmadaki toplam 310 belgenin içeriginde nikah hücceti, tereke tesbiti, ihtida hücceti, ibra hücceti, vasi hücceti, vakfiye hücceti gibi konular bulunmaktadır. Bunlar içerisinde nikah hücceti belgelerin çogunlugunu olusturmaktadır."
