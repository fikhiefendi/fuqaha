abstract: "Klasik fıkıh eserlerinin genel olarak ilk bölümlerinde ele alınan tahâret, namaz, oruç ve zekât gibi konular,“ibadetler”kapmasında yer almaktadır. Bu konulara akaid meselelerinin de eklenmesiyle ilmihal adıyla bilinen eserlerin ortaya çıkması daha ziyade Osmanlı döneminde söz konusu olduğu ifade edilebilir. Söz konusu zaman diliminde sistemleşmeye başlayan bu süreç, Cumhuriyet dönemiyle birlikte halkın günlük ibadet hayatında ihtiyaç duyduğu konular üzerine eserlerin yazılmasında önemli bir rol oynamıştır. Buna göre, halkın ihtiyaçları arasında özellikle kadınların özel hallerine ilişkin meseleler öncelikli bir yer tutmaktadır. Kadınların hayız, nifas ve istihâze olmak üzere üç özel hali bulunmakta olup, bunların fıkıh açısından oldukça kompleks ve detaylı hükümleri içermesi, ilgili konuların anlaşılmasını zorlaştırmaktadır. İlmihal müellifleri de bu meselelere yer vererek halkın ihtiyaçlarına cevap vermeyi amaçlamışlardır. Bu araştırmada Cumhuriyet dönemi ilmihallerinde kadınların özel hallerine ilişkin ele alınan hususların incelenmesine odaklanmaktadır."
