abstract: "Bu araştırmanın hedefi müfessirlerin, fıkhi mezheplerinden ne derecede etkilendiklerini, en önemli ahkam (fıkhi) tefsirlerini ve metotlarını tanıtmak ve sonra da Nur suresindeki ahkâm ayetleri bağlamında bu hususla ilgili örnekler sunmaktır. Bu araştırma giriş ve uç ana bölümden oluşmaktadır: Birinci bölüm; Fakih müfessirlerin metotlarını, eserlerini ortaya koymak. İkinci bölüm ise; Nur Suresini ve fıkhi tefsir alanındaki ehemmiyetini tanıtmak. Uçuncu bölüm ise; Nur suresinde hakkında ahkâm ayetlerini, bu konularla ilgili fakih müfessirlerin görüşlerini ve fıkhi mezheplerinden ne derecede etkilendiklerini içermektedir. Araştırmanın en önemli sonuçları şunlardır; Fıkhi mezheplerin olumlu etkisi olumsuz etkisinden daha fazla olmuştur. Öyle ki bir fıkhi mezhebe bağlı olmak fıkhi mezhebe müntesip müfessirin hüküm çıkarmada daha derin düşünmesine, objektif ve tarafsız hüküm çıkarmaya onu teşvik etmiştir. Eğer ayetin delaleti kendi mezhebinin görüşü doğrultusunda ise onu alır, yok durum bu şekilde değilse en kuvvetli görüşü tercih ederdi. Bu durum Mukayeseli İslam Hukuku Araştırmalarının gelişmesinde pay sahibi oldu, hatta bu alanda yazılan eserler neredeyse fıkhi tefsirlerle denk oldu. Tefsir kitaplarındaki fıkhi mezheb taassubu gerçekten çok sınırlıdır. Bu taassubu en çok el-Cassas ve el-Kıya Hırrasi'de görmekteyiz. Buna rağmen her ikisi de uzunca tartışmalardan ve delileri ortaya koyduktan sonra diğer mezheplere karşı kendi mezheplerini savunmaktaydılar. Bunlar İslam fıkıh mirasının zenginleşmesine katkıda bulunmuşlardır. Bu araştırmada ortaya çıkan sonuçlardan biri de sadece ahkam ayetlerine önem veren ahkam tefsirlerinin yanı sıra, Kur'an'ı bir bütün olarak ele alan tefsir kitaplarının fıkha verdiği önemdir. El- Mazhari, El-Alusi, El-Kurtubi ve Er-Razi'nin tefsirleri gibi. Çünkü; bu tefsirlerde fıkha ayrılan alan, sadece ahkam ayetlerini ele alan fıkhi tefsirlerde ayrılan alana denk belki de ondan daha fazladır."
