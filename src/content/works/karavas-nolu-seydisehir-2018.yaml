abstract: "Şeri'yye sicilleri XV. Yüzyılın yarısından başlayarak XX. Yüzyılın ilk çeyreğine kadar olan süreçte Osmanlı devletinin büyük bir bölümünde tutulmuş olan birinci el kaynaklardan biridir. Söz konusu kaynaklar toplumların; siyasi tarihinin yanı sıra askeri, kültürel, sosyal ve iktisadi yapı hakkında bilgiler içermektedir. Şer'iyye sicilleri şehirlerin tarihi hakkında yapılacak araştırmalarda da çok büyük bir önem arzetmektedir. Kadıların, merkez ile yaptıkları resmi yazışmalar, halkın şikâyet ve dilekleri ferman ve hükümler bahsettiğimiz hususlar dışında ait olduğu bölgenin sosyal ve iktisadi hayatı hakkında bize çok değerli bilğiler veren mahkeme kararları incelenmeden Osmanlı Devleti'nin siyasi, idari ve sosyal tarihi hakkında bilgi edinmek mümkün değildir. Şer'iyye Sicilleri kapsam olarak çok geniş olduğu için araştırma yapılacak birçok konu için başvurulacak tek kaynaktır. Şer'iyye mahkemelerini ilgilendiren konuya ait yazılar belirli kurallara göre yazılırdı. Bölgesel konuların yazıldığı bölüme“sicili mahfuz”, merkezden gelen emirlerin yazıldığı bölüme ise“Sicili Mahfuz Defterü”denirdi. Bu çalışmada 238 numaralı Seydişehir (Konya) Şer'iyye sicillerini (Rumi 1318- 1922 miladi 1903-1922) inceledim. Söz konusu siciller Vekâlet Hüccetlerinden oluşmaktadır. Üzerinde çalıştığım siciller çeşitli konular içermekle birlikte ağırlıklı olarak miras, alacak, nikah ile ilgili konular bulunmaktadır. Sicil içeriğinde genellikle dava konusa itilaflı konular ya da devir, satış, gibi konularla ilgili vekâlet verme işlemleri bulunmaktadır. Bu çalışma bölgenin sosyal, kültürel, ekonomik, tarihiyle ilgili önemli bilgiler içermektedir."
