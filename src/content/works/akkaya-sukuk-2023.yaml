abstract: "Çalışmamızda, sukûk ihraçlarını gerçekleştiren özel amaçlı kurumlar incelenmiştir. Bu kapsamda Türk hukukunda varlık kiralama şirketi (VKŞ) olarak kurulan özel amaçlı kurumların ortaya çıkma nedenleri, temel özellikleri, hukuki yapısı, fonksiyonları, tabi oldukları mevzuat ile sukûk ihracı yoluyla sağladıkları mikro ve makro iktisadi faydalar üzerinde durulmuştur. Çalışmamızda nitel araştırma yöntemlerinden derinlemesine mülakat yöntemi kullanılmıştır. Araştırmamız için Türkiye'de ve yurtdışında sukûk ihraçlarında görevli hukukçular, varlık kiralama şirketi yetkilileri, ihraçların İslami finansa uygunluğunu denetleyen uzmanlar ile yatırımcı şirket yetkilileri ile derinlemesine mülakatlar yapılmıştır. Bu mülakatlarda, varlık kiralama şirketlerine ilişkin sorunlar ile bunların çözüm yöntemleri hakkında uzmanların görüş ve değerlendirmeleri çalışmaya aktarılabilmiştir. Araştırmamızın sonunda Türkiye'de tek kişilik anonim şirket olarak faaliyet gösteren özel amaçlı kurumların, yatırımcılar ve kurucu finansal kurumlar ile olan ilişkilerinin hukuki ve iktisadi nitelikleri hakkında bir çerçeve çizilmiştir. Bu çerçevede kurucu ile varlık kiralama şirketi arasındaki sıkı organik ilişki başta olmak üzere, bu ilişkilerden kaynaklanabilecek hukuki ve finansal sorunlar tespit edilmiş ve bu sorunların çözümüne ilişkin görüş ve önerilere yer verilmiştir. Nihayetinde bu tespit ve değerlendirmeler kapsamında özel amaçlı kurumların bağımsız bir yapıya kavuşturulması yoluyla anılan sorunların en aza indirilmesinin mümkün olabileceği sonucuna varılmıştır."
