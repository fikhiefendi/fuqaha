abstract: "Osmanlı Devleti'nin yönetim anlayışı, kuruluşundan yıkılışına kadar sürekli değişim göstermiştir. Ancak, egemenlik ve icrayı meşru kılan temel prensip her zaman adalet olmuştur. Yönetimdeki değişikliklere rağmen, hükümdarın önemli meselelerde tek başına karar vermeyip devlet adamlarının fikirlerine başvurması uzun süre devam eden önemli bir gelenekti. 16. yüzyılın ortalarından itibaren divân sistemi değişmeye başlamış ve devlet işleriyle ilgili meseleler daha az görüşülür olmuştur. Bu dönemde divân, halkın şikâyetlerini dile getirebildiği yegâne kurum haline gelmiştir. Divân-ı Hümâyûn'da görüşülen meseleler, konularına göre çeşitli defterlerde kayıt altına alınmıştır. Bu defterlerden biri de halkın istek ve şikâyetlerinin kaydedildiği Ahkâm defterleridir. Bu defterlerden biri de 63 numaralı Bursa ahkâm defteridir. Bu deftere kaydedilen hükümlerin konu başlıkları genellikle vakıf, alacak-verecek meseleleri, vergi, miras ve ortak kullanım alanları ile ilgili anlaşmazlıklardır. Bu meseleler, din ve cinsiyet ayrımı yapılmaksızın aynı hassasiyetle sonuçlandırılmış ve adalet müslüman ya da gayrimüslim ayırt etmeksizin yerine getirilmeye çalışılmıştır. Bu çalışmada, 63 numaralı Anadolu Ahkâm defterinin transkripsiyon ve özetleme çalışması yapılarak, defterde yer alan hükümler çerçevesinde Bursa'nın 16. yüzyıldaki idari görünümü, ekonomik, dini, sosyal, kültürel ve hukuki yapısıyla ilgili bilgiler yansıtılmaya çalışılmıştır. Giriş kısmında Anadolu eyaleti ve Bursa'nın kısa tarihi anlatıldıktan sonra, Ahkâm Defterleri'nin tarihi kıymeti ve özelliklerinden bahsedilmiştir. Birinci bölümde, 63 numaralı Bursa ahkâm defteri'nde yer alan hükümlere göre konuların tasnifi ve değerlendirilmesi yapılmıştır. Ek kısmında ise defterin 132 sayfalık transkripsiyonu ve özeti, defterde geçen yer adları, vakıf adları, özel isimler ve özel terimlerin bulunduğu tablo yer almaktadır."
