abstract: "Fıkıh tarihi boyunca içtihatla bağlantılı olarak taklid etrafında birçok tartışma cereyan etmiştir. Erken dönemlerden itibaren süregelen ve ortaya çıkışlarıyla birlikte mezhepleri de kuşatan bu tartışmalar, belirli dönemlerde güç ve etki bakımından kendilerini daha fazla hissettirmiştir. Özellikle 19. ve 20. yüzyıllara gelindiğinde taklid ve mezhep olguları üzerindeki tartışmalar yoğunlaşmış, bu çerçevede içtihat ve taklid başlığı taşıyan birçok eser kaleme alınmıştır. Bu bağlamda Hucendî ve Bûtî, konuya ilişkin dikkat çekici çalışmalar yapan iki mütefekkir olarak öne çıkmıştır. Japonya'da yeni Müslüman olan mühtedilerin mezheplere dair sordukları soruya bir cevap olarak eserini telif eden Hucendî taklidi, delile dayanmayan bir görüşü itibara alıp onu takip etmek şeklinde izah etmekte, neticede Müslümanların tamamına hitap eden nasların muhatapları tarafından geri planda bırakılmasını hoş görmemektedir. Bu çerçevede taklidin bir tür işlerlik zeminini tesis eden mezhepleri de çeşitli yönlerden eleştirmektedir. Bûtî ise taklidi adeta (bilen bilmeyen ilişkisi açısından) insan fıtratının tabii bir neticesi olarak görmekte, mutlak taklid karşıtlığını ve bu çerçevede genel mezhep eleştirisini doğru bulmamaktadır. Bu maksatla Hucendî'ye ve genel anlamda selefiyyeye reddiyede bulunarak çalışmamıza konu olan eserini telif etmiştir. Bu çalışmada, aslen Orta Asya Hucend'den olup ömrünün önemli bir dönemini Haremeyn'de geçiren Muhammed Sultân el-Hucendî ile yakın dönem Suriye'sinden önemli ilim adamı Muhammed Saîd Ramazân el-Bûtî'nin taklid ve mezhep olgusu etrafında ortaya koydukları yaklaşımlar konuya ilişkin telif etmiş oldukları eserler bağlamında mukayeseli olarak ele alınmıştır. Böylelikle yakın dönemde birçok akademik çalışmaya konu olan ve halen de olmaya devam eden bir meselenin, eserleriyle topluma tesir eden iki âlim üzerinden bir inceleme ve değerlendirmesinin yapılması amaçlanmaktadır."
