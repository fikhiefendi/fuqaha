abstract: "Hanefîler ve Hadis Usûlü isimli bu araştırma, hadis usûlünün sistematik tedvîninden yaklaşık iki asır önce, Hanefî alimlerin meselelere buldukları çözümler arasına serpiştirdikleri Hanefî hadis usûlünü inşa çabasıdır. Çalışma geçmişten bugüne daima gündemde olan Hanefî mezhebinin hadis alanındaki usûlî prensiplerini, usûl ve fürû' metin okumalarından tahric yöntemiyle derleme gayretidir. Bu araştırma üç bölüm ve sonuçtan oluşmaktadır. Birinci bölümde Hanefî mezhebinin ortaya çıkışı, gelişimi ve kaynakları ele alınmış, hadis usûlü tarihi ve Hanefîlerin hadis usûlüne yaptıkları katkılar ortaya konulmuş; ikinci bölümde hadis ıstılahları ve Hanefîlerin bu konudaki anlayışları sunulmuş, üçüncü ve son bölümde ise Hanefîlerin hadisin sıhhatini tespit kriterleri incelenerek Hanefî hadis usûlü tespite çalışılmıştır."
