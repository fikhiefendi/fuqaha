abstract: "Siyasi ve ekonomik söylemleriyle yakın siyasi tarihimize damgasını vuran Necmettin Erbakan, alternatif iktisadi söylemler oluşturmuştur. Kişiliği üzerinde islam dinin büyük tesiri olan Erbakan, nakşibendilik tarikatının etkisi ile siyasi ve ekonomik düşüncelerini milli görüş ideolojisi alanında pratiğe dökmüştür. Bu çalışmanın amacı Necmettin Erbakan'ın ekonomi söylemlerinin iktisadi kaynaklarını ortaya koyup, onun bu söylemlerini pratiğe ne kadar yansıttığı üzerindedir. Bu amaç doğrultusunda Erbakan'ın islami söylemleri kullandığı tespit edilmiş ve bu söylemlere iten sebeplere değinilmiştir. Öncelikle siyasal ve ekonomi düşünce pratiği olan milli görüş ideolojisi incelenmiştir. Sonrasında Erbakan'ın kapitalizm ve sosyalizm eleştirilerine yer vererek alternatif iktisat önerisi ele alınmıştır. Erbakan ekonomide islam sistemini önermektedir. Bağımsızlar hareketi ile siyaset sahnesine giren Erbakan, 1960-80 arası Türkiye ekonomisinde etkili olan kalkınma planları ve ithal ikameci sanayileşme modelinin etkisiyle sanayileşme söylemini kullanmış ve ülkenin kalkınmasını Ağır Sanayi'ye, Ufki Devletçilik anlayışına ve Bölgesel Kalkınma Şirketlerine dayandırmıştır. Erbakan'ın dile getirmiş olduğu sanayileşme, milli kaynaklara dayanan korumacı bir görünüme sahiptir. Ayrıca Erbakan'ın sanayileşme düşüncesi Bebek Endüstri Tezi, İthal İkameci Sanayileşme Stratejisi, Endojen Kalkınma, Geç Kalkınma ve Büyük İtiş kalkınma teorileriyle benzerlik arz etmektedir. Ufki Devletçilik anlayışı ise, islam ekonomisinde devlete biçilen rolle aynı görüşleri yansıtmaktadır. Bölgesel Kalkınma Şirketleri faizsiz bir sistem üzerine kurulu kar ortaklığı sistemine dayanmaktadır. 1980 sonrası Türkiye ekonomisinin serbest piyasaya dayalı bir sisteme geçmesiyle Erbakan ekonomik söylemini Adil Düzen sloganı üzerine kurmuştur. Adil Düzen, siyasi, dini, sosyal ve ekonomik olarak geniş bir sistemi içinde barındırır. Bu çalışmada Adil Düzen'in ekonomik sistemi ele alınmış ve Adil Ekonomik Düzen olarak ifade edilmiştir. AED, üretim ve kar ortaklığı üzerine kurulu bir sistemdir. Erbakan'ın 1980 öncesi ekonomik söylemlerinin bir nevi devamı olan AED, genel ve temel esasları itibariyle islam ilkeleriyle uyumludur. İslam hassasiyetleriyle hazırlanmış olan AED, Erbakan'ın kapitalizm ve sosyalizme karşı alternatif bir ekonomi teorisidir. Ayrıca AED, üretime önem vermesi ve tek vergi prensibini tercih etmesi nedeniyle arz yanlı iktisat sistemine benzemektedir. Erbakan'ın Adil Düzen söylemi, 1994 yerel seçimlerinde RP'nin birçok belediyeyi kazanmasına vesile olmuş ve RP 1996'da DYP ile koalisyon kurarak 54.Hükümeti kurmuştur. 54.Hükümette Erbakan, Adil Düzen söylemini kullanmamış ancak bu sisteme benzeyen reel ekonomiyi dile getirmiştir. Erbakan bu dönemde üretimi artırıcı politikalara yer vermiş ve kısa dönemde ekonomik göstergelerde iyileştirmeler sağlamıştır."
