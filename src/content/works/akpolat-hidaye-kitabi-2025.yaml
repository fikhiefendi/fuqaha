abstract: "İslam'ın anlaşılmasına bağlı olarak farklı yorumlar ve mezhepler ortaya çıkmıştır. Bu konuda öne çıkan ve en çok müntesibi bulunan İmam-ı Azam Ebû Hanife'ye nispet edilen, Hanefî ve Muhammed b. İdris eş-Şafiî'ye nispet edilen Şafiî mezhebidir. İhtilaf, bu mezheplerin fürû konularının birçok alanında ihtilaflar bulunmaktadır. İhtilaflı konular ilk zamanlar dağınık bir şekilde mezhep kitapları içinde bulunurdu. Hicri IV. asırda bu konuların ele alındığı hacimli kitaplar telif edilmeye başlanmıştır. Zaman içerisinde bu konu ilm-i hilâf olarak ifade edilerek ihtilaflı meseleler tesbit edilmeye ve çıkış sebepleri ortaya konmaya çalışırmıştır. Bu çalışmada İmam Merginânî'nin el-Hidâye kitabının içindeki kitabu'l-buy'u kısmı Hanefî ve Şafiî ihtilaflarını ele alınmaya çalışılmıştır. Merğinânî 27 meselede farklı lafızlarla, İmam Şafiî'nin kendilerine muhalif olduğunu dile getirmiştir. Bu konular ayrı başlıklar halinde, ilgili mezhebin ana kaynakları sayılan kitaplarına bakılarak incelenmiştir. Bu bağlamda, meclis, şart, görme ve ayıp muhayyerliği, araya satışı, îne satışı, fuzulinin satışı, faiz ve faizle ilgili konular, selem akdi, köpek ve yırtıcı hayvanların satışı ve satış sonrası fiyat ve malda artış meselesi gibi konular ele alınmıştır."
