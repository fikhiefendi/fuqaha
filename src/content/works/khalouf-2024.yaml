abstract: "Bu tez, küresel krizler ışığında tekstil endüstrisindeki bir İsticrar Akdinin bazı sorunlarına dikkat çekti. Çalışmada bir İsticrar Akdinin sanayici ve tacirlerle yapılan satış işlemlerinde gerekli olan önemli sözleşmelerden biri olduğu görülmektedir. Çalışmada bir İsticrar satmanın anlamı ele alınmış ve genel bir bakış sunulmuştur. Bu sözleşmeyi ve tekstil fabrikaları üzerindeki etkisini incelemek için, en önemlisi bir İsticrar Akdinin hukuki açıdan tanıtılması, diğer sözleşmelerden ayrılması ve tekstil sektöründe bir İsticrar Akdinin en belirgin şartlarından bahsedilmesi , hukuki hükmünün bilinmesi ve bir İsticrar sözleşmesinin ele alınmasından kaynaklanan hukuki sorunların bilinmesi olan hedefler belirlenmiştir.ve bir İsticrar Akdinin yanlış uygulanmasından kaynaklanan sorunları önlemek için meşru teklifler sunar. Bu hedeflere ulaşmak için, çalışma, fabrika yöneticilerinden uzman uzmanlarla, karşılaştıkları en önemli sorunları bulmak, uygun Şeriat çözümleri bulmalarına yardımcı olmak için görüşme yöntemini kullanarak tümevarımsal analitik yaklaşıma dayanıyordu. Hukuki hukuki çözümler çalışmasının bulguları, İslam iktisadı alanında uzmanlaşmış Şeriat alimlerine, çalışmanın bulguları hakkındaki görüşlerini duymaları için sunuldu. Tezte, bir İsticrarın satışının, eski fakihler tarafından tanınan eski bir satış olduğu sonucuna varılmıştır. Satıcıdan malları ve ihtiyaçları azar azar almak ve ondan sonra ödemek esasına dayanır. Ve terimin girdiği satışlara girdiğini. Bir İsticrar sözleşmesi, içinde birçok şartın bulunduğu, yüklenicilerden birinin veya her ikisinin menfaatlerinin çeşitliliğine göre değişen, her şartın kendine özgü bir hükme bağlandığı sözleşmelerden biridir. Çalışma, para birimlerinin büyük oynaklığı ışığında, alternatif çözümlerden vazgeçilebilirse bir İsticrarın satılmasını önermemekte ve kuralların hüküm ve koşullarına daha fazla araştırma ve dikkat edilmesini önermektedir."
