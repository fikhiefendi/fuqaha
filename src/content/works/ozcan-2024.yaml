abstract: "Bu tezin amacı, Muhammed bin el-Hasen eş-Şeybânî'nin kitaplarını nakleden ravilerin rolünü ortaya koymak ve bu rivayetlerin Hanefi fıkhı üzerindeki etkisini vurgulamaktır. Bu çalışmada, İmam Muhammed bin Hasan'ın hayatına ilişkin kısa bir özet sunulmuş; tevâtür veya meşhur yol ile tespit edilen,“Zâhirurrivaye”kitapları ile âhâd yolla nakledilen“Ğayru zahirrivaye”kitapları tanımlanmıştır. Ayrıca, her bir kitabın ravileri belirlenmiş, tabakât kitaplarına başvurularak ravilerin biyografileri incelenmiş ve İmam Muhammed ile olan yakın ilişkileri detaylı bir şekilde açıklanmıştır. Buna ek olarak, rivayet edilen kitaplarda bulunan nüsha farklılıkları tespit edilmiş ve bu farklılıklar kapsamlı olarak değerlendirilmiştir. Araştırma, bir dizi sonuca ulaşmıştır; en önemlisi şunlardır: Muhammed bin el-Hasen'in“Zahirurrivaye”kitaplarını nakleden raviler arasındaki farklılıklar gerçek bir ihtilafı temsil etmemektedir. Raviler arasında nüsha farklılıklarından kaynaklanan ihtilaflar incelendiğinde, bu farklılıkların çoğunlukla makul ve kabul edilebilir nedenlere dayandığı ortaya çıkmıştır. Bu nedenler arasında, meselelerin hatalı kaydedilmesi, meselelerin içtihat edilebilir nitelikte olması, bazı rivayetlerde fazla ya da eksik bilgi bulunması ya da zamana ve mekâna göre âdetlere dayalı hükümlerin değişmesi gibi etkenler yer almaktadır. Ayrıca, Hanefi fıkhı üzerindeki etkileri belirlemek amacıyla“el-Emâlî”ve“en-Navâdir”kitaplarının etkisi, uzun ve kapsamlı kitaplara başvurularak incelenmiştir. Ravilerin her bir kitabı ya da rivayeti, tablolar aracılığıyla analiz edilerek, bu eserlerin Hanefi fıkhına olan etkisinin derecesi saptanmıştır. Elde edilen sonuçlar, Hanefi fıkhında“el-Emâlî”kitaplarının etkisinin, özellikle“Emâlî Ebî Yûsuf”ile karşılaştırıldığında son derece sınırlı olduğunu göstermiştir. Öte yandan, Hanefi fıkhında sayısal olarak“Ğayru Zahirirrivaye”kitapları arasında en çok rastlanan tür,“en-Navâdir”kitaplarıdır. Her iki türde de nakledilen meselelerin, mezhep içinde yerleşik hale gelip gelmediği ya da tekil kalıp kalmadığı araştırılmış ve bu eserlerin ne ölçüde referans alındığı tablolar aracılığıyla açıklanarak Hanefi fıkhının dalları üzerindeki etkisi ortaya konulmuştur."
