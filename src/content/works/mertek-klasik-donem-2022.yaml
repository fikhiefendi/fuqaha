abstract: "İslam siyaset düşüncesine dair birçok çalışma olsa da yapılan çalışmalar, siyasal olan yerine teoloji üzerinden ilerlemektedir. Bu çalışma, İslam siyaset düşüncesini siyasal kavramından hareketle ele almayı amaçlamaktadır. Özel olarak ise İslam siyaset düşüncesine dair polis ve siyaset üzerinden bir siyasal olan tanımlaması inşa etmeye çalışmaktadır. Bu açıdan polis, hükümet etme aracını ya da iktidarı nitelerken siyaset, adalet sürecini ya da hukuku nitelemektedir. Siyasal olan ise ikisinin etkileşime geçtiği alanda ortaya çıkmaktadır. İslam'ın bir siyasal olana sahip olduğu hipotezini ortaya koymak için Carl Schmitt ve Jacques Ranciere'in siyasal olan kavramına yükledikleri anlamdan hareketle inşa edilen siyasal olan kavramı, İslam siyaset düşüncesinde polis konusunda iktidarın görünümü olan hilafet, imamet ve saltanat üzerinden, adalet süreci olan hukuk konusunda nasihat ve şeriat üzerinden soybilim yöntemi kullanılarak eleştirel bir şekilde ele alınacaktır. Kısacası İslam'ın kendine özgü siyasal olana sahip olduğu ortaya konacaktır. Sonuç olarak İslam siyaset düşüncesi, teoloji yerine siyasal üzerinden ele alındığında kendine özgü bir siyasal olan tasarımının varlığı ortaya çıkmaktadır. Dolayısıyla bu alanda çalışma yapmak teolojiden ziyade siyasalı merkeze alan bir yaklaşımı gerektirmektedir."
