abstract: "Dış yardımlar genel itibariyle bir ülke veya uluslararası kuruluş tarafından başka bir ülkeye veya kuruluşa sağlanan kredi, bağış ve iş birliği destekleridir. Bu anlamda ülkelerin kalkınma süreçlerini teşvik ederek ekonomik ve sosyal gelişimlerine yardımcı olması hedeflenen yardımcı unsurlardır. Dış yardımlar bir yandan alıcı ülkelerin ihtiyaçlarını karşılamaya yönelik sağlanırken, diğer yandan donör kuruluşların kendi amaç ve hedeflerine uygun bir pozisyonda yürütülmüşlerdir. Bu durum dış yardımların performansını doğrudan etkilemektedir. Çalışmamızda en temelde dış yardım ve kalkınma arasındaki ilişki ve bu kapsamda İslam Kalkınma Bankası yardımlarının performansı Sahra altı Afrika ülkelerine ait veriler üzerinden incelenmiştir. Sabit etkiler yöntemi kullanılarak yapılan panel veri analizinde İslam Kalkınma Bankası'na üye 20 Sahra altı Afrika ülkesinin 29 yıllık 9 bağımsız ve bir bağımlı değişkene ait verileri kullanılmıştır. Ortaya çıkan sonuçlar itibariyle dış yardımların bir sürekliliğinin bulunduğu, temel ihtiyaçlara yönelik alanlarda önemli sayılacak faaliyetlerin gerçekleştirildiği fakat etkilerinin daha çok yerel düzeyde ve mikro ölçekte kaldığı görülmüştür. Bu sebeple ilgili ülkelerdeki kalkınma adımlarının ancak bir kısmı dış yardım etkisi ile gerçekleşmiştir ve yapılan tüm dış yardımlara rağmen söz konusu ülkelerde insani gelişme henüz istenen seviyeye ulaşamamıştır. Bu geri kalışın birçok sebebi olmakla beraber kalkınmanın gerçekleşebilmesi için dış yardımların dışında geliştirilmesi ve değiştirilmesi gereken başlıklar olduğu bu sebeple dış yardımlar ile ilgili bir paradigma değişikliğinin gerekliliği yönündeki iddia desteklenmiştir."
