abstract: "Hanefî mezhebinin kurucu imamlarından olan Ebû Yûsuf, mezheplerin oluşmaya başladığı, hadis tedvin ve tasnif çalışmalarının devam ettiği bir dönemde yaşamıştır. Ebû Hanîfe'nin ders halkasında yetişen Ebû Yûsuf, hocasının görüşlerini kaleme almak, bu görüşleri öğrencilerine aktarmak ve bu doğrultuda yeni meselelere hüküm vermek suretiyle Hanefi mezhebinde önemli bir rol oynamıştır. Yeni rivayetlere ulaşması, üstlendiği kadılık vazifesinin etkisi ve hocasıyla gözettikleri ilkelerin farklılığı sonucunda bazı meselelerde Ebû Hanîfe'den ayrı görüşlere sahip olmuş, bu durum mezhebin güncellik ve zenginlik kazanmasına katkıda bulunmuştur. Bu çalışmada Ebû Yûsuf'un fıkıh anlayışının arka planını oluşturan unsurlar incelenmiş, daha çok kendisinin elimize ulaşan eserleri bağlamında usul görüşleri ve onun fıkıh anlayışını özgün kılan hususlar tespit edilmeye çalışılmıştır."
