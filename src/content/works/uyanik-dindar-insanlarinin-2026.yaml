abstract: "Bu araştırma, MÜSİAD üyesi dindar iş insanlarının faiz konusundaki algı, tutum ve pratiklerini sosyolojik bir perspektifle incelemeyi amaçlamaktadır. Çalışma, İslam'ın faiz yasağı ile modern finansal sistemin gereklilikleri arasında ortaya çıkan gerilimin ekonomik karar alma süreçlerinde nasıl anlamlandırıldığını ve yönetildiğini analiz etmektedir. Araştırma, anlayıcı-yorumlayıcı sosyoloji yaklaşımı temelinde fenomenolojik desende tasarlanmış; Konya'da faaliyet gösteren ve kendisini dindar olarak tanımlayan 21 işletme sahibiyle gerçekleştirilen yarı yapılandırılmış derinlemesine mülakatlardan elde edilen veriler tematik analize tabi tutulmuştur. Araştırma bulguları, katılımcıların faize ilişkin değerlendirmelerinin dini, ahlaki ve ekonomik boyutlar etrafında şekillendiğini göstermektedir. Çalışmada, katılımcıların faiz kavramına yükledikleri anlamlar, faiz kullanımına ilişkin tutumları, modern finansal araçlara yönelik yaklaşımları ve bu süreçlerde geliştirdikleri değerlendirme biçimleri incelenmiştir. Elde edilen veriler, dini inançlar ile ekonomik pratikler arasındaki ilişkinin çok boyutlu yapısını ortaya koymaktadır. Çalışma, faiz/riba olgusunun modern ticari hayat içerisinde nasıl yeniden tanımlandığını ve dini inançların ekonomik pratiklere nasıl yön verdiğini ortaya koyarak, Türkiye'de dindarlık, modernleşme ve iş dünyası ilişkisine dair özgün saha verileri sunmaktadır. Ayrıca, dindar iş insanlarının faiz deneyimlerini doğrudan konu alan sınırlı sayıdaki araştırmaya katkı sağlamayı hedeflemektedir. Araştırma bulguları, dindar iş insanlarının ekonomik davranışlarının yalnızca piyasa rasyonalitesi veya dini normlarla açıklanamayacağını; ekonomik kararların dini referanslar, ahlaki değerler, sosyal ilişkiler ve piyasa koşullarının kesişiminde şekillendiğini göstermiştir. Katılımcıların faiz algılarında farklılaşmalar görülmüş; bir kısmı faiz ve ribayı özdeş kabul ederken, bir kısmı modern ekonomik şartlar içerisinde bu kavramlar arasında ayrım yapmıştır. Fenomenoloji perspektifinden değerlendirildiğinde, katılımcıların ekonomik pratiklere yükledikleri anlamların yalnızca finansal tercihlerden ibaret olmadığı; helal kazanç, bereket, kul hakkı ve vicdani sorumluluk gibi kavramların onların gündelik ekonomik deneyimlerinde anlam dünyasının temel unsurları olarak öne çıktığı görülmüştür. Ayrıca dini bilginin farklı otoriteler, sosyal çevreler ve bireysel deneyimler aracılığıyla yeniden üretildiği; kuşaklar arasında ise farklılaşmalar bulunduğu tespit edilmiştir. Genç katılımcıların daha normatif ve keskin sınırlar çizen bir dil geliştirirken, deneyimli iş insanlarının ekonomik zorunluluklarla dini hassasiyetleri müzakere eden yaklaşımlar sergiledikleri görülmüştür. Çalışma, dindar ekonomik aktörlerin modern piyasa düzeni içerisinde dini ve ekonomik anlamları sürekli yorumlayan, müzakere eden ve yeniden kuran aktörler olduğunu ortaya koymaktadır."
