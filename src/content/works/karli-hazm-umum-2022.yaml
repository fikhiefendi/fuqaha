abstract: "Zâhirîlik düşüncesinin en önemli temsilcisi olan İbn Hazm aynı zamanda bu mezhebi sistemleştiren kişidir. Dinin Hz. Peygamber hayattayken tamamen düzenlenip artık değiştirilemez olduğunu düşünen İbn Hazm'a göre ortaya çıkacak her meselenin cevabı Kur'an veya sünnette açıkça mevcut olup mükellefin yorumuna ihtiyaç bulunmamaktadır. Ona düşen yalnızca her şeyin hükmü bulunan bu kaynaklarda verilen bilgileri açığa çıkarmaktır. Bunun için de en temel araç dildir. Lafızları dilde belli manaları karşılamak üzere vazedenin Allah Teâlâ olduğunu kabul eden İbn Hazm'a göre hakikate ancak nasları, dilde konuldukları bu manalara hamletmekle ulaşılabilir. Bir delile dayanmaksızın lafızların dildeki bu manalarına ilave yapmak kıyas iken manadan eksiltmek ise tahsis olup her ikisi de batıldır. Tahsis edildiğine dair bir delil bulunmayan âm nasların delâleti konusunda üç görüş bulunmaktadır: İlki, bu lafızla kastedilenin ne olduğu belirleninceye kadar beklenilmesi gerektiği (tevakkuf), ikincisi lafızların hususi bir anlam için vazedilmiş olup bunun dışında bir anlama delâlet ettiğini söylemek için bir delile ihtiyaç olduğudur. İbn Hazm'ın da içinde bulunduğu çoğunluğun görüşüne göre ise âm lafız tahsis edilmediği sürece bütün fertlerine delâlet eder. Usul alimlerinin büyük çoğunluğu bu görüşte olmakla birlikte âm lafzın fertlerine delâletinin katiliği, kati olmayan delille tahsisinin imkânı, naslar arasında teâruz meydana geldiğinde aralarının nasıl telif edileceği gibi konularda farklı görüşler vardır. Bu çalışmada öncelikle İbn Hazm'ın lafız taksimine yer verilmiş; ardından yukarıda umum-husus konusuyla bağlantılı olduğunu belirttiğimiz meseleler onun perspektifinden ortaya konulmuştur."
