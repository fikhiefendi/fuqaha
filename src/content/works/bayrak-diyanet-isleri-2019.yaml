abstract: "Bu çalışmada DİB Din İşleri Yüksek Kurulu'nun ticari hayatla ilgili bazı karar ve mütalaaların fıkhi açıdan incelenmesi amaçlanmıştır. Bu doğrultuda yardımlaşma usulüyle ev veya otomobil edinme sistemi, network marketing sistemi, gazlı içeceklerin alkollü içecek sayılıp-sayılmayacağı, sigorta, kadınların ticari faaliyeti, güncel ticari meseleler ilgili sorular ve cevapları, çek, senet gibi kıymetli kâğıtların bedelinde indirim yaparak gününden önce tahsili, kredi kartı ile yapılan taksitli alışverişlerde bir miktar fazlalık alınması, kredi kartı ile yapılan alışverişlerde bankanın yaptığı hizmet karşılığında işyeri sahiplerinden komisyon alması, kredi kartı ile altın satışı, kartla satış yapan bir esnafın, alacağını vadesi dolmadan alırsa bankanın para kesmesinin esnaf açısından sorumluluğu, başkasına ait olan markayı izinsiz kullanmak, bunun ticaretini yapmak, para kazanmak; bayanların kendi aralarında yaptıkları günde paraları dönüşümlü olarak almaları, şarap fabrikasına üzüm satmak; gabn-i fâhişle satılan bir maldan elde edilen kazanç, ticarette kâr haddi, bireysel emeklilik ve leasing finansal kiralama sistemi İftâ usulü bakımından değerlendirilmiştir."
