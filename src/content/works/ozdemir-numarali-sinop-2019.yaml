abstract: "Bu çalışmanın amacı, Sinop'un 19. yüzyıldaki ekonomik, sosyal ve kültürel tarihinin anlaşılmasına katkıda bulunmaktır. Bu amaç doğrultusunda H.1 Safer 1286-9 Zilhicce 1289 (M.13 Nisan 1869-7 Şubat 1873) yılları arasını kapsayan 78 numaralı Sinop Şeri'ye Sicili'nin transkripsiyonunu gerçekleştirdik. Ardından defterde yer alan hükümleri belli bir tasnife tabi tutarak açıklamaya çalıştık. Şeri'ye sicilleri Osmanlı tarihi araştırmalarında kullanılan ana kaynaklar arasındadır. Sahip olduğu bölgenin idari, iktisadi, ictimaî yapıları hakkında bilgiler içerir. Şehrin kaza, kasaba, mahalle ve köylerini, burada yaşayan insanların günlük hayatta kullandıkları ev, mutfak, giyim kuşam eşyalarını siciller yardımıyla tespit edebilmekteyiz. Bu kapsamda 78 numaralı defterden yararlanılarak Sinop'un sosyal, kültürel, ekonomik, hukuki ve siyasi hayatı hakkında bilgi sahibi olabiliriz."
