abstract: "Atasözleri, bir toplumun kültürünü anlamada ve dolayısıyla dilin zenginliklerinden haberdar olmada büyük öneme sahip verilerdir. Türkçenin kültürel ve dilsel zenginliklerini Dîvânu Luġâti't-Türk adlı eseriyle ortaya koyan Kâşgarlı Mahmûd atasözleri bağlamında bizim için önemli bir örnek teşkil etmektedir. Dîvânu Luġâti't-Türk'teki Atasözleriyle Arapçadaki Mesellerin Benzerlikleri ve Mukayesesini konu alan bu çalışmanın birinci ve ikinci bölümlerinde atasözü ve mesel kavramları üzerine durulmuş, kısa tanımları yapılmış, atasözlerinin genel özelliklerinden bahsedilmiş, Dîvânu Luġâti't-Türk ve Kâşgarlı Mahmûd hakkında kısa bilgiler verilmiştir. Üçüncü bölümde ise Dîvânu Luġâti't-Türk'te yer alan Karahanlı Türkçesinden Arapçaya çevrilen atasözleri Türkçe ve Arapçalarıyla çalışmaya aktarılmıştır. Daha sonra bütün bu atasözlerinin Arapçaya çevirileri temel çeviri türleri olan biçimsel, dinamik ve eş değer çeviri altında incelenmiş ve bu atasözlerine eş değer ya da yakın anlamlı karşılık gelebilecek günümüz Türkçesi atasözlerine ve Arapça mesellere yer verilmiştir."
