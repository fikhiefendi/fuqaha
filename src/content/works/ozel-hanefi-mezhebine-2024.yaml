abstract: "Klâsik dönemde Hanefî usûlünde daha çok haber-i vâhidi tenkid ölçütü olarak öne çıkan umûmü'l-belvâ kavramı, genel olarak fakihlerin fıkhî hükümlerin tatbikinde umûmî zorluk ve meşakkatlerin giderilmesi için de sıkça başvurduğu bir yöntem olmuştur. Bugün ise meşakkate sebep olan toplumsal meselelere yönelik şer'î çözüm yollarından biri olarak fıkhın dinamik yapısı ve işlevselliğine hizmet eden bir unsur olarak varlığını sürdürmektedir. Bu bakımdan umûmü'l-belvâ çerçevesinden haber-i vâhide yönelik bakış, klâsik fıkıh usûlünün fikrî altyapısını anlamaya yönelik olmaktadır. Bununla birlikte mezkûr kavram penceresinden bugüne ve yarına bakış, kat'î şer'î sınırları ihlâl etmemek kaydıyla meşakkatleri ve zorlukları giderici, hükümleri hafifletici genel bir prensibin potansiyelini anlamaya yönelik olmaktadır. Hanefîleri belvâya yönelten sebepler çeşitlidir. Diğer mezheplerin genellikle zarûret sebebiyle hükümlerde tahfife gidildiği bilinmektedir. Ancak bunu yaparken belvâ kavramından daha ziyâde kendi metodolojik çerçevelerinde farklı kavramlarla bu tahfîfi ifade ettikleri görülmektedir. İtirazların ve tartışmaların daha çok haber-i vâhidin kabul şartlarına belvâ şartı getirilmesiyle ortaya çıktığı görülmektedir. Umûmü'l-belvâ prensibinin maslahat, ihtiyaç, zarûret gibi kavramlarla birlikte hareket ettiği düşünülecek olursa, bu kavramın güncel meseleler üzerinde şer'î sınırların müsaade ettiği ölçüde mükelleflere yönelik şer'î açıdan büyük kolaylıklar sağlayacağı anlaşılmaktadır. Bunun birlikte umûmü'l-belvâda meşakkatin şiddeti ile zarûret arasında sıkı bir ilişkinin bulunduğu anlaşılmış bulunmaktadır. Bu bağlamda şer'î sınırların ve dinin temel gayesinin ihlâl edilmemesi bakımından meşakkatin şiddetinin tespiti büyük önem arz etmektedir. Zira umûmü'l-belvânın suistimâle açık ve müsait yapısı da buradan kaynaklanmaktadır. Nitekim bu endişeyi haklı çıkaracak bir takım temâyüllerin varlığı ve hatta çalışmaların yapıldığı tespit edilmiştir."
