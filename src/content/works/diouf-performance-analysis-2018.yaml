abstract: "Bu tez çalışması esas olarak iki bölümden oluşmaktadır: teorik bir bölüm ve ampirik bir bölümdür. Teorik bölümünde, tez konumuz olan CAMEL yöntemi aracılığıyla ticari ve katılım bankaların performans analizi ile ilgili literatür taramasını yapılmıştır. Genel olarak katılım bankacılık üzerinde durduktan sonra, Afrika ülkelerindeki, özellikle Senegal, Nijerya ve Güney Afrika'daki katılım bankacılık yaklaşımları gözden geçirerek, ticari bankalar ve katılım bankalar arasındaki temel farklılıklarını belirlemeye çalışılmıştır. Daha sonra, 2008 - 2012 finansal krizinden sonra Afrika ülkelerinde bankacılık sisteminin durumuna, özellikle Senegal, Nijerya, Güney Afrika ve Türkiye'de baktık. Bunun ardından bu tezde kullanılan performans analizi yöntemi olarak CAMEL yöntemini açıkladık. Ampirik bölümünde, 2008 - 2012 finansal krizinden sonrasının çerçevesinde, CAMEL yöntemi ile, Afrika ülkelerindeki (Senegal, Nijerya ve Güney Afrika) ve Türkiye'deki 2012 - 2014 yılları arasında, en iyi dört ticari banka ve katılım bankanın performans analizine geçtik. Ayrıca, Afrika ülkeleri ve Türkiye'deki finansal krizden sonra, ticari ve katılım bankanın finansal performansın farklılıkları meydana getirilmek amacıyla Afrika ülkelerinin ticari ve katılım bankalarının finansal performans analizini Türklerinkilerle karşılaştırdık. Afrika ülkelerinde ve Türkiye'de bankacılık sisteminin krizden hemen sonra toparlandı mı? CAMEL yöntemine göre hangi bankalar tarafından daha iyi performans gösterilmiştir."
