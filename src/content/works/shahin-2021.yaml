abstract: "Bu tez Irak ve Mâverâünnehir Hanefî meşâyihi arasında meydana gelen fıkhî ihtilafları mesele, telif tarzı, tanımlama ve illetlendirme (ta´lil) gibi farklı açılardan ele alan bir çalışmadır. Temel hedefi iki ekolü ve aralarındaki ihtilafları ana hatlarıyla ortaya koymak ve bu surette Hanefî mezhebinin tarihsel gelişimini ve mevzubahis iki ekol arasında çıkan ihtilafların miktarını tespit etmeye imkân sağlamaktır. Bu minvalde tezde öncelikle iki ekolü coğrafya ve gelenek açısından tanıttım. Akabinde oluşturdukları literatürü inceledim ve temel ihtilaf noktalarını ve bunların birbriyle olan irtibatını belirlemeye gayret ettim. Bununla birlikte mukayeseli bir şekilde bazı örnekler üzerinden iki ekol âlimlerinin temel hedef ve gayelerini tespit etmeye, böylece de eser telif ederlerken yahut herhangi bir meseleyi tarif ve ta´lil ederlerken nelere göre hareket ettiklerini de ortaya çıkarmaya çalıştım. Ardından daha sonraki dönemlerde yaşayan ulemânın bu iki ekol müntesipleri arasında ihtilafın bulunduğunu söylediği meseleleri topladım. Ekollerin tanıtımı coğrafî ve zamansal açıdan yapıldı ve her birinin ilmî silsilesi ve isnatları zikredildi. Ekollerin etkileşimi, hoca-talebe ilişkisi, birbirlerinin eserleri üzerine yaptıkları çalışmalar ve teliflerindeki ana gayelerdeki devamlılık başta olmak üzere muhtelif açılardan ele alındı. Ekolerin ihtilaf yönleri; teliflerdeki gaye, tanımlama ve kısımlandırmada takip edilen yöntem, usulî ve kelâmî görüşlerin etkisi, istidlal yöntemleri, örf ve adet, mezhep imamlarından yapılan rivayetlerdeki tercihler gibi çeşitli açılarından tetkik edildi. Temel olarak karşılaştırmalı ve betimleyici bir yöntem takip edilen bu tezde pek çok önemli sonuç elde edildi. Bunların bir kısmı şu şekildedir: (i) İki ekol arasında pek çok açıdan ciddî benzerlikler söz konusudur. Aralarındaki ihtilaflar onları mutlak anlamda ayırmayı ve tamamıyla farklı olduklarını söylemeyi gerektirecek kadar değildir. Bilakis ilmî gelişim ve olgunluğu temsil eden doğal farklılıklardır. (ii) Mâverâünnehir ekolü aslında Irak ekolünün doğal bir uzantısıdır. (iii) İki ekol arasındaki amaç farklılıklarının ortaya konması gerek ekol gerekse de meselelerin pek çok önemli yönden daha vazıh hale gelmesine katkı sağlamıştır. (iv) Herhangi bir ekole dair vukufiyet kesbetmek için onlardan sadece birinin eserlerini incelemek yeterli değildir, muhakkak birlikte mütalaa edilmelidirler."
