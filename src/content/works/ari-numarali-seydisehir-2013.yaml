abstract: "Bu çalışmamızda toplumun çekirdeğini ve en büyük dinamiğini oluşturan aileyi ele aldık. Osmanlı İmparatorluğu?nun son dönemi Seydişehir?deki ailenin özellikleri, evlilik, nafaka takdiri, talâk, muhala?a, borç ve miras gibi çeşitli davaların uygulanışı, şer?iyye sicili belgelerinden hareketle nasıl çözüldüğü ortaya çıkarılmıştır. Osmanlı sosyal hayatının mikro tarih anlamında örneklerini teşkil eden köy ve mahallenin Seydişehir'deki yapısı ve fonksiyonları ele alınmıştır. Belgelerde genel olarak miras, borç, boşanma, evlilik, nafaka, mehir borcu gibi davalar bulunmaktadır. Seydişehir mahkemelerinde davaların nasıl çözüldüğü ve bu davalara getirilen çözümler gün ışığına çıkarılmıştır. Seydişehir?de temel tüketim ürünlerinin neler olduğu ve hangi ürünlerin yetiştirildiği ortaya konularak Seydişehir?inin iktisadi hayatına dair somut bilgilere ulaşılmıştır. Bu çalışmamızın sonucunda, Seydişehir?inin dolayısıyla Osmanlı Devleti?nin, hukukî, iktisâdi, sosyal, idari ve aile tarihine ışık tutabilecek belgeler gün ışığına çıkartılmaya çalışılmıştır. Ticaret, tarım ve hayvancılık ve eğitim gibi konularda olduğu gibi Osmanlı Devleti bünyesinde yaşayan toplumlar arasında oluşturulan düzene bir kez daha şahit olunmuştur. 233 Numaralı Defter?de yer alan Seydişehir?e bağlı yerleşim birimleri ve belgelerin tasnifi üzerinde durulmuştur. I. Bölümde çalışmamızın amacı ve Seydişehir tarihçesi, II. Bölüm?de genel bir değerlendirme yapılmış. III. Bölüm?de ise metnin transkripsiyonu ve orijinali verilmiştir. Özetle bu çalışma ile elde edilecek somut veriler ışığında Seydişehir?in sosyal ve iktisadi yapısını ortaya çıkararak hem şehir tarihçiliğine hem de Osmanlı tarihiyle ilgili bilgilerimize katkı sağlamak amacıyla araştırmacıların istifadesine sunulmuş olacak."
