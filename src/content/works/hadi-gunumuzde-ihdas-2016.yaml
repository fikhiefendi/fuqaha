abstract: "Şüphesiz İslâm aileye çok önem vermiş ve ailenin oluşumunu sağlayacak temel etkenlerin bulunulmasına da yardımcı olmuştur. Başta aile çekirdeğini oluşturan eşler olarak aralarında güçlü bir muhabbet bağını kurup diğer dinlerden çok farklı olduğunu ortaya koymayı başarmıştır. Bu doğrultuda biz de ailenin ilk oluşum taşı olacak olan evlilik akdi ve günümüz dünyasındaki çok farklı şekillerini gerek İslâm hukuku gerekse Türk Medeni Kanunu çerçevesinde değerlendirmeyi önemli bularak bu sahada bir araştırma ihtiyacını duyduk ve“Günümüzde İhdâs Edilen Evlilik Çeşitlerinin Fıkhî Hükmü”başlığı altında bir araştırma yaptık. Özellikle günümüz dünyasında çok yaygın olan evlilik çeşitlerine değinerek her birisinin hem İslâm hukuku hem de Türk Medeni kanununa göre nedenlerini ve hükümlerini objektif bir şekilde açıklamaya çalıştık. Bununla beraber sorumsuz ve gafil davranan kişileri uyarmak adına söz konusu evlilik çeşitlerinin birey, aile ve toplum üzerindeki olumsuz yankılarını ve tehlikelerini açıkladım ki okuyucu gerçek evlilik ve ailenin manasını kavrayabilsin. Ele aldığımız bu çalışma, aslında okuyucuya gerçek ve doğru evliliği açıklayarak toplumdan kötü zan ve endişeyi uzaklaştıracak etkenlere de sahiptir. Zira güvenirlilik problemine sıkça vurgu yaparak bunun bir parçasının güven ve sadakat olduğunu açıklamaya çalıştık. Evlilikten maksadın nesli, ırzı, nefsi, aileyi ve toplumu korumak olduğu fikri de araştırmamızın önemli bir kısmını oluşturmaktadır. Dolayısıyla başka din ve mezheplerde olduğu gibi İslam'ın, evliliğin gerçekleşmesi için istediği (bazı istisnalar dışında) özel şartların da olamayacağının da altını çizdik. Ayrıca İslâm çerçevesi dâhilinde gerçekleştirilecek olan evliliklerin kadın hakları bazında daha tutarlı ve yerinde olacağına da işaret ederek Türk Medeni Kanununda olduğu gibi veli izni olmaksızın gerçekleştirilen evliliklerin hezeyanları olabileceğini de söylemekten çekinmedik"
