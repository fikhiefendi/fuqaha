abstract: "Köle, özgür olmayan, mal gibi alınan satılan, bir efendiye bağlı, hukukî, iktisadi, sosyal bakımlardan hürlerden daha aşağı statüde olan kimse şeklinde tarif edilir. Köle hem erkek hem kadın köle için kullanırken kadın köle, özel olarak 'câriye' kelimesi ile ifade edilir. Köle anlamında abd, rakâbe, meleket eymân, feteyat, eme, aniî, hâdim, ğulam, kınn, memluk, odalık kelimeleri de kullanılır. Kölelik, kişiyi mal edinme, herhangi bir akit yapma, bir sorumluluğu alma, evlenme gibi birçok yönden mahrum bırakan bir durumdur. Kölelik müessesesi insanlık tarihi boyunca farklı şekillerde var olduğu bilinmektedir. İslâm geldiğinde de kölelik var olan bir kurumdu. İslâm'ın kölelik ve câriyelik konusunda ortaya koyduğu hükümleri anlamak için bazı büyük medeniyetlerde ve semavi dinlerde köleliğin tarihi seyrini ve uygulamasının nasıl yapıldığını bilmenin faydalı olacağını düşündüğümüz için Mısır, Roma, Çin, Hint, Yunan gibi medeniyetlerinde kölelik uygulaması, kölelerin hukukî statüsü ve kölelik sebepleri gibi konuları inceleyip İslâm'ın bu konulardaki yaklaşımını ele aldık. Bu konu hakkında bilgi verdikten sonra İslâm hukukunda câriyelerin evliliği ve boşanması ile ilgili hükümleri inceledik. Akabinde hususi olarak istifrâş konusunu inceleyerek fıkhî mezhepler ile çağdaş araştırmacıların kadın esirlerin istifrâşı meselesine dair temellendirmelerini ve görüşlerini ele aldık. Çalışmamızda dokümantasyon yöntemiyle araştırma yaptık. Tümevarım, tümdengelim ve kıyas bilimsel araştırma yöntemleri de kullanılarak sonuca ulaştık. Başta tefsir ve hadis ilminin kaynaklarından, tarihi konuları ihtiva ettiği için tarih bilim dalının verilerinden, istifade ettik. Bu sebeple disiplinlerarası bir çalışma ve araştırma yaptık. Araştırmamız sonucunda her medeniyet kölelik kurumu için belli düzenlemeler yapmış olduğunu; İslâm geldiğinde de var olan kölelik müessesesi için şahsi ve hukukî haklar, iyileştirici düzenlemeler getirdiğini tespit ettik. Bu hükümler ve haklar kapsamında düzenlenen konulardan biri de aile hukukunda câriyelerin hukukî konumu olmuştur. Kur'ân ve sünnette var olan bu düzenlemelerin daha sonra İslâm hukukçuları tarafından tafsilatlı hale getirilmiştir. Savaşta esir olan kadınların istifrâşı hakkında ise klasik dönem İslâm âlimleri ve günümüzde bazı istifrâşı kabul etmeyen çağdaş araştırmacılar farklı görüş beyan ederek; görüşlerini temellendirmişlerdir."
