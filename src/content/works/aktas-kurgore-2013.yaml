abstract: "Bu çalışmada zekâtın harcama kalemlerinin, Kur'an bütünlüğü içinde ele alınması ve tanımlanması amaçlanmıştır. Çalışmamız giriş, üç ana bölüm ve sonuç kısımlarından oluşmaktadır. Giriş bölümünde amaç ve kapsam belirtilerek, konuyla ilgili daha önce yapılmış olan çalışmalara değinilmiştir. Birinci bölümde konunun kavramsal çerçevesi verildikten sonra zekâtın ve harcama kalemlerinin tarihçesi, Kur'an'ın nüzul süreci içinde ortaya konulmuştur. İkinci bölümde zekâtın sekiz harcama kaleminin, tanımlarına, bunlarla ilgili fakîhlerin görüşlerine, Kur'an'da bu kavramların nasıl kullanıldığına ve günümüzde nasıl anlaşılması gerektiğine temas edilmiştir. Üçüncü bölümde ise zekâtın harcanamayacağı yerlere, harcama kalemleri açısından zekâtın hedeflerine ve harcama ile ilgili bazı tamamlayıcı bilgilere değinilmiştir. Sonuç bölümünde ise ulaştığımız neticeler ve temennilerimiz özet olarak verilmiştir."
