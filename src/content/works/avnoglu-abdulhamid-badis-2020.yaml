abstract: "Cezayir'de İslam'ı canlandırmak ve Cezayirlileri Fransız sömürgesinin pençesinden kurtarmak için bir tefsir kaleme alan çağdaş bilim adamı Abdülhamid b. Bâdîs, Kur'an-ı Kerim'i yirmi beş yıl içerisinde tefsir etmiştir. Bu bağlamda bu çalışmada Abdülhamid b. Bâdîs'in yazmış olduğu tefsirde Makâsidî Tefsir ele alınmıştır. Çalışmada Bâdîs'in şeriatın hedeflerine, yöntemine ve esasına yönelik katkıları olan bir ilim adamı olduğu açığa çıkarılmaya çalışılmıştır. Tüm bu hususların yanı sıra dinî metinlerin anlaşılmasının gerekliliği ortaya konulmuş ve fetvanın güncel konumunu koruduğu tespit edilmiştir. Çalışmanın cevaplamaya çalıştığı ana soru ise şudur: İbn Bâdîs'in tefsirinde Makâsidî Tefsir'den söz edilebilir mi? Bu sorunun cevabı şu sorular cevaplanarak elde edilebilir: 1. Abdülhamid b. Bâdîs kimdir? 2. O, tefsirinde özel bir metot kullanmış mıdır? 3. Makâsidî Tefsir nedir ve neden önemlidir? 4. İbn Bâdîs'in tefsirinde Makâsidî Tefsir'den söz edilebilir mi? Bu çerçevede çalışma giriş ve dört bölüme ayrılmıştır. Girişte konunun genel çerçevesi çizilmiş ve konu hakkında temel sorunlar, nedenler ve amaçlar tanımlanmıştır. İlk bölümde İbn Bâdîs'in hayatı ele alınmış, ikinci bölümde Makâsidî Tefsir'in çerçevesi çizilmiş, üçüncü bölümde İbn Bâdîs'in tefsirinde kullandığı metot ve kaynaklar irdelenmiş ve dördüncü bölümde Makâsid ilmi etraflıca ele alınmış ve bu ilmin bölümleri incelenmiştir. Tam da bu bağlamda İbn Bâdîs'in tefsirinde Makâsid ilmini nasıl uygulamaya çalıştığı ortaya çıkarılmaya çalışılmıştır. Son olarak İbn Bâdîs'in Makâsid ilmine olumlu baktığı ve bu ilmi reform projeleri kapsamında kullandığı ortaya çıkarılmıştır."
