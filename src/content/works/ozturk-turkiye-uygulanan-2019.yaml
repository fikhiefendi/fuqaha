abstract: "Son yıllarda ülkemizde yüksek konut maliyetleri, enflasyon ve yüksek faiz nedeniyle konut finansmanı sorunu yaşayan orta ve düşük gelirli bireyler için çözüm üretmek amacıyla farklı yöntem ve araçlar ortaya konulmaya başlanmıştır. Faiz hassasiyeti olan ve gelirleri düzenli olmayan sektörlerde çalışan müşterilerin banka finansmanı yerine esnek geri ödeme imkânı sunan finansman türlerini tercih etmeleri, faizsiz ve ortaklığa dayalı konut finansman seçeneklerinin önemini artırmıştır. Bu kapsamda geliştirilen elbirliği sistemi bu araştırmanın konusunu oluşturmaktadır. Bu çalışmada bankacılıkta uygulanan konut finansman sistemi ile elbirliği sistemi belirli bir anapara tutarı ve vade örneği üzerinden karşılaştırılmıştır. Objektif ve gerçekçi bir karşılaştırma yapabilmek için son 10 yılın enflasyon oranları ve konut fiyat endeksleri esas alınmış, dolayısıyla konut finansmanı için gereken tutarın enflasyon ve konut fiyat artışları karşısındaki gerçeğe en yakın değerleri kullanılmıştır. Çalışma sonucunda elbirliği sisteminde çekiliş sonucu finansmanını 33. aydan sonra teslim alan katılımcıların maliyet açısından avantajını kaybettiği sonucuna ulaşılmış, her iki sistemin tüketiciler açısından avantaj ve dezavantajları ortaya konularak önerilerde bulunulmuştur."
