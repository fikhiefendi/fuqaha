abstract: "Bu çalışma, bankacılık sektöründe veri yönetişimi ve yönetiminin kritik önemine odaklanarak, veri güvenliği ve uyumluluk, veri yönetim stratejileri ve süreçler, eğitim, erişilebilirlik ve karar destek sistemleri gibi temel alanları kapsamlı bir şekilde değerlendirmiştir. Bu araştırma, bankanın veri yönetimi uygulamalarını ve çalışanların bu süreçlere yönelik algılarını anlamak için özel olarak geliştirilmiş bir“Veri Yönetimi Ölçeği”anketi kullanmaktadır. Araştırmanın bir parçası olarak, demografik değişkenlerin- yaş, cinsiyet, eğitim durumu, gelir düzeyi ve medeni durum-veri yönetimi algıları ve pratikleri üzerindeki etkileri de incelenmiştir. Tezin bulguları, Kuveyt Türk Katılım Bankası'nın veri yönetimi alanında sağlam bir temele sahip olduğunu, ancak sürekli değişen teknolojik ve düzenleyici çevre karşısında bu alanlarda devamlı gelişim ve güncellemelerin gerekli olduğunu ortaya koymaktadır. Ayrıca, çalışanların veri yönetimi konusundaki eğitim ve becerilerinin geliştirilmesi, veriye dayalı karar alma süreçlerinin daha etkin hale getirilmesi ve demografik çeşitliliğe duyarlı yaklaşımların benimsenmesi gerektiği vurgulanmıştır. Bu çalışma, katılım bankacılığında veri yönetimi ve yönetişim uygulamalarının daha iyi anlaşılmasına ve geliştirilmesine yönelik önemli katkılar sunmakta ve bankanın veri yönetimi stratejilerinin ve politikalarının etkin bir şekilde şekillendirilmesi için değerli önerilerde bulunmaktadır. Bu çalışma, aynı zamanda, katılım bankacılık sektöründe veri yönetimi uygulamalarının optimizasyonu ve genel performansın artırılması için önemli içgörüler sağlamaktadır."
