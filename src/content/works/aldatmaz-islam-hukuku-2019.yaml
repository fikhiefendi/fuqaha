abstract: "İslam hukuk usulünün ictihada uygun yapısı bulunmaktadır. İslam hukukçularının nassları anlama ve tıbbî verilerin elde edilmesi gibi çeşitli sebeplerle ihtilaflar meydana gelebilmektedir. Uyuşturucu maddeler ve tütün ürünleri İslam hukukunu yüzyıllardır meşgul eden konulardır. İslam hukukçuları kendi dönemlerinde ulaşabildikleri verilere göre farklı ictihadlarda bulunmuşlardır. Tezin giriş bölümünde uyuşturucu maddelerin ve tütün ürünlerinin tarihçesine, çeşit ve etkilerine yer verilmiş, haram, mekruh ve mubahın kavramsal çerçevesi ele alınmış ve tıp ve hukuk arasındaki ilişkisi incelenmiştir. Birinci bölümde uyuşturucu madde kullanılmasının hükmü, ehliyete etkisi, necis sayılmaları ve ticaretleri incelenmiştir. İkinci kısımda ise tütün mamullerinin kullanılmasının ticaretinin hükmü incelenmiştir. Tezin sonuç bölümünde ise uyuşturucu ürünler ve tütün mamulleri hakkındaki fetvaların farklılıkları bütünsel olarak değerlendirilmiştir. Sonuç olarak İslam hukukçularının ictihadları arasındaki farklılıklarda nassların etkisi olduğu kadar tıbbî verilerinde önemli bir payı olduğu bu nedenle özellikle tıp alanında elde edilen yeni verilere bağlı olarak görüş farklılıklarının ortaya çıkabildiği anlaşılmaktadır."
