abstract: "İbn Sînâ'nın lafzın delâlet yollarını açıklarken mantık kitaplarında ilk kez ortaya koyduğu mutabakat, tazammun ve iltizam ayrımı çeşitli eserlerinde dile getirerek şekillendirdiği, beş tümel ve tanım ile ilgili bahislerde de kullandığı özgün bir teori olarak ortaya çıkar. İbn Sînâ'nın ardından Gazzâlî teorinin dakikleştirilmesi için bazı girişimlerde bulunur ve iltizam delâletinin ilimlerde/tanımlarda terkine yönelik eleştirinin ilk adımını atar. Onun teoriye dair yorumlarını farklı mantık eserlerinde ve fıkıh usulü gibi eserlerinin mantık bölümlerinde bulmak mümkündür. Son olarak Râzî, teoriyi detaylı bir incelemeye tâbî tutar, delâlet türlerini aklî ve vaz'î olarak sınıflandırır, iştirak problemine haysiyet kaydı çözümünü sunar, Gazzâlî'nin ortaya koyduğu iltizam eleştirisini ona belli noktalarda katılmakla beraber farklı katkılarla geliştirir. Böylece sonrakilere de onun eserleri vasıtasıyla aktarılarak tartışılmaya devam edilecek bir mesele bırakır."
