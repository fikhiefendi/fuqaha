abstract: "Bu tezde, İslam aile hukukunun temelini oluşturan konulardan nikâh, akdi gerçekleştiren tarafların maksatları yönünden ele alınmıştır. Söz konusu akitte irade beyanında bulunan tarafların nikâhtan amaçladıkları gayeye binaen, geçmişten günümüze nikâh, farklı adlandırmalarla bu akit şekillerinin ortaya çıkış nedenleri ve Fıkıh âlimlerinin konu hakkındaki görüşleriyle birlikte incelenmiştir. Konu ele alınırken, belli bir mezheple sınırlı kalınmamış, genellikle dört fıkıh mezhebinin görüşlerine yer verilmiştir. Tezimiz üç ana bölümden oluşmaktadır. Birinci bölümünde tezin konusuna temel teşkil etmesi açısından nikâh kavramı tanımlanmış, nikâhın meşruluğu ve hükmü incelenmiş ve kısaca nikâhın Kur'an, sünnet ve sosyal açıdan değerlendirilmesine temas edilmiştir. Araştırmamızın ikinci bölümünde ise, kavramsal olarak ele alınan nikâhın, rükün ve şartlarına tafsilatlı şekilde yer verilmiştir. Bu şekilde nikâh için gerekli esaslar ile nikâhın gerçekleşmesini, sahih, geçerli ve bağlayıcı olmasını sağlayan şartlar ele alınarak, nikâhın akitsel özelliği incelenmiştir. Üçüncü bölümde ise, nikâh taraflarının evlenmeden maksatları ve bu maksatların icra edilen akdin hükmüne etkisi incelenmiştir. Bunun için öncelikle maksat kavramı üzerinde durulmuş, kastın tanımı ve ilişkili olduğu kavram ile külli kaideler ele alınmıştır. Sonrasında ise tarafların farklı maksatlarla gerçekleştirdikleri nikâh türleri sıralanmıştır. Maksadın etkisiyle şekillenen farklı nikâhların her biri ayrı başlıklar altında keyfiyet, tanım ve fıkhi hüküm açısından incelenmiştir. Netice itibariyle tezimizde icra edilen bir nikâh akdinde, akit taraflarının maksat ve niyetlerinin, akdin sıhhat ve geçerliliğine etkisi hususunda Fıkıh âlimlerinin farklı görüşlerinin bulunduğu belirlenmiştir. Tezimizin sonuç bölümünde de öncesinde ayrı ayrı ele alınan nikâhların mahiyetinin genel değerlendirmesi özet şeklinde sunulmuştur."
