abstract: "İslam hukukunun çatısı altında ele alınan ve İslam âleminde özellikle teknolojinin ilerlemesi, ulaşım araçlarının farklılaşması, tıbbi tedavi yöntemlerinin ilerlemesi vb. konularda fıkıh meclisleri tarafından yapılan içtihada heyet içtihadı denir. Zamanımızda meydana gelen problemlerin ve olayların zorluğu, karmaşıklığı ve birden çok bilim dalı ile sıkı ilişkisi, kendi alanında uzman ilim adamlarının bir araya gelerek çözüm üretmesini zorunlu hale getirmiştir. Bu durum farklı alanlarda uzman olan bilim adamlarının bir araya gelerek heyet halinde çalışmaları ihtiyacını doğurmuştur. Orijinal ifadesiyle“الاجتهاد الجماعي ”olarak bilinen kavramı dilimize“cemaat içtihadı”,“grup içtihadı”,“kollektif ictihad”,“topluluk içtihadı”,“heyet içtihadı”vb. ifadelerle çevirmek mümkündür. Heyet içtihadı, insanların ihtiyaçlarının çoğalması karşısında çözüm yollarının da artması, ilmi disiplinlerin oluşmasıyla birden çok bilim dalının sıkı ilişki içerisinde olmasından dolayı fukahanın çözüm üretme yöntemlerinden biridir. Konuyla ilgili olarak Arapça bazı kitap ve makaleler kaleme alınmıştır. Ancak ülkemizde bu konuyla ilgili birkaç makalenin dışında herhangi bir akademik çalışma ve kitap bulunmamaktadır. Bu çalışmamız giriş, iki bölüm ve sonuçtan oluşmaktadır. Giriş bölümünde çalışmamızın konusu, önemi ve yöntemi ile ilgili teknik bilgilere yer verilmiştir. Birinci bölümde heyet içtihadının tanımı, heyet içtihadının önemi, şura ve icmanın tanımı, heyet içtihadı ile icma arasındaki fark, heyet içtihadının tarihi seyri, heyet içtihadında kullanılan şartlar ve içtihadın hükmü hakkında bilgi verilmiştir. İkinci bölümde günümüzde heyet içtihadına olan ihtiyaç, heyet içtihadının işlevi ve İslam âleminde kurulan fıkıh meclislerinin heyet içtihadını uygulamadaki rolü ile ilgili bilgilere yer verilmiştir. Sonuç bölümünde ise heyet içtihadı ile ilgili genel bir değerlendirme yapılmıştır."
