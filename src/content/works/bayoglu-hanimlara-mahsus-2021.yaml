abstract: "“Hanımlara mahsus haller”başlığı altında topladığımız; hayız, nifâs ve istihâza halleri ile vajinal akıntılar; fizyolojik boyutuyla tıp ilminin, birtakım dinî engellere sebep olması bakımından da fıkıh ilminin araştırma konusu olmuştur. Çalışmamızda hanımlara özel haller, tıp ilmi ve İslam Hukuku perspektifinden ele alınmıştır. Tıp literatüründe uterin kanamalar; normal uterin kanamalar ve anormal uterin kanamalar olarak ikiye ayrılırken; fıkıh ilminde hayız, nifâs ve istihâza olarak üç başlıkta işlenmiştir. Müslüman kadınların yaşamlarının her döneminde karşılaşabilecekleri bu vajinal kanamaların türünün tespit edilmesi ve bu doğrultuda bir hükme varılması amacıyla tıbbî bilgiler ışığında Hanefi mezhebine mensup müctehid imamların görüşleri incelenip, hangi görüşlerin tıbbî veriler ile uyum içerisinde olduğu tespit edilmeye çalışılmıştır."
