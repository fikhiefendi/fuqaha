abstract: "Kur'ân'ı Kerim, nüzulünden itibaren farklı açılardan çalışmalara konu edinilmiş olup söz konusu çalışmaların bazıları eleştirel bir bakış açısına sahiptir. Bu eleştiriler de kendi aralarında farklılık göstermektedir. Bunlardan bir kısmı bazı âyetlerin akla aykırı olduğu veya Kur'ân'ın vahiy ürünü olamayacağı iddiaları üzerine inşa edilmiştir. İşte bu çerçevede birçok eser kaleme alınmıştır. Bu eserlerde Kur'ân'ın, insanlığa fayda sağlamayan, bilakis insanları uyuşturan ve bilim ile teknolojinin gelişimine engel teşkil eden bir sistem sunduğu ileri sürülmüştür. Klasik dönemde Kur'an'a yönelik eleştiriler, genel olarak metnin kaynağı, dilsel yapısı ve teolojik muhtevası etrafında şekillenmiştir. Bu çerçevede tartışmalar Kur'an'ın ilahî vahiy olup olmadığı, önceki kutsal metinlerle ilişkisi, Arapça üslubu ve belâgati, kıssaların mahiyeti ve tarihsel değeri, gaybî haberlerin niteliği, nesh olgusu ve bazı âyetler arasında ileri sürülen ihtilaf iddiaları gibi başlıklar üzerinden yürütülmüştür. Çağdaş dönemde ise kadının toplum içindeki rolünün güçlenmesiyle birlikte Kur'ân'a yönelik eleştirilerin yoğunlaşmasına karşılık Müslümanların da savunmacı nitelikte çalışmalarını artırdığı görülmektedir. Bu bağlamda İlhan Arsel, çağdaş ve seküler bakış açısıyla Kur'ân'daki kadın imajını en sert biçimde eleştiren isimlerin başında gelmektedir. Ona göre Kur'ân'ın sunduğu sistem, özellikle kadınların özgürlüğünü kısıtlayan ve onları erkeklerin kölesi konumuna indirgeyen bir yapı ortaya koymaktadır. Bu çalışma, Arsel'in Kur'an'a karşı iddialarını kadın özelinde dile getirdiği Şeriat ve Kadın adlı kitabını merkeze almakta ve onun kadın temalı Kur'ân âyetlerine yaklaşımı ile klasik dönemden günümüze kadar oluşan tefsir müktesabatının genel bakış açısını mukayeseli bir biçimde değerlendirmeyi amaç edinmektedir. Çalışma, tek bir bölüm ve bu bölüm kapsamındaki iki ana başlıktan oluşmaktadır. Birinci başlıkta, Arsel'in perspektifinden İslam öncesi Arap ve Türk toplumlarında kadının özgürlük durumu ele alınmaktadır. İkinci başlık altında ise Arsel'in Kur'ân'daki kadın temalı âyetlere yönelttiği iddialar incelenmekte ve bu iddiaların, klasik ve modern tefsir literatüründeki müfessir bakış açılarıyla genel manada mukayeseli bir değerlendirmesi yapılmaktadır."
