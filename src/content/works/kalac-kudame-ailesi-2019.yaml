abstract: "Hadis tarihinde bazı aileler, yetiştirdikleri muhaddis âlimlerle ön plana çıkmış ve bu alana ciddi bir katkı sağlamışlardır. Bu ailelerden birisi de Kudâme ailesidir. Önceleri Filistin'in Nablus kenti yakınlarında yer alan Cemmâil Köyü'nde ikamet eden Benî Kudâme fertleri, Hicri VI. asırda Kudüs başta olmak üzere İslâm coğrafyasını tehdit eden Haçlı seferlerinden dolayı nispeten daha güvenli bir yer olan Dımaşk'a göç etmişlerdir. Hanbelî mezhebine mensup olan bu aile, Dımaşk'a göç ettikten sonra kendileriyle özdeşleşmiş bir ilim kenti olan Salihiyye Mahallesi'ni inşâ etmiş ve Hicri VI.-IX. (XII.-XVI.) yüzyıllarda Hadis ilminde çok önemli muhaddis âlimler yetiştirmiştir. Nitekim Hadis ilmi açısından bu ailede yetişen âlimler arasında Abdulğanî el-Makdisî (ö.600/1203), İbn Kudâme el-Makdisî (ö.620/1223), Ziyauddin el-Makdisî (ö.643/1245), İbn Abdülhâdî el-Makdisî (ö.744/1343) ve İbnü'l-Mibred el-Makdisî (ö.909/1503) gibi önemli simâlar bulunmaktadır. Bu âlimler, hem şahsi meziyetleri hem de hadis ilminde ortaya koydukları eserler ile İslâm ilim geleneğinde önemli bir yer edinmiş ve Dımaşk'ta Hanbelî mezhebinin yegâne temsilcileri haline gelmişlerdir. Bu araştırma, Hadis ilmi açısından önemli bir yer edinen Kudâme ailesinin hadis kültüründeki yeri ve ailede yetişen muhaddis âlimlerin hadis/sünnet yaklaşımlarını tespit etmeyi amaçlamaktadır. Çalışmada öncelikle bu ailenin ilmi hayatı ele alınmış ve Salihiyye Mahallesi'nde inşâ edilen ve hadis öğrenimi açısından önemli kurumlardan olan medrese, darülhadis, dârü'l-Kuran ve camiî gibi çeşitli yapılar tanıtılmıştır. Daha sonra bu ailede yetişen erkek ve hanım muhaddis âlimlerin biyografilerine, ilmi faaliyetlerine ve hadis ilmi açısından telif ettikleri eserler hakkında bilgi verilmiş ve akabinde ailedeki bazı muhaddislerin usûl eserlerinden istifade edilerek haberler ve haberlere ilişkin meselelere genişçe yer verilmiş ve bu âlimlerin hadis/sünnet yaklaşımları ortaya konulmuştur."
