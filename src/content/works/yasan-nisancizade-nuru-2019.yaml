abstract: "Şeyh Bedreddin tarafından kaleme alınan ve uzun yıllar kâdıların el kitabı olarak kullandığı yargılama usulü alanındaki önemli örneklerinden Câmi'u'l-Fusûleyn'i, Şeyh Bedreddin'den yaklaşık iki yüzyıl sonra yaşamış Nişancızâde ıslah etmek amacıyla düzenleyerek Nûru'l-'Ayn fi Islâhi Câmi'i'l-Fusûleyn adlı eseri telif etmiştir. Bu çalışma Nûru'l-'Ayn'ın 25 ve 31. fasıllarıyla Câmi'u'l-Fusûleyn'in 26 ve 32. fasılları arasının karşılaştırılmasını ve incelenmesini amaçlanmıştır. Bu fasılların içerdiği başlıklar ve konular genellikle aynı olup Nişancızâde gerekli gördüğü yerlerde değişiklikler yapmıştır. Araştırmamız iki bölümden oluşmaktadır. İlk bölümde iki eser arasında muhteva mukayeyesi yapılmıştır. Muhteva mukayeyesinde önce iki eser arasındaki ortak olan konuların neler içerdiği fasıllara göre kısaca anlatılmış ardından üslup ve telif tarzından kaynaklanan farklılıklarla konu bakımından farklılıklara değinilmiştir. Bu farklılıklarda Nişancızâde'nin nerelerde hangi yöntemlerle tasarrufta bulunduğu ve bu tasarruflarıyla nasıl bir ıslah çalışması yaptığı incelenmiştir. İkinci bölümde ise Nûru'l-'Ayn' ın 25-31. fasılları, aralarında bazı farkların bulunduğu iki farklı müellif nüshası baz alınarak tahkik edilmiştir."
