abstract: "Hanefi Mezhebi, Ebu Hanife Numan bin Sabit'e nispet edilmiş bir mezhep olsa da onun görüşlerinin tartışılmaz olduğu bir mezhep değildir. Nitekim Hanefi mezhebinin diğer mezheplerden farklı yönlerinden biri de mezhep içi müçtehit imamların etkisinin daha güçlü olmasıdır. Nitekim Ebu Hanife'nin hem arkadaşı hem de talebesi olan bu fakihlerin büyük katkılarıyla kurulan bu mezhepte mezhep içi müçtehitlerin görüşlerinin baskın olduğu ve kimi zaman kurucusunun görüşlerine tercih edilebildiği görülmektedir. İslam Ceza Hukuku, sosyal hayatın emniyetinin sağlanmasında çok etkin olması sebebiyle, fakihler tarafından çokça mütalaa ve münazara edilmiş hükümlerden oluşmaktadır. Çünkü bu ilim, adalet nizamını sağlama ve dolayısıyla tüm toplumun huzurunu temin etme amacını taşımaktadır. Asırlar boyunca, Müslüman ülkelerde yaşayan fertler arasında, hukuki hakların en isabetli biçimde tecelli etmesini sağlayan ve caydırıcılık unsuruyla bireylerin topluma zarar vermesine engel olmayı hedefleyen bu ilim, mağdurların ya da mağdur ailelerinin yaşadıkları acıları hafifletmeye ve topluma emniyet ortamı tesis etmeye çalışmasıyla büyük önem arz etmektedir. Fıkhın diğer meselelerinde olduğu gibi, İslam Ceza Hukuku da fakihler tarafından kimi meseleleri üzerinde görüş ayrılıklarının meydana geldiği bir ilimdir. Fıkıhta karşılaşılan bu görüş ayrılıkları, farklı görüşleri derlemeye ve delilleriyle tespit etmeye yarayan 'Hilaf' ilmini meydana getirmiş ve hakkında müstakil eserlerin telif edildiği bir ilim olabilmiştir. Fıkhı geliştirmeye yönelik bu çalışmalar neticesinde, var olan ihtilafların temelde; naslarda farklı yorumlamalar, hadislerde değerlendirilme kriterlerinin farklılığı, mantıki çıkarımlarda değişik yaklaşımlar gibi bir takım sebeplere dayandığı görülmüştür. İslam Ceza Hukuku da, doğası gereği hilaf ilmini en çok ilgilendiren konulardan biri olmuştur. Bu tezimizde Hanefi fakihlerin İslam Ceza Hukuku alanındaki görüş ayrılıklarından bahsederek bunları aktarmaya ve sebeplerini tespit etmeye çalıştık. Buna çalışırken klasik Hanefi Fıkhının ve Hilaf İlmine dair eserlerin, meşhur ve detaylı eserlerinden faydalandık ve ceza hukukundaki görüş ayrılıklarını olabildiğince açık bir şekilde anlatmaya gayret ettik."
