abstract: "“İslâm Hukukuna Göre İntihar ve Ötanazi”adlı tez çalışmamız, İslâm hukukuna göre intihar ve ötanazinin durumunun ne olduğunun incelendiği iki ana başlıktan meydana gelmektedir. İlk bölümde intiharın anlamı, sebepleri ve çeşitleri üzerinde durulmuştur. İntiharın önlenebilmesinde önem arz eden bazı kavramlar ele alınmıştır. Canın korunması ilkesi kapsamında İslâm'ın insan hayatına verdiği değere vurgu yapılmıştır. İslâm hukukuna göre intiharın hükmü, ayetler ve hadisler çerçevesinde ortaya konulmuştur. İntihar eden kişinin cenaze namazı hakkındaki hüküm ayrıca ele alınmıştır. Son olarak İslâm'dan önceki semavi dinlerin intihara bakışı incelenmiştir. İkinci bölümde, ötanazi kavramı ve ötanazinin uygulamalardan kaynaklanan çeşitleri ayrı ayrı ele alınmıştır. Çalışmada ötanazi hakkındaki farklı yaklaşımlara yer verilmiştir. Yaşama ve ölme hakkı terimleri, hak kavramı çerçevesinde değerlendirilmiştir. Daha sonra ötanazi uygulamalarında hastanın, hasta yakınlarının ve sağlık personellerinin sorumluluklarına değinilmiştir. İslâm hukukuna göre ötanazinin hukuki durumunun ne olduğu ayetler ve hadisler çerçevesinde ortaya konulmuştur. Çalışmada son olarak İslâm'dan önceki semavi dinlerin ötanaziye yaklaşımları incelenmiştir."
