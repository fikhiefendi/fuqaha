abstract: "Tez, 19'uncu yüzyıl Osmanlı para vakıflarının kredi işlemleri bağlamında günümüz katılım bankacılığı ile karşılaştırmalı bir analizini sunmaktadır. Bilinen bir konunun yeni yöntemlerle ele alınması ve yeni bir alana ışık tutması amacıyla hazırlanmış olan bu tez, para vakıflarının kuruluş şartları, işleyiş felsefesi ve günümüz finansal sistemleriyle olan benzerliklerini ve ayrışan yönlerini tespit etmeyi hedeflemiştir. Tezin odak noktalarından biri, riba, ribh, faiz ve kâr payı kavramlarının analizi ve bu kavramların para vakıfları ile katılım bankacılığı arasındaki ilişkiyi anlamadaki rolüdür. Bu bağlamda, Osmanlı para vakıflarında uygulanan muʻâmele-i şerʻiyye işlemlerinin nedenselliği, ihtiyaç hiyerarşisi çerçevesinde ele alınarak normatif işleyişin pozitif beklentilerle uyumlu olup olmadığı tartışılmıştır. Araştırma kapsamında, 19'uncu yüzyılda kurulmuş olan 280 para vakfının işletme modelleri detaylı bir şekilde incelenmiştir. Bu vakıfların büyük çoğunluğunun kredi işlemlerinde muʻâmele-i şerʻiyye bağlamında irbâh ve istirbâh yöntemlerini kullanmış olmaları bu modellere duyulan ihtiyacın risksiz işlemler olmasından dolayı bu işlemlerin arka planını anlamayı mümkün kılmıştır. Aynı zamanda, katılım bankacılığının fon toplama ve kullandırma süreçlerinde de benzer bir felsefenin mevcut olup olmadığı araştırılmıştır. Elde edilen bulgular, hem para vakıflarının hem de katılım bankacılığının sermayeyi koruma odaklı bir yapıda olduğunu ve bu durumun risksiz kazanç elde etme isteğiyle İslam iktisadında tartışmalı bir alan olan ribâ kavramı arasında bir ilişki kurduğu sonucunu ortaya koymuştur. Ayrıca, normatif kuralların pozitif beklentiler doğrultusunda esnetilmesinin mümkün olduğu kabul edilmekle birlikte bu esnemenin geleneksel İslam hukuku çerçevesinde yapılmasının elzem olduğu vurgulanmıştır."
