abstract: "Günümüz ekonomik sisteminin vazgeçilmezleri arasına giren borsalar modern pazar yerleridir. Kıymetli evrak türünden her türlü ticari emtianın alım-satımı borsalarda yapılmaktadır. Dünyanın önemli borsalarından birisi olan Borsa İstanbul'da tahvil, hazine bonosu, kâr-zarar ortaklığı belgeleri ve hisse senetleri gibi birçok kıymetli evrak işlem görmektedir. Bu belgelerden bir kısmı sadece faizli borç senedi cinsinden gelir sağlayıcı enstrümanlar iken bir kısmı ise ait olduğu şirkete tam bir ortaklık ifade eden kâr-zarar ortaklığı belgeleridir. İslâm hukuku açısından, değerlendirme yapılırken bir yandan bu evrakların hukuki niteliği ve işlevi diğer yandan bunları çıkaran şirketlerin faaliyet alanı göz önünde bulundurulmaktadır. Yüce Allah alışverişi helal, faizi ise haram kılmıştır. Emek ve çaba sarf etmeden, herhangi bir risk üstlenmeden kazanılan para haksız kazanç sayılmışken insanları tembellik ve atalete düşüren ve toplumda üretimi yok eden faiz ise yasaklanmıştır. Bunun yanında üretime yönelik faaliyetler ise teşvik edilmiştir. Zira Borsa İstanbul'da işlem gören kıymetli evrakların bir kısmı direk faiz muamelesi olan tavhil ve bono iken bir kısmı ise ait olduğu şirkete tam bir ortaklık ifade eden hisse senetleridir. İslâm Dini helal olan kazanç yollarını kabul ve teşvik etmiş, insanlar arasında yardımlaşmayı yok eden, aldanma ve aldatmaya dayanan hileli kazanç yollarını ise yasaklamıştır. Klasik kaynaklarımızda en faziletli kazanç yolları olarak sırasıyla ziraat, ticaret ve sanat olarak zikredilmektedir. İnsanlar geçimlerini sağlamak üzere bu alanlardan birinde çalışır ve kazanç elde ederler. Ancak gerek mali gerekse bireysel ihtiyaçlar insanların bir araya gelerek emek ve sermayelerini birleştirmelerini zorunlu kılmaktadır. Bir veya birkaç kişinin altından kalkamayacağı büyüklükteki ortaklıklar birçok insanın bir araya gelmesiyle tesis edilmektedir. İslam hukukunda şirketler hukuku karşılıklı rıza, adalet ve maslahat prensipleri üzerine bina edilmiştir. Bunun yanında aldanma ve aldatma, hile ve yalan, aşırı zarar ya da aşırı kâr ise yasaklanmıştır. Her ne kadar klasik kaynaklarımızda borsayla ilgili bir hüküm mevcut değilse de İslam hukukunun bu temel prensiplerinden hareket ederek borsada işlem gören menkul kıymetler hakkında görüşümüzü ortaya koyacağız. Hukuki olarak Borsa İstanbul'un bir anonim şirket olduğundan hareketle İslam hukukunun şirketlerle ilgili düzenlemelerine göz atacak ve buradan hareketle Borsa İstanbul'u değerlendirmeye çalışacağız."
