abstract: "Osmanlı Devletinin uzun zaman ayakta kalan bir devlet olması bu devletin çok güçlü bir idari, mali ve askeri sisteme sahip olduğunun göstergesidir. Bu nedenle Osmanlı Devleti sistemin en iyi şekilde işleyebilmesi için kayıt tutma arzusunu çok ileri bir düzeye getirmiştir.Şer'iyye Sicilleri bu kayıtların sadece hukuki boyutlu olanıdır. Ancak alınan kararların içeriği tamamıyla Osmanlı Sosyal hayatını aydınlatmak için bize gerekli bilgileri verir.Şer'iyye Sicilleri 15. asrın ortalarından, 20. asrın ilk çeyreğine kadar ki dönemde yargılama ve kamu hizmetlerini yürütme yetkisine sahip olan kadıların vermiş oldukları kararları, tutmuş oldukları zabıtları ve yazışmaları içeren birinci el kaynaklardandır. Bu çalışmamızda Miladi 1926 senesinde Kütahya da meydana gelen hukuki olayları ve bunun sosyal boyutlarını ele almaya çalıştık."
