abstract: "Bu tez, Cessâs'ın Muhtasaru İhtilâfi'l-Ulemâ ve Debûsî'nin el-Esrâr adlı eserlerindeki diyet ve cinayetler bölümünün hilâf ilmi açısından değerlendirilmesini konu edinmektedir. Fıkıh öğrencilerine tartışma yöntemini öğretmesi bakımından hilâf alanında telif edilen eserler fıkıhta önemli bir konuma sahiptirler. Hilâf eserlerinde fukaha, ihtilaf konusu fıkhi meselelere dair görüşlerini izah ederken ileri sürdükleri gerekçelerle kendi zihin haritalarını yansıtarak bizlere değerli bir miras bırakmışlardır. Dört bölümden oluşan bu tezin birinci bölümü, tezimizin konusunu, önemini, yöntemini, kapsamını, literatür bilgisi ve hilaf ilmi hakkında genel bilgileri konu edinmektedir. İkinci bölümde, Muhtasar ve el-Esrâr muhteva ve metot yönünden incelenmiş, eserlerin kaynaklarına değinerek eserlerde görüşlerine yer verilen âlimler hakkında bilgiler verilmiştir. Üçüncü bölümde iki eserde ortak işlenen bazı konular belirlenerek değerlendirilmelere tabi tutulmuştur. Dördüncü bölümde ise çalışmamıza dair ulaştığımız sonuçlara yer verilmiştir."
