abstract: "Katılım bankalarının vizyonu faizsizlik prensibi ilkesinde ticaret yapmaktır. Bu prensibi uygularken bir yandan kar elde etmek, diğer yandan da büyümek için çaba göstermektedirler. Modern açıdan incelendiğinde katılım bankalarının uzun bir geçmişi olsa da ülkemizde doğusu, harekete geçmesi Dünya'daki Katılım Bankacılığı'nın gelişim seyrine denk gelmektedir. Bu sebeple kendini geliştirmekte ve yoğun rekabet ortamında olan Katılım Bankaları, her finansal kuruluşun büyüme aşamasında ihtiyacı olan rakiplerinden farklılaşacak, müşterilerinin gözünde anlamlaşarak bilinirlik sağlayacak marka imajı oluşturmak zorundadır. Marka imajını oluştururken de en büyük destekçisi olan reklam faaliyetlerini ön plana çıkarmalıdır. Bu çalışmam da Katılım Bankaları'nın Ülkemiz Finans sektörü içinde ne kadar bilinilir olduğu ve bilinirliği sağlama yolunda marka ismi oluştururken nasıl reklam faaliyetleri izlemesi gerektiği hususu üzerinde durulmaktadır. Çalışma 4 Bölümden oluşmaktadır. İlk bölüm de markanın tanımı ve bilinirlik kavramlarından, İkinci bölümde reklam'ın tanımı günümüze uzanışı, fonksiyonları ve marka bilinirliğini sağlamadaki etkilerinden bahsedilmektedir. Üçüncü bölüm de de Katılım Bankalarının tanımı, Ülkemizde Bankacılık sektörü içindeki payı, Finans sektörünün Sosyal medyadaki yeri ve Katılım Bankaları'nın Finans sektörü içindeki payı üzerinde durulmaktadır. Son Bölüm olan 4.bölümde de Marka ve Reklamın bilinirliğinin tespit edilmesi amaçlı düzenlenen anket çalışmasının verilerinin analizi ve yorumlanması çalışması yapılmıştır. Çalışmanın istatiksel analizlerinde SPSS Statics 20 paket programı kullanılmıştır."
