abstract: "İslami temellere riayet etmek isteyen yatırımcılar ve mülk sahipleri için en uygun faizsiz kazanç sağlayan saha İslami finanstır. İslami finansı oluşturan en temel araç ise 2002 yılında Malezya hükümeti tarafından İslami bankaların varlık yönetimini kolaylaştırmak amacıyla ihraç edilen, günümüzde ismi Kira Sertifikası olarak bilinen ve faizsiz tahvil ve bono olarak nitelendirilen Sukuk'tur. AAOIFI tarafından Sukuk 'dayanak teşkil eden bir varlık sepetinde yer alan varlıklar üzerindeki ortak mülkiyeti temsil eden eşit değerdeki sertifikalar' olarak tanımlanmıştır. Sukuk'u diğerlerinden ayıran en temel özellik, gerçek bir varlığa dayanıyor olup varlığın faizsiz kazancından tasarruf sahiplerine pay veriyor olması; dolayısıyla faizle elde edilen bir gelir çeşidinin ve belirsiz bir kazancın bulunmuyor olmasıdır. Bu çalışma, İslami finansın en önemli enstrümanlarından olan Sukuk'un tanımından, diğer yatırım araçlarından farkından, bileşenlerinden, küresel piyasalardaki yerinden, çeşitlerinden, faydalarından ve Türkiye ve Dünyadaki yerinden bahsetmektedir. Bunun yanı sıra çalışmanın temelinde güdülen amaç, Sukuk'un dayandığı İslami Bankacılık prensibi ve içerikleriyle beraber Sukuk'un kıymetli evrak olarak işlem görmesinin kurucusu olan Malezya ülkesinin ihraçların başladığı günden bu yana gelişimini nitel ve nicel olarak incelemektir. Sonuç olarak İslami ülkeler için önem taşıyan Sukuk'un ve faizsiz kazancın bu işi yalnızca yatırım amacıyla yapan ve bu piyasayı geliştiren ülkelerin yanı sıra, sistemi özellikle inanç esasına dayalı olarak kullanmak isteyen İslam ülkelerinde de faizsiz kazanç bilincinin yerleştirilmesi gerektiğine ve Türkiye'nin de bu bilinçle sukuk ihracı konusundaki yetersizliklerini aşması gerektiği konusuna değinilmiştir."
