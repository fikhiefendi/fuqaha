abstract: "Bu çalışma, yaşam hakkının Osmanlı Hukuku'ndaki durumunu izaha çalışmaktadır. Çalışmanın konusunu, ilgili dönemi kapsayacak şekilde, yaşam hakkının Osmanlı Devleti'ndeki görünümü oluşturmuştur. Çalışmanın amacı, en temel insan hakkı kabul edilen söz konusu hakkın Türk hukuk tarihinde mevcut olup olmadığını, mevcutsa nasıl korunduğunu ve ne şekilde sınırlandırıldığını irdelemektir. Çalışmada öncelikle yaşam hakkının kapsamının belirlenmesi bakımından ulusal ve uluslararası öğretideki ilgili kaynaklarından, akabinde de Osmanlı kanunnamelerinden, Osmanlı hukukunun kaynaklarından olan İslam hukuku kitaplarından, fetva kitaplarından ve Osmanlı Devleti'nin mahkeme kayıtları niteliğinde olan kadı sicillerinden yararlanılmıştır. Bu bağlamda giriş kısmında çalışmanın amacı, kullanılan yöntem ve bazı temel kavramlar ayrıntılı şekilde izah edilmiştir. Birinci bölümde yaşam hakkına ilişkin temel kavramlar, ikinci bölümde hakkın korunması ve üçüncü bölümde de sınırlandırılmasına ilişkin hususlara değinilmiştir. Çalışmada, yaşam hakkının Osmanlı Devleti'nde de mevcut ve hukuken koruma altına alınmış bir hak olduğu sonucuna ulaşılmıştır. Ulaşılan sonuçlardan bir diğeri ise bu hakkın günümüzde olduğu gibi Osmanlı'da da ölüm cezası ve devletin isyan benzeri olaylara müdahalesi gibi çeşitli faktörlerle sınırlandırılmış olduğudur. Çalışma, konusu ve konunun ele alınış tarzı bakımından özgün bir karakter taşımaktadır."
