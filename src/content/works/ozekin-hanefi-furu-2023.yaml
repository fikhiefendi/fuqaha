abstract: "Örf, İslam hukuku kaynaklarından biridir. Çalışmada Sadrüşşehîd'in el-Vâḳıʿât eserinin İcâre Kitabı çerçevesinde Hanefi mezhebinde bu kaynağa nasıl itibar edildiği incelenmiş, örfün geçirdiği serüven ortaya konulmuştur. Böylece örfün geriye dönük temellendirilmesi yapılmıştır. Örfün kimi zaman değişmeden varlığını sürdürdüğü kimi zamansa farklılaştığı bu sebeple fetvalarda değişikliğe gidildiği görülmüştür. Böylece mezhep düşüncesinin, görüşlerin değil, mezhebin genel prensiplerinin sürdürülmesi anlamını taşıdığı misaller üzerinden teyit edilmiştir. Nitekim bizzat zâhirü'r-rivâye eserlerindeki görüşlerin ya da genel kural anlamındaki kıyasın terk edilmesi meşâyihin mezhebe müntesipliğine engel olmamış aksine mezhebin devamlılığını sağlayan unsur olmuştur. Hatta meşâyihin örfe dayanan görüşlerinin doktrine girdiği görülmüştür. Tezde örfün geçirdiği serüvenin aktarılması kadar örfle ilişkili meselelerin ifade edilişinde izlenen sürecin yansıtılması hedeflenmiştir. Buna ek olarak çalışmada örfün her durumda aynı hiyerarşi ve fonksiyonda dikkate alınmadığının gösterilmesi amaçlanmıştır. Çalışmayı önemli kıldığını düşündüğümüz nokta örfün -elimize ulaşan- ilk nevâzil eserleri çerçevesinde ortaya koyulmuş olması ve geriye yönelik temellendirmesidir. Buna ilaveten meselelerde örfün dikkate alınıp alınmadığını belirtmekle yetinmeyip örfün ne bakımdan tesir ettiğini ortaya koymuş olmasıdır. Farklı bir ifadeyle hüküm boşluklarını doldururken mi örfe itibar edildiği yoksa istihsanın veçhi olarak mı esas alındığı ortaya koyulmuştur. Eğer istihsanın veçhi olarak ele alınmışsa bu durumda kendi içinde ayrıca tasnife tabi tutulmuştur. Bu tasnif; nassın umûmunun tahsis edilmesi, zâhirü'r-rivâye eserlerindeki görüşe kıyasen verilecek fetvanın terk edilmesi ya da genel kural anlamındaki kıyasın terk edilmesi şeklindedir."
